services:
  llama-server:
    image: whitt-execution-engine/llama-server:latest
    container_name: whitt-llama-server
    restart: unless-stopped
    volumes:
      - ./config.yml:/config/config.yml:ro
      - ./models:/models:ro
      - ./logs:/var/log/llama-server
    ports:
      - "127.0.0.1:8080:8080"
    network_mode: host
    shm_size: 8g
    user: "1000:1000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/props"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  models:
    driver: local
  logs:
    driver: local

networks:
  default:
    name: whitt-network
