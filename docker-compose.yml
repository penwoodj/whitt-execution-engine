services:
  llama-server:
    image: whitt-execution-engine/llama-server:latest
    container_name: whitt-llama-server
    restart: unless-stopped
    volumes:
      - ./config.yml:/config/config.yml:ro
      - ./models:/models
      - ./logs:/var/log/llama-server
      - /usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    network_mode: host
    shm_size: 8g
    user: "1001:1001"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /tmp/hf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/props"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  models:
    driver: local
  logs:
    driver: local

networks:
  default:
    name: whitt-network
