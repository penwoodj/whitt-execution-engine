workflow_id: benchmark_3_models
name: "3-Model GPU/CPU Benchmark Suite"
description: "GPU vs CPU performance benchmark of 3 diverse models"
min_schema_version: "2.0.0"

models:
  primary:
    provider: lmstudio
    model: "${benchmark.current_model}"

workflow_execution_strategy:
  load_unload: one_at_a_time
  memory:
    ram_allocation:
      strategy: dynamic
      max_allowed:
        ram: 8192MB
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  # Step 1: Benchmark each model in GPU then CPU mode
  - step: benchmark_performance
    id: perf_bench
    loop:
      count:
        max_iterations: 3
        iteration_variable: current_model
      modes: [gpu, cpu]
      mode_variable: gpu_mode
    input:
      prompts:
        - "Explain concept of recursion in programming, with a practical example."
        - "Write a Rust function that finds longest increasing subsequence in a vector."
        - "Analyze tradeoffs between microservices and monolithic architectures."
      max_tokens: 128
      gpu_mode: "{{loop.gpu_mode}}"
      n_gpu_layers: "{{loop.gpu_mode == 'gpu' ? 999 : 0}}"
    when:
      before_step_starts:
        action: configure_server
        gpu_mode: "{{loop.gpu_mode}}"
      after_step_succeeds:
        append_to:
          - "./workspace/output/benchmark_results.yaml"
          - benchmark_collection
      after_loop_iteration_fails:
        log:
          to_file_path: "./workspace/logs/benchmark-errors.log"
          event_fields: [iteration, current_model, gpu_mode, error_message]
    output:
      save_to: benchmark_results

  # Step 2: Agentic document refinement per model
  - step: refine_document
    id: doc_refine
    generative_entity: "${models.primary}"
    requires: [perf_bench]
    loop:
      count:
        max_iterations: 3
        iteration_variable: current_model
    input:
      file_path: "./docs/plans/multi-model-benchmark/01-IMPLEMENTATION-PLAN.md"
      chunk_size: 4000
      oscillations: 3
      overlap: 200
    prompts:
      summarize: |
        Summarize the following text, extracting key technical points.
        Keep: numbers, paths, function names, struct fields, error messages.
        Drop: filler, hedging, repetition, transitions.
        Target: 2000 chars max.

        Text:
        {{loop.previous_output}}
      expand: |
        Expand on this summary by adding implementation detail, edge cases,
        and performance considerations a senior engineer would expect.
        Keep all existing technical facts. Target: 3000 chars max.

        Summary:
        {{loop.previous_output}}
    output:
      save_to: refined_plans
      format: text
      path: "./workspace/output/refined_plan_{{loop.current_model}}.md"

  # Step 3: Generate speedup comparison report
  - step: generate_speedup_report
    id: speedup_report
    requires: [perf_bench]
    input:
      benchmark_results: "{{step.perf_bench.output}}"
      comparison_mode: gpu_vs_cpu
    output:
      save_to:
        - speedup_report
        - "./workspace/output/speedup_report.json"

  # Step 4: Generate combined report
  - step: generate_report
    id: report
    requires: [perf_bench, doc_refine, speedup_report]
    input:
      benchmark_results: "{{step.perf_bench.output}}"
      refined_plans: "{{step.doc_refine.output}}"
      speedup_data: "{{step.speedup_report.output}}"
    output:
      save_to:
        - final_report
        - "./workspace/output/benchmark_report.json"

