# Test fixture: GWT expression language — complex expressions
# GIVEN workflow steps with complex GWT expressions
# WHEN the expression evaluator processes them
# THEN correct routing decisions are made

workflow_name: "GWT Expression Language Test"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: "localhost"
      port: 8080
    hosting:
      gpu_layers: 0

models:
  "test-model":
    name: "Test Model"
    host:
      type: llama_cpp_with_vulkan
    execution:
      max_tokens: 50

steps:
  # GIVEN comparison operators
  comparison_test:
    generative_entity: control_flow
    when:
      gwt:
        - given: "score >= 0.9"
          then: { route_to: pass }
        - given: "score >= 0.7 && score < 0.9"
          then: { route_to: warning }
        - given: "score < 0.7"
          then: { route_to: fail }

  # GIVEN logical operators: AND, OR, NOT
  logical_test:
    generative_entity: control_flow
    when:
      gwt:
        - given: "is_valid == true && has_warnings == false"
          then: { route_to: pass }
        - given: "is_valid == true || is_force == true"
          then: { route_to: warning }
        - given: "!(is_valid == true)"
          then: { route_to: fail }

  # GIVEN dot-path nested field access
  nested_field_test:
    generative_entity: control_flow
    when:
      gwt:
        - given: "error.is_retryable == true && error.code != 500"
          then: { route_to: retry }
        - given: "result.config_loaded == true"
          then: { route_to: next_step }

  # GIVEN arithmetic expressions
  arithmetic_test:
    generative_entity: control_flow
    when:
      gwt:
        - given: "token_count * 2 > 1000"
          then: { route_to: truncate }
        - given: "total / count >= 0.5"
          then: { route_to: pass }

  # GIVEN string comparisons
  string_test:
    generative_entity: control_flow
    when:
      gwt:
        - given: "status == \"completed\""
          then: { route_to: done }
        - given: "status != \"pending\""
          then: { route_to: in_progress }

  # GIVEN boolean literal
  boolean_literal_test:
    generative_entity: control_flow
    when:
      gwt:
        - given: "true"
          then: { route_to: fallback }

  pass:
    generative_entity: agent
    prompt: "Quality passed"

  warning:
    generative_entity: agent
    prompt: "Quality warning"

  fail:
    generative_entity: agent
    prompt: "Quality failed"

  retry:
    generative_entity: agent
    prompt: "Retry"

  next_step:
    generative_entity: agent
    prompt: "Continue"

  truncate:
    generative_entity: agent
    prompt: "Truncate output"

  done:
    generative_entity: agent
    prompt: "Completed"

  in_progress:
    generative_entity: agent
    prompt: "In progress"

  fallback:
    generative_entity: agent
    prompt: "Fallback action"
