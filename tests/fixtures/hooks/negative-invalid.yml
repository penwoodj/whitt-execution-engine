# Test fixture: Negative test cases — malformed hooks
# GIVEN workflow YAMLs with various invalid hook configurations
# WHEN the engine validates them
# THEN appropriate validation errors are returned

# NOTE: This file intentionally contains INVALID configurations for negative testing.
# It should NOT parse successfully or should produce validation errors.

workflow_name: "Negative Hook Tests"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: "localhost"
      port: 8080
    hosting:
      gpu_layers: 0

models:
  "test-model":
    name: "Test Model"
    host:
      type: llama_cpp_with_vulkan
    execution:
      max_tokens: 50

steps:
  # GIVEN a step with empty log action (missing required fields)
  empty_log:
    generative_entity: agent
    prompt: "Step with empty log"
    when:
      after_step_succeeds:
        log:
          to_file_path: ""
          event_fields: []

  # GIVEN a step with invalid GWT expression (malformed)
  invalid_gwt:
    generative_entity: control_flow
    when:
      gwt:
        - given: "!!! invalid syntax !!!"
          then: { route_to: nonexistent_step }

  # GIVEN a step with route_to pointing to nonexistent step
  invalid_route:
    generative_entity: control_flow
    when:
      gwt:
        - given: "true"
          then: { route_to: this_step_does_not_exist }

  # GIVEN a step with unknown action type
  unknown_action:
    generative_entity: agent
    prompt: "Step with unknown action"
    when:
      after_step_succeeds:
        completely_unknown_action: "this should fail validation"

  # GIVEN a step with fail action but no message
  fail_no_message:
    generative_entity: agent
    prompt: "Step that fails without message"
    when:
      after_step_starts:
        fail: ""
