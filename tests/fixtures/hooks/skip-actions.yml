# Test fixture: Skip action variants
# GIVEN a workflow with skip_step, skip_loop, skip_remaining actions
# WHEN hooks trigger these actions
# THEN execution flow is controlled correctly

workflow_name: "Hook Skip Actions Test"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: "localhost"
      port: 8080
    hosting:
      gpu_layers: 0

models:
  "test-model":
    name: "Test Model"
    host:
      type: llama_cpp_with_vulkan
    execution:
      max_tokens: 50

steps:
  step_with_skip_step:
    generative_entity: agent
    prompt: "This step should be skipped"
    when:
      after_step_starts:
        skip_step: true

  step_with_skip_remaining:
    generative_entity: agent
    prompt: "Skip all remaining"
    when:
      after_step_succeeds:
        - skip_remaining: true
        - log:
            to_file_path: "./workspace/logs/skip-remaining.log"
            event_fields: [step_name]

  conditional_skip:
    generative_entity: control_flow
    when:
      gwt:
        - given: "should_skip == true"
          then: { skip_step: true }
        - given: "should_skip == false"
          then: { route_to: next_step }

  next_step:
    generative_entity: agent
    prompt: "Runs if not skipped"

  loop_with_skip:
    generative_entity: agent
    prompt: "Loop iteration"
    loop:
      count:
        max_iterations: 5
        iteration_variable: "i"
    when:
      after_step_succeeds:
        gwt:
          - given: "i >= 3"
            then: { skip_loop: true }
