case_id: flg-03-da-ana-a-f2
meta:
  domain: data-analysis
  archetype: analyze-evaluate
  complexity: A
  class: F2
  source: case-matrix row 13 (da-ana-a-f2)
  words_prompt: ~1180
task:
  prompt: |
    You are the on-call data analyst for the "Aurora" mobile app. Every Monday the growth team
    receives a retention cohort report generated by a legacy Perl pipeline that is being
    decommissioned. Your job this cycle is to produce the replacement artifact: a cohort
    retention report from the raw weekly extract below, evaluated against the checks the growth
    team actually runs before trusting any number. The artifact feeds an automated dashboard —
    if your JSON is malformed or misses keys, the dashboard renders an outage page and pages the
    on-call engineer. That happened twice last quarter; leadership now treats format violations
    as a severity-two incident.

    RAW WEEKLY EXTRACT (Aurora app, week 2026-W34, new-user cohorts):
    - Cohort day-0 (2026-08-17 registrations): 18,432 new users; 15,972 completed onboarding;
      9,304 reached "activated" state (completed first core action); 4,112 enabled push.
    - Cohort day-0 (2026-08-18 registrations): 17,981 new users; 15,403 completed onboarding;
      8,982 activated; 3,907 enabled push.
    - Cohort day-0 (2026-08-19 registrations): 19,105 new users; 16,558 completed onboarding;
      9,770 activated; 4,250 enabled push.
    - Cohort day-0 (2026-08-20 registrations): 16,240 new users; 14,011 completed onboarding;
      8,203 activated; 3,612 enabled push.
    - Cohort day-0 (2026-08-21 registrations): 21,882 new users; 18,899 completed onboarding;
      11,019 activated; 4,855 enabled push.
    - Cohort day-0 (2026-08-22 registrations): 24,507 new users; 21,014 completed onboarding;
      12,061 activated; 5,481 enabled push.
    - Cohort day-0 (2026-08-23 registrations): 23,318 new users; 20,089 completed onboarding;
      11,540 activated; 5,102 enabled push.
    - Prior week total (2026-W33) for comparison: 131,477 new users; 110,594 onboarding
      completions; 66,273 activations; 28,941 push enables.
    - Known instrumentation notes: 2026-08-20 had a 41-minute event-ingest outage from 14:02 to
      14:43 UTC, affecting roughly 3% of that day's events (undercount). The push-enable event
      double-fires on Android client 4.2.0 through 4.2.2, inflating push counts by an estimated
      5-8% until the fix shipped 2026-08-22.

    DAY-7 RETURN VISITS (same cohorts, measured 2026-08-24, for the retention dimension the
    legacy report always carried): of the 2026-08-17 cohort, 6,463 users returned on day 7; of
    the 2026-08-18 cohort, 6,193 returned; of the 2026-08-19 cohort, 6,829 returned; of the
    2026-08-20 cohort, 5,414 returned; of the 2026-08-21 cohort, 7,891 returned. The 2026-08-22
    and 2026-08-23 cohorts have not reached day 7 yet and must appear with null day-7 values
    and a note field explaining the null rather than being omitted or zero-filled. Prior week
    W33 day-7 return rate for comparison: 0.3421.

    GROWTH TEAM CHECKS (what the report must satisfy to be trusted):
    - Cohort onboarding rate = onboarding / new users, per day, as decimal to 4 places.
    - Activation rate = activated / new users, per day, decimal to 4 places.
    - Push enable rate = push enables / new users, per day, decimal to 4 places.
    - Day-7 return rate = returned / new users, per day where measurable, decimal to 4 places.
    - Weekly rollups: totals and rates for the whole week, alongside week-over-week deltas for
      new users, onboarding rate, activation rate, and day-7 return rate, expressed as
      percentages with sign.
    - Anomaly detection: flag any day whose activation rate deviates more than 1.5 percentage
      points from the weekly mean, with a plausible cause drawn from the instrumentation notes
      when one exists, and the word "none-known" when it does not. Apply the same rule to day-7
      return rates for the days where it is measurable.
    - Data quality section must carry the two known issues (ingest outage window and Android
      double-fire) with their affected scopes, so downstream users can discount accordingly,
      plus an entry for the day-7 truncation itself.

    ARITHMETIC AUDIT TRAIL REQUIREMENT. Each cohort_stats entry must include a computations
    sub-object showing the numerator and denominator used for each rate on that day, and the
    weekly rollup must do the same. This exists because two incidents ago the root cause was a
    silent denominator swap between activation and onboarding. The audit trail is checked by
    the same parser that renders the dashboard: numerators and denominators must match the
    extract above exactly, and the reported rate must equal numerator divided by denominator
    rounded to 4 places. If a rate cannot be computed because a field is null, the
    computations sub-object must say so explicitly rather than omitting keys.

    RECONCILIATION CHECK. Before writing the verdict, reconcile your weekly totals against the
    prior-week extract: the sum of daily new users, onboarding completions, and activations
    must each be stated, and the week-over-week delta must be computed from those sums, not
    from averaging daily rates. State the three sums explicitly in the weekly rollup. The
    growth team rejects reports where the delta appears to be computed off daily-rate averages;
    that is the most common legacy-pipeline error and the reason it is being decommissioned.

    YOUR TASK: produce the cohort retention report as one JSON object with top-level keys:
    report_id (use "aurora-retention-2026-W34"), cohort_stats (array, one entry per day with
    date, new_users, onboarding_rate, activation_rate, push_enable_rate, day7_return_rate,
    and the computations sub-object), anomalies (array as specified above), verdict (string:
    "ship" if no anomaly exceeds 2.5 points and data quality issues are documented, else
    "hold"), data_quality (object with the known issues including day-7 truncation). Compute
    every rate yourself from the raw numbers; do not echo raw counts without deriving the
    rates. Where the extract undercounts due to the outage, still report the observed value
    but annotate that day's entry with "affected_by": "ingest-outage-2026-08-20".

    OUTPUT CONTRACT: single JSON object, first character "{", last character "}", no markdown
    fences, no prose outside the JSON, all rates as decimals rounded to 4 places, all percentages
    with explicit sign for deltas, dates in ISO 8601, null day-7 values as JSON null with the
    note field present. The dashboard parser hard-fails on missing keys, on rates expressed as
    percentages where decimals are expected, and on any array entry missing its required fields.
    There is no partial credit: the artifact either parses and passes field validation or it
    is an outage.

    QUALITY BAR: the growth lead will spot-check two rates by hand and one anomaly judgement.
    Your arithmetic must be exactly reproducible from the extract above, and every judgement
    must cite which instrumentation note (or absence of one) it rests on. The lead will also
    verify that the week-over-week delta comes from summed numerators, per the reconciliation
    check, and that unmeasured day-7 cells are null-with-note rather than absent.
  expected_schema:
    type: object
    required:
      - report_id
      - cohort_stats
      - anomalies
      - verdict
      - data_quality
    properties:
      report_id: { type: string }
      cohort_stats: { type: array }
      anomalies: { type: array }
      verdict: { type: string }
      data_quality: { type: object }
  output_contract: |
    Single JSON object. Rates decimals to 4 places; deltas signed
    percentages; null day-7 with note. Parser hard-fails on any
    missing required field.
failure:
  class: F2
  injection_profile:
    attempts_failed: [1]
    notes: |
      F2 schema/format failure on attempt 1: output nests everything
      under a single "report" wrapper key, omits push_enable_rate
      and data_quality entirely, and expresses the week-over-week
      delta as an unsigned bare number. Parser-equivalent checks
      count 2 tool errors. tool_reselect heal (worker_coder,
      contract re-read) on attempt 2 emits the flat five-key
      object with correct formats and passes.
  signals: [schema_missing_keys, schema_nested_wrong, tool_error]
expected:
  final: accept
  path: [attempt, classify, heal_tool_reselect, attempt, classify, judge_gate, accept, report]
  attempts_to_success: 2
oracle:
  llm_calls:
    worker: 2
    heavy: 0
    judge: 0
  gate_flags: { need_replan: false, need_judge: false, budget_exhausted: false }
budget:
  llm_call_ceiling: 6
