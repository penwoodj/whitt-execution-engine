case_id: flg-08-lc-pld-b-f3
meta:
  domain: legal-compliance
  archetype: plan-decompose
  complexity: B
  class: F3
  source: case-matrix row 64 (lc-pld-b-f3)
  words_prompt: ~1080
task:
  prompt: |
    You are the compliance automation lead at a mid-sized financial
    services firm preparing for the expansion of your payments product
    into three new markets: Brazil, Kenya, and Poland. The expansion
    requires a data protection compliance program that satisfies each
    jurisdiction's framework while integrating with the firm's existing
    group-level program. Your task is to produce a detailed planning
    document that decomposes this multi-jurisdiction compliance rollout
    into a phased, resourced, and sequenced plan that a program manager
    could execute against without further clarification meetings.

    The deliverable is a single structured document containing, in this
    order: a stakeholder and accountability map; a jurisdiction-by-
    jurisdiction requirements analysis; a gap analysis against the
    group's current program; a phased workstream decomposition with
    dependencies; a risk register with mitigations; and a decision log
    template pre-seeded with the open decisions this plan identifies.
    Each section has specific content requirements described below.

    For the stakeholder map: identify every internal role that must be
    accountable, consulted, or informed across legal, product,
    engineering, security, operations, and executive functions, and for
    each role state the decisions it owns and the artifacts it must
    review. Include the external parties the program depends on: local
    counsel in each market, the data protection authorities, and any
    certification or registration bodies, with the interaction cadence
    and the trigger events for each relationship.

    For the jurisdiction analysis: for each of Brazil, Kenya, and
    Poland, cover the applicable data protection framework's territorial
    scope and how it applies to your payment flows; the lawful basis
    options relevant to fraud prevention and payment processing;
    cross-border transfer mechanisms available for the data flows back
    to the group's primary processing region; data subject rights
    handling requirements including response windows and any local
    exceptions for financial records; breach notification timelines and
    authorities; and any registration, appointment, or filing
    obligations, including the appointment of local representatives
    where required. State explicitly where the three regimes conflict
    with each other or with the group program, because those conflicts
    drive the sequencing in later sections.

    For the gap analysis: the group program today provides a generic
    records-of-processing inventory, an incident response runbook, a
    cookie and tracking consent manager built for the group's web
    properties, and standard vendor due diligence questionnaires.
    Evaluate each existing asset against each jurisdiction's
    requirements and classify the gaps as configure, extend, or build
    anew, with the estimated effort band for each and the consequence
    of leaving the gap unaddressed at launch.

    For the workstream decomposition: produce phases with entry and
    exit criteria, and within each phase the concrete workstreams, each
    carrying an owner role drawn from the stakeholder map, the
    artifacts it produces, the dependencies on other workstreams, and
    the jurisdictions it covers. The decomposition must reflect the
    political reality that engineering capacity is shared with a
    platform migration that occupies the same two quarters, so legal
    and process workstreams must front-run engineering workstreams
    wherever possible. Call out the critical path explicitly and
    identify which dependencies are hard, meaning they cannot be
    parallelized even with more budget, and which are soft.

    For the risk register: at minimum twelve distinct risks spanning
    regulatory, delivery, dependency, and reputational categories, each
    with likelihood and impact ratings on a defined scale, an owner, a
    mitigation, and an early warning indicator that operations can
    monitor. At least one risk must address the scenario where a local
    regulator changes guidance mid-program, and at least one must
    address third-party processor failures in-market.

    For the decision log template: define the fields, the escalation
    path, and the review cadence, and pre-seed it with the open
    decisions the plan surfaces, such as whether to appoint distinct
    local representatives per market or a single regional one, and
    whether the consent architecture extends or is forked per market.

    DEFINITIONS AND SCALES (binding on the document). Effort bands are
    defined as: band one, under two weeks of one analyst; band two,
    two to six weeks of one analyst or equivalent; band three, more
    than six weeks or requiring engineering involvement beyond
    configuration. Likelihood and impact ratings use a three-point
    scale — low, medium, high — and the document must define what each
    rating means operationally before using them, so that two readers
    score the same risk the same way. The RACI vocabulary for the
    stakeholder map is the standard one: responsible, accountable,
    consulted, informed, with exactly one accountable party per
    artifact. Milestone calendar constraints: the plan must anchor its
    phases to a week-numbered calendar starting the first Monday after
    document approval, must show the three market launches as fixed
    milestones with their commercial dates, and must mark every other
    date as derived and movable, with the critical path recomputed if
    any derived date slips by more than five business days.

    DOCUMENT CONVENTIONS (binding). The document must open with a
    one-page executive summary that states the three open decisions
    the plan surfaces, the launch sequence, and the single largest
    risk, so the DPO can absorb the shape of the program without
    reading the body. Every section must carry an owner from the
    stakeholder map and a review cadence. Tables must not span pages
    in ways that detach headers; anything longer than fifteen rows
    must be split by jurisdiction or category. All dates use ISO 8601;
    all effort figures use the bands above, never raw hours; all
    cross-references use section numbers, not page numbers.

    Constraints on the plan: no additional headcount beyond two analyst
    requisitions already approved; launch windows are fixed by
    commercial commitments, with Brazil first, then Kenya ninety days
    later, then Poland one hundred eighty days after Brazil; and any
    workstream that cannot complete before its market's launch must
    carry a documented compensating control. The document must be
    explicit about every assumption it makes about the current state,
    and must not silently invent group policies; where the current
    state is unknown, the plan must include a discovery task rather
    than an assumption.

    Write for an audience of a program manager and the group data
    protection officer simultaneously. Prefer tables and structured
    lists over prose paragraphs for anything that will be tracked.
    The document is the plan of record; completeness beats elegance.
  expected_schema:
    type: object
    required:
      - stakeholder_map
      - jurisdiction_analysis
      - gap_analysis
      - workstream_decomposition
      - risk_register
      - decision_log
    properties:
      stakeholder_map: { type: string }
      jurisdiction_analysis: { type: string }
      gap_analysis: { type: string }
      workstream_decomposition: { type: string }
      risk_register: { type: string }
      decision_log: { type: string }
  output_contract: |
    JSON object, one key per section, values as strings containing
    structured Markdown tables or lists.
failure:
  class: F3
  injection_profile:
    attempts_failed: [1]
    notes: |
      F3 logical-consistency failure on attempt 1: internal
      contradictions across sections — workstream decomposition
      sequences Poland legal workstreams before the Brazil launch
      dependencies they rely on, the risk register rates third-party
      processor failure as high-likelihood while the gap analysis
      asserts vendor due diligence is complete, and the decision log
      pre-seeds the representative appointment decision as already
      made while the jurisdiction analysis lists it as open.
      detect catches contradiction markers; replan heal (heavy model)
      on attempt 2 produces a coherent, dependency-consistent plan.
  signals: [contradiction_markers, cross_section_inconsistency]
expected:
  final: accept
  path: [attempt, classify, heal_replan, attempt, classify, accept, report]
  attempts_to_success: 2
oracle:
  llm_calls:
    worker: 1
    heavy: 1
    judge: 0
  gate_flags: { need_replan: true, need_judge: false, budget_exhausted: false }
