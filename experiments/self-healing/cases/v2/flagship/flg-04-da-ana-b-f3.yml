case_id: flg-04-da-ana-b-f3
meta:
  domain: data-analysis
  archetype: analyze-evaluate
  complexity: B
  class: F3
  source: case-matrix row 14 (da-ana-b-f3)
  words_prompt: ~1170
task:
  prompt: |
    You are the reliability analyst for the "Meridian" storage platform, responsible for the
    quarterly capacity and SLA assessment that determines where the platform team invests next
    quarter. This assessment is high-stakes: last quarter's version contained a contradiction —
    it declared a storage tier "compliant" in one section while its own numbers showed a breach —
    and the incident cost the team a week of re-review. The VP now requires that every section
    cross-validate: no statement anywhere in the artifact may conflict with any numeric table,
    and every verdict must be recomputable from the raw measurements. Your output will be fed
    through a consistency checker that extracts all numeric claims and fails the document if any
    pair of claims about the same quantity disagrees.

    PLATFORM TOPOLOGY AND RAW MEASUREMENTS (2026-Q3):
    - Tier A (hot object storage): 42 nodes, measured aggregate throughput 18.4 GB/s sustained,
      design capacity 21.0 GB/s, headroom therefore 12.4%. Monthly availability last three
      months: 99.97%, 99.95%, 99.91%. SLA commitment: 99.95% monthly, measured per calendar
      month. Storage utilization: 71% of 8.1 PB usable.
    - Tier B (warm archive): 60 nodes, throughput 6.2 GB/s sustained against 11.4 GB/s design.
      Availability: 99.99%, 99.98%, 99.99%. SLA 99.90%. Utilization 58% of 22 PB.
    - Tier C (cold deep archive): 18 nodes, throughput 0.4 GB/s against 1.1 GB/s design.
      Availability trailing three months: 99.72%, 99.44%, 99.68%. SLA 99.50%. Utilization 43%
      of 61 PB. Known issue: a firmware bug on the 2023-era controller batch reboots nodes
      under a specific metadata scan pattern; fix scheduled next quarter, affecting an estimated
      30% of Tier C nodes.
    - Cross-tier replication: Tier A replicates synchronously to Tier B within region; RPO 0
      for objects larger than 1 MB, RPO 15 minutes for smaller objects (async batching).
      Measured async lag p50 40 seconds, p99 11 minutes, max last quarter 14.5 minutes.
    - Frontend gateway: 12 nodes, p99 latency 84 ms against internal target 150 ms; error
      budget consumed 61% of quarterly allocation at week 9 of 13.

    CAPACITY AND COST DIMENSIONS (new this quarter, required by finance):
    - Demand growth: Tier A traffic grew 9% quarter-over-quarter the last two quarters; Tier B
      grew 4%; Tier C ingest grew 12% driven by a compliance retention change.
    - Node economics: a Tier A node refresh costs 3.1x a Tier C node; lead time 10 weeks for
      A-class hardware, 4 weeks for C-class. Fiscal rule: any recommendation committing spend
      must state its quarter-of-effect given lead times, and must not silently assume next-day
      capacity.
    - Utilization guardrails: platform policy flags any tier whose utilization crosses 75% for
      two consecutive months, or whose headroom falls below 10%, as capacity-triggered. At the
      stated growth rates, compute when Tier A hits each trigger; state the arithmetic in the
      rationale. The same extrapolation discipline applies to any other tier you assess.

    MAINTENANCE AND DEPENDENCY CONTEXT:
    - Shared metadata service: Tier A and Tier C both depend on it; it consumed 22% of its
      own error budget at week 9. A metadata service degradation shows up as elevated latency
      on A and as failed scans on C, so the breach-risk section must not treat tier risks as
      fully independent.
    - Planned maintenance next quarter: Tier B rolling firmware, expected to cost 0.02%
      availability per month during the rollout window.
    - The firmware fix on Tier C requires a full node-by-node rollout across the affected
      30%, scheduled across six weeks; during each node's reboot its traffic fails over, which
      historically costs 0.05% monthly availability per affected wave.

    STAKEHOLDER CONSTRAINTS AND HISTORY:
    - The SLA table must express, per tier: commitment, trailing three monthly values, whether
      any month breached, and worst month. A month below commitment is a breach; a tier is
      "compliant" only if zero breach months.
    - The consistency checker specifically hunts for the pattern from last quarter's failure:
      a verdict word ("compliant", "healthy", "on-track") applied to a tier whose own numbers
      show a breach, or a headroom claim that disagrees with the throughput table. Choose
      verdict words by recomputing from the tables, never by impression.
    - Breach risks must consider the next 90 days: Tier C's firmware issue on 30% of nodes with
      fix next quarter, Tier A availability trending downward across three months, error budget
      burn rate at week 9, capacity triggers from the growth rates, the shared metadata
      dependency, and the planned Tier B maintenance cost.
    - The recommendation section must rank the three tiers by investment priority with a
      one-paragraph rationale each, grounded only in the numbers above, and must state expected
      SLA impact if nothing is done, extrapolating the Tier A trend and the Tier C firmware
      exposure conservatively. Each rationale must carry the quarter-of-effect for its spend
      given hardware lead times.

    YOUR TASK: produce the quarterly assessment as a single JSON object with top-level keys:
    assessment_id (use "meridian-2026-Q3"), service_tiers (array with one object per tier:
    tier, node_count, sustained_throughput_gbps, design_throughput_gbps, headroom_pct,
    utilization_pct_of usable, trailing_availability array, sla_commitment_pct, breach_months
    array, compliant boolean), sla_table (object mapping each tier to commitment, worst month,
    and margin in hundredths of a percent), breach_risks (array of objects: tier, driver,
    ninety_day_outlook, severity one of low/medium/high), recommendation (object with
    priority_order array and rationale object keyed by tier). Every boolean and every verdict
    word must be recomputable from your own tables: if Tier C's trailing values show any month
    below 99.50, both the breach_months array and the compliant flag must reflect it, and no
    later prose may call Tier C healthy. Capacity-trigger extrapolations must appear as
    explicit arithmetic inside the rationale strings, not as bare conclusions.

    OUTPUT CONTRACT: one JSON object, first character "{", last character "}", no markdown, no
    commentary outside the object, throughput in GB/s to one decimal, percentages to two
    decimals, availability values as percentages to two decimals. The consistency checker
    fails the artifact on: any numeric mismatch between sections, any verdict contradicting a
    table, missing keys, or unparseable JSON. Contradiction anywhere invalidates everything —
    this is the exact failure mode that triggered the re-review last quarter.

    QUALITY BAR: the VP's staff will recompute two headroom values, one breach determination,
    and one capacity-trigger date from the raw measurements. Numbers must match exactly.
    Where extrapolation is required (trends, firmware exposure, utilization crossings), state
    the arithmetic behind it in the rationale strings. The staff will also check that the
    dependency between Tier A, Tier C, and the shared metadata service is reflected in the
    breach-risk entries rather than ignored for tidiness.
  expected_schema:
    type: object
    required:
      - assessment_id
      - service_tiers
      - sla_table
      - breach_risks
      - recommendation
    properties:
      assessment_id: { type: string }
      service_tiers: { type: array }
      sla_table: { type: object }
      breach_risks: { type: array }
      recommendation: { type: object }
  output_contract: |
    Single JSON object. Throughput GB/s 1 decimal; percentages 2
    decimals. Consistency checker fails on any cross-section
    numeric mismatch or verdict-table contradiction.
failure:
  class: F3
  injection_profile:
    attempts_failed: [1]
    notes: |
      F3 logical-consistency failure on attempt 1: two
      contradiction pairs extracted by the checker — service_tiers
      marks Tier C compliant:true while its own trailing table
      shows 99.44 < 99.50, and the recommendation prose states
      Tier A headroom as 21.4% against the table's 12.4% — plus a
      priority_order that ranks Tier B first with a rationale
      contradicting its own healthy table. replan heal (heavy
      model) on attempt 2 recomputes all verdicts from tables and
      passes.
  signals: [contradiction_markers, cross_section_inconsistency]
expected:
  final: accept
  path: [attempt, classify, heal_replan, attempt, classify, judge_gate, accept, report]
  attempts_to_success: 2
oracle:
  llm_calls:
    worker: 1
    heavy: 1
    judge: 0
  gate_flags: { need_replan: true, need_judge: false, budget_exhausted: false }
budget:
  llm_call_ceiling: 6
