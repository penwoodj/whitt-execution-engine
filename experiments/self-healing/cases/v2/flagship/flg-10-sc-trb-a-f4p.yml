case_id: flg-10-sc-trb-a-f4p
meta:
  domain: scientific-compute
  archetype: troubleshoot-diagnose
  complexity: A
  class: F4-persist
  source: case-matrix row 90 (sc-trb-a-f4p)
  words_prompt: ~1010
task:
  prompt: |
    You are the research computing engineer supporting a computational
    chemistry group. The group's flagship simulation pipeline, which
    runs molecular dynamics post-processing over trajectory files to
    produce binding-affinity estimates, has started failing in
    production on the shared cluster. The failures began after a
    scheduled maintenance window that upgraded the scheduler software
    and moved the group's scratch storage to a new filer. Your task is
    to produce a structured troubleshooting report that isolates the
    root cause and prescribes the fix, written for both the group's
    PI and the cluster operations team.

    The deliverable is a single document with, in this order: a
    symptom summary; an environment differential covering everything
    that changed across the maintenance window; a hypothesis matrix
    ranking candidate causes; a diagnostic evidence section walking
    through the tests already run and their results; a root cause
    determination with the causal chain spelled out; and a remediation
    plan with verification steps and a prevention section.

    Symptoms as reported by the group's postdoc: roughly thirty
    percent of jobs fail with exit code 141, always in the RMSD-fit
    stage, never in the same replica twice in a row, and only for
    trajectories larger than four gigabytes. The failures cluster in
    the evening hours. Jobs that succeed produce results that validate
    fine against the group's regression suite. The queue logs show the
    failed jobs consuming their full requested walltime before dying
    rather than failing fast.

    The environment differential from the maintenance window: the
    scheduler was upgraded from version 19 to version 21, which
    changed the default process tracking behavior and now enforces
    ulimits it previously ignored; the scratch filer moved from an
    NFSv3 export to NFSv4.2 with a different caching appliance in
    front; the cluster's interconnect driver was patched; and the
    group's own software stack was rebuilt against a newer MPI
    library, moving from version 3.1 to version 4.1, at the same time
    because the old build would not link against the patched driver
    userspace. Nothing else changed: same node hardware, same Python
    analysis environment, same container images for the post-processing
    stages.

    Diagnostic tests already run, with results you must incorporate:
    replaying a failed trajectory on a single node with the same
    software succeeds. Forcing the MPI version back to 3.1 on the new
    stack succeeds. Raising the stack ulimit to unlimited makes the
    four-gigabyte failures disappear on the two nodes it was tried
    on. strace of a failing run shows a SIGPIPE delivered on a write
    to a pipe whose read end is held by the scheduler's new resource
    tracker daemon. The filer's cache hit ratio drops sharply during
    evening hours, correlating with the group-wide backup window that
    also changed in the maintenance. A colleague insists the evening
    correlation is the real cause and the ulimit finding is a
    red herring; the evidence section must address this disagreement
    explicitly and either substantiate or refute it with the tests
    above.

    CLUSTER CONTEXT (binding). The scheduler's new version enforces,
    per job: stack size limit of eight megabytes unless the submission
    requests more, open file descriptor ceiling of four thousand
    ninety-six, and core dump suppression by default. The group's job
    submission template inherits these silently. The RMSD-fit stage
    memory-maps its trajectory input and spawns one worker per
    replica, and the MPI 4.1 runtime the stack was rebuilt against
    now registers an atexit handler with the scheduler's resource
    tracker over a pipe, where the 3.1 runtime used a unix socket.
    Historical context: the resource tracker daemon was introduced in
    scheduler version 20 but only began enforcing pipe liveness in
    version 21. Two other groups on the cluster run the same RMSD-fit
    code but with trajectories under two gigabytes and have reported
    no failures, which the hypothesis matrix must account for rather
    than ignore.

    The hypothesis matrix must rank at least five candidate causes,
    including at least one you will eliminate, and must score each
    against the evidence dimensions: reproduces only on large
    trajectories, reproduces intermittently, explains exit code 141,
    explains evening clustering, and survives the single-node replay
    result. State the scoring rubric before the matrix so the rankings
    are auditable.

    The root cause determination must spell out the full causal chain
    from scheduler upgrade through the resource tracker's pipe
    behavior, the process group's SIGPIPE propagation, the MPI layer's
    signal handling in 4.1 versus 3.1, and the trajectory-size
    dependence, and must explicitly explain why the failures still
    cluster in the evenings given the mechanism, resolving the
    postdoc's colleague's objection with the cache-ratio evidence.

    The remediation plan must cover: the immediate fix with its exact
    configuration change and rollout steps; the verification protocol
    that proves the fix at the node, queue, and weekly timescale; the
    prevention measures spanning monitoring, ulimit policy, and change
    management; and a short residual-risk note on what this fix does
    not address.

    EVIDENCE IDENTIFIERS (binding). Assign each diagnostic test above
    a stable identifier — T1 single-node replay, T2 MPI 3.1 rollback,
    T3 unlimited-stack experiment, T4 strace capture, T5 filer cache
    ratio correlation, T6 exit-code frequency scan, T7 evening-window
    job distribution — and reference every claim in the determination
    section by identifier. The cache-ratio and job-distribution data
    are the tests that speak to the evening clustering specifically,
    and the report must state what they show jointly, since the
    postdoc's colleague's theory and the SIGPIPE mechanism predict
    different correlations with the backup window: the report must
    spell out that difference and which pattern the data matches.

    OPERATOR CHECKLIST (binding). The remediation section must close
    with a five-line checklist the operations team can paste into
    their runbook: the exact ulimit line to set, where in the job
    submission template it goes, the command to verify it took effect
    on a compute node, the monitoring alert threshold that should
    quiet down once the fix lands, and the escalation contact if the
    evening clustering persists after the ulimit fix is fleet-wide.
    The checklist must be executable verbatim by an operator who has
    not read the rest of the report.

    Style requirements: the report is read by a PI who wants the story
    in plain language and by operators who want exact commands and
    configuration keys. Give each audience its own entry point: an
    executive summary paragraph up front, technical depth in the body.
    Every claim in the determination section must trace to a test in
    the evidence section by test identifier. Do not invent tests that
    were not run; if more evidence would help, list it in the
    residual-risk section as follow-up diagnostics, clearly marked as
    not yet run.
  expected_schema:
    type: object
    required:
      - symptom_summary
      - environment_differential
      - hypothesis_matrix
      - diagnostic_evidence
      - root_cause_determination
      - remediation_plan
    properties:
      symptom_summary: { type: string }
      environment_differential: { type: string }
      hypothesis_matrix: { type: string }
      diagnostic_evidence: { type: string }
      root_cause_determination: { type: string }
      remediation_plan: { type: string }
  output_contract: |
    JSON object, one key per section, each value a string of prose,
    tables, or command blocks.
failure:
  class: F4-persist
  injection_profile:
    attempts_failed: [1, 2, 3]
    notes: |
      F4-persist: upstream/context failure persists all three
      attempts. Attempt 1: truncates mid diagnostic-evidence section
      and the hypothesis matrix lacks the scoring rubric. Attempt 2
      after replan: output complete but the root-cause section claims
      an strace-verified kernel bug that no test in the evidence
      section supports, and cites a test identifier that does not
      exist. Attempt 3 after second replan: output addresses the
      truncation and the invented citation but now omits the evening-
      clustering explanation entirely while asserting the colleague's
      objection was "addressed above", compounding contract and
      consistency failures. Budget exhausted → final_fail with
      escalation note.
  signals: [truncated_output, unsupported_claims, missing_contract_fields, cross_section_inconsistency]
expected:
  final: final_fail
  path: [attempt, classify, heal_replan, attempt, classify, heal_replan, attempt, classify, final_fail, report]
  attempts_to_success: null
oracle:
  llm_calls:
    worker: 1
    heavy: 2
    judge: 0
  gate_flags: { need_replan: true, need_judge: false, budget_exhausted: true }
