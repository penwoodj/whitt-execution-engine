case_id: flg-09-mc-gen-b-f4
meta:
  domain: marketing-content
  archetype: generate-artifact
  complexity: B
  class: F4
  source: case-matrix row 76 (mc-gen-b-f4)
  words_prompt: ~1050
task:
  prompt: |
    You are the content strategist for a B2B developer-tools company
    preparing the launch campaign for "Quanta", a new observability
    product aimed at platform engineering teams at companies running
    between fifty and five thousand services. The company has an
    engineering-resonant brand: technically precise, allergic to hype,
    and fond of dry humor. Its audience reads release notes for fun,
    distrusts superlatives, and converts on documents that respect
    their intelligence. Your task is to produce the complete messaging
    and launch content package as a single structured document.

    The package must contain, in this order: a positioning statement
    with three proof-point pillars; an audience segmentation with
    persona-specific message hierarchies; a competitive contrast
    framework; a launch content matrix that inventories every asset the
    campaign ships, with owner, channel, dependencies, and success
    metric; the full draft of the flagship long-form landing page copy;
    and a set of five social post variants for the launch announcement
    tailored to the company's engineering-audience channels.

    Positioning requirements: the statement must name the category,
    the target buyer, the primary pain, the differentiated claim, and
    the reason to believe, in under seventy-five words, without using
    any banned term from the company style guide: seamless, effortless,
    revolutionary, game-changing, cutting-edge, robust, scalable,
    world-class, best-in-class, leverage as a verb, and solution as a
    noun standing alone. The three proof-point pillars must each cite a
    specific, verifiable product capability: the sub-second query
    latency over one hundred billion span events, the zero-instrument
    auto-discovery of service topology, and the cost model that charges
    by retained signal rather than by ingest volume. Each pillar must
    carry one quantified claim and one customer-grounded anecdote
    placeholder clearly marked for the references team to fill.

    Audience segmentation requirements: three segments, defined by
    observable firmographics and tooling posture rather than by
    self-reported attitudes. For each segment define the primary job to
    be done, the message hierarchy of at most three claims in strict
    priority order, the objections that block purchase and the proof
    that answers each, the channels where the segment is actually
    reachable, and the content formats that historically convert for
    this company, which you should assume are technical deep-dive
    posts, benchmark write-ups, and conference talks, and not webinars
    or ebooks.

    Competitive contrast framework requirements: a three-axis contrast
    against the two dominant incumbent categories, legacy APM suites
    and DIY open-source stacks, without naming individual vendors. For
    each axis state the incumbent's genuine strength first, then the
    structural weakness, then the Quanta counter-position. The axes are
    time-to-insight after a novel failure mode, total cost trajectory
    as service count grows, and operational burden on the platform
    team. The framework must be honest enough that the sales team can
    hand it to a skeptical prospect without embarrassment.

    Launch content matrix requirements: at least fourteen distinct
    assets spanning the launch week and the following month, including
    the flagship landing page, a technical whitepaper, two benchmark
    posts, an interactive product tour, documentation quickstart,
    changelog-style release notes, a launch talk submitted to one named
    industry conference, three social variants, one newsletter feature,
    an analyst briefing deck, and a partner co-marketing one-pager.
    Each asset row must carry: owner role, target segment, funnel
    stage, dependencies on other assets, draft-complete and review
    dates on a realistic calendar anchored to a launch six weeks out,
    and the success metric with its target threshold.

    Landing page copy requirements: between eight hundred and eleven
    hundred words, structured with a headline, a subheadline, three
    pillar sections each opening with a verifiable claim and closing
    with a call to action, a short architecture section that explains
    the retention-based cost model in plain language, a frequently
    asked questions section of at least six genuine questions
    engineers will ask, and a final conversion section. The copy must
    survive the style guide restrictions listed above, must use at
    least three concrete numbers, and must include at least one moment
    of the company's characteristic dry humor, flagged inline with a
    comment marker so legal can review it.

    Social post variants: five posts, each under two hundred eighty
    characters, each leading with a different pillar or proof point,
    at least one formatted as a numbered mini-list, and none using a
    hashtag other than the product name. Each post must name its
    primary target segment in an inline comment marker so growth can
    schedule them against the right channels, and the set of five
    must collectively cover all three segments at least once.

    MEASUREMENT AND REVIEW CADENCE (binding on the package). Every
    asset in the content matrix must name its success metric from the
    company's standard funnel vocabulary — awareness impressions,
    engaged reads defined as scroll-depth past sixty percent, demo
    requests, trial starts, and trial-to-paid conversions — and must
    state the review checkpoint at day seven and day thirty after
    publication, with the threshold that triggers a revision pass.
    Launch-week coordination: the package must define the publication
    order and the dependency that locks it — the landing page and
    documentation quickstart go live first because every other asset
    links to them, the whitepaper follows within forty-eight hours,
    and the social variants are embargoed until the landing page is
    verified live in all regions. The package must include a rollback
    note for the announcement posts in case the launch slips, written
    in advance.

    LEGAL AND CLAIMS MARKERS (binding). Inline markers use the
    convention: open-bracket VERIFY close-bracket for claims
    engineering must confirm, open-bracket LEGAL close-bracket for
    language counsel must clear, open-bracket REF close-bracket where
    the references team must insert a customer anecdote, and
    open-bracket HUMOR close-bracket marking each dry-humor moment
    for tone review. Every number in every asset must carry a VERIFY
    marker unless it appears in the approved claims register, which
    currently contains only the three pillar claims. The social
    variants must each carry at least one marker. Assets with zero
    markers will be assumed unaudited and returned.

    Constraints: the document must not invent customer names,
    metrics, or quotes; anecdote placeholders must be clearly marked.
    It must not commit to pricing numbers beyond the cost model's
    structure. Every claim that engineering must verify must carry an
    inline verification marker. The document is the creative brief and
    the copy deck in one; it will be handed directly to design,
    growth, and references teams without an intermediate translation
    step.
  expected_schema:
    type: object
    required:
      - positioning
      - segmentation
      - competitive_framework
      - content_matrix
      - landing_page_copy
      - social_variants
    optional:
      - notes
      - legal_and_claims_markers
      - measurement_and_review_cadence
    properties:
      positioning: { type: string }
      segmentation: { type: string }
      competitive_framework: { type: string }
      content_matrix: { type: string }
      landing_page_copy: { type: string }
      social_variants: { type: array, items: { type: string } }
  output_contract: |
    JSON object, one key per component. social_variants is an array of
    five strings; all other values are strings.
failure:
  class: F4
  injection_profile:
    attempts_failed: [1, 2]
    notes: |
      F4 upstream/context failure on attempts 1-2. Attempt 1: output
      truncates mid landing-page section (length ceiling hit) and the
      content matrix rows lack owners and dates; attempt 2 after
      replan heal: output complete but segues into invented customer
      quotes and unmarked superlatives from the banned list, tripping
      hallucination and contract checks. Attempt 3 after second heal
      (replan + corrective instruction on style-guide compliance and
      placeholder discipline) produces the compliant full package.
  signals: [truncated_output, missing_contract_fields, hallucination_keys, style_violations]
expected:
  final: accept
  path: [attempt, classify, heal_replan, attempt, classify, heal_replan, attempt, classify, accept, report]
  attempts_to_success: 3
oracle:
  llm_calls:
    worker: 1
    heavy: 2
    judge: 0
  gate_flags: { need_replan: true, need_judge: false, budget_exhausted: false }
