case_id: oi-trf-a-f1p
meta:
  domain: ops-infra
  archetype: transform-refine
  complexity: A
  class: F1-persist
  source: case-matrix row 40 (oi-trf-a-f1p)
  words_prompt: ~1056
task:
  prompt: 'You are the senior specialist at the incident and reliability team for an internal deployment
    platform at the incident and reliability team for an internal deployment platform. Your task is to
    produce a transformation specification that converts a described messy input into a fixed target shape,
    precise enough to implement without clarification meetings. The work concerns the "Cartographer" deploy
    orchestration fleet.


    BACKGROUND. Postmortem analyses feed a review board that rejects documents blaming symptoms, ignoring
    coincident window events, or lacking evidence citations per timeline entry. The fleet spans 14 regions;
    deploy jobs run on staggered regional schedules and verify artifact signatures against internal certificate
    bundles. The platform VP reads these analyses to allocate budget; a wrong-layer fix last quarter caused
    a repeat incident within three weeks.


    DELIVERABLE REQUIREMENTS. The artifact must contain, in order, the sections implied by the following
    requirements:

    - mapping: field-by-field mapping from every input variant to the target shape, with resolution rules
    for renames, retypes, and absences

    - rules: every filter, clamp, normalization, and interpolation rule with parameters and rationale

    - invariants: the validation invariants the output must satisfy and how each is checked

    Each section must stand alone: a reader who jumps directly to any one section must be able to act
    on it without reading the others.


    WORKLOAD EXPECTATIONS. The specification is expected to cover every input variant listed in the supplied
    material, not a representative subset; a mapping section that handles the common case and waves at
    the rest is a hard failure. Where the transformation branches, each branch states its trigger condition,
    its action, and its effect on the output flags, so that a reviewer can trace any input record through
    the branch lattice by hand.


    DEPTH REQUIREMENTS. Edge cases are first-class citizens: empty inputs, single-record inputs, records
    matching multiple variants, and records matching none. The specification states, for each, whether
    the transformation halts, flags, or produces output, and what that output looks like. The reproducibility
    section pins down ordering, rounding, and serialization choices by name.


    BINDING CONSTRAINTS (from the governing team, non-negotiable):

    - The causal chain must run through primary evidence; temporal correlation alone must be labeled as
    such.

    - Remediation items carry fix, owner team, priority, and a verification step; at least one item must
    address process, not only technology.


    SUPPLIED MATERIAL (the only factual basis for the artifact). Evidence pack: 62-minute incident window,
    6 of 14 regions affected, 41 failed jobs, cert rotation at window start, an object-store lifecycle
    purge event, a 600-second bundle cache, and two unrelated coincident changes to exclude.


    SCOPE AND RIGOR. Scope discipline: this is a focused task; do not extend the deliverable with adjacent-but-unrequested
    sections. Reviewers treat scope creep as a defect because it dilutes the required sections. One primary
    audience: write for the practitioner who will use the artifact directly. Executive framing beyond
    the required opening summary is out of scope.


    PROCESS DISCIPLINE. Evidence recency: every supplied fact is treated as current as of this engagement;
    if the artifact depends on a fact changing, it marks that dependency explicitly rather than assuming
    staleness.


    PROCESS DISCIPLINE. Failure loudness: where the described process encounters input it cannot classify,
    it halts with a diagnostic naming the offending input; silent drops and guessed mappings are prohibited.


    PROCESS DISCIPLINE. Review cadence: named sections carry named owners and the checkpoints at which
    they are reviewed; unowned sections are returned by default.


    PROCESS DISCIPLINE. Determinism: wherever ordering affects output, the ordering rule is stated; wherever
    rounding occurs, the rounding rule is stated; both are followed consistently.


    PROCESS DISCIPLINE. Audit hooks: wherever the artifact asserts a property that could silently regress,
    it names the check that would catch the regression and where that check lives.


    PROCESS DISCIPLINE. Negative space: the artifact states at least once what is deliberately out of
    scope and why, so reviewers can distinguish omission from oversight.


    PROCESS DISCIPLINE. Hand-off completeness: the artifact closes with the checklist of downstream consumers
    and the specific sections each must sign off before the artifact''s status advances.


    PROCESS DISCIPLINE. Marker conventions: inline markers for verification, legal, and references review
    use the bracketed vocabulary, and every number not in the approved register carries one.


    PROCESS DISCIPLINE. Units discipline: every numeric column carries its unit in its label; unitless
    numbers in derived tables are treated as defects by the review tooling.


    PROCESS DISCIPLINE. Terminology control: the artifact fixes its vocabulary in a short glossary paragraph
    before first use, and does not alternate between synonyms for the same concept; reviewers track referential
    integrity line by line.


    PROCESS DISCIPLINE. Idempotency: any repeated application of the process described must converge to
    the same artifact; steps that must be skipped on re-run are identified with reasons.


    PROCESS DISCIPLINE. Definitions first: any scale, rating, or band used in the artifact must be operationally
    defined before its first use, so two independent readers score the same item the same way.


    PROCESS DISCIPLINE. Escalation path: wherever the artifact delegates a decision, it names the deciding
    role, the information that role needs, and the timeframe in which the decision blocks downstream work.


    PROCESS DISCIPLINE. Precision over fluency: where a precise but awkward formulation and a fluent but
    ambiguous one compete, the artifact chooses precision; polish that costs determinism is rejected in
    review.


    PROCESS DISCIPLINE. Reconciliation: wherever totals and components both appear, the artifact states
    the reconciliation between them and treats mismatch as a hard error rather than a rounding note.


    PROCESS DISCIPLINE. Versioning: the artifact carries a version field and a status vocabulary; supersession
    is explicit rather than implicit in filenames.


    OUTPUT CONTRACT: the deliverable is a single JSON object. First

    character "{", last character "}". No markdown fences, no commentary

    outside the object, all strings double-quoted, dates in ISO 8601 where

    they appear. Required top-level keys: mapping, rules, gap_handling, invariants, reproducibility. The
    consuming pipeline

    hard-fails on missing keys, extra keys beyond a single optional "notes"

    field, wrong value types, or unparseable JSON. There is no partial

    credit: the artifact either parses and validates or it is an incident.


    QUALITY BAR: a domain reviewer will spot-check three specific claims

    or computations against the raw material supplied above; every number

    must be exactly reproducible and every judgement must name its basis.

    Reviewers have been asked to reject artifacts that hedge, that paper

    over gaps in the supplied material, or that resolve ambiguity silently

    instead of stating the interpretation they chose.'
  expected_schema:
    type: object
    required:
    - mapping
    - rules
    - gap_handling
    - invariants
    - reproducibility
    properties:
      mapping:
        type: string
      rules:
        type: string
      gap_handling:
        type: string
      invariants:
        type: string
      reproducibility:
        type: string
    optional:
    - notes
  output_contract: Single JSON object, no fences or commentary. Required top-level keys per contract section;
    parser hard-fails on missing keys, wrong types, or extra keys beyond the optional notes field.
failure:
