case_id: oi-pld-b-f3
meta:
  domain: ops-infra
  archetype: plan-decompose
  complexity: B
  class: F3
  source: case-matrix row 34 (oi-pld-b-f3)
  words_prompt: ~1197
task:
  prompt: 'You are the senior specialist at the incident and reliability team for an internal deployment
    platform at the incident and reliability team for an internal deployment platform. Your task is to
    produce a phased, resourced, sequenced plan that a program manager could execute against without further
    meetings. The work concerns the "Cartographer" deploy orchestration fleet.


    BACKGROUND. Severity classification follows a published rubric: customer impact first, then internal
    blast radius, then mitigation time. Postmortem analyses feed a review board that rejects documents
    blaming symptoms, ignoring coincident window events, or lacking evidence citations per timeline entry.
    The platform VP reads these analyses to allocate budget; a wrong-layer fix last quarter caused a repeat
    incident within three weeks.


    ADDITIONAL CONTEXT. The fleet spans 14 regions; deploy jobs run on staggered regional schedules and
    verify artifact signatures against internal certificate bundles.


    DELIVERABLE REQUIREMENTS. The artifact must contain, in order, the sections implied by the following
    requirements:

    - phases: phases with entry and exit criteria, workstreams with owners, artifacts, dependencies, and
    coverage

    - critical_path: hard versus soft dependencies called out, with the critical path explicit

    - risks: a risk register with defined scales, owners, mitigations, and early-warning indicators

    Each section must stand alone: a reader who jumps directly to any one section must be able to act
    on it without reading the others.


    WORKLOAD EXPECTATIONS. The plan is expected to decompose to the level of workstreams with single owners
    — not phases alone, and not individual tasks. Each workstream''s artifact list names documents or
    systems, not effort. Sequencing must be expressed as explicit dependencies the reader can diagram
    without interpretation, and the plan must survive a reviewer asking, for any workstream, what blocks
    it and what it blocks.


    DEPTH REQUIREMENTS. The plan quantifies what it can and qualifies what it cannot: durations use the
    defined effort bands, dependencies use the hard-soft distinction, and risks use the defined scales.
    Any date that is derived rather than fixed is labeled derived, and the plan states the slip threshold
    that forces recomputation of the critical path.


    BINDING CONSTRAINTS (from the governing team, non-negotiable):

    - Remediation items carry fix, owner team, priority, and a verification step; at least one item must
    address process, not only technology.

    - Every coincident event in the window must be explicitly ruled in or out with the excluding evidence
    named.

    - The causal chain must run through primary evidence; temporal correlation alone must be labeled as
    such.


    SUPPLIED MATERIAL (the only factual basis for the artifact). Evidence pack: 62-minute incident window,
    6 of 14 regions affected, 41 failed jobs, cert rotation at window start, an object-store lifecycle
    purge event, a 600-second bundle cache, and two unrelated coincident changes to exclude.


    SCOPE AND RIGOR. Dual audience: the artifact is read by a specialist reviewer and by an operator or
    executive; each needs its own entry point, and where their needs conflict, prefer the reader who acts
    on the artifact. Cross-cutting consistency: any figure, verdict, or commitment appearing in more than
    one section must agree exactly across sections; drift between sections is treated as a factual error,
    not a style issue. Assumption discipline: state every assumption explicitly; where the current state
    is unknown, include a discovery item rather than an assumption, and never invent organizational policy
    or history. Traceability: wherever the artifact makes a claim, it must be traceable to supplied evidence,
    a stated assumption, or an explicitly marked gap — never to unstated intuition.


    PROCESS DISCIPLINE. Definitions first: any scale, rating, or band used in the artifact must be operationally
    defined before its first use, so two independent readers score the same item the same way. All such
    content belongs as prose inside an existing required section''s value — never as new top-level keys
    beyond the contract.


    PROCESS DISCIPLINE. Hand-off completeness: the artifact closes with the checklist of downstream consumers
    and the specific sections each must sign off before the artifact''s status advances. All such content
    belongs as prose inside an existing required section''s value — never as new top-level keys beyond
    the contract.


    PROCESS DISCIPLINE. Negative space: inside an existing required section, state at least once what
    is deliberately out of scope and why, so reviewers can distinguish omission from oversight. All such
    content belongs as prose inside an existing required section''s value — never as new top-level keys
    beyond the contract.


    PROCESS DISCIPLINE. Review cadence: named sections carry named owners and the checkpoints at which
    they are reviewed; unowned sections are returned by default. All such content belongs as prose inside
    an existing required section''s value — never as new top-level keys beyond the contract.


    PROCESS DISCIPLINE. Precision over fluency: where a precise but awkward formulation and a fluent but
    ambiguous one compete, the artifact chooses precision; polish that costs determinism is rejected in
    review. All such content belongs as prose inside an existing required section''s value — never as
    new top-level keys beyond the contract.


    PROCESS DISCIPLINE. Reconciliation: wherever totals and components both appear, the artifact states
    the reconciliation between them and treats mismatch as a hard error rather than a rounding note. All
    such content belongs as prose inside an existing required section''s value — never as new top-level
    keys beyond the contract.


    PROCESS DISCIPLINE. Idempotency: any repeated application of the process described must converge to
    the same artifact; steps that must be skipped on re-run are identified with reasons. All such content
    belongs as prose inside an existing required section''s value — never as new top-level keys beyond
    the contract.


    PROCESS DISCIPLINE. Evidence recency: every supplied fact is treated as current as of this engagement;
    if the artifact depends on a fact changing, it marks that dependency explicitly rather than assuming
    staleness. All such content belongs as prose inside an existing required section''s value — never
    as new top-level keys beyond the contract.


    PROCESS DISCIPLINE. Failure loudness: where the described process encounters input it cannot classify,
    it halts with a diagnostic naming the offending input; silent drops and guessed mappings are prohibited.
    All such content belongs as prose inside an existing required section''s value — never as new top-level
    keys beyond the contract.


    PROCESS DISCIPLINE. Marker conventions: inline markers for verification, legal, and references review
    use the bracketed vocabulary, and every number not in the approved register carries one. All such
    content belongs as prose inside an existing required section''s value — never as new top-level keys
    beyond the contract.


    OUTPUT CONTRACT: the deliverable is a single JSON object. First

    character "{", last character "}". No markdown fences, no commentary

    outside the object, all strings double-quoted, dates in ISO 8601 where

    they appear. Required top-level keys: phases, critical_path, risk_register, decision_log. The consuming
    pipeline

    hard-fails on missing keys, extra keys beyond a single optional "notes"

    field, wrong value types, or unparseable JSON. There is no partial

    credit: the artifact either parses and validates or it is an incident.


    QUALITY BAR: a domain reviewer will spot-check three specific claims

    or computations against the raw material supplied above; every number

    must be exactly reproducible and every judgement must name its basis.

    Reviewers have been asked to reject artifacts that hedge, that paper

    over gaps in the supplied material, or that resolve ambiguity silently

    instead of stating the interpretation they chose.'
  expected_schema:
    type: object
    required:
    - phases
    - critical_path
    - risk_register
    - decision_log
    properties:
      phases:
        type: string
      critical_path:
        type: string
      risk_register:
        type: string
      decision_log:
        type: string
    optional:
    - notes
    - status
    - version
  output_contract: Single JSON object, no fences or commentary. Required top-level keys per contract section;
    parser hard-fails on missing keys, wrong types, or extra keys beyond the optional notes field.
failure:
  class: F3
  injection_profile:
    attempts_failed:
    - 1
    notes: 'Attempt failures carry the logical-consistency signature: verdicts contradicting the artifact''s
      own tables and cross-section numeric drift; the replan heal (heavy model) recomputes verdicts from
      tables on the following attempt.'
  signals:
  - contradiction_markers
  - cross_section_inconsistency
expected:
  final: accept
  path:
  - attempt
  - classify
  - heal_replan
  - attempt
  - classify
  - judge_gate
  - accept
  - report
  attempts_to_success: 2
oracle:
  llm_calls:
    worker: 1
    heavy: 0
    judge: 0
  gate_flags:
    need_replan: true
    need_judge: false
    budget_exhausted: false
budget:
  llm_call_ceiling: 6
