case_id: mc-pld-a-f1
meta:
  domain: marketing-content
  archetype: plan-decompose
  complexity: A
  class: F1
  source: case-matrix row 78 (mc-pld-a-f1)
  words_prompt: ~1214
task:
  prompt: "You are the senior specialist at the content strategy team at a B2B developer-tools company\
    \ at the content strategy team at a B2B developer-tools company. Your task is to produce a phased,\
    \ resourced, sequenced plan that a program manager could execute against without further meetings.\
    \ The work concerns the launch campaign for a new observability product.\n\nBACKGROUND. The brand\
    \ is technically precise, allergic to hype, and fond of dry humor; the audience distrusts superlatives\
    \ and converts on documents that respect their intelligence. A banned-term style guide bars a fixed\
    \ list of hype words; legal and references review run through inline markers rather than email threads.\
    \ Campaign assets ship against a dependency-locked publication order with pre-written rollback notes\
    \ for announcement posts.\n\nDELIVERABLE REQUIREMENTS. The artifact must contain, in order, the sections\
    \ implied by the following requirements:\n- phases: phases with entry and exit criteria, workstreams\
    \ with owners, artifacts, dependencies, and coverage\n- critical_path: hard versus soft dependencies\
    \ called out, with the critical path explicit\n- risks: a risk register with defined scales, owners,\
    \ mitigations, and early-warning indicators\nEach section must stand alone: a reader who jumps directly\
    \ to any one section must be able to act on it without reading the others.\n\nWORKLOAD EXPECTATIONS.\
    \ The plan is expected to decompose to the level of workstreams with single owners \u2014 not phases\
    \ alone, and not individual tasks. Each workstream's artifact list names documents or systems, not\
    \ effort. Sequencing must be expressed as explicit dependencies the reader can diagram without interpretation,\
    \ and the plan must survive a reviewer asking, for any workstream, what blocks it and what it blocks.\n\
    \nDEPTH REQUIREMENTS. The plan quantifies what it can and qualifies what it cannot: durations use\
    \ the defined effort bands, dependencies use the hard-soft distinction, and risks use the defined\
    \ scales. Any date that is derived rather than fixed is labeled derived, and the plan states the slip\
    \ threshold that forces recomputation of the critical path.\n\nBINDING CONSTRAINTS (from the governing\
    \ team, non-negotiable):\n- Competitive contrast names the incumbent's genuine strength before its\
    \ structural weakness.\n- No invented customer names, metrics, or quotes; anecdote placeholders are\
    \ marked for the references team.\n\nSUPPLIED MATERIAL (the only factual basis for the artifact).\
    \ Campaign inputs: 3 proof pillars with quantified claims, 3 audience segments, 2 incumbent categories\
    \ to contrast, a six-week launch runway, and a fourteen-asset minimum content matrix.\n\nSCOPE AND\
    \ RIGOR. Scope discipline: this is a focused task; do not extend the deliverable with adjacent-but-unrequested\
    \ sections. Reviewers treat scope creep as a defect because it dilutes the required sections. One\
    \ primary audience: write for the practitioner who will use the artifact directly. Executive framing\
    \ beyond the required opening summary is out of scope.\n\nPROCESS DISCIPLINE. Failure loudness: where\
    \ the described process encounters input it cannot classify, it halts with a diagnostic naming the\
    \ offending input; silent drops and guessed mappings are prohibited. All such content belongs as prose\
    \ inside an existing required section's value \u2014 never as new top-level keys beyond the contract.\n\
    \nPROCESS DISCIPLINE. Negative space: inside an existing required section, state at least once what\
    \ is deliberately out of scope and why, so reviewers can distinguish omission from oversight. All\
    \ such content belongs as prose inside an existing required section's value \u2014 never as new top-level\
    \ keys beyond the contract.\n\nPROCESS DISCIPLINE. Marker conventions: inline markers for verification,\
    \ legal, and references review use the bracketed vocabulary, and every number not in the approved\
    \ register carries one. All such content belongs as prose inside an existing required section's value\
    \ \u2014 never as new top-level keys beyond the contract.\n\nPROCESS DISCIPLINE. Units discipline:\
    \ every numeric column carries its unit in its label; unitless numbers in derived tables are treated\
    \ as defects by the review tooling. All such content belongs as prose inside an existing required\
    \ section's value \u2014 never as new top-level keys beyond the contract.\n\nPROCESS DISCIPLINE. Idempotency:\
    \ any repeated application of the process described must converge to the same artifact; steps that\
    \ must be skipped on re-run are identified with reasons. All such content belongs as prose inside\
    \ an existing required section's value \u2014 never as new top-level keys beyond the contract.\n\n\
    PROCESS DISCIPLINE. Determinism: wherever ordering affects output, the ordering rule is stated; wherever\
    \ rounding occurs, the rounding rule is stated; both are followed consistently. All such content belongs\
    \ as prose inside an existing required section's value \u2014 never as new top-level keys beyond the\
    \ contract.\n\nPROCESS DISCIPLINE. Review cadence: named sections carry named owners and the checkpoints\
    \ at which they are reviewed; unowned sections are returned by default. All such content belongs as\
    \ prose inside an existing required section's value \u2014 never as new top-level keys beyond the\
    \ contract.\n\nPROCESS DISCIPLINE. Reconciliation: wherever totals and components both appear, the\
    \ artifact states the reconciliation between them and treats mismatch as a hard error rather than\
    \ a rounding note. All such content belongs as prose inside an existing required section's value \u2014\
    \ never as new top-level keys beyond the contract.\n\nPROCESS DISCIPLINE. Escalation path: wherever\
    \ the artifact delegates a decision, it names the deciding role, the information that role needs,\
    \ and the timeframe in which the decision blocks downstream work. All such content belongs as prose\
    \ inside an existing required section's value \u2014 never as new top-level keys beyond the contract.\n\
    \nPROCESS DISCIPLINE. Terminology control: fix vocabulary in a short glossary passage inside an existing\
    \ required section before first use, and do not alternate between synonyms for the same concept; no\
    \ new top-level keys. All such content belongs as prose inside an existing required section's value\
    \ \u2014 never as new top-level keys beyond the contract.\n\nPROCESS DISCIPLINE. Hand-off completeness:\
    \ the artifact closes with the checklist of downstream consumers and the specific sections each must\
    \ sign off before the artifact's status advances. All such content belongs as prose inside an existing\
    \ required section's value \u2014 never as new top-level keys beyond the contract.\n\nPROCESS DISCIPLINE.\
    \ Precision over fluency: where a precise but awkward formulation and a fluent but ambiguous one compete,\
    \ the artifact chooses precision; polish that costs determinism is rejected in review. All such content\
    \ belongs as prose inside an existing required section's value \u2014 never as new top-level keys\
    \ beyond the contract.\n\nPROCESS DISCIPLINE. Reconciliation: wherever totals and components both\
    \ appear, the artifact states the reconciliation between them and treats mismatch as a hard error\
    \ rather than a rounding note. All such content belongs as prose inside an existing required section's\
    \ value \u2014 never as new top-level keys beyond the contract.\n\nOUTPUT CONTRACT: the deliverable\
    \ is a single JSON object. First\ncharacter \"{\", last character \"}\". No markdown fences, no commentary\n\
    outside the object, all strings double-quoted, dates in ISO 8601 where\nthey appear. Required top-level\
    \ keys: phases, critical_path, risk_register, decision_log. The consuming pipeline\nhard-fails on\
    \ missing keys, extra keys beyond a single optional \"notes\"\nfield, wrong value types, or unparseable\
    \ JSON. There is no partial\ncredit: the artifact either parses and validates or it is an incident.\n\
    \nQUALITY BAR: a domain reviewer will spot-check three specific claims\nor computations against the\
    \ raw material supplied above; every number\nmust be exactly reproducible and every judgement must\
    \ name its basis.\nReviewers have been asked to reject artifacts that hedge, that paper\nover gaps\
    \ in the supplied material, or that resolve ambiguity silently\ninstead of stating the interpretation\
    \ they chose."
  expected_schema:
    type: object
    required:
    - phases
    - critical_path
    - risk_register
    - decision_log
    properties:
      phases:
        type: string
      critical_path:
        type: string
      risk_register:
        type: string
      decision_log:
        type: string
    optional:
    - notes
    - status
    - version
  output_contract: Single JSON object, no fences or commentary. Required top-level keys per contract section;
    parser hard-fails on missing keys, wrong types, or extra keys beyond the optional notes field.
failure:
  class: F1
  injection_profile:
    attempts_failed:
    - 1
    notes: 'Attempt failures carry the confidence/hallucination signature: invented keys, methods, or
      numbers alongside inflated stated confidence; the corrective-prompt heal scrubs them on the following
      attempt.'
  signals:
  - hallucination_keys
  - confidence_degraded
expected:
  final: accept
  path:
  - attempt
  - classify
  - heal_corrective_prompt
  - attempt
  - classify
  - judge_gate
  - accept
  - report
  attempts_to_success: 2
oracle:
  llm_calls:
    worker: 1
    heavy: 0
    judge: 0
  gate_flags:
    need_replan: false
    need_judge: false
    budget_exhausted: false
budget:
  llm_call_ceiling: 6
path_flex: true
path_flex_rationale: "4 live runs, 4 distinct r2 reclassification flavors (F1-drift/F2/F3), all recovered\
  \ by r3 \u2014 retry stochasticity of marketing plan-decompose docs"
