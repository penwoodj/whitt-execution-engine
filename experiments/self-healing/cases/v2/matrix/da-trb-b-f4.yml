case_id: da-trb-b-f4
meta:
  domain: data-analysis
  archetype: troubleshoot-diagnose
  complexity: B
  class: F4
  source: case-matrix row 15 (da-trb-b-f4)
  words_prompt: ~1146
task:
  prompt: 'You are the senior specialist at the analytics group at a consumer mobile app company at the
    analytics group at a consumer mobile app company. Your task is to produce a diagnostic analysis that
    isolates root cause from coincidental correlation and prescribes verified remediation. The work concerns
    the "Aurora" growth analytics pipeline.


    BACKGROUND. The dashboard parser hard-fails on missing keys, percentage-versus-decimal confusion,
    and silent zero-fills for unmeasured cells. The growth team trusts numbers only when every rate is
    recomputable from raw counts and every judgement cites an instrumentation note or the absence of one.
    Cohort metrics cover onboarding completion, activation, push enablement, and day-7 return, with known
    Android double-fire and ingest-outage quirks.


    ADDITIONAL CONTEXT. Weekly extracts feed a legacy Perl reporting pipeline that is being decommissioned
    after repeated format incidents that paged on-call engineers.


    DELIVERABLE REQUIREMENTS. The artifact must contain, in order, the sections implied by the following
    requirements:

    - timeline: chronological events with timestamps and evidence citations, including contributing changes
    and coincident events ruled in or out

    - causal_chain: the causal chain ordered earliest-first, with the single preventing control and the
    missing alerts named

    - remediation: fixes with owners, priorities, and verification steps, plus residual risk and follow-up
    diagnostics clearly marked as not yet run

    Each section must stand alone: a reader who jumps directly to any one section must be able to act
    on it without reading the others.


    WORKLOAD EXPECTATIONS. The analysis must account for every supplied diagnostic test, using it, superseding
    it, or explicitly ruling it out; cherry-picking the tests that fit a preferred narrative is the failure
    mode this artifact exists to prevent. The causal chain must be falsifiable: for each link, the analysis
    states what evidence would have shown that link to be false.


    DEPTH REQUIREMENTS. The determination section distinguishes what is established, what is most likely,
    and what remains unknown, and uses those exact labels. Remediation separates the immediate fix from
    the systemic prevention, and the verification protocol proves the fix at more than one timescale —
    immediately, and under the conditions that produced the original symptoms.


    BINDING CONSTRAINTS (from the governing team, non-negotiable):

    - The data quality section must enumerate every known instrumentation issue with its affected scope.

    - Rates are decimals to four places; deltas are signed percentages computed from summed numerators,
    never from averaging daily rates.

    - Anomalies are deviations beyond 1.5 percentage points from the weekly mean, each with a cause or
    the literal string none-known.


    SUPPLIED MATERIAL (the only factual basis for the artifact). Latest weekly extract: 7 daily cohorts
    between 16k and 25k registrations, onboarding rates near 0.86, activation near 0.50, push near 0.22,
    prior-week totals for deltas, two documented instrumentation quirks.


    SCOPE AND RIGOR. Dual audience: the artifact is read by a specialist reviewer and by an operator or
    executive; each needs its own entry point, and where their needs conflict, prefer the reader who acts
    on the artifact. Cross-cutting consistency: any figure, verdict, or commitment appearing in more than
    one section must agree exactly across sections; drift between sections is treated as a factual error,
    not a style issue. Assumption discipline: state every assumption explicitly; where the current state
    is unknown, include a discovery item rather than an assumption, and never invent organizational policy
    or history. Traceability: wherever the artifact makes a claim, it must be traceable to supplied evidence,
    a stated assumption, or an explicitly marked gap — never to unstated intuition.


    PROCESS DISCIPLINE. Determinism: wherever ordering affects output, the ordering rule is stated; wherever
    rounding occurs, the rounding rule is stated; both are followed consistently.


    PROCESS DISCIPLINE. Marker conventions: inline markers for verification, legal, and references review
    use the bracketed vocabulary, and every number not in the approved register carries one.


    PROCESS DISCIPLINE. Review cadence: named sections carry named owners and the checkpoints at which
    they are reviewed; unowned sections are returned by default.


    PROCESS DISCIPLINE. Evidence recency: every supplied fact is treated as current as of this engagement;
    if the artifact depends on a fact changing, it marks that dependency explicitly rather than assuming
    staleness.


    PROCESS DISCIPLINE. Units discipline: every numeric column carries its unit in its label; unitless
    numbers in derived tables are treated as defects by the review tooling.


    PROCESS DISCIPLINE. Precision over fluency: where a precise but awkward formulation and a fluent but
    ambiguous one compete, the artifact chooses precision; polish that costs determinism is rejected in
    review.


    PROCESS DISCIPLINE. Reconciliation: wherever totals and components both appear, the artifact states
    the reconciliation between them and treats mismatch as a hard error rather than a rounding note.


    PROCESS DISCIPLINE. Failure loudness: where the described process encounters input it cannot classify,
    it halts with a diagnostic naming the offending input; silent drops and guessed mappings are prohibited.


    PROCESS DISCIPLINE. Idempotency: any repeated application of the process described must converge to
    the same artifact; steps that must be skipped on re-run are identified with reasons.


    PROCESS DISCIPLINE. Negative space: the artifact states at least once what is deliberately out of
    scope and why, so reviewers can distinguish omission from oversight.


    PROCESS DISCIPLINE. Definitions first: any scale, rating, or band used in the artifact must be operationally
    defined before its first use, so two independent readers score the same item the same way.


    PROCESS DISCIPLINE. Hand-off completeness: the artifact closes with the checklist of downstream consumers
    and the specific sections each must sign off before the artifact''s status advances.


    PROCESS DISCIPLINE. Terminology control: the artifact fixes its vocabulary in a short glossary paragraph
    before first use, and does not alternate between synonyms for the same concept; reviewers track referential
    integrity line by line.


    PROCESS DISCIPLINE. Audit hooks: wherever the artifact asserts a property that could silently regress,
    it names the check that would catch the regression and where that check lives.


    PROCESS DISCIPLINE. Escalation path: wherever the artifact delegates a decision, it names the deciding
    role, the information that role needs, and the timeframe in which the decision blocks downstream work.


    PROCESS DISCIPLINE. Versioning: the artifact carries a version field and a status vocabulary; supersession
    is explicit rather than implicit in filenames.


    OUTPUT CONTRACT: the deliverable is a single JSON object. First

    character "{", last character "}". No markdown fences, no commentary

    outside the object, all strings double-quoted, dates in ISO 8601 where

    they appear. Required top-level keys: timeline, causal_chain, blast_radius, remediation. The consuming
    pipeline

    hard-fails on missing keys, extra keys beyond a single optional "notes"

    field, wrong value types, or unparseable JSON. There is no partial

    credit: the artifact either parses and validates or it is an incident.


    QUALITY BAR: a domain reviewer will spot-check three specific claims

    or computations against the raw material supplied above; every number

    must be exactly reproducible and every judgement must name its basis.

    Reviewers have been asked to reject artifacts that hedge, that paper

    over gaps in the supplied material, or that resolve ambiguity silently

    instead of stating the interpretation they chose.'
  expected_schema:
    type: object
    required:
    - timeline
    - causal_chain
    - blast_radius
    - remediation
    properties:
      timeline:
        type: string
      causal_chain:
        type: string
      blast_radius:
        type: string
      remediation:
        type: string
    optional:
    - notes
  output_contract: Single JSON object, no fences or commentary. Required top-level keys per contract section;
    parser hard-fails on missing keys, wrong types, or extra keys beyond the optional notes field.
failure:
  class: F4
  injection_profile:
    attempts_failed:
    - 1
    - 2
    notes: 'Attempt failures carry the upstream/context signature: truncation against the length ceiling
      and dropped contract fields; each replan heal recovers completeness until the final attempt passes.'
  signals:
  - truncated_output
  - missing_contract_fields
  - upstream_errors
expected:
  final: accept
  path:
  - attempt
  - classify
  - heal_replan
  - attempt
  - classify
  - judge_gate
  - accept
  - report
  attempts_to_success: 2
