  complexity: B
  class: F4-persist
  source: case-matrix row 100 (px-trf-b-f4p)
  words_prompt: ~1234
task:
  prompt: 'You are the senior specialist at the product design research team at a productivity software
    company at the product design research team at a productivity software company. Your task is to produce
    a transformation specification that converts a described messy input into a fixed target shape, precise
    enough to implement without clarification meetings. The work concerns the onboarding redesign program
    for the core workspace editor.


    BACKGROUND. Findings documents must separate observed behavior from participant verbatims from facilitator
    interpretation, each with its own label. Design reviews reject recommendation sections that cite no
    evidence and reject evidence sections with no traceable tie to a decision. Telemetry events for the
    funnel were instrumented two quarters ago and carry a known double-count defect on one step that analyses
    must discount explicitly.


    ADDITIONAL CONTEXT. The editor''s onboarding funnel loses most new users before first value; the redesign
    program pairs telemetry with moderated study findings.


    DELIVERABLE REQUIREMENTS. The artifact must contain, in order, the sections implied by the following
    requirements:

    - mapping: field-by-field mapping from every input variant to the target shape, with resolution rules
    for renames, retypes, and absences

    - rules: every filter, clamp, normalization, and interpolation rule with parameters and rationale

    - invariants: the validation invariants the output must satisfy and how each is checked

    Each section must stand alone: a reader who jumps directly to any one section must be able to act
    on it without reading the others.


    WORKLOAD EXPECTATIONS. The specification is expected to cover every input variant listed in the supplied
    material, not a representative subset; a mapping section that handles the common case and waves at
    the rest is a hard failure. Where the transformation branches, each branch states its trigger condition,
    its action, and its effect on the output flags, so that a reviewer can trace any input record through
    the branch lattice by hand.


    DEPTH REQUIREMENTS. Edge cases are first-class citizens: empty inputs, single-record inputs, records
    matching multiple variants, and records matching none. The specification states, for each, whether
    the transformation halts, flags, or produces output, and what that output looks like. The reproducibility
    section pins down ordering, rounding, and serialization choices by name.


    BINDING CONSTRAINTS (from the governing team, non-negotiable):

    - Competitive references are clearly marked as contextual, never as evidence.

    - Known instrumentation defects are carried as first-class caveats in every affected chart description.

    - Sample sizes and segment definitions appear before any percentages derived from them.


    SUPPLIED MATERIAL (the only factual basis for the artifact). Study inputs: funnel telemetry across
    7 steps with step-level drop-off, 12 moderated sessions across 3 personas, a 340-response survey with
    known skew, and a competitive scan of 5 adjacent products.


    SCOPE AND RIGOR. Dual audience: the artifact is read by a specialist reviewer and by an operator or
    executive; each needs its own entry point, and where their needs conflict, prefer the reader who acts
    on the artifact. Cross-cutting consistency: any figure, verdict, or commitment appearing in more than
    one section must agree exactly across sections; drift between sections is treated as a factual error,
    not a style issue. Assumption discipline: state every assumption explicitly; where the current state
    is unknown, include a discovery item rather than an assumption, and never invent organizational policy
    or history. Traceability: wherever the artifact makes a claim, it must be traceable to supplied evidence,
    a stated assumption, or an explicitly marked gap — never to unstated intuition.


    PROCESS DISCIPLINE. Idempotency: any repeated application of the process described must converge to
    the same artifact; steps that must be skipped on re-run are identified with reasons. All such content
    belongs as prose inside an existing required section''s value — never as new top-level keys beyond
    the contract.


    PROCESS DISCIPLINE. Review cadence: named sections carry named owners and the checkpoints at which
    they are reviewed; unowned sections are returned by default. All such content belongs as prose inside
    an existing required section''s value — never as new top-level keys beyond the contract.


    PROCESS DISCIPLINE. Precision over fluency: where a precise but awkward formulation and a fluent but
    ambiguous one compete, the artifact chooses precision; polish that costs determinism is rejected in
    review. All such content belongs as prose inside an existing required section''s value — never as
    new top-level keys beyond the contract.


    PROCESS DISCIPLINE. Units discipline: every numeric column carries its unit in its label; unitless
    numbers in derived tables are treated as defects by the review tooling. All such content belongs as
    prose inside an existing required section''s value — never as new top-level keys beyond the contract.


    PROCESS DISCIPLINE. Determinism: wherever ordering affects output, the ordering rule is stated; wherever
    rounding occurs, the rounding rule is stated; both are followed consistently. All such content belongs
    as prose inside an existing required section''s value — never as new top-level keys beyond the contract.


    PROCESS DISCIPLINE. Definitions first: any scale, rating, or band used in the artifact must be operationally
    defined before its first use, so two independent readers score the same item the same way. All such
    content belongs as prose inside an existing required section''s value — never as new top-level keys
    beyond the contract.


    PROCESS DISCIPLINE. Reconciliation: wherever totals and components both appear, the artifact states
    the reconciliation between them and treats mismatch as a hard error rather than a rounding note. All
    such content belongs as prose inside an existing required section''s value — never as new top-level
    keys beyond the contract.


    PROCESS DISCIPLINE. Marker conventions: inline markers for verification, legal, and references review
    use the bracketed vocabulary, and every number not in the approved register carries one. All such
    content belongs as prose inside an existing required section''s value — never as new top-level keys
    beyond the contract.


    PROCESS DISCIPLINE. Audit hooks: wherever the artifact asserts a property that could silently regress,
    it names the check that would catch the regression and where that check lives. All such content belongs
    as prose inside an existing required section''s value — never as new top-level keys beyond the contract.


    PROCESS DISCIPLINE. Negative space: inside an existing required section, state at least once what
    is deliberately out of scope and why, so reviewers can distinguish omission from oversight. All such
    content belongs as prose inside an existing required section''s value — never as new top-level keys
    beyond the contract.


    PROCESS DISCIPLINE. Failure loudness: where the described process encounters input it cannot classify,
    it halts with a diagnostic naming the offending input; silent drops and guessed mappings are prohibited.
    All such content belongs as prose inside an existing required section''s value — never as new top-level
    keys beyond the contract.


    OUTPUT CONTRACT: the deliverable is a single JSON object. First

    character "{", last character "}". No markdown fences, no commentary

    outside the object, all strings double-quoted, dates in ISO 8601 where

    they appear. Required top-level keys: mapping, rules, gap_handling, invariants, reproducibility. The
    consuming pipeline

    hard-fails on missing keys, extra keys beyond a single optional "notes"

    field, wrong value types, or unparseable JSON. There is no partial

    credit: the artifact either parses and validates or it is an incident.


    QUALITY BAR: a domain reviewer will spot-check three specific claims

    or computations against the raw material supplied above; every number

    must be exactly reproducible and every judgement must name its basis.

    Reviewers have been asked to reject artifacts that hedge, that paper

    over gaps in the supplied material, or that resolve ambiguity silently

    instead of stating the interpretation they chose.'
  expected_schema:
    type: object
    required:
    - mapping
    - rules
    - gap_handling
    - invariants
    - reproducibility
    properties:
      mapping:
        type: string
      rules:
        type: string
      gap_handling:
        type: string
      invariants:
        type: string
      reproducibility:
        type: string
    optional:
    - notes
    - status
    - version
  output_contract: Single JSON object, no fences or commentary. Required top-level keys per contract section;
    parser hard-fails on missing keys, wrong types, or extra keys beyond the optional notes field.
failure:
  class: F4-persist
  injection_profile:
    attempts_failed:
    - 1
    - 2
    - 3
    notes: Failure signature persists across all three attempts, each heal trading one defect for another;
      the attempt budget exhausts and the workflow records final_fail with an escalation note.
  signals:
  - truncated_output
  - unsupported_claims
  - missing_contract_fields
expected:
  final: final_fail
  path:
  - attempt
  - classify
  - heal_replan
  - attempt
  - classify
  - heal_replan
  - attempt
  - classify
  - final_fail
  - report
  attempts_to_success: null
oracle:
  llm_calls:
    worker: 3
    heavy: 2
    judge: 0
  gate_flags:
