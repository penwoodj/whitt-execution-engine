case_id: rea-b03
difficulty: medium
domain: multistep-arithmetic
prompt: 'A SaaS had 520 paying users in January. It gained 45 new users, lost 78

  to churn, then ran a win-back campaign recovering 30. What is the

  current user count? At $9 per user per month, what is the new monthly

  revenue? Answer both in one short paragraph.

  '
draft_response: The SaaS currently has 517 paying users, calculated by starting with 520, adding 45 new
  users to reach 565, subtracting 78 churned users to drop to 487, and finally recovering 30 from the
  win-back campaign. At $9 per user per month, this results in a new monthly revenue of $4,653.
auxiliary: '520 + 45 = 565. 565 - 78 = 487. 487 + 30 = 517 users. Revenue:

  517 x $9 = $4653 per month.

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - '517'
    - $4653
    forbidden_phrases:
    - I cannot
    - as an AI
    max_words: 90
