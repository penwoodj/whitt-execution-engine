case_id: rea-b24
difficulty: medium
domain: checklist-tracking
prompt: 'List the four release gates in order, one dash-prefixed bullet per gate (no asterisks), in the
  exact form ''gatename: descriptor'' (colon separated, no parentheses): the 5% traffic stage, the pre-prod
  environment stage, the full

  traffic stage, and the post-incident learning doc.

  '
draft_response: '- canary: 5% traffic stage

  - staging: pre-prod environment stage

  - production: full traffic stage

  - postmortem: post-incident learning doc'
auxiliary: 'Gates in order: canary (5% traffic), staging (pre-prod), production

  (100% rollout), postmortem (post-incident learning doc).

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - 'canary: 5% traffic'
    - 'staging: pre-prod'
    - 'production: 100% rollout'
    - 'postmortem: learning doc'
    forbidden_phrases:
    - I cannot
    - as an AI
    - '*'
    bullet_count_min: 4
    bullet_count_max: 4
    max_words: 70
