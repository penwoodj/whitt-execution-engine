case_id: rea-b33
difficulty: medium
domain: unit-conversion
prompt: 'A dataset of 2.5 TB must replicate to storage nodes of 512 GB each.

  How many nodes are required? Also convert the 40 Gbps backbone to

  GB/s. Two sentences, exact values.

  '
draft_response: Five storage nodes are required, as replicating 2,560 GB across nodes of 512 GB each results
  in exactly five nodes. The backbone speed converts to an exact value of 5 GB/s when 40 Gbps is divided
  by 8 bits per byte.
auxiliary: '2.5 TB = 2560 GB. 2560 / 512 = 5 nodes. 40 Gbps = 40 / 8 = 5 GB/s.

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - 5 nodes
    - 5 GB/s
    forbidden_phrases:
    - I cannot
    - as an AI
    - approximately
    max_words: 30
