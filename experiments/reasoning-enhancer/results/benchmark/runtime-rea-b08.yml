case_id: rea-b08
difficulty: medium
domain: incident-triage
prompt: 'The gateway is returning 502s. From the log facts, state in one short

  paragraph: the failing dependency, the cache event causing it, and the

  fix.

  '
draft_response: The failing dependency is auth-svc's memcached instance, which experienced an eviction
  storm immediately following a deployment that expanded the working set, causing the cache hit ratio
  to plummet from 96% to 11%. The fix involves increasing memcached memory allocation to 2GB and flushing
  the token cache.
auxiliary: 'Log facts: gateway 502 spike 11:04-11:09 traced to auth-svc token

