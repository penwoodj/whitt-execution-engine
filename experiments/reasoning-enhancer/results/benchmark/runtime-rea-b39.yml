case_id: rea-b39
difficulty: hard
domain: structured-output
prompt: 'Emit the API pagination envelope as a JSON object with exactly these

  fields: "page", "per_page", "total", "total_pages", "has_next",

  "last_page_items", "first_page_url". Page 12 of a 238-item collection

  at 7 per page; derive last_page_items (items on the final page) and

  build first_page_url from the URL pattern in the source material. Output only the JSON object, no prose.

  '
draft_response: '{"page":12,"per_page":7,"total":238,"total_pages":34,"has_next":true,"last_page_items":[235,236,237],"first_page_url":"/items?page=1"}'
auxiliary: 'Collection: 237 items. Page size: 7 (all pages full except the last,

  which holds the remainder). URL pattern: /items?page=N (first page 1).

  Derive total_pages, has_next, and last_page_items yourself.

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - '"page": 12'
    - '"total": 237'
    - '"total_pages": 33'
    - '"has_next": true'
    - '"last_page_items": 6'
    - '"first_page_url": "/items?page=1"'
    forbidden_phrases:
    - I cannot
    - as an AI
    - '```'
    yaml_parsable: true
    max_words: 35
