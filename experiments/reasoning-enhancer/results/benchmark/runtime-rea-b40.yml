case_id: rea-b40
difficulty: hard
domain: structured-output
prompt: 'Emit the throttling error body as a JSON object with exactly these

  fields: "code", "retry_after_s", "scope". The uploader hit the rate

  limit for 30 seconds on the uploads scope, HTTP 429. Output only the

  JSON object, no prose, no code fences.

  '
draft_response: '{"code": 429, "retry_after_s": 30, "scope": "uploads"}'
auxiliary: 'The limit applies per API key, not per IP. Contract (exact):

  {"code": 429, "retry_after_s": 30, "scope": "uploads", "granularity": "per_api_key"}

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - '"code": 429'
    - '"retry_after_s": 30'
    - '"scope": "uploads"'
    - '"granularity": "per_api_key"'
    forbidden_phrases:
    - I cannot
    - as an AI
    - '```'
    - sure
    yaml_parsable: true
    max_words: 35
