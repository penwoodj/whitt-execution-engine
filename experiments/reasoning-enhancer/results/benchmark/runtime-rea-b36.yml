case_id: rea-b36
difficulty: medium
domain: percentage-ratio
prompt: 'The CDN served 48,000 requests with an 87.5% hit ratio. Report the

  exact number of cache hits, the number of misses, and the hit

  percentage. Exact numbers, 2-3 sentences.

  '
draft_response: The CDN recorded exactly 42,000 cache hits out of 48,000 total requests, resulting in
  6,000 misses. The hit percentage remains precisely 87.5% as reported in the source data.
auxiliary: 'Hits = 87.5% x 48000 = 42,000. Misses = 48000 - 42000 = 6,000.

  Hit ratio 87.5%.

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - 42,000
    - 6,000
    - 87.5%
    forbidden_phrases:
    - I cannot
    - as an AI
    - roughly
    - exactly
    max_words: 70
