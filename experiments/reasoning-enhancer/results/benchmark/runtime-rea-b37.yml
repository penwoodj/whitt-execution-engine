case_id: rea-b37
difficulty: medium
domain: edge-case
prompt: 'A customer''s order was cancelled and rebooked, so the cart is now

  EMPTY. Compute the final invoice: items subtotal, the $4.99 flat

  shipping fee, and the order total. State explicitly that the item

  count is zero. Exact amounts.

  '
draft_response: "**Item Count:** 0  \n**Items Subtotal:** $0.00  \n**Shipping Fee:** $4.99  \n**Order\
  \ Total:** $4.99"
auxiliary: 'Cart is empty: 0 items, items subtotal $0.00. Shipping flat fee

  $4.99 still applies (non-refundable booking hold). Total = $0.00 +

  $4.99 = $4.99.

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - $0.00
    - $4.99
    - zero items
    forbidden_phrases:
    - I cannot
    - as an AI
    min_words: 15
    max_words: 70
