case_id: rea-b12
difficulty: hard
domain: runbook-planning
prompt: 'Write a 5-step TLS certificate rotation runbook. Must include issuing

  via ACME, OCSP stapling update, and a 24-hour monitor step with an

  explicit rollback path to the previous certificate. One bullet per

  step.

  '
draft_response: '1. Issue a new certificate via ACME to replace the one expiring in 7 days, then immediately
  deploy it to all edge nodes while ensuring OCSP stapling is configured on the new cert.

  2. Verify successful deployment across edge nodes and confirm that OCSP stapling is actively serving
  responses without external dependency latency.

  3. Initiate a strict 24-hour monitoring window specifically tracking TLS handshake errors to detect
  any client compatibility issues with the new certificate chain.

  4. If handshake error rates exceed the threshold of 0.1% of total requests during the monitoring period,
  immediately trigger the rollback path by reinstalling the previous valid certificate.

  5. Upon successful completion of the 24-hour window or a confirmed safe rollback, archive the old certificate
  and update rotation logs to mark the new cert as active baseline.'
auxiliary: 'Rotation facts: cert expires in 7 days. Steps: issue new cert via ACME,

  deploy to edge nodes, update OCSP stapling, monitor 24 hours for

  handshake errors, then archive old cert. Rollback: reinstall previous

  certificate if handshake errors exceed 0.1% of requests.

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - ACME
    - stapling
    - 24 hours
    - rollback
    forbidden_phrases:
    - I cannot
    - as an AI
    bullet_count_min: 5
    bullet_count_max: 5
    max_words: 140
