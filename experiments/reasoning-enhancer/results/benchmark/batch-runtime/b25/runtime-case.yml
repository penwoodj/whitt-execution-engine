case_id: rea-b25
difficulty: medium
domain: format-discipline
prompt: "Report the cache tier numbers \u2014 hit ratio 94.2%, eviction count 1,204,\nmean item age 8\
  \ minutes \u2014 plus the cache name from the source material,\nas EXACTLY four dash-prefixed bullets\
  \ (no asterisks), one\nmetric per bullet in the exact form 'name: value' (colon separated),\nno intro,\
  \ no outro, no other text.\n"
draft_response: '- hit ratio: 94.2%

  - eviction count: 1,204

  - mean item age: 8 minutes

  - cache name: edge-primary'
auxiliary: 'Metrics: hit ratio 94.2%; eviction count 1,204; mean item age 8

  minutes. Cache name: edge-primary.

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - 'hit ratio: 94.2%'
    - 'eviction count: 1,204'
    - 'mean item age: 8 minutes'
    - 'cache: edge-primary'
    forbidden_phrases:
    - I cannot
    - as an AI
    - here is
    - report
    - '*'
    bullet_count_min: 4
    bullet_count_max: 4
    max_words: 20
