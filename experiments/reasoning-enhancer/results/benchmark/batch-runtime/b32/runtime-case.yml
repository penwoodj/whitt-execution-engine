case_id: rea-b32
difficulty: hard
domain: comparison
prompt: 'The vendor invoice and our purchase order disagree. Output exactly two

  bullets: the quantity discrepancy line and the price discrepancy line,

  each with both values.

  '
draft_response: '*   **Quantity discrepancy line:** PO 200 units vs invoice 180 units (short 20)

  *   **Price discrepancy line:** PO $8.25/unit vs invoice $8.75/unit (over $0.50)'
auxiliary: 'Purchase order: 200 units at $8.25 each. Vendor invoice: 180 units at

  $8.75 each. Quantity: PO 200 vs invoice 180 (short 20). Price: PO

  $8.25 vs invoice $8.75 (over $0.50).

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - '200'
    - '180'
    - '8.25'
    - '8.75'
    forbidden_phrases:
    - I cannot
    - as an AI
    - /unit
    - per unit
    bullet_count_min: 2
    bullet_count_max: 2
    max_words: 50
