case_id: rea-b21
difficulty: hard
domain: prioritization
prompt: "Rank these four alerts for the on-call queue, most urgent first, one\ndash-prefixed bullet per\
  \ alert (no asterisks) severity tag FIRST, then a colon, then the alert name \u2014 like SEV-1: replica\
  \ data-loss: replica data-loss (SEV-1),\nAPI auth bypass report (SEV-1), search latency p99 +200ms (SEV-3),\n\
  dashboard staleness (SEV-4). Data-loss outranks the security report.\n"
draft_response: '- - SEV-1: replica data-loss: replica data-loss

  - - SEV-1: API auth bypass report (SEV-1)

  - - SEV-3: search latency p99 +200ms (SEV-3)

  - - SEV-4: dashboard staleness (SEV-4)'
auxiliary: 'Ranking rules: data-loss SEV-1 first (irreplaceable data at risk),

  auth bypass SEV-1 second, latency SEV-3 third, dashboard staleness

  SEV-4 last.

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - 'SEV-1: replica data-loss'
    - 'SEV-1: API auth bypass'
    - 'SEV-3: search latency'
    - 'SEV-4: dashboard staleness'
    forbidden_phrases:
    - I cannot
    - as an AI
    - '*'
    - (description)
    - dash-
    bullet_count_min: 4
    bullet_count_max: 4
    max_words: 20
