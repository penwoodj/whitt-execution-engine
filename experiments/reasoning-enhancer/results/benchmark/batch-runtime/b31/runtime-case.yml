case_id: rea-b31
difficulty: hard
domain: comparison
prompt: "Diff the BEFORE and AFTER service configs in the source material.\nOutput ONLY the changed settings\
  \ as bullets, one per changed setting,\nin the exact form 'name: old -> new' with bare numbers \u2014\
  \ no units\n(like: timeout: 30 -> 60). Lines that merely moved or reformat are NOT\nchanges. End with\
  \ one summary line in the exact form\n'changed N of M settings' where N = changed settings and M = total\n\
  distinct setting names.\n"
draft_response: '- timeout: 30 -> 60

  - retries: 2 -> 5

  changed 2 of 7 settings'
auxiliary: "BEFORE:\n  workers = 4\n  timeout = 30\n  retries = 2\n  pool = 20\n  log_level = warn\n \
  \ region = eu-west-1\n  zones = a,b,c\n  drift = off\nAFTER:\n  workers = 4\n  pool = 20\n  timeout\
  \ = 60\n  retries = 5\n  log_level    =    warn\n  region = eu-west-1\n  zones = c,a,b\n  drift = off\n\
  Policy: reordering of lines and whitespace reformatting are NOT\nchanges; reordered list values (zones)\
  \ are NOT changes. Only true\nvalue changes: timeout 30 -> 60 and retries 2 -> 5.\n"
success_criteria:
  deterministic_checks:
    contains_required:
    - 'timeout: 30 -> 60'
    - 'retries: 2 -> 5'
    - changed 2 of 8 settings
    forbidden_phrases:
    - pool
    - I cannot
    - as an AI
    bullet_count_min: 2
    bullet_count_max: 2
    max_words: 25
