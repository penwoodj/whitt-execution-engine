case_id: rea-b11
difficulty: hard
domain: runbook-planning
prompt: 'Write a 6-step runbook for Sunday''s database migration. Must include a

  pre-migration snapshot step and a row-count verification step, plus the

  rollback trigger: replication lag above 5 seconds. One bullet per step,

  action first.

  '
draft_response: "1. Notify on-call team of Sunday 02:00 v14 schema cutover schedule to initiate pre-migration\
  \ preparations.  \n2. Take a snapshot of the primary database before running migration to establish\
  \ baseline for row-count verification.  \n3. Execute the v14 schema migration during the window while\
  \ monitoring replication lag against the 5-second rollback trigger threshold.  \n4. Verify that post-migration\
  \ row counts match the pre-snapshot values to ensure data integrity before resuming full replication.\
  \  \n5. Resume normal replication flow and close the incident ticket only after confirming stable connectivity\
  \ and zero active rollback triggers."
auxiliary: 'Migration facts: v14 schema cutover Sunday 02:00. Required order:

  notify on-call, snapshot primary, run migration, verify row counts

  match snapshot, resume replication, close incident. Rollback trigger:

  replication lag above 5 seconds at any point.

  '
success_criteria:
  deterministic_checks:
    contains_required:
    - snapshot
    - row count
    - 5 seconds
    - rollback
    forbidden_phrases:
    - I cannot
    - as an AI
    bullet_count_min: 6
    bullet_count_max: 6
    max_words: 80
