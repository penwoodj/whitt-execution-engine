# ══════════════════════════════════════════════════════════════════
# REA BENCHMARK BASELINE — 9B direct answer, no scaffold
# ══════════════════════════════════════════════════════════════════
#
# Purpose: produce the "9B on its own" draft for every benchmark case.
# One LLM step: task + source material + "answer directly". No roles,
# no rubric, no decomposition, no memory — the enhancer's entire
# scaffold is withheld. Output feeds run-benchmark.py, which re-checks
# it against the case checks (must FAIL) and injects it as the
# draft_response for the enhancer run (must PASS).
# 9B allowed here by design (validate-rea.py --allow-9b); the enhancer
# itself never uses 9B (v8 learning 3).
# ══════════════════════════════════════════════════════════════════
workflow_id: rea_baseline_9b
name: "REA Benchmark Baseline — 9B Direct"
description: "Single 9B inference answering the task directly; no enhancement scaffold. Produces the benchmark draft."
version: "1.0.0"
author: "Whitt Execution Engine"
tags: [benchmark, baseline, 9b]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config: { host: localhost, port: 8080 }

models:
  "baseline_model":
    name: "Qwen3-5-9B-Q4_K_M"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.7, max_tokens: 500 }

workflow_execution_strategy:
  memory: { model_lifecycle: { unload_unused: true } }

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07/last-run.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:

    step_01_answer:
      generative_entity: "${models.baseline_model}"
      prompt: |
        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.7, max_tokens: 500 }
      when:
        before_step_starts:
          - shell:
              command: "python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/scripts/emit-case.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/cases/benchmark/case-b07.yml --run-dir /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07 --phase baseline --out /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07/baseline-prompt.txt; EXIT=$?; echo $EXIT > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07/baseline-prompt.exit; exit $EXIT"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - $text_state
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07/baseline-answer.txt"

    step_99_finalize:
      generative_entity: "${models.baseline_model}"
      prompt: "OK."
      model_overrides: { temperature: 0.0, max_tokens: 3 }
      when:
        before_step_starts:
          - shell:
              command: "python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/scripts/check-answer.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/cases/benchmark/case-b07.yml --text-file /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07/baseline-answer.txt --out /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07/check-baseline.json > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07/check-baseline.log 2>&1; EXIT=$?; echo $EXIT > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07/check-baseline.exit; exit $EXIT"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: false
          - skip_step: true
        after_step_succeeds:
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/20260814-214214-rea-b07/summary.log"
              event_fields: [workflow_id, total_steps]
              level: info
