case_id: rea-106
difficulty: medium
domain: handoff-summary
prompt: |
  Write an on-call handoff note for the search-index incident. Cover all
  three incident facts and the next action, in at most 50 words.
draft_response: |
  The search system was having some problems earlier today where results
  were taking a long time to show up. We spent a while investigating and
  it seems like it could be related to disk performance somewhere in the
  cluster. Things look mostly better at this point, but it would be good
  if somebody keeps watching it overnight in case the same slowdown comes
  back again later.
auxiliary: |
  Incident facts: (1) index replicas lag 40 minutes behind primary since
  09:14. (2) cause identified: disk saturation on node-7 at 98%. (3)
  mitigation applied: index writes throttled to 60%. Next action: replace
  the node-7 disk in tomorrow's maintenance window, ticket SR-4821.
success_criteria:
  deterministic_checks:
    contains_required: ["node-7", "throttled", "SR-4821"]
    forbidden_phrases: ["I cannot", "as an AI"]
    max_words: 50
  reference_notes: |
    Small-model handoff failure: zero incident facts (no node-7, no
    throttling, no ticket), vague reassurance, over word budget (66 words).
    A handoff without facts forces the next on-call to re-derive everything.
