case_id: rea-002
difficulty: easy
domain: formatting
prompt: |
  Give exactly 3 bullet points naming the three branches of the United States
  federal government, one branch per bullet, with a one-sentence intro before
  the bullets and nothing else.
draft_response: |
  The US federal government divides power among branches.
  - Congress, which makes laws
  - The President, who enforces laws
  Courts also interpret laws sometimes.
auxiliary: |
  Branches: Legislative (Congress), Executive (President), Judicial (Supreme
  Court and federal courts).
success_criteria:
  deterministic_checks:
    contains_required: ["Legislative", "Executive", "Judicial"]
    forbidden_phrases: ["I cannot", "as an AI"]
    min_words: 12
    max_words: 150
    bullet_count_min: 3
    bullet_count_max: 3
  reference_notes: |
    Draft fails bullet count (2 dashes, trailing prose line) and omits the
    word Judicial. Trailing non-bullet sentence is the classic small-model
    format drift.
