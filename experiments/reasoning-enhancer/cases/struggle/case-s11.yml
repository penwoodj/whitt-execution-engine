case_id: rea-s11
difficulty: medium
domain: copy-fidelity
struggle_hypothesis: "Small models paraphrase when asked to transcribe verbatim (live: 9B rewrites config values/key order)."
prompt: |
  Reproduce the config block below VERBATIM — same keys, same values, same order. Nothing added, removed, or reformatted.

auxiliary: |
  pool_size: 20
  timeout_s: 45
  log_level: warn
  retries: 3

draft_response: "PLACEHOLDER"

success_criteria:
  deterministic_checks:
    contains_required: ['pool_size: 20', 'timeout_s: 45', 'log_level: warn', 'retries: 3']
    forbidden_phrases: ['info', 'debug']
    max_words: 12
