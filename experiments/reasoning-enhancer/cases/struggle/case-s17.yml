case_id: rea-s17
difficulty: hard
domain: allocation-no-restate
struggle_hypothesis: "Any prose restatement of an allocated total double-counts it in checks; discipline requires stating each value once (live b01)."
prompt: |
  Allocate a $900 quarterly budget: line a gets exactly 25% of the budget; line b is fixed at $375; line c gets the remainder. List each line with its amount. NEVER state the total budget figure anywhere, and never repeat an amount.

auxiliary: |
  25% of 900 = 225 for a. b = 375. c = 900 - 225 - 375 = 300.

draft_response: "PLACEHOLDER"

success_criteria:
  deterministic_checks:
    contains_required: ['$225', '$375', '$300']
    forbidden_phrases: ['$900']
    numbers_must_sum_to: 900
    max_words: 40
