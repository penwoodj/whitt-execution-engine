case_id: rea-s06
difficulty: medium
domain: negation-filtering
struggle_hypothesis: "Negated selection ('did NOT') inverts to positive selection at small scale."
prompt: |
  From the restart log, list ONLY the services that did NOT restart, one per dash-prefixed bullet, service names only.

auxiliary: |
  Restart log: auth restarted at 02:10; billing skipped restart (no restart); search skipped restart (no restart); mail restarted at 02:14.

draft_response: "PLACEHOLDER"

success_criteria:
  deterministic_checks:
    contains_required: ['billing', 'search']
    forbidden_phrases: ['auth', 'mail']
    bullet_count_min: 2
    bullet_count_max: 2
    max_words: 10
