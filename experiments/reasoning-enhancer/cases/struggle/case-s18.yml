case_id: rea-s18
difficulty: medium
domain: empty-set-wording
struggle_hypothesis: "Zero-item edge: small models write the digit where the contract demands the word form (live b37: 9B wrote '0 items')."
prompt: |
  A customer's cart is empty. State the item count using the WORD for zero, then give the order total as the flat $5.99 shipping fee. One sentence.

auxiliary: |
  Cart: 0 items. Shipping fee: $5.99. Total: $5.99.

draft_response: "PLACEHOLDER"

success_criteria:
  deterministic_checks:
    contains_required: ['zero items', '$5.99']
    forbidden_phrases: ['0 items']
    max_words: 30
