case_id: rea-103
difficulty: medium
domain: metrics-analysis
prompt: |
  From this week's latency report, state in 2-3 sentences: how much p99
  latency rose, the current error rate, and the remaining capacity
  headroom.
draft_response: |
  Latency worsened significantly this week, with p99 climbing by nearly
  double digits. Errors affected roughly four percent of traffic, which is
  concerning. The service appears to have plenty of capacity left and no
  headroom concerns at all.
auxiliary: |
  Metrics: p99 latency went 82ms to 96ms, a rise of 14ms (17%). Error
  rate: 42 failures out of 10,000 requests = 0.42%. Peak load 6,000 rps
  against a 9,000 rps ceiling, so headroom is 33%.
success_criteria:
  deterministic_checks:
    contains_required: ["14ms", "0.42%", "33%"]
    forbidden_phrases: ["I cannot", "as an AI", "appears to"]
    max_words: 100
  reference_notes: |
    Small-model quantification failure: vague comparatives ("nearly double
    digits", "roughly four percent") instead of exact values (14ms, 0.42%,
    33%), plus unfounded reassurance.
