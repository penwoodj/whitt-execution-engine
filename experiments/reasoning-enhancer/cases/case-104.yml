case_id: rea-104
difficulty: hard
domain: runbook-planning
prompt: |
  Write a 5-step deployment runbook for Friday's payments release. Include
  a canary step at 5% of traffic and an explicit rollback trigger. One
  bullet per step, action first.
draft_response: |
  - Deploy the new version to production
  - Monitor for issues after deployment
  - Tell the team the release is done
auxiliary: |
  Release facts: version 2.14.0 ships Friday 10:00. Runbook must cover:
  preflight checks (migration dry-run, backups, error-budget baseline),
  canary deploy at 5% of traffic, 15-minute canary watch, staged full
  rollout, confirm + close. Rollback trigger: error rate above 1% or p99
  above 150ms during canary.
success_criteria:
  deterministic_checks:
    contains_required: ["5%", "rollback", "canary"]
    forbidden_phrases: ["I cannot", "as an AI"]
    bullet_count_min: 5
    bullet_count_max: 5
    min_words: 40
    max_words: 200
  reference_notes: |
    Small-model planning failure: 3 vague steps instead of 5, no canary
    percentage, no rollback trigger, no concrete actions.
