case_id: rea-006
difficulty: hard
domain: structured-output
prompt: |
  Output a YAML config for a backup job with these keys: name (string
  "nightly-backup"), interval_hours (6), retries (3), targets (a list of
  exactly two paths: /var/data and /etc/app), and checksum (true). Also
  compute retention_days as interval_hours multiplied by 28, divided by 2.
  Output ONLY the YAML, no explanation, no code fences.
draft_response: |
  name: nightly-backup
  interval_hours: 6
  retries: 3
  targets: /var/data and /etc/app
  checksum: true
  retention_days: 86
auxiliary: |
  retention_days = 6 * 28 / 2 = 84. The second list item must align with the
  first (two spaces of indentation under targets).
success_criteria:
  deterministic_checks:
    contains_required: ["84", "interval_hours", "retention_days", "/var/data", "/etc/app"]
    forbidden_phrases: ["I cannot", "as an AI", "```"]
    min_words: 8
    max_words: 120
    bullet_count_min: 2
    bullet_count_max: 2
    yaml_parsable: true
  reference_notes: |
    Draft: list flattened to a prose string (0 bullets vs 2 required) and
    retention_days computed as 86 (6*29/2 style drift) instead of 84. Two
    independent failure classes: structure + arithmetic.
