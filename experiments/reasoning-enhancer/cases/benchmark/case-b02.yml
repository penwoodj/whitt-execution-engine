case_id: rea-b02
difficulty: medium
domain: constraint-arithmetic
prompt: |
  A platform team has 160 engineering hours per week. Dev gets the largest
  allocation that does not exceed 45% of hours; QA is fixed at 35 hours;
  operations receives the remainder. State each allocation in hours, one
  per line. Do not restate the weekly total anywhere.
draft_response: "PLACEHOLDER"
auxiliary: |
  Weekly total: 160 hours. Dev cap: 45% of 160 = 72 hours. QA: exactly 35
  hours. Operations: 160 - 72 - 35 = 53 hours.
success_criteria:
  deterministic_checks:
    contains_required: ["72 hours", "35 hours", "53 hours"]
    forbidden_phrases: ["I cannot", "as an AI", "however"]
    max_words: 60
    numbers_must_sum_to: 160
