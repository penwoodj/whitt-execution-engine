case_id: rea-b31
difficulty: hard
domain: comparison
prompt: |
  Diff the BEFORE and AFTER service configs in the source material.
  Output ONLY the changed settings as bullets, one per changed setting,
  in the exact form 'name: old -> new' with bare numbers — no units
  (like: timeout: 30 -> 60). Lines that merely moved or reformat are NOT
  changes. End with one summary line in the exact form
  'changed N of M settings' where N = changed settings and M = total
  distinct setting names.
draft_response: "PLACEHOLDER"
auxiliary: |
  BEFORE:
    workers = 4
    timeout = 30
    retries = 2
    pool = 20
    log_level = warn
    region = eu-west-1
    zones = a,b,c
    drift = off
  AFTER:
    workers = 4
    pool = 20
    timeout = 60
    retries = 5
    log_level    =    warn
    region = eu-west-1
    zones = c,a,b
    drift = off
  Policy: reordering of lines and whitespace reformatting are NOT
  changes; reordered list values (zones) are NOT changes. Only true
  value changes: timeout 30 -> 60 and retries 2 -> 5.
success_criteria:
  deterministic_checks:
    contains_required: ["timeout: 30 -> 60", "retries: 2 -> 5", "changed 2 of 8 settings"]
    forbidden_phrases: ["pool", "I cannot", "as an AI"]
    bullet_count_min: 2
    bullet_count_max: 2
    max_words: 25
