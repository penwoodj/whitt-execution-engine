case_id: rea-b10
difficulty: medium
domain: metrics-analysis
prompt: |
  Peak traffic runs 4,200 rps against a provisioned capacity of 7,000
  rps. Report exact utilization percent, exact headroom percent, and the
  rps value at which headroom reaches zero. 2-3 sentences, exact numbers.
draft_response: "PLACEHOLDER"
auxiliary: |
  Utilization = 4200 / 7000 = 60%. Headroom = 2800 / 7000 = 40%.
  Headroom zero at 7000 rps (full capacity).
success_criteria:
  deterministic_checks:
    contains_required: ["60%", "40%", "7000 rps"]
    forbidden_phrases: ["I cannot", "as an AI", "roughly", "nearly"]
    max_words: 90
