case_id: rea-b04
difficulty: medium
domain: multistep-arithmetic
prompt: |
  A doc bundle has 15 chapters of 22 pages each plus a 19-page appendix.
  It must be proofed in sessions of 9 pages. How many pages total, how
  many full sessions, and how many pages in the final partial session?
  Answer in 15 to 30 words, full sentences, no semicolons.
draft_response: "PLACEHOLDER"
auxiliary: |
  15 x 22 = 330. 330 + 19 = 349 pages. 349 / 9 = 38 sessions remainder 7
  (38 x 9 = 342, 349 - 342 = 7). So 38 full sessions plus a final partial
  session of 7 pages.
success_criteria:
  deterministic_checks:
    contains_required: ["The bundle has", "38 full sessions", "final partial session", "7 pages"]
    forbidden_phrases: ["I cannot", "as an AI", ";"]
    max_words: 30
    min_words: 15
