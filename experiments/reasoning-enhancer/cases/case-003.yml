case_id: rea-003
difficulty: medium
domain: constraint-arithmetic
prompt: |
  Allocate a $1200 monthly budget across three lines: servers, licenses, and
  monitoring. Rules: spend the LARGEST valid amount on servers that does not
  exceed 40% of the total budget; licenses cost exactly $300; whatever remains
  goes to monitoring. List each line with its dollar amount, then state in
  words (without digits) that the three lines use the full budget. Never
  restate the total budget figure anywhere in the answer.
draft_response: |
  Here is the allocation: servers $600, licenses $300, monitoring $300. The
  three amounts sum to $1200 as required. Servers get the largest share at
  half the budget, monitoring covers the remainder after the fixed license
  cost, and this keeps spending within the monthly total.
auxiliary: |
  Budget total: $1200. Server cap: 40% of 1200 = $480. Licenses: exactly $300.
  Monitoring: 1200 - 480 - 300 = $420.
success_criteria:
  deterministic_checks:
    contains_required: ["$480", "$300", "$420", "full budget"]
    forbidden_phrases: ["I cannot", "as an AI"]
    max_words: 300
    bullet_count_min: 0
    bullet_count_max: 0
    numbers_must_sum_to: 1200
  reference_notes: |
    Draft violates the 40% cap (picks $600 = 50%) and never checks the cap
    rule; sums still total 1200, so the sum gate passes and only the
    contains checks catch it. Reference: servers $480, licenses $300,
    monitoring $420.
