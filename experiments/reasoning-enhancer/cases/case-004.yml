case_id: rea-004
difficulty: medium
domain: multistep-arithmetic
prompt: |
  A warehouse has 14 pallets. Each pallet holds 24 boxes. 12 boxes are damaged
  and removed. The remaining boxes are packed into cartons of 6 boxes each.
  How many cartons are filled? If 10 cartons are then shipped out, how many
  cartons remain on site? Answer in a short paragraph showing the steps.
draft_response: |
  14 pallets with 24 boxes each is 336 boxes. After removing the 12 damaged
  ones, 324 boxes remain. Packing into cartons of 6 gives 55 cartons because
  324 divided by 6 is 55. Shipping 10 cartons leaves 45 cartons on site, so
  the answer is 55 and 45. If that helps, let me know if you need anything
  else for this warehouse question.
auxiliary: |
  14 x 24 = 336. 336 - 12 = 324. 324 / 6 = 54. 54 - 10 = 44.
success_criteria:
  deterministic_checks:
    contains_required: ["54 cartons", "44 cartons"]
    forbidden_phrases: ["I cannot", "as an AI", "let me know"]
    min_words: 25
    max_words: 250
    bullet_count_min: 0
    bullet_count_max: 0
  reference_notes: |
    Draft divides wrong (324/6 = 55 instead of 54) and propagates the error
    (45 instead of 44). Classic small-model arithmetic drift: setup correct,
    one division slips, downstream numbers inherited.
