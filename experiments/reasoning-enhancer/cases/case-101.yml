case_id: rea-101
difficulty: medium
domain: incident-triage
prompt: |
  The payments-api service is failing. Read the incident log facts and
  state, in one short paragraph: the exact error, the failing component,
  and the fix.
draft_response: |
  The service appears to be having network issues. The error seems related
  to connectivity problems reaching the database. I would recommend
  checking the network configuration and firewall rules, and perhaps
  restarting the entire service if problems persist.
auxiliary: |
  Log facts: 14:02:11 payments-api ERROR pool exhausted — 30/30 connections
  held by tx 9f2a from refund-tx (stuck 4 minutes past timeout). 14:02:14
  retry storm begins. Root cause: leak in refund-tx holding pool
  connections past timeout. Fix: restart the worker to release stuck pool
  connections, then raise the pool timeout to 30 seconds.
success_criteria:
  deterministic_checks:
    contains_required: ["pool", "refund-tx", "restart the worker"]
    forbidden_phrases: ["I cannot", "as an AI", "appears to be"]
    max_words: 90
  reference_notes: |
    Typical small-model triage failure: generic network advice instead of
    the specific error (pool exhaustion), component (refund-tx), and fix
    (restart the worker) — all stated in the log facts.
