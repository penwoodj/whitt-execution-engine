case_id: rea-105
difficulty: hard
domain: integration-payload
prompt: |
  The billing sync needs a status payload as a JSON object with exactly
  these fields: "status", "failed_count", "retried_at_epoch". Compute them
  from the run log. Output only the JSON object.
draft_response: |
  Sure, here is the payload you asked for — hope this helps!
  {"status": "partial", "failed_count": 12, "retried_at_epoch": 1432}
auxiliary: |
  Run log: 3,204 records synced, 12 failed, all 12 retried at 14:32:00 UTC
  (epoch 1786744320) and succeeded. Final state: completed with no
  outstanding failures. Payload contract (exact):
  {"status": "completed", "failed_count": 0, "retried_at_epoch": 1786744320}
success_criteria:
  deterministic_checks:
    contains_required: ['"status": "completed"', '"failed_count": 0', "1786744320"]
    forbidden_phrases: ["I cannot", "as an AI", "hope this helps"]
    yaml_parsable: true
    max_words: 60
  reference_notes: |
    Small-model payload failures: prose preamble, wrong status ("partial"
    vs "completed"), failed_count not reconciled (12 retried succeeded → 0
    outstanding), epoch mangled (1432 vs 1786744320).
