case_id: rea-102
difficulty: hard
domain: config-generation
prompt: |
  Write the YAML config for the ingest worker: listen on port 8443, retry
  failed uploads 4 times, timeout after 2500 ms, and enable compression.
  Output ONLY the YAML mapping, no prose, no code fences.
draft_response: |
  ```
  Here is the ingest worker config:
  listen-port: 8443
  retries: 4
  timeout: 2500
  compression: on
  ```
auxiliary: |
  Required mapping (exact keys and values):
  listen_port: 8443
  upload_retries: 4
  timeout_ms: 2500
  compression: enabled
success_criteria:
  deterministic_checks:
    contains_required: ["listen_port: 8443", "upload_retries: 4", "timeout_ms: 2500", "compression: enabled"]
    forbidden_phrases: ["I cannot", "as an AI", "```"]
    yaml_parsable: true
    max_words: 60
  reference_notes: |
    Small-model config failures: code fences around YAML, wrong key names
    (listen-port vs listen_port), wrong value forms (on vs enabled).
