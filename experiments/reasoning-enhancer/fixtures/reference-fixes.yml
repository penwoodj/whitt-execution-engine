  p99 latency rose from 82ms to 96ms, an increase of 14ms (17%). The
  current error rate is 0.42% — 42 failures out of 10,000 requests. Peak
  load runs at 6,000 rps against a 9,000 rps ceiling, leaving 33%
  capacity headroom.
