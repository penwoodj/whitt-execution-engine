# Reference fixes for REA cases. Contract (test-cases.py enforces):
# - reference for each case_id PASSES every deterministic check of its case
# - the case's draft_response FAILS at least one check
# These represent what a big model would answer; used by dry-run.py as the
# simulated "perfect synthesizer" output.
rea-001: |
  The bakery has 6 muffins left: it made 42 muffins (24 blueberry plus 18
  corn), sold 31 by noon, and a customer bought 5 more, so 42 minus 31 minus
  5 leaves 6 muffins. There are 6 more blueberry than corn muffins, because
  24 blueberry minus 18 corn equals a difference of 6.
rea-002: |
  The United States federal government separates power into three branches.
  - Legislative: Congress, which writes and passes laws
  - Executive: the President, who enforces the laws
  - Judicial: the Supreme Court and federal courts, which interpret the laws
rea-003: |
  Budget allocation: servers $480, licenses $300, and monitoring $420. The
  server line sits exactly at the 40% cap of the monthly budget, licenses are
  the fixed cost, and monitoring receives everything left over, so the three
  lines together use the full budget.
rea-004: |
  The warehouse starts with 14 pallets of 24 boxes, which is 336 boxes.
  Removing the 12 damaged ones leaves 324 boxes. Packed into cartons of 6,
  that fills 54 cartons, because 324 divided by 6 is 54. After 10 cartons
  ship out, 44 cartons remain on site. Each step uses the previous result,
  so the final counts depend on getting the division right: 54 cartons
  filled, 44 cartons remaining.
rea-005: |
  Bug tracker migration plan, one bullet per phase with owner and success
  criterion.
  - Audit: The Data Lead inventories every ticket, attachment, and custom
    field in the old tracker; success criterion is a signed-off count match
    against the live system.
  - Dry-run: The Migration Engineer copies all data into a staging instance;
    success criterion is a full-load run with zero import errors.
  - Execution: The Release Manager runs the production migration during the
    freeze window; success criterion is completion inside the window with no
    write conflicts.
  - Verification: The QA Lead diffs record counts and spot-checks samples in
    both systems; success criterion is 100% record parity on sampled fields.
  - Cutover: The Release Manager flips DNS and read-only access off on the
    old tool; success criterion is all teams filing new issues in the new
    tracker for a full day with no rollback request.
rea-006: |
  name: nightly-backup
  interval_hours: 6
  retries: 3
  targets:
    - /var/data
    - /etc/app
  checksum: true
  retention_days: 84
rea-101: |
  The payments-api is failing with a connection pool exhaustion error:
  30/30 pool connections are held by a refund-tx transaction (9f2a) stuck
  4 minutes past timeout, which then triggered a retry storm. The fix is
  to restart the worker to release the stuck pool connections, then raise
  the pool timeout to 30 seconds to prevent recurrence.
rea-102: |
  listen_port: 8443
  upload_retries: 4
  timeout_ms: 2500
  compression: enabled
