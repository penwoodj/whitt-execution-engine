# Generated by gen-batch-enhance.py — 1 benchmark cases, ONE run,
# TWO model loads (1.7B x50 decompose -> 4B x50 solve/synth(+r2 when
# r1 checks fail via gwt routing to the case's select step)).
workflow_id: rea_batch_enhance
name: "REA Batch Enhance — 50 Cases, 2 Loads"
description: "Phase-grouped enhance: all decomposes, all solves, then per-case r1/[r2]/select with early-exit routing."
version: "1.0.0"
author: "Whitt Execution Engine"
tags: [benchmark, enhance, batch]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config: { host: localhost, port: 8080 }

models:
  "decomposer":
    name: "Qwen3-1.7B-abliterated-q4_k_m"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.3, max_tokens: 300 }
  "sub_solver":
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.2, max_tokens: 500 }
  "synthesizer":
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.4, max_tokens: 500 }
  "synthesizer_r2":
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.7, max_tokens: 500 }

workflow_execution_strategy:
  memory: { model_lifecycle: { unload_unused: true } }

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/batch-summary.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    c04_dec:
      generative_entity: "${models.decomposer}"
      prompt: |
        ROLE: TASK DECOMPOSER — split the task into answerable sub-questions.

        LENS: The task is a checklist of facts and steps. Missing one = wrong answer.

        RECOGNIZE:
        - Numbers that must be derived (counts, sums, differences)
        - Multiple requirements bundled in one sentence
        - Constraints (budgets, limits, retention rules)
        - Required output format (bullets, YAML, fields)

        DECOMPOSE RULES:
        - One fact or one step per sub-question.
        - 3 to 5 sub-questions, together covering the WHOLE task.
        - Each answerable from the task + source material alone.

        {{bookmarks.shell_output.stdout}}

        RULES:
        - Output ONLY the JSON object. No preamble, no commentary.
      model_overrides: { temperature: 0.3, max_tokens: 300 }
      when:
        before_step_starts:
          - shell:
              command: "python3 __REPO_ROOT__/experiments/reasoning-enhancer/scripts/emit-case.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/runtime-case.yml --run-dir /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04 --phase decompose --out /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/decompose-prompt.txt; EXIT=$?; echo $EXIT > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/decompose-prompt.exit; exit $EXIT"
              working_dir: "__REPO_ROOT__"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - $text_state
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/subquestions.txt"
    c04_solve:
      generative_entity: "${models.sub_solver}"
      prompt: |
        ROLE: SUB-QUESTION SOLVER — answer each sub-question exactly.

        LENS: Each sub-question is independent. Derive, never guess.

        RECOGNIZE:
        - Arithmetic hidden in words (totals, differences, splits)
        - Unit and count precision
        - Answers traceable to source material
        - Sub-question ordering

        SOLVE RULES:
        - Derive numbers step by step; write only the result.
        - Show derived numbers as inline arithmetic (42 - 31 - 5 = 6).
        - Use ONLY the source material provided above.
        - Terse and exact — no reasoning narration.

        {{bookmarks.shell_output.stdout}}

        RULES:
        - One numbered answer line per sub-question, same numbering.
        - No preamble, no commentary, no restating questions.
      model_overrides: { temperature: 0.2, max_tokens: 500 }
      when:
        before_step_starts:
          - shell:
              command: "python3 __REPO_ROOT__/experiments/reasoning-enhancer/scripts/emit-case.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/runtime-case.yml --run-dir /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04 --phase solve --out /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/solve-prompt.txt; EXIT=$?; echo $EXIT > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/solve-prompt.exit; exit $EXIT"
              working_dir: "__REPO_ROOT__"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - $text_state
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/subanswers.txt"
    c04_r1:
      generative_entity: "${models.synthesizer}"
      prompt: |
        ROLE: ANSWER SYNTHESIZER — write the final deliverable.

        LENS: Sub-answers are authoritative; the draft is a suspect starting point.

        RECOGNIZE:
        - Open failures listed below — each is a concrete defect to fix
        - Draft numbers disagreeing with sub-answers
        - Missing requirements and format breaks
        - Forbidden phrases and meta-language

        SYNTH RULES:
        - Fix every open failure listed above.
        - Prefer the SUB-ANSWERS over the draft when they disagree.
        - Re-derive numbers from source when unsure.

        {{bookmarks.shell_output.stdout}}

        RULES:
        - Output the FULL final deliverable (complete text, not a diff).
        - The output IS the deliverable — never describe or announce it.
        - State each number or amount exactly once; never restate a value
          or mention any total.
        - Obey EVERY constraint in HARD OUTPUT RULES exactly, including
          word windows and character-exact strings.
        - First character must match the required output format.
        - No preamble. No commentary. No instructions.
      model_overrides: { temperature: 0.4, max_tokens: 500 }
      when:
        before_step_starts:
          - shell:
              command: "python3 __REPO_ROOT__/experiments/reasoning-enhancer/scripts/emit-case.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/runtime-case.yml --run-dir /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04 --phase toolverify --out /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/verify.json || true; EXIT=$?; echo $EXIT > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/toolverify.exit; exit $EXIT"
              working_dir: "__REPO_ROOT__"
              fail_on_error: false
          - shell:
              command: "python3 __REPO_ROOT__/experiments/reasoning-enhancer/scripts/emit-case.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/runtime-case.yml --run-dir /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04 --phase synthesize --round 1 --out /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/synthesize-r1-prompt.txt; EXIT=$?; echo $EXIT > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/synthesize-r1-prompt.exit; exit $EXIT"
              working_dir: "__REPO_ROOT__"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - $text_state
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/enhanced-answer-r1.txt"
          - shell:
              command: "python3 __REPO_ROOT__/experiments/reasoning-enhancer/scripts/check-answer.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/runtime-case.yml --text-file /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/enhanced-answer-r1.txt --out /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/check-r1.json > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/check-r1.log 2>&1; EXIT=$?; echo $EXIT > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/check-r1.exit; exit $EXIT"
              working_dir: "__REPO_ROOT__"
              fail_on_error: false
          - gwt:
              - given: "{bookmarks.shell_output.exit_code} == 0"
                then: c04_sel
    c04_r2:
      generative_entity: "${models.synthesizer_r2}"
      prompt: |
        ROLE: SKEPTICAL AUDITOR — re-derive, then write the deliverable.

        LENS: The prior attempt failed real checks. Distrust it completely.

        RECOGNIZE:
        - Each listed prior failure — the exact defect still to fix
        - Numbers the prior attempt got wrong
        - Requirements it skipped or answered partially
        - Meta-language, hedging, forbidden phrases

        AUDIT RULES:
        - Re-derive every number and fact from the source material yourself.
        - Verify counts and sums before writing.
        - Fix every listed failure.

        {{bookmarks.shell_output.stdout}}

        RULES:
        - Output the FULL final deliverable (complete text, not a diff).
        - The output IS the deliverable — never describe or announce it.
        - State each number or amount exactly once; never restate a value
          or mention any total.
        - Obey EVERY constraint in HARD OUTPUT RULES exactly, including
          word windows and character-exact strings.
        - First character must match the required output format.
        - No preamble. No commentary. No instructions. This is the final attempt.
      model_overrides: { temperature: 0.7, max_tokens: 500 }
      when:
        before_step_starts:
          - shell:
              command: "python3 __REPO_ROOT__/experiments/reasoning-enhancer/scripts/emit-case.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/runtime-case.yml --run-dir /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04 --phase synthesize --round 2 --out /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/synthesize-r2-prompt.txt; EXIT=$?; echo $EXIT > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/synthesize-r2-prompt.exit; exit $EXIT"
              working_dir: "__REPO_ROOT__"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - $text_state
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/enhanced-answer-r2.txt"
          - shell:
              command: "python3 __REPO_ROOT__/experiments/reasoning-enhancer/scripts/check-answer.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/runtime-case.yml --text-file /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/enhanced-answer-r2.txt --out /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/check-r2.json > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/check-r2.log 2>&1; EXIT=$?; echo $EXIT > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/check-r2.exit; exit $EXIT"
              working_dir: "__REPO_ROOT__"
              fail_on_error: false
    c04_sel:
      generative_entity: "${models.synthesizer}"
      prompt: "OK."
      model_overrides: { temperature: 0.0, max_tokens: 3 }
      when:
        before_step_starts:
          - shell:
              command: "python3 __REPO_ROOT__/experiments/reasoning-enhancer/scripts/format-repair.py --run-dir /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04 --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/runtime-case.yml || true; python3 __REPO_ROOT__/experiments/reasoning-enhancer/scripts/select-best.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/runtime-case.yml --run-dir /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04 > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/b04/select-best.log 2>&1 || true"
              working_dir: "__REPO_ROOT__"
              fail_on_error: false
          - skip_step: true
    step_99_finalize:
      generative_entity: "${models.synthesizer}"
      prompt: "OK."
      model_overrides: { temperature: 0.0, max_tokens: 3 }
      when:
        before_step_starts:
          - shell:
              command: "true"
              working_dir: "__REPO_ROOT__"
              fail_on_error: true
          - skip_step: true
        after_step_succeeds:
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/results/benchmark/batch-runtime/batch-summary.log"
              event_fields: [workflow_id, total_steps]
              level: info
