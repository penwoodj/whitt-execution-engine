prompt: 'you are on rotation tonight, residency duty, and the morning report only reads JSON.


  one 8 GB card, you schedule model residency through the night. a model loads only when free VRAM covers
  its size, otherwise you evict the least-recently-used unpinned model, repeatedly, until it fits or only
  pinned models remain. pinned models never evict and never unload. if only pinned remain and it still
  does not fit, the load defers, counted once per deferral attempt with ids collected. loads count loads,
  evictions count evictions, unloads happen only when explicitly commanded. start: A at 3 GB and pinned,
  B at 5 GB, both resident, B touched most recently. then, in order: need D at 6 GB, need E at 4 GB, unload
  E, need D at 6 GB again.


  for orientation only, a smaller card on a different night, different numbers, same shape: a 7 GB card
  held A at 2.5 pinned and B at 4.5, a 5.5 need evicted B for 4.5 free, still short with A pinned, deferred
  once, and a 1.5 model later loaded clean into the gap. one load, one eviction, one deferral. pinned
  blocks are the trap, and the gap left after an eviction is the second trap, evicting is not the same
  as fitting.


  and to say the rules one more time, because the rules above are the whole law for tonight. arrivals
  in order, budgets and limits exactly as stated, nothing carries over from the orientation story and
  its numbers are not tonight''s numbers, read every rule twice before touching anything, once for what
  it says and once for what it does not say. the discipline is boring on purpose: one event at a time,
  apply the rule that event touches, carry the state forward, never recompute from scratch mid-stream,
  and when two rules could apply pick the one higher in the list. the drift to watch for is reading a
  rule as symmetric when it only binds one way, or letting a return land before the event that triggers
  it, or collapsing two events into one because they look alike, order is the whole game tonight. scope
  note: counts and sums cover tonight''s listed events only, ids appear exactly as written, and nothing
  that did not appear in the events belongs in any list. the orientation story is orientation, not evidence,
  and none of its arithmetic leaks into tonight. good output looks like the state walked clean: each event
  leaving the books balanced. the residency board updates on every touch, loads, needs, unloads, all of
  them refresh the touched clock, so reconstruct the board event by event and never from memory of what
  seems reasonable to keep, the card cares about arithmetic, not sentiment, and a defer is a clean outcome,
  not an error, it goes in the count the same as a load. the named traps, one last pass: evicting by load
  order instead of touch order, evicting once and forgetting the loop, treating a defer as a failed load
  instead of a clean outcome, and counting the explicit unload commands as evictions. when in doubt, slow
  down, the morning read rewards the operator who walked the list twice and penalizes the one who pattern-matched
  a similar night from memory, tonight is not that night, the numbers are not those numbers. write the
  state down between events if it helps, the pad is cheap and the report is not, and never let two events
  share a line in your head, they will blur and the blur always favors the wrong rule. the card has held
  this schedule since the slot count dropped, the pinned exception exists because one model serves the
  pager and unloading it is its own incident, the LRU order is tracked by touch not by load and the distinction
  has bitten every new operator at least once, and none of that history changes tonight''s arithmetic,
  it only explains why the rules read the way they do. the morning read is strict about shape, keys in
  the exact set named by the contract, values from the menus where menus exist, lists where lists are
  asked for, numbers as numbers, and nothing else on the line, because the report is parsed by a tool
  that does not forgive prose. if the state disagrees with the story you expected, the state wins, every
  time, no exceptions tonight, expectations are not evidence and neither are habits from older shifts.
  the report also goes to people who were not here for any of it, so it carries nothing but what the rules
  and the events force, no context, no color, no asides about how the night felt, just the state the rules
  produced, walked event by event to the last one, then frozen into the exact shape asked for.


  one more discipline before you freeze the answer: reconcile against the worked example, not by copying
  its numbers, its numbers belong to a different night and were chosen precisely because they are not
  tonight''s, but by walking its shape, notice how it applied the first rule to the first event, how it
  carried the remainder forward, how it refused to let the story override the ledger, and then do the
  same walk with tonight''s events and tonight''s rules. where the shape fits, use it, where it does not,
  trust the rule over the shape, because the example is a lamp, not a map. if you catch yourself asserting
  a total you did not walk, stop, that is the exact error this report exists to catch, and the fix is
  always the same small boring motion, back to the event list, forward again, one event, one rule, one
  state, written down, then walked once more before you let it become the report.


  before committing, recheck each number: walk the event list one more time, each event against its rule,
  then check the totals off the final state, not off memory, then check the output shape against the contract
  below, keys exact, values filled, menus honored. checklist, in order: every event visited exactly once,
  every rule applied where it binds, every count and sum re-derived from the final state, every id spelled
  as written, every list in the order asked for. then output ONLY this JSON, values filled in correctly:
  {"loads": N, "deferrals": N, "evictions": N, "deferred": [ids]} unique ids only, sorted. no extra keys,
  no trailing text.'
