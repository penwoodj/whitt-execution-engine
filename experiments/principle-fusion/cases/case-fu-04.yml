prompt: 'you are on rotation tonight, backoff duty, and the morning report only reads JSON.


  one flaky upstream call, you own the retry wrapper. the wrapper waits before each retry and the delays
  double every time starting from 2 seconds, so the waits run 2, 4, 8, 16 and onward. the wait-budget
  is 15 seconds. cumulative delay is compared against the budget right before the attempt that succeeds,
  if cumulative exceeds the budget the call is suppressed instead of issued, with one escape hatch, the
  budget doubles exactly once on the first breach only and the comparison re-runs after the doubling,
  suppression happens only when it is still over after that second look. attempts counts the retries made,
  wait_s sums every delay actually waited through. the call succeeds on retry 3, no earlier retry succeeds.


  for orientation only, a quieter night on a different threshold, different numbers, same shape: the budget
  sat at 45 and success came on the fifth retry, the waits ran 2, 4, 8, 16, 32, cumulative 62 crossed
  45 at the last step, the doubling fired once and lifted the budget to 90, 62 sat under 90, the call
  went out. attempts 5, wait 62, budget closed at 90, nothing suppressed. the doubling only matters when
  you cross the line, and it only ever crosses once, the second breach has no hatch.


  and to say the rules one more time, because the rules above are the whole law for tonight. arrivals
  in order, budgets and limits exactly as stated, nothing carries over from the orientation story and
  its numbers are not tonight''s numbers, read every rule twice before touching anything, once for what
  it says and once for what it does not say. the discipline is boring on purpose: one event at a time,
  apply the rule that event touches, carry the state forward, never recompute from scratch mid-stream,
  and when two rules could apply pick the one higher in the list. the drift to watch for is reading a
  rule as symmetric when it only binds one way, or letting a return land before the event that triggers
  it, or collapsing two events into one because they look alike, order is the whole game tonight. scope
  note: counts and sums cover tonight''s listed events only, ids appear exactly as written, and nothing
  that did not appear in the events belongs in any list. the orientation story is orientation, not evidence,
  and none of its arithmetic leaks into tonight. good output looks like the state walked clean: each event
  leaving the books balanced. the wrapper logs each wait as it happens, so reconstruct from the log lines,
  not from the timeline you wish had happened, the budget check is a snapshot before the successful attempt,
  not a running commentary, and the doubling is not a refund, money already waited stays waited, only
  the ceiling moves, attempts that failed earlier do not come back off the count. the named traps, one
  last pass: cumulative delay measured against the original budget after the doubling has already fired,
  the doubling applied twice because the night felt long, waits summed from the wrong start, and the budget
  check moved to after the attempt, it happens before, always before. when in doubt, slow down, the morning
  read rewards the operator who walked the list twice and penalizes the one who pattern-matched a similar
  night from memory, tonight is not that night, the numbers are not those numbers. write the state down
  between events if it helps, the pad is cheap and the report is not, and never let two events share a
  line in your head, they will blur and the blur always favors the wrong rule. the wrapper predates the
  current team, the comment at the top of the file reads patience is a budget item, nobody remembers who
  wrote it, the doubling clause was added the week the pager lit up twice before dawn and the second page
  cost nothing because the budget had already flexed once that night, and none of that history changes
  tonight''s arithmetic, it only explains why the rules read the way they do. the morning read is strict
  about shape, keys in the exact set named by the contract, values from the menus where menus exist, lists
  where lists are asked for, numbers as numbers, and nothing else on the line, because the report is parsed
  by a tool that does not forgive prose. if the state disagrees with the story you expected, the state
  wins, every time, no exceptions tonight, expectations are not evidence and neither are habits from older
  shifts. the report also goes to people who were not here for any of it, so it carries nothing but what
  the rules and the events force, no context, no color, no asides about how the night felt, just the state
  the rules produced, walked event by event to the last one, then frozen into the exact shape asked for.


  one more discipline before you freeze the answer: reconcile against the worked example, not by copying
  its numbers, its numbers belong to a different night and were chosen precisely because they are not
  tonight''s, but by walking its shape, notice how it applied the first rule to the first event, how it
  carried the remainder forward, how it refused to let the story override the ledger, and then do the
  same walk with tonight''s events and tonight''s rules. where the shape fits, use it, where it does not,
  trust the rule over the shape, because the example is a lamp, not a map. if you catch yourself asserting
  a total you did not walk, stop, that is the exact error this report exists to catch, and the fix is
  always the same small boring motion, back to the event list, forward again, one event, one rule, one
  state, written down, then walked once more before you let it become the report.


  before committing, recheck each number: walk the event list one more time, each event against its rule,
  then check the totals off the final state, not off memory, then check the output shape against the contract
  below, keys exact, values filled, menus honored. checklist, in order: every event visited exactly once,
  every rule applied where it binds, every count and sum re-derived from the final state, every id spelled
  as written, every list in the order asked for. then output ONLY this JSON, values filled in correctly:
  {"attempts": N, "wait_s": N, "budget_after": N, "suppressed": B} true or false only. no extra keys,
  no trailing text.'
