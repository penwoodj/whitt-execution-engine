prompt: 'you are on rotation tonight, preempt duty, and the morning report only reads JSON.


  two lanes on one executor. HIGH priority preempts LOW the instant it arrives and always runs to completion.
  LOW jobs checkpoint every 2 completed minutes, a preempted LOW resumes later from its last checkpoint,
  any partial work past that checkpoint is wasted. when the queue holds a resumed LOW and a fresh LOW
  at the same time the resumed job outranks the fresh one. makespan runs from the start of the first job
  to the completion of the last. LOW1 with 6 minutes of work starts at t0. HIGH with 3 minutes of work
  arrives at t=2 exactly as LOW1''s first checkpoint lands. LOW2 with 4 minutes of work, fresh, has been
  waiting in the queue since t0. nothing else arrives.


  for orientation only, a rehearsal on a different night, different numbers, same shape: a LOW with 7
  minutes ran from the top and a HIGH of 5 minutes landed at t=6 exactly on a checkpoint boundary, so
  nothing burned, HIGH closed at 11, the LOW resumed with a single minute left and finished at 12 for
  a makespan of 12. boundaries are everything, an arrival right on a checkpoint keeps every second, an
  arrival one second late burns that second.


  and to say the rules one more time, because the rules above are the whole law for tonight. arrivals
  in order, budgets and limits exactly as stated, nothing carries over from the orientation story and
  its numbers are not tonight''s numbers, read every rule twice before touching anything, once for what
  it says and once for what it does not say. the discipline is boring on purpose: one event at a time,
  apply the rule that event touches, carry the state forward, never recompute from scratch mid-stream,
  and when two rules could apply pick the one higher in the list. the drift to watch for is reading a
  rule as symmetric when it only binds one way, or letting a return land before the event that triggers
  it, or collapsing two events into one because they look alike, order is the whole game tonight. scope
  note: counts and sums cover tonight''s listed events only, ids appear exactly as written, and nothing
  that did not appear in the events belongs in any list. the orientation story is orientation, not evidence,
  and none of its arithmetic leaks into tonight. good output looks like the state walked clean: each event
  leaving the books balanced. the timeline wants a picture per event, who ran, who waited, where the checkpoints
  sit, and the queue drains strictly by the ranking rules, resumed before fresh at a tie, HIGH whenever
  it exists, the makespan is not the sum of the work, it is the span from first start to last finish,
  gaps included, waste included. the named traps, one last pass: partial minutes rounded away instead
  of burned, the tie broken toward the fresh job because it feels fairer, makespan measured to the last
  start instead of the last finish, and the checkpoint interval applied to wall-clock gaps instead of
  completed work. when in doubt, slow down, the morning read rewards the operator who walked the list
  twice and penalizes the one who pattern-matched a similar night from memory, tonight is not that night,
  the numbers are not those numbers. write the state down between events if it helps, the pad is cheap
  and the report is not, and never let two events share a line in your head, they will blur and the blur
  always favors the wrong rule. checkpointing landed after a night where forty minutes of low-priority
  work evaporated to a two-minute high-priority blip, the interval is two minutes because finer checkpoints
  cost more than they save and coarser ones burn more than they protect, the tie-break rule for resumed
  jobs came a year later, and none of that history changes tonight''s arithmetic, it only explains why
  the rules read the way they do. the morning read is strict about shape, keys in the exact set named
  by the contract, values from the menus where menus exist, lists where lists are asked for, numbers as
  numbers, and nothing else on the line, because the report is parsed by a tool that does not forgive
  prose. if the state disagrees with the story you expected, the state wins, every time, no exceptions
  tonight, expectations are not evidence and neither are habits from older shifts. the report also goes
  to people who were not here for any of it, so it carries nothing but what the rules and the events force,
  no context, no color, no asides about how the night felt, just the state the rules produced, walked
  event by event to the last one, then frozen into the exact shape asked for.


  one more discipline before you freeze the answer: reconcile against the worked example, not by copying
  its numbers, its numbers belong to a different night and were chosen precisely because they are not
  tonight''s, but by walking its shape, notice how it applied the first rule to the first event, how it
  carried the remainder forward, how it refused to let the story override the ledger, and then do the
  same walk with tonight''s events and tonight''s rules. where the shape fits, use it, where it does not,
  trust the rule over the shape, because the example is a lamp, not a map. if you catch yourself asserting
  a total you did not walk, stop, that is the exact error this report exists to catch, and the fix is
  always the same small boring motion, back to the event list, forward again, one event, one rule, one
  state, written down, then walked once more before you let it become the report.


  before committing, recheck each number: walk the event list one more time, each event against its rule,
  then check the totals off the final state, not off memory, then check the output shape against the contract
  below, keys exact, values filled, menus honored. checklist, in order: every event visited exactly once,
  every rule applied where it binds, every count and sum re-derived from the final state, every id spelled
  as written, every list in the order asked for. then output ONLY this JSON, values filled in correctly:
  {"makespan_min": N, "wasted_min": N, "finish_order": [ids]}. no extra keys, no trailing text.'
