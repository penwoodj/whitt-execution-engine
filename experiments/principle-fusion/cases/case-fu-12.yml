prompt: 'you are on rotation tonight, epistemic duty, and the morning report only reads JSON.


  night audit, four claims, rank your sources: machine log beats signed handoff, signed handoff beats
  hearsay, the status dashboard is KNOWN-BUGGY and cannot carry a claim alone. hearsay-only or dashboard-only
  claims are UNVERIFIED. no contradiction tonight, so nothing scores false unless two sources disagree.
  c1: the machine log shows the replica caught up at 01:30. c2: a signed handoff pegs the deploy at 02:00,
  the machine log agrees on 02:00. c3: hearsay alone says the index was rebuilt at 03:00. c4: only the
  buggy dashboard reports a memory spike at 04:00.


  for orientation only, the template audit ran a different night, different claims, same shape: two logged
  facts scored true, one handoff-only fact scored true because a handoff alone carries weight, a pair
  of chat rumors went unverified, and zero claims scored false because nothing disagreed. absence of contradiction
  is not evidence of truth for hearsay, it just means nobody caught it lying yet.


  and to say the rules one more time, because the rules above are the whole law for tonight. arrivals
  in order, budgets and limits exactly as stated, nothing carries over from the orientation story and
  its numbers are not tonight''s numbers, read every rule twice before touching anything, once for what
  it says and once for what it does not say. the discipline is boring on purpose: one event at a time,
  apply the rule that event touches, carry the state forward, never recompute from scratch mid-stream,
  and when two rules could apply pick the one higher in the list. the drift to watch for is reading a
  rule as symmetric when it only binds one way, or letting a return land before the event that triggers
  it, or collapsing two events into one because they look alike, order is the whole game tonight. scope
  note: counts and sums cover tonight''s listed events only, ids appear exactly as written, and nothing
  that did not appear in the events belongs in any list. the orientation story is orientation, not evidence,
  and none of its arithmetic leaks into tonight. good output looks like the state walked clean: each event
  leaving the books balanced. the audit table wants one row per claim, sources listed, precedence applied,
  verdict in the last column, unverified is a verdict, not a shrug, and a claim with two agreeing sources
  of different ranks is still just true, rank only breaks ties and contradictions, it never invents doubt
  where none exists. the named traps, one last pass: unverified conflated with false, the buggy dashboard
  promoted to evidence because it agreed with a hunch, hearsay upgraded because two people repeated it,
  and agreement between two hearsay sources treated as a stronger rank instead of the same weak one twice.
  when in doubt, slow down, the morning read rewards the operator who walked the list twice and penalizes
  the one who pattern-matched a similar night from memory, tonight is not that night, the numbers are
  not those numbers. write the state down between events if it helps, the pad is cheap and the report
  is not, and never let two events share a line in your head, they will blur and the blur always favors
  the wrong rule. the precedence list is written on the wall of the on-call room, someone taped a printout
  of a wrong dashboard reading under it as a warning, the tape has outlasted three dashboards and two
  migrations, the lesson survives because the dashboard kept being confidently wrong in new ways, and
  none of that history changes tonight''s arithmetic, it only explains why the rules read the way they
  do. the morning read is strict about shape, keys in the exact set named by the contract, values from
  the menus where menus exist, lists where lists are asked for, numbers as numbers, and nothing else on
  the line, because the report is parsed by a tool that does not forgive prose. if the state disagrees
  with the story you expected, the state wins, every time, no exceptions tonight, expectations are not
  evidence and neither are habits from older shifts. the report also goes to people who were not here
  for any of it, so it carries nothing but what the rules and the events force, no context, no color,
  no asides about how the night felt, just the state the rules produced, walked event by event to the
  last one, then frozen into the exact shape asked for.


  one more discipline before you freeze the answer: reconcile against the worked example, not by copying
  its numbers, its numbers belong to a different night and were chosen precisely because they are not
  tonight''s, but by walking its shape, notice how it applied the first rule to the first event, how it
  carried the remainder forward, how it refused to let the story override the ledger, and then do the
  same walk with tonight''s events and tonight''s rules. where the shape fits, use it, where it does not,
  trust the rule over the shape, because the example is a lamp, not a map. if you catch yourself asserting
  a total you did not walk, stop, that is the exact error this report exists to catch, and the fix is
  always the same small boring motion, back to the event list, forward again, one event, one rule, one
  state, written down, then walked once more before you let it become the report.


  before committing, recheck each number: walk the event list one more time, each event against its rule,
  then check the totals off the final state, not off memory, then check the output shape against the contract
  below, keys exact, values filled, menus honored. checklist, in order: every event visited exactly once,
  every rule applied where it binds, every count and sum re-derived from the final state, every id spelled
  as written, every list in the order asked for. then output ONLY this JSON, values filled in correctly:
  {"true_claims": [ids], "false_claims": [ids], "unverified": [ids]} every id in exactly one list, ids
  sorted, empty lists allowed. no extra keys, no trailing text.'
