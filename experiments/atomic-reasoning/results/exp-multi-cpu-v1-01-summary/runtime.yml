# ══════════════════════════════════════════════════════════════════
# ATOM OF REASONING — MULTI-MODEL CPU v1
# CPU-only. Router: Qwen2.5-0.5B. Worker: LFM2.5-1.2B-Instruct.
# Both models fit in RAM simultaneously at <2GB total.
# Router inference via shell+curl. Worker via engine.
# ══════════════════════════════════════════════════════════════════
workflow_id: atom_multi_cpu_v1
name: "Atom of Reasoning — Multi-Model CPU v1"
description: "CPU-only. Qwen2.5-0.5B router + LFM2.5-1.2B worker."
version: "1.0.0"
author: "Whitt Execution Engine"
tags: [atom, multi-model, cpu, shell-orchestrated]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config: { host: localhost, port: 8080 }

models:
  "worker":
    name: "LFM2.5-1.2B-Instruct-Q8_0"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.3, max_tokens: 300 }

workflow_execution_strategy:
  memory: { model_lifecycle: { unload_unused: false } }

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/last-run.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:

    step_00_bootstrap_route:
      generative_entity: "${models.worker}"
      prompt: "READY."
      model_overrides: { temperature: 0.0, max_tokens: 3 }
      when:
        before_step_starts:
          - shell:
              command: |
                set -e
                # Call tiny router model (Qwen2.5-0.5B) via API
                ROUTER_RESP=$(curl -s -m 30 -X POST http://localhost:8080/v1/chat/completions \
                  -H "Content-Type: application/json" \
                  -d "$(python3 -c "import json; print(json.dumps({'model':'Qwen2.5-0.5B-Instruct-Q4_K_M','messages':[{'role':'user','content':'Classify this task into ONE word: SUMMARY, FIX, DECOMPOSE, CLASSIFY, or CODE. Reply with the word ONLY.\n\nTASK:\n' + open('/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/inputs/input-01-summary.txt').read()[:500]}],'max_tokens':10,'temperature':0}))")" || echo '{"choices":[{"message":{"content":"UNKNOWN"}}]}')
                KIND=$(echo "$ROUTER_RESP" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['choices'][0]['message']['content'].strip().split()[0].upper() if d.get('choices') else 'UNKNOWN')" 2>/dev/null || echo UNKNOWN)
                echo "$KIND" > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/task-kind.txt
                echo "[router] classified as: $KIND" >> /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/router-debug.log
                # Unload router immediately (1-model invariant for VRAM/RAM safety)
                curl -s -m 10 -X POST http://localhost:8080/models/unload \
                  -H "Content-Type: application/json" \
                  -d '{"model":"Qwen2.5-0.5B-Instruct-Q4_K_M"}' >> /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/router-debug.log 2>&1 || true
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: false
          - shell:
              command: "KIND=$(cat /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/task-kind.txt 2>/dev/null || echo UNKNOWN); echo \"TASK_KIND: ${KIND}\"; echo ''; echo 'INPUT:'; cat /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/inputs/input-01-summary.txt"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: true

    step_01_generate:
      depends_on: [step_00_bootstrap_route]
      generative_entity: "${models.worker}"
      prompt: |
        Complete this task. Output ONLY the result, no preamble.

        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.4, max_tokens: 300 }
      when:
        after_step_succeeds:
          - save_to:
              - $draft
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/draft.txt"
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/step-01.log"
              event_fields: [step_name, duration_ms, model_name]
              level: info

    step_02_critique:
      depends_on: [step_01_generate]
      generative_entity: "${models.worker}"
      prompt: |
        Review this output for ONE problem only.

        OUTPUT:
        {{bookmarks.draft}}

        If output is correct and well-formatted, write "NO PROBLEM".
        Otherwise write one sentence starting with "PROBLEM:".
      model_overrides: { temperature: 0.2, max_tokens: 60 }
      when:
        after_step_succeeds:
          - save_to:
              - $critique
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/critique.txt"

    step_03_refine:
      depends_on: [step_02_critique]
      generative_entity: "${models.worker}"
      prompt: |
        If critique says "NO PROBLEM", output the original draft unchanged.
        Otherwise, fix the stated problem.

        ORIGINAL DRAFT:
        {{bookmarks.draft}}

        CRITIQUE:
        {{bookmarks.critique}}

        Output complete version. No commentary.
      model_overrides: { temperature: 0.3, max_tokens: 300 }
      when:
        after_step_succeeds:
          - save_to:
              - $final_output
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/final.txt"
          - shell:
              command: "python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/scripts/verify.py '{{bookmarks.final_output}}' > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/verify-result.txt 2>&1 || true"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: false
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-cpu-v1-01-summary/summary.log"
              event_fields: [workflow_id, total_steps]
              level: info
