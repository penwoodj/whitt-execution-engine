# ══════════════════════════════════════════════════════════════════
# ATOM OF REASONING — SINGLE-MODEL v1.6 (SAFE + working verify)
# Fix: verify inlined into refine's after_step_succeeds hook.
# Fix: clearer critique prompt (no "did NOT write this" confusion).
# Tiny budgets. Single-pass. Crash-safe.
# ══════════════════════════════════════════════════════════════════
workflow_id: atom_single_v1_6
name: "Atom of Reasoning — Single-Model v1.6 (safe+verified)"
description: "Verify inlined. Clearer prompts. Single-pass."
version: "1.6.0"
author: "Whitt Execution Engine"
tags: [atom, single-model, safe]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config: { host: localhost, port: 8080 }

models:
  "worker":
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.3, max_tokens: 300 }

workflow_execution_strategy:
  memory: { model_lifecycle: { unload_unused: false } }

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-single-v1.6-03-task-decomposition/last-run.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:

    step_00_bootstrap:
      generative_entity: "${models.worker}"
      prompt: "READY."
      model_overrides: { temperature: 0.0, max_tokens: 3 }
      when:
        before_step_starts:
          - shell:
              command: "cat /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/inputs/input-03-task-decomposition.txt"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: true

    step_01_generate:
      depends_on: [step_00_bootstrap]
      generative_entity: "${models.worker}"
      prompt: |
        Complete this task. Output ONLY the result, no preamble.

        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.4, max_tokens: 300 }
      when:
        after_step_succeeds:
          - save_to:
              - $draft
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-single-v1.6-03-task-decomposition/draft.txt"
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-single-v1.6-03-task-decomposition/step-01.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_02_critique:
      depends_on: [step_01_generate]
      generative_entity: "${models.worker}"
      prompt: |
        Review this output for ONE problem only.

        OUTPUT:
        {{bookmarks.draft}}

        Identify the SINGLE most important issue with correctness, completeness, or format adherence.
        If the output is correct and well-formatted, write "NO PROBLEM".
        Otherwise write one sentence starting with "PROBLEM:".
      model_overrides: { temperature: 0.2, max_tokens: 60 }
      when:
        after_step_succeeds:
          - save_to:
              - $critique
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-single-v1.6-03-task-decomposition/critique.txt"

    step_03_refine:
      depends_on: [step_02_critique]
      generative_entity: "${models.worker}"
      prompt: |
        If the critique says "NO PROBLEM", output the original draft unchanged.
        Otherwise, fix the stated problem.

        ORIGINAL DRAFT:
        {{bookmarks.draft}}

        CRITIQUE:
        {{bookmarks.critique}}

        Output the complete version. No commentary.
      model_overrides: { temperature: 0.3, max_tokens: 300 }
      when:
        after_step_succeeds:
          - save_to:
              - $draft
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-single-v1.6-03-task-decomposition/refined.txt"
          - shell:
              command: "python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/scripts/verify.py '{{bookmarks.draft}}' > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-single-v1.6-03-task-decomposition/verify-result.txt 2>&1 || true"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: false
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-single-v1.6-03-task-decomposition/summary.log"
              event_fields: [workflow_id, total_steps]
              level: info
