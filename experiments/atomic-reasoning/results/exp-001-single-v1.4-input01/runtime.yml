# ══════════════════════════════════════════════════════════════════
# ATOM OF REASONING — SINGLE-MODEL v1.4
# Tokens: /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor, /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01, /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/inputs/input-01-summary.txt (sed-replaced by run-atom.sh)
# Pattern: GENERATE → CRITIQUE → REFINE → VERIFY (single pass, no loop yet)
# ══════════════════════════════════════════════════════════════════
workflow_id: atom_single_v1_4
name: "Atom of Reasoning — Single-Model v1.4"
description: "Path tokens substituted by runner. Linear pipeline first; loop in later iteration."
version: "1.4.0"
author: "Whitt Execution Engine"
tags: [atom, single-model, refinement]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config: { host: localhost, port: 8080 }

models:
  "worker":
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.3, max_tokens: 600 }

workflow_execution_strategy:
  memory: { model_lifecycle: { unload_unused: false } }

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01/last-run.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:

    step_00_bootstrap:
      generative_entity: "${models.worker}"
      prompt: "READY."
      model_overrides: { temperature: 0.0, max_tokens: 3 }
      when:
        before_step_starts:
          - shell:
              command: "cat /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/inputs/input-01-summary.txt"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: true

    step_01_generate:
      depends_on: [step_00_bootstrap]
      generative_entity: "${models.worker}"
      prompt: |
        TASK:
        {{bookmarks.shell_output.stdout}}

        Produce the answer directly. Output ONLY the result.
      model_overrides: { temperature: 0.4, max_tokens: 500 }
      when:
        after_step_succeeds:
          - save_to:
              - $draft
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01/draft.txt"
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01/step-01.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_02_critique:
      depends_on: [step_01_generate]
      generative_entity: "${models.worker}"
      prompt: |
        You did NOT write this. Review cold.

        DRAFT:
        {{bookmarks.draft}}

        List the SINGLE most important problem (correctness, completeness, or format).
        One sentence. Start with "PROBLEM:".
      model_overrides: { temperature: 0.2, max_tokens: 80 }
      when:
        after_step_succeeds:
          - save_to:
              - $critique
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01/critique.txt"

    step_03_refine:
      depends_on: [step_02_critique]
      generative_entity: "${models.worker}"
      prompt: |
        Fix the stated problem.

        DRAFT:
        {{bookmarks.draft}}

        PROBLEM:
        {{bookmarks.critique}}

        Output complete fixed version. No commentary.
      model_overrides: { temperature: 0.3, max_tokens: 500 }
      when:
        after_step_succeeds:
          - save_to:
              - $draft
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01/refined.txt"

    step_04_verify:
      depends_on: [step_03_refine]
      when:
        before_step_starts:
          - shell:
              command: "python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/scripts/verify.py '{{bookmarks.draft}}' > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01/verify-result.txt 2>&1; echo $?"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: false
        after_step_succeeds:
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01/verify.log"
              event_fields: [step_name, shell_output_exit_code, shell_output_stdout]
              level: info

    step_05_emit:
      depends_on: [step_04_verify]
      generative_entity: "${models.worker}"
      prompt: "DONE."
      model_overrides: { temperature: 0.0, max_tokens: 3 }
      when:
        after_step_succeeds:
          - save_to:
              - $final_output
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01/final.txt"
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-001-single-v1.4-input01/summary.log"
              event_fields: [workflow_id, total_steps]
              level: info
