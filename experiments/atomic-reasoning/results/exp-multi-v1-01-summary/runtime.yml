# ══════════════════════════════════════════════════════════════════
# ATOM OF REASONING — MULTI-MODEL v1 (router + specialist cascade)
# Pattern: ROUTER classifies task type → specialist model executes
# Safety: ONE model loaded at a time (load router → unload → load worker)
# Tiny models: Qwen3-0.6B as router, Qwen3-4B as worker.
# ══════════════════════════════════════════════════════════════════
workflow_id: atom_multi_v1
name: "Atom of Reasoning — Multi-Model v1"
description: "Router + specialist cascade. Tiny router classifies, worker executes."
version: "1.0.0"
author: "Whitt Execution Engine"
tags: [atom, multi-model, cascade]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config: { host: localhost, port: 8080 }

models:
  "router":
    name: "Qwen3-0.6B-Q8_0"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.0, max_tokens: 30 }
  "worker":
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.3, max_tokens: 300 }

workflow_execution_strategy:
  memory: { model_lifecycle: { unload_unused: true } }

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/last-run.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:

    # ── STEP 0: Bootstrap (no model) ───────────────────────────
    step_00_bootstrap:
      generative_entity: "${models.router}"
      prompt: "R."
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "cat /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/inputs/input-01-summary.txt"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: true
          - shell:
              command: "echo 'unloaded' > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/.model-state; curl -s -X POST http://localhost:8080/v1/models/unload -H 'Content-Type: application/json' -d '{\"model\":\"Qwen3-4B-Instruct-2507-Q4_K_M\"}' || true; sleep 3"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"

    # ── STEP 1: ROUTER — classify input type ───────────────────
    step_01_route:
      depends_on: [step_00_bootstrap]
      generative_entity: "${models.router}"
      prompt: |
        Classify this task into ONE category. Reply with the category name ONLY.

        Categories:
        - SUMMARY (condense text to fewer words)
        - FIX (correct errors in structured content)
        - DECOMPOSE (break request into atomic tasks)
        - CLASSIFY (assign labels to items)
        - CODE (modify programming source)

        TASK:
        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.0, max_tokens: 10 }
      when:
        after_step_succeeds:
          - save_to:
              - $task_kind
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/task-kind.txt"
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/step-01-route.log"
              event_fields: [step_name, duration_ms, model_name]
              level: info

    # ── STEP 2: Swap to worker model ───────────────────────────
    step_02_swap:
      depends_on: [step_01_route]
      generative_entity: "${models.router}"
      prompt: "S."
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "curl -s -X POST http://localhost:8080/v1/models/unload -H 'Content-Type: application/json' -d '{\"model\":\"Qwen3-0.6B-Q8_0\"}' || true; sleep 3; curl -s -X POST http://localhost:8080/v1/models/load -H 'Content-Type: application/json' -d '{\"model\":\"Qwen3-4B-Instruct-2507-Q4_K_M\"}'; sleep 15; echo 'worker_loaded' > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/.model-state"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: false

    # ── STEP 3: SPECIALIST GENERATE ────────────────────────────
    step_03_generate:
      depends_on: [step_02_swap]
      generative_entity: "${models.worker}"
      prompt: |
        Task type: {{bookmarks.task_kind}}

        Complete this task. Output ONLY the result, no preamble.

        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.4, max_tokens: 300 }
      when:
        after_step_succeeds:
          - save_to:
              - $draft
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/draft.txt"
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/step-03-generate.log"
              event_fields: [step_name, duration_ms, model_name]
              level: info

    # ── STEP 4: CRITIQUE (specialist self-review with fresh scope) ──
    step_04_critique:
      depends_on: [step_03_generate]
      generative_entity: "${models.worker}"
      prompt: |
        Review this output for ONE problem only.

        OUTPUT:
        {{bookmarks.draft}}

        Identify the SINGLE most important issue. If none, write "NO PROBLEM".
        Otherwise one sentence starting with "PROBLEM:".
      model_overrides: { temperature: 0.2, max_tokens: 60 }
      when:
        after_step_succeeds:
          - save_to:
              - $critique
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/critique.txt"

    # ── STEP 5: REFINE + VERIFY ────────────────────────────────
    step_05_refine:
      depends_on: [step_04_critique]
      generative_entity: "${models.worker}"
      prompt: |
        If critique says "NO PROBLEM", output original draft unchanged.
        Otherwise fix the stated problem.

        ORIGINAL:
        {{bookmarks.draft}}

        CRITIQUE:
        {{bookmarks.critique}}

        Output complete version. No commentary.
      model_overrides: { temperature: 0.3, max_tokens: 300 }
      when:
        after_step_succeeds:
          - save_to:
              - $final_output
              - "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/final.txt"
          - shell:
              command: "python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/scripts/verify.py '{{bookmarks.final_output}}' > /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/verify-result.txt 2>&1 || true"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor"
              fail_on_error: false
          - log:
              to_file_path: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/atomic-reasoning/results/exp-multi-v1-01-summary/summary.log"
              event_fields: [workflow_id, total_steps]
              level: info
