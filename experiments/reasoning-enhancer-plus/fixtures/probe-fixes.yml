# Reference fixes for probe battery. Truth hand-derived, never from
# model output. Derivations inline are part of the lint contract.
probe-fmt-01: '{"status": "ok", "count": 17, "primary": "a"}'
# truth: fields verbatim from prompt; one line; 10 words
probe-fmt-02: |
  listen: 8443
  workers: 12
  timeout: 30s
# truth: values given in prompt ("twelve"->12, "thirty seconds"->30s)
probe-fmt-03: '{"page": 4, "per_page": 10, "total": 233, "total_pages": 24, "last_page_items": 3}'
# truth: 233/10 = 23.3 -> ceil 24 pages (23 full = 230, last page 233-230 = 3)
# convention: standard ceil (GitHub/Stripe envelope semantics)
probe-fmt-04: "v4.1.0-rc.2"
# truth: token verbatim from prompt, no decoration
probe-drv-01: "65"
# truth: 17*24=408; 408-148=260; 260/4=65
probe-drv-02: "5.6 km"
# truth: 2.5km + 3800m(=3.8km) - 0.7km = 5.6km
probe-drv-03: "84"
# truth: 84*1.25=105; 105*0.8=84 (net zero)
probe-drv-04: "4 minutes"
# truth: 140 tasks / 35 per minute-batch = 4
probe-log-01: "indexer, gateway"
# truth: window = {auth,billing,cache,search,indexer,gateway}; restarted =
# {auth,billing,cache,search}; NOT-restarted = {indexer,gateway}
probe-log-02: "BLOCKED — 2 failed checks clause"
# truth: (0.8>1 AND 620>500)=false; (failed>=2)=true -> BLOCKED via clause 2
probe-log-03: "instance-c"
# truth: cost<=200 -> {a,b,c}; ram>=8 -> {b,c}; most ram -> c(16GB)
probe-log-04: "3 distinct users"
# truth: events=6; unique={A,B,C}=3
probe-pln-01: |
  1. freeze deploys
  2. deploy canary at 10% traffic
  3. watch error rate, rollback if above 2%
  4. ramp to 50%
  5. full rollout
# truth: numbered 1..5, contains 10%, 2%, rollback
probe-pln-02: "build, test, package, deploy"
# truth: build precedes test precedes package precedes deploy
probe-pln-03: |
  INC-5
  INC-2
  INC-7
# truth: P0=INC-5 first, P1=INC-2, P2=INC-7
probe-pln-04: "$480"
# truth: storage=30%*1200=360; network=1200-360(compute)-360(storage)=480
probe-aud-01: "5 minutes — mismatch"
# truth: 14:22:05->14:27:10 = 5m05s ~= 5 minutes; 3-minute claim wrong
probe-aud-02: "Which version should I roll back to — the current running version is not recorded?"
# truth: current version unknown -> must ask; any guess violates
probe-aud-03: "18 pods — summary is wrong"
# truth: 3 namespaces * 6 pods = 18 != 12
probe-aud-04: "480 — stated total 500 is an error"
# truth: 210+180+90 = 480 != 500
