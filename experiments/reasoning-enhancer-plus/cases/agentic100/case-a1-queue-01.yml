prompt: 'you''re on call tonight and the numbers below are all yours to own. three
  priority lanes drain HIGH then MED then LOW; the worker processes exactly 9 messages
  per pass and nothing carries partial credit between lanes


  arrivals: 7 HIGH, 4 MED, 2 LOW


  a cost-reporting crawler you don''t manage tallies everything for finance and
  touches nothing. per-lane processed counts and what''s left after the pass


  and to say the rules one more time in different words, because this is the part
  people get wrong when they think they''ve got it: the rules above are not suggestions
  and they don''t bend under pressure - when two of them seem to conflict, read
  both again, because one of them always specifies the tiebreak or the precedence
  and the apparent conflict is just the test. nobody is watching over your shoulder
  here, the numbers are what they are, and a careful walk through the rules beats
  a confident skim every single time. if a rule says count something, count exactly
  that thing, not the thing next to it, not the thing it sounds like, the thing
  it says.


  the no-partial-credit rule exists because a lane once got credit for half a message
  and the count never reconciled after.


  a wrinkle that almost matters and deliberately doesn''t: a neighboring team ran
  a similar exercise yesterday with different numbers and got a different answer,
  which is exactly what should happen and proves nothing about today; and a draft
  of this task circulating in chat has one transposed digit in it that people keep
  quoting at each other - the text above is the authority, the chat draft is not,
  and if you catch yourself reconciling toward the draft, stop. opinions in the
  channel about what the answer should be are noise; the rules and the numbers above
  are the entire universe.


  for calibration, a worked example with different numbers entirely - pattern, not
  data: a window that opens at the first tick and closes on confirmation spans exactly
  the distance between those two events, never the distance plus the observation
  delay. treat it as a shape for how the counting walks forward, never as numbers
  to reuse. the measurement convention, not the physics, defines the window. the
  example exists to fix the arithmetic shape in your head; the numbers in the task
  above are the only ones that count for the answer.


  before computing, run the discipline: name what each rule governs before touching
  a number; propagate forward through the rules only, not by vibes; respect the
  stated conventions over your instincts even where the conventions feel slightly
  off, because the convention is part of the task; don''t invent events, thresholds,
  or partial credits the text never contains; and don''t delete things the text
  does contain just because they feel adjacent to something else. guard the boundaries
  of every count: know exactly where each window opens and closes before you sum
  anything, because off-by-one boundaries are where careful readers lose more points
  than careless ones. if two counts seem to want the same number, that''s coincidence,
  not a shortcut.


  and a drift warning, because every task like this has one canonical wrong answer
  people converge on: if you catch yourself writing a value because it felt close,
  or because it matched the worked example, or because a number from the events
  section leaked into "processed_high" where it doesn''t belong - stop, back up
  to the rule that governs that key, and recompute from the rule. the wrong answer
  always sounds right in your head for about two seconds; the rule is what still
  sounds right after ten.


  a note on authority and what you may lean on, because these tasks always carry
  more voices than facts: the events and rules above are the only evidence. anything
  that sounds like a summary, a dashboard, a recollection, a neighboring team''s
  take, or a chat draft inherits nothing - it borrows credibility it never earned,
  and each of those voices is usually one revision behind the truth or one bug ahead
  of it. when a number in the events feels surprising, surprise is not evidence
  against it; when a rule feels harsh, harshness is not a reason to soften it in
  your arithmetic. read once for the rules, once for the events, once more for the
  boundaries, and only then pick up the pen.


  and rehearse the whole thing twice, because once is how errors survive: first
  pass, name every rule and bind it to the count it governs, out loud if you have
  to; second pass, walk the events in order and place each one on the timeline before
  anything is summed. then the boundaries: every window''s open and close named
  exactly, every tiebreak applied in the order written rather than the order that
  feels natural, and every rejected, denied, skipped, or suppressed thing counted
  as rejected, denied, skipped, or suppressed - not silently dropped, not quietly
  rescued, and definitely not re-labeled because the label felt unkind. half the
  wrong answers to tasks like this are right numbers attached to the wrong events,
  and the other half are right events summed against the wrong boundaries, so the
  rehearsal is not ceremony - it is the actual work. if any step of the rehearsal
  makes you hesitate, that hesitation is the finding: go back to that step and recompute
  it from its rule instead of pushing through, because pushing through is how a
  two-second wrong answer becomes a committed one.


  one final note on scope, because thorough agents overreach: answer exactly what
  is asked, in the exact shape asked, with exactly the keys asked for - no commentary,
  no reasoning transcript, no extra keys for context, no markdown fences. a correct
  number in the wrong shape fails this task just as dead as a wrong number, and
  the checking is mechanical, so give the machine exactly what it asked for and
  nothing else.


  before committing, recheck each number against its rule, then output ONLY this
  json with exactly these keys: {"processed_high": ..., "processed_med": ..., "processed_low":
  ..., "left_total": ...}.'
