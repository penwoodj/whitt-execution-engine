rea_plus:
  hops: 6
  robust: true
  prio: true
  format_weight: 2
  archetype: agentic
  difficulty: H
  extreme: true
  provenance: epistemic reconciliation; c1 machine log 14:05 deploy -> TRUE; c2
    machine log RB-9 -> FALSE; c3 signed handoff + paging archive = primary only,
    unsigned line = hearsay -> FALSE; c4 only source is known-doubling dashboard,
    no authoritative coverage -> UNVERIFIED; c5 machine log freeze 16:00 -> TRUE
prompt: 'you''re the auditor brought in after a messy tuesday and I need you

  to reconcile 5 claims from the executive recap against the evidence

  trail. 3 sources exist, they disagree with each other, and the whole

  audit turns on precedence, so lock the hierarchy in before you

  touch a single claim - and I mean actually lock it in, because two

  of the three sources are partially or wholly unreliable and if you

  skim you''ll get 3 of the 5 wrong (they calibrated these on purpose,

  each claim punishes a specific shortcut, more on that below).


  the hierarchy. machine log is authoritative for everything it

  covers - deploys, rollbacks, freeze windows, timestamps - generated

  by the pipeline itself, never hand-edited, and the platform team

  certified that in writing last quarter, so you can lean on it

  completely. the on-call handoff is authoritative for paging and

  incident handling but ONLY for lines with a signed checkbox, which

  means the author personally handled them. unsigned lines are

  hearsay pasted in later by whoever felt helpful, and hearsay

  carries zero weight here no matter how detailed or confident it

  reads - I know some of them sound more specific than the signed

  ones, that''s exactly the trap, specificity is not authority. the

  engineering dashboard is authoritative for nothing: it doubles every

  count and halves every latency (known scaling bugs, ticket DASH-311

  was filed after the incident acknowledging this), so treat every

  dashboard number as unusable even when it looks self-consistent,

  and yes I know it looks self-consistent, that''s what scaling bugs

  do.


  machine log, verbatim, in order: 14:05 DEPLOY D-142 shipped to

  production, canary 5 percent. 14:40 DEPLOY D-142 promoted to 100

  percent after clean canary. 15:30 ROLLBACK RB-9 executed, D-142

  reverted to previous release. 16:00 FREEZE window began (scheduled,

  calendar entry FRZ-22). 16:45 DEPLOY D-143 shipped (freeze-exempt

  hotfix, approved by VP ticket OPS-771). 17:30 FREEZE window ended.

  18:10 DEPLOY D-144 shipped (queued routine release, post-freeze).

  18:15 BUILD B-501 completed for tomorrow''s train, no deploy. the

  log also carries two scheduling heartbeats and one config-schema

  migration - none of which touch any claim below, I checked, don''t

  burn time on them.


  signed handoff lines: 14:32 paged PRIMARY on-call for error-rate

  alert on D-142 canary, acknowledged 14:35. 15:05 attempted

  mitigation M1 (config toggle rates-throttle), reduced but did not

  stop errors. 15:30 confirmed rollback RB-9, error rate zero by

  15:38. 16:50 monitored D-143 hotfix, no regression observed. 17:35

  stood down secondary observer, incident closed. 18:00 handed off to

  night rotation, no open actions. 19:00 night shift signed "no pages

  received during night rotation" - authoritative for the night

  window, confirms nothing new happened after the handoff, closes the

  timeline cleanly at 19:00.


  unsigned lines, and pay attention to why each one is bait: one

  claims the secondary on-call was paged at 14:32 alongside the

  primary - pasted in the next morning by a helpful teammate, no

  signed confirmation, no machine-log entry, and the paging system''s

  own archive (which the author personally checked, and which counts

  as covered by the handoff''s authority since they checked it) lists

  exactly one page. another speculates the freeze "probably started

  early, around 15:45" - also hearsay, and the calendar system, which

  you may consult, agrees with the log''s 16:00 anyway.


  dashboard, for what it''s worth (nothing): deploys today 4, pages

  sent 2, peak error rate 8.1 percent, rollback count 2, mean latency

  210 ms - all through the known-buggy scaling.


  the recap claims exactly 5 things. one: D-142 shipped at 14:05.

  two: no rollbacks occurred during the incident. three: both primary

  and secondary on-call were paged at 14:32. four: peak error rate

  reached 8.1 percent. five: the freeze began at 16:00. everything

  else in the recap - "our canary process saved us", "the team

  responded heroically", "the dashboard showed concerning numbers all

  afternoon" - is opinion or restatement of an unreliable source, not

  a claim, out of scope. the attached spreadsheet recomputes deploy

  counts from the dashboard and lands on 4 - it inherits the bug and

  counts for nothing here, and the fact that it was attached to a VP

  email changes nothing either.


  audit rule, per claim, independently: TRUE if the highest-precedence

  source covering its subject supports it. FALSE if that source

  contradicts it. UNVERIFIED only if no authoritative source covers

  the subject at all - and you do NOT get to fall back to a lower

  source to rescue it, that''s the entire point of having the category.

  a claims-audit bot you don''t manage forwards results to compliance

  regardless of what you conclude, and a search indexer you also

  don''t manage archived the dashboard at three points during the day -

  neither changes your counts, both are noise.


  one more evidence wrinkle before the traps, because it almost

  became a sixth claim and got cut: the recap''s footer says

  "incident duration: 3 hours" - the signed handoff puts the incident

  between the 14:32 page and the 17:35 stand-down, which is 3 hours

  3 minutes, close enough that nobody argues, and it doesn''t matter

  anyway because duration is not one of the five claims and you only

  answer what''s asked. I''m telling you about it because a thorough

  auditor notices it, files it mentally, and refuses to let it leak

  into the counts - the same discipline applies to everything above

  that looked almost-relevant.


  and to say the precedence rules one more time in different words,

  because this is the part people get wrong when they think they''ve

  got it: if the log says it, that''s the answer. if the log is silent

  and a signed handoff line says it, that''s the answer for paging and

  incident handling. if the only thing that says it is an unsigned

  line or the dashboard, then either an authoritative source

  contradicts it (FALSE) or nothing authoritative ever mentions it

  (UNVERIFIED) - and no, the dashboard mentioning it does not count

  as mentioning it. that''s the whole audit. everything else is

  reading carefully.


  now the traps, named so you can''t walk into them blind: a dashboard

  reading "pages sent: 2" next to exactly one real page is the

  doubling bug, not a second page. hearsay is hearsay regardless of

  specificity - the archive the author personally checked listed one.

  a claim resting solely on an unreliable source isn''t quietly true,

  it''s UNVERIFIED, and pretending otherwise is exactly the audit

  failure the VP''s office is worried about. and D-143''s freeze

  exemption is not a violation question because nobody asked - claim

  five only asks whether the freeze began when the log says it did.

  before you commit, recheck each verdict against the rule one at a

  time - claim one against the log, claim two against the log, claim

  three against the signed handoff plus archive, claim four against

  the nothing that covers it, claim five against the log - and make

  sure the counts add to 5. then output ONLY this json with exactly

  these keys: {"true": N, "false": N, "unverified": N}.'
