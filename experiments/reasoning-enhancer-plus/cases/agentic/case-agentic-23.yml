  provenance: 'preemptive schedule; t=0 H1+L1 run. L2 LOW t=20 waits (only HIGH
    preempts). t=50 H3 preempts L1 (5 steps done, ckpt after 4 -> 4 steps left),
    H3 50-70. H1 done 60 -> resumed L1 outranks L2: L1 60-100. H3 done 70 -> L2
    70-100. makespan 100; preemptions 1; no scratch restarts; 4 done'
prompt: 'You are auditing a two-GPU cluster running four batch jobs under a

  preemption policy, and you must reconstruct the schedule. Rules:

  exactly one job step executes at a time per GPU, each step takes 10

  minutes, and jobs never share a GPU. Dispatch: arriving jobs take

  free GPUs in priority order, HIGH before LOW, ties by name. Arrival

  times: HIGH job H1 (6 steps) and LOW job L1 (8 steps) arrive at t=0;

  LOW job L2 (3 steps) arrives at t=20; HIGH job H3 (2 steps) arrives

  at t=50. Preemption: a newly arrived HIGH job with no free GPU

  preempts the alphabetically first running LOW job; the preempted

  job''s GPU goes to the new HIGH job immediately. Checkpointing: every

  job checkpoints each 2 completed steps, zero overhead; a preempted

  job later resumes from its last checkpoint, re-running nothing, and

  a job with no checkpoint restarts from scratch. When GPUs free up,

  waiting jobs start in HIGH-then-LOW, name order, and resumed jobs

  outrank fresh starts within the same priority. Compute: the makespan

  in minutes, preemptions that occurred, jobs forced to restart from

  scratch, and how many jobs completed by the end. Output ONLY this

  JSON with exactly these keys: {"makespan_min": N, "preemptions": N,

  "scratch_restarts": N, "jobs_completed": N}.'
draft_response: PLACEHOLDER
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"makespan_min": 100, "preemptions": 1, "scratch_restarts": 0,
      "jobs_completed": 4}'
