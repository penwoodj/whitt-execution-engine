rea_plus:
  hops: 6
  robust: true
  prio: true
  format_weight: 2
  archetype: agentic
  difficulty: H
  extreme: true
  provenance: counterfactual replay; F off at t=20 precedes spike t=30 -> no elevated
    window, no M1 (nothing to mitigate), no rollback; deploys D-200 t=0 + D-201
    t=120 both ship (not downstream of bug) = 2
prompt: 'reliability wants a counterfactual replay of this morning''s

  outage, by hand, against the event log - the sim environment is

  down until thursday and they don''t want to wait, and honestly a

  careful replay is better than what the sim would give you anyway

  because the sim quietly replays everything including things that

  shouldn''t survive the branch point. so this is on you now, and

  before the timeline, get the causal model exactly right, because

  every question below only works if you apply it exactly - and I

  mean exactly, not mostly, because each question has a specific

  reflex built into it that punishes a mostly-right application

  (same calibration approach as the last counterfactual they ran,

  the one where three reviewers all said "well obviously M1 would

  still..." and were all wrong).


  the bug came from feature flag F going live. everything downstream

  cascades from that single point. removing F at any moment T removes

  the cascade from T onward - errors stop the instant F is off, no

  residual delay, no half-life, no cleanup pass. mitigation M1, while

  it''s on, halves the error rate but never stops it, and M1 is

  downstream of the bug: in any world where the spike never happens,

  nobody fires a mitigation at nothing. rollbacks in the log exist

  only as responses to this bug - bug absent from T onward, rollback

  motivation absent too, so don''t invent a "preventive rollback"

  nobody logged. everything NOT downstream of F replays identically:

  builds run, ships happen, dashboards render, unrelated features

  deploy on their own schedules with zero interaction with F.


  actual timeline, verbatim. t=0 min: deploy D-200 ships with feature

  flag F live at 10 percent of traffic - the deploy itself takes 4

  minutes and that''s already inside the t=0 marker. t=10: F promoted

  from 10 to 100 percent, the bug now touches every request it

  reaches, nothing visible yet. t=30: error rate spikes on the

  graphs, alerting fires - observation changes nothing. t=40: on-call

  applies mitigation M1, halves the error rate, doesn''t stop it, M1

  stays on the rest of the incident and is never re-applied or

  stacked. t=80: on-call executes rollback R1, turns F off completely

  - the single removal event of the actual morning. t=90: errors

  reach zero, confirmed by the alert resolving. t=120: deploy D-201

  ships, unrelated cache change, no interaction with F, different

  team, different repo, reviewers who never touched D-200. t=150:

  postmortem doc opened, changes nothing technical. t=180: scheduled

  load test runs green on ordinary afternoon traffic, would have run

  either way, belongs to nobody in this story. and to be completely

  explicit about the M1 stacking question since two of you will ask:

  M1 is a config toggle, it''s binary, "stacking" isn''t a thing, and

  in the counterfactual it''s never applied because there''s nothing

  to mitigate - if you find yourself reasoning about whether a

  half-of-zero error rate still counts as elevated, you have drifted,

  come back to the convention. the log also

  records three cron heartbeats, one certificate rotation, and a

  disk-pressure warning on a staging host nobody paged on - none of

  it interacts with F, all of it replays identically in any world

  where the bug is gone from t=20 onward.


  one convention the reliability team fixed after an earlier draft

  went astray: "elevated window" is spike-to-zero per their

  measurement convention, not your instinct about when errors

  physically began. actual morning: window opens at first visible

  spike t=30, closes at confirmed zero t=90. if no spike ever occurs,

  the window never opens, full stop.


  the counterfactual: flag F turns OFF at t=20 - sixty minutes

  earlier than the actual rollback, and before the spike at t=30 ever

  appears. walk it exactly: F off at t=20 means no bug from t=20 on,

  means the spike at t=30 never happens, means the convention never

  opens a window. a BI pipeline you don''t manage re-rendered

  dashboards all morning and would render fewer interesting charts

  here, affects nobody''s counts. a compliance scanner you also don''t

  manage timestamps every log line independently and can''t tell

  actual from counterfactual - which is exactly why they asked a

  reasoning agent instead. the on-call who ran the actual rollback

  has vivid, confident opinions about how the morning would have

  gone, and is wrong about the mitigation question specifically -

  log plus causal rules are the only authority.


  before computing, run the discipline: name the branch point (one

  edited fact, F off at t=20, everything before t=20 identical

  history - which is why D-200''s t=0 ship still counts). propagate

  causally, not by vibes (no spike -> no mitigation at nothing -> no

  rollback response). respect the convention over intuition (no spike

  = no window, even though errors technically began at t=10 in the

  actual morning). don''t invent events the log never contains, don''t

  delete events it does. guard the boundaries: deploys_total spans

  t=0 through t=120 inclusive, so D-200 and D-201 both sit inside,

  and nothing before t=0 or after t=120 enters the count.


  a note on what actually changes vs what only seems to change,

  because this is where it''s easy to drift: the branch point edits

  ONE fact - F off at t=20 - and everything before t=20 is fixed

  history you don''t get to touch (D-200 shipped at t=0, that

  happened, it stays happened). after t=20 you propagate forward

  through the causal rules only: no bug, no spike, no window, no M1,

  no R1. the load test, the heartbeats, the cert rotation, the

  staging disk warning, D-201 - all of it replays because none of it

  hangs off F. and the numbers you output describe the

  counterfactual morning, not the actual one - if you catch yourself

  writing 60 for elevated_min because the actual window was t=30 to

  t=90, stop, that''s the actual morning, you were asked about the

  other one.


  answer about the counterfactual morning, not the actual one.

  elevated_min: minutes in the spike-to-zero window. m1_runs: 1 if

  M1 ever runs, 0 if not. rollbacks: how many execute.

  deploys_total: every deploy in the log that still happens when F

  is off at t=20, t=0..120 inclusive, remembering deploys aren''t

  downstream of the bug. before committing, recheck each number against its rule:

  elevated_min against the spike-to-zero convention applied to a

  world with no spike, m1_runs against "mitigation is downstream of

  the bug", rollbacks against "rollbacks key on motivation",

  deploys_total against the t=0..120 inclusive window counted in the

  counterfactual. make sure you didn''t delete D-200 just because the

  flag went off later, and make sure you didn''t keep R1 just because

  rollbacks feel incident-adjacent. then output ONLY this json with

  exactly these keys: {"elevated_min": N, "m1_runs": N, "rollbacks":

  N, "deploys_total": N}.'
