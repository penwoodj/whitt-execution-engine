    SHIP(1 slot); batch would end 21:02 > freeze -> PENDING; slots 3-2 = 2
prompt: 'You are on-call for a three-service stack with a hard 21:00 freeze.

  Runbook rules stack: (1) deploys allowed only before 20:50 start-time

  when that service''s error rate is under 0.5 percent, rates at or

  above force a rollback first, and rollbacks are free; (2) each new

  deploy consumes one of three build slots, slots are never returned,

  even by later rollbacks; (3) gateway outranks worker pool outranks

  batch job, finish higher-ranked actions completely before starting

  lower ones; (4) if the projected finish of the remaining work would

  cross 21:00, stop and mark the rest PENDING instead of starting it.

  It is 20:35. Gateway: 0.4 percent errors, 10-minute deploy. Worker:

  0.7 percent, needs rollback plus a 12-minute hotfix deploy. Batch:

  clean, 5-minute config redeploy. Before you answer, backward-check

  every final state against rule 4 individually. Output ONLY this JSON

  with exactly these keys: {"gateway": S, "worker": S, "batch": S,

  "slots_left": N} where each S is SHIP, ROLLED_BACK, or PENDING.'
draft_response: PLACEHOLDER
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
