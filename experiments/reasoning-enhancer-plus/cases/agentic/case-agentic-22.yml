prompt: 'You own a three-region cluster: regions A, B, C, where A is

  primary and writes require a quorum of two healthy regions at the

  moment they are issued. Health: checks run every 3 minutes; three

  consecutive failures mark a region DOWN. Recovery: a DOWN region

  needs one 10-minute reboot, the cluster runs only one reboot at a

  time, first-come first-served, and the region is healthy the minute

  the reboot finishes. Leadership: when the primary goes DOWN, the

  alphabetically lowest healthy region is promoted, and every failover

  switch takes 90 seconds, during which writes stall. Writes also

  stall any time fewer than two regions are healthy; overlapping stall

  windows count once. The clock starts at t=0 minutes and everything

  is sequential on one timeline: A''s failing checks land at t=0, 3,

  and 6; B is promoted after A is marked DOWN. C''s failing checks

  land at t=12, 15, and 18. B''s failing checks land at t=20, 23, and

  26. Reboots are requested the minute a region is marked DOWN. A

  status report is taken at t=30. Compute: failovers that occurred,

  reboots completed by t=30, total minutes writes were stalled, and

  the final primary region. Output ONLY this JSON with exactly these

  keys: {"failovers": N, "reboots_done": N, "write_stall_min": N,

  "final_primary": "X"}.'
