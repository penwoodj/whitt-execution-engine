  \ 17:00) pages primary only, one\nslot; severity-2 outside business hours pages\
  \ the on-call rotation,\none slot; severity-3 never pages, it only files a ticket.\
  \ Escalation:\na severity-2 open longer than 240 minutes is re-treated as severity-1\n\
  \u2014 its earlier single page is released and a fresh primary-plus-\nsecondary\
  \ pair is issued, two new slots. Slot accounting: pager slots\ncome from a pool\
  \ of six, a slot frees when its incident resolves, and\nescalation releases the\
  \ old page before issuing the pair. Deploy\nfreeze: while any severity-1 is open,\
  \ every deploy is blocked and\ncounted; deploys outside a freeze run normally.\
  \ Tonight: incident A,\nseverity-2, opened 08:30 and is still open. Incident B,\
  \ severity-2,\nopened 09:15 and resolved 10:40. Incident C, severity-1, opened\n\
