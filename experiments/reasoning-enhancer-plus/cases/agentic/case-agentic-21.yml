  \ Compute as of 13:30: total pages ever issued,\npager slots currently in use,\
  \ escalations that fired, and deploys\nblocked. Output ONLY this JSON with exactly\
  \ these keys:\n{\"pages_issued\": N, \"slots_in_use\": N, \"escalations\": N,\n\
