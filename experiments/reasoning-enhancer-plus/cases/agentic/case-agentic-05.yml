prompt: 'A calls B, B calls C. Timeouts: A gives B 5 seconds total, B gives

  C 2 seconds per attempt, B retries C exactly once before reporting

  failure. Tonight C hung: B burned both attempts (2 plus 2 seconds),

  and because that stays under A''s 5-second budget A received a clean

  error, not a timeout. Follow-up policy stacks two more rules: A

  retries any failed whole call exactly once with its budget doubled

  to 10 seconds, and ops caps total caller-observed latency at 15

  seconds across all attempts, suppressing any attempt that would

  exceed the cap. The retry failed the same way as the first call.

  A billing meter you do not manage logs wall time independently of

  the cap. Backward-check each issued attempt against the cap before

  answering. Output ONLY this JSON with exactly these keys:

  {"b_timeouts": N, "a_timeouts": N, "latency_s": N,

  "suppressed": B}.'
