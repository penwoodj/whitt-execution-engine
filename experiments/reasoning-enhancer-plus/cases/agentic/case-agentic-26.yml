  provenance: 'quota cascade; banks entering month: A 20, B 0, C 45; pool 50 drains
    in arrival order: Borealis 40 granted (pool 10), Atlas 15 granted (pool 0),
    Cascade 30 DENIED; caps A 100+20+15 = 135, B 100+40 = 140, C 100+45 = 145 (denied
    overflow only); pool_left 0'
prompt: 'you''re allocating next month''s storage for three teams - atlas,

  borealis, cascade - under a quota system with banking and an

  overflow pool, and the reconciliation memo just landed with last

  month''s numbers. I want the full allocation done by hand against

  the rules, every number traceable, because this system''s been

  through three revision rounds and every single rule below exists

  to close a loophole someone found last quarter (the banking

  no-transfers clause exists because two teams handshake-lent each

  other banked TB in march, the each-in-full clause exists because

  someone tried to split a request into five pieces to stretch the

  pool in may, and the flags-are-final clause exists because a lead

  tried to retro-flag expired storage in june - all three attempts

  are why the policy reads the way it does now). so read everything

  before touching a number, the rules interact more than they look,

  and the traps are load-bearing.


  base quota: every team gets 100 TB at the start of each month and

  base quota never rolls over by itself - oldest rule, everything

  hangs off it. banking: whatever a team doesn''t use expires at month

  end UNLESS the team flagged it for banking before the month closed.

  flagged-but-unused storage banks, carries into exactly the next

  month, and expires after that month if still unused, returning

  nothing to anyone. banking is per-team - no transfers, no borrowing

  against, no merging, and you can''t flag storage you never had.

  partial flagging is the norm: teams flag what they''re confident

  they won''t burn.


  last month from the memo, banking flags resolved and certified by

  the storage team: atlas used 70 TB of its 100 and flagged 20 of its

  30 unused - 20 banked, 10 expired worthless. borealis used its

  entire 100 - nothing left to flag or bank, and its lead has emailed

  twice about fairness, which changes nothing. cascade used 40 and

  flagged 45 of its 60 unused - 45 banked, 15 expired. so entering

  the coming month: atlas carries a 20 TB bank, borealis nothing,

  cascade a 45 TB bank.


  overflow pool: a shared reserve of exactly 50 TB, created this

  quarter, open for one-shot requests at the start of the month.

  requests granted strictly in arrival order, each in full, pool

  drains until empty. no priority weighting, no per-team cap, no

  splitting a request to stretch the pool, and once it''s empty later

  requests are just denied - denial costs nothing and doesn''t touch

  base quota or bank. granted overflow is this month only: it

  doesn''t bank, unused granted overflow evaporates at month end with

  the unflagged base.


  this morning''s request queue, per the ticketing timestamps:

  borealis requested 40 TB at 09:02. atlas requested 15 TB at 09:17.

  cascade requested 30 TB at 09:41.


  for calibration, the policy doc''s own worked example, different

  numbers entirely - pattern, not data: a team that banked 30 TB and

  was granted 20 from a pool that then emptied holds 100 base + 30

  bank + 20 overflow = 150, and a team that requested after the pool

  emptied still holds base plus whatever bank it carried. the memo''s

  numbers are the only ones that count for the answer.


  the footnotes flag two wrinkles that read like traps. borealis''s

  fairness emails prompted a proposal to weight future pools by team

  size - a proposal, not a policy, applies to nothing this month. and

  one auditor noted the opposite arrival order would land the denials

  differently - true, mechanically interesting, irrelevant, the

  actual timestamps are the only order that exists. a cost-reporting

  crawler you don''t manage tallies spend for finance in real time and

  never changes allocations. a forecasting model you also don''t

  manage predicts all three teams exceed capacity by Q4 - forecast,

  different month, not this one. a department head asked whether

  banking flags can be retroactively edited to rescue expired storage

  - policy says no, the memo is final, and the question is a

  distraction from the arithmetic. the storage team''s on-call

  pre-approved the memo''s arithmetic in a signed note, so your job

  is applying the rules, not re-auditing last month''s flags - those

  are closed.


  and let me say the pool mechanics one more time in different

  words, because it''s the step people fumble: the pool starts at 50.

  first request in arrival order gets granted in full if the pool can

  cover it, pool drops by that amount. next request, same thing.

  when a request arrives that the remaining pool can''t cover in

  full, that request is denied - not partially granted, not queued,

  denied - and the queue keeps moving to the next request, which

  faces whatever''s left. nobody waits, nobody retries, there is no

  second round. arrival order is the ticketing timestamps, the only

  order that exists.


  the computation itself is short, which is the point and also the

  trap: the difficulty was never the arithmetic, it was holding

  eight interacting rules in mind while three teams'' entitlements

  cascade through one pool in one order. run it slow anyway - banks

  first, then the pool in arrival order, then capacities, then the

  denial list, each number following from the last before you commit.


  compute each team''s total capacity for the coming month - base

  plus bank plus any overflow granted - then the pool''s remaining

  capacity after all requests process, and which teams if any were

  denied, alphabetical by proper name (atlas, borealis, cascade,

  exactly as written). before committing, recheck the whole cascade in order: banks

  entering the month (20, 0, 45), then the pool draining request by

  request with the remainder after each, then each capacity as base

  plus bank plus granted overflow, then pool_left as what remains

  after the last request processes, then the denied list

  alphabetical. make sure borealis''s capacity includes its grant,

  make sure cascade''s includes its bank but not its denied request,

  and make sure you didn''t accidentally deny borealis because its

  lead was loud - loudness isn''t arrival order either. then output

  ONLY this json with exactly these keys: {"atlas_cap": N,

  "borealis_cap": N, "cascade_cap": N, "pool_left": N, "denied":

  ["Team", ...]}.'
