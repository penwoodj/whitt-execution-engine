prompt: 'You are scheduling three models on one 8 GB GPU for jobs A, B, C

  running strictly in order, one at a time. A needs the 5 GB model, B

  the 3 GB model, C the 5 GB model again. Residency rules: total

  resident must stay at or under 8 GB, a running job''s model must be

  resident when the job starts, and after each job finishes its model

  is unloaded for maintenance. Both models begin loaded. Each load

  costs 30 seconds and each unload 10 seconds. A telemetry agent you

  do not manage samples VRAM continuously and its samples never change

  what is resident. Compute total load seconds, total unload seconds,

  and how many loads actually happen across the whole schedule. Verify

  each transition against the residency cap before answering. Output

  ONLY this JSON with exactly these keys: {"loads": N,

  "load_s": N, "unload_s": N}.'
