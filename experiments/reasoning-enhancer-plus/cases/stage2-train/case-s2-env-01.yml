  provenance: b39-class envelope; v2 adds nested links + 6 keys to break retry round
prompt: 'A paginated API has 1,189 total records, 25 per page, base URL

  /api/v1/items, rate limit 100 req/hour. Emit ONLY this JSON (any key

  order) with exactly these 6 keys:

  {"page": 1, "per_page": 25, "total": 1189, "total_pages": T,

  "last_page_items": L, "links": {"next": "/api/v1/items?page=2",

  "self": "/api/v1/items?page=1"}}

  Compute T and L correctly. No extra keys, no trailing text.'
draft_response: PLACEHOLDER
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"page": 1, "per_page": 25, "total": 1189, "total_pages": 48, "last_page_items":
      14, "links": {"next": "/api/v1/items?page=2", "self": "/api/v1/items?page=1"}}'
