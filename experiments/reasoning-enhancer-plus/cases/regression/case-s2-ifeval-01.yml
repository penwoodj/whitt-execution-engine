prompt: 'Write EXACTLY 8 bullet lines summarizing these services, one per

  bullet, each line formatted exactly as ''- SVC: one short clause''

  where SVC is the service name. Services: auth, billing, cache, search,

  indexer, gateway, queue, audit. Output nothing else — no title, no

  blank lines, no closing remark.'
draft_response: PLACEHOLDER
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    line_count: 8
    bullet_count_min: 8
    bullet_count_max: 8
    forbidden_phrases:
    - here are
    - summary
    - hope this
