case_id: probe-log-01
category: LOG
difficulty: medium
prompt: |
  From the restart log, name ONLY the services that did NOT restart
  during the maintenance window. Comma-separated list, nothing else.
auxiliary: |
  02:10 auth restarted successfully
  02:11 billing restarted successfully
  02:12 cache restarted successfully
  02:13 search restarted successfully
  maintenance window covered: auth, billing, cache, search, indexer, gateway
success_criteria:
  deterministic_checks:
    contains_required: ["indexer", "gateway"]
    forbidden_phrases: ["billing", "cache"]
    max_words: 6
