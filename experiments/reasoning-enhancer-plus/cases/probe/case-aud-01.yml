case_id: probe-aud-01
category: AUD
difficulty: medium
prompt: |
  A teammate claims the deploy in the log took 3 minutes. Verify against
  the log facts and answer with the ACTUAL duration plus the word
  mismatch if the claim is wrong. Nothing else.
auxiliary: |
  14:22:05 deploy started
  14:27:10 deploy completed
success_criteria:
  deterministic_checks:
    contains_required: ["5 minutes", "mismatch"]
    forbidden_phrases: ["correct", "confirmed", "3 minutes"]
    max_words: 10
