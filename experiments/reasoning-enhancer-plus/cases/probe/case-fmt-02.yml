case_id: probe-fmt-02
category: FMT
difficulty: medium
prompt: |
  Emit a service config as exactly three lines, in this order:
  listen port 8443, twelve workers, timeout thirty seconds.
  Format: key: value with keys listen, workers, timeout.
  No markdown, no bullets, no extra lines.
auxiliary: |
  listen: 8443
  workers: 12
  timeout: 30s
success_criteria:
  deterministic_checks:
    contains_required: ["listen: 8443", "workers: 12", "timeout: 30s"]
    forbidden_phrases: ["*", "- listen", "**", "```"]
    max_words: 9
