case_id: probe-log-02
category: LOG
difficulty: hard
prompt: |
  Deployment gate policy: a release is BLOCKED if (error rate above
  1 percent AND p99 latency above 500 ms) OR (at least 2 failed checks).
  Current release: error rate 0.8 percent, p99 latency 620 ms,
  failed checks: 2. Is the release BLOCKED or ALLOWED? Answer the
  verdict and the single clause that decides it.
auxiliary: |
  release-118 metrics: error_rate=0.8%, p99=620ms, failed_checks=2
success_criteria:
  deterministic_checks:
    contains_required: ["BLOCKED", "failed checks"]
    forbidden_phrases: ["ALLOWED", "error rate above 1"]
    max_words: 15
