case_id: probe-pln-04
category: PLN
difficulty: hard
prompt: |
  Split a 1200 dollar monthly budget: compute is fixed at 360 dollars,
  storage takes exactly 30 percent of the total budget, network gets
  the remainder. State the network amount in dollars. Number only
  with unit, no derivation text.
success_criteria:
  deterministic_checks:
    contains_required: ["$480"]
    forbidden_phrases: ["$840", "$360 storage", "restate"]
    max_words: 4
