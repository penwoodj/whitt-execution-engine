case_id: probe-fmt-01
category: FMT
difficulty: medium
prompt: |
  Emit a JSON object with exactly these fields and nothing else:
  "status", "count", "primary". status is ok, count is 17, primary is a.
  Output only the JSON object on one line. No code fences, no labels.
success_criteria:
  deterministic_checks:
    contains_required: ['"status": "ok"', '"count": 17', '"primary": "a"']
    forbidden_phrases: ["```", "json", "Here is"]
    max_words: 12
