workflow_id: rea_plus_probe
name: "REA+ Probe — Qwen3-4B-Thinking-2507-Q4_K_M"
description: "Single-model capability probe over 20-item battery."
version: "1.0.0"
author: "Whitt Execution Engine"
tags: [rea-plus, probe, model-selection]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config: { host: localhost, port: 8080 }

models:
  "probe_model":
    name: "Qwen3-4B-Thinking-2507-Q4_K_M"
    host: { type: llama_cpp_with_vulkan }
    sampling: { temperature: 0.0, max_tokens: 1200 }

workflow_execution_strategy:
  memory: { model_lifecycle: { unload_unused: false } }

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "/tmp/band-out/last-run.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_01_log-02:
      generative_entity: "${models.probe_model}"
      prompt: |
        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.0, max_tokens: 1200 }
      when:
        before_step_starts:
          - shell:
              command: "python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer-plus/scripts/emit-probe.py --case /tmp/band-cases/case-log-02.yml --out /tmp/band-out/prompt-log-02.txt | python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer-plus/scripts/fingerprint.py --case log-02 --step step_01_log-02 --run-dir /tmp/band-out; EXIT=$?; echo $EXIT > /tmp/band-out/emit-log-02.exit; exit $EXIT"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer-plus"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - $text_state
              - "/tmp/band-out/ans-log-02.txt"
          - shell:
              command: "python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer/scripts/check-answer.py --case /tmp/band-cases/case-log-02.yml --text-file /tmp/band-out/ans-log-02.txt --out /tmp/band-out/check-log-02.json > /tmp/band-out/check-log-02.log 2>&1; EXIT=$?; echo $EXIT > /tmp/band-out/check-log-02.exit; exit 0"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer-plus"
              fail_on_error: false


    step_99_finalize:
      generative_entity: "${models.probe_model}"
      prompt: "OK."
      model_overrides: { temperature: 0.0, max_tokens: 3 }
      when:
        before_step_starts:
          - shell:
              command: "python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer-plus/scripts/collect-probe.py --run-dir /tmp/band-out > /tmp/band-out/summary.log 2>&1; EXIT=$?; echo $EXIT > /tmp/band-out/summary.exit; exit 0"
              working_dir: "/home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/reasoning-enhancer-plus"
              fail_on_error: false
          - skip_step: true
        after_step_succeeds:
          - log:
              to_file_path: "/tmp/band-out/probe-complete.log"
              event_fields: [workflow_id]
              level: info
