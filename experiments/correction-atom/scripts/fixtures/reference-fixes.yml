  - "Backfilling cut queue times almost in half overnight."
  - "We should have added observability hooks from day one."
"024": |
  - Current peak traffic is 12,000 requests/second.
  - Committed capacity after the hardware refresh is 20,000 requests/second.
  - The projected Q4 peak from the traffic model is 15,000 requests/second.
"025": |
  - The baseline configuration achieved 820 rps with a p99 latency of 145ms.
  - With backfill enabled, throughput rose to 1310 rps at 138ms p99.
  - Pinning alone delivered 1180 rps at 92ms p99.
  - The combined configuration reached 1560 rps at 88ms p99, the best overall.
