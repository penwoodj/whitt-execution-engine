"001": |
  - The generator must pass validator scoring with 8 criteria on a 50-point scale, with scores below 45 triggering fix cycles.
  - Three consecutive failed fix cycles result in escalation to the user rather than silent acceptance of flawed output.
  - Validator evidence is required for acceptance; no output is accepted based solely on the generator's own claim of completeness.
