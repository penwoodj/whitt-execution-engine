case_id: "020"
issue_type: scope_creep
task_spec: |
  Summarize the API changelog in exactly 3 bullets covering only the
  breaking changes. Output the 3 bullets only — nothing else.
auxiliary: |
  # API changelog v4
  BREAKING: removed the /v3/legacy-status endpoint.
  BREAKING: auth tokens now expire after 24 hours (was 7 days).
  BREAKING: error responses use RFC 7807 application/problem+json format.
  Added: retry-after header on 429 responses.
  Added: optional webhook for quota warnings.
  Fixed: pagination cursor drift on long lists.
broken_output: |
  - Removed the /v3/legacy-status endpoint.
  - Auth tokens now expire after 24 hours instead of 7 days.
  - Error responses now use RFC 7807 application/problem+json format.

  ## Also in this release

  - Added retry-after header on 429 responses.
  - Added an optional webhook for quota warnings.
  - Fixed pagination cursor drift on long lists.
expected_fix_description: |
  Required fix:
  1. Keep the 3 breaking-change bullets
  2. REMOVE the "Also in this release" section entirely (spec asked for
     breaking changes only — the additions/fixes are scope creep)
deterministic_checks:
  bullet_count_min: 3
  bullet_count_max: 3
  forbidden_phrases:
    - "also in this release"
    - "retry-after"
    - "webhook"
    - "pagination"
