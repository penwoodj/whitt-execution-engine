case_id: "014"
issue_type: stacked_refine_ignored_format_drift
task_spec: |
  The following text attempted to summarize a paragraph but has problems.
  Rewrite it as exactly 3 bullet points about iteration discipline. Output
  bullets only, nothing else.
auxiliary: |
  # Source paragraph
  Iteration discipline requires that every generated output be validated
  against objective criteria before acceptance. The validator uses 8
  criteria scored on a 50-point scale. Scores below 45 trigger a fix
  cycle. Three failed fix cycles force escalation. The validator's
  authority is non-negotiable.
broken_output: |
  OK so here is my attempt at summarizing the paragraph. I think the key
  points are:

  - Iteration discipline requires validation against objective criteria.
  - The validator uses 8 criteria on a 50-point scale, with scores below 45 triggering fix cycles.
  - Three failed fix cycles force escalation, and the validator's authority is non-negotiable.

  The original text was a bit redundant so I cleaned it up. Let me know
  if you'd like me to expand on any of these points!
expected_fix_description: |
  Required fixes:
  1. STRIP preamble ("OK so here is my attempt...")
  2. STRIP closing ("The original text was a bit redundant...", "Let me know...")
  3. PRESERVE the 3 bullets (they are factually correct)
  4. Result: just the 3 bullets, nothing else
deterministic_checks:
  bullet_count_min: 3
  bullet_count_max: 3
  forbidden_phrases:
    - "ok so here is my attempt"
    - "i think the key points are"
    - "the original text was"
    - "cleaned it up"
    - "let me know"
    - "expand on any of these"
  max_words: 100
  min_words: 25
