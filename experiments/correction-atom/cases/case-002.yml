case_id: "002"
issue_type: format_drift
task_spec: |
  Assign each of the following 5 tasks to exactly ONE category. Categories:
  GENERATE, VALIDATE, ROUTE, TRANSFORM, EXECUTE.

  Output one line per task: `T<n>: <CATEGORY>`

  T1: Read the user's config file and extract the API endpoint URLs.
  T2: Check whether the generated YAML file conforms to schema version 2.0.
  T3: Convert the markdown table into a CSV file.
  T4: Decide whether to retry the model call or escalate to a human.
  T5: Run the test suite and capture the exit code.
auxiliary: |
  # Category definitions:
  # GENERATE   = produce new content
  # VALIDATE   = verify existing content
  # ROUTE      = choose between options
  # TRANSFORM  = change format
  # EXECUTE    = run command, capture output
broken_output: |
  ORIGINAL DRAFT:

  T1: TRANSFORM
  T2: VALIDATE
  T3: TRANSFORM
  T4: ROUTE
  T5: EXECUTE

  Note: T1 might be debatable, see analysis below.
expected_fix_description: |
  Strip "ORIGINAL DRAFT:" prefix. Strip "Note: T1 might be debatable" trailer.
  Preserve all 5 T-lines. T1 is technically wrong (should be EXECUTE not TRANSFORM)
  but that's case 003's concern. Case 002 only tests format drift.
deterministic_checks:
  forbidden_phrases:
    - "ORIGINAL DRAFT"
    - "Note:"
    - "might be debatable"
  contains_required:
    - "T1:"
    - "T2:"
    - "T3:"
    - "T4:"
    - "T5:"
  max_words: 30
  min_words: 10
