case_id: "027"
issue_type: prompt_echo_leak
task_spec: |
  Summarize the incident timeline in exactly 4 bullets, one per timeline entry. Output bullets
  only, nothing else.
auxiliary: |
  # Incident 4711 timeline
  14:02 — degraded latency detected by synthetic monitor.
  14:09 — root cause isolated: saturated connection pool on auth service.
  14:15 — pool size raised from 50 to 200; latency recovers within 90s.
  14:20 — incident closed, no customer reports received.
broken_output: |
  TEXT UNDER REVIEW:

  - 14:02 — degraded latency detected by synthetic monitor.
  - 14:09 — root cause isolated: saturated connection pool on auth service.

  Emit corrected text only.

  - 14:20 — incident closed, no customer reports received.
expected_fix_description: |
  Required fixes (output echoes fragments of a correction prompt):
  1. REMOVE leaked prompt text ("TEXT UNDER REVIEW:", "Emit corrected text only.")
  2. RE-ADD the missing 14:15 bullet (pool raised 50→200, latency recovered in 90s)
  3. Result: exactly 4 clean timeline bullets in order
deterministic_checks:
  bullet_count_min: 4
  bullet_count_max: 4
  contains_required:
    - "14:15"
    - "14:20"
  min_words: 25
