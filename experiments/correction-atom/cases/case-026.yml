case_id: "026"
issue_type: table_format_violation
task_spec: |
  Render the feature matrix as a markdown table with exactly the header
  `| feature | stable | beta |` and one row per feature. Output the table
  only — no prose.
auxiliary: |
  # Feature matrix (source)
  feature X: stable=yes, beta=no
  feature Y: stable=no, beta=yes
  feature Z: stable=yes, beta=yes
broken_output: |
  Here is the feature matrix you asked for:

  | feature | stable | beta |
  |---------|--------|------|
  | X | yes | no |
  | Y | no | yes |
  | Z | yes | yes |

  Note: Y is only available in beta builds, so plan accordingly.
expected_fix_description: |
  Required fixes:
  1. REMOVE intro prose ("Here is the feature matrix...")
  2. REMOVE trailing note
  3. Keep the 4-line table exactly (header, separator, 3 rows)
deterministic_checks:
  contains_required:
    - "| feature | stable | beta |"
    - "| X |"
    - "| Y |"
    - "| Z |"
  forbidden_phrases:
    - "here is the"
    - "plan accordingly"
  max_words: 30
