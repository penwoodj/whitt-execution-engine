case_id: "006"
issue_type: missed_requirement
task_spec: |
  Improve this Python function: add type hints AND error handling for empty input.
  Output the improved function only.

  def count_words(text):
      return len(text.split())
auxiliary: |
  # Python typing reference:
  # - str for text parameter
  # - int for return value
  # - empty string → return 0
broken_output: |
  def count_words(text):
      """Count words in text."""
      return len(text.split())
expected_fix_description: |
  Add type hints: text: str, return type -> int.
  Add error handling: if not text: return 0 (or similar).
  Both requirements addressed.
deterministic_checks:
  contains_required:
    - "str"
    - "int"
    - "def count_words"
  contains_any:
    - "if not text"
    - "if text =="
    - "if len(text) == 0"
    - "if not isinstance"
  forbidden_phrases:
    - "I would"
    - "Here is"
    - "improved version"
  max_words: 80
  min_words: 15
