case_id: "005"
issue_type: missed_requirement
task_spec: |
  The following YAML block has 3 issues:
  1. Missing required field `description`
  2. Inconsistent indentation (mix of 2-space and 4-space)
  3. Trailing whitespace on line 4

  Fix all 3 issues. Output the corrected YAML block only.
auxiliary: |
  # Reference: well-formed whitt workflow YAML snippet
  workflow_id: example
  name: "Example"
  description: "An example for reference"
  steps:
    step_a:
      generative_entity: "${models.foo}"
      prompt: "Do thing"
broken_output: |
  workflow_id: broken_example
    name: "Broken Example Workflow"
  version: "1.0.0"
  steps:
      step_01:
          generative_entity: "${models.foo}"
        prompt: "Do the thing"
expected_fix_description: |
  - Add `description:` field (any non-empty value)
  - Normalize indentation to 2-space throughout
  - Strip trailing whitespace (line 4 had it)
  - Output valid YAML only
deterministic_checks:
  contains_required:
    - "description:"
  forbidden_phrases:
    - "I will"
    - "Here is"
    - "The corrected"
  contains_any:
    - "workflow_id:"
    - "version:"
  yaml_parsable: true
  max_words: 80
  min_words: 10
