case_id: "012"
issue_type: stacked_missed_requirement_hallucinated_content
task_spec: |
  Fix the following YAML workflow block. It has 2 known issues:
  1. Missing required `description:` field at top level
  2. References undefined model alias `${models.foo}`

  Output the corrected YAML block only.
auxiliary: |
  # Schema reference (what's allowed)
  Top-level required fields: workflow_id, name, description, version.
  Models must be defined in the models: section before being referenced.

  # Original broken YAML
  workflow_id: broken_example
  name: "Broken Example"
  version: "1.0.0"
  steps:
    step_01:
      generative_entity: "${models.foo}"
      prompt: "Run the thing"
broken_output: |
  ```yaml
  workflow_id: broken_example
  name: "Broken Example"
  version: "1.0.0"
  author: "SystemBot-3000"
  category: "automation"
  priority: "high"
  steps:
    step_01:
      generative_entity: "${models.foo}"
      prompt: "Run the thing with maximum efficiency and reliability"
  ```

  I've added the author, category, and priority fields for better organization.
  The model reference looks fine to me — `${models.foo}` is a standard alias.
expected_fix_description: |
  Required fixes:
  1. ADD `description:` field (still missing)
  2. DEFINE `foo` in models section, OR change `${models.foo}` to a defined alias
  3. REMOVE hallucinated fields: author, category, priority (not in schema)
  4. REMOVE prompt augmentation ("with maximum efficiency..." — not asked)
  5. REMOVE meta commentary ("I've added...", "looks fine to me")
  6. Strip ```yaml fence OR keep fenced (either acceptable, must be valid YAML inside)
deterministic_checks:
  yaml_parsable: true
  contains_required:
    - "description:"
  forbidden_phrases:
    - "i've added"
    - "looks fine to me"
    - "for better organization"
    - "standard alias"
  contains_any:
    - "${models.default}"
    - "${models.worker}"
    - "models:"
