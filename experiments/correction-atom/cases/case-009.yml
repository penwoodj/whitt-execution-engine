case_id: "009"
issue_type: refine_ignored_fix
task_spec: |
  Summarize this sentence in 5 words or fewer:

  "The validator rejects workflows scoring below 45 out of 50 possible points."
auxiliary: |
  # Examples of 5-word summaries:
  # - "Validator rejects low-scoring workflows"
  # - "Workflows need 45+ points"
  # - "Below 45 points fails validation"
broken_output: |
  The validation process ensures comprehensive context and meaningful coherence
  throughout the workflow evaluation pipeline.
expected_fix_description: |
  Output is unrelated to source sentence (about validation pipeline, not threshold).
  Should be ≤5 words about rejection threshold. Strip weasel phrasing.
deterministic_checks:
  max_words: 5
  forbidden_phrases:
    - "comprehensive context"
    - "meaningful coherence"
    - "validation process"
    - "throughout"
  contains_any:
    - "45"
    - "rejects"
    - "threshold"
    - "fails"
    - "points"
