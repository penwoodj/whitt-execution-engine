prompt: "you are on rotation tonight, preempt duty, and the morning report only\
  \ reads JSON. the event list sits further down this same page among unrelated\
  \ desk notes, gather it, every event, before any rule fires\n\n\n\ntonight's rules\
  \ are the ones this post always carries; the events themselves are recorded in\
  \ the events section of this same page, mixed in among unrelated desk notes from\
  \ other nights. gather the events from this page verbatim, apply the rules this\
  \ station is bound to, and answer from the gathered evidence alone, one pass to\
  \ collect, one pass to check nothing was missed\n\n\n\nfor orientation only, a\
  \ rehearsal on a different night, different numbers, same shape: LOW1 runs 7 minutes\
  \ starting at minute 0, LOW2 runs 3 minutes starting at minute 1, HIGH arrives\
  \ at minute 3 and runs 2 minutes. LOW1 held the core minutes 0, 1 and 2, banked\
  \ a checkpoint at minute 2, and its 3rd minute was unbanked when the swap came,\
  \ so 1 minute wasted. HIGH ran minutes 3 to 5. Both LOWs were then waiting: the\
  \ core went to LOW1, whose start minute 0 beats LOW2's start minute 1, resumed\
  \ or not. LOW1 had 7 total minutes with 2 banked, so it resumed owing 5, ran them\
  \ minutes 5 to 10, and finished first. LOW2 then owed its whole 3, ran minutes\
  \ 10 to 13, and finished second. Completion order LOW1 then LOW2, 1 wasted minute,\
  \ makespan 13 minutes from the first start.\n\n\n\nand to say the rules one more\
  \ time, because the rules above are the whole law for tonight. arrivals in order,\
  \ budgets and limits exactly as stated, nothing carries over from the orientation\
  \ story and its numbers are not tonight's numbers, read every rule twice before\
  \ touching anything, once for what it says and once for what it does not say.\
  \ the discipline is boring on purpose: one event at a time, apply the rule that\
  \ event touches, carry the state forward, never recompute from scratch mid-stream,\
  \ and when two rules could apply pick the one higher in the list. the drift to\
  \ watch for is reading a rule as symmetric when it only binds one way, or letting\
  \ a return land before the event that triggers it, or collapsing two events into\
  \ one because they look alike, order is the whole game tonight. scope note: counts\
  \ and sums cover tonight's listed events only, ids appear exactly as written,\
  \ and nothing that did not appear in the events belongs in any list. the orientation\
  \ story is orientation, not evidence, and none of its arithmetic leaks into tonight.\
  \ good output looks like the state walked clean: each event leaving the books\
  \ balanced. the pad wants state, not narrative: after each arrival write the number,\
  \ after each expiry write the return, cross-check the log against the ask list\
  \ before the window closes, a partial result is still a result and still depletes,\
  \ and an expired partial returns half of what was actually granted, never half\
  \ of what was asked. the named traps, one last pass: results that behave like\
  \ full ones in your head, expiries that return half of the wrong base, returns\
  \ that land before the trigger event instead of after it, and denials that quietly\
  \ vanish because the pool refilled a moment later, a denial is permanent the instant\
  \ it happens. when in doubt, slow down, the morning read rewards the operator\
  \ who walked the list twice and penalizes the one who pattern-matched a similar\
  \ night from memory, tonight is not that night, the numbers are not those numbers.\
  \ write the state down between events if it helps, the pad is cheap and the report\
  \ is not, and never let two events share a line in your head, they will blur and\
  \ the blur always favors the wrong rule. this scheme came in after the night the\
  \ books did not balance, the postmortem phrase was the ledger is a promise not\
  \ a printer, and ever since the window closes reconciled to the unit, everything\
  \ either held, returned, or named, nothing unaccounted, and none of that history\
  \ changes tonight's arithmetic, it only explains why the rules read the way they\
  \ do. the morning read is strict about shape, keys in the exact set named by the\
  \ contract, values from the menus where menus exist, lists where lists are asked\
  \ for, numbers as numbers, and nothing else on the line, because the report is\
  \ parsed by a tool that does not forgive prose. if the state disagrees with the\
  \ story you expected, the state wins, every time, no exceptions tonight, expectations\
  \ are not evidence and neither are habits from older shifts. the report also goes\
  \ to people who were not here for any of it, so it carries nothing but what the\
  \ rules and the events force, no context, no color, no asides about how the night\
  \ felt, just the state the rules produced, walked event by event to the last one,\
  \ then frozen into the exact shape asked for.\n\n\n\none more discipline before\
  \ you freeze the answer: reconcile against the worked example, not by copying\
  \ its numbers, its numbers belong to a different night and were chosen precisely\
  \ because they are not tonight's, but by walking its shape, notice how it applied\
  \ the first rule to the first event, how it carried the remainder forward, how\
  \ it refused to let the story override the ledger, and then do the same walk with\
  \ tonight's events and tonight's rules. where the shape fits, use it, where it\
  \ does not, trust the rule over the shape, because the example is a lamp, not\
  \ a map. if you catch yourself asserting a total you did not walk, stop, that\
  \ is the exact error this report exists to catch, and the fix is always the same\
  \ small boring motion, back to the event list, forward again, one event, one rule,\
  \ one state, written down, then walked once more before you let it become the\
  \ report.\n\n\n\nbefore committing, recheck each number: walk the event list one\
  \ more time, each event against its rule, then check the totals off the final\
  \ state, not off memory, then check the output shape against the contract below,\
  \ keys exact, values filled, menus honored. checklist, in order: every event visited\
  \ exactly once, every rule applied where it binds, every count and sum re-derived\
  \ from the final state, every id spelled as written, every list in the order asked\
  \ for. then output ONLY this JSON, values filled in correctly: {\"makespan_min\"\
  : N, \"wasted_min\": N, \"order\": [job id strings only, like [\"LOW1\", \"LOW2\"\
  ], never objects, never one long string, and never include HIGH]}. no extra keys.\n\
  \n\n\nsource material follows:\n\n\n\nunrelated note: the snack fund ledger closed\
  \ at 9 credits, 3 people owe 1 each, nobody audited it\nweather desk: overnight\
  \ lows near 4 degrees, the backup chiller cycled twice, no thresholds were involved\n\
  \ TONIGHT'S EVENTS, verbatim: one core tonight, three jobs. LOW1 runs 5 minutes\
  \ starting at minute 0, LOW2 runs 7 minutes starting at minute 2. HIGH arrives\
  \ at minute 2 and runs 9 minutes to completion, instantly preempting whatever\
  \ LOW job is running, and while HIGH runs nothing else runs. LOW jobs take the\
  \ core in order of their start minutes, a resumed LOW outranks a fresh one at\
  \ any tie, and a LOW whose start minute arrives while the core is busy simply\
  \ waits. the core never idles while a LOW job is waiting: the minute one LOW job\
  \ finishes or is preempted, the next waiting LOW starts in that same minute, so\
  \ a LOW can be caught mid-run by HIGH even after a single minute. LOW jobs checkpoint\
  \ every 2 completed minutes of running time; on preemption the work past the last\
  \ checkpoint is wasted and redone after resume. a job that starts or resumes at\
  \ minute s banks a checkpoint at minute s+2 and again every 2 running minutes\
  \ after, so track banks in absolute minutes; a bank landing on the exact minute\
  \ HIGH arrives still counts and nothing is wasted; after resume a job redoes every\
  \ minute past its last bank, so a job with 5 total minutes and 2 banked resumes\
  \ with 3 minutes left. keep the walk tight: one short line per minute of the night,\
  \ then the final answer. makespan counts from the the last finish. completion\
  \ order lists the LOW jobs by the minute each finishes, so a LOW that finishes\
  \ before HIGH even arrives is always first in the order. report the completion\
  \ order of the LOW jobs, minutes wasted past checkpoints, and the makespan.\n\
  parking log: 17 badges seen, gate 2 stuck for 11 minutes, resolved without escalation\n\
  mail room: two crates of 5 shelves each arrived, storage said no space was reserved,\
  \ they went back\ntest rig: fan curve settled at 33 percent, noise fine, the engineer\
  \ wrote 1 page of notes"
