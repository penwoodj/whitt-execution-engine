prompt: 'you are on rotation tonight, quota duty, and the morning report only reads
  JSON.




  you hold the release-token pool for tonight''s deploy window. the pool starts
  at 40 tokens. requests land in strict arrival order, each asks for a fixed number
  of tokens, grants are partial when the pool cannot cover the full ask, grant what
  is there and the pool drops to zero, a request arriving at an empty pool is denied
  and listed by id, the grant for r2 expires after request r3 completes, an expired
  grant returns half its granted tokens rounded down to the pool, grants never return
  any other way. arrival order: r1 asks for 5; r2 asks for 8; r3 asks for 12; r4
  asks for 14; r5 asks for 17; r6 asks for 21.




  for orientation only, a sister pool on a different night, different numbers, same
  shape: that pool started at 30 tokens, the first ask was 11, the second 7, then
  the first grant expired and returned 5, half of 11 rounds down, never up, and
  the third ask of 13 landed against only 17 in the pool so it took a partial and
  drained it. that night closed with 31 granted, nothing denied, 4 left on the books.
  watch the rounding direction, watch the slot the expiry lands in, the return arrives
  right before the request the trigger names, not after it.




  and to say the rules one more time, because the rules above are the whole law
  for tonight. arrivals in order, budgets and limits exactly as stated, nothing
  carries over from the orientation story and its numbers are not tonight''s numbers,
  read every rule twice before touching anything, once for what it says and once
  for what it does not say. the discipline is boring on purpose: one event at a
  time, apply the rule that event touches, carry the state forward, never recompute
  from scratch mid-stream, and when two rules could apply pick the one higher in
  the list. the drift to watch for is reading a rule as symmetric when it only binds
  one way, or letting a return land before the event that triggers it, or collapsing
  two events into one because they look alike, order is the whole game tonight.
  scope note: counts and sums cover tonight''s listed events only, ids appear exactly
  as written, and nothing that did not appear in the events belongs in any list.
  the orientation story is orientation, not evidence, and none of its arithmetic
  leaks into tonight. good output looks like the state walked clean: each event
  leaving the books balanced. the pad wants state, not narrative: after each arrival
  write the number, after each expiry write the return, cross-check the log against
  the ask list before the window closes, a partial result is still a result and
  still depletes, and an expired partial returns half of what was actually granted,
  never half of what was asked. the named traps, one last pass: results that behave
  like full ones in your head, expiries that return half of the wrong base, returns
  that land before the trigger event instead of after it, and denials that quietly
  vanish because the pool refilled a moment later, a denial is permanent the instant
  it happens. when in doubt, slow down, the morning read rewards the operator who
  walked the list twice and penalizes the one who pattern-matched a similar night
  from memory, tonight is not that night, the numbers are not those numbers. write
  the state down between events if it helps, the pad is cheap and the report is
  not, and never let two events share a line in your head, they will blur and the
  blur always favors the wrong rule. this scheme came in after the night the books
  did not balance, the postmortem phrase was the ledger is a promise not a printer,
  and ever since the window closes reconciled to the unit, everything either held,
  returned, or named, nothing unaccounted, and none of that history changes tonight''s
  arithmetic, it only explains why the rules read the way they do. the morning read
  is strict about shape, keys in the exact set named by the contract, values from
  the menus where menus exist, lists where lists are asked for, numbers as numbers,
  and nothing else on the line, because the report is parsed by a tool that does
  not forgive prose. if the state disagrees with the story you expected, the state
  wins, every time, no exceptions tonight, expectations are not evidence and neither
  are habits from older shifts. the report also goes to people who were not here
  for any of it, so it carries nothing but what the rules and the events force,
  no context, no color, no asides about how the night felt, just the state the rules
  produced, walked event by event to the last one, then frozen into the exact shape
  asked for.




  envelope note, binding the output shape: every key in the contract carries exactly
  one value of the stated kind, counts and sums are numbers never words, ids are
  strings exactly as written, lists hold only what the contract names, and a value
  the rules cannot produce is still a well-typed value, an empty list where a list
  belongs




  one more discipline before you freeze the answer: reconcile against the worked
  example, not by copying its numbers, its numbers belong to a different night and
  were chosen precisely because they are not tonight''s, but by walking its shape,
  notice how it applied the first rule to the first event, how it carried the remainder
  forward, how it refused to let the story override the ledger, and then do the
  same walk with tonight''s events and tonight''s rules. where the shape fits, use
  it, where it does not, trust the rule over the shape, because the example is a
  lamp, not a map. if you catch yourself asserting a total you did not walk, stop,
  that is the exact error this report exists to catch, and the fix is always the
  same small boring motion, back to the event list, forward again, one event, one
  rule, one state, written down, then walked once more before you let it become
  the report.




  before committing, recheck each number: walk the event list one more time, each
  event against its rule, then check the totals off the final state, not off memory,
  then check the output shape against the contract below, keys exact, values filled,
  menus honored. checklist, in order: every event visited exactly once, every rule
  applied where it binds, every count and sum re-derived from the final state, every
  id spelled as written, every list in the order asked for. then output ONLY this
  JSON, values filled in correctly: {"granted_units": N, "denied": [ids], "pool_left":
  N} empty list when nothing is denied, ids in arrival order. no extra keys, no
  trailing text.'
