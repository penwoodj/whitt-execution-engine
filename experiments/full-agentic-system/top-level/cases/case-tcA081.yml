prompt_id: tcA081
prompt: 'the task is layer bloat report, and the details are below, all of them.
  i''ve got run a proper multi-stage data job to do and i want it done properly,
  which means /tmp/opencode/layers-run for everything, real scripts i can rerun,
  real files on disk, not a description of what would happen.


  so the scenario: a docker image history dump, 40 layers, each with command and
  size, plus the bloat question: which layers add weight that later layers remove
  and apt-get installs without cleanup are the classic sin, present here three times.
  a rebuilt-slim estimate must be honest about what it cannot know. the whole point
  of this exercise is that the working files and the checkable outputs exist on
  disk where i can poke at them, so every stage leaves real artifacts, and the artifacts
  are the deliverable, not the chat narration around them. if a step produces nothing
  i can open, it didn''t happen.


  the deliverables have two audiences, me skimming on a phone and a verifier grinding
  line by line, so every report needs the human table up top and the machine copy
  underneath, same numbers, no drift between them. the day those two disagree is
  the day i stop trusting the whole setup.


  if any rule you write down feels arbitrary, good, that means you noticed, write
  the threshold and the reason next to it so future-me can argue with it.


  logs per stage, one line each is plenty, i want to see where time went and where
  things broke without spelunking.


  percentages need denominators next to them always, twelve percent of what, because
  a percentage alone is half a number.


  and if you find something in the data that contradicts what i said above, the
  data wins, report the contradiction, don''t quietly bend either one.


  here''s the task list, in sequence:


  1. layer table, index, command, size, cumulative size. and that one gets checked
  by the verifier too, it''s not just a produce-and-hope step.

  2. wasteful-pattern detection, install-without-clean, duplicated data adds, secrets-in-layer
  flagged separately. and that one gets checked by the verifier too, it''s not just
  a produce-and-hope step.

  3. the add-then-remove pairs, weight added and later deleted, net-zero but history-heavy.
  if that stage has a natural ordering dependency on the previous one, respect it,
  the sequence above is not decorative.

  4. slim rebuild estimate, which patterns fixed, projected saving, uncertainty
  stated. and don''t round anything into meaninglessness, i''d rather see the ugly
  precise number than a tidy lie.

  then layers.md plus layers.json plus the fix list. and be precise about what counts
  as done for that one, because vague is where shortcuts hide.


  anything you cache or skip for speed gets a note, because invisible shortcuts
  are how results stop being reproducible.


  and a note on tone in the outputs: plain sentences, tables where tables belong,
  no buzzword garbage, i want to skim this in two minutes and know exactly what
  happened.


  i''d rather have an ugly table that''s right than a beautiful chart that''s approximate,
  so default to tables unless the data genuinely needs a picture.


  timings, real ones, timestamps around each stage, a table at the end. not vibes.


  the workspace layout is yours to design but say it in the readme, so the structure
  is a decision not an accident.


  keep the rules you invent in a rules.md next to the scripts, so when i come back
  in a week i know why the machine did what it did.


  everything gets a run twice test before you call it done, because the first run
  always works and the second one is where the state bugs live.


  the data has problems, deliberately, and handling them is part of the job not
  an error condition: layer sizes are cumulative in the raw dump in two spots requiring
  differentiation, one layer command is truncated with an ellipsis, and a zero-size
  layer does metadata-only work that matters. handle each one explicitly, log it,
  and count them, because ''some rows had issues'' is not a finding, ''fourteen
  clock-skewed entries corrected, listed in the log'' is. the rule you applied to
  each wart belongs in the rules file, next to the wart itself.


  shape of the deliverables: scripts in a scripts folder, outputs in an outputs
  folder, the rules and decisions each in their own file at the root of the workspace,
  and a final report i can read start to finish in two minutes. paths in the report,
  not just filenames, so i can go look.


  if two stages could run in either order and it doesn''t matter, pick one and move
  on, i don''t need a committee meeting about it.


  and when i say documented i mean in a file on disk, not in the chat log where
  it scrolls away forever.


  error messages should say what failed and where, not just that something did,
  because ''an error occurred'' has never helped anybody.


  one more thing, every number you quote me at the end better come from an actual
  run you can point at, because should-be-roughly-nine is not a result, it''s a
  vibe.


  if a stage can honestly be a one-liner, let it be a one-liner, padding steps to
  look thorough is its own kind of lie.


  when a rule and a row disagree, both go in the output, the flagged row and the
  rule that flagged it, side by side.


  and the verification part is not optional, i''ve been burned by tools grading
  their own homework. write a separate verifier that recomputes the key numbers
  from the raw inputs with its own logic, not by importing the pipeline''s code,
  and it exits nonzero with a clear message on any mismatch. run it against the
  outputs and show me the exit codes. a claim without a number i can check is a
  vibe and i''ve had enough vibes.


  don''t skip steps and don''t tell me it''s done until the verifier has passed
  and you''ve actually looked at the outputs yourself. and keep it dependency free,
  standard library only, this machine gets cranky. assume defaults for anything
  unspecified and note what you picked in a decisions file, i''d rather read three
  lines of your reasoning than answer three questions. don''t stop until every stage
  above is done and verified.


  and no leaving a to-do in a comment for later-me, later-me is you in ten minutes,
  finish the job.


  at the end i want the inventory: what lives where, the numbers, and one honest
  paragraph on where this would break first if i stressed it harder.'
