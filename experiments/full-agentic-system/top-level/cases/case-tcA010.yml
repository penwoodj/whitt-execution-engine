prompt_id: tcA010
prompt: 'queue lag report, that''s the theme, here''s the full spec: what i want
  is put together an end-to-end processing exercise, set up inside /tmp/opencode/queue-run,
  and i want it treated like production work even though it''s synthetic, because
  the point is the discipline, not the data.


  context so you''re not guessing: a message queue with four consumers, topic has
  partitions, and lag snapshots every minute for two days, consumer offsets vs log
  end offsets, after that one consumer called worker-2 keeps falling behind in bursts,
  plus rebalance events happened three times and may explain jumps. i''m deliberately
  not specifying every little thing, because half the value here is seeing what
  gets decided when nobody''s looking. the decisions file is where you show your
  work on those, and a wrong call documented beats a right call nobody can find.


  keep the rules you invent in a rules.md next to the scripts, so when i come back
  in a week i know why the machine did what it did.


  the whole point of this exercise is that the working files and the checkable outputs
  exist on disk where i can poke at them, so every stage leaves real artifacts,
  and the artifacts are the deliverable, not the chat narration around them. if
  a step produces nothing i can open, it didn''t happen.


  and no leaving a to-do in a comment for later-me, later-me is you in ten minutes,
  finish the job.


  timings, real ones, timestamps around each stage, a table at the end. not vibes.


  i''d rather have an ugly table that''s right than a beautiful chart that''s approximate,
  so default to tables unless the data genuinely needs a picture.


  error messages should say what failed and where, not just that something did,
  because ''an error occurred'' has never helped anybody.


  percentages need denominators next to them always, twelve percent of what, because
  a percentage alone is half a number.


  what i need done, in this order:


  1. lag per consumer per partition over time, max, mean, and the burst windows.
  and don''t round anything into meaninglessness, i''d rather see the ugly precise
  number than a tidy lie.

  2. correlate lag spikes with the three rebalance timestamps. and be precise about
  what counts as done for that one, because vague is where shortcuts hide.

  first throughput estimate per consumer from offset deltas, messages per minute.
  and be precise about what counts as done for that one, because vague is where
  shortcuts hide.

  stage by stage: verdict on whether worker-2 is slow or just stuck with a hot partition.
  actual numbers in the output, computed, not eyeballed, and traceable back to input
  rows.

  5. lag-report.md and lag.json, plus a one-paragraph honest methodology note. with
  the method visible, not just the result, the how is the deliverable here as much
  as the what.


  and when i say documented i mean in a file on disk, not in the chat log where
  it scrolls away forever.


  the workspace layout is yours to design but say it in the readme, so the structure
  is a decision not an accident.


  and if you find something in the data that contradicts what i said above, the
  data wins, report the contradiction, don''t quietly bend either one.


  when a rule and a row disagree, both go in the output, the flagged row and the
  rule that flagged it, side by side.


  the realistic part, the warts: some snapshots are missing entirely for a 20-minute
  window and offsets occasionally go backwards. i want each mess instance visible
  in the output somewhere, surfaced not absorbed, so i can audit the handling later.
  the decisions file gets one line per mess type saying how you dealt with it.


  shape of the deliverables: scripts in a scripts folder, outputs in an outputs
  folder, the rules and decisions each in their own file at the root of the workspace,
  and a final report i can read start to finish in two minutes. paths in the report,
  not just filenames, so i can go look.


  everything gets a run twice test before you call it done, because the first run
  always works and the second one is where the state bugs live.


  if a stage can honestly be a one-liner, let it be a one-liner, padding steps to
  look thorough is its own kind of lie.


  if any rule you write down feels arbitrary, good, that means you noticed, write
  the threshold and the reason next to it so future-me can argue with it.


  if two stages could run in either order and it doesn''t matter, pick one and move
  on, i don''t need a committee meeting about it.


  anything you cache or skip for speed gets a note, because invisible shortcuts
  are how results stop being reproducible.


  one more thing, every number you quote me at the end better come from an actual
  run you can point at, because should-be-roughly-nine is not a result, it''s a
  vibe.


  and a note on tone in the outputs: plain sentences, tables where tables belong,
  no buzzword garbage, i want to skim this in two minutes and know exactly what
  happened.


  verification built in, not bolted on. an independent check script, separate logic,
  recompute from raw, compare field by field, exit nonzero on any drift. counts
  have to add up too, every row you started with lands somewhere explained, nothing
  just vanishes into a silent drop. run it, show me the output, don''t summarize
  it for me.


  don''t stop halfway to ask me questions you can answer yourself. names, orderings,
  column formats, those are yours. only come back at a real fork that changes what
  i asked for, and there isn''t one hiding in here. style rules since they keep
  coming up: nothing interactive anywhere, no prompts, nothing that hangs a non-interactive
  shell, loud failures with nonzero exits, and everything runnable twice without
  exploding. pick idempotent or self-cleaning, say which, document it.


  logs per stage, one line each is plenty, i want to see where time went and where
  things broke without spelunking.


  when you''re totally done, give me a short summary, what''s where, file paths,
  run times, and the one line on anything that surprised you.'
