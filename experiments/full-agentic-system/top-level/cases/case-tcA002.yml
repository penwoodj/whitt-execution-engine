prompt_id: tcA002
prompt: 'I''ve been building workflow harnesses for small local models for a while
  now and what I want from you this time is a self-contained regression harness
  exercise, completely inside /tmp/opencode/regression-test, no repo files, no network,
  no model calls, none of that, just your own reasoning and deterministic scripts,
  because what I''m actually testing is whether a task can be specified, executed,
  verified, and iterated in one go without me hand holding every step. So here''s
  the shape of it. You''re going to design a fake issue tracker dataset and then
  build a grading harness against it, and the twist is you''ll also generate candidate
  solutions, some intentionally wrong, and the harness has to catch them, which
  means the whole thing is self-testing and I can tell at a glance whether you actually
  did the work or just printed plausible text, and you know who you are if that''s
  the plan.


  The dataset first: 60 issue records across three jsonl files under data/, called
  critical.jsonl, normal.jsonl, and low.jsonl, 20 each. Every issue has id like
  ISS-101, title, component which is one of auth, billing, search, ingest, or ui,
  severity matching its folder, a reported date, days_open as an integer, assignee
  as a name from a fixed pool of six engineers, status which is open, in_progress,
  or resolved, and a tags array with zero to four tags drawn from a pool of at least
  ten. Bake real structure into it, not uniform mush: make certain components skew
  certain severities, make one engineer hold way more criticals than anyone else,
  make a couple of resolved issues that are suspiciously old, make a tag that only
  ever shows up together with one other tag, hide me three or four little patterns
  like that and write them down in a hidden-patterns.md that the grader can check
  against later, because the point of fixtures is that the truth is known before
  the questions are asked.


  Then the questions: a tasks.md with exactly 12 analytical questions about the
  dataset, things like which engineer has the highest resolved count relative to
  their assignment load, or what percentage of critical issues are past 30 days
  old and unresolved, or which pair of tags co-occurs most, plus at least two questions
  that are unanswerable from the data as specified, like the average time to resolution
  for issues reported on weekends when the records don''t actually contain resolution
  timestamps, because a harness that can''t say "this can''t be known from what''s
  here" is lying to me in a way I really dislike. Each question gets a truth entry
  in an answers file with the exact computed value and, for the unanswerable ones,
  the literal string NOT_ANSWERABLE plus one line on why.


  Now the harness: a grade script that takes a solutions file, one line per question
  id with a value, and scores it against the answers, strict comparisons where values
  are exact, tolerance of plus or minus 0.01 on anything percentage-ish, and NOT_ANSWERABLE
  must match exactly or it counts wrong. Output a score out of 12, a pass fail line
  at 10 or better, and per question detail on misses. Then the candidates: write
  four separate solution files, solution-perfect which should score 12 out of 12,
  solution-careless with exactly three plausible but wrong values like off by one
  on a count or swapping two engineers, solution-hallucinate which answers the unanswerable
  questions with made up confident numbers instead of refusing, and solution-empty
  which punts on more than half. Run the grader on all four and the expected results
  are 12, 9, fail, and fail, and solution-hallucinate specifically must fail on
  the unanswerable ones, that''s the whole point of putting them in. If any of those
  four runs doesn''t come out as expected that''s a bug in your grader or your truths
  and you fix it and rerun until the story is consistent, and don''t paper over
  a mismatch by editing the expected outcome to match reality after the fact, that''s
  the oldest trick in the book and I will notice.


  After the harness passes its own meta test I want the iteration twist: a mutation
  script that perturbs the dataset itself, swaps some severities, reassigns some
  issues, changes some dates, then recomputes what the true answers should be, writes
  a fresh answers file, and reruns all four candidate solutions plus regenerates
  solution-perfect from the new data so it still aces it while the stale careless
  one now misses different questions. The point is the harness has to survive its
  own fixtures moving underneath it, that''s what regression means, it''s not a
  snapshot it''s a relationship. Show me the before and after scores in one table.


  Finally give me the numbers I always ask for: how long each script took to run,
  timed for real with time or timestamps, not vibes, and a short file inventory
  so I know what lives where. And a couple of style things: everything runnable
  from a single do-all script with clear stage logging, errors loud and early, no
  silent except blocks swallowing failures, and every script runnable twice without
  exploding, idempotent or self-cleaning, your pick, but say which one you chose
  and where it''s documented. While you work, assume defaults yourself for anything
  I didn''t specify, names, orderings, formatting, those are your calls not questions
  for me, I only want to hear from you at real decision points or when it''s done
  and verified. Don''t stop until the grader passes on all four candidates against
  both the original and the mutated datasets, the timing table exists, and you''ve
  written a two paragraph honest self assessment of where this harness would break
  first if I stressed it harder. Oh and one more thing I keep having to say: no
  network, no pip installs, standard library only, and every number you quote me
  at the end better come from an actual run you can point at, because "should be
  roughly nine out of twelve" is not a result, it''s a vibe, and I''ve gotten enough
  vibes from tools lately to last me a while.'
