prompt_id: tcA086
prompt: 'the task is weather gap fill, and the details are below, all of them. so
  build me a full working analysis pipeline, fully self contained in /tmp/opencode/weather-run,
  no network, no installs, standard library python or plain bash whichever you''d
  actually reach for, and everything deterministic or seeded so a rerun gives me
  the same universe bit for bit.


  context so you''re not guessing: a year of daily temperature rows from three stations
  and gaps exist: whole days missing, single fields missing, and one station offline
  for 11 days, and interpolation policy must distinguish estimable from not, neighbor
  stations versus time neighbors, and a freeze-event count depends on the data quality,
  so gaps change the answer. the whole point of this exercise is that the working
  files and the checkable outputs exist on disk where i can poke at them, so every
  stage leaves real artifacts, and the artifacts are the deliverable, not the chat
  narration around them. if a step produces nothing i can open, it didn''t happen.


  if any rule you write down feels arbitrary, good, that means you noticed, write
  the threshold and the reason next to it so future-me can argue with it.


  when a rule and a row disagree, both go in the output, the flagged row and the
  rule that flagged it, side by side.


  and no leaving a to-do in a comment for later-me, later-me is you in ten minutes,
  finish the job.


  timings, real ones, timestamps around each stage, a table at the end. not vibes.


  if two stages could run in either order and it doesn''t matter, pick one and move
  on, i don''t need a committee meeting about it.


  the deliverables have two audiences, me skimming on a phone and a verifier grinding
  line by line, so every report needs the human table up top and the machine copy
  underneath, same numbers, no drift between them. the day those two disagree is
  the day i stop trusting the whole setup.


  if a stage can honestly be a one-liner, let it be a one-liner, padding steps to
  look thorough is its own kind of lie.


  percentages need denominators next to them always, twelve percent of what, because
  a percentage alone is half a number.


  the work, stage by stage, and i want stage logging loud enough that i can follow
  along after the fact:


  1. gap census, per station, duration distribution, total missing percentage. and
  don''t round anything into meaninglessness, i''d rather see the ugly precise number
  than a tidy lie.

  2. fill policy: time-interpolation for short gaps under 3 days, station-correlation
  for longer, thresholds justified. and that one gets checked by the verifier too,
  it''s not just a produce-and-hope step.

  after that filled dataset flagged per row, original, interpolated, cross-station,
  with method column. edge cases belong in the output, not in your head, list what
  you hit and what you did with each.

  4. freeze events computed on raw versus filled, delta reported honestly. edge
  cases belong in the output, not in your head, list what you hit and what you did
  with each.

  5. weather.md plus filled.csv plus gaps.json. and don''t round anything into meaninglessness,
  i''d rather see the ugly precise number than a tidy lie.


  the data has problems, deliberately, and handling them is part of the job not
  an error condition: one station reports in celsius and two in fahrenheit, timestamps
  exist for 366 days in a non-leap year requiring day-of-year care, and one temperature
  is a physically impossible negative outlier that is not a gap but a sensor lie.
  handle each one explicitly, log it, and count them, because ''some rows had issues''
  is not a finding, ''fourteen clock-skewed entries corrected, listed in the log''
  is. the decisions file gets one line per mess type saying how you dealt with it.


  one more thing, every number you quote me at the end better come from an actual
  run you can point at, because should-be-roughly-nine is not a result, it''s a
  vibe.


  keep the rules you invent in a rules.md next to the scripts, so when i come back
  in a week i know why the machine did what it did.


  and when i say documented i mean in a file on disk, not in the chat log where
  it scrolls away forever.


  shape of the deliverables: scripts in a scripts folder, outputs in an outputs
  folder, the rules and decisions each in their own file at the root of the workspace,
  and a final report i can read start to finish in two minutes. paths in the report,
  not just filenames, so i can go look.


  and a note on tone in the outputs: plain sentences, tables where tables belong,
  no buzzword garbage, i want to skim this in two minutes and know exactly what
  happened.


  the workspace layout is yours to design but say it in the readme, so the structure
  is a decision not an accident.


  i''d rather have an ugly table that''s right than a beautiful chart that''s approximate,
  so default to tables unless the data genuinely needs a picture.


  i want a verify pass that would catch me lying. separate script, recomputes independently,
  strict comparisons, and it checks the invariants too, the things that must be
  true about the outputs no matter what the data says. if the verifier passes first
  try i still want its output pasted, not paraphrased.


  and if you find something in the data that contradicts what i said above, the
  data wins, report the contradiction, don''t quietly bend either one.


  assume defaults for anything unspecified and note what you picked in a decisions
  file, i''d rather read three lines of your reasoning than answer three questions.
  don''t stop until every stage above is done and verified. no network, no installs,
  no llm calls, deterministic or seeded everywhere, and if any stage is slow relative
  to its work say so honestly instead of pretending it''s fine. don''t stop until
  the whole sequence is verified end to end.


  anything you cache or skip for speed gets a note, because invisible shortcuts
  are how results stop being reproducible.


  everything gets a run twice test before you call it done, because the first run
  always works and the second one is where the state bugs live.


  error messages should say what failed and where, not just that something did,
  because ''an error occurred'' has never helped anybody.


  at the end i want the inventory: what lives where, the numbers, and one honest
  paragraph on where this would break first if i stressed it harder.'
