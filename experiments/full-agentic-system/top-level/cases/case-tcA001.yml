prompt_id: tcA001
prompt: 'I want you to build me a full working inventory pipeline for a fake parts
  warehouse, everything lives under /tmp/opencode/warehouse-test and nothing outside
  that folder gets touched, no changes anywhere else, and I mean it, don''t go creating
  stuff in the repo root or my home folder or anywhere like that because I''ve had
  agents do that before and it made a mess I had to clean up manually. So the setup
  is this: first you create the fixture data yourself, and I want you to actually
  create it, not describe it, 200 inventory record files split across 4 subfolders
  called inbound, outbound, quarantined, and archived, each file is a little JSON
  document with fields for part_id (format is like PTM-00042 so letters dash five
  digits, make them unique across the whole set), part_name, category which should
  be one of fastener, electrical, housing, consumable, or sensor, quantity on hand
  which is a non negative integer, unit_cost which is a dollar amount with two decimals,
  warehouse_location which is a zone letter A through E plus a two digit rack number
  like C17, last_inspected which is an ISO date, and a status field that is one
  of ok, needs_review, or defective. I want realistic messy variety in there, some
  duplicate part names with different ids, some quantity zeros, at least a few records
  where the same part_id accidentally appears twice because data entry happens,
  a couple of files that are slightly malformed on purpose like a missing comma
  or a trailing brace, that kind of thing, because a pipeline that only works on
  clean data is worthless to me and I''ve said before I want things tested against
  reality not against the happy path.


  Once the fixtures exist then build the pipeline itself and I want it as scripts,
  actual runnable scripts with a shebang, living in a scripts subfolder, not a wall
  of inline shell I can''t rerun. The pipeline needs to do these stages in order
  and each stage writes its own output files and a small log line so I can see where
  time went and where things broke. Stage one scans all four folders and builds
  one merged manifest, every valid record in, and for the malformed ones I don''t
  want silent skipping, I want them quarantined into a rejects file with the reason
  and the filename so nothing just vanishes. Stage two deduplicates, and think about
  what dedupe means here, exact same part_id twice means keep the newest by file
  modification time and log the loser, same part_name in the same category with
  quantities that differ is probably a real duplicate too so flag those into a review
  file instead of deciding silently, and I want the rules written down in a rules.md
  next to the scripts so when I come back in a week I know why the machine did what
  it did. Stage three computes the report numbers: total distinct parts, total inventory
  value which is quantity times unit_cost summed up, per category counts and values,
  defective rate as a percentage, how many need review, the five most expensive
  single line items, and a zone breakdown showing value by warehouse zone. Stage
  four writes two outputs, a warehouse-report.md that a human can actually read
  with tables and short plain sentences, no buzzword garbage, and a machine copy
  warehouse-report.json that has the exact same numbers in it, and the two have
  to agree, if the markdown says 14 defective and the JSON says 13 that''s a failure
  and you fix it before telling me anything is done.


  And here''s the part I really care about: verification has to be built in, not
  bolted on after. Write a verify script that recomputes everything independently
  from the raw fixture files with its own separate logic, not by importing the pipeline''s
  own functions because that''s just asking the same code if it lied, and it checks
  the report files field by field and exits nonzero with a clear message on any
  mismatch, and a check that the counts add up, distinct plus rejects plus duplicate-losers
  should account for every file you started with, nothing unexplained. Then run
  the whole thing end to end, the pipeline and then the verifier, and show me the
  actual outputs and the exit codes, paste the report in chat at the end too because
  I want to skim it without opening files. After that''s working I want the timing
  pass, run the pipeline three times and give me wall clock numbers per stage for
  each run in a little table, and if any stage is dumb slow relative to the work
  it does, tell me honestly rather than pretending it''s fine.


  Then, only after all of that is verified working, I want the efficiency version,
  same exact outputs, byte for byte the same report files, but faster, and if you
  can''t make it meaningfully faster tell me that instead of shaving two milliseconds
  and calling it a win. Rerun the verifier against the efficiency version outputs
  to prove nothing drifted. And through all of this don''t stop halfway and ask
  me questions you can answer yourself, the spec above has everything you need,
  if you genuinely hit a fork that changes what I asked for then ask, but preference
  questions like file names and table column order are yours to decide, just note
  what you picked. Also don''t use any network, no web searches, no installing packages,
  this is all local standard tooling, python3 or bash or both, whatever you''d actually
  reach for. When you''re totally done, give me a short summary of what''s where,
  the file paths, the run times, and the one line on anything that surprised you.
  Don''t skip steps and don''t tell me it''s done until the verifier has passed
  on both versions and you''ve actually looked at the report yourself. One more
  thing on style since it keeps coming up: no interactive anything anywhere, no
  read -p, no prompts, nothing that would hang a non interactive shell, loud failures
  with nonzero exit codes, and if a stage gets run twice it should either clean
  up after itself or safely overwrite, pick one approach and mention it in the rules
  file so I know what to expect. And keep the whole thing dependency free, standard
  library python or plain bash, because this machine is the one that gets cranky
  when random packages get pulled in and I don''t want to find out the hard way
  again.'
meta:
  lane: HEAVY
  shape: multi-stage-pipeline
  batch: 1
success_criteria:
  deterministic_checks:
    json_exact: '{"lane": "HEAVY", "route_ok": true, "shape": "multi-stage-pipeline"}'
