prompt_id: tcA092
prompt: 'another one for the pile: inventory cycle count, with the usual rules.
  i want you to run a proper multi-stage data job for me, the whole thing lives
  under /tmp/opencode/cyclecount-run and nothing outside that folder gets touched,
  i mean it, no repo files, no home directory surprises, i''ve cleaned up after
  tools that did that before and i''m not doing it again.


  what you''re working with: a warehouse snapshot plus cycle-count sheets from four
  physical counts, after that each sheet covers a zone, lists sku and counted quantity,
  with counter initials, plus discrepancies against system stock, plus counter-error
  patterns by counter, and one counter consistently miscounts by one carton, that
  is the lore, verify it. think of this as a miniature version of the real jobs
  i hand off: messy inputs, stated rules, honest outputs. the rules you invent matter
  as much as the numbers you compute, because i''m going to reuse this when the
  data is real and i need to trust the machinery.


  timings, real ones, timestamps around each stage, a table at the end. not vibes.


  keep the rules you invent in a rules.md next to the scripts, so when i come back
  in a week i know why the machine did what it did.


  if any rule you write down feels arbitrary, good, that means you noticed, write
  the threshold and the reason next to it so future-me can argue with it.


  and a note on tone in the outputs: plain sentences, tables where tables belong,
  no buzzword garbage, i want to skim this in two minutes and know exactly what
  happened.


  when a rule and a row disagree, both go in the output, the flagged row and the
  rule that flagged it, side by side.


  this is the kind of task where the tempting move is to demo the happy path and
  gesture at the rest. don''t. the mess is specified precisely because that''s where
  the value is, and a clean run on clean data tells me nothing about whether the
  thing works.


  and if you find something in the data that contradicts what i said above, the
  data wins, report the contradiction, don''t quietly bend either one.


  if two stages could run in either order and it doesn''t matter, pick one and move
  on, i don''t need a committee meeting about it.


  the work, stage by stage, and i want stage logging loud enough that i can follow
  along after the fact:


  1. join counts to system stock per sku per zone, variance absolute and signed.
  and that one gets checked by the verifier too, it''s not just a produce-and-hope
  step.

  2. discrepancy rate per zone, per counter, the repeat-offender analysis on the
  suspect counter. if that stage has a natural ordering dependency on the previous
  one, respect it, the sequence above is not decorative.

  3. shrinkage estimate in units and value using the price file. if that stage has
  a natural ordering dependency on the previous one, respect it, the sequence above
  is not decorative.

  next the recount list, high-variance skus worth a second look, ranked. and that
  one gets checked by the verifier too, it''s not just a produce-and-hope step.

  stage by stage: cycle.md plus variances.csv plus counters.json. and that one gets
  checked by the verifier too, it''s not just a produce-and-hope step.


  messiness requirements, on purpose, all of these must be handled explicitly not
  silently absorbed: sku formats differ by leading zeros, one zone was counted twice
  on different days with drift between, and 30 skus in the sheets do not exist in
  the system snapshot at all. handle each one explicitly, log it, and count them,
  because ''some rows had issues'' is not a finding, ''fourteen clock-skewed entries
  corrected, listed in the log'' is. no silent absorption, each case logged with
  the rule that resolved it.


  anything you cache or skip for speed gets a note, because invisible shortcuts
  are how results stop being reproducible.


  everything gets a run twice test before you call it done, because the first run
  always works and the second one is where the state bugs live.


  shape of the deliverables: scripts in a scripts folder, outputs in an outputs
  folder, the rules and decisions each in their own file at the root of the workspace,
  and a final report i can read start to finish in two minutes. paths in the report,
  not just filenames, so i can go look.


  i''d rather have an ugly table that''s right than a beautiful chart that''s approximate,
  so default to tables unless the data genuinely needs a picture.


  and no leaving a to-do in a comment for later-me, later-me is you in ten minutes,
  finish the job.


  the workspace layout is yours to design but say it in the readme, so the structure
  is a decision not an accident.


  error messages should say what failed and where, not just that something did,
  because ''an error occurred'' has never helped anybody.


  and when i say documented i mean in a file on disk, not in the chat log where
  it scrolls away forever.


  percentages need denominators next to them always, twelve percent of what, because
  a percentage alone is half a number.


  i want a verify pass that would catch me lying. separate script, recomputes independently,
  strict comparisons, and it checks the invariants too, the things that must be
  true about the outputs no matter what the data says. if the verifier passes first
  try i still want its output pasted, not paraphrased.


  no network, no installs, no llm calls, deterministic or seeded everywhere, and
  if any stage is slow relative to its work say so honestly instead of pretending
  it''s fine. don''t stop until the whole sequence is verified end to end. style
  rules since they keep coming up: nothing interactive anywhere, no prompts, nothing
  that hangs a non-interactive shell, loud failures with nonzero exits, and everything
  runnable twice without exploding. pick idempotent or self-cleaning, say which,
  document it.


  if a stage can honestly be a one-liner, let it be a one-liner, padding steps to
  look thorough is its own kind of lie.


  logs per stage, one line each is plenty, i want to see where time went and where
  things broke without spelunking.


  one more thing, every number you quote me at the end better come from an actual
  run you can point at, because should-be-roughly-nine is not a result, it''s a
  vibe.


  when it''s done and verified, hand me the map: files, numbers, timings, and anything
  you''d do differently if this were real.'
meta:
  lane: HEAVY
  shape: multi-stage-pipeline
  batch: 10
success_criteria:
  deterministic_checks:
    json_exact: '{"lane": "HEAVY", "route_ok": true, "shape": "multi-stage-pipeline"}'
