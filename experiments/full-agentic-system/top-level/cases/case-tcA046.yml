prompt_id: tcA046
prompt: 'the task is flight itinerary conflicts, and the details are below, all
  of them. what i want is build a small but complete tool with its own verification,
  set up inside /tmp/opencode/flights-run, and i want it treated like production
  work even though it''s synthetic, because the point is the discipline, not the
  data.


  background, and i''m giving you the details the way they actually occur: an itinerary
  set for a sales team, 30 flights across 6 people, after that each flight: person,
  origin, destination, depart, arrive, in local times of origin and destination,
  and conflicts: overlapping flights for one person, connections under 45 minutes,
  impossible city sequences, after that timezone math is where fakes go to die.
  the deliverables have two audiences, me skimming on a phone and a verifier grinding
  line by line, so every report needs the human table up top and the machine copy
  underneath, same numbers, no drift between them. the day those two disagree is
  the day i stop trusting the whole setup.


  everything gets a run twice test before you call it done, because the first run
  always works and the second one is where the state bugs live.


  timings, real ones, timestamps around each stage, a table at the end. not vibes.


  the workspace layout is yours to design but say it in the readme, so the structure
  is a decision not an accident.


  and a note on tone in the outputs: plain sentences, tables where tables belong,
  no buzzword garbage, i want to skim this in two minutes and know exactly what
  happened.


  i''d rather have an ugly table that''s right than a beautiful chart that''s approximate,
  so default to tables unless the data genuinely needs a picture.


  one more thing, every number you quote me at the end better come from an actual
  run you can point at, because should-be-roughly-nine is not a result, it''s a
  vibe.


  if two stages could run in either order and it doesn''t matter, pick one and move
  on, i don''t need a committee meeting about it.


  keep the rules you invent in a rules.md next to the scripts, so when i come back
  in a week i know why the machine did what it did.


  this is the kind of task where the tempting move is to demo the happy path and
  gesture at the rest. don''t. the mess is specified precisely because that''s where
  the value is, and a clean run on clean data tells me nothing about whether the
  thing works.


  percentages need denominators next to them always, twelve percent of what, because
  a percentage alone is half a number.


  and no leaving a to-do in a comment for later-me, later-me is you in ten minutes,
  finish the job.


  concretely, do these stages, numbered so you don''t creative-order them on me:


  stage by stage: normalize all times to UTC internally, conversion table documented.
  and don''t round anything into meaninglessness, i''d rather see the ugly precise
  number than a tidy lie.

  stage by stage: per-person timeline, conflicts marked, overlap or impossible connection.
  and don''t round anything into meaninglessness, i''d rather see the ugly precise
  number than a tidy lie.

  3. city-sequence sanity, departing from a city you never arrived in. actual numbers
  in the output, computed, not eyeballed, and traceable back to input rows.

  then repair suggestions per conflict, earliest fix, latest fix. with the method
  visible, not just the result, the how is the deliverable here as much as the what.

  flights.md plus conflicts.json plus utc-table.csv. if that stage has a natural
  ordering dependency on the previous one, respect it, the sequence above is not
  decorative.


  if any rule you write down feels arbitrary, good, that means you noticed, write
  the threshold and the reason next to it so future-me can argue with it.


  logs per stage, one line each is plenty, i want to see where time went and where
  things broke without spelunking.


  the data has problems, deliberately, and handling them is part of the job not
  an error condition: arrival times before departures on red-eyes are legal, two
  flights share a flight number on different days, and one airport code appears
  as three letters and as four. handle each one explicitly, log it, and count them,
  because ''some rows had issues'' is not a finding, ''fourteen clock-skewed entries
  corrected, listed in the log'' is. every one of those needs a documented disposition,
  handled, quarantined, or rejected, with the rule cited.


  if a stage can honestly be a one-liner, let it be a one-liner, padding steps to
  look thorough is its own kind of lie.


  anything you cache or skip for speed gets a note, because invisible shortcuts
  are how results stop being reproducible.


  when a rule and a row disagree, both go in the output, the flagged row and the
  rule that flagged it, side by side.


  and if you find something in the data that contradicts what i said above, the
  data wins, report the contradiction, don''t quietly bend either one.


  shape of the deliverables: scripts in a scripts folder, outputs in an outputs
  folder, the rules and decisions each in their own file at the root of the workspace,
  and a final report i can read start to finish in two minutes. paths in the report,
  not just filenames, so i can go look.


  error messages should say what failed and where, not just that something did,
  because ''an error occurred'' has never helped anybody.


  and write the checker like a hostile reviewer. independent logic, recompute everything
  checkable from raw inputs, verify the stated invariants mechanically, and flag
  anything that only holds because the pipeline says so. exit codes visible. i don''t
  trust should-pass and neither should you.


  assume defaults for anything unspecified and note what you picked in a decisions
  file, i''d rather read three lines of your reasoning than answer three questions.
  don''t stop until every stage above is done and verified. don''t skip steps and
  don''t tell me it''s done until the verifier has passed and you''ve actually looked
  at the outputs yourself. and keep it dependency free, standard library only, this
  machine gets cranky.


  and when i say documented i mean in a file on disk, not in the chat log where
  it scrolls away forever.


  end state: verified outputs, a short readme pointing at everything, timings, and
  your one honest surprise.'
