prompt_id: tcA090
prompt: 'another one for the pile: changelog generator, with the usual rules. let''s
  build me a full working analysis pipeline, entirely inside /tmp/opencode/changelog-run,
  no llm calls, no network, nothing stochastic unless i say it''s seeded, and at
  the end i want to be able to point a skeptical stranger at the outputs and have
  them check every claim.


  the shape of the data: a raw commit dump, 500 commits, since the last release,
  then the deliverable: a keepachangelog-style changelog, grouped added, changed,
  fixed, removed, and mapping commit to category needs message parsing plus a fallback
  for junk messages, plus merge commits and chore noise must be filtered, with the
  filter auditable. i''m deliberately not specifying every little thing, because
  half the value here is seeing what gets decided when nobody''s looking. the decisions
  file is where you show your work on those, and a wrong call documented beats a
  right call nobody can find.


  the deliverables have two audiences, me skimming on a phone and a verifier grinding
  line by line, so every report needs the human table up top and the machine copy
  underneath, same numbers, no drift between them. the day those two disagree is
  the day i stop trusting the whole setup.


  error messages should say what failed and where, not just that something did,
  because ''an error occurred'' has never helped anybody.


  and if you find something in the data that contradicts what i said above, the
  data wins, report the contradiction, don''t quietly bend either one.


  if two stages could run in either order and it doesn''t matter, pick one and move
  on, i don''t need a committee meeting about it.


  if a stage can honestly be a one-liner, let it be a one-liner, padding steps to
  look thorough is its own kind of lie.


  i''d rather have an ugly table that''s right than a beautiful chart that''s approximate,
  so default to tables unless the data genuinely needs a picture.


  the workspace layout is yours to design but say it in the readme, so the structure
  is a decision not an accident.


  everything gets a run twice test before you call it done, because the first run
  always works and the second one is where the state bugs live.


  and a note on tone in the outputs: plain sentences, tables where tables belong,
  no buzzword garbage, i want to skim this in two minutes and know exactly what
  happened.


  logs per stage, one line each is plenty, i want to see where time went and where
  things broke without spelunking.


  one more thing, every number you quote me at the end better come from an actual
  run you can point at, because should-be-roughly-nine is not a result, it''s a
  vibe.


  and no leaving a to-do in a comment for later-me, later-me is you in ten minutes,
  finish the job.


  and when i say documented i mean in a file on disk, not in the chat log where
  it scrolls away forever.


  percentages need denominators next to them always, twelve percent of what, because
  a percentage alone is half a number.


  keep the rules you invent in a rules.md next to the scripts, so when i come back
  in a week i know why the machine did what it did.


  anything you cache or skip for speed gets a note, because invisible shortcuts
  are how results stop being reproducible.


  what i need done, in this order:


  message classification, conventional-commit prefix first, keyword fallback second,
  junk bucket third with contents listed. and don''t round anything into meaninglessness,
  i''d rather see the ugly precise number than a tidy lie.

  2. grouped changelog, bullet per change, human-readable, commit short-hash appended.
  edge cases belong in the output, not in your head, list what you hit and what
  you did with each.

  next the noise report, what got filtered and why, counts per filter reason. edge
  cases belong in the output, not in your head, list what you hit and what you did
  with each.

  4. breaking-change callouts pulled and featured at top. and don''t round anything
  into meaninglessness, i''d rather see the ugly precise number than a tidy lie.

  after that changelog.md plus classification.json plus noise-report.md. actual
  numbers in the output, computed, not eyeballed, and traceable back to input rows.


  if any rule you write down feels arbitrary, good, that means you noticed, write
  the threshold and the reason next to it so future-me can argue with it.


  when a rule and a row disagree, both go in the output, the flagged row and the
  rule that flagged it, side by side.


  the realistic part, the warts: commit messages are inconsistent, one prefix lies,
  a fix commit that adds a feature, the dump has two authors writing in different
  languages, and 40 messages are empty beyond the hash. handle each one explicitly,
  log it, and count them, because ''some rows had issues'' is not a finding, ''fourteen
  clock-skewed entries corrected, listed in the log'' is. no silent absorption,
  each case logged with the rule that resolved it.


  shape of the deliverables: scripts in a scripts folder, outputs in an outputs
  folder, the rules and decisions each in their own file at the root of the workspace,
  and a final report i can read start to finish in two minutes. paths in the report,
  not just filenames, so i can go look.


  verification built in, not bolted on. an independent check script, separate logic,
  recompute from raw, compare field by field, exit nonzero on any drift. counts
  have to add up too, every row you started with lands somewhere explained, nothing
  just vanishes into a silent drop. run it, show me the output, don''t summarize
  it for me.


  timings, real ones, timestamps around each stage, a table at the end. not vibes.


  style rules since they keep coming up: nothing interactive anywhere, no prompts,
  nothing that hangs a non-interactive shell, loud failures with nonzero exits,
  and everything runnable twice without exploding. pick idempotent or self-cleaning,
  say which, document it. assume defaults for anything unspecified and note what
  you picked in a decisions file, i''d rather read three lines of your reasoning
  than answer three questions. don''t stop until every stage above is done and verified.


  finish with the report pasted in chat so i can skim without opening files, plus
  paths and timings. one line on what surprised you.'
