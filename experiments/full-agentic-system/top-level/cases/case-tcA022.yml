prompt_id: tcA022
prompt: 'the task is golden signal dashboard data, and the details are below, all
  of them. i want you to build a small but complete tool with its own verification
  for me, the whole thing lives under /tmp/opencode/golden-run and nothing outside
  that folder gets touched, i mean it, no repo files, no home directory surprises,
  i''ve cleaned up after tools that did that before and i''m not doing it again.


  the setup is this: four golden signals, latency, traffic, errors, saturation,
  for five services and one week of per-minute metrics in csv files per signal and
  dashboard data must be pre-aggregated so the dashboard loads fast; also the raw
  data is 700k rows across the files. the deliverables have two audiences, me skimming
  on a phone and a verifier grinding line by line, so every report needs the human
  table up top and the machine copy underneath, same numbers, no drift between them.
  the day those two disagree is the day i stop trusting the whole setup.


  i''m deliberately not specifying every little thing, because half the value here
  is seeing what gets decided when nobody''s looking. the decisions file is where
  you show your work on those, and a wrong call documented beats a right call nobody
  can find.


  and if you find something in the data that contradicts what i said above, the
  data wins, report the contradiction, don''t quietly bend either one.


  the workspace layout is yours to design but say it in the readme, so the structure
  is a decision not an accident.


  and when i say documented i mean in a file on disk, not in the chat log where
  it scrolls away forever.


  everything gets a run twice test before you call it done, because the first run
  always works and the second one is where the state bugs live.


  percentages need denominators next to them always, twelve percent of what, because
  a percentage alone is half a number.


  the work, stage by stage, and i want stage logging loud enough that i can follow
  along after the fact:


  first aggregate to five-minute windows, mean latency, max latency, traffic sum,
  error rate, saturation peak. with the method visible, not just the result, the
  how is the deliverable here as much as the what.

  2. keep a raw-count column so aggregations are auditable. and don''t round anything
  into meaninglessness, i''d rather see the ugly precise number than a tidy lie.

  3. sanity checks, no window with more errors than traffic, no negative anything.
  edge cases belong in the output, not in your head, list what you hit and what
  you did with each.

  4. compression report, rows before and after, and why the dashboard needs this.
  and don''t round anything into meaninglessness, i''d rather see the ugly precise
  number than a tidy lie.

  first golden.md plus the aggregated csv files plus checks.json. and don''t round
  anything into meaninglessness, i''d rather see the ugly precise number than a
  tidy lie.


  and no leaving a to-do in a comment for later-me, later-me is you in ten minutes,
  finish the job.


  and bake in the dirt, i''ve said before i want things tested against reality not
  the happy path: one csv has a duplicated five-minute block, and saturation for
  one service is recorded as a fraction while others are percentages. those aren''t
  obstacles, they''re the actual test, a clean run on clean data is worthless and
  i''ve said this before. each mess instance gets its handling logged, rule named,
  no exceptions.


  one more thing, every number you quote me at the end better come from an actual
  run you can point at, because should-be-roughly-nine is not a result, it''s a
  vibe.


  the end state on disk should look like something a stranger could pick up: a readme
  pointing at everything, scripts that run in order, outputs that reproduce, and
  the report. if a stranger couldn''t rerun this from the files alone, it''s not
  done.


  if any rule you write down feels arbitrary, good, that means you noticed, write
  the threshold and the reason next to it so future-me can argue with it.


  logs per stage, one line each is plenty, i want to see where time went and where
  things broke without spelunking.


  if two stages could run in either order and it doesn''t matter, pick one and move
  on, i don''t need a committee meeting about it.


  error messages should say what failed and where, not just that something did,
  because ''an error occurred'' has never helped anybody.


  verification is a first-class deliverable here. independent recomputation from
  the raw files, its own code path, and a conservation check that everything entering
  the pipeline is accounted for at the end, kept, rejected, merged, flagged, the
  books have to balance. nonzero exit on failure, actual output shown in your report.


  anything you cache or skip for speed gets a note, because invisible shortcuts
  are how results stop being reproducible.


  keep the rules you invent in a rules.md next to the scripts, so when i come back
  in a week i know why the machine did what it did.


  don''t stop halfway to ask me questions you can answer yourself. names, orderings,
  column formats, those are yours. only come back at a real fork that changes what
  i asked for, and there isn''t one hiding in here. no network, no installs, no
  llm calls, deterministic or seeded everywhere, and if any stage is slow relative
  to its work say so honestly instead of pretending it''s fine. don''t stop until
  the whole sequence is verified end to end.


  i''d rather have an ugly table that''s right than a beautiful chart that''s approximate,
  so default to tables unless the data genuinely needs a picture.


  and a note on tone in the outputs: plain sentences, tables where tables belong,
  no buzzword garbage, i want to skim this in two minutes and know exactly what
  happened.


  when a rule and a row disagree, both go in the output, the flagged row and the
  rule that flagged it, side by side.


  if a stage can honestly be a one-liner, let it be a one-liner, padding steps to
  look thorough is its own kind of lie.


  timings, real ones, timestamps around each stage, a table at the end. not vibes.


  when you''re totally done, give me a short summary, what''s where, file paths,
  run times, and the one line on anything that surprised you.'
