prompt_id: tcA069
prompt: 'permissions matrix is the job, and i want the work to show for it. construct
  a self-contained reporting exercise, that''s the job, workspace is /tmp/opencode/perms-run,
  and read the whole thing before starting because the constraints at the end apply
  to every step, not just the last one.


  background, and i''m giving you the details the way they actually occur: a role
  dump and a resource dump from a fake rbac system, and roles have members and permissions,
  resources have required permissions, plus the matrix: who can access what, directly
  or via role inheritance, then one permission was granted to a role that no longer
  exists. this is the kind of task where the tempting move is to demo the happy
  path and gesture at the rest. don''t. the mess is specified precisely because
  that''s where the value is, and a clean run on clean data tells me nothing about
  whether the thing works.


  and if you find something in the data that contradicts what i said above, the
  data wins, report the contradiction, don''t quietly bend either one.


  the deliverables have two audiences, me skimming on a phone and a verifier grinding
  line by line, so every report needs the human table up top and the machine copy
  underneath, same numbers, no drift between them. the day those two disagree is
  the day i stop trusting the whole setup.


  timings, real ones, timestamps around each stage, a table at the end. not vibes.


  error messages should say what failed and where, not just that something did,
  because ''an error occurred'' has never helped anybody.


  anything you cache or skip for speed gets a note, because invisible shortcuts
  are how results stop being reproducible.


  and no leaving a to-do in a comment for later-me, later-me is you in ten minutes,
  finish the job.


  i''d rather have an ugly table that''s right than a beautiful chart that''s approximate,
  so default to tables unless the data genuinely needs a picture.


  the work, stage by stage, and i want stage logging loud enough that i can follow
  along after the fact:


  then resolve role inheritance to effective permissions per user, cycles detected
  if any. and that one gets checked by the verifier too, it''s not just a produce-and-hope
  step.

  2. the access matrix, user by resource, boolean, plus the via-path for every true
  cell. and be precise about what counts as done for that one, because vague is
  where shortcuts hide.

  3. the orphan permission flagged, granted to a dead role, affects nobody. and
  that one gets checked by the verifier too, it''s not just a produce-and-hope step.

  4. overprovisioning report, users with permissions they have never used per the
  usage log. edge cases belong in the output, not in your head, list what you hit
  and what you did with each.

  5. perms.md plus matrix.csv plus effective.json. and that one gets checked by
  the verifier too, it''s not just a produce-and-hope step.


  if any rule you write down feels arbitrary, good, that means you noticed, write
  the threshold and the reason next to it so future-me can argue with it.


  if two stages could run in either order and it doesn''t matter, pick one and move
  on, i don''t need a committee meeting about it.


  when a rule and a row disagree, both go in the output, the flagged row and the
  rule that flagged it, side by side.


  percentages need denominators next to them always, twelve percent of what, because
  a percentage alone is half a number.


  and when i say documented i mean in a file on disk, not in the chat log where
  it scrolls away forever.


  everything gets a run twice test before you call it done, because the first run
  always works and the second one is where the state bugs live.


  messiness requirements, on purpose, all of these must be handled explicitly not
  silently absorbed: role inheritance has a diamond, a inherits b and c which both
  inherit d, one user has a direct permission that contradicts their role, and the
  usage log covers only 60 percent of resources. handle each one explicitly, log
  it, and count them, because ''some rows had issues'' is not a finding, ''fourteen
  clock-skewed entries corrected, listed in the log'' is. every one of those needs
  a documented disposition, handled, quarantined, or rejected, with the rule cited.


  the end state on disk should look like something a stranger could pick up: a readme
  pointing at everything, scripts that run in order, outputs that reproduce, and
  the report. if a stranger couldn''t rerun this from the files alone, it''s not
  done.


  keep the rules you invent in a rules.md next to the scripts, so when i come back
  in a week i know why the machine did what it did.


  verification is a first-class deliverable here. independent recomputation from
  the raw files, its own code path, and a conservation check that everything entering
  the pipeline is accounted for at the end, kept, rejected, merged, flagged, the
  books have to balance. nonzero exit on failure, actual output shown in your report.


  and a note on tone in the outputs: plain sentences, tables where tables belong,
  no buzzword garbage, i want to skim this in two minutes and know exactly what
  happened.


  if a stage can honestly be a one-liner, let it be a one-liner, padding steps to
  look thorough is its own kind of lie.


  the workspace layout is yours to design but say it in the readme, so the structure
  is a decision not an accident.


  assume defaults for anything unspecified and note what you picked in a decisions
  file, i''d rather read three lines of your reasoning than answer three questions.
  don''t stop until every stage above is done and verified. style rules since they
  keep coming up: nothing interactive anywhere, no prompts, nothing that hangs a
  non-interactive shell, loud failures with nonzero exits, and everything runnable
  twice without exploding. pick idempotent or self-cleaning, say which, document
  it.


  one more thing, every number you quote me at the end better come from an actual
  run you can point at, because should-be-roughly-nine is not a result, it''s a
  vibe.


  when you''re totally done, give me a short summary, what''s where, file paths,
  run times, and the one line on anything that surprised you.'
