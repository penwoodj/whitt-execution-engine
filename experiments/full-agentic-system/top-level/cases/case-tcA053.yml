prompt_id: tcA053
prompt: 'vending restock forecast, that''s the theme, here''s the full spec: so
  build a small but complete tool with its own verification, fully self contained
  in /tmp/opencode/vending-run, no network, no installs, standard library python
  or plain bash whichever you''d actually reach for, and everything deterministic
  or seeded so a rerun gives me the same universe bit for bit.


  context so you''re not guessing: 12 weeks of vending machine sales rows, item,
  timestamp, price and capacity per slot is 8 items, 30 slots, restock costs a trip
  and forecast next week per item to decide the restock list. some items died mid-quarter
  and their slots are wasted. the deliverables have two audiences, me skimming on
  a phone and a verifier grinding line by line, so every report needs the human
  table up top and the machine copy underneath, same numbers, no drift between them.
  the day those two disagree is the day i stop trusting the whole setup.


  if two stages could run in either order and it doesn''t matter, pick one and move
  on, i don''t need a committee meeting about it.


  think of this as a miniature version of the real jobs i hand off: messy inputs,
  stated rules, honest outputs. the rules you invent matter as much as the numbers
  you compute, because i''m going to reuse this when the data is real and i need
  to trust the machinery.


  and a note on tone in the outputs: plain sentences, tables where tables belong,
  no buzzword garbage, i want to skim this in two minutes and know exactly what
  happened.


  percentages need denominators next to them always, twelve percent of what, because
  a percentage alone is half a number.


  concretely, do these stages, numbered so you don''t creative-order them on me:


  then weekly per-item sales matrix with trend and variability columns. if that
  stage has a natural ordering dependency on the previous one, respect it, the sequence
  above is not decorative.

  2. next-week forecast per item, method stated, with a demand-vs-capacity note.
  if that stage has a natural ordering dependency on the previous one, respect it,
  the sequence above is not decorative.

  3. the restock list, what to fill which slots with, and dead-item replacement
  proposals. and be precise about what counts as done for that one, because vague
  is where shortcuts hide.

  stage by stage: trip-frequency analysis, would weekly versus biweekly restocking
  starve any item. and be precise about what counts as done for that one, because
  vague is where shortcuts hide.

  vending.md plus vending.json plus restock-list.csv. and that one gets checked
  by the verifier too, it''s not just a produce-and-hope step.


  one more thing, every number you quote me at the end better come from an actual
  run you can point at, because should-be-roughly-nine is not a result, it''s a
  vibe.


  logs per stage, one line each is plenty, i want to see where time went and where
  things broke without spelunking.


  and no leaving a to-do in a comment for later-me, later-me is you in ten minutes,
  finish the job.


  error messages should say what failed and where, not just that something did,
  because ''an error occurred'' has never helped anybody.


  and if you find something in the data that contradicts what i said above, the
  data wins, report the contradiction, don''t quietly bend either one.


  anything you cache or skip for speed gets a note, because invisible shortcuts
  are how results stop being reproducible.


  if any rule you write down feels arbitrary, good, that means you noticed, write
  the threshold and the reason next to it so future-me can argue with it.


  now the mess, because a pipeline that only works on clean data is worthless to
  me: timestamps have a batch artifact, sales logged at 09:00 for the whole day,
  one item has a price change mid-stream, and three slots share one item. i want
  each mess instance visible in the output somewhere, surfaced not absorbed, so
  i can audit the handling later. write down what you did with each defect and why,
  in the file, not the chat.


  on outputs: every stage writes to its own subfolder under the workspace, naming
  is yours but be consistent, and the final report goes both human, markdown with
  actual tables, and machine, json with the same numbers. i''ll be checking that
  the two agree, and i''ll be unhappy if they don''t.


  the workspace layout is yours to design but say it in the readme, so the structure
  is a decision not an accident.


  if a stage can honestly be a one-liner, let it be a one-liner, padding steps to
  look thorough is its own kind of lie.


  verification built in, not bolted on. an independent check script, separate logic,
  recompute from raw, compare field by field, exit nonzero on any drift. counts
  have to add up too, every row you started with lands somewhere explained, nothing
  just vanishes into a silent drop. run it, show me the output, don''t summarize
  it for me.


  everything gets a run twice test before you call it done, because the first run
  always works and the second one is where the state bugs live.


  and when i say documented i mean in a file on disk, not in the chat log where
  it scrolls away forever.


  timings, real ones, timestamps around each stage, a table at the end. not vibes.


  keep the rules you invent in a rules.md next to the scripts, so when i come back
  in a week i know why the machine did what it did.


  i''d rather have an ugly table that''s right than a beautiful chart that''s approximate,
  so default to tables unless the data genuinely needs a picture.


  no network, no installs, no llm calls, deterministic or seeded everywhere, and
  if any stage is slow relative to its work say so honestly instead of pretending
  it''s fine. don''t stop until the whole sequence is verified end to end. don''t
  skip steps and don''t tell me it''s done until the verifier has passed and you''ve
  actually looked at the outputs yourself. and keep it dependency free, standard
  library only, this machine gets cranky.


  when a rule and a row disagree, both go in the output, the flagged row and the
  rule that flagged it, side by side.


  end state: verified outputs, a short readme pointing at everything, timings, and
  your one honest surprise.'
