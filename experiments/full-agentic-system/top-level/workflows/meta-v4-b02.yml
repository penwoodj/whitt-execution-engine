workflow_id: fas_meta_system_live
name: "FAS top-level meta system (live)"
description: "Stitched top-level control flow: conf gate -> lane heads (GWT route_to) -> per-lane atom chains -> checked routelog"
version: "1.0.0"
author: "FAS experiment suite"
tags: [sub-workflow, fas, meta-system]
schema_version: "2.0.0"
min_schema_version: "2.0.0"
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
models:
