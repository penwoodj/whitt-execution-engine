        temperature: 0.0
        max_tokens: 3
      when:
        before_step_starts:
          - shell:
              command: python3 /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/full-agentic-system/scripts/meta-conf.py --probe /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/full-agentic-system/top-level/runs/v4/reg-b04-tcA012-r1/probe-tcA012.json --default LIGHT
