    source_path: /run/media/jon/data/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    host:
      type: llama_cpp_with_vulkan
agentic_workflow:
  when:
    after_workflow:
      - log:
          level: info
          to_file_path: /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/consolidation-verify/final.log
          event_fields: [workflow_id, total_steps, succeeded, failed]
  steps:
    conf_tcA065:
      generative_entity: "${models.m_fmt}"
      prompt: route
      model_overrides:
        temperature: 0.0
        max_tokens: 3
      when:
        before_step_starts:
          - shell:
              command: python3 /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/scripts/meta-conf.py --probe /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/consolidation-verify/probe-tcA065.json --default LIGHT
              working_dir: /home/jon/code/whitt-execution-engine
              fail_on_error: true
          - gwt:
            - given: '{{bookmarks.shell_output.stdout}} == "HEAVY"'
              then: sl0_plan_tcA065
            - given: '{{bookmarks.shell_output.stdout}} == "SYNTH"'
              then: sl0_split_tcA065
            - given: '{{bookmarks.shell_output.stdout}} == "LIGHT"'
              then: sl0_solve_tcA065
    sl0_plan_tcA065:
      generative_entity: "${models.m_think}"
      prompt: |
        {{bookmarks.shell_output.stdout}}
      model_overrides:
        temperature: 0.0
        max_tokens: 1000
      when:
        before_step_starts:
          - shell:
              command: python3 /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/scripts/stage-emit.py --case-yml /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/cases/case-tcA065.yml --case tcA065 --stage plan --run-dir /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/consolidation-verify --style plan
              working_dir: /home/jon/code/whitt-execution-engine
              fail_on_error: true
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 42'
                then: sl1_solve_tcA065
        after_step_succeeds:
          - save_to:
              - $text_state
              - /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/consolidation-verify/ans-tcA065-plan.txt
          - log:
              level: info
              to_file_path: /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/consolidation-verify/progress.log
