workflow_id: fas_meta_system_live
name: "FAS top-level meta system (live)"
description: "Stitched top-level control flow: conf gate -> lane heads (GWT route_to) -> per-lane atom chains -> checked routelog"
version: "1.0.0"
author: "FAS experiment suite"
tags: [sub-workflow, fas, meta-system]
schema_version: "2.0.0"
min_schema_version: "2.0.0"
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  resource_admission:
    enforcement_policy: block
    minimum_available:
      ram: 6GiB
      vram: 6GiB
      swap_free: 4GiB
    model_estimate:
      kv_cache: 2.1GiB  # Qwen3-4B-Instruct-2507-Q4_K_M.gguf: 2.33GiB weights, ctx 32768 q8_0
      compute_buffer: 512MiB
      host_runtime: 700MiB
      expected_runtime_secs: 4000
    telemetry:
      write_profile: true
models:
  m_fmt:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
    source_path: /run/media/jon/data/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    host:
      type: llama_cpp_with_vulkan
  m_deep:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
    source_path: /run/media/jon/data/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    host:
