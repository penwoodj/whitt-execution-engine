workflow_id: fas_meta_system_live
name: "FAS top-level meta system (live)"
description: "Stitched top-level control flow: conf gate -> lane heads (GWT route_to) -> per-lane atom chains -> checked routelog"
version: "1.0.0"
author: "FAS experiment suite"
tags: [sub-workflow, fas, meta-system]
schema_version: "2.0.0"
min_schema_version: "2.0.0"
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  resource_admission:
    enforcement_policy: block
    minimum_available:
      ram: 6GiB
      vram: 6GiB
      swap_free: 4GiB
    model_estimate:
      kv_cache: 2.1GiB  # Qwen3-4B-Instruct-2507-Q4_K_M.gguf: 2.33GiB weights, ctx 32768 q8_0
      compute_buffer: 512MiB
      host_runtime: 700MiB
      expected_runtime_secs: 6000
    telemetry:
      write_profile: true
models:
  m_fmt:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
    source_path: /run/media/jon/data/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    host:
      type: llama_cpp_with_vulkan
  m_deep:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
    source_path: /run/media/jon/data/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    host:
      type: llama_cpp_with_vulkan
  m_think:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
    source_path: /run/media/jon/data/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    host:
      type: llama_cpp_with_vulkan
agentic_workflow:
  when:
    after_workflow:
      - log:
          level: info
          to_file_path: /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/reg-b10/final.log
          event_fields: [workflow_id, total_steps, succeeded, failed]
  steps:
    conf_tcA053:
      generative_entity: "${models.m_fmt}"
      prompt: route
      model_overrides:
        temperature: 0.0
        max_tokens: 3
      when:
        before_step_starts:
          - shell:
              command: python3 /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/scripts/meta-conf.py --probe /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/reg-b10/probe-tcA053.json --default LIGHT
              working_dir: /home/jon/code/whitt-execution-engine
              fail_on_error: true
          - gwt:
            - given: '{{bookmarks.shell_output.stdout}} == "HEAVY"'
              then: ss0_plan_tcA053
            - given: '{{bookmarks.shell_output.stdout}} == "SYNTH"'
              then: ss0_split_tcA053
            - given: '{{bookmarks.shell_output.stdout}} == "LIGHT"'
              then: ss0_solve_tcA053
    ss0_plan_tcA053:
      generative_entity: "${models.m_think}"
      prompt: |
        {{bookmarks.shell_output.stdout}}
      model_overrides:
        temperature: 0.0
        max_tokens: 1000
      when:
        before_step_starts:
          - shell:
              command: python3 /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/scripts/stage-emit.py --case-yml /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/cases/case-tcA053.yml --case tcA053 --stage plan --run-dir /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/reg-b10 --style plan
              working_dir: /home/jon/code/whitt-execution-engine
              fail_on_error: true
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 42'
                then: ss1_solve_tcA053
        after_step_succeeds:
          - save_to:
              - $text_state
              - /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/reg-b10/ans-tcA053-plan.txt
          - log:
              level: info
              to_file_path: /home/jon/code/whitt-execution-engine/experiments/full-agentic-system/top-level/runs/v4/reg-b10/progress.log
              event_fields: [step_name, model_name, duration_ms, token_count]
