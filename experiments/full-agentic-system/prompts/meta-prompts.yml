# Top-level natural prompts — styled on the user's real opencode chat
# prompts (same voice: imperative, multi-clause, lowercase drift, "tell
# me", "look at", "make", "show me", tolerance clauses like "no changes"
# or "don't run any llm calls").
#
# meta.lane = designed route (spoof probe + scenario truth)
# meta.shape = composition the shape-library should match
meta-prompts:
  - prompt_id: mp-01
    text: >
      look at the experiments folders and tell me what our overall
      findings are for what is and is not working in these workflows,
      just tell me about our live system run findings no changes
    meta: {lane: HEAVY, shape: repo-sweep-report}
  - prompt_id: mp-02
    text: >
      what are the core meta principles I'm investigating in these
      experiments?
    meta: {lane: LIGHT, shape: single-hop-summary}
  - prompt_id: mp-03
    text: >
      based on these principles do web deep research on what others
      have proven or made progress on in relation to agentic systems
      with models at this much smaller scale
    meta: {lane: HEAVY, shape: research-synthesis}
  - prompt_id: mp-04
    text: >
      show me 3 representative test cases from the new experiment
      folder
    meta: {lane: LIGHT, shape: artifact-display}
  - prompt_id: mp-05
    text: >
      what is the average test input length across the suite?
    meta: {lane: LIGHT, shape: single-stat}
  - prompt_id: mp-06
    text: >
      make a new experiment subfolder for the next atom then design
      the cases and write the generator script and the workflow yml,
      don't run any llm calls
    meta: {lane: SYNTH, shape: multi-part-build}
  - prompt_id: mp-07
    text: >
      look into how the retry ladder is failing on near-miss cases
      and tell me what you'd change about the scoped replan prompt,
      don't implement anything yet
    meta: {lane: HEAVY, shape: investigate-propose}
  - prompt_id: mp-08
    text: >
      run the spoof battery on the synthesis workflow and tell me if
      the conflict band recovers like the design says it should
    meta: {lane: SYNTH, shape: run-and-verify}
