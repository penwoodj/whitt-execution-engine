- prompt_id: tcA003
  text: 'I want to run a little experiment campaign the way I usually do them, with stages and pinch points and an honest ledger, except this one is fully self-contained in /tmp/opencode/capacity-test so
    no real infrastructure gets touched and no llm calls are made and nothing loads any models, it''s all deterministic simulation, but I want it treated with the same seriousness as a real one because
    the point is exercising the whole workflow shape I use: design the experiment, generate the inputs, execute in controlled rounds, capture everything, analyze against expectations, then make an efficiency
    version and prove it didn''t change the answers. So here''s the fictional scenario, and I''m going to give it to you the way I''d give a real one, a bit rambling with the details buried in there, because
    that''s how my prompts actually look and I want the deliverables structured anyway.


    The scenario: a small compute cluster has 12 nodes split into three classes, 4 big nodes, 4 medium, 4 small. Jobs arrive in waves. Each job has a class requirement, a duration in minutes, and a priority
    of low or high, and high priority jobs can preempt low ones on the same node, and when a low job gets preempted it has to restart from the beginning later, no partial state saved, that''s the rule and
    it''s mean on purpose because preemption without checkpointing is where all the interesting accounting hides. The experiment question is: under a fixed arrival schedule, what''s the makespan, how much
    total compute time gets wasted on restarted low jobs, and what would change if low jobs could checkpoint every k minutes so a preemption only costs the work since the last checkpoint, for k equals 5,
    10, and 15.


    So the concrete asks. First, a generator script that writes the arrival schedule as a json file under fixtures/: exactly 40 jobs, arrival minutes spread over a 240 minute window, durations between 5
    and 45 minutes, high priority ones arriving in a burst somewhere in the middle third of the window because that''s realistic and it makes the preemption behavior matter, plus node classes sized so nothing
    is trivially schedulable, and the schedule must be seeded, a fixed seed constant at the top of the script, so rerunning reproduces the same universe bit for bit, and if I change the seed I get a different
    universe but the same shape, that''s non negotiable. Second, the simulator itself: a step by minute discrete event walk, deterministic, that takes the schedule and a checkpointing policy and produces
    per job records, start times, preemption counts, wasted minutes, finish times, and the overall makespan, plus a per minute node occupancy log so I can go look at any minute and see what was running
    where. No floating point fuzz anywhere in the decision logic, integers only, ties broken by job id order, and the tie rule gets written down in the design doc. Third, a design doc, short, half a page:
    the rules, the invariants, the tie breaking, and three predictions I''m making up front before running anything: I predict makespan improves by less than 15 percent going from no checkpoints to k equals
    5, I predict wasted compute drops by more than half at k equals 5, and I predict the gap between k equals 10 and k equals 15 is smaller than between 5 and 10. Write those down first so we can''t retroactively
    pretend we called it.


    Then run the four configurations, no checkpoint, k 5, k 10, k 15, each run writes its outputs under runs/<config-name>/ with the job table, the occupancy log, and a summary json, and then the analysis
    script builds me a comparison table, makespan, total wasted low minutes, mean and worst case per job wait time, and a verdict line per prediction, confirmed or refuted, with the actual delta next to
    it. I want the truth even where it makes my predictions look dumb, especially there. Also add a verification pass that invariants hold: no node ever runs two jobs at once in the same minute, high priority
    never waits when a node of its class is free, every preempted low job demonstrably restarts from zero under no-checkpoint and from its last checkpoint boundary under the k policies, checked mechanically
    from the logs, not trusted from the simulator''s own bookkeeping, recompute from the occupancy log independently and cross check, because a simulator grading its own homework is worthless and I''ve
    been burned by that exact thing before.


    And then the parts that make it a campaign and not a one shot. Checkpointing: at three points, after fixtures, after first config run, after analysis, write a checkpoint file capturing state, what''s
    done, what''s next, and a one line context note, so that if this session dies the next one picks up without asking me anything. Runtime ledger: time every script invocation for real and append to a
    timings.csv, stage, config, seconds, and give me the totals per stage at the end. Efficiency version: after the four configs verify, restructure the simulator so a full campaign runs materially faster,
    profile first or reason it out, whatever, but same seeded universe and the comparison table has to come out numerically identical, byte equal on the summary jsons is the cleanest proof, and if you get
    less than a 2x speedup say so plainly instead of dressing it up. And last, a stress echo: rerun everything with a second seed, just the four configs and the comparison, no new design doc, and tell me
    whether the three prediction verdicts flip, because one seed is an anecdote and I know it.


    Style notes since these matter to me: keep everything runnable through one entry script with stage names I can call individually, no interactive anything ever, no prompts, no read -p, nothing that hangs
    a non interactive shell, loud failures with nonzero exits, and every claim you make at the end about runtime or correctness has to point at a file or a command output I can check myself. You decide
    all the small stuff, file names, column orders, whether the occupancy log is csv or jsonl, I genuinely don''t care, and don''t ask me a single question unless the whole ask itself is blocked on it,
    which it shouldn''t be, everything above is decidable. Don''t stop until the four configs are verified, the predictions have verdicts, the efficiency version is proven identical and faster or honestly
    reported as not much faster, the second seed is run, and you''ve handed me the final report with paths, timings, and the one thing you''d change about this experiment if we ran it again for real.'
