meta-prompts:
- prompt_id: tcA001
  text: 'I want you to build me a full working inventory pipeline for a fake parts warehouse, everything lives under /tmp/opencode/warehouse-test and nothing outside that folder gets touched, no changes
    anywhere else, and I mean it, don''t go creating stuff in the repo root or my home folder or anywhere like that because I''ve had agents do that before and it made a mess I had to clean up manually.
    So the setup is this: first you create the fixture data yourself, and I want you to actually create it, not describe it, 200 inventory record files split across 4 subfolders called inbound, outbound,
    quarantined, and archived, each file is a little JSON document with fields for part_id (format is like PTM-00042 so letters dash five digits, make them unique across the whole set), part_name, category
    which should be one of fastener, electrical, housing, consumable, or sensor, quantity on hand which is a non negative integer, unit_cost which is a dollar amount with two decimals, warehouse_location
    which is a zone letter A through E plus a two digit rack number like C17, last_inspected which is an ISO date, and a status field that is one of ok, needs_review, or defective. I want realistic messy
    variety in there, some duplicate part names with different ids, some quantity zeros, at least a few records where the same part_id accidentally appears twice because data entry happens, a couple of
    files that are slightly malformed on purpose like a missing comma or a trailing brace, that kind of thing, because a pipeline that only works on clean data is worthless to me and I''ve said before I
    want things tested against reality not against the happy path.


    Once the fixtures exist then build the pipeline itself and I want it as scripts, actual runnable scripts with a shebang, living in a scripts subfolder, not a wall of inline shell I can''t rerun. The
    pipeline needs to do these stages in order and each stage writes its own output files and a small log line so I can see where time went and where things broke. Stage one scans all four folders and builds
    one merged manifest, every valid record in, and for the malformed ones I don''t want silent skipping, I want them quarantined into a rejects file with the reason and the filename so nothing just vanishes.
    Stage two deduplicates, and think about what dedupe means here, exact same part_id twice means keep the newest by file modification time and log the loser, same part_name in the same category with quantities
    that differ is probably a real duplicate too so flag those into a review file instead of deciding silently, and I want the rules written down in a rules.md next to the scripts so when I come back in
    a week I know why the machine did what it did. Stage three computes the report numbers: total distinct parts, total inventory value which is quantity times unit_cost summed up, per category counts and
    values, defective rate as a percentage, how many need review, the five most expensive single line items, and a zone breakdown showing value by warehouse zone. Stage four writes two outputs, a warehouse-report.md
    that a human can actually read with tables and short plain sentences, no buzzword garbage, and a machine copy warehouse-report.json that has the exact same numbers in it, and the two have to agree,
    if the markdown says 14 defective and the JSON says 13 that''s a failure and you fix it before telling me anything is done.


    And here''s the part I really care about: verification has to be built in, not bolted on after. Write a verify script that recomputes everything independently from the raw fixture files with its own
    separate logic, not by importing the pipeline''s own functions because that''s just asking the same code if it lied, and it checks the report files field by field and exits nonzero with a clear message
    on any mismatch, and a check that the counts add up, distinct plus rejects plus duplicate-losers should account for every file you started with, nothing unexplained. Then run the whole thing end to
    end, the pipeline and then the verifier, and show me the actual outputs and the exit codes, paste the report in chat at the end too because I want to skim it without opening files. After that''s working
    I want the timing pass, run the pipeline three times and give me wall clock numbers per stage for each run in a little table, and if any stage is dumb slow relative to the work it does, tell me honestly
    rather than pretending it''s fine.


    Then, only after all of that is verified working, I want the efficiency version, same exact outputs, byte for byte the same report files, but faster, and if you can''t make it meaningfully faster tell
    me that instead of shaving two milliseconds and calling it a win. Rerun the verifier against the efficiency version outputs to prove nothing drifted. And through all of this don''t stop halfway and
    ask me questions you can answer yourself, the spec above has everything you need, if you genuinely hit a fork that changes what I asked for then ask, but preference questions like file names and table
    column order are yours to decide, just note what you picked. Also don''t use any network, no web searches, no installing packages, this is all local standard tooling, python3 or bash or both, whatever
    you''d actually reach for. When you''re totally done, give me a short summary of what''s where, the file paths, the run times, and the one line on anything that surprised you. Don''t skip steps and
    don''t tell me it''s done until the verifier has passed on both versions and you''ve actually looked at the report yourself. One more thing on style since it keeps coming up: no interactive anything
    anywhere, no read -p, no prompts, nothing that would hang a non interactive shell, loud failures with nonzero exit codes, and if a stage gets run twice it should either clean up after itself or safely
    overwrite, pick one approach and mention it in the rules file so I know what to expect. And keep the whole thing dependency free, standard library python or plain bash, because this machine is the one
    that gets cranky when random packages get pulled in and I don''t want to find out the hard way again.'
  meta:
    lane: HEAVY
    shape: multi-stage-pipeline
    batch: 1
- prompt_id: tcA002
  text: 'I''ve been building workflow harnesses for small local models for a while now and what I want from you this time is a self-contained regression harness exercise, completely inside /tmp/opencode/regression-test,
    no repo files, no network, no model calls, none of that, just your own reasoning and deterministic scripts, because what I''m actually testing is whether a task can be specified, executed, verified,
    and iterated in one go without me hand holding every step. So here''s the shape of it. You''re going to design a fake issue tracker dataset and then build a grading harness against it, and the twist
    is you''ll also generate candidate solutions, some intentionally wrong, and the harness has to catch them, which means the whole thing is self-testing and I can tell at a glance whether you actually
    did the work or just printed plausible text, and you know who you are if that''s the plan.


    The dataset first: 60 issue records across three jsonl files under data/, called critical.jsonl, normal.jsonl, and low.jsonl, 20 each. Every issue has id like ISS-101, title, component which is one
    of auth, billing, search, ingest, or ui, severity matching its folder, a reported date, days_open as an integer, assignee as a name from a fixed pool of six engineers, status which is open, in_progress,
    or resolved, and a tags array with zero to four tags drawn from a pool of at least ten. Bake real structure into it, not uniform mush: make certain components skew certain severities, make one engineer
    hold way more criticals than anyone else, make a couple of resolved issues that are suspiciously old, make a tag that only ever shows up together with one other tag, hide me three or four little patterns
    like that and write them down in a hidden-patterns.md that the grader can check against later, because the point of fixtures is that the truth is known before the questions are asked.


    Then the questions: a tasks.md with exactly 12 analytical questions about the dataset, things like which engineer has the highest resolved count relative to their assignment load, or what percentage
    of critical issues are past 30 days old and unresolved, or which pair of tags co-occurs most, plus at least two questions that are unanswerable from the data as specified, like the average time to resolution
    for issues reported on weekends when the records don''t actually contain resolution timestamps, because a harness that can''t say "this can''t be known from what''s here" is lying to me in a way I really
    dislike. Each question gets a truth entry in an answers file with the exact computed value and, for the unanswerable ones, the literal string NOT_ANSWERABLE plus one line on why.


    Now the harness: a grade script that takes a solutions file, one line per question id with a value, and scores it against the answers, strict comparisons where values are exact, tolerance of plus or
    minus 0.01 on anything percentage-ish, and NOT_ANSWERABLE must match exactly or it counts wrong. Output a score out of 12, a pass fail line at 10 or better, and per question detail on misses. Then the
    candidates: write four separate solution files, solution-perfect which should score 12 out of 12, solution-careless with exactly three plausible but wrong values like off by one on a count or swapping
    two engineers, solution-hallucinate which answers the unanswerable questions with made up confident numbers instead of refusing, and solution-empty which punts on more than half. Run the grader on all
    four and the expected results are 12, 9, fail, and fail, and solution-hallucinate specifically must fail on the unanswerable ones, that''s the whole point of putting them in. If any of those four runs
    doesn''t come out as expected that''s a bug in your grader or your truths and you fix it and rerun until the story is consistent, and don''t paper over a mismatch by editing the expected outcome to
    match reality after the fact, that''s the oldest trick in the book and I will notice.


    After the harness passes its own meta test I want the iteration twist: a mutation script that perturbs the dataset itself, swaps some severities, reassigns some issues, changes some dates, then recomputes
    what the true answers should be, writes a fresh answers file, and reruns all four candidate solutions plus regenerates solution-perfect from the new data so it still aces it while the stale careless
    one now misses different questions. The point is the harness has to survive its own fixtures moving underneath it, that''s what regression means, it''s not a snapshot it''s a relationship. Show me the
    before and after scores in one table.


    Finally give me the numbers I always ask for: how long each script took to run, timed for real with time or timestamps, not vibes, and a short file inventory so I know what lives where. And a couple
    of style things: everything runnable from a single do-all script with clear stage logging, errors loud and early, no silent except blocks swallowing failures, and every script runnable twice without
    exploding, idempotent or self-cleaning, your pick, but say which one you chose and where it''s documented. While you work, assume defaults yourself for anything I didn''t specify, names, orderings,
    formatting, those are your calls not questions for me, I only want to hear from you at real decision points or when it''s done and verified. Don''t stop until the grader passes on all four candidates
    against both the original and the mutated datasets, the timing table exists, and you''ve written a two paragraph honest self assessment of where this harness would break first if I stressed it harder.
    Oh and one more thing I keep having to say: no network, no pip installs, standard library only, and every number you quote me at the end better come from an actual run you can point at, because "should
    be roughly nine out of twelve" is not a result, it''s a vibe, and I''ve gotten enough vibes from tools lately to last me a while.'
