- prompt_id: tcA005
  text: 'api latency percentiles is the job, and i want the work to show for it. i''ve got put together an end-to-end processing exercise to do and i want it done properly, which means /tmp/opencode/latency-run
    for everything, real scripts i can rerun, real files on disk, not a description of what would happen.


    here''s the situation: four api endpoints called /login, /search, /checkout, /profile; also latency samples in microseconds, millions of them, one csv per endpoint; also a p99 regression is suspected
    on /checkout after wednesday, after that slo is 300ms p99 on everything except /login at 800ms. i''m deliberately not specifying every little thing, because half the value here is seeing what gets decided
    when nobody''s looking. the decisions file is where you show your work on those, and a wrong call documented beats a right call nobody can find.


    and no leaving a to-do in a comment for later-me, later-me is you in ten minutes, finish the job.


