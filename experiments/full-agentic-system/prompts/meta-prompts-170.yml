    everything gets a run twice test before you call it done, because the first run always works and the second one is where the state bugs live.


    the asks, in order, and each one writes its own output so i can see where things broke when they break:


    stage by stage: load all four csvs without melting, chunked or streamed, and say which you did. if that stage has a natural ordering dependency on the previous one, respect it, the sequence above is
    not decorative.

    stage by stage: p50, p90, p99, p999 per endpoint per day, integers in milliseconds. if that stage has a natural ordering dependency on the previous one, respect it, the sequence above is not decorative.

    first the /checkout regression, when it started, how big in percent, and the worst single hour. edge cases belong in the output, not in your head, list what you hit and what you did with each.

    then a histogram of /checkout before and after wednesday in ten buckets. with the method visible, not just the result, the how is the deliverable here as much as the what.

    then report.md plus latency.json that a verifier can recompute from the raw csvs. and be precise about what counts as done for that one, because vague is where shortcuts hide.


    and bake in the dirt, i''ve said before i want things tested against reality not the happy path: some latency values are zero, some are negative from a broken probe, and the file has three different
    header spellings. i want each mess instance visible in the output somewhere, surfaced not absorbed, so i can audit the handling later. the rule you applied to each wart belongs in the rules file, next
    to the wart itself.


    on outputs: every stage writes to its own subfolder under the workspace, naming is yours but be consistent, and the final report goes both human, markdown with actual tables, and machine, json with
    the same numbers. i''ll be checking that the two agree, and i''ll be unhappy if they don''t.


    and write the checker like a hostile reviewer. independent logic, recompute everything checkable from raw inputs, verify the stated invariants mechanically, and flag anything that only holds because
    the pipeline says so. exit codes visible. i don''t trust should-pass and neither should you.


