provenance: 'budget_burned=62 budget_left=-37 longest_wait=6

  archetype=backoff_budget variant=2 seed=53'
success_criteria:
  deterministic_checks:
    json_exact: '{"budget_burned": 62, "budget_left": -37, "jobs_count": 2, "longest_wait": 6}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each retry waits double the previous wait, starting at 1 minutes, no single wait exceeds the 6 minute cap
  - the shared retry budget is 25 minutes across all jobs, waits and run time both count against it
  - a job that exhausts its declared failures stops, it does not borrow budget from tomorrow
  facts:
  - scan-a failed 3 times with each run taking 2 minutes, scan-b failed 6 times with each run taking 4 minutes
  output_spec:
    budget_burned: int
    budget_left: int
    jobs_count: int
    longest_wait: int
contract:
  budget_burned:
    formula: B
    literals:
    - name: B
      regex: ''
      value: 62
  budget_left:
    formula: T - budget_burned
    literals:
    - name: T
      regex: shared retry budget is (\d+) minutes
      value: 25
  jobs_count:
    formula: '2'
    literals: []
  longest_wait:
    formula: min(C, cap)
    literals:
    - name: C
      regex: ''
      value: 6
v6:
  entities:
  - id: burned
    question: total budget minutes burned tonight (waits plus run time, all jobs)
    answer: 62
  - id: left
    question: budget minutes remaining after tonight (budget minus burned)
    answer: -37
  - id: njobs
    question: how many jobs ran through the retry engine tonight
    answer: 2
  - id: maxwait
    question: longest single capped wait any job sat through (minutes)
    answer: 6
  aggregate: '{''budget_burned'': int(a(''burned'')), ''budget_left'': int(a(''left'')), ''jobs_count'': int(a(''njobs'')), ''longest_wait'': int(a(''maxwait''))}'
