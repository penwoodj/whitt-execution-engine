  the retry engine burned through the evening, scan-a failed 3 times with each run taking 2 minutes, scan-b failed 6 times with each run taking 4 minutes. waits double from 1 minutes and cap at 6, run time
  counts the same as wait time, the budget ledger does not care which kind of minute it was.


  the doubling rule predates the cap, the cap predates the shared budget, all three exist because of three different bad nights. stack them in order, double first, cap second, sum third.


  the failure inbox you do not manage also queues complaint emails per failure, the inbox is loud, the inbox is not the budget.


  the rules of the desk, as they stand tonight: 1. each retry waits double the previous wait, starting at 1 minutes, no single wait exceeds the 6 minute cap. 2. the shared retry budget is 25 minutes across
  all jobs, waits and run time both count against it. 3. a job that exhausts its declared failures stops, it does not borrow budget from tomorrow.


  the facts of record: scan-a failed 3 times with each run taking 2 minutes, scan-b failed 6 times with each run taking 4 minutes.


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


