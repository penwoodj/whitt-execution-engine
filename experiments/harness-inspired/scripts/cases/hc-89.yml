  the dead-letter shelf gets swept at dawn, the imports shelf holds 65 messages this morning, the hooks shelf holds 12 messages this morning, the poison threshold is 1 failed attempts, redrive recovers
  50 percent of non-poison messages tonight. poison is quarantined first and never moves again, the rest take one redrive ride, whatever survives the ride counts as recovered, whatever does not goes back
  on the shelf.


  the fraction is honest tonight, the queue crew measured it last week, on bad nights it lies, tonight it does not.


  the shadow consumer you do not manage re-reads the shelf for its own metrics, shadow reads neither recover nor poison anything.


