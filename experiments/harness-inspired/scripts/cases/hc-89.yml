auxiliary: all facts needed are in the prompt itself
provenance: 'dlq=77 poison=2 recovered=37 unrecovered=40

  archetype=dlq_redrive variant=3 seed=88'
success_criteria:
  deterministic_checks:
    json_exact: '{"dlq_total": 77, "poison_dead": 2, "recovered": 37, "unrecovered": 40}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a message that failed 1 or more delivery attempts is poison, poison never redrives
  - redrive replays everything else once, a fixed fraction comes back healthy tonight, the rest return to the queue
  - poison counting is per topic but the poison threshold is global
  facts:
  - the imports shelf holds 65 messages this morning, the hooks shelf holds 12 messages this morning
  - the poison threshold is 1 failed attempts
  - redrive recovers 50 percent of non-poison messages tonight
  output_spec:
    dlq_total: int
    poison_dead: int
    recovered: int
    unrecovered: int
contract:
  dlq_total:
    formula: c1+c2
    literals: []
  poison_dead:
    formula: 2*P
    literals:
    - name: P
      regex: poison threshold is (\d+)
      value: 1
  recovered:
    formula: int((dlq_total - poison_dead) * F)
    literals:
    - name: F
      regex: redrive recovers (\d+) percent
      value: 50.0
v6:
  entities:
  - id: dt
    question: messages on the dead-letter shelf in total (all topics)
    answer: 77
  - id: pd
    question: poison messages quarantined permanently (threshold x topics)
    answer: 2
  - id: rc
    question: messages recovered by the redrive ride
    answer: 37
  - id: ur
    question: messages still unresolved after the redrive
    answer: 40
  aggregate: '{''dlq_total'': int(a(''dt'')), ''poison_dead'': int(a(''pd'')), ''recovered'': int(a(''rc'')), ''unrecovered'': int(a(''ur''))}'
