  healthy tonight, the rest return to the queue. 3. poison counting is per topic but the poison threshold is global.


  the facts of record: the imports shelf holds 65 messages this morning, the hooks shelf holds 12 messages this morning the poison threshold is 1 failed attempts redrive recovers 50 percent of non-poison
