domain: greenhouse vent control
objective: derive zones_over, zones_under, vent_minutes, overrides_active from the stated rules
prompt: 'the the sweep ledger desk is yours, the binder is old but the rules inside it are current and enforced, boundaries are inclusive unless a rule says otherwise, and these rules say otherwise where
  it matters.


  the vent controller reports by zone, zone bay-a reads 30 degrees with 9 vent minutes logged, zone bay-b reads 17 degrees with 0 vent minutes logged, zone bay-c reads 25 degrees with 4 vent minutes logged,
  the high band edge is 24, the low edge is 16, 3 manual overrides are active tonight. band edges are strict, above high vents, below low heats, in-band idles. vent minutes sum only for over-band zones,
  overrides lock zones out but still count as overrides.


  strict edges won after a season of hysteresis arguments, the controller now believes the thermometer and nothing else.


  the weather feed you do not manage forecasts band shifts overnight, forecasts do not move actuators, readings do.


  the rules of the desk, as they stand tonight: 1. zones above 24 degrees vent until back in band, vent minutes accrue per zone per excursion. 2. zones below 16 degrees heat, heating never counts against
  vent minutes. 3. manual overrides lock a zone''s vents closed, overrides are counted and never argued with.


  the facts of record: zone bay-a reads 30 degrees with 9 vent minutes logged, zone bay-b reads 17 degrees with 0 vent minutes logged, zone bay-c reads 25 degrees with 4 vent minutes logged the high band
  edge is 24, the low edge is 16 3 manual overrides are active tonight.


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


