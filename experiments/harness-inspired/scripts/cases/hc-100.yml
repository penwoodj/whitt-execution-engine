auxiliary: all facts needed are in the prompt itself
provenance: 'over=2 under=0 vent_min=13 overrides=3

  archetype=vent_control variant=3 seed=99'
success_criteria:
  deterministic_checks:
    json_exact: '{"zones_over": 2, "zones_under": 0, "vent_minutes": 13, "overrides_active": 3}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - zones above 24 degrees vent until back in band, vent minutes accrue per zone per excursion
  - zones below 16 degrees heat, heating never counts against vent minutes
  - manual overrides lock a zone's vents closed, overrides are counted and never argued with
  facts:
  - zone bay-a reads 30 degrees with 9 vent minutes logged, zone bay-b reads 17 degrees with 0 vent minutes logged, zone bay-c reads 25 degrees with 4 vent minutes logged
  - the high band edge is 24, the low edge is 16
  - 3 manual overrides are active tonight
  output_spec:
    zones_over: int
    zones_under: int
    vent_minutes: int
    overrides_active: int
contract:
  zones_over:
    formula: (t1>H)+(t2>H)+(t3>H)
    literals:
    - name: H
      regex: high band edge is (\d+)
      value: 24
  vent_minutes:
    formula: m*(t>H) sum
    literals:
    - name: m
      regex: ''
      value: 13
v6:
  entities:
  - id: zo
    question: zones above the high band edge (count)
    answer: 2
  - id: zu
    question: zones below the low band edge (count)
    answer: 0
  - id: vm
    question: total vent minutes logged tonight (over-band zones only)
    answer: 13
  - id: oa
    question: manual overrides active
    answer: 3
  aggregate: '{''zones_over'': int(a(''zo'')), ''zones_under'': int(a(''zu'')), ''vent_minutes'': int(a(''vm'')), ''overrides_active'': int(a(''oa''))}'
