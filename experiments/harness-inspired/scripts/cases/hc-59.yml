provenance: 'classes_purged=0 held=3 records_deleted=2003

  archetype=retention_purge variant=2 seed=58'
success_criteria:
  deterministic_checks:
    json_exact: '{"classes_purged": 0, "classes_held": 3, "records_deleted": 2003, "classes_total": 3}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each class purges records older than its own retention days, no exceptions inside a class
  - classes with an open legal hold skip the purge entirely tonight, hold means all-or-nothing per class
  - the purge counts records deleted, not records scanned, scanning is free and counts for nothing
  facts:
  - the trace class scanned 1500 records with a retention of 7 days, the metric class scanned 300 records with a retention of 90 days, the event class scanned 480 records with a retention of 180 days
  - 3 classes carry an open legal hold tonight
  output_spec:
    classes_purged: int
    classes_held: int
    records_deleted: int
    classes_total: int
contract:
  classes_purged:
    formula: 3 - H
    literals:
    - name: H
      regex: (\d+) classes carry an open legal hold
      value: 3
  records_deleted:
    formula: R
    literals:
    - name: R
      regex: ''
      value: 2003
v6:
  entities:
  - id: cp
    question: classes purged tonight (total minus held)
    answer: 0
  - id: ch
    question: classes under legal hold (skipped entirely)
    answer: 3
  - id: rd
    question: records deleted tonight (sum of beyond-retention records in purged classes)
    answer: 2003
  - id: ct
    question: total classes in the sweep
    answer: 3
  aggregate: '{''classes_purged'': int(a(''cp'')), ''classes_held'': int(a(''ch'')), ''records_deleted'': int(a(''rd'')), ''classes_total'': int(a(''ct''))}'
