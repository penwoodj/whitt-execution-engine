objective: derive seated_reservations, walkins_seated, vacant_at_close, turns_completed from the stated rules
prompt: 'you own the swing shift tonight, the sweep ledger is yours until handoff, nobody else will touch it, the rules stack, later rules do not cancel earlier ones.


  the floor manager counts the night in tables, 30 reservations booked against 28 tables, 9 reservations no-showed, 14 walk-in parties arrived, the floor completed 120 table turns tonight. reservations
  seated first minus no-shows, walk-ins fill what opened, vacant is what never filled, turns stand apart as the reset count.


  the fifteen-minute release exists because the old five-minute rule starved the walk-in lane on fridays, fifteen won after a month of arguments.


  the reservation app you do not manage shows covers including waitlist holds, app covers are projections, tables are facts.


  the rules of the desk, as they stand tonight: 1. no-show reservations release their seats after fifteen minutes, released seats go to walk-ins in arrival order. 2. walk-ins beyond open seats leave, there
  is no bar-queue promise tonight. 3. a turn counts a table reset between parties, turns are counted independent of who sat.


  the facts of record: 30 reservations booked against 28 tables 9 reservations no-showed 14 walk-in parties arrived the floor completed 120 table turns tonight.


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


