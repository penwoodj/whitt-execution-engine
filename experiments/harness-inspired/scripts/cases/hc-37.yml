domain: disk quota enforcement
objective: derive warned, locked, grace_expired_users, at_quota_exactly from the stated rules
prompt: 'you are the dispatch supervisor for the deploy lane, the standing orders live in the runbook you helped write last spring, when a rule sends work back, the second pass follows the same rules.


  the quota desk opens the week with the same ritual, pp stands at 105 gigabytes against a 100 gigabyte quota, qq stands at 100 gigabytes against a 100 gigabyte quota, rr stands at 118 gigabytes against
  a 100 gigabyte quota, ss stands at 92 gigabytes against a 100 gigabyte quota, the grace window is 14 days and 6 over-quota users have let it lapse. over-quota counting includes exactly-at, the boundary
  is inside the wall, not outside it. lapsed grace means locked, locked is binary, there is no mostly locked.


  the exactly-at clause was disputed for a full quarter before it won, the argument that settled it was a printout of forty users at exactly quota doing zero cleanup.


  the capacity forecast you do not manage projects quota pressure six months out, forecasts are weather, this desk deals in readings.


  the rules of the desk, as they stand tonight: 1. usage at or above quota is over quota for warning purposes, exactly-at counts as over. 2. users over quota enter a grace window, grace expired means locked
  until they clear space. 3. the quota line is per user, pooled storage is a different desk.


  the facts of record: pp stands at 105 gigabytes against a 100 gigabyte quota, qq stands at 100 gigabytes against a 100 gigabyte quota, rr stands at 118 gigabytes against a 100 gigabyte quota, ss stands
  at 92 gigabytes against a 100 gigabyte quota the grace window is 14 days and 6 over-quota users have let it lapse.


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


