provenance: 'warned=2 locked=0 grace_lapsed=6 exactly_at=1

  archetype=quota_grace variant=1 seed=36'
success_criteria:
  deterministic_checks:
    json_exact: '{"warned": 2, "locked": 0, "grace_expired_users": 6, "at_quota_exactly": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - usage at or above quota is over quota for warning purposes, exactly-at counts as over
  - users over quota enter a grace window, grace expired means locked until they clear space
  - the quota line is per user, pooled storage is a different desk
  facts:
  - pp stands at 105 gigabytes against a 100 gigabyte quota, qq stands at 100 gigabytes against a 100 gigabyte quota, rr stands at 118 gigabytes against a 100 gigabyte quota, ss stands at 92 gigabytes against
    a 100 gigabyte quota
  - the grace window is 14 days and 6 over-quota users have let it lapse
  output_spec:
    warned: int
    locked: int
    grace_expired_users: int
    at_quota_exactly: int
contract:
  warned:
    formula: (u1>q1)+(u2>q2)+(u3>q3)+(u4>q4) + 0*exact
    literals: []
  at_quota_exactly:
    formula: (u1==q1)+(u2==q2)+(u3==q3)+(u4==q4)
    literals: []
v6:
  entities:
  - id: wn
    question: users over quota including exactly-at (count)
    answer: 2
  - id: lk
    question: is anyone locked tonight (1 if any grace lapsed, else 0)
    answer: 0
  - id: ge
    question: over-quota users whose grace has lapsed
    answer: 6
  - id: ax
    question: users sitting exactly at quota (count)
    answer: 1
  aggregate: '{''warned'': int(a(''wn'')), ''locked'': int(a(''lk'')), ''grace_expired_users'': int(a(''ge'')), ''at_quota_exactly'': int(a(''ax''))}'
