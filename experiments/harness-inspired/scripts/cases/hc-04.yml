auxiliary: all facts needed are in the prompt itself
provenance: 'budget_burned=59 budget_left=-29 longest_wait=8

  archetype=backoff_budget variant=0 seed=3'
success_criteria:
  deterministic_checks:
    json_exact: '{"budget_burned": 59, "budget_left": -29, "jobs_count": 2, "longest_wait": 8}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each retry waits double the previous wait, starting at 2 minutes, no single wait exceeds the 8 minute cap
  - the shared retry budget is 30 minutes across all jobs, waits and run time both count against it
  - a job that exhausts its declared failures stops, it does not borrow budget from tomorrow
  facts:
  - j1 failed 4 times with each run taking 2 minutes, j2 failed 3 times with each run taking 5 minutes
  output_spec:
    budget_burned: int
    budget_left: int
    jobs_count: int
    longest_wait: int
contract:
  budget_burned:
    formula: B
    literals:
    - name: B
      regex: ''
      value: 59
  budget_left:
    formula: T - budget_burned
    literals:
    - name: T
      regex: shared retry budget is (\d+) minutes
      value: 30
  jobs_count:
    formula: '2'
    literals: []
  longest_wait:
    formula: min(C, cap)
    literals:
    - name: C
      regex: ''
      value: 8
v6:
  entities:
  - id: burned
    question: total budget minutes burned tonight (waits plus run time, all jobs)
    answer: 59
  - id: left
    question: budget minutes remaining after tonight (budget minus burned)
    answer: -29
  - id: njobs
    question: how many jobs ran through the retry engine tonight
    answer: 2
  - id: maxwait
    question: longest single capped wait any job sat through (minutes)
    answer: 8
  aggregate: '{''budget_burned'': int(a(''burned'')), ''budget_left'': int(a(''left'')), ''jobs_count'': int(a(''njobs'')), ''longest_wait'': int(a(''maxwait''))}'
