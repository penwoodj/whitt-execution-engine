  archetype=restock_waves variant=1 seed=31'
success_criteria:
  deterministic_checks:
    json_exact: '{"reordered": 2, "quarantined_lines": 2, "damaged_units": 13, "healthy_lines": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - damaged units leave stock before any reorder math runs, damage first, thresholds second
  - a line at or below its reorder point orders more, at-or-below means exactly equal counts too
  - any line with damage above zero quarantines that line's damaged units, the rest of the line stays sellable
  facts:
  - s-1 shows 90 on hand, reorder point 60, damage 10, s-2 shows 45 on hand, reorder point 50, damage 3, s-3 shows 20 on hand, reorder point 55, damage 0
  output_spec:
    reordered: int
    quarantined_lines: int
    damaged_units: int
    healthy_lines: int
contract:
  damaged_units:
    formula: d1+d2+d3
    literals: []
  quarantined_lines:
    formula: (d1>0)+(d2>0)+(d3>0)
    literals: []
v6:
  entities:
  - id: ro
    question: lines that reorder tonight (effective stock at or below reorder point)
    answer: 2
  - id: ql
    question: lines with a quarantine event (damage above zero)
    answer: 2
  - id: du
    question: total damaged units across all lines
    answer: 13
  - id: hl
    question: lines with zero damage (healthy lines)
    answer: 1
  aggregate: '{''reordered'': int(a(''ro'')), ''quarantined_lines'': int(a(''ql'')), ''damaged_units'': int(a(''du'')), ''healthy_lines'': int(a(''hl''))}'
