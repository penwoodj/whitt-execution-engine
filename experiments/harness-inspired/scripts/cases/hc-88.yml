domain: cron overlap policy
objective: derive executed, lock_violators, jobs_total, longest_run from the stated rules
prompt: 'assignment: the sweep ledger, swing rotation, the rules came down from compliance last quarter, exactly-once means exactly-once, no charity.


  the cron rack had a noisy night, mirror-30m fires every 30 minutes, runs 26 minutes, and overran 4 times tonight, export fires every 720 minutes, runs 8 minutes, and overran 1 times tonight. count firings
  as executed whether they lived or died, the lock line decides who dies, the schedule decides nothing else.


  the kill-at-lock rule replaced the old wait-forever rule after a nine-hour vacuum ate a monday, dead runs still count as firings, that clause is deliberate and it is in the rules.


  the scheduler ui you do not manage shades overlapping rectangles for prettiness, the shading algorithm lies about boundaries, trust the numbers above.


  the rules of the desk, as they stand tonight: 1. a run holds the lock for its duration or 15 minutes, whichever is shorter, longer runs get killed at the lock line. 2. a killed run counts as executed
  but failed, it still blocks nothing after death. 3. the next firing of a killed job proceeds on schedule, backpressure does not exist here.


  the facts of record: mirror-30m fires every 30 minutes, runs 26 minutes, and overran 4 times tonight, export fires every 720 minutes, runs 8 minutes, and overran 1 times tonight.


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


