prompt: 'the quota desk, weekend, your name on the log, every number you commit is audited against these rules, exactly-once means exactly-once, no charity.


  the fuel desk closes the ledger at midnight, d-1 burned 40 liters against a 60 liter cap, d-2 burned 75 liters against a 60 liter cap with a pre-filed exception, d-3 burned 60 liters against a 60 liter
  cap. flag at-or-over first, then split flagged cards by exception, the lists write themselves once the flagging is honest.


  exactly-at counting as flagged was a policy fight the auditors won, the boundary belongs to the flagged side, same as every other boundary at this desk.


  the telematics feed you do not manage estimates burn per trip, estimates settle nothing, the pump numbers are the facts.


  the rules of the desk, as they stand tonight: 1. spending at or over the daily cap flags the card, exactly-at is flagged same as over. 2. a flagged card with a pre-filed route exception goes to the approved
  pile, everything else blocks until a human calls in. 3. blocked tonight does not mean fired, it means the morning list, count them anyway.


  the facts of record: d-1 burned 40 liters against a 60 liter cap, d-2 burned 75 liters against a 60 liter cap with a pre-filed exception, d-3 burned 60 liters against a 60 liter cap.


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


