auxiliary: all facts needed are in the prompt itself
provenance: 'executed=3 lock_violators=0 longest=20

  archetype=cron_lock variant=0 seed=12'
success_criteria:
  deterministic_checks:
    json_exact: '{"executed": 3, "lock_violators": 0, "jobs_total": 2, "longest_run": 20}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a run holds the lock for its duration or 45 minutes, whichever is shorter, longer runs get killed at the lock line
  - a killed run counts as executed but failed, it still blocks nothing after death
  - the next firing of a killed job proceeds on schedule, backpressure does not exist here
  facts:
  - etl-hourly fires every 60 minutes, runs 20 minutes, and overran 3 times tonight, report-daily fires every 1440 minutes, runs 5 minutes, and overran 0 times tonight
  output_spec:
    executed: int
    lock_violators: int
    jobs_total: int
    longest_run: int
contract:
  executed:
    formula: o1+o2
    literals: []
  lock_violators:
    formula: (d1>L)+(d2>L)
    literals:
    - name: L
      regex: or (\d+) minutes, whichever is shorter
      value: 45
v6:
  entities:
  - id: ex
    question: total runs executed tonight (firings, killed included)
    answer: 3
  - id: lv
    question: jobs whose runtime exceeds the lock line (count)
    answer: 0
  - id: jt
    question: distinct jobs on the rack tonight
    answer: 2
  - id: lr
    question: longest single runtime among the jobs (minutes)
    answer: 20
  aggregate: '{''executed'': int(a(''ex'')), ''lock_violators'': int(a(''lv'')), ''jobs_total'': int(a(''jt'')), ''longest_run'': int(a(''lr''))}'
