  the specimen router decides the morning courier manifest, b1 rides the cold band, logged 0 excursions, paperwork complete, b2 rides the cold band, logged 2 excursions, paperwork complete, b3 rides the
  room band, logged 4 excursions, paperwork incomplete, b4 rides the frozen band, logged 1 excursions, paperwork incomplete. paperwork first, excursions second, band last as a label only. holds wait for
  a clinician, rejects go back to the floor, ships make the truck.


  the at-the-limit-ships clause matters, exactly at limit is compliant, over limit holds, the boundary rule reads the same as every boundary at this desk.


  the courier portal you do not manage reprints manifests with its own hold column, the portal column is a guess, this sheet is the manifest.


  the rules of the desk, as they stand tonight: 1. a sample with more than 1 temperature excursions holds for review, excursion means minutes outside band, at the limit ships. 2. incomplete paperwork rejects
  outright, rejection happens before any excursion math. 3. band labels travel with the sample but gate nothing tonight.


  the facts of record: b1 rides the cold band, logged 0 excursions, paperwork complete, b2 rides the cold band, logged 2 excursions, paperwork complete, b3 rides the room band, logged 4 excursions, paperwork
  incomplete, b4 rides the frozen band, logged 1 excursions, paperwork incomplete.


