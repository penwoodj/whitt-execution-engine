prompt: 'you inherited the deploy lane three weeks ago, the runbook has been rewritten twice since then, this is the current version, a thing only counts once, no matter how many lists it appears on.


  the retention sweeper runs while the floor is quiet, the access class scanned 400 records with a retention of 30 days, the debug class scanned 900 records with a retention of 14 days, the audit class
  scanned 250 records with a retention of 365 days, 2 classes carry an open legal hold tonight. hold skips a class whole, no partial purges, no mercy purges. records older than retention go, the rest stay,
  and the morning report wants three numbers, not opinions.


  legal holds arrived after an audit where a class got purged mid-investigation, the fix was class-level granularity, crude but airtight.


  the archive tier you do not manage keeps its own copies with its own clock, archive copies do not resurrect purged records and do not count.


  the rules of the desk, as they stand tonight: 1. each class purges records older than its own retention days, no exceptions inside a class. 2. classes with an open legal hold skip the purge entirely tonight,
  hold means all-or-nothing per class. 3. the purge counts records deleted, not records scanned, scanning is free and counts for nothing.


  the facts of record: the access class scanned 400 records with a retention of 30 days, the debug class scanned 900 records with a retention of 14 days, the audit class scanned 250 records with a retention
  of 365 days 2 classes carry an open legal hold tonight.


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


