provenance: 'classes_purged=1 held=2 records_deleted=1256

  archetype=retention_purge variant=0 seed=8'
success_criteria:
  deterministic_checks:
    json_exact: '{"classes_purged": 1, "classes_held": 2, "records_deleted": 1256, "classes_total": 3}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each class purges records older than its own retention days, no exceptions inside a class
  - classes with an open legal hold skip the purge entirely tonight, hold means all-or-nothing per class
  - the purge counts records deleted, not records scanned, scanning is free and counts for nothing
  facts:
  - the access class scanned 400 records with a retention of 30 days, the debug class scanned 900 records with a retention of 14 days, the audit class scanned 250 records with a retention of 365 days
  - 2 classes carry an open legal hold tonight
  output_spec:
    classes_purged: int
    classes_held: int
    records_deleted: int
    classes_total: int
contract:
  classes_purged:
    formula: 3 - H
    literals:
    - name: H
      regex: (\d+) classes carry an open legal hold
      value: 2
  records_deleted:
    formula: R
    literals:
    - name: R
      regex: ''
      value: 1256
v6:
  entities:
  - id: cp
    question: classes purged tonight (total minus held)
    answer: 1
  - id: ch
    question: classes under legal hold (skipped entirely)
    answer: 2
  - id: rd
    question: records deleted tonight (sum of beyond-retention records in purged classes)
    answer: 1256
  - id: ct
    question: total classes in the sweep
    answer: 3
  aggregate: '{''classes_purged'': int(a(''cp'')), ''classes_held'': int(a(''ch'')), ''records_deleted'': int(a(''rd'')), ''classes_total'': int(a(''ct''))}'
