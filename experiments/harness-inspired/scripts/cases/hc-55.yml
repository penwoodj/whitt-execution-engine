case_id: hc-55
category: natural-ops
difficulty: light
hops: 4
archetype: cache_sweep
variant: 2
domain: cache invalidation sweeps
objective: derive touched, evicted, retained, dupes_folded from the stated rules
prompt: 'you are the dispatch supervisor for the seating sheet, the standing orders live in the runbook you helped write last spring, partial work counts as nothing at the cutoff.


  the sweep ledger closes tonight, the l1 class holds 80 entries against a ceiling of 60, the l2 class holds 130 entries against a ceiling of 120, the l3 class holds 200 entries against a ceiling of 90,
  20 entries turned out to be duplicates folded away before counting, 8 entries are pinned across all classes. fold dupes first, then apply ceilings class by class, pinned rides through untouched. the retained
  number people quote in the morning is what is left, not what started.


  the dupe rule was a hard lesson, two crawlers wrote the same keys for a month and every report doubled. fold first, always fold first, then the ceilings mean something.


  the pin list belongs to the platform team, entries land on it for reasons the sweep does not audit, pins are facts here, not decisions.


  the rules of the desk, as they stand tonight: 1. each class carries its own retention ceiling, entries beyond the ceiling are eviction candidates, nothing else is. 2. duplicated entries fold into one
  before any counting, a dupe never counts twice anywhere. 3. pinned entries survive every sweep, they are counted in retained, never in evicted.


  the facts of record: the l1 class holds 80 entries against a ceiling of 60, the l2 class holds 130 entries against a ceiling of 120, the l3 class holds 200 entries against a ceiling of 90 20 entries turned
  out to be duplicates folded away before counting 8 entries are pinned across all classes.


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


