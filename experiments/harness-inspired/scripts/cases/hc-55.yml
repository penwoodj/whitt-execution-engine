auxiliary: all facts needed are in the prompt itself
provenance: 'touched=410 evicted=140 retained=250 dupes=20

  archetype=cache_sweep variant=2 seed=54'
success_criteria:
  deterministic_checks:
    json_exact: '{"touched": 410, "evicted": 140, "retained": 250, "dupes_folded": 20}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each class carries its own retention ceiling, entries beyond the ceiling are eviction candidates, nothing else is
  - duplicated entries fold into one before any counting, a dupe never counts twice anywhere
  - pinned entries survive every sweep, they are counted in retained, never in evicted
  facts:
  - the l1 class holds 80 entries against a ceiling of 60, the l2 class holds 130 entries against a ceiling of 120, the l3 class holds 200 entries against a ceiling of 90
  - 20 entries turned out to be duplicates folded away before counting
  - 8 entries are pinned across all classes
  output_spec:
    touched: int
    evicted: int
    retained: int
    dupes_folded: int
contract:
  touched:
    formula: h1+h2+h3
    literals: []
  evicted:
    formula: max(h1-c1,0)+max(h2-c2,0)+max(h3-c3,0)
    literals: []
  retained:
    formula: touched - evicted - D
    literals:
    - name: D
      regex: (\d+) entries turned out to be duplicates
      value: 20
  dupes_folded:
    formula: D
    literals: []
v6:
  entities:
  - id: t
    question: entries touched by the sweep (raw, before folding)
    answer: 410
  - id: e
    question: entries evicted (beyond-ceiling totals per class, summed)
    answer: 140
  - id: r
    question: entries retained (touched minus evicted minus folded dupes)
    answer: 250
  - id: d
    question: duplicate entries folded away before counting
    answer: 20
  aggregate: '{''touched'': int(a(''t'')), ''evicted'': int(a(''e'')), ''retained'': int(a(''r'')), ''dupes_folded'': int(a(''d''))}'
