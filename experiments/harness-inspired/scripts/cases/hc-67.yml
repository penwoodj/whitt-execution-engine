auxiliary: all facts needed are in the prompt itself
provenance: 'net_abandoned=12 restored=8 merged=3 converted=45

  archetype=cart_audit variant=2 seed=66'
success_criteria:
  deterministic_checks:
    json_exact: '{"net_abandoned": 12, "restored": 8, "merged": 3, "converted": 45}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a restored cart leaves the abandoned count, restore is a rescue, not a re-abandon
  - merged carts collapse two sessions into one before any ratio math, merge is a fact, not a loss
  - conversion counts checkouts from live carts only, restored carts that converted count in both restored and converted
  facts:
  - 120 sessions opened carts tonight
  - 20 carts were abandoned, 8 of those were later restored
  - 3 pairs of carts merged into single carts
  - 45 carts converted to checkouts
  output_spec:
    net_abandoned: int
    restored: int
    merged: int
    converted: int
contract:
  net_abandoned:
    formula: A - R
    literals:
    - name: A
      regex: (\d+) carts were abandoned
      value: 20
    - name: R
      regex: of those were later restored
      value: 0
v6:
  entities:
  - id: na
    question: net abandoned carts (abandoned minus restored)
    answer: 12
  - id: rs
    question: carts restored after abandonment
    answer: 8
  - id: mg
    question: cart merge operations tonight
    answer: 3
  - id: cv
    question: carts converted to checkouts
    answer: 45
  aggregate: '{''net_abandoned'': int(a(''na'')), ''restored'': int(a(''rs'')), ''merged'': int(a(''mg'')), ''converted'': int(a(''cv''))}'
