domain: e-commerce cart audits
objective: derive net_abandoned, restored, merged, converted from the stated rules
prompt: 'you are standing in as dispatch supervisor, the seating sheet does not care who you are, only that the rules hold, when a rule sends work back, the second pass follows the same rules.


  the cart auditor reconciles the night, 120 sessions opened carts tonight, 20 carts were abandoned, 8 of those were later restored, 3 pairs of carts merged into single carts, 45 carts converted to checkouts.
  abandoned minus restored is the net the morning meeting argues about, merged carts are a count of merges not of losses, converted stands alone as the money line.


  restore-then-convert double counting was once called a bug, it is not, it is the two ledgers doing their jobs, restored tracks rescues, converted tracks revenue, one cart can honestly appear in both.


  the remarketing pixel you do not manage also fires restore emails, pixel attributions do not enter these ledgers.


  the rules of the desk, as they stand tonight: 1. a restored cart leaves the abandoned count, restore is a rescue, not a re-abandon. 2. merged carts collapse two sessions into one before any ratio math,
  merge is a fact, not a loss. 3. conversion counts checkouts from live carts only, restored carts that converted count in both restored and converted.


  the facts of record: 120 sessions opened carts tonight 20 carts were abandoned, 8 of those were later restored 3 pairs of carts merged into single carts 45 carts converted to checkouts.


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


