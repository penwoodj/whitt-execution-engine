auxiliary: all facts needed are in the prompt itself
provenance: 'dlq=78 poison=8 recovered=70 unrecovered=8

  archetype=dlq_redrive variant=2 seed=63'
success_criteria:
  deterministic_checks:
    json_exact: '{"dlq_total": 78, "poison_dead": 8, "recovered": 70, "unrecovered": 8}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a message that failed 4 or more delivery attempts is poison, poison never redrives
  - redrive replays everything else once, a fixed fraction comes back healthy tonight, the rest return to the queue
  - poison counting is per topic but the poison threshold is global
  facts:
  - the signups shelf holds 30 messages this morning, the emails shelf holds 48 messages this morning
  - the poison threshold is 4 failed attempts
  - redrive recovers 100 percent of non-poison messages tonight
  output_spec:
    dlq_total: int
    poison_dead: int
    recovered: int
    unrecovered: int
contract:
  dlq_total:
    formula: c1+c2
    literals: []
  poison_dead:
    formula: 2*P
    literals:
    - name: P
      regex: poison threshold is (\d+)
      value: 4
  recovered:
    formula: int((dlq_total - poison_dead) * F)
    literals:
    - name: F
      regex: redrive recovers (\d+) percent
      value: 100.0
v6:
  entities:
  - id: dt
    question: messages on the dead-letter shelf in total (all topics)
    answer: 78
  - id: pd
    question: poison messages quarantined permanently (threshold x topics)
    answer: 8
  - id: rc
    question: messages recovered by the redrive ride
    answer: 70
  - id: ur
    question: messages still unresolved after the redrive
    answer: 8
  aggregate: '{''dlq_total'': int(a(''dt'')), ''poison_dead'': int(a(''pd'')), ''recovered'': int(a(''rc'')), ''unrecovered'': int(a(''ur''))}'
