prompt: 'the the sweep ledger desk is yours, the binder is old but the rules inside it are current and enforced, state at the cutoff is what you report, history is context only.


  the dead-letter shelf gets swept at dawn, the signups shelf holds 30 messages this morning, the emails shelf holds 48 messages this morning, the poison threshold is 4 failed attempts, redrive recovers
  100 percent of non-poison messages tonight. poison is quarantined first and never moves again, the rest take one redrive ride, whatever survives the ride counts as recovered, whatever does not goes back
  on the shelf.


  the fraction is honest tonight, the queue crew measured it last week, on bad nights it lies, tonight it does not.


  the shadow consumer you do not manage re-reads the shelf for its own metrics, shadow reads neither recover nor poison anything.


  the rules of the desk, as they stand tonight: 1. a message that failed 4 or more delivery attempts is poison, poison never redrives. 2. redrive replays everything else once, a fixed fraction comes back
  healthy tonight, the rest return to the queue. 3. poison counting is per topic but the poison threshold is global.


  the facts of record: the signups shelf holds 30 messages this morning, the emails shelf holds 48 messages this morning the poison threshold is 4 failed attempts redrive recovers 100 percent of non-poison
  messages tonight.


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


