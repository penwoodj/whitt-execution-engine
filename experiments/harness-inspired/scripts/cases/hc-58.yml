objective: derive raw_inbound, unique_tickets, merged_away, sev3 from the stated rules
prompt: 'the traffic warden badge is yours tonight, the quota desk answers to you and to nobody else on the floor, exactly-once means exactly-once, no charity.


  the triage board took fire tonight, the form channel delivered 8 reports, the form-b channel delivered 5 reports, the irc channel delivered 7 reports, 4 reports matched existing tickets and merged away.
  raw inbound first, dedupe second, severity last, in that order, always in that order. the unique count is what survives to the severity table.


  merging used to happen after severity assignment and the sev1 numbers were pure fiction, the fix was ordering, the ordering is the whole rule.


  the channel analytics pane you do not manage also displays a unique figure computed with a different dedupe window, that pane is decoration.


  the rules of the desk, as they stand tonight: 1. duplicate reports merge into the original before severity counting, a merged dupe carries no severity of its own. 2. every inbound report counts toward
  raw inbound exactly once, regardless of later merging. 3. sev3 is the remainder after sev1 and sev2 are counted on unique tickets.


  the facts of record: the form channel delivered 8 reports, the form-b channel delivered 5 reports, the irc channel delivered 7 reports 4 reports matched existing tickets and merged away on the unique
  tickets, 2 came in sev1 and 9 came in sev2.


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


