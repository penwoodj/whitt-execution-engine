provenance: 'classes_purged=2 held=1 records_deleted=1340

  archetype=retention_purge variant=1 seed=33'
success_criteria:
  deterministic_checks:
    json_exact: '{"classes_purged": 2, "classes_held": 1, "records_deleted": 1340, "classes_total": 3}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each class purges records older than its own retention days, no exceptions inside a class
  - classes with an open legal hold skip the purge entirely tonight, hold means all-or-nothing per class
  - the purge counts records deleted, not records scanned, scanning is free and counts for nothing
  facts:
  - the req class scanned 620 records with a retention of 60 days, the resp class scanned 810 records with a retention of 30 days, the sec class scanned 140 records with a retention of 730 days
  - 1 classes carry an open legal hold tonight
  output_spec:
    classes_purged: int
    classes_held: int
    records_deleted: int
    classes_total: int
contract:
  classes_purged:
    formula: 3 - H
    literals:
    - name: H
      regex: (\d+) classes carry an open legal hold
      value: 1
  records_deleted:
    formula: R
    literals:
    - name: R
      regex: ''
      value: 1340
v6:
  entities:
  - id: cp
    question: classes purged tonight (total minus held)
    answer: 2
  - id: ch
    question: classes under legal hold (skipped entirely)
    answer: 1
  - id: rd
    question: records deleted tonight (sum of beyond-retention records in purged classes)
    answer: 1340
  - id: ct
    question: total classes in the sweep
    answer: 3
  aggregate: '{''classes_purged'': int(a(''cp'')), ''classes_held'': int(a(''ch'')), ''records_deleted'': int(a(''rd'')), ''classes_total'': int(a(''ct''))}'
