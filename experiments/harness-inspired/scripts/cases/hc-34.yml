prompt: 'assignment: the quota desk, weekend rotation, the rules came down from compliance last quarter, state at the cutoff is what you report, history is context only.


  the retention sweeper runs while the floor is quiet, the req class scanned 620 records with a retention of 60 days, the resp class scanned 810 records with a retention of 30 days, the sec class scanned
  140 records with a retention of 730 days, 1 classes carry an open legal hold tonight. hold skips a class whole, no partial purges, no mercy purges. records older than retention go, the rest stay, and
  the morning report wants three numbers, not opinions.


  legal holds arrived after an audit where a class got purged mid-investigation, the fix was class-level granularity, crude but airtight.


  the archive tier you do not manage keeps its own copies with its own clock, archive copies do not resurrect purged records and do not count.


  the rules of the desk, as they stand tonight: 1. each class purges records older than its own retention days, no exceptions inside a class. 2. classes with an open legal hold skip the purge entirely tonight,
  hold means all-or-nothing per class. 3. the purge counts records deleted, not records scanned, scanning is free and counts for nothing.


  the facts of record: the req class scanned 620 records with a retention of 60 days, the resp class scanned 810 records with a retention of 30 days, the sec class scanned 140 records with a retention of
  730 days 1 classes carry an open legal hold tonight.


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


