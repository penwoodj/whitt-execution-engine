prompt: 'tonight you are the dispatch supervisor, the deploy lane has rules with teeth, they were written after the march incident, count what landed, not what tried.


  the triage board took fire tonight, the chat channel delivered 22 reports, the email channel delivered 11 reports, the walkup channel delivered 4 reports, 12 reports matched existing tickets and merged
  away. raw inbound first, dedupe second, severity last, in that order, always in that order. the unique count is what survives to the severity table.


  merging used to happen after severity assignment and the sev1 numbers were pure fiction, the fix was ordering, the ordering is the whole rule.


  the channel analytics pane you do not manage also displays a unique figure computed with a different dedupe window, that pane is decoration.


  the rules of the desk, as they stand tonight: 1. duplicate reports merge into the original before severity counting, a merged dupe carries no severity of its own. 2. every inbound report counts toward
  raw inbound exactly once, regardless of later merging. 3. sev3 is the remainder after sev1 and sev2 are counted on unique tickets.


  the facts of record: the chat channel delivered 22 reports, the email channel delivered 11 reports, the walkup channel delivered 4 reports 12 reports matched existing tickets and merged away on the unique
  tickets, 5 came in sev1 and 13 came in sev2.


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


