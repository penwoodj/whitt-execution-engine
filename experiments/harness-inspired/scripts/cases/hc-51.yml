auxiliary: all facts needed are in the prompt itself
provenance: 'processed = sum of min(arrival, cap) = 15 + 15 + 11 = 41

  deferred = sum of (arrival - cap where positive) = 3 + 14 + 0 = 17

  queues_over_cap = queues with arrival > cap = 2

  cutoff_hit = processed 41 >= nightly cutoff 45 is False

  archetype=queue_cutoff variant=2 seed=50'
success_criteria:
  deterministic_checks:
    json_exact: '{"processed": 41, "deferred": 17, "queues_over_cap": 2, "cutoff_hit": false}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped
  - the nightly cutoff is 45 processed items across all queues combined, reaching it stops everything after
  - deferred means arrived but not processed, arrived items sitting in a capped-out queue are deferred
  facts:
  - r1 holds 18 items against a cap of 15, r2 holds 29 items against a cap of 15, r3 holds 11 items against a cap of 15
  - 'queue r1: 18 arrived, cap 15, so 15 processed and 3 deferred'
  - 'queue r2: 29 arrived, cap 15, so 15 processed and 14 deferred'
  - 'queue r3: 11 arrived, cap 15, so 11 processed and 0 deferred'
  output_spec:
    processed: int
    deferred: int
    queues_over_cap: int
    cutoff_hit: bool
contract:
  processed:
    formula: min(a1,c1)+min(a2,c2)+min(a3,c3)
    literals:
    - name: a1
      regex: alpha holds (\d+) items
      value: 18
    - name: c1
      regex: alpha holds \d+ items against a cap of (\d+)
      value: 15
    - name: a2
      regex: bravo holds (\d+) items
      value: 29
    - name: c2
      regex: bravo holds \d+ items against a cap of (\d+)
      value: 15
    - name: a3
      regex: charlie holds (\d+) items
      value: 11
    - name: c3
      regex: charlie holds \d+ items against a cap of (\d+)
      value: 15
  deferred:
    formula: max(a1-c1,0)+max(a2-c2,0)+max(a3-c3,0)
    literals: []
  queues_over_cap:
    formula: (a1>c1)+(a2>c2)+(a3>c3)
    literals: []
  cutoff_hit:
    formula: processed >= K
    literals:
    - name: K
      regex: combined ceiling[ is]* (\d+)
      value: 45
v6:
  entities:
  - id: processed_total
    question: total items processed tonight across all queues (sum of min(arrival, cap) per queue)
    answer: 41
  - id: deferred_total
    question: total items deferred tonight (arrival minus cap where positive, summed)
    answer: 17
  - id: over_cap_count
    question: how many queues exceeded their own cap (arrival strictly greater than cap)
    answer: 2
  - id: cutoff_flag
    question: did the combined processed count reach the nightly cutoff (true or false)
    answer: false
  aggregate: '{''processed'': int(a(''processed_total'')), ''deferred'': int(a(''deferred_total'')), ''queues_over_cap'': int(a(''over_cap_count'')), ''cutoff_hit'': bool(a(''cutoff_flag''))}'
