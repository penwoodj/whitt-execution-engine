case_id: hc-51
category: natural-ops
difficulty: light
hops: 3
archetype: queue_cutoff
variant: 2
domain: night queue processing
objective: derive processed, deferred, queues_over_cap, cutoff_hit from the stated rules
prompt: 'tonight you are the dispatch supervisor, the seating sheet has rules with teeth, they were written after the march incident, the cap is the cap, overages defer, they never drop silently.


  three queues feed one processor, each queue has its own nightly cap, r1 holds 18 items against a cap of 15, r2 holds 29 items against a cap of 15, r3 holds 11 items against a cap of 15. the processor
  drains them in the order listed, it never reorders, it never revisits a queue once capped out. the arithmetic that matters is small, min of arrival and cap per queue, summed, nothing fancier.


  the cutoff rule came later than the caps, it was bolted on after a night when the processor ran hot past dawn. 45 is the combined ceiling, if the summed processed count reaches it mid-queue the remaining
  arrivals defer with everything else. tonight the numbers sit where they sit, work the rules in the order they were given.


  the log convention: an item is processed when the processor finishes it, arrival alone is not processing. the overnight batcher replays yesterday''s overflow before yours, that replay is not in these
  counts, it belongs to the prior ledger.


  the rules of the desk, as they stand tonight: 1. each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped. 2. the nightly cutoff is 45 processed items across
  all queues combined, reaching it stops everything after. 3. deferred means arrived but not processed, arrived items sitting in a capped-out queue are deferred.


  the facts of record: r1 holds 18 items against a cap of 15, r2 holds 29 items against a cap of 15, r3 holds 11 items against a cap of 15 queue r1: 18 arrived, cap 15, so 15 processed and 3 deferred queue
  r2: 29 arrived, cap 15, so 15 processed and 14 deferred queue r3: 11 arrived, cap 15, so 11 processed and 0 deferred.


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


