prompt: 'the day crew handed you the sweep ledger with a shrug, the runbook is thinner than they admit, these rules bind, exactly-once means exactly-once, no charity.


  the triage board took fire tonight, the email channel delivered 14 reports, the portal channel delivered 9 reports, the phone channel delivered 6 reports, 7 reports matched existing tickets and merged
  away. raw inbound first, dedupe second, severity last, in that order, always in that order. the unique count is what survives to the severity table.


  merging used to happen after severity assignment and the sev1 numbers were pure fiction, the fix was ordering, the ordering is the whole rule.


  the channel analytics pane you do not manage also displays a unique figure computed with a different dedupe window, that pane is decoration.


  the rules of the desk, as they stand tonight: 1. duplicate reports merge into the original before severity counting, a merged dupe carries no severity of its own. 2. every inbound report counts toward
  raw inbound exactly once, regardless of later merging. 3. sev3 is the remainder after sev1 and sev2 are counted on unique tickets.


  the facts of record: the email channel delivered 14 reports, the portal channel delivered 9 reports, the phone channel delivered 6 reports 7 reports matched existing tickets and merged away on the unique
  tickets, 3 came in sev1 and 8 came in sev2.


