auxiliary: all facts needed are in the prompt itself
provenance: 'raw=29 unique=22 merged=7 sev3=11

  archetype=triage_merge variant=0 seed=7'
success_criteria:
  deterministic_checks:
    json_exact: '{"raw_inbound": 29, "unique_tickets": 22, "merged_away": 7, "sev3": 11}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - duplicate reports merge into the original before severity counting, a merged dupe carries no severity of its own
  - every inbound report counts toward raw inbound exactly once, regardless of later merging
  - sev3 is the remainder after sev1 and sev2 are counted on unique tickets
  facts:
  - the email channel delivered 14 reports, the portal channel delivered 9 reports, the phone channel delivered 6 reports
  - 7 reports matched existing tickets and merged away
  - on the unique tickets, 3 came in sev1 and 8 came in sev2
  output_spec:
    raw_inbound: int
    unique_tickets: int
    merged_away: int
    sev3: int
contract:
  raw_inbound:
    formula: c1+c2+c3
    literals: []
  unique_tickets:
    formula: raw_inbound - D
    literals:
    - name: D
      regex: (\d+) reports matched existing tickets
      value: 7
  sev3:
    formula: unique_tickets - S1 - S2
    literals:
    - name: S1
      regex: (\d+) came in sev1
      value: 3
    - name: S2
      regex: (\d+) came in sev2
      value: 8
v6:
  entities:
  - id: raw
    question: raw inbound reports tonight (all channels summed)
    answer: 29
  - id: uniq
    question: unique tickets after merging (raw minus merged dupes)
    answer: 22
  - id: mg
    question: reports merged away as duplicates
    answer: 7
  - id: s3
    question: unique tickets classified sev3 (remainder after sev1 and sev2)
    answer: 11
  aggregate: '{''raw_inbound'': int(a(''raw'')), ''unique_tickets'': int(a(''uniq'')), ''merged_away'': int(a(''mg'')), ''sev3'': int(a(''s3''))}'
