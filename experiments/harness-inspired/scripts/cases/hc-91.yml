auxiliary: all facts needed are in the prompt itself
provenance: 'window=600 used=635 free=-35 fit=False

  archetype=backup_window variant=3 seed=90'
success_criteria:
  deterministic_checks:
    json_exact: '{"window_minutes": 600, "minutes_used": 635, "minutes_free": -35, "fit": false}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - the backup window is 600 minutes, everything must start and finish inside it, no spill, no resume
  - incremental jobs are scheduled after the full, in the order listed, sizes are sizes, no compression magic
  - a window that does not fit defers the full to tomorrow, incrementals still run
  facts:
  - full-media takes 460 minutes and runs 1 times, incr-meta takes 35 minutes and runs 5 times
  output_spec:
    window_minutes: int
    minutes_used: int
    minutes_free: int
    fit: bool
contract:
  minutes_used:
    formula: d1*c1+d2*c2
    literals: []
  minutes_free:
    formula: W - minutes_used
    literals:
    - name: W
      regex: backup window is (\d+) minutes
      value: 600
  fit:
    formula: minutes_used <= W
    literals: []
v6:
  entities:
  - id: wm
    question: the backup window length in minutes
    answer: 600
  - id: mu
    question: minutes actually used (all jobs summed)
    answer: 635
  - id: mf
    question: minutes free after everything scheduled
    answer: -35
  - id: ft
    question: does everything fit inside the window (true or false)
    answer: false
  aggregate: '{''window_minutes'': int(a(''wm'')), ''minutes_used'': int(a(''mu'')), ''minutes_free'': int(a(''mf'')), ''fit'': bool(a(''ft''))}'
