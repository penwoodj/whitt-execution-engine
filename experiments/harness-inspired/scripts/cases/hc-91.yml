case_id: hc-91
category: natural-ops
difficulty: light
hops: 4
archetype: backup_window
variant: 3
domain: backup window scheduling
objective: derive window_minutes, minutes_used, minutes_free, fit from the stated rules
prompt: 'you are the dispatch supervisor for the seating sheet, the standing orders live in the runbook you helped write last spring, the cap is the cap, overages defer, they never drop silently.


  the backup window opens at two and closes when it closes, full-media takes 460 minutes and runs 1 times, incr-meta takes 35 minutes and runs 5 times. sum the minutes, compare to the window, the fit is
  boolean, there is no almost. leftover minutes are slack, slack is not a resource, it is a report line.


  the no-resume clause was written over a restore drill that found half a full and a whole lot of nothing, half a backup is a rumor, not a backup.


  the dedupe appliance you do not manage claims big savings on its own graphs, the window schedules raw minutes, raw is what runs.


  the rules of the desk, as they stand tonight: 1. the backup window is 600 minutes, everything must start and finish inside it, no spill, no resume. 2. incremental jobs are scheduled after the full, in
  the order listed, sizes are sizes, no compression magic. 3. a window that does not fit defers the full to tomorrow, incrementals still run.


  the facts of record: full-media takes 460 minutes and runs 1 times, incr-meta takes 35 minutes and runs 5 times.


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


