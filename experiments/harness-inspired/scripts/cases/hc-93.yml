provenance: 'blocked=0 approved=1 over=1 exactly_at=1

  archetype=fuel_cards variant=3 seed=92'
success_criteria:
  deterministic_checks:
    json_exact: '{"blocked": 0, "exception_approved": 1, "over_cap": 1, "at_cap_exactly": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - spending at or over the daily cap flags the card, exactly-at is flagged same as over
  - a flagged card with a pre-filed route exception goes to the approved pile, everything else blocks until a human calls in
  - blocked tonight does not mean fired, it means the morning list, count them anyway
  facts:
  - nine burned 140 liters against a 120 liter cap with a pre-filed exception, ten burned 119 liters against a 120 liter cap, eleven burned 120 liters against a 120 liter cap
  output_spec:
    blocked: int
    exception_approved: int
    over_cap: int
    at_cap_exactly: int
contract:
  at_cap_exactly:
    formula: (s1==c1)+(s2==c2)+(s3==c3)
    literals: []
v6:
  entities:
  - id: bl
    question: cards blocked tonight (flagged, no exception)
    answer: 0
  - id: ap
    question: flagged cards cleared by pre-filed exception
    answer: 1
  - id: oc
    question: cards over cap (strictly over, count)
    answer: 1
  - id: ax
    question: cards sitting exactly at cap (count)
    answer: 1
  aggregate: '{''blocked'': int(a(''bl'')), ''exception_approved'': int(a(''ap'')), ''over_cap'': int(a(''oc'')), ''at_cap_exactly'': int(a(''ax''))}'
