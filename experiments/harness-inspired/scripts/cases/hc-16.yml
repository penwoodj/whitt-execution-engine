auxiliary: all facts needed are in the prompt itself
provenance: 'window=420 used=480 free=-60 fit=False

  archetype=backup_window variant=0 seed=15'
success_criteria:
  deterministic_checks:
    json_exact: '{"window_minutes": 420, "minutes_used": 480, "minutes_free": -60, "fit": false}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - the backup window is 420 minutes, everything must start and finish inside it, no spill, no resume
  - incremental jobs are scheduled after the full, in the order listed, sizes are sizes, no compression magic
  - a window that does not fit defers the full to tomorrow, incrementals still run
  facts:
  - full-db takes 380 minutes and runs 1 times, incr-logs takes 25 minutes and runs 4 times
  output_spec:
    window_minutes: int
    minutes_used: int
    minutes_free: int
    fit: bool
contract:
  minutes_used:
    formula: d1*c1+d2*c2
    literals: []
  minutes_free:
    formula: W - minutes_used
    literals:
    - name: W
      regex: backup window is (\d+) minutes
      value: 420
  fit:
    formula: minutes_used <= W
    literals: []
v6:
  entities:
  - id: wm
    question: the backup window length in minutes
    answer: 420
  - id: mu
    question: minutes actually used (all jobs summed)
    answer: 480
  - id: mf
    question: minutes free after everything scheduled
    answer: -60
  - id: ft
    question: does everything fit inside the window (true or false)
    answer: false
  aggregate: '{''window_minutes'': int(a(''wm'')), ''minutes_used'': int(a(''mu'')), ''minutes_free'': int(a(''mf'')), ''fit'': bool(a(''ft''))}'
