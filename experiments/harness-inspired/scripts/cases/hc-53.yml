auxiliary: all facts needed are in the prompt itself
provenance: 'shipped=2 rolled=2 slots_left=0 pending=1

  archetype=freeze_windows variant=2 seed=52'
success_criteria:
  deterministic_checks:
    json_exact: '{"shipped": 2, "rolled_back": 2, "slots_left": 0, "pending": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a deploy may start only before 21:15, work unfinished at 21:15 waits for tomorrow, partial work does not carry
  - a service showing an error rate at or above 0.5 percent must roll back before any new deploy of that service, rollbacks consume no slots
  - each new deploy consumes one of the 2 build slots held for the night, slots are never returned
  facts:
  - the clock reads 20:50
  - the freeze lands at 21:15
  - front shows 0.5 percent and its deploy takes 12 minutes, auth shows 0.9 percent and its deploy takes 10 minutes, sink shows 0.3 percent and its deploy takes 7 minutes
  output_spec:
    shipped: int
    rolled_back: int
    slots_left: int
    pending: int
contract:
  shipped:
    formula: S
    literals:
    - name: S
      regex: ''
      value: 2
  rolled_back:
    formula: R
    literals:
    - name: R
      regex: ''
      value: 2
  slots_left:
    formula: K - shipped
    literals:
    - name: K
      regex: (\d+) build slots held for the night
      value: 2
  pending:
    formula: 3 - shipped
    literals: []
v6:
  entities:
  - id: shipped_n
    question: services that finished deploying before the freeze (count)
    answer: 2
  - id: rolled_n
    question: services that required rollback before deploying (error rate at or above 0.5)
    answer: 2
  - id: slots_l
    question: build slots left after tonight's deploys (slots minus deploys consumed)
    answer: 0
  - id: pending_n
    question: services still pending tomorrow (not finished before freeze)
    answer: 1
  aggregate: '{''shipped'': int(a(''shipped_n'')), ''rolled_back'': int(a(''rolled_n'')), ''slots_left'': int(a(''slots_l'')), ''pending'': int(a(''pending_n''))}'
