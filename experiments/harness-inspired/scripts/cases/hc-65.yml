prompt: 'your watch over the deploy lane starts now, the rules stack on top of each other, work them in order, partial work counts as nothing at the cutoff.


  the cert cabinet gets its weekly review, a has 29 days left, b has 31 days left, c has 100 days left, d has 1 days left. the renew line is 30 days, below it means renew tonight, the expiring-soon band
