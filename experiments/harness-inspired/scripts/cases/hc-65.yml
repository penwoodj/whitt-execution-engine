provenance: 'renewed=2 expiring_soon=1 stable=1 line=30

  archetype=cert_renewal variant=2 seed=64'
success_criteria:
  deterministic_checks:
    json_exact: '{"renewed": 2, "expiring_soon": 1, "stable": 1, "renew_window": 30}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - any certificate with less than 30 days of validity left renews tonight, no exceptions, no appeals
  - certificates with 30 or more but under 90 days are flagged expiring-soon, flagged is not renewed
  - renewal stagger is automatic, count renewals, do not schedule them
  facts:
  - a has 29 days left, b has 31 days left, c has 100 days left, d has 1 days left
  output_spec:
    renewed: int
    expiring_soon: int
    stable: int
    renew_window: int
contract:
  renewed:
    formula: (d1<M)+(d2<M)+(d3<M)+(d4<M)
    literals:
    - name: M
      regex: less than (\d+) days of validity
      value: 30
  stable:
    formula: 4 - renewed - expiring_soon
    literals: []
v6:
  entities:
  - id: rn
    question: certificates renewed tonight (under the renew line)
    answer: 2
  - id: es
    question: certificates flagged expiring-soon (at renew line, under triple)
    answer: 1
  - id: st
    question: certificates stable (triple or beyond)
    answer: 1
  - id: rw
    question: the renew line in days
    answer: 30
  aggregate: '{''renewed'': int(a(''rn'')), ''expiring_soon'': int(a(''es'')), ''stable'': int(a(''st'')), ''renew_window'': int(a(''rw''))}'
