  the triple-day band exists because renewal takes a week of lead time in the worst case, band membership warns, it does not act.


  the external monitor you do not manage pages on 7-day emergencies, by the time it notices anything this desk has already acted or already failed, either way it is late.


  the rules of the desk, as they stand tonight: 1. any certificate with less than 30 days of validity left renews tonight, no exceptions, no appeals. 2. certificates with 30 or more but under 90 days are
  flagged expiring-soon, flagged is not renewed. 3. renewal stagger is automatic, count renewals, do not schedule them.


  the facts of record: a has 29 days left, b has 31 days left, c has 100 days left, d has 1 days left.


