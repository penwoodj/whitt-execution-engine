case_id: hc-73
category: natural-ops
difficulty: light
hops: 3
archetype: hold_shelf
variant: 2
domain: library hold shelves
objective: derive active_holds, expired_released, renewals_used, picked_up from the stated rules
prompt: 'you are the dispatch supervisor for the deploy lane, the standing orders live in the runbook you helped write last spring, count what landed, not what tried.


  the hold shelf audit runs weekly, 18 holds sat on the shelf this week, 2 expired and released, 6 renewals were used, 8 items were picked up. expired releases leave the active count first, renewals and
  pickups describe the survivors, the active number is holds minus released and nothing subtler.


  release-is-final was not always the rule, the grace week doubled the shelf and halved the pickups, final means final since.


  the catalog kiosk you do not manage displays holds in transit separately, in-transit items are not on this shelf and never were.


  the rules of the desk, as they stand tonight: 1. holds expire after seven days on the shelf, expired holds release the item back to circulation, release is final. 2. patrons may renew a hold up to 1 times,
  renewals reset nothing else. 3. pickup removes the hold entirely, picked-up items leave the ledger.


  the facts of record: 18 holds sat on the shelf this week 2 expired and released 6 renewals were used 8 items were picked up.


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


