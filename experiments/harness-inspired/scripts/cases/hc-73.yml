auxiliary: all facts needed are in the prompt itself
provenance: 'active=16 expired=2 renewals=6 picked=8

  archetype=hold_shelf variant=2 seed=72'
success_criteria:
  deterministic_checks:
    json_exact: '{"active_holds": 16, "expired_released": 2, "renewals_used": 6, "picked_up": 8}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - holds expire after seven days on the shelf, expired holds release the item back to circulation, release is final
  - patrons may renew a hold up to 1 times, renewals reset nothing else
  - pickup removes the hold entirely, picked-up items leave the ledger
  facts:
  - 18 holds sat on the shelf this week
  - 2 expired and released
  - 6 renewals were used
  - 8 items were picked up
  output_spec:
    active_holds: int
    expired_released: int
    renewals_used: int
    picked_up: int
contract:
  active_holds:
    formula: H - E
    literals:
    - name: H
      regex: (\d+) holds sat on the shelf
      value: 18
    - name: E
      regex: (\d+) expired and released
      value: 2
v6:
  entities:
  - id: ah
    question: active holds remaining (holds minus expired)
    answer: 16
  - id: er
    question: holds expired and released this week
    answer: 2
  - id: ru
    question: renewals used this week
    answer: 6
  - id: pu
    question: items picked up this week
    answer: 8
  aggregate: '{''active_holds'': int(a(''ah'')), ''expired_released'': int(a(''er'')), ''renewals_used'': int(a(''ru'')), ''picked_up'': int(a(''pu''))}'
