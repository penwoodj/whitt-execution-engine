domain: classroom seat allocation
objective: derive seated, bumped, waitlist_promoted, waitlist_left from the stated rules
prompt: 'tonight you are the dispatch supervisor, the deploy lane has rules with teeth, they were written after the march incident, a thing only counts once, no matter how many lists it appears on.


  the seating sheet finalizes an hour before doors, the core tier has 3 seats against 2 requests, the plus tier has 4 seats against 4 requests, the open tier has 25 seats against 20 requests, the waitlist
  holds 5 names, 1 ticketed seats went empty via no-shows. seat within tiers by priority, overflow bumps, empty seats stay empty until the waitlist pass, the waitlist takes whatever empties remain, one
  name per seat, no standing offers.


  the no-cascade clause protects tier pricing, the waitlist clause fills the room anyway when it can, the two rules disagree in spirit and both hold.


  the door scanner you do not manage counts entries in real time, entry counts are downstream of seating, not seating itself.


  the rules of the desk, as they stand tonight: 1. tiers fill in priority order, staff before vip before general, order is the whole rule. 2. unfilled seats in higher tiers never cascade down, a seat either
  fills in its tier or stays empty. 3. the waitlist promotes into empty seats anywhere after tier allocation, no-shows do not free seats tonight.


  the facts of record: the core tier has 3 seats against 2 requests, the plus tier has 4 seats against 4 requests, the open tier has 25 seats against 20 requests the waitlist holds 5 names, 1 ticketed seats
  went empty via no-shows.


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


