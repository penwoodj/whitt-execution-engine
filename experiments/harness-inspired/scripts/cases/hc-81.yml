auxiliary: all facts needed are in the prompt itself
provenance: 'released=4 held=0 net=12500 held_value=0

  archetype=payroll_holds variant=3 seed=80'
success_criteria:
  deterministic_checks:
    json_exact: '{"released_count": 4, "held_count": 0, "net_paid": 12500, "held_value": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rows over 3000 currency units hold for manual review unless the row carries an approved exception
  - held rows pay nothing tonight, they are not partial, they are not deferred pro-rated, they simply wait
  - the exception column is the only override, verbal approvals count for nothing at this desk
  facts:
  - row w1 pays 7700 units with an approved exception, row w2 pays 900 units, row w3 pays 1300 units, row w4 pays 2600 units with an approved exception
  output_spec:
    released_count: int
    held_count: int
    net_paid: int
    held_value: int
contract:
  net_paid:
    formula: sum of released rows
    literals:
    - name: sum
      regex: ''
      value: 12500
  held_count:
    formula: H
    literals:
    - name: H
      regex: ''
      value: 0
v6:
  entities:
  - id: rc
    question: rows released tonight (count, exceptions included)
    answer: 4
  - id: hc
    question: rows held for review (count)
    answer: 0
  - id: net
    question: net amount paid tonight (sum of released rows only)
    answer: 12500
  - id: hv
    question: total value sitting on hold (sum of held rows)
    answer: 0
  aggregate: '{''released_count'': int(a(''rc'')), ''held_count'': int(a(''hc'')), ''net_paid'': int(a(''net'')), ''held_value'': int(a(''hv''))}'
