prompt: 'you inherited the deploy lane three weeks ago, the runbook has been rewritten twice since then, this is the current version, the cap is the cap, overages defer, they never drop silently.


  the payroll batch runs tonight, row w1 pays 7700 units with an approved exception, row w2 pays 900 units, row w3 pays 1300 units, row w4 pays 2600 units with an approved exception. the threshold is 3000
  units, exceptions are pre-approved in writing or they do not exist. count rows, then sum money, in that order.


  the hold queue exists because of a december when a mistyped zero paid out eleven times the intended amount, since then everything over the line waits for a human. tonight that human already stamped what
  the exception column shows.


  the finance preview tool you do not manage shows a different net because it annualizes, annualized figures have no seat at this table.


  the rules of the desk, as they stand tonight: 1. rows over 3000 currency units hold for manual review unless the row carries an approved exception. 2. held rows pay nothing tonight, they are not partial,
  they are not deferred pro-rated, they simply wait. 3. the exception column is the only override, verbal approvals count for nothing at this desk.


  the facts of record: row w1 pays 7700 units with an approved exception, row w2 pays 900 units, row w3 pays 1300 units, row w4 pays 2600 units with an approved exception.


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


