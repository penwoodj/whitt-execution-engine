auxiliary: all facts needed are in the prompt itself
provenance: 'rings_passed=2 aborted=True users_exposed=8320 halt_ring=r2

  archetype=rollout_rings variant=2 seed=60'
success_criteria:
  deterministic_checks:
    json_exact: '{"rings_passed": 2, "aborted": true, "users_exposed": 8320, "halt_ring": "r2"}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rings promote in order, a ring only enters after the previous ring passes clean
  - a ring with 6 or more fire reports halts the rollout on the spot, halted means halted, no finish and see
  - users exposed counts every user in rings that entered, including the ring that triggered the halt
  facts:
  - r0 covers 20 users and logged 1 fire reports, r1 covers 300 users and logged 5 fire reports, r2 covers 8000 users and logged 8 fire reports
  - the abort threshold is 6 fire reports
  output_spec:
    rings_passed: int
    aborted: bool
    users_exposed: int
    halt_ring: str
contract:
  users_exposed:
    formula: U1+U2(+U3 if halt at ring3)
    literals:
    - name: U1
      regex: ''
      value: 20
v6:
  entities:
  - id: rp
    question: rings that passed clean (count)
    answer: 2
  - id: ab
    question: was the rollout halted by the abort threshold (true or false)
    answer: true
  - id: ux
    question: users exposed across all rings that entered
    answer: 8320
  - id: hr
    question: id of the ring that triggered the halt (empty string if none)
    answer: r2
  aggregate: '{''rings_passed'': int(a(''rp'')), ''aborted'': bool(a(''ab'')), ''users_exposed'': int(a(''ux'')), ''halt_ring'': str(a(''hr''))}'
