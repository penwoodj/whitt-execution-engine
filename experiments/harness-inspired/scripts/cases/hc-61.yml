case_id: hc-61
category: natural-ops
difficulty: light
hops: 4
archetype: rollout_rings
variant: 2
domain: feature flag rollout rings
objective: derive rings_passed, aborted, users_exposed, halt_ring from the stated rules
prompt: 'you hold the pager for the deploy lane until midnight, after that it goes to someone who trusts your counts, the cap is the cap, overages defer, they never drop silently.


  the rollout ladder climbed tonight, r0 covers 20 users and logged 1 fire reports, r1 covers 300 users and logged 5 fire reports, r2 covers 8000 users and logged 8 fire reports, the abort threshold is
  6 fire reports. walk the rings in order, stop at the first ring that hits the threshold, count users in every ring that entered including the one that died. rings after a halt never entered, their users
  were never exposed.


  the halt rule is blunt on purpose, the incident review found graduated response just meant slow response, blunt it is.


  the feedback pane you do not manage also collects star ratings per ring, stars are sentiment, fires are facts.


  the rules of the desk, as they stand tonight: 1. rings promote in order, a ring only enters after the previous ring passes clean. 2. a ring with 6 or more fire reports halts the rollout on the spot, halted
  means halted, no finish and see. 3. users exposed counts every user in rings that entered, including the ring that triggered the halt.


  the facts of record: r0 covers 20 users and logged 1 fire reports, r1 covers 300 users and logged 5 fire reports, r2 covers 8000 users and logged 8 fire reports the abort threshold is 6 fire reports.


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


