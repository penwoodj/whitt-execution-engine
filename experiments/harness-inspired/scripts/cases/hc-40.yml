auxiliary: all facts needed are in the prompt itself
provenance: 'renewed=1 expiring_soon=1 stable=2 line=14

  archetype=cert_renewal variant=1 seed=39'
success_criteria:
  deterministic_checks:
    json_exact: '{"renewed": 1, "expiring_soon": 1, "stable": 2, "renew_window": 14}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - any certificate with less than 14 days of validity left renews tonight, no exceptions, no appeals
  - certificates with 14 or more but under 42 days are flagged expiring-soon, flagged is not renewed
  - renewal stagger is automatic, count renewals, do not schedule them
  facts:
  - edge-wild has 5 days left, svc-mesh has 60 days left, db-tls has 25 days left, monitor has 90 days left
  output_spec:
    renewed: int
    expiring_soon: int
    stable: int
    renew_window: int
contract:
  renewed:
    formula: (d1<M)+(d2<M)+(d3<M)+(d4<M)
    literals:
    - name: M
      regex: less than (\d+) days of validity
      value: 14
  stable:
    formula: 4 - renewed - expiring_soon
    literals: []
v6:
  entities:
  - id: rn
    question: certificates renewed tonight (under the renew line)
    answer: 1
  - id: es
    question: certificates flagged expiring-soon (at renew line, under triple)
    answer: 1
  - id: st
    question: certificates stable (triple or beyond)
    answer: 2
  - id: rw
    question: the renew line in days
    answer: 14
  aggregate: '{''renewed'': int(a(''rn'')), ''expiring_soon'': int(a(''es'')), ''stable'': int(a(''st'')), ''renew_window'': int(a(''rw''))}'
