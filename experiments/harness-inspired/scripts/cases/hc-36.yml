auxiliary: all facts needed are in the prompt itself
provenance: 'rings_passed=1 aborted=True users_exposed=450 halt_ring=early

  archetype=rollout_rings variant=1 seed=35'
success_criteria:
  deterministic_checks:
    json_exact: '{"rings_passed": 1, "aborted": true, "users_exposed": 450, "halt_ring": "early"}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rings promote in order, a ring only enters after the previous ring passes clean
  - a ring with 5 or more fire reports halts the rollout on the spot, halted means halted, no finish and see
  - users exposed counts every user in rings that entered, including the ring that triggered the halt
  facts:
  - canary covers 50 users and logged 2 fire reports, early covers 400 users and logged 6 fire reports, broad covers 5000 users and logged 5 fire reports
  - the abort threshold is 5 fire reports
  output_spec:
    rings_passed: int
    aborted: bool
    users_exposed: int
    halt_ring: str
contract:
  users_exposed:
    formula: U1+U2(+U3 if halt at ring3)
    literals:
    - name: U1
      regex: ''
      value: 50
v6:
  entities:
  - id: rp
    question: rings that passed clean (count)
    answer: 1
  - id: ab
    question: was the rollout halted by the abort threshold (true or false)
    answer: true
  - id: ux
    question: users exposed across all rings that entered
    answer: 450
  - id: hr
    question: id of the ring that triggered the halt (empty string if none)
    answer: early
  aggregate: '{''rings_passed'': int(a(''rp'')), ''aborted'': bool(a(''ab'')), ''users_exposed'': int(a(''ux'')), ''halt_ring'': str(a(''hr''))}'
