prompt: 'the sweep ledger, night, your name on the log, every number you commit is audited against these rules, the rules stack, later rules do not cancel earlier ones.


  the rollout ladder climbed tonight, canary covers 50 users and logged 2 fire reports, early covers 400 users and logged 6 fire reports, broad covers 5000 users and logged 5 fire reports, the abort threshold
  is 5 fire reports. walk the rings in order, stop at the first ring that hits the threshold, count users in every ring that entered including the one that died. rings after a halt never entered, their
  users were never exposed.


  the halt rule is blunt on purpose, the incident review found graduated response just meant slow response, blunt it is.


  the feedback pane you do not manage also collects star ratings per ring, stars are sentiment, fires are facts.


  the rules of the desk, as they stand tonight: 1. rings promote in order, a ring only enters after the previous ring passes clean. 2. a ring with 5 or more fire reports halts the rollout on the spot, halted
  means halted, no finish and see. 3. users exposed counts every user in rings that entered, including the ring that triggered the halt.


  the facts of record: canary covers 50 users and logged 2 fire reports, early covers 400 users and logged 6 fire reports, broad covers 5000 users and logged 5 fire reports the abort threshold is 5 fire
  reports.


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


