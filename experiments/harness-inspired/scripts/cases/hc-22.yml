auxiliary: all facts needed are in the prompt itself
provenance: 'standby_confirmed=5 left=1 refunded=4 noshows=3

  archetype=gym_standby variant=0 seed=21'
success_criteria:
  deterministic_checks:
    json_exact: '{"standby_confirmed": 5, "standby_left": 1, "credits_refunded": 4, "no_shows": 3}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - no-show bookings free their spots at start time, freed spots go to standby in queue order
  - standby beyond freed spots does not get in, no floor mats, no standing, capacity is capacity
  - class credits held by no-shows refund automatically at the one-hour mark
  facts:
  - the class caps at 20, 18 booked, 3 of those no-showed
  - 6 names sat on the standby queue
  - 4 credits are pending automatic refund
  output_spec:
    standby_confirmed: int
    standby_left: int
    credits_refunded: int
    no_shows: int
contract:
  standby_confirmed:
    formula: min(Q, max(cap - booked + ns, 0))
    literals:
    - name: cap
      regex: class caps at (\d+)
      value: 20
    - name: booked
      regex: (\d+) booked
      value: 18
    - name: ns
      regex: of those no-showed
      value: 3
    - name: Q
      regex: (\d+) names sat on the standby
      value: 6
v6:
  entities:
  - id: sc
    question: standby names confirmed into freed spots
    answer: 5
  - id: sl
    question: standby names left unconfirmed
    answer: 1
  - id: cr
    question: credits refunded automatically
    answer: 4
  - id: ns
    question: booked members who no-showed
    answer: 3
  aggregate: '{''standby_confirmed'': int(a(''sc'')), ''standby_left'': int(a(''sl'')), ''credits_refunded'': int(a(''cr'')), ''no_shows'': int(a(''ns''))}'
