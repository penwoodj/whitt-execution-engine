auxiliary: all facts needed are in the prompt itself
provenance: 'processed = sum of min(arrival, cap) = 40 + 33 + 40 = 113

  deferred = sum of (arrival - cap where positive) = 7 + 0 + 12 = 19

  queues_over_cap = queues with arrival > cap = 2

  cutoff_hit = processed 113 >= nightly cutoff 100 is True

  archetype=queue_cutoff variant=1 seed=25'
success_criteria:
  deterministic_checks:
    json_exact: '{"processed": 113, "deferred": 19, "queues_over_cap": 2, "cutoff_hit": true}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped
  - the nightly cutoff is 100 processed items across all queues combined, reaching it stops everything after
  - deferred means arrived but not processed, arrived items sitting in a capped-out queue are deferred
  facts:
  - north holds 47 items against a cap of 40, south holds 33 items against a cap of 40, east holds 52 items against a cap of 40
  - 'queue north: 47 arrived, cap 40, so 40 processed and 7 deferred'
  - 'queue south: 33 arrived, cap 40, so 33 processed and 0 deferred'
  - 'queue east: 52 arrived, cap 40, so 40 processed and 12 deferred'
  output_spec:
    processed: int
    deferred: int
    queues_over_cap: int
    cutoff_hit: bool
contract:
  processed:
    formula: min(a1,c1)+min(a2,c2)+min(a3,c3)
    literals:
    - name: a1
      regex: alpha holds (\d+) items
      value: 47
    - name: c1
      regex: alpha holds \d+ items against a cap of (\d+)
      value: 40
    - name: a2
      regex: bravo holds (\d+) items
      value: 33
    - name: c2
      regex: bravo holds \d+ items against a cap of (\d+)
      value: 40
    - name: a3
      regex: charlie holds (\d+) items
      value: 52
    - name: c3
      regex: charlie holds \d+ items against a cap of (\d+)
      value: 40
  deferred:
    formula: max(a1-c1,0)+max(a2-c2,0)+max(a3-c3,0)
    literals: []
  queues_over_cap:
    formula: (a1>c1)+(a2>c2)+(a3>c3)
    literals: []
  cutoff_hit:
    formula: processed >= K
    literals:
    - name: K
      regex: combined ceiling[ is]* (\d+)
      value: 100
v6:
  entities:
  - id: processed_total
    question: total items processed tonight across all queues (sum of min(arrival, cap) per queue)
    answer: 113
  - id: deferred_total
    question: total items deferred tonight (arrival minus cap where positive, summed)
    answer: 19
  - id: over_cap_count
    question: how many queues exceeded their own cap (arrival strictly greater than cap)
    answer: 2
  - id: cutoff_flag
    question: did the combined processed count reach the nightly cutoff (true or false)
    answer: true
  aggregate: '{''processed'': int(a(''processed_total'')), ''deferred'': int(a(''deferred_total'')), ''queues_over_cap'': int(a(''over_cap_count'')), ''cutoff_hit'': bool(a(''cutoff_flag''))}'
