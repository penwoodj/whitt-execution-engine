hops: 4
archetype: queue_cutoff
variant: 1
domain: night queue processing
objective: derive processed, deferred, queues_over_cap, cutoff_hit from the stated rules
prompt: 'the day crew handed you the quota desk with a shrug, the runbook is thinner than they admit, these rules bind, the rules stack, later rules do not cancel earlier ones.


  three queues feed one processor, each queue has its own nightly cap, north holds 47 items against a cap of 40, south holds 33 items against a cap of 40, east holds 52 items against a cap of 40. the processor
  drains them in the order listed, it never reorders, it never revisits a queue once capped out. the arithmetic that matters is small, min of arrival and cap per queue, summed, nothing fancier.


  the cutoff rule came later than the caps, it was bolted on after a night when the processor ran hot past dawn. 100 is the combined ceiling, if the summed processed count reaches it mid-queue the remaining
  arrivals defer with everything else. tonight the numbers sit where they sit, work the rules in the order they were given.


  the log convention: an item is processed when the processor finishes it, arrival alone is not processing. the overnight batcher replays yesterday''s overflow before yours, that replay is not in these
  counts, it belongs to the prior ledger.


  the rules of the desk, as they stand tonight: 1. each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped. 2. the nightly cutoff is 100 processed items across
  all queues combined, reaching it stops everything after. 3. deferred means arrived but not processed, arrived items sitting in a capped-out queue are deferred.


  the facts of record: north holds 47 items against a cap of 40, south holds 33 items against a cap of 40, east holds 52 items against a cap of 40 queue north: 47 arrived, cap 40, so 40 processed and 7
  deferred queue south: 33 arrived, cap 40, so 33 processed and 0 deferred queue east: 52 arrived, cap 40, so 40 processed and 12 deferred.


  old-timers here say the counts are the easy part and the boundaries are the career, they are right more often than the confident ones


  nothing in this desk''s output survives on vibes, every figure traces to a clause, every clause traces to a night someone remembers


  the binder''s margins carry annotations from people who left, the annotations argue with each other, the rules themselves do not


