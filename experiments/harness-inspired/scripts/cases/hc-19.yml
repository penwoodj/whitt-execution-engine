auxiliary: all facts needed are in the prompt itself
provenance: 'seated=30 bumped=0 promoted=6 waitlist_left=0

  archetype=seat_alloc variant=0 seed=18'
success_criteria:
  deterministic_checks:
    json_exact: '{"seated": 30, "bumped": 0, "waitlist_promoted": 6, "waitlist_left": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - tiers fill in priority order, staff before vip before general, order is the whole rule
  - unfilled seats in higher tiers never cascade down, a seat either fills in its tier or stays empty
  - the waitlist promotes into empty seats anywhere after tier allocation, no-shows do not free seats tonight
  facts:
  - the staff tier has 4 seats against 3 requests, the vip tier has 2 seats against 2 requests, the general tier has 30 seats against 25 requests
  - the waitlist holds 6 names, 2 ticketed seats went empty via no-shows
  output_spec:
    seated: int
    bumped: int
    waitlist_promoted: int
    waitlist_left: int
contract:
  seated:
    formula: min(s1,d1)+min(s2,d2)+min(s3,d3)
    literals: []
  bumped:
    formula: max(d1-s1,0)+max(d2-s2,0)+max(d3-s3,0)
    literals: []
  waitlist_promoted:
    formula: min(W, free_total)
    literals:
    - name: W
      regex: waitlist holds (\d+) names
      value: 6
v6:
  entities:
  - id: sd
    question: patrons seated via tier allocation (count)
    answer: 30
  - id: bp
    question: requests bumped from full tiers (count)
    answer: 0
  - id: wp
    question: waitlist names promoted into empty seats
    answer: 6
  - id: wl
    question: waitlist names left unpromoted
    answer: 0
  aggregate: '{''seated'': int(a(''sd'')), ''bumped'': int(a(''bp'')), ''waitlist_promoted'': int(a(''wp'')), ''waitlist_left'': int(a(''wl''))}'
