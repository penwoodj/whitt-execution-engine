prompt: 'the quota desk fell to you in the rotation, the last person who held it left notes and a warning, the rules stack, later rules do not cancel earlier ones.


  the rollout ladder climbed tonight, coal covers 150 users and logged 7 fire reports, bronze covers 600 users and logged 2 fire reports, silver covers 3000 users and logged 9 fire reports, the abort threshold
  is 8 fire reports. walk the rings in order, stop at the first ring that hits the threshold, count users in every ring that entered including the one that died. rings after a halt never entered, their
  users were never exposed.


  the halt rule is blunt on purpose, the incident review found graduated response just meant slow response, blunt it is.


  the feedback pane you do not manage also collects star ratings per ring, stars are sentiment, fires are facts.


  the rules of the desk, as they stand tonight: 1. rings promote in order, a ring only enters after the previous ring passes clean. 2. a ring with 8 or more fire reports halts the rollout on the spot, halted
  means halted, no finish and see. 3. users exposed counts every user in rings that entered, including the ring that triggered the halt.


  the facts of record: coal covers 150 users and logged 7 fire reports, bronze covers 600 users and logged 2 fire reports, silver covers 3000 users and logged 9 fire reports the abort threshold is 8 fire
  reports.


