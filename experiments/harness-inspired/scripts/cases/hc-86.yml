auxiliary: all facts needed are in the prompt itself
provenance: 'rings_passed=2 aborted=True users_exposed=3750 halt_ring=silver

  archetype=rollout_rings variant=3 seed=85'
success_criteria:
  deterministic_checks:
    json_exact: '{"rings_passed": 2, "aborted": true, "users_exposed": 3750, "halt_ring": "silver"}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rings promote in order, a ring only enters after the previous ring passes clean
  - a ring with 8 or more fire reports halts the rollout on the spot, halted means halted, no finish and see
  - users exposed counts every user in rings that entered, including the ring that triggered the halt
  facts:
  - coal covers 150 users and logged 7 fire reports, bronze covers 600 users and logged 2 fire reports, silver covers 3000 users and logged 9 fire reports
  - the abort threshold is 8 fire reports
  output_spec:
    rings_passed: int
    aborted: bool
    users_exposed: int
    halt_ring: str
contract:
  users_exposed:
    formula: U1+U2(+U3 if halt at ring3)
    literals:
    - name: U1
      regex: ''
      value: 150
v6:
  entities:
  - id: rp
    question: rings that passed clean (count)
    answer: 2
  - id: ab
    question: was the rollout halted by the abort threshold (true or false)
    answer: true
  - id: ux
    question: users exposed across all rings that entered
    answer: 3750
  - id: hr
    question: id of the ring that triggered the halt (empty string if none)
    answer: silver
  aggregate: '{''rings_passed'': int(a(''rp'')), ''aborted'': bool(a(''ab'')), ''users_exposed'': int(a(''ux'')), ''halt_ring'': str(a(''hr''))}'
