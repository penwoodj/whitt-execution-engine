case_id: hc-27
category: natural-ops
difficulty: light
hops: 4
archetype: ack_windows
variant: 1
domain: on-call paging tiers
objective: derive acked_on_time, escalated, sev1_pages, sev1_escalated from the stated rules
prompt: 'you inherited the seating sheet three weeks ago, the runbook has been rewritten twice since then, this is the current version, when a rule sends work back, the second pass follows the same rules.


  the pager tree woke you 4 times tonight, k1 came in as sev1, was acked in 4 minutes against a 15 minute window, k2 came in as sev2, was acked in 20 minutes against a 25 minute window, k3 came in as sev2,
  was acked in 41 minutes against a 25 minute window, k4 came in as sev3, was acked in 100 minutes against a 90 minute window. the ack clock starts when the page fires, not when you read it, that distinction
  has cost people their morning. count the misses straight, no rounding, no benefit of the doubt.


  the escalation ladder was rewritten after a sev1 sat unowned for forty minutes while two people each assumed the other had it. one escalation per miss, the secondary either catches it or it goes to the
  bridge, tonight it never reached the bridge.


  the paging gateway you do not manage also posts reminder thumps every ten minutes for un-acked pages, reminders are not acks and never were.


  the rules of the desk, as they stand tonight: 1. an ack counts as on-time only if it lands within the window, an ack exactly at the window edge is on-time, past it is a miss. 2. a missed window escalates
  once to the secondary, the secondary ack does not rewind the original miss. 3. severity is a label for reporting, it changes no windows, windows are per-page.


  the facts of record: k1 came in as sev1, was acked in 4 minutes against a 15 minute window, k2 came in as sev2, was acked in 20 minutes against a 25 minute window, k3 came in as sev2, was acked in 41
  minutes against a 25 minute window, k4 came in as sev3, was acked in 100 minutes against a 90 minute window.


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


