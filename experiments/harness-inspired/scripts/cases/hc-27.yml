auxiliary: all facts needed are in the prompt itself
provenance: 'acked_on_time = pages with ack <= window = 1 + 1 + 0 + 0 = 2

  escalated = pages with ack > window = 2

  sev1_pages = 1

  sev1_escalated = 0

  archetype=ack_windows variant=1 seed=26'
success_criteria:
  deterministic_checks:
    json_exact: '{"acked_on_time": 2, "escalated": 2, "sev1_pages": 1, "sev1_escalated": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - an ack counts as on-time only if it lands within the window, an ack exactly at the window edge is on-time, past it is a miss
  - a missed window escalates once to the secondary, the secondary ack does not rewind the original miss
  - severity is a label for reporting, it changes no windows, windows are per-page
  facts:
  - k1 came in as sev1, was acked in 4 minutes against a 15 minute window, k2 came in as sev2, was acked in 20 minutes against a 25 minute window, k3 came in as sev2, was acked in 41 minutes against a 25
    minute window, k4 came in as sev3, was acked in 100 minutes against a 90 minute window
  output_spec:
    acked_on_time: int
    escalated: int
    sev1_pages: int
    sev1_escalated: int
contract:
  acked_on_time:
    formula: (a1<=w1)+(a2<=w2)+(a3<=w3)+(a4<=w4)
    literals:
    - name: a1
      regex: p1 came in as sev1, was acked in (\d+) minutes
      value: 4
    - name: w1
      regex: p1 came in as sev1, was acked in \d+ minutes against a (\d+) minute
      value: 15
    - name: a2
      regex: p2 came in as sev1, was acked in (\d+) minutes
      value: 20
    - name: w2
      regex: p2 came in as sev1, was acked in \d+ minutes against a (\d+) minute
      value: 25
    - name: a3
      regex: p3 came in as \w+, was acked in (\d+) minutes
      value: 41
    - name: w3
      regex: p3 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 25
    - name: a4
      regex: p4 came in as \w+, was acked in (\d+) minutes
      value: 100
    - name: w4
      regex: p4 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 90
  escalated:
    formula: 4 - acked_on_time
    literals: []
  sev1_pages:
    formula: '2'
    literals: []
  sev1_escalated:
    formula: escalated_s1
    literals: []
v6:
  entities:
  - id: acked
    question: pages acked within their window (ack minutes <= window minutes)
    answer: 2
  - id: esc
    question: pages that missed their window and escalated (ack minutes > window minutes)
    answer: 2
  - id: s1_total
    question: total sev1 pages tonight
    answer: 1
  - id: s1_esc
    question: sev1 pages that escalated
    answer: 0
  aggregate: '{''acked_on_time'': int(a(''acked'')), ''escalated'': int(a(''esc'')), ''sev1_pages'': int(a(''s1_total'')), ''sev1_escalated'': int(a(''s1_esc''))}'
