auxiliary: all facts needed are in the prompt itself
provenance: 'released=2 held=2 net=2000 held_value=5500

  archetype=payroll_holds variant=0 seed=5'
success_criteria:
  deterministic_checks:
    json_exact: '{"released_count": 2, "held_count": 2, "net_paid": 2000, "held_value": 5500}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rows over 1000 currency units hold for manual review unless the row carries an approved exception
  - held rows pay nothing tonight, they are not partial, they are not deferred pro-rated, they simply wait
  - the exception column is the only override, verbal approvals count for nothing at this desk
  facts:
  - row r-a pays 1200 units with an approved exception, row r-b pays 3400 units, row r-c pays 800 units with an approved exception, row r-d pays 2100 units
  output_spec:
    released_count: int
    held_count: int
    net_paid: int
    held_value: int
contract:
  net_paid:
    formula: sum of released rows
    literals:
    - name: sum
      regex: ''
      value: 2000
  held_count:
    formula: H
    literals:
    - name: H
      regex: ''
      value: 2
v6:
  entities:
  - id: rc
    question: rows released tonight (count, exceptions included)
    answer: 2
  - id: hc
    question: rows held for review (count)
    answer: 2
  - id: net
    question: net amount paid tonight (sum of released rows only)
    answer: 2000
  - id: hv
    question: total value sitting on hold (sum of held rows)
    answer: 5500
  aggregate: '{''released_count'': int(a(''rc'')), ''held_count'': int(a(''hc'')), ''net_paid'': int(a(''net'')), ''held_value'': int(a(''hv''))}'
