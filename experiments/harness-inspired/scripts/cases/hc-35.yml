domain: rate limiter token pools
objective: derive served, throttled, capacity, refill_added from the stated rules
prompt: 'cover the evening for the seating sheet, the regular is out, the runbook is the only authority that matters, partial work counts as nothing at the cutoff.


  the rate gate runs one pool, slot x1 opened with 20 tokens of its 20 capacity, slot x2 opened with 6 tokens of its 30 capacity, slot x3 opened with 0 tokens of its 15 capacity, the window refill added
  4 tokens, 60 requests arrived this window. pool everything, add the refill once, serve until dry, everything left over is throttled and gone. capacity is bookkeeping, it bounds nothing tonight except
  the morning report.


  pooling replaced per-slot fairness after a night where one hot slot starved two quiet ones, the pool does not care who brought the tokens.


  the edge cache you do not manage also serves some requests before they reach the gate, edge-served requests never appear in the arrival count and never will.


  the rules of the desk, as they stand tonight: 1. all slots pool into one serving pool, there is no per-slot fairness, the pool serves in arrival order. 2. the refill adds 4 tokens once at the top of the
  window, mid-window refills do not exist. 3. throttled requests are rejected, not queued, rejected means gone.


  the facts of record: slot x1 opened with 20 tokens of its 20 capacity, slot x2 opened with 6 tokens of its 30 capacity, slot x3 opened with 0 tokens of its 15 capacity the window refill added 4 tokens
  60 requests arrived this window.


