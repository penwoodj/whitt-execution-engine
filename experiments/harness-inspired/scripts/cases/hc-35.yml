auxiliary: all facts needed are in the prompt itself
provenance: 'served=30 throttled=30 capacity=65 refill=4

  archetype=token_bucket variant=1 seed=34'
success_criteria:
  deterministic_checks:
    json_exact: '{"served": 30, "throttled": 30, "capacity": 65, "refill_added": 4}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - all slots pool into one serving pool, there is no per-slot fairness, the pool serves in arrival order
  - the refill adds 4 tokens once at the top of the window, mid-window refills do not exist
  - throttled requests are rejected, not queued, rejected means gone
  facts:
  - slot x1 opened with 20 tokens of its 20 capacity, slot x2 opened with 6 tokens of its 30 capacity, slot x3 opened with 0 tokens of its 15 capacity
  - the window refill added 4 tokens
  - 60 requests arrived this window
  output_spec:
    served: int
    throttled: int
    capacity: int
    refill_added: int
contract:
  served:
    formula: min(REQ, s1+s2+s3+REF)
    literals:
    - name: REQ
      regex: (\d+) requests arrived this window
      value: 60
    - name: REF
      regex: refill added (\d+) tokens
      value: 4
  throttled:
    formula: REQ - served
    literals: []
  capacity:
    formula: c1+c2+c3
    literals: []
v6:
  entities:
  - id: sv
    question: requests served this window
    answer: 30
  - id: th
    question: requests throttled (rejected, not queued)
    answer: 30
  - id: cap
    question: total pool capacity (slot capacities summed)
    answer: 65
  - id: rf
    question: tokens the window refill added
    answer: 4
  aggregate: '{''served'': int(a(''sv'')), ''throttled'': int(a(''th'')), ''capacity'': int(a(''cap'')), ''refill_added'': int(a(''rf''))}'
