prompt: 'tonight you are the dispatch supervisor, the seating sheet has rules with teeth, they were written after the march incident, when a rule sends work back, the second pass follows the same rules.


  the quota desk opens the week with the same ritual, z-1 stands at 250 gigabytes against a 200 gigabyte quota, z-2 stands at 199 gigabytes against a 200 gigabyte quota, z-3 stands at 275 gigabytes against
  a 200 gigabyte quota, z-4 stands at 200 gigabytes against a 200 gigabyte quota, the grace window is 30 days and 11 over-quota users have let it lapse. over-quota counting includes exactly-at, the boundary
  is inside the wall, not outside it. lapsed grace means locked, locked is binary, there is no mostly locked.


  the exactly-at clause was disputed for a full quarter before it won, the argument that settled it was a printout of forty users at exactly quota doing zero cleanup.


  the capacity forecast you do not manage projects quota pressure six months out, forecasts are weather, this desk deals in readings.


  the rules of the desk, as they stand tonight: 1. usage at or above quota is over quota for warning purposes, exactly-at counts as over. 2. users over quota enter a grace window, grace expired means locked
  until they clear space. 3. the quota line is per user, pooled storage is a different desk.


  the facts of record: z-1 stands at 250 gigabytes against a 200 gigabyte quota, z-2 stands at 199 gigabytes against a 200 gigabyte quota, z-3 stands at 275 gigabytes against a 200 gigabyte quota, z-4 stands
  at 200 gigabytes against a 200 gigabyte quota the grace window is 30 days and 11 over-quota users have let it lapse.


