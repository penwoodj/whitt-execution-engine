  output_spec:
    warned: int
    locked: int
    grace_expired_users: int
    at_quota_exactly: int
contract:
  warned:
    formula: (u1>q1)+(u2>q2)+(u3>q3)+(u4>q4) + 0*exact
    literals: []
  at_quota_exactly:
    formula: (u1==q1)+(u2==q2)+(u3==q3)+(u4==q4)
    literals: []
v6:
  entities:
  - id: wn
    question: users over quota including exactly-at (count)
    answer: 2
  - id: lk
    question: is anyone locked tonight (1 if any grace lapsed, else 0)
    answer: 0
  - id: ge
    question: over-quota users whose grace has lapsed
    answer: 11
  - id: ax
    question: users sitting exactly at quota (count)
    answer: 1
