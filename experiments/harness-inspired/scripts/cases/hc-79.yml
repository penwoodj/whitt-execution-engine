case_id: hc-79
category: natural-ops
difficulty: heavy
hops: 5
archetype: backoff_budget
variant: 3
domain: retry backoff budgets
objective: derive budget_burned, budget_left, jobs_count, longest_wait from the stated rules
prompt: 'you hold the pager for the seating sheet until midnight, after that it goes to someone who trusts your counts, a thing only counts once, no matter how many lists it appears on.


  the retry engine burned through the evening, sync failed 4 times with each run taking 4 minutes, index failed 4 times with each run taking 7 minutes. waits double from 2 minutes and cap at 16, run time
  counts the same as wait time, the budget ledger does not care which kind of minute it was.


  the doubling rule predates the cap, the cap predates the shared budget, all three exist because of three different bad nights. stack them in order, double first, cap second, sum third.


  the failure inbox you do not manage also queues complaint emails per failure, the inbox is loud, the inbox is not the budget.


  the rules of the desk, as they stand tonight: 1. each retry waits double the previous wait, starting at 2 minutes, no single wait exceeds the 16 minute cap. 2. the shared retry budget is 50 minutes across
  all jobs, waits and run time both count against it. 3. a job that exhausts its declared failures stops, it does not borrow budget from tomorrow.


  the facts of record: sync failed 4 times with each run taking 4 minutes, index failed 4 times with each run taking 7 minutes.


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


