auxiliary: all facts needed are in the prompt itself
provenance: 'over=2 under=0 vent_min=13 overrides=1

  archetype=vent_control variant=0 seed=24'
success_criteria:
  deterministic_checks:
    json_exact: '{"zones_over": 2, "zones_under": 0, "vent_minutes": 13, "overrides_active": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - zones above 26 degrees vent until back in band, vent minutes accrue per zone per excursion
  - zones below 18 degrees heat, heating never counts against vent minutes
  - manual overrides lock a zone's vents closed, overrides are counted and never argued with
  facts:
  - zone z-north reads 27 degrees with 5 vent minutes logged, zone z-south reads 22 degrees with 0 vent minutes logged, zone z-east reads 31 degrees with 8 vent minutes logged
  - the high band edge is 26, the low edge is 18
  - 1 manual overrides are active tonight
  output_spec:
    zones_over: int
    zones_under: int
    vent_minutes: int
    overrides_active: int
contract:
  zones_over:
    formula: (t1>H)+(t2>H)+(t3>H)
    literals:
    - name: H
      regex: high band edge is (\d+)
      value: 26
  vent_minutes:
    formula: m*(t>H) sum
    literals:
    - name: m
      regex: ''
      value: 13
v6:
  entities:
  - id: zo
    question: zones above the high band edge (count)
    answer: 2
  - id: zu
    question: zones below the low band edge (count)
    answer: 0
  - id: vm
    question: total vent minutes logged tonight (over-band zones only)
    answer: 13
  - id: oa
    question: manual overrides active
    answer: 1
  aggregate: '{''zones_over'': int(a(''zo'')), ''zones_under'': int(a(''zu'')), ''vent_minutes'': int(a(''vm'')), ''overrides_active'': int(a(''oa''))}'
