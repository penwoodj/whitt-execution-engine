domain: greenhouse vent control
objective: derive zones_over, zones_under, vent_minutes, overrides_active from the stated rules
prompt: 'you hold the pager for the deploy lane until midnight, after that it goes to someone who trusts your counts, partial work counts as nothing at the cutoff.


  the vent controller reports by zone, zone z-north reads 27 degrees with 5 vent minutes logged, zone z-south reads 22 degrees with 0 vent minutes logged, zone z-east reads 31 degrees with 8 vent minutes
  logged, the high band edge is 26, the low edge is 18, 1 manual overrides are active tonight. band edges are strict, above high vents, below low heats, in-band idles. vent minutes sum only for over-band
  zones, overrides lock zones out but still count as overrides.


  strict edges won after a season of hysteresis arguments, the controller now believes the thermometer and nothing else.


  the weather feed you do not manage forecasts band shifts overnight, forecasts do not move actuators, readings do.


  the rules of the desk, as they stand tonight: 1. zones above 26 degrees vent until back in band, vent minutes accrue per zone per excursion. 2. zones below 18 degrees heat, heating never counts against
  vent minutes. 3. manual overrides lock a zone''s vents closed, overrides are counted and never argued with.


  the facts of record: zone z-north reads 27 degrees with 5 vent minutes logged, zone z-south reads 22 degrees with 0 vent minutes logged, zone z-east reads 31 degrees with 8 vent minutes logged the high
  band edge is 26, the low edge is 18 1 manual overrides are active tonight.


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


