auxiliary: all facts needed are in the prompt itself
provenance: 'shipped=3 rolled=1 slots_left=2 pending=0

  archetype=freeze_windows variant=3 seed=77'
success_criteria:
  deterministic_checks:
    json_exact: '{"shipped": 3, "rolled_back": 1, "slots_left": 2, "pending": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a deploy may start only before 21:00, work unfinished at 21:00 waits for tomorrow, partial work does not carry
  - a service showing an error rate at or above 0.5 percent must roll back before any new deploy of that service, rollbacks consume no slots
  - each new deploy consumes one of the 5 build slots held for the night, slots are never returned
  facts:
  - the clock reads 19:40
  - the freeze lands at 21:00
  - web shows 0.2 percent and its deploy takes 25 minutes, jobs shows 0.8 percent and its deploy takes 9 minutes, mail shows 0.1 percent and its deploy takes 14 minutes
  output_spec:
    shipped: int
    rolled_back: int
    slots_left: int
    pending: int
contract:
  shipped:
    formula: S
    literals:
    - name: S
      regex: ''
      value: 3
  rolled_back:
    formula: R
    literals:
    - name: R
      regex: ''
      value: 1
  slots_left:
    formula: K - shipped
    literals:
    - name: K
      regex: (\d+) build slots held for the night
      value: 5
  pending:
    formula: 3 - shipped
    literals: []
v6:
  entities:
  - id: shipped_n
    question: services that finished deploying before the freeze (count)
    answer: 3
  - id: rolled_n
    question: services that required rollback before deploying (error rate at or above 0.5)
    answer: 1
  - id: slots_l
    question: build slots left after tonight's deploys (slots minus deploys consumed)
    answer: 2
  - id: pending_n
    question: services still pending tomorrow (not finished before freeze)
    answer: 0
  aggregate: '{''shipped'': int(a(''shipped_n'')), ''rolled_back'': int(a(''rolled_n'')), ''slots_left'': int(a(''slots_l'')), ''pending'': int(a(''pending_n''))}'
