  the payroll batch runs tonight, row k pays 250 units, row m pays 3100 units with an approved exception, row n pays 1500 units, row o pays 4200 units with an approved exception. the threshold is 1200 units,
  exceptions are pre-approved in writing or they do not exist. count rows, then sum money, in that order.


  the hold queue exists because of a december when a mistyped zero paid out eleven times the intended amount, since then everything over the line waits for a human. tonight that human already stamped what
  the exception column shows.


  the finance preview tool you do not manage shows a different net because it annualizes, annualized figures have no seat at this table.


  the rules of the desk, as they stand tonight: 1. rows over 1200 currency units hold for manual review unless the row carries an approved exception. 2. held rows pay nothing tonight, they are not partial,
  they are not deferred pro-rated, they simply wait. 3. the exception column is the only override, verbal approvals count for nothing at this desk.


  the facts of record: row k pays 250 units, row m pays 3100 units with an approved exception, row n pays 1500 units, row o pays 4200 units with an approved exception.


