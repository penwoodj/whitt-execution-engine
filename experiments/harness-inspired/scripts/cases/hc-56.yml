auxiliary: all facts needed are in the prompt itself
provenance: 'released=3 held=1 net=7550 held_value=1500

  archetype=payroll_holds variant=2 seed=55'
success_criteria:
  deterministic_checks:
    json_exact: '{"released_count": 3, "held_count": 1, "net_paid": 7550, "held_value": 1500}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rows over 1200 currency units hold for manual review unless the row carries an approved exception
  - held rows pay nothing tonight, they are not partial, they are not deferred pro-rated, they simply wait
  - the exception column is the only override, verbal approvals count for nothing at this desk
  facts:
  - row k pays 250 units, row m pays 3100 units with an approved exception, row n pays 1500 units, row o pays 4200 units with an approved exception
  output_spec:
    released_count: int
    held_count: int
    net_paid: int
    held_value: int
contract:
  net_paid:
    formula: sum of released rows
    literals:
    - name: sum
      regex: ''
      value: 7550
  held_count:
    formula: H
    literals:
    - name: H
      regex: ''
      value: 1
v6:
  entities:
  - id: rc
    question: rows released tonight (count, exceptions included)
    answer: 3
  - id: hc
    question: rows held for review (count)
    answer: 1
  - id: net
    question: net amount paid tonight (sum of released rows only)
    answer: 7550
  - id: hv
    question: total value sitting on hold (sum of held rows)
    answer: 1500
  aggregate: '{''released_count'': int(a(''rc'')), ''held_count'': int(a(''hc'')), ''net_paid'': int(a(''net'')), ''held_value'': int(a(''hv''))}'
