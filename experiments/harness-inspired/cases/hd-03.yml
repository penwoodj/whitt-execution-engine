auxiliary: all facts needed are in the prompt itself
provenance: 'M=12 P=11 A=2 R=1 Y=4

  quorum_op=''>='' quorum_met=True

  cast=8 needed=5 margin=-1

  archetype=ballot_quorum variant=0 seed=2'
success_criteria:
  deterministic_checks:
    json_exact: '{"quorum_met": true, "votes_cast": 8, "yes_needed": 5, "margin": -1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - quorum needs present members at-or-over half the seated board, present means seated and in the room, abstain and recuse still count as present for quorum only
  - abstentions and recusals reduce the votes cast, votes cast is present minus abstain minus recuse, never negative
  - a motion carries with a majority of votes cast, majority of cast is cast divided by two plus one, the margin is yes votes minus that number
  facts:
  - the board seats 12 members
  - 11 members are present in the room tonight
  - 2 members abstain and 1 members recuse
  - 4 members vote yes
  output_spec:
    quorum_met: bool
    votes_cast: int
    yes_needed: int
    margin: int
contract:
  quorum_met:
    formula: bool((P >= ((M + 1) // 2)))
    literals:
    - name: M
      regex: board seats (\d+) members
      value: 12
    - name: P
      regex: (\d+) members are present
      value: 11
  votes_cast:
    formula: P - A - R
    literals:
    - name: P
      regex: (\d+) members are present
      value: 11
    - name: A
      regex: (\d+) members abstain
      value: 2
    - name: R
      regex: and (\d+) members recuse
      value: 1
  yes_needed:
    formula: votes_cast // 2 + 1
    literals: []
  margin:
    formula: Y - yes_needed
    literals:
    - name: Y
      regex: (\d+) members vote yes
      value: 4
v6:
  entities:
  - id: M
    question: seated members on the board (copy the number from its fact line)
    answer: 12
  - id: P
    question: members present tonight (copy the number from its fact line)
    answer: 11
  - id: A
    question: members abstaining (copy the number from its fact line)
    answer: 2
  - id: R
    question: members recusing (copy the number from its fact line)
    answer: 1
  - id: Y
    question: yes votes (copy the number from its fact line)
    answer: 4
  - id: cast
    question: votes cast (present minus abstain minus recuse, count them)
    answer: 8
  - id: need
    question: yes votes needed to carry as a count (majority of votes cast)
    answer: 5
  - id: qm
    question: quorum met tonight, true or false (apply the boundary word to present vs half the board)
    answer: true
  - id: marg
    question: the margin in whole votes (yes votes minus the needed count, negative allowed)
    answer: -1
  aggregate: '{''quorum_met'': bool((a(''P'') >= ((a(''M'') + 1) // 2))), ''votes_cast'': a(''P'') - a(''A'') - a(''R''), ''yes_needed'': (a(''P'') - a(''A'') - a(''R'')) // 2 + 1, ''margin'': a(''Y'') - ((a(''P'') - a(''A'') - a(''R'')) // 2 + 1)}'
