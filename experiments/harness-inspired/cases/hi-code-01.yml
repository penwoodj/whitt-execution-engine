case_id: hi-code-01
category: code
archetype: generation
difficulty: medium
prompt: >-
  Write a Python function called add that takes two numbers and returns their sum.
  Output ONLY the function code, no explanation.
auxiliary: Standard Python knowledge.
objective: Produce a valid Python function that adds two numbers.
success_criteria:
  deterministic_checks:
    contains_required:
      - "def add"
      - "return"
    max_lines: 10
    forbidden_phrases:
      - "I cannot"
      - "sorry"
      - "explanation"
  format_fixes:
    strip_markdown_fences: true
    ensure_trailing_newline: true
