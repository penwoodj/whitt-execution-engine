prompt: 'three generations of audit desks have run the ramp gate the same way, slowly, out loud, and twice, and the nightly ritual starts with reading every rule before touching any number.


  the tiering station handles one parcel tonight and the whole exercise hangs on a single boundary read, an at-or-over read pushes weight up at the edge itself, and the two conventions have never once agreed at the edge


  the rate card is laminated, the edges are not negotiable, and the urgent multiplier is a flat two, applied last, applied always


  the desk works the band first, the charge second, the doubling third, in that order, because every other order has been tried and every other order has failed


  the rules of the desk, as they stand tonight: 1. parcel weight moves up a band at-or-over the band edge, edges measured to the whole gram, no rounding of weight. 2. band 1 runs under 150 grams at 90 whole cents, band 2 runs to under 400 grams at 150 whole cents, band 3 is everything at or beyond that at 210 whole cents. 3. urgent parcels pay double the band charge, doubling happens after banding,
  never before.


  the facts of record: tonight''s parcel weighs 250 whole grams the band edges are 150 grams and 400 grams the band rates run 90, 150, then 210 whole cents from the lowest band up.


  the margin notes in the binder argue with each other in three different hands, the rules themselves have never once argued back


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


