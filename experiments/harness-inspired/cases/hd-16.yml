prompt: 'night two of the swing and the closing desk is down to one working pen and one working mind, and the nightly ritual starts with reading every rule before touching any number.


  the bump counter runs hot on sold-out nights and the arithmetic is a small mercy, volunteers first, forced second, and the voucher ledger tells you exactly how merciful the night was


  the volunteer line is not charity, it is pricing, and the price of a forced bump is what keeps the volunteer line populated, the desk just counts both


  unused volunteers walk away whole, no voucher, no cost, no memory, they board like everyone else and the ledger never mentions them again


  the rules of the desk, as they stand tonight: 1. the tour overbooks, bumps needed are tickets minus seats, volunteers step up before anyone is forced, a desk counts itself covered at-or-over its volunteer goal and forced bumps are whatever bumps the volunteers did not absorb. 2. volunteer vouchers cost the volunteer rate each, forced bumps cost the involuntary rate each, only volunteers actually used
  draw vouchers, unused volunteers cost nothing. 3. the voucher total is whole cents and is reported even when it is zero, which it never is.


  the facts of record: the tour seats 44 and sold 48 tickets 3 passengers volunteered for bumping volunteer vouchers run 20000 whole cents and involuntary compensation runs 40000 whole cents.


  the margin notes in the binder argue with each other in three different hands, the rules themselves have never once argued back


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


