  the quota desk opens the week with the same ritual, m stands at 23 gigabytes against a 20 gigabyte quota, n stands at 26 gigabytes against a 20 gigabyte quota, o stands at 20 gigabytes against a 20 gigabyte
  quota, p stands at 19 gigabytes against a 20 gigabyte quota, the grace window is 3 days and 2 over-quota users have let it lapse. over-quota counting includes exactly-at, the boundary is inside the wall,
  not outside it. lapsed grace means locked, locked is binary, there is no mostly locked.


  the exactly-at clause was disputed for a full quarter before it won, the argument that settled it was a printout of forty users at exactly quota doing zero cleanup.


  the capacity forecast you do not manage projects quota pressure six months out, forecasts are weather, this desk deals in readings.


  the rules of the desk, as they stand tonight: 1. usage at or above quota is over quota for warning purposes, exactly-at counts as over. 2. users over quota enter a grace window, grace expired means locked
  until they clear space. 3. the quota line is per user, pooled storage is a different desk.


  the facts of record: m stands at 23 gigabytes against a 20 gigabyte quota, n stands at 26 gigabytes against a 20 gigabyte quota, o stands at 20 gigabytes against a 20 gigabyte quota, p stands at 19 gigabytes
  against a 20 gigabyte quota the grace window is 3 days and 2 over-quota users have let it lapse.


