auxiliary: all facts needed are in the prompt itself
provenance: 'window=380 used=410 free=-30 fit=False

  archetype=backup_window variant=1 seed=40'
success_criteria:
  deterministic_checks:
    json_exact: '{"window_minutes": 380, "minutes_used": 410, "minutes_free": -30, "fit": false}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - the backup window is 380 minutes, the report states the minutes used and whether everything fit, nothing is deferred and nothing moves, the fit flag is the deliverable
  - incremental jobs are scheduled after the full, in the order listed, sizes are sizes, no compression magic
  - minutes free may read negative on a night that does not fit, negative headroom is the honest report
  facts:
  - full-vm takes 290 minutes and runs 1 times, incr-app takes 40 minutes and runs 3 times
  output_spec:
    window_minutes: int
    minutes_used: int
    minutes_free: int
    fit: bool
contract:
  minutes_used:
    formula: d1*c1+d2*c2
    literals:
    - name: d1
      regex: full-vm takes (\d+) minutes
      value: 290
    - name: c1
      regex: full-vm takes \d+ minutes and runs (\d+) times
      value: 1
    - name: d2
      regex: incr-app takes (\d+) minutes
      value: 40
    - name: c2
      regex: incr-app takes \d+ minutes and runs (\d+) times
      value: 3
  minutes_free:
    formula: W - minutes_used
    literals:
    - name: W
      regex: backup window is (\d+) minutes
      value: 380
  fit:
    formula: minutes_used <= W
    literals: []
v6:
  entities:
  - id: wm
    question: the backup window length in minutes
    answer: 380
  - id: mu
    question: minutes actually used (all jobs summed)
    answer: 410
  - id: mf
    question: minutes free after everything scheduled
    answer: -30
  - id: ft
    question: does everything fit inside the window (true or false)
    answer: false
  aggregate: '{''window_minutes'': int(a(''wm'')), ''minutes_used'': int(a(''mu'')), ''minutes_free'': int(a(''mf'')), ''fit'': bool(a(''ft''))}'
