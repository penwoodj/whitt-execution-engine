task_core:
  rules:
  - the code is six digits read left to right, each digit times its weight, weights fixed at 3, 5, 7, 2, 4, 9 from the left, the weighted sum is plain addition of those products
  - the remainder is the weighted sum modulo 97, the check digit is 97 minus the remainder, wrapped to zero when the remainder is zero, a remainder of zero means the check digit is zero, the wrap stands at-or-over zero by definition and never otherwise
  - all arithmetic whole numbers, no digit exceeds nine, no weight changes position
  facts:
  - the code digits are 4, 4, 6, 6, 0, 2
  - the weights are 3, 5, 7, 2, 4, 9 from the left
  - the bench quotes no weighted sum tonight, it derives from the digits and the fixed weights
  output_spec:
    weighted_sum: int
    remainder: int
    check_digit: int
contract:
  weighted_sum:
    formula: d1 * 3 + d2 * 5 + d3 * 7 + d4 * 2 + d5 * 4 + d6 * 9
    literals:
    - name: d1
      regex: null
      value: 4
    - name: d2
      regex: null
      value: 4
    - name: d3
      regex: null
      value: 6
    - name: d4
      regex: null
      value: 6
    - name: d5
      regex: null
      value: 0
    - name: d6
      regex: null
      value: 2
  remainder:
    formula: (d1 * 3 + d2 * 5 + d3 * 7 + d4 * 2 + d5 * 4 + d6 * 9) % 97
    literals: []
  check_digit:
    formula: (97 - remainder) % 97
    literals: []
v6:
  entities:
  - id: d1
    question: digit 1 of the code (copy the number from its fact line)
    answer: 4
  - id: d2
    question: digit 2 of the code (copy the number from its fact line)
    answer: 4
  - id: d3
    question: digit 3 of the code (copy the number from its fact line)
    answer: 6
  - id: d4
    question: digit 4 of the code (copy the number from its fact line)
    answer: 6
  - id: d5
    question: digit 5 of the code (copy the number from its fact line)
    answer: 0
  - id: d6
    question: digit 6 of the code (copy the number from its fact line)
    answer: 2
  - id: ws
    question: the weighted sum (each digit times its weight, summed)
    answer: 104
  - id: rem
    question: the weighted sum modulo 97
    answer: 7
  - id: chk
    question: the check digit as a whole number (97 minus remainder, wrapped to zero on zero remainder)
    answer: 90
  aggregate: '{''weighted_sum'': a(''d1'') * 3 + a(''d2'') * 5 + a(''d3'') * 7 + a(''d4'') * 2 + a(''d5'') * 4 + a(''d6'') * 9, ''remainder'': (a(''d1'') * 3 + a(''d2'') * 5 + a(''d3'') * 7 + a(''d4'') * 2 + a(''d5'') * 4 + a(''d6'') * 9) % 97, ''check_digit'': (97 - ((a(''d1'') * 3 + a(''d2'') * 5 + a(''d3'') * 7 + a(''d4'') * 2 + a(''d5'') * 4 + a(''d6'') * 9) % 97)) % 97}'
