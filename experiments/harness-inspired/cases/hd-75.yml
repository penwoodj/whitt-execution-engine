prompt: 'the counts desk keeps the sensor wall honest, which is a full-time job on a evening, the counts below are tonight''s, the rules below are forever.


  the code bench does positional arithmetic where order is law, the third digit means something the fourth never will, and the weights are welded to their slots


  mod ninety-seven looks exotic until you remember it is prime and large enough to catch transposition, which is the entire personality of the scheme


  the wrap rule exists for the day the remainder comes back zero, that day the check digit is zero, not ninety-seven, ninety-seven is never a digit here


  the rules of the desk, as they stand tonight: 1. the code is six digits read left to right, each digit times its weight, weights fixed at 3, 5, 7, 2, 4, 9 from the left, the weighted sum is plain addition of those products. 2. the remainder is the weighted sum modulo 97, the check digit is 97 minus the remainder, wrapped to zero when the remainder is zero, a remainder of zero means the check digit
  is zero, the wrap stands at-or-over zero by definition and never otherwise. 3. all arithmetic whole numbers, no digit exceeds nine, no weight changes position.


  the facts of record: the code digits are 4, 4, 6, 6, 0, 2 the weights are 3, 5, 7, 2, 4, 9 from the left the bench quotes no weighted sum tonight, it derives from the digits and the fixed weights.


