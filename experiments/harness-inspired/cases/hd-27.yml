prompt: 'the evening begins with a handoff note that always ends the same way, trust the rules, not the totals, the counts below are tonight''s, the rules below are forever.


  the tiering station handles one parcel tonight and the whole exercise hangs on a single boundary read, a strictly-past read leaves edge weight in the lower band, and the two conventions have never once agreed at the edge


  the rate card is laminated, the edges are not negotiable, and the urgent multiplier is a flat two, applied last, applied always


  the desk works the band first, the charge second, the doubling third, in that order, because every other order has been tried and every other order has failed


  the rules of the desk, as they stand tonight: 1. parcel weight moves up a band only when strictly past the band edge, edges measured to the whole gram, no rounding of weight. 2. band 1 runs under 100 grams at 120 whole cents, band 2 runs to under 250 grams at 180 whole cents, band 3 is everything at or beyond that at 260 whole cents. 3. urgent parcels pay double the band charge, doubling happens after
  banding, never before.


  the facts of record: tonight''s parcel weighs 100 whole grams the band edges are 100 grams and 250 grams the band rates run 120, 180, then 260 whole cents from the lowest band up.


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


