  archetype=tiered_postage variant=1 seed=26'
success_criteria:
  deterministic_checks:
    json_exact: '{"band": 1, "charge_cents": 120, "urgent_cents": 240}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - parcel weight moves up a band only when strictly past the band edge, edges measured to the whole gram, no rounding of weight
  - band 1 runs under 100 grams at 120 whole cents, band 2 runs to under 250 grams at 180 whole cents, band 3 is everything at or beyond that at 260 whole cents
  - urgent parcels pay double the band charge, doubling happens after banding, never before
  facts:
  - tonight's parcel weighs 100 whole grams
  - the band edges are 100 grams and 250 grams
  - the band rates run 120, 180, then 260 whole cents from the lowest band up
  output_spec:
    band: int
    charge_cents: int
    urgent_cents: int
contract:
  band:
    formula: (1 if (w <= e1) else (2 if (w <= e2) else 3))
    literals:
    - name: w
      regex: parcel weighs (\d+) whole grams
      value: 100
    - name: e1
      regex: edges are (\d+) grams
      value: 100
    - name: e2
      regex: and (\d+) grams
      value: 250
  charge_cents:
    formula: p1 if band == 1 else (p2 if band == 2 else p3)
    literals:
    - name: p1
      regex: rates run (\d+),
      value: 120
    - name: p2
      regex: ', (\d+), then'
      value: 180
    - name: p3
      regex: then (\d+) whole cents from
      value: 260
  urgent_cents:
    formula: 2 * charge_cents
    literals: []
v6:
  entities:
  - id: w
    question: the parcel weight in whole grams (copy the number from its fact line)
    answer: 100
  - id: e1
    question: the first band edge in whole grams (copy the number from its fact line)
    answer: 100
  - id: e2
    question: the second band edge in whole grams (copy the number from its fact line)
    answer: 250
  - id: p1
    question: band 1 rate in whole cents (copy the number from its fact line)
    answer: 120
  - id: p2
    question: band 2 rate in whole cents (copy the number from its fact line)
    answer: 180
  - id: p3
    question: band 3 rate in whole cents (copy the number from its fact line)
    answer: 260
  - id: band
    question: the parcel's band number, 1, 2, or 3 (apply the boundary rule to the weight)
    answer: 1
  - id: chg
    question: the band charge in whole cents (the rate for the band you derived)
    answer: 120
  - id: urg
    question: the urgent charge in whole cents (double the band charge)
    answer: 240
  aggregate: '{''band'': 1 if (a(''w'') <= a(''e1'')) else (2 if (a(''w'') <= a(''e2'')) else 3), ''charge_cents'': (a(''p1'') if (a(''w'') <= a(''e1'')) else (a(''p2'') if (a(''w'') <= a(''e2'')) else a(''p3''))), ''urgent_cents'': 2 * (a(''p1'') if (a(''w'') <= a(''e1'')) else (a(''p2'') if (a(''w'') <= a(''e2'')) else a(''p3'')))}'
