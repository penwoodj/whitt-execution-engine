provenance: 'released=4 held=0 net=12500 held_value=0

  archetype=payroll_holds variant=3 seed=80'
success_criteria:
  deterministic_checks:
    json_exact: '{"released_count": 4, "held_count": 0, "net_paid": 12500, "held_value": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rows over 3000 currency units hold for manual review unless the row carries an approved exception
  - held rows pay nothing tonight, they are not partial, they are not deferred pro-rated, they simply wait
  - the exception column is the only override, verbal approvals count for nothing at this desk
  facts:
  - row w1 pays 7700 units with an approved exception, row w2 pays 900 units, row w3 pays 1300 units, row w4 pays 2600 units with an approved exception
  output_spec:
    released_count: int
    held_count: int
    net_paid: int
    held_value: int
contract:
  held_count:
    formula: ((a1>T)*(1-x1))+((a2>T)*(1-x2))+((a3>T)*(1-x3))+((a4>T)*(1-x4))
    literals:
    - name: T
      regex: over (\d+) currency units hold
      value: 3000
    - name: a1
      regex: row w1 pays (\d+) units
      value: 7700
    - name: x1
      regex: row w1 pays \d+ units( with an approved exception)?
      value: 1
      map: &id001
        ' with an approved exception': 1
    - name: a2
      regex: row w2 pays (\d+) units
      value: 900
    - name: x2
      regex: row w2 pays \d+ units( with an approved exception)?
      value: 0
      map: &id002
        ' with an approved exception': 1
    - name: a3
      regex: row w3 pays (\d+) units
      value: 1300
    - name: x3
      regex: row w3 pays \d+ units( with an approved exception)?
      value: 0
      map: &id003
        ' with an approved exception': 1
    - name: a4
      regex: row w4 pays (\d+) units
      value: 2600
    - name: x4
      regex: row w4 pays \d+ units( with an approved exception)?
      value: 1
      map: &id004
        ' with an approved exception': 1
  held_value:
    formula: ((a1>T)*(1-x1)*a1)+((a2>T)*(1-x2)*a2)+((a3>T)*(1-x3)*a3)+((a4>T)*(1-x4)*a4)
    literals:
    - name: T
      regex: over (\d+) currency units hold
      value: 3000
    - name: a1
      regex: row w1 pays (\d+) units
      value: 7700
    - name: x1
      regex: row w1 pays \d+ units( with an approved exception)?
      value: 1
      map: *id001
    - name: a2
      regex: row w2 pays (\d+) units
      value: 900
    - name: x2
      regex: row w2 pays \d+ units( with an approved exception)?
      value: 0
      map: *id002
    - name: a3
      regex: row w3 pays (\d+) units
      value: 1300
    - name: x3
      regex: row w3 pays \d+ units( with an approved exception)?
      value: 0
      map: *id003
    - name: a4
      regex: row w4 pays (\d+) units
      value: 2600
    - name: x4
      regex: row w4 pays \d+ units( with an approved exception)?
      value: 1
      map: *id004
  released_count:
    formula: 4 - held_count
    literals: []
  net_paid:
    formula: (a1+a2+a3+a4) - held_value
    literals:
    - name: a1
      regex: row w1 pays (\d+) units
      value: 7700
    - name: a2
      regex: row w2 pays (\d+) units
      value: 900
    - name: a3
      regex: row w3 pays (\d+) units
      value: 1300
    - name: a4
      regex: row w4 pays (\d+) units
      value: 2600
