prompt: 'the code bench closes its ledger at 03:00 and everyone here treats that closing as gospel, so the desk works the problem the slow way, on purpose.


  the vault ledger quotes volumes in GiB and quotas in MiB on purpose, the conversion is where lazy nights go to die, 1024 and never 1000, the desk has a scar about this


  quota breaches read strictly-past the quota line tonight, and the distinction only matters for volumes parked exactly on the line, which happens more than anyone expects


  the desk converts first, compares second, sums last, converting and comparing in the same breath is how volumes end up over- or under-counted by a whole gigabyte


  the rules of the desk, as they stand tonight: 1. a volume is over quota when its usage in whole MiB is strictly past its quota, usage is recorded in GiB and converted at 1024 MiB per GiB exactly, no decimal shortcuts. 2. overage for a volume is its usage in MiB minus its quota in MiB, floored at zero, overage never goes negative. 3. the report wants the over-quota volume count, total usage in whole
  MiB, and total overage in whole MiB.


  the facts of record: annex-a holds 8 GiB against a 6144 MiB quota, annex-b holds 2 GiB against a 3072 MiB quota, annex-c holds 4 GiB against a 5120 MiB quota conversion is fixed tonight at 1024 MiB per GiB, whole MiB only the desk converts before comparing and sums only after every volume is converted.


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


