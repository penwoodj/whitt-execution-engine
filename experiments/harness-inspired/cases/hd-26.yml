task_core:
  rules:
  - a desk counts as a full month only when strictly past 30 active days, partial months prorate as whole cents rounded up, ceil, never round down
  - proration for a desk is its active days times its monthly rate, divided by 30, rounded up to a whole cent per desk
  - the report needs the full-month desk count, the largest single desk charge, and the total proration in whole cents
  facts:
  - north-vane ran 10 active days at 7500 whole cents per 30 days, south-vane ran 33 active days at 11000 whole cents per 30 days, east-vane ran 28 active days at 9500 whole cents per 30 days
  - every desk above is billed on the same 30-day convention tonight
  - the per-desk prorated charges work out to north-vane charges 2500 whole cents south-vane charges 12100 whole cents east-vane charges 8867 whole cents when the rule is applied faithfully
  output_spec:
    seats_full_month: int
    largest_seat_charge_cents: int
    total_proration_cents: int
contract:
  seats_full_month:
    formula: (d1 > 30) + (d2 > 30) + (d3 > 30)
    literals:
    - name: d1
      regex: north-vane ran (\d+) active days
      value: 10
    - name: d2
      regex: south-vane ran (\d+) active days
      value: 33
    - name: d3
      regex: east-vane ran (\d+) active days
      value: 28
  largest_seat_charge_cents:
    formula: max(((d1 * r1 + 29) // 30), ((d2 * r2 + 29) // 30), ((d3 * r3 + 29) // 30))
    literals:
    - name: d1
      regex: north-vane ran (\d+) active days
      value: 10
    - name: d2
      regex: south-vane ran (\d+) active days
      value: 33
    - name: d3
      regex: east-vane ran (\d+) active days
      value: 28
