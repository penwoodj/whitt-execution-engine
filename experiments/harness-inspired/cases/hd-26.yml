      regex: north-vane ran \d+ active days at (\d+) whole cents
      value: 7500
    - name: r2
      regex: south-vane ran \d+ active days at (\d+) whole cents
      value: 11000
    - name: r3
      regex: east-vane ran \d+ active days at (\d+) whole cents
      value: 9500
  total_proration_cents:
    formula: ((d1 * r1 + 29) // 30) + ((d2 * r2 + 29) // 30) + ((d3 * r3 + 29) // 30)
    literals:
    - name: d1
      regex: north-vane ran (\d+) active days
      value: 10
