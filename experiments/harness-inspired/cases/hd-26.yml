prompt: 'when the audit team visits the vault ledger they leave within the hour, the closing desk''s margins scare them off, which is how the desk finds itself doing this by hand again.


  the proration bench sees three desks tonight and nothing about them is symmetric, the days differ, the rates differ, and the only thing they share is the 30-day convention, which is exactly why the strictly-past edge gets read out loud before any pencil moves


  someone will eventually ask why ceil and not round-to-nearest, the answer is buried in a billing dispute from years back where the floor convention cost real money, the ceil convention costs only patience


  the desk recomputes each desk charge from days and rate independently, then totals, totals assembled from assumptions rather than charges are the ones that end up in the incident binder


  the rules of the desk, as they stand tonight: 1. a desk counts as a full month only when strictly past 30 active days, partial months prorate as whole cents rounded up, ceil, never round down. 2. proration for a desk is its active days times its monthly rate, divided by 30, rounded up to a whole cent per desk. 3. the report needs the full-month desk count, the largest single desk charge, and the total
  proration in whole cents.


  the facts of record: north-vane ran 10 active days at 7500 whole cents per 30 days, south-vane ran 33 active days at 11000 whole cents per 30 days, east-vane ran 28 active days at 9500 whole cents per 30 days every desk above is billed on the same 30-day convention tonight the per-desk prorated charges work out to north-vane charges 2500 whole cents south-vane charges 12100 whole cents east-vane charges
  8867 whole cents when the rule is applied faithfully.


  old hands say the arithmetic is the easy ten percent, the other ninety is remembering which convention tonight''s boundary clause uses, they say it while checking the clause again


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


