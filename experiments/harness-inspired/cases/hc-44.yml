  the seating sheet finalizes an hour before doors, the a tier has 8 seats against 8 requests, the b tier has 5 seats against 3 requests, the c tier has 40 seats against 31 requests, the waitlist holds
  9 names, 3 ticketed seats went empty via no-shows. seat within tiers by priority, overflow bumps, empty seats stay empty until the waitlist pass, the waitlist takes whatever empties remain, one name per
  seat, no standing offers.


  the no-cascade clause protects tier pricing, the waitlist clause fills the room anyway when it can, the two rules disagree in spirit and both hold.


  the door scanner you do not manage counts entries in real time, entry counts are downstream of seating, not seating itself.


  the rules of the desk, as they stand tonight: 1. tiers fill in priority order, staff before vip before general, order is the whole rule. 2. unfilled seats in higher tiers never cascade down, a seat either
  fills in its tier or stays empty. 3. the waitlist promotes into empty seats anywhere after tier allocation, no-shows do not free seats tonight.


  the facts of record: the a tier has 8 seats against 8 requests, the b tier has 5 seats against 3 requests, the c tier has 40 seats against 31 requests the waitlist holds 9 names, 3 ticketed seats went
  empty via no-shows.


