auxiliary: all facts needed are in the prompt itself
provenance: 'seated=42 bumped=0 promoted=9 waitlist_left=0

  archetype=seat_alloc variant=1 seed=43'
success_criteria:
  deterministic_checks:
    json_exact: '{"seated": 42, "bumped": 0, "waitlist_promoted": 9, "waitlist_left": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - tiers fill in priority order, staff before vip before general, order is the whole rule
  - unfilled seats in higher tiers never cascade down, a seat either fills in its tier or stays empty
  - the waitlist promotes into empty seats anywhere after tier allocation, no-shows do not free seats tonight
  facts:
  - the a tier has 8 seats against 8 requests, the b tier has 5 seats against 3 requests, the c tier has 40 seats against 31 requests
  - the waitlist holds 9 names, 3 ticketed seats went empty via no-shows
  output_spec:
    seated: int
    bumped: int
    waitlist_promoted: int
    waitlist_left: int
contract:
  seated:
    formula: min(s1,d1)+min(s2,d2)+min(s3,d3)
    literals:
    - name: s1
      regex: the a tier has (\d+) seats
      value: 8
    - name: d1
      regex: the a tier has \d+ seats against (\d+) requests
      value: 8
    - name: s2
      regex: the b tier has (\d+) seats
      value: 5
    - name: d2
      regex: the b tier has \d+ seats against (\d+) requests
      value: 3
    - name: s3
      regex: the c tier has (\d+) seats
      value: 40
    - name: d3
      regex: the c tier has \d+ seats against (\d+) requests
      value: 31
  bumped:
    formula: max(d1-s1,0)+max(d2-s2,0)+max(d3-s3,0)
    literals: []
  waitlist_promoted:
    formula: min(W, (s1-d1 if d1<s1 else 0)+(s2-d2 if d2<s2 else 0)+(s3-d3 if d3<s3 else 0))
    literals:
    - name: W
      regex: waitlist holds (\d+) names
      value: 9
v6:
  entities:
  - id: s1
    question: 'seats in the a tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 8
  - id: s2
    question: 'seats in the b tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 5
  - id: s3
    question: 'seats in the c tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 40
  - id: d1
    question: 'requests for the a tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 8
  - id: d2
    question: 'requests for the b tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3
  - id: d3
    question: 'requests for the c tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 31
  - id: wq
    question: 'names on the waitlist (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 9
  aggregate: '{''seated'': min(a(''s1''),a(''d1''))+min(a(''s2''),a(''d2''))+min(a(''s3''),a(''d3'')), ''bumped'': max(a(''d1'')-a(''s1''),0)+max(a(''d2'')-a(''s2''),0)+max(a(''d3'')-a(''s3''),0), ''waitlist_promoted'':
    min(a(''wq''), (a(''s1'')-a(''d1'') if a(''d1'')<a(''s1'') else 0)+(a(''s2'')-a(''d2'') if a(''d2'')<a(''s2'') else 0)+(a(''s3'')-a(''d3'') if a(''d3'')<a(''s3'') else 0)), ''waitlist_left'': a(''wq'')-min(a(''wq''),
    (a(''s1'')-a(''d1'') if a(''d1'')<a(''s1'') else 0)+(a(''s2'')-a(''d2'') if a(''d2'')<a(''s2'') else 0)+(a(''s3'')-a(''d3'') if a(''d3'')<a(''s3'') else 0))}'
