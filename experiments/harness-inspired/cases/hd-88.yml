auxiliary: all facts needed are in the prompt itself
provenance: 'base=500 cap=16000 retries=5

  waits=[500, 1000, 2000, 4000, 8000] total_ms=15500 total_s=15

  breached=False (op ''>'' vs budget=20s)

  wait_k = min(base*2^k, cap), seconds = ms//1000

  archetype=backoff_scale variant=3 seed=87'
success_criteria:
  deterministic_checks:
    json_exact: '{"wait3_ms": 2000, "total_wait_ms": 15500, "budget_breached": false}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each retry waits double the previous wait, starting from the base, every wait capped at the cap, the cap applies after doubling, doubling never resurrects a capped wait
  - the budget gate reads the total wait in whole seconds, the run breaches when the total is strictly past the budget, milliseconds convert to seconds floor-divided by 1000
  - reported waits are milliseconds, the budget is seconds, the conversion is part of the test
  facts:
  - the base wait is 500 milliseconds, the cap is 16000 milliseconds, and the run makes 5 retries against a 20 second budget
  - the runner quotes no wait list and no total tonight, the desk doubles, caps, and sums from the base alone
  output_spec:
    wait3_ms: int
    total_wait_ms: int
    budget_breached: bool
contract:
  wait3_ms:
    formula: min(base * 4, cap)
    literals:
    - name: base
      regex: base wait is (\d+) milliseconds
      value: 500
    - name: cap
      regex: cap is (\d+) milliseconds
      value: 16000
  total_wait_ms:
    formula: min(base*1, cap) + min(base*2, cap) + min(base*4, cap) + min(base*8, cap) + min(base*16, cap)
    literals: []
  budget_breached:
    formula: bool((total_wait_ms // 1000) > budget)
    literals:
    - name: budget
      regex: against a (\d+) second budget
      value: 20
v6:
  entities:
  - id: base
    question: base wait in whole milliseconds (copy the number from its fact line)
    answer: 500
  - id: cap
    question: wait cap in whole milliseconds (copy the number from its fact line)
    answer: 16000
  - id: w3
    question: the third wait in whole milliseconds (doubles capped, third of the run)
    answer: 2000
  - id: tms
    question: the total wait across all retries in whole milliseconds
    answer: 15500
  - id: budget
    question: the budget in whole seconds (copy the number from its fact line)
    answer: 20
  - id: breach
    question: budget breached, true or false (apply the boundary word to total seconds vs budget)
    answer: false
  aggregate: '{''wait3_ms'': min(a(''base'') * 4, a(''cap'')), ''total_wait_ms'': min(500 * 1, 16000) + min(500 * 2, 16000) + min(500 * 4, 16000) + min(500 * 8, 16000) + min(500 * 16, 16000), ''budget_breached'': bool(((min(500 * 1, 16000) + min(500 * 2, 16000) + min(500 * 4, 16000) + min(500 * 8, 16000) + min(500 * 16, 16000)) // 1000) > a(''budget''))}'
