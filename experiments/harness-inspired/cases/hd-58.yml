prompt: 'night two of the weekend and the verifications desk is down to one working pen and one working mind, and the nightly ritual starts with reading every rule before touching any number.


  the rebate board loves the word retroactive right up until the tier boundary sits exactly on tonight''s volume, and then the room divides into people who remember the boundary word and people who remember their bonus


  the at-or-over convention governs both tier edges tonight, identically, the binder does not permit mixed conventions within one program


  the desk computes the tier once, from full volume, then rebates the full gross at that single percentage, the marginal-tier reading is a different program at a different company with different lawyers


  the rules of the desk, as they stand tonight: 1. tier two begins at-or-over 80 units and tier three begins at-or-over 400 units, units are whole and never rounded. 2. the tier percentage is retroactive, it applies to the entire volume, not just the units above the boundary, this is the whole point of the program and the whole trap of it. 3. rebate is gross times percent floor-divided by 100 in whole
  cents, net is gross minus rebate, both reported.


  the facts of record: the program moved 500 whole units this quarter at 1800 whole cents per unit tier two starts at 80 units, tier three starts at 400 units, tier rates are 4, 10, and 15 percent the board quotes no gross tonight, the desk derives it before any tier applies.


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


