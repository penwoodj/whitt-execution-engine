auxiliary: all facts needed are in the prompt itself
provenance: 'dlq=55 poison=4 recovered=38 unrecovered=17

  archetype=dlq_redrive variant=0 seed=13'
success_criteria:
  deterministic_checks:
    json_exact: '{"dlq_total": 55, "poison_dead": 4, "recovered": 38, "unrecovered": 17}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a message that failed 2 or more delivery attempts is poison, poison never redrives
  - redrive replays everything else once, a fixed fraction comes back healthy tonight, the rest return to the queue
  - poison counting is per topic but the poison threshold is global
  facts:
  - the orders shelf holds 40 messages this morning, the billing shelf holds 15 messages this morning
  - the poison threshold is 2 failed attempts
  - redrive recovers 75 percent of non-poison messages tonight
  output_spec:
    dlq_total: int
    poison_dead: int
    recovered: int
    unrecovered: int
contract:
  dlq_total:
    formula: c1+c2
    literals:
    - name: c1
      regex: the orders shelf holds (\d+) messages
      value: 40
    - name: c2
      regex: the billing shelf holds (\d+) messages
      value: 15
  poison_dead:
    formula: 2*P
    literals:
    - name: P
      regex: poison threshold is (\d+)
      value: 2
  recovered:
    formula: int((dlq_total - poison_dead) * F / 100)
    literals:
    - name: F
      regex: redrive recovers (\d+) percent
      value: 75
v6:
  entities:
  - id: c1
    question: 'messages on the orders shelf (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 40
  - id: c2
    question: 'messages on the billing shelf (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 15
  - id: pt
    question: 'the poison threshold in failed attempts (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2
  - id: fp
    question: 'percent of non-poison messages the redrive recovers (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 75
  aggregate: '{''dlq_total'': a(''c1'')+a(''c2''), ''poison_dead'': 2*a(''pt''), ''recovered'': int((a(''c1'')+a(''c2'')-2*a(''pt''))*a(''fp'')/100), ''unrecovered'': (a(''c1'')+a(''c2''))-int((a(''c1'')+a(''c2'')-2*a(''pt''))*a(''fp'')/100)}'
