  the dead-letter shelf gets swept at dawn, the orders shelf holds 40 messages this morning, the billing shelf holds 15 messages this morning, the poison threshold is 2 failed attempts, redrive recovers
  75 percent of non-poison messages tonight. poison is quarantined first and never moves again, the rest take one redrive ride, whatever survives the ride counts as recovered, whatever does not goes back
  on the shelf.


  the fraction is honest tonight, the queue crew measured it last week, on bad nights it lies, tonight it does not.


  the shadow consumer you do not manage re-reads the shelf for its own metrics, shadow reads neither recover nor poison anything.


  the rules of the desk, as they stand tonight: 1. a message that failed 2 or more delivery attempts is poison, poison never redrives. 2. redrive replays everything else once, a fixed fraction comes back
  healthy tonight, the rest return to the queue. 3. poison counting is per topic but the poison threshold is global.


  the facts of record: the orders shelf holds 40 messages this morning, the billing shelf holds 15 messages this morning the poison threshold is 2 failed attempts redrive recovers 75 percent of non-poison
