case_id: hi-json-01
category: json
archetype: extraction
difficulty: easy
prompt: |-
  Output valid JSON with exactly these keys: {"name": "Alice", "age": 30, "city": "Paris"}.
  Output ONLY the JSON object, nothing else.
auxiliary: All values are specified in the prompt.
objective: Produce valid JSON with the three required fields.
success_criteria:
  deterministic_checks:
    json_valid: true
    contains_required:
      - '"name"'
      - '"age"'
      - '"Paris"'
    max_words: 50
    forbidden_phrases:
      - "I cannot"
      - "sorry"
      - "```"
  format_fixes:
    strip_markdown_fences: true
    force_json_object: true
    ensure_trailing_newline: true
