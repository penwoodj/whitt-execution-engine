prompt: 'the cold line closes its ledger at 03:00 and everyone here treats that closing as gospel, so the desk works the problem the slow way, on purpose.


  the pause clock is two clocks wearing one ticket, the warranty clock sleeps during vendor holds and the wall clock does not, and the difference between them is the exact length of the vendor''s apology


  the routing offset counts against the deadline but never against the work, it is overhead with a vote, and tonight the breach word is at-or-over the deadline


  the desk computes warranty minutes first, adds the offset second, reads the breach third, and reports margin even when negative, especially when negative


  the rules of the desk, as they stand tonight: 1. the warranty clock runs only while the desk works, the vendor hold pauses it entirely, paused minutes accrue to the wall clock and never to the warranty clock. 2. the desk counts a routing offset toward the deadline, breach reads the warranty clock plus offset at-or-over the deadline, margin is deadline minus that sum, reported negative when blown.
  3. the report wants warranty minutes, wall minutes, the breach flag, and the margin, all whole minutes.


  the facts of record: the ticket ran 55 working minutes, then a vendor hold paused it for 20 minutes, then 30 more working minutes the deadline is 120 minutes with a 15 minute routing offset the desk quotes neither clock tonight, both derive from the stretches and the hold.


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


  old hands say the arithmetic is the easy ten percent, the other ninety is remembering which convention tonight''s boundary clause uses, they say it while checking the clause again


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


