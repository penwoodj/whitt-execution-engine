success_criteria:
  deterministic_checks:
    json_exact: '{"users_flagged": 1, "users_clear": 2, "color_jobs_denied": 0, "largest_job_pages": 45}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - page quota flags at exactly-at, same boundary convention as every quota desk here
  - color printing requires quota headroom, flagged users' color jobs deny outright, mono jobs pass with a warning
  - denied jobs do not print tonight, denial is not deferral
  facts:
  - r1 printed 40 of a 50 page monthly quota, r2 printed 50 of a 50 page monthly quota, r3 printed 48 of a 50 page monthly quota
  - the largest single job tonight ran 45 pages
  - 0 color jobs were denied at the counter
  output_spec:
    users_flagged: int
    users_clear: int
    color_jobs_denied: int
    largest_job_pages: int
contract:
  users_flagged:
    formula: (n1>=q1)+(n2>=q2)+(n3>=q3)
    literals:
    - name: n1
      regex: r1 printed (\d+) of
      value: 40
    - name: q1
      regex: r1 printed \d+ of a (\d+) page monthly quota
      value: 50
    - name: n2
      regex: r2 printed (\d+) of
      value: 50
    - name: q2
      regex: r2 printed \d+ of a (\d+) page monthly quota
      value: 50
    - name: n3
      regex: r3 printed (\d+) of
      value: 48
    - name: q3
      regex: r3 printed \d+ of a (\d+) page monthly quota
      value: 50
  users_clear:
    formula: 3 - users_flagged
    literals: []
v6:
  entities:
  - id: n1
    question: 'pages r1 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 40
  - id: n2
    question: 'pages r2 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 50
  - id: n3
    question: 'pages r3 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 48
  - id: q1
    question: 'r1''s monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 50
  - id: q2
    question: 'r2''s monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 50
  - id: q3
    question: 'r3''s monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 50
  - id: cd
    question: 'color jobs denied tonight (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 0
  - id: lp
    question: 'largest single job page count (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 45
