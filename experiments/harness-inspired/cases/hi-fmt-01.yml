case_id: hi-fmt-01
category: formatting
archetype: extraction
difficulty: easy
prompt: >-
  Format this contact info as a single-line comma-separated string:
  Name: Jane Doe
  Email: jane@example.com
  Phone: 555-0123
  City: Austin
  Output ONLY the formatted string, nothing else.
auxiliary: All fields provided in the prompt.
objective: "Produce a comma-separated string with 4 fields in order: Name, Email, Phone, City."
success_criteria:
  deterministic_checks:
    contains_required:
      - "Jane Doe"
      - "jane@example.com"
      - "555-0123"
      - "Austin"
    max_words: 30
    max_lines: 1
    forbidden_phrases:
      - "I cannot"
      - "sorry"
  format_fixes:
    deduplicate_blank_lines: true
    ensure_trailing_newline: true
