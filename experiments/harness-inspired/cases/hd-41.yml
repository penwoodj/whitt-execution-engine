prompt: 'the graveyard begins with a handoff note that always ends the same way, trust the rules, not the totals, so the desk works the problem the slow way, on purpose.


  the bump counter runs hot on sold-out nights and the arithmetic is a small mercy, volunteers first, forced second, and the voucher ledger tells you exactly how merciful the night was


  the volunteer line is not charity, it is pricing, and the price of a forced bump is what keeps the volunteer line populated, the desk just counts both


  unused volunteers walk away whole, no voucher, no cost, no memory, they board like everyone else and the ledger never mentions them again


  the rules of the desk, as they stand tonight: 1. the tour overbooks, bumps needed are tickets minus seats, volunteers step up before anyone is forced, a desk counts itself covered only strictly past its volunteer goal minus one and forced bumps are whatever bumps the volunteers did not absorb. 2. volunteer vouchers cost the volunteer rate each, forced bumps cost the involuntary rate each, only volunteers
  actually used draw vouchers, unused volunteers cost nothing. 3. the voucher total is whole cents and is reported even when it is zero, which it never is.


  the facts of record: the tour seats 30 and sold 33 tickets 2 passengers volunteered for bumping volunteer vouchers run 15000 whole cents and involuntary compensation runs 35000 whole cents.


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


