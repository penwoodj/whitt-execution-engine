auxiliary: all facts needed are in the prompt itself
provenance: 'S=30 T=33 vol=2

  need=3 invol=1 unused=0 cost=65000

  need=T-S; invol=max(0,need-vol); cost=(vol-unused)*vc+invol*ic

  archetype=overbook_bump variant=1 seed=40'
success_criteria:
  deterministic_checks:
    json_exact: '{"involuntary_bumped": 1, "volunteers_unused": 0, "voucher_cost_cents": 65000}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - the tour overbooks, bumps needed are tickets minus seats, volunteers step up before anyone is forced, a desk counts itself covered only strictly past its volunteer goal minus one and forced bumps are whatever bumps the volunteers did not absorb
  - volunteer vouchers cost the volunteer rate each, forced bumps cost the involuntary rate each, only volunteers actually used draw vouchers, unused volunteers cost nothing
  - the voucher total is whole cents and is reported even when it is zero, which it never is
  facts:
  - the tour seats 30 and sold 33 tickets
  - 2 passengers volunteered for bumping
  - volunteer vouchers run 15000 whole cents and involuntary compensation runs 35000 whole cents
  output_spec:
    involuntary_bumped: int
    volunteers_unused: int
    voucher_cost_cents: int
contract:
  involuntary_bumped:
    formula: max(0, (T - S) - vol)
    literals:
    - name: T
      regex: sold (\d+) tickets
      value: 33
    - name: S
      regex: tour seats (\d+)
      value: 30
    - name: vol
      regex: (\d+) passengers volunteered
      value: 2
  volunteers_unused:
    formula: max(0, vol - (T - S))
    literals: []
  voucher_cost_cents:
    formula: (vol - volunteers_unused) * vc + involuntary_bumped * ic
    literals:
    - name: vc
      regex: vouchers run (\d+) whole cents
      value: 15000
    - name: ic
      regex: involuntary compensation runs (\d+) whole cents
      value: 35000
v6:
  entities:
  - id: S
    question: seats on the tour (copy the number from its fact line)
    answer: 30
  - id: T
    question: tickets sold (copy the number from its fact line)
    answer: 33
  - id: vol
    question: volunteers (copy the number from its fact line)
    answer: 2
  - id: vc
    question: volunteer voucher rate in whole cents (copy the number from its fact line)
    answer: 15000
  - id: ic
    question: involuntary rate in whole cents (copy the number from its fact line)
    answer: 35000
  - id: need
    question: bumps needed in passengers (tickets minus seats)
    answer: 3
  - id: invol
    question: involuntary bumps in passengers (bumps the volunteers did not absorb)
    answer: 1
  - id: vun
    question: volunteers unused (count them)
    answer: 0
  - id: cost
    question: total voucher cost in whole cents (used volunteers and forced bumps at their rates)
    answer: 65000
  aggregate: '{''involuntary_bumped'': max(0, (a(''T'') - a(''S'')) - a(''vol'')), ''volunteers_unused'': max(0, a(''vol'') - (a(''T'') - a(''S''))), ''voucher_cost_cents'': (a(''vol'') - max(0, a(''vol'') - (a(''T'') - a(''S'')))) * a(''vc'') + max(0, (a(''T'') - a(''S'')) - a(''vol'')) * a(''ic'')}'
