variant: 3
domain: classroom seat allocation
objective: derive seated, bumped, waitlist_promoted, waitlist_left from the stated rules
prompt: 'the traffic warden badge is yours tonight, the quota desk answers to you and to nobody else on the floor, state at the cutoff is what you report, history is context only.


  the seating sheet finalizes an hour before doors, the one tier has 10 seats against 6 requests, the two tier has 6 seats against 5 requests, the three tier has 60 seats against 55 requests, the waitlist
  holds 12 names, 4 ticketed seats went empty via no-shows. seat within tiers by priority, overflow bumps, empty seats stay empty until the waitlist pass, the waitlist takes whatever empties remain, one
  name per seat, no standing offers.


  the no-cascade clause protects tier pricing, the waitlist clause fills the room anyway when it can, the two rules disagree in spirit and both hold.


  the door scanner you do not manage counts entries in real time, entry counts are downstream of seating, not seating itself.


  the rules of the desk, as they stand tonight: 1. tiers fill in priority order, staff before vip before general, order is the whole rule. 2. unfilled seats in higher tiers never cascade down, a seat either
  fills in its tier or stays empty. 3. the waitlist promotes into empty seats anywhere after tier allocation, no-shows do not free seats tonight.


  the facts of record: the one tier has 10 seats against 6 requests, the two tier has 6 seats against 5 requests, the three tier has 60 seats against 55 requests the waitlist holds 12 names, 4 ticketed
  seats went empty via no-shows.


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


