auxiliary: all facts needed are in the prompt itself
provenance: 'seated=66 bumped=0 promoted=10 waitlist_left=2

  archetype=seat_alloc variant=3 seed=93'
success_criteria:
  deterministic_checks:
    json_exact: '{"seated": 66, "bumped": 0, "waitlist_promoted": 10, "waitlist_left": 2}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - tiers fill in priority order, staff before vip before general, order is the whole rule
  - unfilled seats in higher tiers never cascade down, a seat either fills in its tier or stays empty
  - the waitlist promotes into empty seats anywhere after tier allocation, no-shows do not free seats tonight
  facts:
  - the one tier has 10 seats against 6 requests, the two tier has 6 seats against 5 requests, the three tier has 60 seats against 55 requests
  - the waitlist holds 12 names, 4 ticketed seats went empty via no-shows
  output_spec:
    seated: int
    bumped: int
    waitlist_promoted: int
    waitlist_left: int
contract:
  seated:
    formula: min(s1,d1)+min(s2,d2)+min(s3,d3)
    literals:
    - name: s1
      regex: the one tier has (\d+) seats
      value: 10
    - name: d1
      regex: the one tier has \d+ seats against (\d+) requests
      value: 6
    - name: s2
      regex: the two tier has (\d+) seats
      value: 6
    - name: d2
      regex: the two tier has \d+ seats against (\d+) requests
      value: 5
    - name: s3
      regex: the three tier has (\d+) seats
      value: 60
    - name: d3
      regex: the three tier has \d+ seats against (\d+) requests
      value: 55
  bumped:
    formula: max(d1-s1,0)+max(d2-s2,0)+max(d3-s3,0)
    literals: []
  waitlist_promoted:
    formula: min(W, (s1-d1 if d1<s1 else 0)+(s2-d2 if d2<s2 else 0)+(s3-d3 if d3<s3 else 0))
    literals:
    - name: W
      regex: waitlist holds (\d+) names
      value: 12
v6:
  entities:
  - id: s1
    question: 'seats in the one tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 10
  - id: s2
    question: 'seats in the two tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 6
  - id: s3
    question: 'seats in the three tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 60
  - id: d1
    question: 'requests for the one tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 6
  - id: d2
    question: 'requests for the two tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 5
  - id: d3
    question: 'requests for the three tier (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 55
  - id: wq
    question: 'names on the waitlist (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 12
  aggregate: '{''seated'': min(a(''s1''),a(''d1''))+min(a(''s2''),a(''d2''))+min(a(''s3''),a(''d3'')), ''bumped'': max(a(''d1'')-a(''s1''),0)+max(a(''d2'')-a(''s2''),0)+max(a(''d3'')-a(''s3''),0), ''waitlist_promoted'':
    min(a(''wq''), (a(''s1'')-a(''d1'') if a(''d1'')<a(''s1'') else 0)+(a(''s2'')-a(''d2'') if a(''d2'')<a(''s2'') else 0)+(a(''s3'')-a(''d3'') if a(''d3'')<a(''s3'') else 0)), ''waitlist_left'': a(''wq'')-min(a(''wq''),
    (a(''s1'')-a(''d1'') if a(''d1'')<a(''s1'') else 0)+(a(''s2'')-a(''d2'') if a(''d2'')<a(''s2'') else 0)+(a(''s3'')-a(''d3'') if a(''d3'')<a(''s3'') else 0))}'
