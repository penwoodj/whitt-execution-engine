  the payroll batch runs tonight, row pr-1 pays 950 units, row pr-2 pays 5000 units with an approved exception, row pr-3 pays 1250 units, row pr-4 pays 640 units. the threshold is 2000 units, exceptions
  are pre-approved in writing or they do not exist. count rows, then sum money, in that order.


  the hold queue exists because of a december when a mistyped zero paid out eleven times the intended amount, since then everything over the line waits for a human. tonight that human already stamped what
  the exception column shows.


  the finance preview tool you do not manage shows a different net because it annualizes, annualized figures have no seat at this table.


  the rules of the desk, as they stand tonight: 1. rows over 2000 currency units hold for manual review unless the row carries an approved exception. 2. held rows pay nothing tonight, they are not partial,
  they are not deferred pro-rated, they simply wait. 3. the exception column is the only override, verbal approvals count for nothing at this desk.


  the facts of record: row pr-1 pays 950 units, row pr-2 pays 5000 units with an approved exception, row pr-3 pays 1250 units, row pr-4 pays 640 units.


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


