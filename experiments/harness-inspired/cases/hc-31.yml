success_criteria:
  deterministic_checks:
    json_exact: '{"released_count": 4, "held_count": 0, "net_paid": 7840, "held_value": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rows over 2000 currency units hold for manual review unless the row carries an approved exception
  - held rows pay nothing tonight, they are not partial, they are not deferred pro-rated, they simply wait
  - the exception column is the only override, verbal approvals count for nothing at this desk
  facts:
  - row pr-1 pays 950 units, row pr-2 pays 5000 units with an approved exception, row pr-3 pays 1250 units, row pr-4 pays 640 units
  output_spec:
    released_count: int
    held_count: int
    net_paid: int
    held_value: int
contract:
  held_count:
    formula: ((a1>T)*(1-x1))+((a2>T)*(1-x2))+((a3>T)*(1-x3))+((a4>T)*(1-x4))
    literals:
    - name: T
      regex: over (\d+) currency units hold
      value: 2000
    - name: a1
      regex: row pr-1 pays (\d+) units
      value: 950
    - name: x1
      regex: row pr-1 pays \d+ units( with an approved exception)?
      value: 0
      map: &id001
        ' with an approved exception': 1
    - name: a2
      regex: row pr-2 pays (\d+) units
      value: 5000
    - name: x2
      regex: row pr-2 pays \d+ units( with an approved exception)?
      value: 1
      map: &id002
        ' with an approved exception': 1
    - name: a3
      regex: row pr-3 pays (\d+) units
      value: 1250
    - name: x3
      regex: row pr-3 pays \d+ units( with an approved exception)?
      value: 0
      map: &id003
        ' with an approved exception': 1
    - name: a4
      regex: row pr-4 pays (\d+) units
      value: 640
    - name: x4
      regex: row pr-4 pays \d+ units( with an approved exception)?
      value: 0
      map: &id004
        ' with an approved exception': 1
  held_value:
    formula: ((a1>T)*(1-x1)*a1)+((a2>T)*(1-x2)*a2)+((a3>T)*(1-x3)*a3)+((a4>T)*(1-x4)*a4)
    literals:
    - name: T
      regex: over (\d+) currency units hold
      value: 2000
    - name: a1
      regex: row pr-1 pays (\d+) units
      value: 950
    - name: x1
      regex: row pr-1 pays \d+ units( with an approved exception)?
      value: 0
      map: *id001
    - name: a2
      regex: row pr-2 pays (\d+) units
      value: 5000
    - name: x2
      regex: row pr-2 pays \d+ units( with an approved exception)?
      value: 1
      map: *id002
    - name: a3
      regex: row pr-3 pays (\d+) units
      value: 1250
    - name: x3
      regex: row pr-3 pays \d+ units( with an approved exception)?
      value: 0
      map: *id003
    - name: a4
      regex: row pr-4 pays (\d+) units
      value: 640
    - name: x4
      regex: row pr-4 pays \d+ units( with an approved exception)?
      value: 0
      map: *id004
  released_count:
    formula: 4 - held_count
    literals: []
  net_paid:
    formula: (a1+a2+a3+a4) - held_value
    literals:
    - name: a1
      regex: row pr-1 pays (\d+) units
      value: 950
    - name: a2
      regex: row pr-2 pays (\d+) units
      value: 5000
    - name: a3
      regex: row pr-3 pays (\d+) units
      value: 1250
    - name: a4
      regex: row pr-4 pays (\d+) units
      value: 640
