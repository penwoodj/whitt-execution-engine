success_criteria:
  deterministic_checks:
    json_exact: '{"served": 17, "throttled": 32, "capacity": 60, "refill_added": 3}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - all slots pool into one serving pool, there is no per-slot fairness, the pool serves in arrival order
  - the refill adds 3 tokens once at the top of the window, mid-window refills do not exist
  - throttled requests are rejected, not queued, rejected means gone
  facts:
  - slot s-a opened with 10 tokens of its 15 capacity, slot s-b opened with 0 tokens of its 25 capacity, slot s-c opened with 4 tokens of its 20 capacity
  - the window refill added 3 tokens
  - 49 requests arrived this window
  output_spec:
    served: int
    throttled: int
    capacity: int
    refill_added: int
contract:
  served:
    formula: min(REQ, s1+s2+s3+REF)
    literals:
    - name: REQ
      regex: (\d+) requests arrived this window
      value: 49
    - name: REF
      regex: refill added (\d+) tokens
      value: 3
    - name: s1
      regex: slot s-a opened with (\d+) tokens
      value: 10
    - name: s2
      regex: slot s-b opened with (\d+) tokens
      value: 0
    - name: s3
      regex: slot s-c opened with (\d+) tokens
      value: 4
    - name: c1
      regex: slot s-a opened with \d+ tokens of its (\d+) capacity
      value: 15
    - name: c2
      regex: slot s-b opened with \d+ tokens of its (\d+) capacity
      value: 25
    - name: c3
      regex: slot s-c opened with \d+ tokens of its (\d+) capacity
      value: 20
  throttled:
    formula: REQ - served
    literals: []
  capacity:
    formula: c1+c2+c3
    literals: []
v6:
  entities:
  - id: sv
    question: requests served this window
    answer: 17
  - id: th
    question: requests throttled (rejected, not queued)
    answer: 32
  - id: cap
    question: total pool capacity (slot capacities summed)
    answer: 60
  - id: rf
    question: tokens the window refill added
    answer: 3
  aggregate: '{''served'': int(a(''sv'')), ''throttled'': int(a(''th'')), ''capacity'': int(a(''cap'')), ''refill_added'': int(a(''rf''))}'
