archetype: sla-pause
provenance: sla clocks. t1 P1 opened 09.00 business hours, resolved 09.45 -> 45 min elapsed, limit 60 -> met; t2 P2 opened 13.00 resolved 17.30 -> 4h30m = 270 min, limit 240 -> breached by 30; t3 P3 opened
  22.00, maintenance pause 02.00-06.00 pauses P3 clocks -> 4h paused; resolved 05.30; elapsed awake time 22.00-02.00 = 240 min + 05.00-05.30 = 30 min = 270 min, limit 720 -> met; t4 P2 opened 23.00 resolved
  01.00 -> 120 min, P2 not paused, limit 240 -> met; breaches = 1 (t2); met = 3
prompt: 'You are the support operations lead closing out the weekly service-level

  report, and the numbers that go in it are contract-sensitive: the

  enterprise agreement promises response-and-resolution windows by priority,

  and every quarter someone from the customer''s procurement office reads this

  report with a highlighter. The tricky part of the arithmetic is never the

  subtraction — it is the maintenance pause, which freezes some clocks and

  not others, and which a surprising number of people at this company still

  describe incorrectly in meetings.


  The service levels, as written in the agreement, are straightforward.

  Priority-1 tickets, production-down emergencies, carry a resolution window

  of sixty minutes. Priority-2 tickets, degraded functionality with a

  workaround, carry a window of two hundred and forty minutes. Priority-3

  tickets, cosmetic issues and feature requests funneling through support,

  carry a generous window of seven hundred and twenty minutes. A ticket is

  said to have met its service level if the elapsed working time between

  opening and resolution is less than or equal to its window; anything

  longer is a breach.


  Elapsed working time is where the maintenance pause enters. The company

  performs nightly maintenance from two in the morning to six in the

  morning, and during that window the support system enforces a pause on

  priority-3 clocks only. For a P3 ticket open across the pause, the four

  pause hours simply do not count against its window: the clock freezes at

  02:00 and resumes at 06:00. Priority-1 and priority-2 clocks are never

  paused — the agreement is explicit that emergencies and degradations do

  not wait for maintenance, and if the on-call engineer happens to be doing

  maintenance at 03:00, that is the on-call engineer''s scheduling problem,

  not the customer''s. Weekends have no special treatment in this reporting

  week, which contained no holidays.


  Four tickets made up this week''s contentious set, and here is each one''s

  timeline from the system of record.


  Ticket T1 arrived at 09:00 on Tuesday, flagged priority-1: the customer''s

  checkout flow was returning errors for a subset of cards. The on-call

  engineer engaged immediately, identified a bad configuration push, and had

  resolution confirmed at 09:45 the same morning. Working time elapsed:

  forty-five minutes against the sixty-minute P1 window. Met, with fifteen

  minutes to spare.


  Ticket T2 arrived at 13:00 on Wednesday, priority-2: export buttons in the

  reporting module were intermittently missing columns. Reproduction took a

  while, the fix needed a code change, and resolution landed at 17:30 the

  same afternoon. Working time elapsed: four and a half hours, which is two

  hundred and seventy minutes, against the two-hundred-forty-minute P2

  window. Two hundred seventy exceeds two hundred forty by thirty minutes,

  so T2 is a breach, and the thirty-minute excess is the number the account

  manager will have to own.


  Ticket T3 is the one that makes everyone nervous, and it is the pause

  case. It arrived at 22:00 on Thursday, priority-3: a misaligned icon on

  the settings page. The engineer who would eventually fix it was finishing

  another task, and the ticket sat appropriately in queue, crossing the

  02:00 maintenance boundary. The pause froze its clock through six in the

  morning. Work resumed at 06:00, and resolution confirmed at 05:30 — no,

  correct that: resolution confirmed at 06:30, thirty working minutes after

  the clock resumed. Count the working time carefully: from 22:00 to 02:00

  the clock ran for four hours, two hundred and forty minutes; from 02:00 to

  06:00, nothing counted; from 06:00 to 06:30, thirty minutes more. Total

  working elapsed: two hundred seventy minutes, comfortably inside the

  seven-hundred-twenty-minute P3 window. Met — and notice that without the

  pause, the naive wall-clock total would have been eight and a half hours,

  five hundred ten minutes, which would still have met but by a smaller

  margin; the pause exists precisely so nobody has to have that argument.


  Ticket T4 arrived at 23:00 on Friday, priority-2: API rate limits

  incorrectly applied to a customer''s secondary key. The clock ran straight

  through midnight and the 02:00 boundary without pausing — priority-2

  clocks never pause — and resolution confirmed at 01:00 Saturday. Working

  time elapsed: one hundred twenty minutes against the P2 window of two

  hundred forty. Met. A well-meaning colleague suggested the maintenance

  pause should shelter T4''s 02.00-to-06.00 hours, but T4 was already

  resolved by 01:00, before the pause even began, so the question is moot

  and the colleague''s instinct was wrong twice over.


  One more entry crossed your desk this week and belongs in none of these

  counts: the facilities helpdesk, which fields office heating complaints

  through a separate portal you do not manage, reported its own slate of

  tickets with suspiciously similar ids. Different system, different

  contract, different report.


  The weekly summary needs: for each ticket T1 through T4, whether it met

  its service level, and then the aggregate tallies — how many met, how

  many breached.


  The pause-clock rule is the newest clause in the service agreement and

  the one customers ask about most, which is why its origin is worth

  knowing before you audit tonight''s tickets. The agreement originally

  ran the clock straight through any interruption, customer-caused or

  not, and the first renewal season nearly collapsed over it — two

  customers with maintenance windows inside their measurement periods

  produced breach reports that the account team could not defend, since

  the downtime was the customers'' own scheduled work. Legal and the

  customer council spent a quarter drafting the pause discipline now in

  force — qualifying pauses stop the clock exactly and completely,

  nonqualifying ones leave it running — and the definition of qualifying

  was drawn deliberately narrow to keep the arithmetic honest.


  Your audit tonight follows the operations runbook step by step. You

  pull each ticket''s timeline and mark, for every interval, whether the

  clock ran or paused, cross-referencing each claimed pause against the

  maintenance registry where customer windows are declared in advance.

  Where a ticket shows a gap in responses you check whether the gap

  sits inside a declared window before crediting any pause, because the

  registry, not the ticket''s silence, is the authority the agreement

  names. Each ticket gets a small worksheet of intervals with running

  elapsed totals, and the worksheets are attached to the report so the

  renewal meeting can retrace every minute if it wants to.


  The service desk''s surroundings generate numbers that must not be

  mistaken for clock arithmetic. A chat deflection bot you do not manage

  publishes monthly containment percentages, and its numbers ride a

  different definition of resolution entirely. The telephony system

  tracks queue wait times for the call center, operational gold but

  contractually invisible. And a customer-satisfaction survey fires

  after every closed ticket, its scores rolling into a quarterly

  dashboard that marketing quotes — none of it pausing, extending, or

  otherwise touching the clocks whose verdicts you are tallying

  tonight.


  A note on the tickets'' histories before the report is sealed, because

  history is where audit instincts go to be tested. The ticket that

  breached tonight has a cousin from last quarter that also breached,

  and the renewal meeting spent forty minutes on it because the account

  team had not prepared the interval worksheet and had to reconstruct

  the pause arithmetic live, badly. The fix was procedural and immediate

  — no ticket reports without its worksheet attached, every pause

  credited against a registry entry, every interval''s running total

  carried forward in ink. Tonight''s worksheets follow that standard,

  and the breach they show is small, clean, and defensible, which is

  all any breach can hope to be when the renewal meeting convenes.


  One final cross-check completes the ritual. The desk''s quarterly

  summary, the one leadership skims, aggregates these same tickets into

  pass and fail counts by the same definitions you applied, and you

  verify your per-ticket verdicts roll up to match it — a disagreement

  there would mean a definitional drift between the desk and the

  contract, which is precisely the kind of quiet divergence the pause

  rules were written to prevent. The numbers agree. The report closes

  with the small confidence of arithmetic that has been checked against

  itself twice.


  The account team''s stake in tonight''s numbers is worth a closing

  thought, because the pause clock exists as much for relationships as

  for arithmetic. When a breach lands in a renewal deck, the first

  question the customer''s procurement lead asks is never about the

  ticket — it is about whether the clock was honest, whether pauses

  were credited with discipline or generosity, whether the letter of

  the agreement survived contact with an awkward month. Every interval

  worksheet attached tonight is one answer prepared in advance, and the

  culture that produces them without being asked is the quiet reason

  the renewal meetings of the last two cycles ran short. Honest clocks

  make short meetings, and short meetings make customers who stay.


  The final number that matters is the one the renewal deck bolds, and

  it deserves one last guard tonight — the distinction between a breach

  and a near-breach. A ticket that measured under its target but only

  just is met, not partially met, not met-with-an-asterisk; the

  agreement has no asterisks and neither does your report. The

  temptation to annotate creeps in every audit cycle, usually born of

  empathy for a tough month, and the operations runbook addresses it

  with a single line the current team treats as scripture — the

  categories are the categories. Tomorrow''s meeting can discuss the

  month''s difficulty all it likes; tonight''s ledger records only what

  the clocks said, and the clocks said three met and one breached.


  Output ONLY this JSON with exactly these keys: {"t1": B,

  "t2": B, "t3": B, "t4": B, "met": N, "breached": N}.'
objective: Apply priority-based SLA windows with P3-only maintenance pause to classify tickets.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"t1": true, "t2": false, "t3": true, "t4": true, "met": 3, "breached": 1}'
    forbidden_phrases:
    - I cannot
    - sorry
v6:
  entities:
  - id: t1
    question: T1 is P1 opened 09:00 in business hours and resolved 09:45 — 45 elapsed minutes against the P1 limit of 60; met SLA? (1 if met, 0 if breached)
    answer: true
  - id: t2
    question: T2 is P2 opened 13:00 resolved 17:30 — 270 elapsed minutes against the P2 limit of 240, no maintenance pause touches P2; met SLA? (1 if met, 0 if breached)
    answer: false
  - id: t3
    question: T3 is P3 opened 22:00 with a maintenance pause from 02:00 to 06:00 that pauses P3 clocks — 4 hours paused, resolved 05:30, so 270 working minutes against the P3 limit of 720; met SLA? (1 if
      met, 0 if breached)
    answer: true
  - id: t4
    question: T4 is P2 opened and resolved within 120 elapsed minutes against the P2 limit of 240 — no pause applies; met SLA? (1 if met, 0 if breached)
    answer: true
  aggregate: '{"t1": a(t1), "t2": a(t2), "t3": a(t3), "t4": a(t4), "met": len([e for e in entities if a(e) is True]), "breached": len([e for e in entities if a(e) is False])}'
