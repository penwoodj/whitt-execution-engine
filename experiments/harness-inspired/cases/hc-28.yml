  arithmetic, walk the services in the order given and let the clock do the deciding.


  the slot ledger exists because a night in april burned nine builds on a flaky test rig and nobody could say where the capacity went. one slot per deploy, rollbacks ride free, slots do not come back even
  when the deploy rolls back later.


  error rate gates came out of a different postmortem, the one where a 0.7 percent release shipped on top of itself twice. at or above the line means rollback first, then and only then a fresh deploy if
  the clock allows it.


  the canary analyst you do not manage also publishes a deploy confidence score, that score has never gated anything and does not gate tonight either.


  the rules of the desk, as they stand tonight: 1. a deploy may start only before 21:00, work unfinished at 21:00 waits for tomorrow, partial work does not carry. 2. a service showing an error rate at or
  above 0.5 percent must roll back before any new deploy of that service, rollbacks consume no slots. 3. each new deploy consumes one of the 3 build slots held for the night, slots are never returned.


  the facts of record: the clock reads 20:10 the freeze lands at 21:00 edge shows 0.3 percent and its deploy takes 8 minutes, api shows 0.6 percent and its deploy takes 15 minutes, cron shows 0.2 percent
  and its deploy takes 6 minutes.


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


