task_core:
  rules:
  - a deploy may start only before 21:00, work unfinished at 21:00 waits for tomorrow, partial work does not carry
  - a service showing an error rate at or above 0.5 percent must roll back before any new deploy of that service, rollbacks consume no slots
  - each new deploy consumes one of the 3 build slots held for the night, slots are never returned
  facts:
  - the clock reads 20:10
  - the freeze lands at 21:00
  - edge shows 0.3 percent and its deploy takes 8 minutes, api shows 0.6 percent and its deploy takes 15 minutes, cron shows 0.2 percent and its deploy takes 6 minutes
  output_spec:
    shipped: int
    rolled_back: int
    slots_left: int
    pending: int
contract:
