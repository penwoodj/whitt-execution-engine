provenance: trays. usable if use-by is tomorrow-or-later AND no allergen cross-contact; cross-contact rule. any tray stored on the shelf directly beneath an open nut container is flagged, regardless of
  its own ingredients; substitution. a flagged tray whose allergen profile can be remade from a nut-free equivalent counts as substituted and usable, but each order allows at most ONE substitution. tray
  A pasta use-by in 3 days, top shelf -> usable. tray B rice, shelf beneath open nut container -> flagged, nut-free equivalent exists -> substituted -> usable. tray C sauce, use-by yesterday -> discard
  regardless of anything. tray D dressing, also beneath the nut container -> flagged, would need substitution, but order for D already used its one substitution on B? no separate orders per tray. simplify.
  D flagged, its profile can be remade nut-free too -> substituted -> usable. tray E soup, use-by today (today is NOT tomorrow-or-later, it expires today) -> discard. results. usable = A + B + D = 3; discarded
