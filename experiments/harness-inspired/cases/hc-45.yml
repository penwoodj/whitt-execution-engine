provenance: 'held=1 rejected=2 shipped=1 cold_shipped=1

  archetype=specimen_routing variant=1 seed=44'
success_criteria:
  deterministic_checks:
    json_exact: '{"held": 1, "rejected": 2, "shipped": 1, "cold_band_shipped": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a sample with more than 1 temperature excursions holds for review, excursion means minutes outside band, at the limit ships
  - incomplete paperwork rejects outright, rejection happens before any excursion math
  - band labels travel with the sample but gate nothing tonight
  facts:
  - b1 rides the cold band, logged 0 excursions, paperwork complete, b2 rides the cold band, logged 2 excursions, paperwork complete, b3 rides the room band, logged 4 excursions, paperwork incomplete, b4
    rides the frozen band, logged 1 excursions, paperwork incomplete
  output_spec:
    held: int
    rejected: int
    shipped: int
    cold_band_shipped: int
contract:
  held:
    formula: ((e1>L)*p1)+((e2>L)*p2)+((e3>L)*p3)+((e4>L)*p4)
    literals:
    - name: L
      regex: more than (\d+) temperature excursions
      value: 1
    - name: e1
      regex: b1 rides the \w+ band, logged (\d+) excursions
      value: 0
    - name: p1
      regex: b1 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: &id001
        complete: 1
        incomplete: 0
    - name: b1
      regex: b1 rides the (\w+) band
      value: cold
    - name: e2
      regex: b2 rides the \w+ band, logged (\d+) excursions
      value: 2
    - name: p2
      regex: b2 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: &id002
        complete: 1
        incomplete: 0
    - name: b2
      regex: b2 rides the (\w+) band
      value: cold
    - name: e3
      regex: b3 rides the \w+ band, logged (\d+) excursions
      value: 4
    - name: p3
      regex: b3 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 0
      map: &id003
        complete: 1
        incomplete: 0
    - name: b3
      regex: b3 rides the (\w+) band
      value: room
    - name: e4
      regex: b4 rides the \w+ band, logged (\d+) excursions
      value: 1
    - name: p4
      regex: b4 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 0
      map: &id004
        complete: 1
        incomplete: 0
    - name: b4
      regex: b4 rides the (\w+) band
      value: frozen
  rejected:
    formula: (1-p1)+(1-p2)+(1-p3)+(1-p4)
    literals:
    - name: L
      regex: more than (\d+) temperature excursions
      value: 1
    - name: e1
      regex: b1 rides the \w+ band, logged (\d+) excursions
      value: 0
    - name: p1
      regex: b1 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id001
    - name: b1
      regex: b1 rides the (\w+) band
      value: cold
    - name: e2
      regex: b2 rides the \w+ band, logged (\d+) excursions
      value: 2
    - name: p2
      regex: b2 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id002
    - name: b2
      regex: b2 rides the (\w+) band
      value: cold
    - name: e3
      regex: b3 rides the \w+ band, logged (\d+) excursions
      value: 4
    - name: p3
      regex: b3 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 0
      map: *id003
    - name: b3
      regex: b3 rides the (\w+) band
      value: room
    - name: e4
      regex: b4 rides the \w+ band, logged (\d+) excursions
      value: 1
    - name: p4
      regex: b4 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 0
      map: *id004
    - name: b4
      regex: b4 rides the (\w+) band
      value: frozen
  shipped:
    formula: 4 - held - rejected
    literals: []
  cold_band_shipped:
    formula: ((e1<=L)*p1*(b1=='cold'))+((e2<=L)*p2*(b2=='cold'))+((e3<=L)*p3*(b3=='cold'))+((e4<=L)*p4*(b4=='cold'))
    literals:
    - name: L
      regex: more than (\d+) temperature excursions
      value: 1
    - name: e1
      regex: b1 rides the \w+ band, logged (\d+) excursions
      value: 0
    - name: p1
      regex: b1 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id001
    - name: b1
      regex: b1 rides the (\w+) band
      value: cold
    - name: e2
      regex: b2 rides the \w+ band, logged (\d+) excursions
      value: 2
    - name: p2
      regex: b2 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id002
    - name: b2
      regex: b2 rides the (\w+) band
      value: cold
    - name: e3
      regex: b3 rides the \w+ band, logged (\d+) excursions
      value: 4
    - name: p3
      regex: b3 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 0
      map: *id003
    - name: b3
      regex: b3 rides the (\w+) band
      value: room
    - name: e4
      regex: b4 rides the \w+ band, logged (\d+) excursions
      value: 1
    - name: p4
      regex: b4 rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 0
      map: *id004
    - name: b4
      regex: b4 rides the (\w+) band
      value: frozen
v6:
  entities:
  - id: e1
    question: 'excursions b1 logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 0
  - id: e2
    question: 'excursions b2 logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2
  - id: e3
    question: 'excursions b3 logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 4
  - id: e4
    question: 'excursions b4 logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 1
  - id: p1
    question: b1 paperwork status as a code, answer 1 for complete or 0 for incomplete
    answer: 1
  - id: p2
    question: b2 paperwork status as a code, answer 1 for complete or 0 for incomplete
    answer: 1
  - id: p3
    question: b3 paperwork status as a code, answer 1 for complete or 0 for incomplete
    answer: 0
  - id: p4
    question: b4 paperwork status as a code, answer 1 for complete or 0 for incomplete
    answer: 0
  - id: b1
    question: b1's band as a code, answer 1 for cold, 2 for room, or 3 for frozen
    answer: 1
  - id: b2
    question: b2's band as a code, answer 1 for cold, 2 for room, or 3 for frozen
    answer: 1
  - id: b3
    question: b3's band as a code, answer 1 for cold, 2 for room, or 3 for frozen
    answer: 2
  - id: b4
    question: b4's band as a code, answer 1 for cold, 2 for room, or 3 for frozen
    answer: 3
  - id: xl
    question: 'the excursion limit from the rule sentence stating samples with more than N temperature excursions hold for review (that N is the limit, not any sample''s excursion count). hint: copy the
      number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 1
  aggregate: '{''held'': (a(''e1'')>a(''xl''))*a(''p1'')+(a(''e2'')>a(''xl''))*a(''p2'')+(a(''e3'')>a(''xl''))*a(''p3'')+(a(''e4'')>a(''xl''))*a(''p4''), ''rejected'': (1-a(''p1''))+(1-a(''p2''))+(1-a(''p3''))+(1-a(''p4'')),
    ''shipped'': 4-((a(''e1'')>a(''xl''))*a(''p1'')+(a(''e2'')>a(''xl''))*a(''p2'')+(a(''e3'')>a(''xl''))*a(''p3'')+(a(''e4'')>a(''xl''))*a(''p4''))-((1-a(''p1''))+(1-a(''p2''))+(1-a(''p3''))+(1-a(''p4''))),
    ''cold_band_shipped'': (a(''e1'')<=a(''xl''))*a(''p1'')*(a(''b1'')==1)+(a(''e2'')<=a(''xl''))*a(''p2'')*(a(''b2'')==1)+(a(''e3'')<=a(''xl''))*a(''p3'')*(a(''b3'')==1)+(a(''e4'')<=a(''xl''))*a(''p4'')*(a(''b4'')==1)}'
