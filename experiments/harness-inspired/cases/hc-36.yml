provenance: 'rings_passed=1 aborted=True users_exposed=450 halt_ring=early

  archetype=rollout_rings variant=1 seed=35'
success_criteria:
  deterministic_checks:
    json_exact: '{"rings_passed": 1, "aborted": true, "users_exposed": 450, "halt_ring": "early"}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rings promote in order, a ring only enters after the previous ring passes clean
  - a ring with 5 or more fire reports halts the rollout on the spot, halted means halted, no finish and see
  - users exposed counts every user in rings that entered, including the ring that triggered the halt
  facts:
  - canary covers 50 users and logged 2 fire reports, early covers 400 users and logged 6 fire reports, broad covers 5000 users and logged 5 fire reports
  - the abort threshold is 5 fire reports
  output_spec:
    rings_passed: int
    aborted: bool
    users_exposed: int
    halt_ring: str
contract:
  rings_passed:
    formula: (f1<A)*(1+(f2<A)*(1+(f3<A)))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 5
    - name: f1
      regex: canary covers \d+ users and logged (\d+) fire reports
      value: 2
    - name: u1
      regex: canary covers (\d+) users
      value: 50
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 50 users and logged 2 fire reports
      value: canary
    - name: f2
      regex: early covers \d+ users and logged (\d+) fire reports
      value: 6
    - name: u2
      regex: early covers (\d+) users
      value: 400
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 400 users and logged 6 fire reports
      value: early
    - name: f3
      regex: broad covers \d+ users and logged (\d+) fire reports
      value: 5
    - name: u3
      regex: broad covers (\d+) users
      value: 5000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 5000 users and logged 5 fire reports
      value: broad
  aborted:
    formula: (f1>=A)+((f1<A)*(f2>=A))+((f1<A)*(f2<A)*(f3>=A))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 5
    - name: f1
      regex: canary covers \d+ users and logged (\d+) fire reports
      value: 2
    - name: u1
      regex: canary covers (\d+) users
      value: 50
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 50 users and logged 2 fire reports
      value: canary
    - name: f2
      regex: early covers \d+ users and logged (\d+) fire reports
      value: 6
    - name: u2
      regex: early covers (\d+) users
      value: 400
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 400 users and logged 6 fire reports
      value: early
    - name: f3
      regex: broad covers \d+ users and logged (\d+) fire reports
      value: 5
    - name: u3
      regex: broad covers (\d+) users
      value: 5000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 5000 users and logged 5 fire reports
      value: broad
  users_exposed:
    formula: (u1+u2+u3) if rings_passed>=3 else ((u1+u2+(u3 if aborted and rings_passed==2 else 0)) if rings_passed==2 else ((u1+(u2 if aborted and rings_passed==1 else 0)) if rings_passed==1 else (u1 if
      aborted else 0)))
    literals:
    - name: u1
      regex: canary covers (\d+) users
      value: 50
    - name: u2
      regex: early covers (\d+) users
      value: 400
    - name: u3
      regex: broad covers (\d+) users
      value: 5000
  halt_ring:
    formula: (n1 if aborted and rings_passed==0 else (n2 if aborted and rings_passed==1 else (n3 if aborted and rings_passed==2 else '')))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 5
    - name: f1
      regex: canary covers \d+ users and logged (\d+) fire reports
      value: 2
    - name: u1
      regex: canary covers (\d+) users
      value: 50
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 50 users and logged 2 fire reports
      value: canary
    - name: f2
      regex: early covers \d+ users and logged (\d+) fire reports
      value: 6
    - name: u2
      regex: early covers (\d+) users
      value: 400
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 400 users and logged 6 fire reports
      value: early
    - name: f3
      regex: broad covers \d+ users and logged (\d+) fire reports
      value: 5
    - name: u3
      regex: broad covers (\d+) users
      value: 5000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 5000 users and logged 5 fire reports
      value: broad
v6:
  entities:
  - id: f1
    question: fire reports ring canary logged, copy the number from its fact line
    answer: 2
  - id: f2
    question: fire reports ring early logged, copy the number from its fact line
    answer: 6
  - id: f3
    question: fire reports ring broad logged, copy the number from its fact line
    answer: 5
  - id: u1
    question: users ring canary covers, copy the number from its fact line
    answer: 50
  - id: u2
    question: users ring early covers, copy the number from its fact line
    answer: 400
  - id: u3
    question: users ring broad covers, copy the number from its fact line
    answer: 5000
  - id: n1
    question: the ring id of ring number 1, copy it exactly from the facts
    answer: canary
  - id: n2
    question: the ring id of ring number 2, copy it exactly from the facts
    answer: early
  - id: n3
    question: the ring id of ring number 3, copy it exactly from the facts
    answer: broad
  - id: at
    question: the abort threshold in fire reports, copy the number from the facts
    answer: 5
  aggregate: '{''rings_passed'': (a(''f1'')<a(''at''))*(1+(a(''f2'')<a(''at''))*(1+(a(''f3'')<a(''at'')))), ''aborted'': (a(''f1'')>=a(''at''))+(a(''f2'')>=a(''at''))+(a(''f3'')>=a(''at''))>0, ''users_exposed'':
    int(a(''u1''))+int(a(''u2''))*(a(''f1'')<a(''at''))+int(a(''u3''))*(a(''f1'')<a(''at''))*(a(''f2'')<a(''at'')), ''halt_ring'': (a(''n1'') if a(''f1'')>=a(''at'') else (a(''n2'') if a(''f2'')>=a(''at'')
    else (a(''n3'') if a(''f3'')>=a(''at'') else '''')))}'
