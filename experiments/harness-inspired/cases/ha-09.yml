case_id: ha-09
category: harness-ops
difficulty: heavy
hops: 6
archetype: wasted-effort-accounting
provenance: wasted effort; stages d0=1 x3=3, d1=2 x2=4, d2=3 x1=3, fail=3 x2=6 -> total 16; useful = winning
  stages only = 6; wasted = 16-6 = 10
prompt: 'You close out tonight''s suite and must report wasted effort. Definitions: a

  won case''s win-depth d means it executed exactly d+1 stages (solve counts as

  stage 0) and only its final stage produced the pass. A failed case executed

  all 3 stages (solve, fix1, fix2) with no pass. Useful stages are winning

  stages only; every other executed stage is wasted. Tonight 8 cases: 3 won at

  depth 0, 2 won at depth 1, 1 won at depth 2, 2 failed outright. A cost

  dashboard you do not manage also counts the free shell-side check scripts as

  stages, which they are not. Report total stages executed, useful stages, and

  wasted stages. Output ONLY this JSON with exactly these keys:

  {"total": N, "useful": N, "wasted": N}.'
objective: Account total/useful/wasted stages from win-depth distribution.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"total": 16, "useful": 6, "wasted": 10}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: depth0_group, question: "3 cases won at depth 0 — depth d means the case executed exactly d+1 stages, only the last of which is useful; count stages executed and useful stages for this group of 3", answer: {executed: 3, useful: 3}}
    - {id: depth1_group, question: "2 cases won at depth 1 — depth d means each case executed exactly d+1 stages, only the last of which is useful; count stages executed and useful stages for this group of 2", answer: {executed: 4, useful: 2}}
    - {id: depth2_group, question: "1 case won at depth 2 — depth d means that case executed exactly d+1 stages total (solve, fix1, fix2 = 3 stages), only the last of which is useful; count stages executed and useful stages for this single case", answer: {executed: 3, useful: 1}}
    - {id: failed_group, question: "2 cases failed outright — a failed case executed all 3 stages (solve, fix1, fix2) with no pass, so zero useful stages; count stages executed and useful stages for this group of 2", answer: {executed: 6, useful: 0}}
  aggregate: '{"total": a(depth0_group).get("executed",0) + a(depth1_group).get("executed",0) + a(depth2_group).get("executed",0) + a(failed_group).get("executed",0), "useful": a(depth0_group).get("useful",0) + a(depth1_group).get("useful",0) + a(depth2_group).get("useful",0) + a(failed_group).get("useful",0), "wasted": (a(depth0_group).get("executed",0) + a(depth1_group).get("executed",0) + a(depth2_group).get("executed",0) + a(failed_group).get("executed",0)) - (a(depth0_group).get("useful",0) + a(depth1_group).get("useful",0) + a(depth2_group).get("useful",0) + a(failed_group).get("useful",0))}'
