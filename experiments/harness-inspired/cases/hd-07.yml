  the bundle threshold is the only fork in tonight''s road, at-or-over earns it, and the discount lands on the sticker price, not on some running remainder, the remainder reading is how the cage once paid nine cents on a bicycle


  the desk recomputes each wallet''s drain from the payable left after the previous wallet, never from the sticker, never from memory


  the rules of the desk, as they stand tonight: 1. a basket earns the bundle discount at-or-over the bundle threshold, the discount percentage applies to the sticker price once, before any wallet is touched. 2. payment drains wallets in fixed order, wallet one, then two, then three, each wallet floors at zero, no wallet ever goes negative. 3. shortfall is whatever the purchase still owes after all three
  wallets, floored at zero, the desk reports it even when it is zero, especially when it is zero.


  the facts of record: the sticker price is 3800 whole cents and the bundle threshold is 3500 whole cents with a 5 percent bundle discount wallet one holds 1500, wallet two holds 800, wallet three holds 2000, all whole cents the cage quotes no payable tonight, the bundle rule decides it and the desk applies it.


