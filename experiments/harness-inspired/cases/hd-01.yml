task_core:
  rules:
  - a desk counts as a full month at-or-over 30 active days, partial months prorate as whole cents rounded up, ceil, never round down
  - proration for a desk is its active days times its monthly rate, divided by 30, rounded up to a whole cent per desk
  - the report needs the full-month desk count, the largest single desk charge, and the total proration in whole cents
  facts:
  - alpha-desk ran 14 active days at 9000 whole cents per 30 days, bravo-desk ran 30 active days at 12000 whole cents per 30 days, charlie-desk ran 47 active days at 6000 whole cents per 30 days
  - every desk above is billed on the same 30-day convention tonight
  - the per-desk prorated charges work out to alpha-desk charges 4200 whole cents bravo-desk charges 12000 whole cents charlie-desk charges 9400 whole cents when the rule is applied faithfully
  output_spec:
    seats_full_month: int
    largest_seat_charge_cents: int
    total_proration_cents: int
contract:
  seats_full_month:
    formula: (d1 >= 30) + (d2 >= 30) + (d3 >= 30)
    literals:
    - name: d1
      regex: alpha-desk ran (\d+) active days
      value: 14
    - name: d2
      regex: bravo-desk ran (\d+) active days
      value: 30
    - name: d3
      regex: charlie-desk ran (\d+) active days
      value: 47
  largest_seat_charge_cents:
    formula: max(((d1 * r1 + 29) // 30), ((d2 * r2 + 29) // 30), ((d3 * r3 + 29) // 30))
    literals:
    - name: d1
      regex: alpha-desk ran (\d+) active days
      value: 14
    - name: d2
      regex: bravo-desk ran (\d+) active days
      value: 30
    - name: d3
      regex: charlie-desk ran (\d+) active days
      value: 47
    - name: r1
      regex: alpha-desk ran \d+ active days at (\d+) whole cents
      value: 9000
    - name: r2
      regex: bravo-desk ran \d+ active days at (\d+) whole cents
      value: 12000
    - name: r3
      regex: charlie-desk ran \d+ active days at (\d+) whole cents
      value: 6000
  total_proration_cents:
    formula: ((d1 * r1 + 29) // 30) + ((d2 * r2 + 29) // 30) + ((d3 * r3 + 29) // 30)
    literals:
    - name: d1
      regex: alpha-desk ran (\d+) active days
      value: 14
    - name: d2
      regex: bravo-desk ran (\d+) active days
      value: 30
    - name: d3
      regex: charlie-desk ran (\d+) active days
      value: 47
    - name: r1
      regex: alpha-desk ran \d+ active days at (\d+) whole cents
      value: 9000
    - name: r2
      regex: bravo-desk ran \d+ active days at (\d+) whole cents
      value: 12000
    - name: r3
      regex: charlie-desk ran \d+ active days at (\d+) whole cents
      value: 6000
