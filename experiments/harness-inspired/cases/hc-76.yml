auxiliary: all facts needed are in the prompt itself
provenance: 'processed = sum of min(arrival, cap) = 50 + 44 + 50 = 144

  deferred = sum of (arrival - cap where positive) = 13 + 0 + 21 = 34

  queues_over_cap = queues with arrival > cap = 2

  cutoff_hit = processed 144 >= nightly cutoff 150 is False

  archetype=queue_cutoff variant=3 seed=75'
success_criteria:
  deterministic_checks:
    json_exact: '{"processed": 144, "deferred": 34, "queues_over_cap": 2, "cutoff_hit": false}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped
  - the nightly cutoff is 150 processed items across all queues combined, if the summed processed count reaches or passes it the cutoff flag flips true, the flag is the report, nothing truncates, queues
    run to their caps regardless
  - deferred means arrived but not processed, arrived items sitting in a capped-out queue are deferred
  facts:
  - moto holds 63 items against a cap of 50, kilo holds 44 items against a cap of 50, lima holds 71 items against a cap of 50
  - 'queue moto: 63 arrived, cap 50, so 50 processed and 13 deferred'
  - 'queue kilo: 44 arrived, cap 50, so 44 processed and 0 deferred'
  - 'queue lima: 71 arrived, cap 50, so 50 processed and 21 deferred'
  output_spec:
    processed: int
    deferred: int
    queues_over_cap: int
    cutoff_hit: bool
contract:
  processed:
    formula: min(a1,c1)+min(a2,c2)+min(a3,c3)
    literals:
    - name: a1
      regex: moto holds (\d+) items
      value: 63
    - name: c1
      regex: moto holds \d+ items against a cap of (\d+)
      value: 50
    - name: a2
      regex: kilo holds (\d+) items
      value: 44
    - name: c2
      regex: kilo holds \d+ items against a cap of (\d+)
      value: 50
    - name: a3
      regex: lima holds (\d+) items
      value: 71
    - name: c3
      regex: lima holds \d+ items against a cap of (\d+)
      value: 50
  deferred:
    formula: max(a1-c1,0)+max(a2-c2,0)+max(a3-c3,0)
    literals: []
  queues_over_cap:
    formula: (a1>c1)+(a2>c2)+(a3>c3)
    literals: []
  cutoff_hit:
    formula: processed >= K
    literals:
    - name: K
      regex: nightly cutoff is (\d+) processed items
      value: 150
v6:
  entities:
  - id: processed_total
    question: total items processed tonight across all queues (sum of min(arrival, cap) per queue)
    answer: 144
  - id: deferred_total
    question: total items deferred tonight (arrival minus cap where positive, summed)
    answer: 34
  - id: over_cap_count
    question: how many queues exceeded their own cap (arrival strictly greater than cap)
    answer: 2
  - id: cutoff_flag
    question: did the combined processed count reach the nightly cutoff (true or false)
    answer: false
  aggregate: '{''processed'': int(a(''processed_total'')), ''deferred'': int(a(''deferred_total'')), ''queues_over_cap'': int(a(''over_cap_count'')), ''cutoff_hit'': bool(a(''cutoff_flag''))}'
