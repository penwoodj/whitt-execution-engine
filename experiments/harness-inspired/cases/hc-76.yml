case_id: hc-76
category: field-ops
difficulty: light
hops: 4
archetype: queue_cutoff
variant: 3
domain: night queue processing
objective: derive processed, deferred, queues_over_cap, cutoff_hit from the stated rules
prompt: 'the traffic warden badge is yours tonight, the sweep ledger answers to you and to nobody else on the floor, the rules stack, later rules do not cancel earlier ones.


  three queues feed one processor, each queue has its own nightly cap, moto holds 63 items against a cap of 50, kilo holds 44 items against a cap of 50, lima holds 71 items against a cap of 50. the processor
  drains them in the order listed, it never reorders, it never revisits a queue once capped out. the arithmetic that matters is small, min of arrival and cap per queue, summed, nothing fancier.


  the cutoff rule came later than the caps, it was bolted on after a night when the processor ran hot past dawn. 150 is the combined ceiling, if the summed processed count reaches it mid-queue the remaining
  arrivals defer with everything else. tonight the numbers sit where they sit, work the rules in the order they were given.


  the log convention: an item is processed when the processor finishes it, arrival alone is not processing. the overnight batcher replays yesterday''s overflow before yours, that replay is not in these
  counts, it belongs to the prior ledger.


  the rules of the desk, as they stand tonight: 1. each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped. 2. the nightly cutoff is 150 processed items across
  all queues combined, if the summed processed count reaches or passes it the cutoff flag flips true, the flag is the report, nothing truncates, queues run to their caps regardless. 3. deferred means arrived
  but not processed, arrived items sitting in a capped-out queue are deferred.


  the facts of record: moto holds 63 items against a cap of 50, kilo holds 44 items against a cap of 50, lima holds 71 items against a cap of 50 queue moto: 63 arrived, cap 50, so 50 processed and 13 deferred
  queue kilo: 44 arrived, cap 50, so 44 processed and 0 deferred queue lima: 71 arrived, cap 50, so 50 processed and 21 deferred.


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


