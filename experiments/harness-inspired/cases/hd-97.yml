prompt: 'the graveyard begins with a handoff note that always ends the same way, trust the rules, not the totals, and tonight is one of those nights where every clause earns its keep.


  the sensor wall double-reports everything and the dedupe math is just honesty at scale, a minute covered twice is still one minute, and the pairwise total is kept separately precisely because it double-counts, that is its job


  empty windows happen when a sensor trips and untrips in the same breath, they are not distinct, they are barely real


  the desk sorts, merges, unions, then does the pairwise bookkeeping on the originals, never on the merged shape, the merged shape has forgotten the pairs


  the rules of the desk, as they stand tonight: 1. windows count minutes on the union, overlapping minutes count once no matter how many windows cover them, containment counts as overlap only strictly past the first shared minute, an empty window is not distinct. 2. pairwise overlap sums each pair''s shared minutes independently, triple-covered minutes therefore count multiple times in that sum and
  that is intentional, it is a pair statistic, not a union statistic. 3. the report wants union minutes, the pairwise overlap total, and the count of distinct non-empty windows.


  the facts of record: window w1 covers minute 0 through minute 50, window w2 covers minute 40 through minute 45, window w3 covers minute 60 through minute 90 the wall quotes no overlaps and no union tonight, every dedupe number derives from the three windows.


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


