success_criteria:
  deterministic_checks:
    json_exact: '{"union_minutes": 80, "pairwise_overlap_minutes": 5, "distinct_windows": 3}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - windows count minutes on the union, overlapping minutes count once no matter how many windows cover them, containment counts as overlap only strictly past the first shared minute, an empty window is not distinct
  - pairwise overlap sums each pair's shared minutes independently, triple-covered minutes therefore count multiple times in that sum and that is intentional, it is a pair statistic, not a union statistic
  - the report wants union minutes, the pairwise overlap total, and the count of distinct non-empty windows
  facts:
  - window w1 covers minute 0 through minute 50, window w2 covers minute 40 through minute 45, window w3 covers minute 60 through minute 90
  - the wall quotes no overlaps and no union tonight, every dedupe number derives from the three windows
  output_spec:
    union_minutes: int
    pairwise_overlap_minutes: int
    distinct_windows: int
contract:
  union_minutes:
    formula: max(0, e1 - s1) + max(0, e2 - max(s2, e1)) + max(0, e3 - max(s3, max(e1, e2)))
    literals:
    - name: s1
      regex: window w1 covers minute (\d+) through
      value: 0
    - name: s2
      regex: window w2 covers minute (\d+) through
      value: 40
    - name: s3
      regex: window w3 covers minute (\d+) through
      value: 60
    - name: e1
      regex: window w1 covers minute \d+ through minute (\d+)
      value: 50
    - name: e2
      regex: window w2 covers minute \d+ through minute (\d+)
      value: 45
    - name: e3
      regex: window w3 covers minute \d+ through minute (\d+)
      value: 90
  pairwise_overlap_minutes:
    formula: max(0, min(e1, e2) - max(s1, s2)) + max(0, min(e2, e3) - max(s2, s3)) + max(0, min(e1, e3) - max(s1, s3))
    literals: []
  distinct_windows:
    formula: (e1 > s1) + (e2 > s2) + (e3 > s3)
    literals: []
v6:
  entities:
  - id: s1
    question: window w1's start minute (copy the number from its fact line)
    answer: 0
  - id: s2
    question: window w2's start minute (copy the number from its fact line)
    answer: 40
  - id: s3
    question: window w3's start minute (copy the number from its fact line)
    answer: 60
  - id: e1
    question: window w1's end minute (copy the number from its fact line)
    answer: 50
  - id: e2
    question: window w2's end minute (copy the number from its fact line)
    answer: 45
  - id: e3
    question: window w3's end minute (copy the number from its fact line)
    answer: 90
  - id: uni
    question: union minutes across all three windows (count each covered minute once)
    answer: 80
  - id: pw
    question: total pairwise overlap in minutes (each pair's shared minutes summed)
    answer: 5
  - id: dist
    question: how many windows are distinct and non-empty (count them)
    answer: 3
  aggregate: '{''union_minutes'': (max(0, a(''e1'') - a(''s1'')) + max(0, max(0, a(''e2'') - max(a(''s2''), a(''e1''))) ) + max(0, a(''e3'') - max(a(''s3''), max(a(''e1''), a(''e2''))))), ''pairwise_overlap_minutes'': max(0, min(a(''e1''), a(''e2'')) - max(a(''s1''), a(''s2''))) + max(0, min(a(''e2''), a(''e3'')) - max(a(''s2''), a(''s3''))) + max(0, min(a(''e1''), a(''e3'')) - max(a(''s1''), a(''s3''))),
    ''distinct_windows'': (a(''e1'') > a(''s1'')) + (a(''e2'') > a(''s2'')) + (a(''e3'') > a(''s3''))}'
