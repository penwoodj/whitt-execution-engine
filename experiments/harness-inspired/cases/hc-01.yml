case_id: hc-01
category: field-ops
difficulty: light
hops: 3
archetype: queue_cutoff
variant: 0
domain: night queue processing
objective: derive processed, deferred, queues_over_cap, cutoff_hit from the stated rules
prompt: 'you are the dispatch supervisor for the deploy lane, the standing orders live in the runbook you helped write last spring, the cap is the cap, overages defer, they never drop silently.


  three queues feed one processor, each queue has its own nightly cap, alpha holds 34 items against a cap of 30, bravo holds 22 items against a cap of 30, charlie holds 41 items against a cap of 30. the
  processor drains them in the order listed, it never reorders, it never revisits a queue once capped out. the arithmetic that matters is small, min of arrival and cap per queue, summed, nothing fancier.


  the cutoff rule came later than the caps, it was bolted on after a night when the processor ran hot past dawn. 80 is the combined ceiling, if the summed processed count reaches it mid-queue the remaining
  arrivals defer with everything else. tonight the numbers sit where they sit, work the rules in the order they were given.


  the log convention: an item is processed when the processor finishes it, arrival alone is not processing. the overnight batcher replays yesterday''s overflow before yours, that replay is not in these
  counts, it belongs to the prior ledger.


  the rules of the desk, as they stand tonight: 1. each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped. 2. the nightly cutoff is 80 processed items across
  all queues combined, if the summed processed count reaches or passes it the cutoff flag flips true, the flag is the report, nothing truncates, queues run to their caps regardless. 3. deferred means arrived
  but not processed, arrived items sitting in a capped-out queue are deferred.


  the facts of record: alpha holds 34 items against a cap of 30, bravo holds 22 items against a cap of 30, charlie holds 41 items against a cap of 30 queue alpha: 34 arrived, cap 30, so 30 processed and
  4 deferred queue bravo: 22 arrived, cap 30, so 22 processed and 0 deferred queue charlie: 41 arrived, cap 30, so 30 processed and 11 deferred.


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


