auxiliary: all facts needed are in the prompt itself
provenance: 'processed = sum of min(arrival, cap) = 30 + 22 + 30 = 82

  deferred = sum of (arrival - cap where positive) = 4 + 0 + 11 = 15

  queues_over_cap = queues with arrival > cap = 2

  cutoff_hit = processed 82 >= nightly cutoff 80 is True

  archetype=queue_cutoff variant=0 seed=0'
success_criteria:
  deterministic_checks:
    json_exact: '{"processed": 82, "deferred": 15, "queues_over_cap": 2, "cutoff_hit": true}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped
  - the nightly cutoff is 80 processed items across all queues combined, if the summed processed count reaches or passes it the cutoff flag flips true, the flag is the report, nothing truncates, queues
    run to their caps regardless
  - deferred means arrived but not processed, arrived items sitting in a capped-out queue are deferred
  facts:
  - alpha holds 34 items against a cap of 30, bravo holds 22 items against a cap of 30, charlie holds 41 items against a cap of 30
  - 'queue alpha: 34 arrived, cap 30, so 30 processed and 4 deferred'
  - 'queue bravo: 22 arrived, cap 30, so 22 processed and 0 deferred'
  - 'queue charlie: 41 arrived, cap 30, so 30 processed and 11 deferred'
  output_spec:
    processed: int
    deferred: int
    queues_over_cap: int
    cutoff_hit: bool
contract:
  processed:
    formula: min(a1,c1)+min(a2,c2)+min(a3,c3)
    literals:
    - name: a1
      regex: alpha holds (\d+) items
      value: 34
    - name: c1
      regex: alpha holds \d+ items against a cap of (\d+)
      value: 30
    - name: a2
      regex: bravo holds (\d+) items
      value: 22
    - name: c2
      regex: bravo holds \d+ items against a cap of (\d+)
      value: 30
    - name: a3
      regex: charlie holds (\d+) items
      value: 41
    - name: c3
      regex: charlie holds \d+ items against a cap of (\d+)
      value: 30
  deferred:
    formula: max(a1-c1,0)+max(a2-c2,0)+max(a3-c3,0)
    literals: []
  queues_over_cap:
    formula: (a1>c1)+(a2>c2)+(a3>c3)
    literals: []
  cutoff_hit:
    formula: processed >= K
    literals:
    - name: K
      regex: nightly cutoff is (\d+) processed items
      value: 80
v6:
  entities:
  - id: processed_total
    question: total items processed tonight across all queues (sum of min(arrival, cap) per queue)
    answer: 82
  - id: deferred_total
    question: total items deferred tonight (arrival minus cap where positive, summed)
    answer: 15
  - id: over_cap_count
    question: how many queues exceeded their own cap (arrival strictly greater than cap)
    answer: 2
  - id: cutoff_flag
    question: did the combined processed count reach the nightly cutoff (true or false)
    answer: true
  aggregate: '{''processed'': int(a(''processed_total'')), ''deferred'': int(a(''deferred_total'')), ''queues_over_cap'': int(a(''over_cap_count'')), ''cutoff_hit'': bool(a(''cutoff_flag''))}'
