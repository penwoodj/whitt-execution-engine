prompt: 'run the sweep ledger for the night, the previous operator logged everything, verify nothing from memory, boundaries are inclusive unless a rule says otherwise, and these rules say otherwise where
  it matters.


  the specimen router decides the morning courier manifest, s-01 rides the cold band, logged 1 excursions, paperwork complete, s-02 rides the room band, logged 0 excursions, paperwork complete, s-03 rides
  the cold band, logged 3 excursions, paperwork incomplete, s-04 rides the frozen band, logged 0 excursions, paperwork complete. paperwork first, excursions second, band last as a label only. holds wait
  for a clinician, rejects go back to the floor, ships make the truck.


  the at-the-limit-ships clause matters, exactly at limit is compliant, over limit holds, the boundary rule reads the same as every boundary at this desk.


  the courier portal you do not manage reprints manifests with its own hold column, the portal column is a guess, this sheet is the manifest.


  the rules of the desk, as they stand tonight: 1. a sample with more than 2 temperature excursions holds for review, excursion means minutes outside band, at the limit ships. 2. incomplete paperwork rejects
  outright, rejection happens before any excursion math. 3. band labels travel with the sample but gate nothing tonight.


