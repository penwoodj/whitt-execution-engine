  the rules of the desk, as they stand tonight: 1. ledger entries carry sign at birth, debits negative, credits positive, sums are plain addition, the close reads the difference at-or-over one cent before calling a ledger higher, an exact tie names no winner. 2. diff is ledger a minus ledger b, sign included, unsigned diff is its absolute value, both reported. 3. the higher ledger is a name, a, b, or
  none, never a sentence.


  the facts of record: ledger a holds +250000, -100000, +50000 whole cents ledger b holds +200000, -60000, +90000 whole cents the bench quotes no sums tonight, both close from the entries alone.


