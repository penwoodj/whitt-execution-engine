domain: asset label surgery
objective: derive new_label, label_length, suffix_applied from the stated rules
prompt: 'the cascade board closes its ledger at 03:00 and everyone here treats that closing as gospel, the counts below are tonight''s, the rules below are forever.


  the tag press rebuilds labels by hand because the one time it was automated the automation kept the vowels it liked and dropped the ones it didn''t, character precision is not a mood, it is a rule


  the suffix bar sits strictly-past twelve characters tonight and the difference is one hyphen of consequence, a label that lands exactly on twelve either grows a tail or doesn''t


  the desk strips, joins, measures, appends, and counts, in that order, measuring after appending instead of before has embarrassed better desks


  the rules of the desk, as they stand tonight: 1. the rebuild keeps segment one untouched, strips every vowel from segment two, keeps segment three''s digits, then joins with hyphens. 2. the suffix rule reads the joined base length only strictly past twelve characters and appends -x when the bar is met, the suffix is part of the label and its length. 3. label length counts the final label including
  any suffix, characters only, hyphens count.


  the facts of record: the asset tag reads condenser-orbit-312 the press quotes no rebuilt form tonight, every segment derives from the tag itself the suffix bar reads from the joined base length, characters only, hyphens included.


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


