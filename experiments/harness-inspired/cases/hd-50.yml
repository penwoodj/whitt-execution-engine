task_core:
  rules:
  - the code is six digits read left to right, each digit times its weight, weights fixed at 3, 5, 7, 2, 4, 9 from the left, the weighted sum is plain addition of those products
  - the remainder is the weighted sum modulo 97, the check digit is 97 minus the remainder, wrapped to zero when the remainder is zero, a remainder of zero means the check digit is zero, the wrap stands strictly past nothing by definition and never otherwise
  - all arithmetic whole numbers, no digit exceeds nine, no weight changes position
  facts:
  - the code digits are 1, 5, 2, 8, 3, 7
  - the weights are 3, 5, 7, 2, 4, 9 from the left
  - the bench quotes no weighted sum tonight, it derives from the digits and the fixed weights
  output_spec:
    weighted_sum: int
    remainder: int
    check_digit: int
contract:
  weighted_sum:
    formula: d1 * 3 + d2 * 5 + d3 * 7 + d4 * 2 + d5 * 4 + d6 * 9
    literals:
    - name: d1
      regex: null
      value: 1
    - name: d2
      regex: null
      value: 5
    - name: d3
      regex: null
      value: 2
    - name: d4
      regex: null
      value: 8
    - name: d5
      regex: null
      value: 3
    - name: d6
