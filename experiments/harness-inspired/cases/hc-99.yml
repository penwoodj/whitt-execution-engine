provenance: 'flagged=2 clear=1 color_denied=3 largest=320

  archetype=print_quota variant=3 seed=98'
success_criteria:
  deterministic_checks:
    json_exact: '{"users_flagged": 2, "users_clear": 1, "color_jobs_denied": 3, "largest_job_pages": 320}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - page quota flags at exactly-at, same boundary convention as every quota desk here
  - color printing requires quota headroom, flagged users' color jobs deny outright, mono jobs pass with a warning
  - denied jobs do not print tonight, denial is not deferral
  facts:
  - s1 printed 310 of a 300 page monthly quota, s2 printed 299 of a 300 page monthly quota, s3 printed 300 of a 300 page monthly quota
  - the largest single job tonight ran 320 pages
  - 3 color jobs were denied at the counter
  output_spec:
    users_flagged: int
    users_clear: int
    color_jobs_denied: int
    largest_job_pages: int
contract:
  users_flagged:
    formula: (n1>=q1)+(n2>=q2)+(n3>=q3)
    literals:
    - name: n1
      regex: s1 printed (\d+) of
      value: 310
    - name: q1
      regex: s1 printed \d+ of a (\d+) page monthly quota
      value: 300
    - name: n2
      regex: s2 printed (\d+) of
      value: 299
    - name: q2
      regex: s2 printed \d+ of a (\d+) page monthly quota
      value: 300
    - name: n3
      regex: s3 printed (\d+) of
      value: 300
    - name: q3
      regex: s3 printed \d+ of a (\d+) page monthly quota
      value: 300
  users_clear:
    formula: 3 - users_flagged
    literals: []
v6:
  entities:
  - id: n1
    question: 'pages s1 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 310
  - id: n2
    question: 'pages s2 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 299
  - id: n3
    question: 'pages s3 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 300
  - id: q1
    question: 's1''s monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 300
  - id: q2
    question: 's2''s monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 300
  - id: q3
    question: 's3''s monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 300
  - id: cd
    question: 'color jobs denied tonight (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3
  - id: lp
    question: 'largest single job page count (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 320
  aggregate: '{''users_flagged'': (a(''n1'')>=a(''q1''))+(a(''n2'')>=a(''q2''))+(a(''n3'')>=a(''q3'')), ''users_clear'': (a(''n1'')<a(''q1''))+(a(''n2'')<a(''q2''))+(a(''n3'')<a(''q3'')), ''color_jobs_denied'':
    int(a(''cd'')), ''largest_job_pages'': int(a(''lp''))}'
