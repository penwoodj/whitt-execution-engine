case_id: ha-05
category: harness-ops
difficulty: heavy
hops: 6
archetype: cascade-token-budget
provenance: token budget; solve 1200 + fix1 900 + fix2 800 = 2900; fix3 skipped after fix2 pass (0); judge
  500 x1 -> 3400 <= 4000 so not UNVERIFIED; skipped fix count = 1
prompt: 'You enforce tonight''s token budget for one case''s quality cascade. The case

  runs stages in order: solve, fix1, fix2, fix3. Hard rules: the stage chain

  stops at the first passing deterministic check — every later fix stage is

  skipped and costs nothing. The judge stage runs only after a pass, once,

  costing its flat price. If the projected total (all stages that would really

  run, judge included) would exceed the 4000-token budget, the judge is

  skipped and the case is marked UNVERIFIED. Tonight''s costs: solve 1200

  tokens, fix1 900, fix2 800, fix3 700, judge 500. This run: solve failed,

  fix1 failed, fix2 passed, and fix3 plus everything after the pass followed

  the stop rule. A trace logger you do not manage writes shell-side logs that

  cost zero model tokens. Report the tokens actually spent, how many fix

  stages were skipped by the stop rule, and whether the case could be judge-

  verified. Output ONLY this JSON with exactly these keys:

  {"spend": N, "fixes_skipped": N, "verified": B}.'
objective: Compute cascade spend under stop-rule and projected-budget rule.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"spend": 3400, "fixes_skipped": 1, "verified": true}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: stage_solve, question: "tokens spent on solve (ran)", answer: 1200}
    - {id: stage_fix1, question: "tokens spent on fix1 (ran)", answer: 900}
    - {id: stage_fix2, question: "tokens spent on fix2 (ran)", answer: 800}
    - {id: stage_fix3, question: "tokens spent on fix3 (skipped)", answer: 0}
    - {id: stage_judge, question: "tokens spent on judge (ran)", answer: 500}
  aggregate: '{"spend": a(stage_solve) + a(stage_fix1) + a(stage_fix2) + a(stage_fix3) + a(stage_judge), "fixes_skipped": 1, "verified": (a(stage_solve) + a(stage_fix1) + a(stage_fix2) + a(stage_fix3) + a(stage_judge)) <= 4000}'
