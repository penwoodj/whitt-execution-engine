success_criteria:
  deterministic_checks:
    json_exact: '{"released_count": 3, "held_count": 1, "net_paid": 7550, "held_value": 1500}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rows over 1200 currency units hold for manual review unless the row carries an approved exception
  - held rows pay nothing tonight, they are not partial, they are not deferred pro-rated, they simply wait
  - the exception column is the only override, verbal approvals count for nothing at this desk
  facts:
  - row k pays 250 units, row m pays 3100 units with an approved exception, row n pays 1500 units, row o pays 4200 units with an approved exception
  output_spec:
    released_count: int
    held_count: int
    net_paid: int
    held_value: int
contract:
  held_count:
    formula: ((a1>T)*(1-x1))+((a2>T)*(1-x2))+((a3>T)*(1-x3))+((a4>T)*(1-x4))
    literals:
    - name: T
      regex: over (\d+) currency units hold
      value: 1200
    - name: a1
      regex: row k pays (\d+) units
      value: 250
    - name: x1
      regex: row k pays \d+ units( with an approved exception)?
      value: 0
      map: &id001
        ' with an approved exception': 1
    - name: a2
      regex: row m pays (\d+) units
      value: 3100
    - name: x2
      regex: row m pays \d+ units( with an approved exception)?
      value: 1
      map: &id002
        ' with an approved exception': 1
    - name: a3
      regex: row n pays (\d+) units
      value: 1500
    - name: x3
      regex: row n pays \d+ units( with an approved exception)?
      value: 0
      map: &id003
        ' with an approved exception': 1
    - name: a4
      regex: row o pays (\d+) units
      value: 4200
    - name: x4
      regex: row o pays \d+ units( with an approved exception)?
      value: 1
      map: &id004
        ' with an approved exception': 1
  held_value:
    formula: ((a1>T)*(1-x1)*a1)+((a2>T)*(1-x2)*a2)+((a3>T)*(1-x3)*a3)+((a4>T)*(1-x4)*a4)
    literals:
    - name: T
      regex: over (\d+) currency units hold
      value: 1200
    - name: a1
      regex: row k pays (\d+) units
      value: 250
    - name: x1
      regex: row k pays \d+ units( with an approved exception)?
      value: 0
      map: *id001
    - name: a2
      regex: row m pays (\d+) units
      value: 3100
    - name: x2
      regex: row m pays \d+ units( with an approved exception)?
      value: 1
      map: *id002
    - name: a3
      regex: row n pays (\d+) units
      value: 1500
    - name: x3
      regex: row n pays \d+ units( with an approved exception)?
      value: 0
      map: *id003
    - name: a4
      regex: row o pays (\d+) units
      value: 4200
    - name: x4
      regex: row o pays \d+ units( with an approved exception)?
      value: 1
      map: *id004
  released_count:
    formula: 4 - held_count
    literals: []
  net_paid:
    formula: (a1+a2+a3+a4) - held_value
    literals:
    - name: a1
      regex: row k pays (\d+) units
      value: 250
    - name: a2
      regex: row m pays (\d+) units
      value: 3100
    - name: a3
      regex: row n pays (\d+) units
      value: 1500
    - name: a4
      regex: row o pays (\d+) units
      value: 4200
v6:
  entities:
  - id: h1
    question: 'is row k HELD tonight, answer 1 if held or 0 if released. rule: held means the amount is OVER the hold threshold AND has no approved exception, amounts under the threshold are always released
      (0), over-threshold rows with an approved exception are also released (0). worked example: a row paying 400 against a 500 threshold is under the line, answer 0. hint: a row is held only when its amount
      is over the hold threshold AND it has no approved exception, under-threshold rows are always released, over-threshold rows with an approved exception are also released, answer exactly one word held
      or released.'
    answer: 0
  - id: h2
    question: 'is row m HELD tonight, answer 1 if held or 0 if released. rule: held means the amount is OVER the hold threshold AND has no approved exception, amounts under the threshold are always released
      (0), over-threshold rows with an approved exception are also released (0). worked example: a row paying 400 against a 500 threshold is under the line, answer 0. hint: a row is held only when its amount
      is over the hold threshold AND it has no approved exception, under-threshold rows are always released, over-threshold rows with an approved exception are also released, answer exactly one word held
      or released.'
    answer: 0
  - id: h3
    question: 'is row n HELD tonight, answer 1 if held or 0 if released. rule: held means the amount is OVER the hold threshold AND has no approved exception, amounts under the threshold are always released
      (0), over-threshold rows with an approved exception are also released (0). worked example: a row paying 400 against a 500 threshold is under the line, answer 0. hint: a row is held only when its amount
      is over the hold threshold AND it has no approved exception, under-threshold rows are always released, over-threshold rows with an approved exception are also released, answer exactly one word held
      or released.'
    answer: 1
  - id: h4
    question: 'is row o HELD tonight, answer 1 if held or 0 if released. rule: held means the amount is OVER the hold threshold AND has no approved exception, amounts under the threshold are always released
      (0), over-threshold rows with an approved exception are also released (0). worked example: a row paying 400 against a 500 threshold is under the line, answer 0. hint: a row is held only when its amount
      is over the hold threshold AND it has no approved exception, under-threshold rows are always released, over-threshold rows with an approved exception are also released, answer exactly one word held
      or released.'
    answer: 0
  - id: m1
    question: 'amount row k pays, copy the number from its fact line. hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 250
  - id: m2
    question: 'amount row m pays, copy the number from its fact line. hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3100
  - id: m3
    question: 'amount row n pays, copy the number from its fact line. hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 1500
  - id: m4
    question: 'amount row o pays, copy the number from its fact line. hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 4200
  - id: th
    question: 'the hold threshold in units, copy the number from the rules. hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 1200
  aggregate: '{''released_count'': (1-a(''h1''))+(1-a(''h2''))+(1-a(''h3''))+(1-a(''h4'')), ''held_count'': a(''h1'')+a(''h2'')+a(''h3'')+a(''h4''), ''net_paid'': a(''m1'')*(1-a(''h1''))+a(''m2'')*(1-a(''h2''))+a(''m3'')*(1-a(''h3''))+a(''m4'')*(1-a(''h4'')),
    ''held_value'': a(''m1'')*a(''h1'')+a(''m2'')*a(''h2'')+a(''m3'')*a(''h3'')+a(''m4'')*a(''h4'')}'
