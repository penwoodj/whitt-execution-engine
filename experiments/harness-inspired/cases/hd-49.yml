prompt: 'the graveyard crew calls the cascade board the oracle, mostly affectionately, occasionally in vain, and tonight is one of those nights where every clause earns its keep.


  the tag press rebuilds labels by hand because the one time it was automated the automation kept the vowels it liked and dropped the ones it didn''t, character precision is not a mood, it is a rule


  the suffix bar sits strictly-past twelve characters tonight and the difference is one hyphen of consequence, a label that lands exactly on twelve either grows a tail or doesn''t


  the desk strips, joins, measures, appends, and counts, in that order, measuring after appending instead of before has embarrassed better desks


  the rules of the desk, as they stand tonight: 1. the rebuild keeps segment one untouched, strips every vowel from segment two, keeps segment three''s digits, then joins with hyphens. 2. the suffix rule reads the joined base length only strictly past twelve characters and appends -x when the bar is met, the suffix is part of the label and its length. 3. label length counts the final label including
  any suffix, characters only, hyphens count.


  the facts of record: the asset tag reads turbine-echo-42 the press quotes no rebuilt form tonight, every segment derives from the tag itself the suffix bar reads from the joined base length, characters only, hyphens included.


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


  the margin notes in the binder argue with each other in three different hands, the rules themselves have never once argued back


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


