prompt: 'the evening crew calls the room comb the oracle, mostly affectionately, occasionally in vain, so the desk works the problem the slow way, on purpose.


  the rota wheel is arithmetic wearing a hi-vis vest, pins shrink the modulus, the modulus is the moving count, and anyone who mods by the roster size gets to explain themselves at the morning huddle


  tonight''s wrap flag is about whether the steps went strictly past the roster size, which sounds ceremonial until payroll asks why a six-slot rota paid out nine shifts


  the desk computes moving count first, landing second, wrap last, and never lets the wrap flag leak into the landing math, they are separate clauses with separate jobs


  the rules of the desk, as they stand tonight: 1. the carousel advances one slot per step, pinned slots are skipped and never landed on, landing is modulo the moving count, not the roster. 2. a shift requires a fresh landing only when steps go strictly past the roster size — the wrap flag records whether tonight''s steps reached that bar, the flag is true only then. 3. the landed index counts only
  moving slots, pins shrink the modulus, the roster number itself never changes.


  the facts of record: the rota holds 9 slots and tonight''s holder sits at index 4 the rota advances 25 steps tonight 2 slots are pinned tonight and the moving count works out to 7.


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


  old hands say the arithmetic is the easy ten percent, the other ninety is remembering which convention tonight''s boundary clause uses, they say it while checking the clause again


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


