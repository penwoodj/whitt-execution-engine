auxiliary: all facts needed are in the prompt itself
provenance: 'touched=550 evicted=110 retained=431 dupes=9

  archetype=cache_sweep variant=1 seed=29'
success_criteria:
  deterministic_checks:
    json_exact: '{"touched": 550, "evicted": 110, "retained": 431, "dupes_folded": 9}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each class carries its own retention ceiling, entries beyond the ceiling are eviction candidates, nothing else is
  - duplicated entries fold into one before any counting, a dupe never counts twice anywhere
  - pinned entries survive every sweep, they are counted in retained, never in evicted
  facts:
  - the edges class holds 340 entries against a ceiling of 300, the mid class holds 150 entries against a ceiling of 100, the deep class holds 60 entries against a ceiling of 40
  - 9 entries turned out to be duplicates folded away before counting
  - 22 entries are pinned across all classes
  output_spec:
    touched: int
    evicted: int
    retained: int
    dupes_folded: int
contract:
  touched:
    formula: h1+h2+h3
    literals:
    - name: h1
      regex: the edges class holds (\d+) entries
      value: 340
    - name: h2
      regex: the mid class holds (\d+) entries
      value: 150
    - name: h3
      regex: the deep class holds (\d+) entries
      value: 60
    - name: c1
      regex: the edges class holds \d+ entries against a ceiling of (\d+)
      value: 300
    - name: c2
      regex: the mid class holds \d+ entries against a ceiling of (\d+)
      value: 100
    - name: c3
      regex: the deep class holds \d+ entries against a ceiling of (\d+)
      value: 40
  evicted:
    formula: max(h1-c1,0)+max(h2-c2,0)+max(h3-c3,0)
    literals: []
  retained:
    formula: touched - evicted - D
    literals:
    - name: D
      regex: (\d+) entries turned out to be duplicates
      value: 9
  dupes_folded:
    formula: D
    literals: []
v6:
  entities:
  - id: h1
    question: 'entries the edges class holds (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 340
  - id: h2
    question: 'entries the mid class holds (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 150
  - id: h3
    question: 'entries the deep class holds (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 60
  - id: c1
    question: 'the edges class ceiling (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 300
  - id: c2
    question: 'the mid class ceiling (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 100
  - id: c3
    question: 'the deep class ceiling (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 40
  - id: d
    question: 'duplicate entries folded away (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 9
  aggregate: '{''touched'': a(''h1'')+a(''h2'')+a(''h3''), ''evicted'': max(a(''h1'')-a(''c1''),0)+max(a(''h2'')-a(''c2''),0)+max(a(''h3'')-a(''c3''),0), ''retained'': a(''h1'')+a(''h2'')+a(''h3'')-(max(a(''h1'')-a(''c1''),0)+max(a(''h2'')-a(''c2''),0)+max(a(''h3'')-a(''c3''),0))-a(''d''),
    ''dupes_folded'': a(''d'')}'
