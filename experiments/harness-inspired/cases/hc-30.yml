domain: cache invalidation sweeps
objective: derive touched, evicted, retained, dupes_folded from the stated rules
prompt: 'the quota desk is your assignment, the rules below came from a postmortem nobody wants repeated, boundaries are inclusive unless a rule says otherwise, and these rules say otherwise where it matters.


  the sweep ledger closes tonight, the edges class holds 340 entries against a ceiling of 300, the mid class holds 150 entries against a ceiling of 100, the deep class holds 60 entries against a ceiling
  of 40, 9 entries turned out to be duplicates folded away before counting, 22 entries are pinned across all classes. fold dupes first, then apply ceilings class by class, pinned rides through untouched.
  the retained number people quote in the morning is what is left, not what started.


  the dupe rule was a hard lesson, two crawlers wrote the same keys for a month and every report doubled. fold first, always fold first, then the ceilings mean something.


  the pin list belongs to the platform team, entries land on it for reasons the sweep does not audit, pins are facts here, not decisions.


  the rules of the desk, as they stand tonight: 1. each class carries its own retention ceiling, entries beyond the ceiling are eviction candidates, nothing else is. 2. duplicated entries fold into one
  before any counting, a dupe never counts twice anywhere. 3. pinned entries survive every sweep, they are counted in retained, never in evicted.


  the facts of record: the edges class holds 340 entries against a ceiling of 300, the mid class holds 150 entries against a ceiling of 100, the deep class holds 60 entries against a ceiling of 40 9 entries
  turned out to be duplicates folded away before counting 22 entries are pinned across all classes.


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


