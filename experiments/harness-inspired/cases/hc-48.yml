case_id: hc-48
category: field-ops
difficulty: light
hops: 3
archetype: hold_shelf
variant: 1
domain: library hold shelves
objective: derive active_holds, expired_released, renewals_used, picked_up from the stated rules
prompt: 'the sweep ledger is your assignment, the rules below came from a postmortem nobody wants repeated, exactly-once means exactly-once, no charity.


  the hold shelf audit runs weekly, 45 holds sat on the shelf this week, 10 expired and released, 20 renewals were used, 17 items were picked up. expired releases leave the active count first, renewals
  and pickups describe the survivors, the active number is holds minus released and nothing subtler.


  release-is-final was not always the rule, the grace week doubled the shelf and halved the pickups, final means final since.


  the catalog kiosk you do not manage displays holds in transit separately, in-transit items are not on this shelf and never were.


  the rules of the desk, as they stand tonight: 1. holds expire after seven days on the shelf, expired holds release the item back to circulation, release is final. 2. patrons may renew a hold up to 2 times,
  renewals reset nothing else. 3. pickup removes the hold entirely, picked-up items leave the ledger.


  the facts of record: 45 holds sat on the shelf this week 10 expired and released 20 renewals were used 17 items were picked up.


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


