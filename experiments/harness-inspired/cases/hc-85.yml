case_id: hc-85
category: field-ops
difficulty: light
hops: 4
archetype: token_bucket
variant: 3
domain: rate limiter token pools
objective: derive served, throttled, capacity, refill_added from the stated rules
prompt: 'you are standing in as dispatch supervisor, the deploy lane does not care who you are, only that the rules hold, partial work counts as nothing at the cutoff.


  the rate gate runs one pool, slot up opened with 14 tokens of its 40 capacity, slot down opened with 2 tokens of its 35 capacity, slot side opened with 0 tokens of its 20 capacity, the window refill added
  5 tokens, 71 requests arrived this window. pool everything, add the refill once, serve until dry, everything left over is throttled and gone. capacity is bookkeeping, it bounds nothing tonight except
  the morning report.


  pooling replaced per-slot fairness after a night where one hot slot starved two quiet ones, the pool does not care who brought the tokens.


  the edge cache you do not manage also serves some requests before they reach the gate, edge-served requests never appear in the arrival count and never will.


  the rules of the desk, as they stand tonight: 1. all slots pool into one serving pool, there is no per-slot fairness, the pool serves in arrival order. 2. the refill adds 5 tokens once at the top of the
  window, mid-window refills do not exist. 3. throttled requests are rejected, not queued, rejected means gone.


  the facts of record: slot up opened with 14 tokens of its 40 capacity, slot down opened with 2 tokens of its 35 capacity, slot side opened with 0 tokens of its 20 capacity the window refill added 5 tokens
  71 requests arrived this window.


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


