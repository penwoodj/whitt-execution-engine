auxiliary: all facts needed are in the prompt itself
provenance: 'served=21 throttled=50 capacity=95 refill=5

  archetype=token_bucket variant=3 seed=84'
success_criteria:
  deterministic_checks:
    json_exact: '{"served": 21, "throttled": 50, "capacity": 95, "refill_added": 5}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - all slots pool into one serving pool, there is no per-slot fairness, the pool serves in arrival order
  - the refill adds 5 tokens once at the top of the window, mid-window refills do not exist
  - throttled requests are rejected, not queued, rejected means gone
  facts:
  - slot up opened with 14 tokens of its 40 capacity, slot down opened with 2 tokens of its 35 capacity, slot side opened with 0 tokens of its 20 capacity
  - the window refill added 5 tokens
  - 71 requests arrived this window
  output_spec:
    served: int
    throttled: int
    capacity: int
    refill_added: int
contract:
  served:
    formula: min(REQ, s1+s2+s3+REF)
    literals:
    - name: REQ
      regex: (\d+) requests arrived this window
      value: 71
    - name: REF
      regex: refill added (\d+) tokens
      value: 5
    - name: s1
      regex: slot up opened with (\d+) tokens
      value: 14
    - name: s2
      regex: slot down opened with (\d+) tokens
      value: 2
    - name: s3
      regex: slot side opened with (\d+) tokens
      value: 0
    - name: c1
      regex: slot up opened with \d+ tokens of its (\d+) capacity
      value: 40
    - name: c2
      regex: slot down opened with \d+ tokens of its (\d+) capacity
      value: 35
    - name: c3
      regex: slot side opened with \d+ tokens of its (\d+) capacity
      value: 20
  throttled:
    formula: REQ - served
    literals: []
  capacity:
    formula: c1+c2+c3
    literals: []
v6:
  entities:
  - id: sv
    question: requests served this window
    answer: 21
  - id: th
    question: requests throttled (rejected, not queued)
    answer: 50
  - id: cap
    question: total pool capacity (slot capacities summed)
    answer: 95
  - id: rf
    question: tokens the window refill added
    answer: 5
  aggregate: '{''served'': int(a(''sv'')), ''throttled'': int(a(''th'')), ''capacity'': int(a(''cap'')), ''refill_added'': int(a(''rf''))}'
