auxiliary: all facts needed are in the prompt itself
provenance: 'over=1 under=0 vent_min=15 overrides=0

  archetype=vent_control variant=2 seed=74'
success_criteria:
  deterministic_checks:
    json_exact: '{"zones_over": 1, "zones_under": 0, "vent_minutes": 15, "overrides_active": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - zones above 32 degrees vent until back in band, vent minutes accrue per zone per excursion
  - zones below 20 degrees heat, heating never counts against vent minutes
  - manual overrides lock a zone's vents closed, overrides are counted and never argued with
  facts:
  - zone w1 reads 33 degrees with 15 vent minutes logged, zone w2 reads 21 degrees with 2 vent minutes logged, zone w3 reads 26 degrees with 6 vent minutes logged
  - the high band edge is 32, the low edge is 20
  - 0 manual overrides are active tonight
  output_spec:
    zones_over: int
    zones_under: int
    vent_minutes: int
    overrides_active: int
contract:
  zones_over:
    formula: (t1>H)+(t2>H)+(t3>H)
    literals:
    - name: t1
      regex: zone w1 reads (\d+) degrees
      value: 33
    - name: t2
      regex: zone w2 reads (\d+) degrees
      value: 21
    - name: t3
      regex: zone w3 reads (\d+) degrees
      value: 26
    - name: H
      regex: high band edge is (\d+)
      value: 32
  zones_under:
    formula: (t1<L)+(t2<L)+(t3<L)
    literals:
    - name: L
      regex: low edge is (\d+)
      value: 20
  vent_minutes:
    formula: m1*(t1>H)+m2*(t2>H)+m3*(t3>H)
    literals:
    - name: m1
      regex: zone w1 reads \d+ degrees with (\d+) vent minutes
      value: 15
    - name: m2
      regex: zone w2 reads \d+ degrees with (\d+) vent minutes
      value: 2
    - name: m3
      regex: zone w3 reads \d+ degrees with (\d+) vent minutes
      value: 6
v6:
  entities:
  - id: t1
    question: 'zone w1''s current reading in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 33
  - id: t2
    question: 'zone w2''s current reading in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 21
  - id: t3
    question: 'zone w3''s current reading in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 26
  - id: m1
    question: 'zone w1''s logged vent minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 15
  - id: m2
    question: 'zone w2''s logged vent minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2
  - id: m3
    question: 'zone w3''s logged vent minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 6
  - id: hi
    question: 'the high band edge in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 32
  - id: lo
    question: 'the low band edge in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 20
  - id: oa
    question: 'manual overrides active (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 0
  aggregate: '{''zones_over'': (a(''t1'')>a(''hi''))+(a(''t2'')>a(''hi''))+(a(''t3'')>a(''hi'')), ''zones_under'': (a(''t1'')<a(''lo''))+(a(''t2'')<a(''lo''))+(a(''t3'')<a(''lo'')), ''vent_minutes'': a(''m1'')*(a(''t1'')>a(''hi''))+a(''m2'')*(a(''t2'')>a(''hi''))+a(''m3'')*(a(''t3'')>a(''hi'')),
    ''overrides_active'': int(a(''oa''))}'
