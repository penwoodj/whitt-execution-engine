  the vent controller reports by zone, zone w1 reads 33 degrees with 15 vent minutes logged, zone w2 reads 21 degrees with 2 vent minutes logged, zone w3 reads 26 degrees with 6 vent minutes logged, the
  high band edge is 32, the low edge is 20, 0 manual overrides are active tonight. band edges are strict, above high vents, below low heats, in-band idles. vent minutes sum only for over-band zones, overrides
  lock zones out but still count as overrides.


  strict edges won after a season of hysteresis arguments, the controller now believes the thermometer and nothing else.


  the weather feed you do not manage forecasts band shifts overnight, forecasts do not move actuators, readings do.


  the rules of the desk, as they stand tonight: 1. zones above 32 degrees vent until back in band, vent minutes accrue per zone per excursion. 2. zones below 20 degrees heat, heating never counts against
  vent minutes. 3. manual overrides lock a zone''s vents closed, overrides are counted and never argued with.


  the facts of record: zone w1 reads 33 degrees with 15 vent minutes logged, zone w2 reads 21 degrees with 2 vent minutes logged, zone w3 reads 26 degrees with 6 vent minutes logged the high band edge is
  32, the low edge is 20 0 manual overrides are active tonight.


