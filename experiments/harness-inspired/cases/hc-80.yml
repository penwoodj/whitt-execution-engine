prompt: 'the day crew handed you the sweep ledger with a shrug, the runbook is thinner than they admit, these rules bind, boundaries are inclusive unless a rule says otherwise, and these rules say otherwise
  where it matters.


  the sweep ledger closes tonight, the fast class holds 410 entries against a ceiling of 380, the slow class holds 190 entries against a ceiling of 150, the archive class holds 75 entries against a ceiling
  of 30, 17 entries turned out to be duplicates folded away before counting, 31 entries are pinned across all classes. fold dupes first, then apply ceilings class by class, pinned rides through untouched.
  the retained number people quote in the morning is what is left, not what started.


  the dupe rule was a hard lesson, two crawlers wrote the same keys for a month and every report doubled. fold first, always fold first, then the ceilings mean something.


  the pin list belongs to the platform team, entries land on it for reasons the sweep does not audit, pins are facts here, not decisions.


  the rules of the desk, as they stand tonight: 1. each class carries its own retention ceiling, entries beyond the ceiling are eviction candidates, nothing else is. 2. duplicated entries fold into one
  before any counting, a dupe never counts twice anywhere. 3. pinned entries survive every sweep, they are counted in retained, never in evicted.


  the facts of record: the fast class holds 410 entries against a ceiling of 380, the slow class holds 190 entries against a ceiling of 150, the archive class holds 75 entries against a ceiling of 30 17
