auxiliary: all facts needed are in the prompt itself
provenance: 'touched=675 evicted=115 retained=543 dupes=17

  archetype=cache_sweep variant=3 seed=79'
success_criteria:
  deterministic_checks:
    json_exact: '{"touched": 675, "evicted": 115, "retained": 543, "dupes_folded": 17}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each class carries its own retention ceiling, entries beyond the ceiling are eviction candidates, nothing else is
  - duplicated entries fold into one before any counting, a dupe never counts twice anywhere
  - pinned entries survive every sweep, they are counted in retained, never in evicted
  facts:
  - the fast class holds 410 entries against a ceiling of 380, the slow class holds 190 entries against a ceiling of 150, the archive class holds 75 entries against a ceiling of 30
  - 17 entries turned out to be duplicates folded away before counting
  - 31 entries are pinned across all classes
  output_spec:
    touched: int
    evicted: int
    retained: int
    dupes_folded: int
contract:
  touched:
    formula: h1+h2+h3
    literals:
    - name: h1
      regex: the fast class holds (\d+) entries
      value: 410
    - name: h2
      regex: the slow class holds (\d+) entries
      value: 190
    - name: h3
      regex: the archive class holds (\d+) entries
      value: 75
    - name: c1
      regex: the fast class holds \d+ entries against a ceiling of (\d+)
      value: 380
    - name: c2
      regex: the slow class holds \d+ entries against a ceiling of (\d+)
      value: 150
    - name: c3
      regex: the archive class holds \d+ entries against a ceiling of (\d+)
      value: 30
  evicted:
    formula: max(h1-c1,0)+max(h2-c2,0)+max(h3-c3,0)
    literals: []
  retained:
    formula: touched - evicted - D
    literals:
    - name: D
      regex: (\d+) entries turned out to be duplicates
      value: 17
  dupes_folded:
    formula: D
    literals: []
v6:
  entities:
  - id: h1
    question: 'entries the fast class holds (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 410
  - id: h2
    question: 'entries the slow class holds (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 190
  - id: h3
    question: 'entries the archive class holds (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 75
  - id: c1
    question: 'the fast class ceiling (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 380
  - id: c2
    question: 'the slow class ceiling (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 150
  - id: c3
    question: 'the archive class ceiling (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 30
  - id: d
    question: 'duplicate entries folded away (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 17
  aggregate: '{''touched'': a(''h1'')+a(''h2'')+a(''h3''), ''evicted'': max(a(''h1'')-a(''c1''),0)+max(a(''h2'')-a(''c2''),0)+max(a(''h3'')-a(''c3''),0), ''retained'': a(''h1'')+a(''h2'')+a(''h3'')-(max(a(''h1'')-a(''c1''),0)+max(a(''h2'')-a(''c2''),0)+max(a(''h3'')-a(''c3''),0))-a(''d''),
    ''dupes_folded'': a(''d'')}'
