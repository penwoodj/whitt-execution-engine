success_criteria:
  deterministic_checks:
    json_exact: '{"landed_index": 0, "pinned_count": 1, "wrapped": true}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - the carousel advances one slot per step, pinned slots are skipped and never landed on, landing is modulo the moving count, not the roster
  - a shift requires a fresh landing when steps at-or-over the roster size — the wrap flag records whether tonight's steps reached that bar, the flag is true only then
  - the landed index counts only moving slots, pins shrink the modulus, the roster number itself never changes
  facts:
  - the rota holds 7 slots and tonight's holder sits at index 2
  - the rota advances 16 steps tonight
  - 1 slots are pinned tonight and the moving count works out to 6
  output_spec:
    landed_index: int
    pinned_count: int
    wrapped: bool
contract:
  landed_index:
    formula: (start + steps) % (N - pins)
    literals:
    - name: start
      regex: holder sits at index (\d+)
      value: 2
    - name: steps
      regex: advances (\d+) steps
      value: 16
    - name: N
      regex: rota holds (\d+) slots
      value: 7
    - name: pins
      regex: (\d+) slots are pinned
      value: 1
  pinned_count:
    formula: pins
    literals: []
  wrapped:
    formula: bool((steps >= N))
    literals: []
v6:
  entities:
  - id: N
    question: rota slot count (copy the number from its fact line)
    answer: 7
  - id: start
    question: tonight's holder index (copy the number from its fact line)
    answer: 2
  - id: steps
    question: steps advanced tonight (copy the number from its fact line)
    answer: 16
  - id: pins
    question: pinned slot count (copy the number from its fact line)
    answer: 1
  - id: moving
    question: the moving count (roster minus pins)
    answer: 6
  - id: landed
    question: the landed index (holder index plus steps, modulo the moving count)
    answer: 0
  - id: wrapped
    question: did tonight's steps reach the wrap bar, true or false (apply the boundary word to steps vs roster size)
    answer: true
  aggregate: '{''landed_index'': (a(''start'') + a(''steps'')) % (a(''N'') - a(''pins'')), ''pinned_count'': int(a(''pins'')), ''wrapped'': bool(a(''steps'') >= a(''N''))}'
