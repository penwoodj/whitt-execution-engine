case_id: ha-10
category: harness-ops
difficulty: heavy
hops: 5
archetype: leak-safe-feedback
provenance: leak policy; r1 feedback names check only (allowed); r2 feedback quotes expected value (VIOLATION
  -> case INVALID regardless); r3 names missing check (allowed, moot); outputs r1 fail, r2 pass, r3 pass
  -> verdict INVALID, violating round 2
prompt: 'You audit fix-loop feedback for a leaked-answer policy. Policy: feedback MAY

  name failing checks and their failure category; feedback MUST NOT quote

  expected values, golden answers, or correct outputs. The FIRST violation

  voids the whole evaluation — the case is marked INVALID from that round on,

  no matter what later rounds do. A case ran 3 fix rounds: round 1 feedback

  said "json_exact: FAIL, wrong values" (names check, no values). Round 2

  feedback said "expected {\"a\": 3}" — quoting the golden value. Round 3

  feedback said "contains:timeout missing" (names a check, no values). The

  fixer''s outputs: round 1 failed its re-check, round 2 passed, round 3

  passed. The judge never sees feedback, only artifacts, which does not repair

  a violation. A prompt-history recorder you do not manage also archives all

  feedback text, and archiving has no effect on verdicts. Report the case''s

  final verdict under the policy and the round

  number of the first violation. Output ONLY this JSON with exactly these

  keys: {"verdict": V, "violating_round": N}.'
objective: Apply leak-safe feedback policy to classify a case INVALID.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"verdict": "INVALID", "violating_round": 2}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: round_1, question: "policy verdict for round 1 feedback — policy: naming failing checks and categories is ALLOWED; quoting expected/golden values is a VIOLATION; answer exactly one word: allowed or VIOLATION. Round 1 said 'json_exact: FAIL, wrong values' (names check, no values)", answer: "allowed"}
    - {id: round_2, question: "policy verdict for round 2 feedback — policy: naming failing checks and categories is ALLOWED; quoting expected/golden values is a VIOLATION; answer exactly one word: allowed or VIOLATION. Round 2 said 'expected {\"a\": 3}' (quotes the golden value)", answer: "VIOLATION"}
    - {id: round_3, question: "policy verdict for round 3 feedback — policy: naming failing checks and categories is ALLOWED; quoting expected/golden values is a VIOLATION; answer exactly one word: allowed or VIOLATION. Round 3 said 'contains:timeout missing' (names check, no values)", answer: "allowed"}
  aggregate: '{"verdict": "INVALID", "violating_round": 2}'
