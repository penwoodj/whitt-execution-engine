auxiliary: all facts needed are in the prompt itself
provenance: 'dlq=112 poison=6 recovered=53 unrecovered=59

  archetype=dlq_redrive variant=1 seed=38'
success_criteria:
  deterministic_checks:
    json_exact: '{"dlq_total": 112, "poison_dead": 6, "recovered": 53, "unrecovered": 59}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a message that failed 3 or more delivery attempts is poison, poison never redrives
  - redrive replays everything else once, a fixed fraction comes back healthy tonight, the rest return to the queue
  - poison counting is per topic but the poison threshold is global
  facts:
  - the telemetry shelf holds 90 messages this morning, the alerts shelf holds 22 messages this morning
  - the poison threshold is 3 failed attempts
  - redrive recovers 50 percent of non-poison messages tonight
  output_spec:
    dlq_total: int
    poison_dead: int
    recovered: int
    unrecovered: int
contract:
  dlq_total:
    formula: c1+c2
    literals:
    - name: c1
      regex: the telemetry shelf holds (\d+) messages
      value: 90
    - name: c2
      regex: the alerts shelf holds (\d+) messages
      value: 22
  poison_dead:
    formula: 2*P
    literals:
    - name: P
      regex: poison threshold is (\d+)
      value: 3
  recovered:
    formula: int((dlq_total - poison_dead) * F / 100)
    literals:
    - name: F
      regex: redrive recovers (\d+) percent
      value: 50
v6:
  entities:
  - id: c1
    question: 'messages on the telemetry shelf (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 90
  - id: c2
    question: 'messages on the alerts shelf (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 22
  - id: pt
    question: 'the poison threshold in failed attempts (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3
  - id: fp
    question: 'percent of non-poison messages the redrive recovers (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 50
  aggregate: '{''dlq_total'': a(''c1'')+a(''c2''), ''poison_dead'': 2*a(''pt''), ''recovered'': int((a(''c1'')+a(''c2'')-2*a(''pt''))*a(''fp'')/100), ''unrecovered'': (a(''c1'')+a(''c2''))-int((a(''c1'')+a(''c2'')-2*a(''pt''))*a(''fp'')/100)}'
