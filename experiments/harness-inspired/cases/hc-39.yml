prompt: 'you run the seating sheet during the early window, the escalation path is you, then still you, a thing only counts once, no matter how many lists it appears on.


  the dead-letter shelf gets swept at dawn, the telemetry shelf holds 90 messages this morning, the alerts shelf holds 22 messages this morning, the poison threshold is 3 failed attempts, redrive recovers
  50 percent of non-poison messages tonight. poison is quarantined first and never moves again, the rest take one redrive ride, whatever survives the ride counts as recovered, whatever does not goes back
  on the shelf.


  the fraction is honest tonight, the queue crew measured it last week, on bad nights it lies, tonight it does not.


  the shadow consumer you do not manage re-reads the shelf for its own metrics, shadow reads neither recover nor poison anything.


  the rules of the desk, as they stand tonight: 1. a message that failed 3 or more delivery attempts is poison, poison never redrives. 2. redrive replays everything else once, a fixed fraction comes back
  healthy tonight, the rest return to the queue. 3. poison counting is per topic but the poison threshold is global.


  the facts of record: the telemetry shelf holds 90 messages this morning, the alerts shelf holds 22 messages this morning the poison threshold is 3 failed attempts redrive recovers 50 percent of non-poison
  messages tonight.


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


