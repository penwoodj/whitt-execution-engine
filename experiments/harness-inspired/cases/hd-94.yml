  strictly-past the threshold is tonight''s divert word, a total sitting exactly on the line is either spoiled or saved by that word alone, the desk reads it twice


  the worst leg gets named in the report because the warehouse and the carrier argue about whose minutes they were, the desk does not referee, it just reports the maximum


  the rules of the desk, as they stand tonight: 1. a leg accrues excursion minutes while its cargo reads above eight degrees, minutes are whole and additive across legs. 2. the shipment diverts when total excursion is strictly past the divert threshold, the threshold is total minutes, never per leg. 3. worst leg is the single largest leg excursion, reported separately because the warehouse argues about
  it.


  the facts of record: m-2 logged 11 excursion minutes, m-3 logged 9 excursion minutes, m-4 logged 2 excursion minutes the divert threshold is 18 total minutes the line quotes no total tonight, the desk sums the legs itself.


