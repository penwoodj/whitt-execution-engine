success_criteria:
  deterministic_checks:
    json_exact: '{"travelers_flagged": 1, "total_reimbursed_cents": 162000, "clawed_back_cents": 3000}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - per-diem cap is the nightly rate times nights, a claim flags only when strictly past its cap, flagging is about the claim, not the payout
  - reimbursement pays the smaller of submitted and cap, whole cents, never negative, never rounded
  - clawed back is the part of flagged claims above their caps, summed across flagged travelers only
  facts:
  - the nightly rate is 15000 whole cents
  - trip-9 spent 5 nights and submitted 78000 whole cents, trip-8 spent 2 nights and submitted 30000 whole cents, trip-7 spent 4 nights and submitted 57000 whole cents
  - the booth recomputes every cap and every payout from the rate and the nights
  output_spec:
    travelers_flagged: int
    total_reimbursed_cents: int
    clawed_back_cents: int
contract:
  travelers_flagged:
    formula: (s1 > (rate * k1)) + (s2 > (rate * k2)) + (s3 > (rate * k3))
    literals:
    - name: s1
      regex: trip-9 spent \d+ nights and submitted (\d+) whole cents
      value: 78000
    - name: s2
      regex: trip-8 spent \d+ nights and submitted (\d+) whole cents
      value: 30000
    - name: s3
      regex: trip-7 spent \d+ nights and submitted (\d+) whole cents
      value: 57000
    - name: k1
      regex: trip-9 spent (\d+) nights
      value: 5
    - name: k2
      regex: trip-8 spent (\d+) nights
      value: 2
    - name: k3
      regex: trip-7 spent (\d+) nights
      value: 4
    - name: rate
      regex: nightly rate is (\d+) whole cents
      value: 15000
  total_reimbursed_cents:
    formula: min(s1, (rate * k1)) + min(s2, (rate * k2)) + min(s3, (rate * k3))
    literals:
    - name: k1
      regex: trip-9 spent (\d+) nights
      value: 5
    - name: k2
      regex: trip-8 spent (\d+) nights
      value: 2
    - name: k3
      regex: trip-7 spent (\d+) nights
      value: 4
    - name: rate
      regex: nightly rate is (\d+) whole cents
      value: 15000
    - name: s1
      regex: trip-9 spent \d+ nights and submitted (\d+) whole cents
      value: 78000
    - name: s2
      regex: trip-8 spent \d+ nights and submitted (\d+) whole cents
      value: 30000
    - name: s3
      regex: trip-7 spent \d+ nights and submitted (\d+) whole cents
      value: 57000
  clawed_back_cents:
    formula: ((s1 > (rate * k1)) and (s1 - (rate * k1)) or 0) + ((s2 > (rate * k2)) and (s2 - (rate * k2)) or 0) + ((s3 > (rate * k3)) and (s3 - (rate * k3)) or 0)
    literals: []
