prompt: 'the poison sieve has opinions, the boundary desk has the binder, the binder wins every argument, and tonight is one of those nights where every clause earns its keep.


  the per-diem booth processes three claims tonight and the only debate is the flag line, strictly-past the cap, a claim that lands exactly on its cap is the classic desk argument, settled by tonight''s convention and re-argued every night after


  the payout itself is boring, the smaller of two numbers, the interesting part is what the flag implies for next quarter''s advance, which is why the flag word gets read carefully


  clawback accounting only ever touches flagged claims, unflagged claims contribute nothing to the claw total, not even their rounding dust


  the rules of the desk, as they stand tonight: 1. per-diem cap is the nightly rate times nights, a claim flags only when strictly past its cap, flagging is about the claim, not the payout. 2. reimbursement pays the smaller of submitted and cap, whole cents, never negative, never rounded. 3. clawed back is the part of flagged claims above their caps, summed across flagged travelers only.


  the facts of record: the nightly rate is 15000 whole cents trip-9 spent 5 nights and submitted 78000 whole cents, trip-8 spent 2 nights and submitted 30000 whole cents, trip-7 spent 4 nights and submitted 57000 whole cents the booth recomputes every cap and every payout from the rate and the nights.


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


