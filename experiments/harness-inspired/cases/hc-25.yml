provenance: 'over=2 under=0 vent_min=13 overrides=1

  archetype=vent_control variant=0 seed=24'
success_criteria:
  deterministic_checks:
    json_exact: '{"zones_over": 2, "zones_under": 0, "vent_minutes": 13, "overrides_active": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - zones above 26 degrees vent until back in band, vent minutes accrue per zone per excursion
  - zones below 18 degrees heat, heating never counts against vent minutes
  - manual overrides lock a zone's vents closed, overrides are counted and never argued with
  facts:
  - zone z-north reads 27 degrees with 5 vent minutes logged, zone z-south reads 22 degrees with 0 vent minutes logged, zone z-east reads 31 degrees with 8 vent minutes logged
  - the high band edge is 26, the low edge is 18
  - 1 manual overrides are active tonight
  output_spec:
    zones_over: int
    zones_under: int
    vent_minutes: int
    overrides_active: int
contract:
  zones_over:
    formula: (t1>H)+(t2>H)+(t3>H)
    literals:
    - name: t1
      regex: zone z-north reads (\d+) degrees
      value: 27
    - name: t2
      regex: zone z-south reads (\d+) degrees
      value: 22
    - name: t3
      regex: zone z-east reads (\d+) degrees
      value: 31
    - name: H
      regex: high band edge is (\d+)
      value: 26
  zones_under:
    formula: (t1<L)+(t2<L)+(t3<L)
    literals:
    - name: L
      regex: low edge is (\d+)
      value: 18
  vent_minutes:
    formula: m1*(t1>H)+m2*(t2>H)+m3*(t3>H)
    literals:
    - name: m1
      regex: zone z-north reads \d+ degrees with (\d+) vent minutes
      value: 5
    - name: m2
      regex: zone z-south reads \d+ degrees with (\d+) vent minutes
      value: 0
    - name: m3
      regex: zone z-east reads \d+ degrees with (\d+) vent minutes
      value: 8
v6:
  entities:
  - id: t1
    question: 'zone z-north''s current reading in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 27
  - id: t2
    question: 'zone z-south''s current reading in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 22
  - id: t3
    question: 'zone z-east''s current reading in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 31
  - id: m1
    question: 'zone z-north''s logged vent minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 5
  - id: m2
    question: 'zone z-south''s logged vent minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 0
  - id: m3
    question: 'zone z-east''s logged vent minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 8
  - id: hi
    question: 'the high band edge in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 26
  - id: lo
    question: 'the low band edge in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 18
  - id: oa
    question: 'manual overrides active (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 1
  aggregate: '{''zones_over'': (a(''t1'')>a(''hi''))+(a(''t2'')>a(''hi''))+(a(''t3'')>a(''hi'')), ''zones_under'': (a(''t1'')<a(''lo''))+(a(''t2'')<a(''lo''))+(a(''t3'')<a(''lo'')), ''vent_minutes'': a(''m1'')*(a(''t1'')>a(''hi''))+a(''m2'')*(a(''t2'')>a(''hi''))+a(''m3'')*(a(''t3'')>a(''hi'')),
    ''overrides_active'': int(a(''oa''))}'
