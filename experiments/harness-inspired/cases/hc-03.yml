provenance: 'shipped=2 rolled=1 slots_left=2 pending=1

  archetype=freeze_windows variant=0 seed=2'
success_criteria:
  deterministic_checks:
    json_exact: '{"shipped": 2, "rolled_back": 1, "slots_left": 2, "pending": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a deploy may start only before 21:00, work unfinished at 21:00 waits for tomorrow, partial work does not carry
  - a service showing an error rate at or above 0.5 percent must roll back before any new deploy of that service, rollbacks consume no slots
  - each new deploy consumes one of the 4 build slots held for the night, slots are never returned
  facts:
  - the clock reads 20:35
  - the freeze lands at 21:00
  - gateway shows 0.4 percent and its deploy takes 10 minutes, worker shows 0.7 percent and its deploy takes 12 minutes, batch shows 0.1 percent and its deploy takes 5 minutes
  output_spec:
    shipped: int
    rolled_back: int
    slots_left: int
    pending: int
contract:
  shipped:
    formula: ((ch*60+cm)+d1<=(fh*60+fm))+(((ch*60+cm)+d1<=(fh*60+fm))*((ch*60+cm)+d1+d2<=(fh*60+fm))*(1<K))+((((ch*60+cm)+d1<=(fh*60+fm))*((ch*60+cm)+d1+d2<=(fh*60+fm))*(1<K))*((ch*60+cm)+d1+d2+d3<=(fh*60+fm))*(2<K))
    literals:
    - name: ch
      regex: 'clock reads (\d+):'
      value: 20
    - name: cm
      regex: clock reads \d+:(\d+)
      value: 35
    - name: fh
      regex: 'freeze lands at (\d+):'
      value: 21
    - name: fm
      regex: freeze lands at \d+:(\d+)
      value: 0
    - name: T
      regex: at or above (\d+\.?\d*) percent
      value: 0.5
    - name: e1
      regex: gateway shows (\d+\.?\d*) percent
      value: 0.4
    - name: d1
      regex: gateway shows \d+\.?\d* percent and its deploy takes (\d+) minutes
      value: 10
    - name: e2
      regex: worker shows (\d+\.?\d*) percent
      value: 0.7
    - name: d2
      regex: worker shows \d+\.?\d* percent and its deploy takes (\d+) minutes
      value: 12
    - name: e3
      regex: batch shows (\d+\.?\d*) percent
      value: 0.1
    - name: d3
      regex: batch shows \d+\.?\d* percent and its deploy takes (\d+) minutes
      value: 5
    - name: K
      regex: (\d+) build slots held for the night
      value: 4
  rolled_back:
    formula: (e1>=T)+(e2>=T)+(e3>=T)
    literals:
    - name: ch
      regex: 'clock reads (\d+):'
      value: 20
    - name: cm
      regex: clock reads \d+:(\d+)
      value: 35
    - name: fh
      regex: 'freeze lands at (\d+):'
      value: 21
    - name: fm
      regex: freeze lands at \d+:(\d+)
      value: 0
    - name: T
      regex: at or above (\d+\.?\d*) percent
      value: 0.5
    - name: e1
      regex: gateway shows (\d+\.?\d*) percent
      value: 0.4
    - name: d1
      regex: gateway shows \d+\.?\d* percent and its deploy takes (\d+) minutes
      value: 10
    - name: e2
      regex: worker shows (\d+\.?\d*) percent
      value: 0.7
    - name: d2
      regex: worker shows \d+\.?\d* percent and its deploy takes (\d+) minutes
      value: 12
    - name: e3
      regex: batch shows (\d+\.?\d*) percent
      value: 0.1
    - name: d3
      regex: batch shows \d+\.?\d* percent and its deploy takes (\d+) minutes
      value: 5
  slots_left:
    formula: K - shipped
    literals: []
  pending:
    formula: 3 - shipped
    literals: []
