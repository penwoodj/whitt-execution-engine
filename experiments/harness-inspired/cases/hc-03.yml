  c, h,  , s, h, o, w, s,  , 0, ., 1,  , p, e, r, c, e, n, t,  , a, n, d,  , i, t, s,  , d, e, p, l, o, y,  , t, a, k, e, s,  , 5,  , m, i, n, u, t, e, s. the clock reads 20:35, the freeze lands at 21:00,
  the arithmetic is timeline arithmetic, walk the services in the order given and let the clock do the deciding.


  the slot ledger exists because a night in april burned nine builds on a flaky test rig and nobody could say where the capacity went. one slot per deploy, rollbacks ride free, slots do not come back even
  when the deploy rolls back later.


  error rate gates came out of a different postmortem, the one where a 0.7 percent release shipped on top of itself twice. at or above the line means rollback first, then and only then a fresh deploy if
  the clock allows it.


  the canary analyst you do not manage also publishes a deploy confidence score, that score has never gated anything and does not gate tonight either.


  the rules of the desk, as they stand tonight: 1. a deploy may start only before 21:00, work unfinished at 21:00 waits for tomorrow, partial work does not carry. 2. a service showing an error rate at or
  above 0.5 percent must roll back before any new deploy of that service, rollbacks consume no slots. 3. each new deploy consumes one of the 4 build slots held for the night, slots are never returned.


  the facts of record: the clock reads 20:35 the freeze lands at 21:00 gateway shows 0.4 percent and its deploy takes 10 minutes, worker shows 0.7 percent and its deploy takes 12 minutes, batch shows 0.1
  percent and its deploy takes 5 minutes.


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


