  payable=3895

  u1=2200 u2=1100 u3=400 shortfall=195

  drain order fixed, floors at 0

  archetype=multi_wallet variant=2 seed=56'
success_criteria:
  deterministic_checks:
    json_exact: '{"wallet1_used_cents": 2200, "wallet3_used_cents": 400, "shortfall_cents": 195}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a basket earns the bundle discount at-or-over the bundle threshold, the discount percentage applies to the sticker price once, before any wallet is touched
  - payment drains wallets in fixed order, wallet one, then two, then three, each wallet floors at zero, no wallet ever goes negative
  - shortfall is whatever the purchase still owes after all three wallets, floored at zero, the desk reports it even when it is zero, especially when it is zero
  facts:
  - the sticker price is 4100 whole cents and the bundle threshold is 4000 whole cents with a 5 percent bundle discount
  - wallet one holds 2200, wallet two holds 1100, wallet three holds 400, all whole cents
  - the cage quotes no payable tonight, the bundle rule decides it and the desk applies it
  output_spec:
    wallet1_used_cents: int
    wallet3_used_cents: int
    shortfall_cents: int
contract:
  wallet1_used_cents:
    formula: min(b1, ((C0 * (100 - disc) // 100) if (C0 >= thr) else C0))
    literals:
    - name: b1
      regex: wallet one holds (\d+)
      value: 2200
    - name: C0
      regex: sticker price is (\d+) whole cents
      value: 4100
    - name: thr
      regex: threshold is (\d+) whole cents
      value: 4000
    - name: disc
      regex: (\d+) percent bundle discount
      value: 5
  wallet3_used_cents:
    formula: max(0, min(b3, ((C0 * (100 - disc) // 100) if (C0 >= thr) else C0) - min(b1, ((C0 * (100 - disc) // 100) if (C0 >= thr) else C0)) - max(0, min(b2, ((C0 * (100 - disc) // 100) if (C0 >= thr) else C0) - min(b1, ((C0 * (100 - disc) // 100) if (C0 >= thr) else C0))))))
    literals:
    - name: b2
      regex: wallet two holds (\d+)
      value: 1100
    - name: b3
      regex: wallet three holds (\d+)
      value: 400
  shortfall_cents:
    formula: max(0, ((C0 * (100 - disc) // 100) if (C0 >= thr) else C0) - b1 - b2 - b3)
    literals: []
v6:
  entities:
  - id: C0
    question: the sticker price in whole cents (copy the number from its fact line)
    answer: 4100
  - id: thr
    question: the bundle threshold in whole cents (copy the number from its fact line)
    answer: 4000
  - id: disc
    question: the bundle discount percent (copy the number from its fact line)
    answer: 5
  - id: C
    question: the payable in whole cents (apply the bundle rule to the sticker price)
    answer: 3895
  - id: b1
    question: wallet one balance in whole cents (copy the number from its fact line)
    answer: 2200
  - id: b2
    question: wallet two balance in whole cents (copy the number from its fact line)
    answer: 1100
  - id: b3
    question: wallet three balance in whole cents (copy the number from its fact line)
    answer: 400
  - id: u1
    question: wallet one's drain in whole cents (smallest of its balance and the payable)
    answer: 2200
  - id: u3
    question: wallet three's drain in whole cents (what remains after wallets one and two, floored at zero)
    answer: 400
  - id: sh
    question: the shortfall in whole cents (what the purchase still owes after all wallets)
    answer: 195
  aggregate: '{''wallet1_used_cents'': min(a(''b1''), a(''C'')), ''wallet3_used_cents'': max(0, min(a(''b3''), a(''C'') - min(a(''b1''), a(''C'')) - max(0, min(a(''b2''), a(''C'') - min(a(''b1''), a(''C'')))))), ''shortfall_cents'': max(0, a(''C'') - a(''b1'') - a(''b2'') - a(''b3''))}'
