  wallets, floored at zero, the desk reports it even when it is zero, especially when it is zero.


  the facts of record: the sticker price is 4100 whole cents and the bundle threshold is 4000 whole cents with a 5 percent bundle discount wallet one holds 2200, wallet two holds 1100, wallet three holds 400, all whole cents the cage quotes no payable tonight, the bundle rule decides it and the desk applies it.


