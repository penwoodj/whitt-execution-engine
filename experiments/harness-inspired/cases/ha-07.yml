case_id: ha-07
category: harness-ops
difficulty: light
hops: 4
archetype: cooldown-scheduling
provenance: cooldown math; 5 runs x 4 min = 20; cooldown after r1, r3, r4 = 3 x 2 = 6; after r2 restart
  (1 min) replaces cooldown -> +1; 20+6+1 = 27; no cooldown after final run
prompt: 'You schedule 5 model runs on one server. Each run takes 4 minutes. The

  server needs a 2-minute cooldown between consecutive runs, but never after

  the final run. Mid-suite you must restart the server exactly once, right

  after run 2, and the restart itself takes 1 minute and replaces that

  interval''s cooldown entirely. A health poller you do not manage pings the

  server between runs but adds zero wait time. Report total wall-clock minutes

  for the whole suite and the number of restarts. Output ONLY this JSON with

  exactly these keys: {"wall_min": N, "restarts": N}.'
objective: Compute suite wall time with cooldowns and one restart substitution.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"wall_min": 27, "restarts": 1}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: run_time, question: "minutes for 5 runs", answer: 20}
    - {id: cooldowns, question: "cooldown minutes (3 gaps x 2min)", answer: 6}
    - {id: restart, question: "restart minutes after run 2 (replaces cooldown)", answer: 1}
  aggregate: '{"wall_min": a(run_time) + a(cooldowns) + a(restart), "restarts": 1}'
