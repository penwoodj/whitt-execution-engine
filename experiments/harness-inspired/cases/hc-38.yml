prompt: 'run the quota desk for the holiday, the previous operator logged everything, verify nothing from memory, exactly-once means exactly-once, no charity.


  the cron rack had a noisy night, sync-15m fires every 15 minutes, runs 9 minutes, and overran 6 times tonight, vacuum fires every 240 minutes, runs 30 minutes, and overran 1 times tonight. count firings
  as executed whether they lived or died, the lock line decides who dies, the schedule decides nothing else.


  the kill-at-lock rule replaced the old wait-forever rule after a nine-hour vacuum ate a monday, dead runs still count as firings, that clause is deliberate and it is in the rules.


  the scheduler ui you do not manage shades overlapping rectangles for prettiness, the shading algorithm lies about boundaries, trust the numbers above.


  the rules of the desk, as they stand tonight: 1. a run holds the lock for its duration or 20 minutes, whichever is shorter, longer runs get killed at the lock line. 2. a killed run counts as executed
  but failed, it still blocks nothing after death. 3. the next firing of a killed job proceeds on schedule, backpressure does not exist here.


  the facts of record: sync-15m fires every 15 minutes, runs 9 minutes, and overran 6 times tonight, vacuum fires every 240 minutes, runs 30 minutes, and overran 1 times tonight.


