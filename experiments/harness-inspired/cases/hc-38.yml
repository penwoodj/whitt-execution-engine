auxiliary: all facts needed are in the prompt itself
provenance: 'executed=7 lock_violators=1 longest=30

  archetype=cron_lock variant=1 seed=37'
success_criteria:
  deterministic_checks:
    json_exact: '{"executed": 7, "lock_violators": 1, "jobs_total": 2, "longest_run": 30}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a run holds the lock for its duration or 20 minutes, whichever is shorter, longer runs get killed at the lock line
  - a killed run counts as executed but failed, it still blocks nothing after death
  - the next firing of a killed job proceeds on schedule, backpressure does not exist here
  facts:
  - sync-15m fires every 15 minutes, runs 9 minutes, and overran 6 times tonight, vacuum fires every 240 minutes, runs 30 minutes, and overran 1 times tonight
  output_spec:
    executed: int
    lock_violators: int
    jobs_total: int
    longest_run: int
contract:
  executed:
    formula: o1+o2
    literals:
    - name: o1
      regex: sync-15m fires every \d+ minutes, runs \d+ minutes, and overran (\d+) times
      value: 6
    - name: o2
      regex: vacuum fires every \d+ minutes, runs \d+ minutes, and overran (\d+) times
      value: 1
  lock_violators:
    formula: (d1>L)+(d2>L)
    literals:
    - name: d1
      regex: sync-15m fires every \d+ minutes, runs (\d+) minutes
      value: 9
    - name: d2
      regex: vacuum fires every \d+ minutes, runs (\d+) minutes
      value: 30
    - name: L
      regex: or (\d+) minutes, whichever is shorter
      value: 20
  longest_run:
    formula: max(d1,d2)
    literals: []
v6:
  entities:
  - id: ex
    question: 'total runs executed tonight (firings, killed included). rule: every overrun is one executed run, killed runs still count as firings, sum the overrun counts per job. worked example: a job
      that overran 3 times and another that overran 2 times -> 3+2 = 5 executed.'
    answer: 7
  - id: lv
    question: 'jobs whose runtime exceeds the lock line (count). rule: a job violates the lock when its runtime exceeds the lock line, compare each job''s run minutes against the line, count jobs not runs.
      worked example: runtimes of 20 and 9 minutes against a 10 minute line -> only the 20 minute job violates, count is 1.'
    answer: 1
  - id: jt
    question: 'distinct jobs on the rack tonight. rule: count the distinct job names listed on the rack tonight, one per name. worked example: names keeper and watcher listed -> 2 jobs.'
    answer: 2
  - id: lr
    question: 'longest single runtime among the jobs (minutes). rule: the single largest runtime number among the jobs, no arithmetic. worked example: runtimes 20 and 9 -> longest is 20.'
    answer: 30
  aggregate: '{''executed'': int(a(''ex'')), ''lock_violators'': int(a(''lv'')), ''jobs_total'': int(a(''jt'')), ''longest_run'': int(a(''lr''))}'
