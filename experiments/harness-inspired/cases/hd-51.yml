prompt: 'the binder for the vault ledger lives under the boundary desk, chained there by tradition and one actual chain, the counts below are tonight''s, the rules below are forever.


  the proration bench sees three desks tonight and nothing about them is symmetric, the days differ, the rates differ, and the only thing they share is the 30-day convention, which is exactly why the at-or-over edge gets read out loud before any pencil moves


  someone will eventually ask why ceil and not round-to-nearest, the answer is buried in a billing dispute from years back where the floor convention cost real money, the ceil convention costs only patience


  the desk recomputes each desk charge from days and rate independently, then totals, totals assembled from assumptions rather than charges are the ones that end up in the incident binder


  the rules of the desk, as they stand tonight: 1. a desk counts as a full month at-or-over 30 active days, partial months prorate as whole cents rounded up, ceil, never round down. 2. proration for a desk is its active days times its monthly rate, divided by 30, rounded up to a whole cent per desk. 3. the report needs the full-month desk count, the largest single desk charge, and the total proration
  in whole cents.


  the facts of record: kite-line ran 21 active days at 8400 whole cents per 30 days, mill-line ran 30 active days at 10500 whole cents per 30 days, loom-line ran 52 active days at 7000 whole cents per 30 days every desk above is billed on the same 30-day convention tonight the per-desk prorated charges work out to kite-line charges 5880 whole cents mill-line charges 10500 whole cents loom-line charges
  12134 whole cents when the rule is applied faithfully.


