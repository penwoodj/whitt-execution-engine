task_core:
  rules:
  - a desk counts as a full month at-or-over 30 active days, partial months prorate as whole cents rounded up, ceil, never round down
  - proration for a desk is its active days times its monthly rate, divided by 30, rounded up to a whole cent per desk
  - the report needs the full-month desk count, the largest single desk charge, and the total proration in whole cents
  facts:
  - kite-line ran 21 active days at 8400 whole cents per 30 days, mill-line ran 30 active days at 10500 whole cents per 30 days, loom-line ran 52 active days at 7000 whole cents per 30 days
  - every desk above is billed on the same 30-day convention tonight
  - the per-desk prorated charges work out to kite-line charges 5880 whole cents mill-line charges 10500 whole cents loom-line charges 12134 whole cents when the rule is applied faithfully
  output_spec:
    seats_full_month: int
    largest_seat_charge_cents: int
    total_proration_cents: int
contract:
  seats_full_month:
    formula: (d1 >= 30) + (d2 >= 30) + (d3 >= 30)
    literals:
    - name: d1
      regex: kite-line ran (\d+) active days
      value: 21
    - name: d2
      regex: mill-line ran (\d+) active days
      value: 30
    - name: d3
      regex: loom-line ran (\d+) active days
      value: 52
  largest_seat_charge_cents:
    formula: max(((d1 * r1 + 29) // 30), ((d2 * r2 + 29) // 30), ((d3 * r3 + 29) // 30))
    literals:
    - name: d1
      regex: kite-line ran (\d+) active days
      value: 21
    - name: d2
      regex: mill-line ran (\d+) active days
      value: 30
    - name: d3
      regex: loom-line ran (\d+) active days
      value: 52
    - name: r1
      regex: kite-line ran \d+ active days at (\d+) whole cents
      value: 8400
    - name: r2
      regex: mill-line ran \d+ active days at (\d+) whole cents
      value: 10500
    - name: r3
      regex: loom-line ran \d+ active days at (\d+) whole cents
      value: 7000
  total_proration_cents:
    formula: ((d1 * r1 + 29) // 30) + ((d2 * r2 + 29) // 30) + ((d3 * r3 + 29) // 30)
    literals:
    - name: d1
      regex: kite-line ran (\d+) active days
      value: 21
    - name: d2
      regex: mill-line ran (\d+) active days
      value: 30
    - name: d3
      regex: loom-line ran (\d+) active days
      value: 52
    - name: r1
      regex: kite-line ran \d+ active days at (\d+) whole cents
      value: 8400
    - name: r2
      regex: mill-line ran \d+ active days at (\d+) whole cents
      value: 10500
    - name: r3
      regex: loom-line ran \d+ active days at (\d+) whole cents
      value: 7000
