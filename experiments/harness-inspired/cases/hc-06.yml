    question: 'amount row r-d pays, copy the number from its fact line. hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2100
  - id: th
    question: 'the hold threshold in units, copy the number from the rules. hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 1000
  aggregate: '{''released_count'': (1-a(''h1''))+(1-a(''h2''))+(1-a(''h3''))+(1-a(''h4'')), ''held_count'': a(''h1'')+a(''h2'')+a(''h3'')+a(''h4''), ''net_paid'': a(''m1'')*(1-a(''h1''))+a(''m2'')*(1-a(''h2''))+a(''m3'')*(1-a(''h3''))+a(''m4'')*(1-a(''h4'')),
    ''held_value'': a(''m1'')*a(''h1'')+a(''m2'')*a(''h2'')+a(''m3'')*a(''h3'')+a(''m4'')*a(''h4'')}'
