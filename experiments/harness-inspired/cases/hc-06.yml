  archetype=payroll_holds variant=0 seed=5'
success_criteria:
  deterministic_checks:
    json_exact: '{"released_count": 2, "held_count": 2, "net_paid": 2000, "held_value": 5500}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rows over 1000 currency units hold for manual review unless the row carries an approved exception
  - held rows pay nothing tonight, they are not partial, they are not deferred pro-rated, they simply wait
  - the exception column is the only override, verbal approvals count for nothing at this desk
  facts:
  - row r-a pays 1200 units with an approved exception, row r-b pays 3400 units, row r-c pays 800 units with an approved exception, row r-d pays 2100 units
  output_spec:
    released_count: int
    held_count: int
    net_paid: int
    held_value: int
contract:
  held_count:
    formula: ((a1>T)*(1-x1))+((a2>T)*(1-x2))+((a3>T)*(1-x3))+((a4>T)*(1-x4))
    literals:
    - name: T
      regex: over (\d+) currency units hold
      value: 1000
    - name: a1
      regex: row r-a pays (\d+) units
      value: 1200
    - name: x1
      regex: row r-a pays \d+ units( with an approved exception)?
      value: 1
      map: &id001
        ' with an approved exception': 1
    - name: a2
      regex: row r-b pays (\d+) units
      value: 3400
    - name: x2
      regex: row r-b pays \d+ units( with an approved exception)?
      value: 0
      map: &id002
        ' with an approved exception': 1
    - name: a3
      regex: row r-c pays (\d+) units
      value: 800
    - name: x3
      regex: row r-c pays \d+ units( with an approved exception)?
      value: 1
      map: &id003
        ' with an approved exception': 1
    - name: a4
      regex: row r-d pays (\d+) units
      value: 2100
    - name: x4
      regex: row r-d pays \d+ units( with an approved exception)?
      value: 0
      map: &id004
        ' with an approved exception': 1
  held_value:
    formula: ((a1>T)*(1-x1)*a1)+((a2>T)*(1-x2)*a2)+((a3>T)*(1-x3)*a3)+((a4>T)*(1-x4)*a4)
    literals:
    - name: T
      regex: over (\d+) currency units hold
      value: 1000
    - name: a1
      regex: row r-a pays (\d+) units
      value: 1200
    - name: x1
      regex: row r-a pays \d+ units( with an approved exception)?
      value: 1
      map: *id001
    - name: a2
      regex: row r-b pays (\d+) units
      value: 3400
    - name: x2
      regex: row r-b pays \d+ units( with an approved exception)?
      value: 0
      map: *id002
    - name: a3
      regex: row r-c pays (\d+) units
      value: 800
    - name: x3
      regex: row r-c pays \d+ units( with an approved exception)?
      value: 1
      map: *id003
    - name: a4
      regex: row r-d pays (\d+) units
      value: 2100
    - name: x4
      regex: row r-d pays \d+ units( with an approved exception)?
      value: 0
      map: *id004
  released_count:
    formula: 4 - held_count
    literals: []
  net_paid:
    formula: (a1+a2+a3+a4) - held_value
    literals:
    - name: a1
      regex: row r-a pays (\d+) units
      value: 1200
    - name: a2
      regex: row r-b pays (\d+) units
      value: 3400
    - name: a3
      regex: row r-c pays (\d+) units
      value: 800
    - name: a4
      regex: row r-d pays (\d+) units
      value: 2100
v6:
  entities:
  - id: h1
    question: 'is row r-a HELD tonight, answer 1 if held or 0 if released. rule: held means the amount is OVER the hold threshold AND has no approved exception, amounts under the threshold are always released
      (0), over-threshold rows with an approved exception are also released (0). worked example: a row paying 400 against a 500 threshold is under the line, answer 0. hint: a row is held only when its amount
      is over the hold threshold AND it has no approved exception, under-threshold rows are always released, over-threshold rows with an approved exception are also released, answer exactly one word held
      or released.'
    answer: 0
