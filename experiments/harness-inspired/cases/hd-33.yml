prompt: 'the intake desk keeps the quorum rail honest, which is a full-time job on a graveyard, the counts below are tonight''s, the rules below are forever.


  the rebate board loves the word retroactive right up until the tier boundary sits exactly on tonight''s volume, and then the room divides into people who remember the boundary word and people who remember their bonus


  the strictly-past convention governs both tier edges tonight, identically, the binder does not permit mixed conventions within one program


  the desk computes the tier once, from full volume, then rebates the full gross at that single percentage, the marginal-tier reading is a different program at a different company with different lawyers


  the rules of the desk, as they stand tonight: 1. tier two begins strictly past 100 units and tier three begins strictly past 500 units, units are whole and never rounded. 2. the tier percentage is retroactive, it applies to the entire volume, not just the units above the boundary, this is the whole point of the program and the whole trap of it. 3. rebate is gross times percent floor-divided by 100
  in whole cents, net is gross minus rebate, both reported.


  the facts of record: the program moved 100 whole units this quarter at 3000 whole cents per unit tier two starts at 100 units, tier three starts at 500 units, tier rates are 5, 12, and 18 percent the board quotes no gross tonight, the desk derives it before any tier applies.


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


