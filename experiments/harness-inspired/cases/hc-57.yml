auxiliary: all facts needed are in the prompt itself
provenance: 'reordered=2 quarantined_lines=2 damaged=23 healthy=1

  archetype=restock_waves variant=2 seed=56'
success_criteria:
  deterministic_checks:
    json_exact: '{"reordered": 2, "quarantined_lines": 2, "damaged_units": 23, "healthy_lines": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - damaged units leave stock before any reorder math runs, damage first, thresholds second
  - a line at or below its reorder point orders more, at-or-below means exactly equal counts too
  - any line with damage above zero quarantines that line's damaged units, the rest of the line stays sellable
  facts:
  - hx-9 shows 33 on hand, reorder point 30, damage 8, hx-2 shows 70 on hand, reorder point 40, damage 15, hx-4 shows 10 on hand, reorder point 35, damage 0
  output_spec:
    reordered: int
    quarantined_lines: int
    damaged_units: int
    healthy_lines: int
contract:
  damaged_units:
    formula: d1+d2+d3
    literals:
    - name: d1
      regex: hx-9 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 8
    - name: d2
      regex: hx-2 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 15
    - name: d3
      regex: hx-4 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 0
  quarantined_lines:
    formula: (d1>0)+(d2>0)+(d3>0)
    literals: []
  reordered:
    formula: (s1-d1<=r1)+(s2-d2<=r2)+(s3-d3<=r3)
    literals:
    - name: s1
      regex: hx-9 shows (\d+) on hand
      value: 33
    - name: r1
      regex: hx-9 shows \d+ on hand, reorder point (\d+)
      value: 30
    - name: d1
      regex: hx-9 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 8
    - name: s2
      regex: hx-2 shows (\d+) on hand
      value: 70
    - name: r2
      regex: hx-2 shows \d+ on hand, reorder point (\d+)
      value: 40
    - name: d2
      regex: hx-2 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 15
    - name: s3
      regex: hx-4 shows (\d+) on hand
      value: 10
    - name: r3
      regex: hx-4 shows \d+ on hand, reorder point (\d+)
      value: 35
    - name: d3
      regex: hx-4 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 0
