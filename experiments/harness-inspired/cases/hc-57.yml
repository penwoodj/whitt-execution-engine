objective: derive reordered, quarantined_lines, damaged_units, healthy_lines from the stated rules
prompt: 'you run the deploy lane during the graveyard window, the escalation path is you, then still you, when a rule sends work back, the second pass follows the same rules.


  the restock floor counts damage at the door, hx-9 shows 33 on hand, reorder point 30, damage 8, hx-2 shows 70 on hand, reorder point 40, damage 15, hx-4 shows 10 on hand, reorder point 35, damage 0. subtract
  damage, compare what is left to the reorder point, order or do not, then tally the quarantined units. the damage column gets read once and acted on everywhere.


  the reorder rules were tightened after a wave where shelves looked full and were full of things nobody could sell. healthy stock is what counts toward reorder decisions, damaged stock counts toward quarantine
  and nothing else.


  the damage inspector you do not manage logs suspected damage separately, suspicion is not damage until the clipboard says so, the clipboard here is the facts above.


  the rules of the desk, as they stand tonight: 1. damaged units leave stock before any reorder math runs, damage first, thresholds second. 2. a line at or below its reorder point orders more, at-or-below
  means exactly equal counts too. 3. any line with damage above zero quarantines that line''s damaged units, the rest of the line stays sellable.


  the facts of record: hx-9 shows 33 on hand, reorder point 30, damage 8, hx-2 shows 70 on hand, reorder point 40, damage 15, hx-4 shows 10 on hand, reorder point 35, damage 0.


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


