    == ''ward''), ''fasttrack_count'': sum(1 for x in [''fasttrack'', (''icu'' if a(''bp2'') < 90 else ''trauma''), (''ward'' if a(''bp3'') > 70 else ''obs''), (''icu'' if a(''bp4'') < 90 else ''trauma'')] if x == ''fasttrack'')}'
