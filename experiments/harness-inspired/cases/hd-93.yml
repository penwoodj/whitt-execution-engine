auxiliary: all facts needed are in the prompt itself
provenance: 'rows=[(''t-7'', ''green'', 30), (''t-8'', ''red'', 90), (''t-9'', ''yellow'', 76), (''t-10'', ''red'', 84)]

  finals=[''fasttrack'', ''trauma'', ''ward'', ''icu'']

  icu=1 ward=1 fasttrack=1

  hop2: trauma→icu if bp<90; obs→ward if bp>70; green terminal

  archetype=triage_2hop variant=3 seed=92'
success_criteria:
  deterministic_checks:
    json_exact: '{"icu_count": 1, "ward_count": 1, "fasttrack_count": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - hop one routes by tag, red to trauma, yellow to obs, green to fasttrack, hop two overrides, trauma routes to icu when pressure reads strictly under 90, obs routes to ward when pressure reads strictly past 70, a patient releases from hop one only strictly past 90 pressure in the trauma lane, the override edges differ on purpose
  - green never reroutes, fasttrack is terminal, green patients who arrive walking leave walking
  - the report counts final destinations after both hops, hop-one landings that were overridden do not count anywhere
  facts:
  - t-7 arrives tagged green with pressure 30, t-8 arrives tagged red with pressure 90, t-9 arrives tagged yellow with pressure 76, t-10 arrives tagged red with pressure 84
  - the hop desk quotes no destinations tonight, every final landing derives from tag and pressure
  output_spec:
    icu_count: int
    ward_count: int
    fasttrack_count: int
contract:
  icu_count:
    formula: sum(1 for x in ['fasttrack', ('icu' if bp2 < 90 else 'trauma'), ('ward' if bp3 > 70 else 'obs'), ('icu' if bp4 < 90 else 'trauma')] if x == 'icu')
    literals:
    - name: bp1
      regex: t-7 arrives tagged green with pressure (\d+)
      value: 30
    - name: bp2
      regex: t-8 arrives tagged red with pressure (\d+)
      value: 90
    - name: bp3
      regex: t-9 arrives tagged yellow with pressure (\d+)
      value: 76
    - name: bp4
      regex: t-10 arrives tagged red with pressure (\d+)
      value: 84
  ward_count:
    formula: sum(1 for x in ['fasttrack', ('icu' if bp2 < 90 else 'trauma'), ('ward' if bp3 > 70 else 'obs'), ('icu' if bp4 < 90 else 'trauma')] if x == 'ward')
    literals: []
  fasttrack_count:
    formula: sum(1 for x in ['fasttrack', ('icu' if bp2 < 90 else 'trauma'), ('ward' if bp3 > 70 else 'obs'), ('icu' if bp4 < 90 else 'trauma')] if x == 'fasttrack')
    literals: []
