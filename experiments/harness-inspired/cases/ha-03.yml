case_id: ha-03
category: harness-ops
difficulty: light
hops: 4
archetype: win-depth-scoring
provenance: win-depth; X passes 3/4 mean depth (0+1+2+3)/4 = 1.5; Y passes 4/4 mean (0+0+1+2)/4 = 0.75;
  Z passes 3/4 mean (1+1+2+3)/4 = 1.75; Y wins outright on pass rate
prompt: 'You are scoring three solver techniques on the same 4-case suite. Each case

  runs stages in order: solve, fix1, fix2. A case''s win-depth is the index of

  the first stage that produced a passing check: solve = 0, fix1 = 1, fix2 =

  2. A case that never passes has depth 3 and does not count as a pass.

  Technique ranking rule: highest pass count wins; only on a tie does lower

  mean win-depth break it. Results — Technique X depths: 0, 1, 2, 3.

  Technique Y depths: 0, 0, 1, 2. Technique Z depths: 1, 1, 2, 3. A nightly

  report generator you do not manage also ranks techniques by wall time, but

  wall time is not part of this ranking rule. Which technique wins and with

  how many passed cases? Output ONLY this JSON with exactly these keys:

  {"winner": T, "passes": N}.'
objective: Rank techniques by pass rate then mean win-depth.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"winner": "Y", "passes": 4}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: tech_X, question: "passes and mean depth for X", answer: {passes: 3, mean: 1.5}}
    - {id: tech_Y, question: "passes and mean depth for Y", answer: {passes: 4, mean: 0.75}}
    - {id: tech_Z, question: "passes and mean depth for Z", answer: {passes: 3, mean: 1.75}}
  aggregate: '{"winner": "Y", "passes": 4}'
