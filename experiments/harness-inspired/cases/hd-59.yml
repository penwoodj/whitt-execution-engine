case_id: hd-59
category: field-ops-hard
difficulty: heavy
hops: 6
archetype: ring_rotation_2cyc
variant: 2
domain: release canary promotion cycles
objective: derive cycle1_net_promoted, cycle2_net_promoted, stuck_count from the stated rules
prompt: 'the rota wheel has opinions, the reconciliation desk has the binder, the binder wins every argument, so the desk works the problem the slow way, on purpose.


  the promotion drum beats twice tonight and the arithmetic between the beats is where careers go to die, the second cycle is not the first cycle repeated, it is the first cycle inherited


  ceil on the percent, floor on the demotion, the two roundings point in opposite directions on purpose, the binder calls this the pessimist and the optimist sharing a desk


  stuck users are not failed users, they are users whose cohort could not carry them across, the desk counts them without commentary, commentary is for retrospectives


  the rules of the desk, as they stand tonight: 1. each cycle promotes ceil of cohort times the promotion percent per hundred, rounding up always, a cohort is promotion-eligible at-or-over 200 users, eligibility is about the cohort, the percent is about the cycle. 2. errors demote, each error removes one promotion, demotions floor at zero per cycle, demoted users rejoin their origin cohort and count
  as stuck. 3. cycle two''s cohort inherits cycle one''s net promotions before its own percent applies, inheritance is additive, the percent applies to the inherited size.


  the facts of record: wave-9 starts with 260 users at 30 percent and 14 errors, wave-10 starts with 140 users at 30 percent and 2 errors the eligibility floor is 200 users per cohort the drum quotes no promotion counts tonight, every net derives from size, percent, and errors.


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


  old hands say the arithmetic is the easy ten percent, the other ninety is remembering which convention tonight''s boundary clause uses, they say it while checking the clause again


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


