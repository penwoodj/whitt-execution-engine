success_criteria:
  deterministic_checks:
    json_exact: '{"cycle1_net_promoted": 64, "cycle2_net_promoted": 60, "stuck_count": 276}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each cycle promotes ceil of cohort times the promotion percent per hundred, rounding up always, a cohort is promotion-eligible at-or-over 200 users, eligibility is about the cohort, the percent is about the cycle
  - errors demote, each error removes one promotion, demotions floor at zero per cycle, demoted users rejoin their origin cohort and count as stuck
  - cycle two's cohort inherits cycle one's net promotions before its own percent applies, inheritance is additive, the percent applies to the inherited size
  facts:
  - wave-9 starts with 260 users at 30 percent and 14 errors, wave-10 starts with 140 users at 30 percent and 2 errors
  - the eligibility floor is 200 users per cohort
  - the drum quotes no promotion counts tonight, every net derives from size, percent, and errors
  output_spec:
    cycle1_net_promoted: int
    cycle2_net_promoted: int
    stuck_count: int
contract:
  cycle1_net_promoted:
    formula: max(0, (s1 * p1 + 99) // 100 - e1)
    literals:
    - name: s1
      regex: wave-9 starts with (\d+) users
      value: 260
    - name: p1
      regex: wave-9 starts with \d+ users at (\d+) percent
      value: 30
    - name: e1
      regex: wave-9 starts with \d+ users at \d+ percent and (\d+) errors
      value: 14
  cycle2_net_promoted:
    formula: max(0, ((s2 + cycle1_net_promoted) * p2 + 99) // 100 - e2)
    literals:
    - name: s2
      regex: wave-10 starts with (\d+) users
      value: 140
    - name: p2
      regex: wave-10 starts with \d+ users at (\d+) percent
      value: 30
    - name: e2
      regex: wave-10 starts with \d+ users at \d+ percent and (\d+) errors
      value: 2
  stuck_count:
    formula: s1 + s2 - cycle1_net_promoted - cycle2_net_promoted
    literals: []
v6:
  entities:
  - id: s1
    question: wave-9's starting users (copy the number from its fact line)
    answer: 260
  - id: p1
    question: wave-9's promotion percent (copy the number from its fact line)
    answer: 30
  - id: e1
    question: wave-9's errors (copy the number from its fact line)
    answer: 14
  - id: s2
    question: wave-10's starting users (copy the number from its fact line)
    answer: 140
  - id: p2
    question: wave-10's promotion percent (copy the number from its fact line)
    answer: 30
  - id: e2
    question: wave-10's errors (copy the number from its fact line)
    answer: 2
  - id: pr1
    question: cycle one's promotions before errors (ceil of the first cohort times its percent over 100)
    answer: 78
  - id: n1
    question: cycle one's net promotions after demotion (floored at zero)
    answer: 64
  - id: n2
    question: cycle two's net promotions after demotion (inheritance first, then percent, then errors)
    answer: 60
  - id: stuck
    question: stuck users across both cohorts after both cycles (count them)
    answer: 276
  aggregate: '{''cycle1_net_promoted'': max(0, ((a(''s1'') * a(''p1'') + 99) // 100) - a(''e1'')), ''cycle2_net_promoted'': max(0, (((a(''s2'') + max(0, ((a(''s1'') * a(''p1'') + 99) // 100) - a(''e1''))) * a(''p2'') + 99) // 100) - a(''e2'')), ''stuck_count'': a(''s1'') + a(''s2'') - max(0, ((a(''s1'') * a(''p1'') + 99) // 100) - a(''e1'')) - max(0, (((a(''s2'') + max(0, ((a(''s1'') * a(''p1'') + 99)
    // 100) - a(''e1''))) * a(''p2'') + 99) // 100) - a(''e2''))}'
