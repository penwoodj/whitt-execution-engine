prompt: 'the binder for the code bench lives under the reconciliation desk, chained there by tradition and one actual chain, and tonight is one of those nights where every clause earns its keep.


  the vault ledger quotes volumes in GiB and quotas in MiB on purpose, the conversion is where lazy nights go to die, 1024 and never 1000, the desk has a scar about this


  quota breaches read strictly-past the quota line tonight, and the distinction only matters for volumes parked exactly on the line, which happens more than anyone expects


  the desk converts first, compares second, sums last, converting and comparing in the same breath is how volumes end up over- or under-counted by a whole gigabyte


  the rules of the desk, as they stand tonight: 1. a volume is over quota when its usage in whole MiB is strictly past its quota, usage is recorded in GiB and converted at 1024 MiB per GiB exactly, no decimal shortcuts. 2. overage for a volume is its usage in MiB minus its quota in MiB, floored at zero, overage never goes negative. 3. the report wants the over-quota volume count, total usage in whole
  MiB, and total overage in whole MiB.


  the facts of record: drum-4 holds 7 GiB against a 7168 MiB quota, drum-5 holds 2 GiB against a 2048 MiB quota, drum-6 holds 4 GiB against a 4096 MiB quota conversion is fixed tonight at 1024 MiB per GiB, whole MiB only the desk converts before comparing and sums only after every volume is converted.


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


