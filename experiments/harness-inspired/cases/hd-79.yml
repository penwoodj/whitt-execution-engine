task_core:
  rules:
  - a volume is over quota when its usage in whole MiB is strictly past its quota, usage is recorded in GiB and converted at 1024 MiB per GiB exactly, no decimal shortcuts
  - overage for a volume is its usage in MiB minus its quota in MiB, floored at zero, overage never goes negative
  - the report wants the over-quota volume count, total usage in whole MiB, and total overage in whole MiB
  facts:
  - drum-4 holds 7 GiB against a 7168 MiB quota, drum-5 holds 2 GiB against a 2048 MiB quota, drum-6 holds 4 GiB against a 4096 MiB quota
  - conversion is fixed tonight at 1024 MiB per GiB, whole MiB only
  - the desk converts before comparing and sums only after every volume is converted
  output_spec:
    volumes_over: int
    total_mib: int
    overage_mib: int
contract:
  volumes_over:
    formula: ((g1 * 1024) > q1) + ((g2 * 1024) > q2) + ((g3 * 1024) > q3)
    literals:
    - name: g1
      regex: drum-4 holds (\d+) GiB
      value: 7
    - name: g2
      regex: drum-5 holds (\d+) GiB
      value: 2
    - name: g3
      regex: drum-6 holds (\d+) GiB
      value: 4
    - name: q1
      regex: drum-4 holds \d+ GiB against a (\d+) MiB quota
      value: 7168
    - name: q2
      regex: drum-5 holds \d+ GiB against a (\d+) MiB quota
      value: 2048
    - name: q3
      regex: drum-6 holds \d+ GiB against a (\d+) MiB quota
      value: 4096
  total_mib:
    formula: (g1 * 1024) + (g2 * 1024) + (g3 * 1024)
    literals:
    - name: g1
      regex: drum-4 holds (\d+) GiB
      value: 7
    - name: g2
      regex: drum-5 holds (\d+) GiB
      value: 2
    - name: g3
      regex: drum-6 holds (\d+) GiB
      value: 4
  overage_mib:
    formula: max(0, (g1 * 1024) - q1) + max(0, (g2 * 1024) - q2) + max(0, (g3 * 1024) - q3)
    literals:
    - name: q1
      regex: drum-4 holds \d+ GiB against a (\d+) MiB quota
      value: 7168
    - name: q2
      regex: drum-5 holds \d+ GiB against a (\d+) MiB quota
      value: 2048
    - name: q3
      regex: drum-6 holds \d+ GiB against a (\d+) MiB quota
      value: 4096
