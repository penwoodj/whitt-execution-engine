success_criteria:
  deterministic_checks:
    json_exact: '{"blocked": 1, "exception_approved": 1, "over_cap": 2, "at_cap_exactly": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - spending at or over the daily cap flags the card, exactly-at is flagged same as over
  - a flagged card with a pre-filed route exception goes to the approved pile, everything else blocks until a human calls in
  - blocked tonight does not mean fired, it means the morning list, count them anyway
  facts:
  - ana burned 88 liters against a 80 liter cap with a pre-filed exception, bjorn burned 79 liters against a 80 liter cap, cato burned 80 liters against a 80 liter cap
  output_spec:
    blocked: int
    exception_approved: int
    over_cap: int
    at_cap_exactly: int
contract:
  at_cap_exactly:
    formula: (s1==c1)+(s2==c2)+(s3==c3)
    literals:
    - name: s1
      regex: ana burned (\d+) liters
      value: 88
    - name: c1
      regex: ana burned \d+ liters against a (\d+) liter cap
      value: 80
    - name: s2
      regex: bjorn burned (\d+) liters
      value: 79
    - name: c2
      regex: bjorn burned \d+ liters against a (\d+) liter cap
      value: 80
    - name: s3
      regex: cato burned (\d+) liters
      value: 80
    - name: c3
      regex: cato burned \d+ liters against a (\d+) liter cap
      value: 80
  over_cap:
    formula: (s1>=c1)+(s2>=c2)+(s3>=c3)
    literals: []
