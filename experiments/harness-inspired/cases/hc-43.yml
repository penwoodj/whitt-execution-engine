  the fuel desk closes the ledger at midnight, ana burned 88 liters against a 80 liter cap with a pre-filed exception, bjorn burned 79 liters against a 80 liter cap, cato burned 80 liters against a 80 liter
  cap. flag at-or-over first, then split flagged cards by exception, the lists write themselves once the flagging is honest.


  exactly-at counting as flagged was a policy fight the auditors won, the boundary belongs to the flagged side, same as every other boundary at this desk.


  the telematics feed you do not manage estimates burn per trip, estimates settle nothing, the pump numbers are the facts.


  the rules of the desk, as they stand tonight: 1. spending at or over the daily cap flags the card, exactly-at is flagged same as over. 2. a flagged card with a pre-filed route exception goes to the approved
  pile, everything else blocks until a human calls in. 3. blocked tonight does not mean fired, it means the morning list, count them anyway.


  the facts of record: ana burned 88 liters against a 80 liter cap with a pre-filed exception, bjorn burned 79 liters against a 80 liter cap, cato burned 80 liters against a 80 liter cap.


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


