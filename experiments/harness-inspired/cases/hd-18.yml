prompt: 'every shift on the close bench starts the same way, coffee, then the counts, then the arguments about the counts, and the tally lamp is on, which means somebody''s numbers are about to be wrong.


  the triage hop routes twice, the first hop sorts by tag, the second hop reads the numbers and overrules, and the only mercy in the system is that green is terminal


  the override edges are not symmetric, trauma escalates below 90, obs escalates above 70, and the desk reads both edges every time because sympathy is not a routing rule


  final destinations are all that count, intermediate landings are just the mail taking a scenic route


  the rules of the desk, as they stand tonight: 1. hop one routes by tag, red to trauma, yellow to obs, green to fasttrack, hop two overrides, trauma routes to icu when pressure reads strictly under 90, obs routes to ward when pressure reads strictly past 70, a patient holds hop one at-or-over 90 pressure in the trauma lane, the override edges differ on purpose. 2. green never reroutes, fasttrack is
  terminal, green patients who arrive walking leave walking. 3. the report counts final destinations after both hops, hop-one landings that were overridden do not count anywhere.


  the facts of record: case-1 arrives tagged red with pressure 85, case-2 arrives tagged yellow with pressure 74, case-3 arrives tagged green with pressure 40, case-4 arrives tagged red with pressure 95 the hop desk quotes no destinations tonight, every final landing derives from tag and pressure.


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


