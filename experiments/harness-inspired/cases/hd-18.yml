    == ''ward''), ''fasttrack_count'': sum(1 for x in [(''icu'' if a(''bp1'') < 90 else ''trauma''), (''ward'' if a(''bp2'') > 70 else ''obs''), ''fasttrack'', (''icu'' if a(''bp4'') < 90 else ''trauma'')] if x == ''fasttrack'')}'
