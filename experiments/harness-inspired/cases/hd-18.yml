auxiliary: all facts needed are in the prompt itself
provenance: 'rows=[(''case-1'', ''red'', 85), (''case-2'', ''yellow'', 74), (''case-3'', ''green'', 40), (''case-4'', ''red'', 95)]

  finals=[''icu'', ''ward'', ''fasttrack'', ''trauma'']

  icu=1 ward=1 fasttrack=1

  hop2: trauma→icu if bp<90; obs→ward if bp>70; green terminal

  archetype=triage_2hop variant=0 seed=17'
success_criteria:
  deterministic_checks:
    json_exact: '{"icu_count": 1, "ward_count": 1, "fasttrack_count": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - hop one routes by tag, red to trauma, yellow to obs, green to fasttrack, hop two overrides, trauma routes to icu when pressure reads strictly under 90, obs routes to ward when pressure reads strictly past 70, a patient holds hop one at-or-over 90 pressure in the trauma lane, the override edges differ on purpose
  - green never reroutes, fasttrack is terminal, green patients who arrive walking leave walking
  - the report counts final destinations after both hops, hop-one landings that were overridden do not count anywhere
  facts:
  - case-1 arrives tagged red with pressure 85, case-2 arrives tagged yellow with pressure 74, case-3 arrives tagged green with pressure 40, case-4 arrives tagged red with pressure 95
  - the hop desk quotes no destinations tonight, every final landing derives from tag and pressure
  output_spec:
    icu_count: int
    ward_count: int
    fasttrack_count: int
contract:
  icu_count:
    formula: sum(1 for x in [('icu' if bp1 < 90 else 'trauma'), ('ward' if bp2 > 70 else 'obs'), 'fasttrack', ('icu' if bp4 < 90 else 'trauma')] if x == 'icu')
    literals:
    - name: bp1
      regex: case-1 arrives tagged red with pressure (\d+)
      value: 85
    - name: bp2
      regex: case-2 arrives tagged yellow with pressure (\d+)
      value: 74
    - name: bp3
      regex: case-3 arrives tagged green with pressure (\d+)
      value: 40
    - name: bp4
      regex: case-4 arrives tagged red with pressure (\d+)
      value: 95
  ward_count:
    formula: sum(1 for x in [('icu' if bp1 < 90 else 'trauma'), ('ward' if bp2 > 70 else 'obs'), 'fasttrack', ('icu' if bp4 < 90 else 'trauma')] if x == 'ward')
    literals: []
  fasttrack_count:
    formula: sum(1 for x in [('icu' if bp1 < 90 else 'trauma'), ('ward' if bp2 > 70 else 'obs'), 'fasttrack', ('icu' if bp4 < 90 else 'trauma')] if x == 'fasttrack')
    literals: []
