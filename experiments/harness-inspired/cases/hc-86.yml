  archetype=rollout_rings variant=3 seed=85'
success_criteria:
  deterministic_checks:
    json_exact: '{"rings_passed": 2, "aborted": true, "users_exposed": 3750, "halt_ring": "silver"}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rings promote in order, a ring only enters after the previous ring passes clean
  - a ring with 8 or more fire reports halts the rollout on the spot, halted means halted, no finish and see
  - users exposed counts every user in rings that entered, including the ring that triggered the halt
  facts:
  - coal covers 150 users and logged 7 fire reports, bronze covers 600 users and logged 2 fire reports, silver covers 3000 users and logged 9 fire reports
  - the abort threshold is 8 fire reports
  output_spec:
    rings_passed: int
    aborted: bool
    users_exposed: int
    halt_ring: str
contract:
  rings_passed:
    formula: (f1<A)*(1+(f2<A)*(1+(f3<A)))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 8
    - name: f1
      regex: coal covers \d+ users and logged (\d+) fire reports
      value: 7
    - name: u1
      regex: coal covers (\d+) users
      value: 150
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 150 users and logged 7 fire reports
      value: coal
    - name: f2
      regex: bronze covers \d+ users and logged (\d+) fire reports
      value: 2
    - name: u2
      regex: bronze covers (\d+) users
      value: 600
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 600 users and logged 2 fire reports
      value: bronze
    - name: f3
      regex: silver covers \d+ users and logged (\d+) fire reports
      value: 9
    - name: u3
      regex: silver covers (\d+) users
      value: 3000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 3000 users and logged 9 fire reports
      value: silver
  aborted:
    formula: (f1>=A)+((f1<A)*(f2>=A))+((f1<A)*(f2<A)*(f3>=A))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 8
    - name: f1
      regex: coal covers \d+ users and logged (\d+) fire reports
      value: 7
    - name: u1
      regex: coal covers (\d+) users
      value: 150
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 150 users and logged 7 fire reports
      value: coal
    - name: f2
      regex: bronze covers \d+ users and logged (\d+) fire reports
      value: 2
    - name: u2
      regex: bronze covers (\d+) users
      value: 600
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 600 users and logged 2 fire reports
      value: bronze
    - name: f3
      regex: silver covers \d+ users and logged (\d+) fire reports
      value: 9
    - name: u3
      regex: silver covers (\d+) users
      value: 3000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 3000 users and logged 9 fire reports
      value: silver
  users_exposed:
    formula: (u1+u2+u3) if rings_passed>=3 else ((u1+u2+(u3 if aborted and rings_passed==2 else 0)) if rings_passed==2 else ((u1+(u2 if aborted and rings_passed==1 else 0)) if rings_passed==1 else (u1 if
      aborted else 0)))
    literals:
    - name: u1
      regex: coal covers (\d+) users
      value: 150
    - name: u2
      regex: bronze covers (\d+) users
      value: 600
    - name: u3
      regex: silver covers (\d+) users
      value: 3000
  halt_ring:
    formula: (n1 if aborted and rings_passed==0 else (n2 if aborted and rings_passed==1 else (n3 if aborted and rings_passed==2 else '')))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 8
    - name: f1
      regex: coal covers \d+ users and logged (\d+) fire reports
      value: 7
    - name: u1
      regex: coal covers (\d+) users
      value: 150
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 150 users and logged 7 fire reports
      value: coal
    - name: f2
      regex: bronze covers \d+ users and logged (\d+) fire reports
      value: 2
    - name: u2
      regex: bronze covers (\d+) users
      value: 600
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 600 users and logged 2 fire reports
      value: bronze
    - name: f3
      regex: silver covers \d+ users and logged (\d+) fire reports
      value: 9
    - name: u3
      regex: silver covers (\d+) users
      value: 3000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 3000 users and logged 9 fire reports
      value: silver
v6:
  entities:
  - id: f1
    question: fire reports ring coal logged, copy the number from its fact line
    answer: 7
  - id: f2
    question: fire reports ring bronze logged, copy the number from its fact line
    answer: 2
  - id: f3
    question: fire reports ring silver logged, copy the number from its fact line
    answer: 9
  - id: u1
    question: users ring coal covers, copy the number from its fact line
    answer: 150
  - id: u2
    question: users ring bronze covers, copy the number from its fact line
    answer: 600
  - id: u3
    question: users ring silver covers, copy the number from its fact line
    answer: 3000
  - id: n1
    question: the ring id of ring number 1, copy it exactly from the facts
    answer: coal
  - id: n2
    question: the ring id of ring number 2, copy it exactly from the facts
    answer: bronze
  - id: n3
    question: the ring id of ring number 3, copy it exactly from the facts
    answer: silver
  - id: at
    question: the abort threshold in fire reports, copy the number from the facts
    answer: 8
  aggregate: '{''rings_passed'': (a(''f1'')<a(''at''))*(1+(a(''f2'')<a(''at''))*(1+(a(''f3'')<a(''at'')))), ''aborted'': (a(''f1'')>=a(''at''))+(a(''f2'')>=a(''at''))+(a(''f3'')>=a(''at''))>0, ''users_exposed'':
    int(a(''u1''))+int(a(''u2''))*(a(''f1'')<a(''at''))+int(a(''u3''))*(a(''f1'')<a(''at''))*(a(''f2'')<a(''at'')), ''halt_ring'': (a(''n1'') if a(''f1'')>=a(''at'') else (a(''n2'') if a(''f2'')>=a(''at'')
    else (a(''n3'') if a(''f3'')>=a(''at'') else '''')))}'
