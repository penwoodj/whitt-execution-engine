prompt: 'the the quota desk desk is yours, the binder is old but the rules inside it are current and enforced, the rules stack, later rules do not cancel earlier ones.


  the floor manager counts the night in tables, 20 reservations booked against 22 tables, 5 reservations no-showed, 11 walk-in parties arrived, the floor completed 75 table turns tonight. reservations seated
  first minus no-shows, walk-ins fill what opened, vacant is what never filled, turns stand apart as the reset count.


  the fifteen-minute release exists because the old five-minute rule starved the walk-in lane on fridays, fifteen won after a month of arguments.


  the reservation app you do not manage shows covers including waitlist holds, app covers are projections, tables are facts.


  the rules of the desk, as they stand tonight: 1. no-show reservations release their seats after fifteen minutes, released seats go to walk-ins in arrival order. 2. walk-ins beyond open seats leave, there
  is no bar-queue promise tonight. 3. a turn counts a table reset between parties, turns are counted independent of who sat.


  the facts of record: 20 reservations booked against 22 tables 5 reservations no-showed 11 walk-in parties arrived the floor completed 75 table turns tonight.


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


