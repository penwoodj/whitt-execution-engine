auxiliary: all facts needed are in the prompt itself
provenance: 'seated_res=15 walkins=7 vacant=0 turns=75

  archetype=table_turns variant=1 seed=45'
success_criteria:
  deterministic_checks:
    json_exact: '{"seated_reservations": 15, "walkins_seated": 7, "vacant_at_close": 0, "turns_completed": 75}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - no-show reservations release their seats after fifteen minutes, released seats go to walk-ins in arrival order
  - walk-ins beyond open seats leave, there is no bar-queue promise tonight
  - a turn counts a table reset between parties, turns are counted independent of who sat
  facts:
  - 20 reservations booked against 22 tables
  - 5 reservations no-showed
  - 11 walk-in parties arrived
  - the floor completed 75 table turns tonight
  output_spec:
    seated_reservations: int
    walkins_seated: int
    vacant_at_close: int
    turns_completed: int
contract:
  seated_reservations:
    formula: R - N
    literals:
    - name: R
      regex: (\d+) reservations booked
      value: 20
    - name: N
      regex: (\d+) reservations no-showed
      value: 5
  walkins_seated:
    formula: min(W, max(C - seated_reservations, 0))
    literals:
    - name: W
      regex: (\d+) walk-in parties arrived
      value: 11
    - name: C
      regex: against (\d+) tables
      value: 22
v6:
  entities:
  - id: sr
    question: reservations seated (booked minus no-shows)
    answer: 15
  - id: ws
    question: walk-in parties seated (limited by open seats)
    answer: 7
  - id: vc
    question: tables vacant at close
    answer: 0
  - id: tc
    question: table turns completed tonight
    answer: 75
  aggregate: '{''seated_reservations'': int(a(''sr'')), ''walkins_seated'': int(a(''ws'')), ''vacant_at_close'': int(a(''vc'')), ''turns_completed'': int(a(''tc''))}'
