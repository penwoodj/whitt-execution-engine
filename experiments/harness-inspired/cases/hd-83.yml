prompt: 'the evening begins with a handoff note that always ends the same way, trust the rules, not the totals, so the desk works the problem the slow way, on purpose.


  the rebate board loves the word retroactive right up until the tier boundary sits exactly on tonight''s volume, and then the room divides into people who remember the boundary word and people who remember their bonus


  the strictly-past convention governs both tier edges tonight, identically, the binder does not permit mixed conventions within one program


  the desk computes the tier once, from full volume, then rebates the full gross at that single percentage, the marginal-tier reading is a different program at a different company with different lawyers


  the rules of the desk, as they stand tonight: 1. tier two begins strictly past 80 units and tier three begins strictly past 400 units, units are whole and never rounded. 2. the tier percentage is retroactive, it applies to the entire volume, not just the units above the boundary, this is the whole point of the program and the whole trap of it. 3. rebate is gross times percent floor-divided by 100
  in whole cents, net is gross minus rebate, both reported.


  the facts of record: the program moved 400 whole units this quarter at 2200 whole cents per unit tier two starts at 80 units, tier three starts at 400 units, tier rates are 4, 10, and 15 percent the board quotes no gross tonight, the desk derives it before any tier applies.


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


