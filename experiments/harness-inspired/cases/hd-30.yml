prompt: 'night two of the holiday and the custody desk is down to one working pen and one working mind, and the tally lamp is on, which means somebody''s numbers are about to be wrong.


  the escrow rail pays out in rungs and tonight the strictly-past reading of each threshold decides which rungs hold weight, an inspection sitting exactly on a threshold is the whole game when the convention is strict


  the desk computes each tranche against the full total, the remainder-based reading was retired after the year it silently underpaid two tranches


  nothing here rolls over, nothing here compounds, a tranche releases or it does not, binary as a rivet


  the rules of the desk, as they stand tonight: 1. each tranche releases its percentage of the total only when its inspection count is strictly past its threshold, percentages apply to the full escrow total, never to a remainder. 2. integer cents throughout, percentage of total computed as total times percent floor-divided by 100. 3. held is total minus released, held is never negative and never silent,
  unreleased tranches stay held entirely.


  the facts of record: the escrow total is 360000 whole units tranche 1 is 20 percent with threshold 2 inspections passed 2, tranche 2 is 30 percent with threshold 3 inspections passed 2, tranche 3 is 30 percent with threshold 4 inspections passed 5, tranche 4 is 20 percent with threshold 6 inspections passed 7 no tranche amount is taken on faith tonight, every release is recomputed from the gate.


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


