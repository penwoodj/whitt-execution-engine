  op=''>'' n_rel=2 cents_rel=180000 held=180000

  per-tranche: 20%x360000//100 gated 2vs2 30%x360000//100 gated 2vs3 30%x360000//100 gated 5vs4 20%x360000//100 gated 7vs6

