success_criteria:
  deterministic_checks:
    json_exact: '{"tranches_released": 2, "cents_released": 180000, "cents_held": 180000}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each tranche releases its percentage of the total only when its inspection count is strictly past its threshold, percentages apply to the full escrow total, never to a remainder
  - integer cents throughout, percentage of total computed as total times percent floor-divided by 100
  - held is total minus released, held is never negative and never silent, unreleased tranches stay held entirely
  facts:
  - the escrow total is 360000 whole units
  - tranche 1 is 20 percent with threshold 2 inspections passed 2, tranche 2 is 30 percent with threshold 3 inspections passed 2, tranche 3 is 30 percent with threshold 4 inspections passed 5, tranche 4 is 20 percent with threshold 6 inspections passed 7
  - no tranche amount is taken on faith tonight, every release is recomputed from the gate
  output_spec:
    tranches_released: int
    cents_released: int
    cents_held: int
contract:
  tranches_released:
    formula: ((g1 > t1) and 1 or 0) + ((g2 > t2) and 1 or 0) + ((g3 > t3) and 1 or 0) + ((g4 > t4) and 1 or 0)
    literals:
    - name: g1
      regex: tranche 1 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 2
    - name: g2
      regex: tranche 2 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 2
    - name: g3
      regex: tranche 3 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 5
    - name: g4
      regex: tranche 4 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 7
    - name: t1
      regex: tranche 1 is \d+ percent with threshold (\d+) inspections
      value: 2
    - name: t2
      regex: tranche 2 is \d+ percent with threshold (\d+) inspections
      value: 3
    - name: t3
      regex: tranche 3 is \d+ percent with threshold (\d+) inspections
      value: 4
    - name: t4
      regex: tranche 4 is \d+ percent with threshold (\d+) inspections
      value: 6
  cents_released:
    formula: ((g1 > t1) and (T * 20 // 100) or 0) + ((g2 > t2) and (T * 30 // 100) or 0) + ((g3 > t3) and (T * 30 // 100) or 0) + ((g4 > t4) and (T * 20 // 100) or 0)
    literals:
    - name: T
      regex: escrow total is (\d+) whole units
      value: 360000
    - name: g1
      regex: tranche 1 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 2
    - name: g2
      regex: tranche 2 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 2
    - name: g3
      regex: tranche 3 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 5
    - name: g4
      regex: tranche 4 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 7
    - name: t1
      regex: tranche 1 is \d+ percent with threshold (\d+) inspections
      value: 2
    - name: t2
      regex: tranche 2 is \d+ percent with threshold (\d+) inspections
      value: 3
    - name: t3
      regex: tranche 3 is \d+ percent with threshold (\d+) inspections
      value: 4
    - name: t4
      regex: tranche 4 is \d+ percent with threshold (\d+) inspections
      value: 6
  cents_held:
    formula: T - cents_released
    literals: []
v6:
  entities:
  - id: T
    question: the escrow total in whole units (copy the number from its fact line)
    answer: 360000
  - id: thr1
    question: tranche 1's inspection threshold (copy the number from its fact line)
    answer: 2
  - id: thr2
    question: tranche 2's inspection threshold (copy the number from its fact line)
    answer: 3
  - id: thr3
    question: tranche 3's inspection threshold (copy the number from its fact line)
    answer: 4
  - id: thr4
    question: tranche 4's inspection threshold (copy the number from its fact line)
    answer: 6
  - id: got1
    question: tranche 1's inspections passed (copy the number from its fact line)
    answer: 2
  - id: got2
    question: tranche 2's inspections passed (copy the number from its fact line)
    answer: 2
  - id: got3
    question: tranche 3's inspections passed (copy the number from its fact line)
    answer: 5
  - id: got4
    question: tranche 4's inspections passed (copy the number from its fact line)
    answer: 7
  - id: rel1
    question: tranche 1's released amount in whole units (apply the gate to its threshold, zero if held)
    answer: 0
  - id: rel2
    question: tranche 2's released amount in whole units (apply the gate to its threshold, zero if held)
    answer: 0
  - id: rel3
    question: tranche 3's released amount in whole units (apply the gate to its threshold, zero if held)
    answer: 108000
  - id: rel4
    question: tranche 4's released amount in whole units (apply the gate to its threshold, zero if held)
    answer: 72000
  - id: nrel
    question: how many tranches released (count them)
    answer: 2
  - id: held
    question: the held amount in whole units (total minus everything released)
    answer: 180000
  aggregate: '{''tranches_released'': ((a(''got1'') > a(''thr1'')) and 1 or 0) + ((a(''got2'') > a(''thr2'')) and 1 or 0) + ((a(''got3'') > a(''thr3'')) and 1 or 0) + ((a(''got4'') > a(''thr4'')) and 1 or 0), ''cents_released'': ((a(''got1'') > a(''thr1'')) and (a(''T'') * 20 // 100) or 0) + ((a(''got2'') > a(''thr2'')) and (a(''T'') * 30 // 100) or 0) + ((a(''got3'') > a(''thr3'')) and (a(''T'') *
    30 // 100) or 0) + ((a(''got4'') > a(''thr4'')) and (a(''T'') * 20 // 100) or 0), ''cents_held'': a(''T'') - (((a(''got1'') > a(''thr1'')) and (a(''T'') * 20 // 100) or 0) + ((a(''got2'') > a(''thr2'')) and (a(''T'') * 30 // 100) or 0) + ((a(''got3'') > a(''thr3'')) and (a(''T'') * 30 // 100) or 0) + ((a(''got4'') > a(''thr4'')) and (a(''T'') * 20 // 100) or 0))}'
