  all three wallets, floored at zero, the desk reports it even when it is zero, especially when it is zero.


  the facts of record: the sticker price is 2900 whole cents and the bundle threshold is 3000 whole cents with a 9 percent bundle discount wallet one holds 1700, wallet two holds 1700, wallet three holds 300, all whole cents the cage quotes no payable tonight, the bundle rule decides it and the desk applies it.


