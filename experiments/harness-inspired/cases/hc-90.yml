  archetype=cert_renewal variant=3 seed=89'
success_criteria:
  deterministic_checks:
    json_exact: '{"renewed": 3, "expiring_soon": 1, "stable": 0, "renew_window": 45}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - any certificate with less than 45 days of validity left renews tonight, no exceptions, no appeals
  - certificates with 45 or more but under 135 days are flagged expiring-soon, flagged is not renewed
  - renewal stagger is automatic, count renewals, do not schedule them
  facts:
  - one has 44 days left, two has 13 days left, three has 72 days left, four has 30 days left
  output_spec:
    renewed: int
    expiring_soon: int
    stable: int
    renew_window: int
contract:
  renewed:
    formula: (d1<M)+(d2<M)+(d3<M)+(d4<M)
    literals:
    - name: d1
      regex: one has (\d+) days left
      value: 44
    - name: d2
      regex: two has (\d+) days left
      value: 13
    - name: d3
      regex: three has (\d+) days left
      value: 72
    - name: d4
      regex: four has (\d+) days left
      value: 30
    - name: M
      regex: less than (\d+) days of validity
      value: 45
  expiring_soon:
    formula: (d1>=M and d1<3*M)+(d2>=M and d2<3*M)+(d3>=M and d3<3*M)+(d4>=M and d4<3*M)
    literals: []
  stable:
    formula: 4 - renewed - expiring_soon
    literals: []
v6:
  entities:
  - id: d1
    question: 'days left on one (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 44
  - id: d2
    question: 'days left on two (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 13
  - id: d3
    question: 'days left on three (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 72
  - id: d4
    question: 'days left on four (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 30
  - id: rw
    question: 'the renew line in days (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 45
  aggregate: '{''renewed'': (a(''d1'')<a(''rw''))+(a(''d2'')<a(''rw''))+(a(''d3'')<a(''rw''))+(a(''d4'')<a(''rw'')), ''expiring_soon'': (a(''d1'')>=a(''rw''))*(a(''d1'')<3*a(''rw''))+(a(''d2'')>=a(''rw''))*(a(''d2'')<3*a(''rw''))+(a(''d3'')>=a(''rw''))*(a(''d3'')<3*a(''rw''))+(a(''d4'')>=a(''rw''))*(a(''d4'')<3*a(''rw'')),
    ''stable'': (a(''d1'')>=3*a(''rw''))+(a(''d2'')>=3*a(''rw''))+(a(''d3'')>=3*a(''rw''))+(a(''d4'')>=3*a(''rw'')), ''renew_window'': int(a(''rw''))}'
