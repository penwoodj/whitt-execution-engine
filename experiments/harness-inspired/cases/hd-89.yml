success_criteria:
  deterministic_checks:
    json_exact: '{"poison_events": 3, "fails_total": 6, "longest_fail_streak": 2}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - an event goes poison on its second consecutive strike, a strike is a fail, two strikes back to back mark poison only strictly past the first strike landing on the second, the classic two-strike rule, poison resets the strike counter
  - a clean streak of three or more ok events forgives prior strikes, the strike counter resets to zero after such a streak, forgiveness is total and immediate
  - the report wants poison events, total fails, and the longest consecutive fail streak, each counted across the whole sequence
  facts:
  - the sieve saw the sequence fail fail ok ok fail ok fail fail ok ok fail ok
  - total fails work out to 6 and the longest fail run works out to 2
  - the sieve classified 3 poison events tonight
  output_spec:
    poison_events: int
    fails_total: int
    longest_fail_streak: int
contract:
  poison_events:
    formula: P
    literals:
    - name: P
      regex: classified (\d+) poison events
      value: 3
  fails_total:
    formula: F
    literals:
    - name: F
      regex: total fails work out to (\d+)
      value: 6
  longest_fail_streak:
    formula: S
    literals:
    - name: S
      regex: longest fail run works out to (\d+)
      value: 2
v6:
  entities:
  - id: fails
    question: how many fail events appear in the sequence (count them)
    answer: 6
  - id: oks
    question: how many ok events appear in the sequence (count them)
    answer: 6
  - id: streak
    question: the longest run of consecutive fail events (count the run)
    answer: 2
  - id: poison
    question: how many poison events the sieve classified (two-strike rule applied)
    answer: 3
  - id: rst
    question: how many times the three-ok forgiveness fired (count the resets)
    answer: 0
  - id: tlen
    question: the total event count in the sequence (count every event)
    answer: 12
  aggregate: '{''poison_events'': int(a(''poison'')), ''fails_total'': int(a(''fails'')), ''longest_fail_streak'': int(a(''streak''))}'
