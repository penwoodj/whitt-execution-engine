objective: derive poison_events, fails_total, longest_fail_streak from the stated rules
prompt: 'the reconciliation desk keeps the duty rail honest, which is a full-time job on a graveyard, so the desk works the problem the slow way, on purpose.


  the poison sieve reads a stream of ok and fail the way a judge reads priors, one fail is an accident, two in a row is a character assessment, and three clean events in a row buy back a reputation


  the strike counter is the whole state machine, strikes build, strikes clear on streaks, poison fires on the second consecutive strike and resets itself, anything more elaborate than that has historically misfired


  the desk tallies fails and streaks mechanically, the streak is the longest unbroken run of fails, not the number of strikes, the two get confused by people who should know better


  the rules of the desk, as they stand tonight: 1. an event goes poison on its second consecutive strike, a strike is a fail, two strikes back to back mark poison only strictly past the first strike landing on the second, the classic two-strike rule, poison resets the strike counter. 2. a clean streak of three or more ok events forgives prior strikes, the strike counter resets to zero after such a streak,
  forgiveness is total and immediate. 3. the report wants poison events, total fails, and the longest consecutive fail streak, each counted across the whole sequence.


  the facts of record: the sieve saw the sequence fail fail ok ok fail ok fail fail ok ok fail ok total fails work out to 6 and the longest fail run works out to 2 the sieve classified 3 poison events tonight.


