objective: derive executed, lock_violators, jobs_total, longest_run from the stated rules
prompt: 'you inherited the seating sheet three weeks ago, the runbook has been rewritten twice since then, this is the current version, count what landed, not what tried.


  the cron rack had a noisy night, poll-5m fires every 5 minutes, runs 3 minutes, and overran 11 times tonight, rollup fires every 60 minutes, runs 12 minutes, and overran 2 times tonight. count firings
  as executed whether they lived or died, the lock line decides who dies, the schedule decides nothing else.


  the kill-at-lock rule replaced the old wait-forever rule after a nine-hour vacuum ate a monday, dead runs still count as firings, that clause is deliberate and it is in the rules.


  the scheduler ui you do not manage shades overlapping rectangles for prettiness, the shading algorithm lies about boundaries, trust the numbers above.


  the rules of the desk, as they stand tonight: 1. a run holds the lock for its duration or 10 minutes, whichever is shorter, longer runs get killed at the lock line. 2. a killed run counts as executed
  but failed, it still blocks nothing after death. 3. the next firing of a killed job proceeds on schedule, backpressure does not exist here.


  the facts of record: poll-5m fires every 5 minutes, runs 3 minutes, and overran 11 times tonight, rollup fires every 60 minutes, runs 12 minutes, and overran 2 times tonight.


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


