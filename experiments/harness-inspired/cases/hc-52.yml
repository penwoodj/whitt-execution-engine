auxiliary: all facts needed are in the prompt itself
provenance: 'acked_on_time = pages with ack <= window = 0 + 0 + 1 + 1 = 2

  escalated = pages with ack > window = 2

  sev1_pages = 1

  sev1_escalated = 1

  archetype=ack_windows variant=2 seed=51'
success_criteria:
  deterministic_checks:
    json_exact: '{"acked_on_time": 2, "escalated": 2, "sev1_pages": 1, "sev1_escalated": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - an ack counts as on-time only if it lands within the window, an ack exactly at the window edge is on-time, past it is a miss
  - a missed window escalates once to the secondary, the secondary ack does not rewind the original miss
  - severity is a label for reporting, it changes no windows, windows are per-page
  facts:
  - m1 came in as sev1, was acked in 9 minutes against a 5 minute window, m2 came in as sev2, was acked in 30 minutes against a 15 minute window, m3 came in as sev2, was acked in 14 minutes against a 30
    minute window, m4 came in as sev3, was acked in 44 minutes against a 60 minute window
  output_spec:
    acked_on_time: int
    escalated: int
    sev1_pages: int
    sev1_escalated: int
contract:
  acked_on_time:
    formula: (a1<=w1)+(a2<=w2)+(a3<=w3)+(a4<=w4)
    literals:
    - name: a1
      regex: m1 came in as \w+, was acked in (\d+) minutes
      value: 9
    - name: w1
      regex: m1 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 5
    - name: a2
      regex: m2 came in as \w+, was acked in (\d+) minutes
      value: 30
    - name: w2
      regex: m2 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 15
    - name: a3
      regex: m3 came in as \w+, was acked in (\d+) minutes
      value: 14
    - name: w3
      regex: m3 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 30
    - name: a4
      regex: m4 came in as \w+, was acked in (\d+) minutes
      value: 44
    - name: w4
      regex: m4 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 60
  escalated:
    formula: 4 - acked_on_time
    literals: []
  sev1_pages:
    formula: (g1=='sev1')+(g2=='sev1')+(g3=='sev1')+(g4=='sev1')
    literals:
    - name: g1
      regex: m1 came in as (\w+),
      value: sev1
    - name: g2
      regex: m2 came in as (\w+),
      value: sev2
    - name: g3
      regex: m3 came in as (\w+),
      value: sev2
    - name: g4
      regex: m4 came in as (\w+),
      value: sev3
  sev1_escalated:
    formula: ((g1=='sev1')*(a1>w1))+((g2=='sev1')*(a2>w2))+((g3=='sev1')*(a3>w3))+((g4=='sev1')*(a4>w4))
    literals:
    - name: a1
      regex: m1 came in as \w+, was acked in (\d+) minutes
      value: 9
    - name: w1
      regex: m1 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 5
    - name: a2
      regex: m2 came in as \w+, was acked in (\d+) minutes
      value: 30
    - name: w2
      regex: m2 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 15
    - name: a3
      regex: m3 came in as \w+, was acked in (\d+) minutes
      value: 14
    - name: w3
      regex: m3 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 30
    - name: a4
      regex: m4 came in as \w+, was acked in (\d+) minutes
      value: 44
    - name: w4
      regex: m4 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 60
    - name: g1
      regex: m1 came in as (\w+),
      value: sev1
    - name: g2
      regex: m2 came in as (\w+),
      value: sev2
    - name: g3
      regex: m3 came in as (\w+),
      value: sev2
    - name: g4
      regex: m4 came in as (\w+),
      value: sev3
v6:
  entities:
  - id: acked
    question: pages acked within their window (ack minutes <= window minutes)
    answer: 2
  - id: esc
    question: pages that missed their window and escalated (ack minutes > window minutes)
    answer: 2
  - id: s1_total
    question: total sev1 pages tonight
    answer: 1
  - id: s1_esc
    question: sev1 pages that escalated
    answer: 1
  aggregate: '{''acked_on_time'': int(a(''acked'')), ''escalated'': int(a(''esc'')), ''sev1_pages'': int(a(''s1_total'')), ''sev1_escalated'': int(a(''s1_esc''))}'
