case_id: hc-52
category: field-ops
difficulty: light
hops: 4
archetype: ack_windows
variant: 2
domain: on-call paging tiers
objective: derive acked_on_time, escalated, sev1_pages, sev1_escalated from the stated rules
prompt: 'assignment: the sweep ledger, night rotation, the rules came down from compliance last quarter, work the rules in order, the order is the logic.


  the pager tree woke you 4 times tonight, m1 came in as sev1, was acked in 9 minutes against a 5 minute window, m2 came in as sev2, was acked in 30 minutes against a 15 minute window, m3 came in as sev2,
  was acked in 14 minutes against a 30 minute window, m4 came in as sev3, was acked in 44 minutes against a 60 minute window. the ack clock starts when the page fires, not when you read it, that distinction
  has cost people their morning. count the misses straight, no rounding, no benefit of the doubt.


  the escalation ladder was rewritten after a sev1 sat unowned for forty minutes while two people each assumed the other had it. one escalation per miss, the secondary either catches it or it goes to the
  bridge, tonight it never reached the bridge.


  the paging gateway you do not manage also posts reminder thumps every ten minutes for un-acked pages, reminders are not acks and never were.


  the rules of the desk, as they stand tonight: 1. an ack counts as on-time only if it lands within the window, an ack exactly at the window edge is on-time, past it is a miss. 2. a missed window escalates
  once to the secondary, the secondary ack does not rewind the original miss. 3. severity is a label for reporting, it changes no windows, windows are per-page.


  the facts of record: m1 came in as sev1, was acked in 9 minutes against a 5 minute window, m2 came in as sev2, was acked in 30 minutes against a 15 minute window, m3 came in as sev2, was acked in 14 minutes
  against a 30 minute window, m4 came in as sev3, was acked in 44 minutes against a 60 minute window.


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


