  wants pooled seats, bookable seats, and overflow, in whole seats.


  the facts of record: room one seats 45 with the tech rig and room two seats 30 without the session wants 70 attendees and the tech need is 40 seats the comb quotes neither pool nor ceiling tonight, both derive from the room facts.


