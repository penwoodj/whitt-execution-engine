provenance: 'blocked=2 approved=1 over=3 exactly_at=1

  archetype=fuel_cards variant=2 seed=67'
success_criteria:
  deterministic_checks:
    json_exact: '{"blocked": 2, "exception_approved": 1, "over_cap": 3, "at_cap_exactly": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - spending at or over the daily cap flags the card, exactly-at is flagged same as over
  - a flagged card with a pre-filed route exception goes to the approved pile, everything else blocks until a human calls in
  - blocked tonight does not mean fired, it means the morning list, count them anyway
  facts:
  - t1 burned 30 liters against a 25 liter cap, t2 burned 25 liters against a 25 liter cap with a pre-filed exception, t3 burned 26 liters against a 25 liter cap
  output_spec:
    blocked: int
    exception_approved: int
    over_cap: int
    at_cap_exactly: int
contract:
  at_cap_exactly:
    formula: (s1==c1)+(s2==c2)+(s3==c3)
    literals:
    - name: s1
      regex: t1 burned (\d+) liters
      value: 30
    - name: c1
      regex: t1 burned \d+ liters against a (\d+) liter cap
      value: 25
    - name: s2
      regex: t2 burned (\d+) liters
      value: 25
    - name: c2
      regex: t2 burned \d+ liters against a (\d+) liter cap
      value: 25
    - name: s3
      regex: t3 burned (\d+) liters
      value: 26
    - name: c3
      regex: t3 burned \d+ liters against a (\d+) liter cap
      value: 25
  over_cap:
    formula: (s1>=c1)+(s2>=c2)+(s3>=c3)
    literals: []
v6:
  entities:
  - id: s1
    question: 'liters t1 burned (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 30
  - id: s2
    question: 'liters t2 burned (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 25
  - id: s3
    question: 'liters t3 burned (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 26
  - id: c1
    question: 't1''s cap in liters (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 25
  - id: c2
    question: 't2''s cap in liters (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 25
  - id: c3
    question: 't3''s cap in liters (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 25
  - id: x1
    question: 'does t1 have a pre-filed exception, one word yes or no. hint: answer with exactly one word copied from the fact line.'
    answer: 'no'
  - id: x2
    question: 'does t2 have a pre-filed exception, one word yes or no. hint: answer with exactly one word copied from the fact line.'
    answer: 'yes'
  - id: x3
    question: 'does t3 have a pre-filed exception, one word yes or no. hint: answer with exactly one word copied from the fact line.'
    answer: 'no'
  aggregate: '{''blocked'': (a(''s1'')>=a(''c1''))*(a(''x1'')==''no'')+(a(''s2'')>=a(''c2''))*(a(''x2'')==''no'')+(a(''s3'')>=a(''c3''))*(a(''x3'')==''no''), ''exception_approved'': (a(''s1'')>=a(''c1''))*(a(''x1'')==''yes'')+(a(''s2'')>=a(''c2''))*(a(''x2'')==''yes'')+(a(''s3'')>=a(''c3''))*(a(''x3'')==''yes''),
    ''over_cap'': (a(''s1'')>=a(''c1''))+(a(''s2'')>=a(''c2''))+(a(''s3'')>=a(''c3'')), ''at_cap_exactly'': (a(''s1'')==a(''c1''))+(a(''s2'')==a(''c2''))+(a(''s3'')==a(''c3''))}'
