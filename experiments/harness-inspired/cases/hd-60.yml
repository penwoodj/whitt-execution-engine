prompt: 'every shift on the room comb starts the same way, coffee, then the counts, then the arguments about the counts, and the tally lamp is on, which means somebody''s numbers are about to be wrong.


  the rota wheel is arithmetic wearing a hi-vis vest, pins shrink the modulus, the modulus is the moving count, and anyone who mods by the roster size gets to explain themselves at the morning huddle


  tonight''s wrap flag is about whether the steps reached at-or-over the roster size, which sounds ceremonial until payroll asks why a six-slot rota paid out nine shifts


  the desk computes moving count first, landing second, wrap last, and never lets the wrap flag leak into the landing math, they are separate clauses with separate jobs


  the rules of the desk, as they stand tonight: 1. the carousel advances one slot per step, pinned slots are skipped and never landed on, landing is modulo the moving count, not the roster. 2. a shift requires a fresh landing when steps at-or-over the roster size — the wrap flag records whether tonight''s steps reached that bar, the flag is true only then. 3. the landed index counts only moving slots,
  pins shrink the modulus, the roster number itself never changes.


  the facts of record: the rota holds 6 slots and tonight''s holder sits at index 0 the rota advances 11 steps tonight 0 slots are pinned tonight and the moving count works out to 6.


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


