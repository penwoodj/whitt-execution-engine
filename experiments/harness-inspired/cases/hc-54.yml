  archetype=backoff_budget variant=2 seed=53'
success_criteria:
  deterministic_checks:
    json_exact: '{"budget_burned": 62, "budget_left": -37, "jobs_count": 2, "longest_wait": 6}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each retry waits double the previous wait, starting at 1 minutes, no single wait exceeds the 6 minute cap
  - the shared retry budget is 25 minutes across all jobs, it is a ledger line, work already started always finishes, overruns show up as negative headroom in the report
  - a job that exhausts its declared failures stops, it does not borrow budget from tomorrow
  facts:
  - scan-a failed 3 times with each run taking 2 minutes, scan-b failed 6 times with each run taking 4 minutes
  output_spec:
    budget_burned: int
    budget_left: int
    jobs_count: int
    longest_wait: int
contract:
  budget_burned:
    formula: (min(1*BASE,CAP)*(0<F1))+(min(2*BASE,CAP)*(1<F1))+(min(4*BASE,CAP)*(2<F1))+(min(8*BASE,CAP)*(3<F1))+(min(16*BASE,CAP)*(4<F1))+(min(32*BASE,CAP)*(5<F1))+F1*D1+(min(1*BASE,CAP)*(0<F2))+(min(2*BASE,CAP)*(1<F2))+(min(4*BASE,CAP)*(2<F2))+(min(8*BASE,CAP)*(3<F2))+(min(16*BASE,CAP)*(4<F2))+(min(32*BASE,CAP)*(5<F2))+F2*D2
    literals:
    - name: BASE
      regex: starting at (\d+) minutes
      value: 1
    - name: CAP
      regex: exceeds the (\d+) minute cap
      value: 6
    - name: F1
      regex: scan-a failed (\d+) times
      value: 3
    - name: D1
      regex: scan-a failed \d+ times with each run taking (\d+) minutes
      value: 2
    - name: F2
      regex: scan-b failed (\d+) times
      value: 6
    - name: D2
      regex: scan-b failed \d+ times with each run taking (\d+) minutes
      value: 4
  budget_left:
    formula: T - budget_burned
    literals:
    - name: T
      regex: shared retry budget is (\d+) minutes
      value: 25
  jobs_count:
    formula: '2'
    literals: []
  longest_wait:
    formula: max(min(2**(F1-1)*BASE,CAP),min(2**(F2-1)*BASE,CAP))
    literals:
    - name: BASE
      regex: starting at (\d+) minutes
      value: 1
    - name: CAP
      regex: exceeds the (\d+) minute cap
      value: 6
    - name: F1
      regex: scan-a failed (\d+) times
      value: 3
    - name: D1
      regex: scan-a failed \d+ times with each run taking (\d+) minutes
      value: 2
    - name: F2
      regex: scan-b failed (\d+) times
      value: 6
    - name: D2
      regex: scan-b failed \d+ times with each run taking (\d+) minutes
      value: 4
v6:
  entities:
  - id: bs
    question: 'the starting wait in minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 1
  - id: cp
    question: 'the wait cap in minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 6
  - id: bt
    question: 'the shared retry budget in minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 25
  - id: f1
    question: 'times scan-a failed (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3
  - id: f2
    question: 'times scan-b failed (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 6
  - id: du1
    question: 'minutes each scan-a run takes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2
  - id: du2
    question: 'minutes each scan-b run takes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 4
  aggregate: '{''budget_burned'': (min(1*a(''bs''),a(''cp''))*(0<a(''f1'')))+(min(2*a(''bs''),a(''cp''))*(1<a(''f1'')))+(min(4*a(''bs''),a(''cp''))*(2<a(''f1'')))+(min(8*a(''bs''),a(''cp''))*(3<a(''f1'')))+(min(16*a(''bs''),a(''cp''))*(4<a(''f1'')))+(min(32*a(''bs''),a(''cp''))*(5<a(''f1'')))+a(''f1'')*a(''du1'')+(min(1*a(''bs''),a(''cp''))*(0<a(''f2'')))+(min(2*a(''bs''),a(''cp''))*(1<a(''f2'')))+(min(4*a(''bs''),a(''cp''))*(2<a(''f2'')))+(min(8*a(''bs''),a(''cp''))*(3<a(''f2'')))+(min(16*a(''bs''),a(''cp''))*(4<a(''f2'')))+(min(32*a(''bs''),a(''cp''))*(5<a(''f2'')))+a(''f2'')*a(''du2''),
    ''budget_left'': a(''bt'')-((min(1*a(''bs''),a(''cp''))*(0<a(''f1'')))+(min(2*a(''bs''),a(''cp''))*(1<a(''f1'')))+(min(4*a(''bs''),a(''cp''))*(2<a(''f1'')))+(min(8*a(''bs''),a(''cp''))*(3<a(''f1'')))+(min(16*a(''bs''),a(''cp''))*(4<a(''f1'')))+(min(32*a(''bs''),a(''cp''))*(5<a(''f1'')))+a(''f1'')*a(''du1'')+(min(1*a(''bs''),a(''cp''))*(0<a(''f2'')))+(min(2*a(''bs''),a(''cp''))*(1<a(''f2'')))+(min(4*a(''bs''),a(''cp''))*(2<a(''f2'')))+(min(8*a(''bs''),a(''cp''))*(3<a(''f2'')))+(min(16*a(''bs''),a(''cp''))*(4<a(''f2'')))+(min(32*a(''bs''),a(''cp''))*(5<a(''f2'')))+a(''f2'')*a(''du2'')),
    ''jobs_count'': 2, ''longest_wait'': max(min(2**(a(''f1'')-1)*a(''bs''),a(''cp'')),min(2**(a(''f2'')-1)*a(''bs''),a(''cp'')))}'
