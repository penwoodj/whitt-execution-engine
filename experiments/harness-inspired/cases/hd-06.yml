prompt: 'nobody remembers when the poison sieve was installed, everybody remembers the night it was wrong, and the tally lamp is on, which means somebody''s numbers are about to be wrong.


  the per-diem booth processes three claims tonight and the only debate is the flag line, at-or-over the cap, a claim that lands exactly on its cap is the classic desk argument, settled by tonight''s convention and re-argued every night after


  the payout itself is boring, the smaller of two numbers, the interesting part is what the flag implies for next quarter''s advance, which is why the flag word gets read carefully


  clawback accounting only ever touches flagged claims, unflagged claims contribute nothing to the claw total, not even their rounding dust


  the rules of the desk, as they stand tonight: 1. per-diem cap is the nightly rate times nights, a claim flags at-or-over its cap, flagging is about the claim, not the payout. 2. reimbursement pays the smaller of submitted and cap, whole cents, never negative, never rounded. 3. clawed back is the part of flagged claims above their caps, summed across flagged travelers only.


  the facts of record: the nightly rate is 16500 whole cents june-a spent 3 nights and submitted 45000 whole cents, june-b spent 4 nights and submitted 70200 whole cents, june-c spent 2 nights and submitted 33000 whole cents the booth recomputes every cap and every payout from the rate and the nights.


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


