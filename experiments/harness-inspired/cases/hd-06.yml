task_core:
  rules:
  - per-diem cap is the nightly rate times nights, a claim flags at-or-over its cap, flagging is about the claim, not the payout
  - reimbursement pays the smaller of submitted and cap, whole cents, never negative, never rounded
  - clawed back is the part of flagged claims above their caps, summed across flagged travelers only
  facts:
  - the nightly rate is 16500 whole cents
  - june-a spent 3 nights and submitted 45000 whole cents, june-b spent 4 nights and submitted 70200 whole cents, june-c spent 2 nights and submitted 33000 whole cents
  - the booth recomputes every cap and every payout from the rate and the nights
  output_spec:
    travelers_flagged: int
    total_reimbursed_cents: int
    clawed_back_cents: int
contract:
  travelers_flagged:
    formula: (s1 >= (rate * k1)) + (s2 >= (rate * k2)) + (s3 >= (rate * k3))
    literals:
    - name: s1
      regex: june-a spent \d+ nights and submitted (\d+) whole cents
      value: 45000
    - name: s2
      regex: june-b spent \d+ nights and submitted (\d+) whole cents
      value: 70200
    - name: s3
      regex: june-c spent \d+ nights and submitted (\d+) whole cents
      value: 33000
    - name: k1
      regex: june-a spent (\d+) nights
      value: 3
    - name: k2
      regex: june-b spent (\d+) nights
      value: 4
    - name: k3
      regex: june-c spent (\d+) nights
      value: 2
    - name: rate
      regex: nightly rate is (\d+) whole cents
      value: 16500
  total_reimbursed_cents:
    formula: min(s1, (rate * k1)) + min(s2, (rate * k2)) + min(s3, (rate * k3))
    literals:
    - name: k1
      regex: june-a spent (\d+) nights
      value: 3
    - name: k2
      regex: june-b spent (\d+) nights
      value: 4
    - name: k3
      regex: june-c spent (\d+) nights
      value: 2
    - name: rate
      regex: nightly rate is (\d+) whole cents
      value: 16500
    - name: s1
      regex: june-a spent \d+ nights and submitted (\d+) whole cents
      value: 45000
    - name: s2
      regex: june-b spent \d+ nights and submitted (\d+) whole cents
      value: 70200
    - name: s3
      regex: june-c spent \d+ nights and submitted (\d+) whole cents
      value: 33000
  clawed_back_cents:
    formula: ((s1 >= (rate * k1)) and (s1 - (rate * k1)) or 0) + ((s2 >= (rate * k2)) and (s2 - (rate * k2)) or 0) + ((s3 >= (rate * k3)) and (s3 - (rate * k3)) or 0)
    literals: []
