domain: gym class capacity
objective: derive standby_confirmed, standby_left, credits_refunded, no_shows from the stated rules
prompt: 'you hold the pager for the deploy lane until midnight, after that it goes to someone who trusts your counts, when a rule sends work back, the second pass follows the same rules.


  the roster locks at start time, the class caps at 12, 12 booked, 4 of those no-showed, 9 names sat on the standby queue, 5 credits are pending automatic refund. frees first, standby fills frees, leftovers
  stay queued, credits refund without anyone lifting a finger. four numbers out, no narrative.


  the automatic refund came from a billing dispute backlog, humans refunding by hand made errors at 2am, the rule now is the clock does it.


  the gym app you do not manage shows a live capacity bar with rounding, the bar is for morale, the roster is for truth.


  the rules of the desk, as they stand tonight: 1. no-show bookings free their spots at start time, freed spots go to standby in queue order. 2. standby beyond freed spots does not get in, no floor mats,
  no standing, capacity is capacity. 3. class credits held by no-shows refund automatically at the one-hour mark.


  the facts of record: the class caps at 12, 12 booked, 4 of those no-showed 9 names sat on the standby queue 5 credits are pending automatic refund.


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


