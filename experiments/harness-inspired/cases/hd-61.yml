auxiliary: all facts needed are in the prompt itself
provenance: 'n=900 pct=3 raw=27 floor_min=30

  floor_applied=True step=30 remaining=870

  raw=ceil(n*pct/100), stuck→floor

  archetype=canary_percent variant=2 seed=60'
success_criteria:
  deterministic_checks:
    json_exact: '{"step_users": 30, "floor_applied": true, "remaining_users": 870}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a ramp step releases ceil of cohort times percent over 100 users, rounding up always, the ramp is stuck when that raw step lands strictly under the floor minimum, stuck steps release exactly the floor minimum instead
  - a step is considered a real step at-or-over the floor minimum, below that the floor governs, the floor is a floor, not a suggestion
  - remaining is cohort minus the released step, the released step is the number that actually shipped, floor or no floor
  facts:
  - the cohort holds 900 users
  - tonight's ramp percent is 3 and the floor minimum is 30 users
  - the gate quotes no raw step tonight, the desk derives it before the floor rule speaks
  output_spec:
    step_users: int
    floor_applied: bool
    remaining_users: int
contract:
  step_users:
    formula: max(floor_min, (n * pct + 99) // 100)
    literals:
    - name: n
      regex: cohort holds (\d+) users
      value: 900
    - name: pct
      regex: ramp percent is (\d+)
      value: 3
    - name: floor_min
      regex: floor minimum is (\d+) users
      value: 30
  floor_applied:
    formula: bool((n * pct + 99) // 100 < floor_min)
    literals: []
  remaining_users:
    formula: n - step_users
    literals: []
v6:
  entities:
  - id: n
    question: cohort size in users (copy the number from its fact line)
    answer: 900
  - id: pct
    question: ramp percent (copy the number from its fact line)
    answer: 3
  - id: fm
    question: floor minimum in users (copy the number from its fact line)
    answer: 30
  - id: raw
    question: the raw step in users (ceil of cohort times percent over 100)
    answer: 27
  - id: step
    question: the step that actually ships in users (floor rule applied)
    answer: 30
  - id: fa
    question: floor applied, true or false (did raw land strictly under the floor minimum)
    answer: true
  - id: rem
    question: remaining users after the step ships (cohort minus shipped step)
    answer: 870
  aggregate: '{''step_users'': (max(a(''fm''), (a(''n'') * a(''pct'') + 99) // 100)), ''floor_applied'': bool((a(''n'') * a(''pct'') + 99) // 100 < a(''fm'')), ''remaining_users'': a(''n'') - max(a(''fm''), (a(''n'') * a(''pct'') + 99) // 100)}'
