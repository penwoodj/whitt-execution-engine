objective: derive step_users, floor_applied, remaining_users from the stated rules
prompt: 'the boundary desk keeps the tag press honest, which is a full-time job on a cold, and tonight is one of those nights where every clause earns its keep.


  the ramp gate moves percentages of people and the percentage of a person has never once been valid, so ceil, always ceil, the argument against ceil died the night a half-user got a notification and called support


  the floor minimum exists for the weeks when the percent rounds up to something embarrassing, the floor says the ramp shall not whisper, it shall speak at least this loudly


  the desk computes raw, applies the floor if raw falls under it, and reports what shipped, not what was intended, the two differ exactly when the floor fires


  the rules of the desk, as they stand tonight: 1. a ramp step releases ceil of cohort times percent over 100 users, rounding up always, the ramp is stuck when that raw step lands strictly under the floor minimum, stuck steps release exactly the floor minimum instead. 2. a step is considered a real step at-or-over the floor minimum, below that the floor governs, the floor is a floor, not a suggestion.
  3. remaining is cohort minus the released step, the released step is the number that actually shipped, floor or no floor.


  the facts of record: the cohort holds 900 users tonight''s ramp percent is 3 and the floor minimum is 30 users the gate quotes no raw step tonight, the desk derives it before the floor rule speaks.


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


  the margin notes in the binder argue with each other in three different hands, the rules themselves have never once argued back


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


