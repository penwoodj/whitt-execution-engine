  entities:
  - id: departed
    question: cars on the departed train (6 first-window survivors + 2 replacements)
    answer: 8
  - id: rolled_back
    question: candidates rolled back after failing smoke (billing, file-preview)
    answer: 2
  - id: waitlisted
    question: 'candidates never boarded nor rolled back (all 10 accounted: 8 departed + 2 rolled back)'
    answer: 0
  aggregate: '{"departed": a(departed), "rolled_back": a(rolled_back), "waitlisted": a(waitlisted)}'
