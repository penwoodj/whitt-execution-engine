success_criteria:
  deterministic_checks:
    json_exact: '{"zones_over": 1, "zones_under": 0, "vent_minutes": 12, "overrides_active": 2}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - zones above 25 degrees vent until back in band, vent minutes accrue per zone per excursion
  - zones below 15 degrees heat, heating never counts against vent minutes
  - manual overrides lock a zone's vents closed, overrides are counted and never argued with
  facts:
  - zone gh-1 reads 19 degrees with 0 vent minutes logged, zone gh-2 reads 28 degrees with 12 vent minutes logged, zone gh-3 reads 24 degrees with 3 vent minutes logged
  - the high band edge is 25, the low edge is 15
  - 2 manual overrides are active tonight
  output_spec:
    zones_over: int
    zones_under: int
    vent_minutes: int
    overrides_active: int
contract:
  zones_over:
    formula: (t1>H)+(t2>H)+(t3>H)
    literals:
    - name: t1
      regex: zone gh-1 reads (\d+) degrees
      value: 19
    - name: t2
      regex: zone gh-2 reads (\d+) degrees
      value: 28
    - name: t3
      regex: zone gh-3 reads (\d+) degrees
      value: 24
    - name: H
      regex: high band edge is (\d+)
      value: 25
  zones_under:
    formula: (t1<L)+(t2<L)+(t3<L)
    literals:
    - name: L
      regex: low edge is (\d+)
      value: 15
  vent_minutes:
    formula: m1*(t1>H)+m2*(t2>H)+m3*(t3>H)
    literals:
    - name: m1
      regex: zone gh-1 reads \d+ degrees with (\d+) vent minutes
      value: 0
    - name: m2
      regex: zone gh-2 reads \d+ degrees with (\d+) vent minutes
      value: 12
    - name: m3
      regex: zone gh-3 reads \d+ degrees with (\d+) vent minutes
      value: 3
v6:
  entities:
  - id: t1
    question: 'zone gh-1''s current reading in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 19
  - id: t2
    question: 'zone gh-2''s current reading in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 28
  - id: t3
    question: 'zone gh-3''s current reading in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 24
  - id: m1
    question: 'zone gh-1''s logged vent minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 0
  - id: m2
    question: 'zone gh-2''s logged vent minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 12
  - id: m3
    question: 'zone gh-3''s logged vent minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3
  - id: hi
    question: 'the high band edge in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 25
  - id: lo
    question: 'the low band edge in degrees (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 15
  - id: oa
    question: 'manual overrides active (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2
  aggregate: '{''zones_over'': (a(''t1'')>a(''hi''))+(a(''t2'')>a(''hi''))+(a(''t3'')>a(''hi'')), ''zones_under'': (a(''t1'')<a(''lo''))+(a(''t2'')<a(''lo''))+(a(''t3'')<a(''lo'')), ''vent_minutes'': a(''m1'')*(a(''t1'')>a(''hi''))+a(''m2'')*(a(''t2'')>a(''hi''))+a(''m3'')*(a(''t3'')>a(''hi'')),
    ''overrides_active'': int(a(''oa''))}'
