  the vent controller reports by zone, zone gh-1 reads 19 degrees with 0 vent minutes logged, zone gh-2 reads 28 degrees with 12 vent minutes logged, zone gh-3 reads 24 degrees with 3 vent minutes logged,
  the high band edge is 25, the low edge is 15, 2 manual overrides are active tonight. band edges are strict, above high vents, below low heats, in-band idles. vent minutes sum only for over-band zones,
  overrides lock zones out but still count as overrides.


  strict edges won after a season of hysteresis arguments, the controller now believes the thermometer and nothing else.


  the weather feed you do not manage forecasts band shifts overnight, forecasts do not move actuators, readings do.


  the rules of the desk, as they stand tonight: 1. zones above 25 degrees vent until back in band, vent minutes accrue per zone per excursion. 2. zones below 15 degrees heat, heating never counts against
  vent minutes. 3. manual overrides lock a zone''s vents closed, overrides are counted and never argued with.


  the facts of record: zone gh-1 reads 19 degrees with 0 vent minutes logged, zone gh-2 reads 28 degrees with 12 vent minutes logged, zone gh-3 reads 24 degrees with 3 vent minutes logged the high band
  edge is 25, the low edge is 15 2 manual overrides are active tonight.


