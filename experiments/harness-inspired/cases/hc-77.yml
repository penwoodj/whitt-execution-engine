auxiliary: all facts needed are in the prompt itself
provenance: 'acked_on_time = pages with ack <= window = 1 + 1 + 0 + 1 = 3

  escalated = pages with ack > window = 1

  sev1_pages = 1

  sev1_escalated = 0

  archetype=ack_windows variant=3 seed=76'
success_criteria:
  deterministic_checks:
    json_exact: '{"acked_on_time": 3, "escalated": 1, "sev1_pages": 1, "sev1_escalated": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - an ack counts as on-time only if it lands within the window, an ack exactly at the window edge is on-time, past it is a miss
  - a missed window escalates once to the secondary, the secondary ack does not rewind the original miss
  - severity is a label for reporting, it changes no windows, windows are per-page
  facts:
  - z1 came in as sev1, was acked in 16 minutes against a 20 minute window, z2 came in as sev2, was acked in 8 minutes against a 30 minute window, z3 came in as sev2, was acked in 35 minutes against a 30
    minute window, z4 came in as sev3, was acked in 119 minutes against a 120 minute window
  output_spec:
    acked_on_time: int
    escalated: int
    sev1_pages: int
    sev1_escalated: int
contract:
  acked_on_time:
    formula: (a1<=w1)+(a2<=w2)+(a3<=w3)+(a4<=w4)
    literals:
    - name: a1
      regex: z1 came in as \w+, was acked in (\d+) minutes
      value: 16
    - name: w1
      regex: z1 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 20
    - name: a2
      regex: z2 came in as \w+, was acked in (\d+) minutes
      value: 8
    - name: w2
      regex: z2 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 30
    - name: a3
      regex: z3 came in as \w+, was acked in (\d+) minutes
      value: 35
    - name: w3
      regex: z3 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 30
    - name: a4
      regex: z4 came in as \w+, was acked in (\d+) minutes
      value: 119
    - name: w4
      regex: z4 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 120
  escalated:
    formula: 4 - acked_on_time
    literals: []
  sev1_pages:
    formula: (g1=='sev1')+(g2=='sev1')+(g3=='sev1')+(g4=='sev1')
    literals:
    - name: g1
      regex: z1 came in as (\w+),
      value: sev1
    - name: g2
      regex: z2 came in as (\w+),
      value: sev2
    - name: g3
      regex: z3 came in as (\w+),
      value: sev2
    - name: g4
      regex: z4 came in as (\w+),
      value: sev3
  sev1_escalated:
    formula: ((g1=='sev1')*(a1>w1))+((g2=='sev1')*(a2>w2))+((g3=='sev1')*(a3>w3))+((g4=='sev1')*(a4>w4))
    literals:
    - name: a1
      regex: z1 came in as \w+, was acked in (\d+) minutes
      value: 16
    - name: w1
      regex: z1 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 20
    - name: a2
      regex: z2 came in as \w+, was acked in (\d+) minutes
      value: 8
    - name: w2
      regex: z2 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 30
    - name: a3
      regex: z3 came in as \w+, was acked in (\d+) minutes
      value: 35
    - name: w3
      regex: z3 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 30
    - name: a4
      regex: z4 came in as \w+, was acked in (\d+) minutes
      value: 119
    - name: w4
      regex: z4 came in as \w+, was acked in \d+ minutes against a (\d+) minute
      value: 120
    - name: g1
      regex: z1 came in as (\w+),
      value: sev1
    - name: g2
      regex: z2 came in as (\w+),
      value: sev2
    - name: g3
      regex: z3 came in as (\w+),
      value: sev2
    - name: g4
      regex: z4 came in as (\w+),
      value: sev3
v6:
  entities:
  - id: acked
    question: pages acked within their window (ack minutes <= window minutes)
    answer: 3
  - id: esc
    question: pages that missed their window and escalated (ack minutes > window minutes)
    answer: 1
  - id: s1_total
    question: total sev1 pages tonight
    answer: 1
  - id: s1_esc
    question: sev1 pages that escalated
    answer: 0
  aggregate: '{''acked_on_time'': int(a(''acked'')), ''escalated'': int(a(''esc'')), ''sev1_pages'': int(a(''s1_total'')), ''sev1_escalated'': int(a(''s1_esc''))}'
