case_id: hc-77
category: field-ops
difficulty: light
hops: 4
archetype: ack_windows
variant: 3
domain: on-call paging tiers
objective: derive acked_on_time, escalated, sev1_pages, sev1_escalated from the stated rules
prompt: 'you take the deploy lane for the storm, read the rules twice, they interact in ways that surprise people, when a rule sends work back, the second pass follows the same rules.


  the pager tree woke you 4 times tonight, z1 came in as sev1, was acked in 16 minutes against a 20 minute window, z2 came in as sev2, was acked in 8 minutes against a 30 minute window, z3 came in as sev2,
  was acked in 35 minutes against a 30 minute window, z4 came in as sev3, was acked in 119 minutes against a 120 minute window. the ack clock starts when the page fires, not when you read it, that distinction
  has cost people their morning. count the misses straight, no rounding, no benefit of the doubt.


  the escalation ladder was rewritten after a sev1 sat unowned for forty minutes while two people each assumed the other had it. one escalation per miss, the secondary either catches it or it goes to the
  bridge, tonight it never reached the bridge.


  the paging gateway you do not manage also posts reminder thumps every ten minutes for un-acked pages, reminders are not acks and never were.


  the rules of the desk, as they stand tonight: 1. an ack counts as on-time only if it lands within the window, an ack exactly at the window edge is on-time, past it is a miss. 2. a missed window escalates
  once to the secondary, the secondary ack does not rewind the original miss. 3. severity is a label for reporting, it changes no windows, windows are per-page.


  the facts of record: z1 came in as sev1, was acked in 16 minutes against a 20 minute window, z2 came in as sev2, was acked in 8 minutes against a 30 minute window, z3 came in as sev2, was acked in 35
  minutes against a 30 minute window, z4 came in as sev3, was acked in 119 minutes against a 120 minute window.


  nothing in this desk''s output survives on vibes, every figure traces to a clause, every clause traces to a night someone remembers


  the binder''s margins carry annotations from people who left, the annotations argue with each other, the rules themselves do not


