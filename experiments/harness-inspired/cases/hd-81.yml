objective: derive travelers_flagged, total_reimbursed_cents, clawed_back_cents from the stated rules
prompt: 'the poison sieve prints a receipt for everything, the boundary desk reads approximately half of them, the rules cover the rest, the counts below are tonight''s, the rules below are forever.


  the per-diem booth processes three claims tonight and the only debate is the flag line, strictly-past the cap, a claim that lands exactly on its cap is the classic desk argument, settled by tonight''s convention and re-argued every night after


  the payout itself is boring, the smaller of two numbers, the interesting part is what the flag implies for next quarter''s advance, which is why the flag word gets read carefully


  clawback accounting only ever touches flagged claims, unflagged claims contribute nothing to the claw total, not even their rounding dust


  the rules of the desk, as they stand tonight: 1. per-diem cap is the nightly rate times nights, a claim flags only when strictly past its cap, flagging is about the claim, not the payout. 2. reimbursement pays the smaller of submitted and cap, whole cents, never negative, never rounded. 3. clawed back is the part of flagged claims above their caps, summed across flagged travelers only.


  the facts of record: the nightly rate is 14000 whole cents run-2 spent 4 nights and submitted 56000 whole cents, run-3 spent 7 nights and submitted 91000 whole cents, run-4 spent 2 nights and submitted 31000 whole cents the booth recomputes every cap and every payout from the rate and the nights.


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


