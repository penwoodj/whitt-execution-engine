success_criteria:
  deterministic_checks:
    json_exact: '{"travelers_flagged": 1, "total_reimbursed_cents": 175000, "clawed_back_cents": 3000}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - per-diem cap is the nightly rate times nights, a claim flags only when strictly past its cap, flagging is about the claim, not the payout
  - reimbursement pays the smaller of submitted and cap, whole cents, never negative, never rounded
  - clawed back is the part of flagged claims above their caps, summed across flagged travelers only
  facts:
  - the nightly rate is 14000 whole cents
  - run-2 spent 4 nights and submitted 56000 whole cents, run-3 spent 7 nights and submitted 91000 whole cents, run-4 spent 2 nights and submitted 31000 whole cents
  - the booth recomputes every cap and every payout from the rate and the nights
  output_spec:
    travelers_flagged: int
    total_reimbursed_cents: int
    clawed_back_cents: int
contract:
  travelers_flagged:
    formula: (s1 > (rate * k1)) + (s2 > (rate * k2)) + (s3 > (rate * k3))
    literals:
    - name: s1
      regex: run-2 spent \d+ nights and submitted (\d+) whole cents
      value: 56000
    - name: s2
      regex: run-3 spent \d+ nights and submitted (\d+) whole cents
      value: 91000
    - name: s3
      regex: run-4 spent \d+ nights and submitted (\d+) whole cents
      value: 31000
    - name: k1
      regex: run-2 spent (\d+) nights
      value: 4
    - name: k2
      regex: run-3 spent (\d+) nights
      value: 7
    - name: k3
      regex: run-4 spent (\d+) nights
      value: 2
    - name: rate
      regex: nightly rate is (\d+) whole cents
      value: 14000
  total_reimbursed_cents:
    formula: min(s1, (rate * k1)) + min(s2, (rate * k2)) + min(s3, (rate * k3))
    literals:
    - name: k1
      regex: run-2 spent (\d+) nights
      value: 4
    - name: k2
      regex: run-3 spent (\d+) nights
      value: 7
    - name: k3
      regex: run-4 spent (\d+) nights
      value: 2
    - name: rate
      regex: nightly rate is (\d+) whole cents
      value: 14000
    - name: s1
      regex: run-2 spent \d+ nights and submitted (\d+) whole cents
      value: 56000
    - name: s2
      regex: run-3 spent \d+ nights and submitted (\d+) whole cents
      value: 91000
    - name: s3
      regex: run-4 spent \d+ nights and submitted (\d+) whole cents
      value: 31000
  clawed_back_cents:
    formula: ((s1 > (rate * k1)) and (s1 - (rate * k1)) or 0) + ((s2 > (rate * k2)) and (s2 - (rate * k2)) or 0) + ((s3 > (rate * k3)) and (s3 - (rate * k3)) or 0)
    literals: []
