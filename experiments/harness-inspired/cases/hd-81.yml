  - id: s2
    question: run-3's submitted amount in whole cents (copy the number from its fact line)
    answer: 91000
  - id: s3
    question: run-4's submitted amount in whole cents (copy the number from its fact line)
    answer: 31000
  - id: cp1
    question: run-2's cap in whole cents (rate times nights)
    answer: 56000
  - id: cp2
    question: run-3's cap in whole cents (rate times nights)
    answer: 98000
  - id: cp3
    question: run-4's cap in whole cents (rate times nights)
    answer: 28000
  - id: rb1
    question: run-2's reimbursement in whole cents (smaller of submitted and cap)
    answer: 56000
  - id: rb2
    question: run-3's reimbursement in whole cents (smaller of submitted and cap)
    answer: 91000
  - id: rb3
