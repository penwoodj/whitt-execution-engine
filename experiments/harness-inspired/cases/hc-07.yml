objective: derive reordered, quarantined_lines, damaged_units, healthy_lines from the stated rules
prompt: 'you hold the pager for the seating sheet until midnight, after that it goes to someone who trusts your counts, when a rule sends work back, the second pass follows the same rules.


  the restock floor counts damage at the door, bkt-1 shows 40 on hand, reorder point 25, damage 5, bkt-2 shows 12 on hand, reorder point 30, damage 0, bkt-3 shows 55 on hand, reorder point 25, damage 12.
  subtract damage, compare what is left to the reorder point, order or do not, then tally the quarantined units. the damage column gets read once and acted on everywhere.


  the reorder rules were tightened after a wave where shelves looked full and were full of things nobody could sell. healthy stock is what counts toward reorder decisions, damaged stock counts toward quarantine
  and nothing else.


  the damage inspector you do not manage logs suspected damage separately, suspicion is not damage until the clipboard says so, the clipboard here is the facts above.


  the rules of the desk, as they stand tonight: 1. damaged units leave stock before any reorder math runs, damage first, thresholds second. 2. a line at or below its reorder point orders more, at-or-below
  means exactly equal counts too. 3. any line with damage above zero quarantines that line''s damaged units, the rest of the line stays sellable.


  the facts of record: bkt-1 shows 40 on hand, reorder point 25, damage 5, bkt-2 shows 12 on hand, reorder point 30, damage 0, bkt-3 shows 55 on hand, reorder point 25, damage 12.


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


