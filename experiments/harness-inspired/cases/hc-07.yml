auxiliary: all facts needed are in the prompt itself
provenance: 'reordered=1 quarantined_lines=2 damaged=17 healthy=1

  archetype=restock_waves variant=0 seed=6'
success_criteria:
  deterministic_checks:
    json_exact: '{"reordered": 1, "quarantined_lines": 2, "damaged_units": 17, "healthy_lines": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - damaged units leave stock before any reorder math runs, damage first, thresholds second
  - a line at or below its reorder point orders more, at-or-below means exactly equal counts too
  - any line with damage above zero quarantines that line's damaged units, the rest of the line stays sellable
  facts:
  - bkt-1 shows 40 on hand, reorder point 25, damage 5, bkt-2 shows 12 on hand, reorder point 30, damage 0, bkt-3 shows 55 on hand, reorder point 25, damage 12
  output_spec:
    reordered: int
    quarantined_lines: int
    damaged_units: int
    healthy_lines: int
contract:
  damaged_units:
    formula: d1+d2+d3
    literals:
    - name: d1
      regex: bkt-1 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 5
    - name: d2
      regex: bkt-2 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 0
    - name: d3
      regex: bkt-3 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 12
  quarantined_lines:
    formula: (d1>0)+(d2>0)+(d3>0)
    literals: []
  reordered:
    formula: (s1-d1<=r1)+(s2-d2<=r2)+(s3-d3<=r3)
    literals:
    - name: s1
      regex: bkt-1 shows (\d+) on hand
      value: 40
    - name: r1
      regex: bkt-1 shows \d+ on hand, reorder point (\d+)
      value: 25
    - name: d1
      regex: bkt-1 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 5
    - name: s2
      regex: bkt-2 shows (\d+) on hand
      value: 12
    - name: r2
      regex: bkt-2 shows \d+ on hand, reorder point (\d+)
      value: 30
    - name: d2
      regex: bkt-2 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 0
    - name: s3
      regex: bkt-3 shows (\d+) on hand
      value: 55
    - name: r3
      regex: bkt-3 shows \d+ on hand, reorder point (\d+)
      value: 25
    - name: d3
      regex: bkt-3 shows \d+ on hand, reorder point \d+, damage (\d+)
      value: 12
