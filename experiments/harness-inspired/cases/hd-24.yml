auxiliary: all facts needed are in the prompt itself
provenance: 'tag=compressor-alpha-7

  dropped=''lph'' base=''compressor-lph-7'' len(base)=16 bar=12

  label=''compressor-lph-7-x'' len=18 suffix=True

  strip vowels from seg2, join, suffix when base len >= 12

  archetype=label_surgery variant=0 seed=23'
success_criteria:
  deterministic_checks:
    json_exact: '{"new_label": "compressor-lph-7-x", "label_length": 18, "suffix_applied": true}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - the rebuild keeps segment one untouched, strips every vowel from segment two, keeps segment three's digits, then joins with hyphens
  - the suffix rule reads the joined base length at-or-over twelve characters and appends -x when the bar is met, the suffix is part of the label and its length
  - label length counts the final label including any suffix, characters only, hyphens count
  facts:
  - the asset tag reads compressor-alpha-7
  - the press quotes no rebuilt form tonight, every segment derives from the tag itself
  - the suffix bar reads from the joined base length, characters only, hyphens included
  output_spec:
    new_label: str
    label_length: int
    suffix_applied: bool
contract:
  new_label:
    formula: (o.split("-")[0] + "-" + "".join(c for c in o.split("-")[1] if c not in "aeiou") + "-" + o.split("-")[2]) + ("-x" if len((o.split("-")[0] + "-" + "".join(c for c in o.split("-")[1] if c not in "aeiou") + "-" + o.split("-")[2])) >= 12 else "")
    literals:
    - name: o
      regex: asset tag reads ([a-z0-9-]+)
      value: compressor-alpha-7
  label_length:
    formula: len(new_label)
    literals: []
  suffix_applied:
    formula: bool(len((o.split("-")[0] + "-" + "".join(c for c in o.split("-")[1] if c not in "aeiou") + "-" + o.split("-")[2])) >= 12)
    literals: []
v6:
  entities:
  - id: orig
    question: the original tag (copy the string from its fact line)
    answer: compressor-alpha-7
  - id: noseg
    question: segment two with every vowel stripped (letters only)
    answer: lph
  - id: base
    question: the joined base before any suffix, exact string
    answer: compressor-lph-7
  - id: lab
    question: the final label with suffix rule applied (exact string)
    answer: compressor-lph-7-x
  - id: llen
    question: the final label's length in characters (count them)
    answer: 18
  - id: suf
    question: suffix applied, true or false (apply the boundary word to the base length)
    answer: true
  aggregate: '{''new_label'': a(''lab''), ''label_length'': int(a(''llen'')), ''suffix_applied'': bool(a(''suf''))}'
