case_id: ha-04
category: harness-ops
difficulty: heavy
hops: 5
archetype: adaptive-fix-budget
provenance: adaptive budget; light 4 x 1 = 4 slots; heavy burns 2 + 3 + 1 = 6 slots; 4+6 = 10 burned of
  10 -> 0 left; fixed-and-passed = 4 light + 2 heavy = 6
prompt: 'You manage tonight''s fix-stage budget. Standing policy: light cases get at

  most 1 fix stage each, heavy cases at most 3 fix stages each, and the whole

  night holds a shared pool of 10 fix stages — stages are burned only when

  actually executed, not when merely allowed. A case counts as fixed-and-passed

  if it passed after burning at least one fix stage. This run: 4 light cases

  each burned exactly 1 stage and all 4 passed. 3 heavy cases ran: the first

  burned 2 stages then passed, the second burned all 3 stages and still

  failed, the third burned 1 stage and passed. A capacity dashboard you do

  not manage shows allowed stages (which would be 13) rather than burned

  stages, and is not the number you report. Report the fix stages actually

  burned, stages left in the pool, and fixed-and-passed cases. Output ONLY

  this JSON with exactly these keys: {"burned": N, "left": N, "fixed_passed": N}.'
objective: Account burned vs allowed fix stages under adaptive budgets.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"burned": 10, "left": 0, "fixed_passed": 6}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: light_batch, question: "burned stages and passes for 4 light cases", answer: {burned: 4, passed: 4}}
    - {id: heavy_1, question: "burned stages and passes for first heavy", answer: {burned: 2, passed: 1}}
    - {id: heavy_2, question: "burned stages and passes for second heavy", answer: {burned: 3, passed: 0}}
    - {id: heavy_3, question: "burned stages and passes for third heavy", answer: {burned: 1, passed: 1}}
  aggregate: '{"burned": a(light_batch).get("burned",0) + a(heavy_1).get("burned",0) + a(heavy_2).get("burned",0) + a(heavy_3).get("burned",0), "left": 10 - (a(light_batch).get("burned",0) + a(heavy_1).get("burned",0) + a(heavy_2).get("burned",0) + a(heavy_3).get("burned",0)), "fixed_passed": a(light_batch).get("passed",0) + a(heavy_1).get("passed",0) + a(heavy_2).get("passed",0) + a(heavy_3).get("passed",0)}'
