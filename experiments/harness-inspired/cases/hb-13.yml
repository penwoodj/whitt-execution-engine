provenance: occupancy sign-off requires electrical, structural, and plumbing all passed; a failed inspection is corrected and re-inspected the NEXT working day; the precedence order for inspector scheduling
  is electrical first, then structural, then plumbing. day1. electrical fails (panel labeling), structural passes, plumbing passes. day2 (next working day). electrical re-inspect passes. occupancy ready
  when all three passed -> after day2. passed_first_try = 2 (structural, plumbing); reinspected = 1 (electrical); occupancy_ready = true; days_to_occupancy = 2
prompt: 'You are the site clerk for a small commercial build-out — a former

  bakery becoming a dentist''s office — and your week revolves around the

  inspections schedule, which the city''s building department runs with the

  gravity of a court calendar. The contractor needs your end-of-week

  summary to be precise about what passed, what needs re-inspection, and

  whether the occupancy certificate can be issued, because the dentist has

  already scheduled her chair deliveries and takes delay personally.


  The inspection regime has three disciplines: electrical, structural, and

  plumbing. Each discipline inspects independently and reports its own

  pass or fail. Two city rules shape the week. First, the precedence rule:

  when multiple disciplines need scheduling on the same day, the city

  calendar books electrical first, then structural, then plumbing, and a

  discipline can only inspect when its slot comes up — this matters only

  for sequencing within a day, since all three fit in one day when needed.

  Second, the re-inspection rule: a failed inspection is corrected by the

  contractor and re-inspected the next working day, never the same day,

  because the city believes, from long experience, that same-day fixes

  hide rather than fix. The week has no holidays, and weekend days are not

  working days for the city.


  The occupancy rule is the prize at the end. The certificate of occupancy

  is issued only after all three disciplines stand passed simultaneously —

  electrical, structural, and plumbing, each one, no exceptions, no

  partial credit for effort. The day the last discipline passes is the day

  occupancy becomes ready, and the summary counts working days from the

  first inspection day, which was a Monday, with day one being that Monday

  itself.


  Now the week as it actually happened, from the site diary.


  Monday was the first inspection day. The electrical inspector came first

  under the precedence rule, spent forty minutes in the panel room, and

  failed the electrical discipline: the circuit directory in the panel was

  still the bakery''s, listing proofers and ovens where the contractors had

  installed circuits for compressors and autoclaves. Correct labeling is a

  fifteen-minute fix, but it is a fix, and the re-inspection rule sends it

  to the next working day regardless of size. The structural inspector

  followed and passed the discipline without comment — the partition

  framing and the reinforced floor slab for the imaging unit were exactly

  as drawn. The plumbing inspector went last and passed as well; the

  medical-grade vacuum lines held pressure and the backflow preventer had

  its certification sticker.


  So Monday ended with one fail and two passes. The contractor spent

  Monday evening relabeling the panel properly, which took the promised

  fifteen minutes plus an hour of finding the right label maker.


  Tuesday, the next working day, was the electrical re-inspection. The

  inspector returned, found the directory now matching the as-built

  circuits, and passed the discipline. Structural and plumbing needed no

  Tuesday slots, having passed Monday and needing nothing further — a pass

  stands until something changes, and nothing changed.


  With electrical passed on Tuesday, all three disciplines stand passed

  simultaneously as of Tuesday, which is working day two from the first

  inspection day, and the occupancy certificate was applied for that

  afternoon.


  Two visitors to the site who belong in none of this. The fire marshal''s

  office conducted its own walkthrough Monday afternoon for the alarm

  system placement — the fire inspection runs on a separate municipal

  calendar you do not manage, reports to a different case number, and its

  results, which were fine, do not enter the building-department

  occupancy chain. And the dumpster removal service swapped containers

  Tuesday morning, an event the site diary logs with two exclamation

  points because the old one was overflowing, but a dumpster swap is not

  an inspection of anything by anyone.


  The summary needs: how many disciplines passed on their first

  inspection, how many required re-inspection, whether occupancy is ready

  by end of week, and how many working days from first inspection until

  occupancy readiness.


  The inspection office''s precedence rule exists because of the annex

  disaster three springs back, a story the senior inspectors tell with

  the flat calm of people who lived it. Two inspection teams arrived

  at the annex simultaneously, each with a partial mandate, and neither

  yielded — the teams inspected in parallel, recorded in parallel, and

  produced two reports that disagreed about the same rooms on the

  same afternoon. The reconciliation took a fortnight, the occupancy

  permit sat in limbo the whole while, and the tenants'' moving trucks

  idled at the curb burning money by the hour. Out of that fortnight

  came the single-lineerule now in force — when multiple inspections

  apply, the stricter verdict always wins, and the calendar always

  counts every day the building stands unoccupied.


  Your day today traced the inspection records the way the office''s

  morning brief expects. Each property''s file was read against the

  inspection log''s timeline, the first-pass results checked before

  any re-inspection credit was granted, and the re-inspection counted

  only where the file shows the first verdict actually failed — a

  re-inspection without a preceding failure is a scheduling artifact,

  not a safety event, and the office''s vocabulary refuses to count

  it. The occupancy question you answered from the rulebook''s

  definition, which is narrower than the leasing office''s and

  narrower still than the tenants'' hopes.


  The office''s surroundings count plenty that must stay out of the

  tally. The permitting portal you do not manage tracks application

  volumes and processing times for the city''s open-data dashboard, a

  feed the newspapers quote quarterly. The fire marshal''s separate

  inspection calendar runs its own rhythm with its own inspectors,

  sharing vocabulary but not ledgers. And the contractor-certification

  registry renews licenses on a rolling basis that occasionally delays

  re-inspection scheduling — an influence on when, never an influence

  on how many, and therefore invisible to the buckets tonight''s report

  carries.


  A note on the property that nearly counted its re-inspection twice,

  because edge properties are where honest buckets prove themselves.

  The property that failed its first inspection and passed the

  re-inspection appears in both events'' logs — the morning''s natural

  temptation is to count the property in the failed column and the

  passed column both, double-registering one building. The office''s

  definition is the guard — the failure categories are states at

  re-inspection time, not events over time — so the property counts

  once, as re-inspected, with its first failure visible in the

  timeline behind the number but never beside it in the tally.


  One final sweep completes the office''s day. The inspection log''s

  re-inspection entries, the property files'' verdict fields, and the

  calendar''s day-count arithmetic must all agree before the report

  locks — and you walk the three in parallel, because the leasing

  office''s lawyers read tomorrow what you write tonight, and the one

  thing lawyers and inspectors share is a distaste for documents that

  disagree with each other. They agree; the tally closes with the

  office''s characteristic sobriety, and the morning brief carries

  occupancy and inspection states that will survive both the coffee

  and the cross-examination.


  The office''s senior inspector closes every inspection day the same

  way, with the property files squared on the desk like soldiers,

  and tonight the ritual is yours by rotation. The last re-inspection

  uploaded an hour ago; the calendar arithmetic verified twice; the

  buckets hold the day''s whole truth in numbers that will outlive

  every argument about them. There is a sobriety particular to

  safety work — every count a promise that a building stood checked,

  every empty day of occupancy a cost someone paid for certainty —

  and the rulebook''s gift to its keepers is that the sobriety never

  once requires heroism, only the discipline to have counted while

  unhurried and the honesty to have counted while rushed. The tally

  closes; the lamp goes off; the buildings keep their watch.


  A closing note on the annex that taught the office its rule,

  because the building still stands and still gets inspected yearly.

  The two parallel reports from that disastrous spring are framed —

  literally framed, behind glass — in the office''s conference room, a

  museum exhibit of disagreement, and every new inspector is walked

  past them on day one with the same short lecture about what

  parallel authority costs. The precedence rule those reports

  bought has held for three springs since, untested by anything

  worse than scheduling friction, and tonight''s counts are part of

  its unbroken record — one building, one verdict, one calendar, the

  way the glass-framed failure taught everyone to insist on.


  The final number to guard is the days column''s sobriety, because

  day counts are where hope most wants to blur arithmetic. The

  unoccupied days are counted from the calendar the rulebook

  defines — not from when the tenants hoped to move, not from when

  the leasing office optimistically penciled the trucks — and the

  number stands at two, small and exact, carrying the whole weight of

  a definition that survived the annex''s lesson.


  The final number to guard is the first-pass column''s meaning,

  because first-pass is where pride most wants to blur arithmetic. A

  property counts as passed-first-pass only when the file shows no

  re-inspection standing behind it — a pass that followed a failure

  is a recovery, honored as one, filed as re-inspected, and never

  allowed to wear the first-pass laurel it did not earn. The office''s

  morning brief reads that column as a leading indicator of the

  inspection program''s health, which is exactly why tonight''s tally

  keeps it honest — two clean passes, one recovery, each in its own

  bucket, the record unflattered and therefore trustworthy.


  Output ONLY this JSON with exactly these keys:

  {"passed_first_try": N, "reinspected": N, "occupancy_ready": B,

  "days_to_occupancy": N}.'
objective: Apply same-day-fail/next-day-reinspect and all-three-pass occupancy rules.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"passed_first_try": 2, "reinspected": 1, "occupancy_ready": true, "days_to_occupancy": 2}'
    forbidden_phrases:
    - I cannot
    - sorry
v6:
  entities:
  - id: electrical_first
    question: Electrical was inspected Monday and failed on the stale panel directory — did it pass on FIRST inspection? (1 if yes, 0 if no)
    answer: false
  - id: structural_first
    question: Structural was inspected Monday after electrical and passed on its first pass; did it pass on first inspection? (1 if yes, 0 if no)
    answer: true
  - id: plumbing_first
    question: Plumbing was inspected Monday under the precedence order electrical-then-structural-then-plumbing and passed; did it pass on first inspection? (1 if yes, 0 if no)
    answer: true
  - id: electrical_reinspect
    question: A failed inspection is corrected and re-inspected the NEXT working day — electrical's directory was fixed and it passed Tuesday; did the re-inspection pass? (1 if yes, 0 if no)
    answer: true
  - id: days_to_occupancy
    question: working days from first inspection until all three passed (Mon fail, Tue pass)
    answer: 2
  aggregate: '{"passed_first_try": len([e for e in entities if e["id"].endswith("_first") and a(e) is True]), "reinspected": len([e for e in entities if e["id"].endswith("_first") and a(e) is False]), "occupancy_ready":
    a(electrical_reinspect) and a(structural_first) and a(plumbing_first), "days_to_occupancy": a(days_to_occupancy)}'
