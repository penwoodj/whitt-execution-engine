auxiliary: all facts needed are in the prompt itself
provenance: 'b=600 r=70 d=15 rates=[70, 55, 40]

  delivered=[420, 330, 240] dead=-390

  rate_k = max(0, r - k*d), delivered_k = b*rate_k//100

  archetype=redrive_decay variant=0 seed=11'
success_criteria:
  deterministic_checks:
    json_exact: '{"attempt1_delivered": 420, "attempt2_delivered": 330, "dead_after_retries": -390}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each retry attempt delivers at a decayed rate, attempt k's rate is the base rate minus k times the decay, floored at zero percent, delivery is batch times rate floor-divided by 100, whole messages
  - a message leaves the replay lane at-or-over three attempts and every departure after that is final
  - dead is batch minus everything delivered across all attempts, dead is reported without apology
  facts:
  - the replay lane holds 600 messages with base rate 70 percent and decay 15 percent per attempt
  - attempts stop at 3
  - the lane quotes no attempt rates tonight, each one derives from the base and the decay
  output_spec:
    attempt1_delivered: int
    attempt2_delivered: int
    dead_after_retries: int
contract:
  attempt1_delivered:
    formula: b * r // 100
    literals:
    - name: b
      regex: lane holds (\d+) messages
      value: 600
    - name: r
      regex: base rate (\d+) percent
      value: 70
  attempt2_delivered:
    formula: b * max(0, r - d) // 100
    literals:
    - name: d
      regex: decay (\d+) percent per attempt
      value: 15
  dead_after_retries:
    formula: b - (b * r // 100) - (b * max(0, r - d) // 100) - (b * max(0, r - 2 * d) // 100)
    literals: []
v6:
  entities:
  - id: b
    question: batch size in messages (copy the number from its fact line)
    answer: 600
  - id: r
    question: base rate percent (copy the number from its fact line)
    answer: 70
  - id: d
    question: decay percent per attempt (copy the number from its fact line)
    answer: 15
  - id: ra1
    question: attempt one rate in percent (base)
    answer: 70
  - id: ra2
    question: attempt two rate in percent (base minus one decay)
    answer: 55
  - id: ra3
    question: attempt three rate in percent (base minus two decays, floored at zero)
    answer: 40
  - id: dv1
    question: attempt one delivered in messages (batch times attempt one rate)
    answer: 420
  - id: dv2
    question: attempt two delivered in messages (batch times attempt two rate)
    answer: 330
  - id: dead
    question: dead messages after all attempts (batch minus all delivered)
    answer: -390
  aggregate: '{''attempt1_delivered'': a(''b'') * a(''ra1'') // 100, ''attempt2_delivered'': a(''b'') * a(''ra2'') // 100, ''dead_after_retries'': a(''b'') - (a(''b'') * a(''ra1'') // 100) - (a(''b'') * a(''ra2'') // 100) - (a(''b'') * max(0, a(''r'') - 2 * a(''d'')) // 100)}'
