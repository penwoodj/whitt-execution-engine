prompt: 'when the audit team visits the per-diem booth they leave within the hour, the audit desk''s margins scare them off, and the tally lamp is on, which means somebody''s numbers are about to be wrong.


  the replay desk watches the same messages limp past night after night at declining rates, the decay is honest work being done by tired machinery, and the arithmetic is just the ledger of that tiredness


  the rate floor at zero matters on long decay ladders, a rate that steps below zero delivers nothing and pretends nothing, the desk does not deal in negative enthusiasm


  dead messages are counted, named, and mourned briefly, the count is the deliverable, the mourning is informal


  the rules of the desk, as they stand tonight: 1. each retry attempt delivers at a decayed rate, attempt k''s rate is the base rate minus k times the decay, floored at zero percent, delivery is batch times rate floor-divided by 100, whole messages. 2. a message leaves the replay lane at-or-over three attempts and every departure after that is final. 3. dead is batch minus everything delivered across
  all attempts, dead is reported without apology.


  the facts of record: the replay lane holds 600 messages with base rate 70 percent and decay 15 percent per attempt attempts stop at 3 the lane quotes no attempt rates tonight, each one derives from the base and the decay.


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


