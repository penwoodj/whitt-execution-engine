prompt: 'you take the seating sheet for the evening, read the rules twice, they interact in ways that surprise people, a thing only counts once, no matter how many lists it appears on.


  the retention sweeper runs while the floor is quiet, the trace class scanned 1500 records with a retention of 7 days, 640 beyond retention, the metric class scanned 300 records with a retention of 90
  days, 25 beyond retention, the event class scanned 480 records with a retention of 180 days, 60 beyond retention, hold status by class: the trace class is not on hold, the metric class is not on hold,
  the event class is on hold, that is 1 class on hold. hold skips a class whole, no partial purges, no mercy purges. records older than retention go, the rest stay, and the morning report wants three numbers,
  not opinions.


  legal holds arrived after an audit where a class got purged mid-investigation, the fix was class-level granularity, crude but airtight.


  the archive tier you do not manage keeps its own copies with its own clock, archive copies do not resurrect purged records and do not count.


  the rules of the desk, as they stand tonight: 1. each class purges records older than its own retention days, no exceptions inside a class. 2. classes with an open legal hold skip the purge entirely tonight,
  hold means all-or-nothing per class. 3. the purge counts records deleted, not records scanned, scanning is free and counts for nothing.


  the facts of record: the trace class scanned 1500 records with a retention of 7 days, 640 beyond retention, the metric class scanned 300 records with a retention of 90 days, 25 beyond retention, the event
  class scanned 480 records with a retention of 180 days, 60 beyond retention hold status by class: the trace class is not on hold, the metric class is not on hold, the event class is on hold, that is 1
  class on hold.


  every so often someone proposes simplifying the rules, the simplification always loses exactly one boundary clause, the proposal always dies


  old-timers here say the counts are the easy part and the boundaries are the career, they are right more often than the confident ones


