prompt: 'night two of the weekend and the audit desk is down to one working pen and one working mind, which is how the desk finds itself doing this by hand again.


  the tiering station handles one parcel tonight and the whole exercise hangs on a single boundary read, an at-or-over read pushes weight up at the edge itself, and the two conventions have never once agreed at the edge


  the rate card is laminated, the edges are not negotiable, and the urgent multiplier is a flat two, applied last, applied always


  the desk works the band first, the charge second, the doubling third, in that order, because every other order has been tried and every other order has failed


  the rules of the desk, as they stand tonight: 1. parcel weight moves up a band at-or-over the band edge, edges measured to the whole gram, no rounding of weight. 2. band 1 runs under 100 grams at 120 whole cents, band 2 runs to under 250 grams at 180 whole cents, band 3 is everything at or beyond that at 260 whole cents. 3. urgent parcels pay double the band charge, doubling happens after banding,
  never before.


  the facts of record: tonight''s parcel weighs 480 whole grams the band edges are 100 grams and 250 grams the band rates run 120, 180, then 260 whole cents from the lowest band up.


  old hands say the arithmetic is the easy ten percent, the other ninety is remembering which convention tonight''s boundary clause uses, they say it while checking the clause again


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


