objective: derive involuntary_bumped, volunteers_unused, voucher_cost_cents from the stated rules
prompt: 'three generations of closing desks have run the promotion drum the same way, slowly, out loud, and twice, and the tally lamp is on, which means somebody''s numbers are about to be wrong.


  the bump counter runs hot on sold-out nights and the arithmetic is a small mercy, volunteers first, forced second, and the voucher ledger tells you exactly how merciful the night was


  the volunteer line is not charity, it is pricing, and the price of a forced bump is what keeps the volunteer line populated, the desk just counts both


  unused volunteers walk away whole, no voucher, no cost, no memory, they board like everyone else and the ledger never mentions them again


  the rules of the desk, as they stand tonight: 1. the tour overbooks, bumps needed are tickets minus seats, volunteers step up before anyone is forced, a desk counts itself covered at-or-over its volunteer goal and forced bumps are whatever bumps the volunteers did not absorb. 2. volunteer vouchers cost the volunteer rate each, forced bumps cost the involuntary rate each, only volunteers actually used
  draw vouchers, unused volunteers cost nothing. 3. the voucher total is whole cents and is reported even when it is zero, which it never is.


  the facts of record: the tour seats 52 and sold 56 tickets 5 passengers volunteered for bumping volunteer vouchers run 18000 whole cents and involuntary compensation runs 38000 whole cents.


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


