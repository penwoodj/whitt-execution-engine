auxiliary: all facts needed are in the prompt itself
provenance: 'standby_confirmed=5 left=0 refunded=3 noshows=1

  archetype=gym_standby variant=2 seed=71'
success_criteria:
  deterministic_checks:
    json_exact: '{"standby_confirmed": 5, "standby_left": 0, "credits_refunded": 3, "no_shows": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - no-show bookings free their spots at start time, freed spots go to standby in queue order
  - standby beyond freed spots does not get in, no floor mats, no standing, capacity is capacity
  - class credits held by no-shows refund automatically at the one-hour mark
  facts:
  - the class caps at 30, 24 booked, 1 of those no-showed
  - 5 names sat on the standby queue
  - 3 credits are pending automatic refund
  output_spec:
    standby_confirmed: int
    standby_left: int
    credits_refunded: int
    no_shows: int
contract:
  standby_confirmed:
    formula: min(Q, max(cap - booked + ns, 0))
    literals:
    - name: cap
      regex: class caps at (\d+)
      value: 30
    - name: booked
      regex: (\d+) booked
      value: 24
    - name: ns
      regex: of those no-showed
      value: 1
    - name: Q
      regex: (\d+) names sat on the standby
      value: 5
v6:
  entities:
  - id: cp
    question: 'the class capacity (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 30
  - id: bk
    question: 'bookings held (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 24
  - id: ns
    question: 'booked members who no-showed (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 1
  - id: sq
    question: 'names on the standby queue (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 5
  - id: cr
    question: 'credits pending refund (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3
  aggregate: '{''standby_confirmed'': min(a(''sq''), max(a(''cp'')-a(''bk'')+a(''ns''), 0)), ''standby_left'': a(''sq'')-min(a(''sq''), max(a(''cp'')-a(''bk'')+a(''ns''), 0)), ''credits_refunded'': int(a(''cr'')),
    ''no_shows'': int(a(''ns''))}'
