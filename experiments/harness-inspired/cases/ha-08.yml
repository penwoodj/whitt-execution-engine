case_id: ha-08
category: harness-ops
difficulty: light
hops: 3
archetype: trace-ledger
provenance: trace ledger; unwon case burns solve + fix1 + fix2 -> 3 check lines; never passed -> 1 end_fail
  line; judge only on pass -> 0; 3+1 = 4 trace lines
prompt: 'You maintain the run trace ledger. Ledger rules: exactly one trace line per

  deterministic check (one per executed stage: solve, fix1, fix2), exactly one

  judge line per case that had any passing check, exactly one end_fail line

  per case that never passed, and nothing else counts as a trace line.

  Tonight one case failed its solve, failed both fixes, and never passed. The

  engine''s progress logger you do not manage also writes step events to

  progress.log, which is not the trace ledger. How many lines does this case

  contribute to the trace ledger, and how many of them are judge lines?

  Output ONLY this JSON with exactly these keys: {"trace_lines": N, "judge_lines": N}.'
objective: Count trace ledger lines for a fully burned case.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"trace_lines": 4, "judge_lines": 0}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: check_lines, question: "trace lines for executed checks (solve+fix1+fix2)", answer: 3}
    - {id: end_fail_line, question: "end_fail lines (case never passed)", answer: 1}
    - {id: judge_lines, question: "judge lines (only on pass)", answer: 0}
  aggregate: '{"trace_lines": a(check_lines) + a(end_fail_line) + a(judge_lines), "judge_lines": a(judge_lines)}'
