provenance: 'rings_passed=0 aborted=True users_exposed=100 halt_ring=ring-1

  archetype=rollout_rings variant=0 seed=10'
success_criteria:
  deterministic_checks:
    json_exact: '{"rings_passed": 0, "aborted": true, "users_exposed": 100, "halt_ring": "ring-1"}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rings promote in order, a ring only enters after the previous ring passes clean
  - a ring with 4 or more fire reports halts the rollout on the spot, halted means halted, no finish and see
  - users exposed counts every user in rings that entered, including the ring that triggered the halt
  facts:
  - ring-1 covers 100 users and logged 5 fire reports, ring-2 covers 500 users and logged 4 fire reports, ring-3 covers 2000 users and logged 3 fire reports
  - the abort threshold is 4 fire reports
  output_spec:
    rings_passed: int
    aborted: bool
    users_exposed: int
    halt_ring: str
contract:
  rings_passed:
    formula: (f1<A)*(1+(f2<A)*(1+(f3<A)))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 4
    - name: f1
      regex: ring-1 covers \d+ users and logged (\d+) fire reports
      value: 5
    - name: u1
      regex: ring-1 covers (\d+) users
      value: 100
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 100 users and logged 5 fire reports
      value: ring-1
    - name: f2
      regex: ring-2 covers \d+ users and logged (\d+) fire reports
      value: 4
    - name: u2
      regex: ring-2 covers (\d+) users
      value: 500
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 500 users and logged 4 fire reports
      value: ring-2
    - name: f3
      regex: ring-3 covers \d+ users and logged (\d+) fire reports
      value: 3
    - name: u3
      regex: ring-3 covers (\d+) users
      value: 2000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 2000 users and logged 3 fire reports
      value: ring-3
  aborted:
    formula: (f1>=A)+((f1<A)*(f2>=A))+((f1<A)*(f2<A)*(f3>=A))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 4
    - name: f1
      regex: ring-1 covers \d+ users and logged (\d+) fire reports
      value: 5
    - name: u1
      regex: ring-1 covers (\d+) users
      value: 100
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 100 users and logged 5 fire reports
      value: ring-1
    - name: f2
      regex: ring-2 covers \d+ users and logged (\d+) fire reports
      value: 4
    - name: u2
      regex: ring-2 covers (\d+) users
      value: 500
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 500 users and logged 4 fire reports
      value: ring-2
    - name: f3
      regex: ring-3 covers \d+ users and logged (\d+) fire reports
      value: 3
    - name: u3
      regex: ring-3 covers (\d+) users
      value: 2000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 2000 users and logged 3 fire reports
      value: ring-3
  users_exposed:
    formula: (u1+u2+u3) if rings_passed>=3 else ((u1+u2+(u3 if aborted and rings_passed==2 else 0)) if rings_passed==2 else ((u1+(u2 if aborted and rings_passed==1 else 0)) if rings_passed==1 else (u1 if
      aborted else 0)))
    literals:
    - name: u1
      regex: ring-1 covers (\d+) users
      value: 100
    - name: u2
      regex: ring-2 covers (\d+) users
      value: 500
    - name: u3
      regex: ring-3 covers (\d+) users
      value: 2000
  halt_ring:
    formula: (n1 if aborted and rings_passed==0 else (n2 if aborted and rings_passed==1 else (n3 if aborted and rings_passed==2 else '')))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 4
    - name: f1
      regex: ring-1 covers \d+ users and logged (\d+) fire reports
      value: 5
    - name: u1
      regex: ring-1 covers (\d+) users
      value: 100
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 100 users and logged 5 fire reports
      value: ring-1
    - name: f2
      regex: ring-2 covers \d+ users and logged (\d+) fire reports
      value: 4
    - name: u2
      regex: ring-2 covers (\d+) users
      value: 500
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 500 users and logged 4 fire reports
      value: ring-2
    - name: f3
      regex: ring-3 covers \d+ users and logged (\d+) fire reports
      value: 3
    - name: u3
      regex: ring-3 covers (\d+) users
      value: 2000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 2000 users and logged 3 fire reports
      value: ring-3
v6:
  entities:
  - id: f1
    question: fire reports ring ring-1 logged, copy the number from its fact line
    answer: 5
  - id: f2
    question: fire reports ring ring-2 logged, copy the number from its fact line
    answer: 4
  - id: f3
    question: fire reports ring ring-3 logged, copy the number from its fact line
    answer: 3
  - id: u1
    question: users ring ring-1 covers, copy the number from its fact line
    answer: 100
  - id: u2
    question: users ring ring-2 covers, copy the number from its fact line
    answer: 500
  - id: u3
    question: users ring ring-3 covers, copy the number from its fact line
    answer: 2000
  - id: n1
    question: the ring id of ring number 1, copy it exactly from the facts
    answer: ring-1
  - id: n2
    question: the ring id of ring number 2, copy it exactly from the facts
    answer: ring-2
  - id: n3
    question: the ring id of ring number 3, copy it exactly from the facts
    answer: ring-3
  - id: at
    question: the abort threshold in fire reports, copy the number from the facts
    answer: 4
  aggregate: '{''rings_passed'': (a(''f1'')<a(''at''))*(1+(a(''f2'')<a(''at''))*(1+(a(''f3'')<a(''at'')))), ''aborted'': (a(''f1'')>=a(''at''))+(a(''f2'')>=a(''at''))+(a(''f3'')>=a(''at''))>0, ''users_exposed'':
    int(a(''u1''))+int(a(''u2''))*(a(''f1'')<a(''at''))+int(a(''u3''))*(a(''f1'')<a(''at''))*(a(''f2'')<a(''at'')), ''halt_ring'': (a(''n1'') if a(''f1'')>=a(''at'') else (a(''n2'') if a(''f2'')>=a(''at'')
    else (a(''n3'') if a(''f3'')>=a(''at'') else '''')))}'
