prompt: 'your watch over the seating sheet starts now, the rules stack on top of each other, work them in order, the cap is the cap, overages defer, they never drop silently.


  the rollout ladder climbed tonight, ring-1 covers 100 users and logged 5 fire reports, ring-2 covers 500 users and logged 4 fire reports, ring-3 covers 2000 users and logged 3 fire reports, the abort
  threshold is 4 fire reports. walk the rings in order, stop at the first ring that hits the threshold, count users in every ring that entered including the one that died. rings after a halt never entered,
  their users were never exposed.


  the halt rule is blunt on purpose, the incident review found graduated response just meant slow response, blunt it is.


  the feedback pane you do not manage also collects star ratings per ring, stars are sentiment, fires are facts.


  the rules of the desk, as they stand tonight: 1. rings promote in order, a ring only enters after the previous ring passes clean. 2. a ring with 4 or more fire reports halts the rollout on the spot, halted
  means halted, no finish and see. 3. users exposed counts every user in rings that entered, including the ring that triggered the halt.


  the facts of record: ring-1 covers 100 users and logged 5 fire reports, ring-2 covers 500 users and logged 4 fire reports, ring-3 covers 2000 users and logged 3 fire reports the abort threshold is 4 fire
  reports.


