provenance: 'renewed=1 expiring_soon=1 stable=2 line=14

  archetype=cert_renewal variant=1 seed=39'
success_criteria:
  deterministic_checks:
    json_exact: '{"renewed": 1, "expiring_soon": 1, "stable": 2, "renew_window": 14}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - any certificate with less than 14 days of validity left renews tonight, no exceptions, no appeals
  - certificates with 14 or more but under 42 days are flagged expiring-soon, flagged is not renewed
  - renewal stagger is automatic, count renewals, do not schedule them
  facts:
  - edge-wild has 5 days left, svc-mesh has 60 days left, db-tls has 25 days left, monitor has 90 days left
  output_spec:
    renewed: int
    expiring_soon: int
    stable: int
    renew_window: int
contract:
  renewed:
    formula: (d1<M)+(d2<M)+(d3<M)+(d4<M)
    literals:
    - name: d1
      regex: edge-wild has (\d+) days left
      value: 5
    - name: d2
      regex: svc-mesh has (\d+) days left
      value: 60
    - name: d3
      regex: db-tls has (\d+) days left
      value: 25
    - name: d4
      regex: monitor has (\d+) days left
      value: 90
    - name: M
      regex: less than (\d+) days of validity
      value: 14
  expiring_soon:
    formula: (d1>=M and d1<3*M)+(d2>=M and d2<3*M)+(d3>=M and d3<3*M)+(d4>=M and d4<3*M)
    literals: []
  stable:
    formula: 4 - renewed - expiring_soon
    literals: []
v6:
  entities:
  - id: d1
    question: 'days left on edge-wild (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 5
  - id: d2
    question: 'days left on svc-mesh (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 60
  - id: d3
    question: 'days left on db-tls (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 25
  - id: d4
    question: 'days left on monitor (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 90
  - id: rw
    question: 'the renew line in days (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 14
  aggregate: '{''renewed'': (a(''d1'')<a(''rw''))+(a(''d2'')<a(''rw''))+(a(''d3'')<a(''rw''))+(a(''d4'')<a(''rw'')), ''expiring_soon'': (a(''d1'')>=a(''rw''))*(a(''d1'')<3*a(''rw''))+(a(''d2'')>=a(''rw''))*(a(''d2'')<3*a(''rw''))+(a(''d3'')>=a(''rw''))*(a(''d3'')<3*a(''rw''))+(a(''d4'')>=a(''rw''))*(a(''d4'')<3*a(''rw'')),
    ''stable'': (a(''d1'')>=3*a(''rw''))+(a(''d2'')>=3*a(''rw''))+(a(''d3'')>=3*a(''rw''))+(a(''d4'')>=3*a(''rw'')), ''renew_window'': int(a(''rw''))}'
