prompt: 'the traffic warden badge is yours tonight, the sweep ledger answers to you and to nobody else on the floor, boundaries are inclusive unless a rule says otherwise, and these rules say otherwise
  where it matters.


  the cert cabinet gets its weekly review, edge-wild has 5 days left, svc-mesh has 60 days left, db-tls has 25 days left, monitor has 90 days left. the renew line is 14 days, below it means renew tonight,
  the expiring-soon band runs to triple that, above triple means stable. three buckets, every cert in exactly one.


  the triple-day band exists because renewal takes a week of lead time in the worst case, band membership warns, it does not act.


  the external monitor you do not manage pages on 7-day emergencies, by the time it notices anything this desk has already acted or already failed, either way it is late.


  the rules of the desk, as they stand tonight: 1. any certificate with less than 14 days of validity left renews tonight, no exceptions, no appeals. 2. certificates with 14 or more but under 42 days are
  flagged expiring-soon, flagged is not renewed. 3. renewal stagger is automatic, count renewals, do not schedule them.


  the facts of record: edge-wild has 5 days left, svc-mesh has 60 days left, db-tls has 25 days left, monitor has 90 days left.


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


