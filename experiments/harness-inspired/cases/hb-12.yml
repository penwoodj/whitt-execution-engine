    question: H1's fill chain tries local branch copy first, then partners, then the regional warehouse — the local copy is on the shelf, so the chain succeeds at its first link; answer exactly one word
      from local, partner, regional, denied
    answer: local
  - id: h2
    question: H2's local shelf is empty but 2 partner copies are available — the chain succeeds at its second link; answer exactly one word from local, partner, regional, denied
    answer: partner
  - id: h3
    question: H3's local and partner copies are all checked out, but the regional warehouse holds 3 — the chain succeeds at its third link; answer exactly one word from local, partner, regional, denied
    answer: regional
  - id: h4
    question: H4's title was withdrawn consortium-wide after a damage recall — no copy exists anywhere in the chain, so the request is denied; answer exactly one word from local, partner, regional, denied
    answer: denied
  aggregate: '{"filled": len([e for e in entities if a(e) in ("local", "partner", "regional")]), "denied": len([e for e in entities if a(e) == "denied"]), "local_fills": len([e for e in entities if a(e)
    == "local"]), "partner_fills": len([e for e in entities if a(e) == "partner"]), "regional_fills": len([e for e in entities if a(e) == "regional"])}'
