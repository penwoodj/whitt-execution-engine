case_id: ha-06
category: harness-ops
difficulty: heavy
hops: 5
archetype: two-lane-verdict-matrix
provenance: two-lane matrix; 2 det-fail -> FAIL, 0 judge; 2 det+judge pass -> PASS, 2 calls; 2 judge-fail
  -> repair -> 1 judge pass (2 calls) + 1 judge fail (2 calls); totals PASS = 2+1 = 3, FAIL = 2+1 = 3,
  judge = 6
prompt: 'You audit the verdict logic of a two-lane gate. Rules: deterministic FAIL

  means final FAIL and the judge is never invoked. Deterministic PASS plus

  judge PASS means final PASS. Deterministic PASS plus judge FAIL earns

  exactly one repair round, then the judge runs once more — that second judge

  verdict is final for the case. Tonight 6 cases ran: 2 failed the

  deterministic lane. 2 passed both lanes on first judge contact. The

  remaining 2 passed deterministic, failed the first judge call, took their

  repair round, and on their second judge call one passed and one failed.

  A retry-metrics collector you do not manage re-counts the repair round as a

  judge call, which it is not. Report final PASS count, final FAIL count, and

  true judge invocation count. Output ONLY this JSON with exactly these keys:

  {"pass": N, "fail": N, "judge_calls": N}.'
objective: Apply two-lane verdict rules and count judge calls.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"pass": 3, "fail": 3, "judge_calls": 6}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: c1, question: "final verdict and judge calls, case 1 (det fail)", answer: {final: "FAIL", judge_calls: 0}}
    - {id: c2, question: "final verdict and judge calls, case 2 (det fail)", answer: {final: "FAIL", judge_calls: 0}}
    - {id: c3, question: "final verdict and judge calls, case 3 (both pass)", answer: {final: "PASS", judge_calls: 1}}
    - {id: c4, question: "final verdict and judge calls, case 4 (both pass)", answer: {final: "PASS", judge_calls: 1}}
    - {id: c5, question: "final verdict and judge calls, case 5 (repair then pass)", answer: {final: "PASS", judge_calls: 2}}
    - {id: c6, question: "final verdict and judge calls, case 6 (repair then fail)", answer: {final: "FAIL", judge_calls: 2}}
  aggregate: '{"pass": sum(1 for i in ["c1","c2","c3","c4","c5","c6"] if a(i).get("final")=="PASS"), "fail": sum(1 for i in ["c1","c2","c3","c4","c5","c6"] if a(i).get("final")=="FAIL"), "judge_calls": sum(a(i).get("judge_calls",0) for i in ["c1","c2","c3","c4","c5","c6"])}'
