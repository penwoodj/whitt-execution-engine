success_criteria:
  deterministic_checks:
    json_exact: '{"tier": 1, "duty_cents": 0, "surcharge_cents": 40}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - the consolidated shipment duty tier reads the summed value, tier two begins strictly past 15000 whole cents and tier three begins strictly past 80000, consolidation means one tier for the whole shipment, never per item
  - duty is total value times the tier percent floor-divided by 100, the surcharge origin applies to the flagged item's value only, at its own percent
  - the report wants the tier, the duty, and the surcharge, all in whole cents
  facts:
  - item i declares 2000 whole cents, item j declares 9000 whole cents, item k declares 3000 whole cents
  - tier two starts at 15000 cents and tier three starts at 80000 cents, rates are 0, 4, and 7 percent
  - the flagged item carries a 2 percent surcharge on its declared value
  output_spec:
    tier: int
    duty_cents: int
    surcharge_cents: int
contract:
  tier:
    formula: (1 if (v1 + v2 + v3) <= e1 else (2 if (v1 + v2 + v3) <= e2 else 3))
    literals:
    - name: v1
      regex: item i declares (\d+) whole cents
      value: 2000
    - name: v2
      regex: item j declares (\d+) whole cents
      value: 9000
    - name: v3
      regex: item k declares (\d+) whole cents
      value: 3000
    - name: e1
      regex: tier two starts at (\d+) cents
      value: 15000
    - name: e2
      regex: tier three starts at (\d+) cents
      value: 80000
  duty_cents:
    formula: (v1 + v2 + v3) * (0 if (v1 + v2 + v3) <= e1 else (4 if (v1 + v2 + v3) <= e2 else 7)) // 100
    literals:
    - name: p2
      regex: rates are \d+, (\d+), and
      value: 4
    - name: p3
      regex: and (\d+) percent
      value: 7
  surcharge_cents:
    formula: v1 * 2 // 100
    literals:
    - name: sur_pct
      regex: carries a (\d+) percent surcharge
      value: 2
v6:
  entities:
  - id: v1
    question: item i's declared value in whole cents (copy the number from its fact line)
    answer: 2000
  - id: v2
    question: item j's declared value in whole cents (copy the number from its fact line)
    answer: 9000
  - id: v3
    question: item k's declared value in whole cents (copy the number from its fact line)
    answer: 3000
  - id: e1
    question: tier two start in whole cents (copy the number from its fact line)
    answer: 15000
  - id: e2
    question: tier three start in whole cents (copy the number from its fact line)
    answer: 80000
  - id: p2
    question: tier two rate in percent (copy the number from its fact line)
    answer: 4
  - id: p3
    question: tier three rate in percent (copy the number from its fact line)
    answer: 7
  - id: tot
    question: the consolidated value in whole cents (sum the declarations)
    answer: 14000
  - id: tier
    question: the duty tier number, 1, 2, or 3 (apply both boundary words to the consolidated value)
    answer: 1
  - id: duty
    question: the duty in whole cents (consolidated value times the tier's percent)
    answer: 0
  - id: sur
    question: the surcharge in whole cents (flagged item value times the surcharge percent)
    answer: 40
  aggregate: '{''tier'': 1 if ((a(''v1'') + a(''v2'') + a(''v3'')) <= a(''e1'')) else (2 if ((a(''v1'') + a(''v2'') + a(''v3'')) <= a(''e2'')) else 3), ''duty_cents'': (a(''v1'') + a(''v2'') + a(''v3'')) * (0 if ((a(''v1'') + a(''v2'') + a(''v3'')) <= a(''e1'')) else (a(''p2'') if ((a(''v1'') + a(''v2'') + a(''v3'')) <= a(''e2'')) else a(''p3''))) // 100, ''surcharge_cents'': a(''v1'') * 2 // 100}'
