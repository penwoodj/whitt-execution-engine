  the desk computes the tier once, from full volume, then rebates the full gross at that single percentage, the marginal-tier reading is a different program at a different company with different lawyers


  the rules of the desk, as they stand tonight: 1. tier two begins at-or-over 100 units and tier three begins at-or-over 500 units, units are whole and never rounded. 2. the tier percentage is retroactive, it applies to the entire volume, not just the units above the boundary, this is the whole point of the program and the whole trap of it. 3. rebate is gross times percent floor-divided by 100 in whole
  cents, net is gross minus rebate, both reported.


  the facts of record: the program moved 520 whole units this quarter at 2500 whole cents per unit tier two starts at 100 units, tier three starts at 500 units, tier rates are 5, 12, and 18 percent the board quotes no gross tonight, the desk derives it before any tier applies.


