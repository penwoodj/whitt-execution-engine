success_criteria:
  deterministic_checks:
    json_exact: '{"tier": 3, "rebate_cents": 234000, "net_cents": 1066000}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - tier two begins at-or-over 100 units and tier three begins at-or-over 500 units, units are whole and never rounded
  - the tier percentage is retroactive, it applies to the entire volume, not just the units above the boundary, this is the whole point of the program and the whole trap of it
  - rebate is gross times percent floor-divided by 100 in whole cents, net is gross minus rebate, both reported
  facts:
  - the program moved 520 whole units this quarter at 2500 whole cents per unit
  - tier two starts at 100 units, tier three starts at 500 units, tier rates are 5, 12, and 18 percent
  - the board quotes no gross tonight, the desk derives it before any tier applies
  output_spec:
    tier: int
    rebate_cents: int
    net_cents: int
contract:
  tier:
    formula: (1 if (U < t2) else (2 if (U < t3) else 3))
    literals:
    - name: U
      regex: moved (\d+) whole units
      value: 520
    - name: t2
      regex: tier two starts at (\d+) units
      value: 100
    - name: t3
      regex: tier three starts at (\d+) units
      value: 500
  rebate_cents:
    formula: (U * price) * (5 if tier == 1 else (12 if tier == 2 else 18)) // 100
    literals:
    - name: U
      regex: moved (\d+) whole units
      value: 520
    - name: price
      regex: at (\d+) whole cents per unit
      value: 2500
  net_cents:
    formula: (U * price) - rebate_cents
    literals: []
v6:
  entities:
  - id: U
    question: units moved this quarter (copy the number from its fact line)
    answer: 520
  - id: price
    question: price per unit in whole cents (copy the number from its fact line)
    answer: 2500
  - id: t2
    question: tier two start in units (copy the number from its fact line)
    answer: 100
  - id: t3
    question: tier three start in units (copy the number from its fact line)
    answer: 500
  - id: p1
    question: tier one rate in percent (copy the number from its fact line)
    answer: 5
  - id: p2
    question: tier two rate in percent (copy the number from its fact line)
    answer: 12
  - id: p3
    question: tier three rate in percent (copy the number from its fact line)
    answer: 18
  - id: gross
    question: gross revenue in whole cents (units times price)
    answer: 1300000
  - id: tier
    question: the tier number earned, 1, 2, or 3 (apply both boundary words to the volume)
    answer: 3
  - id: reb
    question: the rebate in whole cents (gross times the earned tier's percent)
    answer: 234000
  aggregate: '{''tier'': 1 if (a(''U'') < a(''t2'')) else (2 if (a(''U'') < a(''t3'')) else 3), ''rebate_cents'': a(''gross'') * (a(''p1'') if (a(''U'') < a(''t2'')) else (a(''p2'') if (a(''U'') < a(''t3'')) else a(''p3''))) // 100, ''net_cents'': a(''gross'') - (a(''gross'') * (a(''p1'') if (a(''U'') < a(''t2'')) else (a(''p2'') if (a(''U'') < a(''t3'')) else a(''p3''))) // 100)}'
