success_criteria:
  deterministic_checks:
    json_exact: '{"users_flagged": 2, "users_clear": 1, "color_jobs_denied": 1, "largest_job_pages": 110}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - page quota flags at exactly-at, same boundary convention as every quota desk here
  - color printing requires quota headroom, flagged users' color jobs deny outright, mono jobs pass with a warning
  - denied jobs do not print tonight, denial is not deferral
  facts:
  - p1 printed 120 of a 100 page monthly quota, p2 printed 60 of a 100 page monthly quota, p3 printed 100 of a 100 page monthly quota
  - the largest single job tonight ran 110 pages
  - 1 color jobs were denied at the counter
  output_spec:
    users_flagged: int
    users_clear: int
    color_jobs_denied: int
    largest_job_pages: int
contract:
  users_flagged:
    formula: (n1>=q1)+(n2>=q2)+(n3>=q3)
    literals:
    - name: n1
      regex: p1 printed (\d+) of
      value: 120
    - name: q1
      regex: p1 printed \d+ of a (\d+) page monthly quota
      value: 100
    - name: n2
      regex: p2 printed (\d+) of
      value: 60
    - name: q2
      regex: p2 printed \d+ of a (\d+) page monthly quota
      value: 100
    - name: n3
      regex: p3 printed (\d+) of
      value: 100
    - name: q3
      regex: p3 printed \d+ of a (\d+) page monthly quota
      value: 100
  users_clear:
    formula: 3 - users_flagged
    literals: []
v6:
  entities:
  - id: n1
    question: 'pages p1 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
