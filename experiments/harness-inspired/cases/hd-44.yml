task_core:
  rules:
  - a leg accrues excursion minutes while its cargo reads above eight degrees, minutes are whole and additive across legs
  - the shipment diverts when total excursion is strictly past the divert threshold, the threshold is total minutes, never per leg
  - worst leg is the single largest leg excursion, reported separately because the warehouse argues about it
  facts:
  - run-1 logged 14 excursion minutes, run-2 logged 6 excursion minutes, run-3 logged 3 excursion minutes
  - the divert threshold is 22 total minutes
  - the line quotes no total tonight, the desk sums the legs itself
  output_spec:
    total_excursion_minutes: int
    divert: bool
    worst_leg_minutes: int
contract:
  total_excursion_minutes:
    formula: m1 + m2 + m3
    literals:
    - name: m1
      regex: run-1 logged (\d+) excursion minutes
      value: 14
    - name: m2
      regex: run-2 logged (\d+) excursion minutes
      value: 6
    - name: m3
      regex: run-3 logged (\d+) excursion minutes
      value: 3
  divert:
    formula: bool((m1 + m2 + m3) > thr)
    literals:
    - name: thr
      regex: threshold is (\d+) total minutes
      value: 22
  worst_leg_minutes:
    formula: max(m1, m2, m3)
    literals: []
v6:
  entities:
  - id: m1
    question: run-1's excursion minutes (copy the number from its fact line)
    answer: 14
  - id: m2
    question: run-2's excursion minutes (copy the number from its fact line)
    answer: 6
  - id: m3
    question: run-3's excursion minutes (copy the number from its fact line)
    answer: 3
  - id: thr
    question: divert threshold in total minutes (copy the number from its fact line)
    answer: 22
  - id: tot
    question: total excursion minutes across all legs (sum them)
    answer: 23
  - id: worst
    question: the worst single leg in excursion minutes (the maximum)
    answer: 14
  - id: div
    question: divert tonight, true or false (apply the boundary word to total vs threshold)
    answer: true
  aggregate: '{''total_excursion_minutes'': a(''m1'') + a(''m2'') + a(''m3''), ''divert'': bool((a(''m1'') + a(''m2'') + a(''m3'')) > a(''thr'')), ''worst_leg_minutes'': max(a(''m1''), a(''m2''), a(''m3''))}'
