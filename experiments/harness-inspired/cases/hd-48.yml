  the close bench reconciles two ledgers that agree on nothing except the arithmetic itself, signs ride the entries from birth, and the difference is allowed to be negative, negative differences are information


  the strictly-past word only governs the tie question tonight, a one-cent difference either crowns a ledger or doesn''t, and both readings have defended the close at least once


  the desk sums a, sums b, subtracts, absolutizes, names, and stops, adjectives about whose ledger is better belong in the meeting, not in the report


  the rules of the desk, as they stand tonight: 1. ledger entries carry sign at birth, debits negative, credits positive, sums are plain addition, the close reads the difference strictly past one cent before calling a ledger higher, an exact tie names no winner. 2. diff is ledger a minus ledger b, sign included, unsigned diff is its absolute value, both reported. 3. the higher ledger is a name, a, b,
  or none, never a sentence.


  the facts of record: ledger a holds +80000, +80000, -20000 whole cents ledger b holds +90000, +60000, -10000 whole cents the bench quotes no sums tonight, both close from the entries alone.


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


