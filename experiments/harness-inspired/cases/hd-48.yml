success_criteria:
  deterministic_checks:
    json_exact: '{"sum_a_cents": 140000, "sum_b_cents": 140000, "diff_cents": 0, "unsigned_diff_cents": 0, "higher_ledger": "none"}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - ledger entries carry sign at birth, debits negative, credits positive, sums are plain addition, the close reads the difference strictly past one cent before calling a ledger higher, an exact tie names no winner
  - diff is ledger a minus ledger b, sign included, unsigned diff is its absolute value, both reported
  - the higher ledger is a name, a, b, or none, never a sentence
  facts:
  - ledger a holds +80000, +80000, -20000 whole cents
  - ledger b holds +90000, +60000, -10000 whole cents
  - the bench quotes no sums tonight, both close from the entries alone
  output_spec:
    sum_a_cents: int
    sum_b_cents: int
    diff_cents: int
    unsigned_diff_cents: int
    higher_ledger: str
contract:
  sum_a_cents:
    formula: a1 + a2 + a3
    literals:
    - name: a1
      regex: null
      value: 80000
    - name: a2
      regex: null
      value: 80000
    - name: a3
      regex: null
      value: -20000
  sum_b_cents:
    formula: b1 + b2 + b3
    literals:
    - name: b1
      regex: null
      value: 90000
    - name: b2
      regex: null
      value: 60000
    - name: b3
      regex: null
      value: -10000
  diff_cents:
    formula: sum_a_cents - sum_b_cents
    literals: []
  unsigned_diff_cents:
    formula: (sum_a_cents - sum_b_cents if sum_a_cents - sum_b_cents > 0 else -(sum_a_cents - sum_b_cents))
    literals: []
  higher_ledger:
    formula: '''a'' if diff_cents > 0 else (''b'' if diff_cents < 0 else ''none'')'
    literals: []
v6:
  entities:
  - id: a1
    question: ledger a entry 1 in whole cents, sign included (copy the number from its fact line)
    answer: 80000
  - id: a2
    question: ledger a entry 2 in whole cents, sign included (copy the number from its fact line)
    answer: 80000
  - id: a3
    question: ledger a entry 3 in whole cents, sign included (copy the number from its fact line)
    answer: -20000
  - id: b1
    question: ledger b entry 1 in whole cents, sign included (copy the number from its fact line)
    answer: 90000
  - id: b2
    question: ledger b entry 2 in whole cents, sign included (copy the number from its fact line)
    answer: 60000
  - id: b3
    question: ledger b entry 3 in whole cents, sign included (copy the number from its fact line)
    answer: -10000
  - id: sa
    question: ledger a's sum in whole cents (add its entries)
    answer: 140000
  - id: sb
    question: ledger b's sum in whole cents (add its entries)
    answer: 140000
  - id: df
    question: the diff in whole cents (a minus b, sign included)
    answer: 0
  - id: ud
    question: the unsigned diff in whole cents (absolute value)
    answer: 0
  - id: hi
    question: the higher ledger, a, b, or none (apply the boundary word to the diff)
    answer: none
  aggregate: '{''sum_a_cents'': a(''a1'') + a(''a2'') + a(''a3''), ''sum_b_cents'': a(''b1'') + a(''b2'') + a(''b3''), ''diff_cents'': (a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3'')), ''unsigned_diff_cents'': ((a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3''))) * (1 if ((a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3''))) > 0 else
    -1), ''higher_ledger'': (''a'' if ((a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3''))) > 0 else (''b'' if ((a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3''))) < 0 else ''none''))}'
