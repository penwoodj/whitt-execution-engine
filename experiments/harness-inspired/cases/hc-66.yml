auxiliary: all facts needed are in the prompt itself
provenance: 'window=210 used=230 free=-20 fit=False

  archetype=backup_window variant=2 seed=65'
success_criteria:
  deterministic_checks:
    json_exact: '{"window_minutes": 210, "minutes_used": 230, "minutes_free": -20, "fit": false}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - the backup window is 210 minutes, the report states the minutes used and whether everything fit, nothing is deferred and nothing moves, the fit flag is the deliverable
  - incremental jobs are scheduled after the full, in the order listed, sizes are sizes, no compression magic
  - minutes free may read negative on a night that does not fit, negative headroom is the honest report
  facts:
  - full-mail takes 150 minutes and runs 1 times, incr-config takes 10 minutes and runs 8 times
  output_spec:
    window_minutes: int
    minutes_used: int
    minutes_free: int
    fit: bool
contract:
  minutes_used:
    formula: d1*c1+d2*c2
    literals:
    - name: d1
      regex: full-mail takes (\d+) minutes
      value: 150
    - name: c1
      regex: full-mail takes \d+ minutes and runs (\d+) times
      value: 1
    - name: d2
      regex: incr-config takes (\d+) minutes
      value: 10
    - name: c2
      regex: incr-config takes \d+ minutes and runs (\d+) times
      value: 8
  minutes_free:
    formula: W - minutes_used
    literals:
    - name: W
      regex: backup window is (\d+) minutes
      value: 210
  fit:
    formula: minutes_used <= W
    literals: []
v6:
  entities:
  - id: wm
    question: the backup window length in minutes
    answer: 210
  - id: mu
    question: minutes actually used (all jobs summed)
    answer: 230
  - id: mf
    question: minutes free after everything scheduled
    answer: -20
  - id: ft
    question: does everything fit inside the window (true or false)
    answer: false
  aggregate: '{''window_minutes'': int(a(''wm'')), ''minutes_used'': int(a(''mu'')), ''minutes_free'': int(a(''mf'')), ''fit'': bool(a(''ft''))}'
