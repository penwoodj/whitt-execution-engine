domain: backup window scheduling
objective: derive window_minutes, minutes_used, minutes_free, fit from the stated rules
prompt: 'the quota desk is your assignment, the rules below came from a postmortem nobody wants repeated, the rules stack, later rules do not cancel earlier ones.


  the backup window opens at two and closes when it closes, full-mail takes 150 minutes and runs 1 times, incr-config takes 10 minutes and runs 8 times. sum the minutes, compare to the window, the fit is
  boolean, there is no almost. leftover minutes are slack, slack is not a resource, it is a report line.


  the no-resume clause was written over a restore drill that found half a full and a whole lot of nothing, half a backup is a rumor, not a backup.


  the dedupe appliance you do not manage claims big savings on its own graphs, the window schedules raw minutes, raw is what runs.


  the rules of the desk, as they stand tonight: 1. the backup window is 210 minutes, the report states the minutes used and whether everything fit, nothing is deferred and nothing moves, the fit flag is
  the deliverable. 2. incremental jobs are scheduled after the full, in the order listed, sizes are sizes, no compression magic. 3. minutes free may read negative on a night that does not fit, negative
  headroom is the honest report.


  the facts of record: full-mail takes 150 minutes and runs 1 times, incr-config takes 10 minutes and runs 8 times.


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


  there is no partial credit at this desk, a count is right or it is tomorrow''s incident review


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


