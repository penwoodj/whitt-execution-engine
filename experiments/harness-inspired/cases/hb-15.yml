v6:
  entities:
  - id: volkan_reset
    question: Volkan played 40 ranked matches (>= 30 threshold) so he keeps his rating — players at or above the threshold never take a full reset; does Volkan take a full reset? (1 if yes, 0 if no)
    answer: 0
  - id: mira_reset
    question: Mira played only 9 ranked but completed the 5-match calibration series earning a placement — calibration completers receive placements, never full resets; does Mira take a full reset? (1 if
      yes, 0 if no)
    answer: 0
  - id: joona_reset
    question: Joona played 22 ranked matches (below the 30 threshold) and chose not to calibrate — players under 30 matches without calibration take the full reset; does Joona take a full reset? (1 if yes,
      0 if no)
    answer: 1
  - id: petra_reset
    question: Petra played 12 ranked matches (below the 30 threshold) and skipped calibration — players under 30 matches without calibration take the full reset; does Petra take a full reset? (1 if yes,
      0 if no)
    answer: 1
  - id: placements_count
    question: Count players receiving calibration placements this season (under 30 ranked matches but completed the 5-game series) — only Mira qualifies; how many placements?
    answer: 1
  - id: kept_count
    question: Count players keeping a carried-over rating (completed 30 or more ranked matches) — only Volkan's 40 qualifies; how many kept?
    answer: 1
  - id: soft_reset_count
    question: Kept ratings below the 1200 floor are raised to it — Volkan keeps 1800 which is above 1200; how many kept ratings needed raising?
    answer: 0
  aggregate: '{"resets": a("volkan_reset") + a("mira_reset") + a("joona_reset") + a("petra_reset"), "placements": a("placements_count"), "kept_mmr": a("kept_count"), "soft_reset": a("soft_reset_count")}'
