  the pause clock doubles and doubles until the cap slaps it down, and the only real trap tonight is the unit line, waits live in milliseconds, the budget lives in seconds, and the conversion direction has caught better desks than this one


  the breach word is at-or-over tonight, a total that lands exactly on the budget is either a breach or a miracle depending on that single word, read it again


  the desk lists every wait, caps applied, before summing anything, sums assembled from uncapped doublings are fiction with decimals


  the rules of the desk, as they stand tonight: 1. each retry waits double the previous wait, starting from the base, every wait capped at the cap, the cap applies after doubling, doubling never resurrects a capped wait. 2. the budget gate reads the total wait in whole seconds, the run breaches when the total is at-or-over the budget, milliseconds convert to seconds floor-divided by 1000. 3. reported
  waits are milliseconds, the budget is seconds, the conversion is part of the test.


  the facts of record: the base wait is 1000 milliseconds, the cap is 8000 milliseconds, and the run makes 4 retries against a 15 second budget the runner quotes no wait list and no total tonight, the desk doubles, caps, and sums from the base alone.


