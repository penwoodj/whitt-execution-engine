task_core:
  rules:
  - each tranche releases its percentage of the total only when its inspection count is at-or-over its threshold, percentages apply to the full escrow total, never to a remainder
  - integer cents throughout, percentage of total computed as total times percent floor-divided by 100
  - held is total minus released, held is never negative and never silent, unreleased tranches stay held entirely
  facts:
  - the escrow total is 520000 whole units
  - tranche 1 is 30 percent with threshold 2 inspections passed 1, tranche 2 is 25 percent with threshold 4 inspections passed 4, tranche 3 is 25 percent with threshold 5 inspections passed 3, tranche 4 is 20 percent with threshold 5 inspections passed 6
  - no tranche amount is taken on faith tonight, every release is recomputed from the gate
  output_spec:
    tranches_released: int
    cents_released: int
    cents_held: int
contract:
  tranches_released:
    formula: ((g1 >= t1) and 1 or 0) + ((g2 >= t2) and 1 or 0) + ((g3 >= t3) and 1 or 0) + ((g4 >= t4) and 1 or 0)
    literals:
    - name: g1
      regex: tranche 1 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 1
    - name: g2
      regex: tranche 2 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 4
    - name: g3
      regex: tranche 3 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 3
    - name: g4
      regex: tranche 4 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 6
    - name: t1
      regex: tranche 1 is \d+ percent with threshold (\d+) inspections
      value: 2
    - name: t2
      regex: tranche 2 is \d+ percent with threshold (\d+) inspections
      value: 4
    - name: t3
      regex: tranche 3 is \d+ percent with threshold (\d+) inspections
      value: 5
    - name: t4
      regex: tranche 4 is \d+ percent with threshold (\d+) inspections
      value: 5
  cents_released:
    formula: ((g1 >= t1) and (T * 30 // 100) or 0) + ((g2 >= t2) and (T * 25 // 100) or 0) + ((g3 >= t3) and (T * 25 // 100) or 0) + ((g4 >= t4) and (T * 20 // 100) or 0)
    literals:
    - name: T
      regex: escrow total is (\d+) whole units
      value: 520000
    - name: g1
      regex: tranche 1 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 1
    - name: g2
      regex: tranche 2 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 4
    - name: g3
      regex: tranche 3 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 3
    - name: g4
      regex: tranche 4 is \d+ percent with threshold \d+ inspections passed (\d+)
      value: 6
    - name: t1
      regex: tranche 1 is \d+ percent with threshold (\d+) inspections
      value: 2
    - name: t2
      regex: tranche 2 is \d+ percent with threshold (\d+) inspections
      value: 4
    - name: t3
      regex: tranche 3 is \d+ percent with threshold (\d+) inspections
      value: 5
    - name: t4
      regex: tranche 4 is \d+ percent with threshold (\d+) inspections
      value: 5
  cents_held:
    formula: T - cents_released
    literals: []
