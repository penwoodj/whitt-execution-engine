prompt: 'the storm begins with a handoff note that always ends the same way, trust the rules, not the totals, and tonight is one of those nights where every clause earns its keep.


  the escrow rail pays out in rungs and tonight the at-or-over reading of each threshold decides which rungs hold weight, an inspection sitting exactly on a threshold is the whole game when the convention is strict


  the desk computes each tranche against the full total, the remainder-based reading was retired after the year it silently underpaid two tranches


  nothing here rolls over, nothing here compounds, a tranche releases or it does not, binary as a rivet


  the rules of the desk, as they stand tonight: 1. each tranche releases its percentage of the total only when its inspection count is at-or-over its threshold, percentages apply to the full escrow total, never to a remainder. 2. integer cents throughout, percentage of total computed as total times percent floor-divided by 100. 3. held is total minus released, held is never negative and never silent,
  unreleased tranches stay held entirely.


  the facts of record: the escrow total is 520000 whole units tranche 1 is 30 percent with threshold 2 inspections passed 1, tranche 2 is 25 percent with threshold 4 inspections passed 4, tranche 3 is 25 percent with threshold 5 inspections passed 3, tranche 4 is 20 percent with threshold 5 inspections passed 6 no tranche amount is taken on faith tonight, every release is recomputed from the gate.


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


