provenance: 'exc=[6, 9, 11] thr=25 op=''>=''

  total=26 divert=True worst=11

  archetype=cold_divert variant=2 seed=68'
success_criteria:
  deterministic_checks:
    json_exact: '{"total_excursion_minutes": 26, "divert": true, "worst_leg_minutes": 11}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a leg accrues excursion minutes while its cargo reads above eight degrees, minutes are whole and additive across legs
  - the shipment diverts when total excursion is at-or-over the divert threshold, the threshold is total minutes, never per leg
  - worst leg is the single largest leg excursion, reported separately because the warehouse argues about it
  facts:
  - haul-x logged 6 excursion minutes, haul-y logged 9 excursion minutes, haul-z logged 11 excursion minutes
  - the divert threshold is 25 total minutes
  - the line quotes no total tonight, the desk sums the legs itself
  output_spec:
    total_excursion_minutes: int
    divert: bool
    worst_leg_minutes: int
contract:
  total_excursion_minutes:
    formula: m1 + m2 + m3
    literals:
    - name: m1
      regex: haul-x logged (\d+) excursion minutes
      value: 6
    - name: m2
      regex: haul-y logged (\d+) excursion minutes
      value: 9
    - name: m3
      regex: haul-z logged (\d+) excursion minutes
      value: 11
  divert:
    formula: bool((m1 + m2 + m3) >= thr)
    literals:
    - name: thr
      regex: threshold is (\d+) total minutes
      value: 25
  worst_leg_minutes:
    formula: max(m1, m2, m3)
    literals: []
v6:
  entities:
  - id: m1
    question: haul-x's excursion minutes (copy the number from its fact line)
    answer: 6
  - id: m2
    question: haul-y's excursion minutes (copy the number from its fact line)
    answer: 9
  - id: m3
    question: haul-z's excursion minutes (copy the number from its fact line)
    answer: 11
  - id: thr
    question: divert threshold in total minutes (copy the number from its fact line)
    answer: 25
  - id: tot
    question: total excursion minutes across all legs (sum them)
    answer: 26
  - id: worst
    question: the worst single leg in excursion minutes (the maximum)
    answer: 11
  - id: div
    question: divert tonight, true or false (apply the boundary word to total vs threshold)
    answer: true
  aggregate: '{''total_excursion_minutes'': a(''m1'') + a(''m2'') + a(''m3''), ''divert'': bool((a(''m1'') + a(''m2'') + a(''m3'')) >= a(''thr'')), ''worst_leg_minutes'': max(a(''m1''), a(''m2''), a(''m3''))}'
