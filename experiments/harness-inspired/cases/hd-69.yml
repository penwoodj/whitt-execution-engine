prompt: 'the cold begins with a handoff note that always ends the same way, trust the rules, not the totals, the counts below are tonight''s, the rules below are forever.


  the cold line counts minutes above eight degrees the way a auditor counts irregularities, one at a time, without mercy, and the divert threshold is the moment the counting stops mattering and the trucks turn around


  at-or-over the threshold is tonight''s divert word, a total sitting exactly on the line is either spoiled or saved by that word alone, the desk reads it twice


  the worst leg gets named in the report because the warehouse and the carrier argue about whose minutes they were, the desk does not referee, it just reports the maximum


  the rules of the desk, as they stand tonight: 1. a leg accrues excursion minutes while its cargo reads above eight degrees, minutes are whole and additive across legs. 2. the shipment diverts when total excursion is at-or-over the divert threshold, the threshold is total minutes, never per leg. 3. worst leg is the single largest leg excursion, reported separately because the warehouse argues about
  it.


  the facts of record: haul-x logged 6 excursion minutes, haul-y logged 9 excursion minutes, haul-z logged 11 excursion minutes the divert threshold is 25 total minutes the line quotes no total tonight, the desk sums the legs itself.


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


