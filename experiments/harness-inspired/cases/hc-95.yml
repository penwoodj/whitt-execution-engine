  clinician, rejects go back to the floor, ships make the truck.


  the at-the-limit-ships clause matters, exactly at limit is compliant, over limit holds, the boundary rule reads the same as every boundary at this desk.


  the courier portal you do not manage reprints manifests with its own hold column, the portal column is a guess, this sheet is the manifest.


