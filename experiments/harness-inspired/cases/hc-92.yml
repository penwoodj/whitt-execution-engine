  archetype=cart_audit variant=3 seed=91'
success_criteria:
  deterministic_checks:
    json_exact: '{"net_abandoned": 119, "restored": 31, "merged": 26, "converted": 88}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a restored cart leaves the abandoned count, restore is a rescue, not a re-abandon
  - merged carts collapse two sessions into one before any ratio math, merge is a fact, not a loss
  - conversion counts checkouts from live carts only, restored carts that converted count in both restored and converted
  facts:
  - 520 sessions opened carts tonight
  - 150 carts were abandoned, 31 of those were later restored
  - 26 pairs of carts merged into single carts
  - 88 carts converted to checkouts
  output_spec:
    net_abandoned: int
    restored: int
    merged: int
    converted: int
contract:
  net_abandoned:
    formula: A - R
    literals:
    - name: A
      regex: (\d+) carts were abandoned
      value: 150
    - name: R
      regex: (\d+) of those were later restored
      value: 31
v6:
  entities:
  - id: na
    question: net abandoned carts (abandoned minus restored)
    answer: 119
  - id: rs
    question: carts restored after abandonment
    answer: 31
  - id: mg
    question: cart merge operations tonight
    answer: 26
  - id: cv
    question: carts converted to checkouts
    answer: 88
  aggregate: '{''net_abandoned'': int(a(''na'')), ''restored'': int(a(''rs'')), ''merged'': int(a(''mg'')), ''converted'': int(a(''cv''))}'
