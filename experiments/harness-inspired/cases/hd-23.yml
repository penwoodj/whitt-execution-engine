  aggregate: '{''sum_a_cents'': a(''a1'') + a(''a2'') + a(''a3''), ''sum_b_cents'': a(''b1'') + a(''b2'') + a(''b3''), ''diff_cents'': (a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3'')), ''unsigned_diff_cents'': ((a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3''))) * (1 if ((a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3''))) > 0 else
    -1), ''higher_ledger'': (''a'' if ((a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3''))) > 0 else (''b'' if ((a(''a1'') + a(''a2'') + a(''a3'')) - (a(''b1'') + a(''b2'') + a(''b3''))) < 0 else ''none''))}'
