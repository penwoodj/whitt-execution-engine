  the close bench reconciles two ledgers that agree on nothing except the arithmetic itself, signs ride the entries from birth, and the difference is allowed to be negative, negative differences are information


  the at-or-over word only governs the tie question tonight, a one-cent difference either crowns a ledger or doesn''t, and both readings have defended the close at least once


  the desk sums a, sums b, subtracts, absolutizes, names, and stops, adjectives about whose ledger is better belong in the meeting, not in the report


  the rules of the desk, as they stand tonight: 1. ledger entries carry sign at birth, debits negative, credits positive, sums are plain addition, the close reads the difference at-or-over one cent before calling a ledger higher, an exact tie names no winner. 2. diff is ledger a minus ledger b, sign included, unsigned diff is its absolute value, both reported. 3. the higher ledger is a name, a, b, or
  none, never a sentence.


  the facts of record: ledger a holds +120000, -45000, +30000 whole cents ledger b holds +100000, -50000, +40000 whole cents the bench quotes no sums tonight, both close from the entries alone.


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


