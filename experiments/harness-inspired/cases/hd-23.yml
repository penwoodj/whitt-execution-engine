success_criteria:
  deterministic_checks:
    json_exact: '{"sum_a_cents": 105000, "sum_b_cents": 90000, "diff_cents": 15000, "unsigned_diff_cents": 15000, "higher_ledger": "a"}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - ledger entries carry sign at birth, debits negative, credits positive, sums are plain addition, the close reads the difference at-or-over one cent before calling a ledger higher, an exact tie names no winner
  - diff is ledger a minus ledger b, sign included, unsigned diff is its absolute value, both reported
  - the higher ledger is a name, a, b, or none, never a sentence
  facts:
  - ledger a holds +120000, -45000, +30000 whole cents
  - ledger b holds +100000, -50000, +40000 whole cents
  - the bench quotes no sums tonight, both close from the entries alone
  output_spec:
    sum_a_cents: int
    sum_b_cents: int
    diff_cents: int
    unsigned_diff_cents: int
    higher_ledger: str
contract:
  sum_a_cents:
    formula: a1 + a2 + a3
    literals:
    - name: a1
      regex: null
      value: 120000
    - name: a2
      regex: null
      value: -45000
    - name: a3
      regex: null
      value: 30000
  sum_b_cents:
    formula: b1 + b2 + b3
    literals:
    - name: b1
      regex: null
      value: 100000
    - name: b2
      regex: null
      value: -50000
    - name: b3
      regex: null
      value: 40000
  diff_cents:
    formula: sum_a_cents - sum_b_cents
    literals: []
  unsigned_diff_cents:
    formula: (sum_a_cents - sum_b_cents if sum_a_cents - sum_b_cents > 0 else -(sum_a_cents - sum_b_cents))
    literals: []
  higher_ledger:
    formula: '''a'' if diff_cents > 0 else (''b'' if diff_cents < 0 else ''none'')'
    literals: []
v6:
  entities:
  - id: a1
    question: ledger a entry 1 in whole cents, sign included (copy the number from its fact line)
    answer: 120000
  - id: a2
    question: ledger a entry 2 in whole cents, sign included (copy the number from its fact line)
    answer: -45000
  - id: a3
