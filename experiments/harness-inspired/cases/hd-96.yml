success_criteria:
  deterministic_checks:
    json_exact: '{"clock_minutes": 75, "wall_minutes": 155, "breached": true, "margin_minutes": -8}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - the warranty clock runs only while the desk works, the vendor hold pauses it entirely, paused minutes accrue to the wall clock and never to the warranty clock
  - the desk counts a routing offset toward the deadline, breach reads the warranty clock plus offset strictly past the deadline, margin is deadline minus that sum, reported negative when blown
  - the report wants warranty minutes, wall minutes, the breach flag, and the margin, all whole minutes
  facts:
  - the ticket ran 35 working minutes, then a vendor hold paused it for 80 minutes, then 40 more working minutes
  - the deadline is 75 minutes with a 8 minute routing offset
  - the desk quotes neither clock tonight, both derive from the stretches and the hold
  output_spec:
    clock_minutes: int
    wall_minutes: int
    breached: bool
    margin_minutes: int
contract:
  clock_minutes:
    formula: pre + post
    literals:
    - name: pre
      regex: ran (\d+) working minutes
      value: 35
    - name: post
      regex: then (\d+) more working minutes
      value: 40
  wall_minutes:
    formula: pre + pause + post
    literals:
    - name: pause
      regex: paused it for (\d+) minutes
      value: 80
  breached:
    formula: bool((pre + post + off) > sla)
    literals:
    - name: 'off'
      regex: a (\d+) minute routing offset
      value: 8
    - name: sla
      regex: deadline is (\d+) minutes
      value: 75
  margin_minutes:
    formula: sla - (pre + post + off)
    literals: []
v6:
  entities:
  - id: pre
    question: first working stretch in minutes (copy the number from its fact line)
    answer: 35
  - id: pause
    question: vendor hold in minutes (copy the number from its fact line)
    answer: 80
  - id: post
    question: second working stretch in minutes (copy the number from its fact line)
    answer: 40
  - id: sla
    question: deadline in minutes (copy the number from its fact line)
    answer: 75
  - id: 'off'
    question: routing offset in minutes (copy the number from its fact line)
    answer: 8
  - id: clk
    question: warranty clock minutes (working stretches only)
    answer: 75
  - id: wall
    question: wall clock minutes (everything, hold included)
    answer: 155
  - id: br
    question: breached, true or false (warranty clock plus offset against the deadline word)
    answer: true
  - id: marg
    question: margin in minutes (deadline minus warranty clock plus offset, negative if blown)
    answer: -8
  aggregate: '{''clock_minutes'': a(''pre'') + a(''post''), ''wall_minutes'': a(''pre'') + a(''pause'') + a(''post''), ''breached'': bool((a(''pre'') + a(''post'') + a(''off'')) > a(''sla'')), ''margin_minutes'': a(''sla'') - (a(''pre'') + a(''post'') + a(''off''))}'
