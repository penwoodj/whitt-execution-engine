prompt: 'the replay desk is older than everyone who touches it, the arithmetic it demands is older still, and the nightly ritual starts with reading every rule before touching any number.


  the duty rail prices the shipment, not the shoeboxes inside it, consolidation is the entire game and the entire trap, three cheap items holding hands can price like one expensive item


  the at-or-over convention runs both edges tonight, identically, the binder does not permit a strict lower edge and an inclusive upper edge in the same shipment


  the surcharge rides on the flagged item alone, its percent is its own, its base is the item value, never the shipment total


  the rules of the desk, as they stand tonight: 1. the consolidated shipment duty tier reads the summed value, tier two begins at-or-over 15000 whole cents and tier three begins at-or-over 80000, consolidation means one tier for the whole shipment, never per item. 2. duty is total value times the tier percent floor-divided by 100, the surcharge origin applies to the flagged item''s value only, at its
  own percent. 3. the report wants the tier, the duty, and the surcharge, all in whole cents.


  the facts of record: item i declares 15000 whole cents, item j declares 30000 whole cents, item k declares 15000 whole cents tier two starts at 15000 cents and tier three starts at 80000 cents, rates are 0, 4, and 7 percent the flagged item carries a 2 percent surcharge on its declared value.


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


