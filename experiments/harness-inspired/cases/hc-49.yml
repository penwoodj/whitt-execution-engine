provenance: 'flagged=2 clear=1 color_denied=2 largest=260

  archetype=print_quota variant=1 seed=48'
success_criteria:
  deterministic_checks:
    json_exact: '{"users_flagged": 2, "users_clear": 1, "color_jobs_denied": 2, "largest_job_pages": 260}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - page quota flags at exactly-at, same boundary convention as every quota desk here
  - color printing requires quota headroom, flagged users' color jobs deny outright, mono jobs pass with a warning
  - denied jobs do not print tonight, denial is not deferral
  facts:
  - q1 printed 250 of a 200 page monthly quota, q2 printed 200 of a 200 page monthly quota, q3 printed 180 of a 200 page monthly quota
  - the largest single job tonight ran 260 pages
  - 2 color jobs were denied at the counter
  output_spec:
    users_flagged: int
    users_clear: int
    color_jobs_denied: int
    largest_job_pages: int
contract:
  users_flagged:
    formula: (n1>=q1)+(n2>=q2)+(n3>=q3)
    literals:
    - name: n1
      regex: q1 printed (\d+) of
      value: 250
    - name: q1
      regex: q1 printed \d+ of a (\d+) page monthly quota
      value: 200
    - name: n2
      regex: q2 printed (\d+) of
      value: 200
    - name: q2
      regex: q2 printed \d+ of a (\d+) page monthly quota
      value: 200
    - name: n3
      regex: q3 printed (\d+) of
      value: 180
    - name: q3
      regex: q3 printed \d+ of a (\d+) page monthly quota
      value: 200
  users_clear:
    formula: 3 - users_flagged
    literals: []
v6:
  entities:
  - id: n1
    question: 'pages q1 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 250
  - id: n2
    question: 'pages q2 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 200
  - id: n3
    question: 'pages q3 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 180
  - id: q1
    question: 'q1''s monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 200
  - id: q2
    question: 'q2''s monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 200
  - id: q3
    question: 'q3''s monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 200
  - id: cd
    question: 'color jobs denied tonight (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2
  - id: lp
    question: 'largest single job page count (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 260
  aggregate: '{''users_flagged'': (a(''n1'')>=a(''q1''))+(a(''n2'')>=a(''q2''))+(a(''n3'')>=a(''q3'')), ''users_clear'': (a(''n1'')<a(''q1''))+(a(''n2'')<a(''q2''))+(a(''n3'')<a(''q3'')), ''color_jobs_denied'':
    int(a(''cd'')), ''largest_job_pages'': int(a(''lp''))}'
