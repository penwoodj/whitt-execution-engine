objective: derive users_flagged, users_clear, color_jobs_denied, largest_job_pages from the stated rules
prompt: 'you are standing in as dispatch supervisor, the deploy lane does not care who you are, only that the rules hold, a thing only counts once, no matter how many lists it appears on.


  the print counter closes the month, q1 printed 250 of a 200 page monthly quota, q2 printed 200 of a 200 page monthly quota, q3 printed 180 of a 200 page monthly quota, the largest single job tonight ran
  260 pages, 2 color jobs were denied at the counter. flagged means at-or-over quota, clear means under, color denial rides on top of the flag count, mono never denies.


  the color-gates-on-flag rule came from a toner budget crisis nobody wants repeated, color is a privilege of the under-quota.


  the managed print service you do not manage emails monthly summaries with different rounding, summaries are for managers, this counter is for the record.


  the rules of the desk, as they stand tonight: 1. page quota flags at exactly-at, same boundary convention as every quota desk here. 2. color printing requires quota headroom, flagged users'' color jobs
  deny outright, mono jobs pass with a warning. 3. denied jobs do not print tonight, denial is not deferral.


  the facts of record: q1 printed 250 of a 200 page monthly quota, q2 printed 200 of a 200 page monthly quota, q3 printed 180 of a 200 page monthly quota the largest single job tonight ran 260 pages 2 color
  jobs were denied at the counter.


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


  trainees get told the same thing on day one, slow is fine, wrong is expensive, re-read the boundary clauses before you commit


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


