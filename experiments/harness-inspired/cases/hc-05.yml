auxiliary: all facts needed are in the prompt itself
provenance: 'touched=470 evicted=120 retained=338 dupes=12

  archetype=cache_sweep variant=0 seed=4'
success_criteria:
  deterministic_checks:
    json_exact: '{"touched": 470, "evicted": 120, "retained": 338, "dupes_folded": 12}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each class carries its own retention ceiling, entries beyond the ceiling are eviction candidates, nothing else is
  - duplicated entries fold into one before any counting, a dupe never counts twice anywhere
  - pinned entries survive every sweep, they are counted in retained, never in evicted
  facts:
  - the hot class holds 120 entries against a ceiling of 100, the warm class holds 260 entries against a ceiling of 200, the cold class holds 90 entries against a ceiling of 50
  - 12 entries turned out to be duplicates folded away before counting
  - 15 entries are pinned across all classes
  output_spec:
    touched: int
    evicted: int
    retained: int
    dupes_folded: int
contract:
  touched:
    formula: h1+h2+h3
    literals:
    - name: h1
      regex: the hot class holds (\d+) entries
      value: 120
    - name: h2
      regex: the warm class holds (\d+) entries
      value: 260
    - name: h3
      regex: the cold class holds (\d+) entries
      value: 90
    - name: c1
      regex: the hot class holds \d+ entries against a ceiling of (\d+)
      value: 100
    - name: c2
      regex: the warm class holds \d+ entries against a ceiling of (\d+)
      value: 200
    - name: c3
      regex: the cold class holds \d+ entries against a ceiling of (\d+)
      value: 50
  evicted:
    formula: max(h1-c1,0)+max(h2-c2,0)+max(h3-c3,0)
    literals: []
  retained:
    formula: touched - evicted - D
    literals:
    - name: D
      regex: (\d+) entries turned out to be duplicates
      value: 12
  dupes_folded:
    formula: D
    literals: []
v6:
  entities:
  - id: h1
    question: 'entries the hot class holds (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 120
  - id: h2
    question: 'entries the warm class holds (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 260
  - id: h3
    question: 'entries the cold class holds (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 90
  - id: c1
    question: 'the hot class ceiling (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 100
  - id: c2
    question: 'the warm class ceiling (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 200
  - id: c3
    question: 'the cold class ceiling (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 50
  - id: d
    question: 'duplicate entries folded away (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 12
  aggregate: '{''touched'': a(''h1'')+a(''h2'')+a(''h3''), ''evicted'': max(a(''h1'')-a(''c1''),0)+max(a(''h2'')-a(''c2''),0)+max(a(''h3'')-a(''c3''),0), ''retained'': a(''h1'')+a(''h2'')+a(''h3'')-(max(a(''h1'')-a(''c1''),0)+max(a(''h2'')-a(''c2''),0)+max(a(''h3'')-a(''c3''),0))-a(''d''),
    ''dupes_folded'': a(''d'')}'
