prompt: 'the cold crew calls the ramp gate the oracle, mostly affectionately, occasionally in vain, so the desk works the problem the slow way, on purpose.


  the tiering station handles one parcel tonight and the whole exercise hangs on a single boundary read, a strictly-past read leaves edge weight in the lower band, and the two conventions have never once agreed at the edge


  the rate card is laminated, the edges are not negotiable, and the urgent multiplier is a flat two, applied last, applied always


  the desk works the band first, the charge second, the doubling third, in that order, because every other order has been tried and every other order has failed


  the rules of the desk, as they stand tonight: 1. parcel weight moves up a band only when strictly past the band edge, edges measured to the whole gram, no rounding of weight. 2. band 1 runs under 150 grams at 90 whole cents, band 2 runs to under 400 grams at 150 whole cents, band 3 is everything at or beyond that at 210 whole cents. 3. urgent parcels pay double the band charge, doubling happens after
  banding, never before.


  the facts of record: tonight''s parcel weighs 150 whole grams the band edges are 150 grams and 400 grams the band rates run 90, 150, then 210 whole cents from the lowest band up.


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


