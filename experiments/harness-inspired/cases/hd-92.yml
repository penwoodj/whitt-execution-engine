auxiliary: all facts needed are in the prompt itself
provenance: 'a=50 b=50 want=90 tneed=45

  pool=100 ceiling=100 overflow=0

  ceiling=a if tneed>a else pool

  archetype=room_split variant=3 seed=91'
success_criteria:
  deterministic_checks:
    json_exact: '{"total_seats": 100, "bookable_seats": 100, "overflow_attendees": 0}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - merged rooms pool total seats, but sessions needing the tech rig can only use seats in the tech room, a session pins its ceiling only strictly past the tech room size minus one only when its tech need exceeds what the tech room holds
  - bookable is the ceiling after the tech rule applies, overflow is demand minus bookable, floored at zero
  - the report wants pooled seats, bookable seats, and overflow, in whole seats
  facts:
  - room one seats 50 with the tech rig and room two seats 50 without
  - the session wants 90 attendees and the tech need is 45 seats
  - the comb quotes neither pool nor ceiling tonight, both derive from the room facts
  output_spec:
    total_seats: int
    bookable_seats: int
    overflow_attendees: int
contract:
  total_seats:
    formula: rm1 + rm2
    literals:
    - name: rm1
      regex: room one seats (\d+)
      value: 50
    - name: rm2
      regex: room two seats (\d+)
      value: 50
  bookable_seats:
    formula: (rm1 if tneed > rm1 else (rm1 + rm2))
    literals:
    - name: tneed
      regex: tech need is (\d+) seats
      value: 45
  overflow_attendees:
    formula: max(0, want - bookable_seats)
    literals:
    - name: want
      regex: session wants (\d+) attendees
      value: 90
v6:
  entities:
  - id: rm1
    question: tech room seats (copy the number from its fact line)
    answer: 50
  - id: rm2
    question: plain room seats (copy the number from its fact line)
    answer: 50
  - id: want
    question: session demand in attendees (copy the number from its fact line)
    answer: 90
  - id: tneed
    question: tech need in seats (copy the number from its fact line)
    answer: 45
  - id: pool
    question: pooled seats across both rooms (sum them)
    answer: 100
  - id: ceil
    question: bookable seats after the tech rule (the ceiling)
    answer: 100
  - id: over
    question: overflow attendees (demand past the ceiling, floored at zero)
    answer: 0
  aggregate: '{''total_seats'': a(''rm1'') + a(''rm2''), ''bookable_seats'': (a(''rm1'') if a(''tneed'') > a(''rm1'') else (a(''rm1'') + a(''rm2''))), ''overflow_attendees'': max(0, a(''want'') - (a(''rm1'') if a(''tneed'') > a(''rm1'') else (a(''rm1'') + a(''rm2''))))}'
