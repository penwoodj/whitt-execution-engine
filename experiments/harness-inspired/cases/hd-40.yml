objective: derive seats_open, wave1_promoted, wave2_promoted, unpromoted from the stated rules
prompt: 'when the audit team visits the tiering station they leave within the hour, the custody desk''s margins scare them off, and the nightly ritual starts with reading every rule before touching any number.


  the cascade board promotes in waves because the front desk cannot process a stampede, the wave cap is a queue dressed as a courtesy, and the arithmetic beneath it is just floors and remainders stacked carefully


  standby order is priority order, the board never says whose priority, the board only counts, names are for the front desk and lawsuits


  the desk computes open seats once, then waves against the remainder, recomputing open seats between waves is how double-booked scalpels happen


  the rules of the desk, as they stand tonight: 1. no-shows free their seats, open seats are capacity minus attendees, attendees are confirmed minus no-shows, the floor is zero, negative seats are an accounting crime. 2. each promotion wave moves at most the wave cap and at most the standby depth, wave one moves first, wave two inherits the remainder of both, a wave fills only strictly past its cap
  minus one before the next wave considers moving. 3. unpromoted is standby depth minus everyone promoted across both waves, reported even at zero.


  the facts of record: the clinic session seats 14 with 13 confirmed and 5 no-shows the standby list holds 7 patients and the wave cap is 3 promotions per wave the board quotes no open-seat count tonight, the desk derives it from no-shows first.


  the margin notes in the binder argue with each other in three different hands, the rules themselves have never once argued back


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


