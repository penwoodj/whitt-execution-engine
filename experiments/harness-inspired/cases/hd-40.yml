success_criteria:
  deterministic_checks:
    json_exact: '{"seats_open": 6, "wave1_promoted": 3, "wave2_promoted": 3, "unpromoted": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - no-shows free their seats, open seats are capacity minus attendees, attendees are confirmed minus no-shows, the floor is zero, negative seats are an accounting crime
  - each promotion wave moves at most the wave cap and at most the standby depth, wave one moves first, wave two inherits the remainder of both, a wave fills only strictly past its cap minus one before the next wave considers moving
  - unpromoted is standby depth minus everyone promoted across both waves, reported even at zero
  facts:
  - the clinic session seats 14 with 13 confirmed and 5 no-shows
  - the standby list holds 7 patients and the wave cap is 3 promotions per wave
  - the board quotes no open-seat count tonight, the desk derives it from no-shows first
  output_spec:
    seats_open: int
    wave1_promoted: int
    wave2_promoted: int
    unpromoted: int
contract:
  seats_open:
    formula: max(0, cap - (conf - ns))
    literals:
    - name: cap
      regex: session seats (\d+)
      value: 14
    - name: conf
      regex: with (\d+) confirmed
      value: 13
    - name: ns
      regex: and (\d+) no-shows
      value: 5
  wave1_promoted:
    formula: min(seats_open, wv, sb)
    literals:
    - name: wv
      regex: wave cap is (\d+) promotions
      value: 3
    - name: sb
      regex: standby list holds (\d+) patients
      value: 7
  wave2_promoted:
    formula: min(max(0, seats_open - wave1_promoted), wv, sb - wave1_promoted)
    literals: []
  unpromoted:
    formula: sb - wave1_promoted - wave2_promoted
    literals: []
v6:
  entities:
  - id: cap
    question: session capacity in seats (copy the number from its fact line)
    answer: 14
  - id: conf
    question: confirmed count (copy the number from its fact line)
    answer: 13
  - id: ns
    question: no-show count (copy the number from its fact line)
    answer: 5
  - id: sb
    question: standby depth (copy the number from its fact line)
    answer: 7
  - id: wv
    question: wave cap (copy the number from its fact line)
    answer: 3
  - id: op
    question: open seats after no-shows (capacity minus attendees, floored at zero)
    answer: 6
  - id: w1
    question: wave one promotions (open seats, wave cap, and standby depth willing)
    answer: 3
  - id: w2
    question: wave two promotions (remainder after wave one, same caps)
    answer: 3
  - id: unp
    question: unpromoted standby patients after both waves (count them)
    answer: 1
  aggregate: '{''seats_open'': max(0, a(''cap'') - (a(''conf'') - a(''ns''))), ''wave1_promoted'': min(max(0, a(''cap'') - (a(''conf'') - a(''ns''))), a(''wv''), a(''sb'')), ''wave2_promoted'': min(max(0, max(0, a(''cap'') - (a(''conf'') - a(''ns''))) - min(max(0, a(''cap'') - (a(''conf'') - a(''ns''))), a(''wv''), a(''sb''))), a(''wv''), a(''sb'') - min(max(0, a(''cap'') - (a(''conf'') - a(''ns''))),
    a(''wv''), a(''sb''))), ''unpromoted'': a(''sb'') - min(max(0, a(''cap'') - (a(''conf'') - a(''ns''))), a(''wv''), a(''sb'')) - min(max(0, max(0, a(''cap'') - (a(''conf'') - a(''ns''))) - min(max(0, a(''cap'') - (a(''conf'') - a(''ns''))), a(''wv''), a(''sb''))), a(''wv''), a(''sb'') - min(max(0, a(''cap'') - (a(''conf'') - a(''ns''))), a(''wv''), a(''sb'')))}'
