success_criteria:
  deterministic_checks:
    json_exact: '{"cycle1_net_promoted": 54, "cycle2_net_promoted": 38, "stuck_count": 388}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each cycle promotes ceil of cohort times the promotion percent per hundred, rounding up always, a cohort is promotion-eligible at-or-over 150 users, eligibility is about the cohort, the percent is about the cycle
  - errors demote, each error removes one promotion, demotions floor at zero per cycle, demoted users rejoin their origin cohort and count as stuck
  - cycle two's cohort inherits cycle one's net promotions before its own percent applies, inheritance is additive, the percent applies to the inherited size
  facts:
  - cohort-a starts with 300 users at 20 percent and 6 errors, cohort-b starts with 180 users at 20 percent and 9 errors
  - the eligibility floor is 150 users per cohort
  - the drum quotes no promotion counts tonight, every net derives from size, percent, and errors
  output_spec:
    cycle1_net_promoted: int
    cycle2_net_promoted: int
    stuck_count: int
contract:
  cycle1_net_promoted:
    formula: max(0, (s1 * p1 + 99) // 100 - e1)
    literals:
    - name: s1
      regex: cohort-a starts with (\d+) users
      value: 300
    - name: p1
      regex: cohort-a starts with \d+ users at (\d+) percent
      value: 20
    - name: e1
      regex: cohort-a starts with \d+ users at \d+ percent and (\d+) errors
      value: 6
  cycle2_net_promoted:
    formula: max(0, ((s2 + cycle1_net_promoted) * p2 + 99) // 100 - e2)
    literals:
    - name: s2
      regex: cohort-b starts with (\d+) users
      value: 180
    - name: p2
      regex: cohort-b starts with \d+ users at (\d+) percent
      value: 20
    - name: e2
      regex: cohort-b starts with \d+ users at \d+ percent and (\d+) errors
      value: 9
  stuck_count:
    formula: s1 + s2 - cycle1_net_promoted - cycle2_net_promoted
    literals: []
v6:
  entities:
  - id: s1
    question: cohort-a's starting users (copy the number from its fact line)
    answer: 300
  - id: p1
    question: cohort-a's promotion percent (copy the number from its fact line)
    answer: 20
  - id: e1
    question: cohort-a's errors (copy the number from its fact line)
    answer: 6
  - id: s2
    question: cohort-b's starting users (copy the number from its fact line)
    answer: 180
  - id: p2
    question: cohort-b's promotion percent (copy the number from its fact line)
    answer: 20
  - id: e2
    question: cohort-b's errors (copy the number from its fact line)
    answer: 9
  - id: pr1
    question: cycle one's promotions before errors (ceil of the first cohort times its percent over 100)
    answer: 60
  - id: n1
    question: cycle one's net promotions after demotion (floored at zero)
    answer: 54
  - id: n2
    question: cycle two's net promotions after demotion (inheritance first, then percent, then errors)
    answer: 38
  - id: stuck
    question: stuck users across both cohorts after both cycles (count them)
    answer: 388
  aggregate: '{''cycle1_net_promoted'': max(0, ((a(''s1'') * a(''p1'') + 99) // 100) - a(''e1'')), ''cycle2_net_promoted'': max(0, (((a(''s2'') + max(0, ((a(''s1'') * a(''p1'') + 99) // 100) - a(''e1''))) * a(''p2'') + 99) // 100) - a(''e2'')), ''stuck_count'': a(''s1'') + a(''s2'') - max(0, ((a(''s1'') * a(''p1'') + 99) // 100) - a(''e1'')) - max(0, (((a(''s2'') + max(0, ((a(''s1'') * a(''p1'') + 99)
    // 100) - a(''e1''))) * a(''p2'') + 99) // 100) - a(''e2''))}'
