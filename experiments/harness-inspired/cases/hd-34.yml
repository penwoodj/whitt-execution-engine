domain: release canary promotion cycles
objective: derive cycle1_net_promoted, cycle2_net_promoted, stuck_count from the stated rules
prompt: 'nobody remembers when the rota wheel was installed, everybody remembers the night it was wrong, and the nightly ritual starts with reading every rule before touching any number.


  the promotion drum beats twice tonight and the arithmetic between the beats is where careers go to die, the second cycle is not the first cycle repeated, it is the first cycle inherited


  ceil on the percent, floor on the demotion, the two roundings point in opposite directions on purpose, the binder calls this the pessimist and the optimist sharing a desk


  stuck users are not failed users, they are users whose cohort could not carry them across, the desk counts them without commentary, commentary is for retrospectives


  the rules of the desk, as they stand tonight: 1. each cycle promotes ceil of cohort times the promotion percent per hundred, rounding up always, a cohort is promotion-eligible at-or-over 150 users, eligibility is about the cohort, the percent is about the cycle. 2. errors demote, each error removes one promotion, demotions floor at zero per cycle, demoted users rejoin their origin cohort and count
  as stuck. 3. cycle two''s cohort inherits cycle one''s net promotions before its own percent applies, inheritance is additive, the percent applies to the inherited size.


  the facts of record: cohort-a starts with 300 users at 20 percent and 6 errors, cohort-b starts with 180 users at 20 percent and 9 errors the eligibility floor is 150 users per cohort the drum quotes no promotion counts tonight, every net derives from size, percent, and errors.


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


  the margin notes in the binder argue with each other in three different hands, the rules themselves have never once argued back


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


