success_criteria:
  deterministic_checks:
    json_exact: '{"cycle1_net_promoted": 44, "cycle2_net_promoted": 26, "stuck_count": 450}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each cycle promotes ceil of cohort times the promotion percent per hundred, rounding up always, a cohort is promotion-eligible at-or-over 250 users, eligibility is about the cohort, the percent is about the cycle
  - errors demote, each error removes one promotion, demotions floor at zero per cycle, demoted users rejoin their origin cohort and count as stuck
  - cycle two's cohort inherits cycle one's net promotions before its own percent applies, inheritance is additive, the percent applies to the inherited size
  facts:
  - set-1 starts with 320 users at 15 percent and 4 errors, set-2 starts with 200 users at 15 percent and 11 errors
  - the eligibility floor is 250 users per cohort
  - the drum quotes no promotion counts tonight, every net derives from size, percent, and errors
  output_spec:
    cycle1_net_promoted: int
    cycle2_net_promoted: int
    stuck_count: int
contract:
  cycle1_net_promoted:
    formula: max(0, (s1 * p1 + 99) // 100 - e1)
    literals:
    - name: s1
      regex: set-1 starts with (\d+) users
      value: 320
    - name: p1
      regex: set-1 starts with \d+ users at (\d+) percent
      value: 15
    - name: e1
      regex: set-1 starts with \d+ users at \d+ percent and (\d+) errors
      value: 4
  cycle2_net_promoted:
    formula: max(0, ((s2 + cycle1_net_promoted) * p2 + 99) // 100 - e2)
    literals:
    - name: s2
      regex: set-2 starts with (\d+) users
      value: 200
    - name: p2
      regex: set-2 starts with \d+ users at (\d+) percent
      value: 15
    - name: e2
      regex: set-2 starts with \d+ users at \d+ percent and (\d+) errors
      value: 11
  stuck_count:
    formula: s1 + s2 - cycle1_net_promoted - cycle2_net_promoted
    literals: []
v6:
  entities:
  - id: s1
    question: set-1's starting users (copy the number from its fact line)
    answer: 320
  - id: p1
    question: set-1's promotion percent (copy the number from its fact line)
    answer: 15
  - id: e1
    question: set-1's errors (copy the number from its fact line)
    answer: 4
  - id: s2
    question: set-2's starting users (copy the number from its fact line)
    answer: 200
  - id: p2
    question: set-2's promotion percent (copy the number from its fact line)
    answer: 15
  - id: e2
    question: set-2's errors (copy the number from its fact line)
    answer: 11
  - id: pr1
    question: cycle one's promotions before errors (ceil of the first cohort times its percent over 100)
    answer: 48
  - id: n1
    question: cycle one's net promotions after demotion (floored at zero)
    answer: 44
  - id: n2
    question: cycle two's net promotions after demotion (inheritance first, then percent, then errors)
    answer: 26
  - id: stuck
    question: stuck users across both cohorts after both cycles (count them)
    answer: 450
  aggregate: '{''cycle1_net_promoted'': max(0, ((a(''s1'') * a(''p1'') + 99) // 100) - a(''e1'')), ''cycle2_net_promoted'': max(0, (((a(''s2'') + max(0, ((a(''s1'') * a(''p1'') + 99) // 100) - a(''e1''))) * a(''p2'') + 99) // 100) - a(''e2'')), ''stuck_count'': a(''s1'') + a(''s2'') - max(0, ((a(''s1'') * a(''p1'') + 99) // 100) - a(''e1'')) - max(0, (((a(''s2'') + max(0, ((a(''s1'') * a(''p1'') + 99)
    // 100) - a(''e1''))) * a(''p2'') + 99) // 100) - a(''e2''))}'
