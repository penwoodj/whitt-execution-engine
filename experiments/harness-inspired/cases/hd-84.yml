domain: release canary promotion cycles
objective: derive cycle1_net_promoted, cycle2_net_promoted, stuck_count from the stated rules
prompt: 'the rota wheel is older than everyone who touches it, the arithmetic it demands is older still, and the tally lamp is on, which means somebody''s numbers are about to be wrong.


  the promotion drum beats twice tonight and the arithmetic between the beats is where careers go to die, the second cycle is not the first cycle repeated, it is the first cycle inherited


  ceil on the percent, floor on the demotion, the two roundings point in opposite directions on purpose, the binder calls this the pessimist and the optimist sharing a desk


  stuck users are not failed users, they are users whose cohort could not carry them across, the desk counts them without commentary, commentary is for retrospectives


  the rules of the desk, as they stand tonight: 1. each cycle promotes ceil of cohort times the promotion percent per hundred, rounding up always, a cohort is promotion-eligible at-or-over 250 users, eligibility is about the cohort, the percent is about the cycle. 2. errors demote, each error removes one promotion, demotions floor at zero per cycle, demoted users rejoin their origin cohort and count
  as stuck. 3. cycle two''s cohort inherits cycle one''s net promotions before its own percent applies, inheritance is additive, the percent applies to the inherited size.


  the facts of record: set-1 starts with 320 users at 15 percent and 4 errors, set-2 starts with 200 users at 15 percent and 11 errors the eligibility floor is 250 users per cohort the drum quotes no promotion counts tonight, every net derives from size, percent, and errors.


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


