objective: derive clock_minutes, wall_minutes, breached, margin_minutes from the stated rules
prompt: 'the cold crew calls the cold line the oracle, mostly affectionately, occasionally in vain, the counts below are tonight''s, the rules below are forever.


  the pause clock is two clocks wearing one ticket, the warranty clock sleeps during vendor holds and the wall clock does not, and the difference between them is the exact length of the vendor''s apology


  the routing offset counts against the deadline but never against the work, it is overhead with a vote, and tonight the breach word is at-or-over the deadline


  the desk computes warranty minutes first, adds the offset second, reads the breach third, and reports margin even when negative, especially when negative


  the rules of the desk, as they stand tonight: 1. the warranty clock runs only while the desk works, the vendor hold pauses it entirely, paused minutes accrue to the wall clock and never to the warranty clock. 2. the desk counts a routing offset toward the deadline, breach reads the warranty clock plus offset at-or-over the deadline, margin is deadline minus that sum, reported negative when blown.
  3. the report wants warranty minutes, wall minutes, the breach flag, and the margin, all whole minutes.


  the facts of record: the ticket ran 40 working minutes, then a vendor hold paused it for 35 minutes, then 25 more working minutes the deadline is 90 minutes with a 10 minute routing offset the desk quotes neither clock tonight, both derive from the stretches and the hold.


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


