provenance: 'held=0 rejected=1 shipped=3 cold_shipped=1

  archetype=specimen_routing variant=2 seed=69'
success_criteria:
  deterministic_checks:
    json_exact: '{"held": 0, "rejected": 1, "shipped": 3, "cold_band_shipped": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a sample with more than 2 temperature excursions holds for review, excursion means minutes outside band, at the limit ships
  - incomplete paperwork rejects outright, rejection happens before any excursion math
  - band labels travel with the sample but gate nothing tonight
  facts:
  - x rides the room band, logged 2 excursions, paperwork complete, y rides the cold band, logged 0 excursions, paperwork incomplete, z rides the frozen band, logged 0 excursions, paperwork complete, w
    rides the cold band, logged 1 excursions, paperwork complete
  output_spec:
    held: int
    rejected: int
    shipped: int
    cold_band_shipped: int
contract:
  held:
    formula: ((e1>L)*p1)+((e2>L)*p2)+((e3>L)*p3)+((e4>L)*p4)
    literals:
    - name: L
      regex: more than (\d+) temperature excursions
      value: 2
    - name: e1
      regex: x rides the \w+ band, logged (\d+) excursions
      value: 2
    - name: p1
      regex: x rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: &id001
        complete: 1
        incomplete: 0
    - name: b1
      regex: x rides the (\w+) band
      value: room
    - name: e2
      regex: y rides the \w+ band, logged (\d+) excursions
      value: 0
    - name: p2
      regex: y rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 0
      map: &id002
        complete: 1
        incomplete: 0
    - name: b2
      regex: y rides the (\w+) band
      value: cold
    - name: e3
      regex: z rides the \w+ band, logged (\d+) excursions
      value: 0
    - name: p3
      regex: z rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: &id003
        complete: 1
        incomplete: 0
    - name: b3
      regex: z rides the (\w+) band
      value: frozen
    - name: e4
      regex: w rides the \w+ band, logged (\d+) excursions
      value: 1
    - name: p4
      regex: w rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: &id004
        complete: 1
        incomplete: 0
    - name: b4
      regex: w rides the (\w+) band
      value: cold
  rejected:
    formula: (1-p1)+(1-p2)+(1-p3)+(1-p4)
    literals:
    - name: L
      regex: more than (\d+) temperature excursions
      value: 2
    - name: e1
      regex: x rides the \w+ band, logged (\d+) excursions
      value: 2
    - name: p1
      regex: x rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id001
    - name: b1
      regex: x rides the (\w+) band
      value: room
    - name: e2
      regex: y rides the \w+ band, logged (\d+) excursions
      value: 0
    - name: p2
      regex: y rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 0
      map: *id002
    - name: b2
      regex: y rides the (\w+) band
      value: cold
    - name: e3
      regex: z rides the \w+ band, logged (\d+) excursions
      value: 0
    - name: p3
      regex: z rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id003
    - name: b3
      regex: z rides the (\w+) band
      value: frozen
    - name: e4
      regex: w rides the \w+ band, logged (\d+) excursions
      value: 1
    - name: p4
      regex: w rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id004
    - name: b4
      regex: w rides the (\w+) band
      value: cold
  shipped:
    formula: 4 - held - rejected
    literals: []
  cold_band_shipped:
    formula: ((e1<=L)*p1*(b1=='cold'))+((e2<=L)*p2*(b2=='cold'))+((e3<=L)*p3*(b3=='cold'))+((e4<=L)*p4*(b4=='cold'))
    literals:
    - name: L
      regex: more than (\d+) temperature excursions
      value: 2
    - name: e1
      regex: x rides the \w+ band, logged (\d+) excursions
      value: 2
    - name: p1
      regex: x rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id001
    - name: b1
      regex: x rides the (\w+) band
      value: room
    - name: e2
      regex: y rides the \w+ band, logged (\d+) excursions
      value: 0
    - name: p2
      regex: y rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 0
      map: *id002
    - name: b2
      regex: y rides the (\w+) band
      value: cold
    - name: e3
      regex: z rides the \w+ band, logged (\d+) excursions
      value: 0
    - name: p3
      regex: z rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id003
    - name: b3
      regex: z rides the (\w+) band
      value: frozen
    - name: e4
      regex: w rides the \w+ band, logged (\d+) excursions
      value: 1
    - name: p4
      regex: w rides the \w+ band, logged \d+ excursions, paperwork (complete|incomplete)
      value: 1
      map: *id004
    - name: b4
      regex: w rides the (\w+) band
      value: cold
v6:
  entities:
  - id: e1
    question: 'excursions x logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2
  - id: e2
    question: 'excursions y logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 0
  - id: e3
    question: 'excursions z logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 0
  - id: e4
    question: 'excursions w logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 1
  - id: p1
    question: x paperwork status as a code, answer 1 for complete or 0 for incomplete
    answer: 1
  - id: p2
    question: y paperwork status as a code, answer 1 for complete or 0 for incomplete
    answer: 0
  - id: p3
    question: z paperwork status as a code, answer 1 for complete or 0 for incomplete
    answer: 1
  - id: p4
    question: w paperwork status as a code, answer 1 for complete or 0 for incomplete
    answer: 1
  - id: b1
    question: x's band as a code, answer 1 for cold, 2 for room, or 3 for frozen
    answer: 2
  - id: b2
    question: y's band as a code, answer 1 for cold, 2 for room, or 3 for frozen
    answer: 1
  - id: b3
    question: z's band as a code, answer 1 for cold, 2 for room, or 3 for frozen
    answer: 3
  - id: b4
    question: w's band as a code, answer 1 for cold, 2 for room, or 3 for frozen
    answer: 1
  - id: xl
    question: 'the excursion limit from the rule sentence stating samples with more than N temperature excursions hold for review (that N is the limit, not any sample''s excursion count). hint: copy the
      number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2
  aggregate: '{''held'': (a(''e1'')>a(''xl''))*a(''p1'')+(a(''e2'')>a(''xl''))*a(''p2'')+(a(''e3'')>a(''xl''))*a(''p3'')+(a(''e4'')>a(''xl''))*a(''p4''), ''rejected'': (1-a(''p1''))+(1-a(''p2''))+(1-a(''p3''))+(1-a(''p4'')),
    ''shipped'': 4-((a(''e1'')>a(''xl''))*a(''p1'')+(a(''e2'')>a(''xl''))*a(''p2'')+(a(''e3'')>a(''xl''))*a(''p3'')+(a(''e4'')>a(''xl''))*a(''p4''))-((1-a(''p1''))+(1-a(''p2''))+(1-a(''p3''))+(1-a(''p4''))),
    ''cold_band_shipped'': (a(''e1'')<=a(''xl''))*a(''p1'')*(a(''b1'')==1)+(a(''e2'')<=a(''xl''))*a(''p2'')*(a(''b2'')==1)+(a(''e3'')<=a(''xl''))*a(''p3'')*(a(''b3'')==1)+(a(''e4'')<=a(''xl''))*a(''p4'')*(a(''b4'')==1)}'
