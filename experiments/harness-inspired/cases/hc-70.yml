objective: derive held, rejected, shipped, cold_band_shipped from the stated rules
prompt: 'assignment: the quota desk, holiday rotation, the rules came down from compliance last quarter, boundaries are inclusive unless a rule says otherwise, and these rules say otherwise where it matters.


  the specimen router decides the morning courier manifest, x rides the room band, logged 2 excursions, paperwork complete, y rides the cold band, logged 0 excursions, paperwork incomplete, z rides the
  frozen band, logged 0 excursions, paperwork complete, w rides the cold band, logged 1 excursions, paperwork complete. paperwork first, excursions second, band last as a label only. holds wait for a clinician,
  rejects go back to the floor, ships make the truck.


  the at-the-limit-ships clause matters, exactly at limit is compliant, over limit holds, the boundary rule reads the same as every boundary at this desk.


  the courier portal you do not manage reprints manifests with its own hold column, the portal column is a guess, this sheet is the manifest.


  the rules of the desk, as they stand tonight: 1. a sample with more than 2 temperature excursions holds for review, excursion means minutes outside band, at the limit ships. 2. incomplete paperwork rejects
  outright, rejection happens before any excursion math. 3. band labels travel with the sample but gate nothing tonight.


  the facts of record: x rides the room band, logged 2 excursions, paperwork complete, y rides the cold band, logged 0 excursions, paperwork incomplete, z rides the frozen band, logged 0 excursions, paperwork
  complete, w rides the cold band, logged 1 excursions, paperwork complete.


  the numbers go upstream to people who act on them within the hour, that urgency is why the recheck tail exists on every report


  the desk has one drawer and the drawer holds the reconciliation stapler, that is the entire administrative apparatus, everything else is the rules and the counts they produce


  when two ledgers disagree the one derived from the rules wins, the other one becomes a footnote in somebody''s weekly note


