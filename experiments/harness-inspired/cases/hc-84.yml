auxiliary: all facts needed are in the prompt itself
provenance: 'classes_purged=2 held=1 records_deleted=154

  archetype=retention_purge variant=3 seed=83'
success_criteria:
  deterministic_checks:
    json_exact: '{"classes_purged": 2, "classes_held": 1, "records_deleted": 154, "classes_total": 3}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each class purges records older than its own retention days, no exceptions inside a class
  - classes with an open legal hold skip the purge entirely tonight, hold means all-or-nothing per class
  - the purge counts records deleted, not records scanned, scanning is free and counts for nothing
  facts:
  - the slow class scanned 700 records with a retention of 21 days, 154 beyond retention, the fast class scanned 1200 records with a retention of 3 days, 400 beyond retention, the arch class scanned 90
    records with a retention of 1095 days, 0 beyond retention
  - 'hold status by class: the slow class is not on hold, the fast class is on hold, the arch class is not on hold, that is 1 class on hold'
  output_spec:
    classes_purged: int
    classes_held: int
    records_deleted: int
    classes_total: int
contract:
  classes_purged:
    formula: 3 - H
    literals:
    - name: H
      regex: that is (\d+) class(?:es)? on hold
      value: 1
  records_deleted:
    formula: ((1-h1)*b1)+((1-h2)*b2)+((1-h3)*b3)
    literals:
    - name: b1
      regex: the slow class scanned \d+ records with a retention of \d+ days, (\d+) beyond retention
      value: 154
    - name: h1
      regex: the slow class is (on hold|not on hold)
      value: 0
      map:
        on hold: 1
        not on hold: 0
    - name: b2
      regex: the fast class scanned \d+ records with a retention of \d+ days, (\d+) beyond retention
      value: 400
    - name: h2
      regex: the fast class is (on hold|not on hold)
      value: 1
      map:
        on hold: 1
        not on hold: 0
    - name: b3
      regex: the arch class scanned \d+ records with a retention of \d+ days, (\d+) beyond retention
      value: 0
    - name: h3
      regex: the arch class is (on hold|not on hold)
      value: 0
      map:
        on hold: 1
        not on hold: 0
v6:
  entities:
  - id: cp
    question: classes purged tonight (total minus held)
    answer: 2
  - id: ch
    question: classes under legal hold (skipped entirely)
    answer: 1
  - id: rd
    question: records deleted tonight (sum of beyond-retention records in purged classes)
    answer: 154
  - id: ct
    question: total classes in the sweep
    answer: 3
  aggregate: '{''classes_purged'': int(a(''cp'')), ''classes_held'': int(a(''ch'')), ''records_deleted'': int(a(''rd'')), ''classes_total'': int(a(''ct''))}'
