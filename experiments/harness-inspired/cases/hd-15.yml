objective: derive seats_open, wave1_promoted, wave2_promoted, unpromoted from the stated rules
prompt: 'the tiering station closes its ledger at 03:00 and everyone here treats that closing as gospel, the counts below are tonight''s, the rules below are forever.


  the cascade board promotes in waves because the front desk cannot process a stampede, the wave cap is a queue dressed as a courtesy, and the arithmetic beneath it is just floors and remainders stacked carefully


  standby order is priority order, the board never says whose priority, the board only counts, names are for the front desk and lawsuits


  the desk computes open seats once, then waves against the remainder, recomputing open seats between waves is how double-booked scalpels happen


  the rules of the desk, as they stand tonight: 1. no-shows free their seats, open seats are capacity minus attendees, attendees are confirmed minus no-shows, the floor is zero, negative seats are an accounting crime. 2. each promotion wave moves at most the wave cap and at most the standby depth, wave one moves first, wave two inherits the remainder of both, a wave fills at-or-over its cap before the
  next wave considers moving. 3. unpromoted is standby depth minus everyone promoted across both waves, reported even at zero.


  the facts of record: the clinic session seats 12 with 12 confirmed and 3 no-shows the standby list holds 3 patients and the wave cap is 2 promotions per wave the board quotes no open-seat count tonight, the desk derives it from no-shows first.


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


