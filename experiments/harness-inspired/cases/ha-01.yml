case_id: ha-01
category: harness-ops
difficulty: light
hops: 3
archetype: skip-if-won
provenance: resume chain; A won depth0, B won depth1, C won depth2 -> 0 stages each on resume; D unwon
  -> re-runs all 3 stages; 0+0+0+3 = 3
prompt: 'You run a test suite with a skip-if-won cache: any case that already has a

  passing check stored NEVER re-runs its stages. Each case has up to 3 stages:

  solve, fix1, fix2. Run history from last night: case A passed at solve.

  Case B failed solve, passed fix1. Case C failed solve and fix1, passed fix2.

  Case D failed all three stages. The morning resume run re-executes stages

  only for cases with no stored pass, and for those it re-runs the full chain

  from solve. A nightly log compactor you do not manage also trims old trace

  files, which has no effect on stage counts. How many stages does the resume

  run execute in total? Output ONLY this JSON with exactly these keys:

  {"stages_rerun": N}.'
objective: Compute resume workload under skip-if-won caching.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"stages_rerun": 3}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: case_A, question: "stages the MORNING RESUME run executes for case A — A has a stored pass from solve, and a stored pass means stages NEVER re-run", answer: 0}
    - {id: case_B, question: "stages the MORNING RESUME run executes for case B — B has a stored pass from fix1, and a stored pass means stages NEVER re-run", answer: 0}
    - {id: case_C, question: "stages the MORNING RESUME run executes for case C — C has a stored pass from fix2, and a stored pass means stages NEVER re-run", answer: 0}
    - {id: case_D, question: "stages the MORNING RESUME run executes for case D — D never passed, so the full chain from solve re-runs", answer: 3}
  aggregate: '{"stages_rerun": sum(a(e) for e in entities)}'
