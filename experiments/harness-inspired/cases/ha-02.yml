case_id: ha-02
category: harness-ops
difficulty: light
hops: 3
archetype: det-first-judge-gating
provenance: judge gating; 3 det-pass judged + 1 fix-then-pass judged = 4; 1 still-failing never judged;
  3+1 = 4 judged, 5-4 = 1 never judged
prompt: 'You operate a two-lane quality gate. Rule: the LLM judge only ever sees an

  artifact AFTER it passes the deterministic check lane; artifacts failing

  deterministically never reach the judge. A failing artifact gets exactly one

  fix attempt and one deterministic re-check; if it then passes, it does reach

  the judge. Tonight 5 artifacts ran: 3 passed the deterministic check on the

  first pass. Of the 2 that failed, one passed its re-check after the fix and

  one still failed. A metrics dashboard you do not manage also polls the judge

  endpoint but its calls are not real evaluations. How many artifacts did the

  judge actually evaluate, and how many artifacts never got judged? Output

  ONLY this JSON with exactly these keys: {"judged": N, "never_judged": N}.'
objective: Count judge invocations under deterministic-first gating.
auxiliary: All facts needed are in the prompt itself.
success_criteria:
  deterministic_checks:
    json_exact: '{"judged": 4, "never_judged": 1}'
    forbidden_phrases:
    - I cannot
    - sorry

v6:
  entities:
    - {id: det_first_pass, question: "artifacts judged from first-pass det", answer: 3}
    - {id: det_fail_fixed, question: "artifacts judged after fix re-check", answer: 1}
    - {id: det_fail_still, question: "artifacts never judged", answer: 1}
  aggregate: '{"judged": a(det_first_pass) + a(det_fail_fixed), "never_judged": a(det_fail_still)}'
