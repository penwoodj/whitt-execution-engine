  entities:
  - id: u1
    question: 'gigabytes u1 stands at (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 55
  - id: u2
    question: 'gigabytes u2 stands at (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 48
  - id: u3
