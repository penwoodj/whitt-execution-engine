success_criteria:
  deterministic_checks:
    json_exact: '{"warned": 3, "locked": 1, "grace_expired_users": 3, "at_quota_exactly": 1}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - usage at or above quota is over quota for warning purposes, exactly-at counts as over
  - users over quota enter a grace window, grace expired means locked until they clear space
  - the quota line is per user, pooled storage is a different desk
  facts:
  - u1 stands at 55 gigabytes against a 50 gigabyte quota, u2 stands at 48 gigabytes against a 50 gigabyte quota, u3 stands at 61 gigabytes against a 50 gigabyte quota, u4 stands at 50 gigabytes against
    a 50 gigabyte quota
  - the grace window is 7 days and 3 over-quota users have let it lapse
  output_spec:
    warned: int
    locked: int
    grace_expired_users: int
    at_quota_exactly: int
contract:
  warned:
    formula: (u1>=q1)+(u2>=q2)+(u3>=q3)+(u4>=q4)
    literals:
    - name: u1
      regex: u1 stands at (\d+) gigabytes
      value: 55
    - name: q1
      regex: u1 stands at \d+ gigabytes against a (\d+) gigabyte quota
      value: 50
    - name: u2
      regex: u2 stands at (\d+) gigabytes
      value: 48
    - name: q2
      regex: u2 stands at \d+ gigabytes against a (\d+) gigabyte quota
      value: 50
    - name: u3
      regex: u3 stands at (\d+) gigabytes
      value: 61
    - name: q3
      regex: u3 stands at \d+ gigabytes against a (\d+) gigabyte quota
      value: 50
    - name: u4
      regex: u4 stands at (\d+) gigabytes
      value: 50
    - name: q4
      regex: u4 stands at \d+ gigabytes against a (\d+) gigabyte quota
      value: 50
  at_quota_exactly:
    formula: (u1==q1)+(u2==q2)+(u3==q3)+(u4==q4)
    literals: []
