    answer: 50
  - id: q1
    question: 'u1''s quota in gigabytes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 50
  - id: q2
    question: 'u2''s quota in gigabytes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 50
  - id: q3
