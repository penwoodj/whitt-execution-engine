    question: 'over-quota users whose grace has lapsed (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3
  aggregate: '{''warned'': (a(''u1'')>=a(''q1''))+(a(''u2'')>=a(''q2''))+(a(''u3'')>=a(''q3''))+(a(''u4'')>=a(''q4'')), ''locked'': 1 if a(''ge'') else 0, ''grace_expired_users'': int(a(''ge'')), ''at_quota_exactly'':
