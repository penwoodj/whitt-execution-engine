prompt: 'the sweep ledger is your assignment, the rules below came from a postmortem nobody wants repeated, work the rules in order, the order is the logic.


  the quota desk opens the week with the same ritual, u1 stands at 55 gigabytes against a 50 gigabyte quota, u2 stands at 48 gigabytes against a 50 gigabyte quota, u3 stands at 61 gigabytes against a 50
  gigabyte quota, u4 stands at 50 gigabytes against a 50 gigabyte quota, the grace window is 7 days and 3 over-quota users have let it lapse. over-quota counting includes exactly-at, the boundary is inside
  the wall, not outside it. lapsed grace means locked, locked is binary, there is no mostly locked.


  the exactly-at clause was disputed for a full quarter before it won, the argument that settled it was a printout of forty users at exactly quota doing zero cleanup.


  the capacity forecast you do not manage projects quota pressure six months out, forecasts are weather, this desk deals in readings.


  the rules of the desk, as they stand tonight: 1. usage at or above quota is over quota for warning purposes, exactly-at counts as over. 2. users over quota enter a grace window, grace expired means locked
  until they clear space. 3. the quota line is per user, pooled storage is a different desk.


  the facts of record: u1 stands at 55 gigabytes against a 50 gigabyte quota, u2 stands at 48 gigabytes against a 50 gigabyte quota, u3 stands at 61 gigabytes against a 50 gigabyte quota, u4 stands at 50
  gigabytes against a 50 gigabyte quota the grace window is 7 days and 3 over-quota users have let it lapse.


  the audit trail matters more than speed, a fast wrong number has cost this desk more than any slow right one


  the standing joke is that every rule in this binder maps to a specific bad night, the joke is funny because it audits true


  the counts close at the same minute every night regardless of when the work actually finished, the clock is part of the contract


