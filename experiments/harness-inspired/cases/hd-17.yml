  the tech ceiling only bites when the tech need stands at-or-over the tech room''s size, otherwise the merge is honest and the whole pool is bookable


  the desk computes the pool, the ceiling, the overflow, in that order, and never lets a nice round pool number seduce it past the rig


  the rules of the desk, as they stand tonight: 1. merged rooms pool total seats, but sessions needing the tech rig can only use seats in the tech room, a session pins its ceiling at-or-over the tech room size only when its tech need exceeds what the tech room holds. 2. bookable is the ceiling after the tech rule applies, overflow is demand minus bookable, floored at zero. 3. the report wants pooled
  seats, bookable seats, and overflow, in whole seats.


