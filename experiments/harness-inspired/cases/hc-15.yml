provenance: 'renewed=2 expiring_soon=1 stable=1 line=30

  archetype=cert_renewal variant=0 seed=14'
success_criteria:
  deterministic_checks:
    json_exact: '{"renewed": 2, "expiring_soon": 1, "stable": 1, "renew_window": 30}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - any certificate with less than 30 days of validity left renews tonight, no exceptions, no appeals
  - certificates with 30 or more but under 90 days are flagged expiring-soon, flagged is not renewed
  - renewal stagger is automatic, count renewals, do not schedule them
  facts:
  - api-cert has 12 days left, ingress has 45 days left, internal-ca has 200 days left, legacy-smtp has 8 days left
  output_spec:
    renewed: int
    expiring_soon: int
    stable: int
    renew_window: int
contract:
  renewed:
    formula: (d1<M)+(d2<M)+(d3<M)+(d4<M)
    literals:
    - name: d1
      regex: api-cert has (\d+) days left
      value: 12
    - name: d2
      regex: ingress has (\d+) days left
      value: 45
    - name: d3
      regex: internal-ca has (\d+) days left
      value: 200
    - name: d4
      regex: legacy-smtp has (\d+) days left
      value: 8
    - name: M
      regex: less than (\d+) days of validity
      value: 30
  expiring_soon:
    formula: (d1>=M and d1<3*M)+(d2>=M and d2<3*M)+(d3>=M and d3<3*M)+(d4>=M and d4<3*M)
    literals: []
  stable:
    formula: 4 - renewed - expiring_soon
    literals: []
v6:
  entities:
  - id: d1
    question: 'days left on api-cert (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 12
  - id: d2
    question: 'days left on ingress (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 45
  - id: d3
    question: 'days left on internal-ca (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 200
  - id: d4
    question: 'days left on legacy-smtp (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 8
  - id: rw
    question: 'the renew line in days (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 30
  aggregate: '{''renewed'': (a(''d1'')<a(''rw''))+(a(''d2'')<a(''rw''))+(a(''d3'')<a(''rw''))+(a(''d4'')<a(''rw'')), ''expiring_soon'': (a(''d1'')>=a(''rw''))*(a(''d1'')<3*a(''rw''))+(a(''d2'')>=a(''rw''))*(a(''d2'')<3*a(''rw''))+(a(''d3'')>=a(''rw''))*(a(''d3'')<3*a(''rw''))+(a(''d4'')>=a(''rw''))*(a(''d4'')<3*a(''rw'')),
    ''stable'': (a(''d1'')>=3*a(''rw''))+(a(''d2'')>=3*a(''rw''))+(a(''d3'')>=3*a(''rw''))+(a(''d4'')>=3*a(''rw'')), ''renew_window'': int(a(''rw''))}'
