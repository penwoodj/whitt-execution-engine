success_criteria:
  deterministic_checks:
    json_exact: '{"volumes_over": 2, "total_mib": 16384, "overage_mib": 1024}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - a volume is over quota when its usage in whole MiB is at-or-over its quota, usage is recorded in GiB and converted at 1024 MiB per GiB exactly, no decimal shortcuts
  - overage for a volume is its usage in MiB minus its quota in MiB, floored at zero, overage never goes negative
  - the report wants the over-quota volume count, total usage in whole MiB, and total overage in whole MiB
  facts:
  - crate-x holds 5 GiB against a 5120 MiB quota, crate-y holds 2 GiB against a 3072 MiB quota, crate-z holds 9 GiB against a 8192 MiB quota
  - conversion is fixed tonight at 1024 MiB per GiB, whole MiB only
  - the desk converts before comparing and sums only after every volume is converted
  output_spec:
    volumes_over: int
    total_mib: int
    overage_mib: int
contract:
  volumes_over:
    formula: ((g1 * 1024) >= q1) + ((g2 * 1024) >= q2) + ((g3 * 1024) >= q3)
    literals:
    - name: g1
      regex: crate-x holds (\d+) GiB
      value: 5
    - name: g2
      regex: crate-y holds (\d+) GiB
      value: 2
    - name: g3
      regex: crate-z holds (\d+) GiB
      value: 9
    - name: q1
      regex: crate-x holds \d+ GiB against a (\d+) MiB quota
      value: 5120
    - name: q2
      regex: crate-y holds \d+ GiB against a (\d+) MiB quota
      value: 3072
    - name: q3
      regex: crate-z holds \d+ GiB against a (\d+) MiB quota
      value: 8192
  total_mib:
    formula: (g1 * 1024) + (g2 * 1024) + (g3 * 1024)
    literals:
    - name: g1
      regex: crate-x holds (\d+) GiB
      value: 5
    - name: g2
      regex: crate-y holds (\d+) GiB
      value: 2
    - name: g3
      regex: crate-z holds (\d+) GiB
      value: 9
  overage_mib:
    formula: max(0, (g1 * 1024) - q1) + max(0, (g2 * 1024) - q2) + max(0, (g3 * 1024) - q3)
    literals:
    - name: q1
      regex: crate-x holds \d+ GiB against a (\d+) MiB quota
      value: 5120
    - name: q2
      regex: crate-y holds \d+ GiB against a (\d+) MiB quota
      value: 3072
    - name: q3
      regex: crate-z holds \d+ GiB against a (\d+) MiB quota
      value: 8192
v6:
  entities:
  - id: g1
    question: crate-x's usage in whole GiB (copy the number from its fact line)
    answer: 5
  - id: g2
    question: crate-y's usage in whole GiB (copy the number from its fact line)
    answer: 2
  - id: g3
    question: crate-z's usage in whole GiB (copy the number from its fact line)
    answer: 9
  - id: q1
    question: crate-x's quota in whole MiB (copy the number from its fact line)
    answer: 5120
  - id: q2
    question: crate-y's quota in whole MiB (copy the number from its fact line)
    answer: 3072
  - id: q3
    question: crate-z's quota in whole MiB (copy the number from its fact line)
    answer: 8192
  - id: m1
    question: crate-x's usage converted to whole MiB (convert its GiB at 1024)
    answer: 5120
  - id: m2
    question: crate-y's usage converted to whole MiB (convert its GiB at 1024)
    answer: 2048
  - id: m3
    question: crate-z's usage converted to whole MiB (convert its GiB at 1024)
    answer: 9216
  - id: over
    question: how many volumes are over quota under tonight's boundary word (count them)
    answer: 2
  - id: ovg
    question: total overage across all volumes in whole MiB, zero-floored per volume
    answer: 1024
  aggregate: '{''volumes_over'': (a(''m1'') >= a(''q1'')) + (a(''m2'') >= a(''q2'')) + (a(''m3'') >= a(''q3'')), ''total_mib'': a(''m1'') + a(''m2'') + a(''m3''), ''overage_mib'': max(0, a(''m1'') - a(''q1'')) + max(0, a(''m2'') - a(''q2'')) + max(0, a(''m3'') - a(''q3''))}'
