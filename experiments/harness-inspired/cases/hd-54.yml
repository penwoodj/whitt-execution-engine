prompt: 'when the audit team visits the code bench they leave within the hour, the night desk''s margins scare them off, and the tally lamp is on, which means somebody''s numbers are about to be wrong.


  the vault ledger quotes volumes in GiB and quotas in MiB on purpose, the conversion is where lazy nights go to die, 1024 and never 1000, the desk has a scar about this


  quota breaches read at-or-over the quota line tonight, and the distinction only matters for volumes parked exactly on the line, which happens more than anyone expects


  the desk converts first, compares second, sums last, converting and comparing in the same breath is how volumes end up over- or under-counted by a whole gigabyte


  the rules of the desk, as they stand tonight: 1. a volume is over quota when its usage in whole MiB is at-or-over its quota, usage is recorded in GiB and converted at 1024 MiB per GiB exactly, no decimal shortcuts. 2. overage for a volume is its usage in MiB minus its quota in MiB, floored at zero, overage never goes negative. 3. the report wants the over-quota volume count, total usage in whole MiB,
  and total overage in whole MiB.


  the facts of record: crate-x holds 5 GiB against a 5120 MiB quota, crate-y holds 2 GiB against a 3072 MiB quota, crate-z holds 9 GiB against a 8192 MiB quota conversion is fixed tonight at 1024 MiB per GiB, whole MiB only the desk converts before comparing and sums only after every volume is converted.


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


  there are no participation trophies on this wall, just a running tally of nights the boundaries held, the tally is the trophy


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


