prompt: 'the per-diem booth has opinions, the settlement desk has the binder, the binder wins every argument, the counts below are tonight''s, the rules below are forever.


  the replay desk watches the same messages limp past night after night at declining rates, the decay is honest work being done by tired machinery, and the arithmetic is just the ledger of that tiredness


  the rate floor at zero matters on long decay ladders, a rate that steps below zero delivers nothing and pretends nothing, the desk does not deal in negative enthusiasm


  dead messages are counted, named, and mourned briefly, the count is the deliverable, the mourning is informal


  the rules of the desk, as they stand tonight: 1. each retry attempt delivers at a decayed rate, attempt k''s rate is the base rate minus k times the decay, floored at zero percent, delivery is batch times rate floor-divided by 100, whole messages. 2. a message leaves the replay lane only strictly past three attempts and every departure after that is final. 3. dead is batch minus everything delivered
  across all attempts, dead is reported without apology.


  the facts of record: the replay lane holds 300 messages with base rate 75 percent and decay 25 percent per attempt attempts stop at 3 the lane quotes no attempt rates tonight, each one derives from the base and the decay.


  every rule here was paid for, some in rework, some in apologies, a few in actual money, which is why nobody proposes removing one anymore


  the night the numbers went unmoved for an hour, the desk learned that urgency is a poor substitute for a boundary clause read twice


  somewhere there is a manual for all this, it is out of date in the specific way that matters, the binder is current because the binder is amended by hand the same night the rule changes


