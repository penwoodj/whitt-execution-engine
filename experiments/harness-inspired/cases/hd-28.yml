prompt: 'the triage hop is older than everyone who touches it, the arithmetic it demands is older still, and the nightly ritual starts with reading every rule before touching any number.


  the quorum rail is the oldest rule in this binder and the one most often misread, the strictly-past reading of half the seated board is tonight''s reading, and the abstentions do not help anyone the way newcomers hope they might


  the desk computes quorum first, cast second, majority third, margin last, and refuses to skip ahead even when the room is impatient, especially when the room is impatient


  recusals are not abstentions, abstentions are not absences, the vocabulary is load-bearing and the binder says so in underlined ink


  the rules of the desk, as they stand tonight: 1. quorum needs present members strictly past half the seated board, present means seated and in the room, abstain and recuse still count as present for quorum only. 2. abstentions and recusals reduce the votes cast, votes cast is present minus abstain minus recuse, never negative. 3. a motion carries with a majority of votes cast, majority of cast is
  cast divided by two plus one, the margin is yes votes minus that number.


  the facts of record: the board seats 9 members 5 members are present in the room tonight 1 members abstain and 0 members recuse 2 members vote yes.


  the margin notes in the binder argue with each other in three different hands, the rules themselves have never once argued back


  trainees arrive full of shortcuts, the desk is patient, the desk simply reruns every shortcut through the rules until the shortcut retires itself


  when the counts disagree with a summary, the counts win, when the counts disagree with each other, someone skipped a clause, that someone gets named in the closing note


  the desk keeps one drawer of pencils graded by trust level, the unsharpened ones are for drafts, the drafts never survive contact with the rules anyway


