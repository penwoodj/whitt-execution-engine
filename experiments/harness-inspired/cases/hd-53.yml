prompt: 'the triage hop prints a receipt for everything, the intake desk reads approximately half of them, the rules cover the rest, so the desk works the problem the slow way, on purpose.


  the quorum rail is the oldest rule in this binder and the one most often misread, the at-or-over reading of half the seated board is tonight''s reading, and the abstentions do not help anyone the way newcomers hope they might


  the desk computes quorum first, cast second, majority third, margin last, and refuses to skip ahead even when the room is impatient, especially when the room is impatient


  recusals are not abstentions, abstentions are not absences, the vocabulary is load-bearing and the binder says so in underlined ink


  the rules of the desk, as they stand tonight: 1. quorum needs present members at-or-over half the seated board, present means seated and in the room, abstain and recuse still count as present for quorum only. 2. abstentions and recusals reduce the votes cast, votes cast is present minus abstain minus recuse, never negative. 3. a motion carries with a majority of votes cast, majority of cast is cast
  divided by two plus one, the margin is yes votes minus that number.


  the facts of record: the board seats 15 members 8 members are present in the room tonight 0 members abstain and 1 members recuse 4 members vote yes.


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


