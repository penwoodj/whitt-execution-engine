case_id: hi-list-01
category: list
archetype: transformation
difficulty: easy
prompt: |-
  Convert these comma-separated items into a YAML list:
  apple, banana, cherry, date, elderberry
  Output ONLY the YAML list, nothing else.
auxiliary: All items provided in the prompt.
objective: Produce a valid YAML list with 5 items.
success_criteria:
  deterministic_checks:
    yaml_valid: true
    contains_required:
      - '- apple'
      - '- elderberry'
    max_lines: 10
    forbidden_phrases:
      - "I cannot"
      - "sorry"
      - '```'
  format_fixes:
    strip_markdown_fences: true
    force_yaml_document: true
    ensure_trailing_newline: true
