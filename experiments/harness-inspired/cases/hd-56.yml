  the payout itself is boring, the smaller of two numbers, the interesting part is what the flag implies for next quarter''s advance, which is why the flag word gets read carefully


  clawback accounting only ever touches flagged claims, unflagged claims contribute nothing to the claw total, not even their rounding dust


  the rules of the desk, as they stand tonight: 1. per-diem cap is the nightly rate times nights, a claim flags at-or-over its cap, flagging is about the claim, not the payout. 2. reimbursement pays the smaller of submitted and cap, whole cents, never negative, never rounded. 3. clawed back is the part of flagged claims above their caps, summed across flagged travelers only.


