prompt: 'the binder for the tiering station lives under the counts desk, chained there by tradition and one actual chain, so the desk works the problem the slow way, on purpose.


  the cascade board promotes in waves because the front desk cannot process a stampede, the wave cap is a queue dressed as a courtesy, and the arithmetic beneath it is just floors and remainders stacked carefully


  standby order is priority order, the board never says whose priority, the board only counts, names are for the front desk and lawsuits


  the desk computes open seats once, then waves against the remainder, recomputing open seats between waves is how double-booked scalpels happen


  the rules of the desk, as they stand tonight: 1. no-shows free their seats, open seats are capacity minus attendees, attendees are confirmed minus no-shows, the floor is zero, negative seats are an accounting crime. 2. each promotion wave moves at most the wave cap and at most the standby depth, wave one moves first, wave two inherits the remainder of both, a wave fills at-or-over its cap before the
  next wave considers moving. 3. unpromoted is standby depth minus everyone promoted across both waves, reported even at zero.


  the facts of record: the clinic session seats 15 with 14 confirmed and 4 no-shows the standby list holds 4 patients and the wave cap is 3 promotions per wave the board quotes no open-seat count tonight, the desk derives it from no-shows first.


  there is a brass plaque on this desk that reads a count is right or it is tomorrow, nobody remembers installing the plaque, everybody obeys it


  the clock on the wall runs two minutes fast on purpose, the counts close on the ledger time, the wall clock is a social creature, the ledger is not


  the desk has survived four reorgs by being the only thing in the building that can reproduce last tuesday, reproducibility is a lifestyle here


