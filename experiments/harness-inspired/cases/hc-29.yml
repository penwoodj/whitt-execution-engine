provenance: 'budget_burned=89 budget_left=-49 longest_wait=12

  archetype=backoff_budget variant=1 seed=28'
success_criteria:
  deterministic_checks:
    json_exact: '{"budget_burned": 89, "budget_left": -49, "jobs_count": 2, "longest_wait": 12}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - each retry waits double the previous wait, starting at 3 minutes, no single wait exceeds the 12 minute cap
  - the shared retry budget is 40 minutes across all jobs, it is a ledger line, work already started always finishes, overruns show up as negative headroom in the report
  - a job that exhausts its declared failures stops, it does not borrow budget from tomorrow
  facts:
  - ingest failed 5 times with each run taking 3 minutes, render failed 2 times with each run taking 10 minutes
  output_spec:
    budget_burned: int
    budget_left: int
    jobs_count: int
    longest_wait: int
contract:
  budget_burned:
    formula: (min(1*BASE,CAP)*(0<F1))+(min(2*BASE,CAP)*(1<F1))+(min(4*BASE,CAP)*(2<F1))+(min(8*BASE,CAP)*(3<F1))+(min(16*BASE,CAP)*(4<F1))+(min(32*BASE,CAP)*(5<F1))+F1*D1+(min(1*BASE,CAP)*(0<F2))+(min(2*BASE,CAP)*(1<F2))+(min(4*BASE,CAP)*(2<F2))+(min(8*BASE,CAP)*(3<F2))+(min(16*BASE,CAP)*(4<F2))+(min(32*BASE,CAP)*(5<F2))+F2*D2
    literals:
    - name: BASE
      regex: starting at (\d+) minutes
      value: 3
    - name: CAP
      regex: exceeds the (\d+) minute cap
      value: 12
    - name: F1
      regex: ingest failed (\d+) times
      value: 5
    - name: D1
      regex: ingest failed \d+ times with each run taking (\d+) minutes
      value: 3
    - name: F2
      regex: render failed (\d+) times
      value: 2
    - name: D2
      regex: render failed \d+ times with each run taking (\d+) minutes
      value: 10
  budget_left:
    formula: T - budget_burned
    literals:
    - name: T
      regex: shared retry budget is (\d+) minutes
      value: 40
  jobs_count:
    formula: '2'
    literals: []
  longest_wait:
    formula: max(min(2**(F1-1)*BASE,CAP),min(2**(F2-1)*BASE,CAP))
    literals:
    - name: BASE
      regex: starting at (\d+) minutes
      value: 3
    - name: CAP
      regex: exceeds the (\d+) minute cap
      value: 12
    - name: F1
      regex: ingest failed (\d+) times
      value: 5
    - name: D1
      regex: ingest failed \d+ times with each run taking (\d+) minutes
      value: 3
    - name: F2
      regex: render failed (\d+) times
      value: 2
    - name: D2
      regex: render failed \d+ times with each run taking (\d+) minutes
      value: 10
v6:
  entities:
  - id: bs
    question: 'the starting wait in minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3
  - id: cp
    question: 'the wait cap in minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 12
  - id: bt
    question: 'the shared retry budget in minutes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 40
  - id: f1
    question: 'times ingest failed (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 5
  - id: f2
    question: 'times render failed (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 2
  - id: du1
    question: 'minutes each ingest run takes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 3
  - id: du2
    question: 'minutes each render run takes (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation.'
    answer: 10
  aggregate: '{''budget_burned'': (min(1*a(''bs''),a(''cp''))*(0<a(''f1'')))+(min(2*a(''bs''),a(''cp''))*(1<a(''f1'')))+(min(4*a(''bs''),a(''cp''))*(2<a(''f1'')))+(min(8*a(''bs''),a(''cp''))*(3<a(''f1'')))+(min(16*a(''bs''),a(''cp''))*(4<a(''f1'')))+(min(32*a(''bs''),a(''cp''))*(5<a(''f1'')))+a(''f1'')*a(''du1'')+(min(1*a(''bs''),a(''cp''))*(0<a(''f2'')))+(min(2*a(''bs''),a(''cp''))*(1<a(''f2'')))+(min(4*a(''bs''),a(''cp''))*(2<a(''f2'')))+(min(8*a(''bs''),a(''cp''))*(3<a(''f2'')))+(min(16*a(''bs''),a(''cp''))*(4<a(''f2'')))+(min(32*a(''bs''),a(''cp''))*(5<a(''f2'')))+a(''f2'')*a(''du2''),
    ''budget_left'': a(''bt'')-((min(1*a(''bs''),a(''cp''))*(0<a(''f1'')))+(min(2*a(''bs''),a(''cp''))*(1<a(''f1'')))+(min(4*a(''bs''),a(''cp''))*(2<a(''f1'')))+(min(8*a(''bs''),a(''cp''))*(3<a(''f1'')))+(min(16*a(''bs''),a(''cp''))*(4<a(''f1'')))+(min(32*a(''bs''),a(''cp''))*(5<a(''f1'')))+a(''f1'')*a(''du1'')+(min(1*a(''bs''),a(''cp''))*(0<a(''f2'')))+(min(2*a(''bs''),a(''cp''))*(1<a(''f2'')))+(min(4*a(''bs''),a(''cp''))*(2<a(''f2'')))+(min(8*a(''bs''),a(''cp''))*(3<a(''f2'')))+(min(16*a(''bs''),a(''cp''))*(4<a(''f2'')))+(min(32*a(''bs''),a(''cp''))*(5<a(''f2'')))+a(''f2'')*a(''du2'')),
    ''jobs_count'': 2, ''longest_wait'': max(min(2**(a(''f1'')-1)*a(''bs''),a(''cp'')),min(2**(a(''f2'')-1)*a(''bs''),a(''cp'')))}'
