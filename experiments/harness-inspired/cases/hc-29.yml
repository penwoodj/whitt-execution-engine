prompt: 'your watch over the deploy lane starts now, the rules stack on top of each other, work them in order, a thing only counts once, no matter how many lists it appears on.


  the retry engine burned through the evening, ingest failed 5 times with each run taking 3 minutes, render failed 2 times with each run taking 10 minutes. waits double from 3 minutes and cap at 12, run
  time counts the same as wait time, the budget ledger does not care which kind of minute it was.


  the doubling rule predates the cap, the cap predates the shared budget, all three exist because of three different bad nights. stack them in order, double first, cap second, sum third.


  the failure inbox you do not manage also queues complaint emails per failure, the inbox is loud, the inbox is not the budget.


  the rules of the desk, as they stand tonight: 1. each retry waits double the previous wait, starting at 3 minutes, no single wait exceeds the 12 minute cap. 2. the shared retry budget is 40 minutes across
  all jobs, it is a ledger line, work already started always finishes, overruns show up as negative headroom in the report. 3. a job that exhausts its declared failures stops, it does not borrow budget
  from tomorrow.


  the facts of record: ingest failed 5 times with each run taking 3 minutes, render failed 2 times with each run taking 10 minutes.


