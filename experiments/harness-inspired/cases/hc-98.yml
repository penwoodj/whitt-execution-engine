domain: library hold shelves
objective: derive active_holds, expired_released, renewals_used, picked_up from the stated rules
prompt: 'the day crew handed you the quota desk with a shrug, the runbook is thinner than they admit, these rules bind, exactly-once means exactly-once, no charity.


  the hold shelf audit runs weekly, 60 holds sat on the shelf this week, 15 expired and released, 22 renewals were used, 28 items were picked up. expired releases leave the active count first, renewals
  and pickups describe the survivors, the active number is holds minus released and nothing subtler.


  release-is-final was not always the rule, the grace week doubled the shelf and halved the pickups, final means final since.


  the catalog kiosk you do not manage displays holds in transit separately, in-transit items are not on this shelf and never were.


  the rules of the desk, as they stand tonight: 1. holds expire after seven days on the shelf, expired holds release the item back to circulation, release is final. 2. patrons may renew a hold up to 3 times,
  renewals reset nothing else. 3. pickup removes the hold entirely, picked-up items leave the ledger.


  the facts of record: 60 holds sat on the shelf this week 15 expired and released 22 renewals were used 28 items were picked up.


  old-timers here say the counts are the easy part and the boundaries are the career, they are right more often than the confident ones


  nothing in this desk''s output survives on vibes, every figure traces to a clause, every clause traces to a night someone remembers


  the binder''s margins carry annotations from people who left, the annotations argue with each other, the rules themselves do not


