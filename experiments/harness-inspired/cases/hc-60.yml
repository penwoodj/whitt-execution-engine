  archetype=token_bucket variant=2 seed=59'
success_criteria:
  deterministic_checks:
    json_exact: '{"served": 22, "throttled": 16, "capacity": 47, "refill_added": 2}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - all slots pool into one serving pool, there is no per-slot fairness, the pool serves in arrival order
  - the refill adds 2 tokens once at the top of the window, mid-window refills do not exist
  - throttled requests are rejected, not queued, rejected means gone
  facts:
  - slot g opened with 5 tokens of its 10 capacity, slot h opened with 12 tokens of its 25 capacity, slot i opened with 3 tokens of its 12 capacity
  - the window refill added 2 tokens
  - 38 requests arrived this window
  output_spec:
    served: int
    throttled: int
    capacity: int
    refill_added: int
contract:
  served:
    formula: min(REQ, s1+s2+s3+REF)
    literals:
    - name: REQ
      regex: (\d+) requests arrived this window
      value: 38
    - name: REF
      regex: refill added (\d+) tokens
      value: 2
    - name: s1
      regex: slot g opened with (\d+) tokens
      value: 5
    - name: s2
      regex: slot h opened with (\d+) tokens
      value: 12
    - name: s3
      regex: slot i opened with (\d+) tokens
      value: 3
    - name: c1
      regex: slot g opened with \d+ tokens of its (\d+) capacity
      value: 10
    - name: c2
      regex: slot h opened with \d+ tokens of its (\d+) capacity
      value: 25
    - name: c3
      regex: slot i opened with \d+ tokens of its (\d+) capacity
      value: 12
  throttled:
    formula: REQ - served
    literals: []
  capacity:
    formula: c1+c2+c3
    literals: []
v6:
  entities:
  - id: sv
    question: requests served this window
    answer: 22
  - id: th
    question: requests throttled (rejected, not queued)
    answer: 16
  - id: cap
    question: total pool capacity (slot capacities summed)
    answer: 47
  - id: rf
    question: tokens the window refill added
    answer: 2
  aggregate: '{''served'': int(a(''sv'')), ''throttled'': int(a(''th'')), ''capacity'': int(a(''cap'')), ''refill_added'': int(a(''rf''))}'
