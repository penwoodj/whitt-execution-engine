prompt: 'you own the night shift tonight, the sweep ledger is yours until handoff, nobody else will touch it, boundaries are inclusive unless a rule says otherwise, and these rules say otherwise where it
  matters.


  the rate gate runs one pool, slot g opened with 5 tokens of its 10 capacity, slot h opened with 12 tokens of its 25 capacity, slot i opened with 3 tokens of its 12 capacity, the window refill added 2
  tokens, 38 requests arrived this window. pool everything, add the refill once, serve until dry, everything left over is throttled and gone. capacity is bookkeeping, it bounds nothing tonight except the
  morning report.


  pooling replaced per-slot fairness after a night where one hot slot starved two quiet ones, the pool does not care who brought the tokens.


  the edge cache you do not manage also serves some requests before they reach the gate, edge-served requests never appear in the arrival count and never will.


  the rules of the desk, as they stand tonight: 1. all slots pool into one serving pool, there is no per-slot fairness, the pool serves in arrival order. 2. the refill adds 2 tokens once at the top of the
  window, mid-window refills do not exist. 3. throttled requests are rejected, not queued, rejected means gone.


  the facts of record: slot g opened with 5 tokens of its 10 capacity, slot h opened with 12 tokens of its 25 capacity, slot i opened with 3 tokens of its 12 capacity the window refill added 2 tokens 38
  requests arrived this window.


