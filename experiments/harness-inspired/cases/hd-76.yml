task_core:
  rules:
  - a desk counts as a full month only when strictly past 30 active days, partial months prorate as whole cents rounded up, ceil, never round down
  - proration for a desk is its active days times its monthly rate, divided by 30, rounded up to a whole cent per desk
  - the report needs the full-month desk count, the largest single desk charge, and the total proration in whole cents
  facts:
  - quay-7 ran 9 active days at 6000 whole cents per 30 days, quay-8 ran 44 active days at 12000 whole cents per 30 days, quay-9 ran 30 active days at 9000 whole cents per 30 days
  - every desk above is billed on the same 30-day convention tonight
  - the per-desk prorated charges work out to quay-7 charges 1800 whole cents quay-8 charges 17600 whole cents quay-9 charges 9000 whole cents when the rule is applied faithfully
  output_spec:
    seats_full_month: int
    largest_seat_charge_cents: int
    total_proration_cents: int
contract:
  seats_full_month:
    formula: (d1 > 30) + (d2 > 30) + (d3 > 30)
    literals:
    - name: d1
      regex: quay-7 ran (\d+) active days
      value: 9
    - name: d2
      regex: quay-8 ran (\d+) active days
      value: 44
    - name: d3
      regex: quay-9 ran (\d+) active days
      value: 30
  largest_seat_charge_cents:
    formula: max(((d1 * r1 + 29) // 30), ((d2 * r2 + 29) // 30), ((d3 * r3 + 29) // 30))
    literals:
    - name: d1
      regex: quay-7 ran (\d+) active days
      value: 9
    - name: d2
      regex: quay-8 ran (\d+) active days
      value: 44
    - name: d3
      regex: quay-9 ran (\d+) active days
      value: 30
    - name: r1
      regex: quay-7 ran \d+ active days at (\d+) whole cents
      value: 6000
    - name: r2
      regex: quay-8 ran \d+ active days at (\d+) whole cents
      value: 12000
    - name: r3
      regex: quay-9 ran \d+ active days at (\d+) whole cents
      value: 9000
  total_proration_cents:
    formula: ((d1 * r1 + 29) // 30) + ((d2 * r2 + 29) // 30) + ((d3 * r3 + 29) // 30)
    literals:
    - name: d1
      regex: quay-7 ran (\d+) active days
      value: 9
    - name: d2
      regex: quay-8 ran (\d+) active days
      value: 44
    - name: d3
      regex: quay-9 ran (\d+) active days
      value: 30
    - name: r1
      regex: quay-7 ran \d+ active days at (\d+) whole cents
      value: 6000
    - name: r2
      regex: quay-8 ran \d+ active days at (\d+) whole cents
      value: 12000
    - name: r3
      regex: quay-9 ran \d+ active days at (\d+) whole cents
      value: 9000
