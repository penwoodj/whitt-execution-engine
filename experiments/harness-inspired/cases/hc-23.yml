auxiliary: all facts needed are in the prompt itself
provenance: 'active=23 expired=7 renewals=12 picked=9

  archetype=hold_shelf variant=0 seed=22'
success_criteria:
  deterministic_checks:
    json_exact: '{"active_holds": 23, "expired_released": 7, "renewals_used": 12, "picked_up": 9}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - holds expire after seven days on the shelf, expired holds release the item back to circulation, release is final
  - patrons may renew a hold up to 1 times, renewals reset nothing else
  - pickup removes the hold entirely, picked-up items leave the ledger
  facts:
  - 30 holds sat on the shelf this week
  - 7 expired and released
  - 12 renewals were used
  - 9 items were picked up
  output_spec:
    active_holds: int
    expired_released: int
    renewals_used: int
    picked_up: int
contract:
  active_holds:
    formula: H - E
    literals:
    - name: H
      regex: (\d+) holds sat on the shelf
      value: 30
    - name: E
      regex: (\d+) expired and released
      value: 7
v6:
  entities:
  - id: ah
    question: 'active holds remaining (holds minus expired). rule: active holds are total holds minus the ones that expired, one subtraction. worked example: 12 holds, 3 expired -> 9 active.'
    answer: 23
  - id: er
    question: 'holds expired and released this week. rule: expired holds released this week, the count as listed. worked example: 3 expired -> 3.'
    answer: 7
  - id: ru
    question: 'renewals used this week. rule: renewals used this week, the count as listed. worked example: 2 renewals -> 2.'
    answer: 12
  - id: pu
    question: 'items picked up this week. rule: items picked up this week, the count as listed. worked example: 4 pickups -> 4.'
    answer: 9
  aggregate: '{''active_holds'': int(a(''ah'')), ''expired_released'': int(a(''er'')), ''renewals_used'': int(a(''ru'')), ''picked_up'': int(a(''pu''))}'
