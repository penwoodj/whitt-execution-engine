domain: library hold shelves
objective: derive active_holds, expired_released, renewals_used, picked_up from the stated rules
prompt: 'you take the seating sheet for the early, read the rules twice, they interact in ways that surprise people, count what landed, not what tried.


  the hold shelf audit runs weekly, 30 holds sat on the shelf this week, 7 expired and released, 12 renewals were used, 9 items were picked up. expired releases leave the active count first, renewals and
  pickups describe the survivors, the active number is holds minus released and nothing subtler.


  release-is-final was not always the rule, the grace week doubled the shelf and halved the pickups, final means final since.


  the catalog kiosk you do not manage displays holds in transit separately, in-transit items are not on this shelf and never were.


  the rules of the desk, as they stand tonight: 1. holds expire after seven days on the shelf, expired holds release the item back to circulation, release is final. 2. patrons may renew a hold up to 1 times,
  renewals reset nothing else. 3. pickup removes the hold entirely, picked-up items leave the ledger.


  the facts of record: 30 holds sat on the shelf this week 7 expired and released 12 renewals were used 9 items were picked up.


