auxiliary: all facts needed are in the prompt itself
provenance: 'rings_passed=2 aborted=True users_exposed=8320 halt_ring=r2

  archetype=rollout_rings variant=2 seed=60'
success_criteria:
  deterministic_checks:
    json_exact: '{"rings_passed": 2, "aborted": true, "users_exposed": 8320, "halt_ring": "r2"}'
    forbidden_phrases:
    - i cannot
    - sorry
    - as an ai
task_core:
  rules:
  - rings promote in order, a ring only enters after the previous ring passes clean
  - a ring with 6 or more fire reports halts the rollout on the spot, halted means halted, no finish and see
  - users exposed counts every user in rings that entered, including the ring that triggered the halt
  facts:
  - r0 covers 20 users and logged 1 fire reports, r1 covers 300 users and logged 5 fire reports, r2 covers 8000 users and logged 8 fire reports
  - the abort threshold is 6 fire reports
  output_spec:
    rings_passed: int
    aborted: bool
    users_exposed: int
    halt_ring: str
contract:
  rings_passed:
    formula: (f1<A)*(1+(f2<A)*(1+(f3<A)))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 6
    - name: f1
      regex: r0 covers \d+ users and logged (\d+) fire reports
      value: 1
    - name: u1
      regex: r0 covers (\d+) users
      value: 20
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 20 users and logged 1 fire reports
      value: r0
    - name: f2
      regex: r1 covers \d+ users and logged (\d+) fire reports
      value: 5
    - name: u2
      regex: r1 covers (\d+) users
      value: 300
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 300 users and logged 5 fire reports
      value: r1
    - name: f3
      regex: r2 covers \d+ users and logged (\d+) fire reports
      value: 8
    - name: u3
      regex: r2 covers (\d+) users
      value: 8000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 8000 users and logged 8 fire reports
      value: r2
  aborted:
    formula: (f1>=A)+((f1<A)*(f2>=A))+((f1<A)*(f2<A)*(f3>=A))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 6
    - name: f1
      regex: r0 covers \d+ users and logged (\d+) fire reports
      value: 1
    - name: u1
      regex: r0 covers (\d+) users
      value: 20
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 20 users and logged 1 fire reports
      value: r0
    - name: f2
      regex: r1 covers \d+ users and logged (\d+) fire reports
      value: 5
    - name: u2
      regex: r1 covers (\d+) users
      value: 300
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 300 users and logged 5 fire reports
      value: r1
    - name: f3
      regex: r2 covers \d+ users and logged (\d+) fire reports
      value: 8
    - name: u3
      regex: r2 covers (\d+) users
      value: 8000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 8000 users and logged 8 fire reports
      value: r2
  users_exposed:
    formula: (u1+u2+u3) if rings_passed>=3 else ((u1+u2+(u3 if aborted and rings_passed==2 else 0)) if rings_passed==2 else ((u1+(u2 if aborted and rings_passed==1 else 0)) if rings_passed==1 else (u1 if
      aborted else 0)))
    literals:
    - name: u1
      regex: r0 covers (\d+) users
      value: 20
    - name: u2
      regex: r1 covers (\d+) users
      value: 300
    - name: u3
      regex: r2 covers (\d+) users
      value: 8000
  halt_ring:
    formula: (n1 if aborted and rings_passed==0 else (n2 if aborted and rings_passed==1 else (n3 if aborted and rings_passed==2 else '')))
    literals:
    - name: A
      regex: abort threshold is (\d+) fire reports
      value: 6
    - name: f1
      regex: r0 covers \d+ users and logged (\d+) fire reports
      value: 1
    - name: u1
      regex: r0 covers (\d+) users
      value: 20
    - name: n1
      regex: ([A-Za-z0-9_-]+) covers 20 users and logged 1 fire reports
      value: r0
    - name: f2
      regex: r1 covers \d+ users and logged (\d+) fire reports
      value: 5
    - name: u2
      regex: r1 covers (\d+) users
      value: 300
    - name: n2
      regex: ([A-Za-z0-9_-]+) covers 300 users and logged 5 fire reports
      value: r1
    - name: f3
      regex: r2 covers \d+ users and logged (\d+) fire reports
      value: 8
    - name: u3
      regex: r2 covers (\d+) users
      value: 8000
    - name: n3
      regex: ([A-Za-z0-9_-]+) covers 8000 users and logged 8 fire reports
      value: r2
v6:
  entities:
  - id: f1
    question: fire reports ring r0 logged, copy the number from its fact line
    answer: 1
  - id: f2
    question: fire reports ring r1 logged, copy the number from its fact line
    answer: 5
  - id: f3
    question: fire reports ring r2 logged, copy the number from its fact line
    answer: 8
  - id: u1
    question: users ring r0 covers, copy the number from its fact line
    answer: 20
  - id: u2
    question: users ring r1 covers, copy the number from its fact line
    answer: 300
  - id: u3
    question: users ring r2 covers, copy the number from its fact line
    answer: 8000
  - id: n1
    question: the ring id of ring number 1, copy it exactly from the facts
    answer: r0
  - id: n2
    question: the ring id of ring number 2, copy it exactly from the facts
    answer: r1
  - id: n3
    question: the ring id of ring number 3, copy it exactly from the facts
    answer: r2
  - id: at
    question: the abort threshold in fire reports, copy the number from the facts
    answer: 6
  aggregate: '{''rings_passed'': (a(''f1'')<a(''at''))*(1+(a(''f2'')<a(''at''))*(1+(a(''f3'')<a(''at'')))), ''aborted'': (a(''f1'')>=a(''at''))+(a(''f2'')>=a(''at''))+(a(''f3'')>=a(''at''))>0, ''users_exposed'':
    int(a(''u1''))+int(a(''u2''))*(a(''f1'')<a(''at''))+int(a(''u3''))*(a(''f1'')<a(''at''))*(a(''f2'')<a(''at'')), ''halt_ring'': (a(''n1'') if a(''f1'')>=a(''at'') else (a(''n2'') if a(''f2'')>=a(''at'')
    else (a(''n3'') if a(''f3'')>=a(''at'') else '''')))}'
