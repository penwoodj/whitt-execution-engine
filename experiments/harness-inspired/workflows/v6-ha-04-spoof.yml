workflow_id: harness_v6_ha-04_spoof
name: "Harness v6 SPOOF - ha-04"
description: "TABLE->GATE->DETERMINISTIC-AGGREGATE->JUDGE. Case: ha-04"
version: "6.0.0"
author: "Experiment"
tags: [harness, agentic, v6, table, aggregate ,spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_worker:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_worker}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-04.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_worker}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

                You manage tonight's fix-stage budget. Standing policy: light cases get at
        most 1 fix stage each, heavy cases at most 3 fix stages each, and the whole
        night holds a shared pool of 10 fix stages — stages are burned only when
        actually executed, not when merely allowed. A case counts as fixed-and-passed
        if it passed after burning at least one fix stage. This run: 4 light cases
        each burned exactly 1 stage and all 4 passed. 3 heavy cases ran: the first
        burned 2 stages then passed, the second burned all 3 stages and still
        failed, the third burned 1 stage and passed. A capacity dashboard you do
        not manage shows allowed stages (which would be 13) rather than burned
        stages, and is not the number you report. Report the fix stages actually
        burned, stages left in the pool, and fixed-and-passed cases. Output ONLY
        this JSON with exactly these keys: {"burned": N, "left": N, "fixed_passed": N}.

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.
        Then output ONLY these lines, one per entity, nothing else:
        ENTITY <id> | <answer>

        Entities:
        - light_batch: burned stages and passes for 4 light cases
        - heavy_1: burned stages and passes for first heavy
        - heavy_2: burned stages and passes for second heavy
        - heavy_3: burned stages and passes for third heavy
      model_overrides: { temperature: 0.1, max_tokens: 1280 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v6/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v6/ha-04-solve-lose.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v6/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-04.yml --out ./docs/benchmarks/outputs/output/spoof-v6/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v6/ha-table-result.json check ./docs/benchmarks/outputs/output/spoof-v6/ha-trace.jsonl ha-04"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s02_fix_1:
      generative_entity: "${models.m_worker}"
      prompt: |
        ROLE: correction specialist. Entity table failed checks. Fix rows.

        Failed cells (id + your observed value, correct values withheld):
        {{bookmarks.cell_feedback}}

        Prior table:
        {{bookmarks.table}}

        METHOD: re-derive each failed entity from task rules. Output ONLY
        the full corrected table: one ENTITY line per entity.
      model_overrides: { temperature: 0.0, max_tokens: 1280 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v6/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v6/ha-04-fix_1-lose.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v6/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-04.yml --out ./docs/benchmarks/outputs/output/spoof-v6/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s03_fix_2
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v6/ha-table-result.json fix_1 ./docs/benchmarks/outputs/output/spoof-v6/ha-trace.jsonl ha-04"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s03_fix_2:
      generative_entity: "${models.m_worker}"
      prompt: |
        ROLE: escalation solver. Two attempts wrong. Rebuild table from scratch.

        Original task:
                You manage tonight's fix-stage budget. Standing policy: light cases get at
        most 1 fix stage each, heavy cases at most 3 fix stages each, and the whole
        night holds a shared pool of 10 fix stages — stages are burned only when
        actually executed, not when merely allowed. A case counts as fixed-and-passed
        if it passed after burning at least one fix stage. This run: 4 light cases
        each burned exactly 1 stage and all 4 passed. 3 heavy cases ran: the first
        burned 2 stages then passed, the second burned all 3 stages and still
        failed, the third burned 1 stage and passed. A capacity dashboard you do
        not manage shows allowed stages (which would be 13) rather than burned
        stages, and is not the number you report. Report the fix stages actually
        burned, stages left in the pool, and fixed-and-passed cases. Output ONLY
        this JSON with exactly these keys: {"burned": N, "left": N, "fixed_passed": N}.

        Failed cells (id + observed, withheld correct):
        {{bookmarks.cell_feedback}}

        METHOD: discard prior attempts. Re-derive EVERY entity answer from
        the rules. Output ONLY the full table: one ENTITY line per entity.
      model_overrides: { temperature: 0.0, max_tokens: 1600 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v6/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v6/ha-04-fix_2-lose.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v6/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-04.yml --out ./docs/benchmarks/outputs/output/spoof-v6/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v6/ha-table-result.json fix_2 ./docs/benchmarks/outputs/output/spoof-v6/ha-trace.jsonl ha-04"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s04_aggregate:
      generative_entity: "${models.m_worker}"
      prompt: "deterministic-aggregate-noop"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/aggregate.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-04.yml --table-result ./docs/benchmarks/outputs/output/spoof-v6/ha-table-result.json --out ./docs/benchmarks/outputs/output/spoof-v6/ha-final.json"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/spoof-v6/ha-final.json --criteria /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-04.yml --out ./docs/benchmarks/outputs/output/spoof-v6/ha-final-check.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s05_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v6/ha-final-check.json final ./docs/benchmarks/outputs/output/spoof-v6/ha-trace.jsonl ha-04"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s05_judge:
      generative_entity: "${models.m_judge}"
      prompt: |
        ROLE: blind auditor. See only task + result. No author knowledge.

        Task objective: Account burned vs allowed fix stages under adaptive budgets.
        Result: {{bookmarks.final_json}}

        Check: does result answer task completely? Values plausible?
        Output EXACTLY 3 lines:
        VERDICT: PASS or FAIL
        REASON: one sentence
        SCORE: 1-10
      model_overrides: { temperature: 0.0, max_tokens: 128 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v6/ha-verdict.txt --text-file experiments/harness-inspired/fixtures/spoof-v6/ha-04-judge.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-judge.py ./docs/benchmarks/outputs/output/spoof-v6/ha-verdict.txt ./docs/benchmarks/outputs/output/spoof-v6/ha-trace.jsonl ha-04"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s06_end_fail:
      generative_entity: "${models.m_worker}"
      prompt: "FAIL"
      model_overrides: { temperature: 0.0, max_tokens: 8 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/failflag.py --result ./docs/benchmarks/outputs/output/spoof-v6/ha-table-result.json --final-check ./docs/benchmarks/outputs/output/spoof-v6/ha-final-check.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s07_fail_trace
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s_end
          - skip_step: true

    s07_fail_trace:
      generative_entity: "${models.m_worker}"
      prompt: "trace-only"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-append.py ./docs/benchmarks/outputs/output/spoof-v6/ha-trace.jsonl end_fail fail case=ha-04"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '1 == 1'
                then: s_end

    s_end:
      generative_entity: "${models.m_worker}"
      prompt: "term"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - skip_step: true
