    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-59.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - each cycle promotes ceil of cohort times the promotion percent per hundred, rounding up always, a cohort is promotion-eligible at-or-over 200 users, eligibility is about the cohort, the percent is about the cycle
        - errors demote, each error removes one promotion, demotions floor at zero per cycle, demoted users rejoin their origin cohort and count as stuck
        - cycle two's cohort inherits cycle one's net promotions before its own percent applies, inheritance is additive, the percent applies to the inherited size

        FACTS:
        - wave-9 starts with 260 users at 30 percent and 14 errors, wave-10 starts with 140 users at 30 percent and 2 errors
        - the eligibility floor is 200 users per cohort
        - the drum quotes no promotion counts tonight, every net derives from size, percent, and errors

        REPORT SPEC (exact keys, exact types):
        - cycle1_net_promoted: int
        - cycle2_net_promoted: int
        - stuck_count: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - s1: wave-9's starting users (copy the number from its fact line). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]
        - p1: wave-9's promotion percent (copy the number from its fact line). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]
        - e1: wave-9's errors (copy the number from its fact line). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]
        - s2: wave-10's starting users (copy the number from its fact line). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]
        - p2: wave-10's promotion percent (copy the number from its fact line). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]
        - e2: wave-10's errors (copy the number from its fact line). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]
        - pr1: cycle one's promotions before errors (ceil of the first cohort times its percent over 100). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]
        - n1: cycle one's net promotions after demotion (floored at zero). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]
        - n2: cycle two's net promotions after demotion (inheritance first, then percent, then errors). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]
        - stuck: stuck users across both cohorts after both cycles (count them). hint: *: advance the ring a full two cycles, position arithmetic is modulo the cohort size. [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 10 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
