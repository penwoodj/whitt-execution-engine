workflow_id: harness_v8_hc-26_spoof
name: "Harness v8 SPOOF - hc-26"
description: "DIGEST->GATE->FIX(rescue)->AGGREGATE->JUDGE->AUDIT. Case: hc-26 hops=3 route=light"
version: "8.0.0"
author: "Experiment"
tags: [harness, agentic, v8, digest, rescue, spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_light}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-26.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_light}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped
        - the nightly cutoff is 100 processed items across all queues combined, if the summed processed count reaches or passes it the cutoff flag flips true, the flag is the report, nothing truncates, queues run to their caps regardless
        - deferred means arrived but not processed, arrived items sitting in a capped-out queue are deferred

        FACTS:
        - north holds 47 items against a cap of 40, south holds 33 items against a cap of 40, east holds 52 items against a cap of 40
        - queue north: 47 arrived, cap 40, so 40 processed and 7 deferred
        - queue south: 33 arrived, cap 40, so 33 processed and 0 deferred
        - queue east: 52 arrived, cap 40, so 40 processed and 12 deferred

        REPORT SPEC (exact keys, exact types):
        - processed: int
        - deferred: int
        - queues_over_cap: int
        - cutoff_hit: bool

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - processed_total: total items processed tonight across all queues (sum of min(arrival, cap) per queue) [answer format: a whole number]
        - deferred_total: total items deferred tonight (arrival minus cap where positive, summed) [answer format: a whole number]
        - over_cap_count: how many queues exceeded their own cap (arrival strictly greater than cap) [answer format: a whole number]
        - cutoff_flag: did the combined processed count reach the nightly cutoff (true or false) [answer format: true or false]

        OUTPUT CONTRACT — your reply MUST end with exactly 4 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 2048 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/hc-26-solve-wind0.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-26.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json check ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl hc-26"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage solve --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case hc-26"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s02_fix_1:
      generative_entity: "${models.m_light}"
      prompt: |
        ROLE: correction specialist. Entity table failed checks. Fix rows.

        TASK CORE:
        RULES:
        - each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped
        - the nightly cutoff is 100 processed items across all queues combined, if the summed processed count reaches or passes it the cutoff flag flips true, the flag is the report, nothing truncates, queues run to their caps regardless
        - deferred means arrived but not processed, arrived items sitting in a capped-out queue are deferred

        FACTS:
        - north holds 47 items against a cap of 40, south holds 33 items against a cap of 40, east holds 52 items against a cap of 40
        - queue north: 47 arrived, cap 40, so 40 processed and 7 deferred
        - queue south: 33 arrived, cap 40, so 33 processed and 0 deferred
        - queue east: 52 arrived, cap 40, so 40 processed and 12 deferred

        REPORT SPEC (exact keys, exact types):
        - processed: int
        - deferred: int
        - queues_over_cap: int
        - cutoff_hit: bool

        FINAL REPORT FORM (derive values yourself):
        {"processed": <int>, "deferred": <int>, "queues_over_cap": <int>, "cutoff_hit": <true-or-false>}

        Failed cells (id + your observed value, correct values withheld):
        {{bookmarks.cell_feedback}}

        Prior table:
        {{bookmarks.table}}

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - processed_total: total items processed tonight across all queues (sum of min(arrival, cap) per queue) [answer format: a whole number]
        - deferred_total: total items deferred tonight (arrival minus cap where positive, summed) [answer format: a whole number]
        - over_cap_count: how many queues exceeded their own cap (arrival strictly greater than cap) [answer format: a whole number]
        - cutoff_flag: did the combined processed count reach the nightly cutoff (true or false) [answer format: true or false]

        OUTPUT CONTRACT — your reply MUST end with exactly 4 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.0, max_tokens: 2560 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/hc-26-fix_1-wind0.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-26.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s03_fix_2
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json fix_1 ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl hc-26"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.fix_1.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage fix_1 --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case hc-26"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s03_fix_2:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: escalation solver. Two attempts wrong. Rebuild table from scratch.

        TASK CORE:
        RULES:
        - each queue processes at most its own cap per night, overages defer to tomorrow, they are never dropped
        - the nightly cutoff is 100 processed items across all queues combined, if the summed processed count reaches or passes it the cutoff flag flips true, the flag is the report, nothing truncates, queues run to their caps regardless
        - deferred means arrived but not processed, arrived items sitting in a capped-out queue are deferred

        FACTS:
        - north holds 47 items against a cap of 40, south holds 33 items against a cap of 40, east holds 52 items against a cap of 40
        - queue north: 47 arrived, cap 40, so 40 processed and 7 deferred
        - queue south: 33 arrived, cap 40, so 33 processed and 0 deferred
        - queue east: 52 arrived, cap 40, so 40 processed and 12 deferred

        REPORT SPEC (exact keys, exact types):
        - processed: int
        - deferred: int
        - queues_over_cap: int
        - cutoff_hit: bool

        FINAL REPORT FORM (derive values yourself):
        {"processed": <int>, "deferred": <int>, "queues_over_cap": <int>, "cutoff_hit": <true-or-false>}

        Failed cells (id + observed, withheld correct):
        {{bookmarks.cell_feedback}}

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - processed_total: total items processed tonight across all queues (sum of min(arrival, cap) per queue) [answer format: a whole number]
        - deferred_total: total items deferred tonight (arrival minus cap where positive, summed) [answer format: a whole number]
        - over_cap_count: how many queues exceeded their own cap (arrival strictly greater than cap) [answer format: a whole number]
        - cutoff_flag: did the combined processed count reach the nightly cutoff (true or false) [answer format: true or false]

        OUTPUT CONTRACT — your reply MUST end with exactly 4 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.0, max_tokens: 3072 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/hc-26-fix_2-wind0.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-26.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
