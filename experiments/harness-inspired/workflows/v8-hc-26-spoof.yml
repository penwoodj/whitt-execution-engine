          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json fix_2 ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl hc-26"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.fix_2.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage fix_2 --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case hc-26"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s04_aggregate:
      generative_entity: "${models.m_light}"
      prompt: "deterministic-aggregate-noop"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/aggregate.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-26.yml --table-result ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json --out ./docs/benchmarks/outputs/output/spoof-v7/ha-final.json"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-final.json --criteria /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-26.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-final-check.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s05_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-final-check.json final ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl hc-26"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s05_judge:
      generative_entity: "${models.m_judge}"
      prompt: |
        ROLE: blind auditor. See only task + result. No author knowledge.

        Task objective: derive processed, deferred, queues_over_cap, cutoff_hit from the stated rules
        Result: {{bookmarks.final_json}}

        Answer EXACTLY 6 lines, nothing else:
        KEYS: yes or no
        VALUES: yes or no
        FORMAT: yes or no
        VERDICT: PASS or FAIL
        REASON: one sentence
        SCORE: 1-10

        VERDICT must be PASS only if all three of KEYS, VALUES, FORMAT are yes.
      model_overrides: { temperature: 0.0, max_tokens: 160 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-verdict.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/hc-26-judge.txt"
