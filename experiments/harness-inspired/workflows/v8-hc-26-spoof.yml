              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '1 == 1'
                then: s_end

    s_end:
      generative_entity: "${models.m_light}"
      prompt: "term"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - skip_step: true
