workflow_id: harness_v12_hd-80_spoof
name: "Harness v12 SPOOF - hd-80"
description: "DIGEST->GATE->FIX(rescue x3)->AGGREGATE->JUDGE->AUDIT. Case: hd-80 hops=6 route=heavy fix3=always"
version: "10.0.0"
author: "Experiment"
tags: [harness, agentic, v12, digest, rescue3, spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-80.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - each tranche releases its percentage of the total only when its inspection count is strictly past its threshold, percentages apply to the full escrow total, never to a remainder
        - integer cents throughout, percentage of total computed as total times percent floor-divided by 100
        - held is total minus released, held is never negative and never silent, unreleased tranches stay held entirely

        FACTS:
        - the escrow total is 600000 whole units
        - tranche 1 is 25 percent with threshold 3 inspections passed 4, tranche 2 is 25 percent with threshold 3 inspections passed 3, tranche 3 is 25 percent with threshold 4 inspections passed 2, tranche 4 is 25 percent with threshold 6 inspections passed 9
        - no tranche amount is taken on faith tonight, every release is recomputed from the gate

        REPORT SPEC (exact keys, exact types):
        - tranches_released: int
        - cents_released: int
        - cents_held: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - T: the escrow total in whole units (copy the number from its fact line). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - thr1: tranche 1's inspection threshold (copy the number from its fact line). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - thr2: tranche 2's inspection threshold (copy the number from its fact line). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - thr3: tranche 3's inspection threshold (copy the number from its fact line). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - thr4: tranche 4's inspection threshold (copy the number from its fact line). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - got1: tranche 1's inspections passed (copy the number from its fact line). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - got2: tranche 2's inspections passed (copy the number from its fact line). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - got3: tranche 3's inspections passed (copy the number from its fact line). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - got4: tranche 4's inspections passed (copy the number from its fact line). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - rel1: tranche 1's released amount in whole units (apply the gate to its threshold, zero if held). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - rel2: tranche 2's released amount in whole units (apply the gate to its threshold, zero if held). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - rel3: tranche 3's released amount in whole units (apply the gate to its threshold, zero if held). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - rel4: tranche 4's released amount in whole units (apply the gate to its threshold, zero if held). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - nrel: how many tranches released (count them). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]
        - held: the held amount in whole units (total minus everything released). hint: *: each tranche releases only after its own hold clears, sum released tranches only. [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 15 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
