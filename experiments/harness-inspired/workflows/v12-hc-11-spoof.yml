workflow_id: harness_v12_hc-11_spoof
name: "Harness v12 SPOOF - hc-11"
description: "DIGEST->GATE->FIX(rescue x3)->AGGREGATE->JUDGE->AUDIT. Case: hc-11 hops=5 route=heavy fix3=always"
version: "10.0.0"
author: "Experiment"
tags: [harness, agentic, v12, digest, rescue3, spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-11.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - rings promote in order, a ring only enters after the previous ring passes clean
        - a ring with 4 or more fire reports halts the rollout on the spot, halted means halted, no finish and see
        - users exposed counts every user in rings that entered, including the ring that triggered the halt

        FACTS:
        - ring-1 covers 100 users and logged 5 fire reports, ring-2 covers 500 users and logged 4 fire reports, ring-3 covers 2000 users and logged 3 fire reports
        - the abort threshold is 4 fire reports

        REPORT SPEC (exact keys, exact types):
        - rings_passed: int
        - aborted: bool
        - users_exposed: int
        - halt_ring: str

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - f1: fire reports ring ring-1 logged, copy the number from its fact line [answer format: a whole number]
        - f2: fire reports ring ring-2 logged, copy the number from its fact line [answer format: a whole number]
        - f3: fire reports ring ring-3 logged, copy the number from its fact line [answer format: a whole number]
        - u1: users ring ring-1 covers, copy the number from its fact line [answer format: a whole number]
        - u2: users ring ring-2 covers, copy the number from its fact line [answer format: a whole number]
        - u3: users ring ring-3 covers, copy the number from its fact line [answer format: a whole number]
        - n1: the ring id of ring number 1, copy it exactly from the facts [answer format: a single word in quotes]
        - n2: the ring id of ring number 2, copy it exactly from the facts [answer format: a single word in quotes]
        - n3: the ring id of ring number 3, copy it exactly from the facts [answer format: a single word in quotes]
        - at: the abort threshold in fire reports, copy the number from the facts [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 10 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 2048 }
