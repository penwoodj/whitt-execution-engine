        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./experiments/harness-inspired/results/v12-spoof-output/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v12/hc-11-solve-wind0.txt"
