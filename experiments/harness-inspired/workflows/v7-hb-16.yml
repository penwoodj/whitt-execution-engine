        skipped because the sky will handle it, no matter how dry the sensor
        claims. A zone whose moisture sensor reports a fault code goes to a
        manual check list instead and is never watered automatically that
        morning. Tonight's board reads as follows. Zone A, the tropical house,
        sits at twenty-two percent moisture with a clear forecast. Zone B, the
        succulent bench, is comfortable at fifty-five percent under clear skies.
        Zone C, the fern wall, is down at thirty-one percent but the forecast
        shows rain arriving before nine in the morning. Zone D, the orchid room,
        is reporting a sensor fault code instead of a moisture number. The
        fountain pump schedule you do not manage also draws water at dawn for the
        front courtyard, and its usage never counts against irrigation minutes.
        A weather station you also do not manage logs humidity readings that are
        informational only and never trigger or suppress watering. Report how
        many zones got watered, how many were skipped for adequate moisture, how
        many were skipped for rain, how many went to manual check, and the total
        pump minutes the controller will run.
        
        The dawn-cycle rulebook exists because of the fern-wall flood, an
        incident the conservatory's veterans refer to by season, never by
        date. Two years ago a moisture sensor on the fern wall began
        reading implausibly low — forty points below anything physical —
        and the controller of that era, trusting sensors absolutely, ran
        the zone's valves for the computed deficit every dawn for six
        dawns running. The wall's drainage tray overflowed on the fourth
        morning; by the sixth the floor crew had built a dike of towels
        and the conservatory's rarest specimen was listing. The postmortem
        wrote three rules into the book at once — faulted sensors never
        command water, rain forecasts override deficits, and watering
        minutes round partial blocks up rather than down — and tonight's
        dawn cycle is those three rules running quietly, the way rules run
        when everyone has forgotten why they exist.
        
        Your morning begins before the controller fires, with the
        hand-read of the sensor board the head horticulturalist insists on
        regardless of automation. Four rows, four zones, each read twice —
        once for the number and once for the fault column beside it —
        because the flood taught that a number without its fault flag is
        half a fact. You checked the forecast feed against the wall
        calendar where the gardeners pin their own observations, and where
        the two disagreed this morning you trusted the feed, since the
        rulebook names the feed and the pinboard is folklore. Only then
        did you arm the cycle, which is the administrator's entire job on
        a morning without faults — read honestly, arm deliberately, and
        let the rules decide.
        
        The conservatory's other systems water, count, and hum without
        touching tonight's tally. The fountain pump schedule runs the
        courtyard display on its own clock, drawing from the same main
        but logging to a facilities meter the irrigation report never
        sees. The greenhouse's research annex keeps separate sensors at
        separate depths for a university study, its data embargoed until
        publication and its valves entirely its own. And the evening
        docent tour carries a tablet that displays moisture readings for
        the visitors' edification — charming, occasionally a week stale,
        and precisely as authoritative as a tour guide's weather wisdom,
        which is to say not part of the controller's arithmetic at
        all.
        
        A note on the fault column and its discipline, because faults are
        where irrigation arithmetic proves itself. A faulted zone is not
        a dry zone or a wet zone — it is an unknown zone, and the
        rulebook's entire stance toward unknowns is refusal — no water
        commands issue from a reading the controller does not believe.
        The morning's manual-check list inherits the orchid room, and a
        gardener with a handheld probe will stand in the doorway at
        seven and decide with fingers and eyes what the sensor could
        not. The conservatory's veterans consider this the system
        working rather than failing — the flood taught that the only
        dangerous sensor is the one trusted past its fault flag, and the
        dawn cycle's refusal is the flood's lesson running on schedule.
        
        The administrator's final act before the cycle fires is the
        pump-minutes audit the operations binder mandates. The computed
        minutes for each watered zone are recorded alongside the deficit
        that produced them, and the audit walks the pairs — every minute
        traceable to a moisture number, every number traceable to a
        sensor the fault column cleared. Tonight's audit closes with
        one zone's arithmetic to verify and nothing else, which is the
        quietest possible morning for a conservatory that remembers
        louder ones; the cycle arms, the valves answer, and the
        tropical house drinks exactly what the rulebook says it
        earned.
        
        The gardeners will read tonight's board by first light, and the
        administrator's craft is making sure the board they read matches
        the cycle the controller actually ran. Each dawn's log carries
        the zone dispositions beside the moisture numbers that produced
        them, and the head horticulturalist's morning habit is to walk
        the log against the plants themselves — a fern's fronds against
        a sensor's claim, a succulent's plumpness against a skip's
        justification. Discrepancies between plant and log surface in
        the afternoon meeting with the calm of routine, because the
        flood taught the conservatory that the costliest gap is the one
        nobody walks out to check. Tonight's log will survive the walk,
        as it has since the third chart's rules settled in.
        
        A closing thought on the pump itself, the machinery whose
        minutes the report counts. The irrigation pump is older than
        the rulebook, older than the flood, rebuilt once and nicknamed
        twice, and its twenty minutes tonight are the same twenty
        minutes it has run for a thousand dawns before this one. The
        deficit arithmetic decides whether it runs; nothing in the
        rulebook decides whether it lasts — that belongs to the
        maintenance calendar, the spare-parts shelf, and the
        facilities tech who listens to it start each morning the way
        other people listen to weather. Tonight it runs for the
        tropical house alone, which is the quietest shift a
        twenty-minute pump can have.
        
        And so the dawn cycle closes the way dawn cycles now close —
        board read, faults honored, forecast trusted, and one zone's
        thirst answered in minutes the rulebook derives in public.
        The tropical house drinks, the succulents rest, the fern wall
        waits for rain the forecast promised and the sky will decide
        about, and the orchid room joins the handheld probe's morning
        schedule, a gardener standing where a sensor could not be
        believed. The log files beside the coffee, the cycle's twenty
        minutes are the flood's whole lesson running quietly, and the
        conservatory wakes to wet floors nowhere and honest counts
        everywhere.
        
        The last number worth a sentence is pump_minutes, because its
        twenty is the only bucket tonight that measures effort rather
        than disposition. Four zones, four verdicts, one act — and the
        act's duration is the deficit arithmetic made visible, base ten
        plus two full blocks of five for eighteen points of dryness,
        rounded up the way the flood taught the binder to round. The
        other numbers say what the rules decided; this one says what
        the rules cost the pump, and the facilities tech who listens
        to it start each morning will hear exactly twenty minutes of
        it.
        
        One more paragraph closes the gap between the count and the
        garden it serves. The conservatory's visitors will arrive at
        nine and none of them will know that a rulebook decided the
        morning — they will see wet tropical foliage and dry
        succulents and call it atmosphere, which it is, and
        engineering, which it also is. The head horticulturalist
        says the highest compliment the irrigation system can earn
        is invisibility, and by that measure tonight was the finest
        dawn in weeks — one zone watered, three zones correctly
        spared, one fault correctly refused, twenty minutes
        correctly spent, and nothing for anyone to notice. The
        report files its numbers, the probe walk will finish by
        eight, and the day begins watered exactly where water was
        owed.
        
        The count is nearly closed, and the last discipline is the
        one the binder saves for exactly this moment, the refusal
        to round the story along with the numbers. Twenty pump
        minutes is twenty, not roughly twenty; one manual check is
        one, not a shame; the rain skip is a decision, not a
        postponement. The conservatory's dawn closes in integers
        and the garden opens on them, which is the only arithmetic
        the rulebook has ever asked anyone to trust.

