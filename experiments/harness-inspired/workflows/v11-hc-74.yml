workflow_id: harness_v11_hc-74
name: "Harness v11 - hc-74"
description: "DIGEST->GATE->FIX(rescue)->AGGREGATE->JUDGE->AUDIT. Case: hc-74 hops=6 route=heavy"
version: "9.0.0"
author: "Experiment"
tags: [harness, agentic, v11, digest, rescue]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
