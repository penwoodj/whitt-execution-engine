        - denied jobs do not print tonight, denial is not deferral

        FACTS:
        - r1 printed 40 of a 50 page monthly quota, r2 printed 50 of a 50 page monthly quota, r3 printed 48 of a 50 page monthly quota
        - the largest single job tonight ran 45 pages
        - 0 color jobs were denied at the counter

        REPORT SPEC (exact keys, exact types):
        - users_flagged: int
        - users_clear: int
        - color_jobs_denied: int
        - largest_job_pages: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - n1: pages r1 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - n2: pages r2 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - n3: pages r3 printed this month (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - q1: r1's monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - q2: r2's monthly page quota (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
