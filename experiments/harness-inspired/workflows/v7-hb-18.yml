workflow_id: harness_v7_hb-18
name: "Harness v7 - hb-18"
description: "TABLE->GATE->AGGREGATE->JUDGE-V2->LEAK-AUDIT. Case: hb-18 hops=5 route=heavy"
version: "7.0.0"
author: "Experiment"
tags: [harness, agentic, v7, routing, snapshot, meter, audit]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-18.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

                You are the load planner for a regional freight terminal, and five hazmat
        shipments must be assigned to trailers before the last departure window
        closes. The segregation chart is unambiguous. Class 3 flammable liquids
        and class 8 corrosives may never ride on the same trailer under any
        circumstances. Class 9 miscellaneous goods are compatible with every
        other class and can share freely. No trailer may carry more than two
        hazard classes at once, no matter the weights involved. And any single
        shipment weighing more than one thousand kilograms demands a dedicated
        trailer all to itself and cannot be combined with anything else, its own
        class included. The five shipments on tonight's dock read as follows.
        Shipment one is eight hundred kilograms of class 3 flammable paint
        thinner. Shipment two is six hundred kilograms of class 8 battery acid.
        Shipment three is four hundred kilograms of class 9 lithium batteries
        packed in regulation-compliant packaging. Shipment four is three hundred
        kilograms of class 3 aerosols. Shipment five is twelve hundred kilograms
        of class 8 drain cleaner. The dock's refrigeration units you do not manage
        occupy trailer slots for cold-chain freight, and those units never enter
        the hazmat segregation math. A compliance newsletter you also do not
        manage describes upcoming rule changes for next quarter, none of which
        apply to tonight's loading. Working the rules in whatever order you find
        cleanest, report the fewest trailers needed so every shipment rolls
        legally, how many of those are dedicated single-shipment trailers, how
        many trailers end up carrying more than one hazard class, and how many
        shipments remain unassigned after planning.
        
        The segregation chart hanging in the dispatch office is not the
        first version — it is the third, and the story of the first two
        is required telling for every new load planner. The original
        chart was a single line long, listing forbidden pairs, and it
        worked until the night a planner — correct on pairs, careless on
        cardinality — loaded three hazard classes onto one trailer and
        discovered at the weigh station that pairwise legality does not
        sum to collective legality. The second version added the
        two-class ceiling but said nothing about weight, and it worked
        until the axle-overload incident taught the terminal that a
        trailer's physics do not care about its chemistry. The chart in
        force tonight carries all three lessons — the forbidden pairs,
        the class ceiling, and the dedicated-trailer weight rule — and
        the planners who read it read a document written in the margin
        notes of two very bad nights.
        
        Your evening runs the load plan the way the chart's own preamble
        instructs — heaviest single shipment first, since the
        dedicated-trailer rule removes it from every other consideration
        and pretending otherwise only complicates the arithmetic. With
        the twelve-hundred-kilogram shipment alone on its own trailer,
        the remaining four sort themselves along the chart's lines — the
        two class-three shipments find each other immediately, the class
        eight stands apart from them by law, and the class nine becomes
        the connective tissue the chart always intended it to be. You
        drew the plan on the whiteboard the old-timers insist on before
        touching the terminal, because the whiteboard's error rate is
        zero and the terminal's is merely low, and at this terminal the
        difference has a body count of zero that everyone intends to
        keep.
        
        The dock's other systems weigh, count, and schedule without ever
        touching the segregation math. The refrigeration units occupy
        their trailer slots on the yard map under a cold-chain regime
        with its own inspectors, and a hazmat planner who borrows a reefer
        slot answers to questions no one wants asked. The dock's weigh
        bridge logs axle loads for the department of transportation, a
        ledger of physics that echoes the chart's weight rule without
        ever knowing the chart exists. And the compliance newsletter's
        proposed rule changes circulate in a binder by the coffee machine,
         annotated in three hands, authoritative next quarter perhaps —
        and tonight, not at all.
        
        A note on the whiteboard and the weigh bridge, because
        redundancy is where segregation arithmetic proves itself. The
        plan drawn twice — whiteboard and terminal — survived its
        cross-read tonight, which is the terminal's error rate losing
        again to the marker's, and the weigh bridge will perform the
        third verification at dawn when the trailers roll. The bridge
        does not know the chart exists; it knows only axle physics,
        and its ledger will record tonight's plan as weights and
        nothing more. But the planner who drew the plan knows that
        the bridge's numbers and the chart's rules are the same truth
        wearing different instruments — chemistry above the axles,
        physics beneath them, legality the coincidence of both — and
        tonight the coincidence holds by design rather than luck.
        
        The dispatch office's final act each loading night is the
        trailer count the chart's preamble mandates. The plan is
        counted once by classes, once by trailers, and once by
        shipments — three sums describing one plan, each required to
        absorb the dock's manifest exactly — and tonight all three
        close on the first pass. Three trailers, five shipments, four
        classes in play reduced by the ceiling to pairs the chart
        tolerates; the marker cap goes back on the whiteboard tray,
        the terminal locks, and the dawn shift inherits a plan that
        two instruments and one bad memory of weigh stations past
        all agree on.
        
        The night dispatcher will read the whiteboard at shift change,
        and the load planner's craft is making sure the marker says
        what the terminal locked. The plan survives three
        verifications — marker, terminal, weigh bridge at dawn — and
        the dispatcher's first act is the fourth — a walkthrough of
        the yard itself, trailers against manifest, seals against
        plan. The chart's three lessons hang above the coffee machine
        in their frames, and the planner who drew tonight's plan drew
        it standing where the pairwise-era planner stood on the night
        that taught the ceiling, which the old-timers mention
        whenever a new hire asks why the whiteboard matters.
        
        A closing thought on the class nine shipment, the connective
        tissue of tonight's plan. Miscellaneous by name and
        diplomatic by nature, the lithium batteries ride with the
        corrosives and ask nothing of anyone — the chart's one
        friendly line in a document otherwise written in
        prohibitions. Every planner develops a quiet affection for
        class nine; it is the category that solves otherwise
        unsolvable trailers, and tonight it solved the acid's
        loneliness at no cost to anyone. The plan locks with the
        batteries aboard the second trailer, the drain cleaner alone
        on the third, and the chart's three lessons honored in the
        order their bad nights taught them.
        
        And so the loading night closes the way loading nights now
        close — heaviest first, pairs lawful, ceiling held, and the
        batteries riding where the chart always intended them to
        ride. Three trailers on the yard, five shipments aboard
        them, the drain cleaner alone with its weight and its class
        and the dawn's weigh bridge waiting to say in physics what
        the chart said in chemistry. The marker caps, the terminal
        locks, the plan that two bad nights wrote hangs in its frame
        above the coffee machine — honored tonight, as every night,
        in the only currency the terminal has ever trusted, which
        is the count.
        
        The last number worth a sentence is mixed_class, because its
        one is the chart's geometry made visible. Most nights the
        terminal's plans come out class-pure — same-class groupings,
        no trailer wearing two placards — and the column reads zero
        so often that new planners assume it always will. Tonight
        the acid needed a mate, the batteries were the only lawful
        one, and the second trailer carries eight beside nine with
        the chart's blessing. The one records not a compromise but
        a collaboration, and the count distinguishes them the way
        the chart itself taught the terminal to.
        
        One more paragraph closes the gap between the count and the
        road it serves. The three trailers will roll at dawn behind
        tractors whose drivers know the placards and respect them,
        the weigh bridge will speak its physics, and somewhere
        down the highway tonight's buckets will dissolve into
        deliveries — paint thinner on a shelf, acid in a lab,
        batteries in a device none of the planners will ever hold.
        The chart's three lessons ride along invisibly in the
        grouping; the count records the grouping's shape and lets
        the road do the rest. Three trailers, one of them alone
        for weight, one of them mixed by friendship, none of them
        wrong by chemistry — that is tonight's whole truth, and
        the marker said it first.
        
        The count is nearly closed, and the last discipline is the
        one the chart saves for exactly this moment, the refusal
        to let familiarity soften segregation. Class nine's
        friendliness is lawful, not casual; the acid's solitude is
        regulatory, not lonely; the trailer count is three because
        three is what the rules assemble from five shipments. The
        dock closes on integers and the road inherits them.

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - s5_dedicated: Shipment 5 weighs 1,200 kg, over the 1,000 kg line — shipments over 1,000 kg must ride alone on a dedicated trailer; does shipment 5 take a dedicated trailer? (1 if yes, 0 if no) [answer format: a whole number]
        - s1_s4_share: Shipments 1 and 4 are both class 3 (flammable) at 800 kg and 300 kg — same-class shipments may share a trailer; do shipments 1 and 4 share one trailer? (1 if yes, 0 if no) [answer format: a whole number]
        - s2_join_s1_trailer: Shipment 2 is class 8 (corrosive) and class 8 never shares with class 3 — shipment 1's trailer is class 3; can shipment 2 join that trailer? (1 if yes, 0 if no) [answer format: a whole number]
        - s3_join_s2: Shipment 3 is class 9, which mixes with every class, and shipment 2 needs a trailer mate that is not class 3 — does shipment 3 join shipment 2's trailer? (1 if yes, 0 if no) [answer format: a whole number]
        - trailer_total: Count trailers used — one for shipments 1+4, one for shipments 2+3, one dedicated for shipment 5; how many trailers total? [answer format: a whole number]
        - mixed_class_count: Count trailers carrying more than one hazard class — only the trailer holding class 8 plus class 9 qualifies; how many mixed-class trailers? [answer format: a whole number]
        - unassigned_count: Every one of the five shipments found a legal trailer (1+4 together, 2+3 together, 5 alone); how many shipments remain unassigned? [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 7 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 1280 }
      when:
        after_step_succeeds:
          - save_to:
              - "$table"
              - "./docs/benchmarks/outputs/output/ha-table.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-18.yml --out ./docs/benchmarks/outputs/output/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/ha-table-result.json check ./docs/benchmarks/outputs/output/ha-trace.jsonl hb-18"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/ha-table.txt ./docs/benchmarks/outputs/output/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --stage solve --trace ./docs/benchmarks/outputs/output/ha-trace.jsonl --case hb-18"
              working_dir: "."
              fail_on_error: false

