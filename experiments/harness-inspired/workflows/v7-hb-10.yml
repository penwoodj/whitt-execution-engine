workflow_id: harness_v7_hb-10
name: "Harness v7 - hb-10"
description: "TABLE->GATE->AGGREGATE->JUDGE-V2->LEAK-AUDIT. Case: hb-10 hops=5 route=heavy"
version: "7.0.0"
author: "Experiment"
tags: [harness, agentic, v7, routing, snapshot, meter, audit]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-10.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

                You are the sous chef entrusted with tonight's prep-sheet audit at a
        busy hotel kitchen, one hour before dinner service, and the stakes are
        concrete: a tray you wrongly call usable gets plated and possibly sends
        someone to the emergency room, while a tray you wrongly discard costs the
        kitchen a component it now has sixty minutes to remake. The head chef's
        rules hang laminated at the pass, written after the allergen incident two
        summers ago that the whole staff still refers to only as The Tuesday.
        Read them the way the health inspector would.
        
        The use-by rule comes first, because it overrides everything and excuses
        nothing. A tray is usable only if its use-by date is tomorrow or later.
        Tomorrow or later — meaning a tray stamped with today's date is NOT
        usable, even though technically it has hours left on it; the kitchen
        draws the line at the date, not the hour, because during service nobody
        has time to argue about whether eleven pm is still today. A tray stamped
        with yesterday's date or older is discard, full stop, no appeal, and no
        other rule in this paragraph can rescue it.
        
        The allergen rule comes second, and it is about geography, not
        ingredients. The walk-in has one open container of crushed nuts on the
        middle shelf, left there during this morning's baking. Any tray stored on
        the shelf directly beneath an open nut container is flagged for
        cross-contact and is not usable as-is — the tray's own ingredients are
        irrelevant; a tray of perfectly nut-free rice sitting under the nut
        container is still flagged, because gravity and air circulation do not
        care about intent. Trays on other shelves, including the shelf above the
        nuts, are untouched by this rule.
        
        The substitution rule is the recovery path, and it has a hard limiter. A
        flagged tray can be substituted — remade fresh from a nut-free equivalent
        of the same component — provided the kitchen's substitution list actually
        contains a nut-free equivalent for that component. A substituted tray
        counts as usable for service. But each prep order, each line on the prep
        sheet, allows at most one substitution per evening; if a line would need
        a second substitution tonight, it simply goes without, and that tray is
        discarded as unusable. In practice tonight, every line has at most one
        flagged tray, so the limiter never binds — but the arithmetic still has
        to know it exists, because next week it will.
        
        Now the five trays on tonight's sheet, top to bottom.
        
        Tray A is the pasta base: thirty portions of par-cooked penne, use-by
        three days out, stored on the top shelf of the walk-in, far from the nut
        container and its gravity. No flag, date fine. Usable as-is, no
        substitution needed.
        
        Tray B is the rice base: use-by five days out, but stored on the shelf
        directly beneath the open nut container. Flagged for cross-contact. The
        substitution list does carry a nut-free rice equivalent — rice being
        rice, the kitchen makes it fresh in twenty minutes. One substitution
        used for B's line. B remade: usable.
        
        Tray C is the tomato sauce: stored safely on the bottom shelf, no allergen
        flag at all, but the use-by stamp reads yesterday. Yesterday is not
        tomorrow-or-later; the date rule overrides everything and excuses
        nothing. Discard. The chef is already annoyed about this one, because he
        remembers making that sauce and swears it smells perfect, and it probably
        does, and the rule does not care.
        
        Tray D is the herb dressing: use-by four days out, also stored on the
        shelf beneath the nut container — the walk-in got crowded after the
        delivery and two trays ended up in the blast radius. Flagged. The
        substitution list carries a nut-free herb dressing equivalent, made with
        sunflower oil instead of the walnut oil the original recipe uses, which
        is precisely why the original was anywhere near a nut conversation at
        all. D's line has used zero substitutions so far, so D's one is
        available. D remade: usable.
        
        Tray E is the consommé: stored on a clean shelf, no flag whatsoever, and
        its use-by stamp reads today. Today is not tomorrow-or-later. The kitchen
        will serve it at lunch next century, but tonight it is a discard, and the
        newest cook learned the date rule the gentle way.
        
        For completeness, two things in the walk-in that are not on tonight's
        sheet. The baking team's own nut inventory, including that open
        container, belongs to the pastry section's counts — you do not manage the
        pastry section, and its containers are not trays on your prep sheet. And
        the dry-storage room next door holds six crates of imported tomatoes for
        next week's sauce batch; crates of raw ingredient are not prepared trays,
        have no use-by in the tray sense, and are not part of this audit.
        
        Service starts in an hour, and the chef wants three numbers before the
        doors open: how many of the five trays are usable for tonight, how many
        are discarded, and how many substitutions the kitchen is burning on the
        remake station.
        
        The prep kitchen's counting rules were not always this strict, and the
        story of how they got here is told to every new hire on their first
        walk-through. In the restaurant's early years the cooks moved stock
        by instinct — a bruised case of peppers quietly became sauce, a short
        delivery was absorbed by raiding the walk-in, and the nightly count
        was a shrug. The turning point was a catering contract with audit
        rights, whose accountants expected every served cover to trace to
        inspected stock, and whose first audit found the kitchen's books to
        be, in the politest possible phrasing, folklore. The rules in force
        tonight are the settlement of that embarrassment — discarded means
        gone, substitution means the log names the stand-in, and the
        inspection sheet is the only voice that can declare a tray usable.
        
        Your closing routine tonight followed the checklist the sous chef
        pinned above the pass. You walked the inspection sheet against the
        holding racks, confirming each usable tray's stamp and each discard's
        line on the waste log with the tally weights the health department
        likes to see. You verified each substitution's entry names the dish,
        the missing ingredient, and the stand-in — the log the morning chef
        reads before writing tomorrow's family meal, and the same log the
        owner reads monthly with a calculator and a squint.
        
        The building's other accounting must not leak into yours. The bar's
        inventory system you do not manage counts bottles to the pour with
        sensors and its own shrink numbers, reported separately. The
        reservation platform tracks covers and no-shows for the front of
        house, useful to the kitchen only as a rumor of tomorrow's volume.
        And the comped-meal ledger the general manager keeps for VIPs runs on
        hospitality rather than grams — generous, watched, and never a tray,
        a discard, or a substitution in tonight's counts.
        
        A note on the trays still in quarantine-adjacent holding, because
        the space between inspection and service is where kitchens are made
        or broken. The trays the health inspector will bless tomorrow
        morning sit in the walk-in's designated lane, their paperwork
        clipped, their temps logged hourly per the checklist — and per the
        rules that govern tonight's count, they are nothing yet. Not usable,
        not discarded, not substituted; they are pending inspection, and
        pending trays hold no place in the buckets at all until the stamp
        lands. The morning chef will inherit them as the first decision of
        the day, which is exactly how the checklist wants it.
        
        One final cross-check completes the ritual. The requisition sheet
        that opened prep this morning lists what the kitchen asked the
        walk-in and the dry store to yield, and the buckets you close
        tonight — usable, discarded, substituted — must together account for
        every tray that sheet summoned. You run the trace, it closes without
        a gap, and the count files with the specific confidence of a kitchen
        whose books would survive the accountants who once called them
        folklore.
        
        The owner's stake in tonight's numbers is worth a closing thought,
        because the buckets are how a kitchen becomes legible to the person
        signing its invoices. Usable trays are tomorrow's service capacity,
        discards are the purchase order speaking with an accent, and
        substitutions are the menu bending without breaking — read together,
        they tell the story of a night in three numbers that a calculator
        and a squint can verify against the requisition sheet. That is all
        the owner has ever asked of the count, and all the rules have ever
        been for.
        
        The final numbers that matter are the ones the pass reads at family
        meal, and they deserve one last guard tonight — the distinction
        between a substitution and a discard wearing a costume. A
        substitution is a named stand-in serving a named dish; a discard is
        stock gone to the waste log with weight and reason. What must never
        happen is the quiet middle path — unusable stock sliding into
        service under a substitution's paperwork — and the log's insistence
        on both the missing ingredient and the stand-in's name is the fence
        that prevents it. Tonight's substitutions all carry honest pairs,
        the discards carry honest weights, and the count files with the
        kitchen's books as clean as its pans.

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - tray_a: Tray A's use-by is 3 days out (tomorrow-or-later holds) and it sits on the top shelf with no nut container above — no allergen flag and the date passes; answer exactly one word, usable or discard [answer format: a single word in quotes]
        - tray_b: Tray B sits beneath an open nut container so it is flagged, but a nut-free equivalent exists and the tray was remade — a remade tray still ENDS usable (the remake counts as a substitution event, not a different outcome); answer exactly one word, usable or discard [answer format: a single word in quotes]
        - tray_c: Tray C's use-by was yesterday — the date rule overrides everything else regardless of shelf position; answer exactly one word, usable or discard [answer format: a single word in quotes]
        - tray_d: Tray D sits beneath the nut container so it is flagged, but the sunflower-oil equivalent exists and the tray was remade — a remade tray still ENDS usable (remake counts as a substitution event); answer exactly one word, usable or discard [answer format: a single word in quotes]
        - tray_e: Tray E's use-by is today, and today is not tomorrow-or-later — the date rule fails the tray; answer exactly one word, usable or discard [answer format: a single word in quotes]

        OUTPUT CONTRACT — your reply MUST end with exactly 5 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 1280 }
      when:
        after_step_succeeds:
          - save_to:
              - "$table"
              - "./docs/benchmarks/outputs/output/ha-table.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-10.yml --out ./docs/benchmarks/outputs/output/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/ha-table-result.json check ./docs/benchmarks/outputs/output/ha-trace.jsonl hb-10"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/ha-table.txt ./docs/benchmarks/outputs/output/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --stage solve --trace ./docs/benchmarks/outputs/output/ha-trace.jsonl --case hb-10"
              working_dir: "."
              fail_on_error: false

