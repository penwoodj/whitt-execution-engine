      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-45.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - a sample with more than 1 temperature excursions holds for review, excursion means minutes outside band, at the limit ships
        - incomplete paperwork rejects outright, rejection happens before any excursion math
        - band labels travel with the sample but gate nothing tonight

        FACTS:
        - b1 rides the cold band, logged 0 excursions, paperwork complete, b2 rides the cold band, logged 2 excursions, paperwork complete, b3 rides the room band, logged 4 excursions, paperwork incomplete, b4 rides the frozen band, logged 1 excursions, paperwork incomplete

        REPORT SPEC (exact keys, exact types):
        - held: int
        - rejected: int
        - shipped: int
        - cold_band_shipped: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - e1: excursions b1 logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - e2: excursions b2 logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - e3: excursions b3 logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - e4: excursions b4 logged (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - p1: is b1's paperwork complete, one word complete or incomplete. hint: answer with exactly one word copied from the fact line. [answer format: a single word in quotes]
        - p2: is b2's paperwork complete, one word complete or incomplete. hint: answer with exactly one word copied from the fact line. [answer format: a single word in quotes]
        - p3: is b3's paperwork complete, one word complete or incomplete. hint: answer with exactly one word copied from the fact line. [answer format: a single word in quotes]
        - p4: is b4's paperwork complete, one word complete or incomplete. hint: answer with exactly one word copied from the fact line. [answer format: a single word in quotes]
