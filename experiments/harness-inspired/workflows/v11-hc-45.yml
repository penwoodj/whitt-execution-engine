        - b2: b2's band, one word cold room or frozen (copy the word from its fact line). hint: answer with exactly one word copied from the fact line. [answer format: a single word in quotes]
        - b3: b3's band, one word cold room or frozen (copy the word from its fact line). hint: answer with exactly one word copied from the fact line. [answer format: a single word in quotes]
        - b4: b4's band, one word cold room or frozen (copy the word from its fact line). hint: answer with exactly one word copied from the fact line. [answer format: a single word in quotes]
        - xl: the excursion limit (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]

