workflow_id: harness_single_case
name: "Harness-Inspired Single Case"
description: "GEN→CHECK→FIX→JUDGE cascade. Case: hi-str-01"
version: "2.0.0"
author: "Experiment"
tags: [harness, quality-gate, cascade]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_worker:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s01_gen:
      generative_entity: "${models.m_worker}"
      prompt: "Output the word 'dispatcher' reversed. Nothing else."
      model_overrides: { temperature: 0.0, max_tokens: 32 }
      when:
        after_step_succeeds:
          - save_to:
              - "$artifact"
              - "./docs/benchmarks/outputs/output/harness-artifact.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/harness-artifact.txt --criteria experiments/harness-inspired/cases/hi-str-01.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s03_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix
        after_step_fails:
          - log:
              event_fields: [step_name, error_message]
              level: error
          - fail:
              message: "Generation step failed"

    s02_fix:
      generative_entity: "${models.m_worker}"
      prompt: |
        The following output failed automated checks. Fix it.
        Output ONLY the corrected result, nothing else.

        Original output:
        {{step.s01_gen.output}}
      model_overrides: { temperature: 0.0, max_tokens: 32 }
      when:
        after_step_succeeds:
          - save_to:
              - "$artifact"
              - "./docs/benchmarks/outputs/output/harness-artifact.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/harness-artifact.txt --criteria experiments/harness-inspired/cases/hi-str-01.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s03_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s04_end_fail
        after_step_fails:
          - log:
              event_fields: [step_name, error_message]
              level: error
          - fail:
              message: "Fix step failed"

    s03_judge:
      generative_entity: "${models.m_judge}"
      prompt: |
        You are a quality judge. Review this output and rate it PASS or FAIL.

        Task: Reverse the word 'dispatcher'.
        Response: {{bookmarks.artifact}}

        Output ONLY one word: PASS or FAIL.
      model_overrides: { temperature: 0.0, max_tokens: 16 }
      when:
        after_step_succeeds:
          - save_to:
              - "$verdict"
              - "./docs/benchmarks/outputs/output/harness-verdict.txt"
          - log:
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              event_fields: [step_name, error_message]
              level: error

    s04_end_fail:
      generative_entity: "${models.m_worker}"
      prompt: "FAIL"
      model_overrides: { temperature: 0.0, max_tokens: 8 }
      when:
        before_step_starts:
          - fail:
              message: "Deterministic checks failed after fix attempt"
