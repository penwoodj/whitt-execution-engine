workflow_id: harness_v12_hd-46_spoof
name: "Harness v12 SPOOF - hd-46"
description: "DIGEST->GATE->FIX(rescue x3)->AGGREGATE->JUDGE->AUDIT. Case: hd-46 hops=5 route=heavy fix3=always"
version: "10.0.0"
author: "Experiment"
tags: [harness, agentic, v12, digest, rescue3, spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
