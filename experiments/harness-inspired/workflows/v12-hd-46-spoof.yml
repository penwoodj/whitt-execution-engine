    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-46.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - the warranty clock runs only while the desk works, the vendor hold pauses it entirely, paused minutes accrue to the wall clock and never to the warranty clock
        - the desk counts a routing offset toward the deadline, breach reads the warranty clock plus offset strictly past the deadline, margin is deadline minus that sum, reported negative when blown
        - the report wants warranty minutes, wall minutes, the breach flag, and the margin, all whole minutes

        FACTS:
        - the ticket ran 20 working minutes, then a vendor hold paused it for 60 minutes, then 45 more working minutes
        - the deadline is 60 minutes with a 5 minute routing offset
        - the desk quotes neither clock tonight, both derive from the stretches and the hold

        REPORT SPEC (exact keys, exact types):
        - clock_minutes: int
        - wall_minutes: int
        - breached: bool
        - margin_minutes: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - pre: first working stretch in minutes (copy the number from its fact line). hint: *: paused minutes never count against the clock, subtract every pause span before judging breach. [answer format: a whole number]
        - pause: vendor hold in minutes (copy the number from its fact line). hint: *: paused minutes never count against the clock, subtract every pause span before judging breach. [answer format: a whole number]
        - post: second working stretch in minutes (copy the number from its fact line). hint: *: paused minutes never count against the clock, subtract every pause span before judging breach. [answer format: a whole number]
        - sla: deadline in minutes (copy the number from its fact line). hint: *: paused minutes never count against the clock, subtract every pause span before judging breach. [answer format: a whole number]
        - off: routing offset in minutes (copy the number from its fact line). hint: *: paused minutes never count against the clock, subtract every pause span before judging breach. [answer format: a whole number]
        - clk: warranty clock minutes (working stretches only). hint: *: paused minutes never count against the clock, subtract every pause span before judging breach. [answer format: a whole number]
        - wall: wall clock minutes (everything, hold included). hint: *: paused minutes never count against the clock, subtract every pause span before judging breach. [answer format: a whole number]
        - br: breached, true or false (warranty clock plus offset against the deadline word). hint: *: paused minutes never count against the clock, subtract every pause span before judging breach. [answer format: true or false]
        - marg: margin in minutes (deadline minus warranty clock plus offset, negative if blown). hint: *: paused minutes never count against the clock, subtract every pause span before judging breach. [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 9 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
