        next to two of the players, which is cosmetic and has no bearing on
        rating outcomes. For the record the regional ladder rebalance team you
        also do not manage has proposed shifting the floor next season, but that
        proposal is not in effect tonight. Report how many players take a full
        reset, how many receive a calibration placement, how many keep a
        carried-over rating, and how many kept ratings were low enough to need
        raising to the floor.
        
        The seasonal reset ritual exists because of the soft-reset winter,
        a story every ladder administrator retires having told at least
        twice. Three seasons ago the fold rule was new, the floor had just
        been lowered, and a wave of returning casual players — all with
        kept ratings suddenly beneath the new floor — met a population of
        hardened veterans at numbers the casuals had never seen. The
        matchmaking queue became a slaughterhouse for two weeks, the forums
        burned, and the postmortem pinned it on arithmetic nobody had run
        — the fold-to-floor rule was correct but its first application
        coincided with a population shift, and the ladder had no machinery
        for counting who landed where. Tonight's four buckets are that
        machinery in its current, battle-tested form — resets counted
        separately from placements, kept ratings separated from raised
        ones — and the season-open brief reads them in the order the
        postmortem demanded.
        
        Your evening as administrator runs the closing checklist the
        operations binder prescribes. You pulled the season's final match
        counts per player straight from the match ledger rather than the
        client-visible profiles, because the two disagree on edge cases —
        forfeits and remakes count toward the total in the ledger's view,
        which is the view the handbook's thresholds have always meant. You
        cross-checked each calibration series against its completion flag,
        since an abandoned series at four of five games is not a completion
        no matter how well it was going. And you walked each of tonight's
        four players through the handbook's decision ladder one rule at a
        time, in the binder's order — threshold first, calibration second,
        reset last — the sequence that keeps an administrator from granting
        a placement to a player who had already earned a keep.
        
        Around the ladder hums the machinery of a live service, nearly all
        of it irrelevant to tonight's buckets. The spectator overlay you
        do not manage renders provisional badges from its own heuristics,
        and its cosmetic judgments have never matched the handbook's
        definitions — the overlay badges two players tonight, the handbook
        calls one of them kept and the other placed, and both renderings
        are correct in their own universes. The regional rebalance team's
        floor proposal circulates in a design document with comments
        threaded three deep, none of them law until next season's patch
        notes say so. And the anti-smurf detection system runs its own
        inquiries into account histories in the background — suspicions,
        shadow scores, and a review queue for a team you have never met —
        none of which alters what the match ledger says a player earned,
        which is the only thing your four buckets were ever built to
        count.
        
        A note on the calibration series and its edge, because edges are
        where eligibility arithmetic proves itself. The handbook counts a
        calibration as completed only when the ledger shows five games
        finished with the series flag set — a series abandoned at four
        games, however brilliant, is not a placement and not a keep; it
        is simply unfinished, and unfinished series have no bucket at
        all. Mira's series shows five finished with the flag set, which
        is why tonight's arithmetic never once wobbles on her line. The
        distinction matters more every season as returning casuals test
        the boundary — players who begin calibration, abandon it at four
        games, and expect the handbook to round up in their favor. The
        handbook does not round. The ledger's flag column is the whole
        conversation, and tonight it says what it says.
        
        The administrator's final act each season-close is the bucket
        reconciliation the operations binder mandates. The four buckets
        must sum to the number of players processed — every player lands
        in exactly one disposition, no player in two, none in none — and
        you walk the four lines against the roster count before the
        season-open brief locks. Tonight's arithmetic closes on the
        first pass, as it has every season since the soft-reset winter
        taught the binder's authors to insist on the check; the brief
        files with the ladder's population described exactly, and the
        new season opens on numbers the forums will argue about for a
        week and the matchmaker will simply obey.
        
        The forums will read tonight's buckets by morning, and the
        administrator's craft is making sure they find nothing to
        willfully misread. Every season-close brings a thread that
        recounts a friend's rating fate with outrage and imprecision —
        the kept player described as reset, the placement described as
        punishment — and the operations binder's quiet defense is that
        the report's four numbers carry the handbook's own vocabulary,
        defined in its own terms, defensible line by line. Outrage
        thrives on ambiguity; the buckets are the opposite of
        ambiguity; and the thread that starts angry usually ends with
        a player quoting the handbook back at the original poster,
        which the administrators consider the system's finest
        feature.
        
        A closing thought on the floor itself, the number the rebalance
        team wants to move. Twelve hundred has been the ladder's floor
        for as long as most players have played, and the proposal to
        raise it circulates with projections attached — population
        curves, retention models, a spreadsheet the analysts defend
        in meetings. The floor tonight is what the floor has been, and
        tonight's soft-reset bucket is zero partly because of where
        the floor stands; move it, and next season's closing walk
        tells a different story in that column. The administrator
        files tonight's numbers knowing they are true for this floor,
        this handbook, this season — the only jurisdiction a count
        was ever meant to cover.
        
        And so the season closes the way seasons now close — ledger
        pulled, ladder walked, four players and four buckets and a
        floor that held its meaning through every line of the
        arithmetic. Volkan keeps what he ground for, Mira carries what
        the series earned her, Joona and Petra answer for the matches
        they did not play under the same rule they would have claimed
        under had the counting gone the other way. The brief files,
        the forums wake, the rebalance team's proposal waits in its
        threaded comments for a season that is no longer this one.
        Tomorrow the ladder resets its clock and not its book — the
        book is permanent, the book is the point — and the new
        season's first match will find the ladder exactly as
        tonight's four numbers left it.
        
        The last column worth a sentence is soft_reset, because its zero
        tonight is the floor's arithmetic speaking. A kept rating below
        twelve hundred rises to twelve hundred — that is the fold the
        soft-reset winter installed — and the column counts the risers.
        Volkan's kept eighteen hundred stands above the floor by six
        hundred, so the column records nothing; had the season closed
        differently, the same player, the same threshold, the same rule
        would fill it. The zero is not an absence of rule but a presence
        of margin, and the brief's readers know which one they are
        looking at.

