workflow_id: harness_v7_hb-20
name: "Harness v7 - hb-20"
description: "TABLE->GATE->AGGREGATE->JUDGE-V2->LEAK-AUDIT. Case: hb-20 hops=5 route=heavy"
version: "7.0.0"
author: "Experiment"
tags: [harness, agentic, v7, routing, snapshot, meter, audit]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-20.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

                You are the floor manager at an escape-room venue scheduling the evening
        block, and three rooms are booked solid. The staffing rulebook is firm
        about coverage. Every operating room must have exactly one guide and
        exactly one safety monitor on station before the first team enters. A
        staff member certified for both roles — a dual cert — may hold both
        positions in the same room simultaneously and run it alone, which the
        venue tracks because it frees a body for another room. A staff member
        certified for only one role can never cover the other, no matter how the
        schedule pleads. No staff member may be on station in two rooms at once.
        Four staff are on tonight's roster. Kai holds a guide certification plus
        the dual certification. Lena is certified for safety monitoring only.
        Marco carries the full dual certification. Nia is a guide only. Three
        rooms are booked this evening — the pirate cabin, the cold-war bunker,
        and the pharaoh's tomb — and the planner has already penciled in an
        assignment that satisfies every rule it can: Kai takes the guide station
        in the pirate cabin with Lena on safety beside him, Marco single-handedly
        runs the cold-war bunker holding both roles himself, and Nia guides the
        pharaoh's tomb with the safety station still unfilled because the roster
        has no one left to take it. The venue's snack bar you do not manage also
        needs a warm body tonight, and that demand never draws from the roster's
        certified pool. A corporate team-building vendor you also do not manage
        emails about adding a fourth room next month, which changes nothing about
        tonight's counts. Report how many rooms are fully covered per the rules,
        how many rooms are run by a single dual-certified staff member alone, how
        many distinct staff are working as guides, and how many rooms are short
        a required position.
        
        The staffing rulebook the venue runs tonight was purchased at a
        price the industry pays too often, which is why the owners tell
        the story to every new hire themselves. Two venues ago, in the
        era before certification mattered, a room ran with one staffer
        holding a laminated card that said guide on one side and safety
        on the other — and when a team member panicked in the dark and
        the door jammed in the same minute, that single staffer could be
        in only one place. The injuries were minor; the lawsuit was not;
        and the settlement's terms included a clause the owners now
        treat as sacred text — every room, every session, two stations,
        no exceptions, with dual certification as the only lawful way
        for one person to hold both. The roster's certifications hang
        framed by the schedule board, and tonight's penciled assignment
        is the rulebook made visible.
        
        Your evening as floor manager has been the schedule's quiet
        defense. You built tonight's coverage the way the rulebook's
        appendix teaches — dual certs placed first, because every dual
        placed alone frees a body the roster cannot otherwise spare —
        and you checked each assignment against the certification frames
        yourself rather than the scheduling software's color codes, since
        the software's last update renamed a certification category and
        nobody has forgiven it. Where the roster ran short you recorded
        the shortage rather than papering it, because the rulebook's
        honesty clause is the one section the owners wrote in
        unwavering prose — a room short a station is a room that does
        not open, and a manager who hides a shortage is a manager the
        industry remembers.
        
        Around the venue hums the machinery of a Friday night, most of
        it invisible to the staffing tally. The snack bar's staffing
        need is real and unsatisfied tonight, and the general manager's
        texts about it are a study in escalating diplomacy — but the
        certified pool is the certified pool, and its boundaries are the
        one geometry the floor manager cannot bend. The corporate
        vendor's fourth-room email proposes a future that would strain
        the roster's geometry further, which is why the owners read it
        twice and scheduled a meeting. And the hint-timer system, the
        cameras, the ambient soundtrack that whispers in the pharaoh's
        tomb — all of it watched, all of it real, and none of it a
        station in a room tonight's buckets were built to count.
        
        A note on the honesty clause and its cost, because shortage is
        where staffing arithmetic proves itself. A room short a station
        is revenue the venue declines, and the floor manager who records
        the shortage declines it publicly, in ink, with the general
        manager's snack-bar diplomacy still ringing in the same
        pocket. The temptation is always the laminated card of the old
        era — one staffer, two titles, a room that opens — and the
        rulebook's answer is the settlement's answer, which is no. The
        pharaoh's tomb stands dark tonight with a guide ready and no
        monitor to pair, and the count records that darkness as exactly
        what it is — one room short, honestly counted, the rulebook
        obeyed at the price it was written to extract.
        
        The floor manager's final act each night is the coverage walk
        the rulebook's appendix mandates. Each covered room is visited,
        each dual-staffed room confirmed against the certification
        frames, each guide on station counted by name against the
        roster — three checks, one walk, the schedule's whole truth
        verified against the building's actual staffing before the
        night's report locks. Tonight's walk closes on the first pass;
        the tally files with the evening's whole truth in four
        numbers, and the morning's owners will read them the way
        owners read numbers bought at settlement prices — carefully,
        gratefully, and without ever once suggesting the arithmetic
        bend.
        
        The owners will read tonight's tally over tomorrow's opening
        prep, and the floor manager's craft is making sure the four
        numbers arrive without footnotes that soften them. A short
        room is a short room; the report's line says so in the
        rulebook's own words, and the meeting it triggers — schedule,
        roster, the vendor's fourth room — will argue about futures,
        not about tonight's fact. Numbers that arrive softened
        breed schedules that bend, and schedules that bend end at
        settlements; the honesty clause is the cheapest insurance
        the venue has ever bought, and tonight's tally is the
        premium paid on schedule.
        
        A closing thought on Marco in the bunker, the dual cert
        running a room alone tonight. The rulebook made his
        certification the roster's fulcrum and made his stamina the
        evening's quiet dependency — the walkthrough found his room
        answered, his hints timed, his safety checks initialed in
        the handwriting of someone conserving energy precisely
        because the schedule spends it. The dual-staffed bucket
        holds a one tonight because of him, the covered count holds
        two because of him, and the morning's scheduling question —
        the one the vendor's email will force — is how many Marcos
        a four-room future would need. Tonight's answer is filed,
        honest, and already framing the question the owners will
        spend next week answering.
        
        And so the evening closes the way evenings now close —
        certifications framed, stations doubled or dark, and the
        settlement's sacred text holding every line of the schedule
        to the standard it was written to extract. Two rooms open
        because the roster allowed it, one room dark because honesty
        required it, Marco alone in the bunker spending stamina the
        count will spend tomorrow's meeting deciding how to
        replicate. The tally files its four numbers, the lock-up
        walk confirms what the walkthrough confirmed, and the
        venue's past — the laminated card, the jammed door, the
        clause — keeps its watch over another night it did not
        have to repeat.
        
        The last number worth a sentence is guides_used, because its
        three counts people and not stations. Kai guiding beside
        Lena, Marco guiding while monitoring, Nia guiding alone in a
        room the safety station darkens — the roster's guide-certified
        population, fully spent, every one of them doing the job the
        frames by the schedule board certify. The count does not say
        whether the guiding was easy or the rooms were kind; it says
        the certification the settlement purchased was used to its
        last holder tonight, and tomorrow's schedule begins from
        exactly that fact.
        
        One more paragraph closes the gap between the count and the
        evening it serves. The last team debriefed an hour ago,
        still arguing about the tomb's final cipher, and the guide
        who darkened that room's lights did so with the particular
        professional neutrality of staff who know the schedule's
        arithmetic is not theirs to charm. The two rooms that ran
        will generate tonight's reviews, the one that did not will
        generate tomorrow's scheduling meeting, and both are the
        system functioning — venues do not fail by having short
        rooms, the owners say, only by hiding them. Four numbers,
        three guides, two covered rooms, one honest shortage — the
        evening's whole truth in a single line of the log, and the
        lock-up walk confirms it in ink.

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - room1_covered: Room 1 (pirate cabin) has Kai guiding plus Lena on safety — guide plus safety on station means fully covered; covered? (1 if yes, 0 if no) [answer format: a whole number]
        - room2_covered: Room 2 (bunker) is run by Marco alone holding both roles under his dual cert — a dual cert satisfies both stations; covered? (1 if yes, 0 if no) [answer format: a whole number]
        - room3_covered: Room 3 (tomb) has Nia guiding but no safety monitor — a room missing a required position is not covered; covered? (1 if yes, 0 if no) [answer format: a whole number]
        - room2_dual_alone: Room 2 is staffed by one dual-certified person (Marco) running both roles alone — that is the definition of dual_staffed; dual-staffed? (1 if yes, 0 if no) [answer format: a whole number]
        - kai_guides: Kai is on station as the guide in room 1 — he holds the guide cert; counts as a working guide? (1 if yes, 0 if no) [answer format: a whole number]
        - marco_guides: Marco holds both roles in room 2, including the guide role — he counts as a working guide even while also monitoring; counts? (1 if yes, 0 if no) [answer format: a whole number]
        - nia_guides: Nia is on station as the guide in room 3 — guide-only cert fills the guide station; counts? (1 if yes, 0 if no) [answer format: a whole number]
        - lena_guides: Lena is safety-only certified and works the safety station in room 1 — safety-only staff never count as guides; counts as a guide? (1 if yes, 0 if no) [answer format: a whole number]
        - room3_short: Room 3 has no safety monitor on station because the roster is exhausted — missing a required position makes the room short; short? (1 if yes, 0 if no) [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 9 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 1280 }
      when:
        after_step_succeeds:
          - save_to:
              - "$table"
              - "./docs/benchmarks/outputs/output/ha-table.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-20.yml --out ./docs/benchmarks/outputs/output/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/ha-table-result.json check ./docs/benchmarks/outputs/output/ha-trace.jsonl hb-20"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/ha-table.txt ./docs/benchmarks/outputs/output/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --stage solve --trace ./docs/benchmarks/outputs/output/ha-trace.jsonl --case hb-20"
              working_dir: "."
              fail_on_error: false

