workflow_id: harness_v7_hb-11
name: "Harness v7 - hb-11"
description: "TABLE->GATE->AGGREGATE->JUDGE-V2->LEAK-AUDIT. Case: hb-11 hops=6 route=heavy"
version: "7.0.0"
author: "Experiment"
tags: [harness, agentic, v7, routing, snapshot, meter, audit]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-11.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

                You are the gate supervisor for the 18:40 regional flight 482, which the
        operations center cancelled seventeen minutes before boarding because of
        a mechanical write-up on the aircraft's hydraulic sensor — nothing
        dramatic, but nothing the evening crew will sign off either. Six
        ticketed passengers are standing at your gate counting on you, and the
        rebooking rules you are about to apply come from the passenger-rights
        handbook, chapter four, which the airline rewrote after the viral video
        of a certain Tuesday in spring. You have the manifest in front of you.
        Walk it the way the audit will.
        
        The rebooking priority rule. The airline rebooks onto the next available
        flight — the 21:15, same route, four seats remaining as of cancellation.
        Priority is lexicographic: status tier first, then check-in time within
        tier. Tier order is gold, then silver, then no status. Within a tier, the
        passenger who checked in earlier outranks the one who checked in later.
        Confirmed seats on the 21:15 go strictly in this priority order until the
        four seats are gone. Passengers who do not make the confirmed cut go to
        the standby lane, ordered by the same priority rules, and standby is
        governed by its own gate.
        
        The standby rule. Standby boarding on the 21:15 is permitted only while
        that flight's load factor is under one hundred percent. At cancellation
        time the 21:15 is at ninety-seven percent, so the standby lane is open.
        Standby passengers board in priority order, one at a time, but boarding
        only actually happens while the load stays under one hundred; the moment
        load reaches one hundred, the lane seals for the night, and everyone left
        in it rolls to tomorrow morning's first departure. During boarding
        tonight, the 21:15 closes out at exactly one hundred percent load before
        any standby passenger is called.
        
        The volunteer rule. At any point after the confirmed list is set, a
        confirmed passenger may volunteer their seat in exchange for a travel
        voucher. Volunteering frees one confirmed seat, which is immediately
        offered to the highest-priority passenger not yet confirmed. The
        volunteer themselves moves to the standby lane, retaining their tier
        priority there — the voucher is compensation for the risk, not a
        demotion. Tonight, exactly one passenger volunteers, and the timing
        matters: the volunteer steps up after the initial confirmed list is
        posted but before standby boarding begins.
        
        Now the manifest, six passengers, with tier and check-in times from the
        system. Passenger P1, gold tier, checked in at 06:10 this morning — an
        airport person, apparently. Passenger P2, gold tier, checked in at 06:45.
        Passenger P3, silver tier, checked in at 05:30, the earliest check-in of
        the entire list, worth noting and worth less than either gold. Passenger
        P4, silver tier, checked in at 07:15. Passenger P5, no status, checked in
        at 05:50. Passenger P6, no status, checked in at 08:05.
        
        Apply the rules in order. Tier first: the two golds, P1 and P2, outrank
        everyone, and between them P1's 06:10 beats P2's 06:45. Then the two
        silvers, P3 and P4, P3's 05:30 beating P4's 07:15. Four seats, four
        names: P1, P2, P3, P4 are confirmed on the 21:15. P5 and P6, the no-
        status pair with P5's 05:50 ahead of P6's 08:05, populate the standby
        lane in that order, which is open, because ninety-seven is under one
        hundred.
        
        Then the volunteer moment arrives. P2 — gold, confirmed, apparently with
        a flexible evening and an eye on the voucher — steps up and volunteers.
        His seat frees. The freed confirmed seat goes to the highest-priority
        unconfirmed passenger, which is P5, who is promoted from standby lane to
        confirmed list, an upgrade she will not stop mentioning. P2 takes his
        voucher and moves into the standby lane, carrying his gold priority with
        him, so the lane now reads P2 first, then P6.
        
        Then boarding. The 21:15 fills with its confirmed passengers and its
        other booked travelers, and the load factor reaches one hundred percent —
        full, sealed, done — before the gate agent calls the first standby name.
        The standby lane closes with both its occupants still standing at the
        podium. P2 and P6 roll to tomorrow morning's 06:00 departure, P2 with a
        voucher and a story, P6 with neither.
        
        Three adjacent facts that must stay out of the arithmetic. The ramp
        crew's shift log records five belt-loader movements during the
        rebooking; ramp operations belong to the station manager, whom you do
        not manage, and belt-loader movements have never appeared in a
        passenger-rights audit. The 21:15 also carried nineteen through-
        passengers connecting from the cancelled northbound — they were never
        displaced from the 21:15, so they enter no list here. And the voucher
        budget line, which finance tracks per quarter, counts money, not
        passengers.
        
        The post-irregularity report needs, for these six passengers: how many
        flew tonight on the 21:15 confirmed, how many standby passengers boarded,
        how many were bumped to tomorrow's first departure, and how many
        volunteered for vouchers.
        
        The rebooking desk's rulebook was rewritten after the festival-weekend
        collapse two summers ago, and every gate agent can recite the turning
        point. A storm cell rolled through the hub at six in the evening,
        four flights went irregular at once, and the desk — then staffed by
        two agents working from a shared spreadsheet and goodwill — processed
        the surge by memory and improvisation. Passengers were promised
        seats that had already been given away, volunteers were thanked for
        seats they never surrendered, and the station manager spent the
        following week composing apology letters with vouchers attached.
        The rules in force tonight are the direct descendants of that
        letters-and-vouchers week — every passenger moves through exactly
        one disposition, every count lands in exactly one bucket, and nobody
        improvises arithmetic at the counter again.
        
        Your shift tonight has been the quiet application of those rules to
        the evening's irregular operation. You worked the passenger list in
        boarding order, confirming before each disposition that the bucket
        you were writing into matched the rule the passenger's situation
        actually met — confirmed means a seat occupied and a flight departed,
        standby means the list holds a name no seat has matched, tomorrow
        means the rebooking holds a confirmed seat on a later flight, and
        volunteered means a passenger traded an seat for the voucher and the
        promise of the list. Each entry carried the flight number and a
        timestamp, because the morning's irregular-operations report reads
        those fields before it reads anything else.
        
        The terminal's other counting systems hum along beside the desk
        without ever touching the buckets. The standby-list displays you do
        not manage show rolling queue positions with their own refresh
        cadence, informational to passengers and invisible to the report.
        The voucher ledger tracks the station's liability for every travel
        credit ever issued, a finance instrument reconciled monthly against
        a different calendar entirely. And the crew scheduling system runs
        its own irregular operations in parallel for staff, repositioning
        pilots and flight attendants with a logic that rhymes with yours but
        belongs to a wholly separate bookkeeping — real numbers, watched by
        a different morning briefing, never a passenger in your count.
        
        A note on the volunteer who nearly counted twice, because edge
        passengers are where honest buckets prove themselves. The passenger
        who surrendered a seat for a voucher also held a rebooking on
        tomorrow's first departure — a natural reading would file the
        passenger as both volunteered and rebooked-to-tomorrow, doubling the
        person in the census. The rulebook's definition is the guard — the
        disposition follows the passenger's action at the gate, and the
        action was the surrender; the tomorrow seat is the consideration
        received for it, not a second state to tally. One passenger, one
        bucket, one entry with a flight number and a timestamp, and the
        morning's report inherits a census that sums to exactly the number
        of shoes that walked the jet bridge tonight.
        
        One final sweep completes the desk's night. The boarding scanner's
        headcount, the gate reader's tally, and the disposition ledger must
        all agree on the one number that anchors everything — the passengers
        who actually flew — and you walk the three sources in parallel
        before the report locks, because the station manager's first
        question every morning is whether the desk's census survived the
        cross-read. It has survived every night since the rulebook, and it
        survives tonight; the ledger closes with the small professional
        satisfaction of a count that three machines and one tired agent all
        describe identically, and the morning brief will carry exactly the
        shape of the evening the buckets hold.
        
        The station's veterans close every irregular night the same way,
        with a glance at the departures board going dark one flight at a
        time, and tonight is theirs and yours. The last regional jet pushed
        back twenty minutes ago; the jet bridge stands empty; the buckets
        hold the evening's whole truth in four small numbers that the
        morning will read before the first coffee finishes brewing. There
        is an art to ending a shift cleanly — counters balanced, ledger
        locked, nothing left in the hand — and the rulebook's greatest gift
        to the desk is that the art requires no genius, only the patience
        to have followed the rules while tired. The report files, the lamp
        goes off, and tomorrow's first departure inherits the counts.

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - p1_outcome: P1 is gold tier, checked in 06:10, confirmed onto the next flight and departed on it — the disposition follows what actually happened at the gate; answer exactly one word from flew, standby, tomorrow, volunteered [answer format: a single word in quotes]
        - p2_outcome: P2 is gold tier who surrendered the seat for a voucher, and with the standby lane closed at 97 percent load the rebooking carries to tomorrow's flight — the surrender is the action, tomorrow is where the passenger ends; answer exactly one word from flew, standby, tomorrow, volunteered [answer format: a single word in quotes]
        - p3_outcome: P3 is silver tier, checked in 05:30, confirmed onto the next flight and departed on it; answer exactly one word from flew, standby, tomorrow, volunteered [answer format: a single word in quotes]
        - p4_outcome: P4 is silver tier, checked in 07:15, confirmed onto the next flight and departed on it; answer exactly one word from flew, standby, tomorrow, volunteered [answer format: a single word in quotes]
        - p5_outcome: P5 is no-tier, moved UP into the seat the volunteer freed when boarding completed, and departed on the flight — a promoted passenger who boards has flown; answer exactly one word from flew, standby, tomorrow, volunteered [answer format: a single word in quotes]
        - p6_outcome: P6 is no-tier, missed confirmation, and the standby lane is closed because the load hit 100 percent — the rebooking carries to tomorrow; answer exactly one word from flew, standby, tomorrow, volunteered [answer format: a single word in quotes]

        OUTPUT CONTRACT — your reply MUST end with exactly 6 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 1280 }
      when:
        after_step_succeeds:
          - save_to:
              - "$table"
              - "./docs/benchmarks/outputs/output/ha-table.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-11.yml --out ./docs/benchmarks/outputs/output/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/ha-table-result.json check ./docs/benchmarks/outputs/output/ha-trace.jsonl hb-11"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/ha-table.txt ./docs/benchmarks/outputs/output/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --stage solve --trace ./docs/benchmarks/outputs/output/ha-trace.jsonl --case hb-11"
              working_dir: "."
              fail_on_error: false

