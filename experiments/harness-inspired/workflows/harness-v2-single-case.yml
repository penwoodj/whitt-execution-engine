workflow_id: harness_v2_single_case
name: "Harness v2 - Full Quality Gate Cascade"
description: "SCREEN->GEN->CHECK->FIX(x3)->JUDGE. Case: hi-str-01"
version: "2.0.0"
author: "Experiment"
tags: [harness, quality-gate, cascade, v2]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_worker:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_worker}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py experiments/harness-inspired/cases/hi-str-01.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
        after_step_succeeds:
          - log:
              event_fields: [step_name, duration_ms]
              level: info

    s01_gen:
      generative_entity: "${models.m_worker}"
      prompt: |
        You are a precise task executor. Follow instructions exactly.

        Format this contact info as a single-line comma-separated string:
        Name: Jane Doe
        Email: jane@example.com
        Phone: 555-0123
        City: Austin
        Output ONLY the formatted string, nothing else.
      model_overrides: { temperature: 0.1, max_tokens: 128 }
      when:
        after_step_succeeds:
          - save_to:
              - "$artifact"
              - "./docs/benchmarks/outputs/output/harness-artifact.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/harness-artifact.txt --criteria experiments/harness-inspired/cases/hi-str-01.yml --out ./docs/benchmarks/outputs/output/harness-check-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s05_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/harness-check-result.json check ./docs/benchmarks/outputs/output/harness-trace.jsonl"
              working_dir: "."
              fail_on_error: false
        after_step_fails:
          - log:
              event_fields: [step_name, error_message]
              level: error
          - fail:
              message: "Generation step failed"

    s02_fix_1:
      generative_entity: "${models.m_worker}"
      prompt: |
        You are a format fixer. The output failed automated checks. Fix it.
        Output ONLY the corrected result, nothing else.

        Original output:
        {{step.s01_gen.output}}

        Check failures:
        {{bookmarks.check_failures}}
      model_overrides: { temperature: 0.0, max_tokens: 128 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/get-failures.py ./docs/benchmarks/outputs/output/harness-check-result.json"
              working_dir: "."
              fail_on_error: false
          - append_to:
              - "$check_failures"
        after_step_succeeds:
          - save_to:
              - "$artifact"
              - "./docs/benchmarks/outputs/output/harness-artifact.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/harness-artifact.txt --criteria experiments/harness-inspired/cases/hi-str-01.yml --out ./docs/benchmarks/outputs/output/harness-check-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s05_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s03_fix_2
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/harness-check-result.json fix_1 ./docs/benchmarks/outputs/output/harness-trace.jsonl"
              working_dir: "."
              fail_on_error: false
        after_step_fails:
          - fail:
              message: "Fix attempt 1 failed"

    s03_fix_2:
      generative_entity: "${models.m_worker}"
      prompt: |
        You are a format fixer. Output failed AGAIN. Fix attempt 2 of 3.
        Output ONLY the corrected result, nothing else.

        Previous attempt:
        {{step.s02_fix_1.output}}

        Check failures:
        {{bookmarks.check_failures}}
      model_overrides: { temperature: 0.0, max_tokens: 128 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/get-failures.py ./docs/benchmarks/outputs/output/harness-check-result.json"
              working_dir: "."
              fail_on_error: false
          - append_to:
              - "$check_failures"
        after_step_succeeds:
          - save_to:
              - "$artifact"
              - "./docs/benchmarks/outputs/output/harness-artifact.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/harness-artifact.txt --criteria experiments/harness-inspired/cases/hi-str-01.yml --out ./docs/benchmarks/outputs/output/harness-check-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s05_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s04_fix_3
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/harness-check-result.json fix_2 ./docs/benchmarks/outputs/output/harness-trace.jsonl"
              working_dir: "."
              fail_on_error: false
        after_step_fails:
          - fail:
              message: "Fix attempt 2 failed"

    s04_fix_3:
      generative_entity: "${models.m_worker}"
      prompt: |
        You are a format fixer. Output failed AGAIN. FINAL attempt 3 of 3.
        Output ONLY the corrected result, nothing else.

        Previous attempt:
        {{step.s03_fix_2.output}}

        Check failures:
        {{bookmarks.check_failures}}
      model_overrides: { temperature: 0.0, max_tokens: 128 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/get-failures.py ./docs/benchmarks/outputs/output/harness-check-result.json"
              working_dir: "."
              fail_on_error: false
          - append_to:
              - "$check_failures"
        after_step_succeeds:
          - save_to:
              - "$artifact"
              - "./docs/benchmarks/outputs/output/harness-artifact.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/harness-artifact.txt --criteria experiments/harness-inspired/cases/hi-str-01.yml --out ./docs/benchmarks/outputs/output/harness-check-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s05_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/harness-check-result.json fix_3 ./docs/benchmarks/outputs/output/harness-trace.jsonl"
              working_dir: "."
              fail_on_error: false
        after_step_fails:
          - fail:
              message: "Fix attempt 3 failed"

    s05_judge:
      generative_entity: "${models.m_judge}"
      prompt: |
        You are a quality judge. Evaluate the response against the task.
        Be specific about what is correct or wrong.

        Task: Reverse the word dispatcher.
        Response: {{bookmarks.artifact}}

        Output EXACTLY this format (3 lines):
        VERDICT: PASS or FAIL
        REASON: one sentence explaining why
        SCORE: 1-10
      model_overrides: { temperature: 0.0, max_tokens: 128 }
      when:
        after_step_succeeds:
          - save_to:
              - "$verdict"
              - "./docs/benchmarks/outputs/output/harness-verdict.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-judge.py ./docs/benchmarks/outputs/output/harness-verdict.txt ./docs/benchmarks/outputs/output/harness-trace.jsonl"
              working_dir: "."
              fail_on_error: false
          - log:
              event_fields: [step_name, duration_ms, token_count]
              level: info

    s06_end_fail:
      generative_entity: "${models.m_worker}"
      prompt: "FAIL"
      model_overrides: { temperature: 0.0, max_tokens: 8 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-append.py ./docs/benchmarks/outputs/output/harness-trace.jsonl end_fail fail"
              working_dir: "."
              fail_on_error: false
          - fail:
              message: "All fix attempts exhausted"
