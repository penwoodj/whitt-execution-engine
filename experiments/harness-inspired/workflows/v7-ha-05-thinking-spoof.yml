workflow_id: harness_v7_ha-05-thinking_spoof
name: "Harness v7 SPOOF - ha-05-thinking"
description: "TABLE->GATE->AGGREGATE->JUDGE-V2->LEAK-AUDIT. Case: ha-05 hops=6 route=heavy"
version: "7.0.0"
author: "Experiment"
tags: [harness, agentic, v7, routing, snapshot, meter, audit ,spoof, thinking]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Thinking-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-4B-Thinking-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-05.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

                You enforce tonight's token budget for one case's quality cascade. The case
        runs stages in order: solve, fix1, fix2, fix3. Hard rules: the stage chain
        stops at the first passing deterministic check — every later fix stage is
        skipped and costs nothing. The judge stage runs only after a pass, once,
        costing its flat price. If the projected total (all stages that would really
        run, judge included) would exceed the 4000-token budget, the judge is
        skipped and the case is marked UNVERIFIED. Tonight's costs: solve 1200
        tokens, fix1 900, fix2 800, fix3 700, judge 500. This run: solve failed,
        fix1 failed, fix2 passed, and fix3 plus everything after the pass followed
        the stop rule. A trace logger you do not manage writes shell-side logs that
        cost zero model tokens. Report the tokens actually spent, how many fix
        stages were skipped by the stop rule, and whether the case could be judge-
        verified. Output ONLY this JSON with exactly these keys:
        {"spend": N, "fixes_skipped": N, "verified": B}.

        THINK FIRST inside <think></think>. Reason step by step per entity.
        BUDGET: when near completion, verify each row once more before
        ending your think block. Then output the table.
        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.
        Then output ONLY these lines, one per entity, nothing else:
        ENTITY <id> | <answer>

        Entities:
        - stage_solve: tokens spent on solve (ran)
        - stage_fix1: tokens spent on fix1 (ran)
        - stage_fix2: tokens spent on fix2 (ran)
        - stage_fix3: tokens spent on fix3 (skipped)
        - stage_judge: tokens spent on judge (ran)
      model_overrides: { temperature: 0.1, max_tokens: 2048 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/ha-05-solve-wind0.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-05.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json check ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-05"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage solve --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case ha-05"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s02_fix_1:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: correction specialist. Entity table failed checks. Fix rows.

        Failed cells (id + your observed value, correct values withheld):
        {{bookmarks.cell_feedback}}

        Prior table:
        {{bookmarks.table}}

        METHOD: re-derive each failed entity from task rules. Output ONLY
        the full corrected table: one ENTITY line per entity.
      model_overrides: { temperature: 0.0, max_tokens: 2048 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/ha-05-fix_1-wind0.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-05.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s03_fix_2
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json fix_1 ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-05"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.fix_1.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage fix_1 --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case ha-05"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s03_fix_2:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: escalation solver. Two attempts wrong. Rebuild table from scratch.

        Original task:
                You enforce tonight's token budget for one case's quality cascade. The case
        runs stages in order: solve, fix1, fix2, fix3. Hard rules: the stage chain
        stops at the first passing deterministic check — every later fix stage is
        skipped and costs nothing. The judge stage runs only after a pass, once,
        costing its flat price. If the projected total (all stages that would really
        run, judge included) would exceed the 4000-token budget, the judge is
        skipped and the case is marked UNVERIFIED. Tonight's costs: solve 1200
        tokens, fix1 900, fix2 800, fix3 700, judge 500. This run: solve failed,
        fix1 failed, fix2 passed, and fix3 plus everything after the pass followed
        the stop rule. A trace logger you do not manage writes shell-side logs that
        cost zero model tokens. Report the tokens actually spent, how many fix
        stages were skipped by the stop rule, and whether the case could be judge-
        verified. Output ONLY this JSON with exactly these keys:
        {"spend": N, "fixes_skipped": N, "verified": B}.

        Failed cells (id + observed, withheld correct):
        {{bookmarks.cell_feedback}}

        METHOD: discard prior attempts. Re-derive EVERY entity answer from
        the rules. Output ONLY the full table: one ENTITY line per entity.
      model_overrides: { temperature: 0.0, max_tokens: 2560 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/ha-05-fix_2-wind0.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-05.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json fix_2 ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-05"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.fix_2.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage fix_2 --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case ha-05"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s04_aggregate:
      generative_entity: "${models.m_heavy}"
      prompt: "deterministic-aggregate-noop"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/aggregate.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-05.yml --table-result ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json --out ./docs/benchmarks/outputs/output/spoof-v7/ha-final.json"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-final.json --criteria /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-05.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-final-check.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s05_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-final-check.json final ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-05"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s05_judge:
      generative_entity: "${models.m_judge}"
      prompt: |
        ROLE: blind auditor. See only task + result. No author knowledge.

        Task objective: Compute cascade spend under stop-rule and projected-budget rule.
        Result: {{bookmarks.final_json}}

        Answer EXACTLY 6 lines, nothing else:
        KEYS: yes or no
        VALUES: yes or no
        FORMAT: yes or no
        VERDICT: PASS or FAIL
        REASON: one sentence
        SCORE: 1-10

        VERDICT must be PASS only if all three of KEYS, VALUES, FORMAT are yes.
      model_overrides: { temperature: 0.0, max_tokens: 160 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-verdict.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/ha-05-judge.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-judge.py ./docs/benchmarks/outputs/output/spoof-v7/ha-verdict.txt ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-05"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s06_end_fail:
      generative_entity: "${models.m_heavy}"
      prompt: "FAIL"
      model_overrides: { temperature: 0.0, max_tokens: 8 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/failflag.py --result ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json --final-check ./docs/benchmarks/outputs/output/spoof-v7/ha-final-check.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s07_fail_trace
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s08_audit
          - skip_step: true

    s07_fail_trace:
      generative_entity: "${models.m_heavy}"
      prompt: "trace-only"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-append.py ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl end_fail fail case=ha-05"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '1 == 1'
                then: s08_audit

    s08_audit:
      generative_entity: "${models.m_heavy}"
      prompt: "leak-audit-noop"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/leak-audit.py --run-dir ./docs/benchmarks/outputs/output/spoof-v7 --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-05.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s09_audit_pass
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s10_audit_leak
          - skip_step: true

    s09_audit_pass:
      generative_entity: "${models.m_heavy}"
      prompt: "audit-pass-trace"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-append.py ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl audit pass case=ha-05"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '1 == 1'
                then: s_end

    s10_audit_leak:
      generative_entity: "${models.m_heavy}"
      prompt: "audit-leak-trace"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-append.py ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl audit fail leak=true case=ha-05"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '1 == 1'
                then: s_end

    s_end:
      generative_entity: "${models.m_heavy}"
      prompt: "term"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - skip_step: true
