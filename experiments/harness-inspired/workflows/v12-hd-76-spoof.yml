    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-76.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - a desk counts as a full month only when strictly past 30 active days, partial months prorate as whole cents rounded up, ceil, never round down
        - proration for a desk is its active days times its monthly rate, divided by 30, rounded up to a whole cent per desk
        - the report needs the full-month desk count, the largest single desk charge, and the total proration in whole cents

        FACTS:
        - quay-7 ran 9 active days at 6000 whole cents per 30 days, quay-8 ran 44 active days at 12000 whole cents per 30 days, quay-9 ran 30 active days at 9000 whole cents per 30 days
        - every desk above is billed on the same 30-day convention tonight
        - the per-desk prorated charges work out to quay-7 charges 1800 whole cents quay-8 charges 17600 whole cents quay-9 charges 9000 whole cents when the rule is applied faithfully

        REPORT SPEC (exact keys, exact types):
        - seats_full_month: int
        - largest_seat_charge_cents: int
        - total_proration_cents: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - d1: quay-7's active day count (copy the number from its fact line). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - d2: quay-8's active day count (copy the number from its fact line). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - d3: quay-9's active day count (copy the number from its fact line). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - r1: quay-7's monthly rate in whole cents (copy the number from its fact line). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - r2: quay-8's monthly rate in whole cents (copy the number from its fact line). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - r3: quay-9's monthly rate in whole cents (copy the number from its fact line). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - c1: quay-7's prorated charge for the month in whole cents (apply the proration rule to its days and rate). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - c2: quay-8's prorated charge for the month in whole cents (apply the proration rule to its days and rate). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - c3: quay-9's prorated charge for the month in whole cents (apply the proration rule to its days and rate). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - fm: how many desks count as a full month under tonight's boundary word (count them). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]
        - tot: the total proration across all desks in whole cents (sum of the per-desk charges). hint: *: prorated charge is ceil(days*rate/30) computed in integer cents, round up only at the end. [answer format: a whole number]

