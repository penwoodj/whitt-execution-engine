workflow_id: harness_v12_hd-14_spoof
name: "Harness v12 SPOOF - hd-14"
description: "DIGEST->GATE->FIX(rescue x3)->AGGREGATE->JUDGE->AUDIT. Case: hd-14 hops=4 route=light fix3=always"
version: "10.0.0"
author: "Experiment"
tags: [harness, agentic, v12, digest, rescue3, spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_light}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-14.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_light}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - an event goes poison on its second consecutive strike, a strike is a fail, two strikes back to back mark poison at-or-over the second strike, the classic two-strike rule, poison resets the strike counter
        - a clean streak of three or more ok events forgives prior strikes, the strike counter resets to zero after such a streak, forgiveness is total and immediate
        - the report wants poison events, total fails, and the longest consecutive fail streak, each counted across the whole sequence

        FACTS:
        - the sieve saw the sequence ok ok fail fail ok fail fail fail ok fail ok ok
        - total fails work out to 6 and the longest fail run works out to 3
        - the sieve classified 3 poison events tonight

        REPORT SPEC (exact keys, exact types):
        - poison_events: int
        - fails_total: int
        - longest_fail_streak: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - fails: how many fail events appear in the sequence (count them). hint: *: poison and retry lanes count separately, never mix lane counts in one total. [answer format: a whole number]
        - oks: how many ok events appear in the sequence (count them). hint: *: poison and retry lanes count separately, never mix lane counts in one total. [answer format: a whole number]
        - streak: the longest run of consecutive fail events (count the run). hint: *: poison and retry lanes count separately, never mix lane counts in one total. [answer format: a whole number]
        - poison: how many poison events the sieve classified (two-strike rule applied). hint: *: poison and retry lanes count separately, never mix lane counts in one total. [answer format: a whole number]
        - rst: how many times the three-ok forgiveness fired (count the resets). hint: *: poison and retry lanes count separately, never mix lane counts in one total. [answer format: a whole number]
        - tlen: the total event count in the sequence (count every event). hint: *: poison and retry lanes count separately, never mix lane counts in one total. [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 6 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 2048 }
      when:
        before_step_starts:
