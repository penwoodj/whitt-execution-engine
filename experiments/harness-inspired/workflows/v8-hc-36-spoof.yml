      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-36.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - rings promote in order, a ring only enters after the previous ring passes clean
        - a ring with 5 or more fire reports halts the rollout on the spot, halted means halted, no finish and see
        - users exposed counts every user in rings that entered, including the ring that triggered the halt

        FACTS:
        - canary covers 50 users and logged 2 fire reports, early covers 400 users and logged 6 fire reports, broad covers 5000 users and logged 5 fire reports
        - the abort threshold is 5 fire reports

        REPORT SPEC (exact keys, exact types):
        - rings_passed: int
        - aborted: bool
        - users_exposed: int
        - halt_ring: str

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - rp: rings that passed clean (count) [answer format: a whole number]
        - ab: was the rollout halted by the abort threshold (true or false) [answer format: true or false]
        - ux: users exposed across all rings that entered [answer format: a whole number]
        - hr: id of the ring that triggered the halt (empty string if none) [answer format: a single word in quotes]

        OUTPUT CONTRACT — your reply MUST end with exactly 4 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 2048 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/hc-36-solve-wind0.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-36.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json check ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl hc-36"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage solve --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case hc-36"
