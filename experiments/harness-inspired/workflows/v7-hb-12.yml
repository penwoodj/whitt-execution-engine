        storage, lists three copies of this title in its archive, one of which is
        circulating-eligible. Partner tier exhausted, warehouse tier pays off: H3
        fills from the regional warehouse, slower truck, but filled.
        
        Hold H4 is the problem. It is a large-format photography volume that was
        subject to the consortium-wide damage recall last winter — the binding
        adhesive was failing on the entire print run, every copy in the system
        was pulled, and the title was formally withdrawn from the catalog. A
        patron has placed a hold on it anyway, perhaps not knowing, perhaps
        hoping. The chain searches local, partner, warehouse, and finds nothing,
        because a withdrawn title exists nowhere in the chain. H4 is denied, and
        the denial note will suggest the digital edition, which is a different
        animal owned by a different agreement.
        
        Two items on the desk that are not holds and have fooled new technicians
        before. The book-sale cart by the front desk holds eleven withdrawn
        titles awaiting the Friends of the Library sale — withdrawn titles are
        not catalog copies and never fill anything, and the sale cart belongs to
        the Friends, whom you do not manage. And the courier manifest shows
        tomorrow morning's inbound batch of eight partner deliveries — those are
        fills from previous evenings, already counted in previous reports, and
        tomorrow's report will count them again tomorrow, which is how the system
        stays honest.
        
        The evening tally needs: how many holds filled, how many denied, and the
        breakdown of fills by tier — local, partner, regional.
        
        The consortium's tier hierarchy was negotiated over three long
        conference calls and one memorable in-person summit, and the memory
        of those calls still shapes how courteously the member libraries
        treat each other's requests. The original proposal treated all
        requests as equal — one queue, first come first served — until the
        largest member, whose reference desks answer to a hospital system,
        pointed out that not all borrowers weigh the same against a
        deadline. The tier structure emerged as the compromise — regional
        requests first, then state, then national — and the courtesies
        followed, because a hierarchy everyone argued into existence is a
        hierarchy everyone defends. The growth-cap rule joined later, born
        of a month when one institution's digitization project nearly
        emptied the shelves for everyone else.
        
        Your desk today processed the request queue with the tier ladder
        pinned where the terminal's screen glare cannot reach it. Each
        request was checked against the shelf-status system before any
        promise was made, because denying a request the shelves cannot fill
        is not a judgment — it is a fact wearing a polite vocabulary. The
        denials you recorded each carry the shelf-status code the system
        returned, and the fills each carry the tier the request rode and
        the courier batch that carried it, so the quarterly consortium
        meeting can trace any single request from ask to arrival without
        picking up a phone.
        
        The library's other ledgers count busily without ever touching the
        request buckets. The acquisitions budget tracker you do not manage
        spends its lines on new titles, reconciled against a fiscal year
        the consortium never sees. The interlibrary courier's own delivery
        metrics — on-time percentages, parcel weights, the one driver's
        notoriously optimistic scan habits — circulate in a logistics report
        with its own audience. And the digitization team's project tracker
        counts pages scanned per week against a grant milestone, valuable
        work whose numbers will eventually echo through the shelves
        themselves, but which today moved not one request into or out of
        the buckets you are closing.
        
        A note on the request that nearly rode two tiers, because edge
        requests are where honest buckets prove themselves. A member
        library's patron sits on the staff of two institutions, and the
        request arrived on letterhead carrying both affiliations — a natural
        reading would credit the fill to whichever tier happened to be
        processing when the shelf was found. The consortium's definition is
        the guard — the tier is fixed at submission by the requesting
        institution of record, the first letterhead on the form, and no
        subsequent discovery changes it. One request, one tier, one fill
        entry carrying the tier it rode, and the quarterly meeting inherits
        counts that describe the consortium's actual traffic rather than
        the traffic of whichever clerk was cleverest with a stamp.
        
        One final sweep completes the desk's day. The shelf-status system's
        end-of-day snapshot, the courier's manifest count, and the request
        ledger itself must all agree on the fills that anchor everything —
        and you walk the three in parallel before the report locks, because
        the consortium's quarterly reconciliation begins where yours ends,
        and any divergence between your sources becomes next month's email
        chain. They agree tonight, as they have since the tier structure
        settled; the ledger closes with the quiet rightness of numbers that
        describe one shelf, one courier, and one request at a time, and the
        morning's circulation desk will inherit counts it can trust past
        the first phone call.
        
        The consortium's oldest librarian closes every interlibrary day the
        same way, with a walk past the hold shelf where tomorrow's arrivals
        will land, and tonight the walk is yours by rotation. The courier's
        last pickup came at five; the request queue stands empty; the
        buckets hold the day's whole truth in a handful of numbers that the
        quarterly meeting will read months from now without ever knowing
        the quiet of the shelf they were counted beside. There is a
        satisfaction particular to shared systems — your counts trustworthy
        because their rules were argued out loud, their courtesies
        inherited because your numbers never once betrayed a member's
        patience. The ledger closes; the lamp goes off; the shelves keep
        their promise.
        
        A closing note on the shelf that emptied twice, because repeated
        drains are where growth caps earn their keep. The same popular
        title drew both the regional and the state request this season, and
        the cap rule held the second draw to the same modest handful the
        first one took — a book borrowed to exhaustion by its own members
        is a book the courier carries less and the catalog queues longer,
        and the consortium's founders priced that trade honestly when they
        wrote the cap. The growth number in tonight's report is small by
        design, the shape of a policy working, and the quarterly meeting
        will read it without alarm precisely because its architects
        intended exactly this smallness.
        
        The final number to guard is the denial column's integrity, because
        denials are where politeness most wants to blur arithmetic. A
        request denied for shelf status is a fact about the shelves, not a
        judgment about the asker, and the consortium's vocabulary keeps the
        two firmly separate — the denial carries the system code, the code
        carries no adjective, and no clerk's sympathy ever moved a unit
        between buckets. Tonight's denial stands exactly as recorded, one
        honest fact beside the fills it did not become.

