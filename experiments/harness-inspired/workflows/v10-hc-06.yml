workflow_id: harness_v10_hc-06
name: "Harness v10 - hc-06"
description: "DIGEST->GATE->FIX(rescue)->AGGREGATE->JUDGE->AUDIT. Case: hc-06 hops=5 route=heavy"
version: "9.0.0"
author: "Experiment"
tags: [harness, agentic, v10, digest, rescue]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
