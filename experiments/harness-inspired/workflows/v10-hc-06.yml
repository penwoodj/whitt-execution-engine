    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hc-06.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - rows over 1000 currency units hold for manual review unless the row carries an approved exception
        - held rows pay nothing tonight, they are not partial, they are not deferred pro-rated, they simply wait
        - the exception column is the only override, verbal approvals count for nothing at this desk

        FACTS:
        - row r-a pays 1200 units with an approved exception, row r-b pays 3400 units, row r-c pays 800 units with an approved exception, row r-d pays 2100 units

        REPORT SPEC (exact keys, exact types):
        - released_count: int
        - held_count: int
        - net_paid: int
        - held_value: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - rc: rows released tonight (count, exceptions included). rule: a row over the hold threshold is released when it carries an approved exception, under-threshold rows are always released, released count includes both kinds. worked example: rows of 900 and 400 against a 500 threshold, the 900 row has an exception -> both released, count 2. [answer format: a whole number]
        - hc: rows held for review (count). rule: a row is held only when it is over the threshold and has no exception, count those rows. worked example: rows of 900 with exception and 700 without, threshold 500 -> only the 700 row held, count 1. [answer format: a whole number]
        - net: net amount paid tonight (sum of released rows only). rule: net paid sums the amounts of released rows only, released means under threshold or over-with-exception. worked example: released rows of 400 and 900 -> net 1300. [answer format: a whole number]
        - hv: total value sitting on hold (sum of held rows). rule: held value sums the amounts of held rows only, the over-threshold no-exception ones. worked example: one held row of 700 -> held value 700. [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 4 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 2048 }
      when:
        after_step_succeeds:
          - save_to:
              - "$table"
              - "./docs/benchmarks/outputs/output/ha-table.txt"
