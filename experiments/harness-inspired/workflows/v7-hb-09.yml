workflow_id: harness_v7_hb-09
name: "Harness v7 - hb-09"
description: "TABLE->GATE->AGGREGATE->JUDGE-V2->LEAK-AUDIT. Case: hb-09 hops=4 route=light"
version: "7.0.0"
author: "Experiment"
tags: [harness, agentic, v7, routing, snapshot, meter, audit]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_light}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-09.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_light}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

                You are the shift supervisor closing the distribution center's evening
        paperwork, and the numbers on the closeout sheet have a way of turning
        into tomorrow-morning arguments between picking and packing if you do not
        get them exactly right tonight. Three inventory lines went through the
        day's pick waves, and the closeout needs to know where every unit ended
        up: fulfilled onto a truck, backordered for tomorrow, or quarantined as
        damaged.
        
        The wave rules, as posted at the pick-captain station. Picking runs in
        waves, and each wave attempts the units scheduled into it. If a pick line
        cannot complete in its wave — picker reassigned, bin empty mid-pick,
        whatever the reason — the unpicked remainder rolls to the next wave
        automatically, where it is attempted again alongside that wave's fresh
        work. If no later wave runs tonight, the rolled remainder becomes a
        backorder: units ordered, promised, and not yet picked. Damaged units are
        a separate lane entirely, and this is the clause that gets argued about:
        units discovered damaged at any stage go to quarantine for the claims
        team, and quarantined units are never backordered. Damage removes a unit
        from the fulfillment universe entirely; the backorder lane is for units
        that exist, are sellable, and simply were not picked. A damaged unit does
        not wait for tomorrow. It waits for nobody.
        
        Now the day's three lines.
        
        Item X, the storage totes, had an order slate of fifty units scheduled
        into wave one. The picker got through thirty of them before being pulled
        to the loading dock for a truck emergency; the remaining twenty units
        rolled to wave two. Wave two ran on schedule with capacity to spare, and
        the twenty rolled units were picked in full alongside its other work.
        Nothing from item X was ever damaged. All fifty of item X's units made it
        onto trucks: thirty from wave one and twenty from wave two.
        
        Item Y, the desk lamps, had forty units scheduled, all picked across the
        day without drama — forty picked, zero rolled, zero backordered. But at
        packing, eight of the lamps turned out to have cracked bases from what
        the claims team will eventually decide was a supplier issue. Eight units
        to quarantine. The other thirty-two packed clean and shipped. And here is
        tonight's argument pre-empted: packing wants the eight damaged lamps
        re-ordered into tomorrow's pick as backorders, because the customer still
        wants lamps. The rule says no. Damaged units go to quarantine and are
        never backordered; if the customer still wants lamps, that is a
        replenishment conversation, not a backorder entry, and replenishment is
        handled by the buying office, which you do not manage.
        
        Item Z, the ergonomic chairs, had fifteen units scheduled into wave two
        — the last wave of the night, since wave three was cancelled for
        inventory count prep. The pick for item Z started strong, nine units
        picked and staged, but the wave closed early when the count team needed
        the aisle, and the remaining six units rolled looking for a wave three
        that no longer existed. Rolled with no later wave tonight is the exact
        definition of a backorder: six units backordered for the morning crew.
        
        One more number will cross your desk tonight and belongs in nothing
        above: the returns dock processed twenty-three customer returns this
        evening, some of them, as it happens, storage totes and one badly
        scuffed chair. Returns are inbound product entering their own inspection
        lane; they are not picks, not backorders, not quarantine from tonight's
        outbound flow, and the returns dock supervisor files her own paperwork,
        which you do not manage and gladly do not.
        
        The closeout sheet needs four totals: units fulfilled onto trucks, units
        backordered for tomorrow, units in quarantine, and — because the
        operations manager always asks — the units that rolled from wave one to
        wave two and were recovered.
        
        The wave system's bookkeeping earned its precision through a holiday
        season nobody wants to repeat. Three winters ago the peak surge
        overwhelmed the pick lines, and in the scramble the shift leads made
        pragmatic calls — pulling quarantined stock when shelves ran dry,
        backordering without noting it, substituting freely and orally — and
        by January the inventory system's numbers and the building's physical
        reality had diverged by enough to force a full wall-to-wall count. The
        postmortem did not blame the leads; it blamed categories that could
        flex under pressure. Out of that came the strict buckets in force
        tonight — fulfilled means picked and shipped, backordered means the
        system formally owes units, quarantined means locked pending quality,
        and recovered means quality has explicitly released stock back — with
        no informal movement between them at all.
        
        Your closing walkthrough tonight verified the physical against the
        digital one more time. The quarantine cage held what the system said
        it held, including the pallets quality cleared this afternoon whose
        release paperwork you countersigned. The backorder queue matched the
        pick-face gaps you could see from the mezzanine, and the recovered
        units had already flowed back into available inventory where the
        morning shift will find them without ceremony.
        
        The warehouse's edges host the usual noise of a running operation. The
        returns dock you do not manage logs its own inflow of coming-back
        cartons, counted separately and reconciled weekly against refunds.
        The battery-management system tends the forklift fleet with telemetry
        nobody outside facilities reads. And the slotting optimizer runs its
        what-if simulations nightly, reshuffling hypothetical pick paths for
        a committee that implements maybe one proposal a month — all of it
        real, none of it a unit in the buckets your report carries.
        
        A note on the quarantined stock before the buckets are sealed,
        because quarantine is where patience is tested nightly. The pallets
        sitting locked tonight are not punishment — they are process, mid-
        stream, awaiting the quality team's morning eyes and the release
        paperwork that follows good news. The wave system's honesty depends
        on those units staying invisible to pick paths while they wait, since
        a quarantined unit that leaked into a shipment would be the exact
        failure mode the whole category exists to prevent. Tonight they sat
        locked, counted and uncounted by the pick engine all at once, which
        is precisely what the bucket was designed to hold.
        
        One final cross-check completes the ritual. The wave totals must
        reconcile against the dock's inbound manifest for the day — every
        unit that entered the building tonight either shipped, backordered,
        sits quarantined, or flowed through recovery, and the arithmetic of
        those four fates has to absorb the entire inbound count. You run the
        reconciliation, it balances to the unit, and the report files with
        the particular quiet of numbers that have been made to agree with
        physical reality twice.
        
        The morning shift's stake in tonight's numbers is worth a closing
        thought, because the buckets are the first thing the incoming lead
        reads. Backordered units become today's promises, recovered stock
        becomes today's grace, and the quarantine count tells them how much
        of the morning waits on quality's word — the whole shape of the
        day's first hour visible in four honest numbers. A miscounted bucket
        would not just embarrass; it would misallocate a crew's first ninety
        minutes to promises the building cannot keep. The reconciliation
        you ran before filing is what stands between those two futures, and
        it is why the closing walkthrough is never skipped, however long the
        shift ran.
        
        The final numbers that matter are the ones the outbound dock bolds,
        and they deserve one last guard tonight — the distinction between a
        backorder and a miss. A backordered unit is not a failure; it is a
        formal promise the system has made and tracks, a debt with a ledger
        line and a replenishment path. A miss would be a unit the system
        believed shipped that the building could not produce — the true
        failure mode, the one the buckets were designed to make impossible
        to hide. Tonight there are promises and no misses, which is the
        steady state the wave system exists to maintain, and the report
        files it exactly that way.
        
        One closing paragraph on the labor number nobody asked about, because
        it is the number the shift leads watch most closely of all — the
        pick-path steps per fulfilled unit, the metric the slotting
        optimizer's monthly proposals claim to shave. It appears in no
        bucket tonight, rides in no reconciliation, and yet the morning
        lead's first glance after the buckets is always at it, the way a
        runner glances at splits after the time. The buckets say what the
        building produced; the labor number says what it cost in shoe
        leather. Both matter, only one belongs to tonight's report, and the
        discipline of keeping them separate is the same discipline that
        survived the holiday season and rebuilt this place.
        
        One closing note on the pallet that moved twice, because double-
        movers are where honest buckets prove themselves. A quarantined
        pallet released by quality this afternoon and immediately picked
        into a shipment crossed two categories in a single shift — it left
        quarantine, flowed through recovery, and ended its night as a
        fulfilled unit, and a careless count would tally it once in each
        bucket it touched, inflating the building's imaginary throughput.
        The reconciliation's job is precisely this — every unit counted
        once, at its final resting state, with its journey visible in the
        paperwork but its census entry singular. The buckets you report are
        states, not events, and the pallet that moved twice is, tonight,
        exactly one fulfilled unit with a story.

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - x_fulfilled: item X units fulfilled (30 wave1 + 20 rolled-then-picked wave2) [answer format: a whole number]
        - y_fulfilled: item Y units fulfilled (40 picked, 8 damaged at packing excluded) [answer format: a whole number]
        - z_fulfilled: Item Z had 15 units on the line, 9 picked before the wave closed early — partial picks roll the remainder, and only picked units fulfill; how many Z units fulfilled? [answer format: a whole number]
        - z_backordered: Item Z's 6 unpicked units rolled with no wave 3 tonight — rolled units the building still owes become backordered; how many Z units backordered? [answer format: a whole number]
        - y_quarantined: item Y units quarantined (8 cracked at packing, never backordered) [answer format: a whole number]
        - recovered_rolls: Units rolled from wave 1 and recovered by wave 2 count as recovered rolls — only item X's 20 rolled units were picked in wave 2; how many recovered? [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 6 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 1280 }
      when:
        after_step_succeeds:
          - save_to:
              - "$table"
              - "./docs/benchmarks/outputs/output/ha-table.txt"
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hb-09.yml --out ./docs/benchmarks/outputs/output/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/ha-table-result.json check ./docs/benchmarks/outputs/output/ha-trace.jsonl hb-09"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/ha-table.txt ./docs/benchmarks/outputs/output/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/ha-table.txt --stage solve --trace ./docs/benchmarks/outputs/output/ha-trace.jsonl --case hb-09"
              working_dir: "."
              fail_on_error: false

