        service hard down, the incident commander grabbed emergency production
        access. It granted instantly, as break-glass does, was used to roll back
        the bad deploy, and then did its job. Four hours from 09:00 is 13:00, and
        the review clock now reads 16:00 — well past. The grant expired on its
        own at 13:00, so as of this review it is expired, which is the system
        working exactly as designed, not a failure.
        
        Request A4 is also break-glass: at 14:30 today, during a database failover
        that the standard change process was too slow for, a senior engineer took
        emergency database access. Granted instantly at 14:30, four hours of life
        puts expiry at 18:30, and the review at 16:00 is inside that window. Still
        active.
        
        Request A5 is the awkward one. At 06:00 yesterday morning — thirty-four
        hours ago by this review — a departing-team member requested elevated
        rights to complete a handover migration, the kind that needs both
        approvals. The manager approved at 07:00 yesterday. Security never did,
        and the requester went offline mid-migration assuming it would resolve
        itself. It did not: one approval of two means the request has sat
        unresolved since 06:00 yesterday, and thirty-four hours exceeds the
        twenty-four-hour audit limit. The audit job has therefore revoked A5, and
        it will need a fresh request if the migration is ever to finish.
        
        One system boundary for the record: the building's physical badge office
        processes door-access requests through its own queue, which you do not
        manage, and two of its approvals show in this morning's email thread.
        Badge grants are not system access, never were, and do not appear in
        these counts.
        
        The review needs, as of 16:00 today: how many of the five requests
        currently stand as active grants, how many expired, how many were revoked
        by the audit rule, and how many are simply still pending.
        
        The grants ledger's reconciliation discipline comes from an incident
        that the security team still calls the Tuesday of Confusion. Before the
        current rules, access was granted through a tangle of team aliases and
        direct assignments, and when an auditor asked a simple question — who
        can touch this system right now — the honest answer took nine days to
        assemble and was wrong twice on the way. The remediation was
        unglamorous and absolute — every grant becomes a ledger row with an
        owner, a scope, a start, and a term; expirations revoke automatically
        at term; explicit revocations by an administrator kill a grant on the
        spot regardless of remaining term; and requests that nobody has
        approved yet sit in a pending state that grants nothing at all.
        
        Your audit tonight walked the ledger row by row against the events
        feed that feeds it. Each expiration you recorded came from the term
        already passed, each revocation from a named administrator's action
        earlier in the week, each active grant from a term still running and
        no revocation on record. The pending rows you counted twice, since
        pending is the state most often misread — a pending grant confers no
        access today, no matter how certain its approval looks, and the
        morning review has learned to ask about pendings before anything
        else.
        
        The identity stack around the ledger keeps its own busy ledger of
        numbers that must not bleed into yours. The directory service you do
        not manage synchronizes group memberships from the hr system hourly,
        and its sync counts appear on a dashboard with impressive sparklines.
        Multi-factor enrollment campaigns run their own reports, complete with
        nag-email schedules. And a service-account inventory project has been
        drafting its census for three quarters now, promising eventually to
        label every nonhuman identity — worthwhile work, watched closely, and
        wholly invisible to the human grants you are counting tonight.
        
        A note on the expired grants before the ledger closes, because
        expiration is the state that teaches patience. Every expired row in
        tonight's count was once an active grant someone requested in good
        faith for a project with a name and a deadline, and the term that
        now reads past-due is the same term that once read generous. The
        automatic revocation at term is the system being kind to everyone —
        kind to the audit, which never has to ask why stale access lives,
        and kind to the grant's owner, who never has to remember to close
        the door behind themselves. The morning's access review will skim
        these expirations in seconds precisely because the machinery handled
        them in milliseconds.
        
        One final cross-check completes the ritual. The ledger's own
        checksum — a hash the identity system maintains over active grants —
        must match the count you tallied by hand, and you run it before
        filing. A mismatch would mean rows moved between your read and your
        report, which at this hour is either latency or something worth
        waking someone about. The hash matches. The ledger closes with its
        four buckets settled, and the security morning brief will carry
        exactly the state the rules produced.
        
        The audit committee's stake in tonight's numbers is worth a closing
        thought, because the ledger's four buckets are the entire answer to
        the question that once took nine days. When the auditors arrive next
        quarter they will ask it again — who can touch this system, and why —
        and the answer will be read straight from buckets like tonight's,
        row by row, term by term, revocation by revocation. What took nine
        days and two wrong answers now takes a query and a patient reading,
        and the difference is not technology but rule design — states that
        cannot flex, transitions that require names, and a pending bucket
        that promises nothing until it becomes something. Tonight's ledger
        carries that design's weight quietly, which is exactly how it
        should.
        
        One final sentence belongs in the ledger before it locks,
        and it is the sentence the identity team's hash has earned
        the right to say - the count tonight is not a claim but a
        cross-check survived, four buckets holding the entire truth
        of the grants ledger as the rules assembled it, and the
        morning brief will carry exactly that truth forward.
        
        The security morning brief will skim these buckets in the
        order the Tuesday of Confusion taught it to read them,
        actives first, pendings second, the rest as footnote, and
        the reading will take seconds because the machinery took
        milliseconds. That asymmetry, seconds of scrutiny built on
        milliseconds of discipline, is the entire gift the rebuilt
        ledger gives its readers, and tonight it is given again.

