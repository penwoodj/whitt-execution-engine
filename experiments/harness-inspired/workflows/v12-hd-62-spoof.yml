workflow_id: harness_v12_hd-62_spoof
name: "Harness v12 SPOOF - hd-62"
description: "DIGEST->GATE->FIX(rescue x3)->AGGREGATE->JUDGE->AUDIT. Case: hd-62 hops=5 route=heavy fix3=always"
version: "10.0.0"
author: "Experiment"
tags: [harness, agentic, v12, digest, rescue3, spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-62.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - each retry attempt delivers at a decayed rate, attempt k's rate is the base rate minus k times the decay, floored at zero percent, delivery is batch times rate floor-divided by 100, whole messages
        - a message leaves the replay lane at-or-over three attempts and every departure after that is final
        - dead is batch minus everything delivered across all attempts, dead is reported without apology

        FACTS:
        - the replay lane holds 800 messages with base rate 60 percent and decay 20 percent per attempt
        - attempts stop at 3
        - the lane quotes no attempt rates tonight, each one derives from the base and the decay

        REPORT SPEC (exact keys, exact types):
        - attempt1_delivered: int
        - attempt2_delivered: int
        - dead_after_retries: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - b: batch size in messages (copy the number from its fact line). hint: *: each redrive pass reaches only the surviving fraction, survivors multiply pass over pass. [answer format: a whole number]
        - r: base rate percent (copy the number from its fact line). hint: *: each redrive pass reaches only the surviving fraction, survivors multiply pass over pass. [answer format: a whole number]
        - d: decay percent per attempt (copy the number from its fact line). hint: *: each redrive pass reaches only the surviving fraction, survivors multiply pass over pass. [answer format: a whole number]
        - ra1: attempt one rate in percent (base). hint: *: each redrive pass reaches only the surviving fraction, survivors multiply pass over pass. [answer format: a whole number]
        - ra2: attempt two rate in percent (base minus one decay). hint: *: each redrive pass reaches only the surviving fraction, survivors multiply pass over pass. [answer format: a whole number]
        - ra3: attempt three rate in percent (base minus two decays, floored at zero). hint: *: each redrive pass reaches only the surviving fraction, survivors multiply pass over pass. [answer format: a whole number]
        - dv1: attempt one delivered in messages (batch times attempt one rate). hint: *: each redrive pass reaches only the surviving fraction, survivors multiply pass over pass. [answer format: a whole number]
        - dv2: attempt two delivered in messages (batch times attempt two rate). hint: *: each redrive pass reaches only the surviving fraction, survivors multiply pass over pass. [answer format: a whole number]
        - dead: dead messages after all attempts (batch minus all delivered). hint: *: each redrive pass reaches only the surviving fraction, survivors multiply pass over pass. [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 9 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 2048 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./experiments/harness-inspired/results/v12-spoof-output/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v12/hd-62-solve-wind0.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./experiments/harness-inspired/results/v12-spoof-output/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-62.yml --out ./experiments/harness-inspired/results/v12-spoof-output/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
