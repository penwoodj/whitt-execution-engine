              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./experiments/harness-inspired/results/v12-spoof-output/ha-table-result.json check ./experiments/harness-inspired/results/v12-spoof-output/ha-trace.jsonl hd-62"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./experiments/harness-inspired/results/v12-spoof-output/ha-table.txt ./experiments/harness-inspired/results/v12-spoof-output/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
