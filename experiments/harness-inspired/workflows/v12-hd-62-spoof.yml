                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s03_fix_2
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./experiments/harness-inspired/results/v12-spoof-output/ha-table-result.json fix_1 ./experiments/harness-inspired/results/v12-spoof-output/ha-trace.jsonl hd-62"
