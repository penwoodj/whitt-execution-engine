workflow_id: harness_v7_ha-09_spoof
name: "Harness v7 SPOOF - ha-09"
description: "TABLE->GATE->AGGREGATE->JUDGE-V2->LEAK-AUDIT. Case: ha-09 hops=6 route=heavy"
version: "7.0.0"
author: "Experiment"
tags: [harness, agentic, v7, routing, snapshot, meter, audit ,spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-09.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

                You close out tonight's suite and must report wasted effort. Definitions: a
        won case's win-depth d means it executed exactly d+1 stages (solve counts as
        stage 0) and only its final stage produced the pass. A failed case executed
        all 3 stages (solve, fix1, fix2) with no pass. Useful stages are winning
        stages only; every other executed stage is wasted. Tonight 8 cases: 3 won at
        depth 0, 2 won at depth 1, 1 won at depth 2, 2 failed outright. A cost
        dashboard you do not manage also counts the free shell-side check scripts as
        stages, which they are not. Report total stages executed, useful stages, and
        wasted stages.

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - depth0_group: 3 cases won at depth 0 — depth d means the case executed exactly d+1 stages, only the last of which is useful; count stages executed and useful stages for this group of 3 [answer format: JSON object {"executed": N, "useful": N}]
        - depth1_group: 2 cases won at depth 1 — depth d means each case executed exactly d+1 stages, only the last of which is useful; count stages executed and useful stages for this group of 2 [answer format: JSON object {"executed": N, "useful": N}]
        - depth2_group: 1 case won at depth 2 — depth d means that case executed exactly d+1 stages total (solve, fix1, fix2 = 3 stages), only the last of which is useful; count stages executed and useful stages for this single case [answer format: JSON object {"executed": N, "useful": N}]
        - failed_group: 2 cases failed outright — a failed case executed all 3 stages (solve, fix1, fix2) with no pass, so zero useful stages; count stages executed and useful stages for this group of 2 [answer format: JSON object {"executed": N, "useful": N}]

        OUTPUT CONTRACT — your reply MUST end with exactly 4 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 1280 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/ha-09-solve-wind2.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-09.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s02_fix_1
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json check ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-09"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.solve.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage solve --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case ha-09"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s02_fix_1:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: correction specialist. Entity table failed checks. Fix rows.

        Original task:
                You close out tonight's suite and must report wasted effort. Definitions: a
        won case's win-depth d means it executed exactly d+1 stages (solve counts as
        stage 0) and only its final stage produced the pass. A failed case executed
        all 3 stages (solve, fix1, fix2) with no pass. Useful stages are winning
        stages only; every other executed stage is wasted. Tonight 8 cases: 3 won at
        depth 0, 2 won at depth 1, 1 won at depth 2, 2 failed outright. A cost
        dashboard you do not manage also counts the free shell-side check scripts as
        stages, which they are not. Report total stages executed, useful stages, and
        wasted stages.

        Failed cells (id + your observed value, correct values withheld):
        {{bookmarks.cell_feedback}}

        Prior table:
        {{bookmarks.table}}

        METHOD: re-read the task rules above, then re-derive each failed
        entity. Use these exact entity ids:

        - depth0_group: 3 cases won at depth 0 — depth d means the case executed exactly d+1 stages, only the last of which is useful; count stages executed and useful stages for this group of 3 [answer format: JSON object {"executed": N, "useful": N}]
        - depth1_group: 2 cases won at depth 1 — depth d means each case executed exactly d+1 stages, only the last of which is useful; count stages executed and useful stages for this group of 2 [answer format: JSON object {"executed": N, "useful": N}]
        - depth2_group: 1 case won at depth 2 — depth d means that case executed exactly d+1 stages total (solve, fix1, fix2 = 3 stages), only the last of which is useful; count stages executed and useful stages for this single case [answer format: JSON object {"executed": N, "useful": N}]
        - failed_group: 2 cases failed outright — a failed case executed all 3 stages (solve, fix1, fix2) with no pass, so zero useful stages; count stages executed and useful stages for this group of 2 [answer format: JSON object {"executed": N, "useful": N}]

        OUTPUT CONTRACT — your reply MUST end with exactly 4 lines,
        one per entity, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines.
      model_overrides: { temperature: 0.0, max_tokens: 1600 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/ha-09-fix_1-wind2.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-09.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s03_fix_2
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json fix_1 ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-09"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.fix_1.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage fix_1 --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case ha-09"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s03_fix_2:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: escalation solver. Two attempts wrong. Rebuild table from scratch.

        Original task:
                You close out tonight's suite and must report wasted effort. Definitions: a
        won case's win-depth d means it executed exactly d+1 stages (solve counts as
        stage 0) and only its final stage produced the pass. A failed case executed
        all 3 stages (solve, fix1, fix2) with no pass. Useful stages are winning
        stages only; every other executed stage is wasted. Tonight 8 cases: 3 won at
        depth 0, 2 won at depth 1, 1 won at depth 2, 2 failed outright. A cost
        dashboard you do not manage also counts the free shell-side check scripts as
        stages, which they are not. Report total stages executed, useful stages, and
        wasted stages.

        Failed cells (id + observed, withheld correct):
        {{bookmarks.cell_feedback}}

        METHOD: discard prior attempts. Re-derive EVERY entity answer from
        the rules. Use these exact entity ids:

        - depth0_group: 3 cases won at depth 0 — depth d means the case executed exactly d+1 stages, only the last of which is useful; count stages executed and useful stages for this group of 3 [answer format: JSON object {"executed": N, "useful": N}]
        - depth1_group: 2 cases won at depth 1 — depth d means each case executed exactly d+1 stages, only the last of which is useful; count stages executed and useful stages for this group of 2 [answer format: JSON object {"executed": N, "useful": N}]
        - depth2_group: 1 case won at depth 2 — depth d means that case executed exactly d+1 stages total (solve, fix1, fix2 = 3 stages), only the last of which is useful; count stages executed and useful stages for this single case [answer format: JSON object {"executed": N, "useful": N}]
        - failed_group: 2 cases failed outright — a failed case executed all 3 stages (solve, fix1, fix2) with no pass, so zero useful stages; count stages executed and useful stages for this group of 2 [answer format: JSON object {"executed": N, "useful": N}]

        OUTPUT CONTRACT — your reply MUST end with exactly 4 lines,
        one per entity, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No prose summaries.
      model_overrides: { temperature: 0.0, max_tokens: 1600 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/ha-09-fix_2-wind2.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-table.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-09.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s04_aggregate
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json fix_2 ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-09"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "cp ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt ./docs/benchmarks/outputs/output/spoof-v7/artifact.fix_2.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/meter.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-table.txt --stage fix_2 --trace ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl --case ha-09"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s04_aggregate:
      generative_entity: "${models.m_heavy}"
      prompt: "deterministic-aggregate-noop"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/aggregate.py --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-09.yml --table-result ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json --out ./docs/benchmarks/outputs/output/spoof-v7/ha-final.json"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/check-deterministic.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-final.json --criteria /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-09.yml --out ./docs/benchmarks/outputs/output/spoof-v7/ha-final-check.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s05_judge
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-check.py ./docs/benchmarks/outputs/output/spoof-v7/ha-final-check.json final ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-09"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s05_judge:
      generative_entity: "${models.m_judge}"
      prompt: |
        ROLE: blind auditor. See only task + result. No author knowledge.

        Task objective: Account total/useful/wasted stages from win-depth distribution.
        Result: {{bookmarks.final_json}}

        Answer EXACTLY 6 lines, nothing else:
        KEYS: yes or no
        VALUES: yes or no
        FORMAT: yes or no
        VERDICT: PASS or FAIL
        REASON: one sentence
        SCORE: 1-10

        VERDICT must be PASS only if all three of KEYS, VALUES, FORMAT are yes.
      model_overrides: { temperature: 0.0, max_tokens: 160 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./docs/benchmarks/outputs/output/spoof-v7/ha-verdict.txt --text-file experiments/harness-inspired/fixtures/spoof-v7/ha-09-judge.txt"
              working_dir: "."
              fail_on_error: false
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-judge.py ./docs/benchmarks/outputs/output/spoof-v7/ha-verdict.txt ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl ha-09"
              working_dir: "."
              fail_on_error: false
          - skip_step: true

    s06_end_fail:
      generative_entity: "${models.m_heavy}"
      prompt: "FAIL"
      model_overrides: { temperature: 0.0, max_tokens: 8 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/failflag.py --result ./docs/benchmarks/outputs/output/spoof-v7/ha-table-result.json --final-check ./docs/benchmarks/outputs/output/spoof-v7/ha-final-check.json"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s07_fail_trace
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s08_audit
          - skip_step: true

    s07_fail_trace:
      generative_entity: "${models.m_heavy}"
      prompt: "trace-only"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-append.py ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl end_fail fail case=ha-09"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '1 == 1'
                then: s08_audit

    s08_audit:
      generative_entity: "${models.m_heavy}"
      prompt: "leak-audit-noop"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/leak-audit.py --run-dir ./docs/benchmarks/outputs/output/spoof-v7 --case /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/ha-09.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} == 0'
                then: s09_audit_pass
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s10_audit_leak
          - skip_step: true

    s09_audit_pass:
      generative_entity: "${models.m_heavy}"
      prompt: "audit-pass-trace"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-append.py ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl audit pass case=ha-09"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '1 == 1'
                then: s_end

    s10_audit_leak:
      generative_entity: "${models.m_heavy}"
      prompt: "audit-leak-trace"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/trace-append.py ./docs/benchmarks/outputs/output/spoof-v7/ha-trace.jsonl audit fail leak=true case=ha-09"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '1 == 1'
                then: s_end

    s_end:
      generative_entity: "${models.m_heavy}"
      prompt: "term"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - skip_step: true
