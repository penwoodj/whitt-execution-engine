workflow_id: harness_v12_hd-03_spoof
name: "Harness v12 SPOOF - hd-03"
description: "DIGEST->GATE->FIX(rescue x3)->AGGREGATE->JUDGE->AUDIT. Case: hd-03 hops=4 route=light fix3=always"
version: "10.0.0"
author: "Experiment"
tags: [harness, agentic, v12, digest, rescue3, spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  timing:
    cooldown_after_unload_secs: 0
    min_tmp_space_mb: 50
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_light}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-03.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_light}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - quorum needs present members at-or-over half the seated board, present means seated and in the room, abstain and recuse still count as present for quorum only
        - abstentions and recusals reduce the votes cast, votes cast is present minus abstain minus recuse, never negative
        - a motion carries with a majority of votes cast, majority of cast is cast divided by two plus one, the margin is yes votes minus that number

        FACTS:
        - the board seats 12 members
        - 11 members are present in the room tonight
        - 2 members abstain and 1 members recuse
        - 4 members vote yes

        REPORT SPEC (exact keys, exact types):
        - quorum_met: bool
        - votes_cast: int
        - yes_needed: int
        - margin: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - M: seated members on the board (copy the number from its fact line). hint: *: quorum counts at-or-over members exactly, margin is yes minus no after resolving the chair rule. [answer format: a whole number]
        - P: members present tonight (copy the number from its fact line). hint: *: quorum counts at-or-over members exactly, margin is yes minus no after resolving the chair rule. [answer format: a whole number]
        - A: members abstaining (copy the number from its fact line). hint: *: quorum counts at-or-over members exactly, margin is yes minus no after resolving the chair rule. [answer format: a whole number]
        - R: members recusing (copy the number from its fact line). hint: *: quorum counts at-or-over members exactly, margin is yes minus no after resolving the chair rule. [answer format: a whole number]
        - Y: yes votes (copy the number from its fact line). hint: *: quorum counts at-or-over members exactly, margin is yes minus no after resolving the chair rule. [answer format: a whole number]
        - cast: votes cast (present minus abstain minus recuse, count them). hint: *: quorum counts at-or-over members exactly, margin is yes minus no after resolving the chair rule. [answer format: a whole number]
        - need: yes votes needed to carry as a count (majority of votes cast). hint: *: quorum counts at-or-over members exactly, margin is yes minus no after resolving the chair rule. [answer format: a whole number]
        - qm: quorum met tonight, true or false (apply the boundary word to present vs half the board). hint: *: quorum counts at-or-over members exactly, margin is yes minus no after resolving the chair rule. [answer format: true or false]
        - marg: the margin in whole votes (yes votes minus the needed count, negative allowed). hint: *: quorum counts at-or-over members exactly, margin is yes minus no after resolving the chair rule. [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 9 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
      model_overrides: { temperature: 0.1, max_tokens: 2048 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/spoof-write.py --artifact ./experiments/harness-inspired/results/v12-spoof-output/ha-table.txt --text-file experiments/harness-inspired/fixtures/spoof-v12/hd-03-solve-wind0.txt"
