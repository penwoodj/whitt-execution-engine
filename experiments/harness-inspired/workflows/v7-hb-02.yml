        path. They do not. The tag reorders discussion and nothing else; the same
        fifty-thousand threshold applies. Twenty thousand is under the line, the
        owning team's invoices are current, and the committee approved R3 outright.
        Its twenty thousand is committed.
        
        Request R4 was the last one discussed: fifteen thousand dollars for a
        licensing renewal for the diagramming tool nobody admits to using. The
        amount is trivially under the threshold, but when the finance liaison
        pulled the owner's file, the platform tooling team — R4's owner — has an
        unpaid invoice from a vendor dating back one hundred and twelve days. The
        ninety-day rule triggers: the request is placed on hold before discussion,
        and the committee never voted on it. Held requests commit nothing.
        
        Two side matters, for the record, and neither touches the ledger. The
        office manager's request for new lobby furniture was tabled to next
        quarter and was never a capital request on this agenda. And the coffee
        budget, a sore subject after the espresso machine died mid-meeting, runs
        through the facilities petty-cash account, which you do not manage and
        which the committee has no authority over.
        
        As you build the ledger entry, you need four numbers and the total spend
        actually committed by this meeting. Count approved as requests approved
        outright by committee vote; count needs_signoff as requests routed to the
        CFO and still unsigned; count held as requests blocked before discussion.
        Committed money is only money from outright-approved requests, in
        thousands of dollars. Also report the status of each individual request —
        R1, R2, R3, R4 — as one of approved, needs_signoff, or held.
        
        The committee's dual-track structure was not designed in a vacuum. Before
        the split, every request regardless of size went through the same full
        ceremony — five members, a full read of the proposal, a discussion round,
        a vote — and by last spring the queue had grown to a two-meeting backlog.
        An audit found that eighty percent of the queue consisted of requests
        under the ceiling that nobody seriously disputed, each burning forty
        minutes of five people's time. The ceiling rule was the fix — draw a line
        at the amount where scrutiny actually starts paying for itself, and let a
        single empowered member carry those through. The exact ceiling figure was
        argued over three sessions before landing where it now sits, and the
        bylaws note wryly that the number is a judgment call dressed as a rule,
        but a judgment call everyone finally agreed to live by.
        
        Your own week as duty member began Monday morning when the chair handed
        over the fast-track stamp, a physical rubber stamp that lives in a drawer
        for reasons of tradition no one can defend. Since then each request has
        crossed your desk with its one-page form filled out by the requesting
        team — amount, purpose, the account it draws from, and a signed
        acknowledgment that the funds must be spent this quarter. You read each
        form in full, checked each amount against the ceiling line, and where a
        signature was missing you set the form aside rather than chase it, because
        the bylaws are explicit that an incomplete form waits for completeness
        rather than being waved through by a sympathetic duty member.
        
        Around the committee's work sits a small cloud of process that touches
        nothing you will report. A procurement bot posts daily summaries of
        account balances to a channel nobody reads, its numbers always a day
        stale and used for nothing. The finance systems team you do not manage
        has been piloting a pre-approval assistant that drafts suggested
        dispositions for each request, and while its suggestions are sometimes
        uncannily good, the bylaws do not recognize it and every actual decision
        this quarter was made by a human with a stamp or a gavel. The archive of
        requests from prior quarters sits in a shared drive, browsable and
        occasionally consulted, but nothing from those quarters belongs in this
        quarter's counts.
        
        In the final hour before the quarter's books close, the discipline that
        matters most is re-verification of the disposition trail. You re-read
        each one-page form against the decision you recorded, not the one you
        remember recording, because memory under deadline pressure turns
        ambiguity into confidence. You double-check that every held request
        carries a reason — missing signature is a reason, ceiling breach is a
        reason, and a hold without one gets flagged by the chair as an
        unexplained gap. You confirm the committed total you are about to report
        reconciles against the sum of the approved amounts, since a committed
        figure that drifted from its parts would be the first thing the auditor
        hunts. Only when the trail reads cleanly from first form to last do you
        draft the summary the committee will rubber-stamp tomorrow — the same
        summary whose counts you are about to report, and the last thing
        standing between your week and the record.
        
        The archive room itself tells the history of how this committee learned
        to count. Shelves of bound minutes go back nine years, and flipping
        through them you can watch the vocabulary evolve — early quarters record
        every request as passed or failed with no middle ground, the signoff
        state only appearing after a year in which three approved requests
        stalled for lack of a second signature and nobody could say whether
        they were alive. The held state arrived later still, born of a quarter
        when the ceiling was raised mid-meeting and requests that would have
        sailed through an hour earlier were left in limbo with no label at all.
        Each bucket in tonight's counts carries that lineage, which is why the
        bylaws refuse to collapse them — a request waiting on paperwork is not
        denied, and a request over the line is not waiting, and a request the
        committee has not yet gavelled is none of the above.

