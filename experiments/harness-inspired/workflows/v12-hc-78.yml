        - shipped: int
        - rolled_back: int
        - slots_left: int
        - pending: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - ch: the clock hour (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - cm: the clock minute (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - fh: the freeze hour (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - fm: the freeze minute (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - sk: build slots held for the night (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a whole number]
        - e1: web's error rate percent (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a number (decimals allowed)]
        - e2: jobs's error rate percent (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a number (decimals allowed)]
        - e3: mail's error rate percent (copy the number from its fact line). hint: copy the number exactly as its fact line states it, no arithmetic, no rounding, no derivation. [answer format: a number (decimals allowed)]
