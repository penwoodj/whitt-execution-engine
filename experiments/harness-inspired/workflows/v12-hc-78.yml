workflow_id: harness_v12_hc-78
name: "Harness v12 - hc-78"
description: "DIGEST->GATE->FIX(rescue)->AGGREGATE->JUDGE->AUDIT. Case: hc-78 hops=4 route=light"
version: "9.0.0"
author: "Experiment"
tags: [harness, agentic, v12, digest, rescue]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
