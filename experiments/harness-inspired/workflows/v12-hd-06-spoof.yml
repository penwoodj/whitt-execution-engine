    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_light}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-06.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_light}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - per-diem cap is the nightly rate times nights, a claim flags at-or-over its cap, flagging is about the claim, not the payout
        - reimbursement pays the smaller of submitted and cap, whole cents, never negative, never rounded
        - clawed back is the part of flagged claims above their caps, summed across flagged travelers only

        FACTS:
        - the nightly rate is 16500 whole cents
        - june-a spent 3 nights and submitted 45000 whole cents, june-b spent 4 nights and submitted 70200 whole cents, june-c spent 2 nights and submitted 33000 whole cents
        - the booth recomputes every cap and every payout from the rate and the nights

        REPORT SPEC (exact keys, exact types):
        - travelers_flagged: int
        - total_reimbursed_cents: int
        - clawed_back_cents: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - rate: the nightly rate in whole cents (copy the number from its fact line). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - k1: june-a's nights (copy the number from its fact line). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - k2: june-b's nights (copy the number from its fact line). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - k3: june-c's nights (copy the number from its fact line). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - s1: june-a's submitted amount in whole cents (copy the number from its fact line). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - s2: june-b's submitted amount in whole cents (copy the number from its fact line). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - s3: june-c's submitted amount in whole cents (copy the number from its fact line). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - cp1: june-a's cap in whole cents (rate times nights). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - cp2: june-b's cap in whole cents (rate times nights). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - cp3: june-c's cap in whole cents (rate times nights). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - rb1: june-a's reimbursement in whole cents (smaller of submitted and cap). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
        - rb2: june-b's reimbursement in whole cents (smaller of submitted and cap). hint: *: per-diem accrues rate*nights in whole cents, the hold subtracts from the total before payout. [answer format: a whole number]
