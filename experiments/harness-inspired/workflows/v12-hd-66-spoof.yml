    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info
  steps:
    s00_screen:
      generative_entity: "${models.m_heavy}"
      prompt: "pre-flight"
      model_overrides: { temperature: 0.0, max_tokens: 1 }
      when:
        before_step_starts:
          - shell:
              command: "python3 experiments/harness-inspired/scripts/screen-validate.py /home/jon/.local/share/opencode/worktree/b3a0edc5d199ed0b05278bdc34894bc7a8b0e833/nimble-harbor/experiments/harness-inspired/cases/hd-66.yml"
              working_dir: "."
              fail_on_error: false
          - gwt:
              - given: '{{bookmarks.shell_output.exit_code}} != 0'
                then: s06_end_fail
          - skip_step: true

    s01_solve:
      generative_entity: "${models.m_heavy}"
      prompt: |
        ROLE: on-call operator. Precise. Zero fluff.

        TASK CORE:
        RULES:
        - the tour overbooks, bumps needed are tickets minus seats, volunteers step up before anyone is forced, a desk counts itself covered at-or-over its volunteer goal and forced bumps are whatever bumps the volunteers did not absorb
        - volunteer vouchers cost the volunteer rate each, forced bumps cost the involuntary rate each, only volunteers actually used draw vouchers, unused volunteers cost nothing
        - the voucher total is whole cents and is reported even when it is zero, which it never is

        FACTS:
        - the tour seats 52 and sold 56 tickets
        - 5 passengers volunteered for bumping
        - volunteer vouchers run 18000 whole cents and involuntary compensation runs 38000 whole cents

        REPORT SPEC (exact keys, exact types):
        - involuntary_bumped: int
        - volunteers_unused: int
        - voucher_cost_cents: int

        METHOD: for EACH entity below, derive its answer from the rules.
        Track state step by step in plain text. Entities you do not manage
        NEVER count. Check deadline/budget rules BEFORE finalizing.

        Entities (one line each, id then question):
        - S: seats on the tour (copy the number from its fact line). hint: *: bumped is booked minus capacity when over, volunteers leave before involuntary bumps. [answer format: a whole number]
        - T: tickets sold (copy the number from its fact line). hint: *: bumped is booked minus capacity when over, volunteers leave before involuntary bumps. [answer format: a whole number]
        - vol: volunteers (copy the number from its fact line). hint: *: bumped is booked minus capacity when over, volunteers leave before involuntary bumps. [answer format: a whole number]
        - vc: volunteer voucher rate in whole cents (copy the number from its fact line). hint: *: bumped is booked minus capacity when over, volunteers leave before involuntary bumps. [answer format: a whole number]
        - ic: involuntary rate in whole cents (copy the number from its fact line). hint: *: bumped is booked minus capacity when over, volunteers leave before involuntary bumps. [answer format: a whole number]
        - need: bumps needed in passengers (tickets minus seats). hint: *: bumped is booked minus capacity when over, volunteers leave before involuntary bumps. [answer format: a whole number]
        - invol: involuntary bumps in passengers (bumps the volunteers did not absorb). hint: *: bumped is booked minus capacity when over, volunteers leave before involuntary bumps. [answer format: a whole number]
        - vun: volunteers unused (count them). hint: *: bumped is booked minus capacity when over, volunteers leave before involuntary bumps. [answer format: a whole number]
        - cost: total voucher cost in whole cents (used volunteers and forced bumps at their rates). hint: *: bumped is booked minus capacity when over, volunteers leave before involuntary bumps. [answer format: a whole number]

        OUTPUT CONTRACT — your reply MUST end with exactly 9 lines,
        one per entity above, in this exact format:
        ENTITY <id> | <answer>
        Example line (format only): ENTITY case_X | 12
        No other text after these lines. No JSON. No explanations.
