workflow_id: harness_v12_hd-66_spoof
name: "Harness v12 SPOOF - hd-66"
description: "DIGEST->GATE->FIX(rescue x3)->AGGREGATE->JUDGE->AUDIT. Case: hd-66 hops=6 route=heavy fix3=always"
version: "10.0.0"
author: "Experiment"
tags: [harness, agentic, v12, digest, rescue3, spoof]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  m_light:
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_heavy:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  m_judge:
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
