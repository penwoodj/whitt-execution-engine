        - pages_w: pages generated by alert W (SEV3 inside quiet window, deferred) [answer format: a whole number]
        - pages_x: pages generated by alert X (SEV2 acked by primary, no escalation) [answer format: a whole number]
        - pages_y: pages generated by alert Y (SEV1 unacked 10 min, backup escalated once) [answer format: a whole number]
