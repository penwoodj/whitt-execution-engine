        page to the backup, two pages total for that one alert.
        
        The fourth and final alert, alert Z, arrived at 04:50, inside the quiet
        window. It was a SEV2: a batch reconciliation job had retried past its
        budget and paused itself, leaving a work queue that would need draining in
        the morning. The severity is the important part here — a colleague once
        insisted that everything during quiet hours gets deferred, but the policy
        defers SEV3 only, and a SEV2 alert pages regardless of the clock. So alert
        Z paged you, the primary, once. You acknowledged it in six minutes from
        your laptop without fully getting out of bed, noted the paused job, and
        went back to sleep. No backup involvement, no escalation.
        
        Two more things for completeness, neither of which affects paging counts.
        First, the facility's overnight security desk runs its own heartbeat
        monitoring and calls a building manager if the office loses power; you do
        not manage the security desk and its call is not a page under your policy.
        Second, a scheduled maintenance notification for the CDN was posted at
        05:15 announcing a harmless cache purge; maintenance notices are not alerts
        with severities, never enter the paging system, and exist in this note only
        because the day team will see it in the inbox and wonder.
        
        As you close the shift, you want the handover to carry two numbers the day
        lead asked for: how many pages the paging system actually delivered over
        the whole night across all four alerts, and how many alerts ended up
        deferred into the morning review queue. Count a deferred alert as one that
        generated zero pages and was marked deferred under the quiet-window rule.
        Report per-alert page counts as well: for each of alert W, alert X, alert
        Y, and alert Z, the number of pages that alert generated. Then combine
        them.
        
        The escalation rota has not always run this smoothly, and the current
        handbook is a direct scar tissue from the winter outage two years back.
        On that night a green coordinator, faced with three simultaneous alerts,
        tried to page every on-call at once on the theory that more eyes meant
        faster resolution. The result was nine engineers half-awake stumbling
        over each other in the same incident channel, two of them starting
        duplicate mitigations that conflicted, and a bridge call that took twenty
        minutes just to sort out who was actually driving. The postmortem was
        brutal in its simplicity — parallel noise had cost more time than the
        original fault — and out of it came the precedence ladder now printed on
        the first page of the rota binder. Severity gates came from the same
        postmortem's second finding, that low-severity pages had trained everyone
        to ignore their phones, so only true customer-facing fires earn the
        after-hours buzz tonight.
        
        Your own evening began at the handoff meeting, where the outgoing
        coordinator walked you through the board state channel by channel, the
        way every shift change runs. You countersigned the log, checked that the
        paging gateway had credited your phone, and accepted the board. Since
        then you have been triaging as the alerts arrived, applying the ladder
        mechanically — customer-facing before internal, higher severity before
        lower, and within the same tier the one that woke people first. Each
        decision you made was noted in the coordination log with a timestamp and
        a one-line rationale, because tomorrow's day-shift lead reads that log
        over coffee and expects to reconstruct your night decision by decision
        without needing to wake anybody.
        
        The rota also keeps a small apparatus around the edges of the night that
        is worth knowing about even though none of it changes page counts. There
        is an automated status page that flips colors on its own whenever
        customer-visible errors tick upward, and marketing sometimes asks for
        the page's history after incidents even though it drives nothing. There
        is a standing bridge line that stays open all night whether anyone uses
        it or not, its dial-in pinned to the top of the incident channel. And
        once a quarter the rota runs a game-day drill where a simulated alert
        cascade lets new coordinators practice the ladder safely; the drill
        logs are stored separately and never mix into production page counts.
        None of that machinery sends a page tonight — the counts you report come
        solely from your triage of the actual alerts against the handbook
        rules.
        
        In the final hour before you close the log, the discipline that matters
        most is re-verification. You re-read each alert's timeline against the
        page you actually sent, not the one you remember sending, because memory
        under sleep pressure invents comfortable summaries. You double-check that
        every deferred alert carries a reason code — deferred-by-precedence is
        the code tonight's backlog understands, and a deferred line without one
        gets flagged in the morning review as an unexplained gap. You confirm the
        escalation contacts you inherited at handoff are still correct, since a
        page sent to a rotated-out phone is a page that never happened as far as
        the handbook is concerned. Only when the log's story reads cleanly from
        first alert to last do you draft the summary the day-shift lead will read
        over coffee — the same summary whose counts you are about to report, and
        the last thing standing between your night and the record.

