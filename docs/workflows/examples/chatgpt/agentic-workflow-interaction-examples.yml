apiVersion: agentic.workflow.schema/v1alpha1
kind: Examples
metadata:
  name: agentic-workflow-examples
  description: |
    Comprehensive examples demonstrating interaction patterns across different
    step type categories, with ASCII diagrams and mind maps.
  owner: agentic-workflow-team
  version: v1alpha1

examples:
  example_1_simple_qa_bot:
    name: "Simple Q&A Bot with ReAct Pattern"
    description: "A question-answering agent using the think-act-observe loop"
    complexity: "moderate"
    involved_layers: [l1, l2, l3]
    used_steps:
      - l2:reason
      - l1:model
      - l1:tool
      - l2:memory_recall
      - l1:loop
      - l3:react_pattern
    ascii_diagram: |
      ┌─────────────────────────────────────────────────────────────────┐
      │              SIMPLE Q&A BOT (ReAct Pattern)          │
      │                                                       │
      │  ┌─────────────────────────────────────────────────────┐  │
      │  │  User Question                                 │   │
      │  └───────────────────────────────────────────────────┘  │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────────────┐  │
      │  │        REACT AGENT                        │   │
      │  │                                           │   │
      │  │  ┌─────────────────────────────────────┐    │   │
      │  │  │    THINK (l2:reason)          │    │   │
      │  │  │         ┌──────────────┐       │    │   │
      │  │  │         │ LLM: Reason    │       │    │   │
      │  │  │         │ "How to answer?"│       │    │   │
      │  │  │         └───────────────┘       │    │   │
      │  │  │              ↓                 │   │
      │  │  │         ┌──────────────┐       │    │   │
      │  │  │         │ ACT (l1:tool)    │       │    │   │
      │  │  │         │ Call search    │       │    │   │
      │  │  │         └───────────────┘       │    │   │
      │  │  │              ↓                 │   │
      │  │  │         ┌──────────────┐       │    │   │
      │  │  │         │ OBSERVE        │       │    │   │
      │  │  │         │ Check result    │       │    │   │
      │  │  │         └───────────────┘       │    │   │
      │  │  │              ↓                 │   │
      │  │  │         Done? Yes → Answer, No → Loop   │   │
      │  │  └───────────────────────────────────────────┘  │   │
      └───────────────────────────────────────────────────────┘  │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────────────┐  │
      │  │  Final Answer                               │   │
      │  └───────────────────────────────────────────────────┘  │
      └─────────────────────────────────────────────────────────────┘
    mind_map: |
      REACT PATTERN
      │
      ├── INPUT: User Question
      │
      ├── THINK (l2:reason)
      │   ├── Generate thought process
      │   └── Decide on tool
      │
      ├── ACT (l1:tool)
      │   ├── Execute tool (e.g., search)
      │   └── Get results
      │
      ├── OBSERVE (l2:reason)
      │   ├── Evaluate results
      │   ├── Decide: More work needed?
      │   │   ├── Yes → Loop back to THINK
      │   │   └── No → Generate final answer
      │
      └── OUTPUT: Final response
    yaml_snippet: |
      workflow:
        name: simple_qa_bot
        entrypoint: think_act
        steps:
          - id: think_act
            kind: react_pattern
            config:
              think_step: reason
              act_step: search
              observe_step: evaluate_result
              stop_condition: "result_confidence >= 0.8"

  example_2_planner_executor:
    name: "Planner-Executor with Replanning"
    description: "Agent decomposes tasks and executes with adaptive replanning on failure"
    complexity: "high"
    involved_layers: [l1, l2, l3]
    used_steps:
      - l2:plan_step
      - l2:decompose
      - l1:map
      - l1:loop
      - l3:planner_executor_pattern
    ascii_diagram: |
      ┌─────────────────────────────────────────────────────────────────┐
      │          PLANNER-EXECUTOR WITH REPLANNING          │
      │                                                       │
      │  ┌───────────────────────────────────────────────────┐  │
      │  │  Complex Task: "Build data pipeline"     │  │
      │  └───────────────────────────────────────────────────┘  │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────────────┐  │
      │  │    PLANNER (l2:plan_step)             │  │
      │  │                                           │   │
      │  │  ┌─────────────────────────────────────┐    │   │
      │  │  │ Reason about task               │    │   │
      │  │  │ Generate subtask plan:          │    │   │
      │  │  │  1. Collect data (search)         │    │   │
      │  │  │  2. Transform data (code)         │    │   │
      │  │  │  3. Aggregate results          │    │   │
      │  │  │  4. Validate output           │    │   │
      │  │  └─────────────────────────────────────┘    │   │
      │  └───────────────────────────────────────────┘  │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────────────┐  │
      │  │    EXECUTOR (l1:map)                 │  │
      │  │                                           │   │
      │  │  ┌──────┬────────┬────────┬────────┬────────┐  │   │
      │  │ │Sub1  │Sub2  │Sub3 │Sub4  │Sub5  │  │   │
      │  │ └──────┴────────┴────────┴────────┴────────┘  │   │
      │                       ↓     ↓     ↓     ↓     ↓        │
      │  Execute each subtask in parallel              │
      │                       ↓     ↓     ↓     ↓     ↓        │
      │  ┌───────────────────────────────────────────┐        │
      │  │  MONITOR (l2:reason)              │        │
      │  │   Check all subtasks completed successfully │        │
      │  │   Any failures?                               │        │
      │  └───────────────────────────────────────────┘        │
      │              ↓                                  │
      │          Yes → Replan, No → Aggregate          │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────────────┐  │
      │  │    REPLAN (l2:plan_step)             │  │
      │  │  Adjust plan: add recovery step            │  │
      │  │  Or adjust subtask for retry             │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │          Continue with modified plan                   │
      └─────────────────────────────────────────────────────┘
    mind_map: |
      PLANNER-EXECUTOR PATTERN
      │
      ├── PLAN (l2:plan_step)
      │   ├── Analyze request
      │   ├── Decompose into subtasks
      │   ├── Create task list with dependencies
      │   └── Output: structured plan
      │
      ├── EXECUTE (l1:map)
      │   ├── Distribute subtasks
      │   ├── Execute in parallel
      │   └── Collect results
      │
      ├── MONITOR (l2:reason)
      │   ├── Check for failures
      │   ├── Detect patterns
      │   └── Decide: continue or replan?
      │
      ├── [If failure] REPLAN (l2:plan_step)
      │   ├── Adjust plan
      │   └── Continue execution
      │
      └── [If success] AGGREGATE
          ├── Combine results
          └── Final output
    yaml_snippet: |
      workflow:
        name: complex_task_planner
        entrypoint: planner
        steps:
          - id: planner
            kind: planner_executor_pattern
            config:
              planner: plan_step
              executor: execute_subtasks
              replanner: adapt_on_failure
              max_replans: 3
              output_ref: $.final_result

  example_3_router_specialist:
    name: "Router-Specialist Multi-Agent System"
    description: "Classification router dispatches to specialized agents for different domains"
    complexity: "high"
    involved_layers: [l1, l2, l3]
    used_steps:
      - l2:intent_classify
      - l2:agent_select
      - l1:choice
      - l3:router_specialist_pattern
      - l2:handoff
    ascii_diagram: |
      ┌─────────────────────────────────────────────────────────────────┐
      │          ROUTER-SPECIALIST MULTI-AGENT           │
      │                                                       │
      │  ┌───────────────────────────────────────────┐  │
      │  │  User Request                             │   │
      │  └───────────────────────────────────────────┘  │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    ROUTER (l2:intent_classify)         │  │
      │  │  ┌───────────────────────────────────────┐  │  │
      │  │  │ Classify Domain                        │  │  │
      │  │  │  [Code] → [research_agent]          │  │   │
      │  │  │  [Data] → [analyst_agent]          │  │   │
      │  │  │  [General] → [generalist_agent]      │  │   │
      │  │  │  [Security] → [security_agent]      │  │   │
      │  │  └───────────────────────────────────────┘  │   │
      │  └───────────────────────────────────────────┘  │
      │              ↓  [4 parallel decisions]         │
      │  ┌───────────────────────────────────────────┐  │
      │  │    AGENT SELECT (l2:agent_select)      │  │
      │  │                                           │  │
      │  │  ┌───────────────────────────────────────┐  │  │
      │  │  │ Pick specialist from domain match │  │  │
      │  │  │ 1. Research agent (l2:handoff)   │  │   │
      │  │  │ 2. Analyst agent (l2:handoff)     │  │   │
      │  │  │ 3. Generalist agent (l2:handoff) │  │   │
      │  │  │ 4. Security agent (l2:handoff)   │  │   │
      │  └───────────────────────────────────────┘  │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  Each agent works independently              │
      │              ↓     ↓       ↓       ↓          │
      │  [Agent 1]   [Agent 2]   [Agent 3]   [Agent 4]  │
      │     (Code)      (Data)     (General)  (Security)  │
      │              ↓          ↓          ↓          ↓          │
      │  ┌───────────────────────────────────────────┐  │
      │  │  COORDINATOR (l2:reason)            │  │
      │  │  Aggregate specialist results           │  │
      │  │  Resolve conflicts                    │  │
      │  │  Synthesize final answer             │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │          Final Answer                            │
      └─────────────────────────────────────────────────────┘
    mind_map: |
      ROUTER-SPECIALIST PATTERN
      │
      ├── INPUT: User Request
      │
      ├── CLASSIFY (l2:intent_classify)
      │   ├── Extract domain: Code, Data, General, Security
      │   ├── Determine intent type
      │   └── Output: domain classification
      │
      ├── ROUTE (l1:choice + l2:agent_select)
      │   ├── Match domain to specialist agent
      │   ├── Transfer control via handoff
      │   └── Output: agent selection
      │
      ├── [PARALLEL] SPECIALISTS (l2:handoff)
      │   ├── Research agent: Handles technical queries
      │   ├── Analyst agent: Handles data analysis
      │   ├── Generalist agent: Handles general queries
      │   └── Security agent: Handles security review
      │
      ├── COORDINATE (l2:reason)
      │   ├── Collect all specialist outputs
      │   ├── Resolve any conflicts
      │   ├── Synthesize final response
      │   └── Output: coordinated answer
      │
      └── FINAL: Response to user
    yaml_snippet: |
      workflow:
        name: multi_agent_router
        entrypoint: classify_request
        steps:
          - id: classify_request
            kind: choice
            config:
              rules:
                - when: $.request.domain == 'code'
                  next: research_agent
                - when: $.request.domain == 'data'
                  next: analyst_agent
                - when: $.request.domain == 'general'
                  next: generalist_agent
                - when: $.request.domain == 'security'
                  next: security_agent
          - id: research_agent
            kind: handoff
            config:
              target_agent: code_specialist
              transfer_reason: "Code review required"
          - id: analyst_agent
            kind: handoff
            config:
              target_agent: data_specialist
              transfer_reason: "Data analysis required"
          - id: generalist_agent
            kind: handoff
            config:
              target_agent: generalist_specialist
              transfer_reason: "General assistance required"
          - id: security_agent
            kind: handoff
            config:
              target_agent: security_specialist
              transfer_reason: "Security review required"

  example_4_maker_checker_quality_loop:
    name: "Maker-Checker with Iterative Refinement"
    description: "Generate draft, evaluate, and iteratively improve with acceptance threshold"
    complexity: "high"
    involved_layers: [l1, l2, l3]
    used_steps:
      - l1:model
      - l2:critique
      - l2:revise
      - l1:loop
      - l3:maker_checker_pattern
    ascii_diagram: |
      ┌─────────────────────────────────────────────────────────────────┐
      │          MAKER-CHECKER QUALITY LOOP              │
      │                                                       │
      │  ┌───────────────────────────────────────────┐  │
      │  │  User Prompt: "Write a summary"      │  │
      │  └───────────────────────────────────────────┘  │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    MAKER (l1:model)                  │  │
      │  │  ┌─────────────────────────────────┐    │  │
      │  │  │  Generate draft summary             │    │  │
      │  │  │ (using LLM with specific prompt)    │  │
      │  │  └─────────────────────────────────┘    │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    CHECKER (l2:critique)            │  │
      │  │  ┌─────────────────────────────────┐    │  │
      │  │  │ Evaluate against criteria:        │    │  │
      │  │  │  1. Accuracy                     │    │  │
      │  │  │ 2. Completeness                 │    │  │
      │  │  │ 3. Clarity                    │    │  │
      │  │  │ 4. Tone                      │    │  │
      │  │  │ 5. Structure                   │    │  │
      │  │  └─────────────────────────────────┘    │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    SCORE (l2:rank)                  │  │
      │  │  Convert criteria to 0-1 score       │  │
      │  │  Weighted average of scores          │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    THRESHOLD CHECK (l1:choice)       │  │
      │  │  score >= 0.9?                     │  │
      │  │  ┌───────┐  Yes: Accept                │  │
      │  │  │No:     │  Pass → REVISE (l2:revise)│  │
      │  │  └───────────────────────────────────────┘    │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓     ↓                          │
      │  [Yes path]  FINAL OUTPUT                │
      │  [No path]  ┌───────────────────────────────┐  │
      │  ┌───────────────────────────────┐  │  │  │ REVISE (l2:revise)            │  │
      │  │ │ Improve based on feedback        │  │
      │  └─────────────────────────────────┘  │  │
      │  └───────────────────────────────────┘    │
      │              ↓                                  │
      │  Loop back to CHECKER                   │
      └───────────────────────────────────────────────┘
      │              ↓                                  │
      │  [After max rounds or threshold met]    │
      └───────────────────────────────────────────┐
      │       ACCEPT AND RETURN DRAFT            │
      └─────────────────────────────────────────────┘
    mind_map: |
      MAKER-CHECKER PATTERN
      │
      ├── MAKER (l1:model)
      │   ├── Generate initial draft
      │   └── Output to CHECKER
      │
      ├── CHECKER (l2:critique)
      │   ├── Evaluate against quality criteria
      │   └── Output score to THRESHOLD
      │
      ├── THRESHOLD (l1:choice)
      │   ├── Check if score >= acceptance_threshold
      │   └── Branch: Accept or Revise
      │
      ├── [If Revise] REVISE (l2:revise)
      │   ├── Generate improved version
      │   ├── Apply feedback from CHECKER
      │   └── Loop back to CHECKER
      │
      └── FINAL OUTPUT
          └── Return accepted draft to user
    yaml_snippet: |
      workflow:
        name: quality_refined_summary
        entrypoint: maker
        steps:
          - id: maker
            kind: maker_checker_pattern
            config:
              maker: draft_generator
              checker: quality_evaluator
              reviser: draft_improver
              max_rounds: 3
              accept_threshold: 0.9
              output_ref: $.final_draft

  example_5_monitor_act_long_running:
    name: "Monitor-Act Long-Running Operation"
    description: "Periodic monitoring with corrective actions for sustained processes"
    complexity: "high"
    involved_layers: [l1, l2, l3]
    used_steps:
      - l1:schedule
      - l1:sensor
      - l2:reason
      - l1:tool
      - l1:loop
      - l3:monitor_act_pattern
    ascii_diagram: |
      ┌─────────────────────────────────────────────────────────────────┐
      │          MONITOR-ACT LONG-RUNNING                 │
      │                                                       │
      │  ┌───────────────────────────────────────────┐  │
      │  │  SCHEDULED TRIGGER (l1:schedule)      │  │
      │  │  Every 5 minutes                    │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    SENSOR (l1:sensor)                 │  │
      │  │  Check: Database health status         │  │
      │  │  Check: API error rate              │  │
      │  │  Check: Disk space                    │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    DECIDE (l2:reason)               │  │
      │  │  Analyze sensor data                 │  │
      │  │  Determine if action needed          │  │
      │  │  Options:                      │  │
      │  │    1. No action needed            │  │
      │  │    2. Restart service           │  │
      │  │    3. Scale up resources       │  │
      │  │    4. Send alert                │  │
      │  └───────────────────────────────────────────┘  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    [If action needed] ACT (l1:tool)  │  │
      │  │  Execute corrective action            │  │
      │  │  Restart service via API             │  │
      │  │  Send alert notification           │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    LOOP (l1:loop)                    │  │
      │  │  Wait for next scheduled trigger     │  │
      │  └───────────────────────────────────────────┘  │
      └─────────────────────────────────────────────────────┘
    mind_map: |
      MONITOR-ACT PATTERN
      │
      ├── TRIGGER (l1:schedule)
      │   ├── Periodic execution
      │   └── Initiates SENSOR
      │
      ├── SENSOR (l1:sensor)
      │   ├── Observe system state
      │   ├── Collect metrics
      │   └── Output to DECIDE
      │
      ├── DECIDE (l2:reason)
      │   ├── Analyze sensor data
      │   ├── Determine action
      │   └── Output to ACT (or loop back)
      │
      ├── ACT (l1:tool)
      │   ├── Execute corrective action
      │   └── Return result
      │
      ├── LOOP (l1:loop)
      │   ├── Continue pattern
      │   └── Wait for next trigger
      │
      └── Continuous operation with self-correction
    yaml_snippet: |
      workflow:
        name: health_monitoring
        entrypoint: monitor
        steps:
          - id: monitor
            kind: monitor_act_pattern
            config:
              monitor_step: check_system_health
              decision_step: decide_action
              action_step: execute_correction
              cadence: PT5M

  example_6_human_in_the_loop_approval:
    name: "Human-in-the-Loop Approval"
    description: "Pause execution for human approval and resume with input"
    complexity: "moderate"
    involved_layers: [l1, l2, l4]
    used_steps:
      - l1:interrupt
      - l2:intent_classify
      - l1:approve
      - l2:reason
      - l4:decide_phase
    ascii_diagram: |
      ┌─────────────────────────────────────────────────────────────────┐
      │          HUMAN-IN-THE-LOOP APPROVAL              │
      │                                                       │
      │  ┌───────────────────────────────────────────┐  │
      │  │  Agent Processing (l2 context)         │  │
      │  │  ...steps executing...             │  │
      │  └───────────────────────────────────────────┘  │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │  INTERRUPT (l1:interrupt)             │  │
      │  │  Save checkpoint                     │  │
      │  │  Request approval                    │  │
      │  │  Pause execution                     │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │  APPROVE (l1:approve)              │  │
      │  │  ┌─────────────────────────────────┐    │  │
      │  │ │ Human: Approve or Reject          │  │   │
      │  │ └─────────────────────────────────┘    │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │  RESUME (l2:reason)               │  │
      │  │  Receive human decision               │  │
      │  │  Process decision                   │  │
      │  │  ┌─────────────────────────────────┐    │  │
      │  │  │ Approve? Continue execution      │  │   │
      │  │ │ Reject? Handle rejection         │  │   │
      │  │ └─────────────────────────────────┘    │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │          Resume from checkpoint                │
      └─────────────────────────────────────────────────────┘
    mind_map: |
      HUMAN-IN-THE-LOOP PATTERN
      │
      ├── EXECUTE (l2 context)
      │   ├── Agent processes normally
      │   └── Approaching decision point
      │
      ├── INTERRUPT (l1:interrupt)
      │   ├── Save checkpoint
      │   ├── Request human input
      │   └── Pause execution
      │
      ├── APPROVE (l1:approve)
      │   ├── Present options to human
      │   ├── Wait for decision
      │   └── Receive choice
      │
      ├── DECIDE (l4:decide_phase)
      │   ├── Process human decision
      │   └── Determine next action
      │
      └── RESUME (l2:reason)
          ├── Continue from checkpoint
          ├── Handle approved path
          └── Handle rejected path
    yaml_snippet: |
      workflow:
        name: approval_required_workflow
        entrypoint: process_request
        steps:
          - id: process_request
            kind: sequential_pattern
            steps:
              - prepare_response
              - check_approval_needed
          - id: prepare_response
            kind: model
            config:
              model: gpt-4
              prompt: |
                Prepare a response for the user's request.
                If this requires external approval, use an interrupt step.
              output_ref: $.draft_response
          - id: check_approval_needed
            kind: intent_classify
            config:
              labels: [requires_approval, auto_approve]
              output_ref: $.approval_required

  example_7_supervisor_swarm_parallel_research:
    name: "Supervisor-Swarm Parallel Research"
    description: "Coordinator dispatches research tasks to multiple worker agents"
    complexity: "very-high"
    involved_layers: [l1, l2, l3]
    used_steps:
      - l2:decompose
      - l1:parallel
      - l1:map
      - l2:reason
      - l2:handoff
      - l3:supervisor_swarm_pattern
      - l1:reduce
    ascii_diagram: |
      ┌─────────────────────────────────────────────────────────────────┐
      │          SUPERVISOR-SWARM PARALLEL RESEARCH     │
      │                                                       │
      │  ┌───────────────────────────────────────────┐  │
      │  │  Complex Research Request                │   │
      │  └───────────────────────────────────────────┘  │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │  SUPERVISOR (l2:reason)           │  │
      │  │  ┌─────────────────────────────────┐    │  │
      │  │  │ DECOMPOSE (l2:decompose)        │  │   │
      │  │  │ Break into subtopics:           │  │   │
      │  │  │   1. Market trends               │  │   │
      │  │  │   2. Competitor analysis          │  │   │
      │  │  │   3. Technical review            │  │   │
      │  │  │   4. Regulatory changes          │  │   │
      │  │  └─────────────────────────────────┘    │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │  DISPATCH (l1:parallel)           │  │
      │  │  ┌──────┬────────┬────────┬────────┬────────┐  │  │
      │  │  │Agent1│Agent2│Agent3│Agent4│... │  │
      │  │ └──────┴────────┴────────┴────────┴────────┘  │  │
      │  │  Handoff tasks (l2:handoff)   │  │
      │  ↓     ↓      ↓      ↓      ↓        │
      │  ┌────┬────────┬────────┬────────┬────────┐  │
      │  │Task1│Task2│Task3│Task4│... │  │
      │  └────┴────────┴────────┴────────┴────────┘  │
      │  Workers execute independently            │
      │              ↓     ↓      ↓      ↓      ↓        │
      │  ┌───────────────────────────────────────────┐  │
      │  │  AGGREGATE (l1:reduce)            │  │
      │  │  Collect all agent outputs            │  │
      │  │  Synthesize into report            │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │  COORDINATOR (l2:reason)         │  │
      │  │  Review all results                │  │
      │  │  Identify gaps                    │  │
      │  │  Request additional research          │  │
      │  └───────────────────────────────────────────┘  │
      │  [If gaps] Repeat decomposition         │
      │              ↓                                  │
      │          Final report                           │
      └─────────────────────────────────────────────────────┘
    mind_map: |
      SUPERVISOR-SWARM PATTERN
      │
      ├── SUPERVISOR (l2:reason)
      │   ├── Decompose task into subtasks
      │   ├── Create research questions
      │   └── Dispatch to workers
      │
      ├── WORKERS (l2:handoff via l1:parallel)
      │   ├── Receive subtask
      │   ├── Execute research
      │   └── Return findings
      │
      ├── AGGREGATOR (l1:reduce)
      │   ├── Collect all worker outputs
      │   ├── Synthesize final report
      │   └── Output to user
      │
      └── Coordinated parallel research with quality control

  example_8_map_reduce_batch_processing:
    name: "Map-Reduce Batch Processing"
    description: "Scatter collection to items, process in parallel, aggregate results"
    complexity: "high"
    involved_layers: [l1, l3]
    used_steps:
      - l1:split
      - l1:map
      - l1:reduce
      - l3:map_reduce_pattern
    ascii_diagram: |
      ┌─────────────────────────────────────────────────────────────────┐
      │          MAP-REDUCE BATCH PROCESSING             │
      │                                                       │
      │  ┌───────────────────────────────────────────┐  │
      │  │  Input: [Item1, Item2, ..., ItemN]    │  │
      │  └───────────────────────────────────────────┘  │
      │                       ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │    SPLIT (l1:split)               │  │
      │  │  Divide into batches                │  │
      │  │  ┌──────┬────────┬────────┬────────┐  │  │
      │  │  │B1   │B2   │B3   │... │  │
      │  │  └──────┴────────┴────────┴────────┘  │
      │  └───────────────────────────────────────────┘  │
      │              ↓  ↓    ↓    ↓                │
      │  ┌───────────────────────────────────────────┐  │
      │  │    MAP (l1:map)                  │  │
      │  │  ┌─────────────────────────────────┐   │  │
      │  │  │  Map each batch in parallel      │   │  │
      │  │  │  B1 → [P1, P2, ...]         │   │  │
      │  │  │  B2 → [P1, P2, ...]         │   │  │
      │  │  │  ...                             │   │  │
      │  │  └─────────────────────────────────┘   │  │
      │  └───────────────────────────────────────────┘  │
      │       ↓  ↓     ↓     ↓    ↓    ↓          │
      │  ┌───────────────────────────────────────────┐  │
      │  │  Parallel Processing              │  │
      │  │  [P1, P1]   [P2, P2]  ...  │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓    ↓     ↓    ↓    ↓          │
      │  ┌───────────────────────────────────────────┐  │
      │  │    REDUCE (l1:reduce)            │  │
      │  │  Aggregate all batch outputs         │  │
      │  │  [[P1], [P2], [P3], ...]       │  │
      │  └───────────────────────────────────────────┘  │
      │              ↓                                  │
      │  ┌───────────────────────────────────────────┐  │
      │  │  Final Aggregated Results           │  │
      │  │  [All items processed]             │  │
      │  └───────────────────────────────────────────┘  │
      └─────────────────────────────────────────────────────┘
    mind_map: |
      MAP-REDUCE PATTERN
      │
      ├── SPLIT (l1:split)
      │   ├── Divide collection into batches
      │   └── Output batches
      │
      ├── MAP (l1:map)
      │   ├── Apply subworkflow to each batch
      │   ├── Execute in parallel
      │   └── Output batch results
      │
      ├── REDUCE (l1:reduce)
      │   ├── Collect all batch outputs
      │   ├── Aggregate (sum, merge, concat)
      │   └── Output final result
      │
      └── Scalable batch processing with parallel execution
    yaml_snippet: |
      workflow:
        name: batch_document_processing
        entrypoint: split_batches
        steps:
          - id: split_batches
            kind: split
            config:
              source: $.documents
              strategy: by_size
              size: 100
              output_ref: $.batches
          - id: process_batches
            kind: map_reduce_pattern
            config:
              split_step: split_batches
              map_step: process_single_batch
              reduce_step: aggregate_results

cross_category_interactions:
  cognitive_to_control_flow:
    description: "Agent cognition (l2) decisions how l1 control flow executes"
    interactions:
      - "l2:reason generates plans for l1:choice"
      - "l2:decompose creates subtasks for l1:map"
      - "l2:intent_classify routes to different l1:choice branches"
    examples: [example_1_simple_qa_bot, example_2_planner_executor]
  control_flow_to_patterns:
    description: "l1 primitives compose l3 reusable patterns"
    interactions:
      - "l1:parallel enables l3:map_reduce_pattern"
      - "l1:loop enables l3:react_pattern"
      - "l1:choice enables l3:router_specialist_pattern"
      - "l1:map + l1:reduce = l3:map_reduce_pattern"
    examples: [example_3_router_specialist, example_7_supervisor_swarm_parallel_research, example_8_map_reduce_batch_processing]
  patterns_to_semantic:
    description: "l3 patterns implement l4 business phases"
    interactions:
      - "l3:sequential_pattern implements linear l4 phases"
      - "l3:monitor_act_pattern implements long-running l4:execute_phase"
      - "l3:maker_checker_pattern implements iterative l4:refine_phase"
    examples: [example_5_monitor_act_long_running, example_4_maker_checker_quality_loop]
  all_to_meta:
    description: "All layers governed by l5 meta-orchestration"
    interactions:
      - "l1:task/execute subject to l5:governance"
      - "l2:memory_write contributes to l5:memory_compactor"
      - "l1:log/trace/emit to l5:evaluation_program"
      - "l1:tool calls tracked by l5:budget_manager"
    examples: [all_examples]
