---
workflow_id: url_parameters_requests
name: URL Parameter Construction and Request Formatting
description: Demonstrates URL parameter handling, query string construction, path parameters, URL encoding, and request formatting
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - web-operations
  - url-parameters
  - request-formatting
  - query-strings

models:
  url_agent:
    name: "URL and Request Agent"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

tool_permissions:
  web_operations:
    fetch:
      require_confirmation: false
      timeout_secs: 30
      # max_concurrent_requests: → moved to agent-queue

agentic_workflow:
  step_1_build_simple_url:
    name: "Build Simple URL with Query Parameters"    model: "${models.url_agent}"

    input:
      prompt: |
        Construct URL with query parameters.

        Base URL: https://jsonplaceholder.typicode.com/posts

        Query parameters to add:
        - userId: 1
        - _limit: 10
        - _sort: id
        - _order: desc

        Expected result:
        ```
        https://jsonplaceholder.typicode.com/posts?userId=1&_limit=10&_sort=id&_order=desc
        ```

        Requirements:
        1. Proper URL encoding for special characters
        2. Query string formatting (key=value&key2=value2)
        3. Preserve parameter order
        4. Handle empty values

        Return constructed URL and parameter map.

    when:


      after_step_succeeds:


        save_to: simple_url
  step_2_build_path_parameters:
    name: "Build URL with Path Parameters"    model: "${models.url_agent}"

    input:
      prompt: |
        Construct URL with path parameters.

        Base URL: https://api.example.com

        Path template: /users/{userId}/posts/{postId}/comments

        Path parameter values:
        - userId: 123
        - postId: 456

        Expected result:
        ```
        https://api.example.com/users/123/posts/456/comments
        ```

        Requirements:
        1. Path parameters substitute {placeholder} with values
        2. No encoding needed for path parameters
        3. Validate path structure
        4. Handle missing parameters

        Return constructed URL and parameter mapping.

    when:


      after_step_succeeds:


        save_to: path_url
  step_3_complex_query_strings:
    name: "Complex Query String Construction"    model: "${models.url_agent}"

    input:
      prompt: |
        Construct URL with complex query strings.

        Base URL: https://api.example.com/search

        Complex parameters:
        - q: rust programming language (needs URL encoding)
        - filters: {"type":"article","date":"2024"}
        - tags: ["tutorial","beginner","guide"]
        - page: 1
        - per_page: 20
        - sort_by: relevance
        - facets: difficulty:easy

        Requirements:
        1. URL encode spaces and special characters
        2. JSON array encoding for tags parameter
        3. JSON object encoding for filters parameter
        4. Preserve parameter structure

        Expected URL pattern:
        ```
        q=rust%20programming%20language&filters=%7B%22type%22%3A%22article%22%2C%22date%22%3A%222024%22%7D&tags%5B%22tutorial%22%2C%22beginner%22%2C%22guide%22%5D&page=1&per_page=20&sort_by=relevance&facets=difficulty%3Aeasy
        ```

        Return constructed URL and encoding details.

    when:


      after_step_succeeds:


        save_to: complex_url
  step_4_fragment_identifiers:
    name: "URL with Fragment Identifiers"    model: "${models.url_agent}"

    input:
      prompt: |
        Construct URL with fragment identifiers.

        Base URL: https://docs.example.com/api

        Fragment parameters:
        - section: authentication
        - subsection: oauth
        - version: v2
        - anchor: token-validation

        Expected result:
        ```
        https://docs.example.com/api#section:authentication/subsection:oauth/version:v2/anchor:token-validation
        ```

        Requirements:
        1. Fragment follows # symbol
        2. Use colon-separated key:value pairs
        3. Supports nested sections
        4. Client-side only (not sent to server)

        Return constructed URL with fragment structure.

    when:


      after_step_succeeds:


        save_to: fragment_url
  step_5_url_validation:
    name: "URL Validation and Sanitization"    model: "${models.url_agent}"

    input:
      prompt: |
        Validate and sanitize URLs.

        Test URLs:
        1. https://valid.example.com/path - Valid
        2. http://valid.example.com/path - Valid
        3. https://malicious.com/../../../etc/passwd - Invalid (path traversal)
        4. https://example.com?script=<script>alert(1)</script> - Invalid (XSS)
        5. javascript:alert('xss') - Invalid (javascript protocol)
        6. ftp://example.com - Invalid (blocked protocol)

        Validation checks:
        1. Protocol whitelist (https, http)
        2. Domain blacklist check
        3. Path traversal prevention (..)
        4. XSS detection in parameters
        5. Maximum URL length (2083 characters)

        For each URL:
        - Validate format
        - Sanitize unsafe characters
        - Block if on blacklist
        - Pass if valid

        Return validation results and sanitized URLs.

    when:


      after_step_succeeds:


        save_to: validation_results
  step_6_build_rest_request:
    name: "Build RESTful Request with Parameters"    model: "${models.url_agent}"

    input:
      prompt: |
        Build RESTful request with URL parameters.

        API endpoint: https://api.github.com/repos

        Request components:
        - Path: /{owner}/{repo}/issues
        - Path values: owner=torvalds, repo=linux
        - Query parameters:
          - state: open
          - sort: created
          - direction: desc
          - per_page: 25
          - page: 1
          - labels: bug,help wanted
          - since: 2024-01-01

        Expected URL:
        ```
        https://api.github.com/repos/torvalds/linux/issues?state=open&sort=created&direction=desc&per_page=25&page=1&labels=bug,help%20wanted&since=2024-01-01
        ```

        Return constructed request URL and parameter breakdown.

    when:


      after_step_succeeds:


        save_to: rest_request
  step_7_encode_decode_examples:
    name: "URL Encoding and Decoding"    model: "${models.url_agent}"

    input:
      prompt: |
        Demonstrate URL encoding and decoding.

        Encoding examples:
        1. Simple string: "hello world" → "hello%20world"
        2. Special chars: "hello@example.com" → "hello%40example.com"
        3. Unicode: "café" → "caf%C3%A9"
        4. Complex query: "q=rust programming" → "q=rust%20programming"
        5. Reserved chars: "path/to/file" → "path%2Fto%2Ffile"

        Decoding examples:
        1. Decode: "hello%20world%21" → "hello world!"
        2. Decode: "caf%C3%A9" → "café"
        3. Decode: "%2F%3F%23" → "/?#"

        Requirements:
        1. Use proper encoding (UTF-8)
        2. Encode reserved characters automatically
        3. Decode carefully to prevent injection
        4. Handle plus sign vs %20

        Return encoding/decoding examples and rules.

    when:


      after_step_succeeds:


        save_to: encoding_examples
  step_8_generate_url_guide:
    name: "Generate URL Construction Guide"    model: "${models.url_agent}"

    input:
      variables:
        simple: "${step.step_1_build_simple_url.output}"
        path: "${step.step_2_build_path_parameters.output}"
        complex: "${step.step_3_complex_query_strings.output}"
        fragment: "${step.step_4_fragment_identifiers.output}"
        validation: "${step.step_5_url_validation.output}"
        rest: "${step.step_6_build_rest_request.output}"
        encoding: "${step.step_7_encode_decode_examples.output}"

      prompt: |
        Generate comprehensive URL construction guide.

        Topics covered:
        - Simple URLs: {{simple}}
        - Path parameters: {{path}}
        - Complex queries: {{complex}}
        - Fragments: {{fragment}}
        - Validation: {{validation}}
        - REST requests: {{rest}}
        - Encoding/decoding: {{encoding}}

        Guide sections:
        1. URL structure and components
        2. Query string best practices
        3. Path parameter patterns
        4. Fragment usage
        5. Security considerations
        6. Encoding rules
        7. Validation checklist
        8. Common pitfalls

        Write guide to: ./workspace/output/url-construction-guide.md

    when:


      after_step_succeeds:


        save_to: url_guide      file_output:
        path: ./workspace/output/url-construction-guide.md

