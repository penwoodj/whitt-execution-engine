---
# Workflow: File Permissions and Backup Strategies
# Category: File Operations
# Focus: Permission checks, backup strategies, and safe file operations
#
# This workflow demonstrates:
# - File permission validation
# - Automatic backup before writes
# - Multi-level confirmation workflows
# - Rollback mechanisms
# - Safe deletion with recovery options

workflow_id: file_permissions_backup
name: File Permissions and Backup Strategies
description: Workflow demonstrating safe file operations with permission management, automatic backups, confirmation workflows, and rollback capabilities
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - file-operations
  - permissions
  - backup-strategies
  - safe-operations

# ─────────────────────────────────────────────────────────────────────────────
# MODEL CONFIGURATION
# Model for permission and backup orchestration
# ─────────────────────────────────────────────────────────────────────────────
models:
  safety_coordinator:
    name: "Safety Coordinator"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW EXECUTION STRATEGY
# Serial execution with safety checks
# ─────────────────────────────────────────────────────────────────────────────
workflow_execution_strategy:
  load_unload: one_at_a_time
  processing: serial

  timeout:
    total: 1h
    per_operation:
      file_operation: 60s

# ─────────────────────────────────────────────────────────────────────────────
# TOOL PERMISSIONS
# Strict permission controls with confirmation requirements
# ─────────────────────────────────────────────────────────────────────────────
tool_permissions:
  file_operations:
    read:
      require_confirmation: false
      allowed_paths:
        - ./workspace/production/**/*
        - ./workspace/backup/**/*
      forbidden_paths:
        - ./workspace/secrets
        - ./workspace/critical-system
      max_file_size_mb: 50

    write:
      require_confirmation: true
      allowed_paths:
        - ./workspace/production/**/*
      backup_existing: true
      max_file_size_mb: 200
      prevent_overwrite: true
      create_parent_directories: true

    delete:
      require_confirmation: true
      allowed_paths:
        - ./workspace/temp/**/*
        - ./workspace/cache/**/*
      confirm_delete_count: 5
      skip_confirmation_for_patterns:
        - "*.tmp"
        - "*.cache"
        - "*.bak"

# ─────────────────────────────────────────────────────────────────────────────
# AGENTIC WORKFLOW
# Safe file operations with permission checks and backups
# ─────────────────────────────────────────────────────────────────────────────
agentic_workflow:
  # ── STEP 1: Check File Permissions Before Operations ─────────
  step_1_check_permissions:
    name: "Check File Permissions"
    description: "Verify permissions for all target files before operations"    model: "${models.safety_coordinator}"

    input:
      prompt: |
        Check permissions for the following paths:
        - ./workspace/production/app-config.yml
        - ./workspace/production/data-records.json
        - ./workspace/backup/

        For each path, verify:
        1. Read permission status
        2. Write permission status
        3. Execute permission status (if applicable)
        4. Ownership information
        5. Current file size (if exists)

        Return a permission report indicating safe operations.

    when:


      after_step_succeeds:


        save_to: permission_report
  # ── STEP 2: Create Backup Directory if Missing ───────────────
  step_2_setup_backup:
    name: "Setup Backup Directory"
    description: "Ensure backup directory exists with proper permissions"
    tool:
      type: shell
      command: "mkdir -p ./workspace/backup && chmod 750 ./workspace/backup"
      require_confirmation: false

    when:


      after_step_succeeds:


        save_to: backup_setup_result
  # ── STEP 3: Backup Existing Files ────────────────────────────────
  step_3_backup_files:
    name: "Backup Existing Files"
    description: "Create timestamped backups of existing files before modification"    model: "${models.safety_coordinator}"

    input:
      variables:
        permissions: "${step.step_1_check_permissions.output}"

      prompt: |
        Based on the permission check:
        {{permissions}}

        Create backups of existing files:
        1. Check if files exist
        2. Create backup directory with timestamp: ./workspace/backup/YYYYMMDD_HHMMSS/
        3. Copy existing files to backup directory
        4. Verify backup integrity
        5. Record backup metadata

        Use safe copy operations:
        - Preserve file permissions
        - Verify checksum after copy
        - Log backup location

    when:


      after_step_succeeds:


        save_to: backup_results      file_output:
        path: ./workspace/backup/backup-manifest.json

  # ── STEP 4: Request Confirmation for Write Operations ─────────
  step_4_confirm_write:
    name: "Confirm Write Operations"
    description: "Interactive confirmation before performing write operations"    model: "${models.safety_coordinator}"

    input:
      variables:
        backup_status: "${step.step_3_backup_files.output}"

      prompt: |
        Backup completed:
        {{backup_status}}

        About to perform write operations to:
        - ./workspace/production/app-config.yml
        - ./workspace/production/data-records.json

        Review backup status and confirm:
        1. All files successfully backed up?
        2. Backup checksums verified?
        3. Ready to proceed with writes?

        If ready, confirm with "CONFIRM_WRITE". Otherwise, abort.

    when:


      after_step_succeeds:


        save_to: write_confirmation
  # ── STEP 5: Perform Safe Write Operations ─────────────────────
  step_5_safe_write:
    name: "Perform Safe Writes"
    description: "Execute write operations with safety checks and atomic writes"    model: "${models.safety_coordinator}"

    input:
      variables:
        confirmation: "${step.step_4_confirm_write.output}"

      prompt: |
        Confirmation received:
        {{confirmation}}

        Perform safe write operations:
        1. Verify confirmation is "CONFIRM_WRITE"
        2. Use atomic write pattern:
           - Write to temporary file (.tmp)
           - Verify write success
           - Move/rename to final filename
        3. Preserve file permissions
        4. Validate file integrity after write
        5. Log all write operations

        Write the new configuration:
        - app-config.yml: New configuration settings
        - data-records.json: Updated data records

    when:


      after_step_succeeds:


        save_to: write_results
  # ── STEP 6: Verify Write Operations ────────────────────────────
  step_6_verify_writes:
    name: "Verify Write Operations"
    description: "Verify write operations completed successfully and files are valid"    model: "${models.safety_coordinator}"

    input:
      prompt: |
        Verify the write operations to:
        - ./workspace/production/app-config.yml
        - ./workspace/production/data-records.json

        Verification steps:
        1. Check files exist
        2. Verify file permissions
        3. Validate file formats (YAML/JSON syntax)
        4. Check file sizes are reasonable
        5. Compare with backup if needed

        Return verification status and any issues found.

    when:


      after_step_succeeds:


        save_to: verification_results
  # ── STEP 7: Rollback if Verification Fails ──────────────────
  step_7_rollback:
    name: "Rollback on Failure"
    description: "Rollback changes if verification fails"    model: "${models.safety_coordinator}"

    input:
      variables:
        verification: "${step.step_6_verify_writes.output}"
        backup_info: "${step.step_3_backup_files.output}"

      prompt: |
        Verification results:
        {{verification}}

        Backup information:
        {{backup_info}}

        If verification found errors:
        1. Check rollback conditions
        2. Restore files from backup
        3. Verify restoration success
        4. Log rollback operations
        5. Generate rollback report

        If verification passed, skip rollback and log success.

    when:


      after_step_succeeds:


        save_to: rollback_results      file_output:
        path: ./workspace/rollback-report.json

  # ── STEP 8: Safe Delete of Temporary Files ───────────────────
  step_8_safe_delete:
    name: "Safe Delete Temporary Files"
    description: "Clean up temporary files with confirmation and safety checks"    model: "${models.safety_coordinator}"

    input:
      prompt: |
        Clean up temporary files from:
        - ./workspace/temp/
        - ./workspace/cache/

        Safety checks:
        1. List all temporary files
        2. Confirm file patterns (*.tmp, *.cache, *.bak)
        3. For batches > 5 files, request confirmation
        4. Use safe delete with logging
        5. Verify delete success

        Delete only confirmed temporary files.

    when:


      after_step_succeeds:


        save_to: cleanup_results
# ─────────────────────────────────────────────────────────────────────────────
# ERROR HANDLING
# Robust error handling for file operations
# ─────────────────────────────────────────────────────────────────────────────
error_handling:
  default_action:
    type: skip
    reason: "Skip failed files, continue with rest of batch"

  handling_by_type:
    permission_denied:
      action: log_and_continue
      notify_level: error
      message: "Permission denied - check file permissions"

    backup_failed:
      action: fail_workflow
      notify_level: critical
      message: "Backup failed - cannot proceed without backup"

    write_failed:
      action: rollback_and_continue
      notify_level: error
      message: "Write failed - initiating rollback"

    verification_failed:
      action: rollback_and_fail
      notify_level: critical
      message: "Verification failed - rolling back changes"

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING CONFIGURATION
# Detailed logging for safety operations
# ─────────────────────────────────────────────────────────────────────────────
