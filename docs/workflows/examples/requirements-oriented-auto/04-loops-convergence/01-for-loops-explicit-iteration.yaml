---
# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW: For Loops with Explicit Iteration Ranges
# ─────────────────────────────────────────────────────────────────────────────
# Demonstrates: count-based loops with explicit start/end values,
#               iteration tracking, and controlled iteration ranges
# ─────────────────────────────────────────────────────────────────────────────

workflow_id: for_loops_explicit_iteration
name: "For Loops with Explicit Iteration Ranges"
description: |
  Demonstrates explicit for-loop patterns with defined start/end values,
  iteration counters, and range-based processing for batch operations.
version: "1.0.0"
author: "AgentSDK Team"
tags:
  - loops
  - iteration
  - batch-processing
  - count-based

# ── MODEL CONFIGURATION ──────────────────────────────────────────────────────
models:
  primary_analyzer:
    name: primary_analyzer
    host:
      type: lmstudio
      connection_settings:
        host: localhost
        port: 1234
        connection_timeout_secs: 30

    max_allowed:
      ram: 25%
      vram: 4GB
      cpu: 60%
      attention_tokens: 128000
      concurrent_requests: 2

    min_allowed:
      ram: 12%
      vram: 2GB
      cpu: 30%
      attention_tokens: 32000

    ram_allocation:


      strategy: dynamic

    model_memory:
      cache_size: medium
      kv_cache_quantization: auto
      attention_context: auto

    execution:
      timeout:
        load_into_memory: 45s
        time_to_first_response: 60s
        total_time_to_response: 4h
      max_turns: 15
      stop_on_tool_failure: false
      accumulate_tool_results: true

    thinking:
      budget_tokens: 8192
      capture_in_output: true
      capture_in_events: true
      stream_to_log: true

    tools:
      default_permissions:
        web_access: ask
        file_read: trust
        file_write: ask
        shell_exec: ask
      allowed_tools: [grep, file_read, file_write]
      forbidden_tools: []

      type: agentsdk

# ── HARDCODED VALUES ──────────────────────────────────────────────────────────
agentic_workflow:
  hardcoded_values:
    # Batch processing configuration
    batch_config:
      batch_size: 10
      total_items: 50
      start_index: 0

    # Iteration ranges
    processing_ranges:
      phase_one:
        start: 1
        end: 25
        step: 1
      phase_two:
        start: 26
        end: 50
        step: 5

    # Test configurations
    test_iterations:
      min: 1
      max: 10
      default: 5

  # ── WORKFLOW STEPS ────────────────────────────────────────────────────────
  steps:

    # ═══════════════════════════════════════════════════════════════════════
    # STEP 1: For Loop with Simple Range (1 to 10)
    # ═══════════════════════════════════════════════════════════════════════
    step_1_simple_range_loop:
      name: "Simple Range Loop (1 to 10)"
      description: |
        Basic for loop iterating from 1 to 10 with step size of 1.
        Demonstrates fundamental count-based iteration pattern.
      generative_entity: "${models.primary_analyzer}"

      loop:
        type: count

        count_config:
          # Explicit range definition
          start_value: 1
          end_value: 10
          step_size: 1

          # Iteration variable name
          iteration_variable: i

          # Optional: Stop early if condition met
          stop_condition: "${loop.results.quality_score} >= 0.95"
          on_stop: return_result

          # Maximum iterations (safety limit)
          max_iterations: 10

      prompt: |
        Execute iteration {{loop.iteration_variable}} of 10.

        For each iteration:
        1. Generate a code snippet for batch item {{loop.iteration_variable}}
        2. Analyze the snippet for quality
        3. Assign a quality score (0.0 to 1.0)
        4. Track iteration results

        Current iteration: {{loop.i}}
        Total iterations: {{loop.total_iterations}}
        Progress: {{loop.progress_percent}}%

        Output format:
        ```json
        {
          "iteration": {{loop.i}},
          "snippet": "generated code here",
          "quality_score": 0.85,
          "analysis": "brief analysis"
        }
        ```

      when:


        after_step_succeeds:


          save_to: simple_range_results          - iterations_completed
          - results_by_iteration
          - stopped_early
          - final_quality_score
          - total_duration_secs

      retry:
        max_attempts: 2
        backoff: exponential
        delay_ms: 500

    # ═══════════════════════════════════════════════════════════════════════
    # STEP 2: For Loop with Custom Step Size
    # ═══════════════════════════════════════════════════════════════════════
    step_2_stepped_range_loop:
      name: "Stepped Range Loop (0 to 100, step 10)"
      description: |
        For loop with explicit step size, processing items at intervals.
        Useful for batch processing and sampling scenarios.
      generative_entity: "${models.primary_analyzer}"

      loop:
        type: count

        count_config:
          start_value: 0
          end_value: 100
          step_size: 10

          iteration_variable: batch_index

          # Process every 10th item
          max_iterations: 11

          # Checkpoint every iteration
          checkpoint_interval: 1

      prompt: |
        Process batch at index {{loop.batch_index}}.

        Batch processing configuration:
        - Current batch: {{loop.batch_index}} / 100
        - Batch size: {{hardcoded_values.batch_config.batch_size}}
        - Items to process: {{loop.batch_index}} to {{loop.batch_index | plus: 9}}

        Tasks for this batch:
        1. Load batch items {{loop.batch_index}} through {{loop.batch_index | plus: 9}}
        2. Process each item with analysis
        3. Aggregate batch results
        4. Report batch statistics

        Output:
        ```json
        {
          "batch_index": {{loop.batch_index}},
          "items_processed": 10,
          "batch_summary": {
            "success_count": 8,
            "failure_count": 2,
            "average_score": 0.87
          },
          "cumulative_progress": {{loop.progress_percent}}
        }
        ```

      when:


        after_step_succeeds:


          save_to: stepped_range_results          - batches_processed
          - batch_summaries
          - total_items_processed
          - overall_progress

      depends_on:
        - step_1_simple_range_loop

    # ═══════════════════════════════════════════════════════════════════════
    # STEP 3: Nested For Loops (2D Iteration)
    # ═══════════════════════════════════════════════════════════════════════
    step_3_nested_for_loops:
      name: "Nested For Loops (Matrix Processing)"
      description: |
        Demonstrates nested iteration with outer and inner loops.
        Processes a 5x5 matrix of data items.
      generative_entity: "${models.primary_analyzer}"

      loop:
        type: count

        count_config:
          # Outer loop: rows (1 to 5)
          start_value: 1
          end_value: 5
          step_size: 1
          iteration_variable: row

          # Nested loop configuration
          nested_loop:
            type: count
            count_config:
              # Inner loop: columns (1 to 5)
              start_value: 1
              end_value: 5
              step_size: 1
              iteration_variable: col

            # Combine variables for position
            position_format: "({{loop.row}}, {{loop.col}})"

          max_iterations: 25  # 5 * 5 total iterations

      prompt: |
        Process matrix cell at position ({{loop.row}}, {{loop.col}}).

        Matrix processing task:
        - Row: {{loop.row}} of 5
        - Column: {{loop.col}} of 5
        - Cell index: {{loop.iteration_count}} of 25
        - Position: ({{loop.row}}, {{loop.col}})

        For each cell:
        1. Retrieve data at matrix[{{loop.row}}][{{loop.col}}]
        2. Apply transformation algorithm
        3. Store result with position marker
        4. Track row/column statistics

        Current progress:
        - Row progress: {{loop.row_progress}}%
        - Overall progress: {{loop.progress_percent}}%

        Output:
        ```json
        {
          "position": {"row": {{loop.row}}, "col": {{loop.col}}},
          "cell_index": {{loop.iteration_count}},
          "input_value": "original data",
          "output_value": "transformed data",
          "row_stats": {"processed": {{loop.col}}},
          "matrix_stats": {"total_processed": {{loop.iteration_count}}}
        }
        ```

      when:


        after_step_succeeds:


          save_to: nested_loop_results          - matrix_dimensions
          - cells_processed
          - results_by_position
          - row_summaries
          - column_summaries

      depends_on:
        - step_2_stepped_range_loop

    # ═══════════════════════════════════════════════════════════════════════
    # STEP 4: For Loop with Dynamic Range
    # ═══════════════════════════════════════════════════════════════════════
    step_4_dynamic_range_loop:
      name: "Dynamic Range Loop (Variable Bounds)"
      description: |
        For loop with dynamically determined start/end values
        based on previous step output.
      generative_entity: "${models.primary_analyzer}"

      loop:
        type: count

        count_config:
          # Dynamic range from previous step
          start_value: "${step.step_3_nested_for_loops.output.matrix_dimensions.rows}"
          end_value: "${step.step_3_nested_for_loops.output.matrix_dimensions.rows + 10}"
          step_size: 2

          iteration_variable: dynamic_index

          # Variable maximum based on context
          max_iterations: "${min(hardcoded_values.test_iterations.default * 2, 10)}"

      prompt: |
        Process dynamic range iteration {{loop.dynamic_index}}.

        Dynamic range configuration:
        - Start: {{step.step_3_nested_for_loops.output.matrix_dimensions.rows}}
        - End: {{step.step_3_nested_for_loops.output.matrix_dimensions.rows + 10}}
        - Current: {{loop.dynamic_index}}
        - Step size: 2

        Tasks:
        1. Fetch data items starting from previous matrix size
        2. Process in increments of 2
        3. Correlate with matrix results from step 3
        4. Build extended result set

        Output:
        ```json
        {
          "dynamic_index": {{loop.dynamic_index}},
          "relative_position": {{loop.dynamic_index | minus: step.step_3_nested_for_loops.output.matrix_dimensions.rows}},
          "processed_items": [],
          "correlation_data": {}
        }
        ```

      when:


        after_step_succeeds:


          save_to: dynamic_range_results          - iterations_completed
          - dynamic_range_used
          - results_by_index
          - correlation_with_previous

      depends_on:
        - step_3_nested_for_loops

    # ═══════════════════════════════════════════════════════════════════════
    # STEP 5: Reverse Range Loop (Countdown)
    # ═══════════════════════════════════════════════════════════════════════
    step_5_reverse_range_loop:
      name: "Reverse Range Loop (Countdown)"
      description: |
        For loop counting backwards from 10 to 1.
        Demonstrates descending iteration for cleanup/rollback scenarios.
      generative_entity: "${models.primary_analyzer}"

      loop:
        type: count

        count_config:
          # Reverse range (countdown)
          start_value: 10
          end_value: 1
          step_size: -1

          iteration_variable: countdown

          max_iterations: 10

          # Reverse flag for clarity
          direction: descending

      prompt: |
        Cleanup phase - countdown iteration {{loop.countdown}}.

        Cleanup tasks (descending order):
        - Remaining steps: {{loop.countdown}}
        - Progress: {{loop.progress_percent}}% complete

        For each countdown step:
        1. Identify resources allocated in iteration {{loop.countdown}}
        2. Verify dependencies are released
        3. Deallocate resources in reverse order
        4. Log cleanup status

        Countdown: {{loop.countdown}}... {{loop.countdown | minus: 1}}... 

        Output:
        ```json
        {
          "countdown": {{loop.countdown}},
          "resources_released": ["item1", "item2"],
          "dependencies_cleared": true,
          "cleanup_status": "complete",
          "remaining_steps": {{loop.countdown | minus: 1}}
        }
        ```

      when:


        after_step_succeeds:


          save_to: reverse_range_results          - cleanup_iterations
          - resources_released
          - cleanup_order
          - final_status

      depends_on:
        - step_4_dynamic_range_loop

    # ═══════════════════════════════════════════════════════════════════════
    # STEP 6: Aggregation of All Loop Results
    # ═══════════════════════════════════════════════════════════════════════
    step_6_aggregate_results:
      name: "Aggregate Loop Results"
      description: |
        Combine results from all for-loop iterations into a final summary.
      generative_entity: "${models.primary_analyzer}"

      prompt: |
        Aggregate all for-loop iteration results:

        1. Simple Range Loop (1-10):
        {{step.step_1_simple_range_loop.output}}

        2. Stepped Range Loop (0-100, step 10):
        {{step.step_2_stepped_range_loop.output}}

        3. Nested For Loops (5x5 matrix):
        {{step.step_3_nested_for_loops.output}}

        4. Dynamic Range Loop:
        {{step.step_4_dynamic_range_loop.output}}

        5. Reverse Range Loop (countdown):
        {{step.step_5_reverse_range_loop.output}}

        Generate comprehensive summary including:
        - Total iterations across all loops
        - Success/failure statistics
        - Processing time breakdown
        - Quality metrics aggregation
        - Recommendations for optimization

      inputs:
        simple_results: "${step.step_1_simple_range_loop.output}"
        stepped_results: "${step.step_2_stepped_range_loop.output}"
        nested_results: "${step.step_3_nested_for_loops.output}"
        dynamic_results: "${step.step_4_dynamic_range_loop.output}"
        reverse_results: "${step.step_5_reverse_range_loop.output}"

      when:


        after_step_succeeds:


          save_to: final_aggregation        file_output:
          path: ./workspace/output/for_loops_summary.json
          format: json
          encoding: utf-8

      depends_on:
        - step_5_reverse_range_loop

# ── WORKFLOW EXECUTION STRATEGY ───────────────────────────────────────────────
workflow_execution_strategy:
  load_unload: lazy
  processing: serial

  parallel:
    disabled: true

  memory:
    allocation:
      strategy: dynamic
    model_lifecycle:
      load_unload_strategy: lazy
      unload_unused: true

  timeout:
    total: 2h
    per_operation:
      step: 15m
      tool_call: 5m

  error_handling:
    default_action:
      type: retry
      reason: "Retry failed loop iterations"

    retry:
      max_attempts_per_step: 3
      backoff_strategy:
        type: exponential
        base_delay_ms: 1000
        max_delay_ms: 30000

  checkpointing:
    configuration:
      level: info
      output_path: "./workspace/checkpoints/for_loops_checkpoint.json"
    triggers:
      interval:
        steps: [step_3_nested_for_loops, step_6_aggregate_results]

# ── LOGGING CONFIGURATION ─────────────────────────────────────────────────────

metrics:
  collection:
    step_level:
      - execution_time_secs
      - memory_peak_mb
      - iteration_count
    custom_metrics:
      - name: total_iterations
        description: "Sum of all loop iterations"
      - name: average_quality_score
        description: "Mean quality across iterations"
