---
workflow_id: metrics_collection
name: Metrics Collection and Performance Tracking
description: Demonstrates pipeline-level, step-level, model-level, and tool-level metrics collection with output aggregation
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - logging-monitoring
  - metrics-collection
  - performance-tracking

models:
  metrics_collector:
    name: "Metrics Collector"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

agentic_workflow:
  step_1_baseline_metrics:
    name: "Collect Baseline Metrics"
    model: "${models.metrics_collector}"

    input:
      prompt: |
        Collect baseline metrics before workflow execution.

        Baseline metrics:
        - System resources available: CPU, RAM, GPU
        - Disk space: check available
        - Network latency: measure to default endpoint
        - Model load time: time model load
        - Initial memory footprint: measure

        Establish baseline for comparison.
        Return baseline measurements.

    when:
      after_step_succeeds:
        save_to: baseline

  step_2_pipeline_metrics:
    name: "Collect Pipeline Metrics"
    model: "${models.metrics_collector}"

    input:
      prompt: |
        Collect pipeline-level metrics throughout execution.

        Pipeline metrics:
        - Total workflow duration: measure start to finish
        - Step sequence optimization: calculate throughput
        - Parallelization efficiency: measure actual vs ideal
        - Bottleneck identification: find slowest step
        - Resource utilization: aggregate across all steps

        Collection points:
        1. Workflow start timestamp
        2. Each step start and end
        3. Parallel group execution times
        4. Idle time between steps
        5. Total resource consumption

        Return pipeline performance analysis.

    when:
      after_step_succeeds:
        save_to: pipeline_metrics

  step_3_step_metrics:
    name: "Collect Step-Level Metrics"
    model: "${models.metrics_collector}"

    input:
      prompt: |
        Collect detailed metrics for each step.

        Step metrics:
        - Execution time per step: measure
        - Memory usage per step: peak and average
        - Tool invocation count per step: count
        - Agent turns per step: track
        - Retry count per step: sum
        - Timeout occurrences per step: identify
        - Cache hit rate per step: calculate

        Performance indicators:
        1. Step efficiency (work / time)
        2. Resource efficiency (output / resources)
        3. Reliability (success rate)
        4. Optimisation opportunities

        Return comprehensive step metrics.

    when:
      after_step_succeeds:
        save_to: step_metrics

  step_4_model_metrics:
    name: "Collect Model-Level Metrics"
    model: "${models.metrics_collector}"

    input:
      prompt: |
        Collect model performance metrics.

        Model metrics:
        - Inference time per call: measure
        - Tokens generated per call: count
        - Cache hit rate: calculate
        - Memory per inference: measure
        - Load/unload overhead: measure
        - Total tokens processed: sum

        Model performance:
        1. Throughput (tokens/second)
        2. Latency (inference time)
        3. Efficiency (tokens per MB memory)
        4. Cache effectiveness

        Return model performance analysis.

    when:
      after_step_succeeds:
        save_to: model_metrics

  step_5_tool_metrics:
    name: "Collect Tool-Level Metrics"
    model: "${models.metrics_collector}"

    input:
      prompt: |
        Collect tool execution metrics.

        Tool metrics:
        - Tool execution time distribution: measure
        - Success rate by tool type: calculate
        - Average response time by tool: calculate
        - Timeout rate by tool: track
        - Error rate by tool: measure

        Tool categories:
        1. File operations: read, write, delete
        2. Web operations: fetch, scrape
        3. Shell operations: exec
        4. Database operations: query, insert

        Return tool performance breakdown.

    when:
      after_step_succeeds:
        save_to: tool_metrics

  step_6_aggregate_and_analyze:
    name: "Aggregate and Analyze All Metrics"
    model: "${models.metrics_collector}"

    input:
      variables:
        baseline: "${step.step_1_baseline_metrics.output}"
        agentic_workflow: "${step.step_2_pipeline_metrics.output}"
        step: "${step.step_3_step_metrics.output}"
        model: "${step.step_4_model_metrics.output}"
        tool: "${step.step_5_tool_metrics.output}"

      prompt: |
        Aggregate and analyze all collected metrics.

        Analysis tasks:
        1. Compare actual vs baseline performance
        2. Identify performance trends
        3. Find optimization opportunities
        4. Calculate quality scores
        5. Generate performance report

        Report sections:
        - Executive summary
        - Pipeline performance
        - Step-level breakdown
        - Model efficiency
        - Tool performance
        - Custom metrics results
        - Recommendations

        Generate comprehensive metrics report.

    when:
      after_step_succeeds:
        save_to: metrics_report
        file_output:
          path: ./workspace/output/metrics-report.json
