---
# Workflow: User Input Prompts and Validation
# Category: User Inputs & UI
# Focus: User input mechanisms, validation, error handling, retry logic
#
# This workflow demonstrates:
# - Multiple input types (text_area, text_line, select, multi_select, confirm)
# - Input validation with regex patterns
# - Error messages and recovery strategies
# - Step-level input prompts
# - UI configuration with panels and layouts
# - Keyboard shortcuts and accessibility features
# - Input sanitization and transformation

workflow_id: user_input_prompts_validation
name: User Input Prompts and Validation
description: Comprehensive workflow demonstrating user input mechanisms with validation, error handling, and interactive UI configuration
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - user-inputs
  - validation
  - error-handling
  - interactive-ui
  - form-validation

# ─────────────────────────────────────────────────────────────────────────────
# MODEL CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
models:
  default_router: automatic

  input_processor:
    name: "Input Processing Agent"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
        connection_timeout_secs: 30
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan
    max_turns: 15

    tools:
      default_permissions:
        web_access: block
        file_read: trust
        file_write: always_ask
        shell_exec: block

  validation_agent:
    name: "Validation and Error Handler"
    host:
      type: ollama
      connection_settings:
        base_url: "http://localhost:11434"
        timeout_secs: 60
        # 60s timeout provides time for validation regex evaluation
    generative_entity: "llama3.2"
        # Faster model for quick validation decisions
    generative_entity: "llama3.2"

    tools:
      default_permissions:
        web_access: block
        file_read: trust
        file_write: ask

# ─────────────────────────────────────────────────────────────────────────────
# USER INPUTS CONFIGURATION
# Demonstrates comprehensive input collection with validation
# ─────────────────────────────────────────────────────────────────────────────
agentic_workflow:
  user_inputs:
    execution_mode: interactive
    workflow_level:
      ask_at_start: true

      # ── WORKFLOW-LEVEL INPUTS ─────────────────────────────────────────────
      inputs:
        # Input Type 1: Text Area (Multiline)
        - id: project_description
          type: text_area
          label: "Project Description"
          placeholder: |
            Describe your project goals, requirements, and constraints.
            Include specific details about what you want to achieve.
          default_value: ""
          multiline: true
          max_length: 2000

          validation:
            required: true
            min_length: 50
            max_length: 2000
            pattern: "^[A-Za-z0-9\\s\\.,!?\\-\\n]+$"
            error_message: |
              Project description must be:
              - At least 50 characters long
              - Maximum 2000 characters
              - Only letters, numbers, and basic punctuation

          accessibility:
            aria_label: "Enter a detailed project description"
            help_text: "Describe your project in detail. This helps us understand your requirements."

        # Input Type 2: Text Line (Single Line)
        - id: target_directory
          type: text_line
          label: "Target Directory"
          placeholder: "./workspace/my-project"
          default_value: "/workspace"

          validation:
            required: true
            pattern: "^/([A-Za-z0-9_\\-./]+/)*[A-Za-z0-9_\\-./]+$"
            error_message: "Must be a valid absolute path (e.g., ./workspace/my-project)"

          sanitization:
            trim_whitespace: true
            remove_trailing_slash: true
            normalize_path: true

          accessibility:
            aria_label: "Enter the target directory path"
            help_text: "Absolute path to your project directory"

        # Input Type 3: Select (Dropdown)
        - id: programming_language
          type: select
          label: "Programming Language"
          options:
            - value: rust
              label: "Rust"
              description: "Systems programming with memory safety"
            - value: python
              label: "Python"
              description: "General-purpose, easy to learn"
            - value: javascript
              label: "JavaScript/TypeScript"
              description: "Web and Node.js development"
            - value: go
              label: "Go"
              description: "Concurrent, fast compilation"
            - value: java
              label: "Java"
              description: "Enterprise applications"
            - value: cpp
              label: "C++"
              description: "High-performance systems"
          default_value: rust
          required: true

          validation:
            error_message: "Please select a valid programming language"

        # Input Type 4: Multi-Select (Checkbox Group)
        - id: features_to_include
          type: multi_select
          label: "Features to Include"
          min_selections: 1
          max_selections: 5
          options:
            - value: authentication
              label: "User Authentication"
              selected: false
            - value: database
              label: "Database Integration"
              selected: true
            - value: api
              label: "REST API"
              selected: true
            - value: testing
              label: "Test Suite"
              selected: false
            - value: docker
              label: "Docker Configuration"
              selected: false
            - value: ci_cd
              label: "CI/CD Pipeline"
              selected: false
            - value: documentation
              label: "Documentation Generator"
              selected: false
            - value: monitoring
              label: "Monitoring & Logging"
              selected: false

          validation:
            min_selections: 1
            max_selections: 5
            error_message: "Select between 1 and 5 features"

          accessibility:
            aria_label: "Select features to include in your project"
            help_text: "Choose up to 5 features for your project"

        # Input Type 5: Confirm (Yes/No)
        - id: confirm_execution
          type: confirm
          label: "Start Workflow Execution"
          message: "Ready to begin workflow with the provided inputs?"
          default_value: false
          required: true
          keyboard_shortcut: Enter
          cancel_shortcut: Esc

          validation:
            must_be_true: true
            error_message: "You must confirm to proceed with execution"

        # Input Type 6: Number Input
        - id: max_iterations
          type: number
          label: "Maximum Iterations"
          placeholder: "5"
          default_value: 5
          min_value: 1
          max_value: 20

          validation:
            required: true
            min_value: 1
            max_value: 20
            integer_only: true
            error_message: "Must be an integer between 1 and 20"

        # Input Type 7: Email Input
        - id: contact_email
          type: email
          label: "Contact Email"
          placeholder: "user@example.com"
          default_value: ""

          validation:
            required: false
            pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}$"
            error_message: "Please enter a valid email address"

          sanitization:
            lowercase: true
            trim_whitespace: true

        # Input Type 8: URL Input
        - id: repository_url
          type: url
          label: "Repository URL"
          placeholder: "https://github.com/user/repo"
          default_value: ""

          validation:
            required: false
            pattern: "^https?://[A-Za-z0-9.-]+(?:/[A-Za-z0-9._~:/?#@!$&'()*+,;=%-]*)?$"
            error_message: "Please enter a valid HTTP/HTTPS URL"

          sanitization:
            trim_whitespace: true
            ensure_https: true

        # Input Type 9: Password Input
        - id: api_key
          type: password
          label: "API Key (Optional)"
          placeholder: "Enter your API key"
          default_value: ""

          validation:
            required: false
            min_length: 16
            max_length: 128
            error_message: "API key must be between 16 and 128 characters"

          security:
            mask_display: true
            no_logging: true
            encrypt_in_memory: true

      # ── UI CONFIGURATION ───────────────────────────────────────────────
      ui_configuration:
        layout: tabbed

        panels:
          - id: basic_info
            label: "Basic Information"
            icon: "📋"
            inputs:
              - project_description
              - target_directory
              - programming_language

          - id: features
            label: "Features"
            icon: "⚙️"
            inputs:
              - features_to_include
              - max_iterations

          - id: advanced
            label: "Advanced Options"
            icon: "🔧"
            inputs:
              - contact_email
              - repository_url
              - api_key

          - id: confirmation
            label: "Confirmation"
            icon: "✅"
            inputs:
              - confirm_execution

        styling:
          theme: modern
          color_scheme: dark
          font_size: medium
          animations: enabled

        notifications:
          sound: true
          position: top_right
          duration_ms: 5000

        progress_indicator:
          type: stepper
          show_percentage: true

    # ── STEP-LEVEL INPUTS ─────────────────────────────────────────────
    step_level:
      ask_at_step_start: true

      inputs_by_step:
        step_3_code_generation:
          - id: confirm_file_write
            type: confirm
            label: "Write Generated Code"
            message: "Ready to write generated code to {{target_directory}}. Continue?"
            required: true
            keyboard_shortcut: Enter
            cancel_shortcut: Esc

            validation:
              must_be_true: true
              error_message: "File write confirmation required"

          - id: file_naming_convention
            type: select
            label: "File Naming Convention"
            options:
              - value: snake_case
                label: "snake_case"
              - value: camelCase
                label: "camelCase"
              - value: kebab-case
                label: "kebab-case"
              - value: PascalCase
                label: "PascalCase"
            default_value: snake_case

        step_5_testing_validation:
          - id: test_framework
            type: select
            label: "Test Framework"
            options:
              - value: pytest
                label: "pytest (Python)"
              - value: cargo_test
                label: "cargo test (Rust)"
              - value: jest
                label: "Jest (JavaScript)"
              - value: go_test
                label: "go test (Go)"
            default_value: cargo_test

          - id: coverage_threshold
            type: number
            label: "Minimum Code Coverage (%)"
            default_value: 80
            min_value: 0
            max_value: 100

            validation:
              min_value: 0
              max_value: 100
              error_message: "Coverage must be between 0 and 100"

  # ─────────────────────────────────────────────────────────────────────────────
  # WORKFLOW STEPS
  # ─────────────────────────────────────────────────────────────────────────────
  steps:
    step_1_validate_all_inputs:
      name: "Validate All User Inputs"
      # type: inferred from prompt + generative_entity
      model: "${models.validation_agent}"

      input:
        prompt: |
          Validate all user inputs received from the workflow input form.

          Inputs to validate:
          - Project Description: {{project_description}}
          - Target Directory: {{target_directory}}
          - Programming Language: {{programming_language}}
          - Features: {{features_to_include}}
          - Max Iterations: {{max_iterations}}
          - Contact Email: {{contact_email}}
          - Repository URL: {{repository_url}}

          Validation tasks:
          1. Check all required fields are present
          2. Validate formats (path, email, URL)
          3. Check for conflicting selections
          4. Verify directory exists and is writable
          5. Sanitize all inputs

          IF any_validation_fails:
            THEN report specific errors
            Answer: "Decision: validation_failed"

          ELSE:
            THEN proceed to analysis
            Answer: "Decision: validation_passed"

        strict_yes_no_required: true

    when:
      after_step_succeeds:
        save_to: validation_results
        fields:
          - is_valid
          - errors
          - warnings
          - sanitized_inputs

      retry:
        max_attempts: 2
        backoff_strategy: exponential
        delay_ms: 500
        level: step_restart

    step_2_analyze_requirements:
      name: "Analyze Project Requirements"
      # type: inferred from prompt + generative_entity
      model: "${models.input_processor}"

      input:
        enabled_by:
          condition: "step_1_validate_all_inputs.output.is_valid == true"
          description: "Only proceed if all inputs are valid"

        prompt: |
          Analyze the validated project requirements.

          Project Description:
          {{project_description}}

          Target Directory: {{target_directory}}
          Programming Language: {{programming_language}}
          Selected Features: {{features_to_include}}
          Max Iterations: {{max_iterations}}

          Analysis tasks:
          1. Extract key requirements from description
          2. Map features to implementation tasks
          3. Identify dependencies
          4. Estimate complexity
          5. Create implementation plan

          Provide structured analysis with:
          - Requirements breakdown
          - Feature implementation order
          - Estimated effort per feature
          - Risk assessment


      file_operations:
        - operation: write
          file_path: "{{target_directory}}/.workflow/analysis.json"
          format: json
          encoding: utf-8

    step_3_code_generation:
      name: "Generate Project Code"
      # type: inferred from prompt + generative_entity
      model: "${models.input_processor}"

      input:
        enabled_by:
          condition: "step_2_analyze_requirements.completed == true"
          description: "Proceed after requirements analysis"

        prompt: |
          Generate code for the project based on analysis.

          Requirements Analysis:
          {{requirements_analysis}}

          Naming Convention: {{file_naming_convention}}

          Generate:
          1. Project structure
          2. Main application files
          3. Configuration files
          4. Feature implementations
          5. Boilerplate code

          Follow best practices for {{programming_language}}.


      file_operations:
        - operation: write
          file_path: "{{target_directory}}/src/"
          format: text
          encoding: utf-8

      retry:
        max_attempts: 3
        backoff_strategy: exponential
        on_failure: escalate_model

    step_4_review_generated_code:
      name: "Review Generated Code"
      # type: inferred from prompt + generative_entity
      model: "${models.validation_agent}"

      input:
        prompt: |
          Review the generated code for quality and correctness.

          Generated Code Structure:
          {{generated_code}}

          Review criteria:
          1. Code style consistency
          2. Error handling coverage
          3. Security vulnerabilities
          4. Performance issues
          5. Best practice adherence

          IF code_quality_score >= 0.85:
            THEN proceed to testing
            Answer: "Decision: proceed"

          ELSE IF improvements_needed:
            THEN regenerate with fixes
            Answer: "Decision: regenerate"

          ELSE:
            THEN escalate for manual review
            Answer: "Decision: escalate"

        strict_yes_no_required: true


      branches:
        - branch_id: "proceed_to_testing"
          next_step: step_5_testing_validation
          enabled_by: "code_review.decision == 'proceed'"

        - branch_id: "regenerate_code"
          next_step: step_3_code_generation
          enabled_by: "code_review.decision == 'regenerate'"

        - branch_id: "manual_review"
          next_step: step_6_manual_review
          enabled_by: "code_review.decision == 'escalate'"

    step_5_testing_validation:
      name: "Run Tests and Validation"
      # type: inferred from prompt + generative_entity
      model: "${models.validation_agent}"

      input:
        prompt: |
          Execute tests and validate the generated code.

          Test Framework: {{test_framework}}
          Coverage Threshold: {{coverage_threshold}}%

          Tasks:
          1. Run unit tests
          2. Run integration tests
          3. Check code coverage
          4. Validate against requirements
          5. Generate test report

          IF all_tests_pass AND coverage >= threshold:
            THEN complete workflow
            Answer: "Decision: complete"

          ELSE:
            THEN identify failures
            Answer: "Decision: failures_found"

        strict_yes_no_required: true


      retry:
        max_attempts: 2

    step_6_manual_review:
      name: "Manual Review Required"
      # type: inferred from prompt + generative_entity
      model: "${models.validation_agent}"

      input:
        prompt: |
          Code requires manual review before proceeding.

          Issues identified:
          {{code_review.issues}}

          Create a detailed review document with:
          1. Issue summary
          2. Recommended fixes
          3. Risk assessment
          4. Approval checklist

          Wait for human approval before continuing.


        file_output:
          path: "{{target_directory}}/.workflow/manual_review.md"

    step_7_finalize_workflow:
      name: "Finalize and Report"
      # type: inferred from prompt + generative_entity
      model: "${models.input_processor}"

      input:
        enabled_by:
          condition: "step_5_testing_validation.output.decision == 'complete'"
          description: "Complete after successful testing"

        prompt: |
          Finalize the workflow and generate final report.

          Compile results from:
          - Requirements Analysis: {{requirements_analysis}}
          - Generated Code: {{generated_code}}
          - Code Review: {{code_review}}
          - Test Results: {{test_results}}

          Create final report with:
          1. Executive summary
          2. Implementation details
          3. Test coverage report
          4. Known issues and limitations
          5. Next steps and recommendations


        file_output:
          path: "{{target_directory}}/.workflow/FINAL_REPORT.md"
          encoding: utf-8

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW EXECUTION STRATEGY
# ─────────────────────────────────────────────────────────────────────────────
workflow_execution_strategy:
  load_unload: lazy
  processing: serial

  timeout:
    total: 2h
    per_operation:
      step: 30m
      tool_call: 10m

  error_handling:
    default_action:
      type: retry
      reason: "Attempt automatic recovery"

    retry:
      max_attempts_per_step: 3
      backoff_strategy:
        type: exponential
        base_delay_ms: 1000
        max_delay_ms: 30000

    handling_by_type:
      validation_errors:
        action: ask_user
        notify_level: warning

      generation_errors:
        action: retry_with_fallback
        notify_level: error

      user_errors:
        action: escalate_immediately
        notify_level: critical

  checkpointing:
    configuration:
      level: debug
      output_path: "{{target_directory}}/.workflow/checkpoints/"

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

metrics:

  collection:
    workflow_level:
      - total_duration_secs
      - user_input_count
      - validation_retry_count

    step_level:
      - execution_time_secs
      - retry_count

  output:
    path: "{{target_directory}}/.workflow/metrics/workflow_metrics.json"
    format: json
    include_timestamps: true
