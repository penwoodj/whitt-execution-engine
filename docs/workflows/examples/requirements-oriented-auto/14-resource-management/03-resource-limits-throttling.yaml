---
workflow_id: resource_limits_throttling
name: Resource Limits and Throttling
description: Demonstrates resource limit enforcement, throttling mechanisms, OOM handling, and graceful degradation
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - resource-management
  - resource-limits
  - throttling
  - oom-handling

models:
  limits_agent:
    name: "Limits and Throttling Agent"
    host:
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

resource_allocation:
  strategy: dynamic
  
  limits:
    max_allowed:
      ram: 30%
      vram: 6GB
      cpu: 50%
      gpu: 50%
    
    min_allowed:
      ram: 10%
      vram: 2GB
      cpu: 25%
      gpu: 25%

  throttling:
    memory_pressure_handling:
      strategy: throttle
      trigger_threshold_percent: 85
      throttle_factor: 0.5
      on_oom: swap
    
    concurrency_limits:
    max_concurrent_steps: 5
    # max_parallel_workflows: → moved to agent-queue
    max_models_loaded: 4
    max_tool_executions: 10

agentic_workflow:
  step_1_test_normal_operations:
    name: "Test Normal Operations"
    model: "${models.limits_agent}"
    
    input:
      prompt: |
        Test workflow with normal resource usage.
        
        Normal operations:
        1. Execute 5 steps sequentially (parallel moved to agent-queue)
        2. Load 3 models sequentially
        3. Perform file operations
        4. Execute tool commands
        5. Monitor resource usage
        
        Expected resource usage:
        - Memory: 20-25% of max allowed
        - CPU: 30-45% of max allowed
        - GPU: 25-40% of max allowed
        - 5 operations within limits (parallel moved to agent-queue)
        
        Success criteria:
        - All operations complete within normal timeframe
        - No throttling triggered
        - No OOM conditions encountered
        
        Return normal operations results with resource metrics.
    
    when:
      after_step_succeeds:
        save_to: normal_ops_result
  step_2_test_throttling:
    name: "Test Throttling Mechanisms"
    model: "${models.limits_agent}"
    
    input:
      prompt: |
        Test throttling under pressure.
        
        Pressure simulation:
        - Simulate high memory pressure: 90% used
        - Exceed throttling threshold of 85%
        - Trigger throttling behavior
        
        Throttling behavior:
        - Reduce concurrency from 5 to 2
        - Increase processing delays
        - Lower priority of non-critical tasks
        - Queue tasks for later execution
        - Skip non-critical operations temporarily
        
        Expected throttling:
        - Concurrency reduced to 2 steps
        - Processing delays increased by 50%
        - Throughput reduced by 40%
        - Lower priority tasks delayed
        
        Success criteria:
        - Throttling successfully triggered
        - System remains stable under pressure
        - Resource usage within throttled limits
        
        Return throttling test results.
    
    when:
      after_step_succeeds:
        save_to: throttling_test
  step_3_oom_handling:
    name: "Test OOM Handling"
    model: "${models.limits_agent}"
    
    input:
      prompt: |
        Simulate and test OOM handling.
        
        OOM scenarios:
        1. Memory exhaustion: system uses 95% RAM
        2. OOM imminent: system predicts OOM in 30s
        3. OOM occurred: model crashed during allocation
        
        OOM handling strategies:
        1. Graceful degradation: switch to lower quality mode
        2. Emergency cleanup: release resources, cancel tasks
        3. Prevention: predict and pre-allocate resources
        4. Recovery plan: resume from last checkpoint
        
        Graceful degradation steps:
        - Reduce model context window (from 8192 to 4096 tokens)
        - Disable heavy operations
        - Switch to simpler model variants
        - Enable streaming responses
        - Lower inference precision temporarily
        5. Save partial results frequently
        
        Return OOM handling strategy.
    
    when:
      after_step_succeeds:
        save_to: oom_handling
  step_4_graceful_degradation:
    name: "Graceful Degradation Example"
    model: "${models.limits_agent}"
    
    input:
      prompt: |
        Demonstrate graceful degradation under pressure.
        
        Degradation scenario:
        - System under heavy load (memory pressure > 90%)
        - Available resources: 15% RAM, 10% CPU
        - Cannot complete all operations at full quality
        
        Graceful degradation:
        - Accept 70% quality instead of 100%
        - Serve partial results with degradation notice
        - Continue workflow instead of failing
        - Provide lower-quality alternatives
        - Maintain system stability
        
        Example:
        Instead of crashing on OOM:
        - Reduce context window (8192 → 4096 tokens)
        - Stream responses as they generate
        - Accept some inaccuracies
        - Continue workflow with degraded performance
        - Return partial success with warnings
        
        Return graceful degradation demonstration.
    
    when:
      after_step_succeeds:
        save_to: graceful_degradation
  step_5_limits_test_summary:
    name: "Generate Limits and Throttling Test Summary"
    model: "${models.limits_agent}"
    
    input:
      variables:
        normal: "${step.step_1_test_normal_operations.output}"
        throttling: "${step.step_2_test_throttling.output}"
        oom: "${step.step_3_oom_handling.output}"
        degradation: "${step.step_4_graceful_degradation.output}"
    
      prompt: |
        Generate comprehensive test summary.
        
        Test coverage:
        - Normal operations: {{normal}}
        - Throttling: {{throttling}}
        - OOM handling: {{oom}}
        - Graceful degradation: {{degradation}}
        
        Recommendations:
        - Optimal resource limits based on tests
        - Effective throttling threshold identified
        - OOM prevention strategies
        - Graceful degradation triggers
        - Monitoring and alerting setup
        
        Generate complete resource management test report.
    
    when:
      after_step_succeeds:
        save_to: test_summary
error_handling:
  default_action:
    reason: "Resource limits exceeded triggers degradation"
  handling_by_type:
    resource_limit_exceeded:
      action: graceful_degradation
      notify_level: warning
    oom_occurred:
      action: graceful_degradation
      notify_level: error
    throttling_triggered:
      action: log_and_continue
      notify_level: info