workflow_id: benchmark_15_models
name: "15-Model Comprehensive Benchmark"
description: "Comprehensive benchmark of 15 diverse models across architectures, sizes, and specializations (60-120 min)"
min_schema_version: "2.0.0"

models:
  primary:
    provider: lmstudio
    model: "${benchmark.current_model}"

execution:
  mode: serial
  memory:
    max_allocated_memory_mb: 8192
    model_memory_mb: 6144
    unload_unused: true

logging:
  global:
    level: info
    detail: medium
    output_type: chat
    format: json
    console: true
  performance_metrics:
    level: debug
    detail: very_high

benchmark:
  prompts:
    - "Explain the concept of recursion in programming, with a practical example."
    - "Write a Rust function that finds the longest increasing subsequence in a vector."
    - "Analyze the tradeoffs between microservices and monolithic architectures."
  max_tokens: 128
  temperature: 0.7
  top_p: 0.9

agentic_workflow:
  - step: benchmark_model
    id: bench_step
    loop:
      count:
        max_iterations: 15
        iteration_variable: current_model
    input:
      prompts:
        - "Explain the concept of recursion in programming, with a practical example."
        - "Write a Rust function that finds the longest increasing subsequence in a vector."
        - "Analyze the tradeoffs between microservices and monolithic architectures."
      max_tokens: 128
    output:
      save_to: benchmark_results

