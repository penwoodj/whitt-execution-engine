workflow_id: benchmark_3_models
name: "3-Model Quick Validation Benchmark"
description: "Quick benchmark of 3 diverse models for validation (15-30 min)"
min_schema_version: "2.0.0"

models:
  primary:
    provider: lmstudio
    model: "${benchmark.current_model}"

execution:
  mode: serial
  memory:
    max_allocated_memory_mb: 8192
    model_memory_mb: 6144
    unload_unused: true

logging:
  global:
    level: info
    detail: medium
    output_type: chat
    format: json
    console: true
  performance_metrics:
    level: debug
    detail: very_high

benchmark:
  prompts:
    - "Explain the concept of recursion in programming, with a practical example."
    - "Write a Rust function that finds the longest increasing subsequence in a vector."
    - "Analyze the tradeoffs between microservices and monolithic architectures."
  max_tokens: 128
  temperature: 0.7
  top_p: 0.9

agentic_workflow:
  - step: benchmark_model
    id: bench_step
    loop:
      count:
        max_iterations: 3
        iteration_variable: current_model
    input:
      prompts:
        - "Explain the concept of recursion in programming, with a practical example."
        - "Write a Rust function that finds the longest increasing subsequence in a vector."
        - "Analyze the tradeoffs between microservices and monolithic architectures."
      max_tokens: 128
    output:
      save_to: benchmark_results

model_list:
  - /run/media/jon/data/models/lmstudio-community/Qwen3-4B-Instruct-2507-GGUF/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
  - /run/media/jon/data/models/lmstudio-community/Phi-4-mini-reasoning-GGUF/Phi-4-mini-reasoning-Q4_K_M.gguf
  - /run/media/jon/data/models/hugging-quants/Llama-3.2-1B-Instruct-Q8_0-GGUF/llama-3.2-1b-instruct-q8_0.gguf
