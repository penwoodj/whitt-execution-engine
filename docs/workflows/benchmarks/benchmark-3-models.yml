workflow_id: benchmark_3_models
name: "3-Model Quick Validation Benchmark"
description: "Quick benchmark of 3 diverse models for validation (15-30 min)"
min_schema_version: "2.0.0"

models:
  primary:
    provider: lmstudio
    model: "${benchmark.current_model}"

execution:
  mode: serial
  memory:
    max_allocated_memory_mb: 8192
    model_memory_mb: 6144
    unload_unused: true

logging:
  global:
    level: info
    detail: medium
    output_type: chat
    format: json
    console: true
  performance_metrics:
    level: debug
    detail: very_high

benchmark:
  prompts:
    - "Explain the concept of recursion in programming, with a practical example."
    - "Write a Rust function that finds the longest increasing subsequence in a vector."
    - "Analyze the tradeoffs between microservices and monolithic architectures."
  max_tokens: 128
  temperature: 0.7
  top_p: 0.9

agentic_workflow:
  # Step 1: Benchmark performance
  - step: benchmark_performance
    id: perf_bench
    loop:
      count:
        max_iterations: 3
        iteration_variable: current_model
    input:
      prompts:
        - "Explain the concept of recursion in programming, with a practical example."
        - "Write a Rust function that finds the longest increasing subsequence in a vector."
        - "Analyze the tradeoffs between microservices and monolithic architectures."
      max_tokens: 128
    output:
      save_to: benchmark_results

  # Step 2: Agentic document refinement per model
  - step: refine_document
    id: doc_refine
    type: oscillate_abstraction
    loop:
      count:
        max_iterations: 3
        iteration_variable: current_model
    input:
      file_path: "./docs/plans/multi-model-benchmark/01-IMPLEMENTATION-PLAN.md"
      chunk_size: 4000
      oscillations: 3
      overlap: 200
    prompts:
      summarize: |
        Summarize the following text, extracting key technical points.
        Keep: numbers, paths, function names, struct fields, error messages.
        Drop: filler, hedging, repetition, transitions.
        Target: 2000 chars max.

        Text:
        {{loop.previous_output}}
      expand: |
        Expand on this summary by adding implementation detail, edge cases,
        and performance considerations a senior engineer would expect.
        Keep all existing technical facts. Target: 3000 chars max.

        Summary:
        {{loop.previous_output}}
    output:
      save_to: refined_plans
      format: text
      path: "./workspace/output/refined_plan_{{loop.current_model}}.md"

  # Step 3: Generate combined report
  - step: generate_report
    id: report
    requires: [perf_bench, doc_refine]
    input:
      benchmark_results: "{{step.perf_bench.output}}"
      refined_plans: "{{step.doc_refine.output}}"
    output:
      save_to:
        - final_report
        - "./workspace/output/benchmark_report.json"

model_list:
  - /run/media/jon/data/models/lmstudio-community/Qwen3-4B-Instruct-2507-GGUF/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
  - /run/media/jon/data/models/lmstudio-community/Phi-4-mini-reasoning-GGUF/Phi-4-mini-reasoning-Q4_K_M.gguf
  - /run/media/jon/data/models/hugging-quants/Llama-3.2-1B-Instruct-Q8_0-GGUF/llama-3.2-1b-instruct-q8_0.gguf
