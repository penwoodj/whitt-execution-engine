# ═══════════════════════════════════════════════════════════════════
# Iteration 5B — Failure Recovery Workflow
# Tests: after_step_fails hook, after_all_retries_exhausted hook
# Uses intentionally bad prompt (max_tokens=1) to force failure
# ═══════════════════════════════════════════════════════════════════

workflow_id: iter5b-failure-recovery
name: "Failure Recovery Test"
description: "Intentionally fail a step to test after_step_fails hooks"
version: "2.0.0"
author: "Whitt Execution Engine"
tags: [test, iteration-5, failure, hooks]
min_schema_version: "2.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "qwen-05b":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    fail_on_purpose:
      generative_entity: "${models.nonexistent-model}"
      prompt: "This should never execute because the model doesn't exist."
      when:
        before_workflow:
          - log:
              event_fields: [workflow_id, step_count]
        after_step_succeeds:
          - log:
              event_fields: [step_name, duration_ms, json_parsable]
        after_step_fails:
          - log:
              event_fields: [step_name, error_message, duration_ms]
          - fail:
              message: "Step failed as expected - testing after_step_fails hook"
        after_workflow:
          - log:
              event_fields: [workflow_id, total_steps, succeeded, failed, correctness, quality]
