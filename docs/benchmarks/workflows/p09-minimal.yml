workflow_id: "p09_phase_25_components"
name: "P09 Phase 2.5 Components"
description: "Multi-file React component generation"
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/p09-min-20260625/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_filenode_tsx:
      generative_entity: "${models.qwen35}"
      prompt: |
        You are updating React component file: FileNode.tsx
        
        The spec below contains:
        (1) Critical React Flow v12 rules
        (2) Complete file specification for FileNode.tsx
        
        Output ONLY the new content for FileNode.tsx. No markdown fences, no commentary.
        
        === INJECTED CONTEXT ===
        {{bookmarks.shell_output.stdout}}
        
      model_overrides:
        temperature: 0.2
        max_tokens: 8192
      when:
        before_step_starts:
          - shell:
              command: "cat /tmp/p09-split/_rules.md && printf '\n=== spec ===\n' && cat /tmp/p09-split/FileNode.tsx.md"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - "docs/benchmarks/outputs/meta-workflow/p09-min-20260625/deliverables/FileNode.tsx"
          - log:
              to_file_path: "docs/benchmarks/outputs/meta-workflow/p09-min-20260625/logs/step_filenode_tsx.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

