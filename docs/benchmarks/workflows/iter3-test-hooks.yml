# ═══════════════════════════════════════════════════════════════════
# Iteration 3 Test — Workflow-Level Hooks
# Purpose: Verify before_workflow + after_workflow hooks produce useful logs
# Uses Qwen2.5-0.5B (only real .gguf file, not symlink)
# ═══════════════════════════════════════════════════════════════════

workflow_id: iter3_workflow_hooks_test
name: "Iter3 Workflow Hooks Test"
description: "Test workflow-level hooks with single model"
version: "2.0.0"
author: "Whitt Execution Engine"
tags: [test, iteration-3]
min_schema_version: "2.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "qwen-05b":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    generate_json:
      generative_entity: "${models.qwen-05b}"
      prompt: |
        Write a JSON object describing a simple REST API endpoint.
        Fields: method, path, description, request_body (object with 2 fields), response_body (object with 3 fields), status_codes (array of 2 objects with code and description).
        No markdown, no code fences, no backticks. Start with { end with }.
      model_overrides:
        max_tokens: 1000
        temperature: 0.1
      when:
        before_workflow:
          - log:
              to_stdout: true
              event_fields: [workflow_id, step_count, model_count]
        after_workflow:
          - log:
              to_stdout: true
              event_fields: [workflow_id, total_steps, succeeded, failed, correctness, quality, duration_ms]
        after_step_succeeds:
          - save_to: "./docs/benchmarks/outputs/output/iter3-{{step.step_name}}.json"
          - log:
              to_stdout: true
              event_fields: [step_name, duration_ms, json_parsable, model_name]
