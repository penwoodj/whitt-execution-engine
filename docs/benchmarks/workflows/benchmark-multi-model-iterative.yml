# ═══════════════════════════════════════════════════════════════════
# ADR Generation Benchmark — Multi-Model Iterative Refinement
# Schema-compliant per docs/schema/unified-workflow-schema.yml v2.0
#
# Unlike the single-model benchmarks that test one-shot generation,
# this benchmark tests whether using the BEST model for each step
# produces better results than using one model for all steps.
#
# Each step refines the previous step's output string, progressively
# expanding the ADR JSON from skeleton → full → validated.
#
# Model Assignment Strategy:
#   step_1 (skeleton):    Qwen3-4B      — reliable structured output, no markdown wrapping
#   step_2 (context):     Qwen3-4B      — same as step 1, Ministral wraps JSON in markdown fences
#   step_3 (decision):    Qwen3-4B-Thinking — reasoning for architecture decisions (slow but thorough)
#   step_4 (consequences): Hermes-7B    — large model for deep risk analysis
#   step_5 (validation):  Hermes-7B     — best model for quality gate
#   step_6 (quality):     Qwen2.5-0.5B  — tiny, just generates a score JSON
#
# Config:
#   max_tokens: 50000 (per-step via model_overrides)
#   gpu_layers: 999 (full GPU offload via LLAMA_ARG_N_GPU_LAYERS)
#   Per-step: temperature varies (0.1-0.3), max_tokens always 50000
#
# Hook Strategy:
#   - before_step_starts: Log entry + resource snapshot before each step
#   - after_step_succeeds: Quality gate (GWT on json_parsable), save
#     checkpoint, bookmark for downstream steps, log metrics, resource check
#   - after_step_fails: Log error with full diagnostic context
#   - after_all_retries_exhausted: Escalation log with attempt count
#   - on_requires_failed: Log dependency chain failures
#
# Flow:
#   step_1_skeleton         (generative) → minimal JSON structure
#   step_2_expand_context   (generative) → add detailed context
#   step_3_expand_decision  (generative) → add decision + tech spec
#   step_4_expand_consequences (generative) → add consequences + risks
#   step_5_validate_clean   (generative) → enhance + validate JSON
#   step_6_save_final       (generative) → quality report
# ═══════════════════════════════════════════════════════════════════

workflow_id: adr_benchmark_multi_model_iterative
name: "ADR Generation Benchmark - Multi-Model Iterative (Best Model Per Step)"
description: "Generate JSON parsable ADR for vanilla JS TODO app through iterative step-by-step refinement, using the best-suited model for each step's task"
version: "2.0.0"
author: "Whitt Execution Engine"
tags: [benchmark, adr, iterative, multi-model]
min_schema_version: "2.0.0"
schema_version: "2.0.0"

# ── PROVIDERS ───────────────────────────────────────────────────
providers:
  llama_cpp_with_vulkan:                               # schema line 28
    config:                                             # schema line 29
      host: localhost                                   # schema line 30
      port: 8080                                        # schema line 31
    hosting:                                            # schema line 33
      gpu_layers: 999                                   # schema line 35 — 999=all layers GPU offload (sets LLAMA_ARG_N_GPU_LAYERS)

# ── MODELS ─────────────────────────────────────────────────────
# Multi-model strategy: each step uses the best-suited model.
# - Reliable skeleton generation with Qwen3-4B (no markdown wrapping)
# - Context expansion with Qwen3-4B (Ministral unreliable for JSON)
# - Architecture decisions with Qwen3-4B-Thinking (slow but thorough)
# - Risk analysis + validation with Hermes-7B (best quality)
# - Quality report with tiny Qwen2.5-0.5B
models:
  "skeleton-model":                                     # schema line 68
    name: "Ministral-3-3B-Instruct-2512-Q4_K_M"
    host:                                               # schema line 70
      type: llama_cpp_with_vulkan                       # schema line 71
    execution:                                          # schema line 96
      timeout:
        load_into_memory: "20s"
        time_to_first_response: "8s"
        total_time_to_response: "60s"
      max_turns: 3
      stop_on_tool_failure: false
      accumulate_tool_results: false
    tools:                                              # schema line 109
      default_permissions:
        file_read: true                                 # schema line 112
        file_write: true                                # schema line 113

  "context-model":                                      # schema line 68
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:                                               # schema line 70
      type: llama_cpp_with_vulkan                       # schema line 71
    execution:                                          # schema line 96
      timeout:
        load_into_memory: "30s"
        time_to_first_response: "10s"
        total_time_to_response: "120s"
      max_turns: 3
      stop_on_tool_failure: false
      accumulate_tool_results: false
    tools:                                              # schema line 109
      default_permissions:
        file_read: true                                 # schema line 112
        file_write: true                                # schema line 113

  "reasoning-model":                                    # schema line 68
    name: "Qwen3-4B-Thinking-2507-Q4_K_M"
    host:                                               # schema line 70
      type: llama_cpp_with_vulkan                       # schema line 71
    execution:                                          # schema line 96
      timeout:
        load_into_memory: "30s"
        time_to_first_response: "15s"
        total_time_to_response: "180s"
      max_turns: 3
      stop_on_tool_failure: false
      accumulate_tool_results: false
    tools:                                              # schema line 109
      default_permissions:
        file_read: true                                 # schema line 112
        file_write: true                                # schema line 113

  "quality-model":                                      # schema line 68
    name: "Hermes-2-Pro-Mistral-7B.Q4_K_M"
    host:                                               # schema line 70
      type: llama_cpp_with_vulkan                       # schema line 71
    execution:                                          # schema line 96
      timeout:
        load_into_memory: "40s"
        time_to_first_response: "15s"
        total_time_to_response: "180s"
      max_turns: 3
      stop_on_tool_failure: false
      accumulate_tool_results: false
    tools:                                              # schema line 109
      default_permissions:
        file_read: true                                 # schema line 112
        file_write: true                                # schema line 113

  "reporter-model":                                     # schema line 68
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:                                               # schema line 70
      type: llama_cpp_with_vulkan                       # schema line 71
    execution:                                          # schema line 96
      timeout:
        load_into_memory: "15s"
        time_to_first_response: "5s"
        total_time_to_response: "30s"
      max_turns: 3
      stop_on_tool_failure: false
      accumulate_tool_results: false
    tools:                                              # schema line 109
      default_permissions:
        file_read: true                                 # schema line 112
        file_write: true                                # schema line 113

# ── WORKFLOW EXECUTION STRATEGY ────────────────────────────────
workflow_execution_strategy:                             # schema line 503
  memory:
    model_lifecycle:
      unload_unused: true                               # schema line 521

# ── AGENTIC WORKFLOW ───────────────────────────────────────────
# 6 generative steps, each building on the previous.
# Step output auto-creates {{step.step_name.output}} variable.
# Next step reads it via {{step.prev_step.output}} template var.
#
# Hook design principles for this workflow:
# 1. QUALITY GATES: GWT checks json_parsable after every generative step.
#    If output is not valid JSON, log WARNING — the next step will try to fix it.
# 2. CHECKPOINTING: save_to + bookmark every intermediate result for recovery.
# 3. OBSERVABILITY: before_step_starts logs entry, after logs exit + metrics.
# 4. RESOURCE TRACKING: shell (free -h) at every step to correlate quality
#    with memory pressure.
# 5. FAILURE RECOVERY: Comprehensive error logging + after_all_retries_exhausted.
# 6. DEPENDENCY SAFETY: on_requires_failed catches broken dependency chains.
agentic_workflow:                                        # schema line 196

  steps:                                                # schema line 293

    # ── STEP 1: Generate minimal ADR skeleton ───────────────────
    step_1_skeleton:
      generative_entity: "${models.context-model}"       # schema line 297 — Qwen3-4B for reliable JSON (no markdown wrapping)
      prompt: |                                         # schema line 298
        Generate a minimal JSON skeleton for an Architecture Decision Record (ADR) about building a vanilla JavaScript TODO application. No frameworks. Just HTML, JS, CSS files.

        Create a JSON object with EXACTLY these top-level keys:
        - "id": "todo-app"
        - "title": short title
        - "status": "accepted"
        - "date": "2025-01-15"
        - "context": { "problem": one sentence, "constraints": ["No frameworks", "Only HTML JS CSS"] }
        - "decision": { "approach": one sentence, "files": ["index.html", "style.css", "app.js"] }
        - "consequences": { "pros": ["No dependencies"], "cons": ["Manual state management"] }
        - "technical_spec": { "data_model": {}, "functions": [], "ui_elements": [], "storage": {} }

        Fill in SHORT placeholder values. Arrays should have 1-2 items. Strings should be one sentence max.
        The "technical_spec" sub-objects can be mostly empty — they will be filled in later steps.

        CRITICAL FORMAT RULES:
        - First character: { and last character: }
        - No backticks, no code fences, no markdown
        - All strings in double quotes only
        - No JavaScript code, no comments, no HTML attributes in values
        - Output ONLY the JSON object, nothing else
      model_overrides:                                  # schema line 303
        max_tokens: 50000
        temperature: 0.3
      when:                                             # schema line 314
        before_step_starts:                             # schema line 319
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, model_name, step_type]
        after_step_succeeds:                            # schema line 323
          - gwt:                                        # Quality gate: is output valid JSON?
              - given: "json_parsable == true"
                then: "step_2_expand_context"           # Skip remaining, jump to next step
          - bookmark: "./docs/benchmarks/outputs/checkpoints/multi-iterative-step1-skeleton.json"  # Checkpoint for recovery
          - save_to: "./docs/benchmarks/outputs/output/multi-iterative-step1-skeleton.json"  # schema line 476
          - shell:
              command: "free"
              args: ["-h"]
              fail_on_error: false
          - log:                                        # schema line 275
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, duration_ms, json_parsable, token_count]
        after_step_fails:                               # schema line 328
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, error_type, error_message, model_name]
        after_all_retries_exhausted:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, total_attempts, last_error, last_error_type]

    # ── STEP 2: Expand context section ──────────────────────────
    step_2_expand_context:
      generative_entity: "${models.context-model}"       # schema line 297 — Qwen3-4B (Ministral wraps JSON in markdown)
      depends_on: [step_1_skeleton]
      prompt: |
        You are REFINING a JSON Architecture Decision Record. You will receive a JSON string and expand ONE section, then output the complete JSON.

        INPUT JSON:
        {{step.step_1_skeleton.output}}

        TASK: Keep the EXACT same JSON structure. ONLY modify the "context" section. Expand it to include:
        - "problem": Write 2-3 detailed sentences about needing a simple, dependency-free task manager for personal productivity
        - "constraints": Expand to 6+ items: No frameworks, Only HTML JS CSS, Must work offline, localStorage only, No build tools required, Single-page application, No server-side component, Accessible keyboard navigation
        - "requirements": ADD this new array with 6+ functional requirements as descriptive strings
        - "assumptions": ADD this new array with 4+ technical assumptions
        - "stakeholders": ADD this new array with 3+ stakeholder descriptions

        DO NOT modify "decision", "consequences", or "technical_spec" sections. Copy them unchanged.
        DO NOT add any keys not listed above.

        OUTPUT THE COMPLETE JSON with expanded context. No markdown. No backticks. No explanations.
        First character: { Last character: }
      model_overrides:
        max_tokens: 50000
        temperature: 0.2
      when:
        before_step_starts:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, model_name, step_type]
        after_step_succeeds:
          - gwt:
              - given: "json_parsable == true"
                then: "step_3_expand_decision"
          - bookmark: "./docs/benchmarks/outputs/checkpoints/multi-iterative-step2-context.json"
          - save_to: "./docs/benchmarks/outputs/output/multi-iterative-step2-context.json"
          - shell:
              command: "free"
              args: ["-h"]
              fail_on_error: false
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, duration_ms, json_parsable, token_count]
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, error_type, error_message, model_name]
        after_all_retries_exhausted:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, total_attempts, last_error, last_error_type]
        on_requires_failed:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [failed_step, reason]

    # ── STEP 3: Expand decision + technical_spec sections ───────
    step_3_expand_decision:
      generative_entity: "${models.reasoning-model}"      # schema line 297 — Qwen3-4B-Thinking for architecture decisions
      depends_on: [step_2_expand_context]
      prompt: |
        You are REFINING a JSON Architecture Decision Record. You will receive a JSON string and expand TWO sections, then output the complete JSON.

        INPUT JSON:
        {{step.step_2_expand_context.output}}

        TASK: Keep the EXACT same JSON structure. ONLY modify "decision" and "technical_spec" sections.

        Expand "decision" section:
        - "approach": 2-3 detailed sentences about vanilla JS with localStorage approach, event-driven architecture
        - "files": Expand to: ["index.html", "style.css", "app.js", "utils.js", "constants.js"]
        - "rationale": ADD this string explaining why vanilla JS over frameworks for this use case
        - "alternatives_considered": ADD this array with 3 objects, each having "name", "pros", "cons" keys

        Expand "technical_spec" section:
        - "data_model": Define as object with "TodoItem" key mapping to an object of field definitions. Each field is an object with "type" and "description" keys. Todo item fields: id, text, done, created_at, priority, tags
        - "functions": 10+ objects, each with keys "name" (string), "params" (array of strings describing parameters), "returns" (string describing return value), "description" (one sentence). Include: addTodo, deleteTodo, toggleTodo, editTodo, filterTodos, renderTodos, saveToStorage, loadFromStorage, generateId, clearCompleted
        - "ui_elements": 10+ objects, each with keys "selector" (CSS selector string), "role" (one sentence describing its purpose), "events" (array of event names it handles). Include elements for input, add button, todo list, todo items, delete button, toggle button, filters, edit input, clear completed button
        - "storage": { "key": "todos", "type": "array", "sync_strategy": "on_change", "max_items": 1000 }

        DO NOT modify "context" or "consequences" sections.

        OUTPUT THE COMPLETE JSON. No markdown. No backticks. No explanations.
        First character: { Last character: }
      model_overrides:
        max_tokens: 50000
        temperature: 0.2
      when:
        before_step_starts:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, model_name, step_type]
        after_step_succeeds:
          - gwt:
              - given: "json_parsable == true"
                then: "step_4_expand_consequences"
          - bookmark: "./docs/benchmarks/outputs/checkpoints/multi-iterative-step3-decision.json"
          - save_to: "./docs/benchmarks/outputs/output/multi-iterative-step3-decision.json"
          - shell:
              command: "free"
              args: ["-h"]
              fail_on_error: false
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, duration_ms, json_parsable, token_count]
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, error_type, error_message, model_name]
        after_all_retries_exhausted:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, total_attempts, last_error, last_error_type]
        on_requires_failed:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [failed_step, reason]

    # ── STEP 4: Expand consequences section ─────────────────────
    step_4_expand_consequences:
      generative_entity: "${models.quality-model}"       # schema line 297 — Hermes-7B for deep risk analysis
      depends_on: [step_3_expand_decision]
      prompt: |
        You are REFINING a JSON Architecture Decision Record. You will receive a JSON string and expand ONE section, then output the complete JSON.

        INPUT JSON:
        {{step.step_3_expand_decision.output}}

        TASK: Keep the EXACT same JSON structure. ONLY modify the "consequences" section. Expand it to include:
        - "pros": 8+ items as plain strings. Examples: "No external dependencies", "Fast initial page load", "Simple deployment to any static host", "Full control over rendering", "Easy to debug in browser DevTools", "Small bundle size under 10KB", "Works offline without service worker", "No build step required"
        - "cons": 8+ items as plain strings. Examples: "Manual DOM manipulation is verbose", "No type safety without TypeScript", "State synchronization complexity grows", "Limited code reuse across projects", "No hot module replacement in development", "Testing requires more manual setup", "Accessibility must be manually implemented", "No component isolation"
        - "risks": ADD this array with 4+ objects, each having "risk" (string) and "mitigation" (string) keys
        - "tradeoffs": ADD this array with 4+ objects, each having "choice" (string), "benefit" (string), "cost" (string) keys
        - "future_considerations": ADD this array with 4+ strings about migration paths, scaling options, framework adoption triggers

        DO NOT modify "context", "decision", or "technical_spec" sections.

        OUTPUT THE COMPLETE JSON. No markdown. No backticks. No explanations.
        First character: { Last character: }
      model_overrides:
        max_tokens: 50000
        temperature: 0.2
      when:
        before_step_starts:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, model_name, step_type]
        after_step_succeeds:
          - gwt:
              - given: "json_parsable == true"
                then: "step_5_validate_clean"
          - bookmark: "./docs/benchmarks/outputs/checkpoints/multi-iterative-step4-consequences.json"
          - save_to: "./docs/benchmarks/outputs/output/multi-iterative-step4-consequences.json"
          - shell:
              command: "free"
              args: ["-h"]
              fail_on_error: false
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, duration_ms, json_parsable, token_count]
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, error_type, error_message, model_name]
        after_all_retries_exhausted:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, total_attempts, last_error, last_error_type]
        on_requires_failed:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [failed_step, reason]

    # ── STEP 5: Final validation, cleanup, and enhancement ───────
    # This is the critical quality gate step. Not just validation —
    # this step MUST enhance the technical_spec and fill gaps.
    step_5_validate_clean:
      generative_entity: "${models.quality-model}"       # schema line 297 — Hermes-7B for best quality gate
      depends_on: [step_4_expand_consequences]
      prompt: |
        You are the FINAL enhancer and validator for a JSON Architecture Decision Record. You MUST make meaningful improvements — do NOT just copy the input unchanged.

        INPUT JSON:
        {{step.step_4_expand_consequences.output}}

        MANDATORY ENHANCEMENT TASKS:
        1. "technical_spec.functions": Every function object MUST have all 4 keys: "name", "params" (array of strings), "returns" (string), "description" (string). If any function is just a name string, convert it to an object with realistic params, returns, and description.
        2. "technical_spec.ui_elements": Every element MUST have all 3 keys: "selector", "role", "events". If any element is just a string, convert it to an object.
        3. "technical_spec.data_model": Ensure field definitions have "type" and "description" keys. Add "validation" array to each field with validation rules (e.g., "required", "max_length: 200").
        4. "decision.implementation_order": ADD this array with 5+ strings describing the recommended implementation sequence.
        5. "context.success_metrics": ADD this array with 4+ measurable success criteria as strings.

        CLEANUP TASKS:
        6. Ensure valid JSON syntax — no trailing commas, proper nesting
        7. Remove ANY markdown artifacts: backticks, code fences, language identifiers
        8. Remove any JavaScript code or HTML tags from string values
        9. Fill any remaining empty or placeholder string values with realistic content
        10. Verify minimum array sizes: constraints 6+, requirements 6+, functions 10+, ui_elements 10+, pros 8+, cons 8+

        CRITICAL: Your output MUST differ from the input. You MUST add at least the 2 new keys (implementation_order, success_metrics) and enhance technical_spec objects.

        OUTPUT ONLY the final enhanced JSON. First character: { Last character: }
        No markdown. No backticks. No explanations.
      model_overrides:
        max_tokens: 50000
        temperature: 0.1
      when:
        before_step_starts:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, model_name, step_type]
        after_step_succeeds:
          - gwt:                                        # Final quality gate: validated JSON must be parseable
              - given: "json_parsable == true"
                then: "step_6_save_final"               # Valid → save it
          - bookmark: "./docs/benchmarks/outputs/checkpoints/multi-iterative-step5-validated.json"
          - save_to: "./docs/benchmarks/outputs/output/multi-iterative-step5-validated.json"
          - shell:
              command: "free"
              args: ["-h"]
              fail_on_error: false
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, duration_ms, json_parsable, token_count]
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, error_type, error_message, model_name]
          - log:                                        # Second log entry: detailed failure context
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-validation-failures.log"
              event_fields: [step_name, error_message, model_name]
        after_all_retries_exhausted:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, total_attempts, last_error, last_error_type]
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-validation-failures.log"
              event_fields: [step_name, total_attempts, last_error, last_error_type]
        on_requires_failed:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [failed_step, reason]

    # ── STEP 6: Generate quality report ─────────────────────────
    step_6_save_final:
      generative_entity: "${models.reporter-model}"      # schema line 297 — Qwen2.5-0.5B just generates score JSON
      depends_on: [step_5_validate_clean]
      prompt: |
        You are a QA reviewer for an Architecture Decision Record. Generate a brief quality report as JSON.

        INPUT ADR JSON:
        {{step.step_5_validate_clean.output}}

        Generate a JSON quality report with these keys:
        - "adr_id": copy from input
        - "review_timestamp": current ISO 8601 date
        - "overall_assessment": "pass" or "needs_work"
        - "completeness_score": number 1-10 rating how complete the ADR is
        - "sections_reviewed": array of objects with "section" (string), "status" ("complete"/"partial"/"missing"), "notes" (one sentence)
        - "recommendations": array of 2-3 strings suggesting improvements

        OUTPUT ONLY the quality report JSON. First character: { Last character: }
        No markdown. No backticks.
      model_overrides:
        max_tokens: 50000
        temperature: 0.1
      when:
        before_step_starts:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, model_name, step_type]
        after_step_succeeds:
          - save_to: "./docs/benchmarks/outputs/output/multi-iterative-step6-quality-report.json"
          - append_to: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark-summary.log"
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, duration_ms, json_parsable, token_count]
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [step_name, error_type, error_message]
        on_requires_failed:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/multi-iterative-benchmark.log"
              event_fields: [failed_step, reason]