workflow_id: resource_admission_long
name: "Resource Admission Long"
description: "Three serial inference stages with bounded shell hooks and admission telemetry."
version: "2.0.0"
min_schema_version: "2.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan: # schema line 28
    config: # schema line 29
      host: localhost # schema line 30
      port: 8080 # schema line 31

models:
  resource-test-model: # schema line 68
    name: "Qwen3-8B-Q4_K_M.gguf"
    source_path: "/run/media/jon/data/models/Qwen3-8B-Q4_K_M.gguf" # schema line 909
    host: # schema line 70
      type: llama_cpp_with_vulkan # schema line 71
    load_params: # schema line 75
      context_size: 4096 # schema line 76
      gpu_layers: 99 # schema line 81
      cont_batching: false # schema line 85
      no_cache_prompt: true # schema line 86
      parallel: 1 # schema line 87

workflow_execution_strategy: # schema line 533
  load_unload: one_at_a_time # schema line 534
  resource_admission: # schema line 560
    enforcement_policy: block # schema line 561
    minimum_available: # schema line 562
      ram: 6GiB # schema line 563
      vram: 6GiB # schema line 564
      swap_free: 4GiB # schema line 565
    model_estimate: # schema line 566
      kv_cache: 288MiB # schema line 567
      compute_buffer: 512MiB # schema line 568
      host_runtime: 700MiB # schema line 569
      expected_runtime_secs: 900 # schema line 570
    telemetry: # schema line 571
      write_profile: true # schema line 572

agentic_workflow: # schema line 196
  steps: # schema line 293
    step_00_outline:
      generative_entity: "${models.resource-test-model}" # schema line 297
      prompt: "Create a three-bullet outline for safe model-resource admission."
      model_overrides: # schema line 303
        max_tokens: 256
        temperature: 0.1
      when: # schema line 314
        after_step_succeeds: # schema line 323
          - shell:
              command: "free"
              args: ["-m"]
              working_dir: "."
              fail_on_error: false
          - save_to: "$resource_admission_long_outline" # schema line 476
    step_01_expand:
      generative_entity: "${models.resource-test-model}"
      depends_on: [step_00_outline]
      prompt: |
        Expand this outline into a concise operational checklist. Preserve its intent.
        OUTLINE:
        {{step.step_00_outline.output}}
      model_overrides:
        max_tokens: 512
        temperature: 0.1
      when:
        after_step_succeeds:
          - shell:
              command: "free"
              args: ["-m"]
              working_dir: "."
              fail_on_error: false
          - save_to: "$resource_admission_long_checklist"
    step_02_synthesize:
      generative_entity: "${models.resource-test-model}"
      depends_on: [step_01_expand]
      prompt: |
        Convert this checklist into five concise verification assertions.
        CHECKLIST:
        {{step.step_01_expand.output}}
      model_overrides:
        max_tokens: 512
        temperature: 0.1
      when:
        after_step_succeeds:
          - shell:
              command: "free"
              args: ["-m"]
              working_dir: "."
              fail_on_error: false
          - save_to: "$resource_admission_long_result"
