workflow_id: "p15_full_7files"
name: "P15 7-file agent layer"
description: "Generate all 7 P15 files via per-file steps"
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/p15-full-20260625/logs/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_mod:
      generative_entity: "${models.qwen35}"
      prompt: |
        Emit src/agent/mod.rs from spec. Output ONLY Rust. No fences.
        
        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.0, max_tokens: 1024 }
      when:
        before_step_starts:
          - shell:
              command: "sed -n '22,40p' /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-15-task-implement-the-agent-react-layer-for-a-rust-workflow-eng.md"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to: ["docs/benchmarks/outputs/meta-workflow/p15-full-20260625/deliverables/mod.rs"]

    step_tools:
      generative_entity: "${models.qwen35}"

      prompt: |
        Emit src/agent/tools.rs from spec. Define 6 tools. Output ONLY Rust. No fences.
        
        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.2, max_tokens: 16384 }
      when:
        before_step_starts:
          - shell:
              command: "sed -n '40,105p' /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-15-task-implement-the-agent-react-layer-for-a-rust-workflow-eng.md"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to: ["docs/benchmarks/outputs/meta-workflow/p15-full-20260625/deliverables/tools.rs"]

    step_react:
      generative_entity: "${models.qwen35}"

      prompt: |
        Emit src/agent/react.rs from spec. ReAct loop. Output ONLY Rust. No fences.
        
        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.2, max_tokens: 8192 }
      when:
        before_step_starts:
          - shell:
              command: "sed -n '105,142p' /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-15-task-implement-the-agent-react-layer-for-a-rust-workflow-eng.md"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to: ["docs/benchmarks/outputs/meta-workflow/p15-full-20260625/deliverables/react.rs"]

    step_executor:
      generative_entity: "${models.qwen35}"

      prompt: |
        Emit src/agent/executor.rs from spec. Retry with backoff. Output ONLY Rust. No fences.
        
        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.2, max_tokens: 8192 }
      when:
        before_step_starts:
          - shell:
              command: "sed -n '143,182p' /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-15-task-implement-the-agent-react-layer-for-a-rust-workflow-eng.md"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to: ["docs/benchmarks/outputs/meta-workflow/p15-full-20260625/deliverables/executor.rs"]

    step_streaming:
