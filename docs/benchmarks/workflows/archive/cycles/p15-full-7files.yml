        Emit src/agent/streaming.rs from spec. SSE handler. Output ONLY Rust. No fences.
        
        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.2, max_tokens: 8192 }
      when:
        before_step_starts:
          - shell:
              command: "sed -n '183,218p' /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-15-task-implement-the-agent-react-layer-for-a-rust-workflow-eng.md"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to: ["docs/benchmarks/outputs/meta-workflow/p15-full-20260625/deliverables/streaming.rs"]

    step_persistence:
