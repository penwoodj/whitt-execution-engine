        before_step_starts:
          - shell:
              command: "sed -n '219,264p' /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-15-task-implement-the-agent-react-layer-for-a-rust-workflow-eng.md"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
