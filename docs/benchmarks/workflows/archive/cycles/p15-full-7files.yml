    step_sandbox:
      generative_entity: "${models.qwen35}"

      prompt: |
        Emit src/agent/sandbox.rs from spec. Path-based sandbox. Output ONLY Rust. No fences.
        
        {{bookmarks.shell_output.stdout}}
      model_overrides: { temperature: 0.2, max_tokens: 8192 }
      when:
        before_step_starts:
          - shell:
              command: "sed -n '265,297p' /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-15-task-implement-the-agent-react-layer-for-a-rust-workflow-eng.md"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
