workflow_id: "minimal_prompt_13_task"
name: "Prompt 13 Task"
description: "Minimal workflow generated by generate-minimal.py"
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/p13-v6-20260626/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_1_generate:
      generative_entity: "${models.qwen35}"
      prompt: |
        You are producing the final deliverable for the user's task.
        
        Task guidance: Emit complete Rust module src/client/model_download.rs. MUST INCLUDE: (1) imports: use anyhow::{Context, Result}; use futures::StreamExt; use reqwest::Client; use std::path::Path; use std::time::Duration; (2) const HF_BASE_URL; (3) pub async fn download_model_from_hf(repo: &str, filename: &str, dest_path: &str) -> Result<u64>; (4) Client::builder().timeout(600s).build(); (5) content_length check; (6) tokio::fs::create_dir_all for parent dir; (7) bytes_stream() + StreamExt; (8) progress logging every 10MB via tracing::info! with percent calc; (9) return downloaded bytes. Output ONLY Rust code, no markdown fences.
        
        You will receive (via injected context) the complete user request.
        
        Rules:
        - Be exhaustive. Address every aspect of the task.
        - Do NOT refuse. Do NOT say "I cannot read files" — file contents are below.
        - Do NOT emit planning text. Produce the actual deliverable.
        - Output ONLY the final document content. No preamble, no closing remarks.
        
        === USER REQUEST ===
        {{bookmarks.shell_output.stdout}}
      model_overrides:
        temperature: 0.3
        max_tokens: 16384
      when:
        before_step_starts:
          - shell:
              command: "cat /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-13-task.md"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - "/home/jon/code/whitt-execution-engine/docs/benchmarks/outputs/meta-workflow/p13-v6-20260626/deliverables/model_download.rs"
              - "./docs/benchmarks/outputs/meta-workflow/p13-v6-20260626/workspace/deliverable.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/p13-v6-20260626/logs/step_1_generate.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
