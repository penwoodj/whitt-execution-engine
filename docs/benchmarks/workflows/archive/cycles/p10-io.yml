workflow_id: "minimal_prompt_10_not_exactly__look_deeper_into_docsreportsinitial_thoughts_an"
name: "Prompt 10 Not Exactly  Look Deeper Into Docsreportsinitial Thoughts An"
description: "Minimal workflow generated by generate-minimal.py"
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/p10-io-20260626/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_1_extract:
      generative_entity: "${models.qwen35}"
      prompt: |
        You are analyzing source materials for a task.
        
        You will receive:
        (1) The complete user request (with task specification)
        (2) Source files: async-http-manual-translation.lr, lookup-manual-translation.lr
        
        Your job: Extract and structure ALL information from the source files that is
        relevant to the user's task. Output a structured markdown inventory that the
        next step will use to synthesize the final deliverable.
        
        Format your output as a markdown document with sections relevant to the task.
        Quote real lines from source files as evidence (with file:line references).
        
        Rules:
        - Do NOT refuse. Do NOT say "I cannot read files" — file contents are below.
        - Do NOT emit commentary about what you "would do". DO the work.
        - Quote real content. Cite file:line.
        
        === INJECTED CONTEXT (prompt + source files) ===
        {{bookmarks.shell_output.stdout}}
      model_overrides:
        temperature: 0.2
        max_tokens: 8192
      when:
        before_step_starts:
          - shell:
              command: "cat /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-10-not-exactly--look-deeper-into-docsreportsinitial-thoughts-an.md && printf '\n=== async-http-manual-translation.lr ===\n' && cat /home/jon/code/left-right/docs/translations/javascript/async-http-manual-translation.lr && printf '\n=== lookup-manual-translation.lr ===\n' && cat /home/jon/code/left-right/docs/translations/javascript/lookup-manual-translation.lr"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - "./docs/benchmarks/outputs/meta-workflow/p10-io-20260626/workspace/inventory.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/p10-io-20260626/logs/step_1_extract.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info


    step_2_synthesize:
      generative_entity: "${models.qwen35}"
      depends_on: [step_1_extract]
      prompt: |
        You are producing the final deliverable.
        
        You will receive (via injected context) a structured inventory extracted from
        source files. Your job is to synthesize the final deliverable document.
        
        Task guidance: Create example IO document demonstrating ALL language features of Left-Right (.lr) language. Show: (1) .lr source snippet, (2) transpiled JavaScript output, (3) transpiled Rust output, (4) runtime behavior explanation. Demonstrate: point-free chaining, diatic operators (left-hungry curried), _</_>  argument operators, @ path access, $ operators, JSON object vs operator {...} distinction, !? type check, '?| filter, ~ map, >< join, +: merge, \ apply sequence, ||| apply parallel, template literals. Cover at least 5 different example programs.
        
        Rules:
        - Be exhaustive. Address every aspect of the task.
        - Use the extracted evidence to ground claims. Cite real content.
        - Do NOT refuse. Do NOT say "provide the files" — they were already provided.
        - Do NOT emit planning text. Produce the actual deliverable.
        - Output ONLY the final document content. No preamble, no closing remarks.
        
        === EXTRACTED INVENTORY (from previous step) ===
        {{bookmarks.shell_output.stdout}}
      model_overrides:
        temperature: 0.3
        max_tokens: 16384
      when:
        before_step_starts:
          - shell:
              command: "cat ./docs/benchmarks/outputs/meta-workflow/p10-io-20260626/workspace/inventory.md"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - "/home/jon/code/left-right/language-summary/example-io/example-transpile.md"
              - "./docs/benchmarks/outputs/meta-workflow/p10-io-20260626/workspace/deliverable.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/p10-io-20260626/logs/step_2_synthesize.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
