workflow_id: "minimal_prompt_05_task"
name: "Prompt 05 Task"
description: "Minimal workflow generated by generate-minimal.py"
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/p05-min-20260625/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_1_generate:
      generative_entity: "${models.qwen35}"
      prompt: |
        You are producing the final deliverable for the user's task.
        
        Task guidance: Emit Rust source code: (1) the complete try_execute_route_to_parallel async method for BenchmarkRunner (exact code is in the prompt between 'async fn try_execute_route_to_parallel' and its closing brace), AND (2) the replacement block template showing how to call it at each of the 3 sequential route_to locations. Output valid Rust. Do NOT invent new modules or deps. Use JoinSet from tokio::task.
        
        You will receive (via injected context) the complete user request.
        
        Rules:
        - Be exhaustive. Address every aspect of the task.
        - Do NOT refuse. Do NOT say "I cannot read files" — file contents are below.
        - Do NOT emit planning text. Produce the actual deliverable.
        - Output ONLY the final document content. No preamble, no closing remarks.
        
        === USER REQUEST ===
        {{bookmarks.shell_output.stdout}}
      model_overrides:
        temperature: 0.3
        max_tokens: 16384
      when:
        before_step_starts:
          - shell:
              command: "cat /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-05-task.md"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - "/home/jon/code/whitt-execution-engine/docs/benchmarks/outputs/meta-workflow/p05-min-20260625/deliverables/parallel_route_to_patch.rs"
              - "./docs/benchmarks/outputs/meta-workflow/p05-min-20260625/workspace/deliverable.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/p05-min-20260625/logs/step_1_generate.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
