workflow_id: yaml_compat_smoke
name: "YAML Compat Smoke Test"
description: "Verifies chunks 6-10 framework YAML-ization doesn't break execution. Created 2026-08-03."
version: "1.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "worker":
    name: "Qwen3-5-9B-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan
    load_params:
      context_size: 32768
      batch_size: 2048
      ubatch_size: 512
      cache_type_k: "q8_0"
      cache_type_v: "q8_0"
      gpu_layers: 99
      threads: 5
      use_mmap: true
      flash_attn: true
      cont_batching: false
      no_cache_prompt: true
      parallel: 1
    sampling:
      temperature: 0.2
      max_tokens: 4096
    max_allowed:
      ram: 13%
      vram: 3.7GB
      cpu: 49%
      gpu: 74%
      attention_tokens: 150000
      concurrent_requests: 2
      memory_safety_margin_bytes: 1073741824
      max_concurrent_inferences: 2

workflow_execution_strategy:
  error_handling:
    default_action:
      type: retry
    retry:
      max_attempts_per_step: 2
      max_attempts_per_workflow: 5
  quality:
    refusal_patterns:
      - "I cannot help"
      - "As an AI"
      - "CUSTOM_REFUSAL_PATTERN"
    quality_threshold: 0.5

workspace:
  directories:
    output: ./docs/benchmarks/outputs/meta-workflow/yaml-smoke-20260803

agentic_workflow:
  when:
    after_workflow:
      - log:
          event_fields: [workflow_id, total_steps]
    after_step_succeeds:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/yaml-smoke-20260803/smoke.log"
          event_fields: [step_name, duration_ms, quality_score]

  steps:
    step_01_simple:
      generative_entity: "${models.worker}"
      prompt: |
        Reply with exactly one word: HELLO
      model_overrides:
        max_tokens: 20
