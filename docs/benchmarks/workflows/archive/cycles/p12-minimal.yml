workflow_id: "p12_minimal_v1"
name: "P12 Language Spec Generator (Minimal)"
description: "Manually-crafted minimal workflow to prove engine can produce P12 deliverable. Tests file injection + cross-step aggregation via shell hooks."
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/p12-minimal-20260625/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_1_extract_sot_constructs:
      generative_entity: "${models.qwen35}"
      prompt: |
        You are analyzing two source-of-truth (.lr) files for a language called "left-right".
        Below you will receive:
        (1) The complete user request (containing the language spec)
        (2) integration.lr (async-http manual translation)
        (3) requests.lr (lookup manual translation)

        Your job: Extract EVERY observable language construct from the .lr files and reconcile
        with the spec in the user request. Output a structured markdown inventory with these
        sections (use exactly these headings):

        ## Operators Observed
        (table: symbol | arity | example-from-lr | semantic-per-spec)

        ## Types Observed
        (list each type seen, with one usage example from the .lr files)

        ## Syntax Forms Observed
        (map literals, list literals, string interpolation, parenthesized expressions, etc.)

        ## Execution Semantics Observed
        (left-hungry curried evaluation evidence from the .lr files)

        ## Discrepancies or Ambiguities
        (anything in .lr files not covered by the spec, or vice versa)

        Rules:
        - Quote real lines from the .lr files as evidence. Line numbers encouraged.
        - Do NOT refuse. Do NOT say "I cannot read files" — the file contents are below.
        - Do NOT emit commentary about what you "would do". DO the work.

        === USER REQUEST (spec + task) ===
        {{bookmarks.shell_output.stdout}}

      model_overrides:
        temperature: 0.2
        max_tokens: 8192
      when:
        before_step_starts:
          - shell:
              command: "cat /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-12-skill-instruction.md && printf '\\n=== INTEGRATION.LR (async-http) ===\\n' && cat /home/jon/code/left-right/docs/translations/javascript/async-http-manual-translation.lr && printf '\\n=== REQUESTS.LR (lookup) ===\\n' && cat /home/jon/code/left-right/docs/translations/javascript/lookup-manual-translation.lr"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - "./docs/benchmarks/outputs/meta-workflow/p12-minimal-20260625/workspace/sot_inventory.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/p12-minimal-20260625/logs/step1.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_2_synthesize_language_spec:
      generative_entity: "${models.qwen35}"
      depends_on: [step_1_extract_sot_constructs]
      prompt: |
        You are writing the authoritative language specification document for "left-right".
        You will receive (via the injected context below) a structured inventory of language
        constructs that were extracted from the two source-of-truth .lr files plus the user
        spec. Your job is to synthesize a single, complete, exhaustive language specification
        document that another engineer could use to build an AST, Lexer, and Compiler.

        The document MUST include these sections (in this order):

        # Left-Right Language Specification

        ## 1. Overview and Design Philosophy
        ## 2. Type System
        ## 3. Lexical Structure (tokens, reserved symbols)
        ## 4. Grammar (BNF or equivalent formal grammar)
        ## 5. AST Node Catalog (every node type, with fields)
        ## 6. Lexer Algorithm (tokenization rules, precedence)
        ## 7. Execution Semantics (left-hungry curried operator evaluation)
        ## 8. Operator Reference (every operator, fully documented)
        ## 9. Collection Semantics (Map, List, String — iterable)
        ## 10. Expression Evaluation Walkthroughs (worked examples from the .lr files)
        ## 11. Compiler Implementation Notes (how to lower AST to target IR)

        Rules:
        - Be exhaustive. Every operator in the spec must appear in §8 with arity, input types,
          output type, and at least one worked example.
        - Use the .lr file evidence you received to ground claims. Quote real lines.
        - Do NOT refuse. Do NOT say "provide the files" — they were already provided.
        - Do NOT emit planning text. Emit the actual specification document.
        - Output ONLY the markdown document. No preamble, no closing remarks.

        === EXTRACTED INVENTORY (from previous step) ===
        {{bookmarks.shell_output.stdout}}

      model_overrides:
        temperature: 0.3
        max_tokens: 16384
      when:
        before_step_starts:
          - shell:
              command: "cat ./docs/benchmarks/outputs/meta-workflow/p12-minimal-20260625/workspace/sot_inventory.md"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - "/home/jon/code/left-right/docs/translations/javascript-language-spec-meta-v6.md"
              - "./docs/benchmarks/outputs/meta-workflow/p12-minimal-20260625/workspace/language_spec.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/p12-minimal-20260625/logs/step2.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
