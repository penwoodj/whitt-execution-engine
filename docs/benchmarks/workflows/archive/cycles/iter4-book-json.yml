# ═══════════════════════════════════════════════════════════════════
# E2E Cycle Iteration 4 — Book JSON Generator
# Prompt: "Generate a JSON object with 3 fields: title, author, year"
# Purpose: Full e2e cycle — generate → validate → run → analyze → fix
# ═══════════════════════════════════════════════════════════════════

workflow_id: iter4_book_json
name: "Book JSON Generator"
description: "Generate a JSON object describing a book"
version: "2.0.0"
author: "Whitt Execution Engine"
tags: [test, iteration-4, e2e-cycle]
min_schema_version: "2.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "qwen-05b":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    generate_book:
      generative_entity: "${models.qwen-05b}"
      prompt: |
        Generate a JSON object with exactly 3 fields describing a book:
        - title: a string with a real book title
        - author: a string with the author's name
        - year: a number with the publication year

        Output ONLY the JSON. No markdown. No code fences. No explanation.
        Example format: {"title": "...", "author": "...", "year": 1234}
      model_overrides:
        max_tokens: 200
        temperature: 0.1
      when:
        before_workflow:
          - log:
              event_fields: [workflow_id, step_count, model_count]
        after_workflow:
          - log:
              event_fields: [workflow_id, total_steps, succeeded, failed, correctness, quality, duration_ms]
        after_step_succeeds:
          - save_to: "./docs/benchmarks/outputs/output/iter4-{{step.step_name}}.json"
          - log:
              event_fields: [step_name, duration_ms, json_parsable, model_name]
        after_step_fails:
          - log:
              event_fields: [step_name, error_message, duration_ms]
