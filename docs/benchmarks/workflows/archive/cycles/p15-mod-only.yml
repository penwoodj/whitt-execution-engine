workflow_id: "p15_mod_rs"
name: "P15 mod.rs generation"
description: "Smallest P15 file as pattern proof"
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/p15-20260625/logs/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_1_emit:
      generative_entity: "${models.qwen35}"
      prompt: |
        Emit the complete Rust source for src/agent/mod.rs based on this spec.
        
        === SPEC ===
        {{bookmarks.shell_output.stdout}}
        
        === RULES ===
        - Output ONLY Rust source code
        - No markdown fences
        - No commentary
        - Must declare public modules: tools, react, executor, streaming, persistence, sandbox
        - Must re-export: Tool, ToolCall, ToolResult, ToolRegistry (from tools), ReactAgent (from react), StepExecutor (from executor), StreamingResponse (from streaming), WorkflowPersistence (from persistence), ToolSandbox (from sandbox)
      model_overrides:
        temperature: 0.0
        max_tokens: 1024
      when:
        before_step_starts:
          - shell:
              command: "cat /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-15-task-implement-the-agent-react-layer-for-a-rust-workflow-eng.md | head -50"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - "docs/benchmarks/outputs/meta-workflow/p15-20260625/deliverables/mod.rs"
              - "./docs/benchmarks/outputs/meta-workflow/p15-20260625/workspace/mod_raw.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/p15-20260625/logs/step_1.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
