workflow_id: sw4_yaml_substructure_translation
name: "SW4 YAML Substructure Translation"
description: "Translates categorized tasks into individual YAML agentic substructures with intent descriptions. YAML-only code blocks in output."
version: "1.0.0"
author: "Whitt Execution Engine"
tags: [sub-workflow, yaml-translation, substructures]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "qwen35":
    name: "Qwen3-5-9B-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan
    load_params:
      context_size: 32768                 # 2x buffer of 16k max response; bump to 262144 if input+response >= 131072
      batch_size: 2048
      ubatch_size: 512
      cache_type_k: "q8_0"
      cache_type_v: "q8_0"
      gpu_layers: 99  # server config wins; pre-loaded model uses -ngl 99 from host config.yml
      threads: 5
      use_mmap: true
      flash_attn: true
      cont_batching: false
      no_cache_prompt: true
      parallel: 1
    sampling:
      temperature: 0.2
      max_tokens: 4096

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw4.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:

    step_00_bootstrap:
      generative_entity: "${models.qwen35}"
      prompt: "READY"
      model_overrides:
        temperature: 0.0
        max_tokens: 1
      when:
        before_step_starts:
          - shell:
              command: "mkdir -p ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/{sw4,logs,input} && head -30 ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/categories.md"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
          - bookmark:
              path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw4/00-bootstrap.txt"
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw4.log"
              event_fields: [step_name, duration_ms]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw4.log"
              event_fields: [step_name, error_message]
              level: error

    step_01_load_categories:
      generative_entity: "${models.qwen35}"
      depends_on: [step_00_bootstrap]
      prompt: |
        You are loading the agentic categorization for YAML translation.

        CATEGORIES DOC:
        {{bookmarks.shell_output.stdout}}

        Extract a flat list of tasks with their primary category. One per line:

        T1 - <name> | CATEGORY: <cat> | BUDGET: <n>
        T1.1 - <name> | CATEGORY: <cat> | BUDGET: <n>
        ...

        Output ONLY the flat list.
      model_overrides:
        temperature: 0.1
        max_tokens: 1000
      when:
        before_step_starts:
          - shell:
              command: "cat ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/categories.md"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - $sw4_task_cats
              - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw4/01-task-cats.txt"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw4.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw4.log"
              event_fields: [step_name, error_message]
              level: error

    step_02_emit_substructures:
      generative_entity: "${models.qwen35}"
      depends_on: [step_01_load_categories]
      prompt: |
        You are translating categorized tasks into YAML agentic substructures.

        TASK-CATEGORY LIST:
        {{step.step_01_load_categories.output}}

        FULL CATEGORIES DOC (for reasoning/substructure hints):
        {{bookmarks.shell_output.stdout}}

        For EACH task, emit a YAML substructure snippet showing how it becomes a workflow step.

        ## CRITICAL: Bootstrap Step Pattern (REQUIRED as first step)

        Every generated workflow MUST start with step_00_bootstrap that injects the user's original prompt into bookmarks via shell cat:

        ```yaml
        step_00_bootstrap:
          generative_entity: "${models.qwen35}"
          prompt: "Respond with the single word OK."
          model_overrides:
            max_tokens: 4
            temperature: 0.0
          when:
            before_step_starts:
              - shell:
                  command: "cat ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/prompt.txt"
                  args: []
                  working_dir: "/home/jon/code/whitt-execution-engine"
                  fail_on_error: true
            after_step_succeeds:
              - save_to:
                  - prompt_injected
                  - "./outputs/bootstrap_done.txt"
              - log:
                  to_file_path: "./logs/step_00_bootstrap.log"
                  event_fields: [step_name, duration_ms, total_tokens]
                  level: info
        ```

        After step_00_bootstrap, downstream steps can access user prompt via `{{bookmarks.shell_output.stdout}}` in their prompts.

        ## CRITICAL: File Injection Pattern (REQUIRED for any step that needs to read external content)

        If a step needs to work with SOURCE FILE CONTENT (the prompt, source code, configs, etc.), add `before_step_starts: shell: cat <file>` hook:

        ```yaml
        step_<id>_<name>:
          generative_entity: "${models.qwen35}"
          prompt: |
            Content provided below (injected via shell):
            {{bookmarks.shell_output.stdout}}

            <task description>. The content above is already in your context — do NOT say you cannot read files. Use the provided content to accomplish the task.
          model_overrides:
            max_tokens: 5120
            temperature: 0.2
          when:
            before_step_starts:
              - shell:
                  command: "cat <path/to/source/file>"
                  args: []
                  working_dir: "/home/jon/code/whitt-execution-engine"
                  fail_on_error: true
            after_step_succeeds:
              - save_to:
                  - <bookmark_var>
                  - "<output_path>"
              - log:
                  to_file_path: "<log_path>"
                  event_fields: [step_name, duration_ms, total_tokens]
                  level: info
        ```

        ## CRITICAL: Final Synthesis Step Pattern (REQUIRED as last step)

        Every workflow MUST end with a final synthesis step that aggregates prior step outputs into the DELIVERABLE file:

        ```yaml
        step_final_synthesize:
          generative_entity: "${models.qwen35}"
          prompt: |
            Aggregate the prior step outputs into the final deliverable.
            Prior outputs:
            {{step.<prior_step_id>.output}}

            Write the final deliverable content as the response.
          model_overrides:
            max_tokens: 8192
            temperature: 0.3
          when:
            before_step_starts:
              - shell:
                  command: "cat ./outputs/<prior_output>.txt"
                  args: []
                  working_dir: "/home/jon/code/whitt-execution-engine"
                  fail_on_error: true
            after_step_succeeds:
              - save_to:
                  - final_deliverable
                  - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/deliverables/<deliverable_filename>"
              - log:
                  to_file_path: "./logs/step_final_synthesize.log"
                  event_fields: [step_name, duration_ms, total_tokens]
                  level: info
        ```

        ## Category → YAML Pattern Reference

        IMPORTANT: Use FULL block format (NOT compact). Each step MUST include: generative_entity, prompt, model_overrides (block format with temperature AND max_tokens), when block with after_step_succeeds AND after_step_fails hooks. ONLY use schema-valid YAML fields inside step definitions: generative_entity, prompt, model_overrides, tool, input, retry, depends_on, requires, when, loop, sub_workflow, user_input, on_requires_failed. Do NOT add intent:, fit:, description:, or any other non-schema field inside step YAML blocks.

        SEQUENTIAL_PROCESSOR:

        ```yaml
        step_<id>_<name>:
          generative_entity: "${models.qwen35}"
          depends_on: [step_<prior>]
          prompt: |
            <full prompt text describing what the LLM should do>
            When using prior step output, reference: {{step.<prior_step_id>.output}}
            When working with injected file content, reference: {{bookmarks.shell_output.stdout}}
          model_overrides:
            max_tokens: 5120
            temperature: 0.2
          when:
            before_step_starts:
              - shell:
                  command: "cat <path/to/file/this/step/needs>"
                  args: []
                  working_dir: "/home/jon/code/whitt-execution-engine"
                  fail_on_error: true
            after_step_succeeds:
              - save_to:
                  - <bookmark_var>
                  - "<output_path>"
              - log:
                  to_file_path: "<log_path>"
                  event_fields: [step_name, duration_ms, total_tokens]
                  level: info
            after_step_fails:
              - log:
                  to_file_path: "<log_path>"
                  event_fields: [step_name, error_message]
                  level: error
        ```

        ITERATIVE_REFINER:
        ```yaml
        step_<id>_<name>_generate:
          generative_entity: "${models.qwen35}"
          prompt: |
            <generation prompt>
          when:
            after_step_succeeds:
              - save_to: [<var>, "<path>"]

        step_<id>_<name>_evaluate:
          generative_entity: "${models.qwen35}"
          depends_on: [step_<id>_<name>_generate]
          prompt: |
            <eval prompt ending with VERDICT: PASS or FAIL>
          when:
            after_step_succeeds:
              - save_to: [<var>, "<eval_file>"]
              - shell:
                  command: "grep -qi 'PASS' '<eval_file>' && printf '%s' PASS || printf '%s' FAIL"
                  fail_on_error: false
              - gwt:
                  - given: '"{{bookmarks.shell_output.stdout}}" == "PASS"'
                    then: step_<id>_<name>_finalize
                  - given: "true"
                    then: step_<id>_<name>_fix

        step_<id>_<name>_fix:
          generative_entity: "${models.qwen35}"
          prompt: |
            <fix prompt>
        ```

        CONDITIONAL_ROUTER:
        ```yaml
        step_<id>_<name>_route:
          generative_entity: "${models.qwen35}"
          prompt: |
            <eval prompt>
          when:
            after_step_succeeds:
              - gwt:
                  - given: "<condition>"
                    then: [<target_a>]
                  - given: "<condition>"
                    then: [<target_b>]
        ```

        DATA_TRANSFORMER:
        ```yaml
        step_<id>_<name>:
          generative_entity: "${models.qwen35}"
          prompt: |
            <transform prompt>
          when:
            after_step_succeeds:
              - save_to: [<var>, "<path>"]
        ```

        For EACH task from the list, output (COMPACT FORMAT — keep each block under 15 lines):

        ### T<id> - <name> (<category>)
        ```yaml
        <YAML snippet — WRITE ACTUAL PROMPT TEXT inside prompt: | blocks, not placeholders>
        ```

        Rules (STRICT):
        - Output ONLY ```yaml code blocks for the substructure snippets (no other code block types)
        - FORBIDDEN: Do NOT add `intent:`, `fit:`, `description:`, `rationale:`, `notes:`, or ANY other non-schema field inside step YAML blocks. The engine's strict validator rejects unknown fields and the entire workflow will FAIL. Only use: generative_entity, prompt, model_overrides, tool, input, retry, depends_on, requires, when, loop, sub_workflow, user_input, on_requires_failed.
        - Every YAML block must be valid YAML (correct indentation, quoting)
        - Use `step_<id>_<name>` as step IDs (snake_case, no hyphens)
        - Reference models as `${models.qwen35}`
        - Reference prior outputs as `{{step.<step_id>.output}}`
        - Reference injected file content as `{{bookmarks.shell_output.stdout}}`
        - Every step must have `generative_entity`, `prompt`, `model_overrides`, AND `when.after_step_succeeds` with at least save_to + log hooks
        - **MANDATORY FIRST STEP**: Always emit `step_00_bootstrap` that injects prompt.txt via `before_step_starts: shell: cat`. Subsequent steps reference `{{bookmarks.shell_output.stdout}}` to access user prompt content.
        - **MANDATORY LAST STEP**: Always emit `step_final_synthesize` that aggregates prior step outputs into the final deliverable file at `./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/deliverables/<filename>`.
        - **MANDATORY FILE INJECTION**: Any step that needs to read external content (prompt.txt, source files, configs) MUST include `before_step_starts: shell: cat <file>` hook. The shell output goes to `{{bookmarks.shell_output.stdout}}` and the prompt should reference it.
        - **MANDATORY UNIQUE SAVE_TO PATHS**: Each step's `save_to` file path MUST be unique and follow the pattern `./outputs/<step_id>.txt` (e.g., `./outputs/step_t1_analyze_docs.txt`, NOT generic paths like `./docs/reports/initial-thoughts.md`). NEVER reuse the same file path across multiple steps. Downstream steps that need this step's output MUST `cat ./outputs/<step_id>.txt` to read it.
        - **MANDATORY FILENAME CONSISTENCY**: When a downstream step references an upstream step's output via `cat`, the path MUST exactly match the upstream step's `save_to` path. Example: if step_t1 saves to `./outputs/step_t1_analyze_docs.txt`, then step_t2 must `cat ./outputs/step_t1_analyze_docs.txt` (not `./outputs/t1_output.txt` or any other name).
        - **MANDATORY FILE SLICING FOR LARGE FILES**: When a step needs to read a source file >50KB (e.g., `src/benchmark/runner.rs` at 240KB), the `before_step_starts` shell hook MUST use `sed -n '<start>,<end>p'` to extract ONLY the line range relevant to the step's task. Injecting full large files per step wastes context and time. Example: `command: "sed -n '1800,2200p' src/benchmark/runner.rs"` (extracts only lines 1800-2200 relevant to the step's focus). Pick a 200-500 line window around the code the step needs. Full-file `cat` of large files is FORBIDDEN. All shell hooks MUST include `working_dir: "/home/jon/code/whitt-execution-engine"` so relative paths resolve from repo root (execution CWD may differ).
        - **MANDATORY SOURCE FILE MAP**: When referencing whitt-execution-engine source files in shell hooks, use these EXACT paths. NEVER guess paths like `config.yaml` or `tools.rs` — these DON'T EXIST at repo root:
          - Config: `src/config/mod.rs`, `src/config/provider.rs`, `src/config/unified.rs`
          - Agent tools: `src/agent/tools.rs` (NOT `tools.rs`)
          - Agent executor: `src/agent/executor.rs`
          - ReAct agent: `src/agent/react.rs` (NOT `react.rs`)
          - Agent streaming: `src/agent/streaming.rs`
          - Agent persistence: `src/agent/persistence.rs`
          - Agent sandbox: `src/agent/sandbox.rs`
          - Workflow step: `src/workflow/step.rs`
          - Workflow hooks: `src/workflow/hooks/actions.rs`, `src/workflow/hooks/context.rs`, `src/workflow/hooks/gwt.rs`
          - Benchmark runner: `src/benchmark/runner.rs` (NOT `runner.rs`)
          - Model schema: `src/model/schema.rs`, `src/model/registry.rs`, `src/model/resource.rs`
          - LLM backend: `src/backend/llm_backend.rs`, `src/backend/llama_vulkan.rs`
          - HTTP client: `src/client/http_client.rs`, `src/client/model_download.rs`
          - Error types: `src/error.rs`
          - CLI: `src/bin/whitt.rs`, `src/bin/model_chain.rs`
          - Schema: `docs/schema/unified-workflow-schema.yml`
          - Tests: `tests/meta_workflow_yaml_validation.rs`, `tests/three_model_workflow_test.rs`
          - Scripts: `scripts/meta-v6/build-workflow.py`, `scripts/meta-v6/fix-yaml.py`
          For non-whitt projects, use the file paths FROM THE PROMPT or `find . -name <file>` — NEVER guess.
        - **MANDATORY ANTI-META-COMMENTARY**: The deliverable MUST contain ONLY actual content. NEVER include:
          - "Here is the..." / "This document describes..." / "Below is the implementation..."
          - "I'll now..." / "Let me explain..." / "As requested..."
          - "Note: This is a..." / "Disclaimer:..."
          - Start directly with the content (code, analysis, design, etc.)
          - End directly after the content — no closing remarks
        - WRITE ACTUAL PROMPT TEXT inside each `prompt: |` block. NEVER use literal "<placeholder>" — write 2-5 sentences of real instructions describing what the LLM should do, what inputs to read, what outputs to produce.
        - **CRITICAL ANTI-REFUSAL RULE**: NEVER use the word "Read" or "Inspect" or "Look at" + a filename in step prompts. The downstream model sees those words and refuses with "I cannot read files" even when content IS injected. ALWAYS frame as "Using the content provided below, do X". Example: "Using the prior step output {{step.prior_step.output}}, extract the configuration values. Write them as YAML to ./outputs/config.yml. Validate that all required keys are present."
        - Cover EVERY task from the task-category list (BOTH parents AND leaf subtasks) — process in chunks of 5-7 tasks at a time mentally, then emit all blocks. If input has T1 with subtasks T1.1, T1.2, output blocks for ALL of: step_t1_*, step_t1_1_*, step_t1_2_*
        - COMPACT: Intent + Fit are each ONE sentence max. Avoid multi-paragraph explanations.
        - **FORBIDDEN: markdown commentary, prose explanations, analysis text, or any non-YAML content between step blocks.** The ENTIRE output must be consecutive YAML step definitions. No headers, no bullet lists, no introductory paragraphs. If you find yourself writing prose, STOP and emit a step block instead.
        - **REQUIRED OUTPUT FORMAT: Each step block starts with `step_` at column 0. Steps are separated by a single blank line. NO other text is permitted.**
        - Every step needs a log hook:
          ```yaml
          - log:
              to_file_path: "./logs/<step_id>.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
          ```

        Output ONLY the task substructure blocks.
      model_overrides:
        temperature: 0.2
        max_tokens: 5120
      when:
        before_step_starts:
          - shell:
              command: "cat ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/categories.md"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - $sw4_substructures
              - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw4/02-substructures.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw4.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw4.log"
              event_fields: [step_name, error_message]
              level: error

    step_03_evaluate:
      generative_entity: "${models.qwen35}"
      depends_on: [step_02_emit_substructures]
      prompt: |
        You are reviewing YAML substructures from MULTIPLE PERSPECTIVES. Each perspective is a different lens.

        TASK-CATEGORY LIST:
        {{step.step_01_load_categories.output}}

        SUBSTRUCTURES:
        {{step.step_02_emit_substructures.output}}

        MACHINE-CHECKED RESULTS (ground truth — do NOT override):
        {{bookmarks.shell_output.stdout}}

        Evaluate from EACH perspective. For each, output PASS/FAIL with one-sentence reason:

        ## Perspective 1: COVERAGE SCOPE
        - COVERAGE: CHECK COVERAGE_GATE in machine output. If PASS, this criterion PASSES. If FAIL, this criterion FAILS.
        - NO_ORPHANS: No substructure exists for a task not in the list
        - DEPENDS_CHAIN: depends_on references resolve to actual step IDs
        - NO_PLACEHOLDERS: CHECK Placeholder leak in machine output. If > 0, this is FAIL.

        ## Perspective 2: SCHEMA COMPLIANCE SCOPE
        - YAML_ONLY: CHECK THE MACHINE OUTPUT. If non-YAML blocks > 0, this is FAIL.
        - VALID_YAML: Each YAML snippet is syntactically valid
        - CORRECT_PATTERN: The YAML matches the category pattern
        - GENERATIVE_ENTITY: CHECK THE MACHINE OUTPUT. If missing count > 0, this is FAIL.
        - MODEL_OVERRIDES: Every step has model_overrides
        - PROMPTS_ARE_REAL: Every prompt block has actual instruction text (not empty, not just a variable reference)

        ## Perspective 3: HOOK COMPLETENESS SCOPE
        - SAVE_TO_PRESENT: CHECK THE MACHINE OUTPUT. If inline arrays > 0, this is FAIL.
        - LOG_HOOK_PRESENT: Every step has log hook
        - GWT_USES_TEMPLATE: GWT conditions use template variables
        - NO_INLINE_ARRAYS: save_to uses indented list format

        ## Perspective 4: INTEGRATION SCOPE
        - INTEGRATION_TEXT: Each block has "Fit:" description
        - INTENT_TEXT: Each block has "Intent:" description
        - STEP_ID_NAMING: All step IDs are snake_case

        End with:
        VERDICT: PASS  (only if ALL perspectives PASS)
        VERDICT: FAIL  (any perspective FAIL)

        Output ONLY the evaluation.
      model_overrides:
        temperature: 0.1
        max_tokens: 1500
      when:
        before_step_starts:
          - shell:
              command: "STRUCTS='./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw4/02-substructures.md' && CATS='./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/categories.md' && TOTAL_TASKS=$(grep -cE '^(##|###) T[0-9]' \"$CATS\" 2>/dev/null || echo 0) && STEPS_FOUND=$(grep -cE 'step_t[0-9]' \"$STRUCTS\" 2>/dev/null || echo 0) && COVERAGE_PCT=$((TOTAL_TASKS > 0 ? STEPS_FOUND * 100 / TOTAL_TASKS : 0)) && echo '=== MACHINE YAML CHECK ===' && echo \"Input tasks: $TOTAL_TASKS\" && echo \"Steps in output: $STEPS_FOUND\" && echo \"Coverage pct: $COVERAGE_PCT\" && if [ \"$COVERAGE_PCT\" -ge 90 ]; then echo 'COVERAGE_GATE: PASS'; else echo 'COVERAGE_GATE: FAIL'; fi && echo 'YAML blocks:' && grep -c '```yaml' \"$STRUCTS\" 2>/dev/null && echo 'Non-YAML blocks (MUST be 0):' && (grep -c -e '```rust' -e '```python' -e '```bash' -e '```json' \"$STRUCTS\" 2>/dev/null || echo 0) && echo 'generative_entity count:' && grep -c 'generative_entity' \"$STRUCTS\" 2>/dev/null && echo 'Inline arrays (save_to: [...]):' && (grep -c 'save_to: .' \"$STRUCTS\" 2>/dev/null || echo 0) && echo 'Intent/Fit blocks:' && grep -c 'Intent:' \"$STRUCTS\" 2>/dev/null && echo 'Placeholder leak (MUST be 0):' && (grep -c '<placeholder>' \"$STRUCTS\" 2>/dev/null || echo 0) && echo '=== END CHECK ==='"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: false
        after_step_succeeds:
          - save_to:
              - $sw4_eval
              - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw4/03-eval.txt"
          - shell:
              command: "bash ./scripts/meta-v6/sw-gate.sh ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw4/03-eval.txt ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw4/iteration-counter.txt"
              args: []
              fail_on_error: false
          - gwt:
              - given: '"{{bookmarks.shell_output.stdout}}" == "PASS"'
                then: step_05_assemble_final
              - given: "true"
                then: step_04_fix
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw4.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw4.log"
              event_fields: [step_name, error_message]
              level: error

    step_04_fix:
      generative_entity: "${models.qwen35}"
      depends_on: [step_03_evaluate]
      prompt: |
        You are fixing YAML substructure issues identified by multi-perspective review.

        TASK-CATEGORY LIST:
        {{step.step_01_load_categories.output}}

        CURRENT SUBSTRUCTURES:
        {{step.step_02_emit_substructures.output}}

        EVALUATION FAILURES (from multi-perspective review):
        {{step.step_03_evaluate.output}}

        Fix EVERY FAIL identified across ALL perspectives:
        - COVERAGE fails → add missing task substructures
        - SCHEMA fails → fix YAML syntax (quotes, indentation, generative_entity, model_overrides)
        - HOOK fails → add missing save_to (indented list), log hooks, fix GWT templates
        - INTEGRATION fails → add Fit/Intent text, fix step ID naming

        Output CORRECTED substructure blocks (same compact format). Address EVERY FAIL.
        Output ONLY the corrected blocks (all of them, not just the failing ones).
      model_overrides:
        temperature: 0.2
        max_tokens: 8192
      when:
        after_step_succeeds:
          - save_to:
              - $sw4_corrected
              - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw4/04-corrected.md"
          - log:
