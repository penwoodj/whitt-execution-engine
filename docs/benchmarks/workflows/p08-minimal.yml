      prompt: |
        You are producing the final deliverable for the user's task.
        
        Task guidance: Diagnose the Vite+Tauri build errors shown in the prompt. Output a markdown diagnostic report identifying: (1) root cause of 'asset not found: index.html', (2) root cause of 'Failed to resolve import lucide-react' across 4 component files, (3) why 'Waiting for frontend dev server on port 3000' loops indefinitely, (4) concrete actionable fixes (commands to run, files to check). Be specific — reference the actual error lines.
        
        You will receive (via injected context) the complete user request.
        
        Rules:
        - Be exhaustive. Address every aspect of the task.
        - Do NOT refuse. Do NOT say "I cannot read files" — file contents are below.
        - Do NOT emit planning text. Produce the actual deliverable.
        - Output ONLY the final document content. No preamble, no closing remarks.
        
        === USER REQUEST ===
        {{bookmarks.shell_output.stdout}}
      model_overrides:
        temperature: 0.3
        max_tokens: 16384
      when:
        before_step_starts:
          - shell:
              command: "cat /home/jon/code/whitt-execution-engine/docs/plans/meta-workflow-qwen35/test-prompts/real/prompt-08-i-get-this-what-i-run-it-with-the-full-path.md"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - "/home/jon/code/whitt-execution-engine/docs/benchmarks/outputs/meta-workflow/p08-min-20260625/deliverables/diagnostic.md"
              - "./docs/benchmarks/outputs/meta-workflow/p08-min-20260625/workspace/deliverable.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/p08-min-20260625/logs/step_1_generate.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
