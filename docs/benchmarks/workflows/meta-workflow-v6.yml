workflow_id: meta_workflow_v6
name: "Meta Workflow Generator v6"
description: "Orchestrates SW1-SW5 to generate an executable agentic workflow YAML from a high-complexity prompt."
version: "6.0.0"
author: "Whitt Execution Engine"
tags: [meta-workflow, orchestrator, shell-based]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "qwen35":
    name: "Qwen3-5-9B-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan
    load_params:
      context_size: 102400
      batch_size: 2048
      ubatch_size: 512
      cache_type_k: "q8_0"
      cache_type_v: "q8_0"
      gpu_layers: 99
      threads: 6
      use_mmap: true
      flash_attn: true
      cont_batching: false
      no_cache_prompt: true
    sampling:
      temperature: 0.2
      max_tokens: 4096

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/last-run.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:

    step_00_bootstrap:
      generative_entity: "${models.qwen35}"
      prompt: |
        Bootstrapping META-v6 orchestrator. Pipeline will run SW1 then SW2 then SW3 then SW4 then SW5.
        Output READY.
      model_overrides:
        temperature: 0.0
        max_tokens: 10
      when:
        before_step_starts:
          - shell:
              command: "bash scripts/meta-v6/bootstrap.sh docs/plans/meta-workflow-generator/artifacts/dataset/prompt-05.txt"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/last-run.log"
              event_fields: [step_name, duration_ms]
              level: info

    step_01_run_sw1_task_deconstruction:
      generative_entity: "${models.qwen35}"
      depends_on: [step_00_bootstrap]
      prompt: |
        Running SW1 task-deconstruction. Wrapper invokes whitt benchmark on sw1-task-deconstruction.yml.
        Output SW1_DISPATCHED.
      model_overrides:
        temperature: 0.0
        max_tokens: 10
      when:
        before_step_starts:
          - shell:
              command: "bash scripts/meta-v6/run-sw1.sh"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/last-run.log"
              event_fields: [step_name, duration_ms]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/last-run.log"
              event_fields: [step_name, error_message]
              level: error

    step_02_run_sw2_desired_output_state:
      generative_entity: "${models.qwen35}"
      depends_on: [step_01_run_sw1_task_deconstruction]
      prompt: |
        Running SW2 desired-output-state. Wrapper invokes whitt benchmark on sw2-desired-output-state.yml.
        Output SW2_DISPATCHED.
      model_overrides:
        temperature: 0.0
        max_tokens: 10
      when:
        before_step_starts:
          - shell:
              command: "bash scripts/meta-v6/run-sw2.sh"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/last-run.log"
              event_fields: [step_name, duration_ms]
              level: info

    step_03_run_sw3_agentic_categorization:
      generative_entity: "${models.qwen35}"
      depends_on: [step_02_run_sw2_desired_output_state]
      prompt: |
        Running SW3 agentic-categorization. Wrapper invokes whitt benchmark on sw3-agentic-categorization.yml.
        Output SW3_DISPATCHED.
      model_overrides:
        temperature: 0.0
        max_tokens: 10
      when:
        before_step_starts:
          - shell:
              command: "bash scripts/meta-v6/run-sw3.sh"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/last-run.log"
              event_fields: [step_name, duration_ms]
              level: info

    step_04_run_sw4_yaml_substructure_translation:
      generative_entity: "${models.qwen35}"
      depends_on: [step_03_run_sw3_agentic_categorization]
      prompt: |
        Running SW4 yaml-substructure-translation. Wrapper invokes whitt benchmark on sw4-yaml-substructure-translation.yml.
        Output SW4_DISPATCHED.
      model_overrides:
        temperature: 0.0
        max_tokens: 10
      when:
        before_step_starts:
          - shell:
              command: "bash scripts/meta-v6/run-sw4.sh"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/last-run.log"
              event_fields: [step_name, duration_ms]
              level: info

    step_05_run_sw5_final_assembly:
      generative_entity: "${models.qwen35}"
      depends_on: [step_04_run_sw4_yaml_substructure_translation]
      prompt: |
        Running SW5 final-workflow-assembly. Wrapper invokes whitt benchmark on sw5-final-workflow-assembly.yml.
        Output SW5_DISPATCHED.
      model_overrides:
        temperature: 0.0
        max_tokens: 10
      when:
        before_step_starts:
          - shell:
              command: "bash scripts/meta-v6/run-sw5.sh"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/last-run.log"
              event_fields: [step_name, duration_ms]
              level: info

    step_06_final_validation:
      generative_entity: "${models.qwen35}"
      depends_on: [step_05_run_sw5_final_assembly]
      prompt: |
        Pipeline complete. Validating final output.

        Generated workflow preview:
        {{bookmarks.shell_output.stdout}}

        Checks:
        1. generated-workflow.yml exists and non-empty
        2. YAML parses
        3. Contains steps

        Output VALID or INVALID with reason.
      model_overrides:
        temperature: 0.0
        max_tokens: 200
      when:
        before_step_starts:
          - shell:
              command: "bash scripts/meta-v6/validate.sh"
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: false
        after_step_succeeds:
          - save_to:
              - meta_validation
              - "./docs/benchmarks/outputs/meta-workflow/validation.txt"
          - bookmark: true
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/last-run.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
