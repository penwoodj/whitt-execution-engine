workflow_id: tiny_smoke_2step
name: "Tiny 2-step smoke workflow for launcher UX testing"
description: "Minimal generated-workflow shape: two chained steps."
version: "1.0.0"
schema_version: "2.0.0"

providers:
  lmstudio:
    config:
      host: localhost
      port: 1234

models:
  qwen35:
    name: "qwen/qwen3.5-9b"
    host:
      type: lmstudio

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  steps:
    step_t1_haiku:
      generative_entity: "${models.qwen35}"
      prompt: |
        Write a haiku about local language models. Output only the haiku.
      model_overrides:
        max_tokens: 100
        temperature: 0.7
      when:
        after_step_succeeds:
          - save_to: "./outputs/haiku.md"

    step_final_synthesize:
      depends_on:
        - step_t1_haiku
      generative_entity: "${models.qwen35}"
      prompt: |
        Here is a haiku:
        {{step.step_t1_haiku.output}}

        Write a one-paragraph appreciation of it. Output markdown with a ## header.
      model_overrides:
        max_tokens: 300
        temperature: 0.5
      when:
        after_step_succeeds:
          - save_to: "./outputs/deliverable.md"
