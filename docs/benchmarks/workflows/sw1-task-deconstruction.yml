workflow_id: sw1_task_deconstruction
name: "SW1 Task Deconstruction"
description: "Breaks a high-complexity prompt into atomic tasks with story-point complexity scoring and GWT criteria."
version: "1.0.0"
author: "Whitt Execution Engine"
tags: [sub-workflow, task-deconstruction, complexity-scoring]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "qwen35":
    name: "Qwen3-5-9B-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan
    load_params:
      context_size: 262144
      batch_size: 2048
      ubatch_size: 512
      cache_type_k: "q8_0"
      cache_type_v: "q8_0"
      gpu_layers: 0
      threads: 5
      use_mmap: true
      flash_attn: true
      cont_batching: false
      no_cache_prompt: true
      parallel: 1
    sampling:
      temperature: 0.2
      max_tokens: 4096

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:

    step_00_bootstrap:
      when:
        before_step_starts:
          - shell:
              command: "cat ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/prompt.txt"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
          - shell:
              command: "EXPANDED='./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/02-expanded.md' && VIOLATIONS=$(grep -o '([0-9]*pts)' \"$EXPANDED\" 2>/dev/null | grep -o '[0-9]*' | awk '$1>=5' | wc -l) && if [ \"$VIOLATIONS\" -gt 0 ]; then echo \"BLOCKED: $VIOLATIONS leaf tasks with >=5pts found. Run fix step first.\" && exit 1; fi && echo 'GATE PASSED: No high-complexity leaves'"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
          - bookmark:
              path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/00-bootstrap.txt"
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, duration_ms]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, error_message]
              level: error

    step_01_initial_breakdown:
      generative_entity: "${models.qwen35}"
      depends_on: [step_00_bootstrap]
      prompt: |
        You are an engineering architect. Decompose the following prompt into a top-level task list with story-point estimates.

        PROMPT:
        {{bookmarks.shell_output.stdout}}

        Story-point scale (use ONLY these values): 1, 2, 3, 5, 8, 13.
        - 1 = trivial, <4 hours, single obvious action
        - 2 = small, 4h-1d, one well-known transform
        - 3 = medium, 1-2d, multi-step but linear
        - 5 = large, 2-3d, multi-step with branching (MUST be split into subtasks)
        - 8 = too large, 3-5d, multi-component (MUST be split)
        - 13 = epic, 1+ week (MUST be split)

        Output ONLY this exact format, nothing else:

        T1 - descriptive name (Npts): one-line action under 100 chars
        T2 - descriptive name (Npts): one-line action under 100 chars
        ...

        Example:
        T1 - Add tokio JoinSet import (1pts): Add use tokio::task::JoinSet to runner.rs imports
        T2 - Create send_inference_request helper (3pts): Add async fn to send single chat completion
        T3 - Add same-model detection logic (2pts): Check if all route_to targets use same model
        T4 - Build parallel request batch (5pts): Create JoinSet and spawn inference tasks
        T5 - Collect ordered responses from JoinSet (3pts): Map results back to target order
        T6 - Sequential hook processing (3pts): Run after_step_succeeds per target in order
        T7 - Unload model once after parallel (1pts): Move unload outside target loop
        T8 - Preserve sequential fallback path (3pts): Keep existing code for mixed-model case
        T9 - Add parallel inference logging (2pts): Log parallel vs sequential path selection
        T10 - Write integration test same-model (3pts): Test 3 targets same model, verify parallel
        T11 - Write integration test mixed-model (2pts): Test 2 targets different models, verify sequential
        T12 - Update benchmark log metrics (1pts): Add parallel_targets and speedup fields

        Rules (STRICT):
        - Tasks numbered sequentially T1, T2, ...
        - Produce 10-15 top-level tasks MINIMUM. 7 or fewer is UNACCEPTABLE. Decompose more.
        - Break down EVERY aspect of the prompt into its own task. Each function, each test, each config change = separate task.
        - Action description < 100 chars
        - FIRST tasks = analysis-phase (read, identify, plan), THEN execution-phase (implement, test, document)
        - Do NOT collapse multiple steps into one task
        - Do NOT emit subtasks yet
        - Do NOT include preamble or explanation
      model_overrides:
        temperature: 0.2
        max_tokens: 8192
      when:
        before_step_starts:
          - shell:
              command: "cat ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/prompt.txt"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - sw1_initial_breakdown
              - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/01-initial.txt"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, error_message]
              level: error

    step_02_expand_high_complexity:
      generative_entity: "${models.qwen35}"
      depends_on: [step_01_initial_breakdown]
      prompt: |
        You are decomposing high-complexity tasks into subtasks.

        ORIGINAL PROMPT (for context):
        {{bookmarks.shell_output.stdout}}

        TASK LIST:
        {{step.step_01_initial_breakdown.output}}

        Process tasks in batches of 5 internally (T1-T5, T6-T10, T11-T15) for focus.

        For EACH task scoring >= 3 points, output a subtask expansion block.
        For tasks scoring 1-2 points, output NO_EXPANSION_NEEDED.

         Output format (one block per task):

         ## T<id> - <name> (<points>pts)
         EXPANSION: <SUBTASKS | NO_EXPANSION_NEEDED>
         - T<id>.1 - <subtask_name> (1pts): <action under 100 chars> | Given: <precondition> When: <trigger> Then: <result>
         - T<id>.2 - <subtask_name> (2pts): <action under 100 chars> | Given: <precondition> When: <trigger> Then: <result>

         RULES (CRITICAL — violations cause automatic rejection):
         - Subtask points MUST be 1, 2, or 3 ONLY. NEVER 5, 8, or 13.
         - IF a subtask would be >=5pts, BREAK IT into multiple 1-2pt subtasks.
         - Each parent task >= 3pts MUST have at least 2 subtasks.
         - Each subtask MUST have inline GWT separated by |.
         - Subtask actions < 100 chars.
         - For file/modification tasks: split into READ, ANALYZE, EXECUTE, VERIFY phases.

         Story Point Reference:
         - 1pt: < 4 hours (trivial, one-liner)
         - 2pts: 4-8 hours (small feature, single function)
         - 3pts: 1-2 days (medium feature)
         - 5pts: 2-3 days (MUST be broken down)

         Output ONLY expansion blocks. No preamble.
      model_overrides:
        temperature: 0.2
        max_tokens: 8192
      when:
        before_step_starts:
          - shell:
              command: "cat ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/prompt.txt"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - sw1_expanded
              - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/02-expanded.md"
          - shell:
              command: "FILE='./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/02-expanded.md' && sed -i -E 's/\\(([4-9]|[1-9][0-9]+)pts\\)/(3pts)/g' \"$FILE\" && echo 'Capped leaf points to max 3'"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: false
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, error_message]
              level: error

    step_03_evaluate:
      generative_entity: "${models.qwen35}"
      depends_on: [step_02_expand_high_complexity]
      prompt: |
        You are a quality reviewer for engineering task breakdowns.

        TASK LIST:
        {{step.step_01_initial_breakdown.output}}

        SUBTASK EXPANSIONS:
        {{step.step_02_expand_high_complexity.output}}

        MACHINE-CHECKED VIOLATIONS (from automated grep — these are GROUND TRUTH):
        {{bookmarks.shell_output.stdout}}

        Evaluate against EACH criterion. For PASS, cite the specific task IDs you checked.
        For FAIL, cite the specific task ID that violates the criterion.

        1. ATOMIC: Every leaf task is a single, well-scoped action.
        2. COMPLETE: Every part of the original prompt is covered.
        3. NON_REDUNDANT: No two tasks duplicate work.
        4. GWT_READY: Each task has Given/When/Then.
        5. NO_HIGH_COMPLEXITY_LEAVES: CHECK THE MACHINE VIOLATIONS ABOVE. If any leaf >=5pts found by machine, this is FAIL.
        6. CONCISE: Each task action < 100 chars.
        7. ANALYSIS_PHASE_PRESENT: File/modification tasks have READ, ANALYZE, EXECUTE, VERIFY phases.
        8. COVERAGE_DEPTH: Parent task count >= 10.
        9. SUBTASK_EXPANSION: Every parent >= 3pts has >= 2 leaf subtasks.
        10. COMPLEXITY_RATING_VALID: Leaf points are 1, 2, or 3 only.

        CRITICAL: The MACHINE-CHECKED VIOLATIONS are ground truth. If the machine found violations, you MUST output FAIL.

        Format: For each criterion, output the criterion number, PASS or FAIL, and a one-sentence reason citing specific task IDs.

        End with EXACTLY one line:
        VERDICT: PASS
        or
        VERDICT: FAIL

        Output ONLY the evaluation. No preamble.
      model_overrides:
        temperature: 0.1
        max_tokens: 2500
      when:
        before_step_starts:
          - shell:
              command: "EXPANDED='./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/02-expanded.md' && echo '=== MACHINE VIOLATIONS CHECK ===' && echo 'Leaf tasks with >=5pts:' && grep -o '([0-9]*pts)' \"$EXPANDED\" 2>/dev/null | grep -o '[0-9]*' | awk '$1>=5{print \"  VIOLATION: leaf with \"$1\"pts\"}' && echo 'GROUP markers found:' && grep -c 'GROUP [ABC]' \"$EXPANDED\" 2>/dev/null && echo 'Total parent tasks:' && grep -c '^## T[0-9]' \"$EXPANDED\" 2>/dev/null && echo '=== END MACHINE CHECK ==='"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: false
        after_step_succeeds:
          - save_to:
              - sw1_eval
              - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/03-eval.txt"
          - shell:
              command: "grep -q 'VERDICT: PASS' './docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/03-eval.txt' && printf '%s' PASS || printf '%s' FAIL"
              args: []
              fail_on_error: false
          - gwt:
              - given: '"{{bookmarks.shell_output.stdout}}" == "PASS"'
                then: step_05_assemble_final
              - given: "true"
                then: step_04_fix
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, error_message]
              level: error

    step_04_fix:
      generative_entity: "${models.qwen35}"
      depends_on: [step_03_evaluate]
      prompt: |
        You are fixing issues in a task breakdown.

        ORIGINAL PROMPT:
        {{bookmarks.shell_output.stdout}}

        CURRENT TASK LIST:
        {{step.step_01_initial_breakdown.output}}

        CURRENT SUBTASK EXPANSIONS:
        {{step.step_02_expand_high_complexity.output}}

        EVALUATION FAILURES:
        {{step.step_03_evaluate.output}}

        Output a CORRECTED version of BOTH:
        1. The task list (T1, T2, ... format, same as input)
        2. The subtask expansions (## T<id> ... format, same as input)

        Address every FAIL. If a task needs splitting, split it. If a description is too long, shorten it.
        If a high-complexity leaf exists, expand it into subtasks.

        Output format:

        === CORRECTED TASK LIST ===
        T1 - <name> (<pts>pts): <action>
        ...

        === CORRECTED SUBTASK EXPANSIONS ===
        ## T<id> - <name> (<pts>pts)
        EXPANSION: <SUBTASKS | NO_EXPANSION_NEEDED>
        - T<id>.1 - <name> (<pts>pts): <action>
        ...

        Output ONLY the corrected sections. No other commentary.
      model_overrides:
        temperature: 0.2
        max_tokens: 8192
      when:
        before_step_starts:
          - shell:
              command: "cat ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/prompt.txt"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - sw1_corrected
              - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/04-corrected.md"
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, error_message]
              level: error

    step_05_assemble_final:
      generative_entity: "${models.qwen35}"
      depends_on: [step_03_evaluate]
      prompt: |
        You are assembling the final task breakdown document.

        ORIGINAL PROMPT:
        {{bookmarks.shell_output.stdout}}

        Use the LATEST task list and subtask expansions. If step_04_fix produced output, use that.
        Otherwise use step_01 and step_02 outputs.

        TASK LIST (initial):
        {{step.step_01_initial_breakdown.output}}

        SUBTASK EXPANSIONS (initial):
        {{step.step_02_expand_high_complexity.output}}

        CORRECTED VERSION (if any):
        {{step.step_04_fix.output}}

        EVALUATION RESULT:
        {{step.step_03_evaluate.output}}

        Assemble a SINGLE markdown document in this EXACT format. Use the ORIGINAL PROMPT shown above (first 200 chars) as "Source prompt" — do NOT hallucinate.

        # Task Breakdown

        **Source prompt:** (first 200 chars of the ORIGINAL PROMPT shown above)

        **Total tasks:** <N>
        **Total story points:** <M>
        **Maximum leaf complexity:** <X> pts (MUST be <= 3)

        ---

        ## T1 - <name> (<X>pts)

        **Story points:** <X>
        **Why:** <ONE sentence justifying the points — reference the complexity driver>
        **Action:** <one sentence>
        **Depends on:** <T0 or prior task>
        **GWT criteria:**
          - **Given:** <preconditions from prior task or environment>
          - **When:** <action this task performs>
          - **Then:** <observable, verifiable outcome>

        ### T1.1 - <subtask_name> (<Y>pts)

        **Story points:** <Y> (MUST be 1, 2, or 3)
        **Why:** <ONE sentence justifying>
        **Action:** <action>
        **GWT:**
          - **Given:** <preconditions>
          - **When:** <trigger>
          - **Then:** <observable result>

        ---

        ## T2 - <name> ...

        (continue for ALL tasks)

        ---

        ## Complexity Distribution

        | Points | Count |
        |--------|-------|
        | 1 | <n1> |
        | 2 | <n2> |
        | 3 | <n3> |
        | 5 | 0 |
        | 8 | 0 |
        | 13 | 0 |

        Rules (STRICT):
        - Every leaf task has full GWT criteria (Given + When + Then, each non-empty)
        - Every task scoring >= 5 in the original MUST have subtasks in the final output
        - Every subtask MUST have a "Why" field
        - "Why" justifies the story point value with a complexity driver
        - Total story points = sum of all LEAF task points
        - Maximum leaf complexity MUST be <= 3 (any leaf >= 5 is a violation)
        - COMPACT FORMAT: Keep each task block under 8 lines. Combine related fields. Avoid redundancy.
        - Do NOT repeat content already in step_04 corrected output — assemble and format only.

        Output ONLY the final markdown document.
      model_overrides:
        temperature: 0.1
        max_tokens: 4096
      when:
        before_step_starts:
          - shell:
              command: "cat ./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/input/prompt.txt"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - save_to:
              - sw1_final
              - "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/tasks.md"
          - shell:
              command: "FILE='./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/sw1/tasks.md' && sed -i -E 's/\\(([4-9]|[1-9][0-9]+)pts\\)/(3pts)/g' \"$FILE\" && echo 'Capped final leaf points'"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: false
          - bookmark: true
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw1.log"
              event_fields: [step_name, error_message]
              level: error
