# ═══════════════════════════════════════════════════════════════════
# LM Studio Smoke Test — Single Model
# Purpose: Verify the engine can execute a workflow against the
# LM Studio local server (OpenAI-compatible, default port 1234).
#
# The model name below must be (a substring of) the model identifier
# LM Studio reports at GET /v1/models. Update it to match a model
# you have downloaded in LM Studio.
#
# Run:
#   cargo run --release --features client --bin whitt -- \
#     benchmark --workflow docs/benchmarks/workflows/lmstudio-smoke-test.yml
# ═══════════════════════════════════════════════════════════════════

workflow_id: lmstudio_smoke_test
name: "LM Studio Smoke Test"
description: "Single-step inference through the LM Studio provider to verify connectivity, JIT model loading, and hooks"
version: "1.0.0"
author: "Whitt Execution Engine"
tags: [test, lmstudio]
min_schema_version: "2.0.0"
schema_version: "2.0.0"

# ── PROVIDERS ───────────────────────────────────────────────────
providers:
  lmstudio:
    config:
      host: localhost
      port: 1234

# ── MODELS ──────────────────────────────────────────────────────
models:
  "worker":
    name: "qwen/qwen3.5-9b"
    host:
      type: lmstudio

# ── WORKFLOW EXECUTION STRATEGY ────────────────────────────────
workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

# ── AGENTIC WORKFLOW ───────────────────────────────────────────
agentic_workflow:
  steps:
    smoke_inference:
      generative_entity: "${models.worker}"
      prompt: |
        Reply with a single JSON object and nothing else:
        {"status":"ok","engine":"whitt","backend":"lmstudio"}
      model_overrides:
        max_tokens: 100
        temperature: 0.0
      when:
        after_step_succeeds:
          - save_to: "./docs/benchmarks/outputs/output/lmstudio-smoke-{{step.step_name}}.json"
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/lmstudio-smoke.log"
              event_fields: [step_name, duration_ms, model_name]
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/lmstudio-smoke.log"
              event_fields: [step_name, error_message]
