workflow_id: sw5_final_workflow_assembly
name: "SW5 Final Workflow Assembly"
description: "Assembles final executable workflow via deterministic Python script. SW5 is mechanical concatenation by design — LLM did creative work in SW1-SW4."
version: "2.0.0"
author: "Whitt Execution Engine"
tags: [sub-workflow, final-assembly, deterministic]
schema_version: "2.0.0"
min_schema_version: "2.0.0"

# DESIGN DECISION (2026-06-27): SW5 has NO LLM cascade.
# Prior design attempted 6-step LLM cascade (inventory → skeleton → assemble →
# evaluate → fix → finalize). At Qwen3.5-9B level, LLM cascade had 0% success rate:
# model flattened YAML step fields into prompt body, emitted invalid indentation,
# dropped hooks. Pipeline always overwrote LLM output with deterministic assembler.
#
# Honest engineering: assembly is mechanical. SW5 = deterministic assembler.
# LLM creativity happens in SW1 (decomposition), SW2 (output state),
# SW3 (categorization), SW4 (per-step YAML). SW5 stitches SW4 outputs into one file.

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "qwen35":
    name: "Qwen3-5-9B-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan
    load_params:
      context_size: 32768                 # 2x buffer of 16k max response; bump to 262144 if input+response >= 131072
      batch_size: 2048
      ubatch_size: 512
      cache_type_k: "q8_0"
      cache_type_v: "q8_0"
      gpu_layers: 99  # server config wins; pre-loaded model uses -ngl 99 from host config.yml
      threads: 5
      use_mmap: true
      flash_attn: true
      cont_batching: false
      no_cache_prompt: true
      parallel: 1
    sampling:
      temperature: 0.0
      max_tokens: 1

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw5.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:

    step_00_assemble:
      generative_entity: "${models.qwen35}"
      prompt: "OK"
      model_overrides:
        temperature: 0.0
        max_tokens: 1
      when:
        before_step_starts:
          # Deterministic assembler: extracts step YAML blocks from SW4 structs.md,
          # strips {{step.X.output}} templates, dedups save_to paths, rewrites
          # SW4-internal paths to META run-id paths, injects bootstrap + synthesis steps.
          - shell:
              command: "bash /home/jon/code/whitt-execution-engine/scripts/meta-v6/sw5-assemble.sh __RUN_ID__ __META_RUN_ID__"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw5.log"
              event_fields: [step_name, duration_ms]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw5.log"
              event_fields: [step_name, error_message]
              level: error

    step_01_validate_and_finalize:
      generative_entity: "${models.qwen35}"
      depends_on: [step_00_assemble]
      prompt: "OK"
      model_overrides:
        temperature: 0.0
        max_tokens: 1
      when:
        before_step_starts:
          # Validate assembled YAML parses. Apply fix-yaml.py normalization.
          # Copy to META run dir as generated-workflow.yml (canonical pipeline output).
          - shell:
              command: "bash /home/jon/code/whitt-execution-engine/scripts/meta-v6/sw5-finalize.sh __RUN_ID__ __META_RUN_ID__"
              args: []
              working_dir: "/home/jon/code/whitt-execution-engine"
              fail_on_error: true
        after_step_succeeds:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw5.log"
              event_fields: [step_name, duration_ms]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./docs/benchmarks/outputs/meta-workflow/__RUN_ID__/logs/sw5.log"
              event_fields: [step_name, error_message]
              level: error
