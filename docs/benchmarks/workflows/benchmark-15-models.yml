# ── WORKFLOW EXECUTION STRATEGY ────────────────────────────────
workflow_execution_strategy:                             # schema line 503
  memory:
    model_lifecycle:
      unload_unused: true                               # schema line 521

# ── AGENTIC WORKFLOW ───────────────────────────────────────────
# Single step iterated over 15 models via iterate_values hook.
# Runner expands into 15 resolved steps at execution time.
# Template vars: {{step.model_ref}}, {{step.model_name}}, {{iteration}}
agentic_workflow:                                        # schema line 196

  steps:                                                # schema line 293
    benchmark_adr:
      generative_entity: "${models.{{step.model_ref}}}"   # schema line 297 — resolved per iteration
      prompt: |                                         # schema line 298
        Build me a JSON parsable ADR file with good schema-specific specifications for an ADR. Fill out that JSON ADR with all of the information required to build a vanilla JS TODO application. Use proper JSON schema structure - do not put everything into giant strings. The response must look like JSON and be parsable as JSON. Output only the JSON object with no markdown fences.
      model_overrides:                                  # schema line 303
        max_tokens: 4096
      when:                                             # schema line 314
        before_step_starts:                             # schema line 315
          - iterate_values:
              step.model_ref: ["qwen-05b-q4", "qwen-05b-q5", "qwen-05b-q8", "qwen-15b-q4", "qwen-15b-q5", "qwen-15b-q8", "qwen-3b-q4", "qwen-3b-q5", "qwen-3b-q8", "qwen-7b-q4", "qwen-7b-q5", "qwen-7b-q8", "qwen-14b-q4", "qwen-14b-q5", "qwen-14b-q8"]
              step.model_name: ["Qwen2.5-0.5B-Instruct-Q4_K_M", "Qwen2.5-0.5B-Instruct-Q5_K_M", "Qwen2.5-0.5B-Instruct-Q8_0", "Qwen2.5-1.5B-Instruct-Q4_K_M", "Qwen2.5-1.5B-Instruct-Q5_K_M", "Qwen2.5-1.5B-Instruct-Q8_0", "Qwen2.5-3B-Instruct-Q4_K_M", "Qwen2.5-3B-Instruct-Q5_K_M", "Qwen2.5-3B-Instruct-Q8_0", "Qwen2.5-7B-Instruct-Q4_K_M", "Qwen2.5-7B-Instruct-Q5_K_M", "Qwen2.5-7B-Instruct-Q8_0", "Qwen2.5-14B-Instruct-Q4_K_M", "Qwen2.5-14B-Instruct-Q5_K_M", "Qwen2.5-14B-Instruct-Q8_0"]
        after_step_succeeds:                            # schema line 323
          - save_to: "./docs/benchmarks/outputs/output/{{step.model_name}}.json"  # schema line 476
          - log:                                        # schema line 275
              to_file_path: "./docs/benchmarks/outputs/logs/benchmark.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:                               # schema line 328
          - log:
              to_file_path: "./docs/benchmarks/outputs/logs/benchmark.log"
              event_fields: [step_name, error_message]
