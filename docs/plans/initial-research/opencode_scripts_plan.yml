opencode_scripts_plan:
  scripts:
    - name: "parse_csv"
      description: "Validate the requirements CSV and convert it into structured JSON for downstream processing."
      inputs:
        - "requirements.csv"
      outputs:
        - "requirements.json"
      steps:
        - "Read the CSV header and verify it matches the required columns."
        - "Parse each row into a JSON object with corresponding fields."
        - "Validate that req_id is unique and status and priority values are valid."
        - "Write the resulting array of objects to requirements.json."
    - name: "report_generator"
      description: "Generate human-readable markdown reports from requirements and research data"
      inputs:
        - "requirements.json"
        - "research_sources.yml"
        - "rust_stack_recommendations.yml"
        - "local_llm_performance_playbook.yml"
      outputs:
        - "glossary.md"
        - "architecture_mapping.md"
        - "comparison.md"
        - "performance_guide.md"
        - "schema_design.md"
        - "security_model.md"
        - "evaluation_plan.md"
        - "index.md"
      steps:
        - "Load requirements and group by area and dimension."
        - "Create a glossary with definitions for domain jargon using research_sources.yml."
        - "Map requirements to architecture components and suggested crates from rust_stack_recommendations.yml."
        - "Produce a comparison report of related open-source projects and what to borrow."
        - "Assemble a performance tuning guide using the local_llm_performance_playbook.yml."
        - "Outline schema design options and recommend a YAML grammar."
        - "Describe the security and safety model for scopes, approvals, diff staging and verifiers."
        - "Draft an evaluation and benchmarking plan including metric schemas and chart types."
        - "Generate an index file linking all reports."
    - name: "crosslinker"
      description: "Create mappings from requirements to documentation sections and recommended crates."
      inputs:
        - "requirements.json"
        - "requirements_backlog.yml"
        - "rust_stack_recommendations.yml"
      outputs:
        - "crosslinks.json"
      steps:
        - "For each requirement, identify its epic and capability from requirements_backlog.yml."
        - "Link requirement areas to relevant crates in rust_stack_recommendations.yml."
        - "Produce a JSON object mapping req_id to documentation sections and recommended crates."
    - name: "checker"
      description: "Verify that the expected report files exist in the docs folder."
      inputs:
        - "./transpiler/opencode/docs/reports/requirements-research-and-documentation/"
      outputs:
        - "check_results.json"
      steps:
        - "Define the list of required report filenames."
        - "Iterate through the list and check for the existence of each file."
        - "Record success or failure for each file in check_results.json."
        - "If any file is missing, return a non-zero exit code to signal incomplete report generation."
  language_note: "The scripts can be implemented in Rust for performance or Python for rapid development. Use standard CSV and YAML libraries and ensure deterministic outputs."
