opencode_orchestrator_plan:
  tasks:
    - id: "task1"
      name: "Assemble research sources"
      description: "Collect research sources and compile research_sources.yml."
      depends_on: []
      outputs:
        - "research_sources.yml"
      milestones:
        - "Gather at least ten relevant sources across DSLs, workflow engines, local LLMs, Rust libraries and performance techniques."
        - "summarize each source with why_relevant and paraphrased quotes."
    - id: "task2"
      name: "generate requirements CSV"
      description: "Produce the comprehensive requirements inventory as requirements.csv."
      depends_on:
        - "task1"
      outputs:
        - "requirements.csv"
      milestones:
        - "Define unique req_id values and populate all required columns."
        - "Assign statuses and priorities based on explicitness and importance."
    - id: "task3"
      name: "Create backlog structure"
      description: "Build requirements_backlog.yml linking ep" capabilities and req_ids."
      depends_on:
        - "task2"
      outputs:
        - "requirements_backlog.yml"
      milestones:
        - "Identify epics and capabilities from requirement areas and dimensions."
        - "Map each requirement to a capability."
    - id: "task4"
      name: "Recommend Rust stack"
      description: "Draft rust_stack_recommendations.yml suggesting crates and patterns."
      depends_on:
        - "task2"
      outputs:
        - "rust_stack_recommendations.yml"
      milestones:
        - "For each component area, propose at least one crate and justify its selection."
        - "document risks associated with each crate."
    - id: "task5"
      name: "Write performance playbook"
      description: "Produce local_llm_performance_playbook.yml with tuning guidelines."
      depends_on:
        - "task2"
      outputs:
        - "local_llm_performance_playbook.yml"
      milestones:
        - "Include quantization, memory management, speculative decoding, offloading, model selection and hardware-specific advice."
        - "Provide actionable guidelines for each section."
    - id: "task6"
      name: "draft scripts plan"
      description: "Outline opencode_scripts_plan.yml detailing parser, report generator, crosslinker and checker scripts."
      depends_on:
        - "task2"
      outputs:
        - "opencode_scripts_plan.yml"
      milestones:
        - "Define inputs, outputs and steps for each script."
        - "Ensure scripts are language-agnostic and implementable."
    - id: "task7"
      name: "assemble orchestrator plan"
      description: "create opencode_orchestrator_plan.yml with tasks, dependencies and milestones."
      depends_on:
        - "task1"
        - "task2"
        - "task3"
        - "task4"
        - "task5"
        - "task6"
      outputs:
        - "opencode_orchestrator_plan.yml"
      milestones:
        - "List tasks sequentially with dependencies."
        - "Define outputs and completion checkpoints for each task."
        - "Set up a progress tracking mechanism (e.g., status field)."
  output_directories:
    - path: "./transpiler/opencode/docs/reports/requirements-research-and-documentation/"
      description: "Directory where the report suite will be generated and checked."
  completion_checks:
    - description: "All tasks completed and report files verified by checker."
      condition: "checker reports all expected files present"
