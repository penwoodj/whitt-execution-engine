research_sources:
  agentic_workflow:
    - id: S001
      title: "Agentic workflows on GitHub"
      publisher: "Ken Muse blog"
      year: 2026
      url: "https://example.com/kenmuse-agentic-workflows"
      why_relevant: "Demonstrates how YAML frontmatter defines triggers and tools in agentic workflow files."
      quotes_paraphrased: "Top YAML section specifies triggers and tools; bottom Markdown section contains agent instructions."
    - id: S002
      title: "Apache Beam Summit: LLMs and YAML pipelines"
      publisher: "Beam Summit"
      year: 2025
      url: "https://example.com/beam-summit-llm-yaml"
      why_relevant: "Explains integrating LLMs to parse, validate and execute Beam YAML pipelines."
      quotes_paraphrased: "LLMs interpret, validate and transform YAML pipeline definitions into runnable code."
  workflow_engines:
    - id: S003
      title: "Orka crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/orka"
      why_relevant: "Describes a type-safe, pluggable workflow engine in Rust."
      quotes_paraphrased: "Orka provides asynchronous handlers, shared context management and conditional branching for complex workflows."
    - id: S004
      title: "Windmill workflow engine blog"
      publisher: "Windmill.dev"
      year: 2025
      url: "https://example.com/windmill-workflow-engine"
      why_relevant: "Defines what a workflow engine is and highlights features like DAG orchestration, resource management and reactivity."
      quotes_paraphrased: "A workflow engine orchestrates a DAG of job specifications with durability, parallelism and observability."
  rust_libraries:
    - id: S005
      title: "rust_yaml crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/yaml-rust"
      why_relevant: "Provides safe, zero-copy YAML parsing with comprehensive error handling."
      quotes_paraphrased: "The library offers memory safety, performance and reliability for YAML 1.2 parsing."
    - id: S006
      title: "schemars crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/schemars"
      why_relevant: "Enables deriving JSON Schema from Rust types for validation."
      quotes_paraphrased: "With #[derive(JsonSchema)] developers can generate schemas for custom structs."
    - id: S007
      title: "clap crate aspirations"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/clap"
      why_relevant: "Describes goals of a polished CLI parser with help generation and shell completions."
      quotes_paraphrased: "Clap aims for a user-friendly CLI, generating helpful messages, suggestions and colored output."
    - id: S008
      title: "tui crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/tui"
      why_relevant: "Provides building blocks for terminal UIs using Crossterm."
      quotes_paraphrased: "Developers can instantiate a terminal with CrosstermBackend and build rich UI components."
    - id: S009
      title: "dbq crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/dbq"
      why_relevant: "Implements a job queue backed by PostgreSQL with migrations and worker pools."
      quotes_paraphrased: "Queue creation, job enqueueing and worker pool management are demonstrated in sample code."
    - id: S010
      title: "dynamic_plugin crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/dynamic-plugin"
      why_relevant: "Introduces a safe dynamic plugin system in Rust with compile-time checks."
      quotes_paraphrased: "The crate reintroduces safety to runtime-loaded plugins using macros and FFI bridging."
    - id: S011
      title: "similar crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/similar"
      why_relevant: "Offers diff algorithms and unified diff output utilities."
      quotes_paraphrased: "Provides high-level and low-level diff algorithms and unified diff generation utilities."
    - id: S012
      title: "tracing crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/tracing"
      why_relevant: "Supplies structured logging and diagnostics for asynchronous Rust applications."
      quotes_paraphrased: "Uses spans and events to collect structured diagnostics and is compatible with async applications."
    - id: S013
      title: "typed-sled crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/typed-sled"
      why_relevant: "Builds on sled to provide typed key-value storage with search engine and key generation features."
      quotes_paraphrased: "Offers BTreeMap-like API, search engine and custom serialization for typed keys and values."
    - id: S014
      title: "job_scheduler crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/job-scheduler"
      why_relevant: "A simple cron-like job scheduler library for Rust."
      quotes_paraphrased: "Schedules are defined with fields for seconds, minutes, hours and days; jobs run on schedule."
    - id: S015
      title: "petgraph crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/petgraph"
      why_relevant: "Provides graph data structures, algorithms and DOT output."
      quotes_paraphrased: "Supports directed and undirected graphs with arbitrary node and edge data and Graphviz DOT output."
    - id: S016
      title: "CrabNebula code generation blog"
      publisher: "CrabNebula.dev"
      year: 2024
      url: "https://example.com/crabnebula-codegen"
      why_relevant: "Discusses Rust code generation tools including quote, walkdir and phf."
      quotes_paraphrased: "Quote and walkdir enable procedural macro code generation; phf implements compile-time maps."
    - id: S017
      title: "patch crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/patch"
      why_relevant: "Parses and produces unified diff formats compatible with Git."
      quotes_paraphrased: "Shows how to parse a unified diff into a Rust representation and write it back out."
    - id: S018
      title: "cronjob crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/cronjob"
      why_relevant: "Demonstrates scheduling methods with CronJob objects and threaded execution."
      quotes_paraphrased: "Cron jobs are created with seconds and minutes and can run in a separate thread."
    - id: S019
      title: "wasm_sandbox crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/wasm-sandbox"
      why_relevant: "Offers a secure WebAssembly-based sandbox for untrusted code with resource limits."
      quotes_paraphrased: "Highlights security, high-performance host-guest communication, flexible APIs and resource control."
  local_llms:
    - id: S020
      title: "LM Studio local LLM article"
      publisher: "InfoWorld"
      year: 2026
      url: "https://example.com/lmstudio-article"
      why_relevant: "Describes LM Studio's GUI, model search, memory filtering, chat interface and REST API server for local LLMs."
      quotes_paraphrased: "LM Studio lets users search models, adjust CPU threads and GPU layers, track tokens and serve models via REST API."
    - id: S021
      title: "Local LLM ecosystem overview"
      publisher: "Medium"
      year: 2025
      url: "https://example.com/local-llm-overview"
      why_relevant: "Summarises local LLM tools: Ollama, LM Studio, text-generation-webui, GPT4All and LocalAI."
      quotes_paraphrased: "Ollama offers a CLI with streaming and model library; LM Studio provides a GUI and API; text-generation-webui supports multiple backends; LocalAI integrates multiple architectures with API compatibility."
    - id: S022
      title: "DEV: Best local AI models"
      publisher: "DEV Community"
      year: 2025
      url: "https://example.com/dev-best-local-ai-models"
      why_relevant: "Highlights benefits of local LLMs and summarises features of various local frameworks."
      quotes_paraphrased: "Running models locally provides privacy, no subscriptions, offline access and low latency; lists features of Ollama, LM Studio, text-generation-webui, GPT4All and LocalAI."
  performance_optimization:
    - id: S023
      title: "Speculative decoding for local inference"
      publisher: "OpenInfer"
      year: 2024
      url: "https://example.com/speculative-decoding-local-inference"
      why_relevant: "Discusses memory bandwidth bottleneck and speculative decoding to improve throughput."
      quotes_paraphrased: "Explains how using a draft model to propose multiple tokens batches reduces memory transfers and increases tokens per second."
    - id: S024
      title: "vLLM and PagedAttention"
      publisher: "Medium"
      year: 2024
      url: "https://example.com/vllm-pagedattention"
      why_relevant: "Describes vLLM engine features including PagedAttention for memory reuse and continuous batching."
      quotes_paraphrased: "PagedAttention divides KV cache into pages to reduce memory fragmentation and enable long context windows with high throughput."
    - id: S025
      title: "Memory bandwidth and quantization"
      publisher: "Sandgarden"
      year: 2025
      url: "https://example.com/llama-quantization"
      why_relevant: "Explains llama.cpp features like quantization, CPU-first design and local inference capabilities."
      quotes_paraphrased: "Quantization allows large models to run on limited memory; llama.cpp supports cross-platform CPU and GPU execution and GGUF file format."
    - id: S026
      title: "Rust performance in AI"
      publisher: "Rust AI Blog"
      year: 2025
      url: "https://example.com/rust-ai-performance"
      why_relevant: "Highlights Rust's performance, memory safety and concurrency benefits for AI workloads."
      quotes_paraphrased: "Rust offers memory safety, fearless concurrency and compiled binaries which make it attractive for tokenizers and inference engines."
    - id: S027
      title: "work_queue crate documentation"
      publisher: "docs.rs"
      year: 2024
      url: "https://docs.rs/work-queue"
      why_relevant: "Implements a concurrent work-stealing queue with fixed-capacity local queues."
      quotes_paraphrased: "Each worker has a local queue with a non-stealable slot for sending tasks; tasks can be stolen by other workers when idle."
