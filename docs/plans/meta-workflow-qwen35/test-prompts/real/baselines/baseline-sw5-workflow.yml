                    message: "Test function may need additional regression assertions"
                    level: warning
      depends_on: [step_t7_validate_sequential_fallback]

    step_t11_update_log_format:
      generative_entity: ${models.qwen35}
      prompt: Add parallel inference metrics to the benchmark log entry. Output the exact log statement.
      model_overrides:
        max_tokens: 1024
      when:
        after_step_succeeds:
          - action: save_to
            paths: [log_format_logic, ./data/t11_log_format_logic.txt]
          - action: log
            to_file_path: ./logs/t11_update_log_format.log
            event_fields: [step_name, duration_ms, total_tokens]
            level: info
      depends_on: [step_t4_3_collect_ordered_responses]

    step_t12_documentation_update:
      generative_entity: ${models.qwen35}
      prompt: Add a documentation note to AGENTS.md or the benchmark docs describing the parallel inference optimization. Output the exact markdown content.
      model_overrides:
        max_tokens: 2048
      when:
        after_step_succeeds:
          - action: save_to
            paths: [documentation_note, ./data/t12_documentation_note.md]
          - action: log
            to_file_path: ./logs/t12_documentation_update.log
            event_fields: [step_name, duration_ms, total_tokens]
            level: info
