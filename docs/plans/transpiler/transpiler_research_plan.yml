transpiler_research_plan:
  description: "Research plan for transpiler-specific components only (YAML schema, parsing, code generation, testing)"

  research_areas:
    - name: "YAML Schema Design"
      priority: p0
      requirements:
        - "R0054 - Schema definition"
        - "R0055 - Schema evolution & migrations"
      research_questions:
        - "What are best practices for YAML DSL schema design?"
        - "How do existing workflow engines (GitHub Actions, Argo Workflows, Prefect, Temporal) design their YAML schemas?"
        - "What validation libraries and patterns exist for YAML schemas in Rust?"
        - "How to support schema evolution and backward compatibility in YAML-based DSLs?"
      deliverables:
        - "Schema design options analysis"
        - "Comparison of YAML schema validation approaches (Schemars, KDL, custom)"
        - "Schema evolution patterns and migration strategies"
        - "Recommendation for schema format and validation approach"
      sources_to_consult:
        - "GitHub Actions workflow syntax"
        - "Argo Workflows YAML schema"
        - "Prefect flow schemas"
        - "Temporal workflow definitions"
        - "Schemars crate documentation"
        - "RustYaml crate patterns"
      estimated_effort: "4-6 hours"

    - name: "Parser & AST Design"
      priority: p0
      requirements:
        - "R0058 - Parser & AST"
        - "R0059 - Typed WorkflowIR"
        - "R0019 - Structural semantics"
      research_questions:
        - "What are common AST design patterns for transpilers?"
        - "How to preserve source location data for error reporting?"
        - "What data structures work best for DAG/state-machine representations in Rust?"
        - "How to ensure stable node identities across parsing passes?"
      deliverables:
        - "AST design pattern comparison"
        - "Source location preservation strategies"
        - "DAG/state-machine data structure options in Rust"
        - "Stable ID generation strategies"
        - "Recommendation for AST and IR structure"
      sources_to_consider:
        - "Petgraph crate patterns"
        - "Orka workflow IR design"
        - "Compiler AST patterns (rustc, Clang, Swift)"
        - "Rust AST crates (syn, quote) for inspiration"
      estimated_effort: "6-8 hours"

    - name: "Code Generation Patterns"
      priority: p0
      requirements:
        - "R0061 - AgentSDK mapping layer"
        - "R0062 - Custom tool bindings"
        - "R0065 - Runtime hooks generation"
      research_questions:
        - "What code generation patterns are used in Rust transpilers?"
        - "Template-based vs procedural code generation tradeoffs?"
        - "How to generate trait implementations and adapter code deterministically?"
        - "What patterns exist for hook generation and instrumentation?"
      deliverables:
        - "Code generation pattern comparison (template-based vs procedural vs hybrid)"
        - "Template engine comparison (Askama, Handlebars, Tera, custom)"
        - "Deterministic codegen best practices"
        - "Hook and instrumentation generation patterns"
        - "Recommendation for code generation approach"
      sources_to_consider:
        - "Askama crate documentation and examples"
        - "Handlebars Rust crate"
        - "Tera template engine"
        - "Codebase examples: sqlx-query, prost, tonic-build"
        - "CrabNebula codegen patterns"
      estimated_effort: "6-8 hours"

    - name: "Project Layout & Packaging"
      priority: p1
      requirements:
        - "R0063 - Project layout generator"
        - "R0064 - Packaging strategy selector"
        - "R0023 - Packaging choice"
      research_questions:
        - "What are standard Cargo project layouts for generated code?"
        - "How do other build tools generate project structures?"
        - "What are tradeoffs between standalone, import backend, and inline packaging?"
        - "How to handle workspace vs single-crate generation?"
      deliverables:
        - "Project layout best practices"
        - "Packaging strategy comparison table"
        - "Dependency management strategies for generated projects"
        - "Workspace layout patterns"
        - "Recommendation for project layout generation"
      sources_to_consider:
        - "Cargo book project structure guidelines"
        - "Rust workspace patterns"
        - "Build system project generation patterns (Bazel, Buck, Cargo)"
        - "Rust crate packaging best practices"
      estimated_effort: "4-6 hours"

    - name: "Validation & Linting"
      priority: p0
      requirements:
        - "R0056 - Static validation"
        - "R0057 - Linting & best practices"
        - "R0066 - Effect preview emission"
      research_questions:
        - "What validation patterns exist for YAML DSLs?"
        - "How to separate validation from linting cleanly?"
        - "What common lint rules exist for workflow systems?"
        - "How to implement effect analysis and preview?"
      deliverables:
        - "Validation pattern comparison (declarative vs imperative)"
        - "Lint rule design patterns"
        - "Effect analysis strategies"
        - "Validation error reporting best practices"
        - "Recommendation for validation and linting architecture"
      sources_to_consider:
        - "GitHub Actions validation error messages"
        - "Argo Workflows validation"
        - "Rust clippy lint design patterns"
        - "Effect system research papers"
        - "RustYaml garde validation patterns"
      estimated_effort: "6-8 hours"

    - name: "Testing Strategies for Transpilers"
      priority: p2
      requirements:
        - "R0070 - Golden tests"
        - "R0071 - Property tests"
        - "R0068 - Deterministic formatting"
      research_questions:
        - "What testing patterns are used for transpilers?"
        - "How to implement effective golden/snapshot testing?"
        - "What property-based testing strategies work for parsers and validators?"
        - "How to test deterministic code generation effectively?"
      deliverables:
        - "Golden testing pattern comparison"
        - "Snapshot testing best practices in Rust"
        - "Property-based testing for parsers/validators"
        - "Regression testing strategies for transpilers"
        - "Recommendation for testing framework and patterns"
      sources_to_consider:
        - "Rust snapshot testing crates (insta, expectest)"
        - "Proptest crate documentation"
        - "Compiler testing patterns (rustc test suite)"
        - "Transpiler testing literature"
      estimated_effort: "6-8 hours"

    - name: "Caching & Performance"
      priority: p3
      requirements:
        - "R0072 - Compilation caching"
        - "R0060 - Deterministic normalization"
        - "R0074 - Capability-aware lowering"
      research_questions:
        - "What caching strategies exist for compilation pipelines?"
        - "How to ensure deterministic normalization for caching?"
        - "What are effective cache invalidation strategies?"
        - "How to implement capability-aware lowering safely?"
      deliverables:
        - "Caching strategy comparison"
        - "Cache key design patterns"
        - "Invalidation strategy patterns"
        - "Deterministic normalization algorithms"
        - "Recommendation for caching and normalization approach"
      sources_to_consider:
        - "Bazel/Gradle caching mechanisms"
        - "Rust incremental compilation design"
        - "Hash-based caching patterns"
        - "LLVM IR normalization techniques"
      estimated_effort: "6-8 hours"

    - name: "Sandboxing & Security"
      priority: p2
      requirements:
        - "R0073 - Sandboxed codegen"
        - "R0067 - Verifier integration stubs"
      research_questions:
        - "What sandboxing patterns exist for code generation?"
        - "How to enforce path guards in generated code?"
        - "What security best practices apply to DSL-to-code transpilation?"
        - "How to design verifier integration safely?"
      deliverables:
        - "Sandboxing pattern comparison"
        - "Path guard implementation strategies"
        - "Dependency allowlist patterns"
        - "Verifier integration security patterns"
        - "Recommendation for sandboxing approach"
      sources_to_consider:
        - "WasmSandbox patterns"
        - "RustAI security patterns"
        - "LLM code generation security research"
        - "Path traversal vulnerability mitigation patterns"
      estimated_effort: "4-6 hours"

    - name: "ModelProvider & LLM Backend Integration"
      priority: p0
      requirements:
        - "R0036 - Model abstraction"
        - "R0037 - Provider support"
        - "R0038 - Hardware acceleration"
        - "R0042 - Model lifecycle"
      research_questions:
        - "What are best practices for implementing ModelProvider trait with llama.cpp Rust bindings?"
        - "How to properly initialize Vulkan backend in llama.cpp Rust bindings?"
        - "What patterns exist for GPU layer offload control in llama.cpp?"
        - "How to implement streaming text generation with llama.cpp in Rust?"
        - "What are best practices for model lifecycle management (load, unload, cancellation)?"
        - "How to implement multi-instance model management with llama.cpp?"
        - "What parameter presets and tuning profiles work best for llama.cpp?"
        - "How to add benchmarking and performance profiling hooks to generated code?"
        - "What context length and KV-cache budgeting strategies work well?"
      deliverables:
        - "ModelProvider adapter pattern for llama.cpp"
        - "Vulkan backend initialization patterns"
        - "GPU layer offload configuration patterns"
        - "Streaming generation implementation patterns"
        - "Model load/unload lifecycle patterns"
        - "Multi-instance model management patterns"
        - "Parameter presets and profiles"
        - "Benchmark hook integration patterns"
        - "Context length and KV-cache management patterns"
        - "Safe cancellation and resource cleanup patterns"
      sources_to_consider:
        - "llama-cpp-2 crate documentation and examples"
        - "AutoAgents ModelProvider trait documentation"
        - "Vulkan backend configuration for llama.cpp"
        - "GPU memory management patterns in Rust"
        - "Streaming text generation examples"
        - "Rust Drop trait patterns for resource cleanup"
        - "Model management best practices in ML frameworks"
        - "Benchmarking patterns for LLM inference"
      estimated_effort: "8-10 hours"

  research_execution_plan:
    phase_1_schema_and_parser:
      parallel_research:
        - "YAML Schema Design"
        - "Parser & AST Design"
        - "Validation & Linting"
      duration: "2-3 days"
      outputs:
        - "Schema design decision document"
        - "AST/IR specification"
        - "Validation and linting architecture"

    phase_2_codegen_and_layout:
      parallel_research:
        - "Code Generation Patterns"
        - "Project Layout & Packaging"
      duration: "2-3 days"
      outputs:
        - "Code generation pattern recommendation"
        - "Project layout and packaging strategy"

    phase_2_5_llm_integration:
      parallel_research:
        - "ModelProvider & LLM Backend Integration"
      duration: "2-3 days"
      outputs:
        - "llama.cpp ModelProvider adapter specification"
        - "Vulkan backend initialization patterns"
        - "GPU offload and context management patterns"

    phase_3_testing_and_caching:
      parallel_research:
        - "Testing Strategies for Transpilers"
        - "Caching & Performance"
        - "Sandboxing & Security"
      duration: "2-3 days"
      outputs:
        - "Testing framework recommendation"
        - "Caching strategy specification"
        - "Sandboxing security model"

  final_deliverables:
    - "transpiler_research_report.md - Comprehensive research findings"
    - "schema_design.md - Schema specification and evolution strategy"
    - "ast_ir_spec.md - AST and IR data structure specifications"
    - "codegen_patterns.md - Code generation pattern recommendations"
    - "llm_integration_patterns.md - llama.cpp ModelProvider integration patterns"
    - "testing_strategy.md - Testing framework and patterns"
    - "caching_strategy.md - Caching and normalization specification"
    - "security_model.md - Sandbox and security patterns"
    - "research_sources.yml - Complete source citations"

  success_criteria:
    - "All 8 research areas completed with documented findings"
    - "Clear recommendations for each architectural decision"
    - "Evidence-based rationale with source citations"
    - "Cross-referenced with requirements (R0054-R0075, R0036-R0042)"
    - "Transpiler-specific scope (no orchestration/runtime research)"
    - "llama.cpp Vulkan integration fully documented with code generation patterns"
