# Mock Autonomous Workflow

This is a mock autonomous workflow for testing the autonomy system.

```yaml
version: "1.0"
name: "mock_autonomous_workflow"
description: "Mock workflow for testing autonomous execution features"

autonomy_level:
  high:
    checkpoint_interval: 60s

goal:
  type: WorkflowCompletion
  target_workflow: "deploy_production"
  success_criteria:
    - type: DeploymentSuccess
      threshold: 0.95
      operator: above

stop_conditions:
  - type: time
    max_duration: "24h"
  - type: iteration
    max_actions: 1000
  - type: quality
    metric: "success_rate"
    threshold: 0.80
    operator: below
  - type: intervention
    stop_on_any: true
  - type: resource
    budget:
      max_cost_usd: 100
      max_cpu_hours: 10
      max_memory_gb_hours: 20

scope:
  allowed_workflows: ["deploy_production", "test_validation"]
  allowed_actions: ["deploy", "verify", "monitor"]
  forbidden_workflows: ["delete_data", "shutdown"]
  forbidden_actions: ["delete", "destroy", "shutdown"]

confidence_thresholds:
  action_threshold: 0.6
  batch_threshold: 0.7
  loop_threshold: 0.8
  auto_approve_threshold: 0.9

actions:
  - id: "action_001"
    type: "deploy"
    target: "production"
    timeout: 300s

  - id: "action_002"
    type: "verify"
    target: "production"
    timeout: 60s

  - id: "action_003"
    type: "monitor"
    target: "production"
    timeout: 120s
```

## Usage

This mock workflow can be used to:

1. Test contract parsing and validation
2. Test bounded execution enforcement
3. Test stop condition evaluation
4. Test checkpoint generation
5. Test override controls
6. Test intervention tracking
7. Test risk assessment
8. Test confidence computation

## Expected Behavior

- Should execute autonomously with high autonomy level
- Should generate checkpoints every 60 seconds
- Should stop after 24 hours or 1000 actions
- Should stop if success rate drops below 80%
- Should stop on any intervention
- Should respect resource limits
- Should enforce scope boundaries
