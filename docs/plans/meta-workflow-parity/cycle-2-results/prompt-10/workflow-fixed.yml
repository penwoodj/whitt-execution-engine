workflow_id: generated_workflow_parallel_inference_v1
name: "Parallel Inference Request Handling"
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./outputs/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_t1_verify_clone_trait:
      generative_entity: "${models.qwen35}"
      model_overrides:
        max_tokens: 8192
      prompt: |
              Analyze this Rust code for the LlamaHttpClient Clone trait implementation. Verify that the struct definition includes the `#[derive(Clone)]` macro to support parallel cloning. Check both the struct header and immediately following lines to ensure no manual impl blocks exist that would conflict with derive macros.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_http_client
              - "file: src/client/http_client.rs"    step_t1_1_check_derive_attribute:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Verify the exact string presence of `#[derive(Clone)]` immediately after the LlamaHttpClient struct definition. Ensure there are no conflicting manual implementations or other derive macros that might cause ambiguity, though Clone is standard. Confirm the macro is syntactically correct Rust code.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_http_client
              - "file: src/client/http_client.rs"    step_t2_locate_request_definitions:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Locate the ChatCompletionRequest and ChatMessage struct definitions within the codebase, typically in src/client/types.rs. Verify that these structs exist and have fields compatible with JSON serialization (e.g., `messages`, `model_id`). Confirm necessary derive macros like Serialize are present to enable parallel request object creation.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_types
              - "file: src/client/types.rs"    step_t2_1_find_request_struct:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Find the specific definition of the `ChatCompletionRequest` struct. Verify it contains required fields such as `messages` (Vec<ChatMessage>) and `model_id`. Check for the presence of `#[derive(Serialize)]` to ensure JSON serialization works correctly for parallel requests sent via HTTP client.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_types
              - "file: src/client/types.rs"    step_t3_analyze_route_loop:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Analyze the existing `route_to` loop structure around line 1904 in runner.rs. Map the sequential control flow inside the target loop to identify model loading, inference execution, and unloading steps. Document inefficiencies where models are loaded/unloaded per-target sequentially rather than shared for same-model batches.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t4_plan_semaphore_strategy:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Define a resource management strategy using semaphores to prevent oversubscription during concurrent inference requests. Determine the `max_concurrent_limit` constant value based on system constraints and define the scope where semaphore acquire/release should occur within the parallel execution block.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t5_create_send_helper:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Create a new helper method `send_inference_request` in the HTTP client module. This method should encapsulate the logic for sending a single inference request, handling errors gracefully (e.g., returning Result types), and ensuring proper resource cleanup within the function scope if necessary.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_http_client
              - "file: src/client/http_client.rs"    step_t6_add_joinset_import:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Update the module imports at the top of runner.rs to include `tokio::task::JoinSet`. This import is essential for spawning parallel tasks and collecting their results. Ensure the import statement follows existing tokio import conventions in the file header.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t7_implement_detection_logic:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Implement logic before the target loop execution to detect if all targets share the same model. Extract model keys from the target list and compare them to determine if a batch can be formed for parallel execution or if mixed models require sequential fallback.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t8_build_parallel_batch:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Build a parallel request batch using `JoinSet` for the case where all targets share the same model. Spawn tasks into the JoinSet, passing necessary context (cloned client, semaphore guard, target indices) to each task. Ensure the loop structure correctly iterates over the subset of targets sharing the model.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t9_collect_ordered_responses:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Collect ordered responses from the `JoinSet` while preserving the original target indices. Use `join()` to wait for all tasks, then sort or map the results back to their corresponding indices in the original target list to maintain sequential order for subsequent processing steps.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t10_implement_hook_processing:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Implement sequential hook processing after parallel inference completes. Apply hooks to the collected and ordered responses, format them appropriately, and ensure any necessary state updates occur in a controlled manner following the completion of the JoinSet drain operation.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t11_move_unload_outside_loop:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Move the model unload operation outside the target loop for the same-model path. Execute the unload logic exactly once after the JoinSet drain completes, rather than unloading per-target inside the loop. This prevents race conditions and redundant work when processing a batch of requests for the same model.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t12_preserve_sequential_fallback:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Preserve existing sequential fallback logic for mixed-model cases. Ensure that when the detection logic determines models differ, the original sequential loop structure is maintained without modification to its internal flow, guaranteeing backward compatibility and correct execution for non-batchable requests.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t13_add_parallel_logging:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Add parallel inference logging statements to the new parallel paths. Include logs for model loading events, task spawning counts, completion stats, and potential bottlenecks. Ensure these logs provide visibility into load events without altering data flow logic or performance characteristics significantly.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_runner
              - "file: src/runner.rs"    step_t14_integration_test_same_model:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Write an integration test that verifies concurrent execution for a scenario with 3 same-model targets. The test should instantiate the runner, provide three requests targeting the same model, and assert that parallel execution occurs (e.g., by checking timing or using tracing assertions) compared to sequential baseline behavior.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_parallel_inference
              - "file: tests/integration/parallel_inference.rs"    step_t15_verify_benchmark_performance:
              generative_entity: "${models.qwen35}"
              model_overrides:
              max_tokens: 8192
      prompt: |
              Verify parallel inference performance improvement in the benchmark suite. Run benchmarks comparing sequential vs parallel execution paths, specifically measuring latency reduction and throughput increase when processing same-model batches using the new JoinSet implementation. Ensure metrics are logged correctly for analysis.
              when:
              after_step_succeeds:
              - save_to:
              - bookmark_parallel_inference
              - "file: benches/parallel_inference.rs"                description: "Benchmark results showing parallel inference performance improvement"