    step_t9_1_read_hook_interface:
      generative_entity: "${models.qwen35}"
      prompt: |
              Inspect `src/hooks.rs` (or equivalent) to understand the `HookEngine` interface. Identify required methods for processing inference results sequentially. Define contract for the new loop.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Read HookEngine interface requirements."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t9_2_execute_sequential_iteration:
      generative_entity: "${models.qwen35}"
      prompt: |
              Implement the final sequential loop in `src/benchmark/runner.rs`. Apply hook logic to each collected result. Ensure proper error handling and state updates after each hook execution.
      model_overrides:
        max_tokens: 8192
      log_hooks:
