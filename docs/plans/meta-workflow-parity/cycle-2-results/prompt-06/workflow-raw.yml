workflow_id: generated_workflow_benchmark_parallel_inference
name: "BenchmarkRunner Parallel Inference Workflow"version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./outputs/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    step_t1_verify_clone_impl:
      generative_entity: "${models.qwen35}"
      prompt: |
              Analyze this Rust file content to verify the Clone trait implementation for LlamaHttpClient. Check for `#[derive(Clone)]` or manual `impl Clone`. Verify field compatibility if manual.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Verified Clone impl present on LlamaHttpClient."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_http_client
              - "./outputs/http_client.rs"
    step_t1_1_check_derive_macro:
      generative_entity: "${models.qwen35}"
      prompt: |
              Inspect the header of `src/client/http_client.rs` for the struct definition. Confirm presence of `#[derive(Clone)]`. Report line number if found, or "missing".
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Checked derive macro status."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_http_client
              - "./outputs/http_client.rs"
    step_t1_2_check_trait_bounds:
      generative_entity: "${models.qwen35}"
      prompt: |
              If `#[derive(Clone)]` is missing, check the struct fields in `src/client/http_client.rs`. Ensure all fields implement Clone. If any field does not, suggest a manual impl or type change.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Validated trait bounds for Clone."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_http_client
              - "./outputs/http_client.rs"
    step_t2_locate_request_definitions:
      generative_entity: "${models.qwen35}"
      prompt: |
              Search the source tree (specifically `src/client/types.rs` or similar) to locate struct definitions for `ChatCompletionRequest` and `ChatMessage`. Return exact file paths and import statements needed in `runner.rs`.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Located ChatCompletionRequest and ChatMessage."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_types
              - "./outputs/types.rs"
    step_t2_1_identify_request_types:
      generative_entity: "${models.qwen35}"
      prompt: |
              Confirm accessibility of `ChatCompletionRequest` fields. Verify import paths are correct for instantiation in the benchmark context. Run mental `cargo check` simulation on these types.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Identified request types and verified imports."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_types
              - "./outputs/types.rs"
    step_t3_analyze_route_to_logic:
      generative_entity: "${models.qwen35}"
      prompt: |
              Analyze `src/benchmark/runner.rs` lines 1903-1947. Map the current execution flow for multi-target route_to. Identify where model loading, inference, and unloading happen sequentially versus in parallel. Highlight bottlenecks.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Mapped sequential flow and identified bottlenecks."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t3_1_map_sequential_flow:
      generative_entity: "${models.qwen35}"
      prompt: |
              Extract the linear execution path from lines 1903-1947 of `src/benchmark/runner.rs`. List steps in order (e.g., Load Model -> Infer Target A -> Unload). Explicitly mark sequential dependencies.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Mapped explicit sequential operations."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t3_2_identify_parallel_boundaries:
      generative_entity: "${models.qwen35}"
      prompt: |
              Identify points in lines 1903-1947 of `src/benchmark/runner.rs` where execution could diverge into concurrent tasks. Mark start and end boundaries for potential parallelization blocks.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Identified parallelization boundaries."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t4_add_joinset_import:
      generative_entity: "${models.qwen35}"
      prompt: |
        Modify `src/benchmark/runner.rs` header. Insert `use tokio::task::JoinSet;` into the imports section if not present. Ensure formatting matches existing style.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Added tokio::task::JoinSet import."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t4_1_insert_import:
      generative_entity: "${models.qwen35}"
      prompt: |
        Execute the text insertion of `use tokio::task::JoinSet;` into `src/benchmark/runner.rs`. Verify no syntax errors introduced in the imports block.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Inserted import successfully."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t5_create_send_inference_request:
      generative_entity: "${models.qwen35}"
      prompt: |
              Create a new helper method `send_inference_request` in the `BenchmarkRunner` impl block of `src/benchmark/runner.rs`. This method should take a client, request, and semaphore, clone the client, load model if needed (via closure or shared state), execute chat_completion, and return the response.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Created send_inference_request helper."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t5_1_read_types_imports:
      generative_entity: "${models.qwen35}"
      prompt: |
              Read `src/benchmark/runner.rs` to gather necessary types (Client, ChatCompletionRequest) and imports for the new `send_inference_request` method. List required dependencies.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Read types and client imports."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t5_2_execute_helper_impl:
      generative_entity: "${models.qwen35}"
      prompt: |
              Generate the code block for `send_inference_request`. Ensure it handles async logic correctly, clones the client safely, and awaits the HTTP call. Integrate with existing model loading patterns if applicable.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Executed helper implementation."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t6_add_same_model_detection:
      generative_entity: "${models.qwen35}"
      prompt: |
              Add a loop before target execution in `src/benchmark/runner.rs` to detect if multiple targets use the same model. Extract model keys, check for duplicates, and flag the "same-model" status.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Added same-model detection loop."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t6_1_extract_model_keys:
      generative_entity: "${models.qwen35}"
      prompt: |
              Process the target list in `src/benchmark/runner.rs` to isolate specific model identifiers (keys). Transform raw list into a structured set of unique keys.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Extracted model keys."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t6_2_flag_same_model_status:
      generative_entity: "${models.qwen35}"
      prompt: |
              Compute a boolean flag based on extracted model keys. Determine if all targets share the same model. Update execution plan state accordingly.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Flagged same-model status."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t7_build_parallel_batch:
      generative_entity: "${models.qwen35}"
      prompt: |
              If same-model case is flagged, build a parallel request batch using `JoinSet` in `src/benchmark/runner.rs`. Clone the client once. Load model outside loop if needed. Setup semaphore. Spawn tasks for all targets concurrently.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Built parallel request batch."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t7_1_read_client_cloning:
      generative_entity: "${models.qwen35}"
      prompt: |
              Analyze `src/benchmark/runner.rs` to determine how the client is currently shared. Verify if cloning (`client.clone()`) is safe and required for parallel tasks in the JoinSet loop.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Read client cloning requirements."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t7_2_execute_model_setup:
      generative_entity: "${models.qwen35}"
      prompt: |
              Prepare infrastructure for parallel execution in `src/benchmark/runner.rs`. Initialize the semaphore and ensure model loading logic is ready to be shared or loaded once before task spawning.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Executed model loading and semaphore setup."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t7_3_execute_task_spawning:
      generative_entity: "${models.qwen35}"
      prompt: |
              Iterate over the target list in `src/benchmark/runner.rs`. For each target, create an async task that calls `send_inference_request` (or equivalent logic). Add to `JoinSet`. Handle model loading within task closure if not global.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Executed task spawning loop."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t8_collect_ordered_responses:
      generative_entity: "${models.qwen35}"
      prompt: |
              Implement logic in `src/benchmark/runner.rs` to collect responses from the `JoinSet`. Use `join_next()` or similar. Sort results by original target index to preserve order before processing hooks.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Collected ordered responses."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t8_1_read_join_logic:
      generative_entity: "${models.qwen35}"
      prompt: |
              Analyze existing async handling patterns in `src/benchmark/runner.rs`. Identify how results are currently awaited or processed to inform the new JoinSet collection logic.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Read join_next iteration logic."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t8_2_execute_result_collection:
      generative_entity: "${models.qwen35}"
      prompt: |
              Implement the sorting and indexing logic for `JoinSet` results in `src/benchmark/runner.rs`. Map completed futures back to their original target indices. Return an ordered vector of results.
      model_overrides:
        max_tokens: 8192
      log_hooks:
        - "Executed result collection and sorting."

      when:
        after_step_succeeds:
          - save_to:
              - bookmark_runner
              - "./outputs/runner.rs"
    step_t9_implement_sequential_hook_loop:
      generative_entity: "${models.qwen35}"
      prompt: |
              Add a sequential loop in `src/benchmark/runner.rs` after parallel collection. Iterate over the ordered results from T8. Call `HookEngine.process()` (or equivalent) for each result sequentially to maintain hook order.
      model_overrides:
        max_tokens: 8192
      log_hooks:
