workflow_id: generated_workflow_qwen35_verify_rust_client
name: Qwen3-5-9B Rust Client Verification Workflow
version: 1.0.0
schema_version: 2.0.0
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
models:
  qwen35:
    name: Qwen3-5-9B-Q4_K_M.gguf
    host:
      type: llama_cpp_with_vulkan
workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false
agentic_workflow:
  when:
    after_workflow:
    - log:
        to_file_path: ./outputs/workflow.log
        event_fields:
        - workflow_id
        - total_steps
        - succeeded
        - failed
        level: info
  steps:
    step_t1_verify_clone_trait:
      generative_entity: ${models.qwen35}
      prompt: '{{bookmarks.shell_output.stdout}}

        Analyze this Rust file content (LANGUAGE: Rust):

        # Agentic Categorization


        **Source document:** # Desired Output State


        **Total tasks categorized:** 20

        **Evaluation verdict:** PASS


        ---


        ## Category Summary


        | Category | Count | Avg Iteration Budget |

        |----------|-------|---------------------|

        | DATA_TRANSFORMER | 19 | 1.0 |

        | CONDITIONAL_ROUTER | 1 | 1.5 |


        ---


        ## T7 - Implement same-model detection logic


        **Primary category:** DATA_TRANSFORMER

        **Reasoning:** This task verifies the computation of a flag (`same_all_model`) based on model identifiers. It consumes
        the source code state to confirm that comparison logic exists and correctly computes the boolean flag before parallel
        batching, outputting verification results.

        **Fit:** Implement same-model detection logic in src/runner.rs.

        **Substructure hint:** "single LLM step with save_to + log hooks"

        **Inputs:** File path `"src/runner.rs"`, variable name `same_all_model`

        **Outputs:** Verification status, code snippet extraction

        **Evaluation scope:** Single-step check (grep for same_all_model)

        **Iteration budget:** 1


        Verify that the file contains logic computing a boolean flag named `same_all_model` based on model identifier comparisons.
        Output "VERIFIED" if found or "MISSING: same_all_model computation not found".

        model_overrides:

        max_tokens: 8192

        temperature: 0.2

        when:

        before_step_starts:

        - shell:

        command: "cat"

        args: ["src/runner.rs"]

        working_dir: "."

        fail_on_error: true

        after_step_succeeds:

        - save_to:

        - t7_same_model_status

        - "./outputs/t7_same_model.txt"

        - log:

        to_file_path: "./outputs/logs/t7_same_model.log"

        event_fields: [step_name, duration_ms, total_tokens]

        level: info'
      when:
        before_step_starts:
        - shell:
            command: cat
            args:
            - src/runner.rs
