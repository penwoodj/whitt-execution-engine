workflow_id: generated_workflow_llama_client_with_vulkan_01
name: "llama_client_with_vulkan"
description: "Llama client with vulkan integration for model inference"
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  qwen35:
    name: "Qwen3-5-9B-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./outputs/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    # CHUNK 1 COMPLETE: 5 steps emitted
    step_t1_read_http_client_patterns:
      generative_entity: "${models.qwen35}"
      prompt: |
        Read the file at src/client/http_client.rs to inspect existing LlamaHttpClient patterns. Verify that methods like build, stream_response, and handle_error are defined with correct signatures. Output a verification report confirming architectural compliance without modifying source code.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "http_client_patterns_verified"
              - "./outputs/http_client_patterns.json"
          - log:
              to_file_path: "./logs/step_t1_read_http_client_patterns.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_t2_read_types_structures:
      generative_entity: "${models.qwen35}"
      prompt: |
        Read the file at src/client/types.rs to validate the presence of required struct fields like model_id, request_payload, and response_data. Confirm that all necessary types are exported publicly with correct visibility modifiers. Output a verification report confirming data contract compliance without modifying source logic.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "types_structures_verified"
              - "./outputs/types_structures.json"
          - log:
              to_file_path: "./logs/step_t2_read_types_structures.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_t3_read_prompt_chain_patterns:
      generative_entity: "${models.qwen35}"
      prompt: |
        Read the file at src/client/prompt_chain.rs to inspect its sequential processing logic including multi-step patterns like download, load, chat, and unload methods. Verify that all required method signatures are defined with correct implementations for downstream integration without modifying source code.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "prompt_chain_patterns_verified"
              - "./outputs/prompt_chain_patterns.json"
          - log:
              to_file_path: "./logs/step_t3_read_prompt_chain_patterns.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_t4_read_mod_structure:
      generative_entity: "${models.qwen35}"
      prompt: |
        Read the file at src/client/mod.rs to validate export visibility using pub use statements and dependency declarations. Confirm that all necessary modules are properly exported with correct visibility modifiers for safe integration of new functionality without modifying core logic.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "mod_structure_verified"
              - "./outputs/mod_structure.json"
          - log:
              to_file_path: "./logs/step_t4_read_mod_structure.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_t5_create_model_download_function:
      generative_entity: "${models.qwen35}"
      prompt: |
        Create a new file src/client/model_download.rs implementing the async function download_model_from_hf. Read patterns from step_t1_read_http_client_patterns.output and step_t4_mod_structure.output to ensure consistent client initialization and error handling. Write complete implementation including streaming response handling and model metadata extraction to ./outputs/model_download.rs.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "model_download_function_created"
              - "./outputs/model_download.rs"
          - log:
              to_file_path: "./logs/step_t5_create_model_download_function.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    # CHUNK 2 COMPLETE: 5 steps emitted
    step_t6_add_model_download_export:
      generative_entity: "${models.qwen35}"
      prompt: |
        Update src/client/mod.rs by adding a pub use statement for model_download module following existing export patterns from step_t4_mod_structure.output. Ensure the new export is placed correctly in alphabetical order and maintains consistent visibility modifiers with other modules. Output updated mod.rs file to ./outputs/mod.rs with verified export inclusion.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "model_download_export_added"
              - "./outputs/mod.rs"
          - log:
              to_file_path: "./logs/step_t6_add_model_download_export.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_t7_update_cargo_binary_entry:
      generative_entity: "${models.qwen35}"
      prompt: |
        Update Cargo.toml by adding a [[bin]] section entry for model_chain binary following existing patterns from step_t4_mod_structure.output. Ensure the binary name, path to main.rs file, and required dependencies are correctly specified with proper formatting. Output updated Cargo.toml file to ./outputs/Cargo.toml with verified binary target inclusion.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "cargo_binary_entry_updated"
              - "./outputs/Cargo.toml"
          - log:
              to_file_path: "./logs/step_t7_update_cargo_binary_entry.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_t8_create_step_structs:
      generative_entity: "${models.qwen35}"
      prompt: |
        Create a new file src/client/model_chain.rs implementing StepConfig struct for step configuration and StepResult struct for step results. Read patterns from step_t2_read_types_structures.output to ensure consistent field types and export visibility. Write complete implementations including all required fields with proper serde annotations to ./outputs/model_chain.rs.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "step_structs_created"
              - "./outputs/model_chain.rs"
          - log:
              to_file_path: "./logs/step_t8_create_step_structs.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_t9_implement_main_function:
      generative_entity: "${models.qwen35}"
      prompt: |
        Create or update src/main.rs implementing the main function with tracing initialization using step_t1_read_http_client_patterns.output patterns, client creation from step_t4_mod_structure.output, and step execution sequence definition. Include server health check logic and proper error handling following existing patterns. Write complete implementation to ./outputs/main.rs with verified entry point functionality.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "main_function_implemented"
              - "./outputs/main.rs"
          - log:
              to_file_path: "./logs/step_t9_implement_main_function.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_t10_implement_planner_step:
      generative_entity: "${models.qwen35}"
      prompt: |
        Implement planner step lifecycle logic in model_chain.rs. Execute download/load/chat/unload sequence using functions from step_t5_create_model_download_function.output and step_t3_read_prompt_chain_patterns.output. Handle retry and logging for errors during execution. Ensure StepConfig is used for state management.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "planner_step_implemented"
              - "./outputs/model_chain_planner.rs"
          - log:
              to_file_path: "./logs/step_t10_implement_planner_step.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    # CHUNK 3 COMPLETE: 3 steps emitted
    step_t11_implement_implementer_step:
      generative_entity: "${models.qwen35}"
      prompt: |
        Implement implementer step lifecycle logic in model_chain.rs. Execute download/load/chat/unload sequence using functions from step_t5_create_model_download_function.output and step_t3_read_prompt_chain_patterns.output. Pass previous output as input to the next step. Handle retry and logging for errors during execution. Ensure StepConfig is used for state management.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "implementer_step_implemented"
              - "./outputs/model_chain_implementer.rs"
          - log:
              to_file_path: "./logs/step_t11_implement_implementer_step.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

    step_t12_implement_summarizer_step:
      generative_entity: "${models.qwen35}"
      prompt: |
        Implement summarizer step lifecycle logic in model_chain.rs including conditional download. Execute conditional download/load/chat/unload sequence using functions from step_t5_create_model_download_function.output and step_t3_read_prompt_chain_patterns.output. Handle retry and logging for errors during execution. Ensure StepConfig is used for state management.
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
          - save_to:
              - "summarizer_step_implemented"
              - "./outputs/model_chain_summarizer.rs"
          - log:
              to_file_path: "./logs/step_t12_implement_summarizer_step.log"
              event_fields: [step_name, duration_ms, total_tokens]
              level: info

