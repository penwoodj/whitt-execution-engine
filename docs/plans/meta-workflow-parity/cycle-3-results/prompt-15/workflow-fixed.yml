        before_step_starts:
        - shell:
            command: bash
            args:
            - -c
            - head -n 250 src/benchmark/runner.rs
    step_t12_add_true_parallel_inference:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Integrate all refactored components from steps T1-T11 in src/benchmark/runner.rs to enable full parallel execution
        for same-model multi-target route_to. Verify JoinSet drain completes and result mapping accuracy before finalizing
        the parallelized inference route. Save complete integration block to ./outputs/t12_parallel_inference.json with end-to-end
        verification status. Log changes to ./logs/t12_add_true_parallel_inference.log.

        '
      model_overrides:
        max_tokens: 5120
