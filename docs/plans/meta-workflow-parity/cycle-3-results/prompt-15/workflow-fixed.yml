            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: bash
            args:
            - -c
            - head -n 250 src/benchmark/runner.rs
    step_t11_preserve_fallback_path:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Add a conditional check in src/benchmark/runner.rs to detect if model sharing is possible before enabling parallel
        execution. Preserve sequential loop logic for mixed-model cases where models cannot be shared across targets. Save
        updated branching logic to ./outputs/t11_fallback_path.json with condition implementation details. Log changes to
        ./logs/t11_preserve_fallback_path.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t11_fallback_path.json
          - ./outputs/t11_report.txt
        - log:
            to_file_path: ./logs/t11_preserve_fallback_path.log
            event_fields:
