workflow_id: generated_workflow_<unique>
name: Parallel Inference Request Batch
description: Batch parallel inference requests using JoinSet with ordered result collection
version: 1.0.0
schema_version: 2.0.0
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
models:
  qwen35:
    name: Qwen3-5-9B-Q4_K_M.gguf
    host:
      type: llama_cpp_with_vulkan
workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false
agentic_workflow:
  when:
    after_workflow:
    - log:
        to_file_path: ./outputs/workflow.log
        event_fields:
        - workflow_id
        - total_steps
        - succeeded
        - failed
        level: info
  steps:
    step_t1_verify_clone_trait:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/client/http_client.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Read the source file at src/client/http_client.rs and verify if the LlamaHttpClient struct has #[derive(Clone)] macro
        and implements required traits. Check Cargo.toml for tokio dependencies. Output a verification report to ./outputs/t1_verification.json
        with status PASS or FAIL. Log findings to ./logs/t1_verify_clone_trait.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t1_verification.json
          - ./outputs/t1_report.txt
        - log:
            to_file_path: ./logs/t1_verify_clone_trait.log
            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: cat
            args:
            - src/client/http_client.rs
    step_t2_identify_request_imports:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/client/types.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Inspect src/client/types.rs to confirm ChatCompletionRequest and ChatMessage structs exist with fields prompt, max_tokens,
        temperature. Verify imports in runner.rs reference these types correctly. Write verification results to ./outputs/t2_import_check.json
        including field presence status. Log details to ./logs/t2_identify_request_imports.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t2_import_check.json
          - ./outputs/t2_report.txt
        - log:
            to_file_path: ./logs/t2_identify_request_imports.log
            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: cat
            args:
            - src/client/types.rs
    step_t3_analyze_route_logic:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Trace lines ~1903-1947 of src/benchmark/runner.rs to understand the sequential multi-target handling loop. Identify
        state variables like step_ids and model references used within the loop. Document the execution path in ./outputs/t3_flow_analysis.json
        with identified scoping issues. Log analysis results to ./logs/t3_analyze_route_logic.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t3_flow_analysis.json
          - ./outputs/t3_report.txt
        - log:
            to_file_path: ./logs/t3_analyze_route_logic.log
            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: bash
            args:
            - -c
            - sed -n '1883,1967p' src/benchmark/runner.rs
    step_t4_add_joinset_import:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Edit the header section of src/benchmark/runner.rs to add use tokio::task::JoinSet; import statement. Verify no duplicate
        imports exist and syntax is correct. Save updated file content to ./outputs/t4_updated_header.json with diff summary.
        Log modification details to ./logs/t4_add_joinset_import.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t4_updated_header.json
          - ./outputs/t4_report.txt
        - log:
            to_file_path: ./logs/t4_add_joinset_import.log
            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: bash
            args:
            - -c
            - head -n 250 src/benchmark/runner.rs
    step_t5_create_send_helper:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Define an async fn send_inference_request in src/benchmark/runner.rs that takes model, request params, and semaphore
        as arguments. Implement semaphore guard and build ChatCompletionRequest struct inside the function. Update caller
        site to use this new helper instead of inline logic. Save refactored code block to ./outputs/t5_helper_definition.json
        with function signature. Log changes to ./logs/t5_create_send_helper.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t5_helper_definition.json
          - ./outputs/t5_report.txt
        - log:
            to_file_path: ./logs/t5_create_send_helper.log
            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: bash
            args:
            - -c
            - head -n 250 src/benchmark/runner.rs
    step_t6_refactor_model_loading:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Move the load_model call before the parallel execution loop in src/benchmark/runner.rs so it loads once for all targets.
        Verify scope of loaded model is accessible within JoinSet spawned tasks. Save refactored code block to ./outputs/t6_loading_refactor.json
        with pre-loop initialization marker. Log changes to ./logs/t6_refactor_model_loading.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t6_loading_refactor.json
          - ./outputs/t6_report.txt
        - log:
            to_file_path: ./logs/t6_refactor_model_loading.log
            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: bash
            args:
            - -c
            - head -n 250 src/benchmark/runner.rs
    step_t7_build_parallel_batch:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Extract inference parameters per target from step_ids vector in src/benchmark/runner.rs loop body. Spawn async move
        blocks for each target using send_inference_request helper and collect handles into JoinSet. Save parallel execution
        block to ./outputs/t7_parallel_block.json with JoinSet initialization code. Log changes to ./logs/t7_build_parallel_batch.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t7_parallel_block.json
          - ./outputs/t7_report.txt
        - log:
            to_file_path: ./logs/t7_build_parallel_batch.log
            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: bash
            args:
            - -c
            - head -n 250 src/benchmark/runner.rs
    step_t8_implement_ordered_collection:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Drain the JoinSet handles in src/benchmark/runner.rs after parallel execution completes. Sort results by original
        step_ids index using a mapping vector created during task spawning. Save sorted collection logic to ./outputs/t8_ordered_collection.json
        with sorting implementation details. Log changes to ./logs/t8_implement_ordered_collection.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t8_ordered_collection.json
          - ./outputs/t8_report.txt
        - log:
            to_file_path: ./logs/t8_implement_ordered_collection.log
            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: bash
            args:
            - -c
            - head -n 250 src/benchmark/runner.rs
    step_t9_reconstruct_step_outputs:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Map the sorted inference results from JoinSet drain to original step_ids in src/benchmark/runner.rs. Extract text
        content from each response and rebuild step_outputs vector with actual response texts in correct order. Save reconstructed
        output structure to ./outputs/t9_step_outputs.json with mapping logic details. Log changes to ./logs/t9_reconstruct_step_outputs.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t9_step_outputs.json
          - ./outputs/t9_report.txt
        - log:
            to_file_path: ./logs/t9_reconstruct_step_outputs.log
            event_fields:
            - step_name
            - duration_ms
            - total_tokens
            level: info
        before_step_starts:
        - shell:
            command: bash
            args:
            - -c
            - head -n 250 src/benchmark/runner.rs
    step_t10_move_unload_logic:
      generative_entity: ${models.qwen35}
      prompt: 'File content of src/benchmark/runner.rs:

        ```

        {{bookmarks.shell_output.stdout}}

        ```


        Move the unload_model call in src/benchmark/runner.rs to execute after JoinSet drain and result collection complete.
        Verify scope ensures model is unloaded only once when all parallel tasks finish. Save refactored cleanup block to
        ./outputs/t10_unload_refactor.json with post-loop unloading marker. Log changes to ./logs/t10_move_unload_logic.log.

        '
      model_overrides:
        max_tokens: 5120
        temperature: 0.2
      when:
        after_step_succeeds:
        - save_to:
          - ./outputs/t10_unload_refactor.json
