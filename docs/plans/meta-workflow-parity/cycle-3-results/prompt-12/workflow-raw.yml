```yaml
workflow_id: generated_workflow_10step
name: "Data Transformer Workflow"
description: "Read source files requests.lr and integration.lr (DATA_TRANSFORMER)"
version: "1.0.0"
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "qwen35":
    name: "Qwen3-5-9B-Q4_K_M.gguf"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: false

agentic_workflow:
  when:
    after_workflow:
      - log:
          to_file_path: "./outputs/workflow.log"
          event_fields: [workflow_id, total_steps, succeeded, failed]
          level: info

  steps:
    - step_t1_read_sources:
        generative_entity: "${models.qwen35}"
        prompt: |
          Access the file system to read 'requests.lr' and 'integration.lr'. Parse these files to identify all operator definitions, type mappings, and expression structures without modification. Store the resulting data in memory as 'operators_map', 'types_map', and 'expression_context'. Ensure no data is lost or altered during this initial ingestion phase.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - operators_map
                - "./outputs/operators_map.json"
                - types_map
                - "./outputs/types_map.json"
                - expression_context
                - "./outputs/expression_context.json"
            - log:
                to_file_path: "./logs/step_t1_read_sources.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t1_1_identify_operators:
        generative_entity: "${models.qwen35}"
        prompt: |
          Re-read 'requests.lr' and 'integration.lr' focusing exclusively on extracting operator definitions, type mappings, and expression structures. Verify that every line containing an operator is captured in the output maps. Ensure the extracted data remains unmodified from the source files to maintain fidelity for downstream processing steps.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - operators_map
                - "./outputs/operators_map_v2.json"
                - types_map
                - "./outputs/types_map_v2.json"
            - log:
                to_file_path: "./logs/step_t1_1_identify_operators.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t2_align_lr_js:
        generative_entity: "${models.qwen35}"
        prompt: |
          Take the list of lines from 'requests.lr' and 'integration.lr' and align them with their corresponding '.js' counterparts. Extract exact translation semantics for each pair, noting how operators map between the two syntaxes. Create an alignment map that links every .lr line to its specific .js equivalent without skipping any entries or introducing errors in the mapping logic.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - alignment_map
                - "./outputs/alignment_map.json"
                - translation_semantics
                - "./outputs/translation_semantics.json"
            - log:
                to_file_path: "./logs/step_t2_align_lr_js.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t3_document_type_rules:
        generative_entity: "${models.qwen35}"
        prompt: |
          Use the 'operators_map' and 'types_map' from previous steps to document basic type semantic rules. Define how Operator, Map, List, String, Boolean, Number, and Undefined types behave within this system. Ensure all specified types are documented with their core properties and relationships clearly defined in a structured rule-based format for easy reference by downstream tasks.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - basic_type_rules
                - "./outputs/basic_type_rules.json"
            - log:
                to_file_path: "./logs/step_t3_document_type_rules.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t4_define_collection_types:
        generative_entity: "${models.qwen35}"
        prompt: |
          Analyze the 'types_map' from previous steps to define collection iteration and reference types specifically for Maps, Lists, and Strings. Detail how these collections function as iterable references within the system without modifying the underlying data flow logic. Output a structured specification of iteration mechanics that explains how each collection type is traversed and referenced in expressions.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - collection_iteration_specs
                - "./outputs/collection_iteration_specs.json"
            - log:
                to_file_path: "./logs/step_t4_define_collection_types.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t5_classify_types:
        generative_entity: "${models.qwen35}"
        prompt: |
          Use the 'types_map' from previous steps to distinguish primitive vs reference types. Explicitly classify booleans, numbers, and undefined as primitives, while categorizing collections (Maps, Lists, Strings) and Operators as reference types. Generate a typed hierarchy map that clearly separates these categories based on source truth for use in execution flow modeling.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - type_hierarchy_map
                - "./outputs/type_hierarchy_map.json"
            - log:
                to_file_path: "./logs/step_t5_classify_types.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t6_document_execution_model:
        generative_entity: "${models.qwen35}"
        prompt: |
          Use the 'operators_map' from previous steps to document the left-hungry curried execution model. Explain how operators evaluate on each item, consuming a left argument and passing control to the next right item in the expression chain (e.g., "data leftInputOperator"). Create a structured execution graph or state transition rules that represent this direct mapping of logic to structural representation for downstream tasks.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - execution_flow_model
                - "./outputs/execution_flow_model.json"
            - log:
                to_file_path: "./logs/step_t6_document_execution_model.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t7_define_diatic_operators:
        generative_entity: "${models.qwen35}"
        prompt: |
          Use the 'operators_map' and 'execution_flow_model' from previous steps to define diatic operator mechanics for chains. Specifically detail how operators like '@' handle left/right inputs within sequences, extracting mechanical rules for chain processing. Output a structured logic map that explains how these operators operate on items to their left and right within an expression sequence.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - diatic_operator_specs
                - "./outputs/diatic_operator_specs.json"
            - log:
                to_file_path: "./logs/step_t7_define_diatic_operators.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t8_parse_response_body_json:
        generative_entity: "${models.qwen35}"
        prompt: |
          Use the 'operators_map', 'type_hierarchy_map', and 'diatic_operator_specs' from previous steps to parse response@`body`/json expression semantics. Detail how accessing map keys, casting to JSON, and handling string collections works for these expressions. Create a structured semantic graph that maps key access, type casting rules, and collection handling specifically for the response@ body/json pattern.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - expression_semantics_graph
                - "./outputs/expression_semantics_graph.json"
            - log:
                to_file_path: "./logs/step_t8_parse_response_body_json.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t9_document_prefix_operators:
        generative_entity: "${models.qwen35}"
        prompt: |
          Use the 'operators_map', 'type_hierarchy_map', and 'diatic_operator_specs' from previous steps to document prefix operators ($/@/? prefixes). List all iteration, get, and boolean conversion operators with their specific left/right argument behaviors for these symbols. Create a structured lookup table of operator behaviors that maintains the input-to-state transformation pattern for prefix operations.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - prefix_operator_table
                - "./outputs/prefix_operator_table.json"
            - log:
                to_file_path: "./logs/step_t9_document_prefix_operators.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

    - step_t10_extract_arithmetic_logical:
        generative_entity: "${models.qwen35}"
        prompt: |
          Use the 'operators_map' from previous steps to extract arithmetic/logical operator definitions. Identify all specific arithmetic and logical operators present in the source files and organize them into a dedicated definition structure. Ensure that all arithmetic and logical operators are extracted accurately into the output definitions for final system documentation.
        model_overrides:
          max_tokens: 8192
          temperature: 0.2
        when:
          after_step_succeeds:
            - save_to:
                - arithmetic_logical_defs
                - "./outputs/arithmetic_logical_defs.json"
            - log:
                to_file_path: "./logs/step_t10_extract_arithmetic_logical.log"
                event_fields: [step_name, duration_ms, total_tokens]
                level: info

