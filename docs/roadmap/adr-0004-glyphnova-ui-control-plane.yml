---
adr_id: ADR-0004
title: Glyphnova desktop UI and multi-zoom control plane
status: Accepted
date: 2026-03-06

context: The roadmap explicitly delays richer UI until after useful CLI results exist. When the UI arrives it must expose the same runtime abstractions rather than inventing a separate system.

decision:
  Build Glyphnova UI as a shell over the existing runtime and queue control plane:
    - Desktop shell uses a Rust backend and a web frontend
    - Queue visualization reflects the persistent scheduler states rather than a separate UI-only model
    - Scope visibility is always present and context switches require explicit user acknowledgment
    - Navigation supports multiple abstraction levels
    - Drag-and-drop reprioritization is a UI projection of the same scheduler priority APIs used by the CLI

scope:
  included:
    - desktop shell architecture
    - queue views and live execution meaning
    - scope indicators and context switch safety
    - artifact browsers and search interfaces
    - summary and graph navigation
    - drag-and-drop reprioritization as scheduler control
    - shared backend API boundary
  excluded:
    - changes to core scheduler semantics
    - first implementation of web scraping or memory
    - deep autonomy logic

consequences:
  positive:
    - no divergence between CLI and UI
    - future observability and graph features become natural
    - UI remains honest to runtime state
  negative:
    - UI delivery waits on backend readiness
    - graph navigation increases data-model complexity

schema_reference:
  unified-workflow-schema:
    path: ../requirements/unifying-schema/unified-workflow-schema.yml
    purpose: Defines UI control plane integration with WorkflowSpec

follow_on_adrs:
  - ADR-0002 for queue and scheduler state visualization
  - ADR-0003 for backend API boundary

supported_by_research_plan:
  - research-plan-03-networking-ui-backends

related_requirements:
  - R05: CLI/TUI-first path then richer desktop UI
  - R08: Left-side chat/work queue with titles and live execution meaning
  - R10: Multi-zoom navigation
  - R11: Visible scope and explicit context-switch confirmation

validation_focus_v0_1_0:
  - Desktop shell exposes runtime queue state correctly
  - Queue visualization reflects scheduler states not a separate model
  - Scope indicators prevent context confusion
  - Drag-and-drop operations call the same scheduler priority APIs
  - Navigation provides multiple abstraction levels for workflows
  - Shared backend API boundary prevents duplication

validation_focus_v1_0_and_later:
  - Graph and summary views scale for complex workflows
  - Artifact browsers support workflow inspection and version comparison
  - Search and filtering capabilities enable workflow discovery
  - Drag-and-drop improves operator efficiency without breaking scheduler logic
