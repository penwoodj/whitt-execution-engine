key_findings:
  foundation:
    - Schema technology: JSON Schema Draft 2020-12 with schemars is recommended for Rust type generation
    - IR design: WorkflowIR should support deterministic compilation, optimization, and replayability
    - Local storage: ./workspace/ directory structure provides artifact provenance and reproducibility
    - ADR governance: Lightweight ADR structure with status tracking is sufficient

  mvp_queue_scheduler:
    - Scheduler patterns: Rust runtime with tokio provides async scheduling
    - State machine: Explicit lifecycle states (enqueued, running, paused, completed, failed, cancelled)
    - Human gating: Confirmation checkpoints with risk assessment required for destructive operations
    - CLI patterns: Command surface should support enqueue, cancel, reprioritize, resume operations
    - Staged diffs: Preview-before-apply with diff generation for file mutations

  backends_networking:
    - Provider abstraction: ModelProvider trait with load, unload, infer, capabilities methods
    - Local runners: Multiple providers supported (llama.cpp, LM Studio, vLLM, Ollama)
    - Capabilities: Backend type, max context, batching support, streaming, hardware requirements
    - Packaging: Generated Rust project with shared backend crate provides balance
    - Networking boundary: Opt-in capability with provenance tracking and policy gates

  quality_memory:
    - Verify/repair loops: Generate-verify-repair should be runtime semantic loops, not prompt style
    - Benchmarking: Benchmark suites tied to workflow version, policy snapshot, backend, file type
    - Memory architecture: Local structured plus unstructured storage before remote search
    - Retrieval: Combine exact/full-text search with semantic retrieval, not vectors alone
    - Scraping: Robots.txt and scope restrictions enforced before external access

  automation_autonomy:
    - Cron workflows: Scheduled jobs instantiate versioned workflow runs from stable specs
    - Git experiments: Isolated working copies or branches with explicit merge policies
    - Autonomous loops: Bounded by goals, checkpoints, and stop conditions
    - Metrics: Objective measurements include usefulness, intervention rate, repair rate, operator trust
    - Human override: Pause and scope visibility always available

