# ═══════════════════════════════════════════════════════════════════
# UNIFIED AGENTSDK WORKFLOW SCHEMA — v2.0
# ═══════════════════════════════════════════════════════════════════
# A declarative workflow schema for defining, executing, and
# optimizing AI-powered agent workflows with local LLMs.
#
# Design principles:
#   - Human-readable: natural language key names, skimmable
#   - Extensible: easy to add new features without restructuring
#   - Simple: deduplicated, one way to do each thing
#   - Presence = enabled (no enabled: true clutter)
# ═══════════════════════════════════════════════════════════════════

# ── WORKFLOW IDENTIFICATION ──────────────────────────────────────
workflow_id: "example-workflow-v2"        # string, required, unique identifier
name: "Example Workflow"                  # string, required, human-readable
description: "Demonstrates all schema features"
version: "2.0.0"                          # semver string
author: "team"
tags: [example, demonstration]            # string[] for categorization

# ══════════════════════════════════════════════════════════════════
# PROVIDERS (infrastructure connections)
# Only providers the workflow actually uses need to be listed.
# Supports inline config OR config_file: "./path/to/provider.yml"
# ══════════════════════════════════════════════════════════════════
providers:
  lmstudio:                               # lmstudio | ollama | llama_cpp_with_vulkan
    config:                               # inline config OR config_file: "./path.yml"
      host: localhost                     # string, default: localhost
      port: 1234                          # number, default: 1234
      connection_timeout_secs: 30         # number
    hosting:
      max_concurrent_models: 3            # number
      model_offload_timeout_secs: 60      # number
      gpu_layers: 999                     # number, 0=CPU only, 999=all layers (sets LLAMA_ARG_N_GPU_LAYERS)
      gpu_allocation:                     # presence = GPU allocation enabled
        vram_per_model_mb: 4096           # number
      cpu_fallback:                       # presence = CPU fallback enabled
        cpu_cores_per_model: 2            # number
    requests:
      max_concurrent_requests: 5          # number
      request_timeout_secs: 120           # number
      queue_timeout_secs: 300             # number
      rate_limit_per_minute: 60           # number
      retry:                              # provider-level retry
        max_retries: 3                    # number
        backoff: exponential              # exponential | linear | fixed
        initial_delay: "1s"
        max_delay: "30s"
        multiplier: 2.0
        jitter: true

  ollama:
    config_file: "./providers/ollama.yml" # file path overrides inline config

  llama_cpp_with_vulkan:
    config_file: "./providers/llama_cpp.yml"

# ══════════════════════════════════════════════════════════════════
# MODELS (definitions — referenced by steps, not modified at step level)
# No routing: section — model router handles routing dynamically.
# No framework: key — backend implementation detail, not schema-configurable.
# ══════════════════════════════════════════════════════════════════
models:
  global_config_path: "./workspace/model-config.yml"  # optional shared config file
  default_router: automatic              # automatic | manual

  "primary-analyzer":
    name: "Primary Code Analyzer"
    host:
      type: lmstudio                     # lmstudio | ollama | llama_cpp_with_vulkan
      connection_settings: {}            # provider-specific overrides

    load_params:                          # llama.cpp load parameters (Qwen 3.5-9b CPU config)
      context_size: 32768                 # --ctx-size (2x buffer of 16k max response; bump to 262144 if input+response >= 131072)
      batch_size: 2048                    # --batch-size
      ubatch_size: 512                    # --ubatch-size
      cache_type_k: "q8_0"               # Q8 KV cache for larger context
      cache_type_v: "q8_0"               # Q8 KV cache for larger context
      gpu_layers: 0                       # --n-gpu-layers (0 = CPU-only inference)
      threads: 5                          # --threads (CPU thread pool size)
      use_mmap: true                      # --mmap
      flash_attn: true                    # --flash-attn on (safe for Vulkan)
      cont_batching: false               # MUST be false for Vulkan
      no_cache_prompt: true              # MUST be true for Vulkan
      parallel: 1                         # --parallel (max concurrent predictions)

    sampling:                             # default sampling params (step-level overrides take priority)
      temperature: 0.2                   # 0.0-2.0
      top_p:                             # 0.0-1.0 (null = server default)
      top_k:                             # 0 = disabled (null = server default)
      min_p:                             # 0.0-1.0 (null = server default)
      max_tokens: 4096                   # max tokens to generate
      repeat_penalty:                    # 1.0 = no penalty (null = server default)
      seed:                              # 0 = random (null = server default)

    ram_allocation:                       # presence = RAM allocation configured
      strategy: dynamic                  # static | dynamic
    max_allowed:                          # resource limits (percentage or absolute)
      ram: 13%                           # e.g. 13% or 8GB
      vram: 3.7GB
      cpu: 49%
      gpu: 74%
      attention_tokens: 150000
      concurrent_requests: 2
      memory_safety_margin_bytes: 1073741824  # bytes reserved for system after model+KV (default 1GB)
      max_concurrent_inferences: 3            # null=auto-detect from VRAM/RAM, 1..=4=override
    min_allowed:                          # minimum resource requirements
      ram: 9%
      vram: 2.4GB
      cpu: 49%
      gpu: 74%
      attention_tokens: 73500

    model_memory:
      cache_size: min                    # min | max | medium | medium-min | medium-max
      kv_cache_quantization: auto        # auto | q4_k_m | q4_0 | q5_k_m | q5_0 | q6_k | q8_0
      attention_context: auto            # auto | from_max_allowed | manual_override

    execution:
      timeout:
        load_into_memory: 45s            # seconds | e.g. 1m, 4h
        time_to_first_response: 1m
        total_time_to_response: 4h
      max_turns: 10
      max_tokens: 4096                   # number, default max tokens for all steps (step-level overrides take priority)
      stop_on_tool_failure: false
      accumulate_tool_results: true

    thinking:                             # presence = thinking mode enabled
      budget_tokens: 4096                # number, 0-16384
      capture_in_output: true
      capture_in_events: true

    tools:
      default_permissions:
        web_access: ask                  # ask | trust | block
        file_read: trust                 # ask | trust | block
        file_write: ask                  # ask | trust | block
        shell_exec: ask                  # ask | trust | block
      allowed_tools: [grep, file_read]
      forbidden_tools: []
      custom_tools: []

    guardrails:                           # presence = guardrails enabled
      enforcement_policy: block          # block | warn | allow
      input:
        guards: [prompt_injection, pii_redaction, max_length]
        prompt_injection:
          sensitivity: high              # low | medium | high
          on_match: block                # block | warn | sanitize
        pii_redaction:
          patterns: []                   # [] = built-in, or custom regex strings
          replacement: "[REDACTED]"
          on_match: sanitize             # sanitize | block | log_only
        max_length:
          max_tokens: 8000
          on_match: truncate             # block | truncate | error
      output:
        guards: [toxicity_filter, format_validation]
        toxicity_filter:
          trigger_tokens: ["ignore previous instructions"]
          on_match: block
        format_validation:
          format: json                   # json | xml | markdown
          strict: true
          on_match: retry                # block | retry | error

  "secondary-validator":
    name: "Secondary Validator"
    host:
      type: ollama
    ram_allocation:
      strategy: static
    max_allowed:
      ram: 8%
      vram: 2GB
      attention_tokens: 73500

  "embedding-model":
    name: "Local Embedding Model"
    host:
      type: lmstudio

# ══════════════════════════════════════════════════════════════════
# SUB-WORKFLOW DEFINITIONS
# Sub-workflows defined ABOVE can be referenced by those BELOW (top-down).
# String value = path to external YAML file.
# Object value = full inline workflow definition.
# ══════════════════════════════════════════════════════════════════
sub_workflows:
  analyze_workflow: "./workflows/analyze.yml"

  validate_workflow:
    inputs:
      target_code:
        type: string
        description: "Code to validate"
      strict_mode:
        type: boolean
        default: false
    steps:
      validate:
        generative_entity: "${models.secondary-validator}"
        prompt: "Validate: {{inputs.target_code}}"
    when:
      after_step_fails:
        log:
          to_file_path: "./workspace/logs/sub-validation-errors.log"
          event_fields: [step_name, error_message]

  fix_workflow:
    path: "./workflows/fix.yml"
    default_inputs:
      analysis: "{{sub_workflow.analyze_workflow.output}}"
      tolerance: 0.05

# ══════════════════════════════════════════════════════════════════
# AGENTIC WORKFLOW
# L2 configuration: per-step defaults + workflow inputs + steps
# ══════════════════════════════════════════════════════════════════
agentic_workflow:

  # ── HARDCODED VALUES (including thresholds) ──────────────────
  # Values with _threshold suffix or under thresholds: key are
  # treated as configurable numeric limits by convention.
  hardcoded_values:
    workspace_path: "./workspace"
    thresholds:
      quality_min: 0.90
      tolerance: 0.05
      max_iterations: 5
      memory_pressure_percent: 85
    report_format: "markdown"

  # ── WORKFLOW INPUTS (typed, with defaults) ───────────────────
  # Sub-workflows get inputs via the step's input: key.
  inputs:
    workspace_path:
      type: string                       # string (default) | number | boolean | object | list<string> | list<number> | list<object>
      description: "Root workspace directory"
      default: "./workspace"
    quality_threshold:
      type: number
      description: "Minimum quality score for acceptance"
      default: 0.90
    strict_mode:
      type: boolean
      description: "Enable strict validation rules"
      default: false
    target_files:
      type: "list<string>"
      description: "Files to process"
      default: []

  # ── USER INPUTS (interactive prompts) ────────────────────────
  # Can also be specified directly on individual steps.
  user_inputs:
    execution_mode: interactive          # interactive | automated | hybrid
    workflow_level:
      ask_at_start: true
      inputs:
        - id: workspace_path
          type: text_area                # text_area | text_line | select | multi_select | confirm
          label: "Workspace Path"
          default_value: "./workspace"
          validation:
            required: true
            pattern: "^/.+"

  # ── RETRY (flat workflow retry + step: defaults) ─────────────
  # Presence of retry: key = retry enabled.
  # Flat keys = workflow-level retry behavior.
  # step: subkey = default retry for ALL steps.
  retry:
    max_attempts: 10
    backoff: exponential                 # exponential | linear | fixed
    initial_delay: "1s"                  # first retry wait duration
    max_delay: "30s"                     # retry wait ceiling
    multiplier: 2.0                      # backoff multiplier
    jitter: true                         # randomize retry wait to avoid thundering herd
    level: workflow_restart              # workflow_restart | workflow_unload | step_restart | step_unload | prompt_restart | tools_retry | step_continue | model_skip

    step:                                # DEFAULTS for all steps (overridable per-step)
      max_attempts: 3
      backoff: linear                    # exponential | linear | fixed (DEFAULT for steps: linear)
      initial_delay: "1s"
      max_delay: "30s"
      multiplier: 2.0
      jitter: true
      level: step_restart
      adjustment_strategy: loosen_tolerance  # loosen_tolerance | increase_prompt_detail | simplify_task
      tolerance_adjustment: 0.15
      checkpoint_after_retry: true

  # ── DEFAULT HOOKS (apply to all steps unless overridden) ─────
  # Step-level when: hooks MERGE with these defaults.
  # Hook timing: before (no results) | after (complete results) | during (streaming)
  when:                                  # alias: lifecycle_hooks
    after_step_fails:
      log:
        to_file_path: "./workspace/logs/errors.log"
        event_fields: [step_name, error_type, error_message]
        level: error                     # debug | info | warning | error | critical

  # ═════════════════════════════════════════════════════════════
  # STEPS
  # No type: property — step type is INFERRED from keys present:
  #   generative_entity + prompt → agent/LLM step
  #   tool key present           → tool call step
  #   only when present          → control flow step
  #   sub_workflow key present   → sub-workflow step
  #   loop key present           → loop step
  #
  # Each step auto-creates a variable named after the step
  # with substructure: .raw_text, .response, .metadata
  # Access via {{step.step_name.output}}
  # ═════════════════════════════════════════════════════════════
  steps:

    # ── AGENT/LLM STEP (generative_entity + prompt present) ────
    analyze_code:
      generative_entity: "${models.primary-analyzer}"
      prompt: |
        Analyze the code in {{inputs.workspace_path}}.
        Quality threshold: {{inputs.quality_threshold}}.
        Target files: {{inputs.target_files}}.
        Provide: quality_score, issues list, suggestions.
      model_overrides:
        max_turns: 10
      retry:
        max_attempts: 5
        backoff: linear
        initial_delay: "1s"
        max_delay: "30s"
        multiplier: 2.0
        jitter: true
      depends_on: []
      # parallel_group: → moved to agent-queue
      when:
        before_step_starts:
          log:
            to_file_path: "./workspace/logs/steps.log"
            event_fields: [step_name, timestamp]
        during_step_streaming:
          log:
            to_file_path: "./workspace/logs/streaming.log"
            event_fields: [step_name, chunk_text, tokens_so_far]
        after_step_succeeds:
          - append_to: "./workspace/output/analysis.yaml"
          - log:
              to_file_path: "./workspace/logs/completed.log"
              event_fields: [step_name, duration_ms, quality_score]
        after_step_fails:
          - gwt:                           # alias: given_when_then — deterministic in hooks
              - given: "error.is_retryable == true"
                then: { route_to: analyze_code }
              - given: "error.is_retryable == false"
                then: { route_to: abort_workflow }
          - log:
              to_file_path: "./workspace/logs/errors.log"
              event_fields: [step_name, error.type, error.message]
        after_all_retries_exhausted:
          log:
            to_file_path: "./workspace/logs/fatal.log"
            event_fields: [step_name, total_attempts]
            level: critical

    # ── TOOL STEP (tool key present) ──────────────────────────
    read_config:
      tool: file_read
      input:
        file_path: "./workspace/config.yml"
      when:
        after_step_succeeds:
          append_to: config_data

    # ── TOOL STEP: shell command ──────────────────────────────
    run_tests:
      tool: shell_exec
      input:
        command: "cargo test --workspace"
        timeout_seconds: 120
      when:
        after_step_succeeds:
          append_to: "./workspace/output/test_results.yaml"
          log:
            to_file_path: "./workspace/logs/tests.log"
            event_fields: [step_name, exit_code, duration_ms]

    # ── CONTROL FLOW STEP (only when present) ─────────────────
    check_results:
      when:
        gwt:
          - given: "quality_score >= 0.9"
            when: "all validation checks passed"
            then: { route_to: [step_success, generate_report] }
          - given: "quality_score >= 0.7"
            then: { route_to: fix_issues_loop }
          - given: "true"
            then: { route_to: abort_workflow }
        before_gwt_evaluates:
          log:
            to_file_path: "./workspace/logs/gwt.log"
            event_fields: [step_name, input_quality_score]
        after_gwt_evaluates:
          log:
            to_file_path: "./workspace/logs/routing.log"
            event_fields: [decision, quality_score, route_target]
      requires:
        - analyze_code
        - step: read_config
          condition: "result.config_loaded == true"
      on_requires_failed:
        log:
          to_file_path: "./workspace/logs/dependency_failures.log"
          event_fields: [failed_step, reason]

    # ── SUB-WORKFLOW STEP (sub_workflow key present) ──────────
    # Output: {{step.run_validation.output}}
    run_validation:
      sub_workflow: validate_workflow
      input:
        target_code: "{{step.analyze_code.output}}"
        strict_mode: "{{inputs.strict_mode}}"
      when:
        before_step_starts:
          log:
            to_file_path: "./workspace/logs/sub-workflows.log"
            event_fields: [step_name, sub_workflow_name]
        after_step_succeeds:
          - append_to: "./workspace/output/validation.yaml"
          - log:
              to_file_path: "./workspace/logs/completed.log"
              event_fields: [step_name, sub_workflow_name, duration_ms]

    # ── LOOP STEP (loop key present) ──────────────────────────
    # Competing loop configs resolve by MIN-constraint principle.
    fix_issues_loop:
      loop:
        validation:
          tolerance: 0.05
          max_iterations: 5
          exact_criteria:
            - metric: quality_score
              operator: ">="              # >= | <= | == | != | > | <
              target: 0.90
        count:
          max_iterations: 10
      sub_workflow: fix_workflow
      input:
        issues: "{{step.analyze_code.output.issues}}"
      when:
        before_step_starts:
          log:
            to_file_path: "./workspace/logs/loops.log"
            event_fields: [step_name, loop_iteration, loop_type]
        after_step_succeeds:
          append_to: "./workspace/output/fix_results.yaml"
        after_loop_iteration_fails:
          log:
            to_file_path: "./workspace/logs/loop-errors.log"
            event_fields: [iteration, error_message]

    # ── LOOP STEP: count-based iteration ──────────────────────
    process_each_file:
      loop:
        count:
          max_iterations: 5
          iteration_variable: current_file
      sub_workflow: analyze_workflow
      input:
        file_path: "{{loop.current_file}}"
      when:
        after_step_succeeds:
          append_to:
            - "./workspace/output/all_analyses.yaml"
            - analysis_collection

    # ── AGENT STEP WITH USER INPUT ────────────────────────────
    confirm_deploy:
      generative_entity: "${models.primary-analyzer}"
      prompt: "Prepare deployment summary for {{step.fix_issues_loop.output}}"
      user_input:
        type: confirm                     # confirm | text_line | text_area | select
        message: "Deploy the refactored code?"
        default: true
      when:
        after_step_succeeds:
          - bookmark: true                # alias: checkpoint, save_state
          - append_to: "./workspace/output/deploy_summary.yaml"

    # ── STEP WITH DEPENDENCY + PARALLEL GROUP ─────────────────
    step_success:
      generative_entity: "${models.primary-analyzer}"
      prompt: "Generate success report for {{step.analyze_code.output}}"
      requires:
        - check_results
        - run_validation
      when:
        after_step_succeeds:
          save_to:
            - final_report
            - "./workspace/output/final.yaml"
          notify:
            message: "Workflow completed successfully"

    generate_report:
      generative_entity: "${models.primary-analyzer}"
      prompt: "Generate detailed quality report"
      requires: [check_results]
      # parallel_group: → moved to agent-queue
      when:
        after_step_succeeds:
          append_to: "./workspace/output/quality_report.yaml"

    # ── ABORT STEP ────────────────────────────────────────────
    abort_workflow:
      when:
        after_step_starts:
          - fail: "Quality threshold not met. Aborting workflow."
          - skip_remaining: true

# ══════════════════════════════════════════════════════════════════
# WORKFLOW EXECUTION STRATEGY
# Straight execution engine — no adaptive features.
# Adaptive behavior handled by model router project.
# ══════════════════════════════════════════════════════════════════
workflow_execution_strategy:
  load_unload: one_at_a_time              # one_at_a_time | lazy | eager
  # processing: removed — execution is serial by definition
  # parallel: → moved to agent-queue project

  memory:
    ram_allocation:
      strategy: dynamic                  # static | dynamic
      max_allowed:
        ram: 13%
        vram: 3.7GB
      min_allowed:
        ram: 9%
        vram: 2.4GB
    model_lifecycle:
      load_unload_strategy: one_at_a_time
      cache_size: min                     # min | max | medium | medium-min | medium-max
      swap_timeout_secs: 30
      unload_unused: true
    pressure_handling:
      trigger_threshold_percent: 85
      strategy: throttle                  # throttle | swap | fail_fast | graceful_degradation
      throttle_factor: 0.5
      on_oom: swap                        # swap | fail_fast | graceful_degradation

  timeout:
    total: 4h
    per_operation:
      tool_call: 30m
      step: 8m
      sub_workflow: 300s
      time_to_first_result_secs: 120
    timeout_strategy: continue_with_partial  # fail | continue_with_partial | retry

  error_handling:
    default_action:
      type: retry                         # retry | skip | fail_workflow
    retry:
      max_attempts_per_step: 3
      max_attempts_per_workflow: 10
      backoff_strategy:
        type: exponential                 # exponential | linear | fixed
        initial_delay: "1s"
        max_delay: "30s"
        multiplier: 2.0
        jitter: true
    escalation:
      escalate_to_model_after: 3
      notify_on_failure: true
    handling_by_type:
      transient_failures: { action: retry_with_exponential_backoff }
      permanent_failures: { action: log_and_continue }
      user_errors: { action: escalate_immediately }
      system_errors: { action: retry_with_fallback }

  quality:                                 # quality/refusal evaluation (chunk 10 — replaces framework regex)
    refusal_patterns:                      # string[] — overrides DEFAULT_REFUSAL_PATTERS when set
      - "I cannot help"
      - "I am unable to"
    quality_threshold: 0.7                 # min acceptable score (0.0-1.0); below = route to fix step
    # `refusal_detected` boolean is exposed on AfterStepSucceedsContext.
    # Use as GWT predicate to declare refusal policy in YAML instead of framework substring:
    #   when:
    #     after_step_succeeds:
    #       gwt:
    #         - given: "refusal_detected == true"
    #           then: { fail: "model refused" }

  timing:                                  # chunk C — model lifecycle timing (overrides CLI defaults when set)
    cooldown_after_unload_secs: 3          # sleep after model unload before next load
    model_load_timeout_secs: 300           # max seconds to wait for model load
    min_tmp_space_mb: 1024                 # minimum free /tmp space required

  streaming:                               # chunk G — SSE streaming path (fires during_step_streaming per chunk)
    enabled: false                         # set true to use chat_completion_stream + fire per-chunk hooks

  # ─── chunk H — dependency/iteration semantics ────────────────────────────
  # `requires` check is mechanical: engine verifies each dep ran and produced output.
  # Response to missing deps is YAML-controlled via `on_requires_failed` hook.
  # Any action (route_to, fail, skip_step, GWT clause) is supported. Example:
  #   when:
  #     on_requires_failed:
  #       gwt:
  #         - given: "failed_step == \"fetch_data\""
  #           then: { route_to: [retry_fetch] }
  #         - given: "true"
  #           then: { fail: "unrecoverable dep failure" }
  #
  # `iterate_values` is a CONFIGURATION CARRIER, not an executed action.
  # Declared under `before_step_starts`. Runner's `extract_iterate_values`
  # expands the step into N iterations, one per index. Example:
  #   when:
  #     before_step_starts:
  #       iterate_values:
  #         step.model_ref: [model_a, model_b, model_c]
  #         step.temperature: [0.1, 0.5, 0.9]

  sub_workflow:
    reference_resolution:
      strategy: local_first               # local_first | hierarchical | registry_only
      cache_ttl_secs: 3600
      on_version_conflict: error          # error | warn_and_continue | use_latest
    # max_parallel_workflows: → moved to agent-queue
    inherit_policy:
      inherit_from_parent: [runtime, review, scope, concurrency, logging]
      override_allowed: [review, efficiency, logging]

  checkpointing:
    configuration:
      level: timetravel                   # timetravel | git | debug | info | compressed_summary
      output_path: "./workspace/checkpoints/chat-file.md"
      max_size:
        lines: 1000
        bytes: 10MB
        tokens: 100000
    triggers:
      interval: { time: 5m }
      on_failure: create                  # create | skip
      on_timeout: create
    cleanup:
      max_checkpoints: 10
      keep_last_n: 5
      delete_older_than_hours: 48

  synchronization:
    coordination:
      deadlock_detection: true
      deadlock_resolution_timeout_secs: 120
    conflict_handling:
      resolution_strategy: last_writer_wins  # last_writer_wins | merge_results | fail_on_conflict
    event_propagation:
      mode: bidirectional                 # bidirectional | bottom_to_top | top_to_bottom

  dependency_resolution:
    strategy: wait_for_all                # wait_for_all | continue_with_available | skip_failed
    timeout_secs: 300
    propagate_failure_to_dependents: true
    on_dependency_failure: fail_workflow   # fail_workflow | skip_dependent | use_fallback

# ══════════════════════════════════════════════════════════════════
# TOOL PERMISSIONS
# Presence = enabled. disabled: true to explicitly turn off.
# Global baseline — per-step can only RESTRICT, not expand.
# Rate limits: inline or referenceable by file.
# ══════════════════════════════════════════════════════════════════
tool_permissions:
  file_operations:
    read:
      require_confirmation: false
      allowed_paths: ["./workspace/src", "./workspace/config"]
      allowed_patterns: ["*.rs", "*.yml", "*.yaml"]
      forbidden_paths: ["/etc", "/root"]
      max_file_size_mb: 100
    write:
      require_confirmation: true
      allowed_paths: ["./workspace/output", "./workspace/checkpoints"]
      backup_existing: true
      create_parent_directories: true
    delete:
      require_confirmation: true
      allowed_paths: ["./workspace/temp"]

  web_operations:
    fetch:
      max_concurrent_requests: 5
      timeout_secs: 30
      allowed_domains: ["api.github.com", "docs.rs"]
      forbidden_domains: ["*.local"]
      rate_limits:
        max_per_hour: 100
      rate_limits_file: "./config/web_limits.yml"
    scrape:
      respect_robots_txt: true
      max_pages_per_domain: 100

  shell_operations:
    exec:
      require_confirmation: true
      timeout_seconds: 30
      allowed_commands: [cargo, rustc, git, ls, cat, mkdir, cp]
      forbidden_commands: [rm, sudo, chmod, chown]
      working_directories: ["./workspace"]

  content_operations:                     # absorbed from former ai_operations
    generate:
      rate_limits: { max_tokens_per_hour: 50000 }
    web_search:
      rate_limits: { max_per_hour: 100 }
      rate_limits_file: "./config/search_limits.yml"

  system_operations:
    process_management:
      disabled: true
      allowed_signals: [SIGTERM, SIGINT]
      max_cpu_percent: 50
      max_memory_mb: 1024
      monitored_processes: [node, python]
    network_operations:
      disabled: true
      allowed_ports: [8080, 3000]
      allowed_protocols: [tcp, udp]
      max_bandwidth_mbps: 100
      blocked_hosts: ["*.internal", "169.254.*"]
    file_system_mount:
      disabled: true
      allowed_mount_points: ["/tmp", "./workspace"]
      mount_options: [ro, noexec]
    environment_variables:
      read:
        allowed_patterns: ["APP_*", "PATH"]
      write:
        disabled: true
    service_management:
      disabled: true
      allowed_services: [docker, nginx]
      allowed_actions: [start, stop, restart, status]

# ══════════════════════════════════════════════════════════════════
# MEMORY
# RAG under memory — presence of rag: key = enabled (no enabled: key).
# ══════════════════════════════════════════════════════════════════
memory:
  rag:
    knowledge_base:
      path: "./workspace/rag/knowledge_base"
      format: vector_db                   # vector_db | file_based | memory_based
      chunk_size: 512
      chunk_overlap: 50
    embedding_model:
      model_ref: "${models.embedding-model}"
      dimension: 768
      batch_size: 32
    retrieval:
      max_results: 10
      similarity_threshold: 0.7
      include_sources: true

# ══════════════════════════════════════════════════════════════════
# WORKSPACE (physical environment definition)
# ══════════════════════════════════════════════════════════════════
workspace:
  root_path: "./workspace"
  directories:
    output: "./workspace/output"
    checkpoints: "./workspace/checkpoints"
    logs: "./workspace/logs"
    metrics: "./workspace/metrics"
    backups: "./workspace/backups"
    temp: "./workspace/temp"
    rag_knowledge_base: "./workspace/rag/knowledge_base"
  model_selection:                          # chunk I — model discovery + diversity selection
    strategy: all                           # all (default) | diverse_n (use ModelSelector tier-diverse algorithm)
    diverse_n_count: 5                      # when strategy=diverse_n: number of models to select (tier-balanced)
    model_filter: "Qwen3-[45]"              # optional regex; overrides CLI --filter-name when set
  detail_template: |                        # chunk J — per-model detail.md template (optional; default preserves original format)
    # When set, replaces DetailGenerator's default markdown format. Variables:
    #   {{model_id}}, {{model_path}}, {{file_size_bytes}}, {{file_size_mb}},
    #   {{load_duration_secs}}, {{unload_duration_secs}}, {{total_duration_secs}},
    #   {{tokens_per_second}}, {{avg_latency_ms}}, {{p50_latency_ms}},
    #   {{p95_latency_ms}}, {{p99_latency_ms}}, {{gpu_mode}},
    #   {{speedup_factor}} (e.g. "2.50x" or ""), {{error}} (message or ""),
    #   {{inference_count}}, {{speedup_row}} (full table row or ""), {{error_row}}
    # Loop block (optional): {{#each inference}} ... {{/each}}
    #   Inside: {{index}}, {{prompt_preview}}, {{response_preview}}, {{response_full}},
    #   {{duration_secs}}, {{prompt_tokens}}, {{completion_tokens}}, {{total_tokens}}, {{tokens_per_second}}
    # When absent, DetailGenerator uses built-in DEFAULT_DETAIL_TEMPLATE.
  permissions:
    # Natural language enum values for permission modes:
    #   owner_full                            = 700
    #   owner_full_group_read                 = 740
    #   owner_full_group_read_exec            = 750
    #   owner_full_group_read_other_read      = 744
    #   owner_full_group_read_exec_other_read_exec = 755
    #   owner_full_group_full_other_read      = 774
    #   owner_full_group_full_other_full      = 777
    #   owner_read_only                       = 400
    #   owner_read_write                      = 600
    default_mode: owner_full_group_read_exec_other_read_exec

# ══════════════════════════════════════════════════════════════════
# VARIABLE INTERPOLATION SYNTAX
# ══════════════════════════════════════════════════════════════════
# ${...}  — STRUCTURAL REFERENCES (resolved at workflow parse time)
#   ${models.model_name}          → model definition
#   ${workspace.path_var}         → workspace path
#   ${workflow.field_name}        → workflow-level variable
#
# {{...}} — DYNAMIC TEMPLATE VALUES (resolved at runtime)
#   {{step.step_name.output}}     → step output (.raw_text, .response, .metadata)
#   {{sub_workflow.name.output}}  → sub-workflow output
#   {{inputs.field_name}}         → workflow input value
#   {{loop.iteration_variable}}   → current loop iteration value
#   {{now}}                       → current ISO 8601 timestamp
#   {{workflow_id}}               → workflow identifier string
#   {{run.number}}                → sequential execution run number

# ── DEFAULT BEHAVIOR REFERENCE ─────────────────────────────────
# execution.mode:              serial
# retry (block absent):        no retry (fail immediately)
# retry.default.backoff:       linear (step), exponential (workflow)
# retry.default.max_attempts:  3 (step), 10 (workflow)
# step output:                 auto-created as step_name.output variable
# format:                      yaml (structured data), string (unstructured)
# tool_permissions (absent):   all allowed
# models.default_router:       automatic

# ── SCOPE & INHERITANCE RULES ──────────────────────────────────
# L1 (workflow top-level) → L2 (agentic_workflow defaults) → L3 (step-level)
#
# Tool Permissions: global baseline → per-step can only RESTRICT
# Retry: L2 step defaults → L3 overrides completely (not merged)
# Hooks: L2 default hooks MERGE with L3 step hooks (additive)
# Models: L1 defines → L3 references via ${models.name}
# Sub-workflows: L1 defines → L3 references via sub_workflow: key
#
# L1 ONLY: providers, models, sub_workflows, workspace, memory, tool_permissions
# L2 defaults: retry.step:, when (default hooks)
# L3 step-level: retry, when, requires, depends_on, parallel_group, prompt, tool

# ── SKIP ACTIONS ───────────────────────────────────────────────
#   skip_step          → skip just this step, continue workflow
#   skip_loop          → skip current loop iteration (not whole loop)
#   skip_sub_workflow  → skip current sub-workflow execution
#   skip_remaining     → skip all remaining steps in workflow

# ── THEN CLAUSES (complete list) ───────────────────────────────
#   route_to: step_name               # route to named step
#   route_to: [step_a, step_b]        # route to multiple steps (parallel)
#   route_to: sub_workflow_name       # route to sub-workflow
#   save_to: variable_name            # append to variable (alias: append_to, set_variable)
#   save_to: "./path/to/file.yaml"    # append to file path
#   save_to: [var_name, "./path.yaml"]# save to both variable and file
#   format: yaml                      # optional explicit format (default: yaml/string)
#   bookmark: true                    # create checkpoint (alias: checkpoint, save_state)
#   notify: { message: "Done" }       # send notification (MVP: log only)
#   fail: "reason message"            # explicitly fail the step/workflow
#   skip_step: true                   # skip this step
#   skip_loop: true                   # skip current loop iteration
#   skip_sub_workflow: true           # skip current sub-workflow
#   skip_remaining: true              # skip all remaining steps

# ── LIFECYCLE STATE MACHINE (comment-only, not configurable in MVP) ──
#   LOADED → WARMING → ACTIVE → COOLING → UNLOADED
#              ↑                    │
#              └──── (re-warm) ─────┘
# Control: load_unload_strategy, cache_size, swap_timeout_secs, unload_unused

# ── DUPLICATE CONFIGURATION CLARIFICATION ──────────────────────
# 1. PARALLELISM (three independent levels):
#    parallel_group (on steps)      → WHICH steps run concurrently
#    parallel.algorithm (global)    → HOW parallel tasks are scheduled
#    load_balancing.strategy        → WHERE resources are assigned
#
# 2. PERMISSIONS (two enforcement surfaces):
#    tool_permissions (static)      → tool-by-tool access at config time
#    guardrails (dynamic)           → policy-based safety at runtime
#    Rule: guardrails CANNOT grant beyond tool_permissions

# ── SCHEMA METADATA ────────────────────────────────────────────
schema_version: "2.0.0"
min_schema_version: "2.0.0"
