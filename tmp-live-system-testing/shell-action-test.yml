workflow_id: shell_action_live_test
name: "Shell Action Live Test"
description: "Live test: shell action runs command and captures output"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "tiny-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_shell_test:
      generative_entity: "${models.tiny-model}"
      prompt: |
        Say "hello" and nothing else.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - shell:
              command: "/bin/sh"
              args: ["-c", "echo 'Shell action executed successfully' && date +%s"]
              fail_on_error: true
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/shell-test.log"
              event_fields: [step_name, shell_output]
          - save_to: "./tmp-live-system-testing/outputs/shell-test-output.txt"
