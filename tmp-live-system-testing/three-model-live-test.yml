workflow_id: three_model_live_test
name: "3-Model Live Test"
description: "Live test: 3 models, 3 steps, save_to + log hooks"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "model-a":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  "model-b":
    name: "llama-3.2-1b-instruct-q8_0"
    host:
      type: llama_cpp_with_vulkan
  "model-c":
    name: "stablelm-2-zephyr-1_6b-Q8_0"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_analyze:
      generative_entity: "${models.model-a}"
      prompt: |
        You are a code analyzer. Analyze this Python function and list 3 issues:

        def add(a, b):
          return a + b

        Output ONLY the 3 issues, one per line.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/three-model-step1.txt"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/three-model.log"
              event_fields: [step_name, duration_ms, model_name]

    step_2_enhance:
      generative_entity: "${models.model-b}"
      depends_on: [step_1_analyze]
      prompt: |
        Based on this analysis, rewrite the function to fix all issues:

        Analysis:
        {{step.step_1_analyze.output}}

        Output ONLY the improved Python function.
      model_overrides:
        temperature: 0.5
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/three-model-step2.txt"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/three-model.log"
              event_fields: [step_name, duration_ms, model_name]

    step_3_review:
      generative_entity: "${models.model-c}"
      depends_on: [step_2_enhance]
      prompt: |
        Review this enhanced code and say if it is good or bad:

        Enhanced code:
        {{step.step_2_enhance.output}}

        Output ONLY "GOOD" or "BAD" followed by one reason.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/three-model-step3.txt"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/three-model.log"
              event_fields: [step_name, duration_ms, model_name]
