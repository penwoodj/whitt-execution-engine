workflow_id: skip_step_live_test
name: "Skip Step Live Test"
description: "Live test: 2 steps where step 1 is skipped via before_step_starts"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "tiny-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_skip_me:
      generative_entity: "${models.tiny-model}"
      prompt: "This should NOT be executed."
      when:
        before_step_starts:
          - skip_step: true
        after_step_succeeds:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/skip-test.log"
              event_fields: [step_name]

    step_2_run_me:
      generative_entity: "${models.tiny-model}"
      prompt: |
        Say "hello world" and nothing else.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/skip-test-step2.txt"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/skip-test.log"
              event_fields: [step_name, duration_ms, model_name]
