workflow_id: append_live_test
name: "Append Accumulation Live Test"
description: "Live test: 3 steps each append_to same file, verify accumulation"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "tiny-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_first:
      generative_entity: "${models.tiny-model}"
      prompt: "Say the word ALPHA and nothing else."
      model_overrides:
        temperature: 0.1
        max_tokens: 50000
      when:
        after_step_succeeds:
          - append_to: "./tmp-live-system-testing/outputs/append-test.log"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/append-test-hooks.log"
              event_fields: [step_name, duration_ms]

    step_2_second:
      generative_entity: "${models.tiny-model}"
      depends_on: [step_1_first]
      prompt: "Say the word BETA and nothing else."
      model_overrides:
        temperature: 0.1
        max_tokens: 50000
      when:
        after_step_succeeds:
          - append_to: "./tmp-live-system-testing/outputs/append-test.log"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/append-test-hooks.log"
              event_fields: [step_name, duration_ms]

    step_3_third:
      generative_entity: "${models.tiny-model}"
      depends_on: [step_2_second]
      prompt: "Say the word GAMMA and nothing else."
      model_overrides:
        temperature: 0.1
        max_tokens: 50000
      when:
        after_step_succeeds:
          - append_to: "./tmp-live-system-testing/outputs/append-test.log"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/append-test-hooks.log"
              event_fields: [step_name, duration_ms]
