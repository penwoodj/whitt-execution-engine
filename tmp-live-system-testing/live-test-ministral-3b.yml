# ═══════════════════════════════════════════════════════════════════
# Live System Test — Ministral-3-3B-Instruct-2512-Q4_K_M
# Schema-compliant per docs/schema/unified-workflow-schema.yml v2.0
#
# Simple 2-step workflow to verify live system functionality:
#   step_1_generate: Generate a short JSON response
#   step_2_summarize: Summarize step_1 output
#
# Tests: YAML loading, model resolution, inference, hooks (log + save_to)
# ═══════════════════════════════════════════════════════════════════

workflow_id: live_test_ministral_3b
name: "Live System Test - Ministral 3B"
description: "Verify live system runs a 2-step workflow with Ministral-3-3B-Instruct-2512-Q4_K_M"
version: "2.0.0"
author: "Whitt Execution Engine"
tags: [live-test, ministral]
min_schema_version: "2.0.0"
schema_version: "2.0.0"

# ── PROVIDERS ───────────────────────────────────────────────────
providers:                                                 # schema line 28
  llama_cpp_with_vulkan:
    config:                                                # schema line 29
      host: localhost                                      # schema line 30
      port: 8080                                           # schema line 31
    hosting:                                               # schema line 33
      gpu_layers: 999                                      # schema line 35

# ── MODEL ───────────────────────────────────────────────────────
models:
  "target-model":                                          # schema line 68
    name: "Ministral-3-3B-Instruct-2512-Q4_K_M"
    host:                                                  # schema line 70
      type: llama_cpp_with_vulkan                          # schema line 71

# ── WORKFLOW EXECUTION STRATEGY ────────────────────────────────
workflow_execution_strategy:                                # schema line 503
  memory:
    model_lifecycle:
      unload_unused: true                                  # schema line 521

# ── AGENTIC WORKFLOW ───────────────────────────────────────────
agentic_workflow:                                           # schema line 196

  steps:                                                   # schema line 293

    # ── STEP 1: Generate JSON ───────────────────────────────────
    step_1_generate:
      generative_entity: "${models.target-model}"          # schema line 297
      prompt: |                                            # schema line 298
        Generate a JSON object with exactly these keys:
        - "test": "live_system_test"
        - "model": "ministral-3b"
        - "status": "ok"
        - "timestamp": current date as string

        Output ONLY the JSON object. No markdown. No backticks.
        First character: { Last character: }
      model_overrides:                                     # schema line 303
        temperature: 0.3
        max_tokens: 50000
      when:                                                # schema line 314
        after_step_succeeds:                               # schema line 323
          - save_to: "./tmp-live-system-testing/outputs/step1-generate.json"
          - log:                                           # schema line 275
              to_file_path: "./tmp-live-system-testing/outputs/live-test.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:                                  # schema line 328
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/live-test.log"
              event_fields: [step_name, error_message]

    # ── STEP 2: Summarize ──────────────────────────────────────
    step_2_summarize:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_generate]
      prompt: |
        You will receive a JSON string. Summarize it in one sentence.

        INPUT:
        {{step.step_1_generate.output}}

        Output ONLY the summary sentence. No JSON. No markdown.
      model_overrides:
        temperature: 0.5
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/step2-summarize.txt"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/live-test.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/live-test.log"
              event_fields: [step_name, error_message]
