# Live system test: after_all_retries_exhausted trigger
# Server is stopped → all inference attempts fail → trigger fires
agentic_workflow:
  name: test-retries-exhausted
  version: "2.0.0"
  
  providers:
    llama_cpp_with_vulkan:
      config:
        host: localhost
        port: 8080

  models:
    test_model:
      type: llama_cpp_with_vulkan
      path: ministral-3b-instruct-Q4_K_M.gguf

  steps:
    step_1_infer:
      type: inference
      model: test_model
      prompt:
        - "Say hello"
      max_tokens: 50
      temperature: 0.7
      top_p: 0.9
      when:
        after_step_fails:
          - log:
              to_stdout: true
              event_fields:
                - step_name
                - error_message
        after_all_retries_exhausted:
          - log:
              to_stdout: true
              message: "ALL RETRIES EXHAUSTED - hook fired correctly"
              event_fields:
                - step_name
                - total_attempts
                - last_error
          - save_to:
              file_path: outputs/test-retries-exhausted.txt
              content: "Retries exhausted trigger fired"
