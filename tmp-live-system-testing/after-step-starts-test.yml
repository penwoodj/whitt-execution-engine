workflow_id: after_step_starts_live_test
name: "After Step Starts Live Test"
description: "Live test: after_step_starts hook fires and logs"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "tiny-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1:
      generative_entity: "${models.tiny-model}"
      prompt: |
        Say "step started" and nothing else.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_starts:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/after-step-starts.log"
              event_fields: [step_name, step_type]
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/after-step-starts-output.txt"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/after-step-starts.log"
              event_fields: [step_name, duration_ms]
