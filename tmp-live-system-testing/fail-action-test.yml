workflow_id: fail_action_live_test
name: "Fail Action Live Test"
description: "Live test: step fails, after_step_fails fires fail action"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "nonexistent-model":
    name: "THIS_MODEL_DOES_NOT_EXIST_ON_SERVER"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_will_fail:
      generative_entity: "${models.nonexistent-model}"
      prompt: "This should fail because the model doesn't exist."
      when:
        after_step_fails:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/fail-test.log"
              event_fields: [step_name, error_message]
          - fail:
              message: "Model load failed as expected — test verified"
