workflow_id: bookmark_live_test
name: "Bookmark Persistence Live Test"
description: "Live test: step 1 bookmarks output, step 2 reads it"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "tiny-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_bookmark:
      generative_entity: "${models.tiny-model}"
      prompt: "Say the word FIRST and nothing else."
      model_overrides:
        temperature: 0.1
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/bookmark-step1.txt"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/bookmark-test.log"
              event_fields: [step_name, duration_ms]

    step_2_read:
      generative_entity: "${models.tiny-model}"
      depends_on: [step_1_bookmark]
      prompt: |
        Step 1 output was: {{step.step_1_bookmark.output}}

        Now say the word SECOND and nothing else.
      model_overrides:
        temperature: 0.1
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/bookmark-step2.txt"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/bookmark-test.log"
              event_fields: [step_name, duration_ms]
