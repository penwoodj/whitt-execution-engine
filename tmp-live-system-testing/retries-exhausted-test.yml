workflow_id: after_all_retries_exhausted_live_test
name: "After All Retries Exhausted Live Test"
description: "Live test: nonexistent model triggers load failure, retries exhaust, hook fires"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "bad-model":
    name: "nonexistent-model-DOES-NOT-EXIST.gguf"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_will_fail:
      generative_entity: "${models.bad-model}"
      prompt: "This should never execute."
      model_overrides:
        max_tokens: 100
      when:
        after_step_fails:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/retries-exhausted.log"
              event_fields: [step_name, error_type, error_message]
              level: error
          - save_to: "./tmp-live-system-testing/outputs/retries-exhausted-error.txt"
        after_all_retries_exhausted:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/retries-exhausted.log"
              event_fields: [step_name, total_attempts, last_error]
              level: critical
          - fail:
              message: "All retries exhausted for step_1_will_fail"
