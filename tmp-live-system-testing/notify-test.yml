workflow_id: notify_live_test
name: "Notify Action Live Test"
description: "Live test: notify action writes to outputs/notifications.jsonl"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "test-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_notify:
      generative_entity: "${models.test-model}"
      prompt: "Say hello in 3 words."
      model_overrides:
        max_tokens: 30
        temperature: 0.3
      when:
        after_step_succeeds:
          - notify:
              message: "Step 1 completed with notify action"
          - save_to: "./tmp-live-system-testing/outputs/notify-step1-output.txt"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/notify-test.log"
              event_fields: [step_name, output]
