workflow_id: schema_alignment_live_test
name: "Schema Alignment Live Test"
description: "Verifies workflow-level hooks, depends_on, on_requires_failed, and GWT sub-triggers against the live runner."
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "test-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  when:
    after_step_succeeds:
      - log:
          to_file_path: "./tmp-live-system-testing/outputs/schema-default-hooks.log"
          event_fields: [step_name, duration_ms, token_count]
          level: info

  steps:
    step_01_missing_dependency:
      generative_entity: "${models.test-model}"
      depends_on: [step_00_never_runs]
      prompt: "This prompt must never execute because its dependency is missing."
      model_overrides:
        max_tokens: 20
        temperature: 0.1
      on_requires_failed:
        dependency_failure:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/schema-requires-failed.log"
              event_fields: [failed_step, reason, dependency_chain]
              level: error

    step_02_generate_and_route:
      generative_entity: "${models.test-model}"
      prompt: "Reply with exactly this word: READY"
      model_overrides:
        max_tokens: 20
        temperature: 0.1
      when:
        before_gwt_evaluates:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/schema-gwt-before.log"
              event_fields: [step_name, input_value]
              level: info
        after_gwt_evaluates:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/schema-gwt-after.log"
              event_fields: [step_name, decision, route_target]
              level: info
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/schema2-step2-output.txt"
          - gwt:
              - given: "token_count > 0"
                then: step_99_success
              - given: "true"
                then: step_03_failure

    step_03_failure:
      generative_entity: "${models.test-model}"
      prompt: "This failure route must not execute."
      model_overrides:
        max_tokens: 20
        temperature: 0.1
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/schema2-failure.txt"

    step_99_success:
      generative_entity: "${models.test-model}"
      prompt: "Reply with exactly this word: DONE"
      model_overrides:
        max_tokens: 20
        temperature: 0.1
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/schema2-success.txt"
