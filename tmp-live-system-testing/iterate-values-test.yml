workflow_id: iterate_values_live_test
name: "Iterate Values Live Test"
description: "Live test: iterate_values with after_loop_iteration_fails hook"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "tiny-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_iterate:
      generative_entity: "${models.tiny-model}"
      prompt: "Say hello to {{item.name}}."
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
          - iterate_values:
              item:
                - alice
                - bob
                - charlie
        after_step_succeeds:
          - append_to: "./tmp-live-system-testing/outputs/iterate-test.log"
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/iterate-test.log"
              event_fields: [step_name, duration_ms]
        after_loop_iteration_fails:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/iterate-test-fail.log"
              event_fields: [step_name, iteration, error_message, loop_type]
              level: error
