workflow_id: skip_remaining_live_test
name: "Skip Remaining Live Test"
description: "Live test: skip_remaining action stops all subsequent steps"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "tiny-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_run:
      generative_entity: "${models.tiny-model}"
      prompt: |
        Say "step one" and nothing else.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - skip_remaining: true
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/skip-remaining.log"
              event_fields: [step_name]
              message: "Skipping remaining steps after step_1"

    step_2_should_not_run:
      generative_entity: "${models.tiny-model}"
      prompt: "This should NOT execute."
      model_overrides:
        max_tokens: 100
      when:
        after_step_succeeds:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/skip-remaining.log"
              event_fields: [step_name]
              message: "ERROR: step_2 should not have run!"

    step_3_should_not_run:
      generative_entity: "${models.tiny-model}"
      prompt: "This should NOT execute either."
      model_overrides:
        max_tokens: 100
      when:
        after_step_succeeds:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/skip-remaining.log"
              event_fields: [step_name]
              message: "ERROR: step_3 should not have run!"
