workflow_id: on_requires_failed_live_test
name: "On Requires Failed Live Test"
description: "Live test: step with requires referencing missing dependency triggers on_requires_failed"
version: "2.0.0"
schema_version: "2.0.0"
min_schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080

models:
  "tiny-model":
    name: "Qwen2.5-0.5B-Instruct-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_succeeds:
      generative_entity: "${models.tiny-model}"
      prompt: |
        Say "hello" and nothing else.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./tmp-live-system-testing/outputs/requires-test-step1.txt"

    step_2_needs_missing_dep:
      generative_entity: "${models.tiny-model}"
      prompt: "This should be skipped."
      requires:
        - nonexistent_step_output
      model_overrides:
        max_tokens: 100
      when:
        on_requires_failed:
          - log:
              to_file_path: "./tmp-live-system-testing/outputs/requires-failed.log"
              event_fields: [failed_step, reason]
              level: warning
          - save_to: "./tmp-live-system-testing/outputs/requires-failed.txt"
