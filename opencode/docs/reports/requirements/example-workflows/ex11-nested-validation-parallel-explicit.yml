---
workflow_id: nested_validation_parallel_explicit
name: Nested Validation with Parallel Explicit Workflows
description: Demonstrates how nested workflows, explicit workflow references, and parallel agents combine with validation loops for iterative refinement

model:
  primary: unsloth/Qwen2.5-Coder-1.5B-Instruct
  fallback: ibm-granite/granite-3.1.2b-instruct

# Workflow Registry
workflow_registry:
  registered_workflows:
    - workflow_id: validation_agent
      name: Validation Agent Workflow
      path: ./workflows/validation_agent.yml
      version: 1.0
      tags: [validation, agent, multi_step]

    - workflow_id: refactoring_orchestrator
      name: Refactoring Orchestrator
      path: ./workflows/refactoring_orchestrator.yml
      version: 1.0
      tags: [orchestration, refactoring, multi_step]

    - workflow_id: documentation_generator
      name: Documentation Generator
      path: ./workflows/documentation_generator.yml
      version: 1.0
      tags: [documentation, generator]

execution:
  mode: parallel
  max_parallel: 3

# Main Validation Loop with Nested Workflows
validation_loop:
  type: validation
  abstract_criteria: quality_improvement
  tolerance: 0.03
  max_iterations: 4

  # Each iteration spawns parallel explicit workflows
  iteration_1:
    parallel_workflow_refs:
      - workflow_ref: validation_agent
        alias: validator
        input:
          task: "Validate code quality for iteration 1"
          iteration: 1

      - workflow_ref: documentation_generator
        alias: docgen
        input:
          task: "Generate documentation for iteration 1"
          iteration: 1

      - workflow_ref: refactoring_orchestrator
        alias: refactor
        input:
          task: "Apply refactoring for iteration 1"
          iteration: 1

    validation_criteria:
      - validator_output.quality_score >= 0.85
      - docgen_output.is_complete == true
      - refactor_output.has_changes == true

  iteration_2:
    parallel_workflow_refs:
      - workflow_ref: validation_agent
        alias: validator
        input:
          task: "Validate improved code"
          iteration: 2

      - workflow_ref: documentation_generator
        alias: docgen
        input:
          task: "Update documentation"
          iteration: 2

      - workflow_ref: refactoring_orchestrator
        alias: refactor
        input:
          task: "Apply second refactoring pass"
          iteration: 2

    validation_criteria:
      - validator_output.quality_score >= 0.90
      - docgen_output.is_complete == true
      - refactor_output.convergence_delta < 0.02

  iteration_3:
    parallel_workflow_refs:
      - workflow_ref: validation_agent
        alias: validator
        input:
          task: "Validate final quality"
          iteration: 3

      - workflow_ref: documentation_generator
        alias: docgen
        input:
          task: "Finalize documentation"
          iteration: 3

      - workflow_ref: refactoring_orchestrator
        alias: refactor
        input:
          task: "Finalize refactoring"
          iteration: 3

    validation_criteria:
      - validator_output.quality_score >= 0.95
      - docgen_output.is_complete == true
      - refactor_output.convergence_delta < 0.01

  iteration_4:
    parallel_workflow_refs:
      - workflow_ref: validation_agent
        alias: validator
        input:
          task: "Quality gate validation"
          iteration: 4

    validation_criteria:
      - validator_output.passed_gates: [test, security, performance]

# Error Handling for Nested Workflows
error_handling:
  on_validation_failure:
    action: log_and_continue
    message: "Validation iteration ${iteration} failed, attempting retry"
    max_retry_iterations: 2

  on_parallel_workflow_failure:
    action: use_fallback_agent
    fallback_workflow: validation_agent
    require_success_rate: 0.7  # At least 70% success rate

# Logging
logging:
  level: trace
  detail: high
  output_type: mixed
  scopes:
    validation_loop:
      level: trace
      detail: high
    parallel_workflow_execution:
      level: info
      detail: medium
    nested_workflow_invocation:
      level: debug
      detail: high

# Result Aggregation
result_aggregation:
  enabled: true
  aggregation_strategy: merge_and_compare
  compare_iterations:
    - validator_output.quality_score
    - docgen_output.completeness
    - refactor_output.convergence_delta
  converge_when:
    - max_convergence_delta < 0.03
    - quality_score >= 0.95
    - all_outputs_complete: true
