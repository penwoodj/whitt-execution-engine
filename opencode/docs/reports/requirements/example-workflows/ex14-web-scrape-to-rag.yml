---
workflow_id: web_scrape_to_rag
name: Web Scraping to RAG Pipeline
description: Demonstrates web scraping, text extraction, embedding generation, and RAG knowledge base integration

# Model Configuration
models:
  primary:
    provider: lmstudio
    model: "llama-3.2-3b-instruct"
    backend: vulkan
    gpu_layers: 32

  embedding:
    provider: jinaai
    model: "ReaderLM-v2"
    backend: vulkan

# Execution Mode
execution:
  mode: parallel
  memory:
    max_allocated_memory_mb: 8192
    model_memory_mb: 4096
    embedding_memory_mb: 4096
    unload_unused: true

# Logging
logging:
  level: debug
  detail: high
  output_type: chat
  format: json
  console: true
  include_timestamps: true

logging_parameters:
  # Global logging configuration
  level: debug
  detail: high
  output_type: log
  format: json

  # Hierarchical scopes
  scopes:
    web_scraping:
      level: debug
      detail: high
      message_format: "[WEB] {action}: {url} - {status}"

    text_extraction:
      level: info
      detail: medium
      message_format: "[TEXT] {action}: {page_count} pages - {characters} chars"

    embedding_generation:
      level: debug
      detail: high
      message_format: "[EMBEDDING] Generated {count} embeddings - dimension: {dimension}"

    rag_integration:
      level: info
      detail: medium
      message_format: "[RAG] {action}: {document_id} - {status}"

    pipeline orchestration:
      level: info
      detail: medium
      message_format: "[PIPELINE] {step}: {status}"

# Pipeline Definition
pipeline:
  # ========================================
  # Step 1: Identify and Collect Web Sources
  # ========================================
  - step: identify_web_sources
    id: step_1
    model: "${models.primary}"
    input:
      prompt: |
        Identify and collect web sources for RAG knowledge base:

        Source URLs:
        - https://docs.rs/tokio/latest/
        - https://tokio.rs/tokio/
        - https://github.com/tokio-rs/tokio

        Requirements:
        1. Analyze each URL structure
        2. Identify multiple pages/sections to scrape
        3. Categorize pages by relevance
        4. Determine scraping strategy for each URL type
        5. Generate scraping queue with priority ordering

        Output structure:
        - source_url
        - category
        - priority
        - pages_to_scrape
        - estimated_total_pages
        - scraping_strategy
        - delay_between_requests_seconds

      web_sources:
        - url: "https://docs.rs/tokio/latest/"
          category: "documentation"
          priority: 1
          pages_to_scrape: ["home", "installation", "getting_started", "tutorial"]
          scraping_strategy: "full_documentation"
          delay: 2

        - url: "https://tokio.rs/tokio/"
          category: "official"
          priority: 2
          pages_to_scrape: ["overview", "features", "architecture"]
          scraping_strategy: "overview_pages"
          delay: 1

        - url: "https://github.com/tokio-rs/tokio"
          category: "source_code"
          priority: 3
          pages_to_scrape: ["README", "CONTRIBUTING", "architecture"]
          scraping_strategy: "readme_and_docs"
          delay: 2

      scraping_config:
        max_concurrent_requests: 5
        timeout_ms: 30000
        retry_attempts: 3
        retry_delay_ms: 1000
        user_agent: "RAG-Web-Scraper/1.0"
        respect_robots_txt: true

    output:
      save_to: source_identification
      format: json
      fields:
        - sources
        - total_pages
        - total_urls
        - scraping_queue
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 2: Web Scraping with URL Parameters
  # ========================================
  - step: scrape_web_pages
    id: step_2
    model: "${models.primary}"
    input:
      prompt: |
        Scrape web pages identified in source identification:

        Scraping queue:
        ${step.step_1.output.scraping_queue}

        Requirements:
        1. Implement each scraping strategy
        2. Handle redirects, authentication (if needed)
        3. Extract relevant content sections
        4. Clean HTML markup
        5. Extract structured data where possible
        6. Handle pagination for multi-page sites
        7. Respect rate limiting

        URL Parameters:
        - Respect robots.txt
        - Set appropriate User-Agent
        - Handle HTTP status codes (200, 301, 302, 404, 500)
        - Follow redirects automatically
        - Set timeout for each request
        - Implement retry logic for transient failures

        Scraping Details:
        - Parse HTML structure
        - Extract text content
        - Remove navigation and sidebars
        - Keep headings and structure
        - Preserve links where useful
        - Extract metadata (title, description, author)
        - Calculate page size and word count

        Output:
        - Scraped content per URL
        - Page statistics (HTML size, text size, word count)
        - Scraping errors (if any)
        - Content preview (first 500 chars)
        - URL parameters used

      web_scraping_operations:
        - url: "https://docs.rs/tokio/latest/"
          operation: scrape
          strategy: full_documentation
          url_params:
            format: "html"
            output: "html"
            depth: 1
            user_agent: "RAG-Web-Scraper/1.0"
            timeout: 30000
            retry: 3
            delay: 2000
          extraction_rules:
            - extract: "h1, h2, h3, p, code, pre"
            - remove: "nav, footer, aside, comments"
            - preserve: "links, metadata"
          pagination:
            enabled: true
            max_pages: 50

        - url: "https://tokio.rs/tokio/"
          operation: scrape
          strategy: overview_pages
          url_params:
            format: "html"
            output: "html"
            user_agent: "RAG-Web-Scraper/1.0"
            timeout: 30000
            retry: 3
            delay: 1000
          extraction_rules:
            - extract: "h1, h2, h3, article, p"
            - remove: "nav, footer, sidebar"
            - preserve: "images, links"
          pagination:
            enabled: false
            max_pages: 10

        - url: "https://github.com/tokio-rs/tokio"
          operation: scrape
          strategy: readme_and_docs
          url_params:
            format: "html"
            output: "html"
            user_agent: "RAG-Web-Scraper/1.0"
            timeout: 30000
            retry: 3
            delay: 2000
          extraction_rules:
            - extract: "h1, h2, h3, p, pre, code, blockquote"
            - remove: "codeowners, pull_requests, issues, discussions"
            - preserve: "documentation sections"
          pagination:
            enabled: true
            max_pages: 20

      scraping_concurrency:
        max_concurrent: 5
        queue_size: 100
        backpressure: true

      content_parsing:
        html_to_text: true
        remove_scripts: true
        remove_styles: true
        remove_comments: true
        normalize_whitespace: true
        clean_html: true

    output:
      save_to: scraped_content
      format: json
      fields:
        - pages_scraped
        - total_words
        - total_characters
        - scraping_errors
        - content_by_url
        - statistics
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 3: Text Processing and Extraction
  # ========================================
  - step: process_extracted_text
    id: step_3
    model: "${models.primary}"
    input:
      prompt: |
        Process and structure scraped content for RAG:

        Scraped content:
        ${step.step_2.output.content_by_url}

        Requirements:
        1. Normalize text across all sources
        2. Extract key sections (headers, code blocks, examples)
        3. Generate summaries for long documents
        4. Tag content with metadata (source, category, date)
        5. Identify document structure (sections, subsections)
        6. Extract code examples with language detection
        7. Create content hierarchy

        Processing operations:
        - Normalize text encoding (UTF-8)
        - Remove duplicate content
        - Deduplicate URLs
        - Standardize section headings
        - Extract metadata from headers
        - Generate document summaries
        - Tag with metadata fields:
          * source_url
          * source_category
          * scrape_timestamp
          * page_number
          * language
          * document_type
          * relevance_score

        Output:
        - Processed text documents
        - Document metadata
        - Content statistics
        - Processing logs

      text_processing_operations:
        - operation: normalize_encoding
          encoding: utf-8

        - operation: remove_duplicates
          strategy: content_hash
          threshold: 0.95

        - operation: extract_sections
          levels: [h1, h2, h3]
          include_context: true
          context_length: 100

        - operation: generate_summaries
          max_length: 300
          include_keywords: true

        - operation: tag_content
          tags:
            - source_url
            - source_category
            - scrape_timestamp
            - page_number
            - language
            - document_type
            - relevance_score

        - operation: detect_code_blocks
          languages: ["rust", "yaml", "json", "toml"]
          extract_with_syntax: true

        - operation: create_hierarchy
          depth: 3
          preserve_structure: true

      output_structure:
        documents:
          - document_id
          - source_url
          - category
          - sections:
            - section_id
            - heading
            - content
            - start_position
            - end_position
            - word_count
          - summary
          - metadata
          - code_blocks:
            - language
            - code
            - location

    output:
      save_to: processed_text
      format: json
      fields:
        - processed_documents
        - document_count
        - total_sections
        - total_code_blocks
        - processing_summary
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 4: Embedding Generation
  # ========================================
  - step: generate_embeddings
    id: step_4
    model: "${models.embedding}"
    input:
      prompt: |
        Generate embeddings for processed text documents:

        Processed documents:
        ${step.step_3.output.processed_documents}

        Requirements:
        1. Generate embeddings for each document and section
        2. Use ReaderLM-v2 model (768 dimensions)
        3. Batch processing for efficiency
        4. Handle large documents (chunk if needed)
        5. Store embeddings with metadata
        6. Generate similarity search indexes

        Embedding operations:
        - Embed document level (summary + key sections)
        - Embed section level (individual sections)
        - Embed code blocks (separate from text)
        - Chunk large documents into 500-1000 word segments
        - Generate embeddings per chunk
        - Store chunk relationships

        Configuration:
        - model: jinaai/ReaderLM-v2
        - dimension: 768
        - batch_size: 32
        - embedding_cache: true
        - chunk_size_words: 800
        - overlap_words: 100

        Output:
        - Embeddings for each document/chunk
        - Embedding metadata
        - Similarity search index
        - Chunking statistics

      embedding_operations:
        - operation: embed_documents
          level: document
          model: "${models.embedding}"
          output_format: json
          store_metadata: true

        - operation: embed_sections
          level: section
          model: "${models.embedding}"
          output_format: json
          store_metadata: true

        - operation: embed_code_blocks
          level: code
          model: "${models.embedding}"
          output_format: json
          store_metadata: true

        - operation: chunk_large_documents
          max_chunk_size_words: 800
          overlap_words: 100
          preserve_context: true

        - operation: generate_similarity_index
          algorithm: cosine
          index_type: faiss
          dimension: 768

        - operation: build_embedding_cache
          cache_file: /workspace/embeddings/cache.json
          ttl_seconds: 86400

      embedding_config:
        model_name: jinaai/ReaderLM-v2
        dimensions: 768
        batch_size: 32
        embedding_cache: true
        cache_ttl: 86400
        chunk_size: 800
        overlap: 100
        output_directory: /workspace/embeddings/

    output:
      save_to: embeddings
      format: json
      fields:
        - document_embeddings
        - section_embeddings
        - code_embeddings
        - chunk_embeddings
        - embedding_metadata
        - similarity_index
        - cache_status
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 5: RAG Knowledge Base Integration
  # ========================================
  - step: integrate_into_rag
    id: step_5
    model: "${models.primary}"
    input:
      prompt: |
        Integrate processed text and embeddings into RAG knowledge base:

        Processed text:
        ${step.step_3.output.processed_documents}

        Embeddings:
        ${step.step_4.output.document_embeddings}

        RAG configuration:
        - knowledge_base_path: /workspace/rag/knowledge_base
        - document_store: json
        - embedding_store: faiss
        - metadata_store: json

        Requirements:
        1. Create document index structure
        2. Store documents in knowledge base
        3. Store embeddings in vector store
        4. Create inverted index for fast searching
        5. Generate search queries and synonyms
        6. Setup document versioning
        7. Create backup of existing knowledge base

        RAG operations:
        - Create document index (document_store)
        - Create vector index (embedding_store)
        - Build inverted index (text_store)
        - Store metadata with documents
        - Setup document relationships
        - Create search synonym mappings
        - Setup document versioning
        - Create incremental backup

        RAG structure:
        - /workspace/rag/knowledge_base/
          - documents/
            - doc_001.json
            - doc_002.json
            - ...
          - embeddings/
            - faiss_index.bin
            - metadata.json
          - inverted_index/
            - index.json
          - metadata/
            - kb_metadata.json
          - search/
            - synonyms.json
            - queries.json
          - versions/
            - v1/
            - v2/
          - backups/
            - backup_2024-01-01/

      rag_operations:
        - operation: create_document_index
          format: json
          deduplicate: true
          validate_integrity: true

        - operation: store_embeddings
          store_type: faiss
          dimension: 768
          index_type: flat
          store_metadata: true

        - operation: build_inverted_index
          enable_tokenization: true
          enable_stemming: true
          enable_stopwords: true
          max_index_size: 10000000

        - operation: store_metadata
          include:
            - source_url
            - category
            - timestamp
            - word_count
            - embedding_dim
            - version

        - operation: setup_versioning
          version_control: true
          backup_on_update: true
          max_versions: 10

        - operation: create_backup
          backup_directory: /workspace/rag/knowledge_base/backups/
          include_embeddings: true
          compress: true

        - operation: setup_search
          enable_synonyms: true
          enable_phrase_search: true
          enable_fuzzy_search: true

      rag_config:
        knowledge_base_path: /workspace/rag/knowledge_base
        document_store: json
        embedding_store: faiss
        embedding_dimension: 768
        max_document_size_words: 5000
        versioning:
          enabled: true
          max_versions: 10
        backup:
          enabled: true
          interval_days: 7

    output:
      save_to: rag_integration_result
      format: json
      fields:
        - documents_added
        - embeddings_stored
        - index_build_status
        - backup_created
        - knowledge_base_stats
        - search_index_config
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 6: Validation and Testing
  # ========================================
  - step: validate_rag_pipeline
    id: step_6
    model: "${models.primary}"
    input:
      prompt: |
        Validate RAG pipeline and knowledge base:

        Knowledge base:
        - Documents: ${step.step_5.output.documents_added}
        - Embeddings: ${step.step_5.output.embeddings_stored}

        Validation operations:
        1. Verify document integrity
        2. Verify embedding completeness
        3. Test search functionality
        4. Validate RAG retrieval accuracy
        5. Check knowledge base performance
        6. Validate versioning and backups
        7. Generate validation report

        Validation tests:
        - Document existence and validity
        - Embedding dimension consistency
        - Inverted index completeness
        - Search query performance
        - Retrieval relevance score
        - Knowledge base statistics
        - Backup restore capability
        - Concurrent access handling

        Test queries:
        - "How to use tokio async"
        - "tokio runtime configuration"
        - "tokio spawning tasks"
        - "tokio performance optimization"
        - "tokio error handling"

        Output:
        - Validation results per test
        - Success/failure status
        - Performance metrics
        - Known issues
        - Recommendations

      validation_operations:
        - operation: validate_documents
          check_existence: true
          check_integrity: true
          check_metadata: true

        - operation: validate_embeddings
          check_dimensions: true
          check_completeness: true
          check_format: true

        - operation: test_search
          test_queries: ["tokio async", "runtime configuration", "task spawning"]
          validate_results: true
          check_relevance: true

        - operation: test_retrieval
          query_types: ["exact", "fuzzy", "semantic"]
          top_k_results: 5
          validate_quality: true

        - operation: measure_performance
          metrics:
            - index_build_time
            - query_latency_ms
            - retrieval_time_ms
            - index_memory_mb

        - operation: validate_versioning
          check_versions: true
          test_restore: true
          check_backup: true

        - operation: generate_report
          format: json
          include_metrics: true
          include_issues: true
          include_recommendations: true

      validation_config:
        test_queries_count: 5
        top_k_results: 5
        timeout_ms: 10000
        performance_threshold_ms: 100

    output:
      save_to: validation_report
      format: json
      fields:
        - validation_tests
        - results
        - performance_metrics
        - issues
        - recommendations
        - overall_status
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

# Workflow Variables
workflow:
  workspace_path: /workspace
  rag_path: /workspace/rag
  embedding_path: /workspace/embeddings
  scrapes_path: /workspace/scrapes
  timestamp: ${workflow.timestamp}

# RAG Configuration
rag_config:
  knowledge_base_path: /workspace/rag/knowledge_base
  document_store: json
  embedding_store: faiss
  embedding_dimension: 768
  chunk_size_words: 800
  overlap_words: 100

# Web Scraping Configuration
scraping_config:
  max_concurrent_requests: 5
  timeout_ms: 30000
  retry_attempts: 3
  retry_delay_ms: 1000
  user_agent: "RAG-Web-Scraper/1.0"
  respect_robots_txt: true
  follow_redirects: true

# Embedding Configuration
embedding_config:
  model_name: jinaai/ReaderLM-v2
  dimensions: 768
  batch_size: 32
  embedding_cache: true
  cache_ttl_seconds: 86400

# Metrics
metrics:
  enabled: true
  collect:
    - web_pages_scraped
    - words_processed
    - documents_added
    - embeddings_generated
    - index_build_time_seconds
    - search_queries_executed
    - retrieval_latency_ms
  output:
    path: /workspace/output/web_scrape_to_rag_metrics.json
    format: json
