---
workflow_id: hierarchical_logging
name: Hierarchical Logging Configuration
description: Demonstrates multi-level nested logging hierarchy with different output types

# Model Configuration
models:
  primary:
    provider: lmstudio
    model: "llama-3.2-3b-instruct"
    backend: vulkan
    gpu_layers: 32

  secondary:
    provider: ollama
    model: "llama3.2"
    backend: cpu

# Execution Mode
execution:
  mode: parallel
  memory:
    max_allocated_memory_mb: 4096
    model_memory_mb: 2048
    unload_unused: true

# Hierarchical Logging Configuration
logging:
  # Global logging configuration (highest level)
  global:
    level: debug
    detail: high
    output_type: chat
    format: json
    console: true
    file: true
    log_file: /workspace/logs/hierarchical_logging_global.log
    file_rotation:
      enabled: true
      max_size_mb: 100
      max_files: 10
    include_timestamps: true
    include_level: true
    include_source: true
    include_context: true

  # Workflow execution logging
  workflow_execution:
    level: info
    detail: medium
    output_type: log
    format: json
    console: false
    file: true
    log_file: /workspace/logs/workflow_execution.log
    include_timestamps: true
    include_level: true
    include_source: false
    include_context: false

  # Step execution logging (second level)
  step_execution:
    level: debug
    detail: high
    output_type: chat
    format: json
    console: true
    file: true
    log_file: /workspace/logs/step_execution.log
    include_timestamps: true
    include_level: true
    include_source: true
    include_context: true

  # Agent execution logging (third level)
  agent_execution:
    level: info
    detail: medium
    output_type: stateless_direct_io
    format: json
    console: false
    file: true
    log_file: /workspace/logs/agent_execution.log
    include_timestamps: true
    include_level: true
    include_source: true
    include_context: true

  # Tool execution logging (fourth level)
  tool_execution:
    level: debug
    detail: high
    output_type: log
    format: json
    console: true
    file: true
    log_file: /workspace/logs/tool_execution.log
    include_timestamps: true
    include_level: true
    include_source: true
    include_context: false

  # File operation logging (fifth level)
  file_operations:
    level: debug
    detail: very_high
    output_type: stateless_direct_io
    format: json
    console: false
    file: true
    log_file: /workspace/logs/file_operations.log
    include_timestamps: true
    include_level: true
    include_source: true
    include_context: true
    include_file_details: true
    include_size_info: true
    include_performance: true

  # API call logging (sixth level)
  api_calls:
    level: info
    detail: medium
    output_type: chat
    format: json
    console: true
    file: true
    log_file: /workspace/logs/api_calls.log
    include_timestamps: true
    include_level: true
    include_source: true
    include_context: true
    include_request_details: true
    include_response_details: true
    include_duration: true

  # State management logging (seventh level)
  state_management:
    level: debug
    detail: low
    output_type: log
    format: json
    console: false
    file: true
    log_file: /workspace/logs/state_management.log
    include_timestamps: true
    include_level: true
    include_source: false
    include_context: false
    include_state_changes: true
    include_memory_usage: false

  # Performance metrics logging (eighth level)
  performance_metrics:
    level: info
    detail: medium
    output_type: stateless_direct_io
    format: json
    console: false
    file: true
    log_file: /workspace/logs/performance_metrics.log
    include_timestamps: true
    include_level: true
    include_source: false
    include_context: false
    include_metrics: true
    include_thresholds: true

# Pipeline Definition
pipeline:
  # ========================================
  # Step 1: Agent with LLM Tool Execution
  # ========================================
  - step: analyze_codebase
    id: step_1
    model: "${models.primary}"
    input:
      prompt: |
        Analyze the Rust codebase for async patterns:

        Codebase path: /workspace/src

        Requirements:
        1. Scan all Rust files (*.rs)
        2. Identify async functions
        3. Identify async blocks
        4. Identify await points
        5. Identify tokio-specific patterns
        6. Generate summary statistics
        7. Generate detailed report

      agent_config:
        agent_id: rust_analyzer
        model: "${models.primary}"
        max_tokens: 2048
        temperature: 0.3
        max_iterations: 1

      tool_configs:
        - tool_name: rust_file_scanner
          output_type: chat
          detail: very_high

        - tool_name: async_pattern_detector
          output_type: log
          detail: very_high

    output:
      save_to: codebase_analysis
      format: json
      fields:
        - async_functions
        - async_blocks
        - await_points
        - statistics
        - report

  # ========================================
  # Step 2: Multiple Agents with Tools
  # ========================================
  - step: parallel_analysis
    id: step_2
    model: "${models.secondary}"
    input:
      prompt: |
        Perform parallel analysis on multiple aspects:

        Analysis tasks:
        1. Security review
        2. Performance review
        3. Documentation review
        4. Test coverage review

        For each task:
        - Use dedicated agent
        - Apply appropriate tools
        - Generate detailed reports
        - Include metrics and statistics

      agent_configs:
        - agent_id: security_reviewer
          model: "${models.secondary}"
          task: "Security analysis"
          tools: ["security_scanner", "vulnerability_detector"]
          output_type: chat
          detail: high

        - agent_id: performance_reviewer
          model: "${models.secondary}"
          task: "Performance analysis"
          tools: ["profiler", "benchmark"]
          output_type: chat
          detail: high

        - agent_id: documentation_reviewer
          model: "${models.primary}"
          task: "Documentation review"
          tools: ["doc_validator", "style_checker"]
          output_type: chat
          detail: high

        - agent_id: test_reviewer
          model: "${models.primary}"
          task: "Test coverage review"
          tools: ["test_runner", "coverage_analyzer"]
          output_type: chat
          detail: high

      tool_configs:
        - tool_name: security_scanner
          output_type: log
          detail: high
          include_vulnerabilities: true

        - tool_name: vulnerability_detector
          output_type: log
          detail: very_high
          include_exploit_details: true

        - tool_name: profiler
          output_type: stateless_direct_io
          detail: medium
          include_flamegraphs: true

        - tool_name: benchmark
          output_type: stateless_direct_io
          detail: medium
          include_benchmark_results: true

        - tool_name: doc_validator
          output_type: chat
          detail: high
          include_documentation_quality: true

        - tool_name: style_checker
          output_type: chat
          detail: high
          include_style_scores: true

        - tool_name: test_runner
          output_type: log
          detail: very_high
          include_test_results: true

        - tool_name: coverage_analyzer
          output_type: log
          detail: high
          include_coverage_percentages: true

    output:
      save_to: parallel_analysis_results
      format: json
      fields:
        - security_report
        - performance_report
        - documentation_report
        - test_report
        - overall_summary
    retry:
      max_attempts: 2
      backoff_strategy: exponential

  # ========================================
  # Step 3: File Operations with Detailed Logging
  # ========================================
  - step: generate_report_and_write_files
    id: step_3
    model: "${models.primary}"
    input:
      prompt: |
        Generate comprehensive analysis report and write files:

        Analysis results:
        ${step.step_2.output}

        Requirements:
        1. Generate executive summary (3-5 pages)
        2. Generate detailed analysis report (10-20 pages)
        3. Generate individual section reports
        4. Write all reports to files
        5. Create summary visualization
        6. Store metadata and timestamps
        7. Validate file writes
        8. Generate checksums

        File operations:
        - Create output directory structure
        - Write executive_summary.md
        - Write detailed_report.md
        - Write security_report.md
        - Write performance_report.md
        - Write documentation_report.md
        - Write test_report.md
        - Write analysis.json
        - Write metrics.json
        - Write checksums.txt

        Logging for each operation:
        - Log file creation with timestamp
        - Log file write completion
        - Log file size and checksum
        - Log operation duration
        - Log any errors

      file_operations:
        - operation: create_directory
          path: /workspace/output/reports
          recursive: true

        - operation: write
          file_path: /workspace/output/reports/executive_summary.md
          format: markdown
          encoding: utf-8
          pretty_print: true
          line_width: 80
          include_header: true
          header: "Executive Summary\nAnalysis Report\nGenerated: ${workflow.timestamp}\n\n"

        - operation: write
          file_path: /workspace/output/reports/detailed_report.md
          format: markdown
          encoding: utf-8
          pretty_print: true
          line_width: 80

        - operation: write
          file_path: /workspace/output/reports/security_report.json
          format: json
          encoding: utf-8
          pretty_print: true

        - operation: write
          file_path: /workspace/output/reports/performance_report.json
          format: json
          encoding: utf-8
          pretty_print: true

        - operation: write
          file_path: /workspace/output/reports/documentation_report.json
          format: json
          encoding: utf-8
          pretty_print: true

        - operation: write
          file_path: /workspace/output/reports/test_report.json
          format: json
          encoding: utf-8
          pretty_print: true

        - operation: write
          file_path: /workspace/output/reports/analysis.json
          format: json
          encoding: utf-8
          pretty_print: true

        - operation: write
          file_path: /workspace/output/reports/metrics.json
          format: json
          encoding: utf-8
          pretty_print: true

        - operation: write
          file_path: /workspace/output/reports/checksums.txt
          format: text
          encoding: utf-8
          include_checksums: true

    output:
      save_to: file_operations_result
      format: json
      fields:
        - files_created
        - files_written
        - total_size_bytes
        - checksums
        - operation_duration_seconds
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  # ========================================
  # Step 4: State Management and Checkpointing
  # ========================================
  - step: manage_state_and_checkpoints
    id: step_4
    model: "${models.primary}"
    input:
      prompt: |
        Manage workflow state and create checkpoints:

        Current workflow state:
        - Steps completed: 1-3
        - Analysis results: Available
        - Files created: Available

        Requirements:
        1. Save current state to checkpoint file
        2. Save intermediate results
        3. Create versioned state history
        4. Monitor memory usage
        5. Cleanup old checkpoints
        6. Validate state integrity

        State management operations:
        - Save step_1_result
        - Save step_2_result
        - Save step_3_result
        - Create checkpoint_1
        - Create checkpoint_2
        - Track state changes
        - Monitor memory usage
        - Validate state
        - Generate state report

      state_operations:
        - operation: save_state
          state_name: "step_1_completed"
          state_data: "${step.step_1.output}"
          file_path: /workspace/state/step_1_state.json

        - operation: save_state
          state_name: "step_2_completed"
          state_data: "${step.step_2.output}"
          file_path: /workspace/state/step_2_state.json

        - operation: save_state
          state_name: "step_3_completed"
          state_data: "${step.step_3.output}"
          file_path: /workspace/state/step_3_state.json

        - operation: create_checkpoint
          checkpoint_id: "checkpoint_1"
          description: "Post-step_3 analysis complete"
          state_snapshot: all
          metadata:
            - timestamp: "${workflow.timestamp}"
            - steps_completed: 3
            - total_duration_secs: "${workflow.step_1.duration + workflow.step_2.duration + workflow.step_3.duration}"

        - operation: create_checkpoint
          checkpoint_id: "checkpoint_2"
          description: "Mid-workflow checkpoint before final validation"
          state_snapshot: all
          metadata:
            - timestamp: "${workflow.timestamp}"
            - steps_completed: 3

        - operation: manage_checkpoints
          max_checkpoints: 10
          old_checkpoints_threshold: 7
          auto_cleanup: true

        - operation: validate_state
          validate_consistency: true
          validate_integrity: true
          validate_completeness: true

        - operation: generate_state_report
          format: json
          include_checkpoints: true
          include_history: true
          include_metrics: true

      state_config:
        state_directory: /workspace/state
        checkpoint_directory: /workspace/checkpoints
        max_state_snapshots: 100
        max_checkpoint_age_days: 30
        state_validation_enabled: true

    output:
      save_to: state_management_result
      format: json
      fields:
        - state_saved
        - checkpoints_created
        - checkpoint_ids
        - old_checkpoints_cleaned
        - state_report
        - state_integrity_status
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  # ========================================
  # Step 5: API Calls with Request/Response Logging
  # ========================================
  - step: api_call_workflow
    id: step_5
    model: "${models.primary}"
    input:
      prompt: |
        Execute API calls and log all interactions:

        API endpoints to call:
        - POST /api/analyze
        - POST /api/validate
        - POST /api/optimize

        Requirements:
        1. Make API calls with proper authentication
        2. Log all requests (headers, body, parameters)
        3. Log all responses (status, headers, body)
        4. Log request duration
        5. Log errors and exceptions
        6. Validate API responses
        7. Handle rate limiting
        8. Retry failed requests with backoff

        API call configuration:
        - base_url: https://api.example.com
        - timeout_ms: 30000
        - retry_attempts: 3
        - retry_delay_ms: 1000

      api_operations:
        - operation: post_request
          endpoint: "/api/analyze"
          method: POST
          headers:
            - Content-Type: application/json
            - Authorization: Bearer ${workflow.api_token}
          body:
            - data: "${step.step_2.output}"
            - model: "${models.primary.model}"
          log_request: true
          log_response: true
          validate_response: true
          expected_status: 200

        - operation: post_request
          endpoint: "/api/validate"
          method: POST
          headers:
            - Content-Type: application/json
            - Authorization: Bearer ${workflow.api_token}
          body:
            - report: "${step.step_3.output}"
            - include_full_data: false
          log_request: true
          log_response: true
          validate_response: true
          expected_status: 200

        - operation: post_request
          endpoint: "/api/optimize"
          method: POST
          headers:
            - Content-Type: application/json
            - Authorization: Bearer ${workflow.api_token}
          body:
            - recommendations: "${step.step_3.output}"
            - include_full_details: true
          log_request: true
          log_response: true
          validate_response: true
          expected_status: 200

        - operation: handle_rate_limiting
          detect: true
          backoff_strategy: exponential
          max_wait_ms: 60000
          notify: true

      api_config:
        base_url: https://api.example.com
        timeout_ms: 30000
        retry_attempts: 3
        retry_delay_ms: 1000
        rate_limiting:
          enabled: true
          max_requests_per_minute: 60
          default_backoff_ms: 1000

    output:
      save_to: api_call_result
      format: json
      fields:
        - requests_made
        - responses_received
        - request_logs
        - response_logs
        - api_errors
        - overall_status
    retry:
      max_attempts: 3
      backoff_strategy: exponential

# Retry Configuration
retry:
  default:
    max_attempts: 3
    backoff_strategy: exponential
    delay_ms: 1000
    on_failure: escalate_model

  escalation:
    fallback_models:
      - provider: ollama
        model: "llama3.2"
      - provider: llamacpp
        model: "/models/llama-3.2-3b.Q4_K_M.gguf"
        backend: vulkan

# Workflow Variables
workflow:
  workspace_path: /workspace
  output_path: /workspace/output
  state_path: /workspace/state
  checkpoint_path: /workspace/checkpoints
  logs_path: /workspace/logs
  api_token: ${workflow.api_token}
  timestamp: ${workflow.timestamp}

# Metrics Configuration
metrics:
  enabled: true
  collect:
    - total_step_duration_seconds
    - total_file_operations
    - total_api_calls
    - total_state_changes
    - total_checkpoints
    - total_errors
    - total_warnings
  output:
    path: /workspace/output/hierarchical_logging_metrics.json
    format: json

# Logging Summary
logging_summary:
  global_level: debug
  workflow_level: info
  step_level: debug
  agent_level: info
  tool_level: debug
  file_operation_level: debug
  api_call_level: info
  state_level: debug
  performance_level: info

  console_enabled:
    global: true
    workflow: false
    step: true
    agent: false
    tool: true
    file_operation: false
    api_call: true
    state: false
    performance: false

  file_enabled:
    global: true
    workflow: true
    step: true
    agent: true
    tool: true
    file_operation: true
    api_call: true
    state: true
    performance: true

  output_types:
    - chat
    - log
    - stateless_direct_io

  log_file_sizes:
    global: 100MB
    workflow: 50MB
    step: 50MB
    agent: 30MB
    tool: 50MB
    file_operation: 100MB
    api_call: 30MB
    state: 20MB
    performance: 30MB
