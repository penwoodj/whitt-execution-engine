apiVersion: agentic.workflow.schema/v1alpha1
kind: Schema
metadata:
  name: agentic-workflow-grouping
  description: |
    Documentation of natural abstraction hierarchies for 85+ agentic workflow step types.
    Organizes steps by 5 key grouping perspectives:
    1. Abstraction Hierarchy (concrete → meta)
    2. Functional Domain (what steps do)
    3. Decision Autonomy (how behavior is determined)
    4. Implementation Complexity (how hard to execute)
    5. Resource Boundness (what resources steps consume)
  owner: agentic-workflow-team
  version: v1alpha1

abstraction_hierarchy:
  level_1_concrete:
    name: "Execution Primitives"
    description: "Direct machine actions - lowest abstraction level"
    step_count: 42
    abstraction_type: "operational"
    steps:
      boundary:
        types: [start, pass, succeed, fail, cancel]
        description: "Workflow entry, exit, and termination points"
        examples:
          - "Start: Begin workflow execution"
          - "Pass: Forward data without work"
          - "Succeed: Successful termination"
          - "Fail: Explicit failure"
          - "Cancel: Aborted execution"
      data_flow:
        description: "Shape manipulation and validation"
        types: [parse, validate, normalize, transform, assign, merge, split, filter, chunk, summarize, template, serialize]
      execution:
        description: "External system interactions"
        types: [task, model, tool, api, db, io, code, search, retrieve, generate, notify]
      control_flow:
        description: "Execution orchestration"
        types: [choice, route, parallel, map, reduce, loop, race, fallback]
      time_event:
        description: "Temporal coordination"
        types: [wait, sensor, await_event, await_condition, schedule]
      delegation:
        description: "Control and data transfer"
        types: [subworkflow, child_workflow, subgraph, handoff, agent_tool, delegate, escalate]
      messaging:
        description: "Inter-workflow communication"
        types: [signal, update, query, callback, interrupt, approve, review, human_input]
      durability:
        description: "State persistence and recovery"
        types: [checkpoint, snapshot, cache, replay, fork, continue_as_new]
      queue_resource:
        description: "Capacity management"
        types: [enqueue, dispatch, acquire_slot, release_slot]
      observability:
        description: "Monitoring and logging"
        types: [log, trace, metric, stream, publish, audit]
    diagrams:
      layer_structure: |
        ┌─────────────────────────────────────────────────────────────┐
        │                  LAYER 1: Concrete Operations           │
        │                     (Execution Primitives)               │
        │                      ┌──────┐                               │
        │                      │ l1   │                               │
        │                      │ ┌────┐┐                               │
        │                      │ │l2  │┐                               │
        │                      │ │    │└───────────┐───────────────────────┐│
        │                      │ │    │             │ l4: Semantic         ││
        │                      │ │    │             │   Phases           ││
        │                      │ │    │             └───────────────────────┘│
        │                      │ │    │             │ l5: Meta-           ││
        │                      │ │    │             │   Orchestration      ││
        │                      │ │    │             └───────────────────────┘│
        │                      │ │    └───────────────────────────────────┘│
        │                      │ └───────────────────────────────────────────┘│
        │                      └──────────────────────────────────────────────┘│
        │                                                       │
        │                   ↑ Higher abstraction, more policy       │
        │                   ↑ Lower abstraction, more concrete     │
        │                                                       │
        └─────────────────────────────────────────────────────────────┘
      abstraction_flow: |
        CONCRETE (l1) ────────────────────────> SEMI-ABSTRACT (l2)
                   Direct machine              LLM reasoning
                   operations                 decisions
        │                                             │
        ▼                                             ▼
        REUSABLE PATTERNS (l3)                    BUSINESS PHASES (l4)
           Named combinations of           Human-meaningful
           l1+l2 steps               workflow stages
        │                                             │
        ▼                                             ▼
                    META-ORCHESTRATION (l5)
                   System governance
                   and evolution

  level_2_cognitive:
    name: "Agent Primitives"
    description: "LLM-powered decision processes"
    step_count: 15
    abstraction_type: "declarative"
    steps:
      context:
        types: [intake_context, intent_classify, extract, ambiguity_check]
        description: "Understanding user intent and gathering context"
        interaction_with_l1:
          - "parse: Extract structure from raw input"
          - "validate: Ensure input meets schema"
          - "template: Format context for LLM"
      planning:
        types: [plan_step, decompose, tool_select, model_select, agent_select]
        description: "Decomposing goals and selecting approaches"
        interaction_with_l1:
          - "split: Break into subtasks"
          - "choice: Select execution path"
          - "route: Dispatch to specialist"
      reasoning:
        types: [reason, reflect, critique, rank, self_check]
        description: "Deliberation and quality assessment"
        interaction_with_l1:
          - "model: Generate thought process"
          - "task: Execute reasoning chain"
          - "loop: Iterate on analysis"
      memory:
        types: [memory_recall, memory_write]
        description: "Knowledge and context persistence"
        interaction_with_l1:
          - "retrieve: Fetch relevant history"
          - "cache: Store learned information"
      guardrails:
        types: [policy_check, grounding_check]
        description: "Safety and compliance constraints"
        interaction_with_l1:
          - "validate: Check before action"
          - "fail: Halt on violation"
      multi_agent:
        types: [handoff, agent_tool, delegate, escalate]
        description: "Coordination across agents"
        interaction_with_l1:
          - "signal: Notify other agent"
          - "subworkflow: Spawn specialist"
          - "delegate: Assign subtask"
    diagrams:
      cognitive_loop: |
        ┌─────────────────────────────────────────────────────────┐
        │                 LLM COGNITIVE LOOP                 │
        │                      ┌──────────┐                 │
        │                      │Perceive│                 │
        │                      │  ↓      │                 │
        │                      │┌───────┐│                 │
        │                      ││Reason │                 │
        │                      ││  ↓    │                 │
        │                      ││┌────┐│                 │
        │                      │││Act  │◀─────────────────┐│
        │                      │││↓    ││         ↓         ││
        │                      │││Observe──────────────→│Learn  │
        │                      ││└──────┘│                 │
        │                      └──────────┘                 │
        │                                                │
        └─────────────────────────────────────────────────────────┘
      decision_points: |
        PERCEIVE → Intent Classification
                  ↓
        CONTEXT PACK → Memory Recall + Retrieval
                  ↓
        PLAN → Decompose → Select Tools/Agents
                  ↓
        REASON → Critique → Self-Check
                  ↓
        ACT → Tool/Agent Execution
                  ↓
        OBSERVE → Result Evaluation
                  ↓
        REFLECT → Memory Write + Policy Update

  level_3_composite:
    name: "Workflow Patterns"
    description: "Reusable arrangements of l1+l2 steps"
    step_count: 8
    abstraction_type: "compositional"
    steps:
      sequential_pattern:
        types: [sequential_pattern]
        description: "Linear chain of steps"
        composed_of: ["l1:choice", "l1:parallel", "l2:model", "l1:tool"]
        pattern_flow: |
          step1 → step2 → step3 → ... → stepN
          ↓
          (deterministic, ordered execution)
      map_reduce_pattern:
        types: [map_reduce_pattern]
        description: "Scatter-gather across items"
        composed_of: ["l1:map", "l1:reduce", "l2:reason"]
        pattern_flow: |
          [item1, item2, item3, ...]
            ↓
          ┌─────┬─────┬─────┐
          │Map  │Map  │Map  │Map ││
          │→item│→item│→item│→item│
          └─────┴─────┴─────┘
                  ↓
               Reduce (aggregate results)
      planner_executor_pattern:
        types: [planner_executor_pattern]
        description: "Plan then execute with replanning"
        composed_of: ["l2:plan_step", "l2:decompose", "l1:map", "l1:loop", "l2:reason"]
        pattern_flow: |
          UNDERSTAND → PLAN → EXECUTE
                     ↓
          (Plan creates task list)
                     ↓
          Execute tasks sequentially or in parallel
                     ↓
          MONITOR for failures
                     ↓
          (On failure: Replan)
      react_pattern:
        types: [react_pattern]
        description: "Think-Act-Observe loop"
        composed_of: ["l2:reason", "l1:tool", "l2:memory_write", "l1:loop"]
        pattern_flow: |
          ┌───────────────────────┐
          │  REACT Loop          │
          │                       │
          │  ┌─────┐─────────────┐│
          │ │Think │              ││
          │ │ ↓    │              ││
          │ │┌────┐│─────────────┐│
          │ ││Act  │◀─────────→││
          │ ││↓    ││      ↓     ││
          │ ││Observe────────────→││
          │ │└──────┘│      ↑     ││
          │ │              │◀───────┘│
          │ └───────────────┘│
          │                  (continue until done)  │
          └───────────────────────┘
      router_specialist_pattern:
        types: [router_specialist_pattern]
        description: "Classify and route to specialist"
        composed_of: ["l2:intent_classify", "l2:agent_select", "l1:choice", "l2:handoff"]
        pattern_flow: |
          REQUEST
             ↓
          Classify Intent
             ↓
          Select Specialist Agent
             ↓
          Transfer Control (Handoff)
             ↓
          [Agent Executes]
             ↓
          Return Result
      maker_checker_pattern:
        types: [maker_checker_pattern]
        description: "Generate and iteratively improve"
        composed_of: ["l1:model", "l2:critique", "l1:loop", "l2:revise"]
        pattern_flow: |
          ┌───────────────────────────────┐
          │  MAKER-CHECKER LOOP      │
          │                           │
          │  Maker ──┬──────────────→│ Checker
          │    (generate)      ↓      (evaluate)
          │                      │      │
          │    Pass? No ────────┐│
          │                      │      │       │       │
          │                      │◀─────┘│       ↓       │
          │                      │         └───→│ Revise →│
          │                      │                 │       │
          │                      │                 └───────┘│
          │                      │                         ↓
          │                    (Max iterations)
          │                      │                Yes? Done
          └───────────────────────────────┘
      supervisor_swarm_pattern:
        types: [supervisor_swarm_pattern]
        description: "Coordinator with worker agents"
        composed_of: ["l2:reason", "l2:decompose", "l1:map", "l2:handoff", "l1:parallel"]
        pattern_flow: |
          REQUEST
             ↓
          ┌─────────────────────────────┐
          │  SUPERVISOR            │
          │                           │
          │  Understand              │
          │  Decompose              │
          │  Dispatch Workers         │
          └──────────────────────────┬──┘│
                  ↓                  │
          ┌───────────────────┐          │
          │   Workers (N)     │◀─────────┘│
          │                   │          │
          │  Execute Tasks    │          │
          │  Report Results    │          │
          └───────────────────┘          │
                  ↓                  │
          Aggregation + Decision           │
      monitor_act_pattern:
        types: [monitor_act_pattern]
        description: "Observe-decide-act loop"
        composed_of: ["l1:schedule", "l1:sensor", "l2:reason", "l1:tool", "l1:loop"]
        pattern_flow: |
          ┌─────────────────────────────┐
          │  MONITOR-ACT LOOP       │
          │                           │
          │  ┌─────┐  ┌──────┐   │
          │ │Timer │  │Sensor │   │
          │ │ ↓    │  │ ↓    │   │
          │ │      └───→│       │   │
          │ └─────────────┘        ↓   │
          │     Observe State         │
          │              ↓            │
          │  Decide Action Needed?      │
          │              ↓            │
          │     Execute (if needed)   │
          │              ↑            │
          └───────────────────────────┘

  level_4_semantic:
    name: "Semantic Phases"
    description: "Human-meaningful workflow stages"
    step_count: 10
    abstraction_type: "domain-specific"
    phases:
      intake_phase:
        types: [intake_phase]
        description: "Receive and validate incoming request"
        composed_of: ["l1:start", "l2:intake_context", "l1:validate"]
        business_meaning: "What does the user want?"
        deliverable: "Validated request with metadata"
      understand_phase:
        types: [understand_phase]
        description: "Interpret request and infer requirements"
        composed_of: ["l2:intent_classify", "l2:extract", "l2:ambiguity_check"]
        business_meaning: "What are we trying to solve?"
        deliverable: "Structured requirements and constraints"
      prepare_context_phase:
        types: [prepare_context_phase]
        description: "Gather relevant knowledge and context"
        composed_of: ["l2:memory_recall", "l1:retrieve", "l2:context_pack"]
        business_meaning: "What information do we need?"
        deliverable: "Context package for next phase"
      plan_phase:
        types: [plan_phase]
        description: "Decompose into executable steps"
        composed_of: ["l2:decompose", "l2:plan_step", "l2:tool_select"]
        business_meaning: "How will we accomplish the goal?"
        deliverable: "Task plan with dependencies"
      execute_phase:
        types: [execute_phase]
        description: "Execute the planned steps"
        composed_of: ["l1:task", "l1:tool", "l1:api", "l1:db", "l2:reason"]
        business_meaning: "Do the work"
        deliverable: "Execution results and artifacts"
      verify_phase:
        types: [verify_phase]
        description: "Validate outputs and quality"
        composed_of: ["l1:validate", "l2:policy_check", "l2:grounding_check"]
        business_meaning: "Did we do it correctly?"
        deliverable: "Validation report and findings"
      refine_phase:
        types: [refine_phase]
        description: "Iterative improvement"
        composed_of: ["l2:revise", "l1:loop", "l1:map"]
        business_meaning: "Can we do it better?"
        deliverable: "Improved results"
      decide_phase:
        types: [decide_phase]
        description: "Human approval or escalation"
        composed_of: ["l1:approve", "l1:human_input", "l2:escalate"]
        business_meaning: "Should we proceed or escalate?"
        deliverable: "Approved decision or escalation path"
      deliver_phase:
        types: [deliver_phase]
        description: "Present final results"
        composed_of: ["l1:generate", "l1:notify", "l2:memory_write"]
        business_meaning: "Here's what you asked for"
        deliverable: "Final answer or delivered artifact"
      learn_phase:
        types: [learn_phase]
        description: "Capture lessons and update knowledge"
        composed_of: ["l2:memory_write", "l5:evaluation_program", "l2:reflect"]
        business_meaning: "What did we learn for next time?"
        deliverable: "Updated knowledge and metrics"
    diagrams:
      semantic_flow: |
        ┌─────────────────────────────────────────────────────────────┐
        │              SEMANTIC WORKFLOW LIFECYCLE            │
        │                                                       │
        │  ┌──────┐  ┌────────┐  ┌────────────┐  ┌──────┐   │
        │  │Intake│  │Understand│  │Prepare Context│  │Plan  │   │
        │  │ →    │  →       │  →         │  →    │   │
        │  └──────┘  └────────┘  └──────────────┘  └──────┘   │
        │                       ↓                              │
        │                  ┌──────────────────┐              │
        │                  │    Execute        │              │
        │                  │  ┌──────┬───────┐│              │
        │                  │  │Task  │Tool  │Model││              │
        │                  │  └──────┴───────┘│              │
        │                  │        ↓        │              │
        │                  └─────────────────┘              │
        │                       ↓                              │
        │                  ┌──────────────────┐              │
        │                  │    Verify         │              │
        │                  │                  │              │
        │                  └─────────────────┘              │
        │                       ↓                              │
        │                  ┌───────────────────────┐         │
        │                  │  Decide → Deliver   │         │
        │                  │  (human-in-the-loop) │         │
        │                  └───────────────────────────┘         │
        │                       ↓                              │
        │                  ┌───────────────────┐              │
        │                  │    Learn              │              │
        │                  │                  │              │
        │                  └─────────────────┘              │
        └─────────────────────────────────────────────────────┘

  level_5_meta:
    name: "Meta-Orchestration"
    description: "System-level governance and optimization"
    step_count: 10
    abstraction_type: "meta-operational"
    controllers:
      governance:
        types: [governance]
        description: "Policy enforcement across all layers"
        scope: "Applies to: l1, l2, l3, l4, l5"
        governance_domains:
          - security_policy: "Access control and sandboxing"
          - guardrail_policy: "Content and behavior constraints"
          - approval_policy: "Human approval requirements"
          - budget_policy: "Resource and cost limits"
      controls: |
        ┌─────────────────────────────────────────────────────┐
        │              GOVERNANCE LAYER                    │
        │                                                       │
        │  ┌─────────┐  ┌──────────┐  ┌─────────────┐  │
        │  │Security  │  │Guardrails │  │Approval    │  │
        │  │Policies │  │Policies   │  │Policies   │  │
        │  └─────────┘  └──────────┘  └───────────────┘  │
        │                       ↓                              │
        │                  All steps must comply                │
        └─────────────────────────────────────────────────────┘
      budget_manager:
        types: [budget_manager]
        description: "Resource allocation and limits"
        scope: "Applies to: l1, l2, l3, l4"
        managed_resources:
          - tokens: "LLM usage budget"
          - cost: "Monetary spend limits"
          - time: "Execution duration limits"
          - tool_calls: "Tool invocation limits"
        allocation: |
          ┌─────────────────────────────────────────────────────┐
          │          BUDGET MANAGER                       │
          │                                                   │
          │  ┌────────┬────────┬────────┬────────┬────────┐│
          │  │Tokens│Cost │Time │Tools │Parallel││
          │  │Limit │Limit │Limit│Limit │  Limit ││
          │  └────────┴────────┴────────┴────────┴────────┘│
          │                                                   │
          │  Dynamic allocation based on priority          │
          └─────────────────────────────────────────────────────┘
      scheduler_controller:
        types: [scheduler_controller]
        description: "Execution queuing and dispatch"
        scope: "Applies to: l1, l3, l5"
        strategies:
          - fifo: "First-in-first-out"
          - priority: "Priority-based queuing"
          - edf: "Earliest deadline first"
          - fair_share: "Resource fair sharing"
        queuing: |
          ┌─────────────────────────────────────────────────────┐
          │          SCHEDULER CONTROLLER                  │
          │                                                   │
          │  ┌──────┐  ┌──────────┐  ┌─────────────┐  │
          │  │Queue │  │Dispatch  │  │Resource Pools│  │
          │  └──────┘  └──────────┘  └───────────────┘  │
          │                                                   │
          │  Match work to available resources         │
          └─────────────────────────────────────────────────────┘
      topology_manager:
        types: [topology_manager]
        description: "Resource pool management and routing"
        scope: "Applies to: l1 resources"
        pools:
          - compute_pools: "CPU/GPU capacity"
          - worker_pools: "Task execution workers"
          - agent_pools: "Specialist agents"
          - memory_stores: "Vector DBs and caches"
        topology: |
          ┌─────────────────────────────────────────────────────┐
          │          TOPOLOGY MANAGER                      │
          │                                                   │
          │  ┌───────────────────────────────────────────┐ │
          │  │  Resource Pools (Agents, Workers, etc) │ │
          │  └───────────────────────────────────────────┘ │
          │                   ↓                             │
          │  ┌───────────────────────────────────────────┐ │
          │  │  Capability Router (Dynamic Routing)       │ │
          │  └───────────────────────────────────────────┘ │
          │                   ↓                             │
          │  Match requests to best available resource   │
          └─────────────────────────────────────────────────────┘
      evaluation_program:
        types: [evaluation_program]
        description: "Assessment of workflow outcomes"
        scope: "Applies to: l2, l3, l4 outputs"
        evaluation_types:
          - quality: "Output quality metrics"
          - efficiency: "Time and resource usage"
          - accuracy: "Task correctness"
          - safety: "Policy compliance"
        evaluation: |
          ┌─────────────────────────────────────────────────────┐
          │          EVALUATION PROGRAM                   │
          │                                                   │
          │  ┌──────────┐  ┌───────────────────┐  ┌───────┐  │
          │  │Evaluator │  │Subjects (Runs/Steps) │ │Criteria│  │
          │  └──────────┘  └───────────────────────┘  └───────┘  │
          │                   ↓                    ↓        ↓    │
          │              Collect metrics and scores            │
          └─────────────────────────────────────────────────────┘
      provenance_controller:
        types: [provenance_controller]
        description: "Evidence tracking and audit trails"
        scope: "Applies to: l1, l2, l3, l4, l5"
        evidence_types:
          - citations: "Source references"
          - tool_outputs: "Execution results"
          - retrieval_hits: "Context retrieval evidence"
          - human_edits: "Human modifications"
          - model_versions: "LLM models used"
          - state_diffs: "State changes over time"
        tracking: |
          ┌─────────────────────────────────────────────────────┐
          │          PROVENANCE CONTROLLER                 │
          │                                                   │
          │  ┌───────────────────────────────────────────┐ │
          │  │   All Step Executions                │ │
          │  └───────────────────────────────────────────┘ │
          │                   ↓                             │
          │  ┌───────────────────────────────────────────┐ │
          │  │   Capture Evidence (citations, outputs) │ │
          │  └───────────────────────────────────────────┘ │
          │                   ↓                             │
          │  ┌───────────────────────────────────────────┐ │
          │  │   Build Audit Trail                   │ │
          │  └───────────────────────────────────────────┘ │
          └─────────────────────────────────────────────────────┘
      experiment_controller:
        types: [experiment_controller]
        description: "A/B testing and variant management"
        scope: "Applies to: l1, l2, l3 configurations"
        experiment_dimensions:
          - prompt_variants: "Different system prompts"
          - model_variants: "LLM models or configurations"
          - tool_variants: "Different tool sets or parameters"
          - routing_variants: "Different specialist selection"
        experimentation: |
          ┌─────────────────────────────────────────────────────┐
          │          EXPERIMENT CONTROLLER                 │
          │                                                   │
          │  ┌────────┬────────┬────────┬────────┬────────┐ │
          │  │Var A│Var B│Var C│Var D│... │  │
          │  └────────┴────────┴────────┴────────┴────────┘ │  │
          │                   ↓                              │
          │  ┌───────────────────────────────────────────┐   │
          │  │  Traffic Split (e.g., 90/10)     │   │
          │  └───────────────────────────────────────────┘   │
          │                   ↓                              │
          │  ┌───────────────────────────────────────────┐   │
          │  │  Collect Metrics (quality, latency)   │   │
          │  └───────────────────────────────────────────┘   │
          │                   ↓                              │
          │           Select Winner and Scale            │
          └─────────────────────────────────────────────────────┘
      optimization_controller:
        types: [optimization_controller]
        description: "Automatic tuning of parameters"
        scope: "Applies to: l1, l2, l3, l4, l5"
        optimization_targets:
          - quality: "Output quality metrics"
          - latency: "Response time optimization"
          - cost: "Resource cost minimization"
          - safety: "Compliance adherence"
          - throughput: "Work completion rate"
        knobs:
          - model_temperature: "Creativity control"
          - max_tokens: "Output length control"
          - concurrency_level: "Parallel execution degree"
          - cache_ttl: "Cache duration tuning"
        optimization: |
          ┌─────────────────────────────────────────────────────┐
          │          OPTIMIZATION CONTROLLER                │
          │                                                   │
          │  ┌───────────────────────────────────────────┐ │
          │  │  Current Configuration              │  │
          │  └───────────────────────────────────────────┘ │
          │                   ↓                             │
          │  ┌───────────────────────────────────────────┐ │
          │  │  Run Evaluation (quality, speed, cost) │ │
          │  └───────────────────────────────────────────┘ │
          │                   ↓                              │
          │  ┌───────────────────────────────────────────┐ │
          │  │  Adjust Knobs (guided by constraints)  │ │
          │  └───────────────────────────────────────────┘ │
          │                   ↓                              │
          │           Continue Tuning Loop                 │
          └─────────────────────────────────────────────────────┘
      memory_compactor:
        types: [memory_compactor]
        description: "Long-term memory hygiene and pruning"
        scope: "Applies to: l2 memory namespaces"
        compaction_strategies:
          - summarize: "Aggregate old memories"
          - dedupe: "Remove duplicates"
          - evict_lru: "Remove least recently used"
          - evict_low_score: "Remove low-importance items"
          - merge_facts: "Combine related facts"
          - archive_old: "Move to cold storage"
        hygiene: |
          ┌─────────────────────────────────────────────────────┐
          │          MEMORY COMPACTOR                      │
          │                                                   │
          │  ┌───────────────────────────────────────────┐ │
          │  │  Active Memory (Recent, High Score)    │ │
          │  └───────────────────────────────────────────┘ │
          │                   ↓                             │
          │  ┌───────────────────────────────────────────┐ │
          │  │  Apply Compaction Strategy             │ │
          │  └───────────────────────────────────────────┘ │
          │                   ↓                             │
          │  ┌───────────────────────────────────────────┐ │
          │  │  Pruned Memory (Compact, Relevant)   │ │
          │  └───────────────────────────────────────────┘ │
          └─────────────────────────────────────────────────────┘

cross_layer_interactions:
  l1_to_l2:
    description: "Concrete steps enabling agent cognition"
    interactions:
      - "model: Provides LLM for reasoning"
      - "tool: Execution capability for agent actions"
      - "api/db/io: Information sources for context packing"
      - "validate: Ensure inputs meet LLM expectations"
      - "transform/format: Shape data for LLM consumption"
  l2_to_l1:
    description: "Agent decisions driving concrete execution"
    interactions:
      - "reason/plan_step/decompose: Decide what to do"
      - "tool_select/model_select: Choose execution resources"
      - "intent_classify: Understand workflow intent"
      - "handoff/agent_tool/delegate: Transfer to other agents"
  l2_to_l3:
    description: "Agent primitives composed into reusable patterns"
    interactions:
      - "planner_executor_pattern: Agent planning in pattern context"
      - "react_pattern: Agent reasoning loop in pattern context"
      - "router_specialist_pattern: Agent selection in pattern context"
      - "maker_checker_pattern: Agent iteration in pattern context"
  l1_to_l3:
    description: "Concrete steps as building blocks of patterns"
    interactions:
      - "parallel: Concurrent step execution in patterns"
      - "map/loop: Iterative patterns using l1 primitives"
      - "choice/route: Pattern-level decision points"
  l3_to_l4:
    description: "Patterns implementing business phases"
    interactions:
      - "sequential_pattern: Implements linear phase execution"
      - "map_reduce_pattern: Implements batch processing phases"
      - "monitor_act_pattern: Implements long-running operations"
  l4_to_l5:
    description: "Semantic phases governed by meta-controllers"
    interactions:
      - "governance: Applies policies across all phases"
      - "budget_manager: Resource limits per phase"
      - "evaluation_program: Measures phase outcomes"
      - "optimization_controller: Tunes phase parameters"
  l5_to_all:
    description: "Meta-orchestration governs entire system"
    interactions:
      - "All layers subject to governance policies"
      - "Budget limits apply across all execution"
      - "Evaluation measures l1-l4 outcomes"
      - "Provenance tracking spans all layers"
