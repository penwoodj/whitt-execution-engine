          - final_outcome

          # --- File Operations ---
          - code_file_written
          - documentation_file_written
          - validation_report_written
          - metrics_file_written
          - backup_created
          - file_path
          - file_operation
          - output_file
          - documentation_file
          - backup_file
          - file_size
          - file_encoding
          - archive_created

          # --- Code/Validation/Check outputs ---
          - code_refactored
          - refactored_code
          - code_quality_score
          - validation_results
          - validation_report
