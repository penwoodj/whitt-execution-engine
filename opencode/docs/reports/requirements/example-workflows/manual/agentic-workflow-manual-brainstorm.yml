        format: json
        fields:
        
          # --- System Initialization & Status ---
          - system_initialized
          - state_loaded
          - workspace_configured
          - sub_agent_contexts_initialized
          - event_channels_ready
          - checkpoint_loaded
          - checkpoint_saved
