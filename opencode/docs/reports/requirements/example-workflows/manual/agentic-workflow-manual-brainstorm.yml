  user_inputs: # support each of these features in a modular way but I want an text area than can be dynamically populated by a workflow variable or possibly dynamically as a specified agent tool, with an enter confirm and shift+enter new line ability that the user can edit the text of or add an answer to, with an optional confirm or cancle button with esc operating as the cancel if the cancel button isn't specified I'd also like a modular support for a separater vertical UI lines, labels, multiple choice and multi select labeled buttons with a confirm button and optional input option for either multiple choice or multi select similar to opencode, and I'd want to be able to specify navigation around tabs for multiple inputs or multiple pannels for categorizing question UIs.  user_inputs if specified on path agentic_workflow.user_inputs the user response are accessible by workflow interpolated string variable path, including a full text aggregation with metadata var.  if specified on the step there is configuration around when to ask different question blocks based on the steps objective, and a user_inputs can just the only thing in a step as well which if not configured step user_inputs pauses for user input at the beginning of the step is specified in step.  by default workflow level user inputs alwasy run at the beginning.
  steps:
    initialize_system: # name and id
      generative_entity: "${models.primary_analyzer}" # Any Non-Deterministic IO: Can be an agent or model name hardcoded or dynamically populated from a workflow variable or can be dynamically populated with a .yml file path containing agent or model configuration.  will have a workflow parsing error with helpfull details on how to resolve the issue around the sub generative_entity configuration in terms of schema
      model_overrides:
        # Any property available on that model, excluding things like name and host, if generative_entity is a model/basic agent
      prompt: |
          Initialize comprehensive AI code refactoring system:

          Requirements:
          1. Load or initialize system state 
          2. Check for existing checkpoints
          3. Configure workspace
          4. Setup event propagation channels
          5. Initialize sub-agent contexts
          6. Configure metrics collection
          7. Setup file backup system

          System configuration:
          - Workspace: /workspace
          - Checkpoint directory: ./workspace/checkpoints
          - Backup directory: ./workspace/backups
          - Log directory: ./workspace/logs
          - Output directory: ./workspace/output
          - Metrics directory: ./workspace/metrics
          - Knowledge base directory: ./workspace/rag/knowledge_base

          State management:
          - Load existing state if available
          - Initialize checkpoint system
          - Setup versioning
          - Configure auto-save intervals

          Output:
          - system_initialized: boolean
          - state_loaded: boolean
          - workspace_configured: boolean
          - sub_agent_contexts_initialized: boolean
          - event_channels_ready: boolean
      
      output:
