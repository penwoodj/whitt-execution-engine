      retry:
        condition: "..." # if not present then always retry if this substructure is on this step. if retry is not present on a step other default retry confugration takes place
        max_attempts: 3
        backoff: exponential # or linear
        delay_ms: 1000
        base_ms: 1000
        max_ms: 30000
        jitter: 0.2
        level: full_workflow_unload_reload # Level to Retry at in response to the conditional evaluating to true during the hook step - enum workflow_unload | workflow_restart | step_unload | step_restart | prompt_restart | tools_retry |
        adjustment_strategy: loosen_tolerance
        tolerance_adjustment: 0.15
        adjust_interdependencies: false
        checkpoint_after_retry: true





# Pipeline Definition
pipeline:
  # Step 1: System Initialization and State Load
  - step: initialize_system
    id: step_1
    model: "${models.primary_analyzer}"
    agent:
      limited_tools: ["grep"] # replaces agent tools if specified
      additional_tools: ["cd"] # adds tools to agent
    input:
      prompt: |
        Initialize comprehensive AI code refactoring system:

        Requirements:
        1. Load or initialize system state
        2. Check for existing checkpoints
        3. Configure workspace
        4. Setup event propagation channels
        5. Initialize sub-agent contexts
        6. Configure metrics collection
        7. Setup file backup system

        System configuration:
        - Workspace: /workspace
        - Checkpoint directory: ./workspace/checkpoints
        - Backup directory: ./workspace/backups
        - Log directory: ./workspace/logs
        - Output directory: ./workspace/output
        - Metrics directory: ./workspace/metrics
        - Knowledge base directory: ./workspace/rag/knowledge_base

        State management:
        - Load existing state if available
        - Initialize checkpoint system
        - Setup versioning
        - Configure auto-save intervals

        Output:
        - system_initialized: boolean
        - state_loaded: boolean
        - workspace_configured: boolean
        - sub_agent_contexts_initialized: boolean
        - event_channels_ready: boolean

      workspace_path: "/workspace"
      state_config:
        checkpoint_directory: "./workspace/checkpoints"
        versioning_enabled: true
        auto_save_interval_secs: 60

    output:
      save_to: system_initialization
      format: json
      fields:
        - initialized
        - state_snapshot
        - workspace_structure
        - agent_contexts

    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # Step 2: Branch Decision - Initial Assessment
  - step: assess_system_state
    id: step_2
    model: "${models.secondary_validator}"
    input:
      prompt: |
        Assess system state and determine execution strategy:

        System initialization results:
        ${step.step_1.output}

        Conditions to evaluate:
        1. Is workspace properly configured?
        2. Are all sub-workflows available?
        3. Is there existing state to resume?
        4. Is system memory sufficient?

        Branching logic (strict yes/no):
        IF workspace configured AND sub-workflows available:
          THEN proceed with parallel sub-agent execution
          Answer: "Decision: parallel"

        IF state exists and valid:
          THEN resume from checkpoint
          Answer: "Decision: resume"

        IF memory insufficient:
          THEN defer execution
          Answer: "Decision: defer"

        IF sub-workflows missing:
          THEN fail with configuration error
          Answer: "Decision: fail"

        Output:
        - decision: "parallel"|"resume"|"defer"|"fail"
        - execution_mode: "parallel"|"serial"
        - sub_agents_to_execute: []
        - resume_checkpoint: optional

      strict_yes_no_required: true
      system_state: "${step.step_1.output}"

    output:
      save_to: initial_assessment
      format: json
      fields:
        - decision
        - execution_mode
        - sub_agents_to_execute
        - resume_checkpoint
        - reasoning

    branches:
      - branch_id: "parallel_execution"
        next_step: step_3_parallel
        description: "Execute sub-agents in parallel"
        enabled_by: "initial_assessment.decision == 'parallel'"

      - branch_id: "resume_execution"
        next_step: step_3_resume
        description: "Resume from checkpoint"
        enabled_by: "initial_assessment.decision == 'resume'"

      - branch_id: "defer_execution"
        next_step: step_defer
        description: "Defer execution due to resource constraints"
        enabled_by: "initial_assessment.decision == 'defer'"

      - branch_id: "fail_execution"
        next_step: step_fail
        description: "Configuration error, fail workflow"
        enabled_by: "initial_assessment.decision == 'fail'"

  # Step 3A: Parallel Sub-Agent Execution
  - step: execute_parallel_sub_agents
    id: step_3_parallel
    model: "${models.primary_analyzer}"
    parallel_group: sub_agent_execution
    max_parallel: 4
    input:
      prompt: |
        Execute all sub-agents in parallel for comprehensive code refactoring:

        Initial assessment:
        ${step.step_2.output}

        Sub-agents to execute:
        1. code_analyzer_sub → code_analysis_workflow
           - Analyze codebase structure
           - Identify async patterns
           - Calculate code quality metrics
           - Generate analysis report

        2. doc_researcher_sub → doc_research_workflow
           - Research relevant documentation
           - Fetch from multiple sources
           - Validate documentation relevance
           - Store in knowledge base

        3. refactor_generator_sub → refactor_generation_workflow
           - Generate refactor suggestions
           - Use convergence loops
           - Interdepend on code analysis results
           - Generate code diffs

        4. code_validator_sub → code_validation_workflow
           - Validate refactored code
           - Run tests
           - Check lint
           - Interdepend on refactor results

        5. doc_generator_sub → doc_generation_workflow
           - Generate documentation
           - Use RAG knowledge base
           - Interdepend on doc research results
           - Validate documentation completeness

        6. knowledge_base_sub → rag_knowledge_base_workflow
           - Build RAG knowledge base
           - Generate embeddings
           - Create similarity index
           - Interdepend on doc research results

        Execution requirements:
        1. Spawn 4 sub-agents simultaneously
        2. Each sub-agent runs validation loops
        3. Each sub-agent checks interdependencies
        4. Validation results propagate via events
        5. Interdependency failures propagate between sub-agents
        6. Top-level orchestration aggregates all results
        7. State checkpoints saved at intervals

        Event flow:
        - sub-workflow completes → validation_result event → orchestration
        - interdependency check fails → interdependent_failure event → related sub-agents
        - orchestration receives all results → aggregate and evaluate
        - checkpoint saved → state_saved event → all sub-agents

      sub_agents:
        - agent_id: code_analyzer_sub
          workflow_ref: code_analysis_workflow
          validation_config: "${sub_workflows[0].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[0].interdependent_validations}"

        - agent_id: doc_researcher_sub
          workflow_ref: doc_research_workflow
          validation_config: "${sub_workflows[1].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[1].interdependent_validations}"

        - agent_id: refactor_generator_sub
          workflow_ref: refactor_generation_workflow
          validation_config: "${sub_workflows[2].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[2].interdependent_validations}"

        - agent_id: code_validator_sub
          workflow_ref: code_validation_workflow
          validation_config: "${sub_workflows[3].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[3].interdependent_validations}"

        - agent_id: doc_generator_sub
          workflow_ref: doc_generation_workflow
          validation_config: "${sub_workflows[4].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[4].interdependent_validations}"

        - agent_id: knowledge_base_sub
          workflow_ref: rag_knowledge_base_workflow
          validation_config: "${sub_workflows[5].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[5].interdependent_validations}"

      event_handling:
        on_validation_result:
          - aggregate_at_top_level: true
          - propagate_to_dependents: true
          - log_result: true

        on_interdependent_failure:
          - notify_dependent_sub_agents: true
          - adjust_validation_criteria: true
          - propagate_failure_up: true

        on_checkpoint:
          - save_state_snapshot: true
          - notify_all_sub_agents: true
          - track_version: true

      orchestration_config: "${orchestration}"

    output:
      save_to: parallel_execution_results
      format: json
      fields:
        - sub_agents_executed
        - validation_results
        - interdependency_status
        - event_log
        - checkpoints_created
        - total_duration_secs
    timeout_secs: 300

    branches:
      - branch_id: "from_step_2_parallel"
        enabled_by: "initial_assessment.decision == 'parallel'"

  # Step 3B: Resume from Checkpoint
  - step: resume_from_checkpoint
    id: step_3_resume
    model: "${models.secondary_validator}"
    input:
      prompt: |
        Resume workflow from checkpoint:

        Initial assessment:
        ${step.step_2.output}

        Checkpoint details:
        - Checkpoint file: ./workspace/checkpoints/latest.json
        - State snapshot: complete system state
        - Progress: which sub-agents completed
        - Logs: up to checkpoint point

        Resume requirements:
        1. Load state from checkpoint
        2. Resume execution from last completed step
        3. Restore sub-agent contexts
        4. Reinitialize event channels
        5. Continue remaining sub-workflows

        Output:
        - state_restored: boolean
        - resumed_from_step: step_id
        - remaining_sub_workflows: []
        - resumed_execution_mode: "parallel"|"serial"

      checkpoint_config:
        path: "${step.step_2.output.resume_checkpoint}"
        validate_integrity: true
        restore_dependencies: true

    output:
      save_to: resume_results
      format: json
      fields:
        - state_restored
        - resumed_from_step
        - remaining_sub_workflows
        - execution_mode

    branches:
      - branch_id: "from_step_2_resume"
        enabled_by: "initial_assessment.decision == 'resume'"

  # Step 4: Aggregate and Evaluate Results
  - step: aggregate_and_evaluate
    id: step_4
    model: "${models.primary_analyzer}"
    input:
      prompt: |
        Aggregate results from all sub-agents and evaluate overall quality:

        Parallel execution results:
        ${step.step_3_parallel.output}

        Resume results (if applicable):
        ${step.step_3_resume.output}

        Orchestration config:
        ${orchestration}

        Overall validation criteria:
        ${orchestration.overall_validation_criteria}

        Aggregation logic:
        1. Collect validation results from all sub-agents
        2. Evaluate interdependency status
        3. Calculate weighted quality score
        4. Check against overall validation criteria
        5. Determine final outcome

        Overall validation criteria (weighted):
        - code_quality_score (0.3 weight): Code validation results
        - documentation_completeness (0.25 weight): Doc generation results
        - all_sub_workflows_valid (0.25 weight): All sub-workflows passed
        - performance_acceptable (0.2 weight): Performance metrics

        Weighted calculation:
        - Sum of (criteria_met * weight)
        - Threshold: >= 0.85 (85% combined score)

        Event response flow:
        - If all criteria met → proceed to step_5_success
        - If criteria not met → branch to step_6_analysis
        - If partial success → branch to step_7_adjust

      orchestration_config: "${orchestration}"

    output:
      save_to: aggregated_results
      format: json
      fields:
        - code_quality_score
        - documentation_completeness
        - all_sub_workflows_valid
        - performance_acceptable
        - weighted_overall_score
        - final_decision
        - criteria_breakdown
        - recommendations

  # Step 5: Success - Generate Final Output
  - step: generate_final_output
    id: step_5_success
    model: "${models.primary_analyzer}"
    input:
      prompt: |
        Generate final comprehensive output for successful refactoring:

        Aggregated results:
        ${step.step_4.output}

        Success details:
        - All sub-workflows validated successfully
        - All validation criteria met
        - Code refactoring complete
        - Documentation generated
        - Knowledge base updated

        Generate final outputs:
        1. Write refactored code to ./workspace/output/refactored_code.rs
        2. Write documentation to ./workspace/output/documentation.md
        3. Write validation report to ./workspace/output/validation_report.json
        4. Write performance metrics to ./workspace/metrics/performance.json
        5. Save final state to ./workspace/checkpoints/final.json
        6. Create backup of original code to ./workspace/backups/original_code_backup.tar.gz

        File operations:
        - file_write: refactored_code.rs (UTF-8, pretty_print, validation)
        - file_write: documentation.md (UTF-8, markdown format)
        - file_write: validation_report.json (UTF-8, JSON format)
        - file_write: performance.json (UTF-8, JSON format)
        - file_save_state: final.json (UTF-8, JSON format)
        - file_create_archive: original_code_backup.tar.gz (tar.gz format)

      aggregated_results: "${step.step_4.output}"

    output:
      save_to: final_output
      format: json
      fields:
        - code_file_written
        - documentation_file_written
        - validation_report_written
        - metrics_file_written
        - state_saved
        - backup_created
        - summary

  # Step 6: Analysis - Determine Next Action
  - step: analyze_and_branch
    id: step_6_analysis
    model: "${models.secondary_validator}"
    input:
      prompt: |
        Analyze validation failures and determine next action:

        Aggregated results:
        ${step.step_4.output}

        Branching logic based on failure analysis (strict yes/no):

        Determine which criteria failed:
        1. code_quality_score < 0.9?
           - Which aspect failed (compilation, tests, lint)?
           - Can it be fixed?

        2. documentation_completeness < 0.85?
           - What's missing (examples, API docs, tutorials)?
           - How to improve?

        3. all_sub_workflows_valid == false?
           - Which sub-workflow failed?
           - Why did it fail?
           - Can it be retried?

        4. performance_acceptable < 0.85?
           - What performance metric is low?
           - How to improve?

        Branching decision:
        IF critical failure (code doesn't compile or tests fail completely):
          THEN branch: fail_workflow
          Answer: "Decision: fail"

        IF quality score >= 0.7 AND < 0.85:
          THEN branch: retry_specific_sub_agent
          Answer: "Decision: retry"

        IF interdependency issues:
          THEN branch: adjust_interdependencies_and_retry
          Answer: "Decision: adjust"

        IF multiple minor failures:
          THEN branch: adjust_validation_criteria
          Answer: "Decision: adjust_criteria"

        Output strict decision: "Decision: [fail|retry|adjust|adjust_criteria]"

      aggregated_results: "${step.step_4.output}"

    output:
      save_to: branch_analysis
      format: json
      fields:
        - decision
        - reason
        - failed_criteria
        - retry_action
        - next_step

    branches:
      - branch_id: "fail_workflow"
        next_step: step_fail
        enabled_by: "branch_analysis.decision == 'fail'"

      - branch_id: "retry_specific"
        next_step: step_7_retry
        enabled_by: "branch_analysis.decision == 'retry'"

      - branch_id: "adjust_interdependencies"
        next_step: step_8_adjust
        enabled_by: "branch_analysis.decision == 'adjust'"

      - branch_id: "adjust_criteria"
        next_step: step_9_adjust_criteria
        enabled_by: "branch_analysis.decision == 'adjust_criteria'"

  # Step 7: Retry Specific Sub-Agent
  - step: retry_sub_agent
    id: step_7_retry
    model: "${models.primary_analyzer}"
    input:
      prompt: |
        Retry specific sub-agent with adjusted parameters:

        Branch analysis:
        ${step.step_6_analysis.output}

        Retry requirements:
        1. Identify failed sub-agent
        2. Adjust validation criteria (loosen tolerance, adjust thresholds)
        3. Update interdependency constraints if needed
        4. Re-execute sub-agent
        5. Re-aggregate validation results

        Event flow on retry:
        - Notify orchestration of retry
        - Re-execute sub-agent sub-workflow
        - Propagate new validation results
        - Re-aggregate at top-level with adjusted criteria
        - Save checkpoint after retry

      branch_analysis: "${step.step_6_analysis.output}"

      retry_config:
        max_retries: 2
        adjustment_strategy: "loosen_tolerance"
        tolerance_adjustment: 0.15
        adjust_interdependencies: true
        checkpoint_after_retry: true
        

    output:
      save_to: retry_results
      format: json
      fields:
        - retry_count
        - sub_agent_retried
        - validation_results_after_retry
        - criteria_adjustments
        - checkpoint_saved
        - final_outcome

  # Step 8: Adjust Interdependencies
  - step: adjust_interdependencies_and_retry
    id: step_8_adjust
    model: "${models.primary_analyzer}"
    input:
      prompt: |
        Adjust interdependencies and retry related sub-agents:

        Branch analysis:
        ${step.step_6_analysis.output}

        Adjustment requirements:
        1. Identify interdependency conflicts
        2. Relax or reconfigure interdependencies
        3. Adjust validation criteria
        4. Re-execute affected sub-agents
        5. Re-aggregate with new results

        Event flow on adjustment:
        - Notify affected sub-agents of adjustment
        - Update interdependency configuration
        - Re-execute affected sub-agent sub-workflows
        - Propagate new validation results
        - Re-aggregate at top-level
        - Save checkpoint

      branch_analysis: "${step.step_6_analysis.output}"

      adjustment_config:
        strategy: "reconfigure_interdependencies"
        relax_constraints: true
        reconfigure_affected_sub_agents: true
        validation_criteria_adjustment: 0.1

    output:
      save_to: adjustment_results
      format: json
      fields:
        - adjustments_made
        - interdependencies_reconfigured
        - sub_agents_retried
        - validation_results_after_adjustment
        - checkpoint_saved
        - final_outcome

  # Step 9: Adjust Validation Criteria
  - step: adjust_validation_criteria
    id: step_9_adjust_criteria
    model: "${models.secondary_validator}"
    input:
      prompt: |
        Adjust overall validation criteria and retry evaluation:

        Branch analysis:
        ${step.step_6_analysis.output}

        Adjustment requirements:
        1. Identify which validation criteria are too strict
        2. Adjust thresholds appropriately
        3. Re-evaluate with adjusted criteria
        4. Determine if adjustments are sufficient

        Criteria adjustments:
        - code_quality_score: 0.9 → 0.85 (5% reduction)
        - documentation_completeness: 0.85 → 0.8 (5% reduction)
        - performance_acceptable: 0.85 → 0.8 (5% reduction)
        - overall_threshold: 0.85 → 0.8 (5% reduction)

        Output:
        - Adjusted validation criteria
        - Re-evaluated results
        - Final decision

      branch_analysis: "${step.step_6_analysis.output}"

    output:
      save_to: criteria_adjustment_results
      format: json
      fields:
        - original_criteria
        - adjusted_criteria
        - adjustment_rationale
        - reevaluated_results
        - final_decision

  # Step 10: Top-Level Validation Loop
  - step: final_evaluation_loop
    id: step_10
    model: "${models.primary_analyzer}"
    input:
      prompt: |
        Final evaluation loop after retry/adjustment:

        Results from branches:
        - Retry results: ${step.step_7_retry.output}
        - Interdependency adjustment: ${step.step_8_adjust.output}
        - Criteria adjustment: ${step.step_9_adjust_criteria.output}

        Requirements:
        1. Evaluate final validation status
        2. Check if all overall criteria met
        3. Determine final workflow outcome
        4. If still failing, determine if more retries needed

        Top-level validation loop:
        - Check overall validation criteria
        - IF met: proceed to success (step_5)
        - IF not met AND retry_count < 3: loop back to step_6 (analysis)
        - IF not met AND retry_count >= 3: fail workflow (step_fail)

        Loop configuration:
        - Type: validation
        - Max iterations: 3
        - Tolerance: 0.0 (strict)
        - Stop conditions: All criteria met OR max retries reached

        Output:
        - Final evaluation decision
        - Overall validation status
        - Total execution summary

      retry_branch_results: "${step.step_7_retry.output}"
      adjustment_branch_results: "${step.step_8_adjust.output}"
      criteria_adjustment_results: "${step.step_9_adjust_criteria.output}"
      overall_criteria: "${orchestration.overall_validation_criteria}"
      max_retries: 3

    output:
      save_to: final_evaluation
      format: json
      fields:
        - final_decision
        - overall_validation_status
        - criteria_met
        - total_retry_count
        - workflow_outcome

    validation_loop:
      type: validation
      exact_criteria: true
      tolerance: 0.0
      max_iterations: 3
      stop_conditions:
        - evaluation.final_decision == "success"
        - evaluation.total_retry_count >= 3
      on_loop:
        - increment_retry_counter
        - adjust_criteria_if_needed
        - log_attempt

      loop_to_step: "step_4"  # Re-aggregate after each retry

  # Step 11: Failure - Generate Failure Report
  - step: workflow_failure
    id: step_fail
    model: "${models.secondary_validator}"
    input:
      prompt: |
        Workflow failed. Generate comprehensive failure report:

        Failure details:
        - Branch analysis: ${step.step_6_analysis.output}
        - Retry attempts: ${step.step_7_retry.output}
        - Adjustment attempts: ${step.step_8_adjust.output}
        - Criteria adjustment: ${step.step_9_adjust_criteria.output}
        - Final evaluation: ${step.step_10.output}

        Failure report should include:
        1. Summary of failure
        2. Which criteria failed
        3. What was attempted (retry/adjust)
        4. Why retries/adjustments didn't work
        5. Recommendations for improvement
        6. Partial results achieved

        Generate failure outputs:
        1. Write failure report to ./workspace/output/failure_report.json
        2. Save partial results to ./workspace/output/partial_results.json
        3. Save failure state to ./workspace/checkpoints/failure.json

      failure_context:
        branch_analysis: "${step.step_6_analysis.output}"
        retry_results: "${step.step_7_retry.output}"
        adjustment_results: "${step.step_8_adjust.output}"
        criteria_adjustment_results: "${step.step_9_adjust_criteria.output}"
        final_evaluation: "${step.step_10.output}"

    output:
      save_to: failure_report
      format: json
      fields:
        - status
        - failure_summary
        - failed_criteria
        - attempts_made
        - partial_results
        - recommendations

  # Step 12: Defer - Save State and Exit
  - step: defer_execution
    id: step_defer
    model: "${models.secondary_validator}"
    input:
      prompt: |
        Defer execution due to resource constraints:

        Initial assessment:
        ${step.step_2.output}

        Defer requirements:
        1. Save current state
        2. Log defer reason
        3. Calculate estimated resource requirements
        4. Suggest reschedule time

        Generate defer outputs:
        1. Write defer state to ./workspace/checkpoints/deferred.json
        2. Write resource requirements to ./workspace/metrics/resource_requirements.json
        3. Log defer event to ./workspace/logs/defer.log

      system_state: "${step.step_2.output}"

    output:
      save_to: defer_results
      format: json
      fields:
        - state_saved
        - defer_reason
        - estimated_resource_requirements
        - suggested_reschedule
        - defer_timestamp

# Provider Default Overrides
providers:
  lmstudio: # If string it represents a file path to a .yml or .yaml file that fills in this providers default overrides
    # If object with properties set here it will support all possible individual model properties are able to be set as default for every model listed under the `models` key, different then built in defaults here.  I'll need to make sure to have a default
  ollama: # ...
  llama_cpp_with_vulkan: # ...




# Model Configuration 
models: # this should be loadable via a centralized and workspace folder scoped config files. If models aren't specified we use the automatic model router or if model on step is set to automatic_model_router
  global_model_config: "./path/to/config.yml" 
  "llama-3.2-3b-instruct":
    name: primary_analyzer # variable reference name later in the workflow
    host: lmstudio # enum lmstudio | ollama | llama_cpp_with_vulkan
    allowed_processors: "(cpu_main | cpu_alt_1) & gpu_cluster2_brady" # compute modules that can be used that uses available compute bandwidth and logical notation to decide at the moment of loading the model into memory which cpu &| gpu to use.  | means backup if the previous one is in use and doesn't have enough available bandwidth needed to run this model based on saved information about what the machine can handle inside the execution engine and & is to attempt to load the model into both sources at once if available.  most providers/hosts will likely only support gpu offloading, and currently I only have a cpu and gpu in my cluster so all we'll need to support initially will be cpu_name or gpu_name or cpu_name & gpu_name or cpu_name | gpu_name or gpu_name | cpu_name
    max_allowed:
      ram: 13% # percentage of ram allowed to be used by this workflow.  From the percentage we calculate the ram in GB or MB. After we know the max memory allowed when running the model we use that to calculate the context size to load in the model and what kv cache quantitization to use if not explicitly specified.  Each model will have min max usefulness range so if the % with the system specs isn't sufficient for the minimum spec (e.g. min_attention_tokens) then when attempting to run the workflow that and all other runtime errors are returned and the workflow will not attempt to execute.  That way if a workflow is sent to a different machine without as much specs they get warned when attempting to run it with a good message that tells them why in detail and how to fix it in terms of changing settings if it just needs to be bigger % it recommends that but if it doesn't have enough resources offers alternatives models that have similar capabilities with changes to the workflow suggestioned to compensate for the smaller llm
      vram: 3.7gb # same as above just the second step onward in terms of behavior
      cpu: 49%
      gpu: 74%
      attention_tokens: 150000
      concurrent_requests: 2 # if available by provider and possibly from the global model config, and informs parallelization opportunities for the execution and transpilation engines, along with how many sub_agents, with the workflow set workflow_execution_strategy.processing === parallel.  there will be a logging.errors.workflow_parsing.hardware_limitation_error.
    min_allowed:
      ram: 9% # percentage of ram allowed to be used by this workflow.  From the percentage we calculate the ram in GB or MB. After we know the max memory allowed when running the model we use that to calculate the context size to load in the model and what kv cache quantitization to use if not explicitly specified.  Each model will have min max usefulness range so if the % with the system specs isn't sufficient for the minimum spec (e.g. min_attention_tokens) then when attempting to run the workflow that and all other runtime errors are returned and the workflow will not attempt to execute.  That way if a workflow is sent to a different machine without as much specs they get warned when attempting to run it with a good message that tells them why in detail and how to fix it in terms of changing settings if it just needs to be bigger % it recommends that but if it doesn't have enough resources offers alternatives models that have similar capabilities with changes to the workflow suggestioned to compensate for the smaller llm
      vram: 24% # hardcoded memory number like 3.7gb or 350mb or 20000kb takes precidence so if the min allowed % is greater than a hardcoded 3.6gb it is 3.6gb but if both are memory numbers and the min is bigger than system copacity you get a hardware limitation error that would return some helpful tips for an llm to alter the workflow to make it still effective on a smaller system. the default template error messages and responses can be show in logging.errors.workflow_parsing.hardware_limitation_error.
      cpu: 49%
      gpu: 74%
      attention_tokens: 73500 # if ram+vram is insufficient in terms of availability or machine capabilities to load this many tokens then the workflow gets a run time error with a helpful error message clearly stating what happened and how to change the workflow file to make it work with clear detailed info in the error message 
    model_memory_cache_size: "min" # enum min | max | medium | medium-min | medium-max maps to the smallest to largest kv cache size that still fits the model usefulness minimums found in global model configs found in the automatic model router
    thinking:
      budget_tokens: 4096       # Reasoning token budget
      capture_in_output: true   # Include reasoning in final output
      capture_in_events: true   # Emit reasoning as events
      stream_to_log: true       # Stream reasoning to log file
    hooks:
      # these are the lifecycle hooks for basic agents.  no tools.
      on_agent_create:  #...
      on_run_start:  #...
      on_run_complete:  #...
      on_run_error:  #...
      on_turn_start:  #...
      on_turn_complete:  #...
      on_turn_error:  #...
      on_thinking:  #...
      on_memory_recall:  #...
      on_memory_store:  #...
      on_stream_chunk:  #...
      on_stream_complete:   #...
    gaurdrails: # if present gaurdrails are enabled. if not present gaurdrails are disabled.
      enforcement_policy: block        # block | warn | allow (global default)
      input:
        guards: [prompt_injection, pii_redaction, max_length]
        #...
      output:
        guards: [toxicity_filter, pii_redaction, format_validation, max_length]
        #...
          


   # all other fields will be provider/host related fields for loading in the model. For example you might have a forced static token length or directly specific kv cache quantitization or any other settings that is supported for running a model.  I do want the fields to have standardized name across all providers but each provider will have some fields they all support and some fields that are provider specific if a model load-in setting isn't supported then a runtime error should occur with reference to the fact that that provider/host doesn't have that setting or feature.

agents:
  - id: main_agent
    framework: agentsdk
    model: "llama-3.2-3b-instruct" # can be specified with a model name var "${models.primary_analyzer}"
    custom_executor_name: foobar # if  not set always a react_agent. llm name when referenced is always the basic agent 
    max_turns: 10
    tool_use:
      stop_on_tool_failure: false
      accumulate_tool_results: true 
      output: #todo 
      permission: always_ask # ask: always show a prompt with the command and have the command in an edit input. We will also show an option for single try confirm, which is default with enter; we will also have a trust confirm that allows running that specific command with varying arguments freely. | if always_trust is always run this without asking | always_ask  always asks for a confirm with an edit input for the command.  Can be set on individual tools here or in workflow steps
    tools: #or can be array of strings ["grep","ast_parser", "./path/to/script" /*run by file type*/]
      - name: file_search
        type: tool
        tool_type: grep
      - name: custom_script_1
        type: default_terminal 
  
        run: |
          node /path/to/script.js --arg1=${var.asdfg} --param2=bar

    hooks:
      # ── RUN LIFECYCLE ──────────────────────────────────────────
      on_create: # Fires once when model is instantiated (before any run)
        # EVERY POSSIBLE OPTION: What is in this on_create hook is every possible hook action property and with an example of the correct type
        # ── CONTROL FLOW ─────────────────────────────────────
        stop_step:
          condition: |
            result == null          
          reason: "Null result detected, halting pipeline"
        stop_workflow:
          condition: "..."
          reason: "..."
        retry:
          condition: "..."
          reason: "..."
          backoff: linear
          level: full_workflow_unload_reload # Level to Retry at in response to the conditional evaluating to true during the hook step - enum workflow_unload | workflow_restart | step_unload | step_restart | prompt_restart | tools_retry |
          workflow: unload_reload, restart, 
          step: unload_reload, restart
            tool: 
          prompt:

          max_attempts: 2
          delay_ms: 500
          #OR
          backoff: exponential
          base_ms: 1000
          max_ms: 30000
          jitter: 0.2
        skip:
          condition: "..."
          reason: "..."

        # Everything below this in terms of hook actions is extremely speculative and are not features I'm currently planning on supporting 
          # ── LOGGING ──────────────────────────────────────────
          log:
            level: info
            message: "Run complete: done={result.done}, turns={result.turns}, tokens={result.token_usage.total}, duration={duration_ms}ms"
            output_type: log
            format: json
            
            metrics:
              - name: "run.duration_ms"
                value: "{{duration_ms}}"
                unit: milliseconds
              - name: "run.turns"
                value: "{{result.turns}}"
                unit: turns
              - name: "run.tokens"
                value: "{{result.token_usage.total}}"
                unit: tokens

          log_trace:
            span_name: "agent.run"
            attributes:
              agent: "{{agent.name}}"
              task: "{{task.id}}"
              turns: "{{result.turns}}"
              tokens_input: "{{result.token_usage.input}}"
              tokens_output: "{{result.token_usage.output}}"
            parent_span: "{{workflow.trace_id}}"

          # ── STATE MUTATION ───────────────────────────────────

          set_variable:
            key: "last_run_completed_at"
            value: "{{now_iso8601}}"
            scope: workflow

          increment_variable:
            key: "total_runs_executed"
            delta: 1
            scope: workflow

          update_memory:
            add_summary: "Run completed with {{result.turns}} turns. Final output: {{result.response[0..200]}}"
            inject_message:
              role: system
              content: "Previous run completed successfully. Use those results as context."

          set_timeout:
            max_ms: 60000

          # ── PUBLISHING / EVENTS ──────────────────────────────

          publish:
            topic: "run.complete"
            payload:
              task_id: "{{task.id}}"
              done: "{{result.done}}"
              duration_ms: "{{duration_ms}}"
              token_usage: "{{result.token_usage}}"

          conditional_publish:
            topic: "run.success"
            payload:
              task_id: "{{task.id}}"
              response: "{{result.response}}"
            condition: "result.done == true"
            topic_else: "run.incomplete"
            payload_else:
              task_id: "{{task.id}}"
              turns_used: "{{result.turns}}"
              max_turns: "{{result.max_turns}}"

          emit_event:
            event_type: "run_completed"
            payload:
              agent: "{{agent.name}}"
              done: "{{result.done}}"
              quality_score: "{{result.quality_score}}"

          # ── FILE I/O ─────────────────────────────────────────

          save_to_file:
            path: "${workflow.output_path}/runs/{{task.id}}/result.json"
            content: "{{result}}"
            encoding: utf-8

          append_to_file:
            path: "${workflow.output_path}/run_history.jsonl"
            content: '{"task_id":"{{task.id}}","done":{{result.done}},"duration_ms":{{duration_ms}}}\n'
            encoding: utf-8

          stream_to_file:
            path: "${workflow.output_path}/runs/{{task.id}}/stream_log.md"
            append: true
            format: markdown
            flush_interval_ms: 100

          # ── PROMPT MANIPULATION ──────────────────────────────

          enrich_prompt:
            prepend: "Previous run context ({{duration_ms}}ms, {{result.turns}} turns):\n"
            append: "\nRemember: build on previous results, do not repeat work."
            replace_pattern: "\\[PLACEHOLDER_CONTEXT\\]"
            replacement: "{{result.response}}"

          inject_system_message:
            message: "The previous run {{result.done ? 'completed successfully' : 'did not converge'}}. Adjust your approach accordingly."
            position: before_last

          # ── VALIDATION ───────────────────────────────────────

          validate_args:
            schema_path: "/schemas/run_output.json"
            on_failure: warn

          validate_result:
            schema_path: "/schemas/result_quality.json"
            on_failure: retry

          permission_check:
            required_permission: "output.write"
            on_denied: abort

          schema_validate:
            data: "{{result}}"
            schema_path: "/schemas/agent_output.json"
            on_failure: abort

          # ── CONTENT TRANSFORMATION ───────────────────────────

          redact:
            patterns: [api_key, password, credential, secret, token]
            replacement: "[REDACTED]"

          truncate:
            max_chars: 50000
            truncation_marker: "\n... [truncated, full output in ${workflow.output_path}/runs/{{task.id}}/result.json]"

          sanitize:
            rules: [strip_html_tags, remove_script_tags, escape_null_bytes]
            mode: escape

          # ── RATE LIMITING ────────────────────────────────────

          rate_limit:
            max_calls_per_minute: 120
            max_calls_per_run: 50
            on_exceeded: queue

          # ── STREAMING ────────────────────────────────────────

          stream_to_console:
            prefix: "▶ "
            color: green

          # ── EXTERNAL INTEGRATION ─────────────────────────────

          callback:
            module_path: "./plugins/post_run_analytics.so"
            function_name: "on_run_complete"
            args:
              result: "{{result}}"
              duration_ms: "{{duration_ms}}"
            timeout_ms: 5000

          http_request:
            url: "https://api.internal.example.com/v1/runs"
            method: POST
            headers:
              Authorization: "Bearer ${secrets.API_TOKEN}"
              Content-Type: "application/json"
            body: '{"task_id":"{{task.id}}","done":{{result.done}},"duration_ms":{{duration_ms}}}'
            timeout_ms: 10000
            on_failure: log_only

          webhook:
            url: "${secrets.SLACK_WEBHOOK_URL}"
            payload:
              text: "Agent *{{agent.name}}* completed task `{{task.id}}` in {{duration_ms}}ms — {{result.done ? '✅ done' : '⚠️ incomplete'}}"
              blocks:
                - type: section
                  text:
                    type: mrkdwn
                    text: "*Run Summary*\nDuration: {{duration_ms}}ms\nTurns: {{result.turns}}\nTokens: {{result.token_usage.total}}"
            secret_header: "${secrets.SLACK_SIGNING_SECRET}"
            timeout_ms: 5000

          # ── CHECKPOINT / STATE ───────────────────────────────

          checkpoint:
            path: "${workflow.output_path}/checkpoints/{{task.id}}/post_run.ckpt"
            include_memory: true
            include_variables: true

          restore:
            path: "${workflow.output_path}/checkpoints/{{task.id}}/pre_run.ckpt"
            overwrite_memory: false
            overwrite_variables: true

          # ── NOTIFICATION ─────────────────────────────────────

          notify:
            channel: slack
            message: "Agent {{agent.name}} completed task {{task.id}} — {{result.done ? 'success' : 'needs attention'}}"
            severity: "{{result.done ? 'info' : 'warning'}}"
            link: "${workflow.output_path}/runs/{{task.id}}/result.json"

      on_run_start: # Fires at the beginning of each .run() call
      on_run_complete: # Fires after agent finishes (success or max_turns reached)
      on_run_error: # Fires when run encounters an unrecoverable error
      on_retry: # Fires when a run is retried
        
      # ── TURN LIFECYCLE ─────────────────────────────────────────
      on_turn_start: # Fires before each turn begins
      on_turn_complete: # Fires after each turn finishes (before next turn or return)
      on_turn_error: # Fires when a turn fails (LLM error, timeout, etc.)
      on_thinking: # Fires when model emits reasoning/thinking content

      # ── TOOL LIFECYCLE ────────────────────────────────────────
      on_tool_call: # Fires when LLM decides to call a tool (before execution)
      on_tool_start: # Fires immediately before tool execution begins
      on_tool_result: # Fires after tool returns a result (success)
      on_tool_error: # Fires when tool execution fails

      # ── STREAMING LIFECYCLE ───────────────────────────────────
      on_stream_chunk: # Fires for each streaming chunk (when streaming enabled)
      on_stream_complete: # Fires when streaming is fully finished

    gaurdrails: # if present gaurdrails are enabled. if not present gaurdrails are disabled.
      enforcement_policy: block        # block | warn | allow (global default)
      input:
        guards: [prompt_injection, pii_redaction, max_length]
        prompt_injection: # Detect and block injection attempts
          sensitivity: high            # low | medium | high
          on_match: block              # block | warn | sanitize
          log: true
        pii_redaction: # Strip personally identifiable information
          patterns:                    # Custom patterns override defaults
            - email
            - phone
            - ssn
            - api_key
            - custom: "/regex/pattern/"
          replacement: "[REDACTED]"
          on_match: sanitize
          log: true
        max_length: # Reject inputs exceeding token limit
          max_tokens: 8000
          on_match: truncate           # block | truncate | error
          truncate_to: 7500
      output:
        guards: [toxicity_filter, pii_redaction, format_validation, max_length]
        toxicity_filter: # Block toxic model outputs
          trigger_tokens:
            - "ignore previous instructions"
            - "you are now"
          on_match: block
          log: true
        pii_redaction: # Strip personally identifiable information
          patterns: [email, phone, api_key]
          replacement: "[REDACTED]"
        format_validation: # Ensure output matches expected format
          format: json                 # json | xml | markdown
          strict: true                 # Reject if not parseable
          on_match: retry              # block | retry | error
          max_retries: 2
        max_length: # Reject inputs exceeding token limit
          max_tokens: 4096
          on_match: truncate
      tool_use:
        gaurds: [no_web_access, no_file_access, no_script_access no_terminal_access, no_mcp_access]
        no_web_access: # Prevent web access
          on_match: block
          log: true
        no_file_access: # Prevent file access
          on_match: block
          log: true
        no_terminal_access: # Prevent terminal access
          on_match: block
          log: true
        
        
        
       
        
        



# Tool Permissions
tool_permissions:
  file_operations:
    read:
      enabled: true
      require_confirmation: false
      allowed_paths:
        - ./workspace/src
        - ./workspace/config

    write:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - ./workspace/output
        - ./workspace/checkpoints
      backup_existing: true

    delete:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - ./workspace/temp
        - ./workspace/backups

  web_operations:
    fetch:
      enabled: true
      require_confirmation: false
      max_concurrent_requests: 5

    scrape:
      enabled: true
      require_confirmation: false
      respect_robots_txt: true

  shell_operations:
    exec:
      enabled: true
      require_confirmation: true
      timeout_seconds: 30
      allowed_commands:
        - cargo
        - rustc
        - git

