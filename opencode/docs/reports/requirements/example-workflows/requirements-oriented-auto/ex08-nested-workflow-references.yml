---
workflow_id: nested_workflow_references
name: Nested Workflow References with ID System
description: Demonstrates workflow referencing system with multiple reference patterns

# ── MODEL CONFIGURATION ────────────────────────────────
models:
  
  # ── GLOBAL CONFIGURATION FILE ─────────────────────
  # global_config_path: ./workspace/model-config.yml  # Optional: centralized config file
  
  default_model_router: automatic  # automatic | manual | smart_routing
  
  # ── MODEL: PRIMARY MODEL ───────────────────────────────
  primary_model:
    name: primary  # Variable reference name
    
    host:
      type: lmstudio  # lmstudio | ollama | llama_cpp_with_vulkan
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 13%
        vram: 3.7GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 150000
        concurrent_requests: 2
      
      min_allowed:
        ram: 9%
        vram: 2.4GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 73500
      
      allocation_strategy: dynamic  # static | dynamic | adaptive
    
    model_memory:
      cache_size: max  # min | max | medium | medium-min | medium-max
      kv_cache_quantization: auto  # auto | q4_k_m | q4_0 | q5_k_m | q5_0 | q6_k | q8_0
      attention_context: auto  # auto | from_max_allowed
    
    execution:
      timeout:
        load_into_memory: 45s
        time_to_first_response: 1m
        total_time_to_response: 4h
      
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true
    
    hooks:
      # ── RUN LIFECYCLE ─────────────────────────
      on_create: {}
      on_run_start: {}
      on_run_complete: {}
      on_run_error: {}
      on_retry: {}
      
      # ── TURN LIFECYCLE ───────────────────────────
      on_turn_start: {}
      on_turn_complete: {}
      on_turn_error: {}
      on_thinking: {}
      
      # ── TOOL LIFECYCLE ─────────────────────────────
      on_tool_call: {}
      on_tool_start: {}
      on_tool_result: {}
      on_tool_error: {}
      
      # ── STREAMING LIFECYCLE ──────────────────────────
      on_stream_chunk: {}
      on_stream_complete: {}

# ── WORKFLOW EXECUTION STRATEGY ───────────────────────────
workflow_execution_strategy:
  
  # ── MODEL LIFECYCLE ────────────────────────────────
  load_unload: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
  
  # ── PROCESSING MODE ───────────────────────────────────
  processing: dynamic_parallelization  # serial | parallel | hybrid
  
  # ── PARALLELIZATION CONFIGURATION ─────────────────────────
  parallel:
    enabled: true
    algorithm: priority_queue  # round_robin | priority_queue | shortest_job_first | longest_job_first
    
    load_balancing:
      strategy: least_loaded  # random | least_loaded | ip_hash
      worker_selection_timeout_secs: 10
    
    max_threads: 4
    max_models: 3
    max_concurrent_requests: 2
    max_steps: 2
    max_sub_agents: 3
  
  # ── MEMORY MANAGEMENT ─────────────────────────────────────
  memory:
    allocation:
      strategy: dynamic
      max_allowed:
        ram: 12288MB
        vram: 12288MB
        cpu: 100%
        gpu: 100%
        attention_tokens: 150000
        concurrent_requests: 3
    
    model_lifecycle:
      load_unload_strategy: one_at_a_time
      cache_size: min
      swap_timeout_secs: 30
      unload_unused: true
    
    pressure_handling:
      strategy: throttle  # throttle | swap | fail_fast | graceful_degradation
      memory_threshold_percent: 85
      throttle_factor: 0.5
      on_oom: swap
  
  # ── TIMEOUT MANAGEMENT ───────────────────────────────────
  timeout:
    total: 4h
    tool_call: 30m
    step: 8m
    operation_timeout_secs: 30
    sub_workflow_timeout_secs: 300
    time_to_first_result_secs: 120
    timeout_strategy: continue_with_partial  # fail | continue_with_partial | retry
    
    model:
      load_into_memory: 45s
      time_to_processing_after_loaded: 10000ms
      time_to_processing: 2h
      time_to_responding: 1m
      time_to_response: 4h
  
  # ── ERROR HANDLING ────────────────────────────────────────
  error_handling:
    default_action: retry  # retry | retry_critical_path | skip | fail_workflow
    max_retries_per_step: 3
    retry_backoff_multiplier: 2.0
    escalate_to_model_after: 3

# ── ORCHESTRATION CONFIGURATION ───────────────────────────
orchestration:
  
  # ── STEP COORDINATION ────────────────────────────────
  step_coordination:
    max_concurrent_steps: 10
    step_priority: fifo  # fifo | priority_queue | user_defined
    
    inter_step_dependencies:
      enabled: true
      resolution_strategy: wait_for_all  # wait_for_all | continue_with_available | skip_failed
      dependency_timeout_secs: 300
    
    wait_strategy: eager  # eager | lazy
    
    event_propagation_delay_ms: 100
  
  # ── SUB-WORKFLOW ORCHESTRATION ───────────────────────────
  sub_agent_orchestration:
    enabled: true
    
    sub_agents:
      # ── SUB-AGENT: CODE ANALYZER ─────────────────────
      - id: code_analyzer
        name: Code Analyzer
        description: Analyzes code structure and patterns
        workflow_ref: code_analyzer
        alias: analyzer
        validation_config:
          type: loop
          max_iterations: 4
          tolerance: 0.05
          exact_criteria:
            - metric: analysis_quality
              operator: ">="
              target: 0.85
              required: true
      
      # ── SUB-AGENT: DOCS FETCHER ─────────────────
      - id: docs_fetcher
        name: Docs Fetcher
        description: Fetches and analyzes documentation
        workflow_ref: docs_fetcher
        alias: docs
        validation_config:
          type: loop
          max_iterations: 3
          tolerance: 0.10
          exact_criteria:
            - metric: relevance_score
              operator: ">="
              target: 0.75
              required: true
      
      # ── SUB-AGENT: TEST RUNNER ────────────────────────
      - id: test_runner
        name: Test Runner
        description: Runs test suite
        type: tool
        tool_type: shell_exec
        
        tool:
          type: shell_exec
          config:
            command: "cargo"
            args: ["test", "--workspace"]
            working_dir: "${workflow.codebase_path}"
            timeout_secs: 300
        
        timeout_secs: 300
      
      # ── SUB-AGENT: GIT OPERATIONS ────────────────────────
      - id: git_operations
        name: Git Operations
        description: Manages git operations
        type: tool
        tool_type: cli_run
        
        tool:
          type: cli_run
          config:
            cli: git
            args: ["log", "diff", "branch", "status"]
            working_dir: "${workflow.codebase_path}"
            timeout_secs: 60
    
    event_handling:
      on_validation_result:
        aggregate_at_top_level: true
        propagate_to_dependents: true
        log_result: true
      
      on_interdependent_failure:
        notify_dependent_sub_agents: true
        adjust_validation_criteria: true
        propagate_failure_up: true
        retry_affected_sub_agents: true
      
      on_checkpoint:
        save_state_snapshot: true
        notify_all_sub_agents: true
        track_version: true
  
  # ── VALIDATION AGGREGATION ───────────────────────────────
  validation_aggregation:
    strategy: hierarchical  # hierarchical | conjunction | disjunction | weighted
    
    overall_validation_criteria:
      - name: code_quality_score
        weight: 0.30
        required: true
        threshold: 0.90
      
      - name: documentation_completeness
        weight: 0.25
        required: true
        threshold: 0.85
      
      - name: all_sub_workflows_valid
        weight: 0.25
        required: true
        threshold: 0.85
      
      - name: test_results_passing
        weight: 0.20
        required: true
        threshold: 0.80
    
    overall_threshold: 0.85
    min_metrics_required: 4
    calculate_weighted_score: true
  
  # ── CHECKPOINT COORDINATION ───────────────────────────────
  checkpoint_coordination:
    enabled: true
    interval_steps: 3
    
    on_checkpoint:
      notify_all_sub_agents: true
      save_global_state: true
      increment_version: true

# ── LOGGING CONFIGURATION ────────────────────────────────────
logging:
  
  # ── LOG LEVELS ────────────────────────────────────────
  level: debug  # debug | info | warning | error | trace
  
  # ── LOG DETAIL ────────────────────────────────────────
  detail: high  # low | medium | high | verbose
  
  # ── OUTPUT DESTINATIONS ──────────────────────────────────
  output_destinations:
    chat_file:
      enabled: true
      path: "${workflow.output_path}/nested-workflows.md"
      format: markdown
    
    json_file:
      enabled: true
      path: "${workflow.output_path}/logs/execution.json"
      format: json
    
    console:
      enabled: true
      include_timestamps: true
  
  # ── ERROR LOGGING ────────────────────────────────────────
  error_logging:
    enabled: true
    separate_file: true
    path: "${workflow.output_path}/logs/errors.json"
    include_stack_trace: true
    include_context: true

# ── TOOL PERMISSIONS ────────────────────────────────────────
tool_permissions:
  
  # ── FILE OPERATIONS ────────────────────────────────────────
  file_operations:
    read:
      enabled: true
      require_confirmation: false
      allowed_paths:
        - /workspace/src
        - /workspace/config
      allowed_patterns:
        - "*.rs"
        - "*.toml"
        - "*.yml"
      forbidden_paths:
        - /etc
        - /root
      max_file_size_mb: 100
    
    write:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/output
        - /workspace/checkpoints
      allowed_patterns:
        - "*.json"
        - "*.md"
      forbidden_paths:
        - /workspace/src
        - /workspace/tests
      max_file_size_mb: 500
      backup_existing: true
      create_parent_directories: true
    
    delete:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/temp
        - /workspace/cache
      allowed_patterns:
        - "*.tmp"
        - "*.cache"
      confirm_delete_count: 5
      skip_confirmation_for_patterns:
        - "*.tmp"
  
  # ── WEB OPERATIONS ────────────────────────────────────────
  web_operations:
    fetch:
      enabled: true
      require_confirmation: false
      max_concurrent_requests: 5
      timeout_secs: 30
      allowed_domains:
        - docs.rs
        - github.com
        - api.github.com
      forbidden_domains:
        - "*.local"
      follow_redirects: true
      validate_ssl: true

# ── SHELL OPERATIONS ────────────────────────────────────
  shell_operations:
    exec:
      enabled: true
      require_confirmation: true
      timeout_seconds: 300
      allowed_commands:
        - cargo
        - rustc
        - git
        - ls
        - cat
      forbidden_commands:
        - rm
        - sudo
        - dd
      working_directories:
        - /workspace

# ── WORKFLOW REGISTRY ────────────────────────────────────
workflow_registry:
  registry_path: /workflows/
  discover_mode: auto
  versioning: true
  
  registered_workflows:
    - workflow_id: code_analyzer
      name: Code Analyzer Workflow
      path: ./workflows/code_analyzer.yml
      version: 1.0
      tags:
        - code
        - analysis
        - rust
      metadata:
        author: transpiler_team
        description: Analyzes Rust codebase for patterns
    
    - workflow_id: docs_fetcher
      name: Docs Fetcher Workflow
      path: ./workflows/docs_fetcher.yml
      version: 1.0
      tags:
        - documentation
        - web_scraping
      metadata:
        author: transpiler_team
        description: Fetches external documentation
    
    - workflow_id: test_runner
      name: Test Runner Workflow
      path: ./workflows/test_runner.yml
      version: 1.0
      tags:
        - testing
        - ci
      metadata:
        author: transpiler_team
        description: Runs test suite

# ── SUB-WORKFLOW CONFIGURATION ───────────────────────────
sub_workflows:
  
  # ── SUB-WORKFLOW CONFIGURATION ────────────────────
  allow_nested_references: true
  max_depth: 3
  max_parallel_workflows: 4
  circular_reference_detection: true
  
  # ── ISOLATION POLICIES ────────────────────────────────
  isolated_environments:
    enabled: false
    
    memory_sharing:
      mode: shared_with_limits
      limit_per_workflow_mb: 2048
      swap_on_conflict: true
    
    file_system_isolation:
      workspace_mode: shared
      temp_dir_pattern: ./tmp/workflow_${workflow_id}_*/
      cleanup_on_completion: true
    
    state_sharing:
      mechanism: file_based
      state_directory: ./workflow_states/${workflow_id}/
      merge_strategy: union
  
  # ── REFERENCE RESOLUTION ───────────────────────────
  reference_resolution:
    strategy: hierarchical  # hierarchical | local_first | registry_only
    
    caching:
      enabled: true
      cache_ttl_secs: 3600
      validate_references: true
    
    version_conflict_resolution: error  # error | warn_and_continue

# ── PIPELINE DEFINITION ────────────────────────────────────
pipeline:
  
  # ── STEP 1: Initialize Workflow System ───────────────
  step_1_initialize_workflow_system:
    name: Initialize Workflow System
    description: Load workflow registry and prepare execution environment
    
    model: "${models.primary_model}"
    
    input:
      prompt: |
        Initialize the workflow system:
        
        1. Load workflow registry from path: ${workflow_registry.registry_path}
        2. Discover all registered workflows
        3. Validate workflow versions and dependencies
        4. Index workflows for fast lookup
        5. Prepare isolated environments for each workflow
        
        Output workflow registry structure and index.
      
      variables:
        registry_path: "${workflow_registry.registry_path}"
    
    output:
      save_to: workflow_registry
      format: json
      fields:
        - registry_structure
        - registered_workflows
        - workflow_index
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff_strategy: exponential
  
  # ── STEP 2: Execute Parallel Sub-Workflows ─────────────
  step_2_execute_parallel_sub_workflows:
    name: Execute Parallel Sub-Workflows
    description: Execute multiple sub-workflows in parallel
    
    model: "${models.primary_model}"
    
    input:
      prompt: |
        Execute these sub-workflows in parallel:
        
        Code Analyzer Workflow: ${sub_workflow.code_analyzer}
        Docs Fetcher Workflow: ${sub_workflow.docs_fetcher}
        Test Runner Workflow: ${sub_workflow.test_runner}
        
        Each sub-workflow:
        1. Code Analyzer: Analyzes codebase for async patterns
        2. Docs Fetcher: Fetches external docs for the code
        3. Test Runner: Runs tests to validate changes
        
        Use orchestration to:
        1. Spawn all sub-workflows simultaneously
        2. Monitor execution status
        3. Collect results when complete
        4. Aggregate results and check validation criteria
        
        Return aggregated results in JSON format.
      
      variables:
        sub_workflows:
          - code_analyzer: "sub_workflow.code_analyzer"
          - docs_fetcher: "sub_workflow.docs_fetcher"
          - test_runner: "sub_workflow.test_runner"
    
    output:
      save_to: parallel_results
      format: json
      fields:
        - code_analysis
        - documentation
        - test_results
        - completed_sub_workflows
        - failed_sub_workflows
        - execution_summary
      
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  # ── STEP 3: Aggregate and Validate Results ───────────────
  step_3_aggregate_and_validate_results:
    name: Aggregate and Validate Results
    description: Aggregate results from parallel sub-workflows and validate
    
    model: "${models.primary_model}"
    
    input:
      prompt: |
        Aggregate and validate results from parallel sub-workflows:
        
        Results collected:
        ${step.step_2_execute_parallel_sub_workflows.output}
        
        Validation criteria:
        - All sub-workflows completed successfully
        - Code quality threshold met (>= 0.85)
        - Documentation completeness threshold met (>= 0.80)
        - Test results all passing
        - No circular references detected
        - Resource usage within limits
        
        If validation passes:
          Return aggregated, validated results
        Else:
          Return partial results with warnings and issues.
      
      variables:
        parallel_results: "${step.step_2_execute_parallel_sub_workflows.output}"
    
    output:
      save_to: validated_results
      format: json
      fields:
        - validation_passed
        - validation_errors
        - warnings
        - final_results
        - execution_summary
      
      console:
        enabled: true

# ── WORKFLOW VARIABLES ────────────────────────────────────
workflow:
  codebase_path: /workspace
  output_path: /workspace/output
  checkpoint_path: /workspace/checkpoints
  state_path: /workspace/state
  logs_path: /workspace/logs

# ── FEATURES DEMONSTRATED ────────────────────────────────────
features_demonstrated:
  - nested_workflow_references
  - workflow_registry
  - sub_workflows
  - orchestration
  - validation_aggregation
  - checkpoint_coordination
  - parallel_sub_workflow_execution
  - isolation_policies
  - reference_resolution
  - policy_inheritance
  - validation_criteria
  - resource_management
  - logging_configuration
  - tool_permissions
  - retry_logic
  - timeout_management
  - memory_management
  - workflow_execution_strategy
