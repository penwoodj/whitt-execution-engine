---
workflow_id: nested_workflow_references
name: Nested Workflow References with ID System
description: Demonstrates workflow referencing system with multiple reference patterns

model:
  primary: unsloth/Qwen2.5-Coder-1.5B-Instruct
  embedding: jinaai/ReaderLM-v2

policy:
  runtime: medium
  review: standard
  rigor: balanced
  scope: focused
  concurrency: limited_parallel
  efficiency: balanced
  logging: standard
  context_budget: standard

workflow_registry:
  registry_path: /workflows/
  discover_mode: auto
  versioning: true

  registered_workflows:
    - workflow_id: code_analyzer
      name: Code Analyzer Workflow
      path: ./workflows/code_analyzer.yml
      version: 1.0
      tags:
        - code
        - analysis
        - rust
      metadata:
        author: transpiler_team
        description: Analyzes Rust codebase for patterns
        estimated_duration_secs: 120
        required_context: src/

    - workflow_id: doc_fetcher
      name: Documentation Fetcher Workflow
      path: ./workflows/doc_fetcher.yml
      version: 1.0
      tags:
        - documentation
        - web
        - scraping
      metadata:
        author: transpiler_team
        description: Fetches external documentation from web
        estimated_duration_secs: 180
        required_context: []

    - workflow_id: test_runner
      name: Test Runner Workflow
      path: ./workflows/test_runner.yml
      version: 1.0
      tags:
        - testing
        - ci
        - validation
      metadata:
        author: transpiler_team
        description: Runs test suite and validates results
        estimated_duration_secs: 300
        required_context: tests/

    - workflow_id: refactoring_orchestrator
      name: Refactoring Orchestrator Workflow
      path: ./workflows/refactoring_orchestrator.yml
      version: 1.0
      tags:
        - orchestration
        - refactoring
        - multi_step
      metadata:
        author: transpiler_team
        description: Orchestrates refactoring with multiple sub-workflows
        estimated_duration_secs: 600
        required_context:
          - src/
          - tests/

    - workflow_id: rag_builder
      name: RAG Builder Workflow
      path: ./workflows/rag_builder.yml
      version: 1.0
      tags:
        - rag
        - embeddings
        - knowledge_base
      metadata:
        author: transpiler_team
        description: Builds and maintains RAG knowledge base
        estimated_duration_secs: 240
        required_context: docs/

execution:
  mode: hybrid

  workflow_execution:
    allow_nested_references: true
    max_depth: 3
    max_parallel_workflows: 4
    circular_reference_detection: true

  sub_workflow_isolation:
    isolated_environments: false
    inherit_policy: true
    override_policy:
      runtime: false
      review: true
      rigor: true
      scope: false
      concurrency: false
      efficiency: true
      logging: true
      context_budget: false

logging:
  level: debug
  detail: high
  output_type: log
  format: json
  console: true
  log_file: nested_workflow_references.log

  scopes:
    workflow_execution:
      level: debug
      detail: high

    sub_workflow_invocation:
      level: info
      detail: medium

    workflow_registry:
      level: info
      detail: medium

pipeline:
  - step: initialize_workflow_system
    model: "${model.primary}"
    input:
      prompt: |
        Initialize workflow system:

        1. Load workflow registry from path: ${workflow_registry.registry_path}
        2. Discover all registered workflows
        3. Validate workflow versions and dependencies
        4. Index workflows for fast lookup

        Registry path: ${workflow_registry.registry_path}
        Discover mode: ${workflow_registry.discover_mode}

        Output: Workflow index with IDs, paths, versions, tags, metadata.
    output:
      save_to: workflow_index
      format: json
      fields:
        - registered_workflows
        - workflow_count
        - validation_errors
    retry:
      max_attempts: 3
      delay_ms: 500

  - step: execute_parallel_sub_workflows
    model: "${model.primary}"
    parallel_group: analysis_phase
    max_parallel: 3
    input:
      prompt: |
        Execute these sub-workflows in parallel:

        1. Code Analyzer (ID: code_analyzer)
           - Analyze ./src/ for async patterns
           - Output: analysis_results.json

        2. Documentation Fetcher (ID: doc_fetcher)
           - Fetch https://docs.rs/tokio
           - Output: fetched_docs.json

        3. Test Runner (ID: test_runner)
           - Run cargo test
           - Output: test_results.json

        Sub-workflow execution:
        - Each sub-workflow runs in isolated context
        - Inherits parent policy (scope, concurrency, etc.)
        - Can override specific policy settings if allowed
        - Results are tagged with workflow_id for aggregation

        Expected output files:
        - ./output/code_analyzer_results.json
        - ./output/fetched_docs.json
        - ./output/test_results.json

        Wait for all sub-workflows to complete before aggregation.
      sub_workflows:
    - workflow_ref: code_analyzer
      alias: analyzer
      policy_override: { scope: false, runtime: false, concurrency: false, efficiency: false, logging: { level: warn, detail: low } }

    - workflow_ref: doc_fetcher
      alias: docs
      policy_override: { scope: false, runtime: false, concurrency: false, efficiency: false, logging: false }

    - workflow_ref: test_runner
      alias: tests
      policy_override: { scope: false, runtime: false, concurrency: false, efficiency: false, logging: false }
    output:
      save_to: parallel_analysis_results
      format: json
      fields:
        - completed_sub_workflows
        - failed_sub_workflows
        - total_duration_secs
        - output_files
    timeout_secs: 900

  - step: aggregate_sub_workflow_results
    model: "${model.primary}"
    input:
      prompt: |
        Aggregate results from completed sub-workflows:

        1. Read results from each sub-workflow:
           - ${step.execute_parallel_sub_workflows.output.code_analyzer_results}
           - ${step.execute_parallel_sub_workflows.output.doc_fetcher_results}
           - ${step.execute_parallel_sub_workflows.output.test_runner_results}

        2. Merge and consolidate results
        3. Generate summary report
        4. Identify any conflicts or issues

        Expected aggregated output:
        - Combined analysis with test results
        - Documentation integrated with code analysis
        - Unified summary report
      code_analyzer_results: "${step.execute_parallel_sub_workflows.output.code_analyzer_results}"
      doc_fetcher_results: "${step.execute_parallel_sub_workflows.output.doc_fetcher_results}"
      test_runner_results: "${step.execute_parallel_sub_workflows.output.test_runner_results}"
      parallel_results: "${step.execute_parallel_sub_workflows.output.parallel_analysis_results}"
    output:
      save_to: aggregated_report
      format: json
      fields:
        - code_analysis
        - test_results
        - documentation
        - summary
        - recommendations
      path: ./output/aggregated_report.json
    retry:
      max_attempts: 3
      delay_ms: 1000

  - step: conditional_refactoring
    model: "${model.primary}"
    input:
      prompt: |
        Based on the aggregated report:
        ${step.aggregate_sub_workflow_results.output}

        If test_results.passed == true AND code_analysis.has_critical_issues == false:
          1. Execute Refactoring Orchestrator workflow
          2. Pass all analysis and test results
          3. Apply code changes
          4. Validate refactored code

        Else if issues found:
          1. Generate detailed issue report
          2. Suggest manual review steps
          3. Provide specific error messages

        Conditional logic:
        - condition_1: tests_passed AND no_critical_issues
        - action_1: execute_refactoring_orchestrator
        - action_2: apply_changes
        - action_3: validate_refactored_code
        - else_action: generate_issue_report
      aggregated_report: "${step.aggregate_sub_workflow_results.output}"
      conditions:
        - condition_1:
            test: "${aggregated_report.test_results.passed}"
            critical_issues: "${aggregated_report.code_analysis.critical_issues == 0}"
            action: execute_refactoring_orchestrator
        else_action: generate_issue_report
    output:
      save_to: conditional_result
      format: json
      fields:
        - decision
        - triggered_condition
        - next_steps
        - execution_plan
    retry:
      max_attempts: 5
      backoff_strategy: exponential

  - step: execute_nested_orchestrator
    model: "${model.primary}"
    input:
      prompt: |
        Execute Refactoring Orchestrator workflow:

        1. Use workflow reference: refactoring_orchestrator
        2. Pass aggregated results as context:
           - code_analysis: ${step.conditional_refactoring.output.aggregated_report.code_analysis}
           - test_results: ${step.conditional_refactoring.output.aggregated_report.test_results}
           - documentation: ${step.conditional_refactoring.output.aggregated_report.documentation}
        3. Let orchestrator execute sub-workflows
        4. Orchestrator manages coordination between sub-workflows

        The refactoring_orchestrator workflow will:
        - Spawn code_analyzer sub-workflow
        - Spawn doc_fetcher sub-workflow
        - Spawn test_runner sub-workflow
        - Coordinate their execution
        - Aggregate their results
        - Apply refactoring changes
        - Validate final result

        Context passed to orchestrator:
        Use ${execution.sub_workflow_isolation.inherit_policy}
        Scope: ${execution.sub_workflow_isolation.override_policy.scope}

        Expected orchestrator output:
        - Refactored code
        - Change log
        - Validation results
        - Test results summary
      workflow_ref: refactoring_orchestrator
      orchestrator_input:
        code_analysis: "${step.conditional_refactoring.output.aggregated_report.code_analysis}"
        test_results: "${step.conditional_refactoring.output.aggregated_report.test_results}"
        documentation: "${step.conditional_refactoring.output.aggregated_report.documentation}"
        context_budget: "${policy.context_budget}"
        scope: "${policy.scope}"
    output:
      save_to: orchestration_result
      format: json
      fields:
        - orchestration_steps
        - refactored_code
        - validation_results
        - final_test_results
      path: ./output/orchestration_result.json
    timeout_secs: 600

workflow_references:
  - reference_id: code_analyzer_import
    pattern: direct_import
    workflow_ref: code_analyzer
    alias: analyzer
    description: Direct import of sub-workflow with alias for easy reference

  - reference_id: doc_fetcher_inline
    pattern: inline_reference
    description: Inline reference used in prompt directly
    example_use: "${workflow_ref.docs.output}"

  - reference_id: test_runner_lookup
    pattern: registry_lookup
    description: Lookup workflow ID from registry and execute
    requires_registry: true

  - reference_id: orchestrator_nesting
    pattern: nested_execution
    description: Workflow that spawns and coordinates other workflows
    supports_parallel_sub_workflows: true
    supports_conditional_execution: true
    max_nesting_depth: 3

  - reference_id: conditional_orchestrator
    pattern: conditional_reference
    description: Execute workflow only if conditions are met, with fallback behavior
    fallback_workflow: issue_reporter
    conditions:
      - type: aggregated
        threshold: all_tests_passed_and_no_critical_issues

reference_resolution:
  strategy: hierarchical
  lookup_order: local_first
  caching:
    enabled: true
    cache_ttl_secs: 3600
  version_conflict_resolution: error

workflow_isolation:
  memory_sharing:
    mode: shared_with_limits
    limit_per_workflow_mb: 2048
    swap_on_conflict: true

  file_system_isolation:
    workspace_mode: shared
    temp_dir_pattern: ./tmp/workflow_${workflow_id}_*/
    cleanup_on_completion: true

  state_sharing:
    mechanism: file_based
    state_directory: ./workflow_states/${workflow_id}/
    merge_strategy: union

validation:
  workflow_references:
    - validate_exists: true
      check_registry: true
      check_file_paths: true
    - validate_no_circular_references: true
      max_depth_check: 5

  sub_workflow_execution:
    - validate_policy_compliance: true
      check_scope: true
      check_memory_limits: true
    - validate_timeout_compliance: true
      check_retry_logic: true

  aggregated_results:
    - validate_completeness: true
      required_outputs:
        - code_analysis_results
        - test_results
        - documentation_results
    - validate_consistency: true
      check_for_conflicts: true
    - validate_metrics: true
      track_execution_time: true

workflow:
  workflow_registry_path: /workflows/
  output_path: ./output
  state_path: ./workflow_states/
  temp_path: ./tmp

metrics:
  enabled: true
  collect:
    - workflow_execution_time
    - sub_workflow_count
    - memory_usage
    - policy_violations
    - reference_resolution_time
  output:
    path: ./metrics/workflow_performance.json
    format: json

retry:
  default:
    max_attempts: 3
    backoff_strategy: exponential
    delay_ms: 1000
    on_final_failure: escalate_model

  step_specific:
    initialize_workflow_system:
      max_attempts: 5
      backoff_strategy: linear
      delay_ms: 500

    execute_parallel_sub_workflows:
      max_attempts: 2
      backoff_strategy: exponential
      delay_ms: 1000

    aggregate_sub_workflow_results:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

    conditional_refactoring:
      max_attempts: 5
      backoff_strategy: exponential
      delay_ms: 2000

    execute_nested_orchestrator:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1500
      max_sub_workflow_failures: 1

fallback:
  on_workflow_failure:
    strategy: generate_issue_report
    issue_reporter_workflow: issue_reporter
    notify_user: true

  on_sub_workflow_failure:
    strategy: continue_with_warning
    log_warning: true
    continue_if:
      - non_critical_failure: true
      - partial_results_available: true

error_handling:
  workflow_not_found:
    action: report_error
    log_level: error
    message: "Workflow ${workflow_id} not found in registry"

  circular_reference:
    action: block_execution
    log_level: error
    message: "Circular reference detected: ${workflow_a} -> ${workflow_b} -> ${workflow_a}"

  policy_violation:
    action: warn_and_continue
    log_level: warn
    message: "Policy violation: ${violation_type}"

  sub_workflow_timeout:
    action: collect_partial_results
    log_level: warn
    message: "Sub-workflow ${sub_workflow_id} timed out after ${duration_secs}s"
