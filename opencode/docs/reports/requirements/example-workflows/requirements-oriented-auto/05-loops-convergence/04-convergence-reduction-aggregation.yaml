---
# ─────────────────────────────────────────────────────────────────────────────
# WORKFlow: Loop Convergence with Reduction/Aggregation Patterns
# ─────────────────────────────────────────────────────────────────────────────

# Demonstrates: convergence loops that reduce multiple values toward a target threshold,
#                aggregation patterns for combining iteration results into final results
# ─────────────────────────────────────────────────────────────────────────────

workflow_id: convergence_reduction_aggregation
name: "Convergence Loops with Reduction/Aggregation"
description: |
  Demonstrates convergence loop patterns that reduce values toward targets,
  aggregate iteration results into final summaries.
version: "1.0.0"
author: "AgentSDK Team"
tags:
  - loops
  - convergence
  - reduction
  - aggregation
  - iteration

  - accumulate-pattern

# ── MODEL CONFIGURATION ──────────────────────────────────────────────────────
models:
  aggregator:
    name: aggregator
    host:
      type: ollama
      connection_settings:
        base_url: http://localhost:11434
        timeout_secs: 90

    max_allowed:
      ram: 25%
      vram: 5GB
      cpu: 60%
      attention_tokens: 80000
      concurrent_requests: 2

    min_allowed:
      ram: 12%
      vram: 2GB
      cpu: 30%
      attention_tokens: 16000

    allocation_strategy: dynamic

    model_memory:
      cache_size: medium-max
      kv_cache_quantization: q5_k_m
      attention_context: auto

    execution:
      timeout:
        load_into_memory: 30s
        time_to_first_response: 60s
        total_time_to_response: 2h
      max_turns: 15
      stop_on_tool_failure: false
      accumulate_tool_results: true

    thinking:
      budget_tokens: 4096
      capture_in_output: true
      capture_in_events: true
      stream_to_log: true

    tools:
      default_permissions:
        web_access: trust
        file_read: trust
        file_write: ask
        shell_exec: ask
      allowed_tools: [grep, file_read, file_write]
      forbidden_tools: []

      type: agentsdk

# ── HARDCODED VALUES ───────────────────────────────────────────────────────────
agentic_workflow:
  hardcoded_values:
    convergence_config:
      max_iterations: 10
      tolerance_threshold: 0.05
      target_score: 0.90

    aggregation_config:
        reduce_function: average
        accumulate_function: sum
        combine_function: merge_objects
        filter_function: filter_by_score
        group_by_function: group by criteria
        transform_function: transform each item

    sample_data:
      data_points:
        - id: point_1
          value: 85
          label: "High quality"
        - id: point_2
          value: 72
          label: "Medium quality"
        - id: point_3
          value: 55
          label: "Low quality"
        - id: point_4
          value: 40
          label: "Acceptable"
        - id: point_5
          value: 30
          label: "Needs review"

        score_weights:
          quality: 0.4
          importance: 0.3
          combined: 1.0
        priority_weights:
          high: 0.5
          medium: 0.3
          low: 0.1

  steps:

    # ═════════════════════════════════════════════════════════════════════════════
    # STEP 1: Initialize Accumulator
    # ═════════════════════════════════════════════════════════════════════════
    step_1_initialize_accumulator:
      name: "Initialize Accumulator"
      description: |
        Initialize accumulator for collecting and storing values across iterations.
      type: loop

      generative_entity: "${models.aggregator}"

      loop:
        type: count

        count_config:
          start_value: 1
          end_value: 10
          step_size: 1

          iteration_variable: accumulate_iter

          max_iterations: "${hardcoded_values.convergence_config.max_iterations}"

          # Initialize accumulator with empty state
          accumulator:
            current_sum: 0
            count: 0
            history: []

      prompt: |
        Initialize convergence loop - Iteration {{loop.accumulate_iter}}

        Configuration:
        - Start: 1
        - End: 10
        - Step size: 1
        - Max iterations: {{hardcoded_values.convergence_config.max_iterations}}
        - Tolerance: {{hardcoded_values.convergence_config.tolerance_threshold}}

        Current state:
        - Iteration: {{loop.accumulate_iter}}
        - Accumulator sum: {{loop.accumulator_sum}}
        - History: {{loop.history | tolistize}}
        - Points processed: {{loop.points_processed}}

        Initialize aggregator state:
        ```json
        {
          "iteration": {{loop.accumulate_iter}},
          "accumulator_sum": {{loop.accumulator_sum}},
          "points_processed": {{loop.points_processed}},
          "history": {{loop.history | tojson}},
          "points": {{loop.current_points | tojson}}
        }
        ```

      output:
        save_to: accumulator_state
        format: json
        fields:
          - iterations_completed
          - final_accumulator_value
          - history
          - points_processed

          - converged
            - stopped_reason

      retry:
        max_attempts: 2
        backoff: exponential
        delay_ms: 1000

    # ════════════════════════════════════════════════════════════════════════════════
    # STEP 2: Reduce Values Loop
    # ══════════════════════════════════════════════════════════════════════════════
    step_2_reduce_values_loop:
      name: "Reduce Values with Sum Aggregation"
      description: |
        Iterate through points, calculate sum and average score,
        Stop when threshold reached.
      type: loop

      generative_entity: "${models.aggregator}"

      loop:
        type: count

        count_config:
          start_value: 1
          end_value: 5
          step_size: 1

          iteration_variable: reduce_iter

          max_iterations: "${hardcoded_values.convergence_config.max_iterations}"

      prompt: |
        Reduce Values Loop - Iteration {{loop.reduce_iter}}

        Configuration:
        - Start: 1
        - End: 5
        - Step size: 1
        - Max iterations: {{hardcoded_values.convergence_config.max_iterations}}
        - Tolerance: {{hardcoded_values.convergence_config.tolerance_threshold}}

        - Reduce function: average

        - Target average: {{hardcoded_values.aggregation_config.target_score}}

        Current iteration: {{loop.reduce_iter}}
        - Points: {{loop.current_points}}
        - Accumulator: {{loop.accumulator}}
        - History: {{loop.history}}

        Tasks:
        1. Get score for each point
        2. Validate score against threshold ({{hardcoded_values.aggregation_config.target_score}})
        3. Add score to accumulator
        4. Update accumulator sum

        5. Update state of convergence reason (true/false)
        6. If converged: output success message, reason
        7. If not converged but, output message with delta

        Score: {{loop.previous_delta}}

      output:
        save_to: reduction_results
        format: json
        fields:
          - iterations_completed
          - initial_points
          - final_accumulator_value
          - history
          - convergence_achieved
            - stopped_reason
          - delta_threshold_met

          - target_threshold_met
          - tolerance_value

      retry:
        max_attempts: 3
        backoff: exponential
        delay_ms: 500

      depends_on:
        - step_1_initialize_accumulator

    # ════════════════════════════════════════════════════════════════════════════════
    # STEP 3: Filter and High Quality Points
    # ════════════════════════════════════════════════════════════════════════════════
    step_3_filter_high_quality:
      name: "Filter High Quality Points"
      description: |
        Filter out low quality points and process high-quality ones through validation loop.
      type: loop

      generative_entity: "${models.aggregator}"

      loop:
        type: count

        count_config:
          start_value: 1
          end_value: 5
          step_size: 1

          iteration_variable: filter_iter

          max_iterations: "${hardcoded_values.convergence_config.max_iterations}"

      prompt: |
        Filtering Loop - Iteration {{loop.filter_iter}}

        Configuration:
        - Start: 1
        - End: 5
        - Step size: 1
        - Max iterations: {{hardcoded_values.convergence_config.max_iterations}}

        - Quality threshold: {{hardcoded_values.aggregation_config.target_score}}
        - Tolerance: {{hardcoded_values.convergence_config.tolerance_threshold}}

        Filter condition: {{loop.current_point.score}} >= {{hardcoded_values.aggregation_config.target_score}}
        
          Stop iteration, break
 output success message
        Else: continue processing medium-quality points

        Current iteration: {{loop.filter_iter}}
        - Points: {{loop.current_points}}
        - History: {{loop.history}}}
          - Rejected_count: {{loop.rejected_count}}

        Filter criteria:
        - Quality threshold: {{hardcoded_values.aggregation_config.target_score}}
        - Tolerance: {{hardcoded_values.convergence_config.tolerance_threshold}}

        Output:
        ```json
        {
          "iteration": {{loop.filter_iter}},
          "filter_passed": {{loop.filter_passed}},
          "history": {{loop.history}},
          "rejected_count": {{loop.rejected_count}},
          "final_filter_result": {
            "passed": {{loop.filter_passed}},
            "rejected": {{loop.rejected}}
          "final_accumulator": {{loop.accumulator_sum}},
          "all_points": {{loop.current_points | toList": {{loop.current_points | to_json }}
 }
        ```

      output:
        save_to: filter_results
        format: json
        fields:
          - iterations_completed
          - filter_summary
          - points_by_quality
          - convergence_status
          - final_accumulator_value
          - rejected_count

      retry:
        max_attempts: 3
        backoff: exponential
        delay_ms: 200

      depends_on:
        - step_2_reduce_values_loop
        - step_3_filter_high_quality_points

    # ══════════════════════════════════════════════════════════════════════════════════
    # STEP 4: Accumulate Points with Grouping
    # ══════════════════════════════════════════════════════════════════════════════
    step_4_accumulate_points:
      name: "Accumulate Points with Grouping"
      description: |
        Group points by quality level and process groups in parallel.
      type: loop

      generative_entity: "${models.aggregator}"

      loop:
        type: count

        count_config:
          start_value: 1
          end_value: 5
          step_size: 1

          iteration_variable: group_iter

          max_iterations: "${hardcoded_values.convergence_config.max_iterations}"

      prompt: |
        Grouping Loop - Iteration {{loop.group_iter}}

        Configuration:
        - Start: 1
        - End: 5
        - Step size: 1
        - Max iterations: {{hardcoded_values.convergence_config.max_iterations}}

        Grouping criteria:
        - Quality thresholds
          - high: score >= {{hardcoded_values.aggregation_config.target_score}}
          - medium: score >= {{hardcoded_values.aggregation_config.target_score}}
          - low: score >= {{hardcoded_values.aggregation_config.target_score}}

        Tasks:
        1. Calculate score delta for current group
        2. Validate each point meets group threshold
        3. Update group statistics:
           - group_id: current iteration
           - points_added: {{loop.points_added}}
           - points_remaining: {{loop.points_remaining}}
           - converged: {{loop.converged}}

        Output:
        ```json
        {
          "iteration": {{loop.group_iter}},
          "group_id": "{{loop.group_id}}",
          "points_added": {{loop.points_added}},
          "points_remaining": {{loop.points_remaining}},
          "converged": {{loop.converged}},
          "group_scores": {{loop.group_scores | to_json}},
          "delta_threshold_met": {{loop.converged}},
          "group_summary": {
            "high_quality": {{loop.history | group_summaries.1}},
            "medium_quality": {{loop.history | group_summaries.2}},
            "low_quality": {{loop.history | group_summaries.3}},
            "rejected": {{loop.history.rejected | to_list}}
          }
        }
        ```

      output:
        save_to: grouped_points
        format: json
        fields:
          - iterations_completed
          - grouping_summary
          - high_quality_count
          - medium_quality_count
          - low_quality_count
          - rejected_count
          - convergence_status

          - group_scores_by_level
          - delta_threshold_met

          - final_accumulator

      retry:
        max_attempts: 3
        backoff: exponential
        delay_ms: 300

      depends_on:
        - step_3_filter_high_quality_points
        - step_4_accumulate_points_with_grouping

    # ═══════════════════════════════════════════════════════════════════════════════════════
    # STEP 5: Aggregate All Convergence Results
    # ═════════════════════════════════════════════════════════════════════════════════════════
    step_5_aggregate_results:
      name: "Aggregate Convergence Results"
      description: |
        Combine all convergence loop results into final workflow summary.
      type: agent

      generative_entity: "${models.aggregator}"

      prompt: |
        Aggregate all convergence loop results:

        Step 1 - Accumulator:
        {{step.step_1_initialize_accumulator.output}}

        Step 2 - Reduce Values:
        {{step.step_2_reduce_values_loop.output}}

        Step 3 - Filter:
        {{step.step_3_filter_high_quality_points.output}}

        Step 4 - Group Points:
        {{step.step_4_group_points_loop.output}}

        Step 5 - Aggregation Summary:
        Final accumulator: {{step.step_5_aggregation_summary.output.accumulator_sum}}

        Generate comprehensive summary:
        - Total iterations: {{step.step_1_initialize_accumulator.output.iterations_completed}} + {{step.step_2_reduce_values_loop.output.iterations_completed}} + {{step.step_3_filter_high_quality_points.output.iterations_completed}} + {{step.step_4_group_points_loop.output.iterations_completed}}
        - Convergence achieved: {{step.step_5_aggregation_summary.output.convergence_achieved}}
        - Final accumulator: {{step.step_5_aggregation_summary.output.final_accumulator}}
        - Average quality across all groups: {{step.step_5_aggregation_summary.output.average_quality}}
        - Best score achieved: {{step.step_5_aggregation_summary.output.best_score}}
        - Grouping summary: {{step.step_5_aggregation_summary.output.grouping_summary}}

        Output:
        ```json
        {
          "total_iterations": 31,
          "convergence_achieved": true,
          "final_accumulator": 356,
          "average_quality": 0.88,
          "best_score": 0.95,
          "grouping_summary": {
            "high_quality": 2,
            "medium_quality": 2,
            "low_quality": 1
          }
        }
        ```

      output:
        save_to: convergence_summary
        format: json
        file_output:
          path: ./workspace/output/convergence_reduction_summary.json
          format: json
          encoding: utf-8

      depends_on:
        - step_4_group_points_loop

# ── WORKFLOW EXECUTION STRATEGY ───────────────────────────────────────────────────────────────
workflow_execution_strategy:
  load_unload: lazy
  processing: serial

  parallel:
    disabled: true
  memory:
    allocation:
      strategy: dynamic
    model_lifecycle:
      load_unload_strategy: lazy
      unload_unused: true
  timeout:
    total: 1h
    per_operation:
      step: 10m
      tool_call: 3m

  error_handling:
    default_action:
      type: retry
      reason: "Retry on convergence failures"
    retry:
      max_attempts_per_step: 3
      backoff_strategy:
        type: exponential
        base_delay_ms: 500
        max_delay_ms: 10000

  checkpointing:
    configuration:
      level: info
      output_path: ./workspace/checkpoints/convergence_checkpoint.json
    triggers:
      interval:
        steps: [step_3_filter_high_quality_points, step_5_aggregate_results]

# ── LOGGING CONFIGURATION ─────────────────────────────────────────────────────
logging:
  levels:
    default: info
    workflow: debug
    agentic_workflow: debug

  output:
    console:
      color: true
      timestamps: true
      format: text
    file:
      path: ./workspace/logs/convergence_loops_workflow.log
      format: json
      rotation:
        max_size_mb: 75
        max_files: 5

# ── METRICS COLLECTION ────────────────────────────────────────────────────────
metrics:
  collection:
    step_level:
      - execution_time_secs
      - memory_peak_mb
      - iterations_count
    custom_metrics:
      - name: total_points_processed
        description: "Sum of points across all iterations"
      - name: average_quality_by_group
        description: "Mean quality per group"
      - name: convergence_iterations
        description: "Iterations until convergence"

      - name: final_accumulator_value
        description: "Final accumulated result"

  output:
    path: ./workspace/metrics/convergence_metrics.json
    format: json
    include_timestamps: true

