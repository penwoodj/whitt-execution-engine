---
workflow_id: loop_variations
name: Loop Variations and Control Flow
description: Demonstrates various loop types (count, time, infinite) with validation criteria

# Model Configuration
models:
  primary:
    provider: lmstudio
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan
    gpu_layers: 32

# Execution Mode
execution:
  mode: serial
  memory:
    max_allocated_memory_mb: 4096
    model_memory_mb: 2048
    unload_unused: false  # Keep model loaded for serial execution

# Logging
logging:
  level: debug
  detail: high
  output_type: chat
  format: json
  console: true
  include_timestamps: true

# Pipeline Definition
agentic_workflow:
  hardcoded_values:
    var_asdf: foo
    var_fdsa:
        - bar: 1
          baz: false
  
  steps:
  # ========================================
  # Loop Variation 1: Count-Based Loop
  # ========================================
  - step: count_based_loop
    id: count_loop
    generative_entity: "${models.primary}"
    prompt: |
        Perform a count-based validation loop:

        Requirements:
        1. Execute the following steps 5 times (iterations 1-5)
        2. Track iteration number in output
        3. On each iteration:
           - Generate a test prompt
           - Validate the prompt structure
           - Generate response
           - Validate response format
        4. Stop when iteration count reaches 5 OR validation passes

        Output format for each iteration:
        - iteration: 1
        - status: success/failed
        - prompt_generated: true/false
        - prompt_valid: true/false
        - response_generated: true/false
        - response_valid: true/false

        On completion:
        - Report total iterations executed
        - Report any validation failures
        - Report if stopped early due to success

      loop_type: count
      max_iterations: 5
      iteration_variable: count
      initial_value: 1
      stop_condition:
        - validation_result.is_valid == true
      on_stop: return_result

    output:
      save_to: count_loop_result
      format: json
      fields:
        - iterations_executed
        - iterations_completed
        - results_by_iteration
        - stopped_early
        - total_duration_secs
    retry:
      max_attempts: 1
      delay_ms: 0

  # ========================================
  # Loop Variation 2: Time-Based Loop
  # ========================================
  - step: time_based_loop
    id: time_loop
    generative_entity: "${models.primary}"
    prompt: |
        Perform a time-based monitoring loop:

        Requirements:
        1. Monitor a specific operation for 60 seconds
        2. Record status every 10 seconds
        3. Stop after 60 seconds OR when critical failure detected
        4. Track system metrics during monitoring:
           - Memory usage
           - CPU utilization
           - Network I/O
           - Operation throughput

        Loop configuration:
        - loop_type: time
        - duration: 60 seconds
        - interval: 10 seconds
        - start_time: ${workflow.timestamp}
        - stop_time: ${workflow.timestamp} + 60s

        Monitor these endpoints:
        - /api/system/status
        - /api/metrics/performance
        - /api/logs/monitoring

        Output for each interval:
        - interval_number
        - timestamp
        - status
        - memory_mb
        - cpu_percent
        - network_bytes
        - throughput_ops

        On completion:
        - Generate summary statistics
        - Identify any anomalies
        - Report operation success/failure
        - Create monitoring report

      loop_type: time
      duration: 60
      interval: 10
      start_time: "${workflow.timestamp}"
      stop_time: "${workflow.timestamp} + 60s"
      interval_variable: time_interval
      monitor_endpoints:
        - /api/system/status
        - /api/metrics/performance
        - /api/logs/monitoring

    output:
      save_to: time_loop_result
      format: json
      fields:
        - monitoring_intervals
        - summary_statistics
        - anomalies_detected
        - operation_status
        - total_duration_secs
    retry:
      max_attempts: 1
      delay_ms: 0

  # ========================================
  # Loop Variation 3: Infinite Loop with Timeout
  # ========================================
  - step: infinite_loop_with_timeout
    id: infinite_loop
    generative_entity: "${models.primary}"
    prompt: |
        Execute an infinite loop with timeout protection:

        IMPORTANT: This loop will run until stopped by timeout or manual intervention
        Max execution time: 30 seconds

        Requirements:
        1. Start an infinite loop (no predetermined stop condition)
        2. On each iteration:
           - Generate a random task description
           - Analyze task requirements
           - Generate execution plan
           - Execute task simulation
           - Validate results
        3. Track iteration count, start time, current time
        4. Generate iteration logs
        5. Write logs to file for persistence
        6. Prevent uncontrolled resource exhaustion

        Safety measures:
        - Monitor loop progress every 5 iterations
        - Check for termination signals every 5 iterations
        - Validate memory usage periodically
        - Generate periodic checkpoints
        - Stop automatically if:
          * Iteration count exceeds threshold
          * Memory usage exceeds limit
          * Timeout is reached
          * Termination signal received

        Output:
        - Infinite loop logs with iteration count
        - Performance metrics
        - Final status (completed by timeout/manual stop)
        - Resource usage summary

        Safety parameters:
        - max_iterations: 100 (soft limit)
        - max_memory_mb: 2048 (soft limit)
        - timeout_seconds: 30 (hard limit)

      loop_type: infinite
      max_iterations: 100
      max_memory_mb: 2048
      timeout_seconds: 30
      iteration_variable: infinite_count
      checkpoint_interval: 5
      log_interval: 1
      checkpoint_file: /workspace/checkpoints/infinite_loop_checkpoint.json
      log_file: /workspace/logs/infinite_loop.log

      safety_checks:
        - check_iteration_count: true
        - check_memory_usage: true
        - check_timeout: true
        - check_termination_signal: true

    output:
      save_to: infinite_loop_result
      format: json
      fields:
        - iterations_executed
        - final_iteration_number
        - stopped_by: timeout/manual_limit
        - final_status
        - resource_usage_summary
        - last_checkpoint
    retry:
      max_attempts: 1
      delay_ms: 0

  # ========================================
  # Loop Variation 4: Validation Loop with Exact Criteria
  # ========================================
  - step: validation_loop_exact_criteria
    id: validation_loop_exact
    generative_entity: "${models.primary}"
    prompt: |
        Execute a validation loop with exact matching criteria:

        Task: Generate and validate code refactoring

        Validation criteria (EXACT):
        - validation_result.perf_improvement_pct == 25.0
        - validation_result.memory_reduction_mb == 512
        - validation_result.security_issues == 0
        - validation_result.deprecations_found == 0
        - validation_result.completeness_score >= 0.95

        Loop behavior:
        1. On each iteration:
           - Generate refactoring suggestion
           - Apply refactoring to test code
           - Run tests and collect metrics
           - Validate against exact criteria
           - Calculate completeness score
        2. Stop when ALL exact criteria are met
        3. If criteria not met after max iterations, stop and report

        Configuration:
        - loop_type: validation
        - exact_criteria: true
        - tolerance: 0.0 (strict exact match)
        - max_iterations: 10
        - iteration_variable: refactoring_iter

        Required metrics:
        - perf_improvement_pct (target: 25.0)
        - memory_reduction_mb (target: 512)
        - security_issues (target: 0)
        - deprecations_found (target: 0)
        - completeness_score (target: >= 0.95)

        Output:
        - Validation results for each iteration
        - Final validation outcome (met/not met)
        - If met: success metrics
        - If not met: failure details, remaining gaps
        - Suggestions for next iteration if needed

      loop_type: validation
      exact_criteria: true
      tolerance: 0.0
      max_iterations: 10
      iteration_variable: refactoring_iter
      exact_criteria:
        - metric: perf_improvement_pct
          operator: "=="
          target: 25.0
        - metric: memory_reduction_mb
          operator: "=="
          target: 512
        - metric: security_issues
          operator: "=="
          target: 0
        - metric: deprecations_found
          operator: "=="
          target: 0
        - metric: completeness_score
          operator: ">="
          target: 0.95

    output:
      save_to: validation_exact_result
      format: json
      fields:
        - iterations_executed
        - criteria_met: boolean
        - results_by_iteration
        - final_metrics
        - failure_details
    retry:
      max_attempts: 1
      delay_ms: 0

  # ========================================
  # Loop Variation 5: Abstract Criteria Loop
  # ========================================
  - step: validation_loop_abstract_criteria
    id: validation_loop_abstract
    generative_entity: "${models.primary}"
    prompt: |
        Execute a validation loop with abstract criteria:

        Task: Optimize database query performance

        Validation criteria (ABSTRACT):
        - query_improvement: "significantly improved"
        - execution_time: "reduced by at least 50%"
        - resource_usage: "reduced to acceptable levels"
        - maintainability: "improved or stayed same"

        Loop behavior:
        1. On each iteration:
           - Analyze current query performance
           - Generate optimization strategy
           - Apply optimization
           - Re-run performance tests
           - Compare against abstract criteria
        2. Stop when abstract criteria are satisfied
        3. Allow some flexibility in interpretation

        Configuration:
        - loop_type: validation
        - exact_criteria: false
        - tolerance: 0.2 (allow interpretation flexibility)
        - max_iterations: 15
        - iteration_variable: optimization_iter

        Abstract criteria (with tolerance):
        - query_improvement:
            acceptable_values: ["significant", "major", "moderate", "small"]
            tolerance: 0.2
        - execution_time:
            comparison: "reduced by at least 50%"
            tolerance: 0.2
        - resource_usage:
            acceptable: "reduced or stable"
            tolerance: 0.3
        - maintainability:
            acceptable: ["improved", "maintained"]
            tolerance: 0.2

        Output:
        - Validation results for each iteration
        - Final validation outcome (met/not met)
        - If met: metrics confirming abstract criteria
        - If not met: detailed breakdown of gaps
        - Recommendations for interpretation if criteria not met

      loop_type: validation
      exact_criteria: false
      tolerance: 0.2
      max_iterations: 15
      iteration_variable: optimization_iter
      abstract_criteria:
        - metric: query_improvement
          acceptable_values: ["significant", "major", "moderate", "small"]
          tolerance: 0.2
          comparison: "better than previous iteration"

        - metric: execution_time
          comparison: "reduced by at least 50%"
          tolerance: 0.2
          target_metric: "previous_execution_time"

        - metric: resource_usage
          acceptable: "reduced or stable"
          tolerance: 0.3

        - metric: maintainability
          acceptable_values: ["improved", "maintained"]
          tolerance: 0.2

    output:
      save_to: validation_abstract_result
      format: json
      fields:
        - iterations_executed
        - criteria_met: boolean
        - results_by_iteration
        - final_metrics
        - criteria_breakdown
        - interpretation_notes
    retry:
      max_attempts: 1
      delay_ms: 0

  # ========================================
  # Loop Variation 6: Retry Loop
  # ========================================
  - step: retry_loop_on_failure
    id: retry_loop
    generative_entity: "${models.primary}"
    prompt: |
        Execute a retry loop on transient failures:

        Task: Send notification and retry on failure

        Requirements:
        1. Attempt to send notification (e.g., to external API)
        2. On failure:
           - Log failure with error details
           - Wait with exponential backoff
           - Retry up to max_attempts
           - Change retry strategy based on failure type
        3. On success:
           - Log success
           - Report final attempt number
           - Generate completion summary

        Failure handling strategies:
        - 5xx server errors: exponential backoff with longer delay
        - 4xx client errors: log and escalate (don't retry)
        - Timeout errors: retry with longer timeout
        - Network errors: retry with increasing delay
        - All others: log and stop

        Configuration:
        - loop_type: retry
        -
        - max_attempts: 5
        - timeout_ms: 30000
        - iteration_variable: attempt_number

        Retry strategies by error type:
        - 5xx: exponential backoff (1s, 2s, 4s, 8s, 16s)
        - timeout: increase timeout, retry with longer delay
        - network: exponential backoff
        - other: no retry, escalate

        Output:
        - Attempt history (all attempts, successful and failed)
        - Failure details with timestamps
        - Retry strategies applied
        - Final result (success/failed)
        - Recommendations if failed

      loop_type: retry
      max_attempts: 5
      timeout_ms: 30000
      iteration_variable: attempt_number
      retry_strategies:
        - error_type: "5xx"
          backoff: exponential
          delay_multiplier: 2

        - error_type: "timeout"
          backoff: exponential
          delay_multiplier: 2

        - error_type: "network"
          backoff: exponential
          delay_multiplier: 2

        - error_type: "client_error"
          backoff: none
          escalate: true

        - error_type: "default"
          backoff: exponential
          delay_multiplier: 2

      on_final_failure: escalate_to_higher_priority

    output:
      save_to: retry_loop_result
      format: json
      fields:
        - total_attempts
        - successful_attempts
        - failed_attempts
        - attempt_history
        - final_status
        - recommendations
    retry:
      max_attempts: 1
      delay_ms: 0

# Retry Configuration
retry:
  default:
    max_attempts: 3
    backoff: exponential
    on_failure: stop_workflow

# Workflow Variables
workflow:
  workspace_path: /workspace
  checkpoints_path: /workspace/checkpoints
  logs_path: /workspace/logs
  timestamp: ${workflow.timestamp}

# Loop Policies
loop_policies:
  # Count-based loops
  count_based:
    max_iterations: 100
    default_interval: 1
    checkpoint_interval: 10

  # Time-based loops
  time_based:
    max_duration_secs: 300
    default_interval_secs: 10
    monitor_interval_secs: 5

  # Infinite loops
  infinite:
    max_iterations: 1000
    max_memory_mb: 4096
    timeout_seconds: 300
    checkpoint_interval: 5
    log_interval: 1

  # Validation loops
  validation:
    exact_criteria:
      tolerance: 0.0
      strict_match: true

    abstract_criteria:
      tolerance: 0.2
      strict_match: false
      interpretation_flexibility: true

  # Retry loops
  retry:
    default_max_attempts: 3
    default_base_delay_ms: 1000

# Validation Criteria Definitions
validation_criteria:
  exact:
    tolerance: 0.0
    comparison_strictness: strict
    examples:
      - "performance_improvement_percentage == 25.0"
      - "memory_reduction_mb == 512"
      - "bugs_fixed == 0"

  abstract:
    tolerance: 0.2
    comparison_strictness: flexible
    interpretation_guidance:
      - "significantly" >= 0.8 of range
      - "moderately" >= 0.5 of range
      - "slightly" < 0.5 of range

# Metrics Collection
metrics:
  enabled: true
  collect:
    - loop_iterations
    - loop_duration
    - loop_success_rate
    - validation_criteria_met
    - retry_attempts
    - retry_failures
  output:
    path: /workspace/output/loop_variations_metrics.json
    format: json
