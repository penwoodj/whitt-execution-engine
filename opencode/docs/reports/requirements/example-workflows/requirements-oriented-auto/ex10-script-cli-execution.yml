---
workflow_id: script_cli_execution
name: Script and CLI Execution with Environment Variables
description: Demonstrates script_run and cli_run with environment variables, working directories, timeout, and output capture

# ── MODEL CONFIGURATION ────────────────────────────────
models:
  
  # ── GLOBAL CONFIGURATION FILE ─────────────────────
  # global_config_path: ./workspace/model-config.yml  # Optional: centralized config file
  
  default_model_router: automatic  # automatic | manual | smart_routing
  
  # ── MODEL: PRIMARY MODEL ───────────────────────────────
  primary_model:
    name: primary  # Variable reference name
    
    host:
      type: lmstudio  # lmstudio | ollama | llama_cpp_with_vulkan
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 13%
        vram: 3.7GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 150000
        concurrent_requests: 2
      
      min_allowed:
        ram: 9%
        vram: 2.4GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 73500
      
      allocation_strategy: dynamic  # static | dynamic | adaptive
    
    model_memory:
      cache_size: max  # min | max | medium | medium-min | medium-max
      kv_cache_quantization: auto  # auto | q4_k_m | q4_0 | q5_k_m | q5_0 | q6_k | q8_0
      attention_context: auto  # auto | from_max_allowed
    
    execution:
      timeout:
        load_into_memory: 45s
        time_to_first_response: 1m
        total_time_to_response: 4h
      
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true
    
    hooks:
      # ── RUN LIFECYCLE ─────────────────────────
      on_create: {}
      on_run_start: {}
      on_run_complete: {}
      on_run_error: {}
      on_retry: {}
      
      # ── TURN LIFECYCLE ───────────────────────────
      on_turn_start: {}
      on_turn_complete: {}
      on_turn_error: {}
      on_thinking: {}
      
      # ── TOOL LIFECYCLE ─────────────────────────────
      on_tool_call: {}
      on_tool_start: {}
      on_tool_result: {}
      on_tool_error: {}
      
      # ── STREAMING LIFECYCLE ──────────────────────────
      on_stream_chunk: {}
      on_stream_complete: {}

# ── WORKFLOW EXECUTION STRATEGY ───────────────────────────
workflow_execution_strategy:
  
  # ── MODEL LIFECYCLE ────────────────────────────────
  load_unload: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
  
  # ── PROCESSING MODE ───────────────────────────────────
  processing: serial  # serial | parallel | hybrid
  
  # ── PARALLELIZATION CONFIGURATION ─────────────────────────
  parallel:
    enabled: false
    algorithm: priority_queue  # round_robin | priority_queue | shortest_job_first | longest_job_first
    
    load_balancing:
      strategy: least_loaded  # random | least_loaded | ip_hash
      worker_selection_timeout_secs: 10
    
    max_threads: 1
    max_models: 1
    max_concurrent_requests: 2
    max_steps: 1
    max_sub_agents: 1
  
  # ── MEMORY MANAGEMENT ───────────────────────────────────────
  memory:
    allocation:
      strategy: dynamic
      max_allowed:
        ram: 12288MB
        vram: 12288MB
        cpu: 100%
        gpu: 100%
        attention_tokens: 150000
        concurrent_requests: 2
    
    model_lifecycle:
      load_unload_strategy: one_at_a_time
      cache_size: min
      swap_timeout_secs: 30
      unload_unused: true
    
    pressure_handling:
      strategy: throttle  # throttle | swap | fail_fast | graceful_degradation
      memory_threshold_percent: 85
      throttle_factor: 0.5
      on_oom: swap
  
  # ── TIMEOUT MANAGEMENT ───────────────────────────────────
  timeout:
    total: 4h
    tool_call: 30m
    step: 8m
    operation_timeout_secs: 30
    sub_workflow_timeout_secs: 300
    time_to_first_result_secs: 120
    timeout_strategy: continue_with_partial  # fail | continue_with_partial | retry
    
    model:
      load_into_memory: 45s
      time_to_processing_after_loaded: 10000ms
      time_to_processing: 2h
      time_to_responding: 1m
      time_to_response: 4h
  
  # ── ERROR HANDLING ────────────────────────────────────────
  error_handling:
    default_action: retry  # retry | retry_critical_path | skip | fail_workflow
    max_retries_per_step: 3
    retry_backoff_multiplier: 2.0
    escalate_to_model_after: 3

# ── LOGGING CONFIGURATION ────────────────────────────────────
logging:
  
  # ── LOG LEVELS ────────────────────────────────────────
  level: info  # debug | info | warning | error | trace
  
  # ── LOG DETAIL ────────────────────────────────────────
  detail: medium  # low | medium | high | verbose
  
  # ── OUTPUT DESTINATIONS ──────────────────────────────────
  output_destinations:
    chat_file:
      enabled: true
      path: "${workflow.output_path}/script-execution-workflow.md"
      format: markdown
    
    json_file:
      enabled: true
      path: "${workflow.output_path}/logs/execution.json"
      format: json
    
    console:
      enabled: true
      include_timestamps: true
  
  # ── ERROR LOGGING ────────────────────────────────────────
  error_logging:
    enabled: true
    separate_file: true
    path: "${workflow.output_path}/logs/errors.json"
    include_stack_trace: true
    include_context: true

# ── TOOL PERMISSIONS ────────────────────────────────────────
tool_permissions:
  
  # ── FILE OPERATIONS ────────────────────────────────────────
  file_operations:
    read:
      enabled: true
      require_confirmation: false
      allowed_paths:
        - /workspace/src
        - /workspace/config
      allowed_patterns:
        - "*.rs"
        - "*.toml"
        - "*.py"
      forbidden_paths:
        - /workspace/output
        - /workspace/checkpoints
      max_file_size_mb: 100
    
    write:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/output
        - /workspace/checkpoints
      allowed_patterns:
        - "*.json"
        - "*.csv"
      forbidden_paths:
        - /workspace/src
        - /workspace/tests
      max_file_size_mb: 500
      backup_existing: true
      create_parent_directories: true
  
  # ── SHELL OPERATIONS ────────────────────────────────────────
  shell_operations:
    exec:
      enabled: true
      require_confirmation: true
      timeout_seconds: 300
      allowed_commands:
        - cargo
        - python
        - node
      forbidden_commands:
        - rm
        - sudo
        - dd
      working_directories:
        - /workspace
      require_shell_for: ["rm", "sudo", "dd"]

# ── WEB OPERATIONS ────────────────────────────────────────
  web_operations:
    fetch:
      enabled: false
      require_confirmation: true
      max_concurrent_requests: 2
      timeout_secs: 30
      allowed_domains:
        - api.github.com
        - docs.rs
      forbidden_domains:
        - "*.local"
      follow_redirects: true
      validate_ssl: true

# ── WORKFLOW VARIABLES ────────────────────────────────────
workflow:
  codebase_path: /workspace
  output_path: /workspace/output
  checkpoint_path: /workspace/checkpoints
  state_path: /workspace/state
  logs_path: /workspace/logs

# ── PIPELINE DEFINITION ────────────────────────────────────
agentic_workflow:
  hardcoded_values:
    var_asdf: foo
    var_fdsa:
        - bar: 1
          baz: false
  
  steps:
  
  # ── STEP 1: Run Python Script with Environment Variables ─────────────
  step_1_run_python_script:
    name: Run Python Script
    description: Execute Python script with environment variables and capture output
    
    generative_entity: "${models.primary_model}"
    
    prompt: |
        Execute the Python script with environment variables:
        
        Script: ${workflow.input.script_path}
        
        Environment Variables:
        - PYTHONPATH: ${workflow.input.python_path}
        - MODEL_PATH: ${workflow.input.model_path}
        - LOG_LEVEL: ${workflow.input.log_level}
        - WORKSPACE: ${workflow.codebase_path}
        - OUTPUT_PATH: ${workflow.output_path}
        - TIMEOUT: ${workflow.input.timeout_secs}
        
        Run the script and capture:
        - Standard output
        - Error output
        - Exit code
        - Execution time
        
        Expected behavior:
        - Script runs in workspace directory
        - All environment variables are available
        - Output is logged to stdout and stderr
        - On timeout, script is terminated
        - Exit code indicates success
        
        Return structured results.
      
      variables:
        script_path: "${workflow.input.script_path}"
        python_path: "${workflow.input.python_path}"
        model_path: "${workflow.input.model_path}"
        log_level: "${workflow.input.log_level}"
        workspace: "${workflow.codebase_path}"
        output_path: "${workflow.output_path}"
        timeout_secs: "${workflow.input.timeout_secs}"
    
    output:
      save_to: python_script_result
      format: json
      fields:
        - success
        - exit_code
        - execution_time_secs
        - stdout
        - stderr
        - results
      
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff: exponential
  
  # ── STEP 2: Run Bash Command with Parameters ─────────────
  step_2_run_bash_command:
    name: Run Bash Command
    description: Execute bash command with parameters and capture output
    
    generative_entity: "${models.primary_model}"
    
    prompt: |
        Execute bash command with parameters:
        
        Command: ${workflow.input.command}
        
        Working Directory: ${workflow.input.working_dir}
        
        Parameters:
        ${workflow.input.parameters}
        
        Environment Variables:
        - LOG_LEVEL: ${workflow.input.log_level}
        - WORKSPACE: ${workflow.codebase_path}
        - OUTPUT_PATH: ${workflow.output_path}
        - TIMEOUT: ${workflow.input.timeout_secs}
        
        Expected behavior:
        - Command runs in workspace directory
        - All environment variables are available
        - Output is logged to stdout and stderr
        - On timeout, command is terminated
        - Exit code indicates success
        - Command is executed in sub-shell to preserve environment
        
        Return structured results.
      
      variables:
        command: "${workflow.input.command}"
        parameters: "${workflow.input.parameters}"
        working_dir: "${workflow.input.working_dir}"
        log_level: "${workflow.input.log_level}"
        workspace: "${workflow.codebase_path}"
        output_path: "${workflow.output_path}"
        timeout_secs: "${workflow.input.timeout_secs}"
    
    output:
      save_to: bash_command_result
      format: json
      fields:
        - success
        - exit_code
        - execution_time_secs
        - stdout
        - stderr
        - parameters
      
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff: exponential

# ── FEATURES DEMONSTRATED ────────────────────────────────────
features_demonstrated:
  - script_cli_execution
  - environment_variables
  - working_directories
  - output_capture
  - tool_permissions
  - logging_configuration
  - retry_logic
  - timeout_management
  - memory_management
  - workflow_execution_strategy
