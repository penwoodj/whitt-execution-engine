---
workflow_id: agentsdk_agent_with_subagents
name: AgentSDK Agent with Sub-Agents
description: High-level agent spawning sub-agents with AgentSDK framework

# ── MODEL CONFIGURATION ────────────────────────────────
models:
  
  # ── GLOBAL CONFIGURATION FILE ─────────────────────
  # global_config_path: ./workspace/model-config.yml  # Optional: centralized config file
  
  default_model_router: automatic  # automatic | manual | smart_routing
  
  # ── MODEL: MAIN ORCHESTRATOR ─────────────────────
  main_orchestrator:
    name: main_orchestrator  # Variable reference name
    
    host:
      type: lmstudio  # lmstudio | ollama | llama_cpp_with_vulkan
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 13%
        vram: 3.7GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 150000
        concurrent_requests: 2
      
      min_allowed:
        ram: 9%
        vram: 2.4GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 73500
      
      allocation_strategy: dynamic  # static | dynamic | adaptive
    
    model_memory:
      cache_size: min  # min | max | medium | medium-min | medium-max
      kv_cache_quantization: auto  # auto | q4_k_m | q4_0 | q5_k_m | q5_0 | q6_k | q8_0
      attention_context: auto  # auto | from_max_allowed
    
    execution:
      timeout:
        load_into_memory: 10s
        time_to_first_response: 30s
        total_time_to_response: 2h
      
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true
    
    hooks:
      # ── RUN LIFECYCLE ─────────────────────────
      on_create: {}
      on_run_start: {}
      on_run_complete: {}
      on_run_error: {}
      on_retry: {}
      
      # ── TURN LIFECYCLE ───────────────────────────
      on_turn_start: {}
      on_turn_complete: {}
      on_turn_error: {}
      on_thinking: {}
      
      # ── TOOL LIFECYCLE ─────────────────────────────
      on_tool_call: {}
      on_tool_start: {}
      on_tool_result: {}
      on_tool_error: {}
      
      # ── STREAMING LIFECYCLE ──────────────────────────
      on_stream_chunk: {}
      on_stream_complete: {}
  
  # ── MODEL: CODE ANALYZER SUB-AGENT ───────────────
  code_analyzer_subagent:
    name: code_analyzer_subagent  # Variable reference name
    
    host:
      type: llamacpp  # lmstudio | ollama | llama_cpp_with_vulkan
      model_path: /models/code-analyzer.Q4_K_M.gguf
      backend: vulkan
      gpu_layers: 32
    
    resource_limits:
      max_allowed:
        ram: 4GB
        vram: 4GB
        cpu: 50%
        gpu: 80%
        attention_tokens: 8192
        concurrent_requests: 2
      
      min_allowed:
        ram: 2GB
        vram: 2GB
        cpu: 30%
        gpu: 60%
        attention_tokens: 4096
        concurrent_requests: 1
      
      allocation_strategy: dynamic
    
    model_memory:
      cache_size: max
      kv_cache_quantization: q4_k_m
      attention_context: auto
    
    execution:
      timeout:
        load_into_memory: 10s
        time_to_first_response: 30s
        total_time_to_response: 2h
      
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true
    
    hooks:
      on_create: {}
      on_run_start: {}
      on_turn_start: {}
  
  # ── MODEL: DOCS FETCHER SUB-AGENT ──────────────────
  docs_fetcher_subagent:
    name: docs_fetcher_subagent
    
    host:
      type: ollama
      model: "mistral-7b"
      base_url: http://localhost:11434
    
    resource_limits:
      max_allowed:
        ram: 4GB
        vram: 4GB
        cpu: 50%
        gpu: 80%
        attention_tokens: 8192
        concurrent_requests: 3
      
      min_allowed:
        ram: 2GB
        vram: 2GB
        cpu: 30%
        gpu: 60%
        attention_tokens: 4096
        concurrent_requests: 1
      
      allocation_strategy: dynamic
    
    model_memory:
      cache_size: min
      kv_cache_quantization: auto
      attention_context: auto
    
    execution:
      timeout:
        load_into_memory: 10s
        time_to_first_response: 30s
        total_time_to_response: 3h
      
      max_turns: 15
      stop_on_tool_failure: false
      accumulate_tool_results: true
    
    hooks:
      on_create: {}
      on_run_start: {}

# ── WORKFLOW EXECUTION STRATEGY ───────────────────────────
workflow_execution_strategy:
  
  # ── MODEL LIFECYCLE ────────────────────────────────
  load_unload: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
  
  # ── PROCESSING MODE ───────────────────────────────────
  processing: dynamic_parallelization  # serial | parallel | hybrid
  
  # ── PARALLELIZATION CONFIGURATION ─────────────────────────
  parallel:
    enabled: true
    algorithm: priority_queue  # round_robin | priority_queue | shortest_job_first | longest_job_first
    
    load_balancing:
      strategy: least_loaded  # random | least_loaded | ip_hash
      worker_selection_timeout_secs: 10
    
    max_threads: 4
    max_models: 3
    max_concurrent_requests: 2
    max_steps: 2
    max_sub_agents: 3
  
  # ── MEMORY MANAGEMENT ─────────────────────────────────────
  memory:
    allocation:
      strategy: dynamic
      max_allowed:
        ram: 12288MB
        vram: 12288MB
        cpu: 100%
        gpu: 100%
        attention_tokens: 150000
        concurrent_requests: 3
    
    model_lifecycle:
      load_unload_strategy: one_at_a_time
      cache_size: min
      swap_timeout_secs: 30
      unload_unused: true
    
    pressure_handling:
      strategy: throttle  # throttle | swap | fail_fast | graceful_degradation
      memory_threshold_percent: 85
      throttle_factor: 0.5
      on_oom: swap
  
  # ── TIMEOUT MANAGEMENT ───────────────────────────────────
  timeout:
    total: 4h
    tool_call: 30m
    step: 8m
    operation_timeout_secs: 30
    sub_workflow_timeout_secs: 300
    time_to_first_result_secs: 120
    timeout_strategy: continue_with_partial  # fail | continue_with_partial | retry
    
    model:
      load_into_memory: 45s
      time_to_processing_after_loaded: 10000ms
      time_to_processing: 2h
      time_to_responding: 1m
      time_to_response: 4h
  
  # ── ERROR HANDLING ────────────────────────────────────────
  error_handling:
    default_action: retry  # retry | retry_critical_path | skip | fail_workflow
    max_retries_per_step: 3
    retry_backoff_multiplier: 2.0
    escalate_to_model_after: 3
    
    handling_by_type:
      transient_failures:
        action: retry_with_exponential_backoff
        notify_level: warning
      
      permanent_failures:
        action: log_and_continue
        notify_level: error
      
      user_errors:
        action: escalate_immediately
        notify_level: critical
      
      system_errors:
        action: retry_with_fallback
        notify_level: error
    
    max_retry_delay_secs: 300
    min_retry_delay_secs: 500
    retry_on_timeout: true
    retry_on_rate_limit: true
    rate_limit_backoff_strategy: exponential  # exponential | linear | fixed

# ── ORCHESTRRATION CONFIGURATION ───────────────────────────
orchestration:
  
  # ── STEP COORDINATION ────────────────────────────────
  step_coordination:
    max_concurrent_steps: 10
    step_priority: fifo  # fifo | priority_queue | user_defined
    
    inter_step_dependencies:
      enabled: true
      resolution_strategy: wait_for_all  # wait_for_all | continue_with_available | skip_failed
      dependency_timeout_secs: 300
    
    wait_strategy: eager  # eager | lazy
    
    event_propagation_delay_ms: 100
  
  # ── SUB-AGENT ORCHESTRATION ───────────────────────────
  sub_agent_orchestration:
    enabled: true
    
    sub_agents:
      # ── SUB-AGENT: CODE ANALYZER ─────────────────
      - id: code_analyzer_subagent
        name: Code Analyzer
        description: Analyzes code structure and patterns
        workflow_ref: code_analyzer_subagent_workflow
        alias: code_analyzer
        validation_config:
          type: loop
          max_iterations: 4
          tolerance: 0.05
          exact_criteria:
            - metric: analysis_quality
              operator: ">="
              target: 0.85
              required: true
        
        interdependent_validations:
          - depends_on: [docs_fetcher_subagent]
            validation_criteria:
              metric: documentation_coverage
              operator: ">="
              target: 0.80
              on_failure: relax_criteria
              relaxation_factor: 0.10
      
      # ── SUB-AGENT: DOCS FETCHER ─────────────────
      - id: docs_fetcher_subagent
        name: Docs Fetcher
        description: Fetches and analyzes documentation
        workflow_ref: docs_fetcher_subagent_workflow
        alias: docs_fetcher
        validation_config:
          type: loop
          max_iterations: 3
          tolerance: 0.10
          exact_criteria:
            - metric: relevance_score
              operator: ">="
              target: 0.75
              required: true
      
      # ── SUB-AGENT: TEST RUNNER ────────────────────────
      - id: test_runner
        name: Test Runner
        description: Runs test suite
        type: tool
        tool_type: shell_exec
        
        tool:
          type: shell_exec
          config:
            command: "cargo"
            args: ["test", "--workspace"]
            working_dir: "${workflow.codebase_path}"
            timeout_secs: 300
        
        timeout_secs: 300
      
      # ── SUB-AGENT: GIT OPERATIONS ────────────────────────
      - id: git_operations
        name: Git Operations
        description: Manages git operations
        type: tool
        tool_type: cli_run
        
        tool:
          type: cli_run
          config:
            cli: git
            args: ["log", "diff", "branch", "status"]
            working_dir: "${workflow.codebase_path}"
            timeout_secs: 60
    
    event_handling:
      on_validation_result:
        aggregate_at_top_level: true
        propagate_to_dependents: true
        log_result: true
      
      on_interdependent_failure:
        notify_dependent_sub_agents: true
        adjust_validation_criteria: true
        propagate_failure_up: true
        retry_affected_sub_agents: true
      
      on_checkpoint:
        save_state_snapshot: true
        notify_all_sub_agents: true
        track_version: true
  
  # ── VALIDATION AGGREGATION ───────────────────────────────
  validation_aggregation:
    strategy: hierarchical  # hierarchical | conjunction | disjunction | weighted
    
    overall_validation_criteria:
      - name: code_quality_score
        weight: 0.30
        required: true
        threshold: 0.90
      
      - name: documentation_completeness
        weight: 0.25
        required: true
        threshold: 0.85
      
      - name: all_sub_workflows_valid
        weight: 0.25
        required: true
      
      - name: test_results_passing
        weight: 0.20
        required: true
        threshold: 0.80
    
    overall_threshold: 0.85
    min_metrics_required: 4
    calculate_weighted_score: true
  
  # ── CHECKPOINT COORDINATION ────────────────────────────────
  checkpoint_coordination:
    enabled: true
    interval_steps: 3
    
    on_checkpoint:
      notify_all_sub_agents: true
      save_global_state: true
      increment_version: true

# ── LOGGING CONFIGURATION ───────────────────────────────────
logging:
  
  # ── LOG LEVELS ────────────────────────────────────────
  level: debug  # debug | info | warning | error | trace
  
  # ── LOG DETAIL ────────────────────────────────────────
  detail: high  # low | medium | high | verbose
  
  # ── OUTPUT DESTINATIONS ──────────────────────────────────
  output_destinations:
    chat_file:
      enabled: true
      path: "${workflow.output_path}/agentsdk-workflow.md"
      format: markdown
    
    json_file:
      enabled: true
      path: "${workflow.output_path}/logs/execution.json"
      format: json
    
    console:
      enabled: true
      include_timestamps: true
  
  # ── ERROR LOGGING ────────────────────────────────────────
  error_logging:
    enabled: true
    separate_file: true
    path: "${workflow.output_path}/logs/errors.json"
    include_stack_trace: true
    include_context: true

# ── TOOL PERMISSIONS ────────────────────────────────────────
tool_permissions:
  
  # ── FILE OPERATIONS ────────────────────────────────────────
  file_operations:
    read:
      enabled: true
      require_confirmation: false
      allowed_paths:
        - /workspace/src
        - /workspace/config
      allowed_patterns:
        - "*.rs"
        - "*.toml"
        - "*.yml"
      forbidden_paths:
        - /etc
        - /root
      max_file_size_mb: 100
    
    write:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/output
        - /workspace/checkpoints
      allowed_patterns:
        - "*.json"
        - "*.md"
      forbidden_paths:
        - /workspace/src
        - /workspace/tests
      max_file_size_mb: 500
      backup_existing: true
      create_parent_directories: true
    
    delete:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/temp
        - /workspace/cache
      allowed_patterns:
        - "*.tmp"
        - "*.cache"
      forbidden_paths:
        - /workspace/src
        - /workspace/output
      confirm_delete_count: 5
      skip_confirmation_for_patterns:
        - "*.tmp"
  
  # ── WEB OPERATIONS ────────────────────────────────────────
  web_operations:
    fetch:
      enabled: true
      require_confirmation: false
      max_concurrent_requests: 5
      timeout_secs: 30
      allowed_domains:
        - docs.rs
        - github.com
        - api.github.com
      forbidden_domains:
        - "*.local"
      follow_redirects: true
      validate_ssl: true
    
    scrape:
      enabled: true
      require_confirmation: false
      respect_robots_txt: true
      max_pages_per_domain: 100
      follow_links:
        enabled: false
        max_depth: 2
  
  # ── SHELL OPERATIONS ────────────────────────────────────────
  shell_operations:
    exec:
      enabled: true
      require_confirmation: true
      timeout_seconds: 300
      allowed_commands:
        - cargo
        - rustc
        - git
        - ls
        - cat
      forbidden_commands:
        - rm
        - sudo
        - dd
      working_directories:
        - /workspace
      require_shell_for: ["rm", "sudo", "dd"]

# ── METRICS CONFIGURATION ────────────────────────────────────
metrics:
  enabled: true
  
  # ── COLLECTION ────────────────────────────────────────────
  collection:
    pipeline_level:
      - total_duration_secs
      - average_step_duration_secs
      - parallelism_efficiency
    
    step_level:
      - execution_time_secs
      - memory_peak_mb
      - cache_hit_rate
    
    model_level:
      - inference_time_ms
      - tokens_processed
      - cache_hit_rate
    
    tool_level:
      - execution_time_ms
      - success_rate
      - retry_count
    
    custom_metrics:
      - name: code_quality_score
        description: Calculated from lint results
      
      - name: documentation_coverage
        description: Percentage of documented code
      
      - name: sub_agent_success_rate
        description: Successful sub-agent executions

# ── WORKFLOW VARIABLES ────────────────────────────────────────
workflow:
  codebase_path: /workspace
  output_path: /workspace/output
  checkpoint_path: /workspace/checkpoints
  state_path: /workspace/state
  logs_path: /workspace/logs
  max_memory_mb: 12288
  quality_threshold: 0.85

# ── FEATURES DEMONSTRATED ────────────────────────────────────
features_demonstrated:
  - agent_sdk_framework
  - sub_agent_spawning
  - interdependent_validations
  - orchestration
  - validation_aggregation
  - checkpoint_coordination
  - hierarchical_logging
  - tool_permissions
  - resource_management
  - retry_logic
  - timeout_management
  - parallel_execution
  - memory_management
  - error_handling
  - workflow_execution_strategy
