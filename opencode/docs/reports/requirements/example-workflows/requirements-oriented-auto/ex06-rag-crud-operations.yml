---
workflow_id: rag_crud_operations
name: Local RAG CRUD Operations
description: Demonstrate RAG operations with add, query, update, delete

# ── MODEL CONFIGURATION ────────────────────────────────────
models:
  "llama-3.2-3b-instruct":
    name: primary  # Variable reference name
    
    host:
      type: lmstudio
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 6144MB
        vram: 6144MB
        cpu: 100%
        gpu: 100%
        attention_tokens: 12288
        concurrent_requests: 2
      
      allocation_strategy: dynamic  # static | dynamic | adaptive

# ── WORKFLOW EXECUTION STRATEGY ────────────────────────────
workflow_execution_strategy:
  
  # ── MODEL LIFECYCLE ─────────────────────────────────
  load_unload: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
  
  # ── PROCESSING MODE ───────────────────────────────────
  processing: parallel  # parallel | serial | hybrid

# ── MEMORY MANAGEMENT ───────────────────────────────────
memory:
  
  # ── MODEL LIFECYCLE ─────────────────────────────────
  model_lifecycle:
    load_unload_strategy: one_at_a_time
    swap_timeout_secs: 10
    unload_unused: true

# ── LOGGING CONFIGURATION ───────────────────────────────────
logging:
  
  # ── LOG LEVELS ─────────────────────────────────────
  level: debug  # debug | info | warning | error
  
  # ── LOG DETAIL ─────────────────────────────────────
  detail: high  # low | medium | high | verbose
  
  # ── OUTPUT DESTINATIONS ───────────────────────────────
  output_destinations:
    json_file:
      enabled: true
      path: "${workflow.output_path}/logs/rag_workflow.json"
      format: json

# ── RAG CONFIGURATION ─────────────────────────────────────
rag:
  
  # ── RAG BACKEND ───────────────────────────────────────
  backend:
    type: chroma
    config:
      path: /workspace/.rag
      embedding_model: lmstudio://all-MiniLM-L6-v2
      chunk_size: 512
      chunk_overlap: 50
      collection_name: codebase_docs
  
  # ── EXECUTION MODE ───────────────────────────────────
  execution:
    mode: parallel  # parallel | serial | hybrid

# ── PIPELINE DEFINITION ───────────────────────────────────
pipeline:
  
  # ── STEP 1: Add Documentation to RAG ──────────────────
  step_1_add_docs_to_rag:
    name: "Add Documentation to RAG"
    description: "Load documentation into knowledge base"
    type: agent  # agent | tool | sub_workflow | control | loop
    
    model: "${models.primary}"
    
    input:
      prompt: "Load documentation from"

        ${workflow.docs_path}

        into RAG"
      
      rag_operation: add
      rag:
        operation: add
        documents:
          - path: "${workflow.docs_path}/**/*.md"
            metadata:
              type: documentation
              project: yaml-transpiler
              source: project_docs
          - path: "${workflow.docs_path}/**/*.rs"
            metadata:
              type: source_code
              project: yaml-transpiler
              source: project_code
    
    output:
      save_to: rag_add_result
      format: json
      fields:
        - documents_added
        - embeddings_created
  
  # ── STEP 2: Query RAG for Async Patterns ─────────────
  step_2_query_async_patterns:
    name: "Query RAG for Async Patterns"
    description: "Retrieve information about async patterns"
    type: agent
    
    model: "${models.primary}"
    
    input:
      prompt: |
        Query → RAG system for:

        1. How to define async functions in Rust
        2. Common async patterns in tokio
        3. Error handling in async code
        4. Best practices for async Rust
      
      rag_operation: query
      rag:
        operation: query
        query: "async functions tokio error handling patterns"
        top_k: 5
        similarity_threshold: 0.7
        include_metadata: true
        filter:
          type: [documentation, source_code]
    
    output:
      save_to: rag_query_result
      format: json
      fields:
        - results
        - similarities
        - metadata
  
  # ── STEP 3: Generate Code Based on RAG Results ─────────
  step_3_generate_code_from_rag:
    name: "Generate Code from RAG"
    description: "Create async function using RAG information"
    type: agent
    
    model: "${models.primary}"
    
    input:
      prompt: |
        Based on these RAG query results:

        {{step.step_2_query_async_patterns.output.results}}

        Generate a complete Rust async function with proper error handling.

        Include comments explaining → async patterns used.
      
      rag_context: "{{step.step_2_query_async_patterns.output.results}}"
    
    output:
      save_to: generated_code
      format: text
      file_output:
        enabled: true
        path: "${workflow.output_path}/generated_async_fn.rs"
        create_parent_directories: true
  
  # ── STEP 4: Update RAG with Generated Code ─────────────
  step_4_update_rag_with_code:
    name: "Update RAG with Generated Code"
    description: "Add generated code to knowledge base"
    type: agent
    
    model: "${models.primary}"
    
    input:
      prompt: "Update RAG with"

        generated code
      
      rag_operation: update
      rag:
        operation: update
        documents:
          - path: "${workflow.output_path}/generated_async_fn.rs"
            metadata:
              type: generated_code
              source: workflow_generation
              model: "${models.primary.model}"
              generated_at: 2026-03-08
    
    output:
      save_to: rag_update_result
      format: json
      fields:
        - documents_updated
        - embeddings_updated
  
  # ── STEP 5: Test RAG Query with New Content ──────────
  step_5_query_after_update:
    name: "Query After Update"
    description: "Verify newly added code is retrievable"
    type: agent
    
    model: "${models.primary}"
    
    input:
      prompt: "Query for"

        newly added async function
      
      rag_operation: query
      rag:
        operation: query
        query: "generated async function error handling"
        top_k: 3
        similarity_threshold: 0.8
        include_metadata: true
        filter:
          type: generated_code
    
    output:
      save_to: verification_query_result
      format: json
  
  # ── STEP 6: Clean Up Old Documents from RAG ────────────
  step_6_cleanup_old_docs:
    name: "Clean Up Old Documents"
    description: "Remove documents older than 30 days"
    type: agent
    
    model: "${models.primary}"
    
    input:
      prompt: "Delete documents older than 30 days"
      
      rag_operation: delete
      rag:
        operation: delete
        filter:
          created_before: 2025-02-07
          type: [temp, cache]
    
    output:
      save_to: rag_delete_result
      format: json
      fields:
        - documents_deleted
        - count

# ── RAG INDEXING CONFIGURATION ─────────────────────────────
rag_indexing:
  
  # ── AUTO INDEX ───────────────────────────────────────
  auto_index:
    enabled: true
    paths:
      - "${workflow.docs_path}/**/*.md"
      - "${workflow.docs_path}/**/*.rs"
    on_change: true
    index_interval_secs: 300
  
  # ── REINDEX ───────────────────────────────────────────
  reindex:
    enabled: false
    schedule: "0 2 * * *"  # Every 2 hours

# ── RAG-SPECIFIC RETRY CONFIGURATION ────────────────────
rag_retry:
  
  # ── ADD OPERATION ───────────────────────────────────────
  add:
    max_attempts: 5
    backoff_strategy: linear  # exponential | linear | fixed
    delay_ms: 500
  
  # ── QUERY OPERATION ───────────────────────────────────────
  query:
    max_attempts: 3
    backoff_strategy: exponential
    delay_ms: 1000

# ── WORKFLOW VARIABLES ───────────────────────────────────
workflow:
  docs_path: /workspace/docs
  output_path: /workspace/output
  rag_path: /workspace/.rag

# ── FEATURES DEMONSTRATED ───────────────────────────────
features_demonstrated:
  - rag_operations
  - document_indexing
  - similarity_search
  - metadata_filtering
  - incremental_updates
  - document_lifecycle
  - parallel_execution
  - logging_configuration
  - retry_logic
  - cleanup_strategies
