---
workflow_id: parallel_groups_execution
name: Parallel Groups Execution with Resource Management
description: |
  Demonstrates advanced parallel group execution with multiple parallel groups,
  resource allocation per group, parallel timeout handling, error handling strategies,
  and result aggregation from parallel executions.

models:
  primary_processor:
    name: primary_processor
    host:
      type: lmstudio
      connection_settings:
        host: localhost
        port: 1234
    resource_limits:
      max_allowed:
        ram: 10GB
        vram: 6GB
        cpu: 60%
        attention_tokens: 8192
        concurrent_requests: 4
      min_allowed:
        ram: 5GB
        vram: 3GB
        cpu: 30%
        attention_tokens: 4096
      allocation_strategy: dynamic
    execution:
      timeout:
        load_into_memory: 30s
        time_to_first_response: 45s
        total_time_to_response: 15m
      max_turns: 5

  secondary_processor:
    name: secondary_processor
    host:
      type: ollama
      connection_settings:
        base_url: http://localhost:11434
    resource_limits:
      max_allowed:
        ram: 8GB
        vram: 4GB
        cpu: 50%
        attention_tokens: 6144
        concurrent_requests: 3
      min_allowed:
        ram: 4GB
        vram: 2GB
        cpu: 25%
        attention_tokens: 3072
      allocation_strategy: dynamic
    execution:
      timeout:
        load_into_memory: 25s
        time_to_first_response: 35s
        total_time_to_response: 12m
      max_turns: 4

  aggregation_model:
    name: aggregation_model
    host:
      type: lmstudio
      connection_settings:
        host: localhost
        port: 1235
    resource_limits:
      max_allowed:
        ram: 6GB
        vram: 3GB
        cpu: 40%
        attention_tokens: 4096
        concurrent_requests: 2
      min_allowed:
        ram: 3GB
        vram: 1.5GB
        cpu: 20%
        attention_tokens: 2048
      allocation_strategy: dynamic
    execution:
      timeout:
        load_into_memory: 20s
        time_to_first_response: 30s
        total_time_to_response: 10m
      max_turns: 3

workflow_execution_strategy:
  processing: parallel
  parallel:
    enabled: true
    algorithm: priority_queue
    load_balancing:
      strategy: least_loaded
      worker_selection_timeout_secs: 15
      enabled: true
    max_threads: 8
    max_models: 3
    max_concurrent_requests: 4
    max_steps: 6
    max_sub_agents: 4
    parallel_group_timeout_secs: 600
  resource_allocation:
    strategy: adaptive
    cpu_reservation_percent: 75
    gpu_reservation_mb: 8192
    network_bandwidth_reservation_mbps: 100
    pre_allocation_enabled: true
    allocation_policy:
      memory: balanced
      cpu: balanced
      gpu: greedy
  dependency_resolution:
    strategy: wait_for_all
    timeout_secs: 300
    propagate_failure_to_dependents: true
    max_wait_for_dependencies_secs: 600
    on_dependency_failure: fail_workflow
  timeout:
    total: 45m
    per_operation:
      step: 10m
      tool_call: 3m
      parallel_group: 15m
    timeout_strategy: continue_with_partial
  error_handling:
    default_action:
      type: retry
      reason: "Automatic recovery for transient failures in parallel groups"
    retry:
      max_attempts_per_step: 3
      max_attempts_per_workflow: 5
      backoff_strategy:
        type: exponential
        base_delay_ms: 2000
        max_delay_ms: 60000
        jitter_factor: 0.25
    parallel_group_error_handling:
      fail_group_on_any_failure: false
      fail_group_on_critical_failure: true
      partial_results_enabled: true
      min_successful_ratio: 0.6

logging:
  enabled: true
  levels:
    default: info
    workflow: info
    pipeline: debug
    models: warning
    execution: debug
    parallel_groups: debug
  scopes:
    workflow:
      enabled: true
      include_timestamps: true
    pipeline:
      enabled: true
      include_step_transitions: true
      include_parallel_group_events: true
    parallel_execution:
      enabled: true
      include_worker_assignment: true
      include_resource_allocation: true
  output:
    console:
      enabled: true
      color: true
      timestamps: true
    file:
      enabled: true
      path: /workspace/logs/parallel-groups-execution.log
      format: json

workflow:
  data_path: /workspace/data
  output_path: /workspace/output
  temp_path: /workspace/temp
  config_path: /workspace/config

pipeline:
  - step: initialize_pipeline
    id: step_1
    name: "Initialize Data Processing Pipeline"
    description: "Load configuration and prepare pipeline for parallel execution"
    type: agent
    model: "${models.primary_processor}"
    input:
      prompt: |
        Initialize the data processing pipeline:
        1. Load configuration from: ${workflow.config_path}/pipeline.yml
        2. Validate input data sources: ${workflow.data_path}
        3. Check disk space for output: ${workflow.output_path}
        4. Prepare temporary workspace: ${workflow.temp_path}
        5. Validate all required resources are available
        Output initialization status with available resources.
    output:
      save_to: init_status
      format: json
      fields:
        - config_valid
        - data_sources_available
        - disk_space_gb
        - resources_ready
        - temp_space_gb
    retry:
      max_attempts: 2
      backoff_strategy: exponential

  - step: extract_json_data
    id: step_2a
    name: "Extract JSON Data"
    description: "Extract data from JSON files in parallel"
    type: agent
    model: "${models.primary_processor}"
    parallel_group: extraction
    max_parallel: 3
    depends_on:
      - step_1
    timeout_secs: 600
    input:
      prompt: |
        Extract data from JSON files:
        Source: ${workflow.data_path}/json/*
        Target output: ${workflow.temp_path}/extracted/json/
        Tasks:
        1. List all JSON files in source directory
        2. Parse each JSON file and extract relevant fields
        3. Normalize data structure across all files
        4. Aggregate extracted data
        5. Save normalized results to target directory
        Output extraction statistics.
      variables:
        source: "${workflow.data_path}/json"
        target: "${workflow.temp_path}/extracted/json"
    output:
      save_to: json_extraction_result
      format: json
      fields:
        - files_processed
        - records_extracted
        - errors_encountered
        - processing_time_ms
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 3000

  - step: extract_csv_data
    id: step_2b
    name: "Extract CSV Data"
    description: "Extract data from CSV files in parallel"
    type: agent
    model: "${models.primary_processor}"
    parallel_group: extraction
    max_parallel: 3
    depends_on:
      - step_1
    timeout_secs: 600
    input:
      prompt: |
        Extract data from CSV files:
        Source: ${workflow.data_path}/csv/*
        Target output: ${workflow.temp_path}/extracted/csv/
        Tasks:
        1. List all CSV files in source directory
        2. Parse each CSV file handling headers
        3. Handle missing values and data type conversion
        4. Normalize field names across files
        5. Aggregate extracted data
        6. Save normalized results to target directory
        Output extraction statistics.
      variables:
        source: "${workflow.data_path}/csv"
        target: "${workflow.temp_path}/extracted/csv"
    output:
      save_to: csv_extraction_result
      format: json
      fields:
        - files_processed
        - records_extracted
        - errors_encountered
        - processing_time_ms
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 3000

  - step: extract_xml_data
    id: step_2c
    name: "Extract XML Data"
    description: "Extract data from XML files in parallel"
    type: agent
    model: "${models.primary_processor}"
    parallel_group: extraction
    max_parallel: 3
    depends_on:
      - step_1
    timeout_secs: 600
    input:
      prompt: |
        Extract data from XML files:
        Source: ${workflow.data_path}/xml/*
        Target output: ${workflow.temp_path}/extracted/xml/
        Tasks:
        1. List all XML files in source directory
        2. Parse XML structure and extract elements
        3. Handle nested elements and attributes
        4. Normalize data structure
        5. Aggregate extracted data
        6. Save normalized results to target directory
        Output extraction statistics.
      variables:
        source: "${workflow.data_path}/xml"
        target: "${workflow.temp_path}/extracted/xml"
    output:
      save_to: xml_extraction_result
      format: json
      fields:
        - files_processed
        - records_extracted
        - errors_encountered
        - processing_time_ms
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 3000

  - step: extract_database_data
    id: step_2d
    name: "Extract Database Data"
    description: "Extract data from database sources in parallel"
    type: agent
    model: "${models.primary_processor}"
    parallel_group: extraction
    max_parallel: 3
    depends_on:
      - step_1
    timeout_secs: 600
    input:
      prompt: |
        Extract data from database sources:
        Database config: ${workflow.config_path}/database.yml
        Target output: ${workflow.temp_path}/extracted/database/
        Tasks:
        1. Load database connection configuration
        2. Execute queries to extract required tables
        3. Handle pagination for large result sets
        4. Transform to normalized format
        5. Aggregate extracted data
        6. Save normalized results to target directory
        Output extraction statistics.
      variables:
        config: "${workflow.config_path}/database.yml"
        target: "${workflow.temp_path}/extracted/database"
    output:
      save_to: database_extraction_result
      format: json
      fields:
        - tables_processed
        - records_extracted
        - errors_encountered
        - processing_time_ms
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 3000

  - step: transform_data_quality
    id: step_3a
    name: "Data Quality Transformation"
    description: "Apply data quality rules in parallel"
    type: agent
    model: "${models.secondary_processor}"
    parallel_group: transformation
    max_parallel: 2
    depends_on:
      - step_2a
      - step_2b
      - step_2c
      - step_2d
    timeout_secs: 480
    input:
      prompt: |
        Apply data quality transformations:
        Input sources:
        - JSON: ${workflow.temp_path}/extracted/json/
        - CSV: ${workflow.temp_path}/extracted/csv/
        - XML: ${workflow.temp_path}/extracted/xml/
        - Database: ${workflow.temp_path}/extracted/database/
        Output: ${workflow.temp_path}/transformed/quality/
        Tasks:
        1. Validate data completeness (required fields)
        2. Check data types and formats
        3. Detect and flag outliers
        4. Apply standardization rules
        5. Generate quality report
        Output transformation statistics.
      variables:
        json: "${workflow.temp_path}/extracted/json"
        csv: "${workflow.temp_path}/extracted/csv"
        xml: "${workflow.temp_path}/extracted/xml"
        db: "${workflow.temp_path}/extracted/database"
        output: "${workflow.temp_path}/transformed/quality"
    output:
      save_to: quality_transformation_result
      format: json
      fields:
        - records_processed
        - quality_score
        - issues_found
        - transformations_applied
        - processing_time_ms
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  - step: transform_data_enrichment
    id: step_3b
    name: "Data Enrichment Transformation"
    description: "Enrich data with derived fields in parallel"
    type: agent
    model: "${models.secondary_processor}"
    parallel_group: transformation
    max_parallel: 2
    depends_on:
      - step_2a
      - step_2b
      - step_2c
      - step_2d
    timeout_secs: 480
    input:
      prompt: |
        Apply data enrichment transformations:
        Input: ${workflow.temp_path}/transformed/quality/
        Output: ${workflow.temp_path}/transformed/enriched/
        Tasks:
        1. Calculate derived metrics from existing fields
        2. Add computed fields (totals, averages, ratios)
        3. Generate hash identifiers for records
        4. Add timestamp metadata
        5. Generate enrichment report
        Output enrichment statistics.
      variables:
        input: "${workflow.temp_path}/transformed/quality"
        output: "${workflow.temp_path}/transformed/enriched"
    output:
      save_to: enrichment_transformation_result
      format: json
      fields:
        - records_processed
        - fields_added
        - derivations_calculated
        - enrichment_score
        - processing_time_ms
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  - step: transform_data_aggregation
    id: step_3c
    name: "Data Aggregation Transformation"
    description: "Aggregate data for reporting in parallel"
    type: agent
    model: "${models.secondary_processor}"
    parallel_group: transformation
    max_parallel: 2
    depends_on:
      - step_3a
      - step_3b
    timeout_secs: 480
    input:
      prompt: |
        Apply data aggregation transformations:
        Input: ${workflow.temp_path}/transformed/enriched/
        Output: ${workflow.temp_path}/transformed/aggregated/
        Tasks:
        1. Group records by key dimensions
        2. Calculate aggregate metrics per group
        3. Generate summary statistics
        4. Create rollup tables
        5. Generate aggregation report
        Output aggregation statistics.
      variables:
        input: "${workflow.temp_path}/transformed/enriched"
        output: "${workflow.temp_path}/transformed/aggregated"
    output:
      save_to: aggregation_transformation_result
      format: json
      fields:
        - records_processed
        - groups_created
        - aggregate_metrics
        - summary_statistics
        - processing_time_ms
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  - step: validate_transformations
    id: step_4
    name: "Validate All Transformations"
    description: "Validate transformation results across all groups"
    type: agent
    model: "${models.aggregation_model}"
    depends_on:
      - step_3a
      - step_3b
      - step_3c
    input:
      prompt: |
        Validate all transformation results:
        Quality Results: {{step.step_3a.output.quality_transformation_result}}
        Enrichment Results: {{step.step_3b.output.enrichment_transformation_result}}
        Aggregation Results: {{step.step_3c.output.aggregation_transformation_result}}
        Validation criteria:
        1. All records successfully processed
        2. Quality scores meet threshold (>0.8)
        3. Enrichment coverage >95%
        4. Aggregation accuracy verified
        5. No data loss during transformations
        Output validation status and any issues.
      variables:
        quality: "${step.step_3a.output.quality_transformation_result}"
        enrichment: "${step.step_3b.output.enrichment_transformation_result}"
        aggregation: "${step.step_3c.output.aggregation_transformation_result}"
    output:
      save_to: validation_result
      format: json
      fields:
        - is_valid
        - issues_found
        - quality_score
        - enrichment_coverage
        - aggregation_accuracy
    retry:
      max_attempts: 2
      backoff_strategy: exponential

  - step: analyze_patterns
    id: step_5a
    name: "Pattern Analysis"
    description: "Analyze data patterns in parallel"
    type: agent
    model: "${models.primary_processor}"
    parallel_group: analysis
    max_parallel: 2
    depends_on:
      - step_4
    input:
      prompt: |
        Perform pattern analysis on processed data:
        Data: ${workflow.temp_path}/transformed/enriched/
        Tasks:
        1. Identify recurring patterns in data
        2. Detect trends and anomalies
        3. Cluster similar records
        4. Generate pattern report
        Output pattern analysis results.
      variables:
        data: "${workflow.temp_path}/transformed/enriched"
    output:
      save_to: pattern_analysis_result
      format: json
      fields:
        - patterns_found
        - trends_identified
        - anomalies_detected
        - clusters_created
        - confidence_scores
    retry:
      max_attempts: 2
      backoff_strategy: exponential

  - step: analyze_correlations
    id: step_5b
    name: "Correlation Analysis"
    description: "Analyze data correlations in parallel"
    type: agent
    model: "${models.primary_processor}"
    parallel_group: analysis
    max_parallel: 2
    depends_on:
      - step_4
    input:
      prompt: |
        Perform correlation analysis on processed data:
        Data: ${workflow.temp_path}/transformed/aggregated/
        Tasks:
        1. Calculate correlations between fields
        2. Identify strongly correlated pairs
        3. Detect multicollinearity
        4. Generate correlation matrix
        5. Generate correlation report
        Output correlation analysis results.
      variables:
        data: "${workflow.temp_path}/transformed/aggregated"
    output:
      save_to: correlation_analysis_result
      format: json
      fields:
        - correlations_found
        - strong_correlations
        - multicollinearity_detected
        - correlation_matrix
        - insights
    retry:
      max_attempts: 2
      backoff_strategy: exponential

  - step: aggregate_final_results
    id: step_6
    name: "Aggregate Final Results"
    description: "Aggregate all parallel execution results into final output"
    type: agent
    model: "${models.aggregation_model}"
    depends_on:
      - step_5a
      - step_5b
    input:
      prompt: |
        Aggregate all results from parallel execution:
        Extraction Results:
        - JSON: {{step.step_2a.output.json_extraction_result}}
        - CSV: {{step.step_2b.output.csv_extraction_result}}
        - XML: {{step.step_2c.output.xml_extraction_result}}
        - Database: {{step.step_2d.output.database_extraction_result}}
        Transformation Results:
        - Quality: {{step.step_3a.output.quality_transformation_result}}
        - Enrichment: {{step.step_3b.output.enrichment_transformation_result}}
        - Aggregation: {{step.step_3c.output.aggregation_transformation_result}}
        Analysis Results:
        - Patterns: {{step.step_5a.output.pattern_analysis_result}}
        - Correlations: {{step.step_5b.output.correlation_analysis_result}}
        Tasks:
        1. Combine extraction statistics
        2. Summarize transformation metrics
        3. Integrate analysis findings
        4. Generate executive summary
        5. Create final report
        Output comprehensive aggregated results.
      variables:
        json_ext: "${step.step_2a.output.json_extraction_result}"
        csv_ext: "${step.step_2b.output.csv_extraction_result}"
        xml_ext: "${step.step_2c.output.xml_extraction_result}"
        db_ext: "${step.step_2d.output.database_extraction_result}"
        quality: "${step.step_3a.output.quality_transformation_result}"
        enrichment: "${step.step_3b.output.enrichment_transformation_result}"
        aggregation: "${step.step_3c.output.aggregation_transformation_result}"
        patterns: "${step.step_5a.output.pattern_analysis_result}"
        correlations: "${step.step_5b.output.correlation_analysis_result}"
    output:
      save_to: final_results
      format: json
      file_output:
        enabled: true
        path: "${workflow.output_path}/final-results.json"
        format: json
      fields:
        - total_records_processed
        - overall_quality_score
        - execution_metrics
        - key_findings
        - recommendations
    retry:
      max_attempts: 2
      backoff_strategy: exponential

  - step: generate_report
    id: step_7
    name: "Generate Final Report"
    description: "Generate formatted final report"
    type: agent
    model: "${models.aggregation_model}"
    depends_on:
      - step_6
    input:
      prompt: |
        Generate final formatted report:
        Final Results: {{step.step_6.output.final_results}}
        Create comprehensive report including:
        1. Executive summary
        2. Data processing statistics
        3. Quality metrics
        4. Analysis findings
        5. Recommendations
        Output formatted markdown report.
      variables:
        results: "${step.step_6.output.final_results}"
    output:
      save_to: final_report
      format: markdown
      file_output:
        enabled: true
        path: "${workflow.output_path}/final-report.md"
        format: markdown

features_demonstrated:
  - parallel_group_definitions
  - multiple_parallel_groups
  - max_parallel_limits_per_group
  - parallel_group_timeout_handling
  - resource_allocation_strategy
  - adaptive_resource_management
  - cpu_gpu_reservation
  - pre_allocation_enabled
  - parallel_group_error_handling
  - partial_results_enabled
  - min_successful_ratio_configuration
  - retry_with_exponential_backoff
  - aggregation_from_parallel_groups
  - cross_group_result_combination
  - final_result_aggregation
  - load_balancing_strategy
  - worker_selection_timeout
  - priority_queue_algorithm
  - dependency_resolution_wait_for_all
  - parallel_group_timeout_secs
  - step_timeout_configuration
  - timeout_strategy_continue_with_partial
  - multiple_model_configurations
  - model_selection_per_group_type
  - dynamic_resource_limits