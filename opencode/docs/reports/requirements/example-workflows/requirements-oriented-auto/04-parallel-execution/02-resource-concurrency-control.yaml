---
workflow_id: resource_concurrency_control
name: Parallel Execution with Resource Limits and Concurrency Control
description: |
  Demonstrates advanced parallel execution patterns with fine-grained resource
  management, per-group concurrency limits, resource quotas, and comprehensive
  concurrency control mechanisms including throttling and priority-based scheduling.

models:
  primary_processor:
    name: "Primary Processing Agent"
    host:
      type: lmstudio
      connection_settings:
        host: localhost
        port: 1234
    resource_limits:
      max_allowed:
        ram: 12GB
        vram: 6GB
        cpu: 60%
        gpu: 60%
        attention_tokens: 8192
        concurrent_requests: 3
      min_allowed:
        ram: 6GB
        vram: 3GB
        cpu: 30%
        gpu: 30%
        attention_tokens: 4096
      ram_allocation:
        strategy: dynamic
    execution:
      timeout:
        load_into_memory: 40s
        time_to_first_response: 60s
        total_time_to_response: 20m
      max_turns: 8
      stop_on_tool_failure: false
    model_memory:
      cache_size: medium
      kv_cache_quantization: auto
      attention_context: auto
    thinking:
      budget_tokens: 4096
      capture_in_output: true
    tools:
      default_permissions:
        web_access: ask
        file_read: trust
        file_write: ask
        shell_exec: ask
      allowed_tools: [grep, file_read, file_write, bash]
    hooks:
      on_run_start:
        log:
          message: "Starting primary processing agent"
          level: info
  
  coordinator:
    name: "Resource Coordinator Agent"
    host:
      type: lmstudio
      connection_settings:
        host: localhost
        port: 1235
    resource_limits:
      max_allowed:
        ram: 6GB
        vram: 3GB
        cpu: 40%
        gpu: 40%
        attention_tokens: 4096
        concurrent_requests: 2
      min_allowed:
        ram: 3GB
        vram: 1.5GB
        cpu: 20%
        gpu: 20%
        attention_tokens: 2048
      ram_allocation:
        strategy: adaptive
    execution:
      timeout:
        load_into_memory: 25s
        time_to_first_response: 40s
        total_time_to_response: 12m
      max_turns: 5
    model_memory:
      cache_size: min
      kv_cache_quantization: auto

workflow_execution_strategy:
  load_unload: adaptive
  processing: parallel
  
  parallel:
    algorithm: priority_queue
    load_balancing:
      strategy: least_loaded
      worker_selection_timeout_secs: 15
    max_threads: 8
    max_models: 2
    max_concurrent_requests: 4
    max_steps: 6
    max_sub_agents: 3
    parallel_group_timeout_secs: 600
  
  resource_allocation:
    strategy: adaptive
    cpu_reservation_percent: 75
    gpu_reservation_mb: 8192
    pre_allocation_enabled: true
    allocation_policy:
      memory: balanced
      cpu: balanced
      gpu: greedy
  
  concurrency_limits:
    model_loading: 2
    tool_execution: 8
    file_operations: 5
    api_requests: 4
    sub_agent_spawning: 3
    workflow_execution: 2
  
  memory:
    allocation:
      strategy: adaptive
      max_allowed:
        ram: 60%
        vram: 12GB
        cpu: 80%
        gpu: 80%
      min_allowed:
        ram: 30%
        vram: 4GB
        cpu: 40%
        gpu: 40%
    model_lifecycle:
      load_unload_strategy: adaptive
      cache_size: medium
      swap_timeout_secs: 30
      unload_unused: true
    pressure_handling:
      trigger_threshold_percent: 80
      strategy: throttle
      throttle_factor: 0.5
      on_oom: swap
  
  timeout:
    total: 60m
    per_operation:
      tool_call: 5m
      step: 15m
      sub_workflow: 20m
      time_to_first_result_secs: 120
    timeout_strategy: continue_with_partial
  
  error_handling:
    default_action:
      type: retry
    retry:
      max_attempts_per_step: 3
      max_attempts_per_workflow: 8
      backoff_strategy:
        type: exponential
        base_delay_ms: 2000
        max_delay_ms: 60000
      retry_on_timeout: true
      resource_aware_retry:
        check_resources_before_retry: true
        skip_retry_if_low_memory: true
        memory_threshold_percent: 85
  
  dependency_resolution:
    strategy: wait_for_all
    timeout_secs: 300
    propagate_failure_to_dependents: true
  
  step_prioritization:
    strategy: resource_optimized
    priority_levels:
      - name: critical
        weight: 10
      - name: high
        weight: 7
      - name: medium
        weight: 5
      - name: low
        weight: 2
  
  performance_optimization:
    cache:
      ttl_seconds: 1800
      max_size_mb: 512
      eviction_policy: lru
    batching:
      batch_similar_operations: true
      batch_size: 5
    prefetching:
      disabled: true
  
  adaptive:
    resource_monitoring:
      interval_secs: 10
      metrics: [cpu, memory, gpu, io, network]
    memory_pressure_handling:
      strategy: throttle
      memory_threshold_percent: 80
      throttle_factor: 0.5
      on_oom: swap
    concurrency_adjustment:
      strategy: scale_up_down
      adjustment_interval_secs: 30
      max_parallel_adjustment: 3
      scale_up_threshold_percent: 60
      scale_down_threshold_percent: 85

metrics:
  collection:
    pipeline_level:
      - total_duration_secs
      - parallelism_efficiency
      - resource_utilization_percent
      - throttling_events_count
    step_level:
      - execution_time_secs
      - memory_peak_mb
      - cpu_usage_percent
    model_level:
      - inference_time_ms
      - memory_usage_mb
    concurrency_level:
      - concurrent_steps_count
      - queue_length
      max_attempts: 2
      backoff_strategy: exponential

  # Phase 2: Parallel execution with group-based resource limits
  - step: parallel_group_cpu_intensive
    id: step_2a
    name: "CPU-Intensive Analysis"
    description: "Execute CPU-intensive tasks with resource limits"    model: "${models.primary_processor}"
    parallel_group: cpu_intensive
    max_parallel: 3
    depends_on:
      - step_1
    timeout_secs: 600
    resource_quota:
      cpu: 40%
      ram: 20%
      gpu: 10%
      max_concurrent: 3
    input:
      prompt: |
        Execute CPU-intensive analysis tasks within resource constraints:
        - CPU quota: 40%, RAM quota: 20%, Max concurrent: 3
        - Tasks: Compile code patterns, run static analysis, calculate complexity metrics
    when:

      after_step_succeeds:

        save_to: cpu_results        - tasks_completed
        - cpu_time_ms
        - peak_cpu_usage_percent
        - resource_utilization
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  - step: parallel_group_gpu_intensive
    id: step_2b
    name: "GPU-Intensive Processing"
    description: "Execute GPU-intensive tasks with resource limits"    model: "${models.primary_processor}"
    parallel_group: gpu_intensive
    max_parallel: 2
    depends_on:
      - step_1
    timeout_secs: 600
    resource_quota:
      cpu: 10%
      ram: 15%
      gpu: 50%
      max_concurrent: 2
    input:
      prompt: |
        Execute GPU-intensive processing tasks within resource constraints:
        - GPU quota: 50%, RAM quota: 15%, Max concurrent: 2
        - Tasks: Neural network inference, GPU batch operations
    when:

      after_step_succeeds:

        save_to: gpu_results        - tasks_completed
        - gpu_time_ms
        - peak_gpu_usage_percent
        - memory_usage_mb
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  # Phase 3: Resource coordination
  - step: coordinate_resources
    id: step_3
    name: "Coordinate Resources"
    description: "Monitor resource usage and rebalance quotas if needed"    model: "${models.coordinator}"
    depends_on:
      - step_2a
      - step_2b
    priority: high
    input:
      prompt: |
        Coordinate resources based on parallel execution results:
        - CPU-Intensive Results: {{step.step_2a.output.cpu_results}}
        - GPU-Intensive Results: {{step.step_2b.output.gpu_results}}
        - Analyze utilization, identify bottlenecks, calculate efficiency metrics
      variables:
        cpu_results: "${step.step_2a.output.cpu_results}"
        gpu_results: "${step.step_2b.output.gpu_results}"
    when:

      after_step_succeeds:

        save_to: coordination_report        - resource_utilization_summary
        - bottlenecks_identified
        - throttling_events
        - rebalancing_recommendations
    retry:
      max_attempts: 2
      backoff_strategy: exponential

  # Phase 4: Adaptive execution
  - step: adaptive_parallel_execution
    id: step_4a
    name: "Adaptive Parallel Execution"
    description: "Execute tasks with dynamic resource allocation"    model: "${models.primary_processor}"
    parallel_group: adaptive
    max_parallel: 4
    depends_on:
      - step_3
    timeout_secs: 480
    input:
      prompt: |
        Execute tasks with adaptive resource allocation:
        - Current system state: {{step.step_3.output.coordination_report}}
        - Monitor pressure, adjust concurrency, prioritize tasks
        - Scale up if usage < 60%, scale down if usage > 85%
      variables:
        coordination: "${step.step_3.output.coordination_report}"
    when:

      after_step_succeeds:

        save_to: adaptive_results        - tasks_completed
        - scaling_events
        - avg_concurrency
        - resource_efficiency
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  - step: adaptive_memory_management
    id: step_4b
    name: "Adaptive Memory Management"
    description: "Manage memory with dynamic allocation and eviction"    model: "${models.primary_processor}"
    parallel_group: adaptive
    max_parallel: 3
    depends_on:
      - step_3
    timeout_secs: 480
    input:
      prompt: |
        Execute adaptive memory management:
        - Current system state: {{step.step_3.output.coordination_report}}
        - Monitor memory pressure, apply LRU eviction, implement tiered caching
      variables:
        coordination: "${step.step_3.output.coordination_report}"
    when:

      after_step_succeeds:

        save_to: memory_management_results        - memory_utilization_percent
        - eviction_events
        - cache_efficiency
        - oom_prevention_count
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  # Phase 5: Resource limit enforcement tests
  - step: test_concurrency_limits
    id: step_5a
    name: "Test Concurrency Limits"
    description: "Demonstrate concurrency limit enforcement"    model: "${models.coordinator}"
    depends_on:
      - step_4a
      - step_4b
    priority: high
    input:
      prompt: |
        Test concurrency limit enforcement for:
        1. Model loading (max 2 concurrent)
        2. Tool execution (max 8 concurrent)
        3. File operations (max 5 concurrent)
        4. API requests (max 4 concurrent)
        5. Sub-agent spawning (max 3 concurrent)
    when:

      after_step_succeeds:

        save_to: concurrency_limit_test        - model_loading_limit_status
        - tool_execution_limit_status
        - file_operations_limit_status
        - api_requests_limit_status
        - limit_enforcement_success
    retry:
      max_attempts: 2
      backoff_strategy: exponential

  - step: test_throttling_behavior
    id: step_5c
    name: "Test Throttling Behavior"
    description: "Demonstrate throttling mechanism under resource pressure"    model: "${models.coordinator}"
    depends_on:
      - step_5a
    priority: high
    input:
      prompt: |
        Test throttling behavior with:
        - Trigger threshold: 80%
        - Throttle factor: 0.5 (reduce by 50%)
        - Simulate high resource pressure (>85% usage)
        - Verify throttling is triggered and system remains stable
    when:

      after_step_succeeds:

        save_to: throttling_test        - throttling_triggered
        - trigger_threshold_percent
        - concurrency_before_throttling
        - concurrency_after_throttling
        - throughput_impact
    retry:
      max_attempts: 2
      backoff_strategy: exponential

  # Phase 6: Generate report
  - step: generate_report
    id: step_6
    name: "Generate Resource Management Report"
    description: "Generate comprehensive report on resource limits and concurrency control"    model: "${models.coordinator}"
    depends_on:
      - step_5a
      - step_5c
    priority: critical
    input:
      prompt: |
        Generate comprehensive resource management report:
        - Concurrency limits: {{step.step_5a.output.concurrency_limit_test}}
        - Throttling behavior: {{step.step_5c.output.throttling_test}}
        - Adaptive execution: {{step.step_4a.output.adaptive_results}}
        - Memory management: {{step.step_4b.output.memory_management_results}}
      variables:
        concurrency: "${step.step_5a.output.concurrency_limit_test}"
        throttling: "${step.step_5c.output.throttling_test}"
        adaptive_exec: "${step.step_4a.output.adaptive_results}"
        adaptive_mem: "${step.step_4b.output.memory_management_results}"
    when:

      after_step_succeeds:

        save_to: resource_management_report      file_output:
        path: "${workflow.output_path}/resource-concurrency-control-report.json"
        format: json
      fields:
        - executive_summary
        - concurrency_limit_analysis
        - throttling_effectiveness
        - adaptive_behavior_analysis
        - recommendations
    retry:
      max_attempts: 2
      backoff_strategy: exponential

