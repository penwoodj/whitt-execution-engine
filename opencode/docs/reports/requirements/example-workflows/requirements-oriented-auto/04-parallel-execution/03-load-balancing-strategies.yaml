---
workflow_id: load_balancing_strategies
name: Load Balancing Across Parallel Workers
description: Demonstrates load balancing strategies including least_loaded, random, ip_hash, and worker selection timeout for parallel execution
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - parallel-execution
  - load-balancing
  - worker-selection
  - performance-optimization

models:
  load_balancer:
    name: "Load Balancer"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: parallel

load_balancing:
  
  strategy:
    type: least_loaded
    worker_selection_timeout_ms: 5000
    enable_fallback: true
    health_check_interval_secs: 60

  worker_configuration:
    workers:
      worker_1:
        name: "Primary Worker 1"
        host: "localhost"
        port: 8081
        weight: 1.0
        status: active
      
      worker_2:
        name: "Primary Worker 2"
        host: "localhost"
        port: 8082
        weight: 1.0
        status: active
      
      worker_3:
        name: " secondary Worker"
        host: "localhost"
        port: 8083
        weight: 0.8
        status: active
      
      worker_4:
        name: "Secondary Worker 1"
        host: "localhost"
        port: 8084
        weight: 1.0
        status: active

agentic_workflow:
  step_1_worker_health_check:
    name: "Check Worker Health"    model: "${models.load_balancer}"
  
    input:
      prompt: |
        Check health status of all workers.
        
        Health checks:
        1. Check worker connectivity (host:port reachability)
        2. Check worker load (CPU, memory usage)
        3. Check worker response time
        4. Verify all workers responsive
        
        Worker status:
        - Worker 1: active (connected, low load, responsive)
        - Worker 2: active (connected, low load, responsive)
        - Worker 3: active (connected, low load, responsive)
        - Worker 4: active (connected, low load, responsive)
        
        Return health status of all workers.

    when:


      after_step_succeeds:


        save_to: worker_health
  step_2_distribute_tasks:
    name: "Distribute Tasks Using Least Loaded"    model: "${models.load_balancer}"
  
    input:
      prompt: |
        Distribute tasks to workers using least_loaded strategy.
        
        Task distribution:
        - Collect all pending tasks from queue
        - Sort by priority (high, medium, low)
        - Select worker with lowest current load
        - Assign task to selected worker
        - Track worker load after assignment
        - Update worker status
        
        Least loaded strategy:
        - Select worker: minimum (CPU + memory)
        - Consider task priority
        - Account for worker warming effects
        - Estimate task duration
        - Rebalance if worker gets overloaded
        
        Return task assignment log.

    when:


      after_step_succeeds:


        save_to: task_distribution
  step_3_monitor_worker_performance:
    name: "Monitor Worker Performance"    model: "${models.load_balancer}"
  
    input:
      variables:
        distribution: "${step.step_2_distribute_tasks.output}"
      
      prompt: |
        Monitor worker performance and adjust distribution.
        
        Performance metrics:
        - Task completion times per worker
        - Average response times
        - Tasks per minute per worker
        - Worker utilization (CPU, memory)
        - Queue depth per worker
        - Task failures per worker
        
        Adjustment triggers:
        - Worker overload: detected (rebalance tasks)
        - Worker slow: detected (investigate)
        - Queue backlog growing: add workers
        - Task starvation: detected (reassign tasks)
        
        Load balancing decisions:
        - Redistribute from overloaded to lightly loaded
        - Throttle tasks on slow workers
        - Priority queue for important tasks
        - Add temporary workers for surge
        
        Return performance report and recommendations.

    when:


      after_step_succeeds:


        save_to: performance_report
  step_4_load_balancing_fallback:
    name: "Load Balancing Fallback"    model: "${models.load_balancer}"
  
    input:
      variables:
        worker_status: "${step.step_1_worker_health_check.output}"
        performance: "${step.step_3_monitor_worker_performance.output}"
      
    prompt: |
        Implement load balancing fallback strategy.
        
        Fallback conditions:
        - All workers overloaded (100%+ load)
        - Network connectivity issues
        - Response time exceeding thresholds
        - Multiple workers unresponsive
        
        Fallback strategies:
        1. Disable least_loaded temporarily
        2. Use random distribution for new tasks
        3. Reduce concurrent tasks
        4. Add delay between task assignments
        5. Switch to single-worker mode temporarily
        
        Fallback execution:
        - Re-assign pending tasks using fallback
        - Monitor worker health during fallback
        - Restore least_loaded when conditions improve
        - Generate fallback event report
        
        Return fallback demonstration with system stability analysis.

    when:


      after_step_succeeds:


        save_to: fallback_report
  step_5_comparison_report:
    name: "Generate Load Balancing Comparison"    model: "${models.load_balancer}"
  
    input:
      variables:
        distribution: "${step.step_2_distribute_tasks.output}"
        fallback: "${step.step_4_load_balancing_fallback.output}"
        performance: "${step.step_3_monitor_worker_performance.output}"
      
      prompt: |
        Compare load balancing strategies.
        
        Comparison metrics:
        - Distribution efficiency: least_loaded vs random
        - Worker utilization balance
        - Task throughput comparison
        - Response time distribution
        - System stability during fallback
        
        Effectiveness analysis:
        - Strategy 1: least_loaded efficiency
        - Strategy 2: random efficiency
        - Fallback: stability
        
        Recommendations:
        - Optimal strategy based on workload type
        - Worker configuration tuning
        - Threshold adjustments
        - Fallback trigger conditions
        
        Generate comprehensive load balancing comparison report.

    when:


      after_step_succeeds:


        save_to: comparison_report
logging:
  
  levels:
    default: info
    load_balancing: debug
  
  scopes:
    load_balancing:
      include_worker_status: true
      include_task_distribution: true
