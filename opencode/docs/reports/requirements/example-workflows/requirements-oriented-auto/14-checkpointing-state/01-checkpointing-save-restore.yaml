---
workflow_id: checkpointing_save_restore
name: Checkpointing Save and Restore Operations
description: Demonstrates checkpoint creation, save operations, restore functionality, and time travel capabilities
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - checkpointing-state
  - save-restore
  - time-travel
  - state-management

models:
  checkpoint_agent:
    name: "Checkpointing Agent"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

checkpointing:
  enabled: true
  
  configuration:
    level: timetravel
    output_path: "${workspace.output_path}/chat-file.md"
  
  triggers:
    interval:
      time: 5m
      steps: [initialize_system, process_data, validate_results, deploy_artifacts]
    
    on_failure: create
    on_timeout: create
    on_user_interrupt: create
  
  storage:
    state_management:
      enabled: true
      save_interval_secs: 60
      state_file_path: "${workspace.checkpoint_path}/state.json"
      merge_strategy: union
      validate_state: true
  
  time_travel:
    enabled: true
    max_timeback_duration: 5h
    checkpoint_interval_mins: 30
    max_checkpoints: 15
  
  cleanup:
    auto_cleanup_enabled: true
    max_checkpoints: 15
    keep_last_n: 5
    delete_older_than_hours: 48

agentic_workflow:
  step_1_create_initial_checkpoint:
    name: "Create Initial Checkpoint"
    type: agent
    model: "${models.checkpoint_agent}"
    
    input:
      prompt: |
        Create initial checkpoint for long-running workflow.
        
        Initialize checkpoint system:
        1. Create checkpoint directory if missing
        2. Save current system state
        3. Record workflow start time
        4. Capture initial configuration
        5. Set checkpoint version
        
        Checkpoint details:
        - Checkpoint ID: cp_initial_001
        - Timestamp: {{now}}
        - State: initialized
        - Components: workflow, models, checkpoints
        - Metadata: version 1.0.0, created at {{now}}
        
        Save checkpoint manifest to workspace.
    
    output:
      save_to: initial_checkpoint
      format: json
      file_output:
        enabled: true
        path: ./workspace/checkpoints/initial-cp.json

  step_2_process_data:
    name: "Process Data with Checkpointing"
    type: agent
    model: "${models.checkpoint_agent}"
    
    post_hooks:
      checkpoint:
        enabled: true
        reason: "Checkpoint after data processing"
  
    input:
      prompt: |
        Process data and create checkpoint.
        
        Data processing task:
        - Read input files from ./workspace/input
        - Transform and validate data
        - Generate output files
        - Create processing statistics
        
        Checkpoint trigger:
        - Trigger after data processing completes
        - Save all intermediate results
        - Capture processing metadata
        - Mark as recoverable checkpoint: cp_data_002
        
        Checkpoint content:
        - Data summary: processed files, records transformed
        - Output files created: list with paths
        - Processing metrics: time, memory usage
        - State: ready for validation step
        
        Return data processing results with checkpoint confirmation.
    
    output:
      save_to: data_processing
      format: json

  step_3_validate_results:
    name: "Validate Results with Checkpointing"
    type: agent
    model: "${models.checkpoint_agent}"
    
    input:
      prompt: |
        Validate data and create checkpoint.
        
        Validation tasks:
        - Check output files for correctness
        - Verify data integrity (checksums)
        - Validate against schema
        - Check for data anomalies
        - Validate business rules compliance
        
        Validation results:
        - Total records processed: verify from data_processing
        - Valid records: count passing validation
        - Invalid records: count with errors
        - Data quality score: calculate from validation
        - Integrity check: all files verified
        
        Checkpoint trigger:
        - Trigger after validation completes
        - Save validation results
        - Mark as quality checkpoint: cp_validate_003
        
        Return validation summary with checkpoint.
    
    output:
      save_to: validation_results
      format: json

  step_4_deploy_artifacts:
    name: "Deploy Artifacts with Checkpointing"
    type: agent
    model: "${models.checkpoint_agent}"
    
    input:
      prompt: |
        Deploy artifacts and create final checkpoint.
        
        Deployment tasks:
        - Build production artifacts from processed data
        - Create deployment packages
        - Generate deployment manifests
        - Copy artifacts to production directory
        - Verify deployment success
        
        Deployment verification:
        - Check all artifacts deployed correctly
        - Verify file integrity in production
        - Validate deployment manifest
        - Test deployment if applicable
        - Record deployment metrics
        
        Checkpoint trigger:
        - Trigger after deployment completes
        - Save deployment results
        - Mark as deploy checkpoint: cp_deploy_004
        - This is final recovery point before restore testing
        
        Return deployment status with checkpoint.
    
    output:
      save_to: deployment_results
      format: json

  step_5_restore_from_checkpoint:
    name: "Restore from Checkpoint"
    type: agent
    model: "${models.checkpoint_agent}"
    
    input:
      prompt: |
        Restore workflow state from checkpoint.
        
        Restore scenarios to demonstrate:
        1. Restore from cp_validate_003 (after validation)
        2. Restore from cp_deploy_004 (after deployment)
        3. Restore from cp_data_002 (mid-processing point)
        
        Restore process:
        - Identify appropriate checkpoint to restore from
        - Verify checkpoint integrity
        - Load checkpoint state from file
        - Restore workflow variables
        - Restore model states
        - Reload intermediate results
        - Recalculate metrics from checkpoint
        
        Verification:
        - Verify restored state matches checkpoint
        - Validate restored files exist
        - Check data integrity
        - Confirm checkpoint chain is valid
        
        Return restoration status with details.
    
    output:
      save_to: restoration_state
      format: json

  step_6_time_travel_test:
    name: "Test Time Travel Capabilities"
    type: agent
    model: "${models.checkpoint_agent}"
    
    input:
      prompt: |
        Test time travel functionality.
        
        Time travel scenarios:
        1. Restore from earlier checkpoint (e.g., cp_data_002)
        2. Continue execution from restored state
        3. Create new checkpoint branch
        4. Verify state consistency
        5. Demonstrate checkpoint versioning
        
        Test requirements:
        - Verify checkpoints maintain unique IDs
        - Test rollback to previous state works
        - Confirm time travel doesn't corrupt data
        - Verify checkpoint chain integrity
        - Test max checkpoint limit enforcement
        
        Expected results:
        - Time travel successful
        - State successfully restored
        - New checkpoint branch created
        - Checkpoint limits respected
        
        Return time travel test results.
    
    output:
      save_to: time_travel_results
      format: json

  step_7_cleanup_old_checkpoints:
    name: "Cleanup Old Checkpoints"
    type: agent
    model: "${models.checkpoint_agent}"
    
    input:
      prompt: |
        Cleanup old checkpoints per policy.
        
        Cleanup tasks:
        1. List all checkpoints in checkpoint directory
        2. Identify checkpoints older than 48 hours
        3. Ensure keep_last_n checkpoints preserved
        4. Delete old checkpoints
        5. Verify cleanup success
        
        Cleanup verification:
        - Count checkpoints before and after cleanup
        - Verify keep_last_n preserved
        - Confirm old checkpoints deleted
        - Validate checkpoint chain integrity
        
        Return cleanup summary with retained checkpoint IDs.
    
    output:
      save_to: cleanup_summary
      format: json

logging:
  enabled: true
  
  levels:
    default: info
    checkpointing: debug
    state_management: info
  
  scopes:
    checkpointing:
      enabled: true
      include_checkpoint_ids: true
      include_restore_operations: true
      include_time_travel: true
    
    state_management:
      enabled: true
      include_state_transitions: true
      include_validation_results: true
  
  output:
    console:
      enabled: true
      timestamps: true
    
    file:
      enabled: true
      path: ./workspace/logs/checkpointing.log

error_handling:
  default_action:
    type: create_checkpoint
    reason: "Failures trigger checkpoints for recovery"
  
  handling_by_type:
    checkpoint_corruption:
      action: halt_workflow
      notify_level: critical
    
    restore_failure:
      action: continue_with_available
      notify_level: error
    
    time_travel_error:
      action: log_and_skip
      notify_level: warning