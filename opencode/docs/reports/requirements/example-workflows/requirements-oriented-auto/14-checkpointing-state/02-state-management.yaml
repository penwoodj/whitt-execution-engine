---
workflow_id: state_management
name: State Management and Versioning
description: Demonstrates state persistence, versioning, delta updates, integrity validation, and resume capabilities
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - checkpointing-state
  - state-management
  - versioning
  - resume-capability

models:
  state_manager:
    name: "State Manager"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

state_management:
  
  configuration:
    state_directory: "${workspace.state_path}"
    versioning_enabled: true
    delta_updates_enabled: true
    integrity_validation: true
  
  versioning:
    strategy: append_only
    max_versions: 100
    compression: gzip
    compression_level: 6
  
  delta_updates:
    delta_threshold_bytes: 10240
    apply_deltas_batch: true
    merge_strategy: union
  
  integrity_validation:
    validate_on_save: true
    validate_on_load: true
    checksum_algorithm: sha256
    schema_validation: true
  
  resume:
    state_id: "latest"
    allow_partial_state: true
    validate_on_resume: true

agentic_workflow:
  step_1_initialize_state:
    name: "Initialize State Management"
    type: agent
    model: "${models.state_manager}"
    
    input:
      prompt: |
        Initialize state management system.
        
        Initialization tasks:
        1. Create state directory: ${workspace.state_path}
        2. Initialize state schema structure
        3. Set initial state version: 1.0.0
        4. Create state manifest file
        5. Verify write permissions
        
        State schema structure:
        - workflow_id: unique identifier
        - state_version: monotonically increasing
        - timestamp: ISO 8601 datetime
        - workflow_status: current status
        - step_states: status of each workflow step
        - variables: workflow-level variables
        - outputs: accumulated step outputs
        - metadata: workflow metadata (user, start time, etc.)
        
        Return initialization confirmation with state file path.
    
    output:
      save_to: state_init
      format: json

  step_2_save_state_checkpoint:
    name: "Save State Checkpoint"
    type: agent
    model: "${models.state_manager}"
    
    post_hooks:
      checkpoint:
        reason: "Save state as checkpoint"
    
    input:
      prompt: |
        Save current state as checkpoint.
        
        State to save:
        - workflow_id: state_management
        - current state_version: from state file
        - current_timestamp: {{now}}
        - workflow_status: track status of each step
        - step_states: capture all step states
        - variables: capture all workflow variables
        - outputs: capture all accumulated outputs
        - metadata: workflow start time, user, environment
        
        Save operations:
        1. Read current state from file
        2. Calculate delta from previous state
        3. Apply delta update (append-only mode)
        4. Validate state integrity
        5. Write new state file
        6. Create backup of previous state
        7. Update state version
        
        Delta calculation:
        - Identify changed components (steps, variables, outputs)
        - Calculate checksum of changed data
        - Verify state is consistent (no contradictions)
        
        Return save confirmation with new state version.
    
    output:
      save_to: state_checkpoint
      format: json

  step_3_load_state_from_checkpoint:
    name: "Load State from Checkpoint"
    type: agent
    model: "${models.state_manager}"
    
    input:
      prompt: |
        Load state from previous checkpoint.
        
        Load process:
        1. Identify latest checkpoint file
        2. Read state from checkpoint
        3. Verify state integrity (checksum)
        4. Apply delta updates from checkpoint to present
        5. Restore workflow variables
        6. Restore step states
        7. Restore accumulated outputs
        8. Validate restored state
        
        Validation:
        - Verify state version increases correctly
        - Check delta updates apply successfully
        - Validate no conflicts between checkpoint and present state
        - Confirm state consistency
        
        Return load confirmation with restored state version.
    
    output:
      save_to: loaded_state
      format: json

  step_4_update_variables:
    name: "Update Workflow Variables"
    type: agent
    model: "${models.state_manager}"
    
    input:
      prompt: |
        Update workflow variables and save state.
        
        Variable update tasks:
        1. Add new variable: result_summary
        2. Update existing variable: processing_status
        3. Delete deprecated variable: old_temp
        4. Update variable values
        5. Calculate dependent variable values
        6. Validate variable constraints
        
        State update:
        - Update workflow variables section
        - Recalculate dependent variables
        - Validate no circular references
        - Apply variable constraints
        - Increment state version
        - Calculate state delta
        
        Validation:
        - Check variable types (string, number, boolean)
        - Verify variable value formats
        - Validate no circular dependencies
        - Check variable constraints (min, max, pattern)
        
        Return update confirmation with new state.
    
    output:
      save_to: variable_update
      format: json

  step_5_create_final_checkpoint:
    name: "Create Final State Checkpoint"
    type: agent
    model: "${models.state_manager}"
    
    post_hooks:
      checkpoint:
        reason: "Final state checkpoint before workflow completion"
    
    input:
      prompt: |
        Create final state checkpoint.
        
        Final state:
        - workflow_status: completed
        - step_states: all steps completed
        - variables: final variable values
        - outputs: all accumulated outputs
        - metadata: completion time, duration, statistics
        
        Finalization:
        1. Mark workflow as completed
        2. Calculate final statistics
        3. Generate completion summary
        4. Validate all outputs generated
        5. Archive old state versions
        
        Save final checkpoint:
        - State version: final
        - Timestamp: {{now}}
        - All workflow data preserved
        - Ready for resume from any checkpoint
        - No more delta updates needed
        
        Return final checkpoint with completion metadata.
    
    output:
      save_to: final_state
      format: json

  step_6_cleanup_old_states:
    name: "Cleanup Old State Versions"
    type: agent
    model: "${models.state_manager}"
    
    input:
      prompt: |
        Cleanup old state versions per retention policy.
        
        Cleanup tasks:
        1. List all state versions
        2. Identify versions older than retention period
        3. Archive old versions (compress)
        4. Delete expired versions
        5. Keep only recent versions
        6. Verify disk space after cleanup
        7. Update state manifest
        
        Retention policy:
        - Keep last 100 versions (or 48 hours, whichever)
        - Compress old versions with gzip
        - Delete versions exceeding retention
        - Keep current and recent versions uncompressed
        
        Cleanup verification:
        - Count versions before and after
        - Verify retention policy applied correctly
        - Calculate disk space savings
        - Confirm current state still accessible
        
        Return cleanup summary with retention statistics.
    
    output:
      save_to: cleanup_summary
      format: json

logging:
  
  levels:
    default: info
    state_management: debug
  
  scopes:
    state_management:
      include_state_versions: true
      include_delta_updates: true
      include_validation_results: true
  
  output:
    console:
      timestamps: true
    
    file:
      path: ./workspace/logs/state-management.log

error_handling:
  default_action:
    type: save_checkpoint
    reason: "State errors trigger checkpoints"

  handling_by_type:
    state_corruption:
      action: fail_workflow
      notify_level: critical
    
    integrity_error:
      action: rollback_and_retry
      notify_level: error
    
    checksum_mismatch:
      action: log_and_investigate
      notify_level: warning