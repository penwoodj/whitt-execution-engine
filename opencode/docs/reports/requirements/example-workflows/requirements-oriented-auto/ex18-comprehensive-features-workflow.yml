---
workflow_id: comprehensive_ai_code_refactoring_system
name: Comprehensive AI-Powered Code Refactoring and Documentation System
description: Coherent end-to-end workflow demonstrating all schema features through realistic AI-powered codebase improvement

# Model Configuration
models:
  primary_analyzer:
    provider: lmstudio
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan
    gpu_layers: 32

  secondary_validator:
    provider: ollama
    generative_entity: "llama3.2"
    backend: cpu

  embedder:
    provider: jinaai
    generative_entity: "ReaderLM-v2"
    backend: vulkan

  fallback_model:
    provider: llamacpp
    generative_entity: "/models/llama-3.2-3b.Q4_K_M.gguf"
    backend: vulkan

# Execution Mode
execution:
  mode: hybrid
  memory:
    max_allocated_memory_mb: 16384
    model_memory_mb: 4096
    embedding_memory_mb: 2048
    unload_unused: true

  # Hierarchical Logging Configuration
logging:
  global:
    level: debug
    detail: very_high
    output_type: chat
    format: json
    console: true
    file: true
    log_file: /workspace/logs/comprehensive_system.log
    file_rotation:
      enabled: true
      max_size_mb: 200
      max_files: 20

  workflow_execution:
    level: info
    detail: high
    output_type: log
    format: json

  step_execution:
    level: debug
    detail: high
    output_type: chat
    format: json

  tool_execution:
    level: debug
    detail: very_high
    output_type: stateless_direct_io
    format: json

  file_operations:
    level: debug
    detail: very_high
    output_type: stateless_direct_io
    format: json

  web_operations:
    level: info
    detail: high
    output_type: chat
    format: json

  agent_execution:
    level: info
    detail: medium
    output_type: log
    format: json

  state_management:
    level: debug
    detail: low
    output_type: log
    format: json

  performance_metrics:
    level: info
    detail: medium
    output_type: stateless_direct_io
    format: json

# Top-Level Orchestration
orchestration:
  workflow_type: "comprehensive_ai_system"
  max_concurrent_sub_agents: 4
  event_propagation: "bidirectional"
  validation_aggregation: "hierarchical"

  overall_validation_criteria:
    - criteria: "code_quality_score"
      description: "Code quality score must meet threshold"
      threshold: 0.9
      weight: 0.3

    - criteria: "documentation_completeness"
      description: "Documentation must be complete and accurate"
      threshold: 0.85
      weight: 0.25

    - criteria: "all_sub_workflows_valid"
      description: "All sub-workflows must pass validation"
      threshold: 1.0
      weight: 0.25

    - criteria: "performance_acceptable"
      description: "Performance metrics must be acceptable"
      threshold: 0.85
      weight: 0.2

  sub_workflow_relationships:
    - agent_id: "code_analyzer_sub"
      dependencies: []
      dependents:
        - doc_researcher_sub
        - refactor_generator_sub
      interdependent_validations:
        - validation: "analysis_quality"
          requires:
            - from: refactor_generator_sub
              metric: "refactored_code_quality"
              condition: ">= 0.8"

    - agent_id: "doc_researcher_sub"
      dependencies: []
      dependents:
        - doc_generator_sub
        - knowledge_base_sub
      interdependent_validations:
        - validation: "doc_relevance"
          requires:
            - from: code_analyzer_sub
              metric: "code_analysis_depth"
              condition: ">= 0.9"

    - agent_id: "refactor_generator_sub"
      dependencies:
        - code_analyzer_sub
      dependents:
        - code_validator_sub
      interdependent_validations:
        - validation: "refactor_quality"
          requires:
            - from: code_analyzer_sub
              metric: "original_code_quality"
              condition: "< 0.7"

    - agent_id: "code_validator_sub"
      dependencies:
        - refactor_generator_sub
      dependents:
        - overall_evaluator
      interdependent_validations:
        - validation: "validation_score"
          requires:
            - from: refactor_generator_sub
              metric: "refactored_code_metrics"
              condition: ">= 0.8"

    - agent_id: "doc_generator_sub"
      dependencies:
        - doc_researcher_sub
      dependents:
        - overall_evaluator
      interdependent_validations:
        - validation: "doc_accuracy"
          requires:
            - from: doc_researcher_sub
              metric: "researched_doc_accuracy"
              condition: ">= 0.85"

    - agent_id: "knowledge_base_sub"
      dependencies:
        - doc_researcher_sub
      dependents:
        - overall_evaluator
      interdependent_validations:
        - validation: "embedding_quality"
          requires:
            - from: doc_researcher_sub
              metric: "doc_relevance_score"
              condition: ">= 0.9"

    - workflow_id: "prompt_refinement_workflow"
      name: "Prompt Refinement with Version Tracking Sub-Workflow"
      path: "./sub_workflows/prompt_refinement.yml"
      validation_config:
        loop_type: "validation"
        exact_criteria: false
        tolerance: 0.1
        max_iterations: 6
        stop_conditions:
          - refinement.improvement_detected == true
          - refinement.version_count >= 6
      interdependent_validations:
        - validation: "refinement_quality"
          requires:
            - from: code_analyzer_sub
              metric: "analysis_depth"
              condition: ">= 0.95"

    - workflow_id: "web_operations_url_params_workflow"
      name: "Web Operations with URL Parameters Sub-Workflow"
      path: "./sub_workflows/web_operations_url_params.yml"
      validation_config:
        loop_type: "validation"
        exact_criteria: true
        tolerance: 0.0
        max_iterations: 3
        stop_conditions:
          - web.url_params_parsed == true
          - web.response_success == true
          - web.headers_set == true
        interdependent_validations:
          - validation: "web_params_quality"
          requires:
            - from: code_analyzer_sub
              metric: "analysis_complete"
              condition: "== true"

    - agent_id: "overall_evaluator"
      dependencies:
        - code_validator_sub
        - doc_generator_sub
        - prompt_refinement_sub
        - web_operations_url_params_sub
        - knowledge_base_sub
      dependents: []

# Sub-Workflow Registry
sub_workflows:
  - workflow_id: "code_analysis_workflow"
    name: "Code Analysis Sub-Workflow"
    path: "./sub_workflows/code_analysis.yml"
    validation_config:
      loop_type: "validation"
      exact_criteria: false
      tolerance: 0.1
      max_iterations: 5
      stop_conditions:
        - analysis.depth_score >= 0.9
        - analysis.async_patterns_identified == true
        - analysis.complexity_scored == true

  - workflow_id: "doc_research_workflow"
    name: "Documentation Research Sub-Workflow"
    path: "./sub_workflows/doc_research.yml"
    validation_config:
      loop_type: "validation"
      exact_criteria: false
      tolerance: 0.15
      max_iterations: 3
      stop_conditions:
        - research.relevance_score >= 0.85
        - research.doc_sources_count >= 5

  - workflow_id: "refactor_generation_workflow"
    name: "Refactor Generation Sub-Workflow"
    path: "./sub_workflows/refactor_generation.yml"
    validation_config:
      loop_type: "convergence"
      tolerance: 0.05
      max_iterations: 5
      stop_conditions:
        - generation.improvement_detected == true
        - generation.code_diff_size < 0.3

  - workflow_id: "code_validation_workflow"
    name: "Code Validation Sub-Workflow"
    path: "./sub_workflows/code_validation.yml"
    validation_config:
      loop_type: "validation"
      exact_criteria: true
      tolerance: 0.0
      max_iterations: 3
      stop_conditions:
        - validation.compiles == true
        - validation.tests_pass == true
        - validation.lint_errors == 0
        - validation.quality_score >= 0.85

  - workflow_id: "doc_generation_workflow"
    name: "Documentation Generation Sub-Workflow"
    path: "./sub_workflows/doc_generation.yml"
    validation_config:
      loop_type: "validation"
      exact_criteria: false
      tolerance: 0.1
      max_iterations: 4
      stop_conditions:
        - generation.doc_completeness >= 0.9
        - generation.examples_provided == true

  - workflow_id: "rag_knowledge_base_workflow"
    name: "RAG Knowledge Base Sub-Workflow"
    path: "./sub_workflows/rag_knowledge_base.yml"
    validation_config:
      loop_type: "validation"
      exact_criteria: false
      tolerance: 0.1
      max_iterations: 3
      stop_conditions:
        - rag.embedding_count >= 100
        - rag.similarity_score >= 0.85

# Pipeline Definition
agentic_workflow:
  hardcoded_values:
    var_asdf: foo
    var_fdsa:
        - bar: 1
          baz: false
  
  steps:
  # Step 1: System Initialization and State Load
  - step: initialize_system
    id: step_1
    generative_entity: "${models.primary_analyzer}"
    prompt: |
        Initialize comprehensive AI code refactoring system:

        Requirements:
        1. Load or initialize system state
        2. Check for existing checkpoints
        3. Configure workspace
        4. Setup event propagation channels
        5. Initialize sub-agent contexts
        6. Configure metrics collection
        7. Setup file backup system

        System configuration:
        - Workspace: /workspace
        - Checkpoint directory: /workspace/checkpoints
        - Backup directory: /workspace/backups
        - Log directory: /workspace/logs
        - Output directory: /workspace/output
        - Metrics directory: /workspace/metrics
        - Knowledge base directory: /workspace/rag/knowledge_base

        State management:
        - Load existing state if available
        - Initialize checkpoint system
        - Setup versioning
        - Configure auto-save intervals

        Output:
        - system_initialized: boolean
        - state_loaded: boolean
        - workspace_configured: boolean
        - sub_agent_contexts_initialized: boolean
        - event_channels_ready: boolean

      workspace_path: "/workspace"
      state_config:
        checkpoint_directory: "/workspace/checkpoints"
        versioning_enabled: true
        auto_save_interval_secs: 60

    output:
      save_to: system_initialization
      format: json
      fields:
        - initialized
        - state_snapshot
        - workspace_structure
        - agent_contexts

    retry:
      max_attempts: 3
      backoff: exponential
      delay_ms: 1000

  # Step 2: Branch Decision - Initial Assessment
  - step: assess_system_state
    id: step_2
    generative_entity: "${models.secondary_validator}"
    prompt: |
        Assess system state and determine execution strategy:

        System initialization results:
        ${step.step_1.output}

        Conditions to evaluate:
        1. Is workspace properly configured?
        2. Are all sub-workflows available?
        3. Is there existing state to resume?
        4. Is system memory sufficient?

        Branching logic (strict yes/no):
        IF workspace configured AND sub-workflows available:
          THEN proceed with parallel sub-agent execution
          Answer: "Decision: parallel"

        IF state exists and valid:
          THEN resume from checkpoint
          Answer: "Decision: resume"

        IF memory insufficient:
          THEN defer execution
          Answer: "Decision: defer"

        IF sub-workflows missing:
          THEN fail with configuration error
          Answer: "Decision: fail"

        Output:
        - decision: "parallel"|"resume"|"defer"|"fail"
        - execution_mode: "parallel"|"serial"|"deferred"
        - sub_agents_to_execute: []
        - resume_checkpoint: optional

      strict_yes_no_required: true
      system_state: "${step.step_1.output}"

    output:
      save_to: initial_assessment
      format: json
      fields:
        - decision
        - execution_mode
        - sub_agents_to_execute
        - resume_checkpoint
        - reasoning

    branches:
      - branch_id: "parallel_execution"
        next_step: step_3_parallel
        description: "Execute sub-agents in parallel"
        enabled_by: "initial_assessment.decision == 'parallel'"

      - branch_id: "resume_execution"
        next_step: step_3_resume
        description: "Resume from checkpoint"
        enabled_by: "initial_assessment.decision == 'resume'"

      - branch_id: "defer_execution"
        next_step: step_defer
        description: "Defer execution due to resource constraints"
        enabled_by: "initial_assessment.decision == 'defer'"

      - branch_id: "fail_execution"
        next_step: step_fail
        description: "Configuration error, fail workflow"
        enabled_by: "initial_assessment.decision == 'fail'"

  # Step 3A: Parallel Sub-Agent Execution
  - step: execute_parallel_sub_agents
    id: step_3_parallel
    generative_entity: "${models.primary_analyzer}"
    parallel_group: sub_agent_execution
    max_parallel: 4
    prompt: |
        Execute all sub-agents in parallel for comprehensive code refactoring:

        Initial assessment:
        ${step.step_2.output}

        Sub-agents to execute:
        1. code_analyzer_sub → code_analysis_workflow
           - Analyze codebase structure
           - Identify async patterns
           - Calculate code quality metrics
           - Generate analysis report

        2. doc_researcher_sub → doc_research_workflow
           - Research relevant documentation
           - Fetch from multiple sources
           - Validate documentation relevance
           - Store in knowledge base

        3. refactor_generator_sub → refactor_generation_workflow
           - Generate refactor suggestions
           - Use convergence loops
           - Interdepend on code analysis results
           - Generate code diffs

        4. code_validator_sub → code_validation_workflow
           - Validate refactored code
           - Run tests
           - Check lint
           - Interdepend on refactor results

        5. doc_generator_sub → doc_generation_workflow
           - Generate documentation
           - Use RAG knowledge base
           - Interdepend on doc research results
           - Validate documentation completeness

        6. knowledge_base_sub → rag_knowledge_base_workflow
           - Build RAG knowledge base
           - Generate embeddings
           - Create similarity index
           - Interdepend on doc research results

        Execution requirements:
        1. Spawn 4 sub-agents simultaneously
        2. Each sub-agent runs validation loops
        3. Each sub-agent checks interdependencies
        4. Validation results propagate via events
        5. Interdependency failures propagate between sub-agents
        6. Top-level orchestration aggregates all results
        7. State checkpoints saved at intervals

        Event flow:
        - sub-workflow completes → validation_result event → orchestration
        - interdependency check fails → interdependent_failure event → related sub-agents
        - orchestration receives all results → aggregate and evaluate
        - checkpoint saved → state_saved event → all sub-agents

      sub_agents:
        - agent_id: code_analyzer_sub
          workflow_ref: code_analysis_workflow
          validation_config: "${sub_workflows[0].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[0].interdependent_validations}"

        - agent_id: doc_researcher_sub
          workflow_ref: doc_research_workflow
          validation_config: "${sub_workflows[1].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[1].interdependent_validations}"

        - agent_id: refactor_generator_sub
          workflow_ref: refactor_generation_workflow
          validation_config: "${sub_workflows[2].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[2].interdependent_validations}"

        - agent_id: code_validator_sub
          workflow_ref: code_validation_workflow
          validation_config: "${sub_workflows[3].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[3].interdependent_validations}"

        - agent_id: doc_generator_sub
          workflow_ref: doc_generation_workflow
          validation_config: "${sub_workflows[4].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[4].interdependent_validations}"

        - agent_id: knowledge_base_sub
          workflow_ref: rag_knowledge_base_workflow
          validation_config: "${sub_workflows[5].validation_config}"
          interdependent_validations: "${orchestration.sub_workflow_relationships[5].interdependent_validations}"

      event_handling:
        on_validation_result:
          - aggregate_at_top_level: true
          - propagate_to_dependents: true
          - log_result: true

        on_interdependent_failure:
          - notify_dependent_sub_agents: true
          - adjust_validation_criteria: true
          - propagate_failure_up: true

        on_checkpoint:
          - save_state_snapshot: true
          - notify_all_sub_agents: true
          - track_version: true

      orchestration_config: "${orchestration}"

    output:
      save_to: parallel_execution_results
      format: json
      fields:
        - sub_agents_executed
        - validation_results
        - interdependency_status
        - event_log
        - checkpoints_created
        - total_duration_secs
    timeout_secs: 300

    branches:
      - branch_id: "from_step_2_parallel"
        enabled_by: "initial_assessment.decision == 'parallel'"

  # Step 3B: Resume from Checkpoint
  - step: resume_from_checkpoint
    id: step_3_resume
    generative_entity: "${models.secondary_validator}"
    prompt: |
        Resume workflow from checkpoint:

        Initial assessment:
        ${step.step_2.output}

        Checkpoint details:
        - Checkpoint file: /workspace/checkpoints/latest.json
        - State snapshot: complete system state
        - Progress: which sub-agents completed
        - Logs: up to checkpoint point

        Resume requirements:
        1. Load state from checkpoint
        2. Resume execution from last completed step
        3. Restore sub-agent contexts
        4. Reinitialize event channels
        5. Continue remaining sub-workflows

        Output:
        - state_restored: boolean
        - resumed_from_step: step_id
        - remaining_sub_workflows: []
        - resumed_execution_mode: "parallel"|"serial"

      checkpoint_config:
        path: "${step.step_2.output.resume_checkpoint}"
        validate_integrity: true
        restore_dependencies: true

    output:
      save_to: resume_results
      format: json
      fields:
        - state_restored
        - resumed_from_step
        - remaining_sub_workflows
        - execution_mode

    branches:
      - branch_id: "from_step_2_resume"
        enabled_by: "initial_assessment.decision == 'resume'"

  # Step 4: Aggregate and Evaluate Results
  - step: aggregate_and_evaluate
    id: step_4
    generative_entity: "${models.primary_analyzer}"
    prompt: |
        Aggregate results from all sub-agents and evaluate overall quality:

        Parallel execution results:
        ${step.step_3_parallel.output}

        Resume results (if applicable):
        ${step.step_3_resume.output}

        Orchestration config:
        ${orchestration}

        Overall validation criteria:
        ${orchestration.overall_validation_criteria}

        Aggregation logic:
        1. Collect validation results from all sub-agents
        2. Evaluate interdependency status
        3. Calculate weighted quality score
        4. Check against overall validation criteria
        5. Determine final outcome

        Overall validation criteria (weighted):
        - code_quality_score (0.3 weight): Code validation results
        - documentation_completeness (0.25 weight): Doc generation results
        - all_sub_workflows_valid (0.25 weight): All sub-workflows passed
        - performance_acceptable (0.2 weight): Performance metrics

        Weighted calculation:
        - Sum of (criteria_met * weight)
        - Threshold: >= 0.85 (85% combined score)

        Event response flow:
        - If all criteria met → proceed to step_5_success
        - If criteria not met → branch to step_6_analysis
        - If partial success → branch to step_7_adjust

      orchestration_config: "${orchestration}"

    output:
      save_to: aggregated_results
      format: json
      fields:
        - code_quality_score
        - documentation_completeness
        - all_sub_workflows_valid
        - performance_acceptable
        - weighted_overall_score
        - final_decision
        - criteria_breakdown
        - recommendations

  # Step 5: Success - Generate Final Output
  - step: generate_final_output
    id: step_5_success
    generative_entity: "${models.primary_analyzer}"
    prompt: |
        Generate final comprehensive output for successful refactoring:

        Aggregated results:
        ${step.step_4.output}

        Success details:
        - All sub-workflows validated successfully
        - All validation criteria met
        - Code refactoring complete
        - Documentation generated
        - Knowledge base updated

        Generate final outputs:
        1. Write refactored code to /workspace/output/refactored_code.rs
        2. Write documentation to /workspace/output/documentation.md
        3. Write validation report to /workspace/output/validation_report.json
        4. Write performance metrics to /workspace/metrics/performance.json
        5. Save final state to /workspace/checkpoints/final.json
        6. Create backup of original code to /workspace/backups/original_code_backup.tar.gz

        File operations:
        - file_write: refactored_code.rs (UTF-8, pretty_print, validation)
        - file_write: documentation.md (UTF-8, markdown format)
        - file_write: validation_report.json (UTF-8, JSON format)
        - file_write: performance.json (UTF-8, JSON format)
        - file_save_state: final.json (UTF-8, JSON format)
        - file_create_archive: original_code_backup.tar.gz (tar.gz format)

      aggregated_results: "${step.step_4.output}"

    output:
      save_to: final_output
      format: json
      fields:
        - code_file_written
        - documentation_file_written
        - validation_report_written
        - metrics_file_written
        - state_saved
        - backup_created
        - summary

  # Step 6: Analysis - Determine Next Action
  - step: analyze_and_branch
    id: step_6_analysis
    generative_entity: "${models.secondary_validator}"
    prompt: |
        Analyze validation failures and determine next action:

        Aggregated results:
        ${step.step_4.output}

        Branching logic based on failure analysis (strict yes/no):

        Determine which criteria failed:
        1. code_quality_score < 0.9?
           - Which aspect failed (compilation, tests, lint)?
           - Can it be fixed?

        2. documentation_completeness < 0.85?
           - What's missing (examples, API docs, tutorials)?
           - How to improve?

        3. all_sub_workflows_valid == false?
           - Which sub-workflow failed?
           - Why did it fail?
           - Can it be retried?

        4. performance_acceptable < 0.85?
           - What performance metric is low?
           - How to improve?

        Branching decision:
        IF critical failure (code doesn't compile or tests fail completely):
          THEN branch: fail_workflow
          Answer: "Decision: fail"

        IF quality score >= 0.7 AND < 0.85:
          THEN branch: retry_specific_sub_agent
          Answer: "Decision: retry"

        IF interdependency issues:
          THEN branch: adjust_interdependencies_and_retry
          Answer: "Decision: adjust"

        IF multiple minor failures:
          THEN branch: adjust_validation_criteria
          Answer: "Decision: adjust_criteria"

        Output strict decision: "Decision: [fail|retry|adjust|adjust_criteria]"

      aggregated_results: "${step.step_4.output}"

    output:
      save_to: branch_analysis
      format: json
      fields:
        - decision
        - reason
        - failed_criteria
        - retry_action
        - next_step

    branches:
      - branch_id: "fail_workflow"
        next_step: step_fail
        enabled_by: "branch_analysis.decision == 'fail'"

      - branch_id: "retry_specific"
        next_step: step_7_retry
        enabled_by: "branch_analysis.decision == 'retry'"

      - branch_id: "adjust_interdependencies"
        next_step: step_8_adjust
        enabled_by: "branch_analysis.decision == 'adjust'"

      - branch_id: "adjust_criteria"
        next_step: step_9_adjust_criteria
        enabled_by: "branch_analysis.decision == 'adjust_criteria'"

  # Step 7: Retry Specific Sub-Agent
  - step: retry_sub_agent
    id: step_7_retry
    generative_entity: "${models.primary_analyzer}"
    prompt: |
        Retry specific sub-agent with adjusted parameters:

        Branch analysis:
        ${step.step_6_analysis.output}

        Retry requirements:
        1. Identify failed sub-agent
        2. Adjust validation criteria (loosen tolerance, adjust thresholds)
        3. Update interdependency constraints if needed
        4. Re-execute sub-agent
        5. Re-aggregate validation results

        Event flow on retry:
        - Notify orchestration of retry
        - Re-execute sub-agent sub-workflow
        - Propagate new validation results
        - Re-aggregate at top-level with adjusted criteria
        - Save checkpoint after retry

      branch_analysis: "${step.step_6_analysis.output}"

      retry_config:
        max_retries: 2
        adjustment_strategy: "loosen_tolerance"
        tolerance_adjustment: 0.15
        adjust_interdependencies: true
        checkpoint_after_retry: true

    output:
      save_to: retry_results
      format: json
      fields:
        - retry_count
        - sub_agent_retried
        - validation_results_after_retry
        - criteria_adjustments
        - checkpoint_saved
        - final_outcome

  # Step 8: Adjust Interdependencies
  - step: adjust_interdependencies_and_retry
    id: step_8_adjust
    generative_entity: "${models.primary_analyzer}"
    prompt: |
        Adjust interdependencies and retry related sub-agents:

        Branch analysis:
        ${step.step_6_analysis.output}

        Adjustment requirements:
        1. Identify interdependency conflicts
        2. Relax or reconfigure interdependencies
        3. Adjust validation criteria
        4. Re-execute affected sub-agents
        5. Re-aggregate with new results

        Event flow on adjustment:
        - Notify affected sub-agents of adjustment
        - Update interdependency configuration
        - Re-execute affected sub-agent sub-workflows
        - Propagate new validation results
        - Re-aggregate at top-level
        - Save checkpoint

      branch_analysis: "${step.step_6_analysis.output}"

      adjustment_config:
        strategy: "reconfigure_interdependencies"
        relax_constraints: true
        reconfigure_affected_sub_agents: true
        validation_criteria_adjustment: 0.1

    output:
      save_to: adjustment_results
      format: json
      fields:
        - adjustments_made
        - interdependencies_reconfigured
        - sub_agents_retried
        - validation_results_after_adjustment
        - checkpoint_saved
        - final_outcome

  # Step 9: Adjust Validation Criteria
  - step: adjust_validation_criteria
    id: step_9_adjust_criteria
    generative_entity: "${models.secondary_validator}"
    prompt: |
        Adjust overall validation criteria and retry evaluation:

        Branch analysis:
        ${step.step_6_analysis.output}

        Adjustment requirements:
        1. Identify which validation criteria are too strict
        2. Adjust thresholds appropriately
        3. Re-evaluate with adjusted criteria
        4. Determine if adjustments are sufficient

        Criteria adjustments:
        - code_quality_score: 0.9 → 0.85 (5% reduction)
        - documentation_completeness: 0.85 → 0.8 (5% reduction)
        - performance_acceptable: 0.85 → 0.8 (5% reduction)
        - overall_threshold: 0.85 → 0.8 (5% reduction)

        Output:
        - Adjusted validation criteria
        - Re-evaluated results
        - Final decision

      branch_analysis: "${step.step_6_analysis.output}"

    output:
      save_to: criteria_adjustment_results
      format: json
      fields:
        - original_criteria
        - adjusted_criteria
        - adjustment_rationale
        - reevaluated_results
        - final_decision

  # Step 10: Top-Level Validation Loop
  - step: final_evaluation_loop
    id: step_10
    generative_entity: "${models.primary_analyzer}"
    prompt: |
        Final evaluation loop after retry/adjustment:

        Results from branches:
        - Retry results: ${step.step_7_retry.output}
        - Interdependency adjustment: ${step.step_8_adjust.output}
        - Criteria adjustment: ${step.step_9_adjust_criteria.output}

        Requirements:
        1. Evaluate final validation status
        2. Check if all overall criteria met
        3. Determine final workflow outcome
        4. If still failing, determine if more retries needed

        Top-level validation loop:
        - Check overall validation criteria
        - IF met: proceed to success (step_5)
        - IF not met AND retry_count < 3: loop back to step_6 (analysis)
        - IF not met AND retry_count >= 3: fail workflow (step_fail)

        Loop configuration:
        - Type: validation
        - Max iterations: 3
        - Tolerance: 0.0 (strict)
        - Stop conditions: All criteria met OR max retries reached

        Output:
        - Final evaluation decision
        - Overall validation status
        - Total execution summary

      retry_branch_results: "${step.step_7_retry.output}"
      adjustment_branch_results: "${step.step_8_adjust.output}"
      criteria_adjustment_results: "${step.step_9_adjust_criteria.output}"
      overall_criteria: "${orchestration.overall_validation_criteria}"
      max_retries: 3

    output:
      save_to: final_evaluation
      format: json
      fields:
        - final_decision
        - overall_validation_status
        - criteria_met
        - total_retry_count
        - workflow_outcome

    validation_loop:
      type: validation
      exact_criteria: true
      tolerance: 0.0
      max_iterations: 3
      stop_conditions:
        - evaluation.final_decision == "success"
        - evaluation.total_retry_count >= 3
      on_loop:
        - increment_retry_counter
        - adjust_criteria_if_needed
        - log_attempt

      loop_to_step: "step_4"  # Re-aggregate after each retry

  # Step 11: Failure - Generate Failure Report
  - step: workflow_failure
    id: step_fail
    generative_entity: "${models.secondary_validator}"
    prompt: |
        Workflow failed. Generate comprehensive failure report:

        Failure details:
        - Branch analysis: ${step.step_6_analysis.output}
        - Retry attempts: ${step.step_7_retry.output}
        - Adjustment attempts: ${step.step_8_adjust.output}
        - Criteria adjustment: ${step.step_9_adjust_criteria.output}
        - Final evaluation: ${step.step_10.output}

        Failure report should include:
        1. Summary of failure
        2. Which criteria failed
        3. What was attempted (retry/adjust)
        4. Why retries/adjustments didn't work
        5. Recommendations for improvement
        6. Partial results achieved

        Generate failure outputs:
        1. Write failure report to /workspace/output/failure_report.json
        2. Save partial results to /workspace/output/partial_results.json
        3. Save failure state to /workspace/checkpoints/failure.json

      failure_context:
        branch_analysis: "${step.step_6_analysis.output}"
        retry_results: "${step.step_7_retry.output}"
        adjustment_results: "${step.step_8_adjust.output}"
        criteria_adjustment_results: "${step.step_9_adjust_criteria.output}"
        final_evaluation: "${step.step_10.output}"

    output:
      save_to: failure_report
      format: json
      fields:
        - status
        - failure_summary
        - failed_criteria
        - attempts_made
        - partial_results
        - recommendations

  # Step 12: Defer - Save State and Exit
  - step: defer_execution
    id: step_defer
    generative_entity: "${models.secondary_validator}"
    prompt: |
        Defer execution due to resource constraints:

        Initial assessment:
        ${step.step_2.output}

        Defer requirements:
        1. Save current state
        2. Log defer reason
        3. Calculate estimated resource requirements
        4. Suggest reschedule time

        Generate defer outputs:
        1. Write defer state to /workspace/checkpoints/deferred.json
        2. Write resource requirements to /workspace/metrics/resource_requirements.json
        3. Log defer event to /workspace/logs/defer.log

      system_state: "${step.step_2.output}"

    output:
      save_to: defer_results
      format: json
      fields:
        - state_saved
        - defer_reason
        - estimated_resource_requirements
        - suggested_reschedule
        - defer_timestamp

# Workflow Variables
workflow:
  workspace_path: /workspace
  checkpoints_path: /workspace/checkpoints
  backups_path: /workspace/backups
  logs_path: /workspace/logs
  output_path: /workspace/output
  metrics_path: /workspace/metrics
  rag_path: /workspace/rag/knowledge_base
  sub_workflows_path: /workspace/sub_workflows
  timestamp: ${workflow.timestamp}

# Retry Configuration
retry:
  default:
    max_attempts: 3
    backoff: exponential
    on_failure: escalate_model

  escalation:
    fallback_models:
      - provider: ollama
        generative_entity: "llama3.2"
      - provider: llamacpp
        generative_entity: "/models/llama-3.2-3b.Q4_K_M.gguf"
        backend: vulkan

# Metrics
metrics:
  enabled: true
  collect:
    - total_execution_duration_seconds
    - sub_agent_execution_count
    - sub_agent_success_count
    - sub_agent_failure_count
    - validation_loop_iterations
    - interdependency_checks
    - checkpoint_save_count
    - retry_count
    - adjustment_count
    - final_validation_score
    - code_quality_score
    - documentation_completeness
    - performance_metrics
    - memory_usage_mb
    - cpu_usage_percent
    - file_operations_count
    - web_operations_count
    - api_call_count
    - state_save_count
    - state_restore_count
  output:
    path: /workspace/metrics/comprehensive_system_metrics.json
    format: json

# Tool Permissions
tool_permissions:
  file_operations:
    read:
      enabled: true
      require_confirmation: false
      allowed_paths:
        - /workspace/src
        - /workspace/config

    write:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/output
        - /workspace/checkpoints
      backup_existing: true

    delete:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/temp
        - /workspace/backups

  web_operations:
    fetch:
      enabled: true
      require_confirmation: false
      max_concurrent_requests: 5

    scrape:
      enabled: true
      require_confirmation: false
      respect_robots_txt: true

  shell_operations:
    exec:
      enabled: true
      require_confirmation: true
      timeout_seconds: 30
      allowed_commands:
        - cargo
        - rustc
        - git

# Summary of All Features Demonstrated

features_demonstrated:
  model_configuration: true
  multi_model_support: true
  execution_modes: true
  memory_management: true
  hierarchical_logging: true
  retry_logic: true
  loop_variations: true
  validation_loops: true
  tool_execution: true
  tool_permissions: true
  convergence_loops: true
  rag_operations: true
  nested_workflow_references: true
  web_operations: true
  script_cli_execution: true
  auto_model_routing: true
  conditional_branching: true
  event_based_workflows: true
  interdependent_validation: true
  prompt_passing: true
  variable_references: true
  metrics_collection: true
  state_management: true
  file_operations: true
  checkpoint_save_restore: true
  bidirectional_event_propagation: true
  sub_agent_orchestration: true
  weighted_validation_criteria: true
  strict_yes_no_decisions: true
