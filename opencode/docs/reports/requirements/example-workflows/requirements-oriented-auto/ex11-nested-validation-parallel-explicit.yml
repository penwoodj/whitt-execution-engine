---
workflow_id: nested_validation_parallel_explicit
name: Nested Validation with Parallel Explicit Workflows
description: Demonstrates how multiple workflows reference each other with parallel execution and result aggregation

# ── MODEL CONFIGURATION ────────────────────────
models:
  
  # ── GLOBAL CONFIGURATION FILE ─────────────────────
  # global_config_path: ./workspace/model-config.yml  # Optional: centralized config file
  
  default_model_router: automatic  # automatic | manual | smart_routing
  
  # ── MODEL: PRIMARY MODEL ───────────────────────────────
  primary_model:
    name: primary  # Variable reference name
    
    host:
      type: lmstudio  # lmstudio | ollama | llama_cpp_with_vulkan
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 13%
        vram: 3.7GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 150000
        concurrent_requests: 2
      
      min_allowed:
        ram: 9%
        vram: 2.4GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 73500
      
      allocation_strategy: dynamic  # static | dynamic | adaptive
    
    model_memory:
      cache_size: max  # min | max | medium | medium-min | medium-max
      kv_cache_quantization: auto  # auto | q4_k_m | q4_0 | q5_k_m | q5_0 | q6_k | q8_0
      attention_context: auto  # auto | from_max_allowed
    
    execution:
      timeout:
        load_into_memory: 45s
        time_to_first_response: 1m
        total_time_to_response: 4h
      
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true
    
    hooks:
      # ── RUN LIFECYCLE ─────────────────
      on_create: {}
      on_run_start: {}
      on_run_complete: {}
      on_run_error: {}
      on_retry: {}
      
      # ── TURN LIFECYCLE ───────────────────
      on_turn_start: {}
      on_turn_complete: {}
      on_turn_error: {}
      on_thinking: {}
      
      # ── TOOL LIFECYCLE ────────────────────────
      on_tool_call: {}
      on_tool_start: {}
      on_tool_result: {}
      on_tool_error: {}
      
      # ── STREAMING LIFECYCLE ───────────────────────
      on_stream_chunk: {}
      on_stream_complete: {}
  
  # ── MODEL FALLBACK MODEL ────────────────────────────────
  fallback_model:
    name: jinaai_reader
    provider: ollama
    generative_entity: "jinaai/ReaderLM-v2"
    
    resource_limits:
      max_allowed:
        ram: 4GB
        vram: 4GB
        cpu: 50%
        gpu: 80%
        attention_tokens: 8192
        concurrent_requests: 1
      
      min_allowed:
        ram: 2GB
        vram: 2GB
        cpu: 30%
        gpu: 60%
        attention_tokens: 40960
        concurrent_requests: 1
    
    allocation_strategy: dynamic
    
    model_memory:
      cache_size: min
      kv_cache_quantization: auto
      attention_context: auto
    
    execution:
      timeout:
        load_into_memory: 10s
        time_to_first_response: 30s
        total_time_to_response: 2h
      
      max_turns: 5
      stop_on_tool_failure: false
      accumulate_tool_results: true

# ── WORKFLOW EXECUTION STRATEGY ───────────────────────────
workflow_execution_strategy:
  
  # ── MODEL LIFECYCLE ────────────────────────────────
  load_unload: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
  
  # ── PROCESSING MODE ────────────────────────────
  processing: parallel  # serial | parallel | hybrid
  
  # ── PARALLELIZATION CONFIGURATION ───────────────────────────
  parallel:
    enabled: true
    algorithm: priority_queue  # round_robin | priority_queue | shortest_job_first | longest_job_first
    
    load_balancing:
      strategy: least_loaded  # random | least_loaded | ip_hash
      worker_selection_timeout_secs: 10
    
    max_threads: 4
    max_models: 3
    max_concurrent_requests: 2
    max_steps: 2
    max_sub_agents: 3
  
  # ── MEMORY MANAGEMENT ─────────────────────────────
  memory:
    allocation:
      strategy: dynamic
      max_allowed:
        ram: 12288MB
        vram: 12288MB
        cpu: 100%
        gpu: 100%
        attention_tokens: 150000
        concurrent_requests: 3
    
    model_lifecycle:
      load_unload_strategy: one_at_a_time
      cache_size: min
      swap_timeout_secs: 30
      unload_unused: true
    
    pressure_handling:
      strategy: throttle  # throttle | swap | fail_fast | graceful_degradation
      memory_threshold_percent: 85
      throttle_factor: 0.5
      on_oom: swap
  
  # ── TIMEOUT MANAGEMENT ───────────────────────────────
  timeout:
    total: 4h
    tool_call: 30m
    step: 8m
    operation_timeout_secs: 30
    sub_workflow_timeout_secs: 300
    time_to_first_result_secs: 120
    timeout_strategy: continue_with_partial  # fail | continue_with_partial | retry
    
    model:
      load_into_memory: 45s
      time_to_processing_after_loaded: 10000ms
      time_to_processing: 2h
      time_to_responding: 1m
      time_to_response: 4h
  
  # ── ERROR HANDLING ────────────────────────────────
  error_handling:
    default_action: retry  # retry | retry_critical_path | skip | fail_workflow
    max_retries_per_step: 3
    retry_backoff_multiplier: 2.0
    escalate_to_model_after: 3

# ── ORCHESTRATION CONFIGURATION ────────────────────────────────
orchestration:
  
  # ── STEP COORDINATION ───────────────────────────
  step_coordination:
    max_concurrent_steps: 10
    step_priority: fifo  # fifo | priority_queue | user_defined
    
    inter_step_dependencies:
      enabled: true
      resolution_strategy: wait_for_all  # wait_for_all | continue_with_available | skip_failed
      dependency_timeout_secs: 300
    
    wait_strategy: eager  # eager | lazy
    
    event_propagation_delay_ms: 100
  
  # ── SUB-AGENT ORCHESTRATION ────────────────────────
  sub_agent_orchestration:
    enabled: true
  
  # ── VALIDATION AGGREGATION ────────────────────────
  validation_aggregation:
    strategy: hierarchical  # hierarchical | conjunction | disjunction | weighted
    
    overall_validation_criteria:
      - name: validation_passed
        weight: 0.40
        required: true
        threshold: 0.90
      
      - name: code_quality_score
        weight: 0.30
        required: true
        threshold: 0.85
      
      - name: test_results_passed
        weight: 0.20
        required: true
        threshold: 0.80
      
      - name: documentation_complete
        weight: 0.10
        required: true
        threshold: 0.80
    
    overall_threshold: 0.85
    min_metrics_required: 3
    calculate_weighted_score: true
  
  # ── CHECKPOINT COORDINATION ────────────────────────────────
  checkpoint_coordination:
    enabled: true
    interval_steps: 3
    
    on_checkpoint:
      notify_all_sub_agents: true
      save_global_state: true
      increment_version: true

# ── LOGGING CONFIGURATION ────────────────────────────────
logging:
  level: debug  # debug | info | warning | error | trace
  
  # ── LOG DETAIL ────────────────────────────────
  detail: high  # low | medium | high | verbose
  
  # ── OUTPUT DESTINATIONS ────────────────────────────────
  output_destinations:
    chat_file:
      enabled: true
      path: "${workflow.output_path}/nested-validation-workflow.md"
      format: markdown
    
    json_file:
      enabled: true
      path: "${workflow.output_path}/logs/execution.json"
      format: json
    
    console:
      enabled: true
      include_timestamps: true
  
  # ── ERROR LOGGING ────────────────────────────────
  error_logging:
    enabled: true
    separate_file: true
    path: "${workflow.output_path}/logs/errors.json"
    include_stack_trace: true
    include_context: true

# ── TOOL PERMISSIONS ────────────────────────────────
tool_permissions:
  
  # ── FILE OPERATIONS ────────────────────────────────
  file_operations:
    read:
      enabled: true
      require_confirmation: false
      allowed_paths:
        - /workspace/input
        - /workspace/config
      allowed_patterns:
        - "*.md"
        - "*.txt"
      forbidden_paths:
        - /workspace/output
        - /workspace/checkpoints
      max_file_size_mb: 100
    
    write:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/output
      allowed_patterns:
        - "*.json"
        - "*.md"
      forbidden_paths:
        - /workspace/src
        - /workspace/tests
      max_file_size_mb: 500
      backup_existing: true
      create_parent_directories: true
    
    delete:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/temp
        - /workspace/cache
      allowed_patterns:
        - "*.tmp"
      confirm_delete_count: 5
      skip_confirmation_for_patterns:
        - "*.tmp"
  
  # ── WEB OPERATIONS ────────────────────────────────
  web_operations:
    fetch:
      enabled: true
      require_confirmation: false
      max_concurrent_requests: 5
      timeout_secs: 30
      allowed_domains:
        - docs.rs
        - github.com
      forbidden_domains:
        - "*.local"
      follow_redirects: true
      validate_ssl: true
    
  scrape:
      enabled: false
      respect_robots_txt: true
      max_pages_per_domain: 100
      follow_links:
        enabled: false
        max_depth: 2

# ── WORKFLOW VARIABLES ────────────────────────────
workflow:
  codebase_path: /workspace
  output_path: /workspace/output
  checkpoint_path: /workspace/checkpoints
  state_path: /workspace/state
  logs_path: /workspace/logs
  max_memory_mb: 12288
  quality_threshold: 0.85

# ── PIPELINE DEFINITION ────────────────────────────────
agentic_workflow:
  hardcoded_values:
    var_asdf: foo
    var_fdsa:
        - bar: 1
          baz: false
  
  steps:
  
  # ── STEP 1: Initialize Validation System ───────────────────────
  step_1_initialize_validation_system:
    name: Initialize Validation System
    description: Load workflow registry and prepare for parallel validation
    
    generative_entity: "${models.primary_model}"
    
    prompt: |
        Initialize validation system:
        
        1. Load workflow registry from path: ${workflow_registry.registry_path}
        2. Initialize orchestration with settings:
           - Enable sub_agent orchestration
           - Set max_parallel_sub_agents: 3
           - Enable parallel sub-workflows: true
           - Enable validation aggregation
           - Configure checkpoint coordination
        
        3. Prepare isolated environments for each workflow
        
        Output: Orchestrator configuration ready.
      
      output:
      save_to: orchestrator_config
      format: json
      fields:
        - workflow_registry_loaded
        - orchestration_configured
        - isolated_environments_prepared
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff: exponential
  
  # ── STEP 2: Load Workflow Registry and Resolve References ────────────────
  step_2_load_workflow_registry_and_resolve_references:
    name: Load Workflow Registry and Resolve References
    description: Load all registered workflows and resolve their references
    
    generative_entity: "${models.primary_model}"
    
    prompt: |
        Load workflow registry from path: ${workflow_registry.registry_path} and resolve all workflow references.
        
        1. Load registry:
          ${step.orchestrator_config.output.orchestrator_config.workflow_registry_loaded}
        
        2. Resolve references:
          For each registered workflow:
          - Check if workflow has references (workflow_ref, sub_workflow_ref)
          - Resolve each reference to concrete workflow ID
          - Check for circular references (A → B → B → A)
          - Validate reference existence
          - Build reference dependency graph
        
        3. Return structured registry:
          - Workflows with resolved references
          - Reference graph for dependency checking
          - Circular reference detection results
          - Version conflict resolution
          - Validation status for each workflow
        
        Expected outputs:
        - workflow_registry: Workflow registry with resolved references
        - reference_graph: Reference dependency graph
        - circular_references: Detected circular references
        - version_conflicts: Version conflicts detected
        - validation_results: Per-workflow validation status
      
      variables:
        registry_path: "${workflow_registry.registry_path}"
        workflow_ref: "${step.orchestrator_config.output.orchestrator_config.workflow_registry_loaded}"
    
    output:
      save_to: workflow_registry
      format: json
      fields:
        - workflows: "array of workflow objects with resolved references"
        - reference_graph: "object describing reference dependency graph"
        - circular_references: "array of circular reference pairs"
        - version_conflicts: "array of version conflict objects"
        - validation_results: "array of validation status objects"
      
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff: exponential
  
  # ── STEP 3: Initialize Isolated Environments ───────────────────────
  step_3_initialize_isolated_environments:
    name: Initialize Isolated Environments
    description: Prepare isolated execution environments for each workflow
    
    generative_entity: "${models.primary_model}"
    
    prompt: |
        Create isolated environment for each registered workflow:
        
        For each workflow:
          1. Create workspace directory: ./workflows/${workflow_id}/
          2. Create state directory: ./workspace/states/${workflow_id}/
          3. Create output directory: ./workspace/output/${workflow_id}/
          4. Create log directory: ./workspace/logs/${workflow_id}/
          5. Create cache directory: ./workspace/cache/${workflow_id}/
          
        Environments prepared and ready for isolated execution.
      
      output:
      save_to: environments_config
      format: json
      fields:
        - environments_prepared
        - workflow_environments_initialized
      
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff: exponential
  
  # ── PIPELINE DEFINITION ────────────────────────────
pipeline:
  
  # ── STEP 4: Initialize Workflow System ───────────────────────
  step_4_initialize_orchestration:
    name: Initialize Orchestration
    description: Initialize orchestration and spawn all sub-workflows
    
    generative_entity: "${models.primary_model}"
    
    prompt: |
        Initialize orchestration system:
        
        1. Load orchestrator config from previous step
        2. Initialize event handling with callbacks
        3. Enable parallel sub-workflows with max concurrency limit
        4. Start event propagation and aggregation
        5. Prepare validation aggregation
        
        6. Start orchestration monitoring
        
        Output: Orchestrator initialized and ready.
      
      output:
      save_to: orchestrator_config
      format: json
      fields:
        - orchestrator_initialized
      console:
          enabled: true
    
    retry:
      max_attempts: 3
      backoff: exponential
  
  # ── STEP 5: Parallel Execution Loop ────────────────────────
  step_5_parallel_execution_loop:
    name: Parallel Execution Loop
    description: Execute all sub-workflows in parallel with validation and aggregation
    
    generative_entity: "${models.primary_model}"
    
    prompt: |
        Parallel execution loop:
        
        For each sub-workflow:
          1. Create isolated environment
          2. Execute workflow in isolated environment
          3. Monitor execution status
          4. Validate outputs
          5. Collect results for aggregation
          6. Retry on failures
          7. Timeout and cancel on stuck workflows
        
        Parallel execution strategy:
        - Max 3 workflows at a time
        - If workflow stalls, continue others
        - Adaptive concurrency based on resource pressure
        - Checkpoint at each iteration
        - Aggregate results when all complete
        
        Expected outputs:
        - Execution results: Array of workflow outputs
        - Aggregated validation: Combined validation scores
        - Failed workflows: List of workflow IDs and reasons
        - Performance metrics
      
      variables:
        parallel_results: "${step.orchestrator_config.output.parallel_results}"
        workflow_count: "${step.orchestrator_config.output.workflow_registry_loaded}"
    
    output:
      save_to: parallel_execution_results
      format: json
      fields:
        - executed_workflows
        - validation_aggregation
        - failed_workflows
        - performance_metrics
      console:
        enabled: true
    
    retry:
      max_attempts: 2
      backoff: exponential
  
  # ── STEP 6: Aggregate and Validate Results ────────────────────────
  step_6_aggregate_and_validate:
    name: Aggregate and Validate Results
    description: Collect results from all parallel workflows and validate final results
    
    generative_entity: "${models.primary_model}"
    
    prompt: |
        Aggregate and validate all results:
        
        1. Read parallel results:
          ${step.parallel_execution_loop.output.parallel_results}
        
        2. Read validation results:
          ${step.parallel_execution_loop.output.validation_aggregation}
        
        3. Calculate overall validation status:
          - All workflows passed validation?
          - Critical issues detected?
          - Code quality scores meet threshold?
          - Test coverage complete?
          - Documentation complete?
        
        4. Identify failed workflows:
          - Which workflows failed?
          - Why did they fail?
        
        5. Calculate combined scores:
          - Weighted validation scores
          - Combined code quality: Σ(score * weight) / Σ weights
          - Combined test scores: Σ(test_score * weight) / Σ weights
          
        6. Generate summary report.
        
        7. Check for conflicts:
          - Any validation criteria in conflict?
          - Any workflow dependencies invalid?
          - Resource conflicts?
          - Version conflicts?
        
        8. Performance analysis:
          - Total execution time
          - Parallel efficiency
          - Memory usage
          - Resource bottlenecks
        
        9. Generate recommendations:
          - Improvements for future workflows
          - Optimize resource usage
          - Improve validation thresholds
          - Better error handling
        
        Output:
      save_to: aggregated_validation
      format: json
      fields:
        - overall_validation_passed
        - weighted_validation_score
        - critical_issues_found
        - code_quality_score
        - test_results_score
        - documentation_completeness_score
        - performance_metrics
        - failed_workflows
        - recommendations
        - resource_optimizations
      
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff: exponential
  
  # ── WORKFLOW VARIABLES ────────────────────────────
workflow:
  codebase_path: /workspace
  output_path: /workspace/output
  checkpoint_path: /workspace/checkpoints
  state_path: /workspace/state
  logs_path: /workspace/logs
  max_memory_mb: 12288
  quality_threshold: 0.85
  
# ── FEATURES DEMONSTRATED ───────────────────────────
features_demonstrated:
  - workflow_references
  - nested_workflow_references
  - parallel_execution
  - orchestration
  - validation_aggregation
  - checkpoint_coordination
  - hierarchical_logging
  - resource_management
  - retry_logic
  - timeout_management
  - memory_management
  - workflow_execution_strategy
