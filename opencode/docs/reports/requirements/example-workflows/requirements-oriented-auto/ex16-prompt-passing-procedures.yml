---
workflow_id: prompt_passing_procedures
name: Multi-Step Prompt Refinement Procedures
description: Demonstrates multi-step prompt refinement loops with iterative improvement

# Model Configuration
models:
  primary:
    provider: lmstudio
    model: "llama-3.2-3b-instruct"
    backend: vulkan
    gpu_layers: 32

  secondary:
    provider: ollama
    model: "llama3.2"
    backend: cpu

# Execution Mode
execution:
  mode: serial
  memory:
    max_allocated_memory_mb: 4096
    model_memory_mb: 2048
    unload_unused: true

# Logging
logging:
  level: debug
  detail: high
  output_type: chat
  format: json
  console: true
  include_timestamps: true

# Pipeline Definition
pipeline:
  # ========================================
  # Step 1: Initial Prompt Generation
  # ========================================
  - step: generate_initial_prompt
    id: step_1
    model: "${models.primary}"
    input:
      prompt: |
        Generate an initial prompt for a complex task:

        Task: Create a comprehensive Python data pipeline for processing large datasets

        Requirements:
        1. Start with a basic understanding of the task
        2. Create a first draft prompt focusing on core functionality
        3. Keep it simple and understandable
        4. Generate the initial prompt text
        5. Store it for refinement

        Output format:
        - prompt_text: The generated initial prompt
        - version: "1.0"
        - complexity: "basic"
        - timestamp: ${workflow.timestamp}
        - source: "initial_generation"

      prompt_config:
        complexity: basic
        target_length: 200-300 words
        language: python
        focus_areas:
          - data loading
          - data processing
          - data validation

    output:
      save_to: initial_prompt
      format: json
      fields:
        - prompt_text
        - version
        - complexity
        - timestamp
        - source
        - word_count
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 2: First Refinement (Structure)
  # ========================================
  - step: refine_prompt_structure
    id: step_2
    model: "${models.primary}"
    input:
      prompt: |
        Refine the initial prompt by improving structure and clarity:

        Current prompt:
        ${step.step_1.output.prompt_text}

        Requirements:
        1. Add clear structure and organization
        2. Use bullet points for requirements
        3. Break down into logical sections
        4. Add clear sections:
           - Background/Context
           - Requirements
           - Expected Output
           - Success Criteria
        5. Improve readability and flow
        6. Maintain original intent
        7. Keep similar word count

        Output format:
        - refined_prompt_text: The improved prompt
        - version: "2.0"
        - improvement_type: "structure"
        - changes_made: ["bullet points added", "sections organized", "clarity improved"]
        - timestamp: ${workflow.timestamp}

      refinement_config:
        improvement_type: structure
        target_sections:
          - background
          - requirements
          - expected_output
          - success_criteria
        section_order: [background, requirements, expected_output, success_criteria]

    output:
      save_to: refined_prompt_v2
      format: json
      fields:
        - refined_prompt_text
        - version
        - improvement_type
        - changes_made
        - timestamp
        - structure_score
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 3: Second Refinement (Detail)
  # ========================================
  - step: add_detail_and_precision
    id: step_3
    model: "${models.primary}"
    input:
      prompt: |
        Add detail and precision to the refined prompt:

        Refined prompt:
        ${step.step_2.output.refined_prompt_text}

        Requirements:
        1. Add specific requirements and constraints
        2. Include performance requirements
        3. Add error handling requirements
        4. Include documentation requirements
        5. Add testing requirements
        6. Include code quality standards
        7. Be specific about:
           - Expected performance metrics
           - Error handling approaches
           - Documentation standards
           - Testing coverage requirements

        Output format:
        - detailed_prompt_text: The detailed prompt
        - version: "3.0"
        - improvement_type: "detail"
        - additional_requirements_added: []
        - timestamp: ${workflow.timestamp}

      detail_config:
        performance_requirements:
          - processing_time: "under 10 seconds for 1M rows"
          - memory_usage: "under 2GB"
        error_handling:
          - graceful_degradation: true
          - error_logging: true
          - error_recovery: true
        documentation:
          - docstring_style: "Google style"
          - inline_comments: required
          - type_hints: required
        testing:
          - coverage_target: "90%"
          - test_framework: "pytest"
          - test_types: [unit, integration, performance]

    output:
      save_to: detailed_prompt_v3
      format: json
      fields:
        - detailed_prompt_text
        - version
        - improvement_type
        - additional_requirements_added
        - timestamp
        - detail_score
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 4: Third Refinement (Optimization)
  # ========================================
  - step: optimize_for_llm_comprehension
    id: step_4
    model: "${models.secondary}"
    input:
      prompt: |
        Optimize the detailed prompt for LLM comprehension:

        Detailed prompt:
        ${step.step_3.output.detailed_prompt_text}

        Requirements:
        1. Make it more concise while maintaining completeness
        2. Use clearer, simpler language
        3. Remove redundancy
        4. Improve prompt flow and readability
        5. Add specific examples where helpful
        6. Ensure prompt is not overwhelming
        7. Optimize for LLM understanding and generation

        Optimization strategies:
        - Use clear instructions
        - Be specific but concise
        - Use numbered lists for steps
        - Add examples
        - Use formatting to improve readability
        - Avoid overly complex sentence structures

        Output format:
        - optimized_prompt_text: The optimized prompt
        - version: "4.0"
        - improvement_type: "optimization"
        - changes: []
        - timestamp: ${workflow.timestamp}

      optimization_config:
        max_length_words: 400
        language_simplicity: "high"
        readability_score_target: "9/10"
        llm_comprehension_focus: true

    output:
      save_to: optimized_prompt_v4
      format: json
      fields:
        - optimized_prompt_text
        - version
        - improvement_type
        - changes
        - timestamp
        - readability_score
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 5: Fourth Refinement (Verification)
  # ========================================
  - step: validate_and_refine_again
    id: step_5
    model: "${models.primary}"
    input:
      prompt: |
        Validate the optimized prompt and refine if necessary:

        Optimized prompt:
        ${step.step_4.output.optimized_prompt_text}

        Validation criteria:
        1. Is the prompt clear and unambiguous?
        2. Does it have all necessary requirements?
        3. Is it too long or too short?
        4. Is the language appropriate for LLM?
        5. Are the instructions clear and actionable?
        6. Is the expected output clearly defined?
        7. Are there any missing sections?

        If any issues found:
        - Identify the specific problems
        - Generate targeted improvements
        - Create the revised version

        Output format:
        - validation_results: {valid: true/false, issues: [], suggestions: []}
        - refined_prompt_text: The revised prompt if needed
        - version: "5.0"
        - improvement_type: "validation"
        - timestamp: ${workflow.timestamp}

      validation_config:
        criteria:
          - clear_and_unambiguous: true
          - complete_requirements: true
          - appropriate_length: true
          - llm_friendly: true
          - actionable_instructions: true
          - clear_output: true
          - comprehensive_sections: true
        auto_refine: true
        threshold: 0.8  # 80% success required

    output:
      save_to: validated_prompt_v5
      format: json
      fields:
        - validation_results
        - refined_prompt_text
        - version
        - improvement_type
        - timestamp
        - overall_score
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 6: Final Polish
  # ========================================
  - step: final_polish_and_documentation
    id: step_6
    model: "${models.primary}"
    input:
      prompt: |
        Perform final polish on the prompt:

        Current prompt:
        ${step.step_5.output.refined_prompt_text}

        Requirements:
        1. Add metadata and documentation about the prompt
        2. Create a prompt usage guide
        3. Document the refinement history
        4. Create version comparison
        5. Add prompt tags for categorization
        6. Generate prompt summary
        7. Document any assumptions or constraints

        Output format:
        - final_prompt_text: The polished final prompt
        - version: "6.0"
        - improvement_type: "polish"
        - history: []
        - tags: []
        - metadata: {}
        - summary: ""
        - timestamp: ${workflow.timestamp}

      polish_config:
        add_prompt_metadata: true
        add_usage_guide: true
        document_refinement_history: true
        create_version_comparison: true
        add_prompt_tags: true
        add_prompt_summary: true

    output:
      save_to: final_prompt_v6
      format: json
      fields:
        - final_prompt_text
        - version
        - improvement_type
        - history
        - tags
        - metadata
        - summary
        - timestamp
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

  # ========================================
  # Step 7: Loop Validation
  # ========================================
  - step: validate_final_prompt
    id: step_7
    model: "${models.primary}"
    input:
      prompt: |
        Validate the final polished prompt:

        Final prompt:
        ${step.step_6.output.final_prompt_text}

        Comprehensive validation:
        1. Structure validation:
           - All required sections present
           - Logical flow maintained
           - Clear hierarchy

        2. Content validation:
           - Requirements complete and clear
           - Examples provided where needed
           - Constraints specified
           - Success criteria defined

        3. LLM optimization validation:
           - Clear and concise language
           - Well-structured instructions
           - Appropriate length
           - LLM-friendly formatting

        4. Output validation:
           - Expected output clearly defined
           - Response format specified
           - Output quality criteria

        Output format:
        - validation_results: []
        - overall_status: "passed"|"warning"|"failed"
        - confidence_score: 0.0-1.0
        - recommendations: []

      validation_config:
        comprehensive_validation: true
        auto_approve: true
        min_confidence_score: 0.8

    output:
      save_to: validation_result
      format: json
      fields:
        - validation_results
        - overall_status
        - confidence_score
        - recommendations
        - timestamp
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

# Prompt Passing Procedures Configuration
prompt_passing_procedures:
  # Iterative refinement strategies
  strategies:
    - name: structure_refinement
      description: "Improve prompt organization and clarity"
      version: "v2.0"
      improvements: ["bullet points", "section organization"]

    - name: detail_refinement
      description: "Add specific requirements and constraints"
      version: "v3.0"
      improvements: ["performance requirements", "error handling", "documentation standards"]

    - name: optimization_refinement
      description: "Optimize for LLM comprehension"
      version: "v4.0"
      improvements: ["conciseness", "simpler language", "readability"]

    - name: validation_refinement
      description: "Validate and fix issues"
      version: "v5.0"
      improvements: ["issue identification", "targeted fixes"]

    - name: polish_refinement
      description: "Final polish and documentation"
      version: "v6.0"
      improvements: ["metadata", "history", "usage guide"]

  # Refinement loop configuration
  refinement_loop:
    enabled: true
    max_iterations: 10
    stop_condition:
      - overall_score >= 0.8
      - iterations >= 5
    stop_action: "stop_on_success_or_limit"

  # Prompt passing configuration
  prompt_passing:
    preserve_original: true
    create_versions: true
    versioning_strategy: "sequential_incremental"

  # Validation configuration
  validation:
    required_sections:
      - background
      - requirements
      - expected_output
      - success_criteria

    success_criteria:
      - structure_score >= 0.9
      - clarity_score >= 0.9
      - completeness_score >= 0.9
      - llm_comprehension_score >= 0.9

# Workflow Variables
workflow:
  workspace_path: /workspace
  output_path: /workspace/output
  prompts_path: /workspace/prompts
  timestamp: ${workflow.timestamp}

# Retry Configuration
retry:
  default:
    max_attempts: 3
    backoff_strategy: exponential
    on_failure: escalate_model

  escalation:
    fallback_models:
      - provider: ollama
        model: "llama3.2"
      - provider: llamacpp
        model: "/models/llama-3.2-3b.Q4_K_M.gguf"
        backend: vulkan

# Metrics
metrics:
  enabled: true
  collect:
    - total_iterations
    - prompt_length_words
    - structure_score
    - detail_score
    - readability_score
    - overall_score
    - confidence_score
    - total_refinement_time_seconds
  output:
    path: /workspace/output/prompt_passing_metrics.json
    format: json

# Prompt History Documentation
prompt_history:
  enabled: true
  document_versions: true
  create_diffs: true
  export_formats:
    - json
    - markdown
    - text
