---
# Workflow: Document Indexing and Retrieval Operations
# Category: RAG Operations
# Focus: Document processing, chunking, embedding, indexing, and semantic retrieval
#
# This workflow demonstrates:
# - Document ingestion from multiple sources
# - Text chunking strategies (fixed, semantic, recursive)
# - Embedding generation with multiple models
# - Vector store indexing (in-memory, persistent)
# - Semantic search and retrieval operations
# - Hybrid retrieval (dense + sparse)
# - Reranking and result filtering

workflow_id: document_indexing_retrieval
name: Document Indexing and Retrieval Pipeline
description: |
  Comprehensive RAG pipeline demonstrating document indexing, chunking strategies,
  embedding generation, vector store management, and semantic retrieval operations.
  Supports multiple document formats, chunking approaches, and retrieval methods.
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - rag-operations
  - document-indexing
  - vector-store
  - semantic-search
  - embeddings
  - retrieval

# ─────────────────────────────────────────────────────────────────────────────
# MODEL CONFIGURATION
# Embedding models and LLM for semantic operations
# ─────────────────────────────────────────────────────────────────────────────
models:
  # Primary embedding model for document vectors
  embedder:
    name: "Document Embedder"
    host:
      type: ollama
      connection_settings:
        base_url: "http://localhost:11434"
        timeout_secs: 60
    generative_entity: "nomic-embed-text"
    execution:
      timeout:
        time_to_first_response: 5s
        total_time_to_response: 30s

  # Query embedding model (can be same or different)
  query_embedder:
    name: "Query Embedder"
    host:
      type: ollama
      connection_settings:
        base_url: "http://localhost:11434"
    generative_entity: "nomic-embed-text"

  # Reranking model for result improvement
  reranker:
    name: "Result Reranker"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

  # LLM for metadata extraction and summarization
  analyzer:
    name: "Document Analyzer"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

# ─────────────────────────────────────────────────────────────────────────────
# RAG CONFIGURATION
# Vector store, chunking, and retrieval settings
# ─────────────────────────────────────────────────────────────────────────────
rag:
  # Vector store configuration
  vector_store:
    type: qdrant  # in_memory | qdrant | milvus | pinecone | chromadb
    collection_name: "knowledge_base"
    embedding_dimension: 768
    distance_metric: cosine  # cosine | euclidean | dot_product
    
    # Persistent storage settings
    persistence:
      enabled: true
      path: "./workspace/vectors/qdrant"
      
    # Index optimization
    index_config:
      hnsw_config:
        m: 16
        ef_construct: 100
      quantization: scalar  # none | scalar | product | binary

  # Chunking configuration
  chunking:
    # Default chunking strategy
    default_strategy: semantic  # fixed | semantic | recursive | sentence
    
    # Fixed-size chunking
    fixed:
      chunk_size: 512
      chunk_overlap: 50
      
    # Semantic chunking (respects sentence/paragraph boundaries)
    semantic:
      min_chunk_size: 100
      max_chunk_size: 1000
      break_on: [paragraph, sentence]
      
    # Recursive chunking (hierarchical)
    recursive:
      chunk_sizes: [1500, 500, 200]
      separators: ["\n\n", "\n", ". ", " ", ""]
      
    # Sentence-based chunking
    sentence:
      sentences_per_chunk: 5
      overlap_sentences: 1

  # Retrieval configuration
  retrieval:
    # Default retrieval method
    method: hybrid  # dense | sparse | hybrid | multi_query
    
    # Dense retrieval settings
    dense:
      top_k: 10
      score_threshold: 0.7
      
    # Sparse retrieval (BM25/keyword) settings
    sparse:
      top_k: 10
      bm25_k1: 1.5
      bm25_b: 0.75
      
    # Hybrid retrieval settings
    hybrid:
      dense_weight: 0.7
      sparse_weight: 0.3
      fusion_method: rrf  # rrf | weighted | max
      
    # Multi-query retrieval
    multi_query:
      generate_queries: true
      num_queries: 3
      
    # Reranking settings
    reranking:
      enabled: true
      model: "${models.reranker}"
      top_n: 5
      rerank_strategy: cross_encoder

# ─────────────────────────────────────────────────────────────────────────────
# EXECUTION MODE
# ─────────────────────────────────────────────────────────────────────────────
execution:
  mode: hybrid
  memory:
    max_allocated_memory_mb: 8192
    model_memory_mb: 4096
    unload_unused: true
    gc_interval_secs: 300

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────────────────────────────────────────
logging:
  global:
    level: info
    detail: medium
    output_type: chat
    format: json
    console: true

  rag_operations:
    level: debug
    detail: high
    include_chunking: true
    include_embeddings: true
    include_retrieval_scores: true

# ─────────────────────────────────────────────────────────────────────────────
# TOOL PERMISSIONS
# ─────────────────────────────────────────────────────────────────────────────
tool_permissions:
  file_operations:
    read:
      enabled: true
      allowed_paths:
        - ./workspace/documents
        - ./workspace/config
    write:
      enabled: true
      allowed_paths:
        - ./workspace/vectors
        - ./workspace/output

# ─────────────────────────────────────────────────────────────────────────────
# WORKFLOW STEPS
# ─────────────────────────────────────────────────────────────────────────────
agentic_workflow:
  steps:
    # ── STEP 1: Document Ingestion ────────────────────────────────────
    - step: ingest_documents
      id: step_1
      type: agent
      generative_entity: "${models.analyzer}"
      
      prompt: |
        Ingest documents from the configured sources and prepare for indexing.
        
        Source directory: ./workspace/documents
        
        Tasks:
        1. Scan directory for supported document formats (txt, md, pdf, json)
        2. Extract text content from each document
        3. Extract metadata (title, author, date, source)
        4. Calculate document statistics (word count, character count)
        5. Assign unique document IDs
        
        Output a structured inventory with:
        - documents: list of {id, path, title, format, word_count, metadata}

      input_variables:
        source_path: ./workspace/documents
        supported_formats: ["txt", "md", "json", "yaml"]

      output:
        save_to: document_inventory
        format: json
        file_output:
          enabled: true
          path: ./workspace/output/document_inventory.json

    # ── STEP 2: Text Chunking ────────────────────────────────────────
    - step: chunk_documents
      id: step_2
      type: agent
      generative_entity: "${models.analyzer}"
      
      prompt: |
        Apply chunking strategy to ingested documents.
        
        Document inventory:
        ${step.step_1.output}
        
        Chunking configuration:
        - Strategy: semantic (respects paragraph/sentence boundaries)
        - Min chunk size: 100 characters
        - Max chunk size: 1000 characters
        
        For each document:
        1. Apply semantic chunking algorithm
        2. Preserve document context (title, metadata) in each chunk
        3. Generate chunk IDs that reference parent document
        4. Track chunk positions for citation
        
        Output:
        - chunks: list of {id, document_id, text, position, metadata}
        - statistics: {total_chunks, avg_chunk_size, chunk_size_distribution}

      input_variables:
        documents: "${step.step_1.output.documents}"
        chunking_config: "${rag.chunking.semantic}"

      output:
        save_to: chunked_documents
        format: json
        fields:
          - chunks
          - statistics

    # ── STEP 3: Generate Embeddings ──────────────────────────────────
    - step: generate_embeddings
      id: step_3
      type: agent
      generative_entity: "${models.embedder}"
      
      prompt: |
        Generate embeddings for all document chunks.
        
        Chunked documents:
        ${step.step_2.output}
        
        Embedding model: nomic-embed-text
        Embedding dimension: 768
        
        Process:
        1. Batch chunks for efficient embedding (batch size: 32)
        2. Generate embedding vector for each chunk
        3. Normalize vectors for cosine similarity
        4. Track any failed embeddings
        
        Output:
        - embeddings: list of {chunk_id, vector, model_used}
        - failed: list of failed chunk IDs with error reasons
        - statistics: {total_embeddings, embedding_time_ms}

      input_variables:
        chunks: "${step.step_2.output.chunks}"
        batch_size: 32

      output:
        save_to: document_embeddings
        format: json

      retry:
        max_attempts: 3
        backoff: exponential
        delay_ms: 1000

    # ── STEP 4: Index to Vector Store ────────────────────────────────
    - step: index_to_vector_store
      id: step_4
      type: agent
      generative_entity: "${models.analyzer}"
      
      prompt: |
        Index embeddings and chunks into the vector store.
        
        Embeddings:
        ${step.step_3.output}
        
        Chunks:
        ${step.step_2.output}
        
        Vector store configuration:
        - Type: qdrant
        - Collection: knowledge_base
        - Distance metric: cosine
        
        Tasks:
        1. Create collection if not exists
        2. Index embeddings with payload (text, metadata, document_id)
        3. Optimize index for search performance
        4. Verify indexed document count
        
        Output:
        - indexed_count: number of chunks indexed
        - collection_stats: vector count, index size
        - status: success | partial_failure | failure

      input_variables:
        embeddings: "${step.step_3.output.embeddings}"
        chunks: "${step.step_2.output.chunks}"
        vector_store_config: "${rag.vector_store}"

      output:
        save_to: indexing_result
        format: json

    # ── STEP 5: Test Retrieval ───────────────────────────────────────
    - step: test_retrieval
      id: step_5
      type: agent
      generative_entity: "${models.query_embedder}"
      
      prompt: |
        Test the retrieval system with sample queries.
        
        Sample queries:
        1. "How do I configure the embedding model?"
        2. "What chunking strategies are available?"
        3. "Explain the hybrid retrieval method"
        
        Retrieval configuration:
        - Method: hybrid (dense + sparse)
        - Top-k: 10
        - Dense weight: 0.7
        - Sparse weight: 0.3
        
        For each query:
        1. Generate query embedding
        2. Perform dense retrieval
        3. Perform sparse retrieval (BM25)
        4. Apply hybrid fusion
        5. Return top results with scores
        
        Output:
        - query_results: list of {query, results: [{chunk_id, text, score}]}
        - retrieval_metrics: {avg_latency_ms, precision_estimate}

      input_variables:
        test_queries:
          - "How do I configure the embedding model?"
          - "What chunking strategies are available?"
          - "Explain the hybrid retrieval method"
        retrieval_config: "${rag.retrieval.hybrid}"

      output:
        save_to: retrieval_test_results
        format: json

    # ── STEP 6: Rerank Results ───────────────────────────────────────
    - step: rerank_results
      id: step_6
      type: agent
      generative_entity: "${models.reranker}"
      
      prompt: |
        Rerank the retrieved results for improved relevance.
        
        Retrieval results:
        ${step.step_5.output}
        
        Reranking configuration:
        - Model: llama-3.2-3b-instruct
        - Top-n: 5 results per query
        - Strategy: cross-encoder scoring
        
        For each query's results:
        1. Score each result pair (query, chunk) for relevance
        2. Re-sort by relevance score
        3. Return top 5 reranked results
        
        Output:
        - reranked_results: list of {query, results: [{chunk_id, text, original_score, rerank_score, rank_change}]}

      input_variables:
        query_results: "${step.step_5.output.query_results}"
        rerank_top_n: 5

      output:
        save_to: reranked_results
        format: json

    # ── STEP 7: Generate Index Report ────────────────────────────────
    - step: generate_index_report
      id: step_7
      type: agent
      generative_entity: "${models.analyzer}"
      
      prompt: |
        Generate a comprehensive report of the indexing and retrieval pipeline.
        
        Document inventory:
        ${step.step_1.output}
        
        Chunking statistics:
        ${step.step_2.output.statistics}
        
        Embedding statistics:
        ${step.step_3.output.statistics}
        
        Indexing result:
        ${step.step_4.output}
        
        Retrieval test results:
        ${step.step_5.output.retrieval_metrics}
        
        Reranking improvements:
        ${step.step_6.output}
        
        Create a report summarizing:
        1. Documents processed and statistics
        2. Chunking strategy results
        3. Embedding generation performance
        4. Vector store indexing status
        5. Retrieval quality metrics
        6. Recommendations for optimization

      output:
        save_to: index_report
        format: markdown
        file_output:
          enabled: true
          path: ./workspace/output/indexing_report.md

# ─────────────────────────────────────────────────────────────────────────────
# RETRY CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
retry:
  default:
    max_attempts: 3
    backoff: exponential
    delay_ms: 1000
    base_ms: 1000
    max_ms: 30000

# ─────────────────────────────────────────────────────────────────────────────
# METRICS
# ─────────────────────────────────────────────────────────────────────────────
metrics:
  enabled: true
  collect:
    - documents_ingested
    - chunks_created
    - embeddings_generated
    - indexing_time_ms
    - retrieval_latency_ms
    - reranking_time_ms
  output:
    path: ./workspace/metrics/rag_indexing_metrics.json
    format: json

# ─────────────────────────────────────────────────────────────────────────────
# FEATURE SUMMARY
# ─────────────────────────────────────────────────────────────────────────────
features_demonstrated:
  - document_ingestion: true
    formats: [txt, md, pdf, json, yaml]
  
  - chunking_strategies: true
    types: [fixed, semantic, recursive, sentence]
  
  - embedding_generation: true
    batch_processing: true
    normalization: true
  
  - vector_store_indexing: true
    stores: [in_memory, qdrant, chromadb]
    distance_metrics: [cosine, euclidean, dot_product]
  
  - retrieval_methods: true
    types: [dense, sparse, hybrid, multi_query]
  
  - reranking: true
    strategies: [cross_encoder, llm_based]
  
  - hybrid_fusion: true
    methods: [rrf, weighted, max]
