---
workflow_id: hierarchical_logging_system
name: Hierarchical Logging System
description: Demonstrates 9-level hierarchical logging system with global, workflow, pipeline, models, tools, execution, file, web, state, and performance scopes
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - logging-monitoring
  - hierarchical-logging
  - 9-level-system
  - log-scopes

models:
  logging_coordinator:
    name: "Logging Coordinator"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

agentic_workflow:
  step_1_global_config:
    name: "Global Configuration Logging"
    model: "${models.logging_coordinator}"

    input:
      prompt: |
        Log global workflow configuration at debug level.

        Configuration to log:
        - workflow_id: hierarchical_logging_system
        - execution_strategy: serial
        - logging enabled: true
        - default log level: info
        - all 9 scopes enabled

        Include in log:
        1. Configuration values
        2. Scope enablement status
        3. Output destinations

        Use debug level for this step.

    when:
      after_step_succeeds:
        save_to: global_config_log

  step_2_workflow_start:
    name: "Workflow Start Logging"
    model: "${models.logging_coordinator}"

    input:
      prompt: |
        Log workflow start event.

        Event details:
        - Event type: workflow_start
        - Timestamp: {{now}}
        - Workflow ID: hierarchical_logging_system
        - Execution mode: serial
        - User: {{workflow.user || "system"}}
        - Start reason: user_initiated

        Use workflow scope at info level.

    when:
      after_step_succeeds:
        save_to: workflow_start_log

  step_3_pipeline_transitions:
    name: "Pipeline Transition Logging"
    model: "${models.logging_coordinator}"

    input:
      prompt: |
        Log pipeline step transitions.

        Transition events:
        - Previous step: workflow_start
        - Current step: pipeline_transitions
        - Transition type: forward
        - State: active
        - Decision points: none

        Use pipeline scope at debug level.
        Capture step metadata.

    when:
      after_step_succeeds:
        save_to: pipeline_log

  step_4_model_lifecycle:
    name: "Model Lifecycle Logging"
    model: "${models.logging_coordinator}"

    input:
      prompt: |
        Log model lifecycle events.

        Model events:
        - Event type: model_load
        - Model: logging_coordinator
        - Load time: record timestamp
        - Resource allocation: 2048MB RAM, 4096MB VRAM
        - Load duration: measure
        - Load status: success

        Use models scope at warning level.
        Include resource usage metrics.

    when:
      after_step_succeeds:
        save_to: model_lifecycle_log

  step_5_tool_execution:
    name: "Tool Execution Logging"
    model: "${models.logging_coordinator}"

    input:
      prompt: |
        Log tool execution with full details.

        Tool execution:
        - Tool type: file_read
        - Tool operation: read ./workspace/config/settings.yml
        - Execution time: measure
        - Status: success
        - Data read: 245 bytes
        - Result: valid YAML structure

        Use tools scope at debug level.
        Capture tool parameters and results.

    when:
      after_step_succeeds:
        save_to: tool_execution_log

  step_6_execution_metrics:
    name: "Execution Metrics Logging"
    model: "${models.logging_coordinator}"

    input:
      prompt: |
        Log execution metrics and resource monitoring.

        Metrics to log:
        - Total execution time: calculate
        - Memory usage: peak and average
        - CPU usage: percentage and cores
        - Tool execution count: sum from all steps
        - Agent turn count: track
        - Success rate: percentage

        Use execution scope at debug level.
        Include resource pressure indicators.

    when:
      after_step_succeeds:
        save_to: metrics_log

  step_7_workflow_complete:
    name: "Workflow Complete Logging"
    model: "${models.logging_coordinator}"

    input:
      prompt: |
        Log workflow completion event.

        Completion details:
        - Event type: workflow_complete
        - Timestamp: {{now}}
        - Total duration: calculate from start
        - Steps executed: 7
        - Success status: complete
        - Errors encountered: none

        Use workflow scope at info level.
        Generate completion summary.

    when:
      after_step_succeeds:
        save_to: workflow_complete_log
        file_output:
          path: ./workspace/output/logging-summary.json
