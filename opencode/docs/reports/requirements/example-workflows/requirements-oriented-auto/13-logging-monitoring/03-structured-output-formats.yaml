---
workflow_id: structured_output_formats
name: Structured Output Formats and Logging Destinations
description: Demonstrates structured output in JSON, YAML, text, and markdown formats with console, file, and remote logging
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - logging-monitoring
  - structured-output
  - output-formats

models:
  output_manager:
    name: "Output Manager"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

logging:
  enabled: true

  output:
    console:
      enabled: true
      color: true
      timestamps: true
      format: text

    file:
      enabled: true
      format: json
      rotation:
        enabled: true
        max_size_mb: 100
        max_files: 10

    remote:
      enabled: false
      webhook_url: ""
      headers: {}

agentic_workflow:
  step_1_json_output:
    name: "Generate JSON Structured Output"
    type: agent
    model: "${models.output_manager}"

    input:
      prompt: |
        Generate structured JSON output.

        Output requirements:
        - Format: JSON
        - Structure: nested object with arrays
        - Fields: include metadata, data, results
        - Validation: schema valid
        - Pretty: readable with 2-space indent

        Sample structure:
        ```json
        {
          "workflow_id": "structured_output_formats",
          "timestamp": "2024-01-15T10:30:00Z",
          "results": [
            {
              "step": "json_output",
              "status": "success",
              "data": {...}
            }
          ],
          "metadata": {
            "total_steps": 7,
            "execution_time": "42.5s"
          }
        }
        ```

        Return valid JSON structure.

    output:
      save_to: json_output_result
      format: json

  step_2_yaml_output:
    name: "Generate YAML Structured Output"
    type: agent
    model: "${models.output_manager}"

    input:
      prompt: |
        Generate structured YAML output.

        Output requirements:
        - Format: YAML
        - Structure: nested mapping with lists
        - Fields: include sections, comments, data
        - Validation: proper syntax and indentation

        Sample structure:
        ```yaml
        workflow_id: structured_output_formats
        version: "1.0.0"
        results:
          - step: yaml_output
            status: success
            data:
              value1: key1
              value2: key2
        metadata:
          total_steps: 7
          execution_time: "38.2s"
        ```

        Return valid YAML structure.

    output:
      save_to: yaml_output_result
      format: json

  step_3_text_output:
    name: "Generate Text Output"
    type: agent
    model: "${models.output_manager}"

    input:
      prompt: |
        Generate human-readable text output.

        Output requirements:
        - Format: Plain text
        - Structure: section headers, bullet points, tables
        - Formatting: consistent spacing and alignment
        - Validation: readable and well-structured

        Sample structure:
        ```
        # Workflow Execution Report

        ## Summary
        Total steps: 7
        Execution time: 42.5s
        Status: Complete

        ## Step Results
        1. JSON Output: SUCCESS
           - Output size: 2.3KB
           - Validation: PASSED

        2. YAML Output: SUCCESS
           - Output size: 1.8KB
           - Validation: PASSED

        ## Performance Metrics
        Average step time: 6.1s
        Success rate: 100%
        ```

        Return well-formatted text output.

    output:
      save_to: text_output_result
      format: text

  step_4_markdown_output:
    name: "Generate Markdown Output"
    type: agent
    model: "${models.output_manager}"

    input:
      prompt: |
        Generate Markdown formatted output.

        Output requirements:
        - Format: Markdown
        - Structure: headers (##, ###), code blocks, lists
        - Formatting: tables for data, bold for emphasis
        - Validation: proper markdown syntax

        Sample structure:
        ```markdown
        # Structured Output Formats Workflow

        ## Summary
        | Format | Status | Output Size |
        |---------|--------|-------------|
        | JSON | Complete | 2.3KB |
        | YAML | Complete | 1.8KB |
        | Text | Complete | 4.1KB |
        | Markdown | Complete | 5.2KB |

        ## Detailed Results

        ### JSON Output
        ```json
        {
          "status": "success",
          "data": {...}
        }
        ```

        ### YAML Output
        ```yaml
        results:
          - step: yaml_output
            status: success
        ```

        ## Performance
        - Average step time: 6.1s
        - Success rate: 100%
        ```

        Return properly formatted Markdown.

    output:
      save_to: markdown_output_result
      format: markdown

  step_5_generate_multi_format_report:
    name: "Generate Multi-Format Report"
    type: agent
    model: "${models.output_manager}"

    input:
      variables:
        json: "${step.step_1_json_output.output}"
        yaml: "${step.step_2_yaml_output.output}"
        text: "${step.step_3_text_output.output}"
        markdown: "${step.step_4_markdown_output.output}"

      prompt: |
        Generate comprehensive multi-format output report.

        Report sections:
        1. Output format comparison
        2. Validation results for each format
        3. Performance metrics per format
        4. File sizes and generation times
        5. Recommendations for optimal format selection

        Output report in Markdown with:
        - All 4 formats included
        - Tables for comparison
        - Code blocks for examples
        - Performance statistics

        Return comprehensive report.

    output:
      save_to: multi_format_report
      format: markdown
      file_output:
        enabled: true
        path: /workspace/output/multi-format-report.md

  step_6_validate_outputs:
    name: "Validate All Outputs"
    type: agent
    model: "${models.output_manager}"

    input:
      prompt: |
        Validate all generated outputs.

        Validation tasks:
        1. JSON: parseable, valid schema
        2. YAML: parseable, valid syntax
        3. Text: readable, no corruption
        4. Markdown: valid syntax, proper formatting
        5. File integrity: no truncation, correct encoding

        Validation checks:
        - JSON: use python -m json.tool to validate
        - YAML: use python -m yaml or yamllint
        - Text: check encoding and line endings
        - Markdown: check headers and code blocks

        Return validation summary with pass/fail status for each.

    output:
      save_to: validation_results
      format: json
      file_output:
        enabled: true
        path: /workspace/output/output-validation.json
