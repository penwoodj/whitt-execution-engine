---
workflow_id: web_operations_url_params
name: Web Operations with Full URL Parameters
description: Demonstrates web_fetch, web_scrape, web_search with full URL parameters (headers, auth, timeout, SSL)

# ── MODEL CONFIGURATION ────────────────────────────────
models:
  
  # ── GLOBAL CONFIGURATION FILE ─────────────────────
  # global_config_path: ./workspace/model-config.yml  # Optional: centralized config file
  
  default_model_router: automatic  # automatic | manual | smart_routing
  
  # ── MODEL: PRIMARY MODEL ───────────────────────────────
  primary_model:
    name: primary  # Variable reference name
    
    host:
      type: lmstudio  # lmstudio | ollama | llama_cpp_with_vulkan
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 13%
        vram: 3.7GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 150000
        concurrent_requests: 2
      
      min_allowed:
        ram: 9%
        vram: 2.4GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 73500
      
      allocation_strategy: dynamic  # static | dynamic | adaptive
    
    model_memory:
      cache_size: min  # min | max | medium | medium-min | medium-max
      kv_cache_quantization: auto  # auto | q4_k_m | q4_0 | q5_k_m | q5_0 | q6_k | q8_0
      attention_context: auto  # auto | from_max_allowed
    
    execution:
      timeout:
        load_into_memory: 45s
        time_to_first_response: 1m
        total_time_to_response: 4h
      
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true
    
    hooks:
      # ── RUN LIFECYCLE ─────────────────────────
      on_create: {}
      on_run_start: {}
      on_run_complete: {}
      on_run_error: {}
      on_retry: {}
      
      # ── TURN LIFECYCLE ───────────────────────────
      on_turn_start: {}
      on_turn_complete: {}
      on_turn_error: {}
      on_thinking: {}
      
      # ── TOOL LIFECYCLE ───────────────────────────────
      on_tool_call: {}
      on_tool_start: {}
      on_tool_result: {}
      on_tool_error: {}
      
      # ── STREAMING LIFECYCLE ──────────────────────────
      on_stream_chunk: {}
      on_stream_complete: {}
  
  # ── MODEL: FALLBACK MODEL ────────────────────────────────
  fallback_model:
    name: jinaai_reader
    provider: ollama
    model: "jinaai/ReaderLM-v2"

# ── WORKFLOW EXECUTION STRATEGY ───────────────────────────
workflow_execution_strategy:
  
  # ── MODEL LIFECYCLE ────────────────────────────────
  load_unload: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
  
  # ── PROCESSING MODE ───────────────────────────────────
  processing: dynamic_parallelization  # serial | parallel | hybrid
  
  # ── PARALLELIZATION CONFIGURATION ─────────────────────────
  parallel:
    enabled: true
    algorithm: priority_queue  # round_robin | priority_queue | shortest_job_first | longest_job_first
    
    load_balancing:
      strategy: least_loaded  # random | least_loaded | ip_hash
      worker_selection_timeout_secs: 10
    
    max_threads: 4
    max_models: 3
    max_concurrent_requests: 2
    max_steps: 2
    max_sub_agents: 3
  
  # ── MEMORY MANAGEMENT ─────────────────────────────────────
  memory:
    allocation:
      strategy: dynamic
      max_allowed:
        ram: 12288MB
        vram: 12288MB
        cpu: 100%
        gpu: 100%
        attention_tokens: 150000
        concurrent_requests: 3
    
    model_lifecycle:
      load_unload_strategy: one_at_a_time
      cache_size: min
      swap_timeout_secs: 30
      unload_unused: true
    
    pressure_handling:
      strategy: throttle  # throttle | swap | fail_fast | graceful_degradation
      memory_threshold_percent: 85
      throttle_factor: 0.5
      on_oom: swap
  
  # ── TIMEOUT MANAGEMENT ───────────────────────────────────
  timeout:
    total: 4h
    tool_call: 30m
    step: 8m
    operation_timeout_secs: 30
    sub_workflow_timeout_secs: 300
    time_to_first_result_secs: 120
    timeout_strategy: continue_with_partial  # fail | continue_with_partial | retry
    
    model:
      load_into_memory: 45s
      time_to_processing_after_loaded: 10000ms
      time_to_processing: 2h
      time_to_responding: 1m
      time_to_response: 4h
  
  # ── ERROR HANDLING ────────────────────────────────────────
  error_handling:
    default_action: retry  # retry | retry_critical_path | skip | fail_workflow
    max_retries_per_step: 3
    retry_backoff_multiplier: 2.0
    escalate_to_model_after: 3

# ── WORKFLOW VARIABLES ────────────────────────────────────
workflow:
  codebase_path: /workspace
  output_path: /workspace/output
  checkpoint_path: /workspace/checkpoints
  state_path: /workspace/state
  logs_path: /workspace/logs
  github_token: ${workflow.github_token}

# ── LOGGING CONFIGURATION ────────────────────────────────────
logging:
  
  # ── LOG LEVELS ────────────────────────────────────────
  level: debug  # debug | info | warning | error | trace
  
  # ── LOG DETAIL ────────────────────────────────────────
  detail: high  # low | medium | high | verbose
  
  # ── OUTPUT DESTINATIONS ──────────────────────────────────
  output_destinations:
    chat_file:
      enabled: true
      path: "${workflow.output_path}/web-operations-workflow.md"
      format: markdown
    
    json_file:
      enabled: true
      path: "${workflow.output_path}/logs/execution.json"
      format: json
    
    console:
      enabled: true
      include_timestamps: true
  
  # ── ERROR LOGGING ────────────────────────────────────────
  error_logging:
    enabled: true
    separate_file: true
    path: "${workflow.output_path}/logs/errors.json"
    include_stack_trace: true
    include_context: true
  
  # ── SCOPES FOR LOGGING ───────────────────────────────────
  scopes:
    execution:
      level: trace
      detail: maximum
    
    web_operations:
      level: debug
      detail: high
    
    tool:
      level: debug
      detail: medium

# ── TOOL PERMISSIONS ────────────────────────────────────────
tool_permissions:
  
  # ── FILE OPERATIONS ────────────────────────────────────────
  file_operations:
    read:
      enabled: true
      require_confirmation: false
      allowed_paths:
        - /workspace/input
        - /workspace/config
      allowed_patterns:
        - "*.md"
        - "*.txt"
      forbidden_paths:
        - /workspace/output
        - /workspace/checkpoints
      max_file_size_mb: 50
    
    write:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/output
        - /workspace/checkpoints
      allowed_patterns:
        - "*.json"
        - "*.md"
      forbidden_paths:
        - /workspace/src
        - /workspace/tests
      max_file_size_mb: 500
      backup_existing: true
      create_parent_directories: true
  
  # ── WEB OPERATIONS ────────────────────────────────────────
  web_operations:
    fetch:
      enabled: true
      require_confirmation: false
      max_concurrent_requests: 5
      timeout_secs:  30
      allowed_domains:
        - api.github.com
        - docs.rs
      forbidden_domains:
        - "*.local"
      follow_redirects: true
      validate_ssl: true
      authentication:
        type: bearer_token
        token: "${workflow.github_token}"
  
    scrape:
      enabled: true
      require_confirmation: false
      respect_robots_txt: true
      max_pages_per_domain: 100
      follow_links:
        enabled: false
        max_depth: 2
  
    search:
      enabled: false  # web_search is separate

# ── PIPELINE DEFINITION ────────────────────────────────────
pipeline:
  
  # ── STEP 1: Fetch API with URL Parameters ───────────────
  step_1_fetch_with_url_params:
    name: Fetch API with URL Parameters
    description: Fetch data from GitHub API with full URL parameters
    
    model: "${models.primary_model}"
    
    input:
      prompt: |
        Fetch data from GitHub API:
        
        URL: https://api.github.com/repos/rust-lang/rust
        Method: GET
        
        Full URL Parameters:
        - Headers:
            User-Agent: "YAML-Transpiler/1.0"
            Accept: "application/vnd.github.v3+json"
        - Authentication:
            Type: bearer_token
            Token: ${workflow.github_token}
        - Timeout: 30s
        - Follow Redirects: true
        - Validate SSL: true
        - Allow insecure: false
        
        Fetch all releases from the repository.
      
      variables:
        api_url: "https://api.github.com/repos/rust-lang/rust"
        user_agent: "${workflow.input.user_agent}"
        github_token: "${workflow.github_token}"
    
    output:
      save_to: api_data
      format: json
      fields:
        - repository
        - releases
        - contributors
        - stars
      
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  # ── STEP 2: Scrape Documentation ────────────────────────
  step_2_scrape_documentation:
    name: Scrape Documentation
    description: Scrape documentation pages
    
    model: "${models.primary_model}"
    
    input:
      prompt: |
        Scrape documentation from Rust docs:
        
        Target: https://docs.rs/tokio/
        
        Scrape Configuration:
        - Follow Links: false
        - Max Depth: 2
        - Respect Robots: true
        - Validate HTML: true
        - Extract Text: true
        - Extract Links: false
        - Extract Images: false
        
        Extract these sections:
        - Module documentation (tokio::*)
        - Function documentation (all fn*)
        - Type documentation (structs, enums, consts)
        - Trait bounds (Send, Sync, Clone, Copy)
        - Error type docs (Result, Error, Option)
      
      variables:
        docs_url: "https://docs.rs/tokio/"
    
    output:
      save_to: scraped_docs
      format: json
      fields:
        - modules
        - functions
        - types
        - traits
        - error_types
        - documentation_content
      
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff_strategy: exponential

  # ── STEP 3: Search Rust Documentation ────────────────
  step_3_search_rust_docs:
    name: Search Rust Documentation
    description: Search for specific Rust documentation
    
    model: "${models.primary_model}"
    
    input:
      prompt: |
        Search Rust documentation for:
        ${step.step_2_scrape_documentation.output.documentation_content}
        
        Search query: ${workflow.input.search_query}
      
      variables:
        docs_content: "${step.step_2_scrape_documentation.output.documentation_content}"
        search_query: "${workflow.input.search_query}"
    
    output:
      save_to: search_results
      format: json
      fields:
        - matching_docs
        - sections
        - functions
        - types
      console:
        enabled: true

# ── FEATURES DEMONSTRATED ────────────────────────────────────
features_demonstrated:
  - web_operations_with_url_parameters
  - web_fetch_full_config
  - web_scrape_configuration
  - web_authentication
  - web_ssl_validation
  - web_timeout_management
  - web_follow_redirects
  - web_robots_txt_respect
  - web_max_depth
  - concurrent_requests_limit
  - file_operations_permissions
  - logging_configuration
  - tool_permissions
  - retry_logic
  - timeout_management
  - memory_management
  - workflow_execution_strategy
