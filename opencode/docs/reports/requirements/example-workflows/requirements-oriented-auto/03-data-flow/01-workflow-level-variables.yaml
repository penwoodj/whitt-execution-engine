---
# Workflow: Workflow-Level Variables and Interpolation
# Category: Data Flow
# Focus: Variable declaration, interpolation syntax, hardcoded_values, user_inputs integration
#
# This workflow demonstrates:
# - Workflow-level variable definitions using hardcoded_values
# - Variable interpolation syntax {{workflow.var}} and ${workflow.var}
# - User inputs for runtime variable customization
# - Multi-step data processing with shared configuration
# - Variable scopes and default values
# - Type hints for variables

workflow_id: workflow_level_variables_demo
name: Workflow-Level Variables and Interpolation Demo
description: |
  Demonstrates comprehensive workflow-level variable management including declaration,
  interpolation, user inputs, and shared configuration across multi-step data processing.
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - data-flow
  - variables
  - interpolation
  - configuration
  - user-inputs

models:
  primary_processor:
    name: "Primary Data Processor"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
        connection_timeout_secs: 30
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan
    execution:
      timeout:
        time_to_first_response: 10s
        total_time_to_response: 60s
      max_turns: 5
    thinking:
      budget_tokens: 2048
      capture_in_output: true

  validator:
    name: "Quality Validator"
    host:
      type: ollama
      connection_settings:
        base_url: "http://localhost:11434"
        timeout_secs: 60
    generative_entity: "llama3.2"

  aggregator:
    name: "Result Aggregator"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: one_at_a_time
  processing: serial
  timeout:
    total: 30m
  error_handling:
    default_action:
      type: retry
      reason: "Transient failure, attempt automatic recovery"
    retry:
      max_attempts_per_step: 3
      backoff_strategy:
        type: exponential
        base_delay_ms: 1000
        max_delay_ms: 30000
        jitter_factor: 0.2

logging:
  enabled: true
  levels:
    default: info
    workflow: debug
    pipeline: debug
    models: info
    tools: debug
    execution: debug
  scopes:
    workflow:
      enabled: true
      include_timestamps: true
      include_execution_id: true
    pipeline:
      enabled: true
      include_step_transitions: true
    tools:
      enabled: true
      include_tool_calls: true
      include_tool_results: true
  output:
    console:
      enabled: true
      color: true
      timestamps: true
      format: text
    file:
      enabled: true
      path: /workspace/logs/workflow_variables.log
      format: json

user_inputs:
  execution_mode: interactive
  workflow_level:
    ask_at_start: true
    inputs:
      - id: data_source_path
        type: text_line
        label: "Data Source Path"
        placeholder: "/workspace/data/raw"
        default_value: "/workspace/data/raw"
        validation:
          required: true
          pattern: "^/.+"
          error_message: "Must be an absolute path"

      - id: processing_mode
        type: select
        label: "Processing Mode"
        options:
          - value: full
            label: "Full Processing"
            description: "Process all data with full analysis"
          - value: incremental
            label: "Incremental Processing"
            description: "Process only new or changed data"
          - value: sampling
            label: "Sampling Mode"
            description: "Process representative sample"
        default_value: full
        required: true

      - id: data_types
        type: multi_select
        label: "Data Types to Process"
        options:
          - value: transactions
            label: "Transactions"
          - value: events
            label: "Events"
          - value: logs
            label: "Logs"
          - value: metrics
            label: "Metrics"
          - value: audit
            label: "Audit Records"
        default_value:
          - transactions
          - events
        required: true

      - id: confirm_start
        type: confirm
        label: "Start Data Processing"
        message: "Ready to process data with the specified configuration"
        required: true
        keyboard_shortcut: Enter

  step_level:
    ask_at_step_start: true
    inputs_by_step:
      step_3_quality_validation:
        - id: validation_threshold_override
          type: text_line
          label: "Custom Validation Threshold"
          placeholder: "Leave empty for default (0.85)"
          default_value: ""

        - id: skip_validation
          type: confirm
          label: "Skip Quality Validation"
          message: "Skip validation step for faster processing?"
          required: true

agentic_workflow:
  hardcoded_values:
    config:
      version: "1.0"
      environment: "production"
      timezone: "UTC"
    processing:
      batch_size: 100
      max_retries: 3
      timeout_seconds: 300
      parallel_workers: 4
    quality:
      min_confidence: 0.85
      min_completeness: 0.90
      max_error_rate: 0.05
    output:
      format: json
      compression: true
      include_metadata: true
      destination_path: "/workspace/output/processed"
    schemas:
      transactions:
        required_fields:
          - id
          - timestamp
          - amount
          - currency
        optional_fields:
          - category
          - tags
          - notes
      events:
        required_fields:
          - event_id
          - event_type
          - timestamp
        optional_fields:
          - source
          - metadata
    datetime_formats:
      iso8601: "%Y-%m-%dT%H:%M:%SZ"
      date_only: "%Y-%m-%d"
      time_only: "%H:%M:%S"
    column_mappings:
      source_a:
        id: "record_id"
        timestamp: "created_at"
        value: "amount_usd"
      source_b:
        id: "transactionId"
        timestamp: "eventTime"
        value: "value"

  steps:
    step_1_initialize:
      name: "Initialize Data Pipeline"
      description: |
        Initialize the data processing pipeline with configuration from workflow
        variables. Sets up context for subsequent processing steps.
      type: agent
      generative_entity: "${models.primary_processor}"
      prompt: |
        Initialize a data processing pipeline with the following configuration:

        Configuration:
          Version: {{workflow.config.version}}
          Environment: {{workflow.config.environment}}
          Timezone: {{workflow.config.timezone}}

        Processing Settings:
          Batch Size: {{workflow.processing.batch_size}}
          Max Retries: {{workflow.processing.max_retries}}
          Timeout: {{workflow.processing.timeout_seconds}} seconds
          Parallel Workers: {{workflow.processing.parallel_workers}}

        User Inputs:
          Data Source: {{user_inputs.data_source_path}}
          Processing Mode: {{user_inputs.processing_mode}}
          Data Types: {{user_inputs.data_types}}

        Initialize the pipeline by:
        1. Validating the data source path exists
        2. Setting up batch processing configuration
        3. Configuring parallel workers
        4. Initializing output destination at {{workflow.output.destination_path}}

        Return a JSON object with:
        - pipeline_id: unique identifier for this run
        - initialized_components: list of initialized components
        - config_summary: human-readable configuration summary
        - status: "initialized" or "error"
        - errors: any initialization errors (if any)

      input_variables:
        workflow_version: "{{workflow.config.version}}"
        workflow_env: "{{workflow.config.environment}}"
        batch_size: "{{workflow.processing.batch_size}}"
        max_retries: "{{workflow.processing.max_retries}}"
        user_data_source: "{{user_inputs.data_source_path}}"
        user_processing_mode: "{{user_inputs.processing_mode}}"
        user_data_types: "{{user_inputs.data_types}}"
        output_path: "{{workflow.output.destination_path}}"

      context:
        include_previous_outputs: false
        include_system_context: true
        include_tool_results: false

      output:
        save_to: pipeline_initialization
        format: json
        fields:
          - pipeline_id
          - initialized_components
          - config_summary
          - status
          - errors
        file_output:
          enabled: true
          path: "/workspace/output/pipeline_init.json"
          format: json
        console:
          enabled: true
          prefix: "[Init] "

    step_2_load_data:
      name: "Load and Validate Data Sources"
      description: |
        Load data from the configured source path and validate against
        the schema definitions from workflow variables.
      type: agent
      generative_entity: "${models.primary_processor}"
      prompt: |
        Load data from {{user_inputs.data_source_path}} and validate against schemas.

        Schema Definitions:
        Transactions Schema:
          Required: {{workflow.schemas.transactions.required_fields}}
          Optional: {{workflow.schemas.transactions.optional_fields}}

        Events Schema:
          Required: {{workflow.schemas.events.required_fields}}
          Optional: {{workflow.schemas.events.optional_fields}}

        Column Mappings (Source A):
          {{workflow.column_mappings.source_a}}

        Column Mappings (Source B):
          {{workflow.column_mappings.source_b}}

        Processing Mode: {{user_inputs.processing_mode}}
        Data Types to Process: {{user_inputs.data_types}}

        Pipeline Context from Step 1:
        {{step.step_1_initialize.output}}

        Tasks:
        1. Scan data source directory
        2. Load files matching the specified data types
        3. Apply column mappings to standardize field names
        4. Validate each record against its schema
        5. Report validation results

        Return JSON with:
        - loaded_records: count of successfully loaded records
        - validation_errors: list of records that failed validation
        - schema_compliance: percentage of records meeting schema requirements
        - data_summary: breakdown by data type
        - status: "success" or "partial" or "error"

      input_variables:
        pipeline_id: "${step.step_1_initialize.output.pipeline_id}"
        data_source: "{{user_inputs.data_source_path}}"
        data_types: "{{user_inputs.data_types}}"
        processing_mode: "{{user_inputs.processing_mode}}"
        transactions_schema_required: "{{workflow.schemas.transactions.required_fields}}"
        events_schema_required: "{{workflow.schemas.events.required_fields}}"
        source_a_mappings: "{{workflow.column_mappings.source_a}}"
        source_b_mappings: "{{workflow.column_mappings.source_b}}"

      context:
        include_previous_outputs: true
        include_system_context: true
        include_tool_results: true

      file_operations:
        - operation: read
          file_path: "${user_inputs.data_source_path}/transactions.csv"
          format: csv
        - operation: read
          file_path: "${user_inputs.data_source_path}/events.json"
          format: json
        - operation: write
          file_path: "/workspace/output/loaded_data_summary.json"
          format: json

      output:
        save_to: data_loading
        format: json
        fields:
          - loaded_records
          - validation_errors
          - schema_compliance
          - data_summary
          - status
        file_output:
          enabled: true
          path: "/workspace/output/data_loading.json"
          format: json

    step_3_quality_validation:
      name: "Quality Validation"
      description: |
        Performs comprehensive quality validation using workflow-defined
        thresholds and user-provided overrides.
      type: agent
      generative_entity: "${models.validator}"
      prompt: |
        Perform quality validation on the loaded data.

        Quality Thresholds (from workflow variables):
          Minimum Confidence: {{workflow.quality.min_confidence}}
          Minimum Completeness: {{workflow.quality.min_completeness}}
          Maximum Error Rate: {{workflow.quality.max_error_rate}}

        User Override for Threshold: {{user_inputs.validation_threshold_override}}
        Skip Validation: {{user_inputs.skip_validation}}

        Data from Previous Step:
        {{step.step_2_load_data.output}}

        Validation Checks:
        1. Check completeness (no missing required fields)
        2. Check consistency (values within expected ranges)
        3. Check uniqueness (no duplicate IDs where required)
        4. Check temporal consistency (timestamps logical)
        5. Check referential integrity (foreign keys valid)

        Apply thresholds:
        - If validation_threshold_override is provided, use that instead
        - Otherwise use workflow.quality values

        Return JSON:
        - quality_score: overall quality score (0-1)
        - checks_passed: list of validation checks that passed
        - checks_failed: list of validation checks that failed
        - error_rate: percentage of records with errors
        - completeness_score: percentage of complete records
        - recommendations: suggested improvements if quality is below threshold
        - status: "pass", "warning", or "fail"

      input_variables:
        pipeline_id: "${step.step_1_initialize.output.pipeline_id}"
        loaded_data: "${step.step_2_load_data.output}"
        threshold_override: "{{user_inputs.validation_threshold_override}}"
        skip_validation: "{{user_inputs.skip_validation}}"
        min_confidence: "{{workflow.quality.min_confidence}}"
        min_completeness: "{{workflow.quality.min_completeness}}"
        max_error_rate: "{{workflow.quality.max_error_rate}}"

      context:
        include_previous_outputs: true
        include_system_context: true
        include_tool_results: false

      output:
        save_to: quality_validation
        format: json
        fields:
          - quality_score
          - checks_passed
          - checks_failed
          - error_rate
          - completeness_score
          - recommendations
          - status
        file_output:
          enabled: true
          path: "/workspace/output/quality_validation.json"
          format: json

    step_4_transform:
      name: "Transform Data"
      description: |
        Applies data transformations based on the selected processing mode
        and workflow configuration.
      type: agent
      generative_entity: "${models.primary_processor}"
      prompt: |
        Transform the validated data based on processing mode.

        Processing Configuration:
          Batch Size: {{workflow.processing.batch_size}}
          Parallel Workers: {{workflow.processing.parallel_workers}}
          Timeout: {{workflow.processing.timeout_seconds}}s

        Processing Mode: {{user_inputs.processing_mode}}
        Output Format: {{workflow.output.format}}
        Include Metadata: {{workflow.output.include_metadata}}

        Data to Transform:
        {{step.step_2_load_data.output}}

        Quality Results:
        {{step.step_3_quality_validation.output}}

        Transformation Tasks:
        1. Normalize data formats (dates, numbers, strings)
        2. Apply business rules for data enrichment
        3. Calculate derived fields
        4. Filter records based on quality validation
        5. Aggregate data if sampling mode selected

        Return JSON:
        - transformed_records: count of transformed records
        - records_filtered: count of records filtered due to quality
        - transformations_applied: list of transformations performed
        - enriched_fields: new fields added during enrichment
        - aggregated_data: aggregated results if applicable
        - status: "success" or "error"

      input_variables:
        pipeline_id: "${step.step_1_initialize.output.pipeline_id}"
        quality_results: "${step.step_3_quality_validation.output}"
        batch_size: "{{workflow.processing.batch_size}}"
        processing_mode: "{{user_inputs.processing_mode}}"
        output_format: "{{workflow.output.format}}"

      context:
        include_previous_outputs: true
        include_system_context: false
        include_tool_results: true

      output:
        save_to: transformed_data
        format: json
        fields:
          - transformed_records
          - records_filtered
          - transformations_applied
          - enriched_fields
          - aggregated_data
          - status
        file_output:
          enabled: true
          path: "/workspace/output/transformed_data.json"
          format: json

    step_5_aggregate:
      name: "Aggregate Results"
      description: |
        Aggregates all step outputs and generates comprehensive final report.
      type: agent
      generative_entity: "${models.aggregator}"
      prompt: |
        Aggregate all processing results and generate final report.

        Workflow Summary:
          Version: {{workflow.config.version}}
          Environment: {{workflow.config.environment}}

        Output Configuration:
          Destination: {{workflow.output.destination_path}}
          Format: {{workflow.output.format}}
          Compression: {{workflow.output.compression}}
          Include Metadata: {{workflow.output.include_metadata}}

        Step Outputs:
        1. Pipeline Initialization:
        {{step.step_1_initialize.output}}

        2. Data Loading:
        {{step.step_2_load_data.output}}

        3. Quality Validation:
        {{step.step_3_quality_validation.output}}

        4. Data Transformation:
        {{step.step_4_transform.output}}

        Generate a comprehensive report with:
        - execution_summary: overview of the entire pipeline run
        - metrics: key performance and quality metrics
        - recommendations: actionable insights from the processing
        - output_location: where processed data was written
        - status: overall pipeline status

        Return as JSON matching the output schema.

      input_variables:
        workflow_version: "{{workflow.config.version}}"
        workflow_env: "{{workflow.config.environment}}"
        output_path: "{{workflow.output.destination_path}}"
        output_format: "{{workflow.output.format}}"
        compression_enabled: "{{workflow.output.compression}}"

      context:
        include_previous_outputs: true
        include_system_context: true
        include_tool_results: true

      file_operations:
        - operation: write
          file_path: "/workspace/output/final_report.json"
          format: json
        - operation: write
          file_path: "/workspace/output/execution_summary.json"
          format: json

      output:
        save_to: final_report
        format: json
        fields:
          - execution_summary
          - metrics
          - recommendations
          - output_location
          - status
        file_output:
          enabled: true
          path: "/workspace/output/final_report.json"
          format: json
        console:
          enabled: true
          prefix: "[Final] "
          color: green

metrics:
  enabled: true
  collection:
    pipeline_level:
      - total_duration_secs
      - average_step_duration_secs
      - parallelism_efficiency
    step_level:
      - execution_time_secs
      - memory_peak_mb
      - records_processed
    model_level:
      - inference_time_ms
      - tokens_processed
  output:
    path: /workspace/metrics/workflow_variables_metrics.json
    format: json

validation:
  workflow_schema:
    enabled: true
    required_fields:
      - workflow_id
      - name
      - models
  step_outputs:
    enabled: true
    validate_format: json
