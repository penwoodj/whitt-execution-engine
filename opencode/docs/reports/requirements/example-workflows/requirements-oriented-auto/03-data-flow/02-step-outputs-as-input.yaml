---
# Workflow: Step Outputs as Inputs
# Category: Data Flow
# Focus: Step output interpolation, output chaining, multi-step data flow
#
# This workflow demonstrates:
# - Step 1 produces output that becomes input for subsequent steps
# - Step 2 references Step 1's output via ${step.step_1_name.output} interpolation
# - Step 3 references outputs from both Step 1 and Step 2 (chaining)
# - Step 4 transforms/combines outputs from multiple previous steps
# - Step 5 aggregates all previous step outputs into final result
# - Context control with include_previous_outputs flag
# - File operations using step output interpolation

workflow_id: step_outputs_as_input_demo
name: Step Outputs as Input Demo
description: |
  Demonstrates comprehensive step output interpolation where each step's output
  serves as input for subsequent steps. Shows chaining, transformation, and
  aggregation patterns for multi-step data processing pipelines.
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - data-flow
  - step-outputs
  - interpolation
  - chaining
  - aggregation

models:
  data_extractor:
    name: "Data Extraction Agent"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
        connection_timeout_secs: 30
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan
    execution:
      timeout:
        time_to_first_response: 10s
        # Fast first response time for quick data extraction
        total_time_to_response: 60s
        # Total timeout prevents long-running extraction from blocking pipeline
      max_turns: 5
      thinking:
        budget_tokens: 2048
        # Token budget limits extraction complexity and cost
        capture_in_output: true

  data_processor:
    name: "Data Processing Agent"
    host:
      type: ollama
      connection_settings:
        base_url: "http://localhost:11434"
        timeout_secs: 60
    generative_entity: "llama3.2"

  result_aggregator:
    name: "Result Aggregation Agent"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: one_at_a_time
  processing: serial
  timeout:
    total: 30m
  error_handling:
    default_action:
      type: retry
      reason: "Transient failure, attempt automatic recovery"
    retry:
      max_attempts_per_step: 3
      backoff_strategy:
        type: exponential
        base_delay_ms: 1000
        max_delay_ms: 30000
        jitter_factor: 0.2

logging:
  levels:
    default: info
    workflow: debug
    agentic_workflow: debug
    models: info
    tools: debug
    execution: debug
  scopes:
    workflow:
      include_timestamps: true
      include_execution_id: true
    agentic_workflow:
      include_step_transitions: true
    tools:
      include_tool_calls: true
      include_tool_results: true
  output:
    console:
      color: true
      timestamps: true
      format: text
    file:
      path: ./workspace/logs/step_outputs_workflow.log
      format: json

user_inputs:
  execution_mode: interactive
  workflow_level:
    ask_at_start: true
    inputs:
      - id: source_directory
        type: text_line
        label: "Source Directory"
        placeholder: "./workspace/data/input"
        default_value: "./workspace/data/input"
        validation:
          required: true
          pattern: "^/.+"
          error_message: "Must be an absolute path"

      - id: analysis_depth
        type: select
        label: "Analysis Depth"
        options:
          - value: shallow
            label: "Shallow Analysis"
            description: "Quick overview with basic metrics"
          - value: medium
            label: "Medium Analysis"
            description: "Balanced analysis with moderate detail"
          - value: deep
            label: "Deep Analysis"
            description: "Comprehensive analysis with full details"
        default_value: medium
        required: true

      - id: output_format
        type: select
        label: "Output Format"
        options:
          - value: json
            label: "JSON"
          - value: yaml
            label: "YAML"
          - value: markdown
            label: "Markdown"
        default_value: json
        required: true

  step_level:
    ask_at_step_start: false

agentic_workflow:
  hardcoded_values:
    config:
      max_file_size_mb: 100
      supported_formats:
        - json
        - csv
        - xml
      encoding: "utf-8"
    processing:
      chunk_size: 1000
      max_retries: 3
      timeout_seconds: 300
    output:
      base_path: "./workspace/output"
      include_metadata: true
      compress_results: false

  steps:
    step_1_extract_data:
      name: "Extract Data from Source"
      description: |
        Initial data extraction step that reads from the source directory
        and produces structured output that will be used by all subsequent steps.
      type: agent
      generative_entity: "${models.data_extractor}"
      prompt: |
        Extract data from the source directory and prepare it for processing.

        Source Directory: {{user_inputs.source_directory}}
        Supported Formats: {{workflow.config.supported_formats}}
        Max File Size: {{workflow.config.max_file_size_mb}} MB

        Tasks:
        1. Scan the source directory for files
        2. Identify file formats (json, csv, xml)
        3. Extract content from each file
        4. Create a structured inventory of all data found

        Return JSON with:
        - extraction_id: unique identifier for this extraction
        - source_path: the source directory path
        - files_found: list of files discovered
        - file_count: total number of files
        - total_size_bytes: total size of all files
        - formats_detected: list of unique formats found
        - extraction_timestamp: when extraction occurred
        - status: "success" or "error"
        - errors: any extraction errors (if any)

      inputs:
        source_directory: "{{user_inputs.source_directory}}"
        supported_formats: "{{workflow.config.supported_formats}}"
        max_file_size: "{{workflow.config.max_file_size_mb}}"

      context:
        include_previous_outputs: false
        include_system_context: true
        include_tool_results: true

      file_operations:
        - operation: read
          file_path: "${user_inputs.source_directory}/manifest.json"
          format: json
        - operation: write
          file_path: "./workspace/output/extraction_results.json"
          format: json

      output:
        save_to: extraction_output
        format: json
        fields:
          - extraction_id
          - source_path
          - files_found
          - file_count
          - total_size_bytes
          - formats_detected
          - extraction_timestamp
          - status
          - errors
        file_output:
          path: "./workspace/output/step_1_extraction.json"
          format: json
        console:
          prefix: "[Extract] "

    step_2_analyze_data:
      name: "Analyze Extracted Data"
      description: |
        Analyzes the data extracted in Step 1 using the extraction output
        as input. Demonstrates single step output reference.
      type: agent
      generative_entity: "${models.data_processor}"
      prompt: |
        Analyze the data that was extracted in the previous step.

        Data from Step 1 (Extraction):
        {{step.step_1_extract_data.output}}

        Analysis Depth: {{user_inputs.analysis_depth}}

        Perform analysis based on the extraction results:
        1. Categorize files by format
        2. Identify potential data quality issues
        3. Calculate preliminary statistics
        4. Generate analysis summary

        Return JSON with:
        - analysis_id: unique identifier for this analysis
        - extraction_id: ${step.step_1_extract_data.output.extraction_id}
        - files_by_format: breakdown of files by their format
        - quality_issues: list of identified quality concerns
        - statistics:
            total_records: estimated total records
            avg_file_size: average file size
            largest_file: path to largest file
            smallest_file: path to smallest file
        - analysis_depth: the depth of analysis performed
        - recommendations: suggested next steps
        - status: "success" or "warning" or "error"

      inputs:
        extraction_data: "${step.step_1_extract_data.output}"
        extraction_id: "${step.step_1_extract_data.output.extraction_id}"
        source_path: "${step.step_1_extract_data.output.source_path}"
        file_count: "${step.step_1_extract_data.output.file_count}"
        files_found: "${step.step_1_extract_data.output.files_found}"
        analysis_depth: "{{user_inputs.analysis_depth}}"

      context:
        include_previous_outputs: true
        include_system_context: true
        include_tool_results: false

      output:
        save_to: analysis_output
        format: json
        fields:
          - analysis_id
          - extraction_id
          - files_by_format
          - quality_issues
          - statistics
          - analysis_depth
          - recommendations
          - status
        file_output:
          path: "./workspace/output/step_2_analysis.json"
          format: json
        console:
          prefix: "[Analyze] "

    step_3_validate_data:
      name: "Validate Data Quality"
      description: |
        Validates data quality using outputs from both Step 1 (extraction)
        and Step 2 (analysis). Demonstrates chaining multiple step outputs.
      type: agent
      generative_entity: "${models.data_processor}"
      prompt: |
        Perform data quality validation using extraction and analysis results.

        Extraction Output (Step 1):
        {{step.step_1_extract_data.output}}

        Analysis Output (Step 2):
        {{step.step_2_analyze_data.output}}

        Validation Tasks:
        1. Cross-reference extraction file list with analysis statistics
        2. Verify all files were successfully analyzed
        3. Check for data consistency between extraction and analysis
        4. Validate quality issue detection was thorough

        Return JSON with:
        - validation_id: unique identifier for this validation
        - extraction_id: ${step.step_1_extract_data.output.extraction_id}
        - analysis_id: ${step.step_2_analyze_data.output.analysis_id}
        - cross_check_results:
            files_matched: whether file counts match
            statistics_consistent: whether stats are consistent
            issues_addressed: whether all quality issues were addressed
        - validation_score: overall validation score (0-1)
        - validation_checks: list of individual checks performed
        - passed_checks: count of passed checks
        - failed_checks: count of failed checks
        - status: "pass" or "warning" or "fail"

      inputs:
        extraction_data: "${step.step_1_extract_data.output}"
        extraction_id: "${step.step_1_extract_data.output.extraction_id}"
        analysis_data: "${step.step_2_analyze_data.output}"
        analysis_id: "${step.step_2_analyze_data.output.analysis_id}"
        quality_issues: "${step.step_2_analyze_data.output.quality_issues}"
        statistics: "${step.step_2_analyze_data.output.statistics}"

      context:
        include_previous_outputs: true
        include_system_context: false
        include_tool_results: true

      file_operations:
        - operation: read
          file_path: "./workspace/output/step_1_extraction.json"
          format: json
        - operation: read
          file_path: "./workspace/output/step_2_analysis.json"
          format: json
        - operation: write
          file_path: "./workspace/output/step_3_validation.json"
          format: json

      output:
        save_to: validation_output
        format: json
        fields:
          - validation_id
          - extraction_id
          - analysis_id
          - cross_check_results
          - validation_score
          - validation_checks
          - passed_checks
          - failed_checks
          - status
        file_output:
          path: "./workspace/output/step_3_validation.json"
          format: json

    step_4_transform_data:
      name: "Transform and Enrich Data"
      description: |
        Transforms and enriches data by combining outputs from Steps 1, 2, and 3.
        Demonstrates multi-step output aggregation and transformation.
      type: agent
      generative_entity: "${models.data_processor}"
      prompt: |
        Transform and enrich data using all previous step outputs.

        Step 1 - Extraction Output:
        {{step.step_1_extract_data.output}}

        Step 2 - Analysis Output:
        {{step.step_2_analyze_data.output}}

        Step 3 - Validation Output:
        {{step.step_3_validate_data.output}}

        Output Format: {{user_inputs.output_format}}
        Base Output Path: {{workflow.output.base_path}}

        Transformation Tasks:
        1. Combine extraction, analysis, and validation results
        2. Apply transformations based on validation feedback
        3. Enrich data with computed metrics
        4. Format output according to user preference

        Return JSON with:
        - transform_id: unique identifier for this transformation
        - extraction_id: ${step.step_1_extract_data.output.extraction_id}
        - analysis_id: ${step.step_2_analyze_data.output.analysis_id}
        - validation_id: ${step.step_3_validate_data.output.validation_id}
        - combined_data:
            source_files: ${step.step_1_extract_data.output.files_found}
            quality_metrics: ${step.step_2_analyze_data.output.statistics}
            validation_results: ${step.step_3_validate_data.output.cross_check_results}
        - transformations_applied: list of transformations performed
        - enriched_fields: new fields added during enrichment
        - output_format: format of the transformed data
        - status: "success" or "error"

      inputs:
        extraction_data: "${step.step_1_extract_data.output}"
        extraction_id: "${step.step_1_extract_data.output.extraction_id}"
        analysis_data: "${step.step_2_analyze_data.output}"
        analysis_id: "${step.step_2_analyze_data.output.analysis_id}"
        validation_data: "${step.step_3_validate_data.output}"
        validation_id: "${step.step_3_validate_data.output.validation_id}"
        validation_score: "${step.step_3_validate_data.output.validation_score}"
        output_format: "{{user_inputs.output_format}}"
        base_output_path: "{{workflow.output.base_path}}"

      context:
        include_previous_outputs: true
        include_system_context: true
        include_tool_results: true

      file_operations:
        - operation: write
          file_path: "./workspace/output/transformed_data.\${user_inputs.output_format}"
          format: "\${user_inputs.output_format}"

      output:
        save_to: transform_output
        format: json
        fields:
          - transform_id
          - extraction_id
          - analysis_id
          - validation_id
          - combined_data
          - transformations_applied
          - enriched_fields
          - output_format
          - status
        file_output:
          path: "./workspace/output/step_4_transform.json"
          format: json

    step_5_generate_report:
      name: "Generate Final Report"
      description: |
        Generates comprehensive final report by aggregating all previous step outputs.
        Demonstrates complete multi-step output aggregation and final synthesis.
      type: agent
      generative_entity: "${models.result_aggregator}"
      prompt: |
        Generate a comprehensive final report aggregating all step outputs.

        WORKFLOW EXECUTION SUMMARY:

        Step 1 - Data Extraction:
        {{step.step_1_extract_data.output}}

        Step 2 - Data Analysis:
        {{step.step_2_analyze_data.output}}

        Step 3 - Data Validation:
        {{step.step_3_validate_data.output}}

        Step 4 - Data Transformation:
        {{step.step_4_transform_data.output}}

        Output Configuration:
          Base Path: {{workflow.output.base_path}}
          Include Metadata: {{workflow.output.include_metadata}}
          Output Format: {{user_inputs.output_format}}

        Generate a comprehensive report with:
        1. Executive summary of the entire workflow
        2. Step-by-step breakdown with key metrics
        3. Data flow diagram (textual representation)
        4. Quality assessment summary
        5. Recommendations for future runs

        Return JSON with:
        - report_id: unique identifier for this report
        - workflow_execution:
            extraction_id: \${step.step_1_extract_data.output.extraction_id}
            analysis_id: \${step.step_2_analyze_data.output.analysis_id}
            validation_id: \${step.step_3_validate_data.output.validation_id}
            transform_id: \${step.step_4_transform_data.output.transform_id}
        - executive_summary: high-level overview
        - step_summaries:
            extraction: summary of extraction step
            analysis: summary of analysis step
            validation: summary of validation step
            transformation: summary of transformation step
        - data_flow:
            step_1_to_2: how extraction fed into analysis
            step_2_to_3: how analysis fed into validation
            step_1_2_3_to_4: how all previous steps fed into transformation
            all_to_5: how all steps aggregate into this report
        - quality_summary:
            extraction_status: \${step.step_1_extract_data.output.status}
            analysis_status: \${step.step_2_analyze_data.output.status}
            validation_status: \${step.step_3_validate_data.output.status}
            validation_score: \${step.step_3_validate_data.output.validation_score}
            transform_status: \${step.step_4_transform_data.output.status}
        - recommendations: actionable insights
        - output_location: where report was saved
        - status: "success" or "error"

      inputs:
        extraction_data: "\${step.step_1_extract_data.output}"
        extraction_id: "\${step.step_1_extract_data.output.extraction_id}"
        extraction_status: "\${step.step_1_extract_data.output.status}"
        analysis_data: "\${step.step_2_analyze_data.output}"
        analysis_id: "\${step.step_2_analyze_data.output.analysis_id}"
        analysis_status: "\${step.step_2_analyze_data.output.status}"
        validation_data: "\${step.step_3_validate_data.output}"
        validation_id: "\${step.step_3_validate_data.output.validation_id}"
        validation_status: "\${step.step_3_validate_data.output.status}"
        validation_score: "\${step.step_3_validate_data.output.validation_score}"
        transform_data: "\${step.step_4_transform_data.output}"
        transform_id: "\${step.step_4_transform_data.output.transform_id}"
        transform_status: "\${step.step_4_transform_data.output.status}"
        output_format: "{{user_inputs.output_format}}"
        base_path: "{{workflow.output.base_path}}"

      context:
        include_previous_outputs: true
        include_system_context: true
        include_tool_results: true

      file_operations:
        - operation: write
          file_path: "./workspace/output/final_report.\${user_inputs.output_format}"
          format: "\${user_inputs.output_format}"
        - operation: write
          file_path: "./workspace/output/execution_summary.json"
          format: json

      output:
        save_to: final_report
        format: json
        fields:
          - report_id
          - workflow_execution
          - executive_summary
          - step_summaries
          - data_flow
          - quality_summary
          - recommendations
          - output_location
          - status
        file_output:
          path: "./workspace/output/step_5_final_report.json"
          format: json
        console:
          prefix: "[Final] "
          color: green

metrics:
  collection:
    pipeline_level:
      - total_duration_secs
      - average_step_duration_secs
      - step_output_size_bytes
      - data_flow_efficiency
    step_level:
      - execution_time_secs
      - memory_peak_mb
      - output_size_bytes
      - inputs_count
    model_level:
      - inference_time_ms
      - tokens_processed
  output:
    path: ./workspace/metrics/step_outputs_metrics.json
    format: json

validation:
  workflow_schema:
    required_fields:
      - workflow_id
      - name
      - models
      - agentic_workflow
  step_outputs:
    validate_format: json
    validate_references:
      - check_step_output_interpolation: true
      - verify_previous_step_exists: true
      - ensure_field_in_output: true

