---
workflow_id: prompt_to_workflow_generator
name: Prompt to Workflow Generator
description: Meta-workflow that breaks down prompts into executable agentic workflows using policy sliders

# ── MODEL CONFIGURATION ────────────────────────────────
models:
  
  # ── GLOBAL CONFIGURATION FILE ─────────────────────
  # global_config_path: ./workspace/model-config.yml  # Optional: centralized config file
  
  default_model_router: automatic  # automatic | manual | smart_routing
  
  # ── MODEL: PRIMARY MODEL ─────────────────────────────
  primary_model:
    name: primary  # Variable reference name
    
    host:
      type: lmstudio  # lmstudio | ollama | llama_cpp_with_vulkan
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 13%
        vram: 3.7GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 150000
        concurrent_requests: 2
      
      min_allowed:
        ram: 9%
        vram: 2.4GB
        cpu: 49%
        gpu: 74%
        attention_tokens: 73500
      
      allocation_strategy: dynamic  # static | dynamic | adaptive
    
    model_memory:
      cache_size: max  # min | max | medium | medium-min | medium-max
      kv_cache_quantization: auto  # auto | q4_k_m | q4_0 | q5_k_m | q5_0 | q6_k | q8_0
      attention_context: auto  # auto | from_max_allowed
    
    execution:
      timeout:
        load_into_memory: 45s
        time_to_first_response: 1m
        total_time_to_response: 4h
      
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true
    
    hooks:
      # ── RUN LIFECYCLE ─────────────────────────
      on_create: {}
      on_run_start: {}
      on_run_complete: {}
      on_run_error: {}
      on_retry: {}
      
      # ── TURN LIFECYCLE ───────────────────────────
      on_turn_start: {}
      on_turn_complete: {}
      on_turn_error: {}
      on_thinking: {}
      
      # ── TOOL LIFECYCLE ─────────────────────────────
      on_tool_call: {}
      on_tool_start: {}
      on_tool_result: {}
      on_tool_error: {}
      
      # ── STREAMING LIFECYCLE ──────────────────────────
      on_stream_chunk: {}
      on_stream_complete: {}
  
  # ── MODEL: EMBEDDING MODEL ───────────────────────────────
  embedding_model:
    name: embedding  # Variable reference name
    
    host:
      type: ollama
      model: "jinaai/ReaderLM-v2"
      base_url: http://localhost:11434
    
    resource_limits:
      max_allowed:
        ram: 4GB
        vram: 4GB
        cpu: 50%
        gpu: 80%
        attention_tokens: 8192
        concurrent_requests: 3
      
      min_allowed:
        ram: 2GB
        vram: 2GB
        cpu: 30%
        gpu: 60%
        attention_tokens: 4096
        concurrent_requests: 1
      
      allocation_strategy: dynamic
    
    model_memory:
      cache_size: min
      kv_cache_quantization: auto
      attention_context: auto
    
    execution:
      timeout:
        load_into_memory: 10s
        time_to_first_response: 30s
        total_time_to_response: 2h
      
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true
    
    hooks:
      on_create: {}
      on_run_start: {}
      on_turn_start: {}
  
  # ── FALLBACK MODELS ────────────────────────────────────────
  fallback_models:
    - name: ibm_granite_granite
      provider: lmstudio
      model: "ibm-granite/granite-3.1.2b-instruct"
    
    - name: unsloth_llama_nemotron
      provider: lmstudio
      model: "unsloth/Llama-3.1-Nemotron-Nano-4B-v1.1"

# ── WORKFLOW EXECUTION STRATEGY ───────────────────────────
workflow_execution_strategy:
  
  # ── MODEL LIFECYCLE ────────────────────────────────
  load_unload: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
  
  # ── PROCESSING MODE ───────────────────────────────────
  processing: parallel  # serial | parallel | hybrid
  
  # ── PARALLELIZATION CONFIGURATION ─────────────────────────
  parallel:
    enabled: true
    algorithm: round_robin  # round_robin | priority_queue | shortest_job_first | longest_job_first
    
    load_balancing:
      strategy: least_loaded  # random | least_loaded | ip_hash
      worker_selection_timeout_secs: 10
    
    max_threads: 4
    max_models: 3
    max_concurrent_requests: 2
    max_steps: 2
    max_sub_agents: 3
  
  # ── MEMORY MANAGEMENT ─────────────────────────────────────
  memory:
    allocation:
      strategy: dynamic
      max_allowed:
        ram: 12288MB
        vram: 12288MB
        cpu: 100%
        gpu: 100%
        attention_tokens: 150000
        concurrent_requests: 3
    
    model_lifecycle:
      load_unload_strategy: one_at_a_time
      cache_size: min
      swap_timeout_secs: 30
      unload_unused: true
    
    pressure_handling:
      strategy: throttle  # throttle | swap | fail_fast | graceful_degradation
      memory_threshold_percent: 85
      throttle_factor: 0.5
      on_oom: swap
  
  # ── TIMEOUT MANAGEMENT ───────────────────────────────────
  timeout:
    total: 4h
    tool_call: 30m
    step: 8m
    operation_timeout_secs: 30
    sub_workflow_timeout_secs: 300
    time_to_first_result_secs: 120
    timeout_strategy: continue_with_partial  # fail | continue_with_partial | retry
    
    model:
      load_into_memory: 45s
      time_to_processing_after_loaded: 10000ms
      time_to_processing: 2h
      time_to_responding: 1m
      time_to_response: 4h
  
  # ── ERROR HANDLING ────────────────────────────────────────
  error_handling:
    default_action: retry  # retry | retry_critical_path | skip | fail_workflow
    max_retries_per_step: 3
    retry_backoff_multiplier: 2.0
    escalate_to_model_after: 3

# ── WORKFLOW VARIABLES ────────────────────────────────────
workflow:
  codebase_path: /workspace
  output_path: /workspace/output
  checkpoint_path: /workspace/checkpoints
  state_path: /workspace/state
  logs_path: /workspace/logs

# ── PIPELINE DEFINITION ────────────────────────────────────
pipeline:
  
  # ── STEP 1: Parse Input Prompt ─────────────────────
  step_1_parse_input_prompt:
    name: Parse Input Prompt
    description: Parse and validate the user's input prompt
    
    model: "${models.primary_model}"
    
    input:
      prompt: |
        Parse and validate the user's input prompt:
        
        ${workflow.input.prompt}
        
        Analyze for:
        1. Primary task or goal
        2. Required outputs (files, data structures, etc.)
        3. Complexity estimation
        4. Resource requirements
        
        Return structured JSON with:
        - task_type: string
        - requirements: array of strings
        - estimated_complexity: low|medium|high
        - suggested_execution_mode: serial|parallel|hybrid
        - resource_needs: object
      
      variables:
        prompt_text: "${workflow.input.prompt}"
    
    output:
      save_to: parsed_prompt
      format: json
      fields:
        - task_type
        - requirements
        - estimated_complexity
        - suggested_execution_mode
        - resource_needs
      console:
        enabled: false
    
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      base_delay_ms: 1000
  
  # ── STEP 2: Determine Execution Mode ─────────────────
  step_2_determine_execution_mode:
    name: Determine Execution Mode
    description: Select execution mode based on complexity and policy sliders
    
    model: "${models.primary_model}"
    
    input:
      prompt: |
        Based on this analysis:
        
        ${step.step_1_parse_input_prompt.output}
        
        And these policy slider settings:
        Runtime: ${workflow.input.policy_sliders.runtime.value}
        Review: ${workflow.input.policy_sliders.review.value}
        Rigor: ${workflow.input.policy_sliders.rigor.value}
        Scope: ${workflow.input.policy_sliders.scope.value}
        
        Determine the appropriate execution mode:
        - Serial: For high rigor, simple tasks
        - Parallel: For balanced efficiency, low-medium complexity
        - Hybrid: For complex tasks requiring both serial and parallel phases
        
        Return selected mode with reasoning.
      
      variables:
        parsed_analysis: "${step.step_1_parse_input_prompt.output}"
        policy_runtime: "${workflow.input.policy_sliders.runtime.value}"
        policy_review: "${workflow.input.policy_sliders.review.value}"
        policy_rigor: "${workflow.input.policy_sliders.rigor.value}"
        policy_scope: "${workflow.input.policy_sliders.scope.value}"
    
    output:
      save_to: execution_mode
      format: json
      fields:
        - selected_mode
        - reasoning
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff_strategy: exponential
  
  # ── STEP 3: Generate Workflow ────────────────────────
  step_3_generate_workflow:
    name: Generate Workflow
    description: Generate executable workflow YAML based on execution mode and analysis
    
    model: "${models.primary_model}"
    
    input:
      prompt: |
        Generate a complete, executable workflow YAML file:
        
        Analysis: ${step.step_2_determine_execution_mode.output}
        Execution Mode: ${step.step_2_determine_execution_mode.output.selected_mode}
        
        Include these sections:
        1. Workflow metadata (id, name, description)
        2. Model configuration (primary model, optional embeddings)
        3. Workflow execution strategy (based on execution mode)
        4. Pipeline steps (appropriate for the task complexity)
        5. Logging configuration (based on logging slider)
        6. Tool permissions (based on scope slider)
        
        Ensure the workflow is:
        - Complete and executable
        - Well-structured and readable
        - Compatible with the execution mode
        - Self-documenting (clear naming, inline documentation)
        
        Output the complete YAML as a string.
      
      variables:
        execution_mode: "${step.step_2_determine_execution_mode.output.selected_mode}"
        analysis: "${step.step_1_parse_input_prompt.output}"
    
    output:
      save_to: generated_workflow
      format: yaml
      path: "${workflow.output_path}/generated_workflow.yml"
      console:
        enabled: true
    
    retry:
      max_attempts: 3
      backoff_strategy: exponential

# ── LOGGING CONFIGURATION ────────────────────────────────────
logging:
  
  # ── LOG LEVELS ────────────────────────────────────────
  level: info  # debug | info | warning | error | trace
  
  # ── LOG DETAIL ────────────────────────────────────────
  detail: medium  # low | medium | high | verbose
  
  # ── OUTPUT DESTINATIONS ──────────────────────────────────
  output_destinations:
    chat_file:
      enabled: true
      path: "${workflow.output_path}/prompt-generator-workflow.md"
      format: markdown
    
    json_file:
      enabled: true
      path: "${workflow.output_path}/logs/execution.json"
      format: json
    
    console:
      enabled: true
      include_timestamps: true
  
  # ── ERROR LOGGING ────────────────────────────────────────
  error_logging:
    enabled: true
    separate_file: true
    path: "${workflow.output_path}/logs/errors.json"
    include_stack_trace: true
    include_context: true

# ── TOOL PERMISSIONS ────────────────────────────────────────
tool_permissions:
  
  # ── FILE OPERATIONS ────────────────────────────────────────
  file_operations:
    read:
      enabled: true
      require_confirmation: false
      allowed_paths:
        - /workspace/input
        - /workspace/config
      allowed_patterns:
        - "*.md"
        - "*.txt"
      forbidden_paths:
        - /workspace/output
        - /workspace/checkpoints
      max_file_size_mb: 50
    
    write:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/output
      allowed_patterns:
        - "*.yml"
        - "*.yaml"
      forbidden_paths:
        - /workspace/src
        - /workspace/tests
      max_file_size_mb: 100
      backup_existing: true
      create_parent_directories: true

# ── FEATURES DEMONSTRATED ────────────────────────────────────
features_demonstrated:
  - policy_slider_integration
  - execution_mode_selection
  - model_routing
  - embedding_model_usage
  - structured_output_generation
  - workflow_yaml_generation
  - file_operations
  - logging_configuration
  - tool_permissions
  - retry_logic
  - timeout_management
  - memory_management
  - workflow_execution_strategy
