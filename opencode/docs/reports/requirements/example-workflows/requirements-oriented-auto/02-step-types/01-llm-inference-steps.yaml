---
workflow_id: llm_inference_steps
name: LLM Inference Steps with Different Prompts
description: Demonstrates various LLM inference patterns with different prompt types, output formats, and response handling
version: "1.0.0"

# ── MODEL CONFIGURATION ────────────────────────────────────
models:
  default_model_router: automatic
  
  "llama-3.2-3b-instruct":
    name: primary_llm
    host:
      type: lmstudio
      connection_settings:
        host: localhost
        port: 1234
    
    max_allowed:
      ram: 4096MB
      vram: 4096MB
      attention_tokens: 8192
      concurrent_requests: 2
    
    min_allowed:
      ram: 2048MB
      vram: 2048MB
      attention_tokens: 4096
    
    execution:
      timeout:
        load_into_memory: 10s
        time_to_first_response: 30s
        total_time_to_response: 2h
      max_turns: 15
    
    thinking:
      budget_tokens: 4096
      capture_in_output: true
      capture_in_events: true

# ── WORKFLOW EXECUTION STRATEGY ────────────────────────────
workflow_execution_strategy:
  load_unload: lazy
  processing: serial
  
  memory:
    allocation:
      strategy: dynamic
      max_allowed:
        ram: 8192MB
        vram: 8192MB
    
    model_lifecycle:
      load_unload_strategy: lazy
      unload_unused: true
  
  timeout:
    default_timeout_secs: 300
    timeout_strategy: continue_with_partial
  
  error_handling:
    default_action: retry
    max_retries_per_step: 3
    retry_backoff_multiplier: 2.0

# ── LOGGING CONFIGURATION ────────────────────────────────────

agentic_workflow:
  hardcoded_values:
    analysis_types:
      - sentiment
      - classification
      - summarization
      - extraction
    
    output_templates:
      json: |
        {"result": "{{output}}", "confidence": "{{confidence}}", "metadata": {{metadata}}}
      markdown: |
        # Analysis Result
        {{output}}
        
        **Confidence**: {{confidence}}
      structured: |
        Result: {{output}}
        Confidence: {{confidence}}%
        Reasoning: {{reasoning}}

  steps:
    # ── STEP 1: Zero-shot Classification Prompt ─────────────
    step_1_zero_shot_classification:
      name: "Zero-shot Classification"
      description: "Classify text without examples using zero-shot prompting"      
      generative_entity: "${models.primary_llm}"
      
      prompt: |
        Classify the following customer feedback into one of these categories:
        - Bug Report
        - Feature Request
        - General Inquiry
        - Complaint
        - Compliment
        
        Customer Feedback:
        "${workflow.input.customer_feedback}"
        
        Instructions:
        1. Analyze the sentiment and content
        2. Determine the most appropriate category
        3. Provide confidence level (0.0-1.0)
        4. Explain your reasoning
        
        Return a JSON object with:
        - category: selected category
        - confidence: confidence score
        - reasoning: brief explanation
        - keywords: key terms identified
      
      inputs:
        customer_feedback: "${workflow.input.customer_feedback}"
      
      when:

      
        after_step_succeeds:

      
          save_to: classification_result          - category
          - confidence
          - reasoning
          - keywords
        
        file_output:
          path: "${workflow.output_path}/classification.json"
        
        console:
          prefix: "[Classification] "
      
      retry:
        max_attempts: 2
        backoff: exponential
        delay_ms: 1000

    # ── STEP 2: Few-shot Learning Prompt ─────────────
    step_2_few_shot_learning:
      name: "Few-shot Learning"
      description: "Use few-shot examples to guide response generation"      
      generative_entity: "${models.primary_llm}"
      
      prompt: |
        Learn from these examples and generate a similar response:
        
        Example 1:
        Input: "The product is great but shipping was slow"
        Output: {"sentiment": "mixed", "aspects": {"product": "positive", "shipping": "negative"}}
        
        Example 2:
        Input: "Absolutely love it! Best purchase ever!"
        Output: {"sentiment": "positive", "aspects": {"overall": "positive"}}
        
        Example 3:
        Input: "Not what I expected, very disappointed"
        Output: {"sentiment": "negative", "aspects": {"expectation": "negative", "emotion": "disappointed"}}
        
        Now analyze this input:
        Input: "${step.step_1_zero_shot_classification.output.keywords}"
        
        Generate output following the same pattern with:
        - sentiment classification
        - aspect-based analysis
        - emotional tone
      
      inputs:
        keywords: "${step.step_1_zero_shot_classification.output.keywords}"
      
      when:

      
        after_step_succeeds:

      
          save_to: sentiment_analysis          - sentiment
          - aspects
          - emotional_tone
        
        console:
          disabled: true
      
      retry:
        max_attempts: 3
        backoff: linear
        delay_ms: 2000

    # ── STEP 3: Chain-of-Thought Reasoning ─────────────
    step_3_chain_of_thought:
      name: "Chain-of-Thought Reasoning"
      description: "Step-by-step reasoning with explicit thinking process"      
      generative_entity: "${models.primary_llm}"
      
      prompt: |
        Analyze the classification and sentiment results step-by-step.
        
        Previous Results:
        Classification: {{step.step_1_zero_shot_classification.output}}
        Sentiment: {{step.step_2_few_shot_learning.output}}
        
        Think through this systematically:
        1. First, review the classification category
        2. Then, examine the sentiment analysis
        3. Next, identify contradictions or confirmations
        4. Finally, determine the priority level
        
        For each step, write out your reasoning before moving to the next.
        
        Output your complete reasoning chain and final conclusion.
      
      inputs:
        classification: "${step.step_1_zero_shot_classification.output}"
        sentiment: "${step.step_2_few_shot_learning.output}"
      
      when:

      
        after_step_succeeds:

      
          save_to: reasoning_chain          - reasoning_steps
          - final_conclusion
          - priority_level
        
        file_output:
          path: "${workflow.output_path}/reasoning-chain.md"
          format: markdown
        
        console:

    # ── STEP 4: Structured Data Extraction ─────────────
    step_4_structured_extraction:
      name: "Structured Data Extraction"
      description: "Extract structured data from unstructured text"      
      generative_entity: "${models.primary_llm}"
      
      prompt: |
        Extract structured information from this customer feedback:
        
        Original Text:
        "${workflow.input.customer_feedback}"
        
        Extract the following fields:
        1. Product mentioned (if any)
        2. Issue description (if any)
        3. Urgency level (low/medium/high/critical)
        4. Customer sentiment (positive/negative/neutral/mixed)
        5. Action required (yes/no)
        6. Department to route (support/sales/engineering/other)
        
        Format as JSON with:
        - extracted_data: object with all fields
        - confidence_scores: object with confidence for each field
        - raw_mentions: array of text snippets supporting extraction
        - alternative_interpretations: if confidence < 0.8, list alternatives
      
      inputs:
        customer_feedback: "${workflow.input.customer_feedback}"
      
      when:

      
        after_step_succeeds:

      
          save_to: extracted_data        
        file_output:
          path: "${workflow.output_path}/extracted-data.json"
        
        console:
          disabled: true

    # ── STEP 5: Multi-turn Conversation ─────────────
    step_5_multi_turn_conversation:
      name: "Multi-turn Conversation"
      description: "Simulate multi-turn conversation with context accumulation"      
      generative_entity: "${models.primary_llm}"
      
      prompt: |
        You are a customer support assistant. Continue this conversation based on all previous analysis.
        
        Conversation Context:
        Classification: {{step.step_1_zero_shot_classification.output.category}}
        Sentiment: {{step.step_2_few_shot_learning.output.sentiment}}
        Reasoning: {{step.step_3_chain_of_thought.output.final_conclusion}}
        Extracted Data: {{step.step_4_structured_extraction.output.extracted_data}}
        
        Generate a helpful, empathetic response that:
        1. Acknowledges the customer's feedback
        2. Addresses their specific concern
        3. Provides a clear next step or solution
        4. Maintains appropriate tone based on sentiment
        
        Format as:
        - greeting: personalized greeting
        - acknowledgment: summary of customer's issue
        - response: detailed response
        - next_steps: clear action items
        - closing: friendly closing
      
      inputs:
        classification: "${step.step_1_zero_shot_classification.output}"
        sentiment: "${step.step_2_few_shot_learning.output}"
        reasoning: "${step.step_3_chain_of_thought.output}"
        extracted: "${step.step_4_structured_extraction.output}"
      
      when:

      
        after_step_succeeds:

      
          save_to: conversation_response          - greeting
          - acknowledgment
          - response
          - next_steps
          - closing
        
        file_output:
          path: "${workflow.output_path}/conversation-response.json"
        
        console:
          prefix: "[Response] "

    # ── STEP 6: Prompt Refinement Loop ─────────────
    step_6_prompt_refinement:
      name: "Prompt Refinement"
      description: "Iteratively refine response quality"      
      loop:
        type: validation
        validation_config:
          abstract_criteria: response_quality_improvement
          tolerance: 0.05
          max_iterations: 3
          
          exact_criteria:
            - metric: sentiment_match
              operator: "=="
              target: true
            - metric: completeness
              operator: ">="
              target: 0.85
          
          on_convergence: continue
          on_max_iterations: use_best_result
      
      prompt: |
        Review and refine the conversation response:
        
        Current Response:
        {{step.step_5_multi_turn_conversation.output}}
        
        Customer Feedback:
        "${workflow.input.customer_feedback}"
        
        Refinement Goals:
        1. Ensure sentiment is accurately reflected
        2. Make response more empathetic if needed
        3. Add specific details from extracted data
        4. Improve clarity and conciseness
        
        Quality Metrics:
        - Sentiment match: Does response match customer's sentiment?
        - Completeness: Are all issues addressed?
        - Empathy level: Is tone appropriate?
        - Actionability: Are next steps clear?
        
        Return refined response with quality scores.
      
      when:

      
        after_step_succeeds:

      
          save_to: refined_response          - refined_conversation
          - quality_scores
          - improvements_made

# ── WORKFLOW VARIABLES ────────────────────────────────────
workflow:
  input:
    customer_feedback: "I've been waiting 2 weeks for my order and the tracking hasn't updated. This is ridiculous! I want a refund immediately."
  
  output_path: ./workspace/output/llm-inference

