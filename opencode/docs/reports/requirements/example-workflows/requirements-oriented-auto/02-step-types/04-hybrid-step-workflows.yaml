---
workflow_id: hybrid_step_workflows
name: Hybrid Step Workflows
description: Demonstrates combining different step types (agent, tool, control, loop) in a single workflow

# ── MODEL CONFIGURATION ────────────────────────────────────
models:
  
  default_model_router: automatic
  
  # ── MODEL: ANALYZER ───────────────────────────────
  "llama-3.2-3b-instruct":
    name: analyzer
    
    host:
      type: lmstudio
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 3072MB
        vram: 3072MB
        cpu: 90%
        gpu: 90%
        attention_tokens: 8192
        concurrent_requests: 2
      
      min_allowed:
        ram: 1536MB
        vram: 1536MB
        cpu: 50%
        gpu: 50%
        attention_tokens: 4096
      
      allocation_strategy: dynamic
    
    execution:
      timeout:
        load_into_memory: 15s
        time_to_first_response: 45s
        total_time_to_response: 10m
      
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true

# ── MODEL: VALIDATOR ───────────────────────────────
  "llama-3.2-3b-instruct":
    name: validator
    
    host:
      type: lmstudio
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 2048MB
        vram: 2048MB
        cpu: 60%
        gpu: 60%
        attention_tokens: 4096
        concurrent_requests: 1
      
      min_allowed:
        ram: 1024MB
        vram: 1024MB
        cpu: 30%
        gpu: 30%
        attention_tokens: 2048
      
      allocation_strategy: static
    
    execution:
      timeout:
        load_into_memory: 10s
        time_to_first_response: 30s
        total_time_to_response: 5m
      
      max_turns: 3
      stop_on_tool_failure: false
      accumulate_tool_results: true

# ── WORKFLOW EXECUTION STRATEGY ────────────────────────────
workflow_execution_strategy:
  
  load_unload: adaptive
  
  processing: hybrid
  
  parallel:
    enabled: true
    algorithm: priority_queue
    max_threads: 2
    max_models: 2
    max_concurrent_requests: 2
  
  memory:
    allocation:
      strategy: adaptive
      max_allowed:
        ram: 4096MB
        vram: 4096MB
        cpu: 90%
        gpu: 90%
        attention_tokens: 8192
    
    model_lifecycle:
      load_unload_strategy: adaptive
      cache_size: medium
      swap_timeout_secs: 30
      unload_unused: true
  
  timeout:
    total: 1h
    timeout_strategy: continue_with_partial
  
  error_handling:
    default_action: retry
    max_retries_per_step: 3
    retry_backoff_multiplier: 2.0

# ── LOGGING CONFIGURATION ────────────────────────────────────
logging:
  
  level: info
  
  output_destinations:
    console:
      enabled: true
      include_timestamps: true
    
    file:
      enabled: true
      path: ./workspace/logs/hybrid-workflow.log

# ── PIPELINE DEFINITION ───────────────────────────────────
agentic_workflow:
  
  hardcoded_values:
    source_directory: ./workspace/src
    output_directory: ./workspace/output
    max_iterations: 5
  
  steps:
    
    # ── STEP 1: Tool Step (File Discovery) ───────────
    step_1_discover_files:
      name: "Discover Source Files"
      description: "Use tool to find all Rust source files"
      type: tool
      
      generative_entity: "${models.analyzer}"
      
      prompt: |
        Find all Rust source files in the source directory.
        
        Directory: ${source_directory}
        
        Look for:
        - .rs files
        - Subdirectories
        - Excluding target/, Cargo.lock
      
      tool:
        type: cli_run
        
        parameters:
          command: "find . -name '*.rs' -type f | head -20"
            # Required: Command to execute
            
          working_directory: "${source_directory}"
            # Working directory for command
            
          timeout_secs: 10
            # Command timeout
            
          capture_output:
            enabled: true
            save_to_file: "${output_directory}/file-list.txt"
            format: text
      
      output:
        save_to: file_list
        format: structured
        fields:
          - file_count       # Number of files found
          - file_paths       # Array of file paths
          - raw_output       # Raw command output
          - output_file       # Path to saved output
    
    # ── STEP 2: Agent Step (Initial Analysis) ───────────
    step_2_analyze_structure:
      name: "Analyze Code Structure"
      description: "Use agent to analyze discovered files"
      type: agent
      depends_on:
        - step_1_discover_files
      
      generative_entity: "${models.analyzer}"
      
      prompt: |
        Analyze the following Rust source files:
        
        {{step.step_1_discover_files.output.file_paths}}
        
        For each file, identify:
        1. Module name
        2. Public functions
        3. Dependencies
        4. Error handling patterns
        5. Async usage
        
        Return as structured JSON with file names as keys.
      
      output:
        save_to: structure_analysis
        format: json
        fields:
          - file_analyses  # Analysis for each file
          - total_functions  # Total function count across all files
          - async_count     # Number of async functions
          - complexity_summary # Overall complexity assessment
    
    # ── STEP 3: Loop Step (Batch Processing) ─────────
    step_3_batch_analyze:
      name: "Batch Process Files"
      description: "Loop through files and analyze each"
      type: loop
      depends_on:
        - step_1_discover_files
        - step_2_analyze_structure
      
      generative_entity: "${models.validator}"
      
      loop:
        type: count
        
        count_config:
          max_iterations: "{{workflow.max_iterations}}"
          iteration_variable: iteration
          initial_value: 1
          on_max_iterations: return_all
      
      # Loop body - agent step executed for each iteration
      prompt: |
        You are processing file {{iteration}} of {{workflow.max_iterations}}.
        
        File list from step 1:
        {{step.step_1_discover_files.output.file_paths}}
        
        Select file at index {{iteration}} (1-indexed) and:
        1. Read the file content
        2. Analyze code quality
        3. Check for common issues:
           - Unused imports
           - Missing error handling
           - Code duplication
           - Performance anti-patterns
        
        Return analysis with:
        - File path
        - Quality score (0-100)
        - Issues found
        - Recommendations
      
      output:
        save_to: batch_results
        format: json
        fields:
          - iteration        # Current iteration number
          - file_analyzed   # Path to file analyzed
          - quality_score    # Code quality score
          - issues_found     # List of issues
          - recommendations   # List of suggestions
    
    # ── STEP 4: Control Step (Aggregation) ────────────
    step_4_aggregate_results:
      name: "Aggregate Analysis Results"
      description: "Combine all batch results into summary"
      type: agent
      depends_on:
        - step_3_batch_analyze
      
      generative_entity: "${models.validator}"
      
      prompt: |
        Aggregate the batch analysis results from step 3.
        
        All results:
        {{step.step_3_batch_analyze.output.batch_results}}
        
        Create a comprehensive summary:
        1. Overall quality metrics (average, min, max)
        2. Most common issues across all files
        3. Files requiring attention (lowest quality scores)
        4. Prioritized recommendations
        
        Format as markdown report with:
        - Executive summary table
        - Detailed file-by-file findings
        - Actionable recommendations section
      
      output:
        save_to: final_summary
        format: markdown
        
        file_output:
          enabled: true
          path: "${output_directory}/aggregated-summary.md"
          format: markdown
          
        console:
          enabled: true
          prefix: "[Summary] "
    
    # ── STEP 5: Tool Step (Report Generation) ───────────
    step_5_generate_metrics:
      name: "Generate Metrics Report"
      description: "Generate JSON metrics from analysis"
      type: tool
      depends_on:
        - step_2_analyze_structure
        - step_4_aggregate_results
      
      generative_entity: "${models.validator}"
      
      prompt: |
        Generate a metrics JSON file containing:
        
        1. From structure analysis (step 2):
           - Total functions: {{step.step_2_analyze_structure.output.total_functions}}
           - Async functions: {{step.step_2_analyze_structure.output.async_count}}
           - Complexity: {{step.step_2_analyze_structure.output.complexity_summary}}
        
        2. From batch analysis (step 3):
           - Average quality: Calculate from batch_results
           - Total issues: Sum all issues
        
        3. From aggregation (step 4):
           - Summary reference: {{step.step_4_aggregate_results.output.final_summary}}
        
        Structure as:
        {
          "metadata": {
            "timestamp": "{{now}}",
            "workflow_id": "{{workflow_id}}",
            "total_files_analyzed": "{{step.step_1_discover_files.output.file_count}}"
          },
          "quality_metrics": {...},
          "findings": {...},
          "recommendations": {...}
        }
      
      tool:
        type: file_write
        
        parameters:
          file_path: "${output_directory}/metrics.json"
            # Required: Path to output file
            
          content: |
            {
              "metadata": {
                "timestamp": "{{now}}",
                "workflow_id": "{{workflow_id}}",
                "total_files_analyzed": "{{step.step_1_discover_files.output.file_count}}"
              },
              "quality_metrics": {
                "total_functions": "{{step.step_2_analyze_structure.output.total_functions}}",
                "async_functions": "{{step.step_2_analyze_structure.output.async_count}}",
                "complexity_summary": "{{step.step_2_analyze_structure.output.complexity_summary}}"
              },
              "findings": {
                "aggregation_summary": "{{step.step_4_aggregate_results.output.final_summary}}"
              }
            }
            
            # Content is a formatted JSON string with variable interpolation
          
          encoding: utf-8
          create_directories: true
          atomic_write: true
      
      output:
        save_to: metrics_output
        format: structured
        fields:
          - success              # Write operation succeeded
          - file_path           # Path to metrics file
          - bytes_written        # Number of bytes written
          
        console:
          enabled: true
          prefix: "[Metrics] "
    
    # ── STEP 6: Conditional Step (Quality Gate) ──────────
    step_6_quality_gate:
      name: "Quality Gate Check"
      description: "Check if quality meets threshold before proceeding"
      type: agent
      depends_on:
        - step_4_aggregate_results
      
      generative_entity: "${models.validator}"
      
      prompt: |
        Review the aggregated analysis summary:
        
        {{step.step_4_aggregate_results.output.final_summary}}
        
        Determine:
        1. Average quality score across all files
        2. Is quality >= 80 (pass threshold)?
        3. If quality < 80, list files below threshold
        
        Return decision as:
        {
          "decision": "proceed" | "review_required",
          "average_quality": <number>,
          "below_threshold_files": [<paths>],
          "message": "<explanation>"
        }
      
      output:
        save_to: quality_decision
        format: json
        fields:
          - decision            # "proceed" or "review_required"
          - average_quality     # Numeric quality score
          - below_threshold_files  # List of files needing review
          - message             # Explanation of decision
    
    # ── STEP 7: Branch (Conditional Execution) ────────
    step_7_branch_on_quality:
      name: "Branch Based on Quality"
      description: "Execute different paths based on quality decision"
      type: control
      depends_on:
        - step_6_quality_gate
      
      branches:
        
        # Branch 1: High quality - proceed to deployment prep
        branch_proceed:
          name: "Proceed to Deployment"
          description: "Quality is acceptable, prepare for deployment"
          
          enabled_by: "step_6_quality_gate.output.decision == 'proceed'"
          
          next_step: step_8_deployment_prep
          
          on_entry:
            log:
              level: info
              message: "Quality threshold met, proceeding to deployment"
        
        # Branch 2: Low quality - request review
        branch_review:
          name: "Request Code Review"
          description: "Quality below threshold, request manual review"
          
          enabled_by: "step_6_quality_gate.output.decision == 'review_required'"
          
          next_step: step_9_review_request
          
          on_entry:
            log:
              level: warning
              message: "Quality threshold not met, review required"
    
    # ── STEP 8: Tool Step (Deployment Prep) ───────────
    step_8_deployment_prep:
      name: "Prepare for Deployment"
      description: "Create deployment artifacts"
      type: tool
      depends_on:
        - step_7_branch_on_quality
      
      generative_entity: "${models.validator}"
      
      prompt: |
        Prepare deployment artifacts:
        
        1. Copy metrics.json to deployment directory
        2. Create deployment manifest
        3. Validate all required files are present
      
      tool:
        type: cli_run
        
        parameters:
          command: |
            mkdir -p deployment && \
            cp ${output_directory}/metrics.json deployment/ && \
            cat > deployment/manifest.json << EOF
            {
              "version": "1.0.0",
              "timestamp": "{{now}}",
              "quality_score": "{{step.step_6_quality_gate.output.average_quality}}"
            }
            EOF
            
          working_directory: "${output_directory}"
          timeout_secs: 10
          
          capture_output:
            enabled: true
      
      output:
        save_to: deployment_prep
        format: structured
        fields:
          - exit_code         # Command exit code
          - deployment_dir    # Path to deployment directory
          - manifest_created  # Whether manifest was created
    
    # ── STEP 9: Agent Step (Review Request) ───────────
    step_9_review_request:
      name: "Generate Review Request"
      description: "Create detailed review request for code review"
      type: agent
      depends_on:
        - step_7_branch_on_quality
      
      generative_entity: "${models.validator}"
      
      prompt: |
        Generate a code review request based on quality findings:
        
        Below threshold files:
        {{step.step_6_quality_gate.output.below_threshold_files}}
        
        Analysis summary:
        {{step.step_4_aggregate_results.output.final_summary}}
        
        Create review request with:
        1. Summary of quality issues
        2. List of files requiring attention
        3. Specific recommendations for each file
        4. Priority ranking (high, medium, low)
        
        Format as markdown with:
        - Review title
        - Context section
        - Issues table (file, severity, description)
        - Recommended actions
        
        Save to: ${output_directory}/review-request.md
      output:
        save_to: review_request
        format: markdown
        
        file_output:
          enabled: true
          path: "${output_directory}/review-request.md"
          format: markdown
