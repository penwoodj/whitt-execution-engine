---
workflow_id: decision_logic_workflows
name: Decision Logic and Branching Patterns
description: Demonstrates complex decision logic, multi-way branching, nested conditions, and state machine workflows
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - conditional-branching
  - decision-logic
  - multi-way-branching
  - state-machines

models:
  decision_agent:
    name: "Decision Logic Agent"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

agentic_workflow:
  step_1_evaluate_preconditions:
    name: "Evaluate Preconditions"
    type: agent
    model: "${models.decision_agent}"

    input:
      prompt: |
        Evaluate workflow preconditions before execution.

        Preconditions to check:
        1. Environment variables set: RUST_ENV=production
        2. Required files exist: ./workspace/src/main.rs
        3. Resource limits available: RAM >= 8GB
        4. User permissions validated: write access
        5. Dependencies installed: cargo, rustc

        Decision logic:
        IF all_preconditions_met == true:
          THEN proceed_to_step2
            Answer: "Decision: proceed"
        ELSE IF critical_missing == true:
          THEN halt_workflow
            Answer: "Decision: halt"
        ELSE IF partial_failure == true:
          THEN continue_with_limitations
            Answer: "Decision: limited"

        Strict yes/no required: true.

        Return decision with detailed precondition check results.

    output:
      save_to: preconditions_check
      format: json

  step_2_multiway_branching:
    name: "Multi-Way Branching"
    type: agent
    model: "${models.decision_agent}"

    input:
      enabled_by:
        condition: "step_1_evaluate_preconditions.decision == 'proceed'"

      prompt: |
        Execute multi-way branching based on evaluation result.

        Precondition result:
        {{preconditions_check}}

        Branch options:
        - Branch A (fast_path): Skip validation, build immediately
        - Branch B (standard_path): Full validation, then build
        - Branch C (safe_path): Use cached build if available
        - Branch D (abort_path): Cancel workflow if risk detected

        Decision criteria:
        - Risk threshold: critical_risk_score < 0.3
        - Time constraint: available_time < 15 minutes
        - Resource constraint: system_load > 0.8
        - Success confidence: required_success_probability > 0.95

        Evaluate each branch:
        1. fast_path: IF low_risk AND sufficient_time
        2. standard_path: IF normal_risk AND sufficient_time
        3. safe_path: IF high_risk OR insufficient_time
        4. abort_path: IF unacceptable_risk OR impossible_time

        Select optimal branch:
        - Risk assessment for each option
        - Time requirement check
        - Resource availability verification
        - Success probability calculation

        Return selected branch with rationale.

    output:
      save_to: branch_decision
      format: json

  step_3_execute_fast_path:
    name: "Execute Fast Path"
    type: agent
    model: "${models.decision_agent}"

    input:
      enabled_by:
        condition: "step_2_multiway_branching.decision == 'fast_path'"

      prompt: |
        Execute fast path branch.

        Fast path steps:
        1. Quick validation check (skip comprehensive)
        2. Direct build command (cargo build)
        3. Minimal error checking
        4. Deploy if build succeeds

        Requirements:
        - Skip time-consuming validations
        - Use optimized compiler flags
        - Minimal error checking

        Execute and return fast path results.

    output:
      save_to: fast_path_results
      format: json

  step_4_execute_standard_path:
    name: "Execute Standard Path"
    type: agent
    model: "${models.decision_agent}"

    input:
      enabled_by:
        condition: "step_2_multiway_branching.decision == 'standard_path'"

      prompt: |
        Execute standard path branch.

        Standard path steps:
        1. Comprehensive validation (lint, test, format)
        2. Full build with optimization
        3. Complete test suite execution
        4. Security scan deployment

        Requirements:
        - All validations must pass
        - Build must optimize for speed
        - Tests must achieve target coverage
        - Security scan clean

        Execute and return standard path results.

    output:
      save_to: standard_path_results
      format: json

  step_5_compare_paths:
    name: "Compare Path Results"
    type: agent
    model: "${models.decision_agent}"

    input:
      variables:
        fast: "${step.step_3_execute_fast_path.output}"
        standard: "${step.step_4_execute_standard_path.output}"

      prompt: |
        Compare results from both execution paths.

        Comparison metrics:
        - Execution time: measure each path
        - Quality score: lint + test results
        - Resource usage: memory, CPU time
        - Success rate: both paths succeeded?

        Analysis:
        1. Was fast path acceptable quality?
        2. Did standard path provide significant value add?
        3. Time saved vs quality tradeoff analysis
        4. Risk assessment of fast path

        Return comparison with recommendation.

    output:
      save_to: path_comparison
      format: json

  step_6_final_decision:
    name: "Make Final Decision"
    type: agent
    model: "${models.decision_agent}"

    input:
      variables:
        preconditions: "${step.step_1_evaluate_preconditions.output}"
        branch: "${step.step_2_multiway_branching.decision}"
        fast: "${step.step_3_execute_fast_path.output}"
        standard: "${step.step_4_execute_standard_path.output}"
        comparison: "${step.step_5_compare_paths.output}"

      prompt: |
        Make final workflow decision based on all results.

        Decision synthesis:
        - Precondition check: {{preconditions}}
        - Branch selection: {{branch}}
        - Fast path results: {{fast}}
        - Standard path results: {{standard}}
        - Path comparison: {{comparison}}

        Final decision logic:
        IF standard_passed AND fast_adequate_quality AND time_savings > threshold:
          THEN deploy_standard_path
            Answer: "Decision: deploy_standard"
        ELSE IF standard_failed OR fast_unacceptable:
          THEN deploy_fast_path
            Answer: "Decision: deploy_fast"
        ELSE:
          THEN manual_review_required
            Answer: "Decision: review"

        Provide final decision with confidence score.

    output:
      save_to: final_decision
      format: json
      file_output:
        enabled: true
        path: ./workspace/output/decision-summary.json

logging:
  enabled: true

  levels:
    default: info
    workflow_execution: debug

  scopes:
    workflow_execution:
      enabled: true
      include_decisions: true
      include_branch_rationale: true

    execution:
      enabled: true

  output:
    console:
      enabled: true

    file:
      enabled: true
      path: ./workspace/logs/decision-logic.log
