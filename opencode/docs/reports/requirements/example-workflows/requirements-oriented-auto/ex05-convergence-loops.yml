---
workflow_id: convergence_optimization_loop
name: Convergence Loops
description: Continue until results stabilize below threshold

# ── MODEL CONFIGURATION ────────────────────────────────────
models:
  "llama-3.2-3b-instruct":
    name: optimizer  # Variable reference name
    
    host:
      type: llama_cpp_with_vulkan
      connection_settings:
        model_path: /models/optimizer.Q4_K_M.gguf
        backend: vulkan
        gpu_layers: 32

# ── WORKFLOW EXECUTION STRATEGY ────────────────────────────
workflow_execution_strategy:
  
  # ── MODEL LIFECYCLE ─────────────────────────────────
  load_unload: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
  
  # ── PROCESSING MODE ───────────────────────────────────
  processing: serial  # parallel | serial | hybrid

# ── MEMORY MANAGEMENT ───────────────────────────────────
memory:
  
  # ── MODEL LIFECYCLE ─────────────────────────────────
  model_lifecycle:
    load_unload_strategy: one_at_a_time
    swap_timeout_secs: 10

# ── LOGGING CONFIGURATION ───────────────────────────────────
logging:
  
  # ── LOG LEVELS ─────────────────────────────────────
  level: debug  # debug | info | warning | error
  
  # ── LOG DETAIL ─────────────────────────────────────
  detail: high  # low | medium | high | verbose
  
  # ── OUTPUT DESTINATIONS ───────────────────────────────
  output_destinations:
    json_file:
      enabled: true
      path: "${workflow.output_path}/logs/convergence_loop.json"
      format: json

# ── PIPELINE DEFINITION ───────────────────────────────────
pipeline:
  
  # ── STEP 1: Initial Code Optimization ─────────────────────
  step_1_optimize_iteration_1:
    name: "Optimize Iteration 1"
    description: "First optimization attempt"
    type: agent  # agent | tool | sub_workflow | control | loop
    
    model: "${models.optimizer}"
    
    input:
      prompt: |
        Optimize this code for performance:

        ${workflow.code_path}

        Focus on:
        1. Algorithm efficiency
        2. Memory usage
        3. Parallelization opportunities

        Output optimization score (0-1) and suggested changes.
      
      code: "${workflow.code_path}"
    
    output:
      save_to: iteration_1
      format: json
      fields:
        - score  # Optimization quality score (0-1)
        - changes  # Suggested code changes
        - metrics  # Performance metrics
    
    retry:
      max_attempts: 3
      backoff_strategy: exponential  # exponential | linear | fixed
      base_delay_ms: 1000
      max_delay_ms: 30000
  
  # ── STEP 2: Second Optimization (Compare with Previous) ─────────
  step_2_optimize_iteration_2:
    name: "Optimize Iteration 2"
    description: "Improve based on first iteration"
    type: agent
    
    model: "${models.optimizer}"
    
    input:
      prompt: |
        Previous optimization scored:

        {{step.step_1_optimize_iteration_1.output.score}}
        with these changes:

        {{step.step_1_optimize_iteration_1.output.changes}}

        Try to improve score further:

        ${workflow.code_path}

        Output new optimization score and changes.
      
      previous_score: "{{step.step_1_optimize_iteration_1.output.score}}"
      previous_changes: "{{step.step_1_optimize_iteration_1.output.changes}}"
      code: "${workflow.code_path}"
    
    output:
      save_to: iteration_2
      format: json
      fields:
        - score
        - changes
        - metrics
        - improvement  # Delta from previous score
    
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      base_delay_ms: 1000
      max_delay_ms: 30000

# ── CONVERGENCE LOOP DEFINITION ─────────────────────────────
convergence_loop:
  
  # ── LOOP TYPE ─────────────────────────────────────────
  type: convergence  # count | time | validation | retry | infinite
  
  # ── CONVERGENCE CRITERIA ───────────────────────────────
  convergence_criteria:
    metric: optimization_score
    operator: "<="  # == | != | > | >= | < | <=
    threshold: 0.01
    stop_when: "converged"  # Stop when delta is below threshold
  
  # ── LOOP CONFIGURATION ───────────────────────────────────
  loop_config:
    max_iterations: 10
    
    steps:
      iteration_1: step_1_optimize_iteration_1
      iteration_2: step_2_optimize_iteration_2
    
    # ── STOP CONDITIONS ───────────────────────────────────
    stop_conditions:
      - "abs({{step.step_2_optimize_iteration_2.output.score}} - {{step.step_1_optimize_iteration_1.output.score}}) < 0.01"  # Converged
      
      - "{{loop.iteration_count}} >= 10"  # Max iterations reached
    
    # ── ON CONVERGENCE ───────────────────────────────────────
    on_convergence: continue  # continue | exit_loop | return_best
    
    # ── ON MAX ITERATIONS ───────────────────────────────
    on_max_iterations: return_best  # return_best | fail_workflow | continue_with_best

# ── WORKFLOW VARIABLES ───────────────────────────────────
workflow:
  code_path: /workspace/src/main.rs
  output_path: /workspace/output

# ── FEATURES DEMONSTRATED ───────────────────────────────
features_demonstrated:
  - convergence_loops
  - optimization_scoring
  - iterative_improvement
  - delta_tracking
  - stop_conditions
  - memory_management
  - logging_configuration
