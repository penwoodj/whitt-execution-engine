  - workflow_id: "rag_knowledge_base_workflow"
    name: "RAG Knowledge Base Sub-Workflow"
    path: "./sub_workflows/rag_knowledge_base.yml"
    validation_config:
      loop_type: "validation"
      exact_criteria: false
      tolerance: 0.1
      max_iterations: 3
      stop_conditions:
        - rag.embedding_count >= 100
        - rag.similarity_score >= 0.85
      interdependent_validations:
        - validation: "embedding_quality"
          requires:
            - from: doc_researcher_sub
              metric: "doc_relevance_score"
              condition: ">= 0.9"

    - agent_id: "knowledge_base_sub"
      dependencies:
        - doc_researcher_sub
      dependents:
        - overall_evaluator
      interdependent_validations:
        - validation: "embedding_quality"
          requires:
            - from: doc_researcher_sub
              metric: "doc_relevance_score"
              condition: ">= 0.9"

    - workflow_id: "prompt_refinement_workflow"
      name: "Prompt Refinement with Version Tracking Sub-Workflow"
      path: "./sub_workflows/prompt_refinement.yml"
      validation_config:
        loop_type: "validation"
        exact_criteria: false
        tolerance: 0.1
        max_iterations: 6
        stop_conditions:
          - refinement.improvement_detected == true
          - refinement.version_count >= 6
      interdependent_validations:
        - validation: "refinement_quality"
          requires:
            - from: code_analyzer_sub
              metric: "analysis_depth"
              condition: ">= 0.95"

    - agent_id: "web_operations_url_params_sub"
      dependencies: []
      dependents:
        - overall_evaluator
      interdependent_validations:
        - validation: "web_params_quality"
          requires:
            - from: code_analyzer_sub
              metric: "analysis_complete"
              condition: "== true"
