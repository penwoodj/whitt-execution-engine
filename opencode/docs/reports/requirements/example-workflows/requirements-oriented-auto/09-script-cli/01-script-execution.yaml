---
workflow_id: script_execution
name: Script Execution for Interpreted Languages
description: Demonstrates script execution, interpreter selection, output capture, error handling, and timeout management
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - script-execution
  - interpreted-languages
  - output-capture
  - timeout-handling

models:
  script_runner:
    name: "Script Execution Agent"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

tool_permissions:
  shell_operations:
    exec:
      enabled: true
      require_confirmation: false
      timeout_seconds: 60
      allowed_commands:
        - python
        - python3
        - node
        - ruby
        - perl
      working_directories:
        - ./workspace/scripts
        - ./workspace/temp

agentic_workflow:
  step_1_execute_python_script:
    name: "Execute Python Script"
    type: agent
    model: "${models.script_runner}"

    input:
      prompt: |
        Execute Python script for data processing.

        Script location: ./workspace/scripts/process_data.py

        Execution requirements:
        1. Use python3 interpreter
        2. Capture stdout and stderr separately
        3. Set timeout to 60 seconds
        4. Pass command-line arguments if needed
        5. Handle shebang (#!/usr/bin/env python3)

        Script purpose:
        - Read input from ./workspace/input/data.json
        - Transform data (normalize, filter, aggregate)
        - Write output to ./workspace/output/processed_data.json
        - Return exit code and success status

        Execute with proper error handling:
        - Check if script exists
        - Verify interpreter available
        - Capture full output
        - Handle non-zero exit codes

        Return execution results including output, errors, exit code.

    output:
      save_to: python_execution_result
      format: json

  step_2_execute_nodejs_script:
    name: "Execute Node.js Script"
    type: agent
    model: "${models.script_runner}"

    input:
      prompt: |
        Execute Node.js script for API integration.

        Script location: ./workspace/scripts/api_client.js

        Execution requirements:
        1. Use node interpreter
        2. Capture both stdout and stderr
        3. Timeout after 45 seconds
        4. Pass environment variables for API keys
        5. Handle asynchronous operations

        Script purpose:
        - Make HTTP requests to external API
        - Process API response data
        - Transform and format data
        - Write formatted output to ./workspace/output/api_results.json

        Execute with:
        - Check Node.js availability
        - Validate script syntax before execution
        - Handle promise rejections
        - Capture any unhandled exceptions

        Return execution status, API data received, and any errors.

    output:
      save_to: nodejs_execution_result
      format: json

  step_3_execute_ruby_script:
    name: "Execute Ruby Script"
    type: agent
    model: "${models.script_runner}"

    input:
      prompt: |
        Execute Ruby script for text processing.

        Script location: ./workspace/scripts/text_processor.rb

        Execution requirements:
        1. Use ruby interpreter
        2. Capture execution output
        3. Timeout after 30 seconds
        4. Handle Ruby's error handling

        Script purpose:
        - Read text files from ./workspace/input/text/
        - Apply text transformations (uppercase, lowercase, camelCase)
        - Generate statistics (word counts, line counts)
        - Write statistics to ./workspace/output/text_stats.txt

        Execute with:
        - Verify Ruby interpreter available
        - Check for syntax errors
        - Handle Ruby exceptions gracefully

        Return processing results and any execution errors.

    output:
      save_to: ruby_execution_result
      format: json

  step_4_handle_script_errors:
    name: "Handle Script Execution Errors"
    type: agent
    model: "${models.script_runner}"

    input:
      variables:
        python: "${step.step_1_execute_python_script.output}"
        nodejs: "${step.step_2_execute_nodejs_script.output}"
        ruby: "${step.step_3_execute_ruby_script.output}"

      prompt: |
        Analyze script execution results and handle errors.

        Execution results:
        - Python: {{python}}
        - Node.js: {{nodejs}}
        - Ruby: {{ruby}}

        Error handling:
        1. Check exit codes (0 = success, non-zero = failure)
        2. Analyze stderr output for warnings/errors
        3. Identify common error patterns:
           - Module not found
           - Permission denied
           - Syntax errors
           - Timeout exceeded
        4. Determine retryability (transient vs permanent)

        For each failed execution:
        - Provide error diagnosis
        - Suggest fixes if possible
        - Mark as retryable or permanent
        - Log error details

        Return error analysis and recommendations.

    output:
      save_to: error_analysis
      format: json

  step_5_validate_outputs:
    name: "Validate Script Outputs"
    type: agent
    model: "${models.script_runner}"

    input:
      prompt: |
        Validate outputs generated by scripts.

        Check outputs:
        - ./workspace/output/processed_data.json (Python)
        - ./workspace/output/api_results.json (Node.js)
        - ./workspace/output/text_stats.txt (Ruby)

        Validation checks:
        1. Files exist and are not empty
        2. JSON files have valid structure
        3. Text files are readable
        4. Data values are within expected ranges
        5. No sensitive data leaked

        For each output:
        - Validate format (JSON schema, text encoding)
        - Check data integrity
        - Verify expected fields present
        - Flag any anomalies

        Return validation results with pass/fail status per file.

    output:
      save_to: validation_results
      format: json

  step_6_generate_execution_report:
    name: "Generate Script Execution Report"
    type: agent
    model: "${models.script_runner}"

    input:
      variables:
        python: "${step.step_1_execute_python_script.output}"
        nodejs: "${step.step_2_execute_nodejs_script.output}"
        ruby: "${step.step_3_execute_ruby_script.output}"
        errors: "${step.step_4_handle_script_errors.output}"
        validation: "${step.step_5_validate_outputs.output}"

      prompt: |
        Generate comprehensive script execution report.

        Execution summary:
        - Python: {{python}}
        - Node.js: {{nodejs}}
        - Ruby: {{ruby}}
        - Errors: {{errors}}
        - Validation: {{validation}}

        Report sections:
        1. Execution statistics (success rate, average duration)
        2. Error patterns and frequency
        3. Output validation results
        4. Performance comparison across languages
        5. Recommendations for optimization
        6. Best practices for script execution in workflows

        Write report to: ./workspace/output/script-execution-report.md

        Include:
        - Summary table
        - Error analysis
        - Validation results
        - Performance metrics
        - Recommendations

    output:
      save_to: execution_report
      format: markdown
      file_output:
        enabled: true
        path: ./workspace/output/script-execution-report.md

logging:
  enabled: true

  levels:
    default: info
    shell_operations: debug
    execution: info

  scopes:
    shell_operations:
      enabled: true
      include_execution_output: true
      include_errors: true

    execution:
      enabled: true

  output:
    console:
      enabled: true

    file:
      enabled: true
      path: ./workspace/logs/script-execution.log

error_handling:
  default_action:
    type: log_and_continue
    reason: "Continue with other scripts if one fails"

  handling_by_type:
    script_not_found:
      action: log_and_skip
      notify_level: error
      message: "Script file not found"

    interpreter_not_found:
      action: log_and_skip
      notify_level: error
      message: "Interpreter not available"

    timeout_exceeded:
      action: log_and_skip
      notify_level: warning
      message: "Script execution timed out"

    script_syntax_error:
      action: log_and_skip
      notify_level: error
      message: "Script has syntax errors"
