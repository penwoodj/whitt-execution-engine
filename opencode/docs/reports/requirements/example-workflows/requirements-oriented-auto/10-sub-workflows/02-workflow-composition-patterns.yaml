---
workflow_id: workflow_composition_patterns
name: Workflow Composition and Orchestration Patterns
description: Demonstrates workflow composition, multiple sub-workflows, policy inheritance, and orchestration patterns
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - subworkflows
  - composition-patterns
  - policy-inheritance
  - orchestration

models:
  master_coordinator:
    name: "Master Workflow Coordinator"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: parallel

sub_workflows:
  - workflow_id: data_ingestion
    path: ./subworkflows/data-ingestion.yml
    description: "Multi-source data ingestion and normalization"

  - workflow_id: data_processing
    path: ./subworkflows/data-processing.yml
    description: "Data transformation and enrichment"

  - workflow_id: quality_validation
    path: ./subworkflows/quality-validation.yml
    description: "Multi-level quality checks and validation"

  - workflow_id: reporting_aggregation
    path: ./subworkflows/reporting-aggregation.yml
    description: "Multi-format report generation and aggregation"

orchestration:
  policy_inheritance:

    inherit_from_parent:
      runtime: true
      review: true
      rigor: true
      scope: true
      concurrency: true
      efficiency: true
      logging: true
      context_budget: false

    override_allowed:
      runtime: false
      # Runtime override allows modifying sub-workflows during execution
      # Set to false to enforce policy compliance
      review: true
      # Review enables monitoring of sub-workflow decisions
      rigor: true
      # Rigor mode enforces stricter validation thresholds
      scope: false
      # Scope=false prevents sub-workflow from modifying parent context
      concurrency: false
      # Concurrency=false ensures sequential sub-workflow execution
      efficiency: true
      logging: true
      context_budget: false

agentic_workflow:
  step_1_parallel_ingestion:
    name: "Parallel Data Ingestion"
    workflow_ref: data_ingestion
    parallel_group: ingestion_group
    max_parallel: 3

    input:
      variables:
        data_sources:
          - ./workspace/input/source1.csv
          - ./workspace/input/source2.json
          - ./workspace/input/source3.yaml

      parameters:
      # Normalize to JSON for consistent downstream processing
      normalize_format: json
      # Remove duplicate entries to avoid redundant processing
      handle_duplicates: remove
      # Validate input structure matches expected schema
      validate_schema: true

    when:
      after_step_succeeds:
        save_to: ingestion_results

  step_2_parallel_processing:
    name: "Parallel Data Processing"
    workflow_ref: data_processing
    parallel_group: processing_group
    max_parallel: 2
    depends_on:
      - step_1_parallel_ingestion

    input:
      variables:
        ingestion_data: "${step.step_1_parallel_ingestion.output}"

      parameters:
        transformations:
          - standardize_fields
          - enrich_metadata
          - apply_business_rules
          - calculate_derived_metrics

    when:
      after_step_succeeds:
        save_to: processing_results

  step_3_parallel_validation:
    name: "Parallel Quality Validation"
    workflow_ref: quality_validation
    parallel_group: validation_group
    max_parallel: 4
    depends_on:
      - step_2_parallel_processing

    input:
      variables:
        processed_data: "${step.step_2_parallel_processing.output}"

      parameters:
        validation_levels:
          - schema_validation
          - data_quality_checks
          - business_rule_validation
          - referential_integrity

    when:
      after_step_succeeds:
        save_to: validation_results

  step_4_aggregate_validation:
    name: "Aggregate Validation Results"
    generative_entity: "${models.master_coordinator}"

    input:
      variables:
        validation_data: "${step.step_3_parallel_validation.output}"
        processing_data: "${step.step_2_parallel_processing.output}"

      prompt: |
        Aggregate validation results from parallel validation.

        Validation data:
        {{validation_data}}

        Processing data:
        {{processing_data}}

        Aggregation tasks:
        1. Combine all validation results
        2. Calculate overall quality score
        3. Identify data quality issues
        4. Check inter-source consistency
        5. Validate business rule compliance

        Quality thresholds:
        - Overall score: >= 0.90 to proceed
        - Schema validity: 100% required
        - Business rule compliance: 100% required

        Return aggregated validation summary with pass/fail decision.

    when:
      after_step_succeeds:
        save_to: aggregated_validation

  step_5_generate_reports:
    name: "Generate Reports"
    workflow_ref: reporting_aggregation
    depends_on:
      - step_4_aggregate_validation
      - step_2_parallel_processing

    input:
      condition: "step_4_aggregate_validation.overall_score >= 0.90"

      variables:
        validation: "${step.step_4_aggregate_validation.output}"
        processing: "${step.step_2_parallel_processing.output}"
        ingestion: "${step.step_1_parallel_ingestion.output}"

      parameters:
        report_formats:
          - json_summary
          - csv_detailed
          - html_dashboard
          - markdown_report

    when:
      after_step_succeeds:
        save_to: reports_generated

  step_6_composition_summary:
    name: "Generate Composition Summary"
    generative_entity: "${models.master_coordinator}"

    input:
      variables:
        ingestion: "${step.step_1_parallel_ingestion.output}"
        processing: "${step.step_2_parallel_processing.output}"
        validation: "${step.step_4_aggregate_validation.output}"
        reports: "${step.step_5_generate_reports.output}"

      prompt: |
        Generate comprehensive composition summary.

        Workflow components:
        - Data ingestion: {{ingestion}}
        - Data processing: {{processing}}
        - Quality validation: {{validation}}
        - Reports: {{reports}}

        Summary sections:
        1. Sub-workflow execution statistics
        2. Parallel execution efficiency
        3. Policy inheritance applied
        4. Inter-sub-workflow dependencies
        5. Overall workflow performance
        6. Quality metrics achieved
        7. Issues and resolutions
        8. Recommendations for optimization

        Policy inheritance details:
        - Runtime: inherited (no override)
        - Review: inherited with override
        - Rigor: inherited (no override)
        - Scope: inherited (not allowed to override)
        - Concurrency: inherited (no override)
        - Efficiency: inherited with override
        - Logging: inherited with override

        Generate final composition report.

    when:
      after_step_succeeds:
        save_to: composition_summary
        append_to: ./workspace/output/composition-summary-report.json

error_handling:
  default_action:
    type: continue_with_available
    reason: "Continue workflow even if some sub-workflows fail"

  sub_workflow:
    failure_handling:
      fail_fast: true
      max_parallel_failures: 2

    error_propagation:
      mode: report_to_parent
      log_all_errors: true

    recovery:
      automatic_retry: true
      max_retries: 2
      backoff_strategy: exponential

    # ── SUB-WORKFLOW COORDINATION ────────────────────────────────────────────────
    workflow_execution_strategy:
      sub_workflow:
    
        # Policy inheritance from parent to child workflows
        inherit_policy:
          inherit_from_parent:
            runtime: true
            review: true
            rigor: true
            scope: true
            concurrency: true
            efficiency: true
            logging: true
            context_budget: false
          override_allowed:
            runtime: false
            review: true
            rigor: true
            scope: false
            concurrency: false
            efficiency: true
            logging: true
            context_budget: false
    
        # Reference resolution for nested workflows
        reference_resolution:
          strategy: hierarchical
          caching:
            cache_ttl_secs: 3600
            validate_references: true
          version_conflict:
            resolution: error
            warn_if_ambiguous: true
    
        # Environment isolation for child workflows
        isolated_environments:
          disabled: true
          memory_sharing:
            mode: shared_with_limits
            limit_per_workflow_mb: 2048
            swap_on_conflict: true
            conflict_resolution: last_writer_wins
          file_system_isolation:
            workspace_mode: shared
            temp_dir_pattern: ./tmp/workflow_${workflow_id}_*/
            cleanup_on_completion: true
            allowed_shared_paths:
              - ./workspace/shared
          state_sharing:
            mechanism: file_based
            state_directory: ./workflow_states/${workflow_id}/
            merge_strategy: union
            validate_state: true
    
        # Circular reference detection
        circular_reference_detection:
          max_depth: 3
          on_circular_reference:
            action: fail_workflow
            log_error: true
            notify_user: true
    
        # Parallel execution of child workflows
        max_parallel_workflows: 3
        parallel_group_timeout_secs: 600
        inter_workflow_dependencies:
          dependency_timeout_secs: 300
    
      synchronization:
        coordination:
          barrier_sync:
            timeout_secs: 120
          lock_free_timeout_secs: 30
          deadlock_detection: true
          deadlock_resolution_timeout_secs: 120
        conflict_handling:
          max_concurrent_writers: 1
          resolution_strategy: last_writer_wins
          on_conflict: log
        event_propagation:
          mode: bidirectional
          propagation_delay_ms: 100
        validation_aggregation:
          strategy: hierarchical
          aggregation_timeout_secs: 30
    
      # ── GENERAL EXECUTION ────────────────────────────────────────────────────
      load_unload: lazy
      processing: parallel
    
      parallel:
        algorithm: priority_queue
        max_threads: 6
        max_models: 2
    
      timeout:
        total: 2h
        per_operation:
          step: 15m
          sub_workflow: 10m
          tool_call: 5m
    
      error_handling:
        default_action:
          type: retry
          reason: "Retry on sub-workflow failures"
        retry:
          max_attempts_per_step: 3
          backoff_strategy:
            type: exponential
            base_delay_ms: 1000
            max_delay_ms: 30000
            jitter_factor: 0.2
        handling_by_type:
          transient_failures:
            action: retry_with_exponential_backoff
            notify_level: warning
          permanent_failures:
            action: log_and_continue
            notify_level: error
    
      checkpointing:
        configuration:
          level: info
          output_path: ./workspace/checkpoints/composition_checkpoint.json
        triggers:
          on_failure: create
          on_timeout: create
    
    # ── ORCHESTRATION CONFIGURATION ──────────────────────────────────────────────
    orchestration:
      step_coordination:
        max_concurrent_steps: 10
        step_priority: fifo
        inter_step_dependencies:
          resolution_strategy: wait_for_all
          dependency_timeout_secs: 300
        wait_strategy: eager
        event_propagation_delay_ms: 100
    
      sub_agent_orchestration:
        sub_agents:
          - id: data_ingestion_sub
            name: "Data Ingestion Sub-Agent"
            description: "Multi-source data ingestion and normalization"
            workflow_ref: data_ingestion
            alias: ingestion
            validation_config:
              # type: inferred from loop key
              max_iterations: 3
              tolerance: 0.05
            interdependent_validations:
              - depends_on: [data_processing_sub]
                validation_criteria:
                  metric: ingestion_quality
                  operator: ">="
                  target: 0.85
                on_failure: relax_criteria
                relaxation_factor: 0.10
    
          - id: data_processing_sub
            name: "Data Processing Sub-Agent"
            description: "Data transformation and enrichment"
            workflow_ref: data_processing
            alias: processing
            validation_config:
              # type: inferred from loop key
              max_iterations: 4
              tolerance: 0.03
            interdependent_validations:
              - depends_on: [quality_validation_sub]
                validation_criteria:
                  metric: processing_efficiency
                  operator: ">="
                  target: 0.90
                on_failure: skip_dependent
    
          - id: quality_validation_sub
            name: "Quality Validation Sub-Agent"
            description: "Multi-level quality checks and validation"
            workflow_ref: quality_validation
            alias: validator
            validation_config:
              # type: inferred from loop key
              max_iterations: 5
              tolerance: 0.02
            interdependent_validations:
              - depends_on: [reporting_aggregation_sub]
                validation_criteria:
                  metric: quality_score
                  operator: ">="
                  target: 0.95
                on_failure: fail_workflow
    
          - id: reporting_aggregation_sub
            name: "Reporting Aggregation Sub-Agent"
            description: "Multi-format report generation and aggregation"
            workflow_ref: reporting_aggregation
            alias: reporter
    
        event_handling:
          on_validation_result:
            aggregate_at_top_level: true
            propagate_to_dependents: true
            log_result: true
          on_interdependent_failure:
            notify_dependent_sub_agents: true
            adjust_validation_criteria: true
            propagate_failure_up: true
            retry_affected_sub_agents: true
          on_checkpoint:
            save_state_snapshot: true
            notify_all_sub_agents: true
            track_version: true
    
      validation_aggregation:
        strategy: hierarchical
        overall_validation_criteria:
          - name: data_quality_score
            weight: 0.30
            required: true
            threshold: 0.90
          - name: processing_efficiency
            weight: 0.25
            required: true
            threshold: 0.85
          - name: all_sub_workflows_valid
            weight: 0.25
            required: true
          - name: performance_acceptable
            weight: 0.20
            required: true
            threshold: 0.85
        overall_threshold: 0.85
        min_metrics_required: 4
    
      checkpoint_coordination:
        interval_steps: 3
        on_checkpoint:
          notify_all_sub_agents: true
          save_global_state: true
          increment_version: true
    
    # ── METRICS COLLECTION ──────────────────────────────────────────────────────
    metrics:
      collection:
        workflow_level:
          - total_execution_time_secs
          - parallel_efficiency
          - sub_workflow_count
        step_level:
          - execution_time_secs
          - memory_peak_mb
          - iterations_count
        sub_workflow_level:
          - invocation_count
          - parameter_passing_time_ms
          - output_capture_size_bytes
        custom_metrics:
          - name: composition_depth
            description: "Depth of workflow composition"
          - name: policy_inheritance_count
            description: "Number of policies inherited"
          - name: circular_reference_check_time_ms
            description: "Time spent in circular reference detection"
      output:
        path: ./workspace/metrics/composition_metrics.json
        format: json
        include_timestamps: true
    
    # ── VALIDATION CONFIGURATION ────────────────────────────────────────────────
    validation:
      workflow_schema:
        required_fields:
          - workflow_id
          - name
          - sub_workflows
          - agentic_workflow
    
      sub_workflow_composition:
        validate_workflow_refs: true
        validate_policy_inheritance: true
        validate_circular_detection: true
    
      composition_validation:
        validate_dependencies: true
        validate_parallel_groups: true
        max_composition_depth: 5
    
