---
workflow_id: cpu_gpu_scheduling
name: CPU and GPU Scheduling and Prioritization
description: Demonstrates CPU and GPU scheduling algorithms, step prioritization, and priority queue management
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - resource-management
  - cpu-gpu-scheduling
  - prioritization
  - resource-scheduling

models:
  scheduler_agent:
    name: "Scheduler Agent"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

step_prioritization:
  enabled: true
  
  priority_levels:
    - name: critical
      weight: 10
    
    - name: high
      weight: 5
    
    - name: medium
      weight: 3
    
    - name: low
      weight: 1
  
  scheduling_modes:
    round_robin: Round-robin through priority levels
    priority_queue: Priority queue for dynamic priority changes
    shortest_job_first: Execute shortest job first
    longest_job_first: Execute longest job first

agentic_workflow:
  step_1_configure_scheduler:
    name: "Configure Scheduler"
    type: agent
    model: "${models.scheduler_agent}"
    
    input:
      prompt: |
        Configure scheduling and prioritization.
        
        Scheduling configuration:
        1. Algorithm: round_robin
        2. Mode: serial with priority support
        3. Priority queue: enabled for dynamic changes
        4. CPU cores: detect and allocate
        5. GPU availability: check
        6. Time slice: 10s per task
        7. Preemptive: disabled (non-interruptible)
        
        Worker configuration:
        - Define priority levels (critical, high, medium, low)
        - Set scheduling algorithms
        - Configure queue management
        - Set time slicing policy
        
        Priority level definitions:
        - Critical: blocks other tasks, immediate execution
        - High: preferential treatment, urgent completion
        - Medium: balanced priority, flexible scheduling
        - Low: background when system idle
        
        Return scheduler configuration with priority levels.
    
    output:
      save_to: scheduler_config
      format: json

  step_2_critical_priority_task:
    name: "Critical Priority Task"
    type: agent
    model: "${models.scheduler_agent}"
    
    input:
      prompt: |
        Execute critical priority task.
        
        Critical task:
        - Type: model inference with large context
        - Priority: critical (weight 10)
        - Resources: dedicated CPU cores, VRAM access
        - Timeout: 120 seconds max
        - Preemptive: can interrupt other tasks
        
        Execution requirements:
        - 1. Allocate 50% CPU cores
        2. Allocate 4GB VRAM
        3. Set high process priority
        4. Enable CPU performance mode
        5. Monitor resource usage
        
        Success criteria:
        - Complete within 120 seconds
        - Resource usage within limits
        - Model output quality threshold
        
        Return critical task results with resource metrics.
    
    output:
      save_to: critical_task_result
      format: json

  step_3_high_priority_batch:
    name: "High Priority Batch Processing"
    type: agent
    model: "${models.scheduler_agent}"
    
    input:
      prompt: |
        Execute high priority batch tasks.
        
        Batch tasks:
        - Type: Data processing with moderate context
        - Priority: high (weight 5)
        - Count: 4 parallel tasks
        - Resources: 30% CPU cores, 2GB VRAM
        - Timeout: 300 seconds each
        - Parallel execution enabled
        
        Batch requirements:
        - Process all tasks within timeout
        - Maintain task priorities within batch
        - Fair resource allocation
        - Monitor individual task progress
        
        Parallelization:
        - Execute 4 tasks in parallel
        - Monitor each task completion time
        - Start next task when slot available
        
        Return batch processing results with timing.
    
    output:
      save_to: high_priority_batch
      format: json

  step_4_gpu_allocation:
    name: "GPU Resource Allocation"
    type: agent
    model: "${models.scheduler_agent}"
    
    input:
      prompt: |
        Allocate GPU resources for model inference.
        
        GPU tasks:
        - Type: Model inference with GPU acceleration
        - Priority: critical (weight 10)
        - Resources: 75% GPU, full VRAM access
        - Batch size: 2 models
        
        GPU allocation:
        - Allocate 75% of GPU VRAM
        - Enable GPU access for 2 models
        - Set GPU power management profile
        - Monitor GPU memory usage
        - Handle GPU-specific errors
        
        GPU requirements:
        - Compatible backends (Vulkan, CUDA)
        - Sufficient VRAM size (at least 4GB)
        - Model supports GPU acceleration
        - Driver installation if needed
        
        Return GPU allocation results with utilization metrics.
    
    output:
      save_to: gpu_allocation
      format: json

  step_5_adaptive_scheduling:
    name: "Adaptive Scheduling Example"
    type: agent
    model: "${models.scheduler_agent}"
    
    input:
      prompt: |
        Demonstrate adaptive scheduling with priority changes.
        
        Adaptive scenarios:
        1. New high-priority task arrives: interrupt low-priority
        2. System resource pressure detected: throttle low-priority tasks
        3. Long-running task completes early: reallocate resources
        4. Resource becomes available: queue waiting tasks
        5. Adaptive time slicing based on workload
        
        Priority handling:
        - Dynamic priority queue management
        - Real-time priority adjustment
        - Priority promotion: low to medium if starved
        - Priority demotion: high to medium if underutilizing
        
        Adaptive scheduling:
        - Reorder queue based on new priorities
        - Time slice adjustment for CPU
        - Preempt low-priority tasks for critical
        - Maintain fairness across priorities
        
        Performance metrics:
        - Wait time per priority level
        - Completion time by priority
        - Resource utilization by priority
        - Starvation detection and prevention
        
        Return adaptive scheduling demonstration with metrics.
    
    output:
      save_to: adaptive_scheduling
      format: json

  step_6_scheduling_metrics:
    name: "Collect Scheduling Metrics"
    type: agent
    model: "${models.scheduler_agent}"
    
    input:
      variables:
        critical: "${step.step_2_critical_priority_task.output}"
        high: "${step.step_3_high_priority_batch.output}"
        gpu: "${step.step_4_gpu_allocation.output}"
        adaptive: "${step.step_5_adaptive_scheduling.output}"
    
      prompt: |
        Collect and analyze scheduling metrics.
        
        Metrics to collect:
        - Wait time by priority level
        - Queue depth per priority
        - Preemptive events and frequency
        - Resource utilization by task type
        - Task completion time distribution
        - Average CPU and GPU usage
        - Priority queue efficiency
        
        Analysis:
        - Was scheduling fair across priorities?
        - Were critical tasks prioritized?
        - Did adaptive scheduling improve throughput?
        - Resource contention patterns
        
        Generate scheduling metrics report.
    
    output:
      save_to: scheduling_metrics
      format: json
      file_output:
        enabled: true
        path: /workspace/output/scheduling-metrics.json

logging:
  enabled: true
  
  levels:
    default: info
    resource_management: debug
  
  scopes:
    resource_management:
      enabled: true
      include_scheduling_events: true
      include_prioritization: true
      include_resource_usage: true
  
  output:
    console:
      enabled: true
    
    file:
      enabled: true
      path: /workspace/logs/cpu-gpu-scheduling.log

error_handling:
  default_action:
    type: requeue
    reason: "Task failures trigger requeue based on priority"

  handling_by_type:
    timeout_error:
      action: lower_priority
      notify_level: warning
    
    resource_contention:
      action: wait_for_resources
      notify_level: warning
    
    scheduling_conflict:
      action: use_priority_queue
      notify_level: error