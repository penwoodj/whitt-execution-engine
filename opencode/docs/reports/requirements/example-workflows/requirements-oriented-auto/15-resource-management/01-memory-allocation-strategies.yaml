---
workflow_id: memory_allocation_strategies
name: Memory Allocation Strategies
description: Demonstrates static, dynamic, and adaptive memory allocation strategies with resource limits and monitoring
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - resource-management
  - memory-allocation
  - allocation-strategies
  - resource-limits

models:
  resource_agent:
    name: "Resource Manager"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

resource_allocation:
  strategy: dynamic
  
  allocation:
    max_allowed:
      ram: 25%
      vram: 6GB
      cpu: 60%
      gpu: 50%
    
    min_allowed:
      ram: 15%
      vram: 2GB
      cpu: 20%
      gpu: 25%
    
    allocation_strategy: dynamic
    reserved_overhead_percent: 15

agentic_workflow:
  step_1_initialize_dynamic_allocation:
    name: "Initialize Dynamic Allocation"
    type: agent
    model: "${models.resource_agent}"
    
    input:
      prompt: |
        Initialize dynamic memory allocation.
        
        System scan:
        1. Detect available system resources
        2. Check available memory (RAM)
        3. Check available VRAM (if applicable)
        4. Check CPU core count
        5. Verify GPU availability
        6. Check current resource usage
        
        Available resources:
        - Total system RAM: detect
        - Free RAM: calculate
        - Swap availability: check
        - CPU capacity: cores, frequency
        - VRAM: size, type (if present)
        
        Initial allocation:
        - Allocate 20% of RAM for workflow
        - Allocate 3GB VRAM (if available)
        - Allocate 40% CPU
        - Set reserved 15% overhead
        - Document initial allocation
        
        Return resource scan results with allocation plan.
    
    output:
      save_to: resource_scan
      format: json

  step_2_static_allocation:
    name: "Static Allocation Example"
    type: agent
    model: "${models.resource_agent}"
    
    input:
      prompt: |
        Demonstrate static allocation strategy.
        
        Static allocation:
        - Pre-allocate all required resources at workflow start
        - Fixed memory allocation: 8GB RAM
        - Fixed VRAM: 4GB
        - Fixed CPU: 50%
        - No dynamic adjustment during execution
        - Reserved: 15% overhead for system
        
        Static characteristics:
        - Predictable resource usage
        - No allocation overhead during execution
        - Simpler resource planning
        - Higher initial memory footprint
        - May underutilize resources
        
        Compare static vs dynamic:
        - Memory footprint: static > dynamic
        - Resource utilization: static < dynamic
        - Flexibility: dynamic > static
        
        Return static allocation comparison.
    
    output:
      save_to: static_allocation
      format: json

  step_3_adaptive_allocation:
    name: "Adaptive Allocation with Monitoring"
    type: agent
    model: "${models.resource_agent}"
    
    input:
      prompt: |
        Demonstrate adaptive allocation with resource monitoring.
        
        Adaptive allocation:
        - Start with conservative allocation
        - Monitor resource pressure during execution
        - Increase allocation under pressure
        - Decrease allocation when idle
        - Maintain target utilization: 70-80%
        - Respond to memory pressure spikes
        
        Monitoring configuration:
        - Monitor memory usage every 5 seconds
        - Monitor CPU usage continuously
        - Check for memory leaks
        - Track resource contention
        - Alert on resource exhaustion
        
        Adaptive logic:
        - Calculate memory pressure: (used / max_allowed)
        - Pressure < 70%: increase allocation
        - Pressure 70-85%: consider scaling
        - Pressure > 85%: aggressive cleanup or throttling
        - Pressure > 95%: emergency release
        
        Return adaptive allocation demonstration with monitoring results.
    
    output:
      save_to: adaptive_allocation
      format: json

  step_4_resource_limits_and_throttling:
    name: "Resource Limits and Throttling"
    type: agent
    model: "${models.resource_agent}"
    
    input:
      prompt: |
        Demonstrate resource limits and throttling mechanisms.
        
        Resource limits configuration:
        - Maximum allowed: 25% RAM, 6GB VRAM
        - Minimum required: 15% RAM, 2GB VRAM
        - Per-step limits: max 8GB RAM per step
        - Per-model limits: max 4GB VRAM per model
        - Throttling threshold: 85% memory pressure
        - OOM behavior: graceful degradation
        
        Throttling strategies:
        1. Memory pressure monitoring: check every 5s
        2. Adaptive throttling: reduce concurrency under pressure
        3. Step queuing: delay execution when pressure high
        4. OOM handling: trigger cleanup before limit
        5. Graceful degradation: serve partial results
        
        OOM prevention:
        - Monitor memory trends
        - Predict OOM conditions
        - Reduce memory footprint before limit
        - Release unused resources
        
        Resource limit enforcement:
        - Enforce maximum allowed limits
        - Implement per-step limits
        - Throttle aggressive resource requests
        - Kill processes exceeding limits
        
        Return throttling demonstration.
    
    output:
      save_to: throttling_config
      format: json

  step_5_comparison_summary:
    name: "Generate Allocation Strategy Comparison"
    type: agent
    model: "${models.resource_agent}"
    
    input:
      variables:
        static_result: "${step.step_2_static_allocation.output}"
        adaptive_result: "${step.step_3_adaptive_allocation.output}"
        limits: "${step.step_4_resource_limits_and_throttling.output}"
        scan: "${step.step_1_initialize_dynamic_allocation.output}"
      
      prompt: |
        Compare allocation strategies and generate summary.
        
        Comparison criteria:
        1. Memory efficiency (used / allocated)
        2. Resource utilization (CPU, GPU usage)
        3. Flexibility (adaptability to workload)
        4. Simplicity (configuration overhead)
        5. Predictability (resource usage patterns)
        
        Strategy recommendation:
        - Choose based on workload characteristics
        - Static for predictable workloads
        - Dynamic for variable workloads
        - Adaptive for critical workloads
        
        Metrics:
        - Total memory allocated vs utilized
        - Peak vs average memory usage
        - Allocation frequency
        - Throttling events
        - OOM occurrences
        
        Generate comprehensive comparison report.
    
    output:
      save_to: comparison_report
      format: json
      file_output:
        enabled: true
        path: /workspace/output/allocation-comparison.md

logging:
  enabled: true
  
  levels:
    default: info
    resource_management: debug
  
  scopes:
    resource_management:
      enabled: true
      include_allocation_events: true
      include_monitoring_data: true
      include_throttling_events: true
  
  output:
    console:
      enabled: true
    
    file:
      enabled: true
      path: /workspace/logs/resource-allocation.log

error_handling:
  default_action:
    type: throttle
    reason: "Resource pressure triggers throttling"

  handling_by_type:
    memory_exceeded:
      action: throttle_decrease
      notify_level: warning
    
    oom_detected:
      action: graceful_degradation
      notify_level: error
    
    resource_contention:
      action: kill_process
      notify_level: critical