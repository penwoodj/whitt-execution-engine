---
workflow_id: model_cost_tracking_budgets
name: Model Cost Tracking and Budget Management
description: Workflow demonstrating token cost tracking, budget limits, cost optimization strategies, and spend monitoring across model usage
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - cost-tracking
  - budget-limits
  - token-optimization
  - spend-monitoring
  - resource-economics

models:
  cost_optimized_model:
    name: "Cost-Optimized Processing Model"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan
    gpu_layers: 32
    
    cost_tracking:
      token_counting: accurate
      include_input_tokens: true
      include_output_tokens: true
      include_thinking_tokens: true
    
    budget:
      max_tokens_per_request: 4096
      max_tokens_per_session: 100000
      max_requests_per_hour: 100
      max_cost_per_request_usd: 0.01
      max_cost_per_session_usd: 1.00
    
    parameters:
      temperature: 0.5
      max_tokens: 4096
      min_tokens: 100

  premium_model:
    name: "Premium Quality Model"
    host:
      type: openai_compatible
      connection_settings:
        api_base: "https://api.openai.com/v1"
        api_key_env: "OPENAI_API_KEY"
    generative_entity: "gpt-4o-mini"
    
    cost_tracking:
      token_counting: accurate
      pricing:
        input_per_1k_tokens: 0.00015
        output_per_1k_tokens: 0.0006
        thinking_per_1k_tokens: 0.0
    
    budget:
      max_tokens_per_request: 8192
      max_tokens_per_day: 500000
      max_cost_per_request_usd: 0.10
      max_cost_per_day_usd: 5.00
      alert_threshold_percent: 75
    
    parameters:
      temperature: 0.7
      max_tokens: 4096

  local_free_model:
    name: "Zero-Cost Local Model"
    host:
      type: ollama
      connection_settings:
        base_url: "http://localhost:11434"
    generative_entity: "llama3.2"
    backend: cpu
    
    cost_tracking:
      token_counting: accurate
      pricing:
        input_per_1k_tokens: 0.0
        output_per_1k_tokens: 0.0
    
    budget:
      max_tokens_per_request: 8192
      unlimited_local: true

workflow_budget:
  global_limits:
    max_total_tokens: 2000000
    max_total_cost_usd: 10.00
    max_requests_total: 500
  
  per_workflow_limits:
    max_tokens: 500000
    max_cost_usd: 2.50
    max_requests: 100
  
  alerts:
    thresholds:
      - percent: 50
        action: log
        message: "50% of budget consumed"
      - percent: 75
        action: warn_and_log
        message: "75% of budget consumed - consider optimization"
      - percent: 90
        action: warn_and_throttle
        message: "90% of budget consumed - throttling enabled"
      - percent: 100
        action: block
        message: "Budget exhausted - workflow halted"
  
  cost_optimization:
    strategy: prioritize_free_models
    fallback_chain:
      - local_free_model
      - cost_optimized_model
      - premium_model
    
    token_saving_techniques:
      - prompt_compression: true
      - context_window_optimization: true
      - response_truncation: false
      - caching_enabled: true
    
    routing_rules:
      simple_tasks: local_free_model
      moderate_tasks: cost_optimized_model
      complex_tasks: premium_model

execution:
  mode: hybrid
  cost_aware: true
  budget_enforcement: strict
  memory:
    max_allocated_memory_mb: 8192
    model_memory_mb: 4096
    unload_unused: true

logging:
  global:
    level: info
    detail: medium
    output_type: chat
    format: json
    console: true
    file: true
    log_file: ./workspace/logs/cost_tracking.log
  
  cost_tracking:
    level: debug
    detail: very_high
    include_token_counts: true
    include_cost_breakdown: true
    include_budget_status: true

agentic_workflow:
  steps:
    - step: budget_initialization
      id: step_1_init
      generative_entity: "${models.local_free_model}"
      # type: inferred from prompt + generative_entity
      
      prompt: |
        Initialize cost tracking and budget management system:
        
        Workflow budget configuration:
        - Global token limit: ${workflow_budget.global_limits.max_total_tokens}
        - Global cost limit: $${workflow_budget.global_limits.max_total_cost_usd}
        - Per-workflow token limit: ${workflow_budget.per_workflow_limits.max_tokens}
        - Per-workflow cost limit: $${workflow_budget.per_workflow_limits.max_cost_usd}
        
        Initialize:
        1. Cost tracking counters
        2. Budget alert thresholds
        3. Token counting system
        4. Cost optimization rules
        
        Output current budget state.

      budget_config: "${workflow_budget}"

      when:


        after_step_succeeds:


          save_to: budget_state          - budget_initialized
          - token_limit_remaining
          - cost_limit_remaining
          - alert_thresholds_configured

    - step: cost_efficient_analysis
      id: step_2_analysis
      generative_entity: "${models.cost_optimized_model}"
      # type: inferred from prompt + generative_entity
      
      prompt: |
        Perform code analysis using cost-optimized model:
        
        Analyze the following codebase:
        Path: ./workspace/src
        
        Requirements:
        1. Identify main components
        2. Analyze code structure
        3. Generate improvement suggestions
        4. Keep token usage within budget
        
        Budget constraints:
        - Max tokens for this task: 4000
        - Target token efficiency: maximize information per token
        
        Cost tracking:
        - Track input tokens
        - Track output tokens
        - Calculate estimated cost

      code_path: ./workspace/src
      
      cost_constraints:
        max_input_tokens: 2000
        max_output_tokens: 2000
        cost_alert_threshold: 0.005

      when:


        after_step_succeeds:


          save_to: analysis_results          - components
          - structure_analysis
          - suggestions
          - token_usage
          - estimated_cost_usd

    - step: budget_check
      id: step_3_check
      generative_entity: "${models.local_free_model}"
      # type: inferred from prompt + generative_entity
      
      prompt: |
        Check current budget status after analysis task:
        
        Previous task cost:
        ${step.step_2_analysis.output.token_usage}
        Estimated cost: $${step.step_2_analysis.output.estimated_cost_usd}
        
        Calculate:
        1. Tokens consumed so far
        2. Cost consumed so far
        3. Remaining budget
        4. Budget utilization percentage
        
        Determine if premium model can be used for next task.

      previous_usage: "${step.step_2_analysis.output}"

      when:


        after_step_succeeds:


          save_to: budget_check_result          - total_tokens_used
          - total_cost_usd
          - remaining_tokens
          - remaining_cost_usd
          - budget_utilization_percent
          - premium_model_allowed

    - step: premium_task_with_budget
      id: step_4_premium
      generative_entity: "${models.premium_model}"
      # type: inferred from prompt + generative_entity
      
      prompt: |
        Perform premium quality validation using budget-constrained premium model:
        
        Analysis to validate:
        ${step.step_2_analysis.output}
        
        Budget check:
        ${step.step_3_check.output}
        
        Tasks:
        1. Validate analysis completeness
        2. Assess suggestion quality
        3. Add expert recommendations
        4. Generate executive summary
        
        Strict budget constraints:
        - Max input tokens: 3000
        - Max output tokens: 2000
        - Do not exceed allocated budget

      analysis_data: "${step.step_2_analysis.output}"
      budget_status: "${step.step_3_check.output}"
      
      cost_constraints:
        max_input_tokens: 3000
        max_output_tokens: 2000
        hard_budget_limit: true

      when:


        after_step_succeeds:


          save_to: premium_validation          - validation_results
          - quality_score
          - expert_recommendations
          - executive_summary
          - token_usage
          - actual_cost_usd

    - step: token_optimization_demo
      id: step_5_optimize
      generative_entity: "${models.local_free_model}"
      # type: inferred from prompt + generative_entity
      
      prompt: |
        Demonstrate token optimization techniques:
        
        Compare token usage across different prompt styles:
        
        1. Verbose prompt (original):
        "Please carefully analyze the following codebase and provide a comprehensive assessment..."
        
        2. Optimized prompt (compressed):
        "Analyze codebase. Output: structure, issues, suggestions."
        
        Calculate token savings:
        - Verbose tokens: count original prompt
        - Optimized tokens: count compressed prompt
        - Savings percentage: calculate improvement
        
        Show token optimization best practices.

      when:


        after_step_succeeds:


          save_to: optimization_demo          - verbose_token_count
          - optimized_token_count
          - token_savings_percent
          - best_practices

    - step: cost_report_generation
      id: step_6_report
      generative_entity: "${models.local_free_model}"
      # type: inferred from prompt + generative_entity
      
      prompt: |
        Generate comprehensive cost tracking report:
        
        Task costs:
        - Step 2 (Analysis): ${step.step_2_analysis.output.token_usage} tokens, $${step.step_2_analysis.output.estimated_cost_usd}
        - Step 4 (Premium): ${step.step_4_premium.output.token_usage} tokens, $${step.step_4_premium.output.actual_cost_usd}
        
        Budget summary:
        - Initial budget: ${workflow_budget.per_workflow_limits.max_tokens} tokens, $${workflow_budget.per_workflow_limits.max_cost_usd}
        - Total consumed: [calculate]
        - Remaining: [calculate]
        
        Generate report including:
        1. Per-task cost breakdown
        2. Model cost comparison
        3. Budget utilization
        4. Cost optimization recommendations
        5. ROI analysis (quality vs cost)

      task_costs:
        analysis: "${step.step_2_analysis.output}"
        premium: "${step.step_4_premium.output}"
      budget_config: "${workflow_budget}"

      when:


        after_step_succeeds:


          save_to: cost_report        file_output:
          path: ./workspace/output/cost_tracking_report.md
          encoding: utf-8
        fields:
          - total_tokens_used
          - total_cost_usd
          - cost_breakdown_by_task
          - model_cost_comparison
          - budget_utilization
          - optimization_recommendations

retry:
  default:
    max_attempts: 3
    backoff: exponential
    on_failure: escalate_model
  
  budget_exceeded:
    strategy: switch_to_free_model
    fallback: "${models.local_free_model}"
    notify_user: true

metrics:
  collect:
    - total_input_tokens
    - total_output_tokens
    - total_thinking_tokens
    - total_cost_usd
    - cost_per_task
    - tokens_per_request
    - cost_efficiency_ratio
    - budget_utilization_percent