---
workflow_id: model_parameters_tuning
name: Model Parameters and Generation Tuning
description: Workflow demonstrating fine-grained control over model generation parameters including temperature, tokens, and sampling strategies
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - model-parameters
  - temperature
  - sampling
  - generation-control
  - token-limits

models:
  creative_writer:
    name: "Creative Writing Model"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan
    gpu_layers: 32
    
    parameters:
      temperature: 0.8
      top_p: 0.95
      top_k: 40
      frequency_penalty: 0.5
      presence_penalty: 0.3
      max_tokens: 4096
      min_tokens: 100
      stop_sequences:
        - "\n\n---"
        - "END OF OUTPUT"
      repeat_penalty: 1.1

  precise_analyzer:
    name: "Precise Analysis Model"
    host:
      type: ollama
      connection_settings:
        base_url: "http://localhost:11434"
    generative_entity: "llama3.2"
    backend: cpu
    
    parameters:
      temperature: 0.1
      top_p: 0.9
      top_k: 10
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: 2048
      min_tokens: 50
      repeat_penalty: 1.0

  balanced_assistant:
    name: "Balanced General Model"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan
    
    parameters:
      temperature: 0.5
      top_p: 0.92
      top_k: 25
      frequency_penalty: 0.2
      presence_penalty: 0.1
      max_tokens: 3072
      min_tokens: 75
      repeat_penalty: 1.05

  code_generator:
    name: "Code Generation Model"
    host:
      type: ollama
      connection_settings:
        base_url: "http://localhost:11434"
    generative_entity: "llama3.2"
    backend: cpu
    
    parameters:
      temperature: 0.3
      top_p: 0.95
      top_k: 20
      frequency_penalty: 0.3
      presence_penalty: 0.2
      max_tokens: 8192
      min_tokens: 200
      stop_sequences:
        - "```"
        - "END CODE"
      repeat_penalty: 1.15

execution:
  mode: serial
  memory:
    max_allocated_memory_mb: 8192
    model_memory_mb: 4096
    unload_unused: true

logging:
  global:
    level: debug
    detail: high
    output_type: chat
    format: json
    console: true
    file: true
    log_file: ./workspace/logs/model_parameters.log
  models:
    level: debug
    detail: very_high
    include_parameters: true
    include_token_usage: true

agentic_workflow:
  steps:
    - step: creative_writing_task
      id: step_1
      generative_entity: "${models.creative_writer}"
      type: agent
      
      prompt: |
        Generate a creative story introduction about a software developer who discovers an AI assistant.
        
        Requirements:
        - Engaging opening hook
        - Character development
        - Setting description
        - Approximately 300-500 words
        
        Use high temperature (0.8) for creative variations.

      output:
        save_to: creative_output
        format: text
        fields:
          - story_text
          - word_count
          - model_used
          - parameters_used

    - step: precise_analysis_task
      id: step_2
      generative_entity: "${models.precise_analyzer}"
      type: agent
      
      prompt: |
        Analyze the following creative text for technical accuracy and logical consistency:
        
        Text to analyze:
        ${step.step_1.output.story_text}
        
        Provide:
        1. Factual consistency score (0-100)
        2. Logical flow score (0-100)
        3. Any technical inaccuracies found
        4. Suggestions for improvement
        
        Use low temperature (0.1) for consistent, precise analysis.

      creative_text: "${step.step_1.output.story_text}"

      output:
        save_to: analysis_output
        format: json
        fields:
          - factual_score
          - logical_score
          - inaccuracies
          - suggestions
          - model_used
          - parameters_used

    - step: balanced_refinement_task
      id: step_3
      generative_entity: "${models.balanced_assistant}"
      type: agent
      
      prompt: |
        Refine the creative story based on the analysis:
        
        Original story:
        ${step.step_1.output.story_text}
        
        Analysis results:
        ${step.step_2.output}
        
        Refinement goals:
        1. Fix any technical inaccuracies
        2. Improve logical flow
        3. Maintain creative quality
        4. Keep the engaging narrative style
        
        Use balanced temperature (0.5) for measured improvements.

      original_story: "${step.step_1.output.story_text}"
      analysis: "${step.step_2.output}"

      output:
        save_to: refined_output
        format: text
        fields:
          - refined_text
          - changes_made
          - improvement_summary
          - model_used
          - parameters_used

    - step: code_generation_task
      id: step_4
      generative_entity: "${models.code_generator}"
      type: agent
      
      prompt: |
        Generate Python code that implements a simple text analyzer based on the analysis criteria used in step 2.
        
        Requirements:
        - Class-based design
        - Methods for factual consistency checking
        - Methods for logical flow analysis
        - Return structured results
        - Include type hints
        - Add docstrings
        
        Use code-optimized parameters (temperature 0.3) for consistent code generation.

      output:
        save_to: generated_code
        format: text
        file_output:
          enabled: true
          path: ./workspace/output/text_analyzer.py
          encoding: utf-8
        fields:
          - code
          - line_count
          - model_used
          - parameters_used

    - step: parameter_comparison_report
      id: step_5
      generative_entity: "${models.precise_analyzer}"
      type: agent
      
      prompt: |
        Generate a comparison report of how different model parameters affected the outputs:
        
        Creative output (temp=0.8):
        Model: ${step.step_1.output.model_used}
        Parameters: ${step.step_1.output.parameters_used}
        
        Analysis output (temp=0.1):
        Model: ${step.step_2.output.model_used}
        Parameters: ${step.step_2.output.parameters_used}
        
        Refined output (temp=0.5):
        Model: ${step.step_3.output.model_used}
        Parameters: ${step.step_3.output.parameters_used}
        
        Code output (temp=0.3):
        Model: ${step.step_4.output.model_used}
        Parameters: ${step.step_4.output.parameters_used}
        
        Compare:
        1. How temperature affected creativity vs precision
        2. How top_p influenced diversity
        3. How frequency_penalty reduced repetition
        4. How max_tokens limited output length
        5. Trade-offs between parameter settings

      step1_output: "${step.step_1.output}"
      step2_output: "${step.step_2.output}"
      step3_output: "${step.step_3.output}"
      step4_output: "${step.step_4.output}"

      output:
        save_to: comparison_report
        format: markdown
        file_output:
          enabled: true
          path: ./workspace/output/parameter_comparison.md
          encoding: utf-8

retry:
  default:
    max_attempts: 3
    backoff: exponential
    on_failure: escalate_model

metrics:
  enabled: true
  collect:
    - model_temperature_used
    - model_top_p_used
    - model_max_tokens_used
    - actual_tokens_generated
    - generation_time_ms
    - token_generation_rate
  output:
    path: ./workspace/metrics/parameter_tuning_metrics.json
    format: json

parameter_documentation:
  temperature:
    description: "Controls randomness in output generation"
    range: "0.0 - 2.0"
    low_value: "0.0-0.3: Deterministic, consistent outputs"
    medium_value: "0.4-0.7: Balanced creativity and coherence"
    high_value: "0.8-1.0+: Creative, diverse outputs"
    
  top_p:
    description: "Nucleus sampling - cumulative probability threshold"
    range: "0.0 - 1.0"
    low_value: "0.1-0.5: Conservative token selection"
    medium_value: "0.6-0.8: Balanced selection"
    high_value: "0.9-1.0: Diverse token selection"
    
  top_k:
    description: "Limits token selection to top K most likely tokens"
    range: "1 - 100+"
    low_value: "1-10: Very focused outputs"
    medium_value: "20-40: Balanced focus"
    high_value: "50+: More diverse options"
    
  frequency_penalty:
    description: "Penalizes tokens based on frequency in output"
    range: "-2.0 - 2.0"
    low_value: "0.0: No penalty"
    medium_value: "0.5: Moderate repetition reduction"
    high_value: "1.0+: Strong repetition avoidance"
    
  presence_penalty:
    description: "Penalizes tokens that have appeared at all"
    range: "-2.0 - 2.0"
    low_value: "0.0: No penalty"
    medium_value: "0.5: Encourages topic diversity"
    high_value: "1.0+: Strong topic diversity"
    
  max_tokens:
    description: "Maximum number of tokens to generate"
    range: "1 - model context limit"
    recommendation: "Set based on expected output length"
    
  min_tokens:
    description: "Minimum number of tokens to generate"
    range: "0 - max_tokens"
    recommendation: "Use to ensure sufficient output length"
    
  repeat_penalty:
    description: "Overall penalty for repeating content"
    range: "1.0 - 2.0"
    low_value: "1.0: No penalty"
    medium_value: "1.1-1.2: Mild repetition reduction"
    high_value: "1.3+: Strong repetition penalty"
    
  stop_sequences:
    description: "Custom sequences that stop generation"
    type: "Array of strings"
    examples: ["\n\n", "END", "```", "---"]

features_demonstrated:
  temperature_control:
    creative: 0.8
    precise: 0.1
    balanced: 0.5
    code: 0.3
    
  sampling_strategies:
    top_p: [0.9, 0.92, 0.95]
    top_k: [10, 20, 25, 40]
    
  penalty_parameters:
    frequency_penalty: [0.0, 0.2, 0.3, 0.5]
    presence_penalty: [0.0, 0.1, 0.2, 0.3]
    repeat_penalty: [1.0, 1.05, 1.1, 1.15]
    
  token_limits:
    max_tokens: [2048, 3072, 4096, 8192]
    min_tokens: [50, 75, 100, 200]
    
  stop_sequences:
    enabled: true
    custom_sequences: true
