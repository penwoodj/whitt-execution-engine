---
workflow_id: tool_permissions_workflow
name: Folder and Tool Permissions
description: Demonstrate permission system with folder-level and tool-level restrictions

# ── MODEL CONFIGURATION ────────────────────────────────────
models:
  
  # ── MODEL: PRIMARY ANALYZER ───────────────────────
  "llama-3.2-3b-instruct":
    name: primary  # Variable reference name
    
    host:
      type: lmstudio  # lmstudio | ollama | llama_cpp_with_vulkan
      connection_settings:
        host: localhost
        port: 1234
    
    resource_limits:
      max_allowed:
        ram: 4096MB
        vram: 4096MB
        cpu: 100%
        gpu: 100%
        attention_tokens: 8192
        concurrent_requests: 2
      
      allocation_strategy: dynamic  # static | dynamic | adaptive

  # ── WORKFLOW EXECUTION STRATEGY ────────────────────────────
  workflow_execution_strategy:
   
  # ── PROCESSING MODE ───────────────────────────────────
  processing: parallel  # parallel | serial | hybrid
   
  # ── MEMORY MANAGEMENT ───────────────────────────────────
  memory:
    allocation:
      strategy: dynamic
      max_allowed:
        ram: 4096MB
        vram: 4096MB
        cpu: 100%
        gpu: 100%
        attention_tokens: 8192
    
    model_lifecycle:
      load_unload_strategy: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
      unload_unused: true
  
  # ── LOGGING CONFIGURATION ───────────────────────────────────
  logging:
   
  # ── LOG LEVELS ─────────────────────────────────────
  level: info  # debug | info | warning | error
   
  # ── LOG DETAIL ─────────────────────────────────────
  detail: medium  # low | medium | high | verbose
   
  # ── OUTPUT DESTINATIONS ───────────────────────────────
  output_destinations:
    console:
      enabled: true
      include_timestamps: true
    
    json_file:
      enabled: true
      path: "${workflow.output_path}/logs/execution.json"
      format: json
  
  # ── PIPELINE DEFINITION ───────────────────────────────────
  agentic_workflow:
    hardcoded_values:
      var_asdf: foo
      var_fdsa:
        - bar: 1
          baz: false
  
  steps:
    
    prompt: |
        Analyze the codebase at:

        ${workflow.codebase_path}

        Focus on error handling patterns:
        1. Function signatures
        2. Return types
        3. Error handling patterns
        4. Dependencies

        Output as structured JSON with fields: functions, summary, patterns.
      
      file_operations:
        - operation: read
          file_path: "${workflow.codebase_path}"
          format: text
          encoding: utf-8
    
    output:
      save_to: code_analysis
      format: json
      fields:
        - functions  # List of functions found
        - summary  # Code structure summary
        - patterns  # Patterns identified
    
    retry:
      max_attempts: 3
      backoff: exponential  # exponential | linear | fixed
  
  # ── STEP 2: Generate Fixes (Read-Only, NO WRITE) ─────
    name: "Generate Fixes"
    name: "Generate Fixes"
    description: "Create fix suggestions"
    type: agent
    
    generative_entity: "${models.primary}"
    
    prompt: |
      Generate fixes for these issues:

      {{step.step_1_analyze_code.output}}

      Output fixes as structured JSON.
    
    input_variables:
      analysis: "${step.step_1_analyze_code.output}"
    
    output:
      save_to: fixes
      format: json
      fields:
        - suggestions  # Array of fix suggestions
        - priority_list  # Ordered by priority
    
    retry:
      max_attempts: 3
      backoff: exponential
  
  # ── STEP3: Apply Fixes (Write to Output, NOT to Source) ─
  step_3_write_fixes_report:
    name: "Write Fixes Report"
    description: "Generate report of changes"
    type: agent
    
    generative_entity: "${models.primary}"
    
    prompt: |
      Generate a report of these fixes:

      {{step.step_2_generate_fixes.output}}

      Explain what would be changed and why.
    
    input_variables:
      fixes: "${step.step_2_generate_fixes.output}"
    
    output:
      save_to: fixes_report
      format: markdown
      file_output:
        enabled: true
        path: "${workflow.output_path}/fixes_report.md"
        create_parent_directories: true
    
    retry:
      max_attempts: 3
      backoff: exponential
  
  # ── STEP 4: Run Tests (Shell Execute: cargo test) ──────
  step_4_run_tests:
    name: "Run Tests"
    description: "Execute test suite"
    type: tool
    
    tool:
      type: shell_exec
      config:
        command: cargo
        args:
          - test
        working_dir: "${workflow.codebase_path}"
        timeout_secs: 300
    
    prompt: "Run test suite and collect results"
    
    output:
      save_to: test_results
      format: json
      fields:
        - test_results  # Test execution output
        - pass_fail  # Pass/fail status

# ── TOOL PERMISSIONS ────────────────────────────────────────
tool_permissions:
  
  # ── GLOBAL PERMISSIONS ───────────────────────────────────
  global:
    # ── ALLOW OPERATIONS ─────────────────────────────
    allow:
      file_read: /workspace/src/*
      file_write: /workspace/output/*
      dir_list: /workspace/*
      shell_exec: ["cargo test", "cargo build", "cargo check"]
    
    # ── DENY OPERATIONS ─────────────────────────────
    deny:
      file_delete: /workspace/src/*
      file_write: /workspace/src/*
      shell_exec: ["rm -rf", "sudo"]
      web_fetch: http://*
  
  # ── STEP-SPECIFIC PERMISSIONS ─────────────────────────
  step_specific:
    
    # ── STEP 1: Analyze Code ─────────────────────────
    step_1_analyze_code:
      allow:
        file_read: /workspace/src/*
        file_search: /workspace/src/*
      
      deny:
        file_write: /workspace/src/*
        shell_exec: *
    
    # ── STEP 2: Generate Fixes ───────────────────────────
      allow:
      allow:
        file_read: /workspace/src/*
        file_write: /workspace/output/*
      
      deny:
        file_write: /workspace/src/*
    
    # ── STEP 3: Write Fixes Report ───────────────────────
    step_3_write_fixes_report:
      allow:
        file_read: /workspace/output/*
        file_write: /workspace/output/*
      
      deny:
        file_write: /workspace/src/*
    
    # ── STEP 4: Run Tests ────────────────────────────────
    step_4_run_tests:
      allow:
        shell_exec: ["cargo test", "cargo build", "cargo check"]
        shell_exec: ["cargo publish", "cargo install"]
  
  # ── FOLDER PERMISSIONS ────────────────────────────────────
  folder_permissions:
    
    # ── WORKSPACE/SRC (Read + Search Only) ────────────────
    - path: /workspace/src
      operations: [read, search]
      allowed_tools: [file_read, grep, file_search]
      allowed_steps: [step_1_analyze_code, step_2_generate_fixes]
    
    # ── WORKSPACE/OUTPUT (Read + Write + Create + Delete) ─────
    - path: /workspace/output
      operations: [read, write, create, delete]
      allowed_tools: [file_write, file_read]
      allowed_steps: [step_2_generate_fixes, step_3_write_fixes_report]
    
    # ── WORKSPACE/.GIT (Read-Only, Git Operations Only) ───────
    - path: /workspace/.git
      operations: [read]
      allowed_tools: [git_operations]
      allowed_steps: []
    
    # ── WORKSPACE/TARGET (No Operations) ────────────────────────
    - path: /workspace/target
      operations: []
      deny_all: true
  
  # ── AGENT PERMISSIONS ────────────────────────────────────
  agent_permissions:
    default:
      max_file_size_mb: 100
      max_execution_time_secs: 600
      max_concurrent_operations: 5
    
    step_specific:
      step_1_analyze_code:
        max_file_size_mb: 500
        max_execution_time_secs: 300
      
      step_4_run_tests:
        max_execution_time_secs: 600
        max_memory_mb: 2048
  
  # ── TOOL-LEVEL PERMISSIONS ────────────────────────────────
  tool_permissions:
    
    # ── GREP TOOL ───────────────────────────────────────────
    grep:
      allow:
        path: /workspace/src/*
        pattern: "*"
      
      deny:
        path: /workspace/.git/*
        path: /workspace/target/*
    
    # ── WEB FETCH TOOL ───────────────────────────────────────
    web_fetch:
      allow:
        domain: docs.rs
        domain: github.com
        protocol: https
      
      deny:
        domain: *
        protocol: http
    
    # ── SHELL EXEC TOOL ────────────────────────────────────────
    shell_exec:
      allow:
        command: cargo test
        command: cargo build
        command: cargo check
        command: git log
      
      deny:
        command: rm -rf
        command: sudo
        command: docker
        command: kubectl

# ── PERMISSION LOGGING ───────────────────────────────────────
permission_logging:
  
  log_denied_operations: true
  log_denied_to_file: "${workflow.output_path}/logs/permission_denials.log"
  
  alert_on_denial:
    shell_exec_rm_rf: true
    shell_exec_sudo: true
    file_delete_workspace_src: true

# ── WORKFLOW VARIABLES ───────────────────────────────────
workflow:
  codebase_path: /workspace
  output_path: /workspace/output

# ── FEATURES DEMONSTRATED ───────────────────────────────
features_demonstrated:
  - model_configuration
  - tool_permissions
  - step_specific_permissions
  - folder_permissions
  - agent_permissions
  - tool_level_permissions
  - permission_logging
  - alert_system
  - execution_modes
  - logging_configuration
  - variable_interpolation
  - retry_logic
