---
workflow_id: error_propagation_escalation
name: Error Propagation and Escalation Mechanisms
description: Demonstrates error propagation, escalation to model/oracle, notification mechanisms, and inter-step error handling
version: "1.0.0"
author: "AgentSDK Examples"
tags:
  - error-handling
  - error-propagation
  - escalation
  - notification

models:
  escalation_agent:
    name: "Escalation Agent"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

  oracle:
    name: "Oracle Consultant"
    host:
      type: lmstudio
      connection_settings:
        host: "localhost"
        port: 1234
    generative_entity: "llama-3.2-3b-instruct"
    backend: vulkan

workflow_execution_strategy:
  load_unload: lazy
  processing: serial

error_handling:
  default_action:
    type: escalate_immediately
    reason: "Critical errors require immediate escalation"

  escalation:
    escalate_to_model_after: 2
    escalate_to_oracle_after: 4
    notify_on_failure: true

agentic_workflow:
  step_1_generate_initial_error:
    name: "Generate Initial Error"
    type: agent
    model: "${models.escalation_agent}"

    input:
      prompt: |
        Simulate an error that requires escalation.

        Error scenario:
        - Critical system error detected
        - Cannot be handled by current step
        - Requires higher-level intervention

        Error details:
        - Error type: critical_failure
        - Error code: ERR_CRITICAL_001
        - Message: "System integrity check failed"
        - Severity: critical
        - Context: Validation step in workflow

        Return error information for escalation.

    output:
      save_to: initial_error
      format: json

  step_2_propagate_to_model:
    name: "Propagate Error to Model"
    type: agent
    model: "${models.escalation_agent}"

    input:
      enabled_by:
        condition: "step_1_generate_initial_error.severity == 'critical'"

      prompt: |
        Handle critical error with model escalation.

        Error received:
        {{initial_error}}

        Escalation attempt: 1 of 2 (to model)

        Model response options:
        1. Automatic fix based on error code
        2. Manual intervention request
        3. Alternative approach suggestion
        4. Context-aware resolution

        Attempt to resolve error:
        1. Analyze error context
        2. Check for automatic fix patterns
        3. Provide solution if available
        4. Request manual intervention if needed

        Return model resolution attempt and outcome.

    output:
      save_to: model_escalation_result
      format: json

  step_3_model_failed_escalate_to_oracle:
    name: "Escalate to Oracle After Model Failure"
    type: agent
    model: "${models.escalation_agent}"

    input:
      enabled_by:
        condition: "step_2_propagate_to_model.resolved == false"

      prompt: |
        Model failed to resolve error - escalate to Oracle.

        Model failure details:
        {{model_escalation_result}}

        Escalation attempt: 2 of 4 (to Oracle)

        Oracle response options:
        1. Root cause analysis
        2. Systematic debugging approach
        3. Alternative workaround identification
        4. Long-term fix recommendation

        Provide Oracle with:
        - Original error details
        - Model's attempted resolution
        - System context and constraints
        - Request for comprehensive analysis

        Return Oracle escalation request and analysis response.

    output:
      save_to: oracle_escalation_result
      format: json

  step_4_oracle_resolution:
    name: "Oracle Resolution Analysis"
    type: agent
    model: "${models.oracle}"

    input:
      variables:
        escalation_request: "${step_3_model_failed_escalate_to_oracle.output}"

      prompt: |
        Oracle analyzes escalation request and provides resolution.

        Escalation request:
        {{escalation_request}}

        Oracle analysis capabilities:
        1. Deep root cause analysis
        2. Cross-system impact assessment
        3. Knowledge base pattern matching
        4. Historical failure pattern recognition
        5. Systematic debugging methodology

        Provide comprehensive analysis:
        - Root cause identification
        - Impact assessment (affected systems/workflows)
        - Short-term fix (workaround)
        - Long-term fix (systemic improvement)
        - Prevention strategies
        - Risk assessment

        Return detailed Oracle analysis with actionable recommendations.

    output:
      save_to: oracle_resolution
      format: json

  step_5_cross_step_error_propagation:
    name: "Cross-Step Error Propagation"
    type: agent
    model: "${models.escalation_agent}"

    input:
      prompt: |
        Demonstrate error propagation across dependent steps.

        Scenario:
        - Step A fails with error
        - Steps B and C depend on Step A
        - Error should propagate to both B and C
        - Each dependent step handles error appropriately

        Error propagation configuration:
        - Original error: Step A failure
        - Propagation mode: propagate_to_all_dependents
        - Dependent steps: B and C
        - Stop workflow on propagation: false (continue trying)

        For each dependent step:
        - Receive propagated error
        - Log received error
        - Attempt graceful handling
        - Propagate further if needed
        - Report status

        Return error propagation timeline.

    output:
      save_to: cross_step_propagation
      format: json

  step_6_error_recovery_verification:
    name: "Verify Error Recovery"
    type: agent
    model: "${models.escalation_agent}"

    input:
      variables:
        model_result: "${step.step_2_propagate_to_model.output}"
        oracle_result: "${step.step_4_oracle_resolution.output}"
        propagation: "${step.step_5_cross_step_error_propagation.output}"

      prompt: |
        Verify error recovery was successful.

        Recovery attempts:
        - Model escalation: {{model_result}}
        - Oracle resolution: {{oracle_result}}
        - Cross-step propagation: {{propagation}}

        Verification checks:
        1. Was error eventually resolved?
        2. Which mechanism succeeded?
        3. Were side effects introduced?
        4. Is system stable after fix?
        5. Any temporary workarounds remain?

        Recovery assessment:
        - Success: error fully resolved
        - Partial: workaround in place, needs proper fix
        - Failed: error not resolved, needs manual intervention
        - Unknown: error state unclear

        Return verification status and system state.

    output:
      save_to: recovery_verification
      format: json

  step_7_generate_error_report:
    name: "Generate Error Handling Report"
    type: agent
    model: "${models.escalation_agent}"

    input:
      variables:
        initial: "${step.step_1_generate_initial_error.output}"
        model: "${step.step_2_propagate_to_model.output}"
        oracle: "${step.step_4_oracle_resolution.output}"
        propagation: "${step.step_5_cross_step_error_propagation.output}"
        verification: "${step.step_6_error_recovery_verification.output}"

      prompt: |
        Generate comprehensive error handling report.

        Error lifecycle:
        - Initial error: {{initial}}
        - Model escalation: {{model}}
        - Oracle resolution: {{oracle}}
        - Propagation: {{propagation}}
        - Verification: {{verification}}

        Report sections:
        1. Error timeline and escalation path
        2. Resolution mechanisms effectiveness
        3. Propagation behavior analysis
        4. Recovery success assessment
        5. Root cause identification
        6. Prevention recommendations
        7. Process improvements

        Write report to: ./workspace/output/error-handling-report.md

    output:
      save_to: error_handling_report
      format: markdown
      file_output:
        enabled: true
        path: ./workspace/output/error-handling-report.md

logging:
  enabled: true

  levels:
    default: info
    workflow_execution: debug
    error_handling: debug

  scopes:
    error_handling:
      enabled: true
      include_escalation_events: true
      include_error_propagation: true

    execution:
      enabled: true

  output:
    console:
      enabled: true

    file:
      enabled: true
      path: ./workspace/logs/error-propagation.log
