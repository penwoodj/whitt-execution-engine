---
# Unified AgentSDK Workflow Schema
# Version: 1.0.0
#
# This schema provides a self-documenting, human-readable workflow configuration format.
# All properties are designed to convey meaning through naming and structure,
# minimizing the need for external documentation or memorization.
#
# ── DESIGN PRINCIPLES ────────────────────────────────────
# 1. Self-Documenting: Property names convey meaning without external docs
# 2. Semantic Organization: Related properties grouped by domain
# 3. Readability First: Visual structure aids scanning and understanding
# 4. Flexible Syntax: Support both simple and complex configurations
# 5. Backward Compatible: Preserves existing workflow patterns
# ──────────────────────────────────────────────────────────────────────

# ── WORKFLOW IDENTIFICATION ────────────────────────────────────
workflow_id: required  # Unique identifier for this workflow
name: required            # Human-readable workflow name
description: required    # Detailed description of workflow purpose
version: "1.0.0"       # Workflow version (semantic versioning)
author: ""               # Workflow author
tags: []                 # Categorization tags for discovery

# ── MODEL CONFIGURATION ────────────────────────────────────────
models:
  # ── GLOBAL CONFIGURATION FILE ─────────────────────────────
  # Optional: Centralized model configuration that provides default values
  # All model-specific settings in this workflow override global defaults
  # File format: YAML with providers and models sections (same structure as below)
  global_config_path: "./workspace/model-config.yml"

  # ── AUTOMATIC ROUTING ─────────────────────────────────────
  # Default behavior when model not specified on a step
  default_router: automatic  # automatic | manual | smart_routing

  # ── MODEL DEFINITIONS ──────────────────────────────────────
  # Key: Model identifier (use in workflow: "${models.model_name}")
  # Value: Model configuration object
  #
  # Example: "llama-3.2-3b-instruct": {...}
  #
  # Reference in workflow: ${models.primary_analyzer}
  "model-identifier":
    name: ""  # Variable reference name (e.g., primary_analyzer, secondary_validator)

    # ── HOST CONFIGURATION ───────────────────────────────────
    host:
      type: lmstudio  # lmstudio | ollama | llama_cpp_with_vulkan

      # Connection settings (provider-specific, standardized naming)
      # Provider-specific fields:
      #   lmstudio: host, port, connection_timeout_secs
      #   ollama: base_url, timeout_secs
      #   llama_cpp_with_vulkan: model_path, n_gpu_layers
      connection_settings: {}

    # ── RESOURCE LIMITS ───────────────────────────────────
    # Maximum resources this model can use (percentage or absolute values)
    # Percentage (%) = Percentage of total system resource
    # Absolute values with unit suffix = MB, GB, KB, tokens
    # System calculates actual values from % based on available resources
    max_allowed:
      ram: 13%          # Maximum RAM percentage or absolute (e.g., 8GB)
      vram: 3.7GB        # Maximum VRAM percentage or absolute
      cpu: 49%           # Maximum CPU percentage
      gpu: 74%           # Maximum GPU percentage
      attention_tokens: 150000  # Maximum context window in tokens
      concurrent_requests: 2  # Max concurrent requests (if supported by provider)

    # ── MINIMUM REQUIREMENTS ───────────────────────────────
    # Minimum resources required to run this model effectively
    # If system resources < min_allowed, workflow fails with helpful error
    # Suggests alternative models if resources insufficient
    min_allowed:
      ram: 9%           # Minimum RAM percentage or absolute
      vram: 2.4GB        # Minimum VRAM percentage or absolute
      cpu: 49%           # Minimum CPU percentage
      gpu: 74%           # Minimum GPU percentage
      attention_tokens: 73500  # Minimum useful context window in tokens

    # ── ALLOCATION STRATEGY ───────────────────────────────────
    allocation_strategy: dynamic  # static | dynamic | adaptive
    # static = Pre-allocate max_allowed at start
    # dynamic = Allocate based on actual needs during execution
    # adaptive = Adjust allocation dynamically based on resource pressure

    # ── MODEL MEMORY & CACHE ─────────────────────────────────
    model_memory:
      # KV cache size: Larger = faster but uses more memory
      # Maps to quantization level and cache size
      cache_size: min  # min | max | medium | medium-min | medium-max

      # KV cache quantization (affects memory usage vs speed tradeoff)
      # auto = Automatically select based on available resources
      # q4_k_m, q4_0, q5_k_m, q5_0, q6_k, q8_0
      kv_cache_quantization: auto

      # Attention context size
      # auto = Use max_allowed.attention_tokens
      attention_context: auto  # auto | from_max_allowed | manual_override

    # ── EXECUTION TIMEOUTS ───────────────────────────────────
    execution:
      # Time limits for model operations
      timeout:
        load_into_memory: 45s       # Time to load model into memory
        time_to_first_response: 1m      # Time to get first useful response
        total_time_to_response: 4h      # Total time from load start to response complete

      # Turn-based limits
      max_turns: 10
      stop_on_tool_failure: false
      accumulate_tool_results: true

    # ── THINKING / REASONING CONFIGURATION ─────────────────
    thinking:
      # Reasoning token budget (for models that support separate reasoning)
      budget_tokens: 4096

      # Output control
      capture_in_output: true   # Include reasoning in final output
      capture_in_events: true   # Emit reasoning as separate events
      stream_to_log: true       # Stream reasoning to log file

    # ── TOOL PERMISSIONS ─────────────────────────────────────
    tools:
      # Default permission levels for tool use
      default_permissions:
        web_access: ask           # ask | trust | block
        file_read: trust          # ask | trust | block
        file_write: always_ask     # ask | trust | block
        shell_exec: always_ask     # ask | trust | block

      # Explicitly allowed tools (empty = all default tools allowed)
      allowed_tools: [grep, file_read, file_write]

      # Explicitly forbidden tools
      forbidden_tools: []

      # ── CUSTOM TOOL DEFINITIONS ───────────────────────────
      # Simple syntax: String array
      #   tools: [grep, file_read, file_write]
      #
      # Complex syntax: Named objects with configuration
      #   tools:
      #     search_code:
      #       type: grep
      #       config:
      #         pattern: "tokio::spawn"
      #         path: /workspace/src
      custom_tools: []

    # ── LIFECYCLE HOOKS ─────────────────────────────────
    hooks:
      enabled: true

      # ── RUN LIFECYCLE (Fires for each .run() call) ───
      on_create: {}      # Fires once when model is instantiated
      on_run_start: {}   # Fires at the beginning of each run
      on_run_complete: {} # Fires after agent finishes (success or max_turns)
      on_run_error: {}    # Fires when run encounters an unrecoverable error
      on_retry: {}       # Fires when a run is retried

      # ── TURN LIFECYCLE (Fires for each turn) ──────────
      on_turn_start: {}   # Fires before each turn begins
      on_turn_complete: {} # Fires after each turn finishes (before next turn or return)
      on_turn_error: {}    # Fires when a turn fails (LLM error, timeout, etc.)
      on_thinking: {}     # Fires when model emits reasoning/thinking content

      # ── TOOL LIFECYCLE ───────────────────────────────────
      on_tool_call: {}      # Fires when LLM decides to call a tool (before execution)
      on_tool_start: {}     # Fires immediately before tool execution begins
      on_tool_result: {}    # Fires after tool returns a result (success)
      on_tool_error: {}     # Fires when tool execution fails

      # ── STREAMING LIFECYCLE ───────────────────────────────
      on_stream_chunk: {}   # Fires for each streaming chunk
      on_stream_complete: {} # Fires when streaming is fully finished

      # ── MEMORY LIFECYCLE (For RAG / memory) ──────────
      on_memory_recall: {}  # Fires when retrieving from memory
      on_memory_store: {}  # Fires when storing to memory

    # ── GUARDRAILS (Content Filtering) ─────────────────────
    # If present: Guardrails enabled
    # If absent: Guardrails disabled (allow all content)
    guardrails:
      enforcement_policy: block  # block | warn | allow

      input:
        guards: [prompt_injection, pii_redaction, max_length]

        prompt_injection:
          sensitivity: high  # low | medium | high
          on_match: block  # block | warn | sanitize
          log: true

        pii_redaction:
          patterns: []  # Override default patterns or use built-in
          # Built-in: email, phone, ssn, api_key
          # Custom: Add regex patterns as strings
          replacement: "[REDACTED]"
          on_match: sanitize  # sanitize | block | log_only

        max_length:
          max_tokens: 8000
          on_match: truncate  # block | truncate | error
          truncate_to: 7500

      output:
        guards: [toxicity_filter, pii_redaction, format_validation, max_length]

        toxicity_filter:
          trigger_tokens:
            - "ignore previous instructions"
            - "you are now"
          on_match: block
          log: true

        pii_redaction:
          patterns: [email, phone, api_key]
          replacement: "[REDACTED]"

        format_validation:
          format: json  # json | xml | markdown
          strict: true  # Reject if not parseable
          on_match: retry  # block | retry | error
          max_retries: 2

        max_length:
          max_tokens: 4096
          on_match: truncate

      tool_use:
        guards: [no_web_access, no_file_access, no_script_access, no_terminal_access, no_mcp_access]

        no_web_access:
          on_match: block
          log: true

        no_file_access:
          on_match: block
          log: true

        no_script_access:
          on_match: block
          log: true

        no_terminal_access:
          on_match: block
          log: true

    # ── FRAMEWORK TYPE ───────────────────────────────────────────
    framework:
      type: agentsdk  # agentsdk | basic_agent | custom
      custom_executor_name: ""  # Only for type: custom

# ── AGENTIC WORKFLOW (Alternative Pipeline Format) ──────────────
# This section provides an alternative to the pipeline array for workflows
# that prefer named step keys and inline configuration.
#
# Use either agentic_workflow OR pipeline, not both.
# If both present, agentic_workflow takes precedence.
agentic_workflow:
  # ── USER INPUTS (Ask before workflow execution) ─────────────
  user_inputs:
    execution_mode: interactive  # interactive | automated | hybrid

    workflow_level:
      ask_at_start: true

      inputs:
        - id: workspace_path
          type: text_area  # text_area | text_line | select | multi_select | confirm
          label: "Workspace Path"
          placeholder: "/workspace"
          default_value: "/workspace"
          multiline: true

          validation:
            required: true
            pattern: "^/.+"
            error_message: "Must be an absolute path"

        - id: execution_mode
          type: select
          label: "Execution Mode"
          options:
            - value: parallel
              label: "Parallel (Faster, More Memory)"
              description: "Execute steps in parallel where possible"
            - value: serial
              label: "Serial (Slower, Less Memory)"
              description: "Execute steps one at a time"
            - value: hybrid
              label: "Hybrid (Balanced)"
              description: "Adaptive parallelism based on resources"
          default_value: parallel
          required: true

        - id: confirm_execution
          type: confirm
          label: "Start Execution"
          required: true
          keyboard_shortcut: Enter

    step_level:
      ask_at_step_start: true

      inputs_by_step:
        # Key: Step identifier (e.g., step_5_generate_final_output)
        step_name:
          - id: confirm_file_write
            type: confirm
            label: "Write Refactored Code"
            message: "About to write refactored code. Continue?"
            required: true
            keyboard_shortcut: Enter
            cancel_shortcut: Esc

    ui_configuration:
      layout: tabbed  # tabbed | vertical | horizontal

      panels:
        - id: general
          label: "General Settings"
          inputs: [workspace_path, execution_mode]

        - id: advanced
          label: "Advanced Options"
          inputs: []

      notifications:
        enabled: true
        sound: true
        position: top_right

  # ── WORKFLOW STEPS ────────────────────────────────────────
  # Key: Unique step identifier (use as reference: ${step.step_name})
  # Naming convention: step_{number}_{descriptive_name}
  # Example: step_1_initialize_system
  steps:
    step_identifier:
      # ── STEP METADATA ─────────────────────────────────────
      name: ""  # Human-readable step name
      description: ""  # Detailed description of step purpose
      type: agent  # agent | tool | sub_workflow | control | loop

      # ── GENERATIVE ENTITY ───────────────────────────────────
      # Non-Deterministic IO: Agent, Model, or .yml config file
      generative_entity: "${models.primary_analyzer}"

      # ── MODEL OVERRIDES ─────────────────────────────────────
      # Override any property from model configuration
      # Cannot override: name, host, type
      model_overrides:
        max_turns: 10
        timeout:
          time_to_first_response: 30s

      # ── PROMPT CONFIGURATION ───────────────────────────────────
      prompt: |
        Multi-line prompt text with
        variable interpolation:
        - {{step.previous_step.output}}
        - {{workflow.variable_name}}
        - {{model.property}}
        - {{run.number}}
        - {{now}}

      # ── INPUT VARIABLES ─────────────────────────────────────
      input_variables:
        variable_name: value
        another_var: "${workflow.computed_value}"

      # ── FILE OPERATIONS (Pre-step) ─────────────────────────
      file_operations:
        - operation: read
          file_path: /workspace/config/settings.yml
          format: yaml
          encoding: utf-8

        - operation: write
          file_path: /workspace/output/result.json
          format: json
          encoding: utf-8

      # ── CONTEXT INJECTION ─────────────────────────────────────
      context:
        include_previous_outputs: true
        include_system_context: true
        include_tool_results: true

      # ── OUTPUT CONFIGURATION ───────────────────────────────────
      output:
        save_to: output_variable_name  # Variable name for reference

        format: json  # json | yaml | text | markdown

        fields:
          - field_name
          - another_field

        # File output
        file_output:
          enabled: true
          path: /workspace/output/step_result.json
          format: json
          encoding: utf-8

        # Console output
        console:
          enabled: false
          prefix: "[Step Name] "
          color: blue

      # ── RETRY CONFIGURATION ───────────────────────────────────
      retry:
        # Condition for retry (absent = always retry if retry block present)
        condition: "error.is_retryable == true"

        max_attempts: 3

        backoff: exponential  # exponential | linear | fixed
        delay_ms: 1000

        # Backoff options
        base_ms: 1000
        max_ms: 30000
        jitter: 0.2

        # Retry scope
        level: step_restart  # workflow_unload | workflow_restart | step_unload | step_restart | prompt_restart | tools_retry
        # workflow_unload = Unload all models, reload after retry
        # workflow_restart = Restart entire workflow from beginning
        # step_unload = Unload model for this step only
        # step_restart = Restart just this step
        # prompt_restart = Re-send prompt with same context
        # tools_retry = Retry only failed tool calls

        # Retry behavior on failure
        adjustment_strategy: loosen_tolerance
        tolerance_adjustment: 0.15
        adjust_interdependencies: false

        checkpoint_after_retry: true

      # ── PRE-EXECUTION HOOKS ─────────────────────────────
      pre_hooks:
        validate_resources:
          check_memory: true
          check_dependencies: true

      # ── POST-EXECUTION HOOKS ────────────────────────────
      post_hooks:
        checkpoint:
          enabled: true
          reason: "Checkpoint after completion"

      # ── BRANCHES (Conditional Execution) ─────────────────────
      branches:
        branch_identifier:
          name: "Branch Name"
          description: "Description of branch purpose"

          enabled_by:
            condition: "previous_step.output.decision == 'value'"
            description: "Condition to enable this branch"

          next_step: next_step_identifier

          # Branch configuration
          parallel_group: group_name
          max_parallel: 4
          timeout_secs: 300

          on_entry:
            log:
              message: "Branch entered"
              level: info

          on_exit:
            save_state:
              include_partial_results: true

            checkpoint:
              enabled: true

# ── PIPELINE DEFINITION (Standard Format) ─────────────────────────
# Alternative to agentic_workflow for array-based step definitions.
#
# Use either pipeline OR agentic_workflow, not both.
# If both present, agentic_workflow takes precedence.
pipeline:
  # ── STEP DEFINITIONS (Array Format) ─────────────────────────
  # Each step has:
  #   step: Step identifier (required)
  #   id: Unique ID (optional, used as reference if step not provided)
  #   name: Human-readable name (optional)
  #   description: Detailed description (optional)
  #   type: agent | tool | sub_workflow | control | loop (optional, default: agent)
  #   model: Model reference (required for type: agent)
  #   generative_entity: Alternative to model field (for non-deterministic IO)
  #   agent: Agent configuration (optional)
  #   tool: Tool configuration (required for type: tool)
  #   input: Input configuration
  #   output: Output configuration
  #   retry: Retry configuration (optional)
  #   branches: Branch definitions (optional)
  #   parallel_group: Parallel execution group (optional)
  #   max_parallel: Max parallel executions for this step/group (optional)
  #   timeout_secs: Step timeout (optional)
  #   depends_on: List of step dependencies (optional)
  - step: step_name
    id: unique_id
    name: "Human-Readable Name"
    description: "Detailed description of step purpose"
    type: agent
    model: "${models.primary_analyzer}"

    # Agent configuration (type: agent)
    agent:
      # Override agent tools (replace default tool set)
      limited_tools: [grep]

      # Add tools to agent (in addition to default tool set)
      additional_tools: [cd]

    # Input configuration
    input:
      prompt: |
        Multi-line prompt with
        variable interpolation support:
        - {{step.step_1.output}}
        - {{workflow.variable_name}}

      variables:
        variable_name: value
        another_var: "${workflow.computed_value}"

      file_operations:
        - operation: read
          file_path: /workspace/config.yml

    # Output configuration
    output:
      save_to: output_variable_name
      format: json
      fields:
        - field_name
        - nested_field

      file_output:
        enabled: true
        path: /workspace/output/result.json

    # Retry configuration
    retry:
      max_attempts: 3
      backoff_strategy: exponential
      delay_ms: 1000

    # Branch configuration
    branches:
      branch_id: "branch_name"
        next_step: next_step_name
        enabled_by: "condition_expression"
        description: "Branch description"

    # Parallel execution
    parallel_group: group_name
    max_parallel: 3

    # Timeout
    timeout_secs: 300

    # Dependencies
    depends_on:
      - step_1
      - step_2

  # ── LOOP CONFIGURATIONS (Step Types) ─────────────────────────
  # Loop types: count | time | validation | retry | infinite
  - step: loop_step
    type: loop

    loop:
      type: count  # count | time | validation | retry | infinite

      # ── COUNT-BASED LOOP ───────────────────────────────
      count_config:
        max_iterations: 5
        iteration_variable: count
        initial_value: 1
        stop_condition: "validation_result.is_valid == true"
        on_stop: return_result  # return_result | continue | break

      # ── TIME-BASED LOOP ────────────────────────────────
      time_config:
        duration_seconds: 60
        check_interval_seconds: 10
        start_time: "{{workflow.timestamp}}"
        stop_time: "{{workflow.timestamp}} + 60s"
        interval_variable: time_interval
        track_progress: true
        log_interval: 5

      # ── VALIDATION LOOP ───────────────────────────────────
      validation_config:
        abstract_criteria: quality_improvement
        tolerance: 0.03
        max_iterations: 4

        exact_criteria:
          - metric: quality_score
            operator: ">="
            target: 0.95
            description: "Minimum quality score"

        on_convergence: continue  # continue | exit_loop | return_best
        on_max_iterations: use_best_result

      # ── RETRY LOOP ──────────────────────────────────────
      retry_config:
        max_attempts: 5
        base_delay_ms: 1000
        timeout_ms: 30000

        retry_strategies:
          - error_type: "5xx"
            backoff_strategy: exponential  # exponential | linear | fixed
            delay_multiplier: 2

      # ── INFINITE LOOP ────────────────────────────────────
      infinite_config:
        max_iterations: 100
        max_memory_mb: 2048
        timeout_seconds: 30

        iteration_variable: infinite_count
        checkpoint_interval: 5
        log_interval: 1

        safety_limits:
          max_duration_seconds: 300
          max_tool_calls: 1000
          abort_on_oom: true

# ── WORKFLOW EXECUTION STRATEGY ────────────────────────────────
workflow_execution_strategy:

  # ── MODEL LIFECYCLE ─────────────────────────────────────
  load_unload: one_at_a_time  # one_at_a_time | lazy | eager | adaptive
  # one_at_a_time = Load models one at a time, unload before next
  # lazy = Load on demand, keep in memory until space needed
  # eager = Pre-load all models at start
  # adaptive = Dynamically load/unload based on usage patterns

  # ── PROCESSING MODE ─────────────────────────────────────────
  processing: parallel  # serial | parallel | hybrid
  # serial = Execute steps sequentially
  # parallel = Execute steps in parallel where dependencies allow
  # hybrid = Adaptive parallelism based on resource availability

  # ── PARALLELIZATION CONFIG ────────────────────────────────
  parallel:
    enabled: true
    algorithm: round_robin  # round_robin | priority_queue | shortest_job_first | longest_job_first

    load_balancing:
      strategy: least_loaded  # random | least_loaded | ip_hash
      worker_selection_timeout_secs: 10
      enabled: true

    max_threads: 4
    max_models: 3
    max_concurrent_requests: 2
    max_steps: 2
    max_sub_agents: 2

    parallel_group_timeout_secs: 600

  # ── MEMORY MANAGEMENT ───────────────────────────────────────────
  memory:
    allocation:
      strategy: adaptive  # static | dynamic | adaptive

      max_allowed:
        ram: 13%
        vram: 3.7GB
        cpu: 49%
        gpu: 74%

      min_allowed:
        ram: 9%
        vram: 2.4GB
        cpu: 49%
        gpu: 74%

    model_lifecycle:
      load_unload_strategy: one_at_a_time
      cache_size: min  # min | max | medium | medium-min | medium-max
      swap_timeout_secs: 30
      unload_unused: true
      gc_interval_secs: 300

    pressure_handling:
      trigger_threshold_percent: 85
      strategy: throttle  # throttle | swap | fail_fast | graceful_degradation
      throttle_factor: 0.5
      on_oom: swap  # swap | fail_fast | graceful_degradation

  # ── TIMEOUT MANAGEMENT ───────────────────────────────────────
  timeout:
    total: 4h  # Total workflow execution timeout

    per_operation:
      tool_call: 30m
      step: 8m
      operation_timeout_secs: 30
      sub_workflow: 300s
      time_to_first_result_secs: 120

    timeout_strategy: continue_with_partial  # fail | continue_with_partial | retry

    model:
      load_into_memory: 45s
      time_to_processing_after_loaded: 10000ms
      time_to_processing: 2h
      time_to_responding: 1m
      time_to_response: 4h

      on_timeout: retry_with_backoff  # fail | retry_with_backoff | continue_with_partial

  # ── ERROR HANDLING ───────────────────────────────────────────
  error_handling:
    default_action:
      type: retry  # retry | retry_critical_path | skip | fail_workflow
      reason: "Transient failure, attempt automatic recovery"

    retry:
      max_attempts_per_step: 3
      max_attempts_per_workflow: 10
      backoff_strategy:
        type: exponential
        base_delay_ms: 1000
        max_delay_ms: 30000
        jitter_factor: 0.2

      retry_on_timeout: true
      retry_on_rate_limit: true
      rate_limit_backoff_strategy: exponential  # exponential | linear | fixed

    escalation:
      escalate_to_model_after: 3
      escalate_to_oracle_after: 5
      notify_on_failure: true

    handling_by_type:
      transient_failures:
        action: retry_with_exponential_backoff
        notify_level: warning

      permanent_failures:
        action: log_and_continue
        notify_level: error

      user_errors:
        action: escalate_immediately
        notify_level: critical

      system_errors:
        action: retry_with_fallback
        notify_level: error

  # ── SUB-WORKFLOW COORDINATION ───────────────────────────
  sub_workflow:
    enabled: true

    # ── POLICY INHERITANCE ─────────────────────────────────
    inherit_policy:
      enabled: true

      inherit_from_parent:
        runtime: true
        review: true
        rigor: true
        scope: true
        concurrency: true
        efficiency: true
        logging: true
        context_budget: false

      override_allowed:
        runtime: false
        review: true
        rigor: true
        scope: false
        concurrency: false
        efficiency: true
        logging: true
        context_budget: false

    # ── REFERENCE RESOLUTION ───────────────────────────────────
    reference_resolution:
      strategy: hierarchical  # hierarchical | local_first | registry_only

      caching:
        enabled: true
        cache_ttl_secs: 3600
        validate_references: true

      version_conflict:
        resolution: error  # error | warn_and_continue | use_latest
        warn_if_ambiguous: true

    # ── ENVIRONMENT ISOLATION ───────────────────────────────
    isolated_environments:
      enabled: false

      memory_sharing:
        mode: shared_with_limits  # shared_with_limits | isolated | distributed
        limit_per_workflow_mb: 2048
        swap_on_conflict: true
        conflict_resolution: last_writer_wins  # last_writer_wins | merge_results | fail_on_conflict

      file_system_isolation:
        workspace_mode: shared  # shared | isolated
        temp_dir_pattern: ./tmp/workflow_${workflow_id}_*/
        cleanup_on_completion: true
        allowed_shared_paths:
          - /workspace/shared

      state_sharing:
        mechanism: file_based  # file_based | memory_based | distributed
        state_directory: ./workflow_states/${workflow_id}/
        merge_strategy: union  # union | replace | merge
        validate_state: true

    # ── CIRCULAR REFERENCE DETECTION ───────────────────────
    circular_reference_detection:
      enabled: true
      max_depth: 3
      on_circular_reference:
        action: fail_workflow  # fail_workflow | warn_and_continue | use_first_reference
        log_error: true
        notify_user: true

    # ── PARALLEL EXECUTION ───────────────────────────────────
    max_parallel_workflows: 4
    parallel_group_timeout_secs: 600
    inter_workflow_dependencies:
      enabled: true
      dependency_timeout_secs: 300

  # ── SYNCHRONIZATION ───────────────────────────────────────────
  synchronization:
    enabled: true

    coordination:
      barrier_sync:
        enabled: false
        timeout_secs: 60

      lock_free_timeout_secs: 30
      deadlock_detection: true
      deadlock_resolution_timeout_secs: 120

    conflict_handling:
      max_concurrent_writers: 1
      resolution_strategy: last_writer_wins  # last_writer_wins | merge_results | fail_on_conflict
      on_conflict: log  # log | retry | escalate

    event_propagation:
      mode: bidirectional  # bidirectional | bottom_to_top | top_to_bottom | cross_agent
      propagation_delay_ms: 100

    validation_aggregation:
      strategy: hierarchical  # hierarchical | conjunction | disjunction | weighted
      aggregation_timeout_secs: 30

  # ── CHECKPOINTING ────────────────────────────────────────────
  checkpointing:
    enabled: true

    configuration:
      level: timetravel  # timetravel | git | debug | info | compressed_summary
      output_path: "${workspace.output_path}/chat-file.md"

      max_size:
        lines: 1000
        bytes: 10MB
        tokens: 100000

    triggers:
      interval:
        time: 5m
        steps: [initialize_system, execute_parallel_sub_agents]

      on_failure: create  # create | skip | continue
      on_timeout: create
      on_user_interrupt: create

    storage:
      state_management:
        enabled: true
        save_interval_secs: 60
        state_file_path: "${workspace.checkpoint_path}/state.json"
        merge_strategy: union  # union | replace | merge

      time_travel:
        enabled: true
        max_timeback_duration: 5h
        checkpoint_interval_mins: 30

    cleanup:
      auto_cleanup_enabled: true
      max_checkpoints: 10
      keep_last_n: 5
      delete_older_than_hours: 48

  # ── RESOURCE ALLOCATION ───────────────────────────────────────────
  resource_allocation:
    strategy: adaptive  # static | dynamic | adaptive
    cpu_reservation_percent: 80
    gpu_reservation_mb: 4096
    network_bandwidth_reservation_mbps: 100
    pre_allocation_enabled: true

    allocation_policy:
      memory: greedy  # greedy | conservative | balanced
      cpu: balanced  # greedy | conservative | balanced
      gpu: greedy  # greedy | conservative | balanced

  # ── DEPENDENCY RESOLUTION ───────────────────────────────────
  dependency_resolution:
    strategy: wait_for_all  # wait_for_all | continue_with_available | skip_failed
    timeout_secs: 300
    propagate_failure_to_dependents: true
    max_wait_for_dependencies_secs: 600

    on_dependency_failure: fail_workflow  # fail_workflow | skip_dependent | use_fallback

  # ── CONCURRENCY LIMITS ─────────────────────────────────────
  concurrency_limits:
    model_loading: 2
    tool_execution: 10
    file_operations: 5
    api_requests: 3
    sub_agent_spawning: 4
    workflow_execution: 3

  # ── STEP PRIORITIZATION ─────────────────────────────────────
  step_prioritization:
    enabled: true
    strategy: critical_path  # critical_path | resource_optimized | user_defined

    priority_levels:
      - name: critical
        weight: 10

      - name: high
        weight: 5

      - name: medium
        weight: 3

      - name: low
        weight: 1

  # ── PERFORMANCE OPTIMIZATION ───────────────────────────────────
  performance_optimization:
    enabled: true

    cache:
      enabled: true
      ttl_seconds: 3600
      max_size_mb: 1024
      eviction_policy: lru  # lru | lfu | fifo
      cache_intermediate_results: true

    batching:
      enabled: true
      batch_similar_operations: true
      batch_size: 10
      batch_timeout_secs: 5

    prefetching:
      enabled: true
      prefetch_next_steps: true
      prefetch_lookahead: 3

    memory_optimization:
      enabled: true
      optimize_memory_access_pattern: true
      use_streaming: true

  # ── STATE TRANSITION HOOKS ───────────────────────────────────
  state_transition_hooks:
    on_step_start: [log, checkpoint]  # Simple array syntax for common actions
    on_step_complete: [log, checkpoint]
    on_workflow_start: [initialize_metrics, send_notification]
    on_workflow_complete: [finalize_metrics, send_summary, cleanup_resources]
    on_failure: [cleanup, log, escalate, retry]
    on_timeout: [log, checkpoint, notify]

    # Alternative: Named object syntax for detailed configuration
    # on_step_start:
    #   log:
    #     level: info
    #     message: "Step started"
    #   checkpoint:
    #     enabled: true

  # ── ADVANCED SCHEDULING ───────────────────────────────────
  advanced_scheduling:
    enabled: true
    algorithm: round_robin  # round_robin | priority_queue | shortest_job_first | longest_job_first
    time_slice_enabled: false
    preemptive_enabled: false
    quantum_ms: 100

    scheduling_mode: cooperative  # cooperative | preemptive | batch

    load_balancing:
      strategy: least_loaded  # random | least_loaded | ip_hash
      worker_selection_timeout_secs: 10

  # ── ADAPTIVE BEHAVIOR ───────────────────────────────────
  adaptive:
    resource_monitoring:
      enabled: true
      interval_secs: 5
      metrics: [cpu, memory, gpu, io, network]

    memory_pressure_handling:
      strategy: throttle  # throttle | swap | fail_fast | graceful_degradation
      memory_threshold_percent: 85
      throttle_factor: 0.5
      on_oom: swap  # swap | fail_fast | graceful_degradation

    concurrency_adjustment:
      enabled: true
      strategy: scale_up_down  # scale_up_down | scale_up_only | scale_down_only
      adjustment_interval_secs: 60
      max_parallel_adjustment: 5
      scale_up_threshold_percent: 60
      scale_down_threshold_percent: 90

    performance_based_scheduling:
      enabled: true
      strategy: round_robin  # round_robin | priority_queue | shortest_job_first | longest_job_first
      time_slice_enabled: false
      preemptive_enabled: false
      quantum_ms: 100

# ── TOOL PERMISSIONS ───────────────────────────────────────────────
tool_permissions:
  # ── FILE OPERATIONS ───────────────────────────────────────────
  file_operations:
    read:
      enabled: true
      require_confirmation: false
      allowed_paths:
        - /workspace/src
        - /workspace/config
      allowed_patterns:
        - "*.rs"
        - "*.yml"
      forbidden_paths:
        - /etc
        - /root
      max_file_size_mb: 100

    write:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/output
        - /workspace/checkpoints
      backup_existing: true
      max_file_size_mb: 500
      create_parent_directories: true

    delete:
      enabled: true
      require_confirmation: true
      allowed_paths:
        - /workspace/temp
        - /workspace/backups
      confirm_delete_count: 5
      skip_confirmation_for_patterns:
        - "*.tmp"
        - "*.cache"

  # ── WEB OPERATIONS ─────────────────────────────────────────────
  web_operations:
    fetch:
      enabled: true
      require_confirmation: false
      max_concurrent_requests: 5
      timeout_secs: 30
      allowed_domains:
        - api.github.com
        - docs.rs
      forbidden_domains:
        - "*.local"
      follow_redirects: true
      validate_ssl: true

    scrape:
      enabled: true
      require_confirmation: false
      respect_robots_txt: true
      max_pages_per_domain: 100
      follow_links:
        enabled: false
        max_depth: 2

  # ── SHELL OPERATIONS ───────────────────────────────────────────
  shell_operations:
    exec:
      enabled: true
      require_confirmation: true
      timeout_seconds: 30
      allowed_commands:
        - cargo
        - rustc
        - git
        - ls
        - cat
      forbidden_commands:
        - rm
        - sudo
      working_directories:
        - /workspace
      require_shell_for: ["rm", "sudo"]

  # ── AI OPERATIONS ───────────────────────────────────────────────
  ai_operations:
    web_search:
      enabled: true
      require_confirmation: false
      max_searches_per_hour: 100

    content_generation:
      enabled: true
      require_confirmation: false
      max_tokens_per_hour: 50000

  # ── SYSTEM OPERATIONS ────────────────────────────────────────
  system_operations:
    process_management:
      enabled: false

    network_operations:
      enabled: false

# ── LOGGING CONFIGURATION ────────────────────────────────────────
logging:
  enabled: true

  # ── LOG LEVELS ──────────────────────────────────────────────
  levels:
    # Default log level
    default: info  # debug | info | warning | error | critical

    # Per-scope log levels
    workflow: info
    pipeline: debug
    models: warning
    tools: info
    execution: debug

  # ── LOG SCOPES (Hierarchical) ─────────────────────────────
  scopes:
    # Workflow-level logging
    workflow:
      enabled: true
      include_timestamps: true
      include_execution_id: true

    # Pipeline-level logging
    pipeline:
      enabled: true
      include_step_transitions: true
      include_branch_decisions: true

    # Model-level logging
    models:
      enabled: true
      include_load_unload: true
      include_resource_usage: true

    # Tool-level logging
    tools:
      enabled: true
      include_tool_calls: true
      include_tool_results: true

    # Execution-level logging
    execution:
      enabled: true
      include_metrics: true
      include_resource_monitoring: true

  # ── OUTPUT DESTINATIONS ───────────────────────────────────────
  output:
    console:
      enabled: true
      color: true
      timestamps: true
      format: text  # text | json | structured

    file:
      enabled: true
      path: /workspace/logs/workflow.log
      format: json  # text | json | structured
      rotation:
        enabled: true
        max_size_mb: 100
        max_files: 10

    remote:
      enabled: false
      webhook_url: ""
      headers: {}

  # ── ERROR LOGGING ─────────────────────────────────────────────
  errors:
    log_parsing_errors: true
    hardware_limitation_errors: true
    runtime_errors: true
    validation_errors: true

    # Error log destination
    error_log_file: /workspace/logs/errors.log

# ── METRICS COLLECTION ───────────────────────────────────────────
metrics:
  enabled: true

  # ── COLLECTION LEVELS ───────────────────────────────────────
  collection:
    pipeline_level:
      - total_duration_secs
      - average_step_duration_secs
      - parallelism_efficiency

    step_level:
      - execution_time_secs
      - memory_peak_mb
      - cache_hit_rate

    model_level:
      - inference_time_ms
      - tokens_processed
      - cache_hit_rate

    tool_level:
      - execution_time_ms
      - success_rate
      - retry_count

    custom_metrics:
      - name: code_quality_score
        description: "Calculated from lint results"
      - name: test_coverage_percent
        description: "Derived from test output"

  # ── PERFORMANCE OPTIMIZATION ───────────────────────────────────
  performance_optimization:
    cache:
      enabled: true
      ttl_seconds: 3600
      max_size_mb: 1024
      eviction_policy: lru  # lru | lfu | fifo

    batching:
      enabled: true
      batch_similar_operations: true

    prefetching:
      enabled: true
      prefetch_next_steps: true
      prefetch_lookahead: 3

    memory_optimization:
      enabled: true
      optimize_memory_access_pattern: true
      use_streaming: true

  # ── OUTPUT CONFIGURATION ───────────────────────────────────────
  output:
    path: /workspace/metrics/workflow_metrics.json
    format: json
    include_timestamps: true
    aggregation_interval_secs: 60

# ── VALIDATION CONFIGURATION ───────────────────────────────────────
validation:
  # ── WORKFLOW SCHEMA VALIDATION ─────────────────────────────
  workflow_schema:
    enabled: true
    required_fields: [workflow_id, name, models]
    valid_model_uris: ["lmstudio://", "ollama://", "llamacpp://"]

  # ── STEP OUTPUT VALIDATION ─────────────────────────────────────
  step_outputs:
    enabled: true
    validate_format: json
    schema_path: /schemas/step_output.json

  # ── BUSINESS RULES ─────────────────────────────────────────────
  business_rules:
    enabled: true
    rules:
      - rule: "quality_score >= 0.95"
        severity: error
        description: "Code quality must meet minimum threshold"

      - rule: "test_coverage >= 0.80"
        severity: warning
        description: "Test coverage should be at least 80%"

# ── ORCHESTRATION CONFIGURATION ───────────────────────────────
orchestration:
  enabled: true

  # ── STEP COORDINATION ───────────────────────────────────────
  step_coordination:
    max_concurrent_steps: 10
    step_priority: fifo  # fifo | priority_queue | user_defined

    inter_step_dependencies:
      enabled: true
      resolution_strategy: wait_for_all  # wait_for_all | continue_with_available | skip_failed
      dependency_timeout_secs: 300

    wait_strategy: eager  # eager | lazy
    event_propagation_delay_ms: 100

  # ── SUB-AGENT ORCHESTRATION ─────────────────────────────
  sub_agent_orchestration:
    enabled: true

    sub_agents:
      # ── SUB-AGENT DEFINITIONS ─────────────────────────
      - id: code_analyzer_sub
        name: "Code Analyzer Sub-Agent"
        description: "Analyzes codebase structure and patterns"
        workflow_ref: code_analysis_workflow
        alias: analyzer

        validation_config:
          type: loop
          max_iterations: 4
          tolerance: 0.05

        interdependent_validations:
          - depends_on: [refactor_generator_sub, doc_generator_sub]
            validation_criteria:
              metric: code_quality
              operator: ">="
              target: 0.90
            on_failure: relax_criteria
            relaxation_factor: 0.10

    # ── EVENT HANDLING ───────────────────────────────────────────
    event_handling:
      on_validation_result:
        aggregate_at_top_level: true
        propagate_to_dependents: true
        log_result: true

      on_interdependent_failure:
        notify_dependent_sub_agents: true
        adjust_validation_criteria: true
        propagate_failure_up: true
        retry_affected_sub_agents: true

      on_checkpoint:
        save_state_snapshot: true
        notify_all_sub_agents: true
        track_version: true

  # ── VALIDATION AGGREGATION ─────────────────────────────────
  validation_aggregation:
    strategy: hierarchical  # hierarchical | conjunction | disjunction | weighted

    overall_validation_criteria:
      - name: code_quality_score
        weight: 0.30
        required: true
        threshold: 0.90

      - name: documentation_completeness
        weight: 0.25
        required: true
        threshold: 0.85

      - name: all_sub_workflows_valid
        weight: 0.25
        required: true

      - name: performance_acceptable
        weight: 0.20
        required: true
        threshold: 0.85

    overall_threshold: 0.85  # 85% combined score
    min_metrics_required: 4  # All 4 must pass

  # ── CHECKPOINT COORDINATION ───────────────────────────────────
  checkpoint_coordination:
    enabled: true
    interval_steps: 3

    on_checkpoint:
      notify_all_sub_agents: true
      save_global_state: true
      increment_version: true

# ── PROVIDER CONFIGURATION ────────────────────────────────────────
# Provider default overrides
# Supports both inline configuration and file path references
providers:
  # ── PROVIDER: LM STUDIO ────────────────────────────────────
  lmstudio:
    # Option 1: Inline configuration
    config:
      host: localhost
      port: 1234
      connection_timeout_secs: 30
      max_retries: 3

    # Option 2: File path override (takes precedence over inline)
    config_file: ./workspace/providers/lmstudio.yml
    # File format: same as this config object
    # File path overrides inline config if specified

    # ── MODEL HOSTING ───────────────────────────────────────────
    hosting:
      max_concurrent_models: 3
      model_offload_timeout_secs: 60
      cache_models: true

      gpu_allocation:
        enabled: true
        vram_per_model_mb: 4096

      cpu_fallback:
        enabled: true
        cpu_cores_per_model: 2

    # ── REQUEST HANDLING ────────────────────────────────────────
    requests:
      max_concurrent_requests: 5
      request_timeout_secs: 120
      queue_timeout_secs: 300
      rate_limit_per_minute: 60

      retry:
        enabled: true
        max_retries: 3
        backoff_strategy: exponential

  # ── PROVIDER: OLLAMA ────────────────────────────────────────
  ollama:
    config_file: ./workspace/providers/ollama.yml
    # Same structure as lmstudio config

  # ── PROVIDER: LLAMA CPP WITH VULKAN ───────────────────────
  llama_cpp_with_vulkan:
    config_file: ./workspace/providers/llama_cpp.yml
    # Same structure as lmstudio config

# ── RAG KNOWLEDGE BASE CONFIGURATION ─────────────────────────
rag:
  enabled: false

  # ── KNOWLEDGE BASE STORAGE ───────────────────────────────────
  knowledge_base:
    path: /workspace/rag/knowledge_base
    format: vector_db  # vector_db | file_based | memory_based
    chunk_size: 512
    chunk_overlap: 50

  # ── EMBEDDING MODEL ─────────────────────────────────────────
  embedding_model:
    model_ref: "${models.embedding_model}"
    dimension: 768
    batch_size: 32

  # ── RETRIEVAL CONFIGURATION ───────────────────────────────
  retrieval:
    max_results: 10
    similarity_threshold: 0.7
    include_sources: true

# ── WORKSPACE CONFIGURATION ───────────────────────────────────────
workspace:
  root_path: /workspace

  # ── DIRECTORY STRUCTURE ───────────────────────────────────────
  directories:
    output: /workspace/output
    checkpoints: /workspace/checkpoints
    logs: /workspace/logs
    metrics: /workspace/metrics
    backups: /workspace/backups
    temp: /workspace/temp
    rag_knowledge_base: /workspace/rag/knowledge_base

  # ── FILE PERMISSIONS ───────────────────────────────────────────
  permissions:
    default_mode: 755  # Octal notation
    owner_read: true
    owner_write: true
    owner_execute: true
    group_read: true
    group_write: false
    group_execute: true
    other_read: true
    other_write: false
    other_execute: true

# ── FEATURES DEMONSTRATED ───────────────────────────────────────
features_demonstrated:
  model_configuration: true
  multi_model_support: true
  execution_modes: true
  memory_management: true
  hierarchical_logging: true
  retry_logic: true
  loop_variations: true
  validation_loops: true
  tool_execution: true
  tool_permissions: true
  convergence_loops: true
  rag_operations: true
  nested_workflow_references: true
  web_operations: true
  script_cli_execution: true
  auto_model_routing: true
  conditional_branching: true
  event_based_workflows: true
  interdependent_validation: true
  prompt_passing: true
  variable_references: true
  metrics_collection: true
  state_management: true
  file_operations: true
  checkpoint_save_restore: true
  bidirectional_event_propagation: true
  sub_agent_orchestration: true
  weighted_validation_criteria: true
  strict_yes_no_decisions: true
  user_inputs: true
  hooks: true
  guardrails: true
  provider_config_files: true
  global_model_config: true
  schema_versioning: true
  configuration_profiles: true

# ── SCHEMA METADATA ───────────────────────────────────────────
schema_version: "1.0.0"
min_schema_version: "1.0.0"

# ── DOCUMENTATION REFERENCES ─────────────────────────────────────
# For schema documentation, see:
# - Main reference: https://docs.example.com/schema/v1.0
# - Model configuration: https://docs.example.com/schema/models
# - Execution strategy: https://docs.example.com/schema/execution
# - Hooks reference: https://docs.example.com/schema/hooks
# - Tools reference: https://docs.example.com/schema/tools
