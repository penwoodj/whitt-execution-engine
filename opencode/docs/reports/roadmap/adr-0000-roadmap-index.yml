---
adr_id: ADR-0000
title: Roadmap index
status: Accepted
date: 2026-03-06

context: This ADR is master index linking all roadmap ADRs and research plans. It establishes execution order, dependency mapping, governance rules, and quality gates.

decision:
  Adopt a roadmap structure with:
    - Master index linking all ADRs and research plans
    - Explicit execution order and dependency mapping
    - ADR lifecycle: Proposed, Accepted, Deprecated, Superseded
    - Research plan incorporation workflow
    - Governance rules and quality gates
    - Dual execution modes (Execution Engine vs Code Generator)

scope:
  included:
    - Roadmap phase definitions
    - ADR sequence and dependencies
    - Research plan coordination
    - Quality gates for v0.1.0 and later releases
  excluded:
    - Detailed implementation of individual ADRs
    - Specific research findings

consequences:
  positive:
    - Clear dependency management
    - Coordinated research execution
    - Governance prevents scope creep
  negative:
    - More upfront planning overhead
    - Requires active maintenance

follow_on_adrs:
  - ADR-0001 for foundation compiler contract
  - ADR-0002 for MVP queue and scheduler
  - ADR-0003 for CLI and backends
  - ADR-0004 for UI control plane
  - ADR-0005 for quality loops
  - ADR-0006 for memory and search
  - ADR-0007 for automation
  - ADR-0008 for autonomy

supports_research_plans:
  - research-plan-01-foundation
  - research-plan-02-mvp-queue-cli
  - research-plan-03-networking-ui-backends
  - research-plan-04-quality-memory-search
  - research-plan-05-automation-autonomy-metrics

schema_reference:
  unified-workflow-schema:
    path: ../requirements/unified-workflow-schema.yml
    purpose: Single source of truth for workflow structure and semantics consolidating all requirements

validation_criteria:
  - All ADRs explicitly reference their execution order
  - All dependencies are correctly mapped
  - Research plans clearly state their supported ADRs
  - Quality gates are defined before v0.1.0 release
