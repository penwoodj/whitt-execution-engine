---
adr_id: ADR-0003
title: CLI, backends, and networking boundary
status: Proposed
date: 2026-03-06

context: CLI-first path before UI; networking non-MVP but needs boundary design; provider abstraction needed for multiple local runners.

decision:
  - Runtime core: shell-agnostic, exposed through CLI/TUI first
  - Model access: provider abstraction normalizing local runners (llama.cpp, LM Studio, vLLM)
  - Packaging: generated Rust project depending on shared backend crate
  - Networking: explicit opt-in capability boundary with provenance tracking
  - Progressive delivery: partial results for interactive flows
  - Tool nodes: custom Rust tools with declared effects and permissions

scope:
  included:
    - CLI commands and ergonomics
    - backend provider abstraction
    - packaging strategy (standalone vs backend crate)
    - networking policy boundary
    - progressive result delivery
    - custom Rust tool support
  excluded:
    - Rich desktop UI (deferred to ADR-0004)
    - Full autonomous networking

consequences:
  positive:
    - CLI provides fast iteration and inspection
    - Provider abstraction enables backend swapping
    - Networking opt-in ensures privacy by default
  negative:
    - CLI may limit discoverability vs GUI
    - Packaging decision affects deployment complexity

follow_on_adrs:
  - ADR-0004 for Glyphnova UI control plane
  - ADR-0005 for quality loops

supported_by_research_plan:
  - research-plan-03-networking-ui-backends

related_requirements:
  - R05: CLI/TUI-first path
  - R18: Tools and custom Rust tools as first-class nodes
  - R23: Standalone Rust project vs backend crate vs inlining backend code
  - R27: Progressive results and partial answers
  - R32: Model provider abstraction for multiple local runners

validation_focus_v0_1_0:
  - CLI exposes all necessary queue and scheduler operations
  - Provider abstraction loads and unloads models correctly
  - Networking actions are opt-in with explicit user confirmation
  - Progressive results stream to CLI for long-running workflows
  - Packaging strategy produces distributable artifacts
