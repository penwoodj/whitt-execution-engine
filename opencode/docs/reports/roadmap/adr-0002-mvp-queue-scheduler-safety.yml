---
adr_id: ADR-0002
title: MVP work container, queue, scheduler, and human-gated safety
status: Accepted
date: 2026-03-06

context: The immediate roadmap focus is workflow queue, scheduling, and human-input MVP usefulness. The queue is not just UI history. It is execution control plane for scoped chats, priorities, statuses, confirmations, and result delivery.

decision:
  For v0.1.0, build MVP around a persistent scheduler-backed work-container model:
    - ChatSession: primary scoped work container
    - Queue items: executable runs with explicit lifecycle states
    - Scheduler: supports prioritization, cancellation, retries, persistence, and result retrieval
    - Policy sliders: compile into deterministic scheduler and gating settings
    - Risky or ambiguous workflows: insert clarification and confirmation checkpoints before impactful actions
    - File mutation: staged and preview-first, with approval required for destructive or broad-scope changes
    - CLI: first full control surface for queue inspection, enqueueing, priority updates, approvals, and result retrieval
    - Dual execution modes:
      * Execution Engine: Direct YAML → WorkflowIR → Execution (development, iteration, self-improvement)
      * Code Generator: YAML → WorkflowIR → Rust Code → Compile → Execution (production, reusable code)

scope:
  included:
    - queue state model
    - run states
    - priority policy
    - scheduler persistence
    - human-in-the-loop checkpoints
    - scoped filesystem safety
    - staged diffs
    - baseline observability
    - execution modes (direct execution vs code generation)
    - workflow improvement loop (execution logs → improvements → regeneration)
  excluded:
    - drag-and-drop polish
    - rich graph views
    - fully autonomous endless loops

consequences:
  positive:
    - safe MVP with real utility
    - auditable control plane
    - clear boundary between planning and execution
  negative:
    - more state-machine complexity
    - approvals may slow some runs by design

validation_focus_v0_1_0:
  - enqueue, cancel, reprioritize, resume operations work correctly
  - safe scope enforcement prevents unauthorized file access
  - approval checkpoints fire when expected (high-risk operations)
  - staged diff generation produces accurate change previews
  - persistence survives process restart
  - partial result retrieval works for interactive jobs
  - scheduler respects priority and concurrency constraints

schema_reference:
  unified-workflow-schema:
    path: ../requirements/unified-workflow-schema.yml
    purpose: Defines queue and scheduler semantics for WorkflowSpec

follow_on_adrs:
