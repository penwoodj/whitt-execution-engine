---
adr_id: ADR-0007
title: Cron execution git-branch experimentation and refining workflows
status: Accepted
date: 2026-03-06

context: The roadmap then adds cron jobs over backed-up text files experiments across git branches merging agentic workflows and manual refining.

decision:
  Treat scheduled experiments as governed workflow campaigns with transpiler integration:
    - Cron jobs instantiate versioned workflow runs from stable specs
    - Backed-up text corpora are immutable inputs to scheduled experiments unless explicitly promoted
    - Git-aware experiments run in isolated working copies or branches with explicit merge policies
    - Manual refinement is preserved as artifacted review events rather than an implicit side channel
    - Merge recommendations are outputs not auto-commits until confidence and validation thresholds are mature
    - Scheduling and cron policies are compiled into the WorkflowIR not interpreted at runtime

scope:
  included:
    - cron job scheduling from workflow definitions
    - persistent experiment manifests and state tracking
    - git branch isolation and workspace management
    - merge proposal generation with validation criteria
    - manual refinement capture and review event artifacts
    - experiment result tracking and comparison
    - rollback and cleanup procedures for failed experiments
  excluded:
    - always-on autonomous loops without scheduling controls
    - direct main branch manipulation without experiments
    - broad cross-repo automation
    - unmanaged cron expressions without safety limits

consequences:
  positive:
    - enables automated recurring workflows with safety
    - git experiments provide repeatable test environments
    - manual refinement is preserved and auditable
    - merge policies prevent accidental main branch corruption
  negative:
    - more operational complexity in scheduling and git management
    - storage growth from experiment artifacts and branches
    - manual review gating may slow automation

schema_reference:
  unified-workflow-schema:
    path: ../requirements/unifying-schema/unified-workflow-schema.yml
    purpose: Defines cron scheduling and git integration for WorkflowSpec

follow_on_adrs:
  - ADR-0002 for queue and scheduler integration with cron scheduling
  - ADR-0003 for backend provider abstraction across git workflows
  - ADR-0005 for workflow artifactization and experiment tracking
  - ADR-0006 for web access logging in git experiments

supported_by_research_plan:
  - research-plan-05-automation-autonomy-metrics

related_requirements:
  - R17: Multiple workflow archetypes and scheduling modes
  - R24: Queue semantics worker pools persistence cancellation and result retrieval
  - R26: Long-running behavior for background semi-endless endless and resumable workflows
  - R30: Observability with logging levels summaries graphs reports and provenance

validation_focus_v0_1_0:
  - Cron jobs execute workflows with proper environment isolation
  - Git experiments run in isolated branches without affecting main code
  - Merge proposals are generated with clear diff recommendations
  - Manual refinement events are captured as auditable artifacts
  - Experiment results are tracked and comparable
  - Rollback procedures exist for failed experiments

validation_focus_v0_1_x_and_later:
  - Scheduling supports automated recurring workflows without manual triggers
  - Git experimentation framework enables parallel test branches
  - Merge automation with validation prevents breaking changes
  - Manual refinement workflow integrates with artifact review system
  - Cron policies include resource limits and failure handling
  - Automation workflows maintain auditability through observability

transpiler_integration_points:
  - WorkflowIR should support scheduling modes for cron and long-running workflows
  - Cron expressions should compile into WorkflowIR scheduling nodes
  - Git-aware tool nodes require branch context and merge policy declarations
  - Experiment artifacts should reference workflow version and policy snapshot
  - Manual refinement operations require review workflow integration
