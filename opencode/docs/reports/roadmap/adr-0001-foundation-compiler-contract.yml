---
adr_id: ADR-0001
title: Foundation compiler contract and local-first system-of-record
status: Proposed
date: 2026-03-06

context: The product identity is a compiler-centered, local-first agentic orchestration framework rather than a thin chat wrapper. The core risks are ambiguity in workflow representation, weak replayability, and accidental drift between prompt planning, execution, storage, and review.

decision:
  Adopt a foundation architecture with:
    - Canonical execution unit: typed WorkflowSpec and compiled WorkflowIR
    - Authoring surface: constrained YAML DSL, validated against generated schemas, compiled into Rust-oriented execution target
    - Every chat: scoped executable work container with local .glyphnova/ system-of-record
    - Policy: compiled into deterministic fields (runtime, review, scope, concurrency, logging, context budget)
    - All runs persist: workflow specs, policy snapshots, artifact references, hashes, provenance metadata

scope:
  included:
    - system identity
    - local-first defaults
    - YAML DSL contract
    - prompt-to-YAML planning layer
    - explicit DAG/state-machine semantics
    - core transpilation target
    - reproducibility and privacy defaults
    - release-plan and validation-plan anchors
  excluded:
    - final UI shell
    - networking-heavy integrations
    - advanced autonomy loops

consequences:
  positive:
    - strong traceability
    - replayability
    - inspectable workflows
    - easier code generation and validation
    - stable foundation for CLI and UI shells
  negative:
    - more up-front schema and IR design work
    - stricter modeling may slow early prototyping

initial_implementation_notes:
  - Prefer typed Rust structs plus schema generation over ad-hoc YAML maps
  - Store workflow, policy, logs, summaries, reports, and hashes under .glyphnova/
  - Define a stable ADR-aware directory layout before code generation begins
  - Treat validation criteria for v0.1.0 as artifacts stored beside foundation spec

follow_on_adrs:
  - ADR-0002 for queue and scheduler semantics
  - ADR-0003 for packaging, backend abstraction, and networking boundary

supported_by_research_plan:
  - research-plan-01-foundation

related_requirements:
  - R01: System identity
  - R03: Local-first operation
  - R15: Schema-based YAML DSL
  - R16: Prompt to YAML workflow generation planning
  - R19: Explicit DAG/state-machine semantics
  - R22: YAML to Rust AgentSDK execution target
  - R28: Per-chat workspace and .glyphnova/ system-of-record
  - R31: Auditable local artifacts, versioned runs, hashes, privacy-preserving defaults

schema_reference:
