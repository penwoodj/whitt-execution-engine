---
adr_id: ADR-0008
title: Autonomous loops and metrics-driven FE and BE UX expansion
status: Proposed
date: 2026-03-06

context: The long arc is toward fully autonomous useful local loops and interface experimentation driven by objective metrics. This must not erase safety inspectability or human override.

decision:
  Enable autonomy only on top of measured reviewable foundations with transpiler observability:
    - Autonomous loops are declared workflow modes with bounded goals checkpoints and stop conditions
    - Metrics for FE and BE UX are instrumented before large-scale interface experimentation
    - Objective measurements include usefulness time-to-usefulness intervention rate repair rate benchmark quality and operator trust signals
    - Human override pause and scope visibility remain available at all times
    - Autonomy inherits provenance policy and artifact requirements from earlier ADRs
    - Observability and metrics collection is integrated into transpiler runtime not bolted on

scope:
  included:
    - autonomous loop contracts with explicit bounds
    - stop conditions and checkpoint generation
    - metrics instrumentation for workflows and model performance
    - success and regression dashboards
    - human override controls and intervention logging
    - confidence and validation thresholds for autonomous decisions
    - autonomy scope boundaries and risk assessment
  excluded:
    - fully autonomous always-on loops without bounds
    - opaque self-modifying behavior without artifacts
    - unmeasured autonomous decisions
    - removal of human override or pause capabilities

consequences:
  positive:
    - progress toward useful local autonomy without losing auditability
    - objective metrics drive interface improvements
    - human operators maintain control while automation improves
    - bounded autonomy enables safe experimentation
  negative:
    - autonomy pressure can tempt premature expansion
    - instrumentation overhead is real
    - scope boundaries may need adjustment over time

follow_on_adrs:
  - ADR-0002 for queue and scheduler support for autonomous workflows
  - ADR-0005 for benchmark suite integration with autonomous workflows
  - ADR-0006 for observability integration with autonomy metrics
  - ADR-0007 for cron scheduling and git automation in autonomous loops

supported_by_research_plan:
  - research-plan-05-automation-autonomy-metrics

related_requirements:
  - R12: Runtime review rigor scope concurrency efficiency logging context-budget policy layer
  - R25: Generate to verify repair review loop semantics
  - R30: Observability with logging levels summaries graphs reports and provenance
  - R04: Depth-over-speed and capability-normalized outcomes
  - R26: Long-running behavior for background semi-endless endless and resumable workflows

validation_focus_v0_1_0:
  - Autonomous loops respect bounded goals and stop conditions
  - Metrics collection captures all relevant performance and quality signals
  - Human override and pause controls are always functional
  - Dashboards provide real-time visibility into autonomous operations
  - Observability integrates with .glyphnova/ artifact system
  - Validation thresholds prevent unsafe autonomous expansion

validation_focus_v0_1_x_and_later:
  - Bounded autonomy enables safe experimentation with clear limits
  - Metrics-driven decisions are based on objective data not guesses
  - Human operators can intervene at any point with full context
  - Dashboards enable trend analysis and anomaly detection
  - Autonomy features integrate with queue scheduler and artifact tracking
  - Progressive autonomy is possible through validated threshold adjustments

transpiler_integration_points:
  - WorkflowIR should support autonomous loop modes and bounded execution
  - Observability hooks must capture autonomous loop events
  - Metrics collection should be integrated into WorkflowIR execution
  - Stop conditions and checkpoints should be first-class WorkflowIR nodes
  - Human override controls must override autonomous workflow execution
  - Dashboard queries should aggregate autonomous workflow metrics
  - Autonomy policies should be compiled into WorkflowIR not dynamic
