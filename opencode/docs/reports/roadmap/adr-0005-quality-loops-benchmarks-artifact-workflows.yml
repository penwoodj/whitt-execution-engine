---
adr_id: ADR-0005
title: Quality loops, artifact workflows, and benchmark-driven file-type expansion
status: Proposed
date: 2026-03-06

context: After CLI and UI usefulness threshold, roadmap shifts toward improving output quality across file types through local agentic flows, testing, benchmarking, and workflows that create other workflows.

decision:
  Make review, repair, benchmark, and artifact-driven iteration first-class capabilities:
    - Generate-verify-repair loops: runtime semantics, not optional prompt style
    - Benchmark suites: stored artifacts tied to workflow version, policy snapshot, backend, and file type
    - Workflow specs: editable artifacts, transformable by later workflows under review controls
    - Observability: produces summaries, reports, graphs, and benchmark outputs

scope:
  included:
    - verifier interfaces
    - repair loops
    - benchmark harness design
    - file-type capability matrix
    - artifactized workflow libraries
    - report generation
  excluded:
    - memory retrieval internals
    - web scraping details
    - fully autonomous scheduling

consequences:
  positive:
    - systematic quality improvement
    - measurable progress per file type
    - strong inputs for lunch-and-learn checkpoints
  negative:
    - benchmark curation can be expensive
    - more artifacts to manage and prune

schema_reference:
  unified-workflow-schema:
    path: ../requirements/unified-workflow-schema.yml
    purpose: Defines quality loops and benchmark semantics for WorkflowSpec

follow_on_adrs:
  - ADR-0006 for memory and search

supported_by_research_plan:
  - research-plan-04-quality-memory-search

related_requirements:
  - R04: Depth-over-speed and capability-normalized outcomes
  - R21: Artifact semantics - workflows are inspectable, editable artifacts
  - R25: Generate to verify to repair review loop semantics
  - R30: Observability - logging levels, summaries, graphs, reports, and provenance

validation_focus_v0_1_0:
  - Generate-verify-repair loops execute as runtime semantics
  - Benchmark suites store with complete metadata
  - Observability outputs are structured and queryable
  - File-type benchmarks track quality metrics per language
  - Reports include actionable insights for improvement
