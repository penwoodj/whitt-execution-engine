---
adr_id: ADR-0006
title: Local memory retrieval web search and web scraping
status: Accepted
date: 2026-03-06

context: The roadmap next adds orchestration workflow creation then local memory then web scraping and search. These features can easily break privacy and determinism if they are bolted on.

decision:
  Introduce retrieval in layered form with transpiler integration:
    - Local memory is added before remote search and scraping
    - Retrieval has two planes: local structured and unstructured memory plus external research and scraping tools behind explicit policy gates
    - Search combines exact or full-text retrieval with semantic retrieval rather than relying on vectors alone
    - Web access records provenance timestamps and extraction traces as artifacts
    - Robots and scope restrictions are enforced before external scraping actions run
    - Memory and search artifacts are stored in .glyphnova/memory/ with versioned references

scope:
  included:
    - local memory architecture for workflows
    - search indexing and retrieval for workflow artifacts
    - external search adapters with policy gates
    - scraping compliance rules
    - provenance capture for all web and search operations
    - memory artifact versioning and garbage collection
  excluded:
    - fully autonomous web crawling
    - vector-only retrieval without exact search
    - pre-indexed remote corpora
    - distributed memory systems

consequences:
  positive:
    - workflows can access local context for better decisions
    - search improves workflow discoverability across artifacts
    - scraping is controlled and auditable
    - retrieval balance enables both exact and semantic matching
  negative:
    - more storage subsystems to manage
    - policy surface area increases complexity
    - search may impact performance for large artifact collections

schema_reference:
  unified-workflow-schema:
    path: ../requirements/unified-workflow-schema.yml
    purpose: Defines memory and search semantics for WorkflowSpec

follow_on_adrs:
  - ADR-0001 for .glyphnova/ directory structure
  - ADR-0002 for queue state persistence and artifact storage
  - ADR-0005 for workflow artifactization

supported_by_research_plan:
  - research-plan-04-quality-memory-search

related_requirements:
  - R18: Tools and custom Rust tools as first-class nodes
  - R30: Observability with logging levels summaries graphs reports and provenance
  - R31: Auditable local artifacts versioned runs hashes and privacy-preserving defaults
  - R04: Depth-over-speed and capability-normalized outcomes

validation_focus_v0_1_0:
  - Local memory stores and retrieves workflow artifacts reliably
  - Search indexing supports efficient artifact discovery
  - External search is behind explicit policy gates and opt-in
  - Scraping respects robots.txt and scope restrictions
  - Provenance records capture timestamps extraction traces and artifacts
  - Memory garbage collection prevents unbounded growth

validation_focus_v0_1_x_and_later:
  - Search performance scales to large artifact collections
  - Retrievable artifacts enable workflow re-execution and debugging
  - Policy enforcement prevents unauthorized web or search access
  - Scraping guardrails protect against robots violations and over-scraping
  - Provenance metadata enables audit trails and compliance verification

transpiler_integration_points:
  - WorkflowIR should reference memory artifacts for context injection
  - Tool nodes should declare memory read/write effects
  - External search tools require policy compilation and approval
  - Scraping operations require policy gates and provenance logging
  - Search results should integrate with .glyphnova/ artifact references
