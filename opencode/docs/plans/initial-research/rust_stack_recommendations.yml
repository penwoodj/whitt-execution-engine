rust_stack_recommendations:
  yaml_parsing:
    crates:
      - name: "rust_yaml"
        rationale: "Provides safe, zero-copy YAML parsing and comprehensive error handling, suitable for YAML workflow DSLs."
        risks: "Smaller community than serde_yaml; may need wrappers for advanced features."
      - name: "serde_yaml"
        rationale: "Widely used for serializing/deserializing YAML into Rust structs with serde integration."
        risks: "Less strict about YAML 1.2 specifics; slower than low-level parsers."
      - name: "saphyr"
        rationale: "Underlying parser for yaml12 with strict YAML 1.2 compliance; used when round-trip formatting is critical."
        risks: "Less documentation and ecosystem support."
  schema_validation:
    crates:
      - name: "schemars"
        rationale: "Derive JSON Schema from Rust types for validating tool contracts and workflow schemas."
        risks: "Limited support for advanced constraints; may not cover all YAML semantics."
      - name: "valico"
        rationale: "Alternate JSON Schema validator for Rust; provides validation functions without macro derivation."
        risks: "Less integration with Rust types compared to schemars."
  code_generation:
    crates:
      - name: "quote"
        rationale: "Enables generating Rust code from macros or codegen scripts with hygiene and span support."
        risks: "Requires familiarity with Rust macro syntax; may produce verbose code."
      - name: "syn"
        rationale: "Parses Rust source into an AST, useful for code analysis and generation."
        risks: "Large dependency; compile times may be higher."
      - name: "walkdir"
        rationale: "Recursively traverses directories to discover files (e.g., templates or schemas) during code generation."
        risks: "Simple utility; minimal risk."
      - name: "phf"
        rationale: "Generates compile-time hash maps; useful for tool registry lookups."
        risks: "Static maps require recompilation to update."
      - name: "askama"
        rationale: "Provides type-safe templates for code and report generation using Jinja-like syntax."
        risks: "Template macros can complicate compile errors."
  cli_tui:
    crates:
      - name: "clap"
        rationale: "Feature-rich command-line parser with help generation, suggestions and shell completions."
        risks: "Breaking changes across major versions; careful version pinning needed."
      - name: "tui"
        rationale: "Builds rich terminal UIs; uses Crossterm backend for portability."
        risks: "Limited documentation for complex layouts; may require manual layout management."
      - name: "crossterm"
        rationale: "Cross-platform terminal manipulation library used by tui; useful for custom TUI needs."
        risks: "Lower-level API requiring additional code for widgets."
  job_queue_and_scheduler:
    crates:
      - name: "dbq"
        rationale: "Implements a PostgreSQL-backed job queue with migrations and worker pools."
        risks: "Requires a database server; heavy for pure local mode."
      - name: "job_scheduler"
        rationale: "Simple cron-like scheduler for Rust; useful for implementing cron job mode."
        risks: "Limited to basic cron expressions; no persistence by default."
      - name: "work_queue"
        rationale: "Concurrent work-stealing queue for multi-threaded task distribution."
        risks: "Fixed number of local queues; not distributed across processes."
      - name: "tokio_cron_scheduler"
        rationale: "Provides cron scheduling for async Tokio tasks; integrates with asynchronous runtime."
        risks: "Depends on Tokio; heavy when using non-async code."
  embedded_storage:
    crates:
      - name: "sled"
        rationale: "Pure-Rust embedded database offering high performance key-value storage."
        risks: "APIs may change outside semver; limited query capabilities."
      - name: "typed_sled"
        rationale: "Strongly typed wrapper over sled with search engine support and key generation."
        risks: "Extra abstractions may reduce flexibility."
      - name: "kv"
        rationale: "Offers typed buckets and transactions built on sled, with watchers for changes."
        risks: "Less popular; may have fewer contributors."
      - name: "redb"
        rationale: "Lightweight key-value store emphasising simplicity and concurrency."
        risks: "Less mature than sled; fewer features."
  logging_tracing:
    crates:
      - name: "tracing"
        rationale: "Structured logging with spans and events; well-suited to asynchronous Rust."
        risks: "Requires instrumentation across the codebase."
      - name: "log"
        rationale: "Basic logging facade used by many crates; compatible with env_logger or tracing subscribers."
        risks: "Less structured; lacks context propagation."
      - name: "fern"
        rationale: "Flexible logging builder allowing multiple outputs and formats."
        risks: "Less widespread adoption."
  diff_and_patch:
    crates:
      - name: "similar"
        rationale: "Provides multiple diff algorithms and unified diff output utilities."
        risks: "High-level diff may be slower for large files."
      - name: "patch"
        rationale: "Parses and produces unified diffs; compatible with Git patches."
        risks: "Limited to unified diff format; no context-free diff."
      - name: "difference"
        rationale: "Minimal crate for diffing strings and slices; good for small inputs."
        risks: "Not suitable for large file diffs."
  plugin_and_sandbox:
    crates:
      - name: "dynamic_plugin"
        rationale: "Introduces safe dynamic plugin loading with compile-time checks."
        risks: "Dynamic loading can be complex; requires stable ABI."
      - name: "wasm_sandbox"
        rationale: "Runs untrusted code in a WebAssembly sandbox with resource limits."
        risks: "Performance overhead of WebAssembly; limited I/O."
      - name: "wasmtime"
        rationale: "General-purpose WebAssembly runtime; can embed guest modules safely."
        risks: "Larger dependency; may be overkill for small plugins."
  graph_and_algorithms:
    crates:
      - name: "petgraph"
        rationale: "Flexible graph library supporting algorithms and Graphviz DOT output."
        risks: "Requires manual management of node and edge data; no built-in persistence."
      - name: "daggy"
        rationale: "Simplified DAG structure built on petgraph for acyclic graphs."
        risks: "Limited features compared to full petgraph."
  scheduling_and_cron:
    crates:
      - name: "cronjob"
        rationale: "Allows scheduling recurring functions with fine-grained control."
        risks: "Separate threads may complicate resource management."
      - name: "quartz_scheduler"
        rationale: "Alternative scheduler supporting cron and recurring tasks."
        risks: "Less widely adopted; may have fewer features."
  concurrency_and_runtime:
    crates:
      - name: "tokio"
        rationale: "Asynchronous runtime for Rust with tasks, timers and channels."
        risks: "Learning curve; ties code to async patterns."
      - name: "rayon"
        rationale: "Data-parallelism library for CPU-bound tasks."
        risks: "Limited to synchronous workloads; cannot handle async I/O."
      - name: "crossbeam"
        rationale: "Provides channels, deques and concurrency primitives."
        risks: "Lower-level; requires careful design for safety."
  summary:
    notes: "The chosen stack prioritises safety, determinism and performance. Crate versions should be pinned to avoid breaking changes, and integrations should include tests and migration strategies."
