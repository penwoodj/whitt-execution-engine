local_llm_performance_playbook:
  quantization:
    description: "Use low-bit quantization to reduce memory requirements and enable running larger models on limited hardware."
    guidelines:
      - "Prefer 8-bit or 4-bit quantized models (GGUF, GPTQ) for low-RAM devices."
      - "Quantization may reduce accuracy; select models trained for quantization when possible."
      - "Verify that the chosen runtime supports the quantization format."
  memory_bandwidth_and_kv_cache:
    description: "Memory bandwidth is a bottleneck for local inference; manage KV cache size and transfers."
    guidelines:
      - "Minimize context length to reduce KV cache; summarize intermediate steps and avoid unnecessary history."
      - "Batch multiple tokens where possible to reduce memory transfers per token."
      - "Cache frequently used prompts and results to avoid recomputation."
  speculative_decoding:
    description: "Leverage speculative decoding with a draft model to accelerate generation by batching future tokens."
    guidelines:
      - "Use a smaller draft model to propose several tokens; verify them with the main model."
      - "Tune the number of speculative tokens based on hardware; 4–8 tokens may offer a good tradeoff."
      - "Monitor memory usage because running two models concurrently increases RAM requirements."
  gpu_offloading:
    description: "Decide when to offload layers to GPU based on model size and memory bandwidth."
    guidelines:
      - "Small models or CPU-bound workloads may run faster on CPU only; test both CPU and GPU configurations."
      - "For large models, offload the first few layers to GPU while keeping later layers on CPU to balance bandwidth."
      - "Use hybrid modes in runtimes like llama.cpp to mix CPU and GPU execution."
  paged_attention_and_continuous_batching:
    description: "Use engines like vLLM that implement PagedAttention to improve throughput and context length."
    guidelines:
      - "PagedAttention divides the KV cache into pages, reducing fragmentation and allowing longer context windows."
      - "Continuous batching reuses KV cache across concurrent requests; ideal for API servers."
      - "Consider vLLM or LocalAI for API-based access when throughput is critical."
  model_selection:
    description: "Choose the right local LLM framework based on use case and interface preferences."
    frameworks:
      - name: "Ollama"
        advantages: "Simple CLI; supports over 30 models; provides OpenAI-compatible API; streaming responses."
        considerations: "Limited configurability; no GUI."
      - name: "LM Studio"
        advantages: "Graphical interface; curated model search; adjustable CPU threads and GPU layers; REST API server."
        considerations: "Not open source; manual integration via configuration file."
      - name: "text-generation-webui"
        advantages: "Flexible web UI; supports multiple backends and model formats; downloads models via UI."
        considerations: "Heavier to run; requires browser; limited headless operation."
      - name: "GPT4All"
        advantages: "Polished desktop app for Windows; preconfigured models; conversation memory; local document analysis."
        considerations: "Focuses on consumer usage; limited developer APIs."
      - name: "LocalAI"
        advantages: "Developer-oriented API; supports llama.cpp, vLLM and transformers; function calling and semantic search; Docker-ready."
        considerations: "Requires configuration; advanced features still evolving."
  benchmarking_and_tuning:
    description: "Benchmark models on target hardware and tune parameters for optimal performance."
    guidelines:
      - "Measure tokens per second, memory usage and latency for each model and hardware combination."
      - "Test different batch sizes, quantization levels and offloading strategies."
      - "Record results as artifacts and compare across devices using radar or spider charts."
  context_management:
    description: "Control context size to maintain performance on limited hardware."
    guidelines:
      - "Summarize older messages and use retrieval to bring back relevant information."
      - "Plan workflows to avoid sending large contexts to the model; break tasks into smaller segments."
      - "Use models with longer context windows only when necessary; they may require more memory."
  multi_model_routing:
    description: "Combine small and large models for different roles to optimize speed and accuracy."
    guidelines:
      - "Use a small model for planning, routing and summarization tasks."
      - "Reserve larger models for synthesis, verification and complex reasoning."
      - "Implement fallback logic to switch to a bigger model when the small model fails or produces low confidence."
  hardware_profiles:
    description: "Tailor inference strategies to specific hardware classes."
    profiles:
      - class: "Phone / Tablet (8 GB RAM)"
        recommendations:
          - "Run quantized models with low parameter counts (e.g., 3–7B)."
          - "Use CPU-only or limited GPU offload; keep context short."
          - "Offload heavy tasks to a desktop device if available."
      - class: "Desktop / Laptop (16 GB RAM, 8 GB VRAM)"
        recommendations:
          - "Run medium models (7–13B) with hybrid CPU/GPU execution."
          - "Enable vLLM or LocalAI for API-based access with PagedAttention."
          - "Use speculative decoding to increase throughput."
      - class: "Cluster / Rack"
        recommendations:
          - "Distribute models across nodes; use vLLM with tensor parallelism."
          - "Batch API requests; reuse KV cache across concurrent tasks."
          - "Monitor network and memory bandwidth; adjust offload strategy per node."
