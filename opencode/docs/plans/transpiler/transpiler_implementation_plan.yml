transpiler_implementation_plan:
  description: "Implementation plan for transpiler-specific components (YAML schema, parsing, code generation, testing)"
  version: "1.0"
  based_on_requirements:
    - "E017 - Transpiler Internals (R0054-R0075)"
    - "E006 - Workflow DSL (R0015, R0019)"
    - "E007 - Transpilation & Runtime (R0022, R0023)"

  phases:
    phase_1_foundation:
      name: "Foundation: Schema, Parser, AST"
      duration: "4-6 weeks"
      priority: p0
      dependencies: []
      tasks:
        - id: "P1-T1"
          name: "Define YAML Schema v1"
          requirements:
            - "R0054"
            - "R0015"
          effort: "2-3 weeks"
          deliverables:
            - "Complete schema specification (YAML/JSON Schema)"
            - "Node type definitions (step, tool, model, verify, repair, review, effect)"
            - "Field constraints and validation rules"
            - "Schema version metadata"
          acceptance_criteria:
            - "Schema can validate sample workflow YAMLs"
            - "All node types have clear field definitions"
            - "Validation rules are documented"
          risks:
            - "Schema may need refinement after parser implementation"

        - id: "P1-T2"
          name: "Implement YAML Parser with AST"
          requirements:
            - "R0058"
            - "R0056"
          effort: "2-3 weeks"
          dependencies: ["P1-T1"]
          deliverables:
            - "Parser module (src/parser.rs)"
            - "AST data structures"
            - "Source location preservation"
            - "Stable node ID generation"
          acceptance_criteria:
            - "Valid YAML parses to correct AST"
            - "Invalid YAML produces helpful errors with line numbers"
            - "Each AST node has unique ID and location data"
          tech_stack:
            - "serde-saphyr for YAML parsing"
            - "garde for validation"

        - id: "P1-T3"
          name: "Implement Typed WorkflowIR"
          requirements:
            - "R0059"
            - "R0019"
          effort: "2-3 weeks"
          dependencies: ["P1-T2"]
          deliverables:
            - "IR module (src/ir.rs)"
            - "AST to IR converter"
            - "Graph representation (petgraph)"
            - "State machine structures"
          acceptance_criteria:
            - "Valid AST converts to correct IR"
            - "IR can be visualized as DAG"
            - "State transitions are explicit"
          tech_stack:
            - "petgraph for graph data structures"

        - id: "P1-T4"
          name: "Implement Deterministic Normalization"
          requirements:
            - "R0060"
            - "R0068"
          effort: "1-2 weeks"
          dependencies: ["P1-T3"]
          deliverables:
            - "Normalization module (src/normalize.rs)"
            - "Stable sorting algorithms"
            - "Canonical ID assignment"
            - "Rustfmt integration"
          acceptance_criteria:
            - "Identical inputs produce identical IRs"
            - "Output is deterministically formatted"
          tech_stack:
            - "rustfmt for formatting"

    phase_2_codegen:
      name: "Code Generation: Templates, Bindings, Layout"
      duration: "6-8 weeks"
      priority: p0
      dependencies: ["phase_1_foundation"]
      tasks:
        - id: "P2-T1"
          name: "Implement Askama Templates for Code Generation"
          requirements:
            - "R0061"
            - "R0068"
          effort: "3-4 weeks"
          dependencies: ["P1-T4"]
          deliverables:
            - "Template module (templates/*.askama)"
            - "Core agent generation templates"
            - "Tool binding templates"
            - "Template rendering infrastructure"
          acceptance_criteria:
            - "Templates generate syntactically valid Rust"
            - "Generated code compiles"
          tech_stack:
            - "Askama template engine"

        - id: "P2-T2"
          name: "Implement AgentSDK Mapping Layer"
          requirements:
            - "R0061"
          effort: "2-3 weeks"
          dependencies: ["P2-T1"]
          deliverables:
            - "Mapping module (src/mapping.rs)"
            - "IR to AgentSDK trait call generator"
            - "Agent creation code generator"
            - "Tool call code generator"
          acceptance_criteria:
            - "Generated code uses AgentSDK traits correctly"
            - "Agents can be instantiated and execute workflows"

        - id: "P2-T3"
          name: "Implement Custom Tool Bindings Generator"
          requirements:
            - "R0062"
          effort: "2-3 weeks"
          dependencies: ["P2-T2"]
          deliverables:
            - "Tool binding module (src/tools.rs)"
            - "Tool trait implementations"
            - "Serialization/deserialization code"
            - "Permission check integration"
          acceptance_criteria:
            - "Tool calls serialize inputs correctly"
            - "Tool results deserialize correctly"
            - "Permission checks are enforced"

        - id: "P2-T4"
          name: "Implement Runtime Hooks Generator"
          requirements:
            - "R0065"
          effort: "2-3 weeks"
          dependencies: ["P2-T3"]
          deliverables:
            - "Hooks module (src/hooks.rs)"
            - "Run ID tracking code"
            - "Checkpoint generation code"
            - "Status update code"
            - "Artifact path emission"
          acceptance_criteria:
            - "Generated code tracks run progress"
            - "Checkpoints are persisted to ./workspace"
            - "Status updates reach scheduler"

        - id: "P2-T5"
          name: "Implement Project Layout Generator"
          requirements:
            - "R0063"
            - "R0052"
          effort: "2-3 weeks"
          dependencies: ["P2-T1"]
          deliverables:
            - "Layout module (src/layout.rs)"
            - "Cargo.toml generator"
            - "src/ structure generator"
            - "Module file generator"
          acceptance_criteria:
            - "Output directory contains valid Cargo project"
            - "cargo build succeeds in generated project"

        - id: "P2-T6"
          name: "Implement Packaging Strategy Selector"
          requirements:
            - "R0064"
            - "R0023"
          effort: "1-2 weeks"
          dependencies: ["P2-T5"]
          deliverables:
            - "Packaging module (src/packaging.rs)"
            - "Standalone strategy generator"
            - "Import backend strategy generator"
            - "Inline runtime strategy generator"
          acceptance_criteria:
            - "Each strategy produces correct output"
            - "Strategy can be selected via configuration"

    phase_2_5_llm_integration:
      name: "LLM Backend Integration: llama.cpp & Vulkan"
      duration: "6-8 weeks"
      priority: p0
      dependencies: ["phase_2_codegen"]
      tasks:
        - id: "P2_5-T1"
          name: "Implement ModelProvider Adapter for llama.cpp"
          requirements:
            - "R0036"
            - "R0037"
          effort: "2-3 weeks"
          dependencies: ["P2-T2"]
          deliverables:
            - "ModelProvider adapter (src/model_provider.rs)"
            - "llama.cpp trait implementation"
            - "generate() and stream() methods"
            - "Type-safe error handling"
          acceptance_criteria:
            - "ModelProvider trait is fully implemented"
            - "Generated code can call generate() and stream()"
            - "Errors are properly handled and propagated"
          tech_stack:
            - "llama-cpp-2 crate"
            - "AutoAgents ModelProvider trait"

        - id: "P2_5-T2"
          name: "Implement Vulkan Backend Enablement"
          requirements:
            - "R0038"
          effort: "1-2 weeks"
          dependencies: ["P2_5-T1"]
          deliverables:
            - "Vulkan backend initialization (src/vulkan.rs)"
            - "Backend configuration parser"
            - "Device selection logic"
            - "Vulkan feature flag support"
          acceptance_criteria:
            - "Vulkan backend initializes correctly"
            - "GPU device is selected appropriately"
            - "Backend can be disabled via configuration"
          tech_stack:
            - "llama-cpp-2 with Vulkan feature"
            - "vulkan-rs for device querying"

        - id: "P2_5-T3"
          name: "Implement GPU Layer Offload Control"
          requirements:
            - "R0038"
          effort: "2-3 weeks"
          dependencies: ["P2_5-T2"]
          deliverables:
            - "GPU offload configuration (src/gpu_offload.rs)"
            - "Layer offload percentage parser"
            - "Per-layer offload support"
            - "Memory budget validation"
          acceptance_criteria:
            - "GPU offload percentage is configurable"
            - "Per-layer offload works correctly"
            - "Memory budgets are validated"
          tech_stack:
            - "llama-cpp-2 GPU layer APIs"

        - id: "P2_5-T4"
          name: "Implement Model Load Lifecycle"
          requirements:
            - "R0042"
          effort: "2-3 weeks"
          dependencies: ["P2_5-T3"]
          deliverables:
            - "Model lifecycle manager (src/model_lifecycle.rs)"
            - "Backend initialization sequence"
            - "Model load with error handling"
            - "KV-cache allocation"
            - "Vocabulary loading"
          acceptance_criteria:
            - "Model loads in correct sequence"
            - "Errors at any step are handled properly"
            - "Resources are cleaned up on failure"
          tech_stack:
            - "llama-cpp-2 lifecycle APIs"
            - "thiserror for error handling"

        - id: "P2_5-T5"
          name: "Implement Multi-Instance Model Control"
          requirements:
            - "R0042"
          effort: "2-3 weeks"
          dependencies: ["P2_5-T4"]
          deliverables:
            - "Model manager (src/model_manager.rs)"
            - "Multi-instance configuration parser"
            - "Instance selection logic"
            - "Model switching support"
          acceptance_criteria:
            - "Multiple model instances can be loaded"
            - "Models can be selected at runtime"
            - "Model configuration is preserved per instance"
          tech_stack:
            - "HashMap for instance storage"
            - "Arc<RwLock> for thread-safe access"

        - id: "P2_5-T6"
          name: "Implement Context Length and KV-Cache Budgeting"
          requirements:
            - "R0038"
          effort: "1-2 weeks"
          dependencies: ["P2_5-T4"]
          deliverables:
            - "Context configuration (src/context.rs)"
            - "KV-cache budget allocator"
            - "Context length validation"
            - "Cache eviction strategy"
          acceptance_criteria:
            - "Context length is configurable"
            - "KV-cache is budgeted appropriately"
            - "Context length is validated against model limits"
          tech_stack:
            - "llama-cpp-2 context APIs"

        - id: "P2_5-T7"
          name: "Implement Streaming and Progressive Delivery"
          requirements:
            - "R0036"
          effort: "2-3 weeks"
          dependencies: ["P2_5-T1"]
          deliverables:
            - "Streaming generator (src/streaming.rs)"
            - "Token stream implementation"
            - "EOS token detection"
            - "Early termination support"
          acceptance_criteria:
            - "Tokens are generated incrementally"
            - "Stream can be consumed asynchronously"
            - "Early termination works correctly"
          tech_stack:
            - "tokio-stream"
            - "llama-cpp-2 token APIs"

        - id: "P2_5-T8"
          name: "Implement Parameter Presets and Profiles"
          requirements:
            - "R0038"
          effort: "1-2 weeks"
          dependencies: ["P2_5-T3"]
          deliverables:
            - "Preset definitions (src/presets.rs)"
            - "Profile configuration parser"
            - "Preset mapping to llama.cpp parameters"
            - "Override support"
          acceptance_criteria:
            - "Presets can be selected by name"
            - "Preset parameters map correctly"
            - "Individual parameters can be overridden"
          tech_stack:
            - "Enum for preset definitions"
            - "HashMap for parameter storage"

        - id: "P2_5-T9"
          name: "Implement Benchmark Hooks for Tuning"
          requirements:
            - "R0038"
          effort: "2-3 weeks"
          dependencies: ["P2_5-T1"]
          deliverables:
            - "Benchmark instrumentation (src/benchmark.rs)"
            - "Timing hooks"
            - "Token generation metrics"
            - "Memory usage tracking"
            - "Metrics reporting"
          acceptance_criteria:
            - "Benchmarks collect accurate metrics"
            - "Metrics are reported in structured format"
            - "Benchmarks can be enabled/disabled"
          tech_stack:
            - "instant for timing"
            - "tokio metrics"
            - "llama-cpp-2 profiling APIs"

        - id: "P2_5-T10"
          name: "Implement Safe Unload on Cancellation"
          requirements:
            - "R0042"
          effort: "1-2 weeks"
          dependencies: ["P2_5-T4"]
          deliverables:
            - "Cleanup handlers (src/cleanup.rs)"
            - "Drop implementation for model structs"
            - "Cancellation signal handling"
            - "Graceful shutdown logic"
          acceptance_criteria:
            - "Models are unloaded on cancellation"
            - "Resources are freed in correct order"
            - "No memory leaks occur"
          tech_stack:
            - "Drop trait"
            - "tokio signal handling"
            - "llama-cpp-2 cleanup APIs"

    phase_3_validation_and_safety:
      name: "Validation, Linting, Sandbox"
      duration: "4-6 weeks"
      priority: p0-p1
      dependencies: ["phase_2_5_llm_integration"]
      tasks:
        - id: "P3-T1"
          name: "Implement Static Validation"
          requirements:
            - "R0056"
            - "R0054"
          effort: "2-3 weeks"
          dependencies: ["P1-T2"]
          deliverables:
            - "Validator module (src/validator.rs)"
            - "Required field validation"
            - "Type checking"
            - "Constraint validation"
          acceptance_criteria:
            - "Invalid YAML produces clear validation errors"
            - "Valid YAML passes all validations"

        - id: "P3-T2"
          name: "Implement Linting Rules"
          requirements:
            - "R0057"
          effort: "1-2 weeks"
          dependencies: ["P3-T1"]
          deliverables:
            - "Linter module (src/linter.rs)"
            - "Timeout lint"
            - "Ambiguous name lint"
            - "Unbounded loop lint"
            - "Unapproved file operation lint"
          acceptance_criteria:
            - "Lint rules trigger on problematic patterns"
            - "Lint messages are actionable"

        - id: "P3-T3"
          name: "Implement Effect Preview Emission"
          requirements:
            - "R0066"
          effort: "2-3 weeks"
          dependencies: ["P1-T4"]
          deliverables:
            - "Effect analyzer (src/effects.rs)"
            - "Preflight report generator"
            - "File operation tracking"
            - "Tool usage tracking"
          acceptance_criteria:
            - "Effect report lists all expected operations"
            - "Difference between declared and actual triggers error"

        - id: "P3-T4"
          name: "Implement Verifier Integration Stubs"
          requirements:
            - "R0067"
          effort: "2-3 weeks"
          dependencies: ["P2-T2"]
          deliverables:
            - "Verifier module (src/verifier.rs)"
            - "Schema verifier stub"
            - "Diff verifier stub"
            - "Test verifier stub"
            - "Verifier call site generator"
          acceptance_criteria:
            - "Generated code calls verifiers at appropriate points"
            - "Verifiers are pluggable"

        - id: "P3-T5"
          name: "Implement Sandboxed Codegen"
          requirements:
            - "R0073"
          effort: "2-3 weeks"
          dependencies: ["P2-T1"]
          deliverables:
            - "Sandbox module (src/sandbox.rs)"
            - "Path guard implementation"
            - "Dependency allowlist"
            - "Import restriction enforcement"
          acceptance_criteria:
            - "Malicious YAML cannot write outside project"
            - "Generated code imports only approved crates"

    phase_4_testing_and_quality:
      name: "Testing, Caching, Evolution"
      duration: "4-6 weeks"
      priority: p1-p3
      dependencies: ["phase_3_validation_and_safety"]
      tasks:
        - id: "P4-T1"
          name: "Implement Golden Tests"
          requirements:
            - "R0070"
          effort: "2-3 weeks"
          dependencies: ["phase_2_codegen"]
          deliverables:
            - "Golden test suite (tests/golden/*.rs)"
            - "Snapshot testing infrastructure"
            - "Sample YAML inputs"
            - "Expected outputs"
          acceptance_criteria:
            - "Tests compare generated code with snapshots"
            - "Regressions are caught"
          tech_stack:
            - "insta crate for snapshots"

        - id: "P4-T2"
          name: "Implement Property Tests"
          requirements:
            - "R0071"
          effort: "2-3 weeks"
          dependencies: ["P1-T2", "P3-T1"]
          deliverables:
            - "Property test suite (tests/properties/*.rs)"
            - "Parser property tests"
            - "Validator property tests"
            - "Normalizer property tests"
          acceptance_criteria:
            - "Random valid YAML always parses"
            - "Invalid structures produce expected errors"
          tech_stack:
            - "proptest crate"

        - id: "P4-T3"
          name: "Implement Build Orchestration"
          requirements:
            - "R0069"
          effort: "1-2 weeks"
          dependencies: ["P2-T5"]
          deliverables:
            - "Build module (src/build.rs)"
            - "Cargo.lock generation"
            - "Reproducible build configuration"
            - "Offline build support"
          acceptance_criteria:
            - "cargo build yields same binary across runs"
            - "Offline builds work with cached dependencies"

        - id: "P4-T4"
          name: "Implement Compilation Caching"
          requirements:
            - "R0072"
          effort: "2-3 weeks"
          dependencies: ["P1-T4", "P4-T3"]
          deliverables:
            - "Cache module (src/cache.rs)"
            - "Cache key generation"
            - "Cache storage"
            - "Cache invalidation logic"
          acceptance_criteria:
            - "Unchanged workflows use cache"
            - "Schema/toolchain changes invalidate cache"

        - id: "P4-T5"
          name: "Implement Schema Evolution & Migrations"
          requirements:
            - "R0055"
          effort: "2-3 weeks"
          dependencies: ["P1-T1"]
          deliverables:
            - "Migration module (src/migrate.rs)"
            - "Migration scripts (migrations/*.yml)"
            - "Version metadata storage"
          acceptance_criteria:
            - "Old workflows migrate to new schema"
            - "Migration metadata is preserved"

        - id: "P4-T6"
          name: "Implement Capability-Aware Lowering"
          requirements:
            - "R0074"
          effort: "2-3 weeks"
          dependencies: ["P1-T4"]
          deliverables:
            - "Lowering module (src/lowering.rs)"
            - "Capability profile integration"
            - "Task splitting logic"
            - "Resource adaptation"
          acceptance_criteria:
            - "Low-memory profiles split large tasks"
            - "High-memory profiles preserve original structure"

        - id: "P4-T7"
          name: "Implement Schema Docs Generator"
          requirements:
            - "R0075"
          effort: "1-2 weeks"
          dependencies: ["P1-T1"]
          deliverables:
            - "Docs generator (src/docs.rs)"
            - "Markdown output"
            - "HTML output option"
            - "Version change documentation"
          acceptance_criteria:
            - "Docs list all node types and fields"
            - "Docs update after schema changes"

    phase_5_integration:
      name: "CLI Integration and Documentation"
      duration: "2-3 weeks"
      priority: p0
      dependencies: ["phase_4_testing_and_quality"]
      tasks:
        - id: "P5-T1"
          name: "Implement CLI Entry Point"
          requirements:
            - "R0005"
          effort: "1-2 weeks"
          dependencies: ["phase_2_5_llm_integration"]
          deliverables:
            - "Main CLI (src/main.rs)"
            - "Command line parsing (clap)"
            - "Subcommands: compile, validate, lint"
            - "Model configuration options"
          acceptance_criteria:
            - "CLI accepts YAML input files"
            - "CLI outputs compiled code or validation errors"
            - "Model configuration can be specified via CLI"
          tech_stack:
            - "clap for CLI parsing"

        - id: "P5-T2"
          name: "Create Example Workflows"
          requirements:
            - "All transpiler requirements"
          effort: "1-2 weeks"
          dependencies: ["phase_4_testing_and_quality"]
          deliverables:
            - "Example YAMLs (examples/*.yml)"
            - "Simple step workflow"
            - "Complex workflow with loops"
            - "Multi-agent workflow"
            - "Tool usage examples"
            - "llama.cpp configuration examples"
          acceptance_criteria:
            - "Examples compile successfully"
            - "Examples demonstrate key features"
            - "llama.cpp examples show Vulkan backend usage"

        - id: "P5-T3"
          name: "Write Documentation"
          requirements:
            - "R0053"
          effort: "2-3 weeks"
          dependencies: ["phase_5_integration"]
          deliverables:
            - "README.md"
            - "Schema reference"
            - "Getting started guide"
            - "llama.cpp integration guide"
            - "API documentation (rustdoc)"
          acceptance_criteria:
            - "Users can get started from docs"
            - "All features are documented"
            - "llama.cpp Vulkan setup is clearly documented"

  risk_mitigation:
    high_risks:
      - risk: "Schema design changes during implementation"
        mitigation: "Keep schema flexible, design for evolution, implement migrations early"
      - risk: "Code generation complexity grows unmanageably"
        mitigation: "Start with simple templates, iterate, use Askama for maintainability"
      - risk: "AST/IR mismatches cause bugs"
        mitigation: "Comprehensive golden tests, property tests, continuous validation"
    medium_risks:
      - risk: "Template system performance bottleneck"
        mitigation: "Benchmark early, optimize hot paths, consider procedural fallback"
      - risk: "Cache invalidation logic fails"
        mitigation: "Conservative invalidation, hash all inputs, extensive testing"

  dependencies:
    internal:
      - "Completed research from transpiler_research_plan.yml"
      - "Validated requirements (R0054-R0075, R0036-R0042)"
    external:
      - "Rust toolchain (1.70+)"
      - "Cargo package manager"
      - "serde-saphyr crate"
      - "Askama template engine"
      - "petgraph crate"
      - "insta crate (testing)"
      - "proptest crate (testing)"
      - "llama-cpp-2 crate (with Vulkan feature)"
      - "vulkan-rs crate (for device querying)"
      - "tokio-stream crate (for streaming)"
      - "AutoAgents ModelProvider trait"

  success_criteria:
    - "All 34 tasks completed (24 original + 10 llama.cpp integration)"
    - "Transpiler compiles YAML workflows to working Rust code"
    - "Generated code uses AgentSDK correctly"
    - "llama.cpp ModelProvider adapter fully functional"
    - "Vulkan backend integration works correctly"
    - "GPU offload and context management properly configured"
    - "All golden tests pass"
    - "All property tests pass"
    - "Documentation is complete"
    - "Example workflows demonstrate features"
    - "llama.cpp examples show proper Vulkan configuration"

  metrics:
    - "Number of supported node types: 7+"
    - "Code generation time: <5 seconds for medium workflow"
    - "Test coverage: >80%"
    - "Golden test count: 20+"
    - "Documentation completeness: 100% of features"
    - "llama.cpp integration: 10/10 features implemented"
    - "GPU offload configurations: Percentage and per-layer modes supported"
    - "Streaming generation: Token-level streaming with early termination"
    - "Model management: Multi-instance with lifecycle control"
