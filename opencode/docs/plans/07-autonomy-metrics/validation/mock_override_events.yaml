version: "1.0"
override_events:
  - event_id: "override_001"
    override_type: "pause"
    workflow_id: "workflow_123"
    reason: "User requested pause for manual verification"
    operator: "admin"
    timestamp: "2024-01-15T10:30:00Z"

  - event_id: "override_002"
    override_type: "stop"
    workflow_id: "workflow_456"
    reason: "Critical error detected - immediate stop required"
    operator: "system"
    timestamp: "2024-01-15T11:45:00Z"

  - event_id: "override_003"
    override_type: "modify"
    workflow_id: "workflow_789"
    reason: "Adjusting autonomy level from high to medium"
    operator: "admin"
    timestamp: "2024-01-15T14:20:00Z"
    parameters:
      new_autonomy_level: "medium"
      modifications:
        - "Decrease batch size from 50 to 10"

  - event_id: "override_004"
    override_type: "scope_change"
    workflow_id: "workflow_789"
    reason: "Adding production deploy to allowed workflows"
    operator: "admin"
    timestamp: "2024-01-15T15:30:00Z"
    parameters:
      new_scope:
        allowed_workflows: ["deploy_production", "deploy_staging"]
        allowed_actions: ["deploy", "verify", "monitor", "rollback"]

  - event_id: "override_005"
    override_type: "pause"
    workflow_id: "workflow_123"
    reason: "Resume paused workflow after verification"
    operator: "admin"
    timestamp: "2024-01-15T16:00:00Z"
