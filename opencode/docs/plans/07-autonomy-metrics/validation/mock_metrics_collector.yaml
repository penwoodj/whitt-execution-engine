version: "1.0"
metrics:
  counters:
    - name: "actions_taken"
      labels: ["workflow_id", "action_type"]
      help: "Number of actions taken by autonomous execution"

    - name: "interventions"
      labels: ["workflow_id", "intervention_type"]
      help: "Number of human interventions"

    - name: "checkpoints_created"
      labels: ["workflow_id", "checkpoint_type"]
      help: "Number of checkpoints created"

    - name: "workflows_started"
      labels: ["workflow_type"]
      help: "Number of workflows started"

    - name: "workflows_completed"
      labels: ["success"]
      help: "Number of workflows completed"

  gauges:
    - name: "active_workflows"
      help: "Number of currently active workflows"

    - name: "active_actions"
      help: "Number of currently active actions"

    - name: "cpu_usage_cores"
      labels: ["workflow_id"]
      help: "CPU usage in cores"

    - name: "memory_usage_gb"
      labels: ["workflow_id"]
      help: "Memory usage in GB"

    - name: "success_rate"
      labels: ["workflow_id"]
      help: "Current success rate"

  histograms:
    - name: "action_duration_ms"
      buckets: [10, 50, 100, 500, 1000, 5000]
      help: "Action duration in milliseconds"

    - name: "workflow_duration_ms"
      buckets: [100, 1000, 10000, 60000, 300000]
      help: "Workflow duration in milliseconds"

  summaries:
    - name: "deployment_success_rate"
      quantiles: [0.5, 0.95, 0.99]
      help: "Deployment success rate quantiles"

    - name: "intervention_response_time_ms"
      quantiles: [0.5, 0.95, 0.99]
      help: "Intervention response time quantiles"

export:
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"

  json:
    enabled: true
    path: ".glyphnova/metrics.json"
    refresh_interval_ms: 5000
