services:
  llama-server:
    image: whitt-execution-engine/llama-server:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: whitt-llama-server
    restart: unless-stopped
    volumes:
      - ../config.yml:/config/config.yml:ro
      - ../configs/models:/config/models:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ${MODEL_HOST_PATH:-../models}:/models
      - ${EXTERNAL_MODEL_PATH:-/run/media/jon/data/models}:/run/media/jon/data/models:ro
      - ../logs:/var/log/llama-server
    group_add:
      - "${RENDER_GID:-987}"
      - "${VIDEO_GID:-983}"
    devices:
      - /dev/dri:/dev/dri
    network_mode: host
    shm_size: 8g
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /tmp/hf
      AMD_VULKAN_ICD: RADV
      GGML_VK_DISABLE_DEBUG: "1"
      LLAMA_ARG_REASONING: "off"
      RADV_PERFTEST: "nogttspill"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/props"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  models:
    driver: local
  logs:
    driver: local

networks:
  default:
    name: whitt-network
