services:
  llama-server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: amdgpu
              count: all
              capabilities: [gpu]
    environment:
      GGML_VK_VISIBLE_DEVICES: "0"
      GGML_VK_ALLOW_GRAPHICS_QUEUE: "1"
      GGML_VK_FORCE_MAX_ALLOCATION_SIZE: "0"
