workflow_id: meta_workflow_generator_v2
name: "Meta-Workflow Generator v2"
description: "6-step decomposed meta-workflow: decompose → plan → skeleton → prompts → assemble → validate. Small model friendly."
version: "11.0.0"
author: "Whitt Execution Engine"
tags: [meta-workflow, yaml-generation, decomposed]
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999

models:
  "planner":
    name: "Qwen3-4B-Instruct-2507-Q4_K_M"
    host:
      type: llama_cpp_with_vulkan
  "coder":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:

  steps:

    step_01_decompose:
      generative_entity: "${models.planner}"
      prompt: |
        You are a task decomposition specialist. Given a task description, extract the KEY ACTIONS needed.

        TASK: __TASK_PLACEHOLDER__

        List each action as a numbered item. Each action should be a single, atomic operation.
        Format: N. <verb> <object> [using <method>]

        Example output:
        1. Read file /tmp/data.csv using shell cat command
        2. Validate each row has required fields
        3. Compute summary statistics (mean, median, count)
        4. Detect anomalies (values > 3 standard deviations)
        5. Generate markdown report with findings
        6. Save report to outputs/output/report.md

        Output ONLY the numbered list. No other text.
      model_overrides:
        temperature: 0.3
        max_tokens: 2000
      when:
        after_step_succeeds:
          - save_to: "./real-workflow-attempts/outputs/__RUN_ID__/01-actions.txt"
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, error_message]
              level: error

    step_02_plan_steps:
      generative_entity: "${models.planner}"
      depends_on: [step_01_decompose]
      prompt: |
        You are a workflow architect. Convert action items into a step plan for a YAML agentic workflow.

        ACTIONS:
        {{step.step_01_decompose.output}}

        For each action, output a step definition in this EXACT format:
        STEP_NAME: <name> | DEPENDS: <comma-separated step names or "none"> | TYPE: <shell|llm> | PURPOSE: <one sentence>

        Rules:
        - Step names must be lowercase with underscores (e.g., step_02_validate)
        - First step always depends on "none"
        - If an action reads a file, mark TYPE as "shell"
        - All other actions are TYPE "llm"
        - Steps that can run in parallel should share the same dependency
        - At least one step must depend on 2+ other steps

        Output ONLY the step definitions, one per line. No other text.
      model_overrides:
        temperature: 0.2
        max_tokens: 2000
      when:
        after_step_succeeds:
          - save_to: "./real-workflow-attempts/outputs/__RUN_ID__/02-plan.txt"
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, error_message]
              level: error

    step_03_write_skeleton:
      generative_entity: "${models.coder}"
      depends_on: [step_02_plan_steps]
      prompt: |
        You are a YAML workflow skeleton builder. Generate ONLY the YAML structure (no prompt content yet).

        STEP PLAN:
        {{step.step_02_plan_steps.output}}

        COPY THIS EXACT HEADER (fill in workflow_id and name):
        workflow_id: <descriptive_id>
        name: "<Descriptive Name>"
        description: "<one sentence>"
        version: "1.0.0"
        schema_version: "2.0.0"
        providers:
          llama_cpp_with_vulkan:
            config:
              host: localhost
              port: 8080
            hosting:
              gpu_layers: 999
        models:
          "worker":
            name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
            host:
              type: llama_cpp_with_vulkan
        workflow_execution_strategy:
          memory:
            model_lifecycle:
              unload_unused: true

        Then add steps INSIDE agentic_workflow: steps: like this:
        agentic_workflow:
          steps:
            step_01_first:
              generative_entity: "${models.worker}"
              prompt: "FILL_IN_LATER"
              model_overrides:
                temperature: 0.3
                max_tokens: 50000
              when:
                after_step_succeeds:
                  - save_to: "./outputs/step01-output.txt"
                after_step_fails:
                  - log:
                      to_file_path: "./logs/workflow.log"
                      event_fields: [step_name, error_message]

            step_02_second:
              generative_entity: "${models.worker}"
              depends_on: [step_01_first]
              prompt: "FILL_IN_LATER"
              model_overrides:
                temperature: 0.3
                max_tokens: 50000
              when:
                after_step_succeeds:
                  - save_to: "./outputs/step02-output.txt"

        RULES:
        - Steps MUST be under agentic_workflow: steps: (indented 4 spaces from left)
        - First step has NO depends_on
        - Every other step has depends_on: [step_XX_prev]
        - Provider MUST have config: with host: and port: nested inside
        - Model MUST have name: and host: with type: nested inside
        - Step names zero-padded: step_01, step_02 ... step_10, step_11
        - Each step prompt is "FILL_IN_LATER" (nothing else)

        Output ONLY raw YAML. No markdown fences. First line: workflow_id:
      model_overrides:
        temperature: 0.1
        max_tokens: 4000
      when:
        after_step_succeeds:
          - save_to: "./real-workflow-attempts/outputs/__RUN_ID__/03-skeleton.yml"
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, error_message]
              level: error

    step_04_write_prompts:
      generative_entity: "${models.planner}"
      depends_on: [step_02_plan_steps, step_01_decompose]
      prompt: |
        You are a prompt writer for agentic workflow steps. Write detailed prompts for each step.

        ORIGINAL TASK: __TASK_PLACEHOLDER__

        ACTIONS:
        {{step.step_01_decompose.output}}

        STEP PLAN:
        {{step.step_02_plan_steps.output}}

        For EACH step in the plan, write a prompt block. Format:

        --- STEP: <step_name> ---
        <5-10 line detailed prompt for this step>
        Include {{step.PREVIOUS_STEP.output}} reference if step depends on another step.
        For file-reading steps, include {{bookmarks.shell_output.stdout}} in the prompt.
        --- END ---

        Rules:
        - Every prompt must be 5+ lines with specific instructions
        - Steps with depends_on MUST include {{step.X.output}} references
        - File-reading steps (TYPE: shell) should reference {{bookmarks.shell_output.stdout}}
        - Prompts must be self-contained — the model won't see other steps' prompts
        - Use imperative verbs: "Analyze", "Compute", "Generate", "Extract"
        - Be specific about output format: "Output a numbered list", "Output JSON", etc.

        Output ALL step prompts. No other text.
      model_overrides:
        temperature: 0.3
        max_tokens: 4000
      when:
        after_step_succeeds:
          - save_to: "./real-workflow-attempts/outputs/__RUN_ID__/04-prompts.txt"
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, error_message]
              level: error

    step_05_assemble:
      generative_entity: "${models.coder}"
      depends_on: [step_03_write_skeleton, step_04_write_prompts]
      prompt: |
        You are a YAML assembler. Combine skeleton and prompts into ONE complete workflow YAML.

        SKELETON:
        {{step.step_03_write_skeleton.output}}

        PROMPTS:
        {{step.step_04_write_prompts.output}}

        Rules:
        1. Replace each "FILL_IN_LATER" with the matching prompt from PROMPTS
        2. Match by step name: "--- STEP: step_XX_name ---" block goes into that step's prompt
        3. Keep ALL YAML structure: agentic_workflow: steps: nesting, providers config:, models name:/host:
        4. For steps with TYPE: shell, add before_step_starts hook with shell action
        5. Strip --- STEP: and --- END --- markers from prompts
        6. Multi-line prompts use pipe | syntax (prompt: |)
        7. Do NOT wrap prompts in quotes if they contain special chars — use pipe |
        8. Ensure providers has config: { host: localhost, port: 8080 }
        9. Ensure models has name: and host: { type: llama_cpp_with_vulkan }
        10. Steps MUST stay under agentic_workflow: steps: (4-space indent from left edge)

        Output ONLY raw YAML. No markdown fences. No backticks. No explanations.
        First line: workflow_id:
      model_overrides:
        temperature: 0.05
        max_tokens: 8000
      when:
        after_step_succeeds:
          - save_to: "./real-workflow-attempts/outputs/__RUN_ID__/05-assembled.yml"
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, error_message]
              level: error

    step_06_validate:
      generative_entity: "${models.coder}"
      depends_on: [step_05_assemble]
      prompt: |
        You are a YAML workflow validator and repair specialist. Fix ALL issues.

        INPUT:
        {{step.step_05_assemble.output}}

        CHECKS (fix EVERY issue):
        1. YAML parses correctly (no syntax errors)
        2. Has: workflow_id, name, providers, models, agentic_workflow with steps
        3. Steps use MAP notation (step_name: with indented props)
        4. Steps are nested under agentic_workflow: steps: (NOT top-level)
        5. Every step has: generative_entity, prompt, model_overrides, when
        6. Every step except first has depends_on
        7. Every step with depends_on has {{step.X.output}} in its prompt
        8. Provider structure: providers: llama_cpp_with_vulkan: config: host: port: (nested)
        9. Model structure: models: "name": name: "ModelFile" host: type: llama_cpp_with_vulkan (nested)
        10. No markdown fences (no ``` anywhere in output)
        11. File starts with "workflow_id:" (no leading whitespace or text)
        12. All prompts are 5+ lines with specific instructions
        13. Step names are zero-padded if >9 steps (step_01, step_02, ..., step_10, step_11)
        14. Multi-line prompts use pipe | syntax, not quotes
        15. No trailing backticks or code fence markers

        Output ONLY the fixed YAML. No markdown fences. No explanations.
        First line: workflow_id:
      model_overrides:
        temperature: 0.05
        max_tokens: 8000
      when:
        after_step_succeeds:
          - save_to: "./real-workflow-attempts/outputs/__RUN_ID__/final-workflow.yml"
          - shell:
              command: "python3"
              args: ["./real-workflow-attempts/scripts/validate-yaml.py", "./real-workflow-attempts/outputs/__RUN_ID__/final-workflow.yml"]
              fail_on_error: false
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, duration_ms, token_count, shell_output]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./real-workflow-attempts/outputs/__RUN_ID__/logs/meta.log"
              event_fields: [step_name, error_message]
              level: error
