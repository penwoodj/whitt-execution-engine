```yaml
workflow_id: txt_analysis_workflow
name: "Text File Analysis Workflow"
description: "Analyze .txt files in /tmp directory and output a CSV of file names and line counts."
version: "1.0.0"
schema_version: "2.0.0"
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999
models:
  "worker":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan
workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_01_nav_to_directory:
      generative_entity: "${models.worker}"
      depends_on: []
      prompt: |
        <prompt content from prompts section>
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
          - shell:
              command: "cd /tmp"
              args: []
              fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step-01-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error

    step_02_find_txt_files:
      generative_entity: "${models.worker}"
      depends_on: [step_01_nav_to_directory]
      prompt: |
        <prompt content from prompts section>
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
          - shell:
              command: "find . -type f -name \"*.txt\""
              args: []
              fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step-02-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error

    step_03_read_file_content:
      generative_entity: "${models.worker}"
      depends_on: [step_02_find_txt_files]
      prompt: |
        <prompt content from prompts section>
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
          - shell:
              command: "cat {}"
              args: []
              fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step-03-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error

    step_04_count_lines:
      generative_entity: "${models.worker}"
      depends_on: [step_03_read_file_content]
      prompt: |
        <prompt content from prompts section>
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
          - shell:
              command: "wc -l < {}"
              args: []
              fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step-04-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error

    step_05_create_filename_line_list:
      generative_entity: "${models.worker}"
      depends_on: [step_04_count_lines]
      prompt: |
        <prompt content from prompts section>
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
          - shell:
              command: "none"
              args: []
              fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step-05-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error

    step_06_sort_by_line_count_desc:
      generative_entity: "${models.worker}"
      depends_on: [step_05_create_filename_line_list]
      prompt: |
        <prompt content from prompts section>
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
          - shell:
              command: "none"
              args: []
              fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step-06-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error

    step_07_format_to_csv:
      generative_entity: "${models.worker}"
      depends_on: [step_06_sort_by_line_count_desc]
      prompt: |
        <prompt content from prompts section>
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
          - shell:
              command: "none"
              args: []
              fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step-07-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error

    step_08_output_csv:
      generative_entity: "${models.worker}"
      depends_on: [step_07_format_to_csv]
      prompt: |
        <prompt content from prompts section>
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
          - shell:
              command: "echo \"filename,line_count\" && cat output.csv"
              args: []
              fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step-08-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms, token_count]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error
