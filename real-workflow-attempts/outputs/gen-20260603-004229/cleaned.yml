workflow_id: code_review_pipeline_v2
name: "Code Review Pipeline v2"
description: "Automated code review with static analysis, security scan, and final report"
version: "2.0.0"
author: "Whitt Execution Engine"
tags:
  - code-review
  - security
  - analysis
schema_version: "2.0.0"
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999
models:
  "target-model":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan
workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true
agentic_workflow:
  steps:
    step_1_read_code:
      generative_entity: "${models.target-model}"
      prompt: |
        Read and display the complete contents of the source file provided.
        Output every line with line numbers prefixed.
        Preserve all whitespace, comments, and formatting exactly.
        If the file is very long, output the first 500 lines.
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        before_step_starts:
          shell:
            command: "cat"
            args: ["./src/main.rs"]
            fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step1-source-code.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_2_static_analysis:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_code]
      prompt: |
        Perform a thorough static analysis of the following source code.
        Check for these specific issues:
        - Dead code and unreachable branches
        - Unused variables and imports
        - Type mismatches and potential runtime errors
        - Performance bottlenecks (O(n²) loops, unnecessary allocations)
        - Naming convention violations

        SOURCE CODE TO ANALYZE:
        {{step.step_1_read_code.output}}

        Output a numbered list of issues with file location, severity (critical/warning/info),
        and a brief explanation of each issue.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step2-static-analysis.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_3_security_scan:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_code]
      prompt: |
        Perform a security scan of the following source code.
        Look for these vulnerability categories:
        - SQL injection and command injection
        - Cross-site scripting (XSS) vectors
        - Insecure cryptographic usage
        - Hardcoded secrets or credentials
        - Path traversal vulnerabilities

        SOURCE CODE TO SCAN:
        {{step.step_1_read_code.output}}

        Output each finding with: vulnerability type, location (line number),
        severity (critical/high/medium/low), and remediation advice.
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step3-security-scan.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_4_parallel_analysis:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_static_analysis, step_3_security_scan]
      prompt: |
        Analyze the static analysis and security scan results to identify potential issues.
        Look for common patterns or trends in the findings.

        STATIC ANALYSIS RESULTS:
        {{step.step_2_static_analysis.output}}

        SECURITY SCAN RESULTS:
        {{step.step_3_security_scan.output}}

        Output a summary of any common patterns or trends, along with recommendations for further investigation.
      model_overrides:
        temperature: 0.4
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step4-parallel-analysis.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_5_compile_report:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_static_analysis, step_3_security_scan, step_4_parallel_analysis]
      prompt: |
        Compile a comprehensive code review report from the analysis results below.

        STATIC ANALYSIS RESULTS:
        {{step.step_2_static_analysis.output}}

        SECURITY SCAN RESULTS:
        {{step.step_3_security_scan.output}}

        PARALLEL ANALYSIS SUMMARY:
        {{step.step_4_parallel_analysis.output}}

        Create a markdown report with:
        1. Executive summary with total issue count by severity
        2. Critical issues section (must fix before merge)
        3. Warnings section (should fix)
        4. Info section (nice to fix)
        5. Prioritized action items list

        Format each issue as: [SEVERITY] File:Line - Description
      model_overrides:
        temperature: 0.4
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step5-final-report.md"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_6_commit_changes:
      generative_entity: "${models.target-model}"
      depends_on: [step_5_compile_report]
      prompt: |
        Review the final code review report and suggest any necessary changes.
        Provide a summary of the key findings and recommendations.

        FINAL REPORT:
        {{step.step_5_compile_report.output}}

        Output a list of recommended changes, including file paths and specific lines to modify.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step6-commit-changes.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]