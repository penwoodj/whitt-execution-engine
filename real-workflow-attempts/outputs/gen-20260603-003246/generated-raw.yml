```yaml
workflow_id: code_quality_audit_pipeline
name: "Code Quality Audit Pipeline"
description: "Automated code quality audit with structural analysis, complexity analysis, pattern detection, and final report"
version: "2.0.0"
author: "Whitt Execution Engine"
tags: [code-quality-audit, static-analysis, security]
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999

models:
  "target-model":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:

  steps:

    step_1_read_code:
      generative_entity: "${models.target-model}"
      prompt: |
        Read and display the complete contents of the source file provided.
        Output every line with line numbers prefixed.
        Preserve all whitespace, comments, and formatting exactly.
        If the file is very long, output the first 500 lines.
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        before_step_starts:
          shell:
            command: "cat"
            args: ["/tmp/audit-target.py"]
            fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step1-source-code.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_2_structural_analysis:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_code]
      prompt: |
        Perform a structural analysis of the following source code.
        Extract all function and method signatures including parameter names,
        default values, and return type annotations. Count total functions,
        total classes, total methods per class, and identify the longest
        function by line count. Flag any function exceeding 40 lines.

        SOURCE CODE TO ANALYZE:
        {{step.step_1_read_code.output}}

        Output a structured JSON object with the following fields:
        - "total_functions": integer
        - "total_classes": integer
        - "methods_per_class": map of class names to number of methods
        - "longest_function_name": string
        - "longest_function_line_count": integer
        - "functions_exceeding_40_lines": list of function names
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step2-structural-analysis.json"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_3_complexity_analysis:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_code]
      prompt: |
        Perform a complexity analysis of the following source code.
        For each function, count decision points: if statements,
        elif clauses, for loops, while loops, try-except blocks, and
        boolean operators. Compute cyclomatic complexity score as
        decision points plus 1. Classify functions as simple,
        moderate complex, or critical.

        SOURCE CODE TO ANALYZE:
        {{step.step_1_read_code.output}}

        Output a structured JSON object with the following fields:
        - "functions": list of objects, each containing:
          - "name": string
          - "cyclomatic_complexity": integer
          - "classification": string ("simple", "moderate complex", "critical")
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step3-complexity-analysis.json"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_4_pattern_detection:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_code]
      prompt: |
        Perform a pattern detection of the following source code.
        Scan for bare except clauses, mutable default arguments,
        functions with more than 5 parameters, import statements inside
        function bodies, and string concatenation in loops.

        SOURCE CODE TO SCAN:
        {{step.step_1_read_code.output}}

        Output a structured JSON object with the following fields:
        - "bare_except_clauses": list of function names
        - "mutable_default_args": list of function names
        - "functions_with_many_params": list of function names
        - "import_statements_in_functions": list of function names
        - "string_concatenation_in_loops": list of function names
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step4-pattern-detection.json"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_5_quality_scoring:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_structural_analysis, step_3_complexity_analysis, step_4_pattern_detection]
      prompt: |
        Calculate the overall quality score of the code based on the following criteria:
        - Function length percentage under 20 lines
        - Average cyclomatic complexity
        - Anti-pattern density per 100 lines
        - Type annotation coverage

        STRUCTURAL ANALYSIS RESULTS:
        {{step.step_2_structural_analysis.output}}

        COMPLEXITY ANALYSIS RESULTS:
        {{step.step_3_complexity_analysis.output}}

        PATTERN DETECTION RESULTS:
        {{step.step_4_pattern_detection.output}}

        Output a JSON object with the following fields:
        - "quality_score": string ("A" through "F")
        - "function_length_percentage_under_20_lines": float
        - "average_cyclomatic_complexity": float
        - "anti_pattern_density_per_100_lines": float
        - "type_annotation_coverage": float
      model_overrides:
        temperature: 0.4
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step5-quality-score.json"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_6_refactor_recommendations:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_structural_analysis, step_3_complexity_analysis, step_4_pattern_detection]
      prompt: |
        Generate top 3 recommended refactorings for the code based on the analysis results.

        STRUCTURAL ANALYSIS RESULTS:
        {{step.step_2_structural_analysis.output}}

        COMPLEXITY ANALYSIS RESULTS:
        {{step.step_3_complexity_analysis.output}}

        PATTERN DETECTION RESULTS:
        {{step.step_4_pattern_detection.output}}

        Output a JSON object with the following fields:
        - "refactorings": list of objects, each containing:
          - "description": string
          - "suggested_changes": list of strings (code snippets or instructions)
      model_overrides:
        temperature: 0.5
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step6-refactor-recommendations.json"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_7_final_report:
      generative_entity: "${models.target-model}"
      depends_on: [step_5_quality_scoring, step_6_refactor_recommendations]
      prompt: |
        Compile a comprehensive code quality audit report from the analysis results below.

        QUALITY SCORING RESULTS:
        {{step.step_5_quality_scoring.output}}

        REFACTORING RECOMMENDATIONS:
        {{step.step_6_refactor_recommendations.output}}

        Create a markdown report with:
        1. Executive summary with overall quality score and key findings
        2. Quality grading section (A-F)
        3. Detailed analysis of each function's complexity, anti-patterns, and type annotations
        4. Top 3 recommended refactorings with descriptions and suggested changes

        Format the report as a markdown document.
      model_overrides:
        temperature: 0.6
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step7-final-report.md"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

```