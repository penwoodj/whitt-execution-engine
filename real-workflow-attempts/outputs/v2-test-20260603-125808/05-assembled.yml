```yaml
workflow_id: sales_data_quality_check

name: Sales Data Quality Check Workflow

description: A comprehensive workflow to analyze and validate sales data for quality assurance.

version: 1.0

schema_version: 2.0

providers:
  llama_cpp_with_vulkan:
    host: localhost
    port: 8080

models:
  target-model:
    provider: llama_cpp_with_vulkan
    model_path: Qwen2.5-Coder-3B-Instruct-Q8_0

workflow_execution_strategy:
  unload_unused: true

steps:

step_01_read_file:
  generative_entity: "${models.target-model}"
  depends_on: []
  prompt: "Read the CSV file located at /tmp/sales-data.csv and parse its contents into a structured format suitable for analysis. Extract all rows and columns as a tabular dataset with headers including transaction_id, customer_email, quantity, unit_price, sale_date, payment_method, and sales_region. Use standard CSV parsing to preserve data integrity and handle line breaks correctly. Output the raw parsed data in JSON format, ensuring each row is represented as an object with field names matching the column headers. Return only the structured dataset without any additional commentary or metadata."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    before_step_starts:
      shell:
        command: "cat"
        args: ["/tmp/sales-data.csv"]
        fail_on_error: false
    after_step_succeeds:
      - save_to: "./outputs/step01-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_02_extract_schema:
  generative_entity: "${models.target-model}"
  depends_on: [step_01_read_file]
  prompt: "Analyze the parsed dataset from {{step_01_read_file.output}} to extract the column names and their corresponding data types (e.g., string, integer, float, date). Identify each column’s actual type based on sample values in the dataset. Output a JSON object with keys as column names and values as their inferred data types. Ensure all columns listed in the original task are included and properly typed. Do not include any metadata or explanations—only return the schema structure in a clean, structured format."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step02-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_03_count_rows:
  generative_entity: "${models.target-model}"
  depends_on: [step_01_read_file]
  prompt: "Count the total number of rows in the dataset provided by {{step_01_read_file.output}}. Parse the raw CSV data to determine how many entries exist across all rows. The count must include every row regardless of null values or missing fields. Output a single integer value representing the total row count, formatted as: \"Total rows: X\". Do not include any additional text or formatting beyond this line."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step03-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_04_count_nonnull:
  generative_entity: "${models.target-model}"
  depends_on: [step_01_read_file]
  prompt: "Analyze the dataset from {{step_02_extract_schema.output}} to compute the number of non-null values for each column: transaction_id, customer_email, quantity, unit_price, sale_date, payment_method, and sales_region. For each column, count how many entries are not null or empty. Output a JSON object where each key is a column name and each value is an integer representing the count of non-null entries. Ensure all columns are included and counts are accurate to the raw data."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step04-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_05_compute_statistics:
  generative_entity: "${models.target-model}"
  depends_on: [step_02_extract_schema]
  prompt: "Using the dataset from {{step_02_extract_schema.output}}, compute statistical measures for numeric columns: quantity, unit_price, and (quantity * unit_price), using data from {{step_01_read_file.output}}. For each column, calculate the mean, median, and standard deviation. The output must be a JSON object with keys as column names and values as an array containing [mean, median, standard_deviation]. Only include columns that are numeric or can be converted to numbers; exclude non-numeric fields. Ensure all computed values are rounded to two decimal places for consistency."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step05-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_06_detect_outliers:
  generative_entity: "${models.target-model}"
  depends_on: [step_01_read_file]
  prompt: "Apply the Interquartile Range (IQR) method to detect outliers in three numeric columns: quantity, unit_price, and (quantity * unit_price), using data from {{step_01_read_file.output}}. For each column, compute Q1 (first quartile), Q3 (third quartile), IQR = Q3 - Q1, and define lower and upper bounds as Q1 - 1.5*IQR and Q3 + 1.5*IQR respectively. Identify any values outside these bounds as outliers. Output a JSON object with keys as column names and values as lists of outlier row indices (0-based) where anomalies occur. Do not include explanations or metadata—only return the list of affected rows per column."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step06-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_07_validate_email_format:
  generative_entity: "${models.target-model}"
  depends_on: [step_01_read_file]
  prompt: "Validate each value in the customer_email column from {{step_01_read_file.output}} to ensure it conforms to a standard email format (e.g., user@domain.com). A valid email must contain at least one '@' symbol, a domain part after '@', and no malformed syntax. For each entry, determine whether it is syntactically correct using regex pattern matching or known email validation rules. Output a JSON object with keys as row indices and values as boolean flags (true/false) indicating whether the email is valid. Return only this list of validations without additional commentary."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step07-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_08_check_date_consistency:
  generative_entity: "${models.target-model}"
  depends_on: [step_01_read_file]
  prompt: "Inspect the sale_date column from {{step_01_read_file.output}} to verify that all entries are in a consistent date format (e.g., YYYY-MM-DD). Validate each value using standard ISO date parsing rules and ensure it represents a valid calendar date. Additionally, confirm that no dates fall outside a reasonable range (e.g., within the last 5 years from today). Output a JSON object with keys as row indices and values as boolean flags indicating whether each sale_date is properly formatted and within a plausible time range. Only return this list of validations without extra text or explanation."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step08-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_09_validate_payment_method:
  generative_entity: "${models.target-model}"
  depends_on: [step_01_read_file]
  prompt: "Check the payment_method column from {{step_01_read_file.output}} to ensure every entry matches one of the predefined valid options: \"credit_card\", \"debit_card\", \"paypal\", \"bank_transfer\". For each value, determine if it is in this list. Any value not listed or malformed (e.g., empty string, invalid syntax) should be flagged as invalid. Output a JSON object with keys as row indices and values as boolean flags indicating whether the payment method is valid. Return only this validation list without additional commentary."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step09-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_10_detect_invalid_regions:
  generative_entity: "${models.target-model}"
  depends_on: [step_01_read_file]
  prompt: "Evaluate the sales_region column from {{step_01_read_file.output}} to identify any missing or invalid entries. A missing value (null/empty) or a region not in a predefined valid set (e.g., \"North\", \"South\", \"East\", \"West\") should be flagged. Output a JSON object with keys as row indices and values as boolean flags indicating whether the sales_region is present and valid. Return only this list of invalid entries without any additional text or explanation."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step10-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_11_calculate_data_quality_score:
  generative_entity: "${models.target-model}"
  depends_on: [
    step_03_count_rows,
    step_04_count_nonnull,
    step_05_compute_statistics,
    step_06_detect_outliers,
    step_07_validate_email_format,
    step_08_check_date_consistency,
    step_09_validate_payment_method,
    step_10_detect_invalid_regions
  ]
  prompt: "Aggregate data quality metrics from all prior steps to compute a comprehensive data quality score between 0 and 100. Use the following components: (1) completeness (non-null ratio per column, weighted by column importance), (2) validity (email format, date range, payment method, region validity), and (3) anomaly rate (outlier count across key numeric fields). Normalize each component to a percentage scale and combine them with equal weight. Output a single floating-point number between 0 and 100 representing the final data quality score, formatted as: \"Data Quality Score: X.XX\"."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/step11-output.txt"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_12_generate_summary_report:
  generative_entity: "${models.target-model}"
  depends_on: [
    step_03_count_rows,
    step_04_count_nonnull,
    step_05_compute_statistics,
    step_06_detect_outliers,
    step_07_validate_email_format,
    step_08_check_date_consistency,
    step_09_validate_payment_method,
    step_10_detect_invalid_regions,
    step_11_calculate_data_quality_score
  ]
  prompt: "Generate a structured summary report that includes total row count from {{step_03_count_rows.output}}, non-null counts per column from {{step_04_count_nonnull.output}}, mean, median, and standard deviation for numeric columns from {{step_05_compute_statistics.output}}, outlier indices from {{step_06_detect_outliers.output}}, email validation results from {{step_07_validate_email_format.output}}, date consistency flags from {{step_08_check_date_consistency.output}}, payment method validity from {{step_09_validate_payment_method.output}}, and invalid region entries from {{step_10_detect_invalid_regions.output}}. Also include the data quality score from {{step_11_calculate_data_quality_score.output}}. Output a well-formatted markdown document with clear section headings: \"Dataset Overview\", \"Column Statistics\", \"Anomalies Detected\", and \"Data Quality Score\". Ensure all values are presented numerically and consistently, with no markdown formatting beyond standard headers and bullet points."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/report_summary.md"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]

step_13_save_summary_report:
  generative_entity: "${models.target-model}"
  depends_on: [step_12_generate_summary_report]
  prompt: "Save the generated summary report from {{step_12_generate_summary_report.output}} to a file at outputs/report_summary.md. Ensure the output is written in plain text markdown format without any extra whitespace or comments. The file must be created if it does not exist, and overwritten if it already exists. Confirm that the file path is correct and the content matches exactly with the generated report. Output only a confirmation message: \"Summary report successfully saved to outputs/report_summary.md\"."
  model_overrides:
    temperature: 0.3
    max_tokens: 50000
  when:
    after_step_succeeds:
      - save_to: "./outputs/report_summary.md"
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, duration_ms]
    after_step_fails:
      - log:
          to_file_path: "./logs/workflow.log"
          event_fields: [step_name, error_message]
```