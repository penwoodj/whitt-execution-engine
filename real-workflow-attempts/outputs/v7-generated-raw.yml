```yaml
workflow_id: api_integration_test_workflow
name: "API Integration Test Workflow"
description: "Automated API integration testing with OpenAPI/Swagger specification"
version: "2.0.0"
author: "Whitt Execution Engine"
tags: [api-integration, testing, openapi]
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999

models:
  "target-model":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:

  steps:

    step_1_read_spec:
      generative_entity: "${models.target-model}"
      prompt: |
        Read and display the complete contents of the OpenAPI/Swagger specification document provided.
        Output every line with line numbers prefixed.
        Preserve all whitespace, comments, and formatting exactly.
        If the file is very long, output the first 500 lines.
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step1-spec.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_2_generate_requests:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_spec]
      prompt: |
        Generate HTTP test requests for each endpoint in the following OpenAPI/Swagger specification document.
        Include edge cases like auth failures, rate limiting, malformed payloads.
        Output a numbered list of requests with method, URL, headers, and body (if applicable).
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step2-requests.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_3_execute_requests:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_spec, step_2_generate_requests]
      prompt: |
        Execute the HTTP test requests generated in the previous steps against a running API server.
        Output the response status code and body for each request.
      model_overrides:
        temperature: 0.4
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step3-responses.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_4_validate_responses:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_spec, step_3_execute_requests]
      prompt: |
        Validate the response schemas against the OpenAPI/Swagger specification document.
        Check for any discrepancies between expected and actual responses.
        Output a numbered list of validation results with status (pass/fail) and details.
      model_overrides:
        temperature: 0.5
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step4-validation.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_5_check_response_times:
      generative_entity: "${models.target-model}"
      depends_on: [step_3_execute_requests]
      prompt: |
        Check the response times of each HTTP request against SLA thresholds.
        Output a numbered list of response time results with status (pass/fail) and details.
      model_overrides:
        temperature: 0.6
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step5-response-times.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_6_generate_report:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_spec, step2_generate_requests, step3_execute_requests, step4_validate_responses, step5_check_response_times]
      prompt: |
        Generate a detailed test report with pass/fail status per endpoint,
        response time charts, and a summary of spec compliance coverage.
        Include the following sections:
        1. Summary table with total number of requests, passed/failed, average response time
        2. Endpoint-specific results (pass/fail, response time)
        3. Response time charts for each endpoint
        4. Compliance coverage chart showing which endpoints are fully compliant, partially compliant, or non-compliant

        SPECIFICATION DOCUMENT:
        {{step.step_1_read_spec.output}}

        REQUESTS GENERATED:
        {{step.step_2_generate_requests.output}}

        EXECUTED RESPONSES:
        {{step.step_3_execute_responses.output}}

        VALIDATION RESULTS:
        {{step.step_4_validation.txt}}

        RESPONSE TIME RESULTS:
        {{step.step_5_response-times.txt}}
      model_overrides:
        temperature: 0.7
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step6-final-report.md"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
```