workflow_id: my_workflow
name: My Workflow
description: A simple workflow to read the hostname from /etc/hostname and output it.
version: 1.0.0
schema_version: 2.0.0
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
models:
  worker:
    name: Qwen2.5-Coder-3B-Instruct-Q8_0
    host:
      type: llama_cpp_with_vulkan
workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true
agentic_workflow:
  steps:
    step_01_read_hostname:
      generative_entity: ${models.worker}
      depends_on: []
      prompt: "Given the file path /etc/hostname, use the cat command to read its contents. Here is the data:  \n{{bookmarks.shell_output.stdout}}  \nExtract only the raw content of the file as plain text\
        \ with no additional formatting or commentary.  \nOutput exactly what is in the file, line by line, preserving any whitespace or newlines.  \nExample output: myhost.example.com  \nOutput ONLY the\
        \ result. No explanations. No process descriptions.  \n"
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
        - shell:
            command: cat /etc/hostname
            args: []
            fail_on_error: false
        after_step_succeeds:
        - save_to: ./outputs/step_01_read_hostname-output.txt
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - duration_ms
            - token_count
            level: info
        after_step_fails:
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - error_message
            level: error
    step_02_output_contents:
      generative_entity: ${models.worker}
      depends_on:
      - step_01_read_hostname
      prompt: "Here is the data to process:\n{{bookmarks.shell_output.stdout}}\n\nGiven the raw contents from step_01_read_hostname, extract only the text content of /etc/hostname as plain text.  \nUse\
        \ {{step.step_01_read_hostname.output}} to retrieve the file's content.  \nOutput a plain text string containing exactly what was read from /etc/hostname, with no extra lines or formatting.  \n\
        Example output: myhost.example.com  \nOutput ONLY the result. No explanations. No process descriptions.  \n"
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
        - shell:
            command: echo {{step.step_01_read_hostname.output}}
            args: []
            fail_on_error: false
        after_step_succeeds:
        - save_to: ./outputs/step_02_output_contents-output.txt
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - duration_ms
            - token_count
            level: info
        after_step_fails:
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - error_message
            level: error
