workflow_id: drift_analysis_pipeline
name: "Drift Analysis Pipeline"
description: "Automated drift analysis of YAML configuration files for a web service"
version: "2.0.0"
author: "Whitt Execution Engine"
tags:
  - drift-analysis
  - yaml
  - security
schema_version: "2.0.0"
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999
models:
  "target-model":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan
workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true
agentic_workflow:
  steps:
    step_1_read_config_files:
      generative_entity: "${models.target-model}"
      prompt: |
        Read and display the complete contents of the two YAML configuration files provided.
        Output each file with line numbers prefixed.
        Preserve all whitespace, comments, and formatting exactly.
        If a file is very long, output the first 500 lines.

        CONFIGURATION FILES TO READ:
        /tmp/config-baseline.yml
        /tmp/config-current.yml

        Output the contents of both files in separate sections with their respective filenames prefixed.
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        before_step_starts:
          shell:
            command: "cat"
            args: ["/tmp/config-baseline.yml", "/tmp/config-current.yml"]
            fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step1-config-files.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_2_parse_configs:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_config_files]
      prompt: |
        Parse the contents of both YAML configuration files into flat key-value maps using dot-notation for nested keys.
        List all unique keys across both files.

        CONFIGURATION FILES TO PARSE:
        {{step.step_1_read_config_files.output}}

        Output a numbered list of all unique keys found in both files, separated by commas.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step2-unique-keys.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_3_diff_analysis:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_config_files, step_2_parse_configs]
      prompt: |
        Perform a comprehensive drift analysis of the two YAML configuration files.

        CONFIGURATION FILES TO ANALYZE:
        {{step.step_1_read_config_files.output}}

        UNIQUE KEYS FOUND IN BOTH FILES:
        {{step.step_2_unique_keys.output}}

        Categorize every key into one of four states: present in both with identical values (unchanged),
        present in both with different values (modified), present only in baseline (removed),
        present only in current (added). For modified keys, capture both the old and new values.

        Output a numbered list of differences with:
        - Key
        - State (unchanged, modified, removed, added)
        - Old value (if applicable)
        - New value (if applicable)
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step3-diff-analysis.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_4_risk_assessment:
      generative_entity: "${models.target-model}"
      depends_on: [step_3_diff_analysis]
      prompt: |
        Classify each difference by severity. Critical: any change to security-related keys (ssl, auth, token, secret, password, encryption).
        Warning: changes to performance-related keys (timeout, pool_size, cache, buffer, workers).
        Info: changes to cosmetic or logging keys (log_level, debug, verbose).

        DRIFT ANALYSIS RESULTS:
        {{step.step_3_diff_analysis.output}}

        Compute a drift score as the weighted sum: critical changes count times 10 plus warning changes count times 3 plus info changes count times 1.

        Output the drift score.
      model_overrides:
        temperature: 0.4
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step4-drift-score.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_5_generate_remediation_plan:
      generative_entity: "${models.target-model}"
      depends_on: [step_3_diff_analysis, step_4_risk_assessment]
      prompt: |
        Generate a remediation plan for the identified drift differences.

        DRIFT ANALYSIS RESULTS:
        {{step.step_3_diff_analysis.output}}

        RISK ASSESSMENT SCORE:
        {{step.step_4_drift_score.output}}

        For each critical and warning difference, generate a specific remediation instruction stating which key needs to change,
        what the current value is, and what the baseline value should be. Order remediation steps by severity with critical first.

        Output a numbered list of remediation instructions.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step5-remediation-plan.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
    step_6_save_drift_report:
      generative_entity: "${models.target-model}"
      depends_on: [step_3_diff_analysis, step_4_risk_assessment, step_5_generate_remediation_plan]
      prompt: |
        Save the complete drift report including the diff analysis, risk assessment, and remediation plan to outputs/output/drift-report.txt.

        DRIFT ANALYSIS RESULTS:
        {{step.step_3_diff_analysis.output}}

        RISK ASSESSMENT SCORE:
        {{step.step_4_drift_score.output}}

        REMEDIATION PLAN:
        {{step.step_5_generate_remediation_plan.output}}

        Save the entire report to outputs/output/drift-report.txt.
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/output/drift-report.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]