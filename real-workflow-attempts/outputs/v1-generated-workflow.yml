```yaml
workflow_id: python_code_quality_analysis
name: "Python Code Quality Analysis Workflow"
description: "A workflow to analyze Python source files for code quality issues, suggest fixes, and generate a summary report with metrics."
version: "2.0.0"
author: "Whitt Execution Engine"
tags:
  - code-quality-analysis
  - python
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999

models:
  target-model:
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    - read_python_file:
        generative_entity: "${models.target-model}"
        prompt: |
          <prompt text here>
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
        depends_on: []
        when:
          after_step_succeeds:
            - save_to: "./outputs/step-output.txt"
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, duration_ms]
          after_step_fails:
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, error_message]

    - analyze_code_quality:
        generative_entity: "${models.target-model}"
        prompt: |
          <prompt text here>
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
        depends_on: ["read_python_file"]
        when:
          after_step_succeeds:
            - save_to: "./outputs/step-output.txt"
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, duration_ms]
          after_step_fails:
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, error_message]

    - suggest_fixes:
        generative_entity: "${models.target-model}"
        prompt: |
          <prompt text here>
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
        depends_on: ["analyze_code_quality"]
        when:
          after_step_succeeds:
            - save_to: "./outputs/step-output.txt"
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, duration_ms]
          after_step_fails:
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, error_message]

    - generate_report:
        generative_entity: "${models.target-model}"
        prompt: |
          <prompt text here>
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
        depends_on: ["suggest_fixes"]
        when:
          after_step_succeeds:
            - save_to: "./outputs/step-output.txt"
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, duration_ms]
          after_step_fails:
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, error_message]

    - save_report:
        generative_entity: "${models.target-model}"
        prompt: |
          <prompt text here>
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
        depends_on: ["generate_report"]
        when:
          after_step_succeeds:
            - save_to: "./outputs/step-output.txt"
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, duration_ms]
          after_step_fails:
            - log:
                to_file_path: "./logs/workflow.log"
                event_fields: [step_name, error_message]

    - notify_user:
        generative_entity: "${models.target-model}"
        prompt: |
          <prompt text here>
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
        depends_on: ["save_report"]
        when:
          after_step_succeeds:
            - save_to: "./outputs/step-output.txt"
