workflow_id: requirements_pipeline

name: "Requirements Pipeline"
description: "Automated workflow to extract, analyze, and document software requirements"
version: "2.0.0"
author: "Whitt Execution Engine"
tags:
  - requirements-extraction
  - analysis
  - documentation
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999

models:
  "target-model":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_extract_requirements:
      generative_entity: "${models.target-model}"
      prompt: |
        Extract functional and non-functional requirements from the provided natural language document.
        Identify any contradictions or ambiguities in the requirements.
        Output a structured JSON object with the following fields:
          - "functional_requirements": an array of strings describing functional requirements
          - "non_functional_requirements": an array of strings describing non-functional requirements
          - "contradictions": an array of strings describing identified contradictions
          - "ambiguities": an array of strings describing identified ambiguities
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step1-requirements.json"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
      depends_on: []

    step_2_user_stories:
      generative_entity: "${models.target-model}"
      prompt: |
        Generate user stories based on the extracted functional requirements.
        For each requirement in "functional_requirements", create a user story with acceptance criteria.
        Output an array of JSON objects, where each object represents a user story:
          - "user_story": a string describing the user story
          - "acceptance_criteria": an array of strings describing the acceptance criteria for the user story
      model_overrides:
        temperature: 0.4
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step2-user-stories.json"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
      depends_on:
        - step_1_extract_requirements

    step_3_test_plan:
      generative_entity: "${models.target-model}"
      prompt: |
        Create a test plan with coverage matrix based on the extracted functional requirements and generated user stories.
        Identify test cases for each requirement in "functional_requirements" using the acceptance criteria from "user_stories".
        Output an array of JSON objects, where each object represents a test case:
          - "test_case": a string describing the test case
          - "requirements": an array of strings representing the functional requirements covered by this test case
          - "acceptance_criteria": an array of strings representing the acceptance criteria from the corresponding user story
      model_overrides:
        temperature: 0.5
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step3-test-plan.json"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
      depends_on:
        - step_1_extract_requirements
        - step_2_user_stories

    step_4_requirements_traceability_matrix:
      generative_entity: "${models.target-model}"
      prompt: |
        Create a requirements traceability matrix linking each requirement to its corresponding user story and test case.
        Output an array of JSON objects, where each object represents a row in the matrix:
          - "requirement": a string representing the functional requirement
          - "user_story": a string representing the corresponding user story
          - "test_case": a string representing the corresponding test case
      model_overrides:
        temperature: 0.6
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step4-traceability-matrix.json"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
      depends_on:
        - step_1_extract_requirements
        - step_2_user_stories
        - step_3_test_plan

    step_5_documentation:
      generative_entity: "${models.target-model}"
      prompt: |
        Generate a comprehensive documentation report that includes:
          - An executive summary of the requirements
          - A detailed list of functional and non-functional requirements
          - User stories with acceptance criteria
          - Test cases for each requirement
          - Requirements traceability matrix linking all elements

        Create a markdown document with sections for each part.
      model_overrides:
        temperature: 0.7
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step5-final-documentation.md"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
      depends_on:
        - step_1_extract_requirements
        - step_2_user_stories
        - step_3_test_plan
        - step_4_requirements_traceability_matrix

    step_6_final_report:
      generative_entity: "${models.target-model}"
      prompt: |
        Compile a final report summarizing the requirements pipeline's output.
        Include:
          - A brief overview of the workflow
          - Key findings from each step (e.g., identified contradictions, ambiguities)
          - Recommendations for further improvements or next steps

        Create a markdown document with an executive summary and detailed sections for each step.
      model_overrides:
        temperature: 0.8
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step6-final-report.md"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
      depends_on:
        - step_5_documentation