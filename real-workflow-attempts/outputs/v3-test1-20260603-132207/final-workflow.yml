workflow_id: toc_report_generator
name: "Markdown TOC Report Generator"
description: "Generates a table of contents report for all Markdown files in /tmp/notes/"
version: "1.0.0"
schema_version: "2.0.0"
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999
models:
  "worker":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan
workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
      step_01_read_files:
        generative_entity: "${models.worker}"
        depends_on: []
        prompt: |
          Use the shell glob pattern to find all markdown files in the directory /tmp/notes/. The command must only match files with the .md extension and ignore directories or non-markdown files. List each file path individually, one per line, ensuring no duplicates or extra whitespace. Output only the list of full file paths as a newline-separated string. Do not include any additional text, comments, or formatting beyond this list. The output must be ready for use in subsequent steps.
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
        when:
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
        after_step_succeeds:
          - save_to: "./outputs/step_01_read_files-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
              level: info
          before_step_starts:
            - shell:
                command: "find /tmp/notes/ -type f -name \"*.md\""
                args: []
                fail_on_error: false
      
      step_02_parse_content:
        generative_entity: "${models.worker}"
        depends_on: [step_01_read_files]
        prompt: |
          Analyze each markdown file listed in {{step_01_read_files.output}} to extract the full content and structural hierarchy. Parse headers (e.g., #, ##, ###), paragraphs, lists, and code blocks to understand the document's organization. Extract all text content from the files while preserving paragraph structure and sectioning. For each file, generate a clean, structured representation of its content that includes headings and body text. Output a JSON array where each entry contains the filename and a parsed content object with fields: "headers", "body_text", and "sections". Ensure no markdown syntax is preserved in the output; only plain text content should be included.
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step_02_parse_content-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error
      step_03_count_words:
        generative_entity: "${models.worker}"
        depends_on: [step_01_read_files]
        prompt: |
          Compute the total word count for each markdown file listed in {{step_01_read_files.output}} using a shell command that processes the raw text of each file. Use awk to count words by processing each line and summing the number of characters between spaces, excluding punctuation. The output must be a newline-separated list where each line contains only one file name followed by its word count in the format "filename:word_count". For example, "notes/2024-plan.md:1567". Do not include any headers or metadata. Use {{bookmarks.shell_output.stdout}} to reference the raw output from this step and ensure it matches the exact format required for downstream processing.
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
        when:
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
        after_step_succeeds:
          - save_to: "./outputs/step_03_count_words-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
              level: info
          before_step_starts:
            - shell:
                command: "awk '{print length($0)}' /tmp/notes/*.md"
                args: []
                fail_on_error: false
      
      step_04_extract_topics:
        generative_entity: "${models.worker}"
        depends_on: [step_02_parse_content]
        prompt: |
          Using the parsed content from each file in {{step_02_parse_content.output}}, extract the top three most frequent topics or themes using keyword analysis. Focus on identifying recurring concepts, phrases, and ideas present in headers and body text. Apply a simple frequency-based approach to detect topic clusters by counting word occurrences and grouping them into thematic categories. For each file, generate a list of exactly three distinct topics with confidence scores (e.g., "AI Ethics: 0.85"), ranked by relevance. Output a JSON array where each entry contains the filename and an object with "top_topics" as a list of three topic strings with associated scores. The output must be strictly formatted, with no markdown or extra text. Use only the content provided in {{step_02_parse_content.output}} for analysis.
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step_04_extract_topics-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error
      step_05_generate_toc:
        generative_entity: "${models.worker}"
        depends_on: [step_03_count_words, step_04_extract_topics]
        prompt: |
          Generate a comprehensive table of contents (TOC) that includes the file name, word count, and top three topics for each markdown file. The output must be structured as a well-formatted Markdown table with columns: "File Name", "Word Count", and "Top 3 Topics". Each row corresponds to one file, and the "Top 3 Topics" column should list exactly three topic strings separated by commas (e.g., "AI Ethics, Data Privacy, Machine Learning"). Use data from {{step_03_count_words.output}} for word counts and {{step_04_extract_topics.output}} for topics. Ensure all values are correctly mapped to the right file. Output only the table in Markdown format with no additional text or headers beyond the first row. The final output must be ready to be saved directly as a markdown file.
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step_05_generate_toc-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
              level: info
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
              level: error
      step_06_save_toc_report:
        generative_entity: "${models.worker}"
        depends_on: [step_05_generate_toc]
        prompt: |
          Save the generated table of contents from {{step_05_generate_toc.output}} to the file outputs/output/toc-report.md. Begin by writing a header row with "File Name | Word Count | Top 3 Topics" using exact formatting and no extra spaces or line breaks. Then append the full content of the table generated in step_05_generate_toc, ensuring all rows are preserved exactly as formatted. The output file must be saved in UTF-8 encoding and should not include any additional metadata, comments, or headers beyond what is specified. Use the shell command to write directly to the path outputs/output/toc-report.md and ensure no intermediate files are created. Only the final table content should appear in the file.
        model_overrides:
          temperature: 0.3
          max_tokens: 50000
        when:
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
        after_step_succeeds:
          - save_to: "./outputs/step_06_save_toc_report-output.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
              level: info
          before_step_starts:
            - shell:
                command: "echo \"File Name | Word Count | Top 3 Topics\" > outputs/output/toc-report.md && cat outputs/output/toc-report.md"
                args: []
                fail_on_error: false
      
