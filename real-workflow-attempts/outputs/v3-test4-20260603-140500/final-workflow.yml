workflow_id: my_text_processing_workflow
name: Text Processing Workflow
description: A workflow to navigate home directory, list files, filter .txt files, get file sizes, count .txt files, and compile a table.
version: 1.0.0
schema_version: 2.0.0
providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
models:
  worker:
    name: Qwen2.5-Coder-3B-Instruct-Q8_0
    host:
      type: llama_cpp_with_vulkan
workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true
agentic_workflow:
  steps:
    step_01_nav_home:
      generative_entity: ${models.worker}
      depends_on: []
      prompt: "Here is the data to process:\n{{bookmarks.shell_output.stdout}}\n\nGiven the task of navigating to the home directory in a shell environment, execute the `cd ~` command to change into the\
        \ user's home directory. This step establishes the working directory for all subsequent file operations. The output must be the confirmation message from the shell indicating successful navigation,\
        \ such as \"Changed into home directory\". No additional text or explanation should appear. Output ONLY the result of the shell command execution. Do NOT include any commentary about the action\
        \ taken. Example expected output: \"Changed to /home/username\"  \n"
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
        - shell:
            command: cd ~
            args: []
            fail_on_error: false
        after_step_succeeds:
        - save_to: ./outputs/step-01-output.txt
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - duration_ms
            - token_count
            level: info
        after_step_fails:
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - error_message
            level: error
    step_02_list_files:
      generative_entity: ${models.worker}
      depends_on:
      - step_01_nav_home
      prompt: "Given the data below, extract a list of all files in the current directory using the `ls -1` command. The output must be a plain text list with one filename per line, showing only file names\
        \ without directories or metadata. This list will be used to filter for .txt files in the next step. Here is the data to process: {{bookmarks.shell_output.stdout}}  \n"
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
        - shell:
            command: ls -1
            args: []
            fail_on_error: false
        after_step_succeeds:
        - save_to: ./outputs/step-02-output.txt
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - duration_ms
            - token_count
            level: info
        after_step_fails:
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - error_message
            level: error
    step_03_filter_txt_files:
      generative_entity: ${models.worker}
      depends_on:
      - step_02_list_files
      prompt: "Given the data below, extract only the filenames that end with \".txt\" from the list of files in the home directory. Use a shell command to filter lines matching the pattern ending in .txt\
        \ (case-sensitive). The output must be a plain text list with one filename per line, containing only valid .txt file names. Here is the data to process: {{bookmarks.shell_output.stdout}}  \n"
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
        - shell:
            command: grep '\.txt$'
            args: []
            fail_on_error: false
        after_step_succeeds:
        - save_to: ./outputs/step-03-output.txt
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - duration_ms
            - token_count
            level: info
        after_step_fails:
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - error_message
            level: error
    step_04_get_file_sizes:
      generative_entity: ${models.worker}
      depends_on:
      - step_03_filter_txt_files
      prompt: "Given the data below, retrieve the human-readable file sizes for each .txt file listed in the previous step using the `du -h --files-size` command. The output must be a plain text list where\
        \ each line contains a filename and its size in human-readable format (e.g., 10K, 256M). Each entry should follow the pattern: \"filename.txt\" followed by its size. Here is the data to process:\
        \ {{bookmarks.shell_output.stdout}}  \n"
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
        - shell:
            command: du -h --files-size
            args: []
            fail_on_error: false
        after_step_succeeds:
        - save_to: ./outputs/step-04-output.txt
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - duration_ms
            - token_count
            level: info
        after_step_fails:
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - error_message
            level: error
    step_05_count_txt_files:
      generative_entity: ${models.worker}
      depends_on:
      - step_03_filter_txt_files
      prompt: "Given the data below, count how many .txt files were listed in the previous step by using the `wc -l` command on the filtered list of filenames. The output must be a single integer representing\
        \ the total number of .txt files found. This count will be used to validate the final result. Here is the data to process: {{bookmarks.shell_output.stdout}}  \n"
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        before_step_starts:
        - shell:
            command: wc -l
            args: []
            fail_on_error: false
        after_step_succeeds:
        - save_to: ./outputs/step-05-output.txt
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - duration_ms
            - token_count
            level: info
        after_step_fails:
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - error_message
            level: error
    step_06_compile_table:
      generative_entity: ${models.worker}
      depends_on:
      - step_04_get_file_sizes
      - step_05_count_txt_files
      prompt: "Given the following inputs:  \n- A list of .txt files with their sizes from {{step_04_get_file_sizes.output}}  \n- The total count of .txt files from {{step_05_count_txt_files.output}}  \n\
        Compile a clean, well-formatted table in Markdown format that lists each file name and its size. Each row must contain exactly two columns: the filename and its size (e.g., \"file.txt 10K\"). Include\
        \ a header row with \"File Name\" and \"Size\". After the table, append one line stating \"Total .txt files found: [count]\" where count is the number from {{step_05_count_txt_files.output}}. Output\
        \ ONLY the result. Do NOT explain your process. Do NOT describe what you would do. Just output the answer directly.  \n"
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
        - save_to: ./outputs/step-06-output.txt
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - duration_ms
            - token_count
            level: info
        after_step_fails:
        - log:
            to_file_path: ./logs/workflow.log
            event_fields:
            - step_name
            - error_message
            level: error
