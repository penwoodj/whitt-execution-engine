```yaml
workflow_id: code_review_pipeline
name: "Code Review Pipeline"
description: "Automated code review with static analysis, security scan, refactoring suggestions, and final report"
version: "2.0.0"
author: "Whitt Execution Engine"
tags: [code-review, security, analysis]
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999

models:
  "target-model":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:

  steps:

    step_1_read_code:
      generative_entity: "${models.target-model}"
      prompt: |
        Read and display the complete contents of the source file provided.
        Output every line with line numbers prefixed.
        Preserve all whitespace, comments, and formatting exactly.
        If the file is very long, output the first 500 lines.
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step1-source-code.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_2_static_analysis:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_code]
      prompt: |
        Perform a thorough static analysis of the following source code.
        Check for these specific issues:
        - Dead code and unreachable branches
        - Unused variables and imports
        - Type mismatches and potential runtime errors
        - Performance bottlenecks (O(n²) loops, unnecessary allocations)
        - Naming convention violations

        SOURCE CODE TO ANALYZE:
        {{step.step_1_read_code.output}}

        Output a numbered list of issues with file location, severity (critical/warning/info),
        and a brief explanation of each issue.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step2-static-analysis.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_3_security_scan:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_code]
      prompt: |
        Perform a security scan of the following source code.
        Look for these vulnerability categories:
        - SQL injection and command injection
        - Cross-site scripting (XSS) vectors
        - Insecure cryptographic usage
        - Hardcoded secrets or credentials
        - Path traversal vulnerabilities

        SOURCE CODE TO SCAN:
        {{step.step_1_read_code.output}}

        Output each finding with: vulnerability type, location (line number),
        severity (critical/high/medium/low), and remediation advice.
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step3-security-scan.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_4_refactoring_suggestions:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_static_analysis, step_3_security_scan]
      prompt: |
        Generate refactoring suggestions for the following code based on static analysis and security scan results.
        Identify potential improvements in architecture, design patterns, and code quality.

        STATIC ANALYSIS RESULTS:
        {{step.step_2_static_analysis.output}}

        SECURITY SCAN RESULTS:
        {{step.step_3_security_scan.output}}

        Output a numbered list of refactoring suggestions with before/after code examples for each issue.
      model_overrides:
        temperature: 0.4
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step4-refactoring-suggestions.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_5_compile_refactored_code:
      generative_entity: "${models.target-model}"
      depends_on: [step_4_refactoring_suggestions]
      prompt: |
        Compile the refactored code based on the suggestions provided in the previous step.
        Ensure that all changes are syntactically correct and compile without errors.

        REFACTORED CODE:
        {{step.step_4_refactoring_suggestions.output}}

        Output a markdown report with:
        1. Compilation status (success/failure)
        2. Error messages if any
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step5-compiled-code.md"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_6_refactoring_roadmap:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_static_analysis, step_3_security_scan, step_4_refactoring_suggestions, step_5_compile_refactored_code]
      prompt: |
        Generate a detailed refactoring roadmap document with priority rankings for the identified issues and refactorings.
        Include:
        - A summary of all issues and their severity
        - Prioritized list of refactorings based on impact and urgency
        - Estimated timeframes for each step
        - Action items and responsible parties

        STATIC ANALYSIS RESULTS:
        {{step.step_2_static_analysis.output}}

        SECURITY SCAN RESULTS:
        {{step.step_3_security_scan.output}}

        REFACTORED CODE OUTPUT:
        {{step.step_5_compile_refactored_code.output}}

        Output a markdown document with the refactoring roadmap.
      model_overrides:
        temperature: 0.5
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step6-refactoring-roadmap.md"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
```