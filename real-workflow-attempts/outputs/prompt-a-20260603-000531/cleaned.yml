workflow_id: sales_pipeline
name: "Sales Pipeline"
description: "Automated data pipeline for processing sales transaction data"
version: "2.0.0"
author: "Data Processing Team"
tags:
  - data-pipeline
  - sales-analysis
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999

models:
  "target-model":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:
  steps:
    step_1_read_data:
      generative_entity: "${models.target-model}"
      prompt: |
        Read and display the complete contents of the sales transaction data file located at /tmp/pipeline-input.csv.
        Output every line with line numbers prefixed.
        Preserve all whitespace, comments, and formatting exactly.
        If the file is very long, output the first 500 lines.
      model_overrides:
        temperature: 0.2
        max_tokens: 50000
      when:
        before_step_starts:
          shell:
            command: "cat"
            args: ["/tmp/pipeline-input.csv"]
            fail_on_error: false
        after_step_succeeds:
          - save_to: "./outputs/step1-data.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_2_ingest_and_validate:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_read_data]
      prompt: |
        Ingest the sales transaction data from /tmp/pipeline-input.csv and validate it.
        Validate that each row has unique transaction_id, customer_email matches standard email format,
        quantity is a positive integer, unit_price is a positive number, sale_date follows YYYY-MM-DD format,
        and payment_method is valid.

        DATA TO VALIDATE:
        {{step.step_1_read_data.output}}

        Output a numbered list of validation errors with file location, severity (critical/warning/info),
        and a brief explanation of each error.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step2-validation.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_3_enrich_and_compute:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_ingest_and_validate]
      prompt: |
        Enrich the validated sales transaction data by computing total_amount as quantity multiplied by unit_price.
        Classify transactions into size buckets: micro under 25, small 25-100, medium 100-500, large 500-1000, enterprise over 1000.
        Determine the most common payment_method per sales_region.

        ENRICHED DATA:
        {{step.step_2_ingest_and_validate.output}}

        OUTPUT ENRICHED DATA WITH CLASSIFICATIONS AND PAYMENT_METHODS:
      model_overrides:
        temperature: 0.4
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step3-enriched-data.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_4_anomaly_detection:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_ingest_and_validate, step_3_enrich_and_compute]
      prompt: |
        Detect anomalies in the sales transaction data.
        Identify transactions where total_amount is more than 3 standard deviations above the mean.
        Identify customers with more than 10 transactions in a single day.
        Flag any sales_region with an average total_amount that differs by more than 50 percent from the overall average.

        ANALYZED DATA:
        {{step.step_2_ingest_and_validate.output}}
        {{step.step_3_enriched_data.output}}

        OUTPUT ANOMALIES WITH REASONS:
      model_overrides:
        temperature: 0.5
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step4-anomalies.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_5_report_generation:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_ingest_and_validate, step_3_enrich_and_compute, step_4_anomaly_detection]
      prompt: |
        Generate a structured report summarizing the sales pipeline results.
        Include total valid and invalid row counts from Phase 1,
        transaction size distribution from Phase 2,
        complete list of anomalous transactions with reasons from Phase 3,
        and a final data quality score calculated as valid_rows divided by total_rows multiplied by 100.

        REPORT DETAILS:
        {{step.step_2_ingest_and_validate.output}}
        {{step.step_3_enriched_data.output}}
        {{step.step_4_anomalies.output}}

        OUTPUT FINAL REPORT IN TEXT FORMAT TO outputs/output/pipeline-report.txt:
      model_overrides:
        temperature: 0.6
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/output/pipeline-report.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_6_clean_up:
      generative_entity: "${models.target-model}"
      depends_on: [step_5_report_generation]
      prompt: |
        Clean up any temporary files or resources used during the pipeline execution.
        Ensure all intermediate outputs are deleted to free up disk space.

        CLEANUP TASKS:
      model_overrides:
        temperature: 0.7
        max_tokens: 50000
      when:
        after_step_succeeds:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]