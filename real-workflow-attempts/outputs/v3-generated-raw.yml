```yaml
workflow_id: rust_code_analysis_workflow
name: "Rust Code Analysis Workflow"
description: "Analyze Rust code for architecture, design patterns, smells, anti-patterns, and generate refactoring suggestions."
tags: ["rust", "code analysis", "refactoring"]
schema_version: "2.0.0"

providers:
  llama_cpp_with_vulkan:
    config:
      host: localhost
      port: 8080
    hosting:
      gpu_layers: 999

models:
  "target-model":
    name: "Qwen2.5-Coder-3B-Instruct-Q8_0"
    host:
      type: llama_cpp_with_vulkan

workflow_execution_strategy:
  memory:
    model_lifecycle:
      unload_unused: true

agentic_workflow:

  steps:

    step_1_extract_code:
      generative_entity: "${models.target-model}"
      prompt: |
        Extract the Rust source file from the input directory.
        Output the complete file contents with line numbers.
      model_overrides:
        temperature: 0.5
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step1-code.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_2_analyze_architecture:
      generative_entity: "${models.target-model}"
      depends_on: [step_1_extract_code]
      prompt: |
        Analyze the architecture and design patterns in the extracted Rust code.
        Provide a detailed report on the identified architecture components and their relationships.
      model_overrides:
        temperature: 0.6
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step2-architecture.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_3_identify_smells:
      generative_entity: "${models.target-model}"
      depends_on: [step_2_analyze_architecture]
      prompt: |
        Identify potential code smells and anti-patterns in the Rust code.
        Provide a detailed report on the identified issues, including their severity and impact.
      model_overrides:
        temperature: 0.4
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step3-smells.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_4_generate_refactoring_suggestions:
      generative_entity: "${models.target-model}"
      depends_on: [step_3_identify_smells]
      prompt: |
        Generate refactoring suggestions for identified issues in the Rust code.
        Provide a detailed report on each suggested change, including its rationale and potential impact.
      model_overrides:
        temperature: 0.7
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step4-suggestions.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_5_validate_refactoring_suggestions:
      generative_entity: "${models.target-model}"
      depends_on: [step_4_generate_refactoring_suggestions]
      prompt: |
        Validate the generated refactoring suggestions to ensure they compile without errors.
        Provide a detailed report on any compilation issues and their resolution steps.
      model_overrides:
        temperature: 0.3
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step5-validation.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]

    step_6_assemble_report:
      generative_entity: "${models.target-model}"
      depends_on: [step_5_validate_refactoring_suggestions]
      prompt: |
        Assemble a detailed refactoring roadmap document with priority rankings based on the validated suggestions.
        Provide a comprehensive overview of the changes, their impact, and recommended execution order.
      model_overrides:
        temperature: 0.5
        max_tokens: 50000
      when:
        after_step_succeeds:
          - save_to: "./outputs/step6-report.txt"
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, duration_ms]
        after_step_fails:
          - log:
              to_file_path: "./logs/workflow.log"
              event_fields: [step_name, error_message]
```