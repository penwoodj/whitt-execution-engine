model:
  path: /models/Qwen3-5-9B-Q4_K_M.gguf
  models_dir: /models
  huggingface:
    repo: lmstudio-community/Qwen3.5-9B-GGUF
    filename: Qwen3.5-9B-Q4_K_M.gguf
    branch: main
  quantization: Q4_K_M
  parameter_count: 9000000000
context:
  size: 100000
  batch_size: 2048
  ubatch_size: 512
hardware:
  threads: 6
  gpu_layers: 32
  use_mmap: true
  flash_attn: true
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 40
  repeat_penalty: 1.1
  repeat_last_n: 64
  max_tokens: 16384
server:
  host: 127.0.0.1
  port: 8080
  parallel: false
  timeout: 3600
  max_slots: 1
  metrics: true
  slots_endpoint: true
  cont_batching: false
  cache_prompt: false
cache:
  cache_type_k: q8_0
  cache_type_v: q8_0
features:
  log_level: info
  verbose: false
  print_system_info: true
  profiling: false
  color: true
vulkan:
  visible_devices: "0"
  disable_debug: true
  enable_validation: false
