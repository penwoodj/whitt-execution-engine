model:
  path: /models/Llama-3.2-1B-Instruct.Q4_K_M.gguf
  huggingface:
    repo: meta-llama/Llama-3.2-1B-Instruct
    filename: Llama-3.2-1B-Instruct.Q4_K_M.gguf
    branch: main
  quantization: Q4_K_M
  parameter_count: 1000000000
context:
  size: 4096
  batch_size: 2048
  ubatch_size: 512
hardware:
  threads: 4
  gpu_layers: 999
  use_mmap: true
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k: 40
  repeat_penalty: 1.1
  repeat_last_n: 64
  max_tokens: 512
server:
  host: 127.0.0.1
  port: 8080
  parallel: true
  timeout: 600
  max_slots: 8
  metrics: true
  slots_endpoint: true
cache:
  cache_type_k: f16
  cache_type_v: f16
features:
  log_level: info
  verbose: false
  print_system_info: true
  profiling: false
  color: true
vulkan:
  visible_devices: "0"
  disable_debug: true
  enable_validation: false
