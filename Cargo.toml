[package]
name = "whitt-execution-engine"
version = "0.1.0"
edition = "2021"
authors = ["Jon Penwood"]
description = "Declarative workflow engine for defining, executing, and optimizing AI-powered workflows with local LLMs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/penwoodj/whitt-execution-engine"
readme = "README.md"
keywords = ["yaml", "workflow", "agent", "llm", "benchmark"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

# ============================================================================
# DEPENDENCIES
# ============================================================================

[dependencies]

# Core serialization framework
# - Used for parsing and serializing YAML workflows and Rust data structures
# - "derive" feature enables #[derive(Serialize, Deserialize)] macros
serde = { version = "1.0", features = ["derive"] }

# Fast YAML parser with schema validation support
# - 1.5x faster than serde_yaml with better error messages
# - garde integration for runtime validation
# - Features: "garde" for validation derive macros
serde-saphyr = { version = "0.0.24" }

# Validation framework with derive macros
# - Type-safe validation rules defined in structs
# - "derive" feature enables #[derive(Validate)] macro
garde = { version = "0.20", features = ["derive"] }

# Type-safe template engine for code generation
# - Pre-compiled templates for 5-10x faster rendering
# - default-features=false to minimize dependency footprint
# - Used to generate Rust code from WorkflowIR
askama = { version = "0.12", default-features = false }

# Async runtime for Rust
# - Industry-standard async runtime with extensive ecosystem
# - "full" feature: all tokio modules (io, net, time, process, sync)
# - "fs" feature: file system operations
tokio = { version = "1.40", features = ["full", "fs"] }

# Error handling for libraries
# - Type-safe error derive macros
# - From trait for easy error conversion
# - Best practice for library error types
thiserror = "2.0"

# Error handling for applications
# - Easy error context with Context trait
# - Dynamic error types for application-level errors
# - Any type can be converted to anyhow::Error
anyhow = "1.0"

# Local LLM inference via llama.cpp bindings
# - Direct GGUF model loading for maximum performance
# - "vulkan" feature: GPU acceleration (cross-platform)
# - Alternative backends: cuda, metal, cpu
llama-cpp-2 = { version = "0.1.138", features = ["vulkan"] }

# Command-line argument parsing
# - "derive" feature enables #[derive(Parser)] macro
# - Automatic help generation and subcommands
clap = { version = "4.5", features = ["derive"] }

# Directory traversal utilities
# - Recursive directory walking for file operations
# - Cross-platform path handling
walkdir = "2.5"

# Structured logging framework
# - Zero-cost logging with dynamic filtering
# - Integration with tokio for async contexts
tracing = "0.1"

# Logging subscriber with environment filtering
# - "env-filter" feature: RUST_LOG environment variable support
# - Multiple output formats (JSON, pretty, compact)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (behind "client" feature for PoC binary)
# - reqwest 0.13 defaults to rustls TLS backend
# - "stream" feature for SSE streaming support
reqwest = { version = "0.13", features = ["rustls", "stream", "json"], optional = true }

# JSON serialization (for API request/response and workflow persistence)
serde_json = "1.0"

# Async stream construction (for SSE parsing)
async-stream = { version = "0.3", optional = true }

# Async stream combinators
futures = { version = "0.3", optional = true }

# Byte buffer types (reqwest dependency)
bytes = { version = "1", optional = true }

# SQLite database for workflow persistence (optional, behind "sqlite" feature)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

# Readline library for REPL
rustyline = "15"

# Regex for parsing
regex = "1"

# Home directory resolution
dirs = "6"

# ── Extended POC dependencies ──────────────────────────────────────

# Async trait support (object-safe async traits)
async-trait = "0.1"

# Fast random number generator (for retry jitter)
fastrand = "2"

# Jinja2-like template engine (for ${...} / {{...}} interpolation)
minijinja = "2"

# SSE (Server-Sent Events) stream parser
sseer = "0.2"

# Clipboard support (optional)
arboard = { version = "3", optional = true }

# ============================================================================
# FEATURES
# ============================================================================

[features]
default = []
client = ["dep:reqwest", "dep:async-stream", "dep:futures", "dep:bytes"]
sqlite = ["dep:rusqlite"]
clipboard = ["dep:arboard"]

[[bin]]
name = "poc_client"
path = "src/bin/poc_client.rs"
required-features = ["client"]

[[bin]]
name = "model_chain"
path = "src/bin/model_chain.rs"
required-features = ["client"]

[[bin]]
name = "whitt"
path = "src/bin/whitt.rs"
required-features = ["client"]

# ============================================================================
# DEV DEPENDENCIES
# ============================================================================

[dev-dependencies]

whitt-execution-engine = { path = ".", features = ["client"] }

# Temporary directory management for testing
# - Automatically cleaned up on drop
# - Useful for file operation tests
tempfile = "3.13"

# HTTP client for integration tests
reqwest = { version = "0.13", features = ["rustls", "stream"] }

# JSON for integration tests
serde_json = "1.0"

# YAML parsing for integration tests
serde_yaml = "0.9"

# Async stream combinators for SSE tests
futures = "0.3"

# Byte buffer types
bytes = "1"

# Property-based testing framework
# - Generates random test cases to find edge cases
# - Required by Validation Framework Layer 3 (1000 iterations per property)
proptest = "1"

# Statistical benchmarking framework
# - Required by Validation Framework Layer 7 (performance baselines)
criterion = { version = "0.5", features = ["html_reports"] }

# Test serialization (for integration tests)
# - Serializes async tests to prevent concurrent test interference
serial_test = "3"

tokio = { version = "1.40", features = ["full", "fs", "test-util", "macros"] }

[[bench]]
name = "execution_benchmarks"
harness = false

# ============================================================================
# BUILD PROFILES
# ============================================================================

[profile.release]

# Maximum optimization level
# - Trade compile time for runtime performance
# - Levels: 0-3, where 3 is maximum
opt-level = 3

# Link-time optimization
# - Optimizes across crate boundaries
# - Slower linking, but faster executables
lto = true

# Single codegen unit
# - Better optimization across all code
# - Slower compilation, but better binary performance
codegen-units = 1

# Strip symbols from binary
# - Removes debug symbols to reduce binary size
# - ~20-30% size reduction
strip = true

[profile.dev]

# No optimization for faster development builds
# - Faster compilation times
# - Slower runtime (acceptable for development)
opt-level = 0
