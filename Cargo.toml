[package]
name = "yaml-to-rust-agentsdk"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Fast YAML to Rust Agent SDK transpiler with local LLM support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/penwoodj/yaml-to-rust-agentsdk"
readme = "README.md"
keywords = ["yaml", "transpiler", "agent", "llm", "rust"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "0.0.21", features = ["garde"] }
garde = { version = "0.20", features = ["derive"] }
askama = { version = "0.12", default-features = false }
autoagents = { version = "0.3.5", features = ["llamacpp"] }
tokio = { version = "1.40", features = ["full", "fs"] }
thiserror = "2.0"
anyhow = "1.0"
llama-cpp-2 = { version = "0.1.138", features = ["vulkan"] }
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
